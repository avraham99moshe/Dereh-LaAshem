</style></head><body><header class="top"><div class="top-row first-row"><span class="bookbrand">Недельные главы</span><span class="separator"></span><span class="current-title" id="current-title"></span></div><div class="top-row second-row"><div class="menu-buttons"><button id="menu" title="Выбрать главу">☰</button><div class="subwrap"><button id="subtoggle" title="Выбрать подраздел">§ ▾</button><div id="subpanel" class="subpanel" hidden></div></div></div><div class="tools"><input id="search" class="search" placeholder="Поиск"><button id="searchnext" title="Следующее совпадение">🔍</button><span id="count" class="search-count"></span><button id="smaller">А−</button><button id="larger">А+</button><button id="night">☾</button></div></div></header><div class="layout"><aside id="sidebar"><h2>Содержание</h2><nav id="nav"></nav></aside><main class="paper"><h1 id="chapter-title" class="chapter-title"></h1><div id="content" class="content"></div><div class="bottom"><button id="prev">← Предыдущая глава</button><button id="next">Следующая глава →</button></div></main></div><script>
const chapters=[{"title":"Лех-Леха","body":"<h2>Глава 1</h2>\n<p>Недельная глава «Лех-Леха»</p>\n<p><strong><strong>בס״ד — С Божьей помощью</strong></strong></p>\n<p>Еженедельная беседа нашего наставника, главы ешивы שליט״א</p>\n<p>На тему «Десяти испытаний»</p>\n<p>С разрешения уважаемых раввинов и всех дорогих учеников ешивы.</p>\n<p>На этой неделе наша беседа будет посвящена испытаниям, через которые прошёл Авраам-авину, их цели и тому, чему мы можем научиться из них для всех поколений.</p>\n<p>Если внимательно рассмотреть главы Торы, которые мы читаем в эти недели, мы увидим, что испытания Авраама-авину простираются через несколько недельных глав: начиная с конца главы «Ноах», далее «Лех-Леха», «Ваера» и заканчивая первой частью главы «Хаей Сара».</p>\n<h2>А. Испытания</h2>\n<p>Начнём с описания и перечисления десяти испытаний, через которые прошёл Авраам-авину и во всех которых он устоял, согласно изложенному в «Пиркей де-Рабби Элиэзер» (главы 26–31).</p>\n<p>На самом деле мы приведём больше десяти испытаний, поскольку комментаторы расходятся во мнениях относительно того, какие именно события входят в число десяти испытаний.</p>\n<p><strong><strong>Первое испытание.</strong></strong><strong> Когда родился Авраам-авину, все вельможи царства хотели убить его [по другой версии, это был Нимрод, а не все вельможи]. Его спрятали под землёй на тринадцать лет, и всё это время он не видел ни солнца, ни луны, ни звёзд. Через тринадцать лет он вышел оттуда, говоря на святом языке, отверг идолопоклонство и сказал: «Господь Воинств! Счастлив человек, уповающий на Тебя».</strong></p>\n<p><strong><strong>Второе испытание.</strong></strong><strong> Его схватили и заключили в тюрьму на десять лет: три года в Куте и семь лет в Карду. Есть мнение, что было наоборот — три года в Карду и семь в Куте. Этот спор приводится также в трактате Бава Батра (91а).</strong></p>\n<p>После этих десяти лет Нимрод бросил его в огненную печь.</p>\n<p>В «Тана де-вей Элиягу Зута» (гл. 25) рассказывается, что после того, как Авраам разбил идолов и был схвачен, между ним и Нимродом состоялся чрезвычайно интересный разговор.</p>\n<p>Нимрод сказал ему:</p>\n<p>— Ты Авраам, сын Тераха?</p>\n<p>Он ответил:</p>\n<p>— Да.</p>\n<p>Нимрод сказал:</p>\n<p>— Разве ты не знаешь, что я господин всех творений? Солнце, луна, звёзды, созвездия и люди — все выходят по моей воле, а ты уничтожил то, чему я поклоняюсь!</p>\n<p>В тот момент Святой, благословен Он, даровал Аврааму мудрость.</p>\n<p>Авраам сказал:</p>\n<p>— Господин мой, царь! До сих пор я не знал твоего желания. Теперь же скажу нечто во славу и величие твоё.</p>\n<p>Нимрод сказал:</p>\n<p>— Говори.</p>\n<p>Авраам ответил:</p>\n<p>— Таков порядок мира от дня его сотворения и доныне: солнце восходит на востоке и заходит на западе. Прикажи завтра, чтобы оно взошло на западе и зашло на востоке, и тогда я засвидетельствую, что ты действительно господин всех творений. А если ты господин, которому открыто всё сокрытое, скажи мне, что находится в моём сердце и что я собираюсь сделать.</p>\n<p>Тогда этот злодей положил руку на свою бороду и чрезвычайно удивился.</p>\n<p>Авраам сказал ему:</p>\n<p>— Не удивляйся. Ты не господин. Ты сын Куша. Если ты господин, почему не спас своего отца от смерти? Как не смог ты спасти своего отца, так не сможешь спасти и самого себя.</p>\n<p>Тогда Нимрод вызвал Тераха, отца Авраама, и спросил его:</p>\n<p>— Каков приговор тому, кто сжёг моих богов?</p>\n<p>Терах ответил:</p>\n<p>— Его приговор — сожжение.</p>\n<p>Авраама немедленно заключили в темницу. Десять лет строили печь и приносили для неё дрова. Затем вывели Авраама, чтобы бросить его в огонь.</p>\n<p>И тогда Святой, благословен Он, Сам сошёл, чтобы спасти его, как сказано: «Который вывел тебя из Ур-Касдим». Святой, благословен Он, Сам взял его за правую руку и вывел из Ур-Касдим.</p>\n<p><strong><strong>Третье испытание.</strong></strong><strong> «Уйди из земли твоей, с родины твоей и из дома отца твоего».</strong></p>\n<p>Авраам жил в Харане, и Всевышний сказал ему: оставь свою страну, свой город, всё привычное окружение и дом своего отца.</p>\n<p>При этом Он даже не сказал ему, куда идти, а лишь: «В землю, которую Я укажу тебе».</p>\n<p>В «Пиркей де-Рабби Элиэзер» говорится, что само скитание — необходимость оставить всё, к чему человек привык: дом, семью, друзей и окружение, — является одним из самых тяжёлых испытаний. Настолько, что в Таргуме это испытание сопоставляется с испытанием Акеды — связывания Ицхака.</p>\n<p><strong><strong>Четвёртое испытание.</strong></strong><strong> После того как Авраам покинул Харан и оставил всё своё, Святой, благословен Он, привёл его в Землю Израиля.</strong></p>\n<p>Казалось бы, после столь тяжёлого испытания и всех скитаний наконец должно было наступить благополучие, как ему и было обещано.</p>\n<p>Но тут пришло новое тяжелейшее испытание:</p>\n<p>«И был голод в земле».</p>\n<p>В «Пиркей де-Рабби Элиэзер» говорится, что со дня сотворения неба и земли до того времени в мире ещё не было голода — и внезапно наступил голод.</p>\n<p>Более того: в остальных странах голода не было. Он был именно в Земле Израиля.</p>\n<p>И Авраам снова был вынужден покинуть своё место и отправиться в Египет.</p>\n<p><strong><strong>Пятое испытание.</strong></strong><strong> Авраам спускается в Египет. Денег у него нет, золота нет — с ним лишь его жена. И слуги фараона забирают у него жену.</strong></p>\n<p>Мидраш говорит, что когда у человека отнимают жену, от великого горя он обычно разрывает свои одежды.</p>\n<p><strong><strong>Шестое испытание.</strong></strong><strong> Война царей.</strong></p>\n<p>Цари хотели убить Авраама и задумали устроить ему ловушку: сначала взять в плен его племянника Лота. Тогда Авраам выйдет воевать ради его спасения, а они схватят и убьют его.</p>\n<p>Так и произошло: они сражались с пятью царями, захватили Лота и всё его имущество вместе с богатствами Сдома, и Авраам-авину был вынужден выйти на войну против четырёх столь могущественных царей.</p>\n<p><strong><strong>Седьмое испытание.</strong></strong><strong> После войны царей Аврааму предстояло испытание «Брит бейн а-бетарим» — Завета между рассечёнными частями.</strong></p>\n<p>Почему это считается испытанием?</p>\n<p>Потому что тогда Святой, благословен Он, открыл ему:</p>\n<p>«Знай же, что пришельцами будут потомки твои в земле, которая не принадлежит им, и будут порабощать и угнетать их четыреста лет».</p>\n<p>Всевышний также поведал ему обо всех изгнаниях.</p>\n<p>По сути, Он сказал Аврааму: верно, Я обещал тебе, что сделаю тебя великим народом и весь народ Израиля произойдёт от тебя, но осуществится это лишь спустя много лет, а до тех пор твоим потомкам предстоит пройти через множество бед.</p>\n<p>И несмотря на это, Авраам принял сказанное с радостью и не жаловался.</p>\n<p><strong><strong>Восьмое испытание.</strong></strong><strong> Здесь мы объясним согласно мнению Рамбама (Авот).</strong></p>\n<p>Авраам полагал, что удостоится детей от Сары. Прошло много лет, и он отчаялся; Авраам и Сара поняли, что детей от неё, по всей видимости, не будет.</p>\n<p>Он был вынужден взять Агарь в жёны. Для него это было понижением, несмотря на то что Агарь была важной женщиной, царской дочерью — дочерью фараона.</p>\n<p>Тем не менее желанием Авраама было иметь детей именно от Сары, своей жены. Он был вынужден взять Агарь, и от неё родился Ишмаэль.</p>\n<p><strong><strong>Девятое испытание.</strong></strong><strong> Обрезание.</strong></p>\n<p>В возрасте девяноста девяти лет Святой, благословен Он, повелел Аврааму совершить обрезание.</p>\n<p>Это было тяжело для пожилого и слабого человека и даже представляло опасность. Всевышний велел ему обрезать как самого себя, так и своего сына Ишмаэля.</p>\n<p><strong><strong>Десятое испытание.</strong></strong><strong> История Авимелеха и Сары, когда Авимелех забрал Сару, подобно тому как ранее произошло с фараоном.</strong></p>\n<p><strong><strong>Одиннадцатое испытание.</strong></strong><strong> Изгнание Агари. Рамбам объясняет, что после того как Авраам уже женился на ней и она забеременела от него, необходимость отослать её стала для него великим испытанием.</strong></p>\n<p><strong><strong>Двенадцатое испытание.</strong></strong><strong> Изгнание Ишмаэля.</strong></p>\n<p>После того как возник конфликт между ним и Ицхаком, ради правильного развития Ицхака Авраам был вынужден отправить Агарь вместе с Ишмаэлем.</p>\n<p>Сама Тора свидетельствует, насколько тяжёлым было это испытание:</p>\n<p>«И было это весьма дурно в глазах Авраама из-за сына его».</p>\n<p>Всевышнему пришлось сказать ему:</p>\n<p>«Да не будет это дурно в глазах твоих».</p>\n<p><strong><strong>Тринадцатое испытание.</strong></strong><strong> Акедат Ицхак — связывание Ицхака, о котором, с Божьей помощью, мы поговорим на следующей неделе.</strong></p>\n<p>По большинству мнений, именно оно является последним испытанием. Тогда Всевышний сказал Аврааму:</p>\n<p>«Теперь Я знаю, что богобоязнен ты».</p>\n<p><strong><strong>Четырнадцатое испытание.</strong></strong><strong> В начале главы «Хаей Сара», после смерти Сары-имейну, Авраам столкнулся с испытанием, связанным с её погребением.</strong></p>\n<p>Ведь Всевышний обещал отдать ему всю эту землю, однако когда ему понадобилось место, чтобы похоронить жену, он был вынужден приобрести пещеру Махпела за четыреста шекелей серебра полноценной торговой монетой.</p>\n<h2>Б. Вопросы</h2>\n<p><strong><strong>Первый вопрос.</strong></strong><strong> Сам смысл испытаний, на первый взгляд, непонятен. Для чего Всевышний подвергал Авраама столь тяжёлым испытаниям?</strong></p>\n<p>Какова была их цель?</p>\n<p>Ведь Авраам желал служить Всевышнему всеми силами и всю свою жизнь занимался распространением знания о Нём в мире.</p>\n<p>Зачем же Всевышний подвергал его таким тяжёлым испытаниям — от рождения и вплоть до Акеды и смерти Сары, когда Аврааму было сто тридцать семь лет?</p>\n<p><strong><strong>Второй вопрос.</strong></strong><strong> Авраам называется именно </strong><strong><strong>Авраам-авину — «Авраам, отец наш»</strong></strong><strong>.</strong></p>\n<p>То есть он является отцом еврейского народа.</p>\n<p>Но в каком смысле он является нашим отцом?</p>\n<p>Задача отца — дать жизнь детям и воспитать их. Где мы видим, что Авраам-авину проложил путь для всего народа Израиля и воспитал его?</p>\n<p><strong><strong>Третий вопрос.</strong></strong><strong> В начале главы Всевышний говорит Аврааму:</strong></p>\n<p>«И сделаю тебя великим народом, и благословлю тебя, и возвеличу имя твоё, и будешь благословением».</p>\n<p>Раши объясняет: хотя в молитве мы произносим «Бог Авраама, Бог Ицхака и Бог Яакова», завершаем благословение только Авраамом — «Маген Авраам».</p>\n<p>«И будешь благословением» означает: «тобой будут завершать, а не ими».</p>\n<p>Необходимо понять, почему благословение завершается именно Авраамом.</p>\n<p><strong>Кроме того, почему мы говорим именно </strong><strong><strong>«Маген Авраам» — «Щит Авраама»</strong></strong><strong>?</strong></p>\n<p>Почему не «Милость Авраама» или «Бог Авраама»? Что означает выражение «Щит Авраама»?</p>\n<h2>В. Цель испытаний и награда за них</h2>\n<p>Чтобы понять смысл испытаний, необходимо предварительно привести слова Рабейну Йоны к мишне в трактате Авот:</p>\n<p>«Десятью испытаниями был испытан Авраам-авину, мир ему, и устоял во всех — чтобы показать, насколько велика любовь к Аврааму-авину, мир ему».</p>\n<p>Рабейну Йона объясняет:</p>\n<p>«Чтобы показать, насколько велика любовь к Аврааму-авину: Он испытывал его, чтобы открыть людям, что тот богобоязнен и совершенен во всех качествах».</p>\n<p>То есть Святой, благословен Он, заранее знал, что Авраам устоит во всех испытаниях.</p>\n<p>Он испытывал его не для того, чтобы узнать, выдержит Авраам или нет.</p>\n<p>Целью испытаний было показать любовь к Аврааму-авину — раскрыть и провозгласить всему миру, что Авраам совершенен в своей богобоязненности и во всех своих качествах.</p>\n<p>Если мы внимательно посмотрим на следующие мишнайот, то увидим ещё целый ряд вещей, число которых равно десяти: десять чудес были совершены для наших предков в Египте, десять — у моря, десять казней Святой, благословен Он, навёл на египтян в Египте, десять — у моря, и десять раз наши предки испытывали Всевышнего в пустыне.</p>\n<p>Раши объясняет, что эти мишнайот являются продолжением темы десяти испытаний Авраама.</p>\n<p>Поскольку Авраам-авину устоял в десяти испытаниях, Святой, благословен Он, совершил десять чудес для народа Израиля в Египте и навёл на египтян десять казней.</p>\n<p>Рамбам объясняет, что при каждой казни, поражавшей египтян, по естественному порядку и евреи должны были пострадать, однако Святой, благословен Он, спасал народ Израиля от ущерба.</p>\n<p>Так же и десять чудес у моря были совершены в заслугу десяти испытаний Авраама-авину.</p>\n<p>«Пиркей де-Рабби Элиэзер» подробно описывает удивительные чудеса, произошедшие там: народ Израиля просил Моше, чтобы стены моря имели определённую форму, чтобы земля была совершенно сухой, а не грязной, чтобы из стен выходила пресная вода, чтобы было чем поить маленьких детей, чтобы для каждого из двенадцати колен был отдельный проход и чтобы стены между проходами были прозрачными, позволяя коленам видеть друг друга, и так далее.</p>\n<p>Раши также объясняет, что египтяне получили десять наказаний на море — соответственно десяти выражениям их падения в Песни у моря.</p>\n<p>Кроме того, после греха золотого тельца, когда Моше-рабейну разбил Скрижали, народ Израиля должен был лишиться Десяти заповедей.</p>\n<p>То, что Десять заповедей и вся Тора были возвращены народу Израиля, произошло в заслугу десяти испытаний Авраама.</p>\n<p>Раши пишет:</p>\n<p>«После того как они сделали тельца, были разбиты Скрижали, на которых были написаны Десять заповедей. Десять испытаний Авраама встали им в заслугу, чтобы Святой, благословен Он, не уничтожил их. И так сказано: “Помяни Авраама”».</p>\n<p>Подобное сказано и в Теилим (106):</p>\n<p>«И сказал Он уничтожить их, если бы не Моше, избранник Его, ставший в проломе пред Ним».</p>\n<p>Мудрецы говорят, что Моше-рабейну спорил перед Святым, благословен Он, и просил спасти народ в заслугу Авраама-авину.</p>\n<p>Мы также знаем, что каждый год удостаиваемся благоприятного суда благодаря заслуге Акедат Ицхак.</p>\n<p>Таким образом, деяния праотцов создали для народа Израиля огромные заслуги, благодаря которым он продолжает существовать во все эпохи и при любых обстоятельствах.</p>\n<h2>Г. Главная задача Авраама-авину — распространять знание о Всевышнем в мире</h2>\n<p>Целью Авраама-авину было распространить Имя Всевышнего по всему миру.</p>\n<p>В этих главах Торы мы находим множество высказываний мудрецов и комментариев о различных поступках Авраама, совершённых исключительно ради того, чтобы распространять знание о Святом, благословен Он.</p>\n<p><strong>Даже само название солнца — </strong><strong><strong>шемеш</strong></strong><strong> — согласно словам мудрецов, было дано ему Авраамом.</strong></p>\n<p>Почему он назвал его так?</p>\n<p>Народы мира поклонялись великому огню Ур-Касдим. Они поклонялись также солнцу, утверждая, что и оно является могущественным огнём огромной силы и называется «великим светилом».</p>\n<p><strong>Авраам же сказал им: это не самостоятельное великое светило, а лишь </strong><strong><strong>шемеш</strong></strong><strong> — служитель, от слова «служить», поскольку солнце является всего лишь одним из служителей Всевышнего.</strong></p>\n<h2>Д. Авраам «Авину» — передача духовных сил потомкам</h2>\n<p>От имени рабби Хаима из Воложина приводится важный вопрос.</p>\n<p>В мишне Авот сказано:</p>\n<p>«Десять поколений от Ноаха до Авраама».</p>\n<p>Затем сказано:</p>\n<p>«Десятью испытаниями был испытан Авраам-авину».</p>\n<p><strong>Почему в первом случае написано просто «Авраам», а говоря об испытаниях, мишна называет его </strong><strong><strong>Авраам-авину — Авраам, отец наш</strong></strong><strong>?</strong></p>\n<p>Рабби Хаим объясняет, что здесь заключён великий принцип.</p>\n<p>Отцом называется тот, у кого есть потомство.</p>\n<p>Все испытания, через которые прошёл Авраам-авину, дали свои плоды в народе Израиля.</p>\n<p>Именно благодаря тому, что Авраам устоял в своих испытаниях, народ Израиля во всех поколениях получил способность выдерживать тяжелейшие испытания: освящение Имени Всевышнего, гонения, изгнания, убийства и резню — вплоть до буквального самопожертвования ради святости Его Имени.</p>\n<p><strong>Когда Авраам </strong><strong><strong>Авину</strong></strong><strong> устоял в испытаниях, он заложил в своих потомках способность выдерживать подобные испытания.</strong></p>\n<p><strong>И поэтому именно в связи с испытаниями он назван </strong><strong><strong>Авраам-авину</strong></strong><strong>.</strong></p>\n<p>В этом особенно проявляется то, что Авраам является отцом народа: он заложил в нём эти великие силы.</p>\n<p>Можно наблюдать интересное явление. Иногда человек усердно работает над определённым качеством — например, над смирением или над тем, чтобы не гневаться, — и можно заметить, что его дети отличаются смирением или спокойствием.</p>\n<p>Рабби Хаим из Воложина подробно объясняет в «Руах Хаим», что когда человек трудится над определённым качеством, его дети получают это качество словно в подарок.</p>\n<p>Если человек щедр, его детям легче обрести щедрость. Если он обладает деликатностью, она проявляется и у детей.</p>\n<p>И наоборот, если, не дай Бог, у человека имеется дурное качество, например гневливость, оно может проявиться и у его детей.</p>\n<p>Разумеется, это не означает отсутствия свободы выбора. Смысл в том, что получив хорошие качества, человеку значительно легче работать над собой, и наоборот.</p>\n<p>Авраам-авину, устоявший во всех испытаниях, передал своим потомкам — всему народу Израиля — огромные силы для преодоления любых испытаний.</p>\n<p>Он заложил в нас прочные корни, позволяющие выстоять при любых обстоятельствах.</p>\n<p>Приведём несколько примеров.</p>\n<p><strong><strong>Первый пример.</strong></strong><strong> Одним из испытаний Авраама было:</strong></p>\n<p>«Лех-леха — уйди из земли твоей».</p>\n<p>То есть оставь всё, оторвись от своего прошлого и следуй за повелением Всевышнего.</p>\n<p>Когда мы видим, что евреи во всех поколениях отправлялись в изгнание ради изучения Торы, на годы оставляя дом, семью, окружение и друзей, — это происходит благодаря корню, который заложил Авраам-авину.</p>\n<p>Даже сегодня юноши, живущие в Соединённых Штатах, ещё в подростковом возрасте оставляют дом и семью и отправляются на длительный срок учиться в Бриске или в ешиве Мир.</p>\n<p>Откуда берутся такие силы?</p>\n<p>От Авраама-авину, от его испытания:</p>\n<p>«Лех-леха ме-арцеха — уйди из земли твоей».</p>\n<p><strong><strong>Второй пример.</strong></strong><strong> В народе Израиля существует явление необычайной семейной взаимопомощи.</strong></p>\n<p>Например, если у одного из членов семьи обнаруживается тяжёлая болезнь и необходимо отправить его на лечение за границу, что связано с огромными расходами, близкие и даже более дальние родственники самоотверженно посвящают этому свои силы и средства.</p>\n<p>Откуда происходит эта черта? Откуда такая преданность?</p>\n<p>Она была приобретена благодаря испытанию Авраама-авину, когда он отправился спасать своего племянника Лота и рисковал собственной жизнью, вступая в войну с царями ради его спасения.</p>\n<h2>Е. Устояние в испытании — свет после тьмы</h2>\n<p>Рассмотрим ещё одну точку — испытание:</p>\n<p>«И был голод в земле».</p>\n<p>Попытаемся осознать его величину.</p>\n<p>Авраам покинул Харан и пришёл в землю Кнаан. Когда он уходил, Всевышний обещал ему множество благословений:</p>\n<p>«И благословлю тебя»,</p>\n<p>«И возвеличу имя твоё»,</p>\n<p>«И будешь благословением».</p>\n<p>Казалось бы, после прибытия в Кнаан уже пришло время для исполнения этих обещаний.</p>\n<p>Но именно там начинается голод.</p>\n<p>Авраам вынужден спуститься в Египет, не имея ничего.</p>\n<p>Мудрецы рассказывают, что ему даже пришлось брать в долг, чтобы оплачивать постоялые дворы по дороге.</p>\n<p>А когда он приходит в Египет, у него забирают ещё и жену.</p>\n<p>Однако если мы посмотрим, чем закончилась эта история, увидим, что именно это испытание принесло Аврааму великое благословение.</p>\n<p>Фараон был вынужден дать ему серебро и золото.</p>\n<p>Он дал ему в служанки свою дочь Агарь — женщину высокого происхождения, которую Авраам впоследствии взял в жёны.</p>\n<p>Главное же состоит в следующем.</p>\n<p>Как уже объяснялось, целью Авраама-авину было распространять в мире знание о Творце.</p>\n<p>Для этого требовались большие материальные средства.</p>\n<p>Благодаря серебру и золоту, полученным от фараона, Авраам смог ещё шире распространять знание о Всевышнем, в том числе посредством своей великой заповеди гостеприимства.</p>\n<p>Из этого следует важнейший урок для всех поколений.</p>\n<p>Иногда человек видит вокруг себя глубокую тьму, сталкивается с огромной трудностью и чувствует, что готов сломаться.</p>\n<p>Он должен сказать себе:</p>\n<p><strong><strong>Именно из этой тьмы может появиться величайший свет.</strong></strong></p>\n<p>Именно стойкость в тяжёлом испытании способна привести вслед за собой к великому благу и самым высоким духовным достижениям.</p>\n<h2>Ж. Сила разрыва с дурным — от Авраама-авину</h2>\n<p>Ещё один урок.</p>\n<p>Одним из испытаний Авраама была необходимость отдалить Ишмаэля ради воспитания Ицхака-авину.</p>\n<p>Мудрецы говорят, что это было чрезвычайно тяжёлым испытанием, как прямо сказано в Торе:</p>\n<p>«И было это весьма дурно в глазах Авраама из-за сына его».</p>\n<p>Но благодаря этому испытанию народ Израиля получил урок на все поколения:</p>\n<p><strong><strong>иногда для того, чтобы духовно расти, необходимо отдалиться, разорвать определённые связи и совершить болезненные и решительные шаги.</strong></strong></p>\n<p>Например, у юноши может быть друг, влияние которого плохо сказывается на его духовном развитии.</p>\n<p>Он должен сказать себе: научимся у Авраама-авину, который отдалил Ишмаэля, чтобы обеспечить правильное воспитание Ицхака.</p>\n<p>И речь идёт не только о плохом друге.</p>\n<p>Если существует привычка или образ поведения, мешающие духовному росту, человеку необходимо собрать силы, отказаться от них — и тогда может прийти великое преуспевание.</p>\n<h2>З. «Маген Авраам» — сила защиты народа Израиля</h2>\n<p>В свете сказанного мы можем понять, что десять испытаний Авраама-авину были продолжением всей его жизненной миссии — распространять знание о Всевышнем и умножать Его славу в мире.</p>\n<p>Сами испытания прославляли Имя Всевышнего: люди видели величие служения Богу, наблюдая, на какие огромные испытания Авраам готов пойти ради Его Имени.</p>\n<p>В заслугу этих испытаний Авраам удостоился того, что для народа Израиля были совершены чудеса в Египте, что народ вышел из Египта и получил Тору.</p>\n<p>Даже после греха Израиль вновь получил Тору в заслугу этих испытаний.</p>\n<p>И с тех пор в каждом поколении народ Израиля получает силы продолжать служение Всевышнему и выдерживать все испытания.</p>\n<p>Теперь мы можем понять, почему благословение праотцов в молитве завершается словами:</p>\n<p><strong><strong>«Маген Авраам — Щит Авраама».</strong></strong></p>\n<p>Народ Израиля получил свои силы и качества от праотцов.</p>\n<p><strong>Однако силу </strong><strong><strong>выдерживать испытания</strong></strong><strong>, ту силу, которая служит защитой народа Израиля, мы получили именно от Авраама-авину.</strong></p>\n<p>Поэтому мы завершаем благословение словами:</p>\n<p><strong><strong>«Маген Авраам».</strong></strong></p>\n<p>Эта сила Авраама защищала Израиль в Египте, в пустыне и после греха золотого тельца.</p>\n<p>И каждый год, в День суда, мы удостаиваемся благоприятного суда благодаря заслуге Акедат Ицхак.</p>\n<p>Мы действительно молимся:</p>\n<p><strong><strong>«И не приведи нас к испытанию».</strong></strong></p>\n<p>Но необходимо знать: если человеку всё же выпадает трудность, именно в ней может скрываться сила его будущего успеха.</p>\n<p>Именно здесь он способен обрести величайшие духовные приобретения — как для себя самого, так и для последующих поколений.</p>\n<p><strong><strong>Да поможет нам Всевышний удостоиться подниматься всё выше и выше.</strong></strong></p>\n<p><strong><strong>בס״ד — С помощью Небес</strong></strong></p>"},{"title":"Ваера","body":"<h2>Глава 2</h2>\n<p>Недельная глава Ваера</p>\n<p>Об Акедат Ицхак — жертвоприношении Ицхака</p>\n<p>С позволения уважаемых раввинов и дорогих учеников ешивы.</p>\n<p><strong>На этой неделе мы читаем в Торе главу </strong><strong><strong>Ваера</strong></strong><strong>, в конце которой Тора рассказывает нам о великом испытании — </strong><strong><strong>Акедат Ицхак</strong></strong><strong>, связывании Ицхака.</strong></p>\n<p>Как известно, заслуга этого испытания стоит за всем народом Израиля во всех поколениях. Каждый Рош а-Шана мы вспоминаем Акеду и молимся, чтобы благодаря этой заслуге удостоиться благоприятного суда.</p>\n<p>Также сказали наши мудрецы о стихе:</p>\n<p><strong><strong>«И взял он нож, чтобы зарезать сына своего»</strong></strong><strong>.</strong></p>\n<p><strong>Почему нож назван словом </strong><strong><strong>«маахелет»</strong></strong><strong>? Мудрецы сказали: вся пища, которую мы едим в этом мире, — лишь в заслугу того ножа.</strong></p>\n<p>Наша беседа на этой неделе будет посвящена сущности этого испытания, его деталям и награде за него для всех поколений.</p>\n<h2>А. Вопросы</h2>\n<p>Начнем с нескольких вопросов по порядку стихов.</p>\n<p>В начале повествования сказано:</p>\n<p><strong><strong>«И Всесильный испытал Авраама».</strong></strong></p>\n<p><strong>Необходимо понять: ведь Авраам-авину прошел множество испытаний. Почему же именно здесь Тора особо говорит, что Всевышний </strong><strong><strong>испытал</strong></strong><strong> его?</strong></p>\n<p>В следующем стихе сказано:</p>\n<p><strong><strong>«Возьми же сына твоего, единственного твоего, которого ты любишь, Ицхака».</strong></strong></p>\n<p>Здесь употреблено множество выражений. Очевидно, что они написаны не напрасно и каждое из них добавляет нечто новое. Раши уже обращает на это внимание.</p>\n<p>В том же стихе сказано:</p>\n<p><strong><strong>«И иди в землю Мория, и вознеси его там во всесожжение на одной из гор, о которой Я скажу тебе».</strong></strong></p>\n<p>Почему не было сразу сказано, на какой именно горе? Более того, на протяжении всего повествования это, казалось бы, вообще не уточняется.</p>\n<p>В следующем стихе говорится:</p>\n<p><strong><strong>«И встал Авраам рано утром, и оседлал своего осла, и взял с собой двух своих отроков и Ицхака, сына своего, и наколол дрова для всесожжения».</strong></strong></p>\n<p>Нужно понять, зачем Тора столь подробно рассказывает, что Авраам встал утром, сам оседлал осла, взял с собой отроков и наколол дрова для жертвы.</p>\n<p><strong>Кроме того, из последующих стихов видно, что, увидев место, Авраам сказал отрокам остаться с ослом, а сам отправился к горе Мория только с Ицхаком. Казалось бы, наоборот: следовало взять их с собой, чтобы они стали свидетелями великого </strong><strong><strong>кидуш а-Шем — освящения Имени Всевышнего</strong></strong><strong>.</strong></p>\n<p>Далее дважды сказано:</p>\n<p><strong><strong>«И пошли они оба вместе».</strong></strong></p>\n<p>Почему эти слова повторяются два раза?</p>\n<p>В следующем стихе:</p>\n<p><strong><strong>«И сказал Ицхак Аврааму, отцу своему: “Отец мой!” И сказал он: “Вот я, сын мой”. И сказал: “Вот огонь и дрова, но где же ягненок для всесожжения?”»</strong></strong></p>\n<p><strong>Здесь также требуется объяснение. Почему Ицхак не спросил просто: «Где ягненок для всесожжения?» Зачем он предварительно говорит: </strong><strong><strong>«Вот огонь и дрова»</strong></strong><strong>, словно именно наличие огня и дров вызывает его вопрос о жертве?</strong></p>\n<p>И почему Авраам не ответил ему прямо, что он сам будет жертвой, а сказал:</p>\n<p><strong><strong>«Всесильный усмотрит Себе ягненка для всесожжения, сын мой»</strong></strong><strong>?</strong></p>\n<p>Далее сказано:</p>\n<p><strong><strong>«И пришли они на место, о котором сказал ему Всесильный».</strong></strong></p>\n<p>Это удивительно: в предыдущих стихах мы не находим, чтобы Всевышний конкретно указал ему это место. Сначала было сказано лишь:</p>\n<p><strong><strong>«На одной из гор, о которой Я скажу тебе».</strong></strong></p>\n<p>Далее, когда Авраам связывает своего сына Ицхака и берет нож, чтобы зарезать его, сказано:</p>\n<p><strong><strong>«И воззвал к нему ангел Господа с небес...»</strong></strong></p>\n<p>Почему первоначальное повеление об Акедат Ицхак было дано Самим Всевышним, тогда как теперь к Аврааму обращается ангел?</p>\n<p>Кроме того, почему ангел дважды называет его по имени:</p>\n<p><strong><strong>«Авраам! Авраам!»</strong></strong></p>\n<p>Ведь в начале испытания, когда Всевышний велел ему вознести Ицхака, имя Авраама было произнесено лишь один раз:</p>\n<p><strong><strong>«И сказал ему: “Авраам!” И сказал он: “Вот я”».</strong></strong></p>\n<p>Затем, после того как Авраам увидел барана, взял его и принес во всесожжение, ангел снова обращается к Аврааму и благословляет его. Почему он не благословил его сразу?</p>\n<p>Также нужно понять выражение:</p>\n<p><strong><strong>«И вот, другой баран...»</strong></strong></p>\n<p><strong>Что означает слово </strong><strong><strong>«другой»</strong></strong><strong>?</strong></p>\n<p>После принесения барана сказано:</p>\n<p><strong><strong>«И назвал Авраам имя того места: “Господь усмотрит”».</strong></strong></p>\n<p><strong>Почему не сказано </strong><strong><strong>«Господь увидел»</strong></strong><strong> в прошедшем времени? Ведь выражение </strong><strong><strong>«Господь усмотрит»</strong></strong><strong> относится к будущему.</strong></p>\n<p>В благословении ангел говорит:</p>\n<p><strong><strong>«Ибо благословляя благословлю тебя и умножая умножу потомство твое, как звезды небесные и как песок на берегу моря».</strong></strong></p>\n<p>Здесь необходимо понять два момента.</p>\n<p>Во-первых, еще в главе Лех-Леха Всевышний сказал Аврааму:</p>\n<p><strong><strong>«Взгляни же на небо и сосчитай звезды... Таково будет потомство твое».</strong></strong></p>\n<p>Почему же теперь требуется повторное благословение?</p>\n<p><strong>Во-вторых, в Лех-Леха Всевышний также сказал, что потомство Авраама будет подобно </strong><strong><strong>праху земли</strong></strong><strong>, тогда как здесь оно сравнивается с </strong><strong><strong>песком на берегу моря</strong></strong><strong>. Есть ли разница между этими сравнениями? А если разницы нет, зачем они повторяются?</strong></p>\n<h2>Б. Свобода выбора и испытание</h2>\n<p><strong>Начнем объяснять этот вопрос, с помощью Небес, согласно подходу </strong><strong><strong>Мальбима</strong></strong><strong>.</strong></p>\n<p><strong>Прежде всего приведем его объяснение самой сущности понятия </strong><strong><strong>«нисаён» — испытание</strong></strong><strong>.</strong></p>\n<p><strong>Существует понятие </strong><strong><strong>«бхина» — проверка</strong></strong><strong>, а существует </strong><strong><strong>«нисаён» — испытание</strong></strong><strong>.</strong></p>\n<p>Проверка означает выяснение того, обладает ли предмет качеством, которое по своей природе должно ему принадлежать.</p>\n<p>Например, человек берет кусок золота и проверяет, является ли он настоящим золотом, каким выглядит, или подделкой.</p>\n<p>Испытание же означает выяснение, обладает ли предмет некоторой способностью, о которой заранее неизвестно, должна ли она вообще ему быть свойственна. Например, когда проверяют, обладает ли золото силой притяжения.</p>\n<p>Так же и в отношении человека.</p>\n<p><strong>Когда говорится, что Всевышний </strong><strong><strong>проверяет</strong></strong><strong> человека, имеется в виду проверка того, совершенно ли его сердце перед Всевышним, как и должно быть.</strong></p>\n<p><strong>Когда же Всевышний </strong><strong><strong>испытывает</strong></strong><strong> человека, Он желает выявить, сможет ли тот сохранить свою праведность в ситуации, превосходящей естественные человеческие возможности.</strong></p>\n<p>Поэтому слова:</p>\n<p><strong><strong>«И Всесильный испытал Авраама»</strong></strong></p>\n<p>означают, что Всевышний поставил его перед ситуацией, которую, согласно естественному порядку вещей, человек не способен выдержать.</p>\n<p>Всевышний подверг Авраама десяти подобным испытаниям, причем каждое следующее было тяжелее предыдущего.</p>\n<p>Исходя из этого, стих можно объяснить двумя способами.</p>\n<p><strong>Первый: слова </strong><strong><strong>«И Всесильный испытал»</strong></strong><strong> относятся к прошлому — Всевышний уже испытал Авраама девятью испытаниями, а теперь предлагает ему выдержать десятое.</strong></p>\n<p>Второй: речь идет именно об этом испытании, которое превосходит все предыдущие девять.</p>\n<p>Есть и дополнительное объяснение. Во всех девяти предыдущих испытаниях Всевышний велел Аврааму совершить определенные действия, которые действительно следовало совершить. Например:</p>\n<p><strong><strong>«Лех леха — уйди из своей земли».</strong></strong></p>\n<p>Но здесь Всевышний, как казалось, повелел ему зарезать сына, а в конце сказал не делать этого.</p>\n<p><strong>Поэтому именно это событие Тора особо называет </strong><strong><strong>«испытанием»</strong></strong><strong>.</strong></p>\n<h2>В. Повеление — величие испытания</h2>\n<p><strong><strong>«И сказал ему: “Авраам”, и сказал он: “Вот я”».</strong></strong></p>\n<p>Мальбим объясняет от имени Торат Коаним, почему в других местах имя человека при обращении повторяется:</p>\n<p><strong><strong>«Авраам, Авраам»</strong></strong><strong>,<br></strong><strong><strong>«Яаков, Яаков»</strong></strong><strong>.</strong></p>\n<p>Само обращение по имени выражает любовь и близость, а повторение имени означает побуждение и призыв действовать быстрее.</p>\n<p>Но здесь Всевышний не желал торопить Авраама.</p>\n<p>Как объясняется в Мидраше, это было сделано для того, чтобы впоследствии никто не сказал, будто Всевышний ошеломил и привел Авраама в смятение и тот совершил поступок, не успев осознать происходящее.</p>\n<p><strong>Поэтому Всевышний произнес имя </strong><strong><strong>«Авраам»</strong></strong><strong> только один раз.</strong></p>\n<p>Далее:</p>\n<p><strong><strong>«И сказал: возьми же сына твоего, единственного твоего, которого ты любишь, Ицхака».</strong></strong></p>\n<p>Известны слова Раши. Добавим к ним объяснение согласно подходу Мальбима.</p>\n<p>Цель испытания Акедат Ицхак заключалась в раскрытии величия любви Авраама к Всевышнему — любви, превосходящей все остальные виды любви, так что перед любовью к Всевышнему все прочие привязанности становятся второстепенными.</p>\n<p>Поэтому Всевышний сказал ему:</p>\n<p><strong><strong>«Возьми же сына твоего».</strong></strong></p>\n<p>Не утешай себя мыслью, что он не единственный твой сын, поскольку у тебя есть два сына.</p>\n<p>Возьми его, несмотря на то, что он:</p>\n<p><strong><strong>«сын твой, единственный твой, которого ты любишь».</strong></strong></p>\n<p>То есть Авраам не должен был искусственно охлаждать в себе любовь к сыну, чтобы облегчить выполнение повеления.</p>\n<p>Всевышний добавил:</p>\n<p><strong><strong>«Ицхака».</strong></strong></p>\n<p>То есть помни обо всех его достоинствах: это мудрый и праведный сын. И несмотря на всю любовь к нему, Авраам должен был преодолеть свои чувства ради Всевышнего.</p>\n<h2>Г. Аврааму не было приказано принести Ицхака в жертву</h2>\n<p><strong>В Талмуде, трактат </strong><strong><strong>Таанит (4а)</strong></strong><strong>, сказано:</strong></p>\n<p><strong><strong>«То, что не приходило Мне на сердце, — это Акедат Ицхак».</strong></strong></p>\n<p>То есть намерением Всевышнего вовсе не было, чтобы Авраам действительно зарезал Ицхака как жертву всесожжения.</p>\n<p>На первый взгляд это удивительно. Ведь Всевышний прямо сказал:</p>\n<p><strong><strong>«И вознеси его там во всесожжение».</strong></strong></p>\n<p>Мальбим объясняет: если бы Авраам внимательно вникал в каждое слово, он мог бы понять, что Всевышний вовсе не намеревался, чтобы Ицхак был принесен в жертву.</p>\n<p>Всевышний сказал:</p>\n<p><strong><strong>«И иди в землю Мория, на одну из гор, о которой Я скажу тебе».</strong></strong></p>\n<p><strong>Мы находим, что гора называется </strong><strong><strong>горой Мория</strong></strong><strong>, в том числе из-за благовоний, находившихся там, а мудрецы приводят и другие объяснения этого названия.</strong></p>\n<p><strong>Сама земля называется </strong><strong><strong>землей Мория</strong></strong><strong> вследствие особой значимости этой горы: вся местность получила название по находящейся там горе.</strong></p>\n<p>Если так, когда Всевышний сказал:</p>\n<p><strong><strong>«На одной из гор»</strong></strong><strong>,</strong></p>\n<p>очевидно, что речь идет о самой значимой горе, благодаря которой вся область называется землей Мория.</p>\n<p>Тогда что означают слова:</p>\n<p><strong><strong>«О которой Я скажу тебе»</strong></strong><strong>?</strong></p>\n<p>Ведь Всевышний, казалось бы, уже указал, о какой горе идет речь.</p>\n<p>Кроме того, из дальнейших стихов видно, что Авраам знал, куда идти, как сказано:</p>\n<p><strong><strong>«На место, о котором сказал ему Всесильный».</strong></strong></p>\n<p><strong>Следовательно, по объяснению Мальбима, слова </strong><strong><strong>«о которой Я скажу тебе»</strong></strong><strong> можно отнести не к горе, а к предыдущему выражению </strong><strong><strong>«вознеси там во всесожжение»</strong></strong><strong>.</strong></p>\n<p><strong>Иными словами: кого именно ты должен будешь вознести? — </strong><strong><strong>того, о ком Я скажу тебе позднее</strong></strong><strong>, то есть барана.</strong></p>\n<p>Получается, что в действительности Аврааму вовсе не было приказано принести Ицхака в жертву.</p>\n<p>Кроме того, Авраам мог понять это из выражения:</p>\n<p><strong><strong>«ве-хаалеу шам ле-ола — вознеси его там для всесожжения».</strong></strong></p>\n<p><strong>В отношении жертвенника слово </strong><strong><strong>«вознести»</strong></strong><strong> может означать просто поднять на жертвенник, а не обязательно зарезать и принести в жертву.</strong></p>\n<p>Следовательно, Всевышний мог повелеть лишь поднять Ицхака на жертвенник, а затем снять его оттуда.</p>\n<p>Есть и еще одна тонкость.</p>\n<p>Если бы Всевышний намеревался приказать Аврааму действительно принести Ицхака в жертву, следовало бы сказать:</p>\n<p><strong><strong>«вознеси его всесожжением»</strong></strong><strong>,</strong></p>\n<p><strong>без предлога </strong><strong><strong>«ле-» — «для»</strong></strong><strong>.</strong></p>\n<p><strong>Выражение же </strong><strong><strong>«ле-ола — для всесожжения»</strong></strong><strong> можно понимать как указание посвятить его святости жертвы всесожжения, но не обязательно реально принести его в жертву.</strong></p>\n<p>Однако из-за огромной любви Авраама к Всевышнему, его страстного желания исполнить Его волю и великой радости от мысли, что его сын удостоится стать жертвой Всевышнему, благоуханием приятным, Авраам не стал исследовать и анализировать слова Всевышнего.</p>\n<p>Он устремился исполнять Его волю, словно олень, бегущий вперед, — настолько, что ангелу пришлось его остановить.</p>\n<p>Именно это означает выражение:</p>\n<p><strong><strong>«Это не приходило Мне на сердце».</strong></strong></p>\n<p>То есть Всевышний не приказывал ему совершать это буквально, но оставил возможность понять Его слова подобным образом.</p>\n<p>По этой же причине Тора подробно рассказывает, как Авраам рано встал, сам оседлал осла и наколол дрова для всесожжения, тщательно очистив их от червей, чтобы они были пригодны для жертвенника.</p>\n<p>Все это показывает силу желания Авраама и то, насколько он торопился исполнить, как он понимал, повеление Творца — принести Ицхака в жертву.</p>\n<h2>Д. Глубина испытания — противоречие между повелением Всевышнего и чистым, прямым разумом</h2>\n<p><strong><strong>«На третий день поднял Авраам глаза свои и увидел то место издалека. И сказал Авраам своим отрокам: “Оставайтесь здесь с ослом, а я и отрок пойдем туда, поклонимся и возвратимся к вам”».</strong></strong></p>\n<p>Этими стихами Тора раскрывает дополнительные стороны величия испытания Авраама.</p>\n<p>Вся жизнь Авраама-авину была построена на следовании истине, прямоте и разуму.</p>\n<p>Наши мудрецы сказали:</p>\n<p><strong><strong>«Авраам-авину соблюдал всю Тору».</strong></strong></p>\n<p>Как он мог соблюдать ее, если Тора еще не была дарована?</p>\n<p>Благодаря чистоте и широте своего понимания он самостоятельно постигал волю Всевышнего и поступал согласно ей. Именно этим впоследствии и оказались заповеди Торы.</p>\n<p>Например, гостеприимство, борьба с идолопоклонством и другие вещи.</p>\n<p>Авраам также учил весь мир тому, что принесение людей в жертву идолам — отвратительно и является настоящим убийством.</p>\n<p>На протяжении всей жизни Авраам не совершал ничего, что его чистый разум считал неправильным.</p>\n<p>И вот теперь Сам Всевышний, как ему казалось, повелевает совершить поступок, противоречащий простому пониманию и прямому нравственному разуму, который говорит, что нельзя убивать человека ради принесения его в жертву.</p>\n<p>Это составляло одну из величайших частей испытания: Авраам должен был поступить вопреки собственному разуму и пониманию, которыми руководствовался всю жизнь.</p>\n<p><strong>Поэтому он не хотел совершать этот поступок перед своими отроками — которыми, согласно словам наших мудрецов, были </strong><strong><strong>Элиэзер и Ишмаэль</strong></strong><strong>.</strong></p>\n<p>Он стеснялся перед ними совершить то, что до сих пор сам считал мерзостью, и не хотел, чтобы они научились поступать подобным образом.</p>\n<p>Поэтому Авраам скрыл от них происходящее и сказал им остаться с ослом.</p>\n<p>Он также не открыл им своего намерения, а сказал:</p>\n<p><strong><strong>«Мы поклонимся и возвратимся к вам».</strong></strong></p>\n<p>Более того, Авраам находился здесь перед колоссальным внутренним противоречием.</p>\n<p>С одной стороны, Всевышний, как он понимал, велит ему вознести своего сына Ицхака во всесожжение.</p>\n<p>С другой стороны, его чистая и возвышенная душа, которая прежде сумела самостоятельно постичь все заповеди, говорит ему, что невозможно, чтобы Всевышний повелел совершить убийство.</p>\n<p>Казалось бы, Авраам должен был попытаться найти объяснение, согласно которому намерением Всевышнего вовсе не было зарезать и принести Ицхака в жертву.</p>\n<p>Но из-за огромной любви к Творцу и страстного желания посвятить Ему все, что у него есть, Авраам не стал искать такого объяснения. Он преодолел даже собственный чистый разум и естественное чувство и пошел приносить своего сына Ицхака в жертву.</p>\n<p>Именно поэтому Тора дважды говорит:</p>\n<p><strong><strong>«И пошли они оба вместе».</strong></strong></p>\n<p>В первый раз Авраам уже знал, что, как он понимает, идет зарезать Ицхака, тогда как Ицхак еще не знал этого и думал, что для всесожжения будет найден ягненок.</p>\n<p>Несмотря на это, оба шли с одинаковой радостью в сердце, желая исполнить волю Всевышнего.</p>\n<p>А после того как Авраам открыл Ицхаку, что именно он должен стать жертвой, Тора снова говорит:</p>\n<p><strong><strong>«И пошли они оба вместе».</strong></strong></p>\n<p>Это учит нас, что даже после того, как Ицхак узнал, что речь идет о нем самом, он продолжил путь с той же готовностью и радостью, что и Авраам.</p>\n<h2>Е. Диалог между Ицхаком и Авраамом — двойной довод «мима нафшах»</h2>\n<p><strong><strong>«И взял Авраам дрова для всесожжения и возложил их на Ицхака, сына своего; и взял в руку огонь и нож, и пошли они оба вместе. И сказал Ицхак Аврааму, отцу своему, и сказал: “Отец мой!” И ответил тот: “Вот я, сын мой”. И сказал: “Вот огонь и дрова, но где же ягненок для всесожжения?”»</strong></strong></p>\n<p>Смысл диалога в этих стихах можно объяснить следующим образом.</p>\n<p><strong>Ицхак-авину сомневался: намерен ли Авраам принести в жертву ягненка или самого Ицхака. Поэтому он обратился к Аврааму с доводом </strong><strong><strong>«мима нафшах»</strong></strong><strong> — то есть: как ни рассуждай, возникает вопрос.</strong></p>\n<p>Ведь ты не взял с собой ягненка. Если ты собираешься прийти в населенный пункт, где сможешь найти ягненка для всесожжения, то там же ты сможешь найти и огонь, и дрова. Зачем же тогда ты несешь их с собой?</p>\n<p><strong>Если же ты взял огонь и дрова потому, что знаешь, что мы не придем ни в какое поселение, тогда </strong><strong><strong>где же ягненок для всесожжения?</strong></strong></p>\n<p>А если ты намерен принести в жертву меня самого, зачем ты взял с собой огонь? Ведь тогда было бы подобающим, чтобы с Небес сошел огонь и поглотил жертву, а не чтобы я был сожжен обычным, будничным огнем.</p>\n<p>Кроме того, если именно я являюсь жертвой, почему ты возложил дрова мне на плечи? Ведь если я уже посвящен в жертву всесожжения, получается, что ты используешь посвященное святыне для работы.</p>\n<p>На это Авраам ответил:</p>\n<p><strong><strong>«Всесильный усмотрит Себе ягненка для всесожжения, сын мой».</strong></strong></p>\n<p>То есть: я сам еще не знаю, кого Всевышний изберет в качестве жертвы — тебя или ягненка.</p>\n<p>Поэтому я и взял с собой обычный огонь: ведь возможно, что жертвой окажется ягненок, а не Ицхак. По этой же причине я возложил дрова на тебя — поскольку пока еще не определено, что именно ты посвящен во всесожжение.</p>\n<h2>Ж. Кульминация испытания — подготовка к жертвоприношению и взятие ножа</h2>\n<p><strong><strong>«И пришли они на место, о котором сказал ему Всесильный; и построил там Авраам жертвенник, и разложил дрова, и связал Ицхака, сына своего, и положил его на жертвенник».</strong></strong></p>\n<p>Ицхак уже знал, что существует возможность, что именно он станет жертвой, но также возможно, что будет принесен другой ягненок.</p>\n<p>Когда они пришли на место и Ицхак увидел, что Авраам сам построил жертвенник и сам разложил дрова, не попросив его помочь, он понял причину: Авраам не хотел пользоваться его трудом, поскольку именно Ицхак был избран в качестве жертвы.</p>\n<p>И здесь наступил момент испытания самого Ицхака.</p>\n<p>Если бы Ицхак не хотел этого, он легко мог бы воспротивиться своему отцу: Авраам был уже пожилым человеком, тогда как Ицхак был молод.</p>\n<p>И все же Ицхак согласился совершенно добровольно.</p>\n<p>Более того, он попросил отца связать его крепко, чтобы во время шхиты он не дернулся и тем самым не сделал жертву непригодной.</p>\n<h2>З. Плач ангелов и то, как они остановили Авраама</h2>\n<p><strong>После того как Авраам связал Ицхака и взял нож, чтобы зарезать его, наши мудрецы говорят, что </strong><strong><strong>ангелы заплакали на Небесах</strong></strong><strong>.</strong></p>\n<p>Объяснение этого следующее.</p>\n<p>Известно, что исполнением каждого повеления Всевышнего создается ангел.</p>\n<p>В истории Акеды были повеление взять Ицхака, путь, строительство жертвенника, раскладывание дров, связывание Ицхака и вознесение его на жертвенник. Каждое из этих действий создало ангела, существование и жизненная сила которого исходили из соответствующей заповеди.</p>\n<p>Но ангелы знали, что Всевышний не повелевал зарезать Ицхака.</p>\n<p>Если бы Авраам действительно зарезал его, оказалось бы, что все предыдущие действия были лишь подготовкой к убийству — поступку, являющемуся мерзостью перед Всевышним.</p>\n<p>Поэтому эти ангелы плакали: если Авраам зарежет своего сына Ицхака, все они лишатся смысла своего существования и обратятся в ничто.</p>\n<p><strong>Поэтому к Аврааму воззвал именно </strong><strong><strong>ангел Господа</strong></strong><strong>, а не Сам Всевышний: ангелы остановили его, чтобы не лишиться своего существования.</strong></p>\n<p>И сказал ему ангел:</p>\n<p><strong><strong>«Ибо теперь Я знаю, что ты боишься Всесильного и не пожалел сына твоего, единственного твоего, для Меня».</strong></strong></p>\n<p>Смысл его слов таков:</p>\n<p>Цель заповеди заключалась в том, чтобы обнаружилось и стало явным, что ты боишься Всевышнего и не пожалел своего сына. Из этой заповеди был создан я. Теперь заповедь уже достигла своей цели.</p>\n<p>Само же заклание больше не требуется — оно было бы лишь убийством и мерзостью.</p>\n<p>Поэтому ангел сказал:</p>\n<p><strong><strong>«И не пожалел сына твоего... для Меня»</strong></strong><strong> —</strong></p>\n<p><strong>то есть буквально: </strong><strong><strong>для меня самого</strong></strong><strong>, поскольку я был создан этой заповедью, целью которой было показать твою богобоязненность.</strong></p>\n<h2>И. Второе испытание — снять Ицхака с жертвенника</h2>\n<p>Продолжим размышление.</p>\n<p>Ангел повелел:</p>\n<p><strong><strong>«Не простирай руки твоей к отроку и не делай ему ничего».</strong></strong></p>\n<p>Наши мудрецы объясняют, что Авраам хотел хотя бы оставить на теле Ицхака небольшой след, пустив ему немного крови.</p>\n<p><strong>Но ангел сказал ему не делать ему </strong><strong><strong>ничего</strong></strong><strong>.</strong></p>\n<p>И здесь возникло еще одно великое испытание.</p>\n<p>Вначале Аврааму было велено принести Ицхака в жертву, а затем ему было приказано не приносить его.</p>\n<p>При исполнении второго повеления в глубине сердца могла возникнуть посторонняя мысль: радость не ради Небес, а просто оттого, что его сын спасся и не был принесен во всесожжение.</p>\n<p>Однако Всевышний, знающий сокровенные мысли человеческого сердца, знал: подобно тому как первое повеление Авраам исполнял исключительно ради Всевышнего, так и при исполнении второго он не радовался личной радостью оттого, что его единственный сын спасся.</p>\n<p><strong>Он радовался тому, что удостоился </strong><strong><strong>еще раз исполнить волю своего Творца</strong></strong><strong>.</strong></p>\n<p>Доказательством служит то, что Аврааму было тяжело снять Ицхака с жертвенника. Он хотел хотя бы оставить на нем какой-то след, пока ангел не запретил ему и это.</p>\n<p>Об этом сказано:</p>\n<p><strong><strong>«Ибо теперь Я знаю...»</strong></strong></p>\n<p>То есть именно благодаря второй исполненной тобой заповеди:</p>\n<p><strong><strong>«Я знаю, что ты боишься Всесильного и не пожалел сына твоего, единственного твоего».</strong></strong></p>\n<p>Иными словами, даже то, что ты теперь сохранил его от смерти, не было вызвано посторонней мыслью — ты не спас его потому, что это твой любимый единственный сын.</p>\n<p><strong>Ты сделал это </strong><strong><strong>«для Меня»</strong></strong><strong> — исключительно ради исполнения повеления Всевышнего, без какой-либо иной цели.</strong></p>\n<h2>Й. Исполнение повеления Всевышнего через принесение барана</h2>\n<p><strong><strong>«И поднял Авраам глаза свои, и увидел: вот баран, запутавшийся рогами в чаще; и пошел Авраам, и взял барана, и вознес его во всесожжение вместо сына своего».</strong></strong></p>\n<p>После того как Всевышний повелел ему не приносить Ицхака в жертву, Авраам задумался: что же тогда в действительности означало первоначальное повеление:</p>\n<p><strong><strong>«И вознеси его там во всесожжение»?</strong></strong></p>\n<p>Тогда он понял, что слова:</p>\n<p><strong><strong>«которого Я укажу тебе»</strong></strong></p>\n<p><strong>означали: вознеси того, </strong><strong><strong>кого Всевышний еще укажет ему</strong></strong><strong>, а не Ицхака.</strong></p>\n<p>Тогда Авраам поднял глаза и увидел барана, которого прежде там не было.</p>\n<p><strong>Слово </strong><strong><strong>«ахар — אחר»</strong></strong><strong> здесь означает «после этого»: сразу после этого Авраам увидел, что баран зацепился своими рогами за чащу деревьев.</strong></p>\n<p>Он понял, что именно этот баран был послан, чтобы стать жертвой вместо Ицхака, и что именно его имел в виду Всевышний, сказав:</p>\n<p><strong><strong>«которого Я укажу тебе».</strong></strong></p>\n<p>Поэтому Авраам принес его во всесожжение вместо своего сына.</p>\n<p>В связи с этим сказано:</p>\n<p><strong><strong>«И назвал Авраам имя того места: “Господь усмотрит”, как говорится по сей день: “На горе Господа будет усмотрено”».</strong></strong></p>\n<p>Смысл этого заключается в том, что заслуга готовности Авраама зарезать Ицхака считается так, словно он действительно совершил это — словно Ицхак был принесен Всевышнему, а его пепел навечно лежит на жертвеннике.</p>\n<p>Эта заслуга защищает народ Израиля во всех поколениях, из года в год.</p>\n<p>Есть и другое объяснение.</p>\n<p>Наши мудрецы говорят, что даже после того, как Аврааму было приказано не закалывать Ицхака, он все еще не снял его с жертвенника.</p>\n<p>Авраам спросил ангела:</p>\n<p>— Кто ты?        Тот ответил:       — Ангел.</p>\n<p>Авраам сказал ему:</p>\n<p>— Когда Святой, благословен Он, велел мне зарезать его, Он Сам сказал мне это. Теперь я прошу, чтобы Он Сам сказал мне снять его.</p>\n<p>Согласно этому объяснению, барана Авраам принес не на самом жертвеннике, а рядом с ним.</p>\n<p>И в этом также смысл слов:</p>\n<p><strong><strong>«вместо сына своего»</strong></strong><strong> —</strong></p>\n<p>то есть ниже Ицхака, который все еще оставался связанным на жертвеннике.</p>\n<p>Именно поэтому Авраам сказал:</p>\n<p><strong><strong>«Господь усмотрит»</strong></strong><strong> —</strong></p>\n<p>то есть Сам Всевышний должен сообщить мне, следует ли принести Ицхака во всесожжение или нет, а не ангел.</p>\n<p>После этого сказано:</p>\n<p><strong><strong>«И воззвал ангел Господа к Аврааму во второй раз с небес. И сказал: “Мною клянусь, — слово Господа...”»</strong></strong></p>\n<p>Ангел сказал ему:</p>\n<p><strong>Я клянусь тебе, что я не посланник, чей Господин отсутствует. Напротив, </strong><strong><strong>«во мне — слово Господа»</strong></strong><strong>: слова, которые я произношу тебе, являются словами Самого Всевышнего, говорящего через меня.</strong></p>\n<p>И далее:</p>\n<p><strong><strong>«За то, что ты сделал это...»</strong></strong></p>\n<p>То есть именно этим поступком — тем, что ты не хотел снимать Ицхака с жертвенника, — испытание завершилось, а твоя праведность раскрылась с еще большей силой.</p>\n<h2>К. Последнее испытание выше первого — притча о царе и его друзьях</h2>\n<p>Приведем притчу, позволяющую лучше понять сказанное.</p>\n<p>Однажды царь пришел в снежный день в дом своего близкого друга. От холода царь сильно замерз, но у хозяина не было дров, чтобы согреть его.</p>\n<p>Тогда хозяин взял свои дорогие предметы, расколол их на дрова и развел огонь, чтобы согреть царя.</p>\n<p>В другой раз царь также оказался в снежный день у другого своего друга. У этого человека были обычные дрова для отопления.</p>\n<p>Однако он сказал:</p>\n<p>«Ради чести царя я не стану топить дом простыми дровами».</p>\n<p>Он взял собственные драгоценные вещи, расколол их и разжег ими огонь, чтобы согреть царя.</p>\n<p>Очевидно, что второй поступок значительно выше первого.</p>\n<p>Первый человек сжег свои драгоценности лишь потому, что у него не было дров. У него не оставалось иного выхода: чтобы спасти царя от холода, ему пришлось пожертвовать своим имуществом.</p>\n<p>У второго же человека дрова были.</p>\n<p>И все же он показал величие своей любви: насколько дорога ему честь царя и насколько он готов отдать все богатство своего дома из любви к нему.</p>\n<p>Таков и смысл нашего случая.</p>\n<p>Во время первого испытания, когда Всевышний сказал Аврааму:</p>\n<p><strong><strong>«Возьми сына твоего и вознеси его там во всесожжение»,</strong></strong></p>\n<p>Авраам мог думать, что Всевышний не желает барана, а желает именно Ицхака. Если так, у Авраама не было выбора: он должен был принести своего сына.</p>\n<p>Но во втором испытании Всевышний Сам предоставил ему барана для жертвы.</p>\n<p>Теперь Авраам увидел, что Всевышний принимает в качестве жертвы и животное и вовсе не требует непременно его единственного сына.</p>\n<p>И несмотря на это, из-за огромной любви ко Всевышнему Авраам не хотел снимать Ицхака с жертвенника.</p>\n<p>Ради чести Небесного Царя он желал принести Ему самое дорогое, что у него было, — собственного сына.</p>\n<p>Об этом ангел сказал:</p>\n<p><strong><strong>«За то, что ты сделал это...»</strong></strong></p>\n<p>То есть ты принес барана и тем самым увидел, что Всевышний принимает и барана и не нуждается именно в Ицхаке.</p>\n<p>И несмотря на это:</p>\n<p><strong><strong>«Ты не пожалел сына твоего, единственного твоего»</strong></strong><strong> —</strong></p>\n<p>ты желал, чтобы именно он был принесен Мне во всесожжение.</p>\n<p>Поэтому:</p>\n<p><strong><strong>«Благословляя благословлю тебя и умножая умножу потомство твое, как звезды небесные и как песок на берегу моря».</strong></strong></p>\n<h2>Л. Благословение — существование потомства Ицхака в мере милосердия</h2>\n<p><strong>Теперь объясним смысл благословений, данных после Акеды, и их отличие от благословений, полученных Авраамом при </strong><strong><strong>Брит бейн а-бетарим — Союзе между рассеченными частями</strong></strong><strong>.</strong></p>\n<p>Для этого необходимо предварительно объяснить глубокий принцип.</p>\n<p>Согласно естественному ходу вещей, ни Ицхак, ни его потомство вообще не должны были появиться в мире.</p>\n<p><strong>Во-первых, Авраам видел по астрологическим знакам — </strong><strong><strong>мазалот</strong></strong><strong>, — что у него не должно быть потомства.</strong></p>\n<p>Во-вторых, Авраам и Сара были уже в таком возрасте, когда естественным путем рождение ребенка было невозможно.</p>\n<p>Поэтому само рождение Ицхака было чудом.</p>\n<p>Известно, что чудо продолжается лишь до тех пор, пока человек, ради которого оно совершается, достоин этого чуда.</p>\n<p>Получается, что в тот момент, когда потомки Ицхака перестали бы быть достойны этого чуда, над ними вновь должен был бы получить власть естественный порядок, и они могли бы исчезнуть из мира.</p>\n<p>Поэтому Всевышний повелел Аврааму вознести Ицхака во всесожжение.</p>\n<p>Ицхак согласился и полностью отдал себя как жертву Всевышнему.</p>\n<p>Это засчиталось так, словно его прежнее тело уже прекратило свое существование: острый нож уже был занесен над его шеей, и лишь ангел остановил Авраама.</p>\n<p><strong>В Мидраше даже сказано, что </strong><strong><strong>душа Ицхака уже покинула его, а затем возвратилась</strong></strong><strong>.</strong></p>\n<p><strong>Таким образом, когда Ицхак сошел с жертвенника, это был уже не прежний Ицхак, а словно </strong><strong><strong>другой Ицхак</strong></strong><strong>, всецело посвященный Всевышнему.</strong></p>\n<p>К этому новому существованию уже не относилось прежнее указание звезд о том, что он не сможет существовать.</p>\n<p>Отныне его потомству больше не требовалось постоянное чудо для самого своего существования.</p>\n<p>По этой причине на протяжении всего рассказа об Акеде, вплоть до слов:</p>\n<p><strong><strong>«И взял нож»</strong></strong><strong>,</strong></p>\n<p><strong>упоминается Имя </strong><strong><strong>Элоким</strong></strong><strong>, связанное с </strong><strong><strong>мидат а-дин — мерой суда</strong></strong><strong>.</strong></p>\n<p><strong>Начиная же с этого момента используется четырехбуквенное Имя Всевышнего — </strong><strong><strong>Авайе (הוי״ה)</strong></strong><strong>, связанное с </strong><strong><strong>мерой милосердия и индивидуальным Божественным Провидением</strong></strong><strong>.</strong></p>\n<p>До Акеды существование Ицхака находилось под мерой суда: если бы он не был достоин своего сверхъестественного существования на соответствующем высоком духовном уровне, то он и его потомство могли бы исчезнуть.</p>\n<p><strong>После Акеды начинается словно новое творение — существование в </strong><strong><strong>мере милосердия</strong></strong><strong>.</strong></p>\n<p>Теперь становится понятным и второе благословение:</p>\n<p><strong><strong>«Благословляя благословлю тебя и умножая умножу потомство твое, как звезды небесные и как песок на берегу моря».</strong></strong></p>\n<p>В первом благословении было сказано:</p>\n<p><strong><strong>«Взгляни же на небо».</strong></strong></p>\n<p><strong>Слово </strong><strong><strong>«хабет — הבט»</strong></strong><strong> означает взгляд сверху вниз.</strong></p>\n<p><strong>Всевышний как бы поднял Авраама выше звезд и сказал ему, что Ицхак родится </strong><strong><strong>выше влияния мазаля</strong></strong><strong>, то есть сверх естественного порядка, определяемого звездами.</strong></p>\n<p>Но теперь, после того как Ицхак словно родился заново и стал новым творением, существование которого уже не противоречит естественному порядку, Авраам получил новое благословение.</p>\n<p><strong>Его потомство будет многочисленным и выдающимся, </strong><strong><strong>как звезды</strong></strong><strong>, каждая из которых обладает собственным предназначением.</strong></p>\n<p>Кроме того, его потомство будет:</p>\n<p><strong><strong>«как песок на берегу моря».</strong></strong></p>\n<p><strong>Это уже иное благословение, отличающееся от прежних слов, что его потомство будет </strong><strong><strong>как прах земли</strong></strong><strong>.</strong></p>\n<p>У песка есть особая сила: он образует границу для морских волн и не позволяет им затопить и уничтожить мир.</p>\n<p>Так и после того, как существование Ицхака было заново утверждено в мере милосердия, народу Израиля — потомкам Ицхака — была дана сила противостоять всем народам мира, стремящимся их уничтожить.</p>\n<p>Даже если их заслуги не будут чрезвычайно велики, они смогут противостоять врагам и естественным путем одерживать над ними победу.</p>\n<p>Как сказано:</p>\n<p><strong><strong>«И овладеет потомство твое вратами врагов своих».</strong></strong></p>\n<p>Да будет воля Всевышнего, чтобы Святой, благословен Он, вспомнил ради нас Акедат Ицхак и полностью избавил нас совершенным Избавлением.</p>\n<p><strong>И даже пока мы находимся в нынешнем положении, когда народ Израиля переживает тяжелое духовное падение, и особенно когда изучающие Тору подвергаются преследованию за свое право изучать Тору, — пусть заслуга Акедат Ицхак защитит нас, чтобы </strong><strong><strong>не погиб остаток Яакова</strong></strong><strong>.</strong></p>\n<p><strong>И напротив — пусть возвысится и укрепится </strong><strong><strong>слава Торы</strong></strong><strong>.</strong></p>"},{"title":"Хаей Сара","body":"<h2>Глава 3</h2>\n<p>Недельная беседа по главе «Хаей Сара»</p>\n<p>Беэзрат Ashem (С помощью Всевышнего)</p>\n<p>Еженедельная беседа нашего наставника, главы ешивы, да будет он благословен.</p>\n<p>Тема: Погребение Сары — вера в бессмертие души</p>\n<p>С разрешения уважаемых и выдающихся раввинов, а также всех дорогих и любимых учеников ешивы.</p>\n<p>На этой неделе мы изучаем главу Торы «Хаей Сара», которая начинается с рассказа о погребении нашей праматери Сары. Постараемся, с Б-жьей помощью, глубже рассмотреть эту главу и извлечь из неё важные уроки.</p>\n<p>1. Вопросы</p>\n<p>1. В предыдущие недели мы уже говорили о том, что комментаторы расходятся во мнениях относительно того, являлось ли погребение Сары одним из десяти испытаний, которым подвергся Авраам Авину.</p>\n<p>Некоторые объясняют, что это действительно было одним из испытаний: после того как Всевышний обещал ему Землю Израиля, Авраам не смог найти даже четыре локтя земли, чтобы похоронить Сару, и был вынужден заплатить за это огромную сумму денег.</p>\n<p>Другие же считают, что последним испытанием была Акедат Ицхак (жертвоприношение Ицхака), поэтому погребение Сары не включается в число десяти испытаний.</p>\n<p>Но необходимо понять: почему же это не считается испытанием? Ведь Аврааму действительно пришлось столкнуться с огромной трудностью: ему пришлось умолять и платить большие деньги за возможность похоронить Сару. Это, на первый взгляд, противоречит обещаниям Всевышнего, данным ему.</p>\n<p>2. Из стихов следует, что пещера Махпела принадлежала Эфрону, и Авраам купил её у него. Тогда возникает вопрос: зачем Аврааму понадобилось обращаться ко всем сынам Хет и устраивать переговоры в присутствии всех жителей города?</p>\n<p>3. Откуда Авраам вообще узнал о существовании пещеры Махпела? Ведь Эфрон даже не рассматривал возможность отдельной продажи пещеры, а говорил только о поле, на краю которого она находилась. Как объясняют комментаторы, для Эфрона эта пещера была тёмным и непривлекательным местом, не представлявшим никакой ценности.</p>\n<p>4. В стихе 2 сказано:</p>\n<p>«И пришёл Авраам оплакивать Сару и скорбеть о ней».</p>\n<p>В слове «ולבכתה» (и плакать о ней) буква כ (каф) написана маленькой. Комментаторы объясняют, что Авраам плакал лишь немного.</p>\n<p>Но необходимо понять: почему он так мало плакал? Ведь, казалось бы, следовало много оплакивать такую праведную и благочестивую женщину, как наша праматерь Сара.</p>\n<p>2. Процесс приобретения пещеры Махпела в соответствии с последовательностью стихов</p>\n<p>Начнём с рассмотрения стихов и последовательности событий в главе, обращая внимание на моменты, требующие объяснения.</p>\n<p>В стихе 3 сказано:</p>\n<p>«И поднялся Авраам от лица умершей своей и заговорил с сынами Хета, сказав…»</p>\n<p>Как уже было отмечено, необходимо понять, почему он вообще обратился к сынам Хета, если поле и пещера принадлежали Эфрону.</p>\n<p>В стихе 4 Авраам говорит им:</p>\n<p>«Пришелец и поселенец я среди вас».</p>\n<p>Раши уже обращает внимание на это выражение, поскольку слова «пришелец» (גר) и «поселенец» (תושב) как будто противоречат друг другу.</p>\n<p>Пришелец — это человек, который не является постоянным жителем данного места, а лишь находится там временно. Поселенец же — это тот, кто обосновался и постоянно проживает в этом месте.</p>\n<p>Кроме того, в продолжении стиха мы видим, что Авраам просит у них две вещи:</p>\n<p>«Дайте мне владение для погребения».</p>\n<p>«Чтобы я похоронил умершую мою».</p>\n<p>Что означают эти две просьбы? Почему Авраам не ограничился одной?</p>\n<p>Далее, в стихах 5–6, сыны Хета отвечают ему:</p>\n<p>«Выслушай нас, господин мой! Ты — князь Б-жий среди нас. В лучшем из наших погребальных мест похорони свою умершую; никто из нас не откажет тебе в своём погребальном месте, чтобы ты мог похоронить свою умершую».</p>\n<p>Иными словами, Авраам может похоронить Сару там, где пожелает, причём в самом лучшем месте.</p>\n<p>На первый взгляд, после такого ответа все его просьбы уже были удовлетворены, и он мог идти хоронить Сару.</p>\n<p>Однако мы видим, что Авраам не заканчивает переговоры и снова обращается к ним (стихи 7–9):</p>\n<p>«И поднялся Авраам, и поклонился народу земли, сынам Хета. И говорил с ними, сказав: если есть у вас желание, чтобы я похоронил умершую мою, выслушайте меня и попросите за меня Эфрона, сына Цохара…»</p>\n<p>Почему ему понадобилось просить ещё раз?</p>\n<p>Обратим также внимание на формулировку его просьбы:</p>\n<p>«И пусть даст мне пещеру Махпела…»</p>\n<p>Авраам просит именно пещеру, а не поле, на котором она находится.</p>\n<p>Кроме того, в его словах есть кажущееся противоречие: сначала он говорит «пусть даст мне» — выражение, которое подразумевает дарение, подарок. А сразу после этого добавляет: «за полную стоимость», то есть речь уже идёт о покупке, а не о подарке.</p>\n<p>И заканчивает он словами: «пусть передаст мне её» — снова используя выражение, связанное с дарением.</p>\n<p>Далее, в стихе 10, сказано:</p>\n<p>«А Эфрон сидел среди сынов Хета».</p>\n<p>Необходимо объяснить, зачем Тора сообщает нам, где именно находился Эфрон.</p>\n<p>Более того, продолжение стиха гласит:</p>\n<p>«И отвечал Эфрон-хетей Аврааму на уши сынов Хета, перед всеми входившими в ворота его города, говоря…»</p>\n<p>Почему Тора подчёркивает, что Эфрон отвечал в присутствии всех жителей города? Разве каждый человек, продающий поле или участок земли для захоронения, обязан делать это перед всеми жителями города?</p>\n<p>Что же отвечает ему Эфрон (стих 11)?</p>\n<p>«Нет, господин мой, выслушай меня: поле я даю тебе, и пещеру, которая в нём, я даю тебе. На глазах у сынов моего народа я даю её тебе. Похорони свою умершую».</p>\n<p>Авраам просил у него пещеру, а Эфрон отвечает, что готов подарить ему всё поле вместе с пещерой.</p>\n<p>На первый взгляд, после такого предложения переговоры должны были завершиться.</p>\n<p>Однако этого не происходит.</p>\n<p>Авраам обращается к нему в третий раз (стихи 12–13):</p>\n<p>«И поклонился Авраам перед народом земли. И говорил Эфрону на уши народу земли, говоря: если только ты выслушаешь меня, я дам деньги за поле, возьми их у меня, и я похороню там умершую мою».</p>\n<p>Почему Аврааму снова понадобилось просить, если Эфрон уже согласился бесплатно отдать ему и поле, и пещеру?</p>\n<p>Тогда Эфрон отвечает, что хочет получить четыреста шекелей серебра. Авраам платит ему эту сумму.</p>\n<p>После этого сказано (стихи 17–18):</p>\n<p>«И стало поле Эфрона, которое в Махпеле, напротив Мамре, поле и пещера, которая в нём, и все деревья, которые на поле, во всех его пределах вокруг, собственностью Авраама, перед глазами сынов Хета…»</p>\n<p>Затем (стих 19):</p>\n<p>«И после этого похоронил Авраам Сару, жену свою, в пещере поля Махпела…»</p>\n<p>И наконец, в стихе 20 снова говорится:</p>\n<p>«И стало поле и пещера, которая в нём, собственностью Авраама, как владение для погребения, от сынов Хета».</p>\n<p>Необходимо понять: зачем Тора дважды повторяет, что поле стало собственностью Авраама?</p>\n<p>3. Выяснение покупки праведника — подобно исполнению десяти заповедей</p>\n<p>Прежде чем приступить к объяснению этих вопросов, приведём слова Мидраша из нашей главы:</p>\n<p>«Сказал рабби Элазар: сколько чернил было пролито, сколько перьев сломано, чтобы написать о сынах Хета! Десять раз в Торе упоминаются сыны Хета. Десять раз — в соответствии с десятью заповедями. Это учит нас, что каждый, кто тщательно выясняет обстоятельства покупки, совершённой праведником, подобен тому, кто исполняет десять заповедей».</p>\n<p>Эти слова Мидраша вызывают удивление.</p>\n<p>Как такое возможно? Почему изучение покупки, совершённой праведником, то есть изучение истории приобретения Авраамом пещеры для погребения Сары, приравнивается к исполнению десяти заповедей?</p>\n<p>Что особенного в этой истории, что человек, правильно изучающий и выясняющий все обстоятельства этой покупки, считается исполняющим десять заповедей?</p>\n<p>Говорится от имени Виленского Гаона (приведено в книге «Коль Арье»), что он объясняет, почему Авраам оплакивал Сару лишь немного, из-за чего буква כ в слове «ולבכתה» написана маленькой.</p>\n<p>Авраам боялся, что люди могут подумать, будто он сожалеет о произошедшем во время Акеды.</p>\n<p>Объясним эту мысль.</p>\n<p>Раши объясняет, что смерть Сары была связана с событием Акедат Ицхак — принесением Ицхака в жертву.</p>\n<p>Вот его слова:</p>\n<p>«Чтобы оплакивать Сару и плакать о ней. Смерть Сары расположена в Торе сразу после истории Акеды, потому что, услышав весть о том, что её сын был предназначен для заклания и едва не был принесён в жертву, её душа покинула её».</p>\n<p>Если бы Авраам много плакал, люди могли бы ошибочно подумать, что он сожалеет о своём прежнем поступке, то есть раскаивается в том, что произошло во время Акеды.</p>\n<p>Именно поэтому он плакал лишь немного.</p>\n<p>Но в этом есть и более глубокий смысл.</p>\n<p>Как мы уже объясняли в беседе на прошлой неделе, Авраам посвятил всю свою жизнь освящению Имени Всевышнего.</p>\n<p>Ради этой цели он противостоял всему миру. Как говорится в Мидраше: Авраам стоял на одной стороне, а весь остальной мир — на другой.</p>\n<p>Он также выдержал все испытания, посланные ему Всевышним.</p>\n<p>Если бы Авраам оплакивал Сару так сильно, как, казалось бы, подобало, окружающие могли бы подумать, что он сожалеет о произошедшем во время Акеды.</p>\n<p>То есть люди могли бы решить, что он раскаивается в том, что согласился исполнить повеление Всевышнего.</p>\n<p>Ведь именно вследствие Акеды он потерял свою жену Сару.</p>\n<p>Таким образом, могло бы быть ослаблено великое освящение Имени Всевышнего, которое произошло благодаря Акеде. Кроме того, Авраам мог бы потерять заслугу, приобретённую им благодаря тому, что он выдержал это испытание.</p>\n<p>Именно поэтому мы каждый день молимся в вечерней молитве:</p>\n<p>«И удали сатану от нас спереди и сзади».</p>\n<p>Почему говорится «спереди и сзади»?</p>\n<p>Потому что иногда человек совершает чрезвычайно великое и святое деяние, а после этого дурное начало (йецер hа-ра) подстраивает ему неприятность или тяжёлое испытание.</p>\n<p>В результате человек начинает сожалеть о совершённой заповеди, думая, что она принесла ему лишь потери и страдания.</p>\n<p>Поэтому, чтобы люди не подумали, будто Авраам раскаивается в Акеде, поскольку вследствие этого события он потерял Сару, он плакал лишь немного.</p>\n<p>Когда праматерь Сара покинула этот мир, перед Авраамом открылась особая возможность научить всё человечество идее бессмертия души и существования будущего мира — Олам hа-Ба.</p>\n<p>Именно поэтому он организовал весь процесс приобретения места захоронения в присутствии всех сынов Хета.</p>\n<p>Он хотел публично донести эту идею до всего окружающего мира и тем самым освятить Имя Всевышнего перед многочисленными людьми.</p>\n<p>Напротив, он не хотел, чтобы из-за произошедшего во время Акеды уменьшилось уважение к Имени Всевышнего в глазах окружающих.</p>\n<p>Откуда Авраам узнал о существовании пещеры Махпела?</p>\n<p>Авраам Авину узнал о существовании пещеры Махпела ещё тогда, когда к нему пришли ангелы на третий день после его обрезания.</p>\n<p>На это намекает Бааль а-Турим в комментарии к стиху:</p>\n<p>«И побежал Авраам к скоту…»</p>\n<p>Бааль а-Турим пишет: «И побежал к могиле».</p>\n<p>Слова «בקר» (скот) и «קבר» (могила) состоят из одних и тех же букв, расположенных в разном порядке.</p>\n<p>Такова была история, приведённая в книге «Хесед ле-Авраам» (Эйн Мишпат, Нахар 51) от имени древних мудрецов.</p>\n<p>Когда ангелы пришли к Аврааму, он захотел накормить их тремя языками мяса с горчицей. Для этого ему понадобились три телёнка.</p>\n<p>Авраам взял двух телят и поручил их Ишмаэлю. Когда же он отправился за третьим телёнком, ангел Рафаэль принял облик телёнка.</p>\n<p>Авраам попытался поймать его, но телёнок ускользнул и убежал.</p>\n<p>Авраам побежал за ним, пытаясь догнать его, однако тот продолжал ускользать, пока не достиг входа в пещеру Махпела.</p>\n<p>До этого момента вход в пещеру был закрыт, и никто из людей не знал о её существовании.</p>\n<p>В тот момент вход открылся, Авраам вошёл внутрь и увидел там Адама и Хаву (Еву).</p>\n<p>Он также почувствовал запах Ган Эден — Райского сада.</p>\n<p>Как уже сказано в книге Зоар, в разделе «Рут», Адам и Хава были похоронены у входа в Ган Эден.</p>\n<p>Однако Эфрон не знал, что в пещере, находившейся на краю его поля, покоятся Адам и Хава.</p>\n<p>С его точки зрения, эта пещера была тёмным, непривлекательным и совершенно неценным местом.</p>\n<p>Продолжим разбирать переговоры между Авраамом, сынами Хета и Эфроном согласно комментарию Мальбима.</p>\n<p>Этап 1. Просьба Авраама к сынам Хета</p>\n<p>Существует различие между понятиями «могила» (קבר) и «семейное погребальное владение» (אחוזת קבר).</p>\n<p>Могила (קבר) — это место для захоронения одного человека.</p>\n<p>Семейное погребальное владение (אחוזת קבר) — это участок, предназначенный для захоронения всей семьи.</p>\n<p>Авраам Авину обратился к сынам Хета с просьбой предоставить ему именно семейное погребальное владение, то есть место, где впоследствии могли бы быть похоронены три праотца и их жёны.</p>\n<p>Согласно законам, действовавшим в тех местах, пришелец (גר) мог получить только отдельную могилу, но не семейное погребальное владение. Причина заключалась в том, что пришелец не намеревался постоянно обосновываться там вместе со своей семьёй.</p>\n<p>Постоянный житель (תושב), напротив, не нуждался в специальной просьбе о предоставлении семейного участка, поскольку он уже имел собственную землю и наследственное владение, из которого мог выделить место для семейного захоронения.</p>\n<p>Авраам сказал им примерно следующее:</p>\n<p>«Да, до настоящего времени я был пришельцем в этой стране, у меня не было ни собственного поля, ни земельного владения. Но теперь я хочу стать постоянным жителем, поселиться здесь вместе со своей семьёй. Поэтому прошу вас предоставить мне семейное погребальное владение среди вас, которое будет предназначено для всех членов моей семьи».</p>\n<p>Затем он добавил:</p>\n<p>«И похороню умершую мою перед собой» (ואקברה מתי מלפני).</p>\n<p>Авраам особо подчеркнул слова «перед собой» (מלפני), чтобы объяснить: его душа не обретёт покоя до тех пор, пока он не будет уверен, что это место является семейным погребальным владением для всей его семьи.</p>\n<p>Если же это будет лишь отдельная могила, он будет воспринимать это так, словно не похоронил Сару должным образом.</p>\n<p>Этап 2. Ответ сынов Хета</p>\n<p>Сыны Хета отказали Аврааму в его просьбе. Они не захотели предоставить ему семейное погребальное владение, а согласились дать только отдельное место для захоронения.</p>\n<p>Чтобы иметь возможность отказать ему, они сначала оказали ему большое уважение. Они объяснили, что отказ связан не с недостатком уважения к его личности, а исключительно с действующим законом.</p>\n<p>Они сказали ему:</p>\n<p>«Выслушай нас, господин мой! Ты — князь Б-жий среди нас».</p>\n<p>То есть:</p>\n<p>«Мы очень ценим тебя и хотели бы оказать тебе почёт, но закон не позволяет нам предоставить тебе семейное погребальное владение. Мы можем дать тебе только отдельную могилу».</p>\n<p>При этом они готовы были предоставить ему могилу в любом месте, которое он пожелает:</p>\n<p>«В лучшем из наших погребальных мест похорони свою умершую».</p>\n<p>Более того, даже если кто-то из них уже приобрёл себе место для захоронения, Авраам мог воспользоваться и им:</p>\n<p>«Никто из нас не откажет тебе в своём погребальном месте» (איש ממנו את קברו).</p>\n<p>То есть даже тем местом, которое кто-либо из них приобрёл для себя, он готов уступить Аврааму, чтобы тот мог похор
