онить свою умершую.</p>\n<p>Но получить семейное погребальное владение он не может, поскольку считается пришельцем, а не постоянным жителем.</p>\n<p>Этап 3. Просьба Авраама истолковать закон при согласии Эфрона</p>\n<p>«И поднялся Авраам, и поклонился народу земли, сынам Хета. И говорил с ними, сказав: если есть у вас желание, чтобы я похоронил умершую мою перед собой, выслушайте меня и попросите за меня Эфрона, сына Цохара».</p>\n<p>Авраам сказал им:</p>\n<p>«Вы утверждаете, что хотели бы удовлетворить мою просьбу и предоставить мне семейное погребальное владение, но закон препятствует вам, поскольку я не являюсь постоянным жителем.</p>\n<p>Однако у этого закона могут быть два возможных толкования. Позовите Эфрона, который является судьёй, и пусть он истолкует закон таким образом, чтобы я смог получить семейное погребальное владение».</p>\n<p>В чём заключаются два возможных толкования закона?</p>\n<p>Первое толкование:</p>\n<p>Существует общее постановление, запрещающее передавать земельные владения чужеземцам, поскольку местные жители имеют преимущественное право приобретать землю.</p>\n<p>Если причина закона заключается именно в этом, то запрет распространяется только на продажу, но не на дарение.</p>\n<p>Ведь когда человек собирается продать земельный участок, местный житель имеет преимущественное право его приобрести согласно закону «бар-ме́цра» (בר מצרא) — праву соседнего землевладельца на преимущественную покупку.</p>\n<p>Но если речь идёт о подарке, это правило не действует. Человек вправе распоряжаться своей землёй по собственному усмотрению.</p>\n<p>Нельзя обязать человека подарить свою землю местному жителю, ведь подарок обычно даётся потому, что получатель понравился дарителю или оказал ему какую-либо услугу.</p>\n<p>Второе толкование:</p>\n<p>Возможно, постановление касается именно семейного погребального владения, поскольку местные жители не хотят предоставлять чужеземцу такую большую честь, как отдельное семейное кладбище. Такая привилегия предназначена только для уважаемых людей страны.</p>\n<p>Если причина закона заключается в этом, то запрет распространяется именно на семейное погребальное владение, но не на обычный земельный участок.</p>\n<p>Поскольку существуют два возможных толкования постановления, правитель страны, ответственный за соблюдение государственных законов, имеет право выбрать наиболее подходящее толкование.</p>\n<p>Поэтому Авраам попросил их пригласить Эфрона, правителя и судью этой местности, чтобы тот истолковал закон согласно первому варианту. Тогда Авраам сможет получить пещеру Махпела в качестве семейного погребального владения.</p>\n<p>Именно поэтому Авраам сказал:</p>\n<p>«И пусть даст мне пещеру Махпела».</p>\n<p>То есть пусть Эфрон подарит ему пещеру.</p>\n<p>Тем более что пещера находилась на краю его поля, и основная причина закона, запрещающего продавать земельные владения чужеземцам, здесь не относится к делу: основная часть поля останется у Эфрона, а пещера представляет собой лишь небольшой участок на краю поля.</p>\n<p>Затем Авраам добавил:</p>\n<p>«За полную стоимость пусть передаст её мне».</p>\n<p>Иными словами, между ними лично будет произведён расчёт: Эфрон получит от него полную стоимость пещеры и не понесёт никакого убытка.</p>\n<p>Но перед всем народом эта передача будет оформлена как дарение:</p>\n<p>«Пусть передаст её мне среди вас».</p>\n<p>Таким образом, это не будет противоречить закону, и Авраам сможет получить семейное погребальное владение.</p>\n<p>Этап 4. Ответ Эфрона: истинное толкование закона</p>\n<p>«А Эфрон сидел среди сынов Хета».</p>\n<p>Поскольку Эфрон был судьёй, он находился среди них.</p>\n<p>«И отвечал Эфрон-хетей Аврааму на уши сынов Хета, перед всеми входившими в ворота его города, говоря: нет, господин мой, выслушай меня…»</p>\n<p>Эфрон отвечает Аврааму:</p>\n<p>«То толкование закона, которое ты предложил, будто он существует лишь для обеспечения преимущественного права местных жителей на покупку земли, а значит, дарение разрешено, неверно».</p>\n<p>И даже если предположить, что сыны Хета согласны принять такое толкование, одного их согласия недостаточно.</p>\n<p>Ведь Хеврон — большой город, куда приезжают люди со всех окрестностей. Поэтому закон распространяется не только на жителей самого города, но и на всех, кто приходит через его городские ворота.</p>\n<p>Именно поэтому Тора подчёркивает:</p>\n<p>«Перед всеми входившими в ворота его города».</p>\n<p>Нельзя изменить закон без согласия всех жителей страны.</p>\n<p>Истинное же толкование закона заключается в том, что чужеземцу нельзя предоставлять такую большую честь, как семейное погребальное владение.</p>\n<p>Следовательно, даже в качестве подарка я не могу передать тебе пещеру Махпела.</p>\n<p>Этап 5. Предложение Эфрона Аврааму в соответствии с правильным толкованием закона</p>\n<p>Эфрон предлагает Аврааму другой выход, который соответствует истинному толкованию закона.</p>\n<p>Он говорит:</p>\n<p>«У меня есть другое решение».</p>\n<p>Если я передам тебе только пещеру, всем будет очевидно, что я предоставил тебе семейное погребальное владение. А это противоречит постановлению.</p>\n<p>Поэтому я предлагаю следующее:</p>\n<p>«Поле я даю тебе» — я передам тебе всё поле для обработки, вспашки и посева, поскольку это разрешено законом.</p>\n<p>«И пещеру, которая в нём, я даю тебе» — пещера будет считаться второстепенной частью поля.</p>\n<p>«На глазах у сынов моего народа я даю её тебе» — все жители согласятся с тем, что поле вместе с пещерой принадлежит тебе.</p>\n<p>А после того как оно станет твоим, ты сможешь распоряжаться им по своему усмотрению.</p>\n<p>Однако я разрешаю тебе только:</p>\n<p>«Похорони свою умершую» — одну умершую, но не предоставляю тебе семейное погребальное владение.</p>\n<p>Этап 6. Ответ Авраама Эфрону и решение, позволяющее создать семейное погребальное владение</p>\n<p>«И поклонился Авраам перед народом земли. И говорил Эфрону на уши народу земли, говоря: если только ты выслушаешь меня, я дам деньги за поле, возьми их у меня…»</p>\n<p>Авраам отвечает:</p>\n<p>«Раз ты истолковываешь закон таким образом, что запрет распространяется только на семейное погребальное владение, но не на другие земельные владения, тогда нет необходимости дарить мне поле, предназначенное для земледелия. Я заплачу за него деньги — возьми их у меня».</p>\n<p>В ответе Авраама проявилась также большая мудрость.</p>\n<p>Он понял, что Эфрон намеревается после передачи земли снова воспрепятствовать ему и заявить:</p>\n<p>«Я передал тебе поле только для земледелия, но не для устройства семейного кладбища».</p>\n<p>И если Авраам изменит назначение участка и превратит его в семейное погребальное владение, Эфрон сможет утверждать, что подарок теряет силу, поскольку он изначально не был дан для такой цели.</p>\n<p>Поэтому Авраам настаивает именно на покупке, а не на подарке.</p>\n<p>Ведь согласно принципу:</p>\n<p>«אגב זוזי גמר ומקני» — получая деньги, продавец окончательно принимает решение передать собственность покупателю.</p>\n<p>Таким образом, после совершения полноценной продажи Эфрон уже не сможет отменить сделку.</p>\n<p>Этап 7. Ответ Эфрона Аврааму</p>\n<p>«И отвечал Эфрон Аврааму, говоря ему: господин мой, выслушай меня: земля стоит четыреста шекелей серебра, что это между мной и тобой? А ты похорони свою умершую».</p>\n<p>Эфрон хотел сказать ему две вещи:</p>\n<p>Для двух таких уважаемых людей, как мы с тобой, четыреста шекелей — небольшая сумма, о которой даже не стоит говорить.</p>\n<p>Он также намекает, что даже если Авраам заплатит деньги, здесь не действует принцип «אגב זוזי גמר ומקני» — получения денег, окончательно закрепляющего передачу собственности.</p>\n<p>Ведь по меркам состояния Эфрона эта сумма настолько незначительна, что фактически её можно считать подарком.</p>\n<p>Следовательно, передача земли всё равно будет рассматриваться как дарение, а значит, Авраам сможет лишь похоронить свою умершую:</p>\n<p>«А ты похорони свою умершую».</p>\n<p>Но земля не станет его семейным погребальным владением.</p>\n<p>Этап 8. Покупка земли Авраамом и найденное им решение</p>\n<p>«И услышал Авраам Эфрона, и отвесил Авраам Эфрону четыреста шекелей серебра, ходячих у купцов».</p>\n<p>Авраам понял слова Эфрона:</p>\n<p>«Четыреста шекелей серебра — что это между мной и тобой? А ты похорони свою умершую».</p>\n<p>Он понял, что Эфрон в действительности согласен продать ему землю.</p>\n<p>Однако Авраам заметил, что Эфрон предлагает сначала похоронить умершую, то есть совершить приобретение земли посредством фактического вступления во владение (חזקה), а уже после этого заплатить деньги.</p>\n<p>Но согласно правилам приобретения земли у нееврея порядок должен быть обратным: сначала покупатель передаёт деньги, а затем совершает действие, закрепляющее приобретение земли, либо вступает во владение.</p>\n<p>Если поменять этот порядок, земля не перейдёт в собственность покупателя надлежащим образом.</p>\n<p>Поэтому Авраам сначала передал деньги, а уже потом похоронил Сару.</p>\n<p>Благодаря этому право Эфрона на землю прекратилось.</p>\n<p>Согласно соответствующему закону, если человек передал нееврею деньги за земельный участок, земля становится бесхозной (הפקר), и продавец больше не может предъявлять никаких претензий относительно её стоимости или права собственности.</p>\n<p>Этап 9. Совершение актов приобретения земли</p>\n<p>После того как Авраам передал Эфрону деньги, сказано:</p>\n<p>«И стало поле Эфрона… собственностью Авраама».</p>\n<p>То есть Эфрон передал ему документ о продаже — штар (שטר).</p>\n<p>Таким образом, земля перешла к Аврааму посредством денег и документа.</p>\n<p>В этом документе были указаны границы участка:</p>\n<p>С одной стороны — Махпела.</p>\n<p>С другой стороны — напротив Мамре.</p>\n<p>Также были подробно перечислены все объекты, которые продавались:</p>\n<p>Поле.</p>\n<p>Пещера.</p>\n<p>Все деревья, находившиеся на этом поле.</p>\n<p>Таким образом, продажа земли Аврааму была завершена полноценным актом приобретения.</p>\n<p>Всё это происходило:</p>\n<p>«Перед глазами сынов Хета, перед всеми входившими в ворота его города».</p>\n<p>Никто не возразил против этой сделки.</p>\n<p>Никто также не предъявил претензии на основании закона «бар-ме́цра» — преимущественного права соседнего землевладельца на приобретение участка.</p>\n<p>Этап 10. Погребение Сары, изменение назначения земли и согласие сынов Хета</p>\n<p>«И после этого похоронил Авраам Сару, жену свою, в пещере поля Махпела».</p>\n<p>То есть Авраам выделил этот участок земли для погребения, превратив его из обычного поля в участок, предназначенный для захоронений.</p>\n<p>Поэтому в стихе говорится:</p>\n<p>«Поле Эфрона, которое в Махпеле».</p>\n<p>Этим Тора учит нас, что поле стало второстепенным по отношению к пещере Махпела и предназначалось теперь для погребального владения.</p>\n<p>Кроме того, Авраам изменил название этого места.</p>\n<p>Первоначально оно называлось Кирьят-Арба (קרית ארבע) — по имени четырёх великанов, которые там находились.</p>\n<p>Авраам изменил его название на Хеврон (חברון).</p>\n<p>Это название символизирует соединение супружеских пар, которые были связаны друг с другом при жизни и не расстались даже после смерти.</p>\n<p>Кроме того, оно намекает на будущее соединение тела и души во время грядущего воскресения мёртвых (תחיית המתים).</p>\n<p>И после этого сказано:</p>\n<p>«И стало поле и пещера, которая в нём, собственностью Авраама, как семейное погребальное владение, от сынов Хета».</p>\n<p>То есть все сыны Хета согласились изменить прежнее постановление ради уважения к Аврааму, который теперь стал постоянным жителем среди них.</p>\n<p>Они предоставили ему разрешение выделить приобретённый участок земли под семейное погребальное владение.</p>\n<p>4. Цель Авраама — публично объявить о приобретении поля</p>\n<p>Углубимся в понимание цели, которую преследовал Авраам Авину, публично объявляя о приобретении места погребения Сары.</p>\n<p>Авраам хотел научить весь мир понятию бессмертия души и её продолжения после смерти.</p>\n<p>Сыны Хета, как и весь окружающий мир, считали, что могила — это конец человеческого существования и что после неё ничего не продолжается.</p>\n<p>С их точки зрения, семейное погребальное владение (אחוזת קבר) было лишь вопросом почёта для семьи умершего, но не имело никакого значения для самого умершего.</p>\n<p>Однако Авраам Авину, который так настойчиво боролся за место и расположение могилы, добиваясь того, чтобы там могли быть похоронены все члены его семьи, хотел преподать им важнейший урок:</p>\n<p>Этот мир — лишь место подготовки. После него существует продолжение — воскресение мёртвых (תחיית המתים).</p>\n<p>В книге «אותיות דרבי עקיבא» («Буквы рабби Акивы») приводится описание того, как будет происходить воскресение мёртвых.</p>\n<p>Там написано:</p>\n<p>«И каким образом Святой, благословен Он, оживит умерших в будущем мире? Всевышний возьмёт в руки большой шофар, длина которого составит тысячу локтей по мере локтя самого Святого, благословен Он».</p>\n<p>Попробуем объяснить эти слова.</p>\n<p>Пророк Йешаягу (Исаия), глава 40, стих 12, говорит:</p>\n<p>«Кто измерил воды горстью своей и небеса измерил пядью?»</p>\n<p>В оригинале сказано:</p>\n<p>«ושמים בזרת תכן».</p>\n<p>Из этого следует, что всё небесное пространство измеряется одной пядью (זרת).</p>\n<p>В Талмуде, трактат Эрувин (21а), согласно объяснению Раши, говорится, что пядь (זרת) составляет половину локтя (а по мнению Тосафот — треть локтя).</p>\n<p>Следовательно, один локоть равен двум пядям, то есть двум таким мерам небесного пространства.</p>\n<p>А тысяча локтей — это две тысячи таких небесных мер. Таким образом, мы получаем представление о колоссальных размерах шофара, который будет использован для воскресения мёртвых.</p>\n<p>Продолжение из книги «אותיות דרבי עקיבא»:</p>\n<p>«И затрубит в него, и голос его поднимется от одного края мира до другого».</p>\n<p>Далее описываются семь этапов воскресения мёртвых:</p>\n<p>Первое трубление: весь мир содрогнётся.</p>\n<p>Второе трубление: прах рассеется. То есть когда человек умирает, его тело превращается в прах, и этот прах рассыплется.</p>\n<p>Третье трубление: кости соберутся воедино.</p>\n<p>Четвёртое трубление: части тела согреются.</p>\n<p>Пятое трубление: кожа восстановится и покроет тело.</p>\n<p>Шестое трубление: духи и души вернутся и соединятся со своими телами.</p>\n<p>Седьмое трубление: люди оживут, встанут на ноги и будут одеты в свои одежды.</p>\n<p>На этом воскресение мёртвых будет завершено.</p>\n<p>Авраам хотел научить людей тому, что конечная цель человеческого существования — достичь будущего мира (Олам hа-Ба).</p>\n<p>Именно поэтому пещера называется Махпела (מערת המכפלה) — название, которое связывают с понятием двойственности, дома и верхнего этажа над ним.</p>\n<p>Этот мир подобен нижнему дому, а главное — это верхний этаж, то есть высший мир.</p>\n<p>Пещера находилась «на краю поля» (בקצה השדה), что символизирует конец земного существования человека.</p>\n<p>Авраам приобрёл её «за полную стоимость» (בכסף מלא), чтобы преподать людям ещё один урок: все наши деньги и материальные средства должны быть направлены на то, чтобы в конечном итоге удостоиться духовного возвышения.</p>\n<p>Комментаторы также объясняют слова Авраама:</p>\n<p>«Пришелец и поселенец я среди вас» (גר ותושב אנכי עמכם).</p>\n<p>Его намерение было следующим:</p>\n<p>«В этом мире мы — лишь временные гости, пришельцы. А где же мы будем постоянными жителями? В будущем мире, который и является нашей главной целью».</p>\n<p>В святом Зоаре (часть I, 127б) также приводится объяснение, что четыреста шекелей серебра, которые заплатил Авраам, соответствуют четырёмстам мирам, которыми в будущем удостоятся праведники.</p>\n<p>И это тоже было частью урока, который Авраам хотел преподать людям о том, какая награда ожидает праведников в будущем мире.</p>\n<p>Здесь возникает дополнительный вопрос.</p>\n<p>В Мишне сказано, что в будущем Святой, благословен Он, дарует каждому праведнику триста десять миров, как сказано:</p>\n<p>«Чтобы наделить любящих Меня достоянием» (להנחיל אוהבי יש).</p>\n<p>Это выражение связано с числом 310 миров.</p>\n<p>В главе Пинхас мы уже приводили объяснение этой темы.</p>\n<p>Источник числа 310 миров намеками содержится в имени Иссахара (יששכר), которое можно прочитать как «יש שכר» — «есть награда».</p>\n<p>То есть награда праведников составляет триста десять миров.</p>\n<p>Но Ор hа-Хаим (в комментарии к главе Пинхас) задаёт вопрос: если речь идёт о 310 мирах, почему в стихе написано «יש» (есть), а не «שי» (подарок), ведь именно слово «שי» имеет числовое значение 310?</p>\n<p>Ор hа-Хаим даёт на это удивительное объяснение.</p>\n<p>Известно, что существуют четыре духовных мира, обозначаемые аббревиатурой АБИА (אבי&quot;ע):</p>\n<p>Асия (עשייה).</p>\n<p>Брия (בריאה).</p>\n<p>Йецира (יצירה).</p>\n<p>Ацилут (אצילות).</p>\n<p>Первые три мира содержат по сто миров каждый:</p>\n<p>Сто миров Асии.</p>\n<p>Сто миров Брии.</p>\n<p>Сто миров Йециры.</p>\n<p>Всего получается триста миров.</p>\n<p>Четвёртый мир — Ацилут — представляет собой высший уровень, включающий ещё сто миров.</p>\n<p>При этом десять миров высшего уровня Ацилут превосходят по духовной значимости все триста нижних миров вместе взятые.</p>\n<p>Именно поэтому в стихе написано:</p>\n<p>«להנחיל אוהבי יש».</p>\n<p>Буква «י» (йуд) в слове «יש» символизирует высший уровень, который превосходит по своей значимости всю букву «ש» (шин), символизирующую триста нижних миров.</p>\n<p>Именно этой награды удостаивается праведник.</p>\n<p>Таким образом, в действительности существуют четыреста миров, которыми могут удостоиться совершенные праведники.</p>\n<p>Авраам намекнул людям на эти четыреста миров тем, что заплатил за пещеру четыреста шекелей серебра.</p>\n<p>5. Главная цель — быть пришельцем в этом мире и постоянным жителем в будущем мире</p>\n<p>Теперь мы можем понять слова наших мудрецов о том, что тот, кто занимается изучением сделки, совершённой праведником, подобен человеку, исполнившему десять заповедей.</p>\n<p>Объяснение заключается в следующем.</p>\n<p>Как мы уже выяснили, изучение покупки, совершённой праведником, учит нас одному из основополагающих принципов веры — вере в бессмертие души и вере в вознаграждение и наказание (שכר ועונש).</p>\n<p>Именно поэтому важность изучения этой истории сопоставима с десятью заповедями.</p>\n<p>Теперь мы также можем понять, почему погребение Сары не считается одним из испытаний Авраама Авину.</p>\n<p>Как уже было объяснено, эта история стала для Авраама своего рода путём, возможностью исполнить свою миссию в этом мире — распространить веру во Всевышнего и научить человечество духовным истинам.</p>\n<p>Это событие стало для него прекрасной возможностью добиться своей цели.</p>\n<p>То, чему Авраам хотел научить весь мир, на самом деле определяет направление и главную цель каждого еврея в целом и каждого изучающего Тору в частности.</p>\n<p>Перед каждым человеком, принимающим любое решение, стоит один и тот же вопрос:</p>\n<p>Какова моя главная цель — будущий мир или этот мир?</p>\n<p>Являюсь ли я постоянным жителем этого мира или лишь временным гостем?</p>\n<p>И это относится даже к самым маленьким решениям повседневной жизни.</p>\n<p>Например, молодой человек ищет себе хевруту — товарища для совместного изучения Торы.</p>\n<p>Какими соображениями он должен руководствоваться при выборе?</p>\n<p>С кем я буду лучше учиться?</p>\n<p>С кем я смогу глубже понять изучаемую сугию?</p>\n<p>Или с кем мне будет приятнее проводить время, с кем будет веселее и комфортнее?</p>\n<p>То же самое касается выбора соседей по комнате в большой ешиве, поиска будущей супруги (шидуха), решения о том, чем заниматься в свободное время, и определения своих жизненных стремлений.</p>\n<p>И так далее, и тому подобное.</p>\n<p>Человек должен знать и глубоко усвоить этот основополагающий принцип:</p>\n<p>В этом мире мы подобны пришельцам (גר), а нашим постоянным местом жительства (תושב) является будущий мир.</p>\n<p>Пусть удостоимся мы все быть в этом мире лишь временными гостями, а в будущем мире — постоянными жителями.</p>\n<p>И, как объясняют комментаторы название нашей недельной главы — «Хаей Сара» (Жизнь Сары), возникает вопрос:</p>\n<p>Почему глава называется «Жизнь Сары», если фактически Тора рассказывает в её начале не о жизни Сары, а о её погребении после смерти?</p>\n<p>Ответ заключается в том, что Тора хочет научить нас великой истине:</p>\n<p>Погребение — это не конец жизни, а начало вечной жизни. Это завершение периода, когда человек был пришельцем в этом мире, и начало его существования в качестве постоянного жителя будущего мира.</p>"},{"title":"Толдот","body":"<h2>Глава 4</h2>\n<p>Недельная глава «Толдот» (תולדות)</p>\n<p>בס&quot;ד — С Божьей помощью</p>\n<p>Еженедельная беседа нашего учителя, главы ешивы, שליט&quot;א</p>\n<p>На тему: «Борьба между Ицхаком и Яаковом — с тех времён и на протяжении всех поколений»</p>\n<p>С позволения уважаемых великих раввинов и всех дорогих и горячо любимых учеников ешивы.</p>\n<p>В недельной главе «Толдот» мы на протяжении всей главы изучаем противостояние между Яаковом и Эсавом. Кульминацией этого противостояния становится история с благословениями: Ицхак хотел благословить Эсава, однако Яаков хитростью получил эти благословения.</p>\n<p>Это противостояние имеет огромное значение и продолжается вплоть до наших дней.</p>\n<p>Постараемся, с Божьей помощью, объяснить сущность этой борьбы и понять, какие уроки мы можем извлечь из неё для всех последующих поколений.</p>\n<h2>А. Вопросы</h2>\n<p>1. Почему Ицхак хотел благословить Эсава?</p>\n<p>Первый вопрос, который возникает сам собой: почему Ицхак хотел благословить именно Эсава?</p>\n<p>Разве он не знал, что Эсав был «человеком, искусным в охоте», а Яаков — «человеком цельным, живущим в шатрах» (Берешит 25:27)?</p>\n<p>Ведь каждый отец знает своих детей и особенности их характера. Тем более что речь шла не о маленьких детях: им было уже по шестьдесят три года! Несомненно, Ицхак прекрасно знал обоих сыновей.</p>\n<p>2. Почему Ривка прибегла к обману?</p>\n<p>Почему Ривка устроила всю эту хитрость, чтобы благословения достались Яакову?</p>\n<p>Почему она просто не попросила Ицхака благословить также и Яакова, чтобы оба сына получили благословения?</p>\n<p>Ведь мы видим, что Яаков, перед своей смертью, благословил всех своих сыновей, а также Менаше и Эфраима.</p>\n<p>И благословение одного вовсе не противоречит благословению другого.</p>\n<p>3. Какую пользу Яаков мог получить от благословения, добытого обманом?</p>\n<p>Необходимо также понять: какую пользу могло принести Яакову то, что он, по сути, обманул Ицхака и получил благословения вместо Эсава?</p>\n<p>Ведь если Ицхак на самом деле хотел благословить не Яакова, а Эсава, то почему эти благословения вообще должны были распространиться на Яакова?</p>\n<p>4. Почему Всевышний допустил, чтобы всё произошло именно таким образом?</p>\n<p>Если в действительности именно Яаков был достоин получить благословения, почему Небеса устроили всю эту историю таким сложным образом?</p>\n<p>Почему Ицхак просто не получил откровение свыше, что благословить следует Яакова, а не Эсава?</p>\n<p>5. Почему Яаков боялся прикосновения, но не боялся, что отец узнает его по голосу?</p>\n<p>Яаков опасался, что Ицхак поймёт, что перед ним Яаков, а не Эсав, и сказал:</p>\n<p>«Может быть, ощупает меня отец мой» (Берешит 27:12).</p>\n<p>На первый взгляд это удивительно: почему Яаков не боялся, что Ицхак узнает его по голосу?</p>\n<p>Ведь далее мы действительно видим, что Ицхак сказал:</p>\n<p>«Голос — голос Яакова, а руки — руки Эсава» (Берешит 27:22).</p>\n<p>Почему же именно этого Яаков не опасался?</p>\n<p>6. Как Ривка могла взять проклятие Яакова на себя?</p>\n<p>Когда Яаков говорит Ривке, что боится разоблачения и что вместо благословения получит проклятие:</p>\n<p>«И навлеку на себя проклятие, а не благословение» (Берешит 27:12),</p>\n<p>Ривка отвечает ему:</p>\n<p>«На мне твоё проклятие, сын мой» (Берешит 27:13).</p>\n<p>Но как Ривка могла взять проклятие на себя, если бы Ицхак, не дай Бог, проклял Яакова?</p>\n<p>Разве проклятие может переходить от одного человека к другому?</p>\n<p>7. В чём заключались сомнения Ицхака и почему в конце концов он признал благословения Яакова?</p>\n<p>Если внимательно проследить за развитием событий, можно заметить, что Ицхак очень сомневался, следует ли ему благословлять того, кто стоял перед ним.</p>\n<p>Тем не менее в итоге он благословил его.</p>\n<p>А когда пришёл Эсав и выяснилось, что благословения получил Яаков, Ицхак сказал:</p>\n<p>«И он будет благословен» (Берешит 27:33).</p>\n<p>Необходимо понять: в чём именно заключались сомнения Ицхака? И почему в конечном итоге он решил, что благословения останутся за Яаковом?</p>\n<p>8. Почему Тора подчёркивает, что Эсав пришёл именно в тот момент, когда Яаков вышел?</p>\n<p>Тора рассказывает:</p>\n<p>«И было, как только вышел Яаков от лица Ицхака, отца своего, Эсав, брат его, пришёл со своей охоты» (Берешит 27:30).</p>\n<p>Для чего Тора специально подчёркивает, что Эсав пришёл именно в тот момент, когда Яаков только что вышел?</p>\n<p>Очевидно, эта подробность приведена не случайно.</p>\n<p>По всей видимости, именно так устроило Божественное Провидение.</p>\n<p>Но необходимо понять — с какой целью?</p>\n<p>9. В чём смысл продолжительного разговора между Ицхаком и Эсавом?</p>\n<p>После того как Эсав узнал, что Ицхак благословил Яакова, между ними происходит целый разговор.</p>\n<p>Сначала Эсав говорит:</p>\n<p>«Благослови и меня, отец мой!» (Берешит 27:34).</p>\n<p>Ицхак отвечает:</p>\n<p>«Пришёл брат твой с хитростью и взял твоё благословение» (Берешит 27:35).</p>\n<p>Тогда Эсав восклицает:</p>\n<p>«Не потому ли назван он Яаковом, что обошёл меня уже дважды? Моё первородство он взял, и вот теперь взял моё благословение!» (Берешит 27:36).</p>\n<p>Здесь необходимо понять: где мы видим, что Яаков дважды обманул Эсава?</p>\n<p>Затем Эсав продолжает:</p>\n<p>«Не оставил ли ты для меня благословения?» (Берешит 27:36).</p>\n<p>Ицхак отвечает ему:</p>\n<p>«Вот, господином поставил я его над тобой... Что же теперь могу сделать для тебя, сын мой?» (Берешит 27:37).</p>\n<p>После этого Эсав снова обращается к отцу:</p>\n<p>«Неужели одно только благословение есть у тебя, отец мой?» (Берешит 27:38).</p>\n<p>Весь этот разговор требует объяснения.</p>\n<p>Почему Эсав трижды просит отца благословить его? В чём заключается смысл этого продолжительного диалога?</p>\n<p>10. Почему Эсав заплакал и почему Ицхак благословил его только материальными благами?</p>\n<p>После завершения этого разговора Тора говорит:</p>\n<p>«И возвысил Эсав голос свой, и заплакал» (Берешит 27:38).</p>\n<p>Затем сказано:</p>\n<p>«И ответил Ицхак, отец его, и сказал ему: вот, от тучных земель будет место твоего обитания и от росы небесной свыше. И мечом своим будешь жить, и брату своему будешь служить...» (Берешит 27:39–40).</p>\n<p>Таким образом, Ицхак благословил Эсава материальными благами.</p>\n<p>Здесь возникают три вопроса.</p>\n<p>Первый вопрос. Зачем понадобился весь этот продолжительный разговор?</p>\n<p>Почему Ицхак не благословил Эсава этими благословениями сразу? Ведь он мог бы успокоить сына и тем самым завершить всю историю.</p>\n<p>Второй вопрос. Почему Эсав так сильно плакал?</p>\n<p>Ведь Эсав не был настолько большим праведником, чтобы придавать благословениям столь огромное значение.</p>\n<p>Почему же его так сильно волновало то, что отец не благословил его?</p>\n<p>Третий вопрос. Почему Ицхак дал Эсаву исключительно материальные благословения?</p>\n<p>Почему он не благословил его хотя бы некоторыми духовными благами, чтобы и Эсав смог удостоиться определённого духовного роста?</p>\n<p>11. Почему Яакову пришлось немедленно бежать, если Эсав собирался убить его только после смерти Ицхака?</p>\n<p>После всех этих событий Ривка говорит Яакову:</p>\n<p>«Вот, Эсав, брат твой, утешается мыслью о том, чтобы убить тебя. А теперь, сын мой, послушайся моего голоса: встань, беги...» (Берешит 27:42–43).</p>\n<p>На первый взгляд здесь возникает огромное недоумение.</p>\n<p>Ведь Эсав сказал:</p>\n<p>«Приблизятся дни траура по отцу моему, и тогда я убью Яакова, брата моего» (Берешит 27:41).</p>\n<p>То есть Эсав собирался убить Яакова только после смерти Ицхака.</p>\n<p>Но ведь Ицхак прожил после этого ещё много лет!</p>\n<p>Посмотрим на хронологию событий.</p>\n<p>Когда родились Яаков и Эсав, Ицхаку было шестьдесят лет.</p>\n<p>Во время истории с благословениями Яакову и Эсаву было по шестьдесят три года.</p>\n<p>Следовательно, самому Ицхаку в тот момент было сто двадцать три года.</p>\n<p>А умер Ицхак в возрасте ста восьмидесяти лет.</p>\n<p>Таким образом, до его смерти оставалось ещё пятьдесят семь лет!</p>\n<p>Почему же Яакову понадобилось бежать немедленно?</p>\n<p>Ведь согласно словам самого Эсава, опасность должна была возникнуть лишь после смерти Ицхака, то есть спустя много десятилетий.</p>\n<h2>Б. Цель сотворения мира — праведники и служители Всевышнего</h2>\n<p>Для понимания этого вопроса сначала изложим великий принцип, который разъясняется в трудах Мальбима. Этот принцип является основой и ключом к пониманию благословений, которыми Ицхак благословил своих сыновей.</p>\n<p>Цель сотворения мира — ради праведников, которые служат Всевышнему и находятся в постоянной близости к Нему. Они являются вместилищем Божественного присутствия (Шхины). А весь остальной мир был сотворён лишь для того, чтобы служить им и обеспечивать их потребности.</p>\n<p>Об этом сказал Шломо, мудрейший из всех людей, в конце книги Коэлет:</p>\n<p>«Бойся Бога и соблюдай Его заповеди, ибо в этом — весь человек» (Коэлет 12:13).</p>\n<p>А мудрецы в трактате Брахот (6б) объяснили:</p>\n<p>«Весь мир был сотворён лишь для того, чтобы быть окружением такого человека».</p>\n<p>То есть именно эти люди являются главными, и всё остальное существует вокруг них.</p>\n<p>Начало этому было положено нашим праотцом Авраамом, которого избрал Сам Всевышний. От него произошёл избранный народ.</p>\n<p>А внутри избранного народа есть праведники, которые являются избранными среди народа Израиля. Весь народ Израиля и весь мир были сотворены для того, чтобы служить им и обеспечивать их потребности.</p>\n<p>Ведь для существования мира необходимы люди, которые будут сеять, собирать урожай и заниматься другими необходимыми делами, а также обеспечивать праведников всем необходимым.</p>\n<p>И Всевышний избрал среди всего народа Израиля колено Леви, о котором сказано:</p>\n<p>«Ибо отделил вас Господь от общины Израиля» (Бемидбар 16:9).</p>\n<p>Они были избраны для особой близости к Всевышнему.</p>\n<p>То есть колено Леви посвящено Всевышнему, и поэтому у него нет собственного земельного удела в Земле Израиля, а весь народ Израиля обеспечивает его потребности.</p>\n<p>Возможно, для наглядного объяснения этого принципа можно привести пример дерева.</p>\n<p>У дерева есть корни, ствол, ветви, листья, кожура и плоды.</p>\n<p>Совершенно очевидно, что главная цель существования дерева — это его плоды.</p>\n<p>Всё остальное существует ради плодов и способствует их росту. При этом без любого из этих элементов плод не смог бы существовать.</p>\n<p>Точно так же праведники и служители Всевышнего являются плодами, а все остальные находятся вокруг них.</p>\n<p>И здесь тоже существуют различные степени близости к плоду.</p>\n<p>Например, кожура непосредственно окружает плод, ветви удерживают его, а затем идут листья, ствол и корни.</p>\n<h2>В. Благословение Авраама — его избранному потомству</h2>\n<p>Наш праотец Авраам, избранный быть служителем Всевышнего и вместилищем Божественного присутствия, удостоился получить «Благословение Авраама».</p>\n<p>Речь идёт о благословениях, которые даровал ему Сам Всевышний и которые продолжаются в его потомках после него.</p>\n<p>Эти благословения передаются не посредством того, что Авраам благословляет своих сыновей или совершает какие-либо подобные действия.</p>\n<p>Они продолжаются благодаря тому, что его потомки следуют его путём, остаются святыми и посвящёнными Всевышнему.</p>\n<p>Именно тогда благословение продолжает пребывать на них.</p>\n<p>Но если они не посвящены Всевышнему, благословение на них не распространяется.</p>\n<p>Для того чтобы последующие поколения оставались святыми, необходимо, чтобы и брачные союзы заключались исключительно с женщинами, которые также обладают святостью.</p>\n<p>Но если следующее поколение рождается от женщин, которые не обладают святостью и не следуют правильному пути, то такое потомство уже не будет продолжением благословения Авраама, данного ему и его потомкам.</p>\n<p>И их потомки не будут считаться избранным народом.</p>\n<p>Именно поэтому непосредственно перед историей благословений Яакова Тора рассказывает:</p>\n<p>«И было Эсаву сорок лет, и взял он в жёны Йеудит, дочь Беэри-хеттеянина, и Басмат, дочь Элона-хеттеянина. И были они огорчением духа для Ицхака и Ривки» (Берешит 26:34–35).</p>\n<p>Этот отрывок является вступлением ко всей истории благословений.</p>\n<p>Когда Ицхак увидел, каких женщин взял себе в жёны Эсав, он понял, что из потомства Эсава уже не произойдёт продолжение избранного народа.</p>\n<p>Его сыновья и последующие потомки уже не будут святыми и посвящёнными Всевышнему, а потому «Благословение Авраама» не сможет распространяться на них.</p>\n<p>Именно поэтому Ицхаку необходимо было благословить Эсава.</p>\n<p>Однако «Благословение Авраама», которое является благословением Будущего мира, будет принадлежать потомству Яакова.</p>\n<p>А теперь перейдём к объяснению самой истории благословений.</p>\n<h2>Г. Намерение Ицхака — предназначение Эсава помогать Яакову</h2>\n<p>Когда Ицхак увидел, что Эсав взял себе в жёны дочерей Кнаана, он понял, что продолжение избранного потомства будет происходить через Яакова, который посвятил себя жизни в шатрах и изучению Торы, а также приобрёл право первородства.</p>\n<p>Ицхак хотел спасти Эсава и сделать так, чтобы тот не пошёл по пути погибели.</p>\n<p>Поэтому он задумал устроить всё таким образом, чтобы это принесло пользу обоим сыновьям.</p>\n<p>Его замысел заключался в том, что потомки Яакова будут заниматься Торой и духовным постижением, а Эсав получит благословение этого мира — богатство и имущество — и будет обеспечивать все потребности Яакова, подобно кожуре, которая защищает плод.</p>\n<p>Именно поэтому Ицхак хотел благословить Эсава, чтобы у него была возможность помогать Яакову и защищать его потомков от любых врагов.</p>\n<p>Благодаря этому у Эсава появится заслуга, которая позволит ему существовать.</p>\n<p>Это в определённом смысле подобно тому, как остальные колена Израиля обеспечивают пропитание колена Леви.</p>\n<p>Для этого Ицхак позвал Эсава и велел ему отправиться на охоту, приготовить вкусные блюда и принести их ему.</p>\n<p>Смысл этого указания очень глубок, и здесь не место подробно его разбирать.</p>\n<p>Главная мысль заключается в том, что благодаря исполнению заповеди почитания отца, которую совершит Эсав, на Ицхака снизойдёт пророческое вдохновение, и он сможет благословить его.</p>\n<p>[Мальбим подробно объясняет этот вопрос, и желающий может обратиться к его комментарию.]</p>\n<p>Однако наша праматерь Ривка не согласилась с Ицхаком.</p>\n<p>Она хорошо знала нечестивость Эсава и дурные свойства его характера.</p>\n<p>Она понимала, что он не только не станет кожурой, защищающей плод, но и богатство, которое отец передаст ему своим благословением, в конечном итоге будет использовано во зло — как самому Эсаву, так и Яакову.</p>\n<p>Поэтому Ривка хотела, чтобы Яаков получил также благословение этого мира — богатство и власть, — и удостоился «двух столов», то есть как духовных, так и материальных благ.</p>\n<p>Кроме того, она знала из пророчества, полученного ещё во время беременности Яаковом и Эсавом:</p>\n<p>«И старший будет служить младшему» (Берешит 25:23).</p>\n<p>Это означало, что Эсав, будучи первенцем, должен служить Яакову и находиться в его подчинении.</p>\n<p>Богатство и имущество должны принадлежать Яакову, а не так, чтобы Эсав был самостоятельным господином, от которого зависел бы Яаков.</p>\n<p>Когда Ривка увидела, что Ицхак уже отправил Эсава на охоту, у неё не оставалось времени объяснить ему всё это и убедить изменить своё решение.</p>\n<p>Поэтому она решила действовать хитростью, позвала Яакова и объяснила ему, каким образом он должен получить благословения для себя.</p>\n<p>Однако наш праотец Яаков опасался, что отец обнаружит обман, и сказал:</p>\n<p>«Может быть, ощупает меня отец мой» (Берешит 27:12).</p>\n<p>Именно этого он боялся больше всего.</p>\n<p>Дело в том, что хотя голоса братьев и отличались, всё же их можно было перепутать, поскольку они были братьями.</p>\n<p>Но в отношении телесных особенностей они совершенно отличались друг от друга.</p>\n<p>Эсав был необычайно волосатым человеком, не похожим на других людей, — всё его тело было словно покрыто волосяным плащом.</p>\n<p>А Яаков, напротив, был совершенно гладким, что также отличало его от остальных людей: на его теле вообще не было волос.</p>\n<p>Поэтому в этом отношении перепутать их было невозможно.</p>\n<p>Яаков рассуждал следующим образом.</p>\n<p>Сейчас у него по крайней мере есть благословение Будущего мира.</p>\n<p>Но если отец ощупает его и поймёт, что перед ним Яаков, тогда:</p>\n<p>«И буду я в его глазах подобен обманщику» (Берешит 27:12).</p>\n<p>Смысл этих слов заключается в следующем.</p>\n<p>По мнению Ицхака, благословения этого мира и Будущего мира не могут одновременно принадлежать одному человеку.</p>\n<p>Поэтому, когда он увидит, что Яаков стремится получить блага этого мира, то решит, что тот пренебрегает благословением Будущего мира.</p>\n<p>В результате Яаков потеряет и то и другое.</p>\n<p>«И навлеку на себя проклятие» — то есть отец не только не благословит его материальными благами этого мира, но ещё и проклянёт, чтобы у него не было ни богатства, ни каких-либо других желанных благ этого мира.</p>\n<p>И даже если Яаков захочет самостоятельно добиться материального благополучия, он не сможет этого сделать из-за проклятия отца.</p>\n<p>«А не благословение» — то есть он потеряет также благословение Будущего мира, поскольку Ицхак сочтёт его человеком, который уклоняется от пути Всевышнего.</p>\n<p>На это Ривка ответила ему:</p>\n<p>«На мне твоё проклятие, сын мой» (Берешит 27:13).</p>\n<p>Смысл её слов заключался в следующем.</p>\n<p>Если Ицхак раскроет обман, Ривка скажет ему, что именно она послала Яакова, и тогда Ицхак уже не будет сердиться на сына.</p>\n<p>Кроме того, она расскажет Ицхаку о пророчестве, которое получила:</p>\n<p>«И старший будет служить младшему».</p>\n<p>Из этого следует, что именно Яаков должен получить также благословение этого мира, а власть должна принадлежать ему, а не Эсаву.</p>\n<p>Ривка приготовила вкусные блюда, Яаков надел одежды Эсава и пришёл к Ицхаку.</p>\n<p>«И сказал: отец мой! И сказал тот: вот я, кто ты, сын мой? И сказал Яаков отцу своему: я — Эсав, первенец твой. Я сделал, как ты говорил мне. Встань же, сядь и поешь от моей добычи, чтобы благословила меня душа твоя» (Берешит 27:18–19).</p>\n<p>Необходимо обратить внимание на различие в словах Яакова и Эсава.</p>\n<p>Яаков сказал:</p>\n<p>«Я — Эсав, первенец твой».</p>\n<p>А Эсав впоследствии сказал:</p>\n<p>«Сын твой, первенец твой, Эсав» (Берешит 27:32).</p>\n<p>Как известно, человеку свойственно ставить в начале фразы то, что он считает наиболее важным.</p>\n<p>Для Яакова тот факт, что он является первенцем, уже не представлял ничего нового, поскольку он приобрёл право первородства.</p>\n<p>Поэтому смысл слов Яакова был следующим:</p>\n<p>«Ведь ты хочешь благословить первенца, которым считаешь Эсава. Но я теперь словно Эсав, твой первенец, поскольку купил у него первородство».</p>\n<p>У Эсава же всё было наоборот.</p>\n<p>То, что его зовут Эсав, не представляло никакой новости, поскольку это было его имя.</p>\n<p>Но он хотел подчеркнуть именно то, что он является первенцем, и тем самым отрицал действительность продажи первородства.</p>\n<p>Поэтому он и поставил эти слова в начало:</p>\n<p>«Сын твой, первенец твой, Эсав».</p>\n<p>Далее сказано:</p>\n<p>«И сказал Ицхак сыну своему: как это ты так быстро нашёл, сын мой?» (Берешит 27:20).</p>\n<p>То есть Ицхак спрашивал:</p>\n<p>«Почему ты так быстро вернулся? Ведь я велел тебе выйти в поле именно для того, чтобы ты потрудился и приобрёл заслугу исполнения заповеди почитания отца, благодаря которой я смогу тебя благословить».</p>\n<p>На это Яаков ответил:</p>\n<p>«Потому что Господь, Бог твой, послал мне удачу» (Берешит 27:20).</p>\n<p>С самого начала Ицхак сомневался, не Яаков ли стоит перед ним, поскольку голос был похож на голос Яакова.</p>\n<p>Но теперь, когда стоявший перед ним человек заговорил словами богобоязненности и веры, упомянув о Божественной помощи, которой удостоился, — словами, которых Ицхак уже много лет не слышал от Эсава, — подозрение, что перед ним именно Яаков, стало ещё сильнее.</p>\n<p>Поэтому:</p>\n<p>«И сказал Ицхак Яакову: подойди же, и я ощупаю тебя, сын мой, ты ли это, сын мой Эсав, или нет» (Берешит 27:21).</p>\n<p>Он хотел окончательно удостовериться в этом посредством прикосновения.</p>\n<p>И далее сказано:</p>\n<p>«И подошёл Яаков к Ицхаку, отцу своему, и тот ощупал его и сказал: голос — голос Яакова, а руки — руки Эсава. И не узнал его, потому что руки его были волосаты, как руки Эсава, брата его, и благословил его» (Берешит 27:22–23).</p>\n<p>После всех этих проверок Ицхак согласился благословить его.</p>\n<p>Он велел ему принести добычу, чтобы поесть от неё:</p>\n<p>«Чтобы благословила тебя душа моя» (Берешит 27:25).</p>\n<p>То есть для того, чтобы благословению было на что распространиться.</p>\n<p>В словах наших мудрецов уже приводится, что всё это происходило в первый день Песаха.</p>\n<p>Два козлёнка соответствовали пасхальной жертве и праздничной жертве «Хагига», а вино соответствовало вину, которое возливали на жертвенник.</p>\n<p>Ицхак ощутил в этих козлятах все вкусы, существующие в мире.</p>\n<p>После того как Ицхак поел, Тора говорит:</p>\n<p>«И подошёл он, и поцеловал его. И почувствовал он запах одежд его, и благословил его, и сказал: смотри, запах сына моего подобен запаху поля, которое благословил Господь» (Берешит 27:27).</p>\n<p>Смысл запаха одежд заключается в следующем.</p>\n<p>Одежды символизируют внешнюю сторону человека.</p>\n<p>Сам человек — это его внутренняя, духовная сущность, а одежда представляет собой внешнюю оболочку.</p>\n<p>Когда Ицхак почувствовал от одежд, то есть от внешней стороны, благоухание Ган Эдена — Райского сада, он понял, что даже во внешнем может присутствовать духовное благоухание.</p>\n<p>Иными словами, даже материальные благословения содержат в себе духовность.</p>\n<p>Ведь благодаря материальным благам можно исполнить множество заповедей и тем самым превратить материальное в духовное.</p>\n<p>Например, посредством цдаки — помощи нуждающимся, гмилут хасадим — добрых дел и помощи другим людям, а также материальной поддержки изучения Торы.</p>\n<p>Тогда Ицхак сказал:</p>\n<p>«Смотри, запах сына моего подобен запаху поля».</p>\n<p>В словах наших мудрецов, согласно одному из объяснений, приводится, что речь шла о дереве этрога.</p>\n<p>Особенность этого дерева заключается в том, что вкус его древесины подобен вкусу его плода.</p>\n<p>Это означает, что даже листья и само дерево, представляющие собой внешнюю часть по отношению к главному — плоду, — также обладают духовным содержанием.</p>\n<p>И тогда Ицхак окончательно согласился благословить Яакова всеми благословениями.</p>\n<p>И он благословил его словами:</p>\n<p>«И даст тебе Бог...» (Берешит 27:28),</p>\n<p>даровав ему благословения богатства, силы и власти.</p>\n<h2>Д. Осознание Ицхаком того, что он благословил Яакова по воле Всевышнего, и его согласие с этими благословениями</h2>\n<p>После того как Ицхак благословил Яакова, Тора говорит:</p>\n<p>«И было, как только вышел Яаков от лица Ицхака, отца своего, Эсав, брат его, пришёл со своей охоты» (Берешит 27:30).</p>\n<p>С Небес было устроено так, чтобы Эсав пришёл именно в тот момент, когда Ицхак закончил благословлять Яакова.</p>\n<p>Ведь если бы Эсав пришёл во время благословения, он помешал бы Яакову получить его.</p>\n<p>Поэтому свыше было устроено, чтобы он появился сразу после завершения благословения, — для того чтобы Ицхак узнал, что благословения получил Яаков, а не Эсав, ещё в пределах времени, называемого «тох кдей дибур» (время, необходимое для произнесения короткой фразы).</p>\n<p>И тогда Ицхак согласится с этим и скажет:</p>\n<p>«И он будет благословен» (Берешит 27:33).</p>\n<p>Когда Ицхак услышал, что теперь пришёл Эсав, сказано:</p>\n<p>«И вострепетал Ицхак великим трепетом чрезвычайно» (Берешит 27:33).</p>\n<p>После этого он задал семь вопросов:</p>\n<p>«Кто?», «Где же он?», «Тот, кто добыл дичь?», «И принёс мне?», «И я ел от всего?», «Прежде чем ты пришёл?», «И я благословил его?»</p>\n<p>А затем сказал:</p>\n<p>«И он будет благословен».</p>\n<p>Объяснение этих семи вопросов следующее.</p>\n<p>1. «Кто?» — Кто же был тем человеком, который пришёл и получил благословения?</p>\n<p>2. «Где же он?» — Почему он внезапно исчез и неизвестно, куда ушёл?</p>\n<p>3. «Тот, кто добыл дичь?» — Как ему удалось так быстро поохотиться и за столь короткое время принести добычу?</p>\n<p>4. «И принёс мне?» — Ведь я не велел ему ничего приносить. Как же ему вообще пришло в голову принести мне еду?</p>\n<p>5. «И я ел от всего?» — Наши мудрецы уже объяснили, что в принесённой пище Ицхак ощутил все вкусы, существующие в мире.</p>\n<p>6. «Прежде чем ты пришёл?» — Как он успел сделать всё: и добыть дичь, и принести её, и накормить меня — ещё до твоего возвращения?</p>\n<p>7. «И я благословил его?» — Как получилось, что я не заметил, что передо мной не Эсав, а другой человек, и благословил его?</p>\n<p>Если всё это произошло, значит, такова была воля Всевышнего, чтобы я благословил именно этого человека.</p>\n<p>И поэтому:</p>\n<p>«И он будет благословен».</p>\n<h2>Е. Три просьбы Эсава к Ицхаку и благословение, которое он в конце концов получил</h2>\n<p>1. Первая просьба Эсава</p>\n<p>«Когда услышал Эсав слова отца своего...» (Берешит 27:34).</p>\n<p>То есть когда он услышал, как отец сказал: «И он будет благословен», тем самым подтвердив благословения, данные Яакову.</p>\n<p>«И возопил он великим и чрезвычайно горьким воплем, и сказал отцу своему: благослови и меня, отец мой!» (Берешит 27:34).</p>\n<p>Эсав даже не предполагал, что всё благословение, которое отец собирался ему дать, предназначалось исключительно для помощи Яакову, чтобы Эсав мог обеспечивать его материально и защищать.</p>\n<p>Теперь же, когда Яаков уже получил благословения, Ицхак больше не хотел благословлять Эсава.</p>\n<p>Поэтому Эсав попросил, чтобы отец благословил также и его.</p>\n<p>На это Ицхак ответил:</p>\n<p>«Пришёл брат твой с хитростью и взял твоё благословение» (Берешит 27:35).</p>\n<p>Прежде всего обратим внимание на то, что слово «с хитростью» относится именно к приходу Яакова, а не к получению благословений.</p>\n<p>То есть действительно, его приход был связан с обманом, однако сами благословения он получил по воле Всевышнего, и в этом уже не было никакого обмана.</p>\n<p>Здесь Ицхак начинает объяснять Эсаву, что все благословения этого мира — богатство, власть, господство и сила — сами по себе не являются настоящим благословением, если они не связаны с духовностью.</p>\n<p>Всё, что ты должен был получить посредством благословений, предназначалось лишь для того, чтобы ты стал защитной оболочкой плода и помогал Яакову заниматься Торой.</p>\n<p>Тогда и в твоих благословениях присутствовала бы духовная составляющая.</p>\n<p>Но всё это имело смысл лишь до тех пор, пока Яаков не получил благословения.</p>\n<p>Ведь изначально ему было предназначено быть бедным, слабым и нуждающимся, не имеющим даже достаточно хлеба.</p>\n<p>Тогда он питался бы за столом Эсава, а Эсав защищал бы его от любых бедствий и врагов, чтобы Яаков мог спокойно заниматься Торой.</p>\n<p>Это было бы подобно отношениям между коленами Звулуна и Иссахара.</p>\n<p>Однако теперь, когда Яаков получил благословения и приобрёл все материальные блага этого мира для себя, он больше не нуждается в помощи Эсава.</p>\n<p>Следовательно, Ицхак уже не может благословить Эсава.</p>\n<p>Ведь какую пользу принесут ему богатство и власть, если Яаков больше в них не нуждается?</p>\n<p>Наоборот, богатство обернётся для Эсава злом и уже не сможет называться благословением.</p>\n<p>2. Вторая просьба Эсава</p>\n<p>Эсав обращается к отцу во второй раз:</p>\n<p>«И сказал: не потому ли назван он Яаковом, что обошёл меня уже дважды? Моё первородство он взял, и вот теперь взял моё благословение!» (Берешит 27:36).</p>\n<p>Здесь он выдвигает новый довод.</p>\n<p>Эсав говорит Ицхаку, что имя Яаков можно объяснить двумя способами.</p>\n<p>Первое объяснение: Яаков получил это имя потому, что родился, держась рукой за пятку Эсава.</p>\n<p>Это указывает на то, что вначале господствовать будет Эсав, а власть Яакова наступит лишь в конце дней.</p>\n<p>Второе объяснение: имя Яаков связано со словами, означающими хитрость и обман.</p>\n<p>И на это Эсав говорит отцу следующее.</p>\n<p>Если верно первое объяснение, то как же получилось, что Яаков уже сейчас забрал моё благословение?</p>\n<p>Ведь хотя в конце дней господство Эсава прекратится и Израиль обретёт силу, сейчас благословение богатства и власти должно принадлежать мне.</p>\n<p>Следовательно, приходится признать, что имя Яаков было дано ему не потому, что он держался за пятку Эсава, а из-за хитрости и обмана, которые ему предстояло совершить.</p>\n<p>Кроме того, Эсав утверждал, что два обмана, совершённые Яаковом, противоречат друг другу.</p>\n<p>Ведь после того как Яаков приобрёл первородство, он тем самым избрал для себя служение Всевышнему, поскольку именно в этом заключается сущность первородства.</p>\n<p>Следовательно, он должен быть свят перед своим Богом и не заниматься делами этого мира — владением полями, виноградниками, богатством и властью.</p>\n<p>Как же он теперь забрал благословение материальных благ этого мира, которое противоречит самой сути первородства?</p>\n<p>Именно об этом Эсав сказал:</p>\n<p>«Моё первородство он взял, и вот теперь взял моё благословение!»</p>\n<p>Ведь приобретая первородство, Яаков тем самым передал мне этот мир, а себе избрал благословение Будущего мира.</p>\n<p>И даже пророчество, сказанное Ривке: «И старший будет служить младшему», — после того как Яаков приобрёл первородство, должно означать, что теперь я буду господином, а он — рабом.</p>\n<p>Ведь теперь именно он является старшим, первенцем.</p>\n<p>Как же он забрал моё благословение, чтобы самому стать господином, а меня сделать рабом?</p>\n<p>И в завершение Эсав попросил:</p>\n<p>«Не оставил ли ты для меня благословения?» (Берешит 27:36).</p>\n<p>Ведь когда ты собирался благословить меня, ты наверняка оставил что-то и для Яакова.</p>\n<p>Если так, то хотя бы то благословение, которое ты собирался оставить ему, дай теперь мне.</p>\n<p>«И ответил Ицхак, и сказал Эсаву: вот, господином поставил я его над тобой, и всех братьев его отдал ему в рабы, и хлебом и вином обеспечил его. Что же теперь могу сделать для тебя, сын мой?» (Берешит 27:37).</p>\n<p>Ицхак отвечает ему:</p>\n<p>Ведь я уже благословил Яакова всем, что ему необходимо: силой, властью и богатством.</p>\n<p>Следовательно, не осталось ничего, в чём он нуждался бы от тебя и ради чего я мог бы благословить тебя, чтобы ты стал ему помощником.</p>\n<p>А потому мне больше нечем тебя благословить.</p>\n<p>3. Третья просьба Эсава</p>\n<p>Эсав обращается к отцу с третьей просьбой:</p>\n<p>«И сказал Эсав отцу своему: неужели одно только благословение есть у тебя, отец мой? И возвысил Эсав голос свой, и заплакал» (Берешит 27:38).</p>\n<p>Теперь Эсав выдвигает следующий довод.</p>\n<p>Действительно, все благословения, связанные с Яаковом, ты уже передал самому Яакову.</p>\n<p>Поэтому я больше не смогу благодаря этим благословениям удостоиться Будущего мира посредством помощи Яакову.</p>\n<p>Но почему бы тебе не дать мне отдельное благословение — на богатство и силу в этом мире, подобно тому как каждый отец благословляет своих детей?</p>\n<p>И здесь, благодаря слезам, которые пролил Эсав, Ицхак откликнулся на его просьбу и благословил его:</p>\n<p>«И ответил Ицхак, отец его, и сказал ему: вот, от тучных земель будет место твоего обитания и от росы небесной свыше» (Берешит 27:39).</p>\n<p>Ицхак благословил его богатством.</p>\n<p>Однако это благословение отличалось от того, которое он дал Яакову.</p>\n<p>Яакову он сказал:</p>\n<p>«И даст тебе Бог от росы небесной и от тучных земель» (Берешит 27:28).</p>\n<p>То есть у Яакова этот дар будет исходить непосредственно от Всевышнего и зависеть от Божественного Провидения в соответствии с его поступками.</p>\n<p>А Эсаву он дал благословение плодородием земли, которое не зависит от особого Божественного Провидения.</p>\n<p>При этом Ицхак благословил Эсава только богатством.</p>\n<p>Что же касается положения и власти, то он сказал ему:</p>\n<p>«И брату своему будешь служить» (Берешит 27:40).</p>\n<p>И это будет тебе во благо.</p>\n<p>Однако здесь существует определённое условие.</p>\n<p>Если Яаков будет заниматься Торой и служить Всевышнему, тогда ты будешь находиться в подчинении у него.</p>\n<p>Но когда руки Яакова ослабеют в служении Всевышнему, тогда именно ты станешь палкой и ремнём, посредством которых его будут наказывать и воспитывать.</p>\n<p>Как сказано:</p>\n<p>«И будет, когда ты станешь господствовать, то сбросишь его ярмо со своей шеи» (Берешит 27:40).</p>\n<p>То есть когда ты получишь возможность господствовать над ним вследствие того, что он перестанет служить Всевышнему, тогда:</p>\n<p>«И сбросишь его ярмо со своей шеи».</p>\n<p>И как сказали наши мудрецы:</p>\n<p>«Когда голос — не голос Яакова, тогда руки — руки Эсава».</p>\n<h2>Ж. Ненависть Эсава к Ицхаку и Яакову</h2>\n<p>Эсав очень разгневался как на Яакова, который забрал его благословение, так и на Ицхака, который дал Яакову эти благословения.</p>\n<p>Он хотел отомстить им обоим одновременно — убить Яакова, чтобы его отец Ицхак был вынужден оплакивать сына.</p>\n<p>Именно об этом он сказал:</p>\n<p>«Приблизятся дни траура моего отца, и я убью Яакова, брата моего» (Берешит 27:41).</p>\n<p>То есть смысл его слов заключался в том, что отец будет вынужден скорбеть из-за того, что он убьёт Яакова.</p>\n<p>[Здесь не имеется в виду, что Эсав собирался отомстить Яакову после смерти Ицхака. Напротив, он хотел отомстить им обоим уже сейчас: убить Яакова и заставить отца оплакивать его.]</p>\n<p>Ривка узнала об этом и велела Яакову немедленно бежать.</p>\n<p>Однако она не хотела причинять Ицхаку боль, рассказывая ему, что Эсав собирается убить Яакова.</p>\n<p>Поэтому она мудро предложила Ицхаку отправить Яакова в Падан-Арам, чтобы тот нашёл себе жену.</p>\n<p>Она объяснила, что не хочет, чтобы Яаков женился на одной из местных девушек, поскольку они ему не подходят.</p>\n<p>Ведь в таком случае благословение Авраама не сможет продолжиться в его потомстве, и его потомки не смогут стать избранным народом.</p>\n<p>Тогда Ицхак позвал Яакова и сказал ему:</p>\n<p>«Не бери жены из дочерей Кнаана. Встань, иди в Падан-Арам, в дом Бетуэля, отца матери твоей, и возьми себе оттуда жену из дочерей Лавана, брата матери твоей.</p>\n<p>И Бог Всемогущий благословит тебя, и расплодит тебя, и умножит тебя, и станешь ты собранием народов.</p>\n<p>И даст Он тебе благословение Авраама» (Берешит 28:1–4).</p>\n<p>То есть Ицхак объяснил Яакову следующее.</p>\n<p>Если ты хочешь и дальше быть достойным благословения Авраама, то не должен брать жену из дочерей Кнаана.</p>\n<p>Ты должен жениться на святой женщине, которая подходит тебе, чтобы через неё продолжилось твоё святое потомство.</p>\n<p>Именно от тебя произойдёт избранный народ, на который распространится благословение Авраама.</p>\n<p>Поэтому отправляйся в Падан-Арам и возьми себе жену из семьи своей матери.</p>\n<p>Мы являемся потомками Яакова, который продолжил путь Ицхака, а Ицхак, в свою очередь, продолжил путь Авраама, избранного Всевышним быть Его особым служителем.</p>\n<p>И на нас распространяется благословение Авраама.</p>\n<p>Однако необходимо понимать, что и внутри самого народа Израиля существуют различные духовные ступени.</p>\n<p>Есть плод, который является главным, — это колено Леви и каждый человек, которого побудил его дух отделиться от мирских дел и предстать перед Всевышним, как об этом пишет Рамбам.</p>\n<p>Это люди, которые полностью погружены в изучение Торы и отдалены от забот и стремлений материального мира.</p>\n<p>Но есть и те, кто не удостоился такого уровня.</p>\n<p>Они подобны кожуре плода или листьям дерева, которые сами не являются плодом, но защищают его и способствуют его развитию.</p>\n<p>И даже если человек не удостоился сам стать бен Торой — человеком, посвятившим свою жизнь изучению Торы, — он обязан по крайней мере помогать этому плоду.</p>\n<p>Он должен находиться рядом с Торой, добрыми делами и богобоязненностью, сохраняя связь с духовностью.</p>\n<p>Но самое главное из всего — ясно осознавать, что у сотворения мира есть определённая цель.</p>\n<p>Эта цель — колено Леви.</p>\n<p>Они являются плодом, высшей ступенью избранного народа.</p>\n<p>Именно на них благословение Авраама распространяется во всей своей силе и полноте.</p>\n<p>И ради них, ради обеспечения их потребностей существует всё мироздание.</p>\n<p>Это знание и осознание особенно необходимы нам в наше время.</p>\n<p>Ведь сегодня ученики ешив и аврехим подвергаются столь сильным преследованиям, а честь Торы унижается и попирается людьми, которые не изучали ни Письменную, ни Устную Тору.</p>\n<p>Эти люди совершенно не понимают и не осознают, Кто сотворил мир, ради чего Он его создал, что в мироздании существует определённый порядок, замысел и конечная цель.</p>\n<p>Разумеется, наша задача не заключается в том, чтобы спорить с ними.</p>\n<p>Да и никакой пользы такие споры не принесут.  Ведь их представления о мире настолько далеки от правильного понимания, насколько восток далёк от запада.</p>\n<p>Но мы обязаны укреплять самих себя, осознавать величие своего положения и гордиться им.</p>\n<p>И даже тот, кто не удостоился стать самим плодом, пусть хотя бы удостоится быть среди листьев, ветвей и кожуры, которые окружают и поддерживают плод.</p>\n<p>А мы, бней Тора, люди, которые усердно трудятся над изучением Торы, погружены в талмудические рассуждения Абайе и Равы и служат благословенному Всевышнему, — мы и есть тот самый плод, ради которого существует дерево.</p>\n<p>Мы — венец и великолепие всего творения!  Ради нас был сотворён мир!  И всё мироздание было создано лишь для того, чтобы служить богобоязненным людям и тем, кто служит Всевышнему.</p>\n<p>Счастливы мы, и как прекрасен наш удел!  И да будет угодно Всевышнему, чтобы все мы удостоились в совершенстве исполнить своё предназначение и доставить радость нашему Творцу.</p>\n<p>Амен, кен йеhи рацон!<br>Амен, да будет на то Его воля!</p>"},{"title":"Вайеце","body":"<h2>Глава 5</h2>\n<p><strong>Недельная глава «Вайеце» (ויצא)</strong></p>\n<p><strong><strong>Праотец Яаков — тайна духовного возвышения</strong></strong></p>\n<p>Беседа главы ешивы, с помощью Всевышнего</p>\n<p>Глава «Вайеце» — Праотец Яаков: тайна духовного возвышения</p>\n<p>С разрешения уважаемых раввинов ешивы и дорогих учеников!</p>\n<p>На этой неделе мы читаем главу Торы «Вайеце», которая целиком посвящена праотцу Яакову — от его ухода из Беэр-Шевы до расставания с Лаваном Арамейцем. С помощью Всевышнего мы изучим на этой неделе несколько важных идей, которые можно извлечь из этой главы.</p>\n<h2>А. Вопросы</h2>\n<p><strong><strong>1.</strong></strong><strong> Когда праотец Яаков покинул Беэр-Шеву по поручению отца и матери, чтобы жениться на одной из дочерей Лавана, ему уже было 63 года. Как известно, он не отправился сразу в Харан, а сначала пошёл учиться на протяжении 14 лет в дом учения Шема и Эвера.</strong></p>\n<p>Возникает вопрос: почему он не отправился сразу искать жену, как ему было велено?</p>\n<p><strong><strong>2.</strong></strong><strong> После этих 14 лет, когда Яаков уже находился в пути в Харан, Всевышний захотел показать ему пророческое видение. Поэтому солнце зашло, Яаков лёг спать прямо в дороге и увидел во сне лестницу.</strong></p>\n<p>Но почему всё это было необходимо? Почему Всевышний не показал ему это непосредственно в пророческом видении? Ведь, как известно, сон — это более низкий уровень, чем пророчество.</p>\n<p><strong><strong>3.</strong></strong><strong> В своём сне Яаков видит лестницу, стоящую на земле, вершина которой достигает небес, и ангелов Всевышнего, поднимающихся и спускающихся по ней.</strong></p>\n<p>Здесь необходимо понять несколько вещей:</p>\n<p>а) Чему должно научить нас это видение?</p>\n<p>б) Почему сказано, что ангелы сначала поднимаются, а затем спускаются? Ведь место ангелов наверху, и логичнее было бы сначала сказать, что они спускаются, а потом поднимаются.</p>\n<p>в) Что означает выражение «поднимаются и спускаются по ней»? Казалось бы, следовало сказать: поднимаются и спускаются на ней.</p>\n<p><strong><strong>4.</strong></strong><strong> На протяжении всей главы мы видим, как Яаков вынужден сталкиваться с обманом Лавана. Лаван обманывает его, когда вместо Рахели отдаёт ему Лею, а также постоянно меняет условия его оплаты.</strong></p>\n<p>В ответ Яаков тоже использует хитрость. Он говорит: «Я брату ему в хитрости» — то есть способен противостоять ему его же методами. Это проявляется в истории с палками, с помощью которых он увеличивал своё стадо, а затем и в его тайном уходе от Лавана, как сказано:</p>\n<p>«И похитил Яаков сердце Лавана Арамейца, потому что не сообщил ему, что убегает».</p>\n<p>Но ведь, как известно, Яаков олицетворяет качество истины, как сказано:</p>\n<p>«Истину дай Яакову».</p>\n<p>Почему же именно он вынужден постоянно прибегать к хитрости?</p>\n<p>Кроме того, почему Яаков не опасался использовать палки перед стадом, чтобы овцы и козы рожали животных с определённой окраской? Ведь всё происходило на виду, и кто-нибудь мог рассказать об этом Лавану, после чего все сочли бы Лавана правым.</p>\n<p><strong><strong>5.</strong></strong><strong> Яаков говорит своим жёнам:</strong></p>\n<p>«А отец ваш обманывал меня и изменял мою плату десять раз».</p>\n<p>То есть сто раз.</p>\n<p>Необходимо понять: как вообще можно было сто раз менять условия оплаты — с пятнистых животных на полосатых, крапчатых и так далее?</p>\n<p><strong><strong>6.</strong></strong><strong> Ещё один вопрос.</strong></p>\n<p>Как известно, молитвы праотцев установили наши праотцы: Авраам установил утреннюю молитву (Шахарит), Ицхак — дневную (Минха), а Яаков — вечернюю (Маарив).</p>\n<p>Но Яаков был избранным среди праотцев. Казалось бы, именно он должен был установить Шахарит — главную утреннюю молитву. Почему же он установил вечернюю молитву, относительно которой мудрецы спорят, является ли она обязательной или добровольной?</p>\n<p>Кроме того, молитвы соответствуют жертвоприношениям, как объясняется в Талмуде, трактат Брахот (26-я страница):</p>\n<p>Шахарит соответствует утренней постоянной жертве.</p>\n<p>Минха соответствует дневной постоянной жертве.</p>\n<p>Маарив соответствует сжиганию частей жертвоприношений — органов и жира, которые могли приноситься на жертвеннике всю ночь.</p>\n<p>Речь идёт о жертвах, которые были заколоты и кровь которых была возложена на жертвенник днём, но части которых не успели принести в жертву до наступления ночи. Их разрешалось сжигать на жертвеннике всю ночь.</p>\n<p>На первый взгляд, это менее значимая работа по сравнению с жертвами Авраама и Ицхака, соответствующими постоянным жертвоприношениям. Ведь главная часть жертвы — возложение крови, которая искупает грех, — уже была выполнена днём, до захода солнца. Ночью оставалось только сжечь части животного, которые не успели принести днём, причём их принесение не являлось условием искупления.</p>\n<p>Почему же именно такую жертву выбрал Яаков как основу для своей молитвы?</p>\n<h2>Б. Праотец Яаков — единство тела и души в стремлении к близости со Всевышним</h2>\n<p>Как известно, мидраш часто начинает обсуждение недельной главы с определённого стиха из Танаха, который становится вступлением к его толкованию.</p>\n<p>Мидраш Раба, комментируя эту главу и сон о лестнице, начинает со слов:</p>\n<p>«Жаждет Тебя душа моя, томится по Тебе плоть моя, в земле пустынной, иссохшей и безводной».</p>\n<p>Чтобы понять связь этого стиха со сном Яакова, сначала разберём его смысл.</p>\n<p>Царь Давид говорит:</p>\n<p>«Жаждет Тебя душа моя».</p>\n<p>Душа человека стремится исполнять волю Всевышнего. Но не только душа, которая является частью Божественного начала, стремится к этому.</p>\n<p>Далее сказано:</p>\n<p>«Томится по Тебе плоть моя».</p>\n<p>Плоть символизирует материальную сторону человека, его физические желания и стремления.</p>\n<p>Давид говорит, что не только моя духовная душа, но и моё материальное тело, мои физические желания испытывают такое же стремление к духовности.</p>\n<p>Этот стих относится к праотцу Яакову, который достиг такого уровня, когда тело и душа объединились в стремлении к духовному. Они испытывали одинаковое наслаждение от духовности.</p>\n<p>Даже находясь в «земле пустынной», то есть в доме Лавана, в месте, которое называется «безводным», то есть лишённым Торы, он достиг такого высокого уровня.</p>\n<p>Когда Яаков покинул родительский дом в Беэр-Шеве и направился в место, где жили нечестивые люди, к Лавану Арамейцу, он почувствовал, что ещё не готов противостоять такой среде и сохранить свой высокий духовный уровень.</p>\n<p>Поэтому сначала он отправился в дом учения Шема и Эвера и полностью посвятил себя изучению Торы на протяжении четырнадцати лет.</p>\n<p>Как говорят наши мудрецы, за это время он практически не давал своим глазам сна больше, чем спит лошадь.</p>\n<p>Только после этих четырнадцати лет он почувствовал, что обладает достаточной духовной силой, чтобы отправиться в дом Лавана и сохранить состояние, описанное словами:</p>\n<p>«Жаждет Тебя душа моя, томится по Тебе плоть моя».</p>\n<p>То есть чтобы тело и душа были едины в своём стремлении к духовности и близости со Всевышним.</p>\n<p>По дороге Яаков лёг спать и увидел сон.</p>\n<p>Как известно, во сне человеку часто открывается его истинное внутреннее состояние. То, чем человек живёт и о чём думает, отражается в его сновидениях.</p>\n<p>Человек, который живёт мыслями о грехах, может видеть соответствующие сны. Тот, кто постоянно занят погоней за деньгами, будет видеть во сне деньги. А тот, кто живёт изучением Торы, будет видеть во сне Тору.</p>\n<p>Сон подобен зеркалу, показывающему человеку, на каком духовном уровне он находится.</p>\n<p>Яаков видит во сне:</p>\n<p>«И вот лестница стоит на земле, а вершина её достигает небес».</p>\n<p>Смысл этого сна, как объясняется, в частности, в книге «Ховот а-Левавот» («Обязанности сердца»), в разделе «Врата единства», заключается в том, что через всё творение, даже через то, что находится на земле, человек может подняться до самых небес.</p>\n<p>Человек способен увидеть Божественное присутствие, обрести любовь к Всевышнему и достичь высочайших духовных уровней, наблюдая за окружающим миром.</p>\n<p>Как сказано:</p>\n<p>«Поднимите глаза ваши к высоте и посмотрите: кто сотворил всё это?»</p>\n<p>Можно смотреть на солнце, луну, звёзды и видеть во всём этом Творца.</p>\n<p>Однако Яаков стремился к гораздо более высокой ступени близости со Всевышним.</p>\n<p>Приведём слова Рамбана в объяснении этого сна:</p>\n<p>«Он показал ему в пророческом сне, что всё происходящее на земле осуществляется посредством ангелов, и всё это происходит по повелению Всевышнего. Ведь ангелы Божьи, которых Господь посылает ходить по земле, не совершают ни малого, ни великого, пока не возвращаются предстать перед Владыкой всей земли и доложить Ему: мы прошли по земле, и вот она пребывает в спокойствии или наполнена мечом и кровью. И тогда Он повелевает им снова спуститься на землю и исполнить Его волю.</p>\n<p>Также Он показал ему, что Сам Всевышний стоит над лестницей и даёт Яакову великое обещание: он не будет находиться в руках ангелов, но будет принадлежать Господу, и Господь всегда будет с ним, как сказано: “И вот Я с тобою, и сохраню тебя везде, куда бы ты ни пошёл”.</p>\n<p>Ведь его духовный уровень выше уровня остальных праведников, о которых сказано: “Ибо ангелам Своим Он повелит охранять тебя на всех путях твоих”».</p>\n<p>Смысл этих слов следующий.</p>\n<p>Всевышний показал Яакову через сон о лестнице обычный порядок управления миром: ангелы, являющиеся служителями Всевышнего, исполняют Его поручения во всём, что происходит в этом мире, как в хорошем, так и, не дай Б-г, в противоположном.</p>\n<p>Но Яаков не хотел ограничиваться таким уровнем, при котором его связь со Всевышним осуществляется посредством ангелов.</p>\n<p>Он стремился к самой высокой степени близости с Творцом — до уровня, когда сам человек становится колесницей для Божественного присутствия.</p>\n<p>Подобное мы видим у Моше Рабейну.</p>\n<p>После греха золотого тельца Всевышний сказал ему:</p>\n<p>«И пошлю перед тобою ангела».</p>\n<p>Но Моше ответил:</p>\n<p>«Если Сам Ты не пойдёшь с нами, то не выводи нас отсюда».</p>\n<p>То есть Моше не хотел, чтобы связь с Всевышним осуществлялась через ангелов. Он стремился к непосредственной связи с Самим Творцом.</p>\n<p>Именно это было содержанием сна Яакова.</p>\n<p>После того как он достиг уровня, когда тело и душа объединились в стремлении к духовности и к максимально возможной близости со Всевышним, ему было показано его духовное положение.</p>\n<p>Он увидел:</p>\n<p>«И вот Господь стоит над ним».</p>\n<p>Всевышний словно говорит ему: ты не будешь находиться в руках ангелов, ты будешь принадлежать Мне, и Я всегда буду с тобой.</p>\n<p>Как сказано:</p>\n<p>«И вот Я с тобою, и сохраню тебя везде, куда бы ты ни пошёл».</p>\n<p>Это была особая награда Яакова — обещание, что Всевышний будет с ним не через посредников, а непосредственно.</p>\n<h2>В. Сжигание частей жертвы — превращение материального в духовное</h2>\n<p>Теперь мы можем понять слова Талмуда о том, что Яаков установил вечернюю молитву Маарив. Основа этого объяснения приводится у Ибн Эзры.</p>\n<p>Вечерняя молитва соответствует сжиганию органов и жира жертвенного животного — материальной части жертвы.</p>\n<p>Кровь символизирует душу, а мясо — материальную сторону.</p>\n<p>Яаков открыл нам новую идею: не только духовная составляющая жертвы является святой, но и её материальная часть тоже становится жертвоприношением.</p>\n<p>Материальное также может объединиться с духовным и достичь уровня, о котором сказано:</p>\n<p>«Сердце моё и плоть моя ликуют о Боге живом».</p>\n<p>Как объясняют наши мудрецы, когда человек приносит жертву, кровь животного считается словно его собственной кровью, которую он приносит Всевышнему.</p>\n<p>А когда сжигают мясо жертвы, это считается словно человек приносит в жертву собственную плоть.</p>\n<p>Яаков, достигший уровня:</p>\n<p>«Томится по Тебе плоть моя»,</p>\n<p>то есть уровня, когда даже тело, материальная составляющая человека, стремится к близости со Всевышним так же сильно, как духовная душа, установил именно вечернюю молитву.</p>\n<p>Она соответствует принесению материальной части жертвы Всевышнему — так же, как кровь символизирует её духовную составляющую.</p>\n<h2>Г. «Истину дай Яакову» — равенство стремлений тела и души</h2>\n<p>Душа человека является частью Божественного начала, и её естественное стремление направлено вверх — к духовности.</p>\n<p>С другой стороны, тело, созданное из праха земли, постоянно тянет человека вниз — к материальному миру.</p>\n<p>Особенностью Яакова было качество истины, как сказано:</p>\n<p>«Истину дай Яакову».</p>\n<p>Истина означает следование одному и тому же правильному пути при любых обстоятельствах и в любое время.</p>\n<p>Истина принадлежит душе, ведь Всевышний — источник истины, и имя Его — Истина.</p>\n<p>Истинное качество человека заключается в том, чтобы и материальная сторона его существа подчинялась этой истине и следовала ей без препятствий.</p>\n<p>Яаков, достигший вершины качества истины, привёл материальную сторону человека к состоянию:</p>\n<p>«Томится по Тебе плоть моя».</p>\n<p>То есть он достиг того, чтобы и тело стремилось к духовному единству и близости со Всевышним в той же степени, что и душа.</p>\n<p>Именно в этом заключалось его превосходство среди праотцев.</p>\n<p>С этой точки зрения можно понять слова наших мудрецов о том, что праотец Яаков не умер.</p>\n<p>Смерть — это разделение между душой и телом: тело возвращается в прах, а душа возвращается в своё место наверху.</p>\n<p>Но Яаков поднял своё тело до такого уровня, что оно тоже стало полностью духовным. Все его стремления и желания были направлены на духовность.</p>\n<p>Поэтому можно сказать, что даже его тело не умерло, ведь духовная составляющая не умирает, а продолжает жить.</p>\n<h2>Д. Испытания Яакова — испытания в качестве истины</h2>\n<p>Яаков был человеком истины, и его испытания также были связаны с этим качеством.</p>\n<p>Ему предстояло служить Всевышнему с искренностью в самых разных обстоятельствах и среди людей, которые являлись полной противоположностью истине.</p>\n<p>И при всём этом он должен был оставаться человеком истины и не опускаться со своего высокого духовного уровня.</p>\n<p>После сна Яаков приходит в Харан и договаривается с Лаваном, что будет работать у него семь лет за его младшую дочь Рахель.</p>\n<p>Но Лаван обманывает его и вместо Рахели отдаёт ему Лею.</p>\n<p>После этого он также обманывает Яакова в вопросах оплаты, изменяя её сто раз.</p>\n<p>Объяснение того, как происходили эти сто изменений, приводит книга «Меир Эйнай Хахамим» раввина из Острополя.</p>\n<p>Согласно объяснению, основанному на Талмуде, в трактате Бехорот, формирование плода животного происходит за 21 день.</p>\n<p>Лаван знал, что то, о чём Яаков будет молиться Всевышнему, сбудется.</p>\n<p>Поэтому сначала он соглашался платить Яакову пятнистыми животными. Яаков молился, чтобы рождались пятнистые животные.</p>\n<p>Через 21 день, когда животные уже сформировались, Лаван менял условия оплаты и вместо пятнистых назначал полосатых.</p>\n<p>Так он поступал каждые три недели на протяжении шести лет.</p>\n<p>Известно, что в шести годах примерно 300 недель. Если разделить их на периоды по три недели, получится сто периодов.</p>\n<p>Таким образом, Лаван изменил условия оплаты сто раз.</p>\n<p>После окончания этих шести лет Яаков покинул Лавана.</p>\n<p>О его уходе сказано в Торе:</p>\n<p>«И похитил Яаков сердце Лавана Арамейца, потому что не сообщил ему, что убегает».</p>\n<p>Необходимо понять: в чём заключалась эта хитрость? Что именно Яаков «похитил»?</p>\n<p>Святой Альших объясняет, что каждый раз, когда Лаван обманывал Яакова и вызывал его гнев, Яаков говорил ему, что однажды убежит от него.</p>\n<p>Но при этом он не убегал.</p>\n<p>Из-за этого Лаван решил, что Яаков не собирается действительно уходить, а говорит об этом только во время ссор.</p>\n<p>В результате Лаван перестал следить за каждым его шагом, и Яаков получил возможность спокойно уйти.</p>\n<p>Однако автор книги «Меир Эйнай Хахамим» задаёт вопрос:</p>\n<p>Как мог Яаков говорить Лавану, что собирается убежать, если на самом деле ещё не планировал этого? Ведь Яаков олицетворяет качество истины, как сказано:</p>\n<p>«Истину дай Яакову».</p>\n<p>Поэтому он объясняет иначе.</p>\n<p>Яаков понял, что Лаван установил для себя определённое правило: если Яаков действительно захочет сбежать, он обязательно несколько раз предупредит об этом заранее.</p>\n<p>И как только Яаков впервые пригрозит побегом, Лаван усилит охрану и сделает всё, чтобы тот не смог уйти.</p>\n<p>Поэтому Яаков проявил мудрость и ни словом, ни намёком не сообщил Лавану о своём намерении уйти.</p>\n<p>В результате Лаван не усилил охрану, и Яаков смог благополучно сбежать.</p>\n<p>Далее автор объясняет также историю с палками.</p>\n<p>На первый взгляд, Яаков совершил настоящий обман: он создавал определённые узоры на палках, чтобы животные рожали детёнышей соответствующей окраски.</p>\n<p>Кроме того, почему он не боялся, что люди увидят его действия и затем скажут, что Лаван прав?</p>\n<p>Объяснение заключается в том, что Яаков действовал так, как хотел сам Лаван.</p>\n<p>Например, если они договаривались, что на этой неделе пятнистые животные будут принадлежать Лавану, а полосатые — Яакову, Яаков поступал именно согласно договорённости.</p>\n<p>Лаван видел, что Яаков ведёт себя честно и открыто, как сказано:</p>\n<p>«Яаков — человек цельный».</p>\n<p>Но в своей хитрости Лаван рассуждал следующим образом:</p>\n<p>«Всевышний услышит молитву Яакова, чтобы родились полосатые животные. Поэтому мне выгодно изменить условия: пусть полосатые будут принадлежать мне, а пятнистые — Яакову».</p>\n<p>Именно поэтому Лаван постоянно менял условия оплаты.</p>\n<p>Но Всевышний знал, что Лаван обманывает Яакова и собирается менять условия.</p>\n<p>Поэтому Он сделал так, чтобы животные рождались в соответствии с тем, что Лаван в итоге сам объявлял.</p>\n<p>Именно поэтому в Торе сказано:</p>\n<p>«Если он скажет: пятнистые будут твоей платой, то всё стадо будет рождать пятнистых».</p>\n<p>Использование слова «скажет» в будущем времени указывает на то, что Всевышний учитывал именно то, что Лаван скажет в итоге.</p>\n<p>Так объясняет Рамбан.</p>\n<p>Здесь есть ещё один важный принцип, который приводит раввин из Острополя в той же книге.</p>\n<p>Обманщик в конечном итоге сам навлекает на себя беду именно благодаря собственному обману.</p>\n<p>Как сказано:</p>\n<p>«Нет ни мудрости, ни разума, ни совета против Господа».</p>\n<p>Как мы уже объяснили, именно из-за обмана Лаван в итоге потерял своё стадо.</p>\n<p>Если бы он не обманывал Яакова и животные рождались бы пятнистыми, как они договорились изначально, он бы получил свою выгоду.</p>\n<p>Но именно из-за собственной хитрости он всё потерял.</p>\n<p>Мы встречаем этот принцип и в других местах Торы.</p>\n<p>Например, при продаже Йосефа в рабство братья хотели помешать ему стать правителем.</p>\n<p>Поэтому они продали его в Египет, где, согласно законам того времени, раб не мог стать правителем.</p>\n<p>Но в итоге именно благодаря продаже Йосеф оказался в Египте и стал заместителем царя.</p>\n<p>Подобным образом произошло и с Йоной: его бегство в Яффо стало причиной того, что люди услышали его пророчество.</p>\n<h2>Е. Праведность Яакова — сохранение своего духовного уровня на протяжении двадцати лет благодаря силе Торы</h2>\n<p>В конце главы сказано:</p>\n<p>«И Яаков пошёл своей дорогой, и встретили его ангелы Божьи».</p>\n<p>Рав Шимшон Рафаэль Гирш обращает внимание на интересную деталь.</p>\n<p>В начале главы также используется слово «встретил»:</p>\n<p>«И встретил он это место».</p>\n<p>Но есть разница: в начале главы это слово относится к Яакову, а в конце — к ангелам.</p>\n<p>Он объясняет это следующим образом.</p>\n<p>Слово «встреча» здесь выражает удивление и необычность происходящего.</p>\n<p>Когда Яаков выходил из Беэр-Шевы, для него было удивительно увидеть проявление Божественного присутствия в нижнем мире.</p>\n<p>Но когда он покинул дом Лавана, уже ангелы удивились, увидев, что, несмотря на двадцать лет, проведённых в доме Лавана, Яаков остался таким же праведником, каким был до ухода из родительского дома.</p>\n<p>Он сохранил тот же духовный уровень:</p>\n<p>«И вот Господь стоит над ним».</p>\n<p>Откуда у Яакова была такая сила?</p>\n<p>Из четырнадцати лет, проведённых в доме учения Шема и Эвера.</p>\n<p>Именно эти годы, когда он изучал Тору и полностью погрузился в неё, дали ему силы сохранить себя даже тогда, когда он оказался среди обмана и духовной нечистоты Лавана Арамейца.</p>\n<p>Несмотря на долгие годы в такой среде, Всевышний сохранил его, и он не упал со своего духовного уровня.</p>\n<p>Наоборот, он остался цельным, как сказано:</p>\n<p>«И пришёл Яаков цельным».</p>\n<p>Всё это произошло благодаря силе Торы.</p>\n<p>Как известно, Яаков соответствует сфире Тиферет, а Тиферет связана с Торой.</p>\n<p>Молодой человек в начале своего жизненного пути приходит учиться в ешиву. Сначала в малую ешиву,
