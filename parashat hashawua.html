затем в большую. После этого он женится и выходит в самостоятельную жизнь.</p>\n<p>Есть люди, которые берут с собой всё, что приобрели за эти годы учёбы, и продолжают жить с этим при любых обстоятельствах.</p>\n<p>А есть те, кому, к сожалению, не удаётся сохранить приобретённое, и они теряют всё.</p>\n<p>В чём корень этой разницы?</p>\n<p>Почему для одних годы учёбы полностью меняют личность, и они остаются людьми Торы на протяжении всей жизни, а другие не достигают этого?</p>\n<p>Объяснение следующее.</p>\n<p>Каждый молодой человек должен понимать: когда он приходит в ешиву изучать Тору, главная цель заключается не только в том, чтобы приобрести знания и стать большим знатоком Торы.</p>\n<p>Главная цель — быть неразрывно связанным с Торой и со Всевышним.</p>\n<p>Он должен стремиться исполнять волю Всевышнего и расти в изучении Торы, которая является Торой жизни.</p>\n<p>То есть Тора должна менять нашу жизнь и учить нас, как правильно поступать в любых жизненных обстоятельствах.</p>\n<p>Когда человек изучает Тору с такой целью, она становится неотъемлемой частью его личности.</p>\n<p>И даже в старости он не отступит от неё.</p>\n<p>Но если человек приходит в ешиву только для того, чтобы изучать Тору как любую другую науку, то она не возвышает его и не становится вечным приобретением его души.</p>\n<h2>Ж. Тайна лестницы — созданные человеком ангелы поднимаются и спускаются, возвышая его до новых духовных уровней</h2>\n<p>В комментарии Ор а-Хаима к сну Яакова приводятся удивительные слова, раскрывающие глубокую тайну этого сна.</p>\n<p>Он пишет:</p>\n<p>«Слова “ангелы Божьи поднимаются...” намекают на добрые поступки, которые человек старается совершать в этом мире.</p>\n<p>Посредством этих поступков он поднимает высшие духовные света к корню своей души.</p>\n<p>Эти света называются в словах наших мудрецов (Зоар, часть I, 18) “маим нуквин” — женские воды, и они называются ангелами Божьими.</p>\n<p>Когда они поднимаются наверх, оттуда спускаются “маим духрин” — мужские воды.</p>\n<p>Ведь когда нижний мир пробуждается, пробуждаются и высшие воды, чтобы ниспослать великие духовные света в его душу».</p>\n<p>Объяснение следующее.</p>\n<p>Когда человек совершает добрые поступки, благодаря ему создаются добрые ангелы.</p>\n<p>Эти ангелы поднимаются наверх и возвращаются, принося великие духовные света в его душу.</p>\n<p>Это даёт человеку силы продолжать расти и подниматься от одной духовной ступени к другой.</p>\n<p>Именно поэтому сначала сказано:</p>\n<p>«Ангелы Божьи поднимаются», а затем — «спускаются».</p>\n<p>Сначала они поднимаются благодаря изучению Торы и добрым поступкам человека, а затем спускаются обратно в его душу и наполняют её великими духовными силами.</p>\n<p>Поэтому сказано:</p>\n<p>«Поднимаются и спускаются по ней».</p>\n<p>То есть они спускаются внутрь самого человека и возвышают его до нового, более высокого духовного уровня.</p>\n<p>Подобная идея объясняется в книге «Нефеш а-Хаим» (раздел 4, глава 15).</p>\n<p>Когда человек занимается изучением Торы, он исправляет свою душу и притягивает к себе сверху новые части души из святого источника.</p>\n<p>Как сказано в трактате Йома (39б):</p>\n<p>«Человеку, который освящает себя снизу, помогают и освящают его свыше».</p>\n<p>Этим объясняется стих:</p>\n<p>«Сердце чистое сотвори во мне, Боже, и дух правильный обнови внутри меня».</p>\n<p>Человек молится Всевышнему, чтобы Он помог ему обрести чистое сердце и заниматься Торой.</p>\n<p>И благодаря этому:</p>\n<p>«Дух правильный обнови внутри меня».</p>\n<p>То есть человек получает новый дух, новые духовные уровни и новые силы.</p>\n<p>Необходимо добавить ещё одну мысль, которую приводит Рабейну Бахье от имени раввина Ибн Тиббона:</p>\n<p>«Эта лестница намекает на уровень познания, которого может достичь человеческий род, пока не достигнет совершенства.</p>\n<p>Сначала ему была показана сама дорога, а затем её цель.</p>\n<p>Эта дорога не является ровной дорогой на земле, ни в длину, ни в ширину. Это путь восхождения, вершина которого находится на небесах.</p>\n<p>Как сказано в книге Мишлей (15:24):</p>\n<p>“Путь жизни мудрого направлен вверх”».</p>\n<p>То есть следование путями Всевышнего — это не ровная и лёгкая дорога.</p>\n<p>Это путь подъёма и восхождения.</p>\n<p>Каждое восхождение поначалу даётся трудно.</p>\n<p>Но в конце человек получает великие и удивительные духовные ступени благодаря ангелам, которые создаются именно благодаря его собственному духовному подъёму.</p>\n<h2>З. Ленивый, борющийся и любящий</h2>\n<p>Этот принцип встречается также в книге «Михтав ме-Элиягу» (часть 5, страница 495).</p>\n<p>Рав Деслер объясняет, что в любом деле существуют три этапа:</p>\n<p>Ленивый.</p>\n<p>Борющийся.</p>\n<p>Любящий.</p>\n<p>Он объясняет это следующим образом.</p>\n<p>Человек создан из праха земного.</p>\n<p>У праха нет собственной силы, он постоянно лежит на месте.</p>\n<p>Так и человек по своей природе стремится отдыхать и спать.</p>\n<p><strong>Это первая ступень — </strong><strong><strong>«ленивый»</strong></strong><strong>.</strong></p>\n<p><strong>На следующем этапе, когда человек хочет стать лучше, он становится </strong><strong><strong>«борющимся»</strong></strong><strong>.</strong></p>\n<p>За каждый шаг вперёд ему приходится бороться со своей природой, которая тянет его к земному и материальному.</p>\n<p>Если он не будет бороться, он не сможет продвигаться вперёд.</p>\n<p>Так происходит во всём.</p>\n<p>Если человек хочет подняться на более высокий уровень молитвы, ему необходимо приложить усилия.</p>\n<p>Если он хочет учиться с постоянством и усердием, ему необходимо приложить усилия.</p>\n<p>Ничего не приходит без борьбы.</p>\n<p><strong>На последнем этапе человек становится </strong><strong><strong>«любящим»</strong></strong><strong>.</strong></p>\n<p>То есть после того, как он боролся и приобрёл хорошие качества, они становятся частью его личности.</p>\n<p>Он начинает любить их.</p>\n<p>Это уже не борьба, ему больше не трудно.</p>\n<p>Он делает всё с любовью и желанием продолжать подниматься от одной духовной ступени к другой.</p>\n<p>На этой неделе я беседовал с одним учеником ешивы о духовном возвышении.</p>\n<p>Мы говорили о том, что этот процесс, как и любое восхождение по лестнице на высокий этаж, требует усилий и бывает непростым.</p>\n<p>И тогда ученик сказал мне:</p>\n<p>«Сегодня уже не нужно подниматься по лестнице — сегодня есть лифт».</p>\n<p>В свете всего сказанного мы поняли, что и в духовности существует свой «лифт».</p>\n<p>Это ступень «любящего».</p>\n<p>Когда человек начинает свой путь духовного восхождения и борется со своей природой, он в итоге может удостоиться уровня «любящего».</p>\n<p>Тогда он начинает делать всё с радостью, любит служение Всевышнему, и оно больше не кажется ему трудным.</p>\n<p>Мы можем увидеть это своими глазами в самых разных областях служения Всевышнему.</p>\n<p>Есть ученик, для которого каждый урок, каждый утренний порядок учёбы, каждый урок мусара, каждая пятница и суббота являются тяжёлой обязанностью.</p>\n<p>Когда наступают Дни трепета, для него это становится огромным грузом и источником напряжения.</p>\n<p>Но есть и тот, кто достигает такого состояния, когда всё это становится для него радостью.</p>\n<p>Каждый урок — настоящее переживание.</p>\n<p>Каждый порядок учёбы — наслаждение.</p>\n<p>Каждый урок мусара наполняет его трепетом перед Всевышним и ощущением близости к Нему.</p>\n<p>Пятница и суббота становятся для него настоящим подобием будущего мира.</p>\n<p>А Дни трепета становятся вершиной близости ко Всевышнему и величайшим наслаждением его жизни.</p>\n<p>Как человек удостаивается этого?</p>\n<p>Благодаря борьбе.</p>\n<p>Благодаря тайне лестницы.</p>\n<p>Каждый раз, когда человек прилагает усилия на пути духовного восхождения, благодаря этим усилиям создаются ангелы, которые поднимаются по лестнице.</p>\n<p><strong>А затем человек удостаивается ангелов, которые спускаются </strong><strong><strong>в него</strong></strong><strong>.</strong></p>\n<p>То есть они приносят ему свыше духовное изобилие, которое он получает с небес.</p>\n<p>И благодаря этому он достигает ступени «любящего».</p>\n<p>Счастливы мы, как прекрасна наша доля!</p>\n<p>Слава Всевышнему, в нашей ешиве все стараются, трудятся и прилагают усилия.</p>\n<p>Да будет воля Всевышнего, чтобы все мы удостоились достичь ступени «любящего» и увидеть исполнение слов:</p>\n<p><strong><strong>«И ангелы Божьи поднимаются и спускаются в нём» — внутри нас!</strong></strong></p>\n<p>Пусть эти слова Торы вдохновляют нас продолжать подниматься духовно, несмотря на трудности, пока служение Всевышнему не станет для нас источником радости и любви.</p>"}]
const chapter10Notes={"1":"<p>(1) Что касается самой мелахи связывания, некоторые из поздних законоучителей склонялись к мнению, что эта мелаха имеет место только тогда, когда посредством завязывания соединяют две вещи. См. «Меркавот а-Мишне», глава 10, закон 9, где написано: «Тот, кто сделал два стежка и завязал узел на конце нити, чтобы шов не распустился, не совершает этим узлом мелаху связывания, поскольку он не соединяет две вещи». Этим он опровергает вопрос, поставленный Рамахом: ведь каждый, кто делает два стежка, не несёт ответственности за шитьё, если не завязал узел на концах нитей; следовательно, он должен также нести ответственность за мелаху связывания.</p><p>Однако в своей книге «Шульхан Ацэй Шитим», симан 3, в разделе о мелахе связывания и развязывания, автор «Меркавот а-Мишне» изменил свою позицию и постановил, что тот, кто завязывает узел на конце швейной нити, несёт ответственность за мелаху связывания, поскольку посредством этого узла он прикрепляет нить к одежде.</p><p>Это рассуждение требует дополнительного изучения, ведь сам узел не соединяет две вещи, а лишь не даёт нити выйти из своего положения. См. также респонсы «Авней Нэзер», Орах Хаим, симан 180, где автор также придерживается мнения, что мелаха связывания имеет место только при соединении двух вещей. Там же он задаёт вопрос относительно узла на ремешке тфилин.</p><p>Однако, по-видимому, основным следует считать то, что подразумевается из слов Рамаха, приведённых выше: ответственность за мелаху связывания наступает даже тогда, когда человек не соединяет две вещи. Это также следует из простого смысла слов «Йереим», который пишет, что тот, кто завязывает узел на конце верёвки, несёт ответственность за мелаху связывания. Эти слова приводит Рема в симан 317, סעיף 1.</p><p>И хотя можно было бы объяснить, что речь идёт о случае, когда благодаря завязыванию верёвка не расплетается на отдельные нити, тем не менее из того, что «Йереим», Рема и другие авторитеты не уточнили этого, следует, что они исходили из простого понимания: ответственность за мелаху связывания наступает за само завязывание узла. Поэтому представляется логичным, что даже если человек завязывает узлы исключительно в декоративных целях, это также относится к мелахе связывания.</p><p>Следует ещё изучить, не считается ли это мелахой, которая не нужна сама по себе (мелаха ше-эйна цриха ле-гуфа), поскольку в Мишкане не завязывали подобные узлы. Тем не менее это полноценный узел. См. ниже пункт 32, где мы приводим слова Маарсаля, согласно которым разрыв узла имеет тот же статус, что и его развязывание. См. там же примечание (54).</p>","2":"<p>(2) То, что было написано относительно мнения Рамбама, — что узел, не требующий мастерской работы, разрешается завязывать на средний срок, и мудрецы запретили его только в том случае, если он завязывается на длительное время, — следует из простого смысла его слов в начале главы 10 законов о Шаббате. Так же постановили При Мегадим, симан 317, «Эшель Авраам», пункт 3; «Махацит а-Шекель», пункт 10; «Мишна Брура», пункт 5; и «Биур Галаха», начало пункта 1, в словах «который не является постоянным узлом».</p><p>Однако «Шилтей а-Гиборим», примечание 2; «Турей Захав», пункт 1; и Гаон из Вильно, пункт 2, придерживаются мнения, что, согласно Рамбаму, даже узел на средний срок запрещено завязывать, если он не требует мастерской работы. См. также респонсы «Авней Нэзер», симан 178, и «Теилат Давид», симан 317, пункт 1.</p>","3":"<p>(3) Практические различия между мнениями Раши и Роша, с одной стороны, и Рамбама — с другой, следующие:</p><p>а. Если человек завязывает узел, который должен оставаться завязанным длительное время, но этот узел не требует мастерской работы, то, согласно Раши, это запрещено запретом Торы, а согласно Рамбаму — только постановлением мудрецов.</p><p>б. Если человек завязывает узел, который должен оставаться завязанным среднее время и не требует мастерской работы, то, согласно Раши, это запрещено постановлением мудрецов. Согласно Рамбаму, это разрешено, по мнению При Мегадим и придерживающихся его позиции, упомянутых в предыдущем примечании, поскольку здесь присутствуют два обстоятельства, облегчающие положение: узел не предназначен для постоянного использования на длительное время и не требует мастерской работы.</p><p>в. Если человек завязывает узел на короткое время, но этот узел требует мастерской работы, то, согласно Раши, это разрешено, поскольку любой узел, предназначенный на короткое время, разрешается завязывать. Мы не находим источника для того, чтобы согласно Раши придерживаться более строгого мнения в отношении мастерской работы по сравнению с обычной работой. Согласно же Рамбаму, это запрещено постановлением мудрецов, поскольку узел требует мастерской работы.</p>","4":"<p>(4) Бейт Йосеф пишет от имени Рабейну Йерухама, что если человек завязал узел на полгода или на год, он считается постоянным узлом.</p>","5":"<p>(5) См. «Мишна Брура», начало симана 317, а также выше примечание (2).</p>","6":"<p>(6) Симан 317, пункт 1, Рема. И хотя, согласно мнению Рамбама, если узел не требует мастерской работы и предназначен не на длительное, а на среднее время, то, по мнению При Мегадим и придерживающихся его позиции, приведённых в примечании (20), это разрешено, тем не менее на практике придерживаются более строгого мнения Раши и Роша, согласно которому здесь действует запрет, установленный мудрецами.</p>","7":"<p>(7) Рема там, от имени «Коль Бо». См. также «Мишна Брура», пункт 6.</p>","8":"<p>(8) Рема там, от имени «Тура» и «Мордехая». См. также «Мордехай» там, симан 384, от имени «Сефер а-Трума». Из его слов следует, что когда сказано, что узел, предназначенный на семь дней, запрещён, речь идёт не обязательно о семи полных сутках. Даже если семь суток не истекают полностью, запрет всё равно действует. Например, это касается тех мудрецов Торы, которые завязывали обувь в субботу утром и развязывали её только в ночь следующей субботы.</p>","9":"<p>(9) Симан 317, пункт 1.</p>","10":"<p>(10) См. «Биур Галаха», симан 317, пункт 1, слова «которые не являются».</p>","11":"<p>(11) Узлы, упомянутые в Мишне, трактат Шаббат, лист 111.</p>","12":"<p>(12) См. «Биур Галаха», симан 317, пункт 1, слова «тот, кто завязывает».</p>","13":"<p>(13) «Шилтей а-Гиборим», приведённый Рема в симане 317, пункте 1.</p>","14":"<p>(14) Симан 317, пункт 1, Рема, от имени «Шилтей а-Гиборим». См. также «Хазон Иш», симан 52, пункт 17, где написано, что эти положения не относятся к основному закону, а являются лишь строгостью, принятой в качестве обычая. Согласно же основному закону, узел поверх узла, завязанный на один день, разрешается развязать.</p><p>Он выводит это из Мишны, трактат Шаббат, лист 111, где сказано, что женщина может завязать завязки своего платья. В Гемаре задаётся вопрос: разве это не очевидно? Ведь наверняка она завязала узел поверх узла, поскольку один узел сам по себе ничего не представляет. Из этого следует, что даже узел поверх узла разрешён.</p><p>Возможно, вопрос «Хазон Иша» можно разрешить следующим образом: «Шилтей а-Гиборим» запрещает только два узла, которые сильно затянуты. Если же узлы не затянуты сильно, это разрешено. Во всяком случае, это относится к тем узлам, которые обычно никогда не затягивают сильно, например к завязкам платья, которые женщина завязывает. См. ниже примечание (16).</p><p>На первый взгляд, доказательство словам «Шилтей а-Гиборим» о том, что два узла, завязанные один поверх другого, считаются работой мастера, по крайней мере когда они сильно затянуты, можно привести из Гемары, трактат Шаббат, лист 131. Там разъясняется, что тот, кто в Шаббат делает цицит для своей одежды, обязан принести хатат.</p><p>На первый взгляд, завязывание нитей цицит обычно не требует мастерской работы, а состоит лишь в завязывании узла поверх узла. Если так, то непонятно, почему, согласно Рамбаму, человек несёт ответственность за хатат, ведь это не работа мастера. Этот вопрос также задаётся в книге «Мекор Хаим» автора «Тосфот Йом-Тов», который приводит из этой Гемары доказательство в пользу мнения Раши.</p><p>См. также «Минхат Хинух», в дополнении «Мусах а-Шаббат», мелаха связывания, где написано, что ответственность за это возникает из-за мелахи «Маке бе-Патиш». Однако это трудно согласовать с тем, что относительно удаления ягод мирта многие из первых законоучителей считают, что здесь нет запрета Торы, а действует лишь запрет мудрецов.</p><p>Кроме того, автор «Минхат Хинух» приводит из книги «Таам а-Мелех» мнение относительно тфилин: поскольку этот узел является узлом, необходимым для тфилин, он считается узлом, имеющим особое значение. Однако и это рассуждение является новаторским.</p><p>Рабейну Там в «Тосафот», трактат Эрувин, лист 97, слова «Абайе», придерживается иного мнения. Он задаёт вопрос к Рабейну Элиягу: почему за завязывание тфилин в Шаббат человек несёт ответственность, ведь это не постоянный узел? Из этого, по-видимому, следует, что узел поверх узла считается работой мастера.</p><p>Возможно, можно возразить, что цицит отличаются от других узлов, поскольку при их изготовлении также делают плетение. И, возможно, благодаря узлам и плетению эта работа в большей степени считается мастерской. Однако это требует объяснения, ведь плетение само по себе не является частью узла.</p><p>На самом деле, однако, здесь нет затруднения: ведь обычай йеменских евреев состоит в том, чтобы завязывать узлы цицит особым способом, которому необходимо учиться и который затягивается очень крепко. Представляется, что такое завязывание действительно считается работой мастера. Возможно, именно так обычно завязывал цицит и сам Рамбам. Это также следует из его слов в главе 1 законов о цицит, закон 7. Поэтому приведённая выше Гемара не представляет затруднения для его мнения: согласно его подходу, обычное завязывание цицит является работой мастера, и потому за него человек несёт ответственность за хатат.</p>","15":"<p>(15) Рема, симан 317, пункт 1.</p>","16":"<p>(16) В книге «Кицур Шульхан Арух», симан 80, пункт 45; «Рав Пеалим», часть 2, симан 40; и «Каф а-Хаим», симан 317, пункт 4, подпункт 24, запрещают это. Однако рав Шломо-Залман Ойербах, благословенна память праведника, в «Шмират Шаббат ке-Илхата», глава 15, примечание 167, придерживается мнения, что это разрешено, поскольку такой узел обычно вообще не затягивают сильно. Всё, что мы находим у «Шилтей а-Гиборим» в качестве запрета, относится к крепко затянутому узлу. То же самое мы слышали от имени рава Йосефа-Шалома Элияшива. К этому можно присоединить и слова «Бедек а-Байт», приведённые в «Шаарей Тшува», пункт 1, где написано, что обычай — разрешать узел поверх узла.</p>","17":"<p>(17) «Мишна Брура», симан 317, конец пункта 23, от имени «Хайей Адам». См. также «Хазон Иш», симан 52, пункт 17, где написано, что основная цель слов «Хайей Адам» — научить, что узел, образовавшийся сам по себе, считается узлом, предназначенным лишь на короткое время.</p><p>Из слов «Хайей Адам», по-видимому, следует, что даже если человек намеревался сделать петлю на средний срок, например на семь дней, но петля запуталась и превратилась в узел поверх узла, то даже в таком случае его статус подобен узлу, предназначенному на короткое время.</p><p>Однако «Хазон Иш» задаёт вопрос: ведь форма этого узла — такая, в отношении которой опасаются, что она относится к работе мастера. Следовательно, развязывать его всё равно должно быть запрещено. Ведь даже если мы считаем его узлом, образовавшимся на короткое время, поскольку он возник сам по себе, тем не менее узел, относящийся к работе мастера, запрещено развязывать даже тогда, когда он завязан на короткое время. По мнению «Хазон Иша», очевидно, что то, что узел завязался сам по себе, совершенно не лишает его статуса работы мастера.</p><p>«Хазон Иш» отвечает, что всё опасение относительно узла поверх узла, который считается работой мастера, основано лишь на принятом обычае строгости, а не на основном законе, как было сказано выше в примечании (14). Этот обычай не распространяется на узел, образовавшийся сам по себе.</p><p>Однако тот, кто внимательно изучит слова «Хайей Адам», правило 27, пункт 42, увидит, что, по-видимому, разрешение развязывать узел поверх узла, образовавшийся сам по себе, относится только к случаю, когда человек испытывает неудобство или страдание. Это соответствует словам Рема в симане 317, пункте 1, который разрешил развязывать узел поверх узла в случае неудобства. Согласно этому, из его слов нельзя доказать, что он принципиально не опасается мнения «Шилтей а-Гиборим».</p><p>Однако «Мишна Брура» приводит разрешение «Хайей Адам» и не требует, чтобы речь шла именно о случае неудобства. Из этого, по-видимому, следует, что его точное мнение соответствует позиции «Хазон Иша».</p>","18":"<p>(18) Рема, симан 317, пункт 1. Сам закон о том, что узел на конце нити считается узлом и не имеет того же статуса, что другой узел, упомянутый ниже в пункте 10, который не считается узлом, приводится в «Семаге» и других трудах первых законоучителей.</p><p>Новшество, добавленное в этом пункте, состоит в том, что даже если это непостоянный узел, который человек собирается развязать в тот же день, всё равно следует остерегаться его завязывания из опасения, что он относится к категории работы мастера.</p>","19":"<p>(19) См. «Кицур Шульхан Арух», симан 80, пункт 45. Из его слов ясно следует, что и в этом случае такой узел имеет статус другого узла на конце нити, и его запрещено завязывать, даже если человек намерен развязать его в тот же день. Этот узел также упоминается в «Хайей Адам», правило 27, пункт 1, и в «Хазон Иш», Орах Хаим, симан 52, пункт 12, слова «Тур». Однако там прямо не уточняется, относится ли он к общему правилу сомнения относительно того, считается ли узел работой мастера.</p>","20":"<p>(20) «Хайей Адам», общее правило 27, пункт 1. Источник этого положения — «Йереим», симан 274. См. также «Шмират Шаббат ке-Илхата», глава 15, примечание 100, где от имени рава Шломо-Залмана Ойербаха, благословенна память праведника, приводится новаторское постановление: если верёвка сделана из металлической проволоки таким образом, что даже один узел сохраняется и не развязывается сам по себе, то за завязывание даже одного узла человек несёт ответственность.</p><p>Однако представляется очевидным, что если человек завязал одним узлом два конца полиэтиленового пакета, то здесь совершенно нет подобного опасения, поскольку такой узел в конечном счёте не сохраняется.</p>","21":"<p>(21) Это не похоже на то, что мы написали ниже, в пункте 14, относительно петли поверх узла, которую некоторые законоучители запрещают. Там верхняя петля укрепляет первый узел, подобно тому как узел поверх узла укрепляет его. Поэтому благодаря петле первый узел приобретает статус узла, завязывание которого запрещено, согласно мнению этих законоучителей.</p><p>В отличие от этого, продевание концов верёвки под обмотку не является дополнительным действием завязывания, которое укрепляет первый узел. В конечном итоге такой узел ослабевает. Некоторые приводили из книги «Нимукей Орах Хаим», симан 317, пункт 5, мнение, согласно которому это продевание подобно петле поверх узла.</p><p>Однако относительно случая, когда человек завязывает один узел, а затем обматывает концы верёвки вокруг связки, см. «Раавия», законы лулава, симан 690. Там написано, что именно таким способом принято связывать лулав. Бейт Йосеф приводит это в симане 651. «Раавия» пишет, что таким способом узел удерживается крепко, как если бы его завязали дважды.</p><p>В его словах не уточняется, продевает ли человек после обматывания концы верёвки под обмотку. Однако Рема в симане 651, пункт 1, пишет, что обычай состоит в том, чтобы обмотать верёвку и продеть конец под обмотку. Но Рема не говорит о случае, когда изначально был завязан узел.</p><p>На это уже обратил внимание Гра в своих комментариях там: в «Раавия» и «Мордехай» речь идёт о случае, когда сначала завязали узел. Однако и в комментариях Гра не уточняется, продевал ли человек концы верёвки под обмотку.</p><p>На первый взгляд, неизбежно следует заключить, что речь идёт именно о случае, когда концы верёвки продевают под обмотку, поскольку иначе обмотка вообще не будет держаться. В «Раавия» также не уточняется, разрешается ли делать это в Йом-Тов или запрещается.</p><p>Однако в упомянутых комментариях Гра прямо сказано, что это разрешено, поскольку он приводит доказательство из Гемары, лист 74, где объясняется, что тот, кто делает два стежка и завязывает их, несёт ответственность за шитьё. См. там, где ясно сказано, что за описанное выше действие человек не несёт ответственности за мелаху связывания.</p><p>Следовательно, если мы истолкуем слова «Раавия» так, что речь идёт о случае, когда конец верёвки продевают под обмотку, как мы и предположили, поскольку, по-видимому, речь определённо идёт именно об этом, то из слов Гра следует, что это разрешено делать в Шаббат.</p><p>Однако в книге «Бикурей Яаков» там, пункт 7, однозначно постановлено, что тот, кто завязывает один узел, а затем обматывает верёвку и продевает концы под обмотку, не имеет права делать это в Шаббат, поскольку обматывание и продевание укрепляют узел. Он пишет, что «Раавия» говорит о будничном дне, а не о Шаббате, в отличие от того, что следует из «Дархей Моше».</p>","22":"<p>(22) «Шульхан Арух», симан 317, пункт 5.</p>","23":"<p>(23) См. формулировку Рабейну Хананеля, трактат Сукка, лист 33, который пишет, что петля — это половина узла. По-видимому, его намерение соответствует тому, что мы объяснили выше: человек продевает не конец нити, а её середину, поэтому это не полноценный узел и он легко развязывается.</p>","24":"<p>(24) «Мишна Брура», симан 317, пункт 29.</p>","25":"<p>(25) Бейт Йосеф, симан 317, от имени «Мордехай»; «Шилтей а-Гиборим», глава «Элу Кшарим»; «Турей Захав», симан 317, пункт 7; и «Маген Авраам», пункт 15.</p><p>Следует знать, что даже согласно этим мнениям, по которым петля поверх узла считается узлом, она всё же не относится к категории работы мастера, как разъясняется в «Мишна Брура», пункт 29. Поэтому если человек завязывает узел и делает поверх него петлю на короткое время, в этом вообще нет запрета. Даже согласно Рамбаму, который запрещает работу мастера, даже если она выполняется на короткое время, как разъяснялось выше в пункте 3, здесь это разрешено, поскольку данное действие вообще не относится к категории работы мастера.</p>","26":"<p>(26) Так следует из книги «Агур», приведённой Рема в симане 317, пункте 5. Так же пишет «Левуш», пункт 5. Это также следует из комментариев Гра к симану 317, пункту 5. И совершенно прямо это сказано в комментариях Гра к «Эвен а-Эзер», законы халицы, симан 169, пункт 99.</p>","27":"<p>(27) Симан 317, пункт 29.</p>","28":"<p>(28) Поскольку верхний узел отделён от нижнего петлёй, находящейся между ними, он не сохраняется и в конечном итоге развяжется. Здесь также совершенно нет опасения, что это относится к работе мастера.</p><p>Особенно учитывая, что само постановление «Шилтей а-Гиборим», запрещающее узел поверх узла на короткое время, является лишь строгостью, как разъяснялось выше в пункте 5.</p><p>Кроме того, в описанном случае, когда человек связывает две петли шнурков, при вытягивании конца шнурка петли вместе с узлом поверх них развязываются. Таким образом, здесь тем более есть основание для послабления, поскольку речь идёт о петле.</p><p>Во всяком случае, совершенно очевидно, что здесь нет опасения относительно работы мастера, поскольку это вовсе не крепкий узел. Слова книги «Шмират Шаббат ке-Илхата», глава 15, пункт 53, запрещающей это, требуют дополнительного изучения.</p><p>Следует позаботиться о том, чтобы завязывать только сами петли друг с другом, не включая в узел концы шнурков. Если включить в узел также и концы, то он не развяжется при вытягивании шнурка, и, возможно, тогда он будет иметь статус крепкого узла.</p>","29":"<p>(29) Гра, симан 317, пункт 1. См. также предисловие «Мишна Брура» к симану 317, где написано, что постоянный узел — это, например, узел, который обычно оставляют завязанным навсегда, не устанавливая заранее срок, по истечении которого намерены его развязать.</p><p>Формулировка Гемары, трактат Шаббат, лист 74, где сказано, что человек завязывает узел с намерением его развязать, по-видимому, означает, что требуется чёткое намерение развязать узел.</p>","30":"<p>(30) На первый взгляд, если произошло так, что в момент завязывания человек намеревался развязать узел в тот же день, но впоследствии не пришлось его развязывать, и поэтому узел остался на длительное время, то его всё равно разрешается развязать. Ведь в момент завязывания человек был уверен, что узел не останется на длительное время, и он никогда не передумывал оставлять его завязанным. Просто так получилось, что узел ему не понадобилось развязывать до тех пор, пока установленный срок не прошёл. Этот вопрос требует дополнительного изучения.</p>","31":"<p>(31) См. «Турей Захав», симан 317, пункт 2, и «Шульхан Арух а-Рав» там, где они разрешают это. «Мишна Брура» не приводит их слов. В книге «То́рат Шаббат» приводятся слова Раши, трактат Шаббат, лист 112, слова «Китра», который пишет, что длинный ремешок, продеваемый в кольцо, изначально запрещено завязывать там, поскольку иногда его оставляют завязанным на неделю или две. Из этого следует, что следует запретить завязывание и в случае сомнения, останется ли узел на средний срок. То же следует из слов Раши там, в комментарии к словам «бе-Рабанан».</p>","32":"<p>(32) См. «Шмират Шаббат ке-Илхата», глава 15, примечание 197, где приводится мнение рава Шломо-Залмана Ойербаха, благословенна память праведника. Он рассматривает вопрос об узле, который завязался сам по себе, а человек впоследствии решил оставить его навсегда: приобретает ли он с этого момента статус постоянного узла?</p><p>Однако см. там же, в третьей части «Шмират Шаббат ке-Илхата», где рав Шломо-Залман приводит, что в респонсах «Авней Нэзер», симан 181, пункт 4, придерживаются принципа, принятого во всей Торе: изменение намерения отменяет предыдущее намерение. Следовательно, с того момента, как человек передумал и решил развязать узел, его первоначальное намерение, существовавшее после первого завязывания, отменяется. Этот вопрос требует дополнительного изучения.</p><p>Очевидно, что если человек завязал в Шаббат узел, который совершенно не является постоянным, а затем в тот же день передумал и решил никогда его не развязывать, то его новое намерение не превращает задним числом первоначальное завязывание в завязывание постоянного узла. Тем не менее возможно, что с этого момента такой узел приобретает статус постоянного узла, и его запрещено развязывать, как было сказано выше.</p>","33":"<p>(33) См. слова рава Шломо-Залмана Ойербаха, приведённые в книге «Шмират Шаббат ке-Илхата». Он цитирует «Хайей Адам», который пишет, что если человек сделал петлю на семь дней, а петля сама по себе запуталась и превратилась в узел, то разрешается развязать этот узел, поскольку он имеет статус непостоянного узла.</p><p>Рав Шломо-Залман понял, что речь идёт о случае, когда даже после того, как человек узнал, что петля превратилась в узел, он отказался от намерения развязать его до истечения семи дней. Подобное также следует из «Хазон Иш», симан 52, пункт 17, слова «Катав».</p><p>Из этого рав Шломо-Залман заключил, что, по мнению «Хайей Адам», в отношении узла, запрещённого постановлением мудрецов, мы не руководствуемся намерением человека, поскольку узел завязался сам по себе.</p><p>Однако можно сказать, что всё это относится к узлу, который завязался сам по себе, без намерения человека. В таком случае мы утверждаем, что при любых обстоятельствах он не относится к категории узлов, предназначенных на определённое время. Но если человек завязал узел намеренно, собираясь развязать его спустя короткое время, а затем передумал, возможно, что даже в отношении запрета мудрецов мы руководствуемся его новым намерением, и поэтому развязывать такой узел запрещено.</p>","34":"<p>(34) Так следует из того, что Гемара и законоучители запретили развязывать постоянный узел, не проводя различия между случаем, когда узел уже оставался завязанным длительное время, и случаем, когда человек передумал и решил развязать его в тот же день, когда завязал.</p><p>Причина в том, что намерение не отменяет действие: в момент завязывания человек намеревался оставить узел на длительное время. Подобно тому как в отношении любого узла, завязанного на длительный срок и уже остававшегося завязанным длительное время, мы не говорим, что с момента изменения намерения он приобретает статус непостоянного узла, поскольку новое намерение не отменяет статус узла, так и здесь представляется, что даже если человек передумал в тот же день, когда завязал узел, его новое намерение не отменяет статус постоянного узла, возникший в момент завязывания.</p><p>Это можно сравнить с правилом, приведённым в трактате Кидушин, лист 59: все предметы приобретают статус восприимчивых к ритуальной нечистоте посредством намерения, но утрачивают этот статус только посредством физического изменения. См. также комментарии Гра к симану 310, пункт 7, слова «Эла им кен», где он приводит подобное рассуждение относительно законов мукце.</p>","35":"<p>(35) Так написано в книге «Йереим», приведённой в «Мишна Брура», симан 317, пункт 34.</p>","36":"<p>(36) «Биур Галаха», симан 317, пункт 1, слова «а тот, кто завязывает». Он задаёт вопрос к «Турей Захав», который не написал этого. См. там, где он приводит, что подобное написал и «Бейт Меир».</p><p>Из слов «Биур Галаха», по-видимому, следует, что он не ставит различие в зависимость от того, есть ли причина или необходимость развязать узел. Различие состоит лишь в следующем: если на этой конкретной обуви принято развязывать узел каждый день, то это разрешено, даже если узел такого типа обычно завязывают навсегда. Выше мы написали это в соответствии с формулировкой «Бейт Меира».</p>","37":"<p>(37) См. там же, в «Биур Галаха». Это также доказывается из Гемары, трактат Шаббат, лист 112, где обсуждается сандал «де-ки тарей». Поскольку в этой обуви обычно выходили и отец, и его сын, она считалась узлом, не являющимся постоянным, хотя речь шла об узле сапожника, который обычно завязывают навсегда.</p>","38":"<p>(38) «Бейт Меир», симан 317, пункт 1.</p>","39":"<p>(39) Пример этого разъясняется в «Шульхан Арух», симан 317, пункт 3: разрешается развязать ворот одежды от узла, который завязал прачечник. Иными словами, обычные люди вообще не привыкли завязывать ворот, а прачечник завязывал его лишь до тех пор, пока хозяин не приходил забрать свою одежду домой.</p>","40":"<p>(40) «Мишна Брура», пункт 21, от имени «Левуша». Представляется, что причина в следующем: поскольку узел завязывается только до тех пор, пока хозяин не заберёт одежду домой, мудрецы придали ему статус узла, который вообще не является постоянным, даже если нам известно, что его не развяжут в течение семи дней.</p><p>См. «Шмират Шаббат ке-Илхата», глава 9, примечание 55, где рав Шломо-Залман Ойербах добавляет, что такой узел завязывается только один раз и обычно его вообще не завязывают повторно. Только в этом случае «Левуш» разрешил его, поскольку мудрецы вовсе не придали ему статус постоянного узла.</p><p>Нельзя сказать, что причина мнения «Левуша» заключается в том, что речь идёт о сомнительном узле. См. выше пункт 16, примечание (31): ведь относительно сомнительного узла «Турей Захав» и «Шульхан Арух а-Рав» придерживаются разрешающего мнения, тогда как здесь они постановили строже, как разъясняется в следующем примечании. «Мишна Брура», обсуждая вопрос об узле прачечника, приводит их как придерживающихся мнения, расходящегося с «Левушем». Кроме того, само их мнение не является однозначным, и «Мишна Брура» его не приводит, как разъяснялось выше в примечании (31).</p>","41":"<p>(41) См. «Мишна Брура», симан 317, пункт 21, от имени «Турей Захав». Так же пишет «Шульхан Арух а-Рав». Обратите внимание, что в «Мишна Брура» приведённое выше мнение «Левуша» изложено как основное, без оговорок, тогда как слова «Турей Захав» приводятся с формулировкой: «Есть придерживающиеся более строгого мнения».</p>","42":"<p>(42)мелаха ше-эйна цриха ле-гуфа См. респонсы Маариля Дискина, «Кунтрес Ахарон», примечание 35. Он пишет, что очевидно, что в завязывании такого узла нет запрета Торы, поскольку это мелаха, которая не нужна сама по себе (). Иными словами, постоянный узел, запрещённый Торой, — это именно тот узел, который человеку нужен навсегда. В рассматриваемом же случае он нужен ему лишь на короткое время.</p><p>Кроме того, он выражает сомнение: возможно, поскольку человек собирается выбросить связанный предмет, это подобно случаю, когда он намерен развязать узел. См. там, где он не выносит окончательного решения по этому вопросу.</p><p>Рав Шломо-Залман Ойербах, благословенна память праведника, в книге «Шмират Шаббат ке-Илхата», глава 35, примечание 43, приводит доказательство в пользу запрета из слов Раши, трактат Сукка, лист 33, слова «Хутар Агудо». Раши пишет, что нельзя завязывать лулав в Шаббат или Йом-Тов полноценным узлом, поскольку это постоянный узел, который человек не собирается развязывать никогда. Это предмет, используемый для исполнения заповеди и подлежащий выбрасыванию: после праздника человек в конечном итоге выбросит всю связку лулава. И всё же Раши считает это постоянным узлом.</p><p>Однако в третьей части «Шмират Шаббат ке-Илхата», глава 35, примечание 15, рав Шломо-Залман Ойербах изменил свою позицию и постановил, что с точки зрения закона нет различия между тем, кто завязывает узел с намерением развязать его через короткое время, и тем, кто завязывает его с намерением через короткое время выбросить весь связанный предмет в мусор. См. там, где он объясняет различие между этим случаем и случаем с лулавом.</p>","43":"<p>(43) При завязывании галстука первым способом, описанным выше, сначала свободно завязывают один узел вокруг шеи, а затем добавляют обмотки, которые вообще не имеют статуса дополнительных узлов, после чего завязывают ещё один узел.</p><p>Такое завязывание разрешено, если человек намерен развязать его в тот же день, поскольку здесь нет опасения, что это относится к работе мастера. Это не похоже на узел поверх узла, который «Шилтей а-Гиборим» постановил считать работой мастера, как объяснялось выше в пункте 5. Причина в том, что при завязывании узла поверх узла верхний узел удерживает концы нижнего узла и не позволяет им выйти наружу.</p><p>Однако при завязывании галстука описанным выше способом обмотки и узел, завязанный поверх первого узла, совершенно не препятствуют выходу конца галстука из его положения. Когда этот конец выходит, весь узел развязывается. Поэтому это вовсе не крепкий узел.</p><p>Что касается завязывания такого галстука без намерения развязать его в тот же день, можно было бы рассмотреть возможность разрешить это, поскольку даже после обматывания вокруг шеи остаётся только один узел, который вообще не считается узлом, так как его легко вывести из положения. Он не строже петлевого узла, упомянутого выше в пункте 12, который вообще не считается узлом.</p><p>Однако на практике современные законоучители рассматривают это как узел с петлёй поверх него. Так приводится от имени рава Шломо-Залмана Ойербаха в книге «Шмират Шаббат ке-Илхата», глава 15, пункт 48: не следует разрешать завязывать галстук таким способом иначе как на один день. Если же он предназначен более чем на один день, следует придерживаться строгого мнения.</p><p>Некоторые приводят от имени рава Нисима Карлица, что, хотя с точки зрения основного закона представляется, что здесь вообще нет статуса узла, тем не менее правильно придерживаться строгости и не завязывать его на средний срок.</p>","44":"<p>(44) При завязывании галстука вторым способом посередине нити образуется узел в том виде, который был описан выше в пункте 8. Следует опасаться, что он имеет статус узла, требующего мастерской работы. Поэтому его нельзя завязывать даже на один день.</p><p>И хотя в этом узле галстука одна его сторона продевается через узел, тем не менее «Хазон Иш», Орах Хаим, симан 52, пункт 12, слова «Тур», пишет, что и такой узел относится к категории узлов.</p><p>Не следует ошибочно полагать, что такое завязывание запрещено не может быть, поскольку оно представляет собой обычную петлю, упомянутую выше в пункте 12. Это неверно. Действительно, когда галстук снимают с шеи, остаётся лишь петлевой узел, который вообще не считается узлом. Однако когда галстук обхватывает шею, мы рассматриваем два его конца как два конца нити, выходящие с противоположных сторон шеи и завязываемые между собой. Форма узла в таком случае соответствует описанному выше варианту: посередине нити имеется узел, через который продевается другая нить. Этот узел уже нельзя считать обычной петлёй, поскольку шея не позволяет вытянуть петлю.</p><p>Однако, согласно тому, что мы привели выше в примечании (16) от имени рава Шломо-Залмана Ойербаха и рава Йосефа-Шалома Элияшива, разрешающих узел поверх узла, если он завязан свободно, особенно в случае, когда обычно его развязывают в тот же день, здесь также есть основание для послабления, если человек намерен развязать его в тот же день, поскольку он не завязывает крепкий узел.</p><p>Кроме того, можно сказать, что поскольку основное постановление «Шилтей а-Гиборим» является лишь строгостью, то здесь, когда через узел продевается дополнительная нить, положение ещё легче, и это вообще не выглядит как работа мастера. Следовательно, есть основания рассмотреть возможность разрешить и такой вид завязывания, если человек намерен развязать его в тот же день.</p>","45":"<p>(45) Этот закон следует из того, что было написано выше в пункте 20 от имени «Бейт Меира» и «Биур Галаха». Следует рассмотреть следующий вопрос: если Реувен завязывает галстук для Шимона, причём Реувен обычно развязывает свой галстук каждый день, а Шимон не привык развязывать свой галстук ежедневно, а делает это лишь спустя длительное время, следует ли исходить из привычек завязывающего? Тогда будет разрешено завязать галстук, если они заранее решили, что развяжут его в тот же день. Или же следует исходить из привычек владельца, и тогда Реувену запрещено завязывать галстук, даже если он намерен развязать его в тот же день, поскольку владелец обычно оставляет такой узел на длительное время?</p>","46":"<p>(46) Корень разногласия заключается в толковании Мишны, трактат Шаббат, лист 156. Там рассказывается о случае, когда сосуд привязали к стеблю тростника, чтобы произвести измерение ради исполнения заповеди.</p><p>Рамбам объяснил, что речь идёт об узле, запрещённом постановлением мудрецов. «Маген Авраам», пункт 3, поясняет, что это означает: для его завязывания потребовалась работа мастера, однако запрета Торы здесь нет, поскольку узел не был постоянным. Так же постановил и Тур: разрешено завязывать узел, предназначенный оставаться на средний срок, ради исполнения заповеди.</p><p>Однако Раши в Мишне там же и «Тосафот» на листе 156 объясняют, что речь шла о непостоянном узле, поэтому его разрешили завязать. Согласно их мнению, здесь нет источника, позволяющего разрешить завязывание узла ради исполнения заповеди. Так же пишет «Бейт Меир».</p><p>См. «Мишна Брура», симан 317, пункт 13, где он ссылается на слова «Бейт Меира».</p><p>На первый взгляд, кажется, что в случае узла, предназначенного оставаться менее семи дней, можно разрешить это. Во-первых, ведь «Биур Галаха» в пункте 4, в разделе, начинающемся словами «Ше-эйнам», постановил, что в случае необходимости можно положиться на мнения, согласно которым узел, предназначенный оставаться менее семи дней, вообще не считается постоянным узлом.</p><p>Кроме того, «Бейт Меир» пишет, что из самих слов Раши следует, что до семи дней можно разрешить это. Ведь Раши в трактате Шаббат, лист 157, объяснил, что привязывание черпака к стеблю тростника представляет собой непостоянный узел, поскольку в конечном итоге он развяжется. Однако представляется очевидным, что стебель тростника не обязательно должен развязаться в тот же день. Следовательно, из подхода Раши в этом обсуждении следует, что до семи дней это не запрещено даже постановлением мудрецов.</p>","47":"<p>(47) В книге «Минхат Шаббат», симан 80, пункт 155, автор обращает внимание на тех, кто сворачивает свитки Торы, завязывая узел с петлёй поверх него: ведь если такой узел предназначен оставаться более 24 часов, возникает опасение нарушения запрета постановлением мудрецов, как объяснялось выше в пункте 2.</p><p>Однако в книге «Шмират Шаббат ке-Илхата», глава 15, примечание 178, приводится от имени рава Шломо-Залмана Ойербаха, благословенна память праведника, что принято разрешать это. То же мы слышали от рава Йосефа-Шалома Элияшива. Причина заключается в том, что здесь есть несколько оснований для послабления:</p><p>а) Сам основной закон относительно узла с петлёй поверх него является предметом разногласия, как объяснялось выше в пункте 10.</p><p>б) Согласно мнению Рамбама и Тура, разрешено завязывать узел, запрещённый постановлением мудрецов, ради исполнения заповеди, как объяснялось выше в примечании (46).</p><p>в) В данном случае узел предназначен оставаться менее семи дней, а «Биур Галаха» в пункте 4 разрешил это в случае необходимости.</p><p>г) В любом случае, согласно мнению Рамбама, здесь вообще нет запрета, поскольку узел не постоянный и не требует мастерской работы. См. выше примечание (2).</p><p>Если же узел предназначен оставаться семь дней, здесь имеются три из четырёх упомянутых выше оснований для послабления. Следует выяснить, принято ли разрешать и такой случай.</p><p>Также следует выяснить, разрешено ли в Шаббат развязать свиток Торы, который свернули в четверг. Представляется логичным, что подобно тому, как, согласно мнению Рамбама, разрешили завязывать узел, запрещённый постановлением мудрецов, ради исполнения заповеди, так же разрешили и развязывать такой узел ради исполнения заповеди. Однако если имеется другой свиток Торы, следует выяснить, допустимо ли доставать именно тот свиток, который связан таким узлом.</p>","48":"<p>(48) В описанном случае, когда узел предназначен оставаться в течение длительного времени, на первый взгляд, возникает опасение нарушения запрета Торы. Ведь выше, в пункте 1, примечании 4, мы привели слова Рабейну Йерухама, который пишет, что узел, завязанный на полгода или год, считается постоянным узлом. Представляется, что эти слова относятся и к случаю, когда заранее известно, что узел развяжут через год, поскольку, в конечном счёте, он предназначен оставаться в течение длительного времени. Вопрос требует дальнейшего изучения. Поэтому представляется, что здесь следует придерживаться строгого мнения.</p>","49":"<p>(49) Глава 10, закон 8. Приведено в «Маген Авраам», симан 317, и в «Мишна Брура» там же, пункт 34.</p>","50":"<p>(50) См. «Биур Галаха», симан 314, пункт 8, раздел, начинающийся словами «Хоталот». Там написано, что, согласно мнению Раши и Тура, разделение верёвки на отдельные волокна не относится к мелахе развязывания, и это не соответствует мнению Рамбама.</p>","51":"<p>(51) См. «Шмират Шаббат ке-Илхата», глава 15, примечание 166, где от имени рава Шломо-Залмана Ойербаха, благословенна память праведника, приводится строгое мнение по этому вопросу. То же мы слышали от имени рава Йосефа-Шалома Элияшива.</p><p>Однако рав Шмуэль Вознер в своём ответе, опубликованном в сборнике «Ми-Бейт Леви», часть 1, считает, что здесь есть основания для послабления. Таково также мнение рава Нисима Карлица.</p><p>Основная причина заключается в том, что, по их мнению, нельзя выводить запрет из приведённых выше слов Рамбама о том, что тот, кто скручивает верёвки, несёт ответственность. Ведь скручивание верёвок по самой своей сути не тождественно завязыванию узла, чтобы из этого следовало, что скручивание верёвок на средний срок подпадает под запрет постановлением мудрецов.</p><p>Лишь в случае изготовления верёвки действию скручивания придали статус завязывания узла. Поэтому не следует запрещать использование металлической застёжки-ленты, даже если человек скручивает её концы друг с другом: само действие скручивания вообще не имеет статуса завязывания узла и представляет собой лишь своего рода замок. См. также то, что мы написали по этому вопросу в конце книги, симан 1.</p>","52":"<p>(52) Ранние законоучители спорят о том, распространяется ли запрет Торы на мелаху развязывания только на случай, когда человек развязывает узел с намерением снова завязать его, но если он развязывает его без намерения завязать заново, то запрета Торы нет, даже если он не действует с целью испортить предмет. Таково мнение Роша, глава 7 трактата Шаббат, симан 20.</p><p>Или же ответственность за развязывание наступает и тогда, когда человек не намерен снова завязывать узел, при условии, что он не действует с целью разрушения. Таково мнение Рамбама, глава 1, закон 17.</p><p>См. «Биур Галаха», симан 340, пункт 13, раздел, начинающийся словами «Ве-ло», где он пишет, что следует придерживаться строгого мнения в этом вопросе.</p>","53":"<p>(53) «Мишна Брура», симан 317, пункты 7 и 23, от имени «Ям шель Шломо».</p>","54":"<p>(54) Это новшество «Ям шель Шломо» требует объяснения: на чём оно основано? Ведь, на первый взгляд, подобно тому, как мелаха завязывания заключается в самом завязывании узла, так и мелаха развязывания, по всей видимости, заключается в самом действии развязывания узла.</p><p>Но откуда следует запрет разрезать нить не в месте узла? Это простое действие, и, возможно, оно вообще не имеет статуса мелахи. Ведь даже если мы примем, что суть мелахи завязывания заключается в соединении двух предметов посредством узла, см. выше примечание (1), всё же представляется, что ответственность за мелаху развязывания не должна наступать за любой способ разделения соединённых предметов, а только за действие, направленное на развязывание самого узла, в котором имеется осмысленное действие мелахи.</p><p>Возможно, «Ям шель Шломо» вывел своё мнение из слов Раши на листе 157, раздел, начинающийся словами «Гами». Раши пишет, что стебель тростника не становится постоянным узлом, поскольку при высыхании он разрывается. Из этого следует, что разрыв нити рассматривается как развязывание узла.</p><p>Однако, на первый взгляд, можно объяснить, что Раши лишь имеет в виду, что сам узел в конечном итоге также разорвётся.</p><p>Если бы мы не принимали мнение «Ям шель Шломо», следовало бы рассмотреть, каков закон в отношении человека, который разрезает ножницами сам узел. Возможно, и это вообще не относится к мелахе развязывания, поскольку он не развязывает узел, а просто уничтожает его.</p><p></p>"};

const cleanTitle=t=>t.replace(/\s+/g,' ').trim().toLocaleLowerCase('ru');

 if(!/^H[1-4]$/.test(el.tagName))break;
 const heading=cleanTitle(el.textContent);
 if(heading===cleanTitle(c.title))el.remove();
 else break;
}

// Keep a chapter number at the beginning of every chapter's text.
const chapterHeading='Глава '+(index+1);

 content.insertBefore(numberHeading,content.firstChild);
}
