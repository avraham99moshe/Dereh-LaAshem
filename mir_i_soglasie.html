нью.<\/p>", "<p>И прежде всего выигрывает именно он сам.<\/p>", "<p>Он постоянно пребывает в радости.<\/p>", "<p>Он чувствует, что владеет собой, умеет управлять своими желаниями и эмоциями.<\/p>", "<p>Это уже не тот человек, который раньше всё время сердился, раздражался и разочаровывался.<\/p>", "<p>Тот, кто будет жить таким образом и ежедневно работать над собой, удостоится настоящего шалом-байта — мира и гармонии в семье.<\/p>", "<p>Как сказано в трактате «Авот» (5:19):<\/p>", "<p>«Добрый глаз, смиренный дух и скромная душа — качества учеников нашего праотца Авраама. А дурной глаз, высокомерный дух и ненасытная душа — качества учеников нечестивого Билама.»<\/p>", "<p>Мишна продолжает:<\/p>", "<p>«Ученики Авраама наслаждаются благами этого мира и наследуют Мир грядущий. А ученики Билама исчезают из мира и погибают.»<\/p>", "<p>Добрые качества характера — это ключ к счастливой жизни и к настоящему миру в семье.<\/p>"]}, {"number": 7, "title": "Вмешательство посторонних в семейную жизнь", "body": ["<p>У многих супружеских пар, когда они сталкиваются с непониманием, обидой или ссорой, возникает желание обратиться за помощью к посторонним людям — родственникам, родителям, друзьям и другим.<\/p>", "<p>Следует знать, что запрещено вовлекать в семейную жизнь мнения или советы людей, которые не являются квалифицированными специалистами в этой области. Даже родители или братья и сёстры, которые, безусловно, искренне хотят помочь всем сердцем, всё же, не будучи профессионалами, могут причинить гораздо больше вреда, чем пользы.<\/p>", "<p>Знайте, что даже если проблема между супругами не столь серьёзна, вмешательство других людей может лишь усугубить её и сделать значительно тяжелее.<\/p>", "<p>Супруги должны ещё до свадьбы принять на себя обязательство и решить, что они не будут вовлекать в свою семейную жизнь никаких посторонних людей, не являющихся специалистами в области семейных отношений.<\/p>", "<p>Опыт показывает, что множество хороших семей было разрушено именно из-за вмешательства родственников. Мы знаем немало пар, которые развелись, и когда их спрашивают: «Какими были ваши отношения?», они отвечают: «В целом наши отношения были вполне хорошими, просто мы не смогли ужиться с родителями».<\/p>", "<p>Поэтому здесь требуется большая осторожность.<\/p>", "<p>Как известно, на каждой строительной площадке висит предупреждающий знак: «Опасно! Здесь ведётся строительство. Вход посторонним запрещён.»<\/p>", "<p>Так же и в семейной жизни: когда супруги строят свою совместную жизнь, вход посторонних людей и чужих мнений должен быть категорически запрещён.<\/p>", "<p>Однако, как и на строительной площадке, вход профессионалов разрешён и даже необходим, потому что без них невозможно построить здание. То же самое относится и к семейной жизни.<\/p>", "<p>Многие супруги оказывались в ситуации, когда им было необходимо обратиться за советом к специалистам, но они упорно отказывались это сделать, полагая, что смогут справиться самостоятельно.<\/p>", "<p>Такие супруги, которые вовсе не обращались за консультацией и помощью, в итоге потерпели серьёзную неудачу.<\/p>", "<p>Если возникает необходимость в совете и помощи, не следует жалеть ни усилий, ни денег — нужно сразу же обратиться за необходимой профессиональной помощью.<\/p>", "<p>Отсюда обращение к родителям, которые, с Божьей помощью, выдают своих детей замуж или женят их.<\/p>", "<p>Пожалуйста, очень постарайтесь вообще не вмешиваться в жизнь молодой семьи. Сделайте всё возможное, чтобы избежать этого. Даже если вас пытаются вовлечь против вашей воли.<\/p>", "<p>Несмотря на ваше искреннее желание помочь и поддержать, несмотря на то, что вы интересуетесь жизнью молодой семьи и пытаетесь дать им советы, опыт показывает, что в этом обычно оказывается больше вреда, чем пользы.<\/p>", "<p>Пожалуйста, дорогие родители, не вмешивайтесь!<\/p>", "<h3>Почему особенно важно предотвращать вмешательство родителей<\/h3>", "<p>Это важно по нескольким причинам:<\/p>", "<p>А. Обычно родители эмоционально находятся на стороне одного из супругов, поэтому они склонны выслушивать, понимать и принимать во внимание лишь одну сторону конфликта.<\/p>", "<p>Б. Как правило, родители не являются специалистами и не обладают профессиональным опытом в решении проблем семейного мира (шалом-байт). Поэтому они могут дать советы, которые окажутся неправильными, а возможно, даже вредными.<\/p>", "<p>Поэтому, даже если супруги просят вас вмешаться, пожалуйста, направьте их к раввину или к квалифицированному семейному консультанту.<\/p>"]}, {"number": 8, "title": "Любовь между супругами", "body": ["<p>Царь Шломо (Соломон) говорит в книге Мишлей (Притчи) 10:12:<\/p>", "<p>«Любовь покрывает все проступки».<\/p>", "<p>Когда между супругами существует настоящая любовь, то даже если между ними случаются ошибки или недоразумения, им намного легче относиться к этому с пониманием, без гнева и ссор. Когда же такой любви недостаточно, тогда даже самая незначительная мелочь вызывает сильное раздражение, гнев и становится причиной ненужных конфликтов.<\/p>", "<p>Это подобно детям, которые беспокоят своих родителей и будят их посреди ночи, во время крепкого и сладкого сна, прося принести им что-нибудь попить. Родители совсем не сердятся, а принимают это с пониманием и любовью, и даже целуют своего ребёнка перед тем, как он снова заснёт.<\/p>", "<p>Почему так происходит?<\/p>", "<p>Потому что родители испытывают огромную любовь к своим детям. Поэтому всё, что делают дети, кажется незначительным по сравнению с этой любовью.<\/p>", "<p>Обычно ссоры возникают потому, что каждый из супругов носит в себе претензии, обиды и накопившиеся переживания по отношению к другому. Тогда любая, даже самая незначительная причина становится подобна уколу иголкой в надутый воздушный шар — всё мгновенно взрывается, и начинается ссора.<\/p>", "<p>В конце концов, когда ссора заканчивается и супруги мирятся, каждый из них задумывается о том, из-за чего вообще возник конфликт, и понимает, что на самом деле было совершенно бессмысленно ссориться из-за такой мелочи.<\/p>", "<p>Поэтому, когда человек по-настоящему работает над этим важнейшим качеством, которое называется любовью к ближнему, и искренне старается его развивать, это значительно улучшает отношения между супругами.<\/p>", "<p>Разумеется, каждый должен работать прежде всего над самим собой, а не пытаться исправить другого. Тогда любовь естественным образом становится сильнее, как сказано в книге Мишлей (Притчи) 27:19:<\/p>", "<p>«Как в воде лицо отражает лицо, так сердце человека — человеку».<\/p>", "<p>Поэтому даже ошибки или различные трудности становится намного легче принимать и с ними мириться.<\/p>", "<h3>Что такое любовь?<\/h3>", "<p>Мишна в трактате Авот, глава 5, мишна 16, говорит:<\/p>", "<p>«Всякая любовь, которая зависит от какого-либо обстоятельства, — когда исчезает это обстоятельство, исчезает и любовь. Но любовь, не зависящая ни от какого обстоятельства, не исчезает никогда. Какая любовь зависит от обстоятельства? Любовь Амнона и Тамар. А какая не зависит от обстоятельства? Любовь Давида и Йонатана.»<\/p>", "<p>В случае с Амноном, когда исчезла причина, по которой он любил Тамар, его любовь превратилась в ненависть, причём ненависть стала даже сильнее той любви, которую он прежде испытывал к ней.<\/p>", "<p>Так же и между супругами необходимо всеми силами стремиться к тому, чтобы любовь мужа и жены не зависела ни от какой причины или внешнего фактора. Это должна быть любовь, которая исходит из того, что в Высшем мире они являются одной душой, а в этом мире они также являются одним телом.<\/p>", "<p>Разве человек перестанет любить свою левую руку только потому, что правая рука сильнее, красивее или более деятельна? Человек любит каждую часть своего тела, потому что всё это — он сам.<\/p>", "<p>Так же и муж или жена должны относиться к своему супругу. Жена — «кость от моих костей и плоть от моей плоти». Именно поэтому муж будет продолжать любить её, заботиться о ней и не будет сердиться на неё, даже если она совершит ошибки.<\/p>", "<p>Такой должна быть любовь между мужем и женой — без какой-либо причины или внешнего основания. Тогда супруги понимают друг друга и принимают друг друга с добрым расположением духа. Такой подход предотвращает множество напряжений, проявлений гнева и ссор.<\/p>", "<p>Если жить с таким пониманием и осознанием, жизнь становится гораздо более приятной, радостной и счастливой.<\/p>", "<p>Б. Каждый из супругов должен стараться замечать хорошие качества своего спутника жизни: его достоинства, положительные черты характера, хорошие поступки и всё доброе, что в нём есть.<\/p>", "<p>Следует смотреть именно на хорошие стороны, а не воспринимать их как нечто само собой разумеющееся. Если поступать так, это наполняет сердце любовью к другому даже в обычные дни, когда между супругами не произошло никаких конфликтов.<\/p>", "<p>Такая внутренняя работа должна продолжаться всю жизнь.<\/p>", "<p>Иногда в этом наступает некоторое ослабление, особенно если произошла ссора. Тогда сила любви между мужем и женой значительно уменьшается.<\/p>", "<p>В таком случае каждому необходимо провести внутреннюю работу — над самим собой — чтобы вернуть отношения и любовь к тому состоянию, какими они были прежде, и даже сделать их ещё крепче.<\/p>", "<p>Когда человек чаще обращает внимание на положительные стороны другого, уровень напряжения остаётся низким, и ссоры возникают не так быстро.<\/p>", "<p>Но если, не дай Бог, супруги перестают замечать хорошее друг в друге, тогда любая, даже самая незначительная ошибка сразу же повышает уровень напряжения, а следующая ссора наступает гораздо быстрее и происходит значительно чаще.<\/p>", "<p>Отсюда путь к серьёзному ухудшению отношений становится очень коротким.<\/p>", "<p>Поэтому мудрый человек старается как можно скорее стереть из своего сердца впечатления, оставшиеся после ссоры, и вернуться к настоящей любви — простить и отказаться от обиды.<\/p>", "<p>Хотя после ссоры прощать и отпускать очень трудно, не будем забывать, что и у нас самих есть ошибки, и мы очень хотим, чтобы на Небесах нам их простили.<\/p>", "<p>Точно так же мы ожидаем от других людей, а особенно от мужа или жены, что они простят и забудут наши ошибки.<\/p>", "<p>Так же, как мы ожидаем этого от других, мы должны поступать по отношению к ним.<\/p>", "<p>В. Хорошо известно и часто повторяется, что любовь приходит через отдачу.<\/p>", "<p>Любовь родителей к своим детям не знает границ. Почему? Потому что родители постоянно дают своим детям и непрерывно вкладывают в них свои силы — как физически, так и своими мыслями, заботой и постоянным попечением.<\/p>", "<p>Соответственно этому возрастает любовь родителей к своим детям.<\/p>", "<p>Если мы сумеем увеличить свою отдачу также по отношению к супругу или супруге, то благодаря этому сможем усилить и любовь.<\/p>", "<p>Разумеется, отдача должна быть и материальной — обеспечивать все потребности, которые необходимы каждому из супругов. Но не менее важна эмоциональная отдача: постоянно думать о том, как можно порадовать, поддержать и что-то дать другому при каждой возможности, при каждой встрече.<\/p>", "<p>Следует стремиться подарить хорошее чувство, доброе и радостное слово. Перед каждой совместной беседой, перед каждым телефонным разговором стоит остановиться на мгновение и понять, что если сказать доброе слово или проявить личное внимание, то этим будет сделано самое важное из всего.<\/p>", "<p>Нужно понимать, что личное, эмоциональное внимание является пищей для человеческой души. Оно приносит глубокое удовлетворение, радует, сближает людей и укрепляет настоящую любовь между супругами.<\/p>", "<p>Когда один из супругов старается вести себя таким образом, другой также стремится поступать так же, и польза для обеих сторон оказывается огромной.<\/p>", "<p>Когда человек прилагает усилия в этом, он удостаивается также особой помощи от Всевышнего, как сказали наши мудрецы в трактате Макот 10б:<\/p>", "<p>«По тому пути, по которому человек желает идти, его и ведут».<\/p>", "<p>Какой бы путь человек ни избрал для себя в этом мире, с Небес ему помогают достичь его и идти по нему.<\/p>", "<p>Если человек действительно этого хочет, старается и молится об этом, он получит особую помощь с Небес, чтобы преуспеть во всём этом.<\/p>", "<p>Сущность брака, как пишет наш учитель Рамхаль, — это впустить своего супруга (или супругу) в самые сокровенные комнаты своего сердца. <\/p>"]}, {"number": 9, "title": "Заповедь милосердия (хесед)", "body": ["<p>Заповедь милосердия (хесед) — одна из самых важных и драгоценных заповедей. Народ Израиля исполняет её с радостью, и есть люди, которые особенно стараются исполнить эту заповедь, помогая другим вне своего дома.<\/p>", "<p>Но проблема возникает тогда, когда, вернувшись домой, у них уже не остаётся сил и терпения проявлять ту же доброту к своей семье. Им кажется, что они уже исполнили свой долг, оказывая помощь другим.<\/p>", "<p>Дорогой еврей! Если человек делает добро только вне дома, но не в своём доме, то такой хесед нельзя назвать настоящим. Часто это становится добром ради почёта и признания, ведь окружающие хвалят его, говорят: «Молодец!», «Какой праведный человек!». А дома не всегда услышишь слова благодарности, особенно от детей, которые ещё не понимают, как важно сказать папе «спасибо».<\/p>", "<p>Поэтому, если человек не проявляет доброту и заботу в собственном доме, это может свидетельствовать о том, что его добрые дела вне дома совершаются ради уважения и славы.<\/p>", "<p>Настоящий хесед начинается дома — с жены и детей. Он важнее, чем помощь братьям, родителям, родственникам или даже другим людям в общине. Об этом сказали наши мудрецы: «Бедные твоего города — прежде других» (Вавилонский Талмуд, Бава Меция 71а), то есть ближайшие к человеку имеют первоочередное право на его помощь и заботу.<\/p>", "<p>Если же человек именно так и поступает, то это показывает, что и его добрые дела вне дома являются искренним и настоящим хеседом.<\/p>", "<p>Дорогие супруги! Перед нами великая заповедь, которая находится буквально в наших руках — внутри нашего собственного дома, и исполнять её можно каждое мгновение.<\/p>", "<p>Хесед начинается с дома. Милосердие — одна из тех заповедей, на которых, по словам наших мудрецов, стоит мир. Поэтому очень важно исполнять эту заповедь правильно.<\/p>"]}, {"number": 10, "title": "Преодоление трудностей нашего поколения", "body": ["<p>Наше поколение удостоилось большого изобилия во всех сферах жизни. Кажется, что жизнь с каждым днём становится всё легче, удобнее и доступнее. Сегодня очень легко получить различные удобства и удовольствия.<\/p>", "<p>То, что раньше требовало целого дня труда, например стирка или выпечка, сегодня выполняется одним нажатием кнопки. Если раньше приходилось долго отмывать и чистить посуду, то теперь одноразовая посуда значительно облегчила эту работу.<\/p>", "<p>Казалось бы, такой образ жизни должен был привести к более лёгким и гармоничным семейным отношениям, ведь сегодня намного меньше бытовых трудностей, проблем и испытаний, чем раньше.<\/p>", "<p>Однако, к сожалению, мы видим прямо противоположное. В нашем поколении стало гораздо больше серьёзных проблем в семейной жизни, значительно чаще происходят разлады и разводы, тогда как в прежние времена подобные случаи были намного более редкими.<\/p>", "<p>Возникает вопрос: что же произошло с нашим поколением? Разве раньше не было трудностей, испытаний и жизненных проблем? Конечно, были — и зачастую даже больше, чем сегодня. Почему же именно поколение изобилия и комфорта так тяжело переносит испытания?<\/p>", "<p>Ответ прост. Раньше у людей было желание справляться с трудностями. Сегодня же, когда жизнь стала настолько лёгкой и удобной, у многих исчезло стремление преодолевать испытания. Столкнувшись даже с небольшими трудностями, супруги нередко предпочитают «разбить всё», вместо того чтобы вместе искать решение проблемы.<\/p>", "<p>Немалую роль в этом сыграла испорченная западная культура, проникшая во многие еврейские дома. В этой культуре почти не придаётся значения святости семьи и брака. Главной ценностью становится немедленное получение удовольствия без усилий. Поэтому целью брака нередко становится лишь удовлетворение собственных желаний, а не готовность строить отношения и преодолевать трудности.<\/p>", "<p>Из-за этого о многих супружеских парах, столкнувшихся даже с небольшим испытанием, можно услышать: «Мы просто не подходим друг другу».<\/p>", "<p>Но необходимо понять: не существует такой реальности, как «идеально подходящие друг другу» люди. Супруги не рождаются полностью совместимыми. Каждый вырос в другой семье, в иной среде, с другими привычками, воспитанием и образом мышления. По сути, всё у них разное.<\/p>", "<p>Настоящая совместимость создаётся самими супругами. Она рождается благодаря взаимной работе над собой, уважению, терпению и готовности вместе строить свой дом.<\/p>", "<p>С того момента, как мужчина и женщина принимают совместное решение вступить в брак, они могут стать по-настоящему подходящей друг другу парой. Но совместимость не возникает сама собой — она создаётся постоянной работой всей жизни, когда супруги учатся приспосабливаться друг к другу.<\/p>", "<p>Не существует и не может существовать такой реальности, чтобы люди были «идеально совместимы» без труда и ежедневных усилий. Это серьёзное заблуждение, которое укоренилось в сознании многих супругов. Они думают, что должны быть совместимыми с самого начала, и тем самым снимают с себя ответственность за работу над отношениями и преодоление жизненных испытаний.<\/p>", "<p>Каждая супружеская пара должна знать слова наших мудрецов: «Жена — от Господа для мужа» (Мишлей / Притчи 19:14). Если бы великий праведник или выдающийся каббалист сказал супругам: «Вы предназначены друг другу Небесами», — они, несомненно, поверили бы ему. Если бы сам святой Аризаль пришёл и сказал им это, они поверили бы тем более. А если бы это сказал рабби Шимон бар Йохай или сам Моше-рабейну — насколько же сильнее была бы их вера!<\/p>", "<p>Но следует помнить: Сам Всевышний говорит нам в Своём слове: «Жена — от Господа для мужа». Как же тогда можно говорить: «Мы не подходим друг другу»?<\/p>", "<p>Лишь в очень редких и исключительных случаях, о которых говорит святой «Зоар», когда человек совершает множество тяжёлых грехов, ему может быть дана супруга, не принадлежащая к корню его души. Однако подавляющее большинство супружеских пар соединяются по воле Всевышнего. Проблема не в отсутствии совместимости, а в нежелании трудиться, преодолевать трудности и вкладывать силы в успех семейной жизни.<\/p>", "<p>Что же следует делать?<\/p>", "<p>Прежде всего необходимо получить хорошее наставление и подготовку ещё до свадьбы. Очень важно начать семейную жизнь с правильной основы, отнестись к этому со всей серьёзностью и ответственностью. Будущие супруги должны понимать, что такая подготовка важнее многих других вещей.<\/p>", "<p>Не менее важно заранее знать, что после свадьбы неизбежно будут трудности и испытания, и быть готовыми их преодолевать.<\/p>", "<p>Если у человека возникают сложности с детьми, он не оставляет их и не ищет способа избавиться от них. Даже если ему очень тяжело, он ни при каких обстоятельствах не согласится расстаться со своими детьми. Он будет бороться за них всеми своими силами, примет на себя любые трудности и постарается использовать все возможные средства, чтобы справиться с ними.<\/p>", "<p>Такое же, а возможно, и ещё более сильное стремление должно быть у супругов в отношении своего брака. Необходимо быть готовыми преодолевать все испытания и трудности, встречающиеся на пути совместной жизни. Ни в коем случае нельзя опускать руки и сдаваться.<\/p>", "<p>Когда человек искренне желает сохранить свой дом, прилагает все усилия, вкладывает свои силы, волю и мысли в построение семьи, достойной еврейского дома, он получает большую помощь от Всевышнего. Ведь наши мудрецы сказали: «По тому пути, по которому человек желает идти, его ведут» (Макот 10б). И поскольку человек выбирает путь труда, самоотдачи и преодоления трудностей, Небеса помогают ему идти именно этим путём.<\/p>"]}, {"number": 11, "title": "Беседа между супругами", "body": ["<p>Очень важно, чтобы супруги время от времени специально выделяли время для совместной беседы. Во время такого разговора они могут обсудить все вопросы, которые возникают в их совместной жизни, а также любые другие темы.<\/p>", "<p>Общение между мужем и женой очень сближает их и даёт каждому возможность выразить себя, рассказать о своих потребностях, поделиться тем, что лежит на сердце, зная, что рядом есть человек, который внимательно выслушает, постарается понять и искренне сопереживать.<\/p>", "<p>Такое спокойное и доверительное общение создаёт атмосферу открытости и укрепляет связь между супругами.<\/p>", "<p>Не менее важно знать, как правильно вести разговор или обсуждение, чтобы оно принесло максимальную пользу как в практическом, так и в эмоциональном отношении.<\/p>", "<p>Прежде всего, беседа между супругами должна проходить в доброжелательной атмосфере, с большим уважением к мнению другого. Во время разговора следует внимательно слушать собеседника, показывать, что его слова были услышаны и поняты. Полезно даже повторить услышанное своими словами, чтобы убедиться, что вы правильно поняли его мысль и намерение.<\/p>", "<p>Однажды я прочитал историю о психологе, к которому пришёл человек, уже потерявший надежду после обращения ко многим специалистам. Этот психолог не применял никаких особых методов лечения — он просто внимательно слушал пациента и повторял ему его собственные слова, помогая почувствовать, что его действительно понимают. И этого оказалось достаточно, чтобы человек начал выздоравливать.<\/p>", "<p>Если мнение или слова супруга кажутся вам неверными, не следует резко ему возражать. Несогласие нужно выражать максимально уважительно и тактично.<\/p>", "<p>Также очень важно не втягиваться в спор, потому что в споре не бывает настоящих победителей. Как сказал один мудрый человек: «Победить в споре — значит не вступать в него».<\/p>", "<p>Наши мудрецы учат в трактате «Авот» (5:9):<\/p>", "<p>«Семь качеств есть у невежественного человека и семь — у мудреца».<\/p>", "<p>Одно из качеств мудреца состоит в том, что он не говорит в присутствии того, кто превосходит его мудростью или положением. Мудрый человек умеет сдерживать себя, позволяет другим говорить первыми и высказывать своё мнение, особенно если они старше или мудрее его.<\/p>", "<p>Ещё одно качество мудреца — он не перебивает своего собеседника, а даёт ему закончить мысль до конца, даже если самому есть что сказать.<\/p>", "<p>Кроме того, мудрецы называют ещё одну важную черту мудрого человека: «Он не торопится отвечать».<\/p>", "<p>Человек, который слишком спешит с ответом, вполне может не понять, о чём на самом деле говорил собеседник. В таком случае его ответ окажется вовсе не по существу. Но даже если он уловил общий смысл сказанного, это ещё не означает, что он полностью понял намерение и мысли другого человека. Именно из-за этого нередко возникают недоразумения, ненужное напряжение и конфликты.<\/p>", "<p>Поэтому мудрость заключается в том, чтобы сначала внимательно выслушать, постараться понять собеседника до конца и только затем спокойно и уважительно отвечать.<\/p>", "<p>Продолжая перечислять качества мудреца, мишна говорит: «Мудрец признаёт истину».<\/p>", "<p>Мудрый человек внимательно прислушивается к словам другого, понимает, когда в них есть истина, и не стыдится признать, что сам ошибался.<\/p>", "<p>Нередко во время разговора каждый из собеседников заранее убеждён: «Другой, конечно, неправ, а прав только я». Из-за такого отношения слова другого человека сразу отвергаются, даже без попытки увидеть, что в них может содержаться доля истины. А если эта истина и становится очевидной, многие всё равно не готовы её признать.<\/p>", "<p>Именно здесь должны проявиться качества честности и любви к истине, побуждающие человека стать тем самым мудрецом, который способен признать правду, даже если она противоречит его собственным словам.<\/p>", "<p>Гемара (Эрувин 13б) задаёт вопрос:<\/p>", "<p>«Почему во всех местах закон (галаха) установлен в соответствии с мнением школы Бейт Гилель?»<\/p>", "<p>Гемара отвечает:<\/p>", "<p>Потому что ученики Бейт Гилель были кроткими, смиренными и терпеливыми. Они изучали не только собственное мнение, но и мнение школы Бейт Шаммай. Более того, при обсуждении закона они сначала приводили мнение Бейт Шаммай и лишь затем своё собственное.<\/p>", "<p>Когда Бейт Шаммай приводили доказательства из Торы, а Бейт Гилель — другие доказательства, ученики Бейт Гилель прежде всего старались внимательно изучить и понять доводы своих оппонентов, проникнуть в их ход мыслей, и только потом рассматривали собственное мнение.<\/p>", "<p>Именно благодаря такому стремлению к истине они удостоились того, что Галаха была установлена в соответствии с их мнением.<\/p>", "<p>Рассказывают об одной супружеской паре. После того как они выдали замуж и женили всех своих детей, однажды они сидели друг напротив друга в полном молчании. Никто не мог завести разговор, который заинтересовал бы другого.<\/p>", "<p>Жена спросила мужа:<\/p>", "<p>— Почему ты ничего не говоришь?<\/p>", "<p>Муж ответил:<\/p>", "<p>— Тридцать лет мы не разговаривали. А теперь ты хочешь, чтобы мы начали говорить?<\/p>", "<p>Неужели они действительно тридцать лет не разговаривали? Конечно же, разговаривали. Но все их беседы касались только повседневных дел: ведения хозяйства, заработка, воспитания детей и других бытовых вопросов.<\/p>", "<p>Однако у них никогда не было настоящих личных, душевных разговоров между мужем и женой. Постепенно между ними возникла внутренняя отчуждённость, и теперь они уже не могли поддержать тёплую и интересную беседу.<\/p>", "<p>Задумаемся, как происходит так, что супруги перестают разговаривать друг с другом.<\/p>", "<p>Вполне возможно, что в начале семейной жизни они пытались вести откровенные беседы. Но поскольку они не знали, как правильно разговаривать в доброжелательной атмосфере, такие разговоры заканчивались напряжением, спорами и взаимными обвинениями. Каждый упрямо настаивал на своей правоте.<\/p>", "<p>Очень быстро супруги приходили к выводу, что подобные разговоры не приносят никакой пользы. Поэтому они предпочитали вовсе отказаться от таких бесед, чтобы избежать новых конфликтов и напряжения.<\/p>", "<p>Но если бы с самого начала они научились внимательно слушать друг друга, проявлять уважение, понимание и искреннее желание разобраться в мыслях и чувствах своего супруга, каждый такой разговор приносил бы им глубокое удовлетворение. Тогда у них появлялось бы желание снова и снова возвращаться к таким встречам и беседам.<\/p>", "<p>Такое общение оказывает исключительно положительное влияние на всю дальнейшую семейную жизнь. И тогда, когда дети вырастают и покидают родительский дом, у супругов по-прежнему остаётся человек, с которым можно поговорить, поделиться мыслями и провести время в тёплой беседе.<\/p>", "<p>Разговор способен построить семейную жизнь, но может и разрушить её. Чем внимательнее супруги будут относиться к тем принципам общения, о которых говорилось выше, тем больше пользы и благословения принесут их беседы.<\/p>"]}, {"number": 12, "title": "Критика", "body": ["<p>В Талмуде, в трактате Шаббат 54б, сказано:<\/p>", "<p>«Всякий, кто может выразить протест (упрекнуть) членам своего дома и не делает этого, несет ответственность за членов своего дома. Если он мог упрекнуть жителей своего города и не сделал этого — несет ответственность за жителей своего города. Если же мог упрекнуть весь мир и не сделал этого — несет ответственность за весь мир».<\/p>", "<p>Заповедь увещевания (тохаха) является заповедью Торы, и каждый обязан ее исполнять.<\/p>", "<p>Однако в трактате Арахин 16б мы находим слова раби Тарфона:<\/p>", "<p>«Удивляюсь я, есть ли в этом поколении хоть кто-нибудь, кто способен принять наставление. Если кто-то скажет другому: &quot;Убери соринку между своими зубами&quot;, тот ответит ему: &quot;Лучше убери бревно из своих глаз&quot;».<\/p>", "<p>Иными словами, когда человеку говорят: «Убери соринку между своими зубами», то есть указывают на небольшой недостаток или грех, вместо того чтобы признать свою ошибку, исправиться и поблагодарить того, кто сделал ему замечание, он дерзко отвечает: «Убери бревно из своих глаз», то есть указывает собеседнику на его собственные, более серьезные недостатки.<\/p>", "<p>Возникает вопрос. Если человеку скажут, что его костюм испачкан пылью, он не станет возмущаться. Напротив, он будет рад и поблагодарит того, кто обратил его внимание на это, после чего поспешит очистить одежду.<\/p>", "<p>Почему же, когда человеку указывают на качество характера или черту личности, которую ему необходимо исправить, — на вещи гораздо более важные и существенные в жизни, — он сразу начинает сопротивляться и ему становится очень трудно принять сказанное?<\/p>", "<p>Дело в том, что каждый человек в целом склонен смотреть на самого себя положительно. У него всегда находится множество оправданий и объяснений, которыми он прикрывает собственные поступки, даже самые отрицательные. Большинство людей ощущают себя почти совершенными. Как сказал царь Шломо в книге Мишлей (Притчи) 21:2:<\/p>", "<p>«Всякий путь человека прям в его собственных глазах».<\/p>", "<p>Именно это укрепляет его чувство уверенности в себе.<\/p>", "<p>Поэтому, когда человека начинают критиковать за его поступки, качества или черты характера, он ощущает, будто твердая почва его самоуверенности уходит из-под ног. Его естественная, инстинктивная реакция — немедленно встать на защиту, ответить и бороться, чтобы отразить любую попытку поставить под сомнение его самого или его поступки.<\/p>", "<p>Во многих случаях такой «ответный бой» выражается в том, что человек начинает искать недостатки у самого критикующего и старается представить его в отрицательном свете.<\/p>", "<p>Поэтому людям очень трудно принимать критику от других, даже если эта критика совершенно справедлива.<\/p>", "<p>Так что же делать? С одной стороны, очень важно исполнять заповедь увещевания и указывать на ошибки. Но с другой стороны, это может привести к ссорам и раздорам.<\/p>", "<p>הנה התרגום לרוסית:<\/p>", "<p>Первое правило: как можно меньше критиковать других<\/p>", "<p>Когда речь идет о вопросах, не связанных с соблюдением Торы и заповедей или с дурными качествами характера, относительно которых существует заповедь: «Увещевай ближнего своего» («הוכח תוכיח את עמיתך»), — например, о бытовых привычках, ведении домашнего хозяйства, воспитании детей, заработке, ограничении семейных расходов и тому подобном, — в таких вопросах крайне желательно вообще не критиковать.<\/p>", "<p>Как уже говорилось, человеку в целом очень трудно принимать критику.<\/p>", "<p>Однако если речь идет о дурных качествах характера или о нарушении заповедей, и один из супругов чувствует обязанность сделать замечание другому, то и в этом случае следует проявлять величайшую осторожность. Если критика будет высказана неправильно, результат может оказаться прямо противоположным ожидаемому.<\/p>", "<p>Царь Шломо говорит в книге Мишлей (Притчи) 9:8:<\/p>", "<p>«Не обличай насмешника, чтобы он не возненавидел тебя; обличай мудреца — и он полюбит тебя».<\/p>", "<p>Святой Шела (Шней Лухот а-Брит) объясняет, что «мудрец» и «насмешник» в этом стихе — это один и тот же человек.<\/p>", "<p>Когда ты приходишь, чтобы сделать человеку замечание, не превращай его в своих словах в «насмешника», плохого и никчемного человека. В таком случае он, конечно же, ничего не примет от тебя и даже возненавидит тебя за это.<\/p>", "<p>Но если ты обращаешься к тому же человеку как к мудрому, достойному человеку, если говоришь ему от всего сердца, насколько он умен, добр, обладает хорошими качествами и способен услышать и принять сказанное, тогда он будет воспринимать замечание лишь как указание на одну конкретную область, которую стоит улучшить. Ведь, исправив этот недостаток, он сможет стать еще более совершенным человеком.<\/p>", "<p>Таким образом человеку становится гораздо легче принять сказанное, и вероятность того, что он действительно прислушается, исправит свое поведение и в конечном итоге не будет обижаться на того, кто сделал ему замечание, а, наоборот, полюбит его и будет благодарен ему за это, значительно возрастает.<\/p>", "<p>Из всего сказанного мы учим, что человек, который не способен или не умеет делать замечания правильно и ответственно, освобождается от обязанности критиковать и увещевать. Ведь в таком случае он лишь ухудшит положение, причинит вред, оттолкнет другого человека, а последствия могут оказаться еще более тяжелыми.<\/p>", "<p>Как сказали наши мудрецы в Талмуде, трактат Йевамот <\/p>", "<p>«Так же как существует заповедь говорить то, что будет услышано, так существует заповедь не говорить того, что не будет услышано».<\/p>", "<p>Правильная критика будет принята только тогда, когда она исходит от человека, умеющего делать замечания мудро, тактично и ответственно.<\/p>", "<p>Более того, прежде чем приступить к увещеванию, такому человеку следует обратиться с молитвой ко Всевышнему, чтобы слова, идущие от сердца, вошли в сердце слушающего и принесли добрые плоды.<\/p>", "<p>Лишь после этого следует начинать разговор, делая это с наибольшим уважением: сначала отметить хорошие качества и достоинства собеседника, его положительные стороны, и, разумеется, говорить без высокомерия, с искренним смирением и скромностью.<\/p>", "<p>Именно такой подход делает критику наиболее действенной. В этом случае значительно возрастает вероятность того, что слова найдут отклик в сердце слушателя и действительно принесут добрые плоды.<\/p>", "<p>Ни в коем случае нельзя, чтобы критика была спонтанной, необдуманной или высказанной в присутствии посторонних людей.<\/p>", "<p>Также нельзя делать замечание непосредственно в момент самого поступка. Каким бы возмутительным и болезненным ни было произошедшее, лучше не делать замечание и не выражать протест сразу. Немедленная вспышка лишь показывает отсутствие самообладания и является эмоциональной разрядкой, а потому нередко приводит к несправедливой реакции.<\/p>", "<p>Очень часто в порыве гнева человек говорит то, чего не следовало говорить, и в результате причиняет лишь боль, не приводя критикуемого к исправлению.<\/p>", "<p>Поэтому очень важно постараться сдержаться, немного промолчать, подумать, все тщательно обдумать, и только после этого делать замечание. Тогда и тот, кому оно адресовано, увидит, что слова были сказаны после серьезного размышления и с искренним намерением помочь, а соответственно, и результат будет совсем иным.<\/p>", "<p>Эти принципы относятся ко всем сферам жизни: к отношениям между мужем и женой, к воспитанию детей, к отношениям между раввином и учеником, к общине, соседям, родственникам, друзьям и т. д.<\/p>", "<p>В целом муж должен понимать, что он не отвечает за воспитание своей жены, и это вовсе не его задача. Точно так же и жена должна понимать, что она не отвечает за воспитание своего мужа, за исправление его путей и поведения.<\/p>", "<p>Каждый из супругов должен принимать другого таким, какой он есть, жить с ним и радоваться этому. Если же все-таки возникает необходимость сделать замечание или помочь исправиться, это следует делать только теми способами, о которых говорилось выше.<\/p>", "<p>Критика мужа в адрес жены или жены в адрес мужа, высказанная при детях, наносит огромный вред воспитанию детей.<\/p>", "<p>Дети в семье живут в определенных рамках, которые обеспечивают порядок и уважение. Пока эти рамки сохраняются, ребенок не выходит за их пределы. Когда же эти рамки начинают разрушаться? Тогда, когда муж и жена перестают уважать друг друга или, что еще хуже, начинают унижать друг друга.<\/p>", "<p>Если один из супругов делает замечание или критикует другого в присутствии детей, семейные границы разрушаются, и тогда дети тоже начинают позволять себе дерзость и вести себя так, как им вздумается.<\/p>", "<p>Поэтому ни при каких обстоятельствах нельзя делать замечания супругу или супруге в присутствии детей. Это одна из самых серьезных ошибок. Нельзя делать друг другу замечания при детях и нельзя насмехаться друг над другом при детях.<\/p>", "<p>Чем больше вы будете уважать друг друга, тем больше дети будут уважать и принимать вас.<\/p>", "<p>Однако если сами дети проявляют недостаточное уважение к матери или отцу, в таком случае на втором родителе лежит обязанность немедленно пресечь такое поведение. Тем самым он защищает и сохраняет честь своего супруга.<\/p>", "<p>Ни в коем случае нельзя позволять детям каким бы то ни было образом посягать на достоинство второго родителя. Напротив, необходимо постоянно воспитывать детей так, чтобы они все больше и больше уважали своих родителей.<\/p>", "<p>Например, когда отец входит в дом, мать должна позаботиться о том, чтобы дети встали в знак уважения к нему, потому что так повелевает Тора.<\/p>", "<p>Точно так же, когда в комнату входит мать, отец обязан воспитывать детей, чтобы они вставали в знак уважения к ней.<\/p>", "<p>Или, когда один из родителей идет немного отдохнуть, второй супруг должен позаботиться о том, чтобы дети соблюдали тишину в доме.<\/p>", "<p>Так же и во всех остальных аспектах семейной жизни каждый из супругов должен задумываться и искать способы, как помочь детям еще больше уважать своих родителей.<\/p>", "<p>Такой подход является очень важной основой в воспитании детей. Благодаря этому у детей будет уважение и послушание по отношению к родителям, и в конечном итоге от этого выиграют все.<\/p>"]}, {"number": 13, "title": "Важность обновления", "body": ["<p>Многие супружеские пары, начинающие строить свой дом, в первые годы семейной жизни живут в любви и взаимной привязанности, взаимопонимании и готовности отдавать друг другу. Их дом наполнен всеми теми прекрасными качествами, которые должны быть у благочестивых еврейских супругов.<\/p>", "<p>Однако с годами любовь и семейная гармония постепенно начинают угасать. Доходит до того, что супруги с тоской и ностальгией вспоминают первые годы своей совместной жизни.<\/p>", "<p>Почему так происходит? Ведь должно было быть совсем наоборот. Любовь не возникает за один день — она строится постепенно, с течением времени. Следовательно, чем больше проходит лет, тем сильнее и глубже она должна становиться. Но на практике мы нередко видим обратное. Почему?<\/p>", "<p>Ответ заключается в том, что так же, как во всем в жизни человеку необходимо обновление, так и любовь нуждается в постоянном обновлении.<\/p>", "<p>Как этого достичь?<\/p>", "<p>Человек не питается всю жизнь одной и той же пищей, которую ел в ранней молодости. Его привычки в еде и предпочтения меняются с возрастом, в соответствии с годами и состоянием здоровья.<\/p>", "<p>Так же меняется и одежда человека. В молодости он одевается так же, как его сверстники, но, повзрослев, изменяет свой вкус в соответствии со своим возрастом и положением.<\/p>", "<p>То же самое относится и к семейной жизни супругов. То внимание и та любовь, которые я дарил супругу или супруге в прежние годы, уже недостаточны. Семейная жизнь нуждается в постоянном обновлении.<\/p>", "<p>Каждый раз необходимо заново проявлять внимание, теплоту и близость друг к другу, придавая особое, искреннее значение каждой встрече, каждому телефонному разговору и каждой совместной трапезе.<\/p>", "<p>Такое отношение должно сохраняться непрерывно, даже в самом преклонном возрасте.<\/p>", "<p>Подобный пример мы находим у нашего праотца Авраама. Когда к нему пришли ангелы, они спросили:<\/p>", "<p>«Где Сара, жена твоя?»<\/p>", "<p>Авраам ответил:<\/p>", "<p>«Вот, она в шатре» (Берешит 18:9).<\/p>", "<p>Раши задает вопрос: разве ангелы-служители не знали, где находится Сара, наша праматерь?<\/p>", "<p>Он объясняет, что они спросили об этом для того, чтобы сообщить о ее скромности и тем самым сделать ее еще более любимой в глазах мужа.<\/p>", "<p>Давайте задумаемся над этим.<\/p>", "<p>Авраам и Сара достигли высочайшего совершенства в своих качествах характера и, несомненно, в своих взаимоотношениях. После десятков лет совместной жизни праотец Авраам, конечно же, прекрасно знал Сару и все ее достоинства.<\/p>", "<p>Если так, то почему именно здесь было необходимо еще больше расположить его сердце к своей жене, рассказав ему о том, что Сара скромно остается в шатре?<\/p>", "<p>Из этого мы видим и учимся, насколько важно постоянное обновление — каждый день и в любом возрасте. Нужно проявлять внимание к своему супругу или супруге, снова и снова поддерживать его, как можно чаще говорить добрые слова и не скупиться на комплименты.<\/p>", "<p>Рассказывают об одной женщине, которая пожаловалась своему мужу, что он совсем ее не любит и не ценит, и это причиняет ей большую боль.<\/p>", "<p>Муж спросил ее:<\/p>", "<p>— Откуда ты знаешь, что я тебя не люблю и не ценю?<\/p>", "<p>Жена ответила:<\/p>", "<p>— Я это знаю потому, что ты никогда не говоришь мне, что любишь меня.<\/p>", "<p>Тогда муж сказал:<\/p>", "<p>— Послушай внимательно. Двадцать лет назад, когда мы поженились, я уже сказал тебе, что очень люблю и очень ценю тебя. Если что-нибудь изменится, я обязательно сообщу тебе.<\/p>", "<p>Мы должны глубоко понять, что такие слова необходимо говорить каждый день, и говорить их искренне, от всего сердца.<\/p>", "<p>Следует помнить, что любовь и взаимопонимание строятся шаг за шагом. Их невозможно приобрести быстро. Поэтому нужно ежедневно уделять этому внимание, и каждый день должно приносить что-то новое.<\/p>", "<p>Например:<\/p>", "<p>1. Желательно, чтобы день годовщины свадьбы не был похож на любой другой день месяца. Следует постараться каждый раз обновить что-то в отношениях. Даже если один из супругов просто немного изменит обстановку в комнате, это уже даст другому ощущение, что о нем думают и помнят об этом особенном дне. Так между ними рождаются еще большая близость и любовь. И тем более, если сделать что-то большее.<\/p>", "<p>Этот день имеет огромное значение для отношений между супругами. Поэтому очень важно по возможности отложить все остальные дела и посвятить свои мысли и поступки только своему супругу или супруге.<\/p>", "<p>2. Мужу важно правильно относиться к блюдам, которые готовит его жена, и всегда находить новые слова признательности. Например:<\/p>", "<p>— «Еда очень вкусная.»<\/p>", "<p>— «Ты настоящая мастерица в приготовлении.»<\/p>", "<p>И тому подобное.<\/p>", "<p>Каждый муж хорошо знает, какой именно комплимент его жена любит услышать.<\/p>", "<p>3. Каждый раз заново показывать, насколько хорошо им быть рядом друг с другом и проводить время в беседе.<\/p>", "<p>Следует помнить об одной важной особенности совместного общения.<\/p>", "<p>Бывает, что человек разговаривает со своей женой по телефону полчаса, но при этом совсем не дает ей почувствовать себя счастливой и любимой.<\/p>", "<p>А другой может поговорить с женой всего одну минуту, и она уже чувствует радость, счастье и большую близость между ними.<\/p>", "<p>В чем разница?<\/p>", "<p>Тот, кто разговаривал полчаса, вовсе не думал о том, как порадовать свою жену. Он просто обсуждал различные темы, не уделяя ей особого внимания.<\/p>", "<p>А муж, который говорил всего одну минуту, прежде чем позвонить, задумался:<\/p>", "<p>«Как я могу порадовать свою жену этим разговором? Как я могу подарить ей чувство любви и близости?»<\/p>", "<p>Подумав об этом, он позвонил и сказал ей то, что было у него на сердце. Именно поэтому ему удалось порадовать ее и дать ей почувствовать себя любимой.<\/p>", "<p>Будем помнить всегда: при каждой встрече супруги должны думать прежде всего друг о друге.<\/p>", "<p>Как мы можем порадовать своего супруга? Как проявить к нему уважение? Как сделать так, чтобы ему было приятно находиться рядом с нами?<\/p>", "<p>Если наши мысли и поступки будут постоянно направлены на то, чтобы дарить, отдавать и радовать друг друга, мы достигнем сразу нескольких важных целей:<\/p>", "<p>а) Мы исполним заповедь добродеяния (хесед) и заповедь Торы:<\/p>", "<p>«Возлюби ближнего своего, как самого себя» (Ваикра 19:18).<\/p>", "<p>б) Любовь между нами станет еще сильнее.<\/p>", "<p>в) Чем больше человек отдает, тем больше он получает в ответ такое же отношение. А кто не хотел бы получать подобную любовь и внимание?<\/p>", "<h3>Дарить подарки<\/h3>", "<p>Подарок, даже самый скромный, показывает вашей супруге, что вы думаете о ней.<\/p>", "<p>Рассказывают о раввине Йеуде Цадке, благословенной памяти, что он каждый день покупал своей жене какой-нибудь подарок — пусть даже совсем небольшой и недорогой.<\/p>", "<p>Если такой великий раввин, несмотря на множество своих забот и обязанностей, считал необходимым ежедневно показывать своей жене, что он думает о ней, то тем более каждому из нас стоит стараться давать своему супругу или супруге почувствовать, что он или она близки нашему сердцу и что мы постоянно о них помним.<\/p>", "<p>Очень важно знать, как дарить подарок. Отношение, сопровождающее вручение подарка, нередко имеет гораздо большее значение, чем сам подарок.<\/p>", "<p>Рассказывают об одной женщине, которая попросила мужа купить ей букет цветов. Муж положил на стол десять шекелей и сказал:<\/p>", "<p>— Иди купи себе букет.<\/p>", "<p>Давайте задумаемся: разве этой женщине не хватало десяти шекелей, чтобы самой купить себе цветы?<\/p>", "<p>Нет. Она ожидала от мужа внимания и теплого отношения, связанных с этим букетом.<\/p>", "<p>Даже самый скромный подарок приобретает особую ценность, если он преподнесен с искренним вниманием. Если к подарку приложить небольшую записку с теплыми словами любви и нежности, такой подарок будет иметь гораздо больший вес, а тот, кто его дарит, получит во много раз больше в ответ.<\/p>", "<p>Следует всегда задумываться:<\/p>", "<p>Как можно сделать наши отношения еще лучше?<\/p>", "<p>Чем я могу сегодня порадовать своего мужа или свою жену?<\/p>", "<p>Помните: любое действие, даже самое незначительное, которое человек совершает ради другого, если оно выражает искреннее и глубокое желание отдавать, придает отношениям между супругами особую теплоту и глубину.<\/p>", "<p>Искреннее внимание к особым дням в жизни другого человека — таким как день рождения, годовщина свадьбы, другие памятные даты и т.п. — значительно укрепляет связь между супругами.<\/p>", "<p>Обновление в доме, обновление в отношении друг к другу, обновление в мыслях о том, как порадовать своего супруга или супругу, — именно это сохраняет свежесть чувств и желание быть вместе, приумножает счастье, радость и шалом-байт (мир и гармонию в семье).<\/p>"]}, {"number": 14, "title": "Как вести себя во время ссоры в доме", "body": ["<p>Если, не дай Бог, в доме вспыхнула ссора, самое важное в такой ситуации — чтобы она длилась как можно меньше. Каждый из супругов должен заботиться о том, чтобы ссора закончилась как можно скорее и не оставила ненужных душевных ран.<\/p>", "<p>Иногда ссора возникает из-за вещей, которых невозможно полностью избежать. Это может случиться с каждым. Ссора начинается спонтанно, без всякой подготовки. Конечно, благодаря советам, изложенным в предыдущих главах, можно значительно уменьшить количество подобных случаев. Но даже несмотря на это, ссора все же может возникнуть.<\/p>", "<p>В такой ситуации самое главное — как можно быстрее прекратить конфликт. Возможно, причина ссоры сама по себе была не такой уж серьезной. Однако чем дольше продолжается конфликт, тем больше каждый начинает вспоминать другие неприятные поступки, которые, как ему кажется, совершил супруг или супруга. Это усиливает раздражение и гнев, и тем самым ссора становится все глубже.<\/p>", "<p>Поэтому очень важно как можно скорее закончить ссору и помириться. Очень часто каждый ждет, что именно другой сделает первый шаг к примирению: «Это он (или она) должен попросить прощения». Нередко в нашем сознании просьба о прощении и стремление к примирению воспринимаются как проявление слабости или признание полной вины: «Это она виновата, значит, пусть она и просит прощения. Я ведь на сто процентов прав. Почему именно я должен уступать?»<\/p>", "<p>Это серьезная ошибка. Наоборот, тот, кто первым приходит мириться, называется настоящим героем, побеждающим свое дурное побуждение. Этим поступком он показывает, что чувствует большую ответственность за мир и благополучие в семье. Такой человек удостаивается звания «стремящегося к миру» (родеф шалом).<\/p>", "<p>Каждое мгновение, пока в доме продолжаются ссора и гнев, может, не дай Бог, привести к обвинению и суровому Небесному суду. Человек, который не желает примирения, проявляет гордыню и высокомерие. Даже если мне кажется, что правда полностью на моей стороне, это не оправдывает продолжение конфликта. Напротив, нужно помириться — и как можно быстрее.<\/p>", "<p>Если супруги будут поступать именно так, они смогут спокойно сесть вместе, разобраться в истинной причине конфликта и попытаться исправить проблему. Сама по себе ссора ничего не исправляет и не приносит никакой пользы.<\/p>", "<p>Кроме того, во время ссоры необходимо особенно тщательно беречь достоинство другого человека. Именно в такие моменты возникает искушение думать, что «теперь можно говорить всё что угодно». Поэтому нужно внимательно следить за каждым словом, которое выходит из уст.<\/p>", "<p>Нельзя сравнивать мужа или жену с плохими людьми, а также унижать его или её, сравнивая с родственниками, говоря, например: «Вся ваша семья такая». Такие слова причиняют очень глубокую боль, и потом бывает крайне трудно исправить нанесенную ими рану.<\/p>", "<p>«Кто является настоящим героем? Тот, кто побеждает свое дурное побуждение».<\/p>", "<p>Злое побуждение (йецер hа-ра) говорит: «Продолжай ссору, углубляй конфликт». Но Всевышний велит: «Сразу же помирись и установи мир». Кого же мы должны слушать?<\/p>"]}, {"number": 15, "title": "Уважение к родственникам с обеих сторон", "body": ["<p>Иногда бывает так, что супруги искренне готовы вкладывать силы в укрепление мира в своем доме, следуя путям, о которых говорилось в предыдущих главах: проявляя заботу, любовь, работая над своими качествами характера, стараясь понимать и принимать друг друга. Они осознают, насколько это важно и дорого для них. Однако порой они ошибочно полагают, что любовь, уважение и внимание должны проявляться только по отношению к мужу или жене, но не к их родственникам.<\/p>", "<p>Следует знать, что если человек не уважает родственников своего супруга или супруги, то тот начинает чувствовать, что оказываемое ему уважение не является искренним. Каждый хочет, чтобы с уважением относились к его близким. Когда родственников уважают, человек ощущает, что и уважение к нему самому является настоящим и искренним.<\/p>", "<p>Очень важно уделять этому внимание. Уважительное отношение к родственникам приносит супругу или супруге глубокое чувство удовлетворения и душевного тепла, а благодаря этому значительно легче построить крепкий и мирный семейный союз.<\/p>", "<p>Следует всячески избегать негативных высказываний о родственниках с обеих сторон. Помимо запрета на злословие (лашон hа-ра), которое само по себе является очень тяжелым грехом, такие слова серьезно вредят семейному миру. Может показаться, что супруг или супруга не придают большого значения услышанным плохим словам о своих родственниках, однако в глубине души это причиняет им сильную боль.<\/p>", "<p>Поэтому необходимо стараться говорить о родственниках только хорошее, проявлять к ним уважение и высоко ценить их.<\/p>", "<p>Кроме того, следует особенно остерегаться неблагодарности по отношению к родственникам. Очень часто родители помогают молодой семье настолько, насколько позволяют их возможности. Но иногда одному из супругов кажется, что они помогли меньше, чем он ожидал. Из-за этого он начинает плохо отзываться о них.<\/p>", "<p>Такой поступок очень серьезен, потому что он свидетельствует о неблагодарности. Об этом сказали наши мудрецы:<\/p>", "<p>«Всякий, кто отвергает добро, сделанное ему ближним, в конце концов станет отрицать и добро, которое оказывает ему Всевышний».<\/p>", "<p>Следует понимать и твердо верить, что все, что было дано человеку, было определено ему Небесами. Поэтому нужно радоваться тому, что получил, и благодарить родителей за их помощь. Такое проявление благодарности очень обрадует мужа или жену, усилит между ними близость и любовь, а благодаря этому в их доме будут пребывать Шехина (Божественное присутствие), благословение и изобилие.<\/p>", "<p>Мишна в трактате «Авот» учит:<\/p>", "<p>«Кто достоин почета? Тот, кто почитает других людей».<\/p>", "<p>Чем больше ты будешь уважать окружающих, тем больше уважения и признания получишь сам.<\/p>"]}, {"number": 16, "title": "Вещи, которые мешают семейному миру", "body": ["<p>Иногда между супругами возникают вещи, которые причиняют неудобство или огорчение одному из них: определенные привычки, особенности поведения или отношение друг к другу.<\/p>", "<p>Во многих случаях супруги предпочитают промолчать и не делать замечаний, пока однажды между ними не вспыхнет ссора. Тогда они начинают припоминать прошлые обиды и высказывают все, что долгое время держали в себе.<\/p>", "<p>Как следует поступать в подобных случаях?<\/p>", "<p>Прежде всего необходимо внимательно разобраться, что именно вызывает недовольство. Если речь идет о таких особенностях, которые трудно изменить, например о чертах характера, природном темпераменте или привычках, приобретенных в родительском доме и ставших частью личности человека, то лучше проявить терпение и принять это.<\/p>", "<p>Но если речь идет о простых вещах, которые можно исправить, а супруг или супруга просто не осознают, что это причиняет неудобство другому, тогда можно сделать замечание. Однако делать это необходимо максимально уважительно, только тогда, когда вы находитесь наедине, и таким образом, чтобы совершенно не задеть достоинство другого человека.<\/p>", "<p>Иногда даже лучше написать об этом в письме. При этом стоит подчеркнуть, что вы, безусловно, уверены: человек не поступает так намеренно. Следует просто попросить его, если это возможно, отказаться от такого поведения.<\/p>", "<p>Правильно и желательно прежде всего помолиться Всевышнему и попросить Его, чтобы ваши слова были приняты. Тем самым исполняются слова Писания:<\/p>", "<p>«Во всех путях твоих познавай Его, и Он сделает прямыми пути твои» (Мишлей / Притчи 3:6).<\/p>", "<p>Такой подход приносит большую пользу:<\/p>", "<p>Он помогает избежать ссоры, которая могла бы возникнуть из-за долгих взаимных споров и выяснения отношений.<\/p>", "<p>Значительно возрастает вероятность того, что просьба будет услышана и действительно принесет добрые плоды.<\/p>", "<p>Как сказано в книге Коэлет (Экклезиаст 9:17):<\/p>", "<p>«Слова мудрых, сказанные спокойно, бывают услышаны».<\/p>", "<p>Есть еще один важный момент, на который следует обратить внимание.<\/p>", "<p>Иногда один из супругов делает другому замечание по какому-либо поводу, но тот, кто его получает, больше думает о том, как ему сделали замечание, чем о содержании сказанного.<\/p>", "<p>Очень важно понимать, что даже если замечание было высказано не самым красивым или деликатным образом, все же следует задуматься над его смыслом. Если в словах действительно есть основание для исправления, то гораздо полезнее подумать о том, как изменить себя к лучшему, чем сосредотачиваться исключительно на форме замечания или на чувстве обиды.<\/p>", "<p>Такой подход в значительной степени способствует укреплению добрых отношений между супругами.<\/p>"]}, {"number": 17, "title": "Отношение невестки к свекрови", "body": ["<p>Дорогая невестка!<\/p>", "<p>Одним из важнейших условий для установления мира и гармонии в доме являются отношения между невесткой и родителями мужа — свекром и свекровью.<\/p>", "<p>Невестка должна понимать, что если она проявляет неуважение к родителям мужа или не оказывает им должного почета, то тем самым она затрагивает и достоинство своего супруга. Настоящая радость мужа в семейной жизни во многом зависит от того, с уважением ли его жена относится к его родителям.<\/p>", "<p>Вместе с тем всем известно, что в этой сфере бывают непростые испытания. Как же достичь настоящего мира и добрых отношений?<\/p>", "<p>1. Постоянно учиться уступать.<\/p>", "<p>Следует знать, что нет большего дара, чем способность достойно выдерживать жизненные испытания. Человек, который стойко проходит испытание, удостаивается великой награды.<\/p>", "<p>Кроме того, необходимо помнить, что совершенных людей не существует — и это относится также и к нам самим. Как сказано:<\/p>", "<p>«Нет на земле праведника, который делал бы только добро и никогда не согрешил» (Экклезиаст 7:20).<\/p>", "<p>Каждый человек, даже если он ошибся, хочет, чтобы его простили. Но это зависит и от нас: если мы умеем уступать другому и прощать его, даже когда уверены в своей правоте, то и на Небесах проявляют милосердие к нам.<\/p>", "<p>В этом заключается огромная польза постоянного стремления к миру.<\/p>", "<p>Гемара (трактат Рош а-Шана, 17а) говорит:<\/p>", "<p>«Сказал Рава: тому, кто не взыскивает за причиненные ему обиды, прощаются все его грехи. Как сказано: „Прощающий вину и проходящий мимо проступка“. Кому Он прощает вину? Тому, кто сам проходит мимо проступков, совершенных против него».<\/p>", "<p>Из этого мы учим, что если человек подвергся обиде и принимает это с любовью, не начинает ссор и конфликтов, а прощает и отпускает обиду, то он удостаивается того, что ему самому прощаются все его грехи.<\/p>", "<p>Особенно важно помнить об этом в отношениях между невесткой и свекровью.<\/p>", "<p>2. Это укрепляет связь между супругами.<\/p>", "<p>Чем больше невестка умеет уступать, проявлять терпение и сдержанность — даже когда ей тяжело и больно, — понимая, что это лишь ее личное испытание, тем большим уважением она пользуется в глазах своего мужа.<\/p>", "<p>Безусловно, муж будет глубоко благодарен ей за такое поведение, и их взаимная любовь и связь станут значительно крепче.<\/p>", "<p>3. Все, что человек делает, он делает для самого себя.<\/p>", "<p>Невестка, которая старается уважать и любить родителей своего мужа, удостоится того, что в будущем ее собственные невестки и зятья также будут относиться к ней с уважением.<\/p>", "<p>Ведь Святой, благословен Он, управляет миром по принципу «мера за меру» (мида ке-негед мида): как человек поступает с другими, так и Небеса поступают с ним.<\/p>", "<p>В книге «Алуфейну Месубалим», часть II, приводится поучительная история, которая показывает женщине, как следует относиться к своей свекрови, если той приходится жить в ее доме — будь то на короткое время или на более длительный срок.<\/p>", "<p>И вот какая история произошла.<\/p>", "<p>Когда отец одного из величайших глав ешив нашего поколения отошел в Мир Грядущий, его мать, раббанит, осталась одна в своем доме. Тогда сын забрал свою престарелую мать к себе домой.<\/p>", "<p>Его жена — праведная и достойная женщина, «доблестная жена, венец своего мужа», богобоязненная и мудрая — приняла свекровь с большим почетом, как и подобает относиться к матери своего мужа.<\/p>", "<p>Но этим она не ограничилась. Она сказала себе:<\/p>", "<p>«Я хочу, чтобы мать моего мужа чувствовала себя в моем доме так же, как в своем собственном. Не дай Бог, чтобы она ощущала себя здесь чужой, обузой для семьи или временной гостьей. Недостаточно лишь обеспечить ее едой и всем необходимым. Моя обязанность — искренне делать ей добро и почитать ее так, как этого желает Всевышний».<\/p>", "<p>Что же она сделала?<\/p>", "<p>Ничто в доме не решалось без совета и согласия свекрови. Будь то вопросы приготовления пищи или любые другие домашние дела — во всем спрашивали ее мнение, и оно имело решающее значение. Она стала настоящей советницей дома во всех его делах.<\/p>", "<p>Благодаря этому свекровь испытывала глубокую радость и говорила себе:<\/p>", "<p>«Я по-прежнему хозяйка дома. Я не стала, не дай Бог, лишней или помехой для живущих здесь. Напротив, я нужна им, и у меня все еще есть важная роль в этом мире».<\/p>", "<p>Посмотри же, насколько велико было благородство души этой женщины. Эта мудрая раббанит, жившая Торой Всевышнего и страхом перед Ним, хорошо понимала, что путь Бога — это путь добра, милосердия и сострадания. Всем сердцем она стремилась идти Его путями и желала обрести благоволение Владыки всех душ.<\/p>", "<p>Ради этой высокой цели она добровольно отказалась от полной самостоятельности в ведении домашнего хозяйства. Ее единственным желанием было оказать должное уважение матери своего мужа. Ведь почет, оказываемый матери мужа, является почетом самого мужа, а пренебрежение к ней, не дай Бог, воспринимается как пренебрежение к нему. Ее радость становилась и его радостью.<\/p>", "<p>Когда один мудрый и проницательный человек услышал эту историю из уст самого сына, он был глубоко тронут и сказал:<\/p>", "<p>«Драгоценен перед Всевышним такой образ поведения. Нет меры награде женщины, которая поступает подобным образом».<\/p>", "<p>Сам сын, рассказывавший эту историю, говорил так, что было ясно: теплое отношение его матери к собственной свекрови глубоко запечатлелось в его сердце. Несомненно, и он сам будет поступать так же, исполняя слова Писания:<\/p>", "<p>«...И не оставляй наставления своей матери» (Мишлей / Притчи 1:8).<\/p>", "<p>Подобное величие души мы находим и у Рут-моавитянки. Она ни при каких обстоятельствах не хотела расставаться со своей свекровью Наоми, хотя, если бы вернулась домой, могла бы вновь жить в царском дворце своего отца — Эглона, царя Моава.<\/p>", "<p>И все же она была готова отказаться от всех этих удовольствий, лишь бы не оставить свою свекровь одну.<\/p>", "<p>За добро, которое Рут сделала своей свекрови, она получила необыкновенную награду.<\/p>", "<p>Прежде всего она удостоилась стать женой величайшего мудреца своего поколения — Боаза.<\/p>", "<p>Затем она стала праматерью царского дома Израиля, ведь вся династия царя Давида произошла именно от нее.<\/p>", "<p>Она также удостоилась увидеть пять поколений своих потомков, как сказано:<\/p>", "<p>Боаз родил Оведа, Овед — Ишая, Ишай — Давида, Давид — Шломо (Соломона).<\/p>", "<p>Всех их она увидела при жизни.<\/p>", "<p>Более того, она дожила до того времени, когда царь Шломо построил Первый Храм.<\/p>", "<p>Наши мудрецы также учат, что на Небесах существует особый чертог, связанный с праведницей Рут.<\/p>", "<p>Когда Рут проявляла это великое милосердие по отношению к своей свекрови, она вовсе не знала, какой огромной награды удостоится. Она действовала искренне, бескорыстно и без каких-либо личных расчетов.<\/p>", "<p>Так же и каждая женщина, которая всем сердцем уважает своего свекра и свекровь, должна поступать ради Небес, с чистыми намерениями, стремясь доставить радость Божественному Присутствию (Шехине).<\/p>", "<p>И можно быть уверенной в словах наших мудрецов:<\/p>", "<p>«Верен Хозяин твоего труда — Он воздаст тебе награду за твои дела».<\/p>", "<p>Святой, благословен Он, не лишает награды ни одно творение. Все учитывается Им. Ничто не скрыто от Всевышнего. Перед Ним открыты все мысли человека, и Он знает каждое наше действие и намерение, с которым оно было совершено. Именно согласно этим намерениям Он воздает человеку награду.<\/p>", "<p>Поэтому каждая женщина должна всеми силами стремиться делать добро, отдавать, уступать и внимательно следить за каждым словом, которое произносит. Когда она приносит радость своему мужу и оказывает уважение его родителям, ее приобретение поистине огромно.<\/p>", "<p>И в конечном итоге самой большой победительницей и получательницей благословения благодаря такому поведению становится она сама.<\/p>"]}, {"number": 18, "title": "Отношение свекрови к невестке", "body": ["<p>Дорогая мама!<\/p>", "<p>Когда мать удостаивается провести своего сына под хупу, нет предела ее радости. Она молится и надеется, чтобы он построил верный еврейский дом и чтобы она удостоилась получать от молодой семьи много радости и удовлетворения.<\/p>", "<p>Однако нередко бывает так, что родители, движимые искренней заботой, начинают щедро давать советы молодой семье.<\/p>", "<p>Мать, которая до сих пор заботилась о сыне, обеспечивала все его нужды и с большой самоотверженностью опекала его, чувствует, что должна продолжать делать это и после его женитьбы.<\/p>", "<p>И тогда начинаются замечания:<\/p>", "<p>«Почему у тебя такая мятая рубашка? Посмотри, как ты выглядишь!»<\/p>", "<p>Замечания касаются одежды, питания, того, что, как ей кажется, о сыне недостаточно заботятся.<\/p>", "<p>Разумеется, невестку это глубоко ранит, тогда как мать при этом совершенно убеждена, что думает исключительно о благе своего сына.<\/p>", "<p>Но мать, которая ведет себя подобным образом, должна понимать: своими собственными руками она разрушает семейную жизнь своего сына. И первым, кто страдает от этого, становится сам сын.<\/p>", "<p>Мать, которая действительно желает своему сыну добра, никогда не станет делать замечания невестке в присутствии сына и не будет говорить сыну ничего против его жены.<\/p>", "<p>В этом вопросе требуется огромная осторожность.<\/p>", "<p>Я пишу эти строки, имея перед глазами множество молодых семей — и даже семей с детьми, — которые очень сильно страдают из-за вмешательства родителей. К сожалению, я лично знаю немало супружеских пар, которые развелись именно по этой причине.<\/p>", "<p>Поэтому, дорогие и уважаемые родители, пожалуйста, примите для себя очень важное правило:<\/p>", "<p>не делать замечаний супругам относительно их семейной жизни.<\/p>", "<p>Мне не раз приходилось слышать от невесток, что, когда свекровь собирается прийти в гости, они испытывают сильное напряжение и начинают до блеска убирать весь дом только для того, чтобы, не дай Бог, не услышать очередное замечание.<\/p>", "<p>Есть немало родителей, которые жалуются:<\/p>", "<p>«Наш сын отдалился от нас. Он редко приходит в гости, мало звонит и почти не общается».<\/p>", "<p>При этом они не понимают, что сами стали причиной такого отдаления. Постоянные замечания, критика и недовольство не оставили молодым супругам большого выбора. Чтобы сохранить мир в семье, избежать напряжения и ненужных разговоров, им проще сократить общение.<\/p>", "<p>Родители должны понимать, что зять или невестка, входящие в семью, должны восприниматься как собственные дети. Поэтому необходимо особенно беречь их достоинство и быть крайне осторожными с любыми критическими замечаниями.<\/p>", "<p>«Конец дела определяется мыслью, которая ему предшествует».<\/p>", "<p>Каждое слово может иметь серьезные последствия для семейного мира.<\/p>", "<p>Поэтому, дорогие родители, хорошо подумайте, прежде чем произнести какое-либо замечание.<\/p>", "<p>Если у вас возникает хотя бы малейшее сомнение, принесут ли ваши слова пользу или, наоборот, вред, лучше промолчать.<\/p>", "<p>Чем меньше будет ненужных замечаний, тем больше уважения вы заслужите у своих детей, зятя и невестки. И тогда ваши слова будут восприниматься с гораздо большим вниманием.<\/p>", "<p>Вместо того чтобы делать замечания, лучше обратиться с молитвой ко Всевышнему, чтобы Он помог изменить ситуацию к лучшему.<\/p>", "<p>И всегда следует помнить, что на Небесах есть Око, которое видит, Ухо, которое слышит, и все наши слова записываются.<\/p>", "<p>В этом мире нет ничего бесконтрольного. В конце концов человек дает отчет за каждое произнесенное слово и за все его последствия. Многие начинают ощущать последствия своих слов уже в этой жизни.<\/p>", "<p>Гораздо правильнее замечать в зяте или невестке их хорошие качества, подчеркивать их достоинства, искренне хвалить их и развивать в своем сердце настоящую любовь к ним.<\/p>", "<p>Рамхаль в книге «Месилат Йешарим», в конце 19-й главы, пишет, что Всевышний любит того, кто любит народ Израиля.<\/p>", "<p>Следует помнить, что все евреи — дети Святого, благословен Он. Поэтому необходимо любить каждого всем сердцем.<\/p>", "<p>А когда в сердце есть настоящая любовь, человек перестает искать недостатки и сосредотачивается на хорошем.<\/p>"]}, {"number": 19, "title": "Жениху и невесте", "body": ["<p>Сейчас вы стоите на пороге самого большого и счастливого дня в вашей жизни, как сказано в Песни песней (3:11): «…в день свадьбы его и в день радости сердца его».<\/p>", "<p>Несомненно, вы желаете себе счастливой семейной жизни и того, чтобы мир и согласие всегда царили в вашем доме.<\/p>", "<p>Естественно, что у каждой пары перед свадьбой возникает множество забот: выбор банкетного зала, музыкального сопровождения, фотографа, одежды, жилья. Жених и невеста настолько поглощены приготовлениями, что зачастую у них не остается времени задуматься о самом важном для своего будущего — как вести себя, чтобы их супружеская жизнь была счастливой и гармоничной.<\/p>", "<p>Следует понимать: человек, который вступает под свадебный балдахин (хупу), не подготовившись должным образом, особенно в наше время, подобен человеку, которому сообщили, что он выиграл огромный приз в лотерею. Однако добираться до места, где он сможет получить свой выигрыш, он решает на автомобиле, которым управляет человек без водительских прав и без какого-либо опыта вождения.<\/p>", "<p>Разве счастливый победитель стал бы подвергать себя столь серьезному риску на пути к получению долгожданного выигрыша?<\/p>", "<p>То же самое касается и семейной жизни. Кто готов взять на себя такой огромный риск — начать совместную жизнь двум людям с разными взглядами, разным воспитанием, разным характером, когда практически всё между ними различается, и при этом строить свой дом без должной подготовки и руководства?<\/p>", "<p>Возможно, это сравнение кажется слишком резким, однако, к сожалению, сама жизнь показывает, что именно так часто и происходит.<\/p>", "<p>Важно понять, о чем идет речь. Если свадебный зал оказался не совсем таким, как вам хотелось, или некоторые друзья, которых вы ожидали увидеть на свадьбе, не смогли прийти, — это не столь большая беда. Гораздо серьезнее, если человек вступает в брак без подготовки и без правильного наставления.<\/p>", "<p>Поэтому, дорогие жених и невеста, вы обязаны тщательно подготовиться к семейной жизни и уделить этому самое серьезное внимание.<\/p>", "<p>Что включает в себя такая подготовка?<\/p>", "<p>Она включает обучение основам счастливой семейной жизни, помимо изучения законов семейной чистоты (тахарат а-мишпаха), под руководством специалистов, занимающихся этой областью; чтение соответствующих книг и прослушивание лекций на эту тему. Но прежде всего необходима серьезная работа над исправлением своих качеств характера.<\/p>", "<p>Желательно заранее договориться между собой о конкретном раввине или семейном консультанте, к которому вы будете обращаться со всеми возникающими вопросами и сомнениями.<\/p>", "<p>Ни в коем случае не следует вовлекать в решение семейных вопросов людей, не обладающих необходимой квалификацией, или родственников, поскольку опыт показывает, что вмешательство посторонних людей и чужих мнений нередко приносит большой вред семейной жизни.<\/p>", "<p>Подобно строительной площадке, окруженной забором с предупреждающей табличкой: «Опасно! Ведутся строительные работы. Посторонним вход воспрещен», — так и ваш дом. Сейчас вы строите «верный дом в Израиле», и вход посторонним людям и чужим мнениям должен быть закрыт.<\/p>", "<p>В то же время на строительную площадку обязательно допускаются специалисты, без которых строительство невозможно. Так же и здесь: помощь опытных профессионалов в вопросах семейной жизни может только принести пользу и помочь в созидании вашего дома.<\/p>", "<p>Опыт показывает, что пары, которые отказывались обращаться за профессиональной помощью, зачастую сталкивались с серьезными трудностями.<\/p>", "<p>Как правило, до свадьбы жених и невеста полны оптимизма и уверены, что никакое наставничество им не требуется. Причина этого в том, что до свадьбы каждый из них естественным образом видит прежде всего достоинства другого, а не его недостатки, как сказано в книге Притчей (10:12): «Любовь покрывает все проступки».<\/p>", "<p>Даже если один из будущих супругов замечает у другого какие-либо отрицательные черты или нежелательное поведение, он предпочитает не обращать на это внимания из-за сильного желания и стремления поскорее дождаться долгожданного дня — дня свадьбы.<\/p>", "<p>Поэтому человек склонен убеждать себя, снова и снова повторяя: «Моя семейная жизнь будет счастливой. В моем доме будут царить взаимопонимание, уважение и взаимная признательность. Со мной такого не случится. Всё останется таким же, как было до свадьбы».<\/p>", "<p>Нередко люди поспешно приходят к выводу, что ситуация вовсе не такова, как им хотелось бы, но утешают себя мыслью: «С Божьей помощью после свадьбы всё изменится».<\/p>", "<p>Дорогие жених и невеста! Жизненный опыт показывает совершенно обратное. После свадьбы гораздо труднее уступать и прощать, если один из супругов был обижен. Восстановить мир и взаимопонимание после свадьбы во много раз сложнее, чем если бы подобная ситуация возникла до нее.<\/p>", "<p>Если человек не получает должного наставления, он заранее не осознаёт возможных трудностей и не работает вовремя над своими качествами характера, то после свадьбы, не дай Бог, его могут ожидать неприятные сюрпризы.<\/p>", "<p>Многие люди стремятся к высокому качеству жизни. Они вкладывают огромные силы и энергию в улучшение бытовых условий: выбирают подходящее место жительства, просторную квартиру, дорогую и красивую мебель.<\/p>", "<p>Однако необходимо понимать, что качество супружеской жизни важнее всего остального.<\/p>", "<p>Если в доме нет мира, то какая ценность у всего внешнего благополучия? Чего стоят красивый дом и комфортные условия, если семейная жизнь не складывается?<\/p>", "<p>Тот, чья семейная жизнь потерпела крушение, знает, что его дни сопровождаются гневом, горечью и унынием.<\/p>", "<p>Если мы готовы вкладывать столько труда и усилий в жильё и обстановку дома, то тем более мы должны вкладывать силы в качество семейной жизни — как до свадьбы, так и после неё.<\/p>", "<p>Как сказал мудрейший из людей, царь Шломо (Притчи 17:1):<\/p>", "<p>«Лучше кусок сухого хлеба, но с миром, чем дом, полный пиршеств, сопровождаемых ссорами».<\/p>", "<p>Опыт показывает, что человек, который прилагает необходимые усилия, с Божьей помощью удостаивается мира в семье и счастливой семейной жизни.<\/p>", "<p>Дорогие жених и невеста! Если вы действительно проявите мудрость, своевременно подготовитесь к совместной жизни и уделите этому должное внимание, то сможете избежать в будущем многих проблем и недоразумений между собой.<\/p>", "<p>Если вы как следует подготовитесь к этому великому дню, то, с Божьей помощью, начнёте свою семейную жизнь с правильного основания.<\/p>"]}, {"number": 20, "title": "Молитва о мире в семье", "body": ["<h3>Молитва о мире в доме (для мужа и жены)<\/h3>", "<p>Владыка мира!<\/p>", "<p>Благодарю Тебя за то, что Ты удостоил меня открыть глаза и задуматься о своём пути, о том, как я жил до сих пор.<\/p>", "<p>Много раз я жил эгоистично, следуя своим желаниям и чрезмерным страстям, поддаваясь гордыне и стремлению властвовать. Вместо того чтобы исправлять самого себя, я постоянно стремился исправить другого.<\/p>", "<p>Перед собой я видел недостатки ближнего, но не замечал собственных. Поэтому моей долей нередко становились гнев, раздражительность, ссоры, споры и разногласия, которые не только не способствовали созиданию моего дома, но, наоборот, лишь отдаляли нас друг от друга.<\/p>", "<p>Более того, Владыка мира, я искренне сожалею о том пути, которым шёл, причиняя боль и страдания, а также огорчая Твоё святое Присутствие (Шхину).<\/p>", "<p>Теперь же всем сердцем я желаю идти Твоими путями, путями наших праотцов Израиля, и доставлять радость своему Творцу.<\/p>", "<p>Прошу Тебя, Господи, удостой нас построить верный и кошерный еврейский дом ради Тебя и ради Твоей Святой Шхины, чтобы она всегда пребывала между нами.<\/p>", "<p>Пусть между нами всегда царят любовь, братское единство, мир и дружба.<\/p>", "<p>Удостой нас всегда видеть доброе друг в друге, постоянно уметь дарить, отдавать, радовать и поддерживать друг друга.<\/p>", "<p>Помоги мне с Твоей помощью преодолеть и исправить все мои дурные качества.<\/p>", "<p>Милосердный и милостивый Отец! Как дорог Тебе мир в семье, если ради примирения мужа и жены Ты позволил стереть Своё Святое Имя, написанное в святости, в воде (как это заповедано в законах о соте).<\/p>", "<p>Поэтому даруй нам силы, желание и помощь Небес, чтобы мы удостоились построить кошерный и счастливый дом.<\/p>", "<p>Помоги нам всегда хранить святость, скромность и семейную чистоту.<\/p>", "<p>Даруй нам силы уступать, прощать и искренне прощать друг друга.<\/p>", "<p>Пусть никогда не будет раздоров в нашем доме.<\/p>", "<p>Помоги нам искоренить дурное начало из наших сердец и из нашего дома, чтобы мы вместе всегда могли освящать Твоё Имя.<\/p>", "<p>Амен. И амен.<\/p>"]}, {"number": 21, "title": "Остерегайтесь раздоров", "body": ["<h3>Письмо, написанное с любовью к народу Израиля<\/h3>", "<p>В последнее время, к сожалению, из-за наших многочисленных грехов мы становимся свидетелями того, что раздоры между соседями, родственниками, братьями и другими людьми стали чрезвычайно распространённым явлением. Многие уже не воспринимают это как нечто действительно серьёзное.<\/p>", "<p>Однако истина такова: от раздоров следует бежать даже больше, чем от огня. Ведь огонь способен сжечь лишь тело, тогда как раздор губит не только тело, но и душу.<\/p>", "<p>Человек может думать: «Я соблюдаю заповеди, причём самым тщательным образом, изучаю Тору», — и вместе с тем позволять себе вступать в конфликт с соседом, например, из-за какого-либо строительства или другой проблемы, которая ему не нравится.<\/p>", "<p>Это глубокая ошибка.<\/p>", "<p>Необходимо знать: человек, который сам создаёт раздор или поддерживает его, не может рассчитывать на то, что его изучение Торы защитит его.<\/p>", "<p>Откуда мы это учим?<\/p>", "<p>Из истории о Корахе и его общине.<\/p>", "<p>В мидраше «Танхума» (Корах, гл. 5) сказано:<\/p>", "<p>«Корах был человеком мудрым. Что же побудило его к этой глупости? Его ввело в заблуждение собственное видение. Он увидел, что от него произойдёт великая цепь потомков — пророк Шмуэль (Самуил), который равен по своему величию Моше и Аарону, а также двадцать четыре священнические смены, происходящие от его потомков, и все они будут обладать Святым Духом. Тогда он сказал себе: &quot;Неужели столь великое будущее произойдёт от меня, а я сам погибну?&quot; Но он не увидел всей картины, потому что именно его сыновья раскаются, и благодаря им это потомство сохранится. О самом же Корахе сказано: &quot;И сошли они и всё, что принадлежало им, живыми в преисподнюю&quot; (Числа 16:33).»<\/p>", "<p>Давайте задумаемся: кем был Корах?<\/p>", "<p>Возможно, до сих пор мы ошибочно представляли его злодеем, который не соблюдал Тору и заповеди и всю жизнь лишь стремился к власти и почестям.<\/p>", "<p>Это неверно.<\/p>", "<p>Мидраш сообщает, что Корах обладал Руах а-Кодеш — Святым Духом.<\/p>", "<p>Разве каждый человек удостаивается Святого Духа?<\/p>", "<p>Очевидно, что Корах был великим праведником: он изучал Тору, тщательно соблюдал заповеди, радовался всему, что связано со святостью и чистотой, и благодаря этому удостоился Божественного вдохновения.<\/p>", "<p>И всё же, несмотря на всё это, из-за того, что он поднял раздор против Моше и Аарона, вся его Тора и вся его святость не смогли защитить его. Он и его дом были поглощены землёй и сошли живыми в преисподнюю.<\/p>", "<p>Что такое «Шеол» (преисподняя)?<\/p>", "<p>Рабейну Бахья объясняет, что речь идёт о седьмом, самом глубоком уровне Геинома.<\/p>", "<p>Тот самый Корах, который был праведником и обладал Святым Духом, опустился до самого нижнего уровня Геинома.<\/p>", "<p>Настолько велико разрушительное действие раздора.<\/p>", "<p>К нашему глубокому сожалению, мы своими глазами видим и слышим о людях, соблюдающих Тору и заповеди, а иногда даже об известных знатоках Торы, которые ради зависти, выгоды — большой или маленькой — готовы вступать в конфликты со своими соседями.<\/p>", "<p>Тем самым они вызывают осквернение Имени Всевышнего (хилуль а-Шем), сеют беспричинную ненависть и нарушают запреты злословия (лашон hара).<\/p>", "<p>Некоторые делают это даже на глазах у своих детей и соседей, продолж
