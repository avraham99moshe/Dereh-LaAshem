:root{--bg:#f6f1e8;--paper:#fffdf9;--text:#302c29;--accent:#5a6f82;--border:#e1d7c8;--muted:#766f67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}body.dark{--bg:#171b20;--paper:#222930;--text:#eee8dc;--accent:#b8d0e2;--border:#45505a;--muted:#b4a99a}.top{height:62px;position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--border);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}.brand{font-weight:900;font-size:17px;color:var(--accent)}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover,.navitem:hover{background:var(--bg)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--border);background:var(--paper);padding:20px 14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}aside h2{font-size:18px;margin:5px 10px 18px}.navitem{display:block;width:100%;text-align:left;line-height:1.5;border:0;border-radius:8px;padding:11px 13px;margin:3px 0;font-family:Arial,sans-serif;font-size:14px}.navitem.active{background:var(--bg);border-left:4px solid var(--accent);font-weight:bold}.main{width:100%;min-width:0;padding:30px 24px 60px}.paper{max-width:850px;margin:auto;background:var(--paper);padding:45px clamp(20px,5vw,65px);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 24px #00000008}.book-title{font-weight:900;text-align:center;color:var(--accent);font-size:clamp(26px,4vw,38px);line-height:1.3;margin:0 0 25px}.chapter-num{text-align:center;font-size:clamp(30px,5vw,43px);color:var(--accent);margin:10px 0 12px}.chapter-title{text-align:center;font-size:clamp(23px,3vw,31px);line-height:1.35;margin:0 0 34px}.content{font-size:var(--fs,20px);line-height:1.85;text-align:left}.content p{margin:0 0 1.15em}.content h3{font-size:1.18em;line-height:1.4;text-align:center;margin:1.7em 0 .7em}.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:35px;border-top:1px solid var(--border);padding-top:20px}.search{width:160px;max-width:30vw;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--paper);color:var(--text)}mark{background:#ffe39b;color:#222}mark.current-hit{background:#ff983b;color:#171717;outline:2px solid #d56500;border-radius:2px}.chapter-indicator{font:bold 15px Arial,sans-serif;color:var(--accent);white-space:nowrap}.subchap-wrap{position:relative;display:flex;align-items:center;gap:5px}.subchap-panel{display:none;position:absolute;top:calc(100% + 7px);left:0;width:min(370px,85vw);max-height:65vh;overflow:auto;background:var(--paper);border:1px solid var(--border);box-shadow:0 8px 25px #0003;border-radius:9px;padding:8px;z-index:12}.subchap-panel.open{display:block}.subchap-panel button{display:block;text-align:left;width:100%;border:0;line-height:1.5;margin:2px 0}.menu{display:none}@media(max-width:800px){.layout{display:block}aside{display:none;position:fixed;top:62px;left:0;bottom:0;width:min(85vw,320px);height:auto;z-index:4;box-shadow:4px 0 20px #0003}aside.open{display:block}.menu{display:inline-block}.top{height:auto;min-height:62px;flex-wrap:wrap;padding:7px 9px}.chapter-indicator{font-size:13px}.subchap-wrap{order:1}.tools{order:3;width:100%;justify-content:flex-end}.brand{order:2}.layout{min-height:calc(100vh - 90px)}aside{top:90px}.brand{font-size:13px}.main{padding:14px 9px 30px}.paper{padding:30px 18px}.search{width:100px}.tools button{padding:7px}}

</style></head><body><header class="top"><div class="top-row first-row"><button class="menu" id="menu" title="Выбрать главу" aria-label="Выбрать главу">☰</button><div class="subchap-wrap"><button id="subchapToggle" title="Выбрать подраздел" aria-label="Выбрать подраздел">§ ▾</button><div id="subchapPanel" class="subchap-panel"></div></div><div class="brand">Мир и согласие в вашем доме</div></div><div class="top-row second-row"><span class="chapter-indicator" id="chapterIndicator">Глава 1</span><div class="tools"><input class="search" id="search" placeholder="Поиск" aria-label="Поиск"><button id="searchNext" title="Найти следующее совпадение" aria-label="Найти следующее совпадение"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><span id="searchCount" aria-live="polite" style="font:12px Arial,sans-serif;white-space:nowrap"></span><button id="smaller" title="Уменьшить">А−</button><button id="larger" title="Увеличить">А+</button><button id="night" title="Ночной режим">☾</button></div></div></header><div class="layout"><aside id="sidebar"><h2>Содержание · 22 главы</h2><nav id="nav"></nav></aside><main class="main"><article class="paper"><h1 class="book-title">МИР И СОГЛАСИЕ В ВАШЕМ ДОМЕ</h1><h2 id="num" class="chapter-num"></h2><h2 id="title" class="chapter-title"></h2><div class="content" id="content"></div><div class="bottom"><button id="prev">← Предыдущая глава</button><button id="next">Следующая глава →</button></div></article></main></div><script>
const chapters=[{"number": 1, "title": "Мир и согласие в семье — основа и фундамент жизни человека", "body": ["<p>У каждого человека есть свои стремления и цели в различных сферах жизни. Каждый желает достичь более высоких вершин в соответствии со своими устремлениями — как в материальных вопросах, таких как работа и обеспечение семьи, так и в духовных, таких как изучение Торы, совершенствование своих качеств характера и служение Всевышнему.<\/p>", "<p>Мы должны знать, что здоровая семейная жизнь и мир в доме (шалом байт) являются основой всех наших жизненных стремлений. Если в нашем доме царят мир, любовь и взаимопонимание, только тогда мы способны реализовать свои цели, развиваться, духовно возрастать и достигать успехов во всех остальных сферах жизни.<\/p>", "<p>Однако если, не дай Бог, в доме нет мира и взаимопонимания, то всё, что человек строит в других областях жизни, опирается на очень непрочный фундамент. Даже духовный рост и успехи в служении Всевышнему могут, не дай Бог, пошатнуться, когда человеку не хватает душевных сил продолжать своё восхождение. Таковы последствия отсутствия мира в семье.<\/p>", "<p>Когда в доме нет мира, человек ощущает, что ему недостаёт самого важного элемента его жизни. Даже если ему кажется, что у него всё ещё есть желания и стремления, со временем его внутренние силы ослабевают и могут почти полностью исчезнуть.<\/p>", "<p>Напротив, человек, который строит свой дом как верный еврейский дом, где царят взаимное доверие, тёплые отношения, уважение и мир, ощущает, что стоит на прочной основе. Благодаря этому у него появляются силы и желание продолжать осуществлять свои цели и добиваться успеха во всех остальных сферах жизни.<\/p>", "<h3>Притча о строительстве<\/h3>", "<p>Человек, строящий здание, прежде всего закладывает фундамент. Уже на этом этапе он понимает, что чем прочнее будет фундамент, тем выше, крепче и устойчивее можно будет построить всё здание.<\/p>", "<p>Так же обстоит дело и со строительством еврейского дома. Прежде всего человек обязан посвятить свои силы созданию прочного основания своей семьи и сделать это своей главной жизненной целью — важнейшей, возвышенной и стоящей выше всех остальных устремлений.<\/p>", "<p>Чем больше человек вкладывает в построение своего дома, чем крепче и надёжнее делает его фундамент, тем успешнее он сможет укреплять свою семью, развивать её, расширять и одновременно достигать успеха во всех остальных жизненных целях.<\/p>", "<h3>Вкладывать силы в мир в семье<\/h3>", "<p>Следует помнить: нет большей радости и истинного удовлетворения, чем жить в доме, где царят мир, любовь и гармония.<\/p>", "<p>Поэтому каждому человеку следует молиться об этом и просить помощи у Небесного Отца, как сказали наши мудрецы:<\/p>", "<p>«Тому, кто стремится очиститься, помогают свыше» (Талмуд, трактат Йома 38б).<\/p>", "<p>Если возникает необходимость, очень важно обратиться за наставлением к профессиональным специалистам, которые являются богобоязненными людьми, и не следует жалеть ради этого ни усилий, ни средств. Правильное руководство открывает человеку новые возможности для понимания и оказывает большую помощь в достижении этой важнейшей цели.<\/p>", "<p>Не менее важно постоянно работать над исправлением своих качеств характера. Как известно, добрые качества являются главным основанием мира в семье, и без честности, смирения, терпения и внутреннего совершенствования чрезвычайно трудно достичь настоящего семейного мира.<\/p>", "<p>Когда супруги работают над собой, проявляют терпение, уважение, готовность уступать и учитывать чувства друг друга, они удостаиваются построить дом, наполненный любовью, доверием, радостью и благословением, который становится прочной основой для успеха во всех сферах жизни.<\/p>", "<h3>Заключение<\/h3>", "<p>Мир в семье — это важнейшая основа жизни человека. Поэтому необходимо как можно глубже размышлять о его значении, искренне стремиться к нему, постоянно действовать ради его укрепления, работать над своими качествами характера и обращаться ко Всевышнему с молитвой, прося Его помочь построить дом, наполненный миром, любовью и благословением.<\/p>"]}, {"number": 2, "title": "Взаимное доверие", "body": ["<p>Создание доверия между супругами является чрезвычайно важным для построения крепкой семьи и укрепления хороших отношений между мужем и женой. Правильное доверие способно устранить и уменьшить множество напряжений, давления, взаимных обвинений и ненужных конфликтов.<\/p>", "<h3>Что такое доверие и как его приобрести?<\/h3>", "<p>Доверие между супругами возникает тогда, когда каждый видит, что его супруг действует с заботой, вниманием и уважением к желаниям и потребностям другого, а все его поступки совершаются с честностью, справедливостью и максимальной чуткостью.<\/p>", "<p>Например: человек должен вернуться домой в определённое время после завершения своих дневных дел, но по каким-либо причинам вынужден задержаться. Во-первых, он сообщает об этом своему супругу, чтобы избежать лишнего напряжения и беспокойства. Во-вторых, он выясняет, не создаёт ли эта задержка трудностей для супруга, насколько это возможно. Кроме того, он не превращает опоздания в привычку и не задерживается из-за каждого незначительного обстоятельства.<\/p>", "<p>Всё это делается не из страха или давления, а из чувства честности, справедливости и уважения к другому человеку. Так приобретается доверие супруга и уверенность в том, что все поступки другого человека обдуманы и совершаются с ответственностью.<\/p>", "<p>С другой стороны, человек, который часто задерживается с возвращением домой по любому незначительному поводу, не старается сообщить об этом и не интересуется, не создаёт ли это трудностей для его супруга, тем самым проявляет неуважение и недостаток внимания к потребностям другого. В результате супруг чувствует себя задетым таким поведением, и именно тогда начинают появляться гнев, разочарование и ссоры.<\/p>", "<p>Неудивительно, что нередко можно услышать от людей такие слова:<\/p>", "<p>«За мной следят с секундомером! Стоит мне опоздать всего на минуту — и сразу начинаются требования объяснений и расспросы».<\/p>", "<p>То же самое происходит при выходе из дома:<\/p>", "<p>«Куда ты идёшь?»<br>«Сколько времени это займёт?»<br>«Нельзя ли отложить это на другой раз?»<br>«Когда ты вернёшься?»<br>«Только не опаздывай» — и тому подобное.<\/p>", "<p>И кто стал причиной такой ситуации? Сам человек.<\/p>", "<p>Своим поведением и отсутствием внимания к чувствам другого он потерял доверие своего супруга. Всё это начинается тогда, когда человек утрачивает доверие, которое ему было дано, вследствие предыдущих случаев, когда он действовал без достаточного уважения и учёта потребностей другого.<\/p>", "<h3>Пример из жизни<\/h3>", "<p>Один человек, известный как порядочный и внимательный человек, однажды был приглашён на праздник «Шева брахот» (семь праздничных благословений после свадьбы), который проходил за пределами города. Он долго сомневался, ехать ему или нет, и даже поделился своими сомнениями с женой.<\/p>", "<p>Утром того дня он вышел из дома, ещё не приняв окончательного решения, поедет ли он или нет. Они с женой договорились, что в течение дня он решит и сообщит ей о своём решении.<\/p>", "<p>В конце концов он решил поехать и сказал об этом жене, однако в тот момент она была занята с детьми и не поняла, что он уже принял решение. Она искренне думала, что муж вернётся домой сразу после завершения своих дел вечером.<\/p>", "<p>Муж сел на автобус, направляясь в город, где проходил праздник «Шева брахот». Во время поездки ему позвонила жена. После того как она спросила, всё ли у него хорошо, она поинтересовалась:<\/p>", "<p>— Где ты сейчас?<\/p>", "<p>Он простодушно ответил:<\/p>", "<p>— Я в пути, сейчас нахожусь в автобусе.<\/p>", "<p>Жена обрадовалась и сказала:<\/p>", "<p>— Отлично, когда приедешь домой, у меня есть важный вопрос, о котором я хочу с тобой поговорить.<\/p>", "<p>Она поняла, что он находится в дороге домой, а он был уверен, что она знает о том, что он едет на праздник.<\/p>", "<p>Через некоторое время жена заметила, что прошло уже много времени, а муж всё ещё не пришёл. Она снова позвонила ему и спокойно спросила, где он находится.<\/p>", "<p>Муж ответил:<\/p>", "<p>— Я всё ещё в автобусе, буду через несколько минут.<\/p>", "<p>Она подумала, что через несколько минут он будет дома, а он был уверен, что она понимает: он скоро прибудет на мероприятие.<\/p>", "<p>Когда он вышел из автобуса, он позвонил жене, чтобы сообщить, что приехал и что всё в порядке.<\/p>", "<p>Жена, которая была уверена, что муж должен прийти домой, ждала его. Когда он задержался и не появился, она снова позвонила и спросила:<\/p>", "<p>— Ну, где ты?<\/p>", "<p>Он ответил:<\/p>", "<p>— Я уже приехал.<\/p>", "<p>Она спросила:<\/p>", "<p>— Куда ты приехал?<\/p>", "<p>И он ответил:<\/p>", "<p>— На «Шева брахот».<\/p>", "<p>Жена в изумлении сказала:<\/p>", "<p>— Что? Ты поехал на «Шева брахот»? Я была уверена, что ты едешь домой! Я тебя неправильно поняла. Когда ты сказал, что находишься в автобусе, я подумала, что ты едешь домой.<\/p>", "<p>Когда муж хотел извиниться, она сразу сказала:<\/p>", "<p>— Всё хорошо, не переживай.<\/p>", "<p>Она даже пожелала ему благословения и приятного продолжения вечера.<\/p>", "<p>Так разговор закончился в очень хорошей атмосфере.<\/p>", "<p>Теперь представим себе, что этот же муж обычно не был бы порядочным и внимательным человеком. В таком случае ситуация могла бы закончиться сильной обидой со стороны жены и взаимными обвинениями:<\/p>", "<p>«Ты всегда так делаешь!»<\/p>", "<p>«Ты не мог сообщить заранее?»<\/p>", "<p>«У тебя всегда есть оправдания!»<\/p>", "<p>Какой взрыв мог бы произойти в тот момент — крики, гнев и тяжёлые обвинения.<\/p>", "<p>Но благодаря тому, что обычно он был честным, порядочным и внимательным человеком, реакция жены была совершенно иной.<\/p>", "<p>Это реальная история.<\/p>", "<h3>Продолжение: построение доверия между супругами<\/h3>", "<p>В опросе, проведённом на нескольких лекциях и домашних встречах, подавляющее большинство семей ответили, что в их случае подобная ситуация, мягко говоря, не закончилась бы хорошо.<\/p>", "<p>В чём же тогда секрет? Почему в одном доме подобное событие заканчивается гневом и обидой, а в другом оно проходит спокойно — с взаимными благословениями и без обвинений?<\/p>", "<p>Ответ прост: жена знает своего мужа как ответственного, заботливого и внимательного человека, который старается делиться информацией и сообщать о происходящем даже тогда, когда от него этого не требуют. Таким образом он приобретает доверие своей жены, и тогда даже в случае ошибки — и даже серьёзной ошибки — она воспринимается с добрым взглядом.<\/p>", "<p>Это происходит по двум причинам:<\/p>", "<p>А. Она делает простой вывод: обычно он не ведёт себя безответственно. Значит, скорее всего, здесь произошла ошибка или недоразумение. Поэтому она понимает ситуацию и прощает.<\/p>", "<p>Б. Обычно люди не сердятся из-за единичных ошибок и даже не из-за ошибки, которая повторилась дважды. Настоящее раздражение возникает из-за постоянной привычки к повторяющимся ошибкам. Поэтому в данном случае не было причины для гнева. У неё нет накопленной обиды по отношению к нему, и ей нечему было возмущаться. Она понимает произошедшее именно как ошибку.<\/p>", "<p>С другой стороны, человек, для которого подобные ошибки являются обычным явлением, теряет доверие своего супруга. И тогда даже в ситуации, когда он действительно не виноват, обвинения в его адрес кажутся полностью оправданными из-за негативного образа, который он сам создал, и из-за потери доверия к нему.<\/p>", "<h3>Чем больше человек ограничивает себя сам — тем более свободным он становится<\/h3>", "<p>Помни: чем больше ты сам умеешь себя ограничивать, тем больше свободы ты получаешь. И чем больше ты позволяешь себе делать всё без границ, тем больше другие люди будут вынуждены ограничивать тебя.<\/p>", "<p>О чём идёт речь?<\/p>", "<p>Когда у человека есть самодисциплина и чувство ответственности, когда он умеет остановить себя и контролировать своё поведение без того, чтобы другие делали ему замечания, он приобретает доверие окружающих и получает больше свободы действий.<\/p>", "<p>Напротив, человек, у которого нет самодисциплины и который делает всё, что ему хочется, на самом деле ограничивает самого себя. Своим поведением он заставляет окружающих делать ему замечания, критиковать его и устанавливать для него границы.<\/p>", "<p>Например: человек ведёт автомобиль и видит перед собой красный свет светофора. Он понимает, что ему придётся подождать несколько минут. Сколько в среднем человек может заработать за это время? Допустим, десять шекелей.<\/p>", "<p>Если он решит подождать, то как будто «потеряет» эти десять шекелей. Но если он решит не ждать и проедет на красный свет, его могут остановить и выписать штраф в тысячу шекелей — в сто раз больше, чем он хотел заработать.<\/p>", "<p>Может ли такой человек сказать:<\/p>", "<p>«Я всего лишь хотел заработать десять шекелей, поэтому оштрафуйте меня на десять шекелей. Почему тысяча?»<\/p>", "<p>Ему ответят:<\/p>", "<p>«Десять шекелей ты потерял бы, если бы сам выбрал, что разрешено, а что запрещено. Но в данном случае мы вынуждены воспитывать и предотвращать повторение такого поступка в будущем. Поэтому цена становится намного выше».<\/p>", "<p>Так происходит во всех сферах жизни, и так же происходит внутри семьи.<\/p>", "<p>Чем больше человек сам занимается своей внутренней работой, тем свободнее он живёт от вмешательства других людей. Но если он ищет оправдания своей безответственности, в конце концов он приводит к тому, что другие — муж или жена — начинают делать эту работу вместо него. И тогда цена может оказаться намного выше.<\/p>", "<p>Поэтому нередко люди приходят к ситуациям, когда они жалуются:<\/p>", "<p>«Почему за мной следят с секундомером?»<\/p>", "<p>«Я что, в детском саду?»<\/p>", "<p>Конечно, эти принципы относятся ко всем сферам жизни, но особенно к семейным вопросам: опоздания, выходы из дома, приглашение гостей, принятие решений после совета и учёта мнения супруга и тому подобное.<\/p>", "<p>И всё это должно происходить не из страха, а из уважения, признательности и взаимной ответственности.<\/p>", "<h3>Самодисциплина — это настоящая свобода<\/h3>", "<p>Гемара в трактате Гитин (13а) говорит:<\/p>", "<p>«Рабу приятнее жить в беспорядке и без ограничений»<br>(«Авда бе-хафкера ниха лей»).<\/p>", "<p>Раб предпочитает жизнь без обязательств, без ответственности и без порядка.<\/p>", "<p>Из этого мы учим, что чем больше человек стремится к свободе без границ и к вседозволенности, чем больше он убегает от самодисциплины и ответственности, — тем больше он уподобляется рабу.<\/p>", "<p>В противоположность этому, человек, обладающий самодисциплиной, принимающий ответственность за свои поступки и умеющий принимать мнение других без необходимости принуждения, находится в состоянии, подобном «царству». Такой человек является царём над самим собой — он управляет своими желаниями и своими поступками.<\/p>", "<p>Ведь настоящая сила и величие человека заключаются не в управлении другими людьми, а в способности управлять собой и побеждать свои внутренние стремления.<\/p>", "<p>Как сказал царь Шломо:<\/p>", "<p>«Лучше долготерпеливый, чем сильный, и владеющий своим духом — чем завоеватель города»<br>(Мишлей 16:32).<\/p>", "<p>Когда человек является «долготерпеливым», умеет принимать жизненные обстоятельства с добрым настроем и не спешит гневаться, люди считают его более сильным и мужественным, чем человека, обладающего только физической силой.<\/p>", "<p>Также человек, который владеет своим духом во время испытания, когда ситуация напряжённая и трудная, но всё равно не сердится, не держит обиды и сохраняет самообладание, считается более великим героем, чем воин, способный завоевать целый город.<\/p>", "<p>Отсюда мы учим, каким образом человек приобретает доверие окружающих его людей, а особенно доверие своего супруга, и насколько важным и ценным является доверие между мужем и женой.<\/p>", "<h3>Польза от доверия<\/h3>", "<p>Польза огромна:<\/p>", "<p>более спокойная жизнь;<\/p>", "<p>меньше напряжения и давления;<\/p>", "<p>больше взаимного уважения и признательности;<\/p>", "<p>больше мира в семье;<\/p>", "<p>меньше конфликтов и ссор.<\/p>", "<p>Тот, кто идёт этим путём, избавляет себя и членов своей семьи от большого напряжения, лишнего давления и многочисленных столкновений. Он удостаивается построить дом, основанный на доверии, уважении и любви.<\/p>", "<p>Когда супруги сдерживают себя и укрепляют взаимное доверие, именно они становятся главными получателями этой пользы.<\/p>", "<p>Помни: чем больше человек сам выполняет свою внутреннюю работу, тем меньше он зависит от контроля и давления со стороны других людей. Чем больше ответственности он берёт на себя, тем свободнее он становится от необходимости, чтобы другие указывали ему границы.<\/p>"]}, {"number": 3, "title": "Святость дома", "body": ["<p>Известны слова злодея Билама, сказанные им о народе Израиля в пустыне:<\/p>", "<p>«Как хороши шатры твои, Яаков, жилища твои, Израиль»<br>(Бемидбар 24:5).<\/p>", "<p>Раши объясняет слова «Как хороши шатры твои»: Билам увидел, что входы в шатры народа Израиля не были расположены напротив друг друга.<\/p>", "<p>Смысл этого таков: Билам удивился и спросил:<br>«Что же такого особенного в шатрах Яакова? Почему народ Израиля удостоился таких прекрасных домов — домов святости, мира, взаимной помощи, любви к ближнему и уважения к нему, а особенно уважения между мужем и женой?»<\/p>", "<p>Среди других народов этого нет. В семьях народов мира часто отсутствуют такие основы: люди могут быть заняты своими интересами, стремиться причинить вред друг другу, а отношение к женщине может быть унижающим, словно к служанке.<\/p>", "<p>Сам Билам отвечает на свой вопрос словами:<\/p>", "<p>«Жилища твои, Израиль».<\/p>", "<p>Народ Израиля сделал свои дома местом пребывания Божественного Присутствия — Шхины. Сам Билам заметил и увидел, что входы в шатры евреев не были направлены друг на друга из-за скромности и святости. Именно поэтому они удостоились таких прекрасных домов.<\/p>", "<p>Гемара в трактате Сота (17а) говорит:<\/p>", "<p>«Если муж и жена удостоились — Шхина пребывает между ними; если же не удостоились — огонь пожирает их».<\/p>", "<p>Когда муж и жена удостаиваются, Шхина находится между ними, и именно это является настоящей гарантией мира в доме, успеха и благословения.<\/p>", "<p>Но если, не дай Б-г, в доме нет присутствия Шхины, то Гемара говорит, что огонь раздора и ссор уничтожает их. Как мы видим в наши дни, существует множество домов, где нет святости, хороших качеств характера и правильного отношения друг к другу. Такие дома часто не выдерживают испытаний и распадаются, несмотря на то что их материальное положение может быть прекрасным.<\/p>", "<h3>Как удостоиться присутствия Шхины в доме?<\/h3>", "<p>Как уже было сказано, это единственная настоящая гарантия построения и сохранения семьи.<\/p>", "<p>Прежде всего, как сказано в Гемаре:<\/p>", "<p>«Муж и жена удостоились».<\/p>", "<p>Слово «удостоились» (זכו — заху) связано с понятием «очистили» (זיככו — зихху). То есть когда муж и жена очищают свои качества характера, стараются искоренять плохие черты из своего сердца и работать над собой, тогда они удостаиваются присутствия Шхины между ними.<\/p>", "<p>Как говорит Мишна в трактате Авот:<\/p>", "<p>«Зависть, страсть и стремление к почёту выводят человека из мира».<\/p>", "<p>Рав Элияу Деслер в своей книге «Михтав ме-Элияу», часть 1, глава 1, рассматривает вопрос о счастье человека в этом мире: существуют ли вообще по-настоящему счастливые люди?<\/p>", "<p>Рав Деслер приводит пример богатых людей. На первый взгляд они кажутся самыми счастливыми: посмотрим на их дома, изысканную пищу, многочисленных слуг, огромное количество денег и золота — разве они не должны быть счастливы?<\/p>", "<p>Но рав Деслер объясняет, что такой ответ является поверхностным. Именно так нельзя определить счастье человека.<\/p>", "<p>Чтобы узнать, счастлив ли человек или нет, нужно пройти среди людей и спросить каждого лично о нём самом, а не о других.<\/p>", "<p>Начнём с богатых людей — тех, у кого огромные состояния, кто живёт во дворцах и ездит на самых роскошных автомобилях. Что они ответят?<\/p>", "<p>«Нет, счастье не в нашем владении. Богатство — да, мы его получили, но настоящего счастья мы всё ещё не достигли».<\/p>", "<p>Один приходит со своей завистью, другой — со своими страстями. У многих из них трудности дома, семейные проблемы и проблемы с детьми.<\/p>", "<p>Мы даже знали богатых людей, которые ещё при жизни видели, как их дети спорят между собой о том, кто унаследует их имущество после смерти, и из-за этого возникают большие конфликты.<\/p>", "<p>Также они живут с постоянным страхом перед людьми, которые желают завладеть их состоянием, строят против них планы и пытаются заманить их в ловушку ради их денег и богатства.<\/p>", "<p>Особенно далёко от них настоящее счастье в тот момент, когда они чувствуют, что всё ещё не достигли желаемого.<\/p>", "<p>Как сказали наши мудрецы в Мидраше Коэлет Рабба (1:13):<\/p>", "<p>«Человек не умирает, имея в руках даже половину своих желаний».<\/p>", "<p>Это относится даже к самому богатому человеку в мире: в момент смерти он может чувствовать, что всё ещё не достиг и половины того, чего желал в этом мире.<\/p>", "<p>Разумеется, эти слова относятся к людям, которые не исправили себя и не искоренили из сердца погоню за земными желаниями.<\/p>", "<p>Продолжает рав Деслер:<\/p>", "<p>Спросим теперь мнение других людей — тех, кто находится на среднем уровне достатка. Мы обнаружим, что они много и тяжело работают ради того, чтобы увеличить своё состояние. Давайте посмотрим: может быть, именно они счастливы?<\/p>", "<p>Нет. Эти люди тоже не обретают счастья, потому что вся их жизнь занята не тем, чтобы наслаждаться своим богатством, а тем, чтобы постоянно увеличивать его. Когда же у них будет свободное время, чтобы наслаждаться жизнью и быть счастливыми?<\/p>", "<p>Никогда.<\/p>", "<p>Продолжает рав Деслер:<\/p>", "<p>Если мы спустимся ещё ниже — к простым рабочим, которые постоянно зарабатывают тяжёлым физическим трудом, являются ли они счастливыми?<\/p>", "<p>Давайте спросим их.<\/p>", "<p>Они работают тяжело каждый день, а иногда даже ночью. И после всего этого они чувствуют, что их доля в материальном благополучии этого мира является самой малой. Они постоянно думают, что именно богатые люди забрали себе всё богатство, оставив им лишь малую часть.<\/p>", "<p>Разве это счастье?<\/p>", "<p>Конечно же, нет.<\/p>", "<p>Тогда где же находятся по-настоящему счастливые люди в этом мире?<\/p>", "<p>Этот вопрос словно кричит: если так, что же сделал Всевышний, создав мир, если получается, что абсолютно все люди будут страдать в нём от больших и тяжёлых страданий?<\/p>", "<p>Но и это невозможно сказать, ведь Всевышний — источник абсолютного добра, и Он создал мир только для того, чтобы приносить благо. Конечно же, Он создал мир для того, чтобы люди были счастливы и наслаждались добром.<\/p>", "<p>Так где же ошибка? Где произошло искажение?<\/p>", "<p>Продолжает рав Деслер:<\/p>", "<p>Этот вопрос ясно объясняется словами настоящих мудрецов — мудрецов Торы. Это прямо сказано в Мишне:<\/p>", "<p>«Зависть, страсть и стремление к почёту выводят человека из мира»<br>(Авот 4:21).<\/p>", "<p>Мир, который создал Всевышний, — это счастливый мир, полностью наполненный добром. Но мы уже не находимся в том мире, который предназначил для нас Всевышний. Мы вышли из него в мир страданий и испытаний из-за этих трёх отрицательных сил:<\/p>", "<p>зависти;<\/p>", "<p>страстей;<\/p>", "<p>стремления к почёту.<\/p>", "<p>Если человек исправит себя и удалит из своего сердца зависть, страсть и погоню за почётом, он исправит свой внутренний мир, и тогда его жизнь станет миром, наполненным счастьем от одного края до другого.<\/p>", "<p>И не только счастьем, но и настоящим богатством.<\/p>", "<p>Как сказали наши мудрецы:<\/p>", "<p>«Кто богат? Тот, кто доволен своей долей»<br>(Авот 4:1).<\/p>", "<p>Мудрецы не сказали: «он тоже богат».<br>Они не сказали: «он очень богат».<br>Они сказали: только он является настоящим богатым человеком.<\/p>", "<p>А все остальные — не только не обладают настоящим счастьем, но и их богатство на самом деле не находится полностью в их владении.<\/p>", "<p>Истинного счастья и настоящего богатства может удостоиться только тот, кто изгнал из своего сердца погоню за материальными желаниями этого мира.<\/p>", "<p>Мы должны знать одно важное правило:<\/p>", "<p>В материальном мире не существует настоящего счастья. Настоящее счастье — только духовное.<\/p>", "<p>Тот, кто богат духовно, именно он является по-настоящему счастливым человеком — он и никто другой.<\/p>", "<p>Как сказал царь Давид:<\/p>", "<p>«А для меня близость к Б-гу — благо»<br>(Теилим 73:28).<\/p>", "<p>Царь Давид не говорит, что когда у человека есть золото и серебро — а у царя, конечно же, не было недостатка ни в деньгах, ни в богатстве, когда у него есть корона на голове, слуги и многочисленные помощники — тогда ему хорошо.<\/p>", "<p>Он говорит совершенно другое:<\/p>", "<p>«А для меня близость к Б-гу — благо»<br>(Теилим 73:28).<\/p>", "<p>Только когда человек удостаивается близости к Всевышнему — ему по-настоящему хорошо, потому что это и есть настоящее благо. Всё остальное — лишь иллюзия.<\/p>", "<p>Человек может представить себе, что он счастлив, но истинное положение вещей может быть от этого очень далеко — как восток далёк от запада.<\/p>", "<p>Это один из путей достижения состояния, о котором сказано:<\/p>", "<p>«Если муж и жена удостоились — Шхина пребывает между ними».<\/p>", "<p>Этот путь заключается в том, чтобы очищать свои качества характера и искоренять из сердца зависть, страсть и стремление к почёту. Тогда человек становится способным радоваться тому, что Всевышний дал ему, и быть по-настоящему счастливым своей долей.<\/p>", "<h3>Второе условие для того, чтобы Шхина пребывала между супругами<\/h3>", "<p>Второе необходимое условие для достижения состояния «удостоились — Шхина между ними» заключается в том, чтобы супруги были очень осторожны в вопросах святости дома и чистоты семейной жизни.<\/p>", "<p>Необходимо тщательно соблюдать все связанные с этим законы согласно Торе.<\/p>", "<p>Иногда некоторые законы могут казаться супругам чрезмерными, особенно законы ограничений и отдаления (диней hарахакот). Но все эти законы и все их детали являются словами живого Божественного учения.<\/p>", "<p>Необходимо знать и понимать: особая осторожность в соблюдении всех деталей этих законов охраняет дом, укрепляет его построение и сохраняет его святость.<\/p>", "<p>Когда человек начинает пренебрегать деталями этих законов, именно тогда начинается постепенное ослабление целостности семьи. И невозможно знать, насколько далеко это может зайти.<\/p>", "<p>Поэтому необходимо соблюдать все законы святости дома и чистоты семейной жизни согласно Торе с точностью и не пренебрегать ни одной деталью, потому что именно эти вещи являются причиной присутствия Шхины в доме.<\/p>", "<p>Невозможно достичь настоящего мира в семье без присутствия Шхины.<\/p>", "<p>Даже если иногда кажется, что существуют пары, у которых есть мир в доме, несмотря на то что они не соблюдают упомянутые основы, следует понимать: такой мир является лишь временным и ни в коем случае не может сохраняться долго.<\/p>", "<p>Поэтому хорошо, чтобы супруги вместе старались глубоко изучать эти законы, постоянно повторять и укреплять знание законов чистоты семейной жизни.<\/p>", "<p>Также очень важно прилагать большие усилия, чтобы искоренять из сердца зависть, страсть и стремление к почёту:<\/p>", "<p>не смотреть на других людей с завистью;<\/p>", "<p>не желать чужой доли;<\/p>", "<p>не стремиться получить то, что принадлежит другому;<\/p>", "<p>удаляться от погони за почётом;<\/p>", "<p>довольствоваться тем, чем Всевышний одарил человека.<\/p>", "<p>Также очень важно стараться изучать законы Шмират hалашон — сохранения чистоты речи, и строго применять эти знания в жизни, поскольку они обладают огромной силой привести к присутствию Шхины в доме.<\/p>", "<p>А когда Шхина пребывает в доме, тогда приходит настоящий мир между супругами, правильное воспитание детей, здоровье, достаток и успех во всех делах.<\/p>", "<h3>Святость дома приносит присутствие Шхины<\/h3>", "<p>Когда в доме есть святость — в доме пребывает Шхина.<\/p>", "<p>А когда в доме пребывает Шхина, тогда есть:<\/p>", "<p>мир и согласие между супругами;<\/p>", "<p>улыбки и радость детей;<\/p>", "<p>благословение;<\/p>", "<p>здоровье и исцеление;<\/p>", "<p>успех во всех начинаниях.<\/p>"]}, {"number": 4, "title": "Важность умения отдавать", "body": ["<p>Супруги, которые хотят построить верный еврейский дом — дом, наполненный миром, любовью и взаимопониманием, — должны прежде всего осознать одну важную истину.<\/p>", "<p>Каждый из супругов должен понимать, что его главная задача в браке — отдавать, заботиться о другом и добросовестно исполнять свои обязанности по отношению к супругу, а не жить лишь ради собственного удовлетворения и исполнения своих желаний.<\/p>", "<p>Сегодня в мире широко распространено ошибочное представление, которое, к сожалению, проникло и во многие еврейские семьи. Человек нередко считает, что женится исключительно ради собственной выгоды: потому что ему тяжело быть одному, потому что так удобнее или приятнее жить. Главный принцип такого мышления — «всё ради меня».<\/p>", "<p>Если так думает один супруг, то обычно так же начинает думать и другой. Тогда начинается борьба взаимных требований. Никто не хочет первым проявить любовь и заботу. Часто можно услышать: «Если он будет хорошо ко мне относиться и уважать меня, тогда и я буду относиться к нему хорошо». Каждый ждёт первого шага от другого.<\/p>", "<p>Однако опыт показывает, что оба редко начинают одновременно. В результате супруги могут ждать этого всю жизнь, пока кто-нибудь из них не решится первым начать отдавать.<\/p>", "<p>Именно поэтому сегодня так много разрушенных семей, где люди не только не хотят давать друг другу, но ещё и требуют уважения, внимания и любви исключительно для себя. Такое отношение почти всегда приводит к пренебрежению, обидам и постоянным ссорам.<\/p>", "<p>Следует понимать, что подобный взгляд на семейную жизнь является глубокой ошибкой. Настоящего счастья и мира в таком доме быть не может. Если супруги действительно хотят счастливой жизни, они должны изменить своё мировоззрение и принять взгляд Торы.<\/p>", "<p>Какова же позиция Торы?<\/p>", "<p>В трактате Пиркей Авот сказано:<\/p>", "<p>«Кто достоин почёта? Тот, кто оказывает почёт другим людям».<\/p>", "<p>Мишна не говорит: «Достоин почёта тот, кто требует уважения», и тем более не говорит: «Тот, кто унижает других». Напротив, уважение приходит к человеку лишь тогда, когда он сам оказывает уважение окружающим.<\/p>", "<p>Прежде всего следует помнить, что обязанность отдавать возложена на нас Самим Всевышним.<\/p>", "<p>Кроме того, необходимо понять простую истину: человек, который больше заботится о том, чтобы отдавать другим, чем о том, чтобы получать, в итоге получает больше всех.<\/p>", "<p>Если ты оказываешь уважение — тебя будут уважать. Если относишься к другому с добротой — и к тебе будут относиться так же. Если любишь — тебя будут любить. Если же поступаешь наоборот, то и отношение к тебе будет соответствующим. Это проверено жизненным опытом.<\/p>", "<p>Известен рассказ об одном великом мудреце, который, провожая дочь под свадебный хупу, сказал ей:<\/p>", "<p>«Дочь моя, если ты сделаешь своего мужа царём в доме, он сделает тебя царицей. Если же ты сделаешь его рабом, он сделает тебя служанкой».<\/p>", "<p>Так же, как человек относится к своему ближнему, так и ближний будет относиться к нему.<\/p>", "<p>Даже если человек отдаёт и пока не видит взаимности, он не должен прекращать поступать правильно. Прежде всего следует обратиться ко Всевышнему с молитвой и просить Его о помощи. Кроме того, сама обязанность отдавать остаётся заповедью независимо от того, получает ли человек что-либо взамен. Со временем он увидит, что ситуация начнёт меняться к лучшему.<\/p>", "<p>Любовь между супругами должна быть любовью, не зависящей ни от каких внешних обстоятельств.<\/p>", "<p>Правильный взгляд таков: «Я люблю своего супруга (или супругу) потому, что именно этого человека Всевышний предназначил мне».<\/p>", "<p>В книге Зоар говорится, что в Высшем мире мужчина и женщина являются одной душой, как сказано: «Мужчину и женщину сотворил Он... и нарёк им имя — Адам». Они представляют собой два отдельных тела, но одну общую душу. Лишь приходя в этот мир, они существуют отдельно, пока вновь не соединятся в браке.<\/p>", "<p>Именно такой должна быть любовь между супругами: они должны понимать, что по своей духовной сути являются одной душой. Тогда их любовь не зависит ни от красоты, ни от богатства, ни от каких-либо других внешних факторов.<\/p>", "<p>Если же любовь основана только на внешних причинах, то, когда исчезает причина, исчезает и сама любовь.<\/p>", "<p>Тора учит нас любить и отдавать всегда и при любых обстоятельствах.<\/p>", "<p>Если человек не строит свою семейную жизнь таким образом, последствия могут оказаться очень тяжёлыми.<\/p>", "<p>Автор приводит пример семьи, которую он лично знал. Хотя супруги не соблюдали Тору и заповеди, между ними царили мир, любовь и взаимопонимание. Они никогда не ссорились и не повышали друг на друга голос. Автор даже подумал, что, возможно, и без соблюдения законов Торы можно построить крепкую семью.<\/p>", "<p>Однако спустя несколько лет он с удивлением узнал, что муж познакомился с другой женщиной, увлёкся ею, оставил свою первую жену и женился во второй раз.<\/p>", "<p>Это пример любви, зависящей от внешних обстоятельств. Когда исчезает причина, на которой была основана любовь, исчезает и сама любовь. Так происходит, когда семейная жизнь не строится в соответствии с путем Торы и наставлениями наших мудрецов, благословенна их память.<\/p>", "<p>Человек, который вступает в брак исключительно ради собственной выгоды, чтобы удовлетворить свои желания и потребности, может какое-то время создавать впечатление счастливой семьи и благополучного брака. Однако такая основа не способна долго существовать. И даже если внешне семья сохранится, настоящего счастья в ней не будет.<\/p>", "<p>Напротив, человек, который вступает в брак во имя Небес, с целью построить верный еврейский дом, посвящённый служению Всевышнему, должен строить семейную жизнь так, чтобы постоянно думать о том, как дать, поддержать и сделать добро своему супругу.<\/p>", "<p>В такой семье каждый стремится первым проявить любовь, заботу и внимание. Тот, кто первым начинает отдавать, показывает, что действительно чувствует ответственность за создание крепкого и достойного еврейского дома.<\/p>", "<p>Рассказывают об одном великом мудреце, который, приходя на свадьбу, говорил жениху и невесте:<\/p>", "<p>«Пока каждый из вас будет думать о том, как отдавать друг другу от всего сердца, ваша семейная жизнь будет счастливой. Но как только вы начнёте предъявлять друг другу требования, счастье покинет ваш дом».<\/p>", "<p>Например, человек возвращается домой после тяжёлого рабочего дня и видит, что еда ещё не приготовлена. Тот, кто думает только о себе, сразу начинает сердиться, кричать и устраивать ссору.<\/p>", "<p>Но человек, живущий с желанием отдавать и заботиться о другом, поступит иначе. Он не станет раздражаться, а прежде всего поинтересуется, как чувствует себя его жена: хорошо ли она себя чувствует, не был ли у неё особенно тяжёлый день, не нужна ли ей помощь. Затем он сам поможет ей.<\/p>", "<p>Помни: чем больше ты думаешь о благе другого человека, тем больше и другой будет стремиться сделать добро тебе.<\/p>", "<p>Тот, кто меньше требует для себя и больше отдаёт другим, в конечном итоге получает больше всех.<\/p>", "<p>Если ты оказываешь уважение — тебя будут уважать. Если относишься к людям с добротой — и к тебе будут относиться так же. Если любишь — тебя будут любить. Если же поступаешь наоборот, то и получишь такое же отношение в ответ.<\/p>"]}, {"number": 5, "title": "Сила тёплых слов и доброго отношения", "body": ["<p>Тёплые слова и доброе отношение — это одна из самых мощных движущих сил успеха человека вообще и семейного мира в частности. Благодаря им человек способен изменить всю свою жизнь к лучшему.<\/p>", "<p>Иногда можно услышать, как люди говорят: «Я очень тяжело работал весь день. Пусть хотя бы скажут мне доброе слово». Из этого мы видим, что человек готов трудиться с утра до вечера ради одного доброго слова.<\/p>", "<p>Каждый человек нуждается в тёплых словах, как в воздухе для дыхания. Каждый жаждет доброго отношения и поддержки. Без этого жизнь теряет свою полноту.<\/p>", "<p>Будем мудры и научимся вовремя говорить добрые слова и проявлять тёплое отношение. Любящее, внимательное отношение для человека важнее всех удовольствий и наслаждений этого мира.<\/p>", "<p>Этому учит нас Талмуд (Ктубот 111б). Рабби Йоханан сказал:<\/p>", "<p>«Тот, кто приветствует своего ближнего с улыбкой, делает для него больше, чем тот, кто поит его молоком».<\/p>", "<p>Как объясняют комментаторы, представьте себе человека, который находится в пустыне и мучается от сильной жажды. Он надеется найти хотя бы немного воды. Вдруг он встречает доброго человека, который вместо воды предлагает ему холодное молоко. Какое огромное добро он сделал! Какую благодарность будет испытывать тот, кто получил такую помощь!<\/p>", "<p>Однако рабби Йоханан говорит, что человек, который «осветляет лицо» своему ближнему, то есть искренне улыбается ему, делает для него ещё больше, чем если бы напоил его холодным молоком в пустыне. Одна только улыбка стоит больше этого. Тем более если человек добавляет слова поддержки, которые способны поднять дух другого.<\/p>", "<p>Супругам особенно важно обратить внимание на несколько вещей.<\/p>", "<p>1. Благодарность. Нужно стараться благодарить друг друга за всё, что супруг делает для другого или для дома. Не следует воспринимать такие дела как нечто само собой разумеющееся. Нужно замечать каждое доброе дело, хвалить и поощрять любое проявление заботы и самоотдачи.<\/p>", "<p>2. Поддержка. Очень важно поддерживать друг друга. По природе человека бывают периоды, когда его охватывает отчаяние, когда ему кажется, что он ничего не стоит, что он неудачник и у него ничего не получается. Именно тогда супруг или супруга должны помочь, ободрить, порадовать и поднять настроение настолько, насколько это возможно.<\/p>", "<p>3. Доброе отношение. Следует всегда проявлять тёплое, доброжелательное и внимательное отношение друг к другу.<\/p>", "<p>4. Умение слушать. Очень важно спокойно и терпеливо выслушивать своего супруга.<\/p>", "<p>5. Телефонное общение. Очень важно хотя бы один раз в день позвонить друг другу, узнать, как дела, проявить искренний интерес и личное внимание.<\/p>", "<p>Один человек может разговаривать с женой по телефону полчаса, но она всё равно не почувствует удовлетворения от разговора. Другой поговорит всего одну минуту, а жена будет счастлива и довольна.<\/p>", "<p>Разница заключается в том, что первый говорил лишь о различных общих вопросах, но не сумел уделить внимание самой жене. Второй же заранее подумал, как проявить к ней личное внимание, показал, насколько он рад и счастлив разговаривать именно с ней. Разумеется, это должно быть взаимно, и так же должна поступать жена по отношению к своему мужу.<\/p>", "<p>Очень важно всегда сообщать супругу, где вы находитесь. Если вы задерживаетесь по дороге домой, обязательно предупредите об этом.<\/p>", "<p>6. Видеть достоинства. Следует всегда обращать внимание на хорошие качества супруга. Когда человек смотрит именно так и не сосредотачивается на недостатках, между супругами рождается любовь. А когда есть любовь, даже если впоследствии возникают ошибки или недоразумения, их гораздо легче простить и перенести.<\/p>", "<p>Как сказано в книге Мишлей (10:12):<\/p>", "<p>«Любовь покрывает все проступки».<\/p>", "<p>Дорогие супруги! Не скупитесь на тёплые слова и доброе отношение. Это ничего не стоит материально, но ценится гораздо выше любых денег. Именно так вы строите свою жизнь и делаете её счастливой.<\/p>", "<p>На самом деле этим вы делаете добро самим себе, потому что тот, кто отдаёт, в конце концов получает обратно ещё больше. Это проверено опытом. Возможно, вы не увидите результата сразу, но со временем убедитесь, насколько это было правильно и полезно.<\/p>", "<p>Добрые слова и тёплое отношение радуют человека, вдохновляют его и способствуют семейному миру больше, чем любые материальные подарки. Нет человека, который не нуждался бы в этом.<\/p>", "<p>Существует множество историй о супружеских парах, которые стояли на грани развода и считали, что дальше жить вместе уже невозможно.<\/p>", "<p>Однажды ко мне пришёл муж за советом. Я спросил его:<\/p>", "<p>— Ты проявляешь внимание к своей жене? Ты говоришь ей «спасибо»?<\/p>", "<p>Он удивился:<\/p>", "<p>— За что?<\/p>", "<p>Я ответил:<\/p>", "<p>— За стирку, за приготовленную еду, за заботу о детях. Разве всё это не заслуживает благодарности и уважительного отношения?<\/p>", "<p>Тогда он сказал:<\/p>", "<p>— Рав, я никогда об этом не задумывался.<\/p>", "<p>Я посоветовал ему начать замечать каждое её доброе дело, проявлять к ней тепло, любовь и благодарность. Но при этом дал ему одно важное правило: прежде чем говорить добрые слова, нужно самому искренне верить в то, что говоришь.<\/p>", "<p>Я предложил ему написать на листе бумаги все хорошие качества своей жены. Когда список был готов, я попросил его прочитать написанное примерно десять раз, хорошо осмыслить и принять это сердцем. И только после этого начать выражать ей своё уважение и благодарность.<\/p>", "<p>В результате супруги не только перестали думать о разводе, но и их семейная жизнь значительно улучшилась. Сегодня они счастливая, любящая семья.<\/p>", "<p>Подобные случаи происходят во многих домах.<\/p>", "<p>Поэтому будем помнить о важности добрых слов и тёплого отношения и применять это в своей собственной семье. Благодаря этому мы удостоимся построить счастливый, полноценный дом, наполненный присутствием Шхины, и заслужим успех в своей жизни и в воспитании наших детей на пути Торы и традиции Израиля.<\/p>", "<p>Амен. Да будет на то воля Всевышнего.<\/p>", "<p>Доброе отношение и тёплые слова, сказанные в нужное время, приносят человеку больше радости и пользы, чем любое богатство.<\/p>"]}, {"number": 6, "title": "Работа над качествами характера (исправление мидот)", "body": ["<p>Человек, который ещё не научился исправлять свои дурные качества характера, не способен построить крепкий и достойный еврейский дом. Плохие качества являются серьёзным препятствием для создания семьи и достижения семейной гармонии.<\/p>", "<p>Если человек склонен к гневу или гордыне, вся его жизнь превращается в череду ссор и обид. Даже самые незначительные вещи раздражают его и нарушают его душевное спокойствие. Ему постоянно кажется, что окружающие поступают не так, как он хочет. При таком отношении невозможно построить счастливую семью и вести нормальную жизнь.<\/p>", "<p>Поэтому каждому необходимо понимать, что самым прочным основанием для строительства семьи является работа над своими качествами характера.<\/p>", "<p>Как исправить дурные качества?<\/p>", "<p>Начнём с гордыни.<\/p>", "<p>Давайте задумаемся: чего на самом деле хочет человек, страдающий этим качеством, которое является корнем многих других недостатков? Он стремится к почёту и хочет, чтобы всё происходило по его воле.<\/p>", "<p>Но необходимо понять, что гордыня в конечном итоге лишь унижает самого человека. Никто не любит гордецов. В Талмуде сказано, что гордец не принят даже среди членов собственного дома. Вместо уважения он получает презрение. Даже если люди внешне этого не показывают, в глубине души им трудно его переносить.<\/p>", "<p>Поэтому, если ты действительно хочешь заслужить уважение, уважай других.<\/p>", "<p>Как проявлять уважение к людям?<\/p>", "<p>Во-первых, суди их благосклонно (оправдывай их поступки). Пытайся понять ошибки других, ведь и ты сам можешь однажды оказаться в подобной ситуации.<\/p>", "<p>Во-вторых, уступай и не будь слишком требовательным. Чем больше человек умеет сдерживать себя, проявлять терпение, понимать и уважать других, тем больше любви и уважения он получает в ответ.<\/p>", "<p>Ещё одно качество, от которого необходимо избавиться, — это гнев.<\/p>", "<p>Гнев — чрезвычайно разрушительное качество. Он разрушает жизнь самого человека, жизнь окружающих его людей и нарушает мир в семье.<\/p>", "<p>Рабби Йонатан сказал:<br>«Всякий, кто гневается, оказывается во власти всех видов Геенны.»<\/p>", "<p>Рабба бар Рав Гуна сказал:<br>«Всякий, кто гневается, — даже Шехина (Божественное Присутствие) не имеет для него значения.»<\/p>", "<p>Рабби Ирмия из Дифти сказал:<br>«Всякий, кто гневается, забывает своё учение и становится ещё более неразумным, как сказано: &quot;Ибо гнев покоится в сердце глупцов&quot; (Коэлет 7:9).»<br>(Талмуд, Недарим 22а)<\/p>", "<p>Как исправить этот недостаток?<\/p>", "<p>Прежде всего необходимо понять: неважно, насколько сильно согрешили против тебя — твой нынешний гнев является большим грехом, чем тот, который совершили по отношению к тебе.<\/p>", "<p>Лучший способ исправить это качество — научиться видеть добро во всём и при любых обстоятельствах. Нужно видеть добро, потому что оно действительно существует.<\/p>", "<p>Как говорил Рабби Акива:<br>«Всё, что делает Всевышний, — Он делает к добру.»<\/p>", "<p>Чем глубже человек усвоит эту мысль, тем спокойнее и счастливее станет его жизнь.<\/p>", "<p>Когда мы хотим исправить свой гнев, прежде всего необходимо понять, что именно нас раздражает.<\/p>", "<p>Например, если человек часто сердится на свою жену, ему следует глубоко задуматься.<\/p>", "<p>Во-первых, пусть размышляет о её достоинствах и хороших качествах. Желательно даже записать их на листе бумаги, чтобы приучить себя смотреть на неё добрым взглядом.<\/p>", "<p>Во-вторых, пусть знает, что поведение жены, которое сейчас вызывает у него раздражение, также приходит от Всевышнего. Как сказано в Талмуде (Хулин 7б):<br>«Человек не ударит даже пальцем ноги внизу, если об этом не было объявлено Свыше.»<\/p>", "<p>Что даст мне мой гнев? Гораздо лучше обратиться к Всевышнему с молитвой, ведь всё происходит по Его воле.<\/p>", "<p>То же самое относится и к детям.<\/p>", "<p>Например, ребёнок разбил какую-то вещь.<\/p>", "<p>Почему нужно сердиться?<\/p>", "<p>Во-первых, эта вещь могла бы разбиться и по другой причине.<\/p>", "<p>Неужели только потому, что ребёнок маленький и не может защитить себя, мы должны пользоваться этим и сердиться на него?<\/p>", "<p>Во-вторых, если этой вещи было суждено разбиться, значит, так было постановлено Небесами. Если бы её не разбил ребёнок, она всё равно разбилась бы каким-либо другим способом.<\/p>", "<p>В-третьих, кто знает, возможно, благодаря этой поломке была отменена какая-то более тяжёлая небесная мера?<\/p>", "<p>Обо всём этом следует размышлять заранее — ещё до того, как произойдёт неприятная ситуация.<\/p>", "<p>Будь то отношения с женой, детьми или другими людьми, человек должен воспитывать себя так, чтобы не сердиться и не затаивать обиду, а стараться понимать и с любовью принимать происходящее.<\/p>", "<p>С Божьей помощью это позволит ему исправить свои качества характера.<\/p>", "<p>Человек, который будет поступать таким образом, приобретёт огромную пользу: он всегда будет радостным и счастливым.<\/p>", "<p>Как сказал царь Шломо:<br>«Лучше долготерпеливый, чем сильный, и владеющий собой — чем завоеватель города.» (Мишлей 16:32)<\/p>", "<p>Тот, кто покорил целый город, безусловно радуется своей силе и могуществу. Но царь Шломо учит нас, что человек, умеющий властвовать над собой, является ещё более великим героем.<\/p>", "<p>Для этого необходимы постоянная подготовка, размышление и глубокое осмысление. Если человек не перестанет работать над собой, то, когда придёт испытание, у него будут силы принять всё происходящее с любовью и радостью.<\/p>", "<h3>Работа над качествами характера (часть 2)<\/h3>", "<p>Известная притча рассказывает о группе оленей, которые решили вырубить все деревья в лесу.<\/p>", "<p>Деревья очень мешали им, особенно когда хищники преследовали их. Их большие рога цеплялись за ветви, и из-за этого они подвергались смертельной опасности.<\/p>", "<p>Поэтому олени решили:<br>«Вырубим все деревья, и тогда спасёмся от хищников.»<\/p>", "<p>Рано утром они принялись за работу и трудились с утра до вечера.<\/p>", "<p>Под вечер к ним подошёл старый мудрый олень. Увидев, чем они занимаются, он удивился и спросил:<\/p>", "<p>— Что вы делаете?<\/p>", "<p>— Мы в большой опасности, — ответили олени. — Нас преследуют хищники, а наши рога запутываются в деревьях. Поэтому мы решили выкорчевать весь лес.<\/p>", "<p>Мудрый олень сказал:<\/p>", "<p>— Я вас не понимаю. Допустим, вы вырубите этот лес. А что будете делать со следующим?<\/p>", "<p>— Нет проблем, — ответили они. — Вырубим и второй лес!<\/p>", "<p>— А что с третьим? — продолжил спрашивать старый олень.<\/p>", "<p>— Тогда вырубим третий, четвёртый и пятый!<\/p>", "<p>Мудрый олень сказал:<\/p>", "<p>— Но пока вы доберётесь до третьего и четвёртого лесов, в первом уже снова вырастут деревья. Что тогда? Неужели вы собираетесь день и ночь только тем и заниматься, что рубить лес?<\/p>", "<p>Тогда олени спросили:<\/p>", "<p>— А что предлагаешь ты?<\/p>", "<p>Старый олень ответил:<\/p>", "<p>— Вместо того чтобы вырубать все леса, избавьтесь от своих рогов. Тогда ничто не будет мешать вам бежать. Вы сможете свободно спасаться и больше не будете запутываться в ветвях.<\/p>", "<h3>Нравственный смысл притчи<\/h3>", "<p>Так же происходит и с человеком.<\/p>", "<p>Подобно рогам, которые цепляются за деревья, дурные качества человека постоянно запутывают его жизнь. Гордыня, гнев и другие плохие черты характера становятся причиной бесконечных трудностей.<\/p>", "<p>Неразумный человек вместо того, чтобы исправить самого себя, пытается изменить весь окружающий мир так, чтобы он соответствовал его желаниям.<\/p>", "<p>Мудрый же человек поступает иначе. Он исправляет свои качества характера — словно снимает рога со своей головы. Благодаря этому его жизнь становится спокойной, мирной и счастливой. Он проходит свой жизненный путь без постоянных конфликтов и осложнений.<\/p>", "<p>Так же и при строительстве еврейского дома.<\/p>", "<p>Человек, который ещё не исправил свои дурные качества, не способен построить крепкую и верную еврейскую семью. Его плохие качества становятся серьёзным препятствием для мира, благополучия и правильного устройства дома.<\/p>", "<p>Если человек склонен к гневу или гордыне, вся его жизнь превращается в череду ссор и обид. Даже самые незначительные вещи раздражают его. Ему постоянно кажется, что окружающие нарушают его волю и не уважают его достоинство.<\/p>", "<p>При таком подходе невозможно построить настоящий дом.<\/p>", "<p>Поэтому необходимо знать, что самым прочным основанием семейной жизни является работа над своими качествами характера.<\/p>", "<h3>Как исправить свои качества?<\/h3>", "<p>Для этого необходимо глубоко усвоить две очень важные истины. Если человек примет их всем сердцем, он сможет исправить все свои дурные качества.<\/p>", "<h3>Первая истина<\/h3>", "<p>В Талмуде (Хулин 7б) сказано:<\/p>", "<p>«Человек не ударит даже пальцем ноги внизу, если прежде об этом не было постановлено Свыше.»<\/p>", "<p>Как сказано в книге Теилим (37:23):<\/p>", "<p>«От Господа утверждаются шаги человека.»<\/p>", "<p>Это означает, что всё происходящее в мире находится под личным Провидением Всевышнего.<\/p>", "<p>Необходимо ясно понимать:<\/p>", "<p>Никто не способен причинить мне вред без воли Всевышнего.<\/p>", "<p>Никто не способен сделать мне добро, если этого не пожелал Всевышний.<\/p>", "<p>Никто не может сказать мне ни доброго, ни плохого слова, если это не было определено Небесами.<\/p>", "<p>Если Всевышний постановил, что что-то должно произойти, — это произойдёт.<\/p>", "<p>А если Он этого не постановил, то этого никогда не случится.<\/p>", "<p>Поэтому и всё поведение жены, и детей также определяется Всевышним.<\/p>", "<p>Когда человек искренне и всем сердцем верит, что всё исходит от Всевышнего, только тогда он способен принимать происходящее с любовью, не обижаться и не гневаться.<\/p>", "<p>Это можно сравнить со следующим примером.<\/p>", "<p>Человек стоит в очереди в банке. Он устал, напряжён и с нетерпением ждёт своей очереди.<\/p>", "<p>Вдруг кто-то неожиданно хлопает его по затылку.<\/p>", "<p>Он мгновенно приходит в ярость и уже готов ответить обидчику.<\/p>", "<p>Но, обернувшись, он видит, что это его давний хороший друг, которого он давно не встречал.<\/p>", "<p>В одно мгновение весь гнев исчезает, уступая место радости, любви и тёплым чувствам. Он спешит обнять своего друга.<\/p>", "<p>Что изменилось?<\/p>", "<p>Ведь удар остался тем же самым.<\/p>", "<p>Почему ещё секунду назад он был полон гнева, а теперь испытывает любовь?<\/p>", "<p>Изменилось лишь одно — теперь он знает, кто нанёс этот удар.<\/p>", "<p>Поскольку он знает, что это сделал его близкий друг, он понимает, что удар был не проявлением злобы, а, наоборот, выражением дружбы и любви.<\/p>", "<p>Как сказал царь Шломо:<\/p>", "<p>«Любовь покрывает все проступки.» (Мишлей 10:12)<\/p>", "<p>Этого человека он любит, доверяет ему и знает, что тот не хотел причинить ему вред. Поэтому он не обижается.<\/p>", "<p>Точно так же будет и с нами, если мы всем сердцем поверим, что всё происходящее с нами происходит по личному Провидению Всевышнего.<\/p>", "<p>Если человек действительно верит в это, у него нет причины сердиться на того, кто сделал ему что-то неприятное.<\/p>", "<p>Более того, наши мудрецы обещали нам:<\/p>", "<p>«Всё, что делает Милосердный, Он делает к добру.»<\/p>", "<p>То есть не только всё приходит от Всевышнего, но всё это — ради нашего блага.<\/p>", "<p>Настолько, что Маран, автор «Шулхан Аруха», постановил это как закон (Орах Хаим, 230:5):<\/p>", "<p>«Человек должен всегда приучать себя говорить: &quot;Всё, что делает Милосердный, Он делает к добру&quot;.»<\/p>", "<p>Из этого мы учим две основные истины:<\/p>", "<p>Всё, что происходит с человеком, приходит не от людей, а от Всевышнего.<\/p>", "<p>Всё происходящее — к добру.<\/p>", "<p>Если мы глубоко усвоим это и будем верить в это всей душой, то у нас не останется причины для раздражения и гнева.<\/p>", "<p>Эту мысль необходимо не просто понимать умом, а глубоко вложить в своё сердце.<\/p>", "<p>Всё, что происходит дома, на улице или где бы то ни было, находится под личным Провидением Всевышнего, и всё предназначено для добра и благословения.<\/p>", "<p>Недостаточно лишь знать эти идеи.<\/p>", "<p>Мы знаем очень многое, но далеко не всегда воплощаем это в жизни.<\/p>", "<p>Почему?<\/p>", "<p>Потому что в молитве «Алейну ле-шабеах» мы каждый день произносим слова:<\/p>", "<p>«И знай сегодня, и возврати это к своему сердцу...»<br>(Дварим 4:39)<\/p>", "<p>Одного знания недостаточно для исправления характера.<\/p>", "<p>Необходимо постоянно возвращать эти истины в своё сердце, повторять их снова и снова, осознавать их важность и укреплять веру в то, что всё происходящее находится под личным управлением Всевышнего.<\/p>", "<p>Более того, нам обещано, что всё происходящее — к добру.<\/p>", "<p>Так на что же сердиться?<\/p>", "<p>Разве человек сердится, когда ему делают добро?<\/p>", "<p>Человек гневается только тогда, когда считает, что с ним поступили плохо.<\/p>", "<p>Но если он понимает, что всё происходящее — это высшее благо, то причина для гнева исчезает.<\/p>", "<p>После того как человек по-настоящему усвоит эти идеи, ему станет гораздо легче исправлять свои качества характера.<\/p>", "<p>Именно вера в эти принципы помогает человеку измениться.<\/p>", "<p>Нужно глубоко-глубоко запечатлеть их в своём сердце.<\/p>", "<p>Однажды мать нескольких детей спросила нас:<\/p>", "<p>«Можно ли иногда сердиться на детей, или любой гнев запрещён?»<\/p>", "<p>Ответ таков:<\/p>", "<p>Существует два вида гнева.<\/p>", "<p>Есть гнев положительный — воспитательный.<\/p>", "<p>И есть гнев отрицательный.<\/p>", "<p>Это относится и к воспитанию детей.<\/p>", "<h3>Что такое отрицательный гнев?<\/h3>", "<p>Это внезапная вспышка раздражения.<\/p>", "<p>Человек мгновенно выходит из себя и действует под влиянием эмоций.<\/p>", "<p>Такой гнев запрещён.<\/p>", "<p>При этом человек не только нарушает запрет на гнев, но и показывает ребёнку, что сам не умеет владеть собой.<\/p>", "<p>Ребёнок видит:<\/p>", "<p>«Папа (или мама) не управляет своими чувствами. Он сразу взрывается.»<\/p>", "<p>Такой гнев не приносит никакой воспитательной пользы.<\/p>", "<p>Человек нарушил запрет и одновременно получил отрицательный результат.<\/p>", "<h3>Что такое положительный гнев?<\/h3>", "<p>Это гнев, который рождается после размышления.<\/p>", "<p>Отец сначала останавливается, не реагирует сразу, обдумывает поступок ребёнка и размышляет, как правильно поступить.<\/p>", "<p>Если после спокойного анализа он приходит к выводу, что ради воспитания сейчас необходимо проявить строгость или даже показать недовольство, тогда такой гнев считается допустимым.<\/p>", "<p>Это уже не вспышка эмоций, а осознанная воспитательная мера.<\/p>", "<p>Такой подход передаёт ребёнку правильный урок.<\/p>", "<p>Ребёнок понимает:<\/p>", "<p>«Папа сначала подумал, оценил ситуацию и только потом решил проявить строгость.»<\/p>", "<p>Такой гнев основан на здравом рассуждении, а не на потере самообладания.<\/p>", "<p>Поэтому подобный гнев разрешён, поскольку он служит воспитательной цели.<\/p>", "<p>Следует помнить, что каждый день нашей жизни наполнен испытаниями.<\/p>", "<p>Каждый человек приходит в этот мир, чтобы исправить себя.<\/p>", "<p>Именно в этом мире определяется его духовная ступень в Мире грядущем.<\/p>", "<p>От чего зависит эта ступень?<\/p>", "<p>От того, как человек прожил свою жизнь, как он реагировал на происходящее и каким человеком стал.<\/p>", "<p>Хафец Хаим объясняет, что положение человека в Будущем мире определяется тем, как он принимал всё, что происходило с ним в этом мире.<\/p>", "<p>Чем спокойнее, доброжелательнее и с большей верой человек принимал жизненные события, понимая, что всё находится под личным Провидением Всевышнего и совершается ради его блага, тем выше будет его духовная ступень в Мире грядущем.<\/p>", "<p>Чем меньше человек принимает происходящее с верой, тем ниже будет его духовная ступень. Даже если он соблюдает Тору и заповеди, даже если изучает Тору день и ночь, но когда с ним происходит испытание, он не принимает его с любовью, не верит, что оно пришло от Всевышнего и ради добра, а начинает возмущаться, сердиться и негодовать, — его место в Будущем мире будет ниже.<\/p>", "<p>Следует знать, что человек, выдержавший испытание гневом и обидой, не только приобретает свой удел в Будущем мире, но получает особые дары уже в этом мире.<\/p>", "<p>Тот, кто преодолевает такие испытания, духовно возвышается уже при жизни.<\/p>", "<p>Известен случай с царём Давидом, когда Шими бен Гера тяжело оскорбил и проклял его. По закону Шими заслуживал смертной казни как мятежник против царской власти. Он глубоко унизил Давида перед всеми.<\/p>", "<p>Тем не менее, когда слуги и военачальники Давида захотели наказать Шими, Давид запретил им это и сказал:<\/p>", "<p>«Господь повелел ему проклинать.»<br>(Шмуэль II 16:10)<\/p>", "<p>Давид всем сердцем верил, что всё произошло по воле Всевышнего. Он понимал, что Шими — лишь орудие в руках Бога, и что всё это совершается ради добра, ведь «всё, что делает Милосердный, Он делает к добру».<\/p>", "<p>Что же он получил за такую веру?<\/p>", "<p>Не только награду в Будущем мире.<\/p>", "<p>Уже в этом мире Всевышний удостоил Давида величайшей чести — он стал четвёртой опорой Божественной Колесницы (Меркавы), вместе с Авраамом, Ицхаком и Яаковом.<\/p>", "<p>Как будто Всевышний сказал ему:<\/p>", "<p>«Ты выдержал испытание и принял всё с любовью, поэтому теперь удостаиваешься стать четвёртой опорой Моей Колесницы.»<\/p>", "<p>Мы видим, что человек, выдержавший испытание, получает награду уже в этом мире и достигает очень высоких духовных ступеней.<\/p>", "<h3>Рассказ о благословении<\/h3>", "<p>Мы слышали историю об одном молодом человеке (аврехе), который жил в Бней-Браке. Семнадцать лет он с женой не мог иметь детей.<\/p>", "<p>Он много раз приходил к раву Хаиму Каневскому, прося благословения на рождение ребёнка.<\/p>", "<p>Когда прошло семнадцать лет, он снова пришёл к раву и сказал:<\/p>", "<p>— Рабби, у нас больше нет сил. Мы просим благословения, но такого, которое обязательно исполнится.<\/p>", "<p>Он говорил это со слезами.<\/p>", "<p>Рав Хаим ответил:<\/p>", "<p>— Знай, что я не могу отменить это Небесное постановление. Оно очень тяжёлое.<\/p>", "<p>Но я могу дать вам совет.<\/p>", "<p>Найдите человека, которого публично оскорбили, а он промолчал, не рассердился, не обиделся и не ответил обидой.<\/p>", "<p>Попросите именно такого человека благословить вас на детей.<\/p>", "<p>Через его благословение вы сможете удостоиться потомства.<\/p>", "<p>Аврех стал искать такого человека. Он ходил по синагогам, посещал свадьбы и другие торжества.<\/p>", "<p>Однажды во время свадебной церемонии один человек начал громко оскорблять раввина, которому не понравилось, как тот проводил хупу и кидушин.<\/p>", "<p>Аврех быстро подошёл к раввину и попросил:<\/p>", "<p>— Пожалуйста, не отвечайте ему. У меня есть очень важная причина. Потом я всё объясню. Прошу вас — не отвечайте.<\/p>", "<p>Раввин сказал:<\/p>", "<p>— Хорошо. Я и не собирался отвечать.<\/p>", "<p>После свадьбы аврех подошёл к нему и рассказал всё, что сказал рав Хаим Каневский.<\/p>", "<p>Он попросил:<\/p>", "<p>— Благословите меня, чтобы у нас родился ребёнок.<\/p>", "<p>Раввин от всего сердца благословил его:<\/p>", "<p>— Пусть Всевышний дарует вам сыновей и внуков.<\/p>", "<p>Через некоторое время у этой семьи действительно родился сын.<\/p>", "<p>Из этой истории мы видим, какую огромную духовную силу приобретает человек, который переносит унижение молча и с любовью.<\/p>", "<p>Даже рав Хаим Каневский, величайший мудрец Торы, сказал, что в данном случае именно благословение такого человека обладает особой силой отменить суровый небесный приговор.<\/p>", "<p>Отсюда мы понимаем, каких высот достигает человек, исправляющий свои качества характера.<\/p>", "<p>Как уже говорилось, исправление качеств начинается с простой, искренней веры:<\/p>", "<p>Всевышний управляет миром посредством личного Провидения.<\/p>", "<p>Никто не способен причинить мне зло без Его воли.<\/p>", "<p>И никто не способен сделать мне добро без Его воли.<\/p>", "<p>Нам обещано, что всё происходящее — к добру.<\/p>", "<p>Если мы будем жить этой верой каждый день, то сможем изменить свой характер.<\/p>", "<p>Рабби Нахман из Бреслава говорил:<\/p>", "<p>«Человек может жить в этом мире так, словно он уже находится в Мире грядущем.»<\/p>", "<p>Кто не хочет быть счастливым уже сейчас?<\/p>", "<p>Кто не хотел бы ощущать рай уже в этой жизни?<\/p>", "<p>Рабби Нахман объясняет, что единственный путь к этому — глубоко усвоить сердцем, что всё, что делает Всевышний, — к добру.<\/p>", "<p>Даже если сейчас человек не видит этого добра, оно обязательно существует.<\/p>", "<p>Так обещали наши мудрецы, так обещал Сам Всевышний.<\/p>", "<p>Если человек будет постоянно жить с этой верой, он начнёт видеть добро во всём происходящем.<\/p>", "<p>Тогда уже здесь, в этом мире, он будет жить подобно тому, кто находится в Ган Эдене.<\/p>", "<p>Особенно это важно для мира в семье.<\/p>", "<p>Только так можно построить настоящий шалом-байт и исправить свои качества характера.<\/p>", "<p>Обычно, говоря о гневе, люди слышат:<\/p>", "<p>«Гнев — это страшный грех. Он оскверняет человека. Он подобен идолопоклонству. Поэтому просто сдерживайся.»<\/p>", "<p>Но из всего сказанного следует иной подход.<\/p>", "<p>Испытание гневом посылается человеку для того, чтобы возвысить его.<\/p>", "<p>Поэтому речь идёт не просто о том, чтобы сдержаться.<\/p>", "<p>Наоборот, следует радоваться, что Всевышний доверил нам такое испытание.<\/p>", "<p>Именно испытание возвышает человека.<\/p>", "<p>Если бы испытаний не было, у нас не было бы возможности духовно вырасти.<\/p>", "<p>Когда приходит испытание, это становится особым благоприятным моментом.<\/p>", "<p>Если человек принимает его с любовью, это становится временем особой близости к Всевышнему.<\/p>", "<p>В этот момент особенно важно молиться — за себя, за весь народ Израиля, благодарить Всевышнего за возможность духовного роста.<\/p>", "<p>Это можно сравнить с двумя людьми, пришедшими устраиваться на работу.<\/p>", "<p>Первого после короткого собеседования сразу отправили домой, сказав, что он не подходит.<\/p>", "<p>Второму предложили:<\/p>", "<p>— Поработай месяц на испытательном сроке. Посмотрим, подходишь ли ты нам.<\/p>", "<p>Чьё положение лучше?<\/p>", "<p>Конечно, второго.<\/p>", "<p>У него есть шанс получить работу.<\/p>", "<p>У первого такого шанса уже нет.<\/p>", "<p>Так же и в духовной жизни.<\/p>", "<p>Если человеку посылают испытание, значит, Небеса хотят приблизить его и поднять на более высокий уровень.<\/p>", "<p>Именно поэтому ему и посылают испытания.<\/p>", "<p>Если человек смотрит на них таким образом, он не только перестаёт сердиться, но даже радуется:<\/p>", "<p>«Всевышний желает моего духовного роста. Значит, Он доверяет мне это испытание.»<\/p>", "<p>Это и есть настоящее лекарство от дурных качеств характера — главного препятствия на пути к миру и согласию, особенно в семье.<\/p>", "<p>С посторонними людьми человеку обычно легко ладить.<\/p>", "<p>Настоящее испытание начинается дома.<\/p>", "<p>Именно дома человеку кажется, что он всё контролирует, что жена и дети должны поступать так, как он хочет.<\/p>", "<p>Именно там возникает желание сердиться по любому поводу.<\/p>", "<p>Поэтому дом — главное место, где человек должен изменить своё мировоззрение и смотреть на всё глазами веры.<\/p>", "<p>Дома необходимо искать добро, а не недостатки.<\/p>", "<p>Даже если произошло что-то неприятное, следует сказать себе:<\/p>", "<p>«Это не моя жена сделала мне зло. Это испытание, которое послал мне Всевышний, чтобы проверить, смогу ли я выдержать его.»<\/p>", "<p>И тогда вместо раздражения человек сможет сказать:<\/p>", "<p>«Я благодарен Всевышнему за эту возможность стать лучше.»<\/p>", "<p>Если мы будем постоянно повторять эти мысли и глубоко внедрять их в своё сердце, наша жизнь действительно изменится к лучшему.<\/p>", "<p>Нужно понимать, что одного урока недостаточно.<\/p>", "<p>Исправление характера не происходит нажатием кнопки.<\/p>", "<p>Сегодня человек может принять решение быть терпеливым и спокойным, а завтра снова вспылить.<\/p>", "<p>Поэтому эта работа продолжается каждый день.<\/p>", "<p>Ежедневно необходимо выделять несколько минут, чтобы спокойно размышлять:<\/p>", "<p>«Всё находится под личным Провидением Всевышнего. Всё, что происходит, совершается ради моего блага. Мне не нужно сердиться и обижаться. Я хочу жить с верой и радостью. Даже если сейчас мне кажется, что происходящее плохо, на самом деле это — высшее благо. Всё, что делает Милосердный, Он делает к добру.»<\/p>", "<p>В книге «Песнь творения» (Шират ха-Брия) говорится, что каждое создание — птица, зверь и даже скорпион — воспевает Всевышнего своей особой песней.<\/p>", "<p>О скорпионе сказано, что он произносит слова из Теилим:<\/p>", "<p>«Благ Господь ко всем, и милосердие Его распространяется на все Его творения.» (Теилим 145:9)<\/p>", "<p>Эти слова напоминают человеку, что Божественная доброта охватывает всё творение, даже если иногда её невозможно увидеть сразу.<\/p>", "<p>Почему скорпион поёт именно эту песнь?<\/p>", "<p>Потому что предназначение больших скорпионов — лишать людей жизни. Если человеку свыше вынесен приговор о смерти, посылают скорпиона, и скорпион умерщвляет этого человека.<\/p>", "<p>И вот однажды скорпион приходит ко Всевышнему и говорит:<\/p>", "<p>«Владыка мира! Я не могу выполнять такую работу. Бывает, что это совсем молодой человек, семейный человек, и однажды среди белого дня я должен пойти и лишить его жизни. Я не могу с этим справиться. Я хочу сменить своё предназначение.»<\/p>", "<p>Всевышний отвечает ему:<\/p>", "<p>«Твоё предназначение Я менять не буду. Но Я готов сделать для тебя другое: с этого дня ты будешь знать и понимать причину того действия, которое тебе предстоит совершить.»<\/p>", "<p>Поскольку скорпион знает причину того, почему он идёт лишить человека жизни, он начинает воспевать слова:<\/p>", "<p>«Благ Господь ко всем, и милосердие Его — на всех творениях Его.»<br>(Теилим 145:9)<\/p>", "<p>Потому что теперь он понимает и видит, сколько милости и сколько добра заключено в происходящем.<\/p>", "<p>С точки зрения человека из плоти и крови это кажется нам плохим. Нам кажется трагедией, что этот несчастный человек, отец семьи, умер в расцвете своих лет.<\/p>", "<p>Но Всевышний знает все мысли и всё, что скрыто от человека. Поэтому Он знает, что в каждом Своём действии содержатся только добро и милосердие.<\/p>", "<p>Талмуд говорит, что в этом мире, когда человек слышит добрую весть, он произносит благословение:<\/p>", "<p>«Благословен Ты… Добрый и Творящий добро» (ha-Tov ve-ha-Metiv).<\/p>", "<p>А когда, не дай Бог, он слышит печальную весть, он произносит благословение:<\/p>", "<p>«Благословен Ты… Судья истинный» (Барух Даян ха-Эмет).<\/p>", "<p>В течение этих лет существует очень большая вероятность оступиться и согрешить.<\/p>", "<p>Да, на этот раз Йосеф сумел преодолеть своё дурное побуждение (йецер hа-ра). Но впереди ещё долгие годы испытаний. Кто знает, удастся ли ему и дальше побеждать свои желания и не согрешить?<\/p>", "<p>А если он согрешит, то потеряет всё: и этот мир, и Будущий мир. Он потеряет царское величие — потеряет всё.<\/p>", "<p>Именно поэтому Небеса оказывают ему великую милость: помещают его в темницу, где он находится под постоянной охраной. Всё это делается только для того, чтобы он не оступился.<\/p>", "<p>Если бы Йосеф-праведник сам попросил:<\/p>", "<p>«Владыка мира! Впереди у меня ещё много лет испытаний. Кто знает, может быть, не дай Бог, я когда-нибудь оступлюсь. Прошу Тебя, помести меня в темницу»,<\/p>", "<p>— скорее всего, его просьба не была бы принята.<\/p>", "<p>Ему бы сказали:<\/p>", "<p>«Почему? Ты должен жить в Египте, сталкиваться с испытаниями и не согрешить.»<\/p>", "<p>Но теперь, после того как он выдержал столь тяжёлое испытание, он заслужил награду.<\/p>", "<p>И в чём состоит эта награда?<\/p>", "<p>В том, что Небеса охраняют его.<\/p>", "<p>Мы, люди, смотрим на это как на тяжёлое наказание: целый год провести в тёмной темнице — кажется ужасным.<\/p>", "<p>Но на Небесах смотрят на это совершенно иначе.<\/p>", "<p>Там это считается огромной наградой, дарованной Йосефу.<\/p>", "<p>Благодаря этому ему было обеспечено как приобретение Будущего мира, так и благословение в этом мире.<\/p>", "<p>Именно благодаря этому Йосеф впоследствии достиг царского величия, а его имя навеки осталось Йосефом Праведником (Йосеф hа-Цадик).<\/p>", "<p>Такова его награда.<\/p>", "<p>Таков взгляд Небес на происходящее.<\/p>", "<p>Во всём, что делает Всевышний, заключено огромное милосердие, великая доброта и благо.<\/p>", "<p>Наша задача — искренне и полностью верить, что всё происходящее — к добру, что всё совершается под личным Провидением Всевышнего.<\/p>", "<p>Если, с Божьей помощью, мы глубоко усвоим это, то сможем исправить свои дурные качества и исполнять заповеди Торы.<\/p>", "<p>Есть заповеди, которые на первый взгляд кажутся непонятными.<\/p>", "<p>Например, заповеди:<\/p>", "<p>«Не мсти и не храни обиды»<br>(Ваикра 19:18).<\/p>", "<p>Допустим, я попросил человека оказать мне услугу. Он мог это сделать, но не захотел.<\/p>", "<p>На следующий день он сам приходит ко мне и просит оказать ему такую же услугу.<\/p>", "<p>Тора повелевает мне:<\/p>", "<p>«Не мсти.»<\/p>", "<p>Это кажется непонятным.<\/p>", "<p>Он ведь не захотел помочь мне. Почему же я должен помочь ему?<\/p>", "<p>Но ещё труднее понять другое.<\/p>", "<p>Тора не только запрещает мстить и велит всё-таки помочь ему.<\/p>", "<p>Она запрещает даже хранить обиду.<\/p>", "<p>То есть не держать этого в сердце.<\/p>", "<p>Как это возможно?<\/p>", "<p>Ведь он не захотел сделать мне добро.<\/p>", "<p>Пусть хотя бы у меня останется неприятное чувство по отношению к нему.<\/p>", "<p>Нет.<\/p>", "<p>Тора запрещает даже смотреть на него с отрицательным отношением.<\/p>", "<p>В чём же логика?<\/p>", "<p>Как мы уже изучили, здесь есть глубокий смысл.<\/p>", "<p>Поскольку всё приходит от Всевышнего.<\/p>", "<p>То, что этот человек не захотел мне помочь или чего-то мне дать, произошло не по его собственной воле.<\/p>", "<p>Так постановил Всевышний Своим личным Провидением.<\/p>", "<p>И более того — мне обещано, что всё это произошло ради моего блага.<\/p>", "<p>Если я действительно верю в это всем сердцем, тогда я способен не мстить.<\/p>", "<p>Потому что это сделал не он — это Всевышний.<\/p>", "<p>И тогда я способен также не хранить обиду.<\/p>", "<p>Потому что это не он.<\/p>", "<p>Это Всевышний управил так посредством Своего Провидения.<\/p>", "<p>Именно таким образом человек может по-настоящему исправлять свои качества характера.<\/p>", "<p>Многие думают, что работу над собой нужно начинать вне дома — среди друзей, знакомых, на работе.<\/p>", "<p>А дом оставить напоследок.<\/p>", "<p>Это серьёзная ошибка.<\/p>", "<p>Основа всех основ — это дом.<\/p>", "<p>Работу над собой нужно начинать именно дома.<\/p>", "<p>Я верю полной верой, что всё — к добру.<\/p>", "<p>Всё происходит под личным Провидением Всевышнего.<\/p>", "<p>Я не превозношусь ни над своей женой, ни над своими детьми.<\/p>", "<p>Я веду себя смиренно.<\/p>", "<p>Работа над добрыми и правильными качествами характера начинается дома.<\/p>", "<p>И лишь затем, с Божьей помощью, распространяется и на отношения с окружающими.<\/p>", "<p>Человек, обладающий хорошими качествами характера, живёт спокойной, мирной и счастливой жиз
