ая при этом считать себя соблюдающими евреями, учениками Торы и аврехами.<\/p>", "<p>Гемара (трактат «Йома», 86б) говорит, что существует четыре уровня искупления грехов.<\/p>", "<p>Если человек нарушил повелительную заповедь и раскаялся, ему прощается сразу же.<\/p>", "<p>Если он нарушил запретительную заповедь, раскаяние приостанавливает наказание, а Йом-Кипур приносит искупление.<\/p>", "<p>Если же человек совершил грех, за который полагается карет (духовное отсечение) или смертная казнь по решению суда, то раскаяние и Йом-Кипур лишь приостанавливают наказание, а окончательное искупление приходит через страдания.<\/p>", "<p>Однако если в совершённом грехе присутствовало осквернение Имени Всевышнего (хилуль а-Шем), то даже раскаяние, Йом-Кипур и страдания лишь отсрочивают наказание, а полное искупление наступает только после смерти.<\/p>", "<p>Отсюда видно, что осквернение Имени Всевышнего является одним из самых тяжких грехов в Торе.<\/p>", "<p>Посмотрите, насколько страшна беспричинная ненависть.<\/p>", "<p>Первый Храм был разрушен из-за трёх самых тяжких грехов: идолопоклонства, разврата и кровопролития. Несмотря на это, спустя семьдесят лет он был вновь построен.<\/p>", "<p>Второй же Храм был разрушен из-за беспричинной ненависти, и вот уже почти две тысячи лет он всё ещё не восстановлен.<\/p>", "<p>Насколько тяжек грех злословия (лашон hара)?<\/p>", "<p>Об этом подробно писал великий учитель Хафец Хаим, благословенной памяти, особенно в своей книге «Шмират а-Лашон», где он широко приводит многочисленные высказывания наших мудрецов о тяжести этого греха.<\/p>", "<p>Изучайте эти слова и извлекайте из них урок.<\/p>", "<p>Дорогие братья!<\/p>", "<p>Мы собственными глазами видели людей, которые из-за небольшого участка земли были готовы начать раздор, совершить явное осквернение Имени Всевышнего, посеять беспричинную ненависть и нарушить запреты злословия.<\/p>", "<p>Кто дал им право поступать так?<\/p>", "<p>Человек может возразить:<\/p>", "<p>«Но если я не поступлю так, то не смогу добиться того, чего хочу».<\/p>", "<p>Мы ответим ему:<\/p>", "<p>Что это за довод?<\/p>", "<p>Если бы вам сказали, что достичь своей цели можно только нарушив субботу, согласились бы вы осквернить Шаббат ради достижения желаемого?<\/p>", "<p>Конечно же, нет.<\/p>", "<p>Ведь известно, что грех осквернения Имени Всевышнего (хилуль а-Шем) считается даже более тяжким, чем нарушение субботы.<\/p>", "<p>Или представьте, что человеку сказали бы:<\/p>", "<p>«Съешь свинину — и тогда получишь то, чего хочешь».<\/p>", "<p>Этот грех является запретом Торы, но не относится к преступлениям, за которые полагаются карет или смертная казнь по решению суда.<\/p>", "<p>Разве человек согласился бы есть свинину?<\/p>", "<p>Безусловно, нет.<\/p>", "<p>Так кто же разрешил вам совершать столько тяжких грехов, каждый из которых способен лишить человека как этого мира, так и Мира Грядущего?<\/p>", "<p>Неужели ради достижения своих целей вы готовы переступить через всё это?<\/p>", "<p>Тогда человек может спросить:<\/p>", "<p>«Так что же, мне всегда нужно уступать? Разве я не имею права требовать то, что мне принадлежит?»<\/p>", "<p>Ответ таков:<\/p>", "<p>Конечно, вы имеете право требовать и добиваться того, что принадлежит вам по закону.<\/p>", "<p>Но ради этого нельзя совершать грехи.<\/p>", "<p>Точно так же, как вы не станете есть свинину ради достижения своей цели, нельзя ради неё становиться причиной раздора, осквернения Имени Всевышнего и других грехов, о которых говорилось выше.<\/p>", "<p>Если же вам кажется, что иначе вы вообще ничего не получите, тогда остаётся только отказаться от желаемого.<\/p>", "<p>Ведь Талмуд учит, что человек обязан потерять всё своё имущество, но не совершить даже самого лёгкого запрета. Тем более нельзя ради материальной выгоды совершать все те тяжёлые грехи, которые были перечислены.<\/p>", "<p>К сожалению, сегодня многие люди словно забыли о запретах, связанных с раздорами и осквернением Имени Всевышнего, как будто этих запретов вовсе не существует.<\/p>", "<p>Мы обращаемся ко всему народу Израиля.<\/p>", "<p>Куда бы мы ни посмотрели, мы своими глазами видим, сколько тяжёлых бед постигло наш народ: сколько сирот и вдов, сколько тяжёлых болезней, не дай Бог; сколько еврейских семей разрушено; сколько молодых людей сходят с правильного пути.<\/p>", "<p>О таких случаях сказано в Талмуде (Брахот 7б), что дурной путь собственного ребёнка тяжелее для человека, чем война Гога и Магога.<\/p>", "<p>И это далеко не всё.<\/p>", "<p>Все эти бедствия происходят из-за беспричинной ненависти и раздоров, когда из-за любого пустяка люди готовы сразу же вступить в ссору и конфликт.<\/p>", "<p>А затем они спрашивают:<\/p>", "<p>«Почему мой сын не хочет учиться? Почему он не слушается меня? Почему он не уважает меня?»<\/p>", "<p>Но уважаете ли вы сами своего Отца Небесного?<\/p>", "<p>Готовы ли вы отказаться от своих притязаний ради чести Всевышнего?<\/p>", "<p>Стараетесь ли вы не причинять страданий Святой Шхине своими поступками?<\/p>", "<p>Человек должен понимать: если он остерегается перечисленных грехов, то делает это прежде всего ради самого себя, приобретая тем самым вечную жизнь.<\/p>", "<p>Представьте себе:<\/p>", "<p>Неужели человек, который уступает лишь для того, чтобы не причинить страданий Божественному Присутствию, может что-либо потерять?<\/p>", "<p>Ведь весь мир принадлежит Всевышнему.<\/p>", "<p>Если вы отказались от чего-либо ради Его славы, разве Он, да будет благословенно Его Имя, лишит вас заслуженной награды?<\/p>", "<p>Да не будет такого!<\/p>", "<p>На что это похоже?<\/p>", "<p>Представьте двух маленьких братьев, которые спорят из-за банкноты в сто шекелей. Каждый утверждает, что деньги принадлежат ему.<\/p>", "<p>Отец находится в соседней комнате и слышит, как один из сыновей говорит брату:<\/p>", "<p>«Хотя я уверен, что правда на моей стороне, но ради того, чтобы не огорчать папу и не причинять ему боль, я уступаю тебе.»<\/p>", "<p>Услышав такие слова, отец испытывает огромную радость.<\/p>", "<p>Разве он не сделает для такого сына всё, что в его силах?<\/p>", "<p>Тем более если отец богат — он вознаградит сына во много раз больше стоимости этих ста шекелей.<\/p>", "<p>То же самое относится и к нашей теме.<\/p>", "<p>Представьте, что происходит, когда мы уступаем ради чести Всевышнего.<\/p>", "<p>Ведь вся наша жизнь — здоровье, пропитание, дети и всё остальное — находится в Его руках.<\/p>", "<p>Он Всемогущ.<\/p>", "<p>Насколько же щедро Всевышний одарит человека, который оказывает почтение Его Святому Присутствию!<\/p>", "<p>Обычный земной отец может подарить своему сыну лишь деньги или какие-то материальные вещи.<\/p>", "<p>Но он не способен добавить ему жизни, здоровья, семейного мира или успеха в воспитании детей.<\/p>", "<p>У Всевышнего же всё находится в Его власти.<\/p>", "<p>Поэтому мы должны радоваться тому, что нам предоставляется возможность уступить ради настоящего мира и согласия.<\/p>", "<p>Почему именно Аарон-первосвященник был избран благословлять народ Израиля?<\/p>", "<p>Потому что он «любил мир и стремился к миру».<\/p>", "<p>Из этого мы видим, что человек, который стремится к миру, становится достойным всех благословений.<\/p>", "<p>Талмуд (трактат «Рош а-Шана», 17а) рассказывает о раве Гуне. Когда приблизилось время его ухода из этого мира, рав Папа пришёл навестить его.<\/p>", "<p>Когда рав Папа увидел, в каком тяжёлом состоянии находится рав Гуна, он сказал домочадцам:<\/p>", "<p>«Приготовьте ему всё необходимое в дорогу».<\/p>", "<p>Под «дорогой» он имел в виду путь в иной мир, а необходимым для умершего являются погребальные саваны.<\/p>", "<p>Однако в конце концов рав Гуна выздоровел.<\/p>", "<p>После этого рав Папа стеснялся встречаться с ним.<\/p>", "<p>Но рав Гуна сказал ему:<\/p>", "<p>«У тебя нет никакой причины стыдиться. Действительно, в тот момент на Небесах уже был вынесен приговор о моей смерти. Однако Сам Святой, благословен Он, вмешался и сказал: &quot;Оставьте его. Поскольку он не стоит на своём и умеет уступать, не судите его строго&quot;.»<\/p>", "<p>Об этом сказано в Писании:<\/p>", "<p>«Прощающий беззаконие и проходящий мимо проступка...» (Миха 7:18).<\/p>", "<p>Мудрецы объясняют:<\/p>", "<p>«Кому Он прощает грех? Тому, кто сам умеет проходить мимо обид и прощать других.»<\/p>", "<p>Если человек умеет уступать, то и Небеса не судят его со всей строгостью.<\/p>", "<p>Что приобрёл благодаря этому рав Гуна?<\/p>", "<p>Саму жизнь.<\/p>", "<p>Люди готовы платить сотни тысяч долларов, чтобы отправиться за границу в надежде, что, возможно, там они смогут исцелиться и продлить свою жизнь.<\/p>", "<p>А Талмуд продолжает и говорит:<\/p>", "<p>«Каждому, кто умеет не держаться за свои обиды и уступать, прощаются все его грехи.»<\/p>", "<p>Если человек был кем-то обижен, но сумел простить и отказаться от чувства обиды, ему прощаются все его прегрешения.<\/p>", "<p>Талмуд (Шаббат 55а) говорит, что не бывает страданий без греха.<\/p>", "<p>Следовательно, если человеку прощаются его грехи, он избавляется и от многих страданий.<\/p>", "<p>В трактате «Брахот» (60а) рассказывается о Гиллеле Старшем.<\/p>", "<p>Однажды, когда он шёл по дороге, он услышал в городе крики.<\/p>", "<p>Он сказал:<\/p>", "<p>«Я уверен, что это не происходит в моём доме.»<\/p>", "<p>О нём сказано в Писании:<\/p>", "<p>«Не убоится дурной вести; сердце его твердо, уповая на Господа» (Псалмы 112:7).<\/p>", "<p>Возникает вопрос:<\/p>", "<p>Как Гиллель мог сказать такое?<\/p>", "<p>Разве мы не видели великих праведников, в чьих домах, не дай Бог, случались несчастья?<\/p>", "<p>Ответ заключается в том, что, как известно, Гиллель отличался необыкновенной уступчивостью и умением прощать.<\/p>", "<p>Об этом рассказывается в трактате «Шаббат» (31а).<\/p>", "<p>Мы уже узнали, что тому, кто умеет уступать, прощаются все его грехи.<\/p>", "<p>Мы также знаем, что страдания приходят лишь из-за грехов.<\/p>", "<p>Следовательно, если Гиллель своим умением прощать заслужил искупление всех своих грехов, то у него не было причин ожидать страданий.<\/p>", "<p>Теперь становится понятным, почему он был настолько уверен, что услышанные им крики не доносились из его собственного дома.<\/p>", "<p>После всего, что мы увидели и изучили о тяжести греха раздора и о том, что он приводит ко многим другим тяжёлым грехам — беспричинной ненависти, осквернению Имени Всевышнего и злословию (лашон hара), — мы должны содрогаться уже при первых признаках любого конфликта или вовлечения в него.<\/p>", "<p>От раздора следует бежать так же, как бегут от огня, не давая ему ни малейшей возможности укорениться.<\/p>", "<p>Мы также узнали, насколько велика ценность качества уступчивости.<\/p>", "<p>Благодаря ему человек приобретает для себя благословение как в этом мире, так и в Мире Грядущем.<\/p>", "<p>Во многом именно от этого зависит его вечная судьба.<\/p>", "<p>В книге «Эц ха-Хаим» (напечатанной в конце книги «Сефер ха-Хаим», стр. 434) приводятся слова Виленского Гаона:<\/p>", "<p>«Главный труд человека должен быть направлен на соблюдение заповедей, регулирующих отношения между человеком и его ближним, во всех их тонкостях.»<\/p>", "<p>Однажды Хазон Иша спросили:<\/p>", "<p>«Какой наивысшей духовной ступени может достичь человек в этом мире?»<\/p>", "<p>Он ответил:<\/p>", "<p>«Пройти через самый многолюдный рынок, не задев и не обидев ни одного человека.»<\/p>", "<p>(Приводится в книге «Маасе Иш», т. 2, стр. 166.)<\/p>"]}, {"number": 22, "title": "Любовь к народу Израиля", "body": ["<p>Тора говорит:<\/p>", "<p>«Люби ближнего своего, как самого себя» (Левит 19:18).<\/p>", "<p>О этом заповеди рабби Акива сказал:<\/p>", "<p>«Это — великий принцип Торы.»<\/p>", "<p>Далее мы увидим, что почти всё наше служение Всевышнему зависит от исполнения этой заповеди. Стараясь выполнять её, человек приносит себе вечное благо — как в этом мире, так и в Мире Грядущем.<\/p>", "<p>Талмуд (Йевамот 62б) рассказывает о двадцати четырёх тысячах учеников рабби Акивы, которые умерли в период между Песахом и Шавуотом, потому что не проявляли должного уважения друг к другу.<\/p>", "<p>Не сказано, что они открыто оскорбляли друг друга или унижали своими поступками.<\/p>", "<p>Сказано лишь, что они не оказывали друг другу должного уважения.<\/p>", "<p>Иными словами, каждый из них не почитал своего товарища в той мере, которая соответствовала его достоинству.<\/p>", "<p>О ком идёт речь?<\/p>", "<p>О величайших мудрецах поколения — святых танаях, исполинах Торы, учениках самого рабби Акивы.<\/p>", "<p>Сколько Торы они изучили! Насколько велики были их духовные достижения и служение Всевышнему!<\/p>", "<p>И всё же из-за того, что они не относились друг к другу с должным уважением, Небесный суд постиг их с такой страшной строгостью.<\/p>", "<p>Из этого мы учимся, насколько тяжело в глазах Небес отсутствие любви и уважения к каждому еврею.<\/p>", "<p>Святой Ари писал, что перед молитвой человек должен сказать:<\/p>", "<p>«Я принимаю на себя заповедь любить каждого из народа Израиля...»<\/p>", "<p>Задумаемся: какая связь существует между любовью к Израилю и молитвой, что Ари связывает одно с другим?<\/p>", "<p>Объяснение заключается в следующем.<\/p>", "<p>Все евреи являются детьми Всевышнего.<\/p>", "<p>Чем сильнее мы любим Его детей, тем больше Всевышний любит нас и тем охотнее принимает наши молитвы.<\/p>", "<p>Это можно сравнить с человеком, который обращается с просьбой к очень богатому и влиятельному человеку.<\/p>", "<p>Чем больше он любит детей этого человека, заботится о них и относится к ним с теплотой, тем охотнее их отец исполнит его просьбу.<\/p>", "<p>Если же есть хотя бы один из его детей, которого он не любит, это может стать препятствием для исполнения его просьбы.<\/p>", "<p>Один из хасидов Стретинского ребе однажды спросил его:<\/p>", "<p>— Рабби, как мне исполнять заповедь любви к Всевышнему самым совершенным образом?<\/p>", "<p>Ребе ответил:<\/p>", "<p>— Если хочешь по-настоящему исполнить заповедь любви к Всевышнему, делай это через любовь к народу Израиля. Именно этот путь приводит к истинной любви к Богу.<\/p>", "<p>В книге «Тана де-вей Элиягу» сказано, что Всевышний обращается к Израилю со словами:<\/p>", "<p>«Разве Мне чего-либо недостаёт от вас? Всё, чего Я прошу, — чтобы вы любили друг друга и уважали друг друга.»<\/p>", "<p>Рамхаль пишет в книге «Месилат Йешарим» (глава 19):<\/p>", "<p>«Святой, благословен Он, любит лишь того, кто любит Израиль. И чем больше человек увеличивает свою любовь к Израилю, тем больше Всевышний увеличивает Свою любовь к нему.<\/p>", "<p>Именно таковы истинные пастыри Израиля, которых Всевышний особенно любит: они жертвуют собой ради Его народа, заботятся о его благополучии всеми возможными способами, всегда стоят на страже, молятся за него, отменяют суровые небесные приговоры и открывают для него врата благословения.<\/p>", "<p>Это подобно отцу, который никого не любит больше, чем того, кого видит искренне любящим своих детей. Так свидетельствует сама человеческая природа.»<\/p>", "<p>Каждый человек хотел бы быть особенно любимым и близким к очень богатому человеку.<\/p>", "<p>Под его покровительством человек чувствует себя защищённым: ему кажется, что он ни в чём не будет нуждаться, ведь этот богатый человек любит его и особенно приближает к себе.<\/p>", "<p>Он уверен, что такой покровитель не позволит ему оказаться в беде.<\/p>", "<p>И он понимает, что любовь этого богатого человека напрямую зависит от того, насколько он сам любит его детей.<\/p>", "<p>Чем сильнее он любит их, тем больше становится любовь их отца к нему.<\/p>", "<p>Поэтому такой человек будет ежедневно прилагать большие усилия, чтобы проявлять любовь и заботу о детях этого богача.<\/p>", "<p>И даже если они чем-то его обидят или поведут себя с ним неподобающим образом, он сразу же простит их и уступит.<\/p>", "<p>Ведь кто настолько неразумен, чтобы добровольно лишиться любви и близости столь влиятельного человека?<\/p>", "<p>Но давайте задумаемся.<\/p>", "<p>Даже самый богатый человек способен помочь лишь деньгами.<\/p>", "<p>Он не может подарить человеку хотя бы одну дополнительную секунду жизни.<\/p>", "<p>Он не способен гарантировать здоровье, успех в воспитании детей, мир в семье и многое другое.<\/p>", "<p>И всё же люди готовы прилагать столько усилий ради любви к его детям.<\/p>", "<p>Тем более это относится ко Всевышнему, в Чьих руках находится всё: пропитание, жизнь, здоровье и всё остальное. Всё принадлежит Святому, благословен Он. И если Он пожелает дать человеку благо, то способен дать несравнимо больше, чем кто-либо другой.<\/p>", "<p>И, безусловно, тот, кто более любим Всевышним, удостоится от Него большего благословения.<\/p>", "<p>Но от чего зависит любовь Всевышнего к нам?<\/p>", "<p>Рамхаль раскрывает это в книге «Месилат Йешарим»: условием любви Всевышнего к человеку является любовь к народу Израиля.<\/p>", "<p>И чем больше мы любим евреев, тем больше возрастает любовь Творца к нам.<\/p>", "<p>Поэтому мы должны всеми силами стремиться искренне любить каждого человека, а не только тех, кто хорошо относится к нам.<\/p>", "<p>Есть люди, которые говорят:<\/p>", "<p>«Кто добр ко мне, к тому и я добр.»<\/p>", "<p>Но что в этом особенного?<\/p>", "<p>Разве в этом есть какая-то мудрость?<\/p>", "<p>Даже маленький ребёнок ведёт себя так же.<\/p>", "<p>Младенец улыбается тому, кто проявляет к нему тепло и любовь, и плачет при виде того, кто кажется ему угрожающим.<\/p>", "<p>Так же ведёт себя и нееврей: если к нему относятся с уважением, он отвечает вежливостью; если же его унижают, проявляется его истинная реакция.<\/p>", "<p>То же самое можно увидеть и у животных.<\/p>", "<p>Собака не лает на того, кто кажется ей дружелюбным, но если чувствует угрозу, начинает яростно лаять.<\/p>", "<p>Так чем же ты отличаешься?<\/p>", "<p>Ты был сотворён евреем, избран быть сыном Царя царей — Святого, благословен Он, а твоя душа происходит из-под Престола Славы.<\/p>", "<p>Если ты с горячностью утверждаешь:<\/p>", "<p>«Кто хорошо относится ко мне, к тому и я хорошо отношусь»,<\/p>", "<p>то чем ты отличаешься от всех тех, кого мы только что перечислили?<\/p>", "<p>Где же здесь проявляется твоя работа над собой, твоё служение Всевышнему в отношениях между человеком и ближним, твоя любовь к Израилю?<\/p>", "<p>Каждому вдумчивому человеку ясно, что по-настоящему любящим Израиль можно назвать лишь того, кто умеет любить именно тех людей, которые относятся к нему не так, как следовало бы.<\/p>", "<p>Тех, кто ведёт себя по отношению к нему невежливо или несправедливо.<\/p>", "<p>И несмотря на это, он умеет преодолеть своё чувство обиды, жить с ними в мире, любить их и уступать им.<\/p>", "<p>Вот что называется настоящей любовью к Израилю.<\/p>", "<p>Мудрый человек будет прилагать все усилия, чтобы жить в мире с каждым.<\/p>", "<p>Он не захочет иметь ни одного человека, с которым находится в ссоре или конфликте.<\/p>", "<p>Наши мудрецы сказали (Берешит Рабба, гл. 9):<\/p>", "<p>«Все меры наказания могут быть отменены, но мера &quot;мера за меру&quot; никогда не отменяется.»<\/p>", "<p>А ведь сказано:<\/p>", "<p>«Нет на земле праведника, который делал бы только добро и не согрешил» (Коэлет 7:20).<\/p>", "<p>Каждый день мы просим Всевышнего простить наши грехи.<\/p>", "<p>Но Всевышний, в Своём милосердии, судит человека по принципу «мера за меру».<\/p>", "<p>Если человек живёт в мире с людьми, быстро прощает и не держит обид, то и Всевышний прощает его.<\/p>", "<p>Но если, не дай Бог, человек не желает прощать, упорствует и считает, что только он прав, тогда и на Небесах не спешат простить его грехи.<\/p>", "<p>Талмуд также говорит (Шаббат 127б):<\/p>", "<p>«Того, кто судит своего ближнего благосклонно, и самого судят благосклонно.»<\/p>", "<p>Кто может сказать о себе, что не нуждается в благосклонном Небесном суде?<\/p>", "<p>В книге Зоар (раздел «Бо») объясняется, что если мы оправдываем других и судим их в лучшую сторону, то и нас будут судить так же.<\/p>", "<p>Получается, что этим мы совершаем величайшее вечное благо прежде всего для самих себя.<\/p>", "<p>Мы должны понять одну очень важную истину.<\/p>", "<p>Никогда невозможно достичь мира со всеми людьми и любить каждого без качества уступчивости.<\/p>", "<p>Ведь так же, как лица людей не похожи друг на друга, так и их мнения различны (Брахот 58а).<\/p>", "<p>Всегда будут люди, которые нас обидят, поведут себя не так, как мы ожидали.<\/p>", "<p>Даже если тебе совершенно ясно, что правда полностью на твоей стороне, всё равно именно благодаря умению уступать ты сможешь достичь мира и настоящей любви к Израилю.<\/p>", "<p>Без этого невозможно прийти к подлинному миру со всеми окружающими.<\/p>", "<p>Приобрести это замечательное качество — любовь к Израилю — можно только тогда, когда человек серьёзно работает над собой, развивая смирение и способность уступать.<\/p>", "<p>Именно здесь проверяются истинность твоего еврейства, твоего служения Всевышнему и твоей настоящей работы над своими качествами характера.<\/p>"]}];let index=0;let fontSize=Number(localStorage.getItem('shalom-font')||20);const nav=document.getElementById('nav'),content=document.getElementById('content');document.documentElement.style.setProperty('--fs',fontSize+'px');if(localStorage.getItem('shalom-dark')==='1')document.body.classList.add('dark');
chapters.forEach((c,i)=>{const b=document.createElement('button');b.className='navitem';b.textContent=`Глава ${c.number}. ${c.title}`;b.onclick=()=>show(i);nav.append(b)});
function show(i){index=Math.max(0,Math.min(chapters.length-1,i));const c=chapters[index];document.getElementById('num').textContent='Глава '+c.number;document.getElementById('chapterIndicator').textContent='Глава '+c.number;document.getElementById('title').textContent=c.title;content.innerHTML=c.body.join('');populateSubchapters();document.querySelectorAll('.navitem').forEach((b,j)=>b.classList.toggle('active',j===index));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===chapters.length-1;document.getElementById('sidebar').classList.remove('open');subchapPanel.classList.remove('open');document.getElementById('search').value='';window.scrollTo(0,0);location.hash='chapter-'+c.number}
const subchapToggle=document.getElementById('subchapToggle');
const subchapPanel=document.getElementById('subchapPanel');
function populateSubchapters(){
  subchapPanel.replaceChildren();
  const headings=Array.from(content.querySelectorAll('h3'));
  if(!headings.length){const b=document.createElement('button');b.textContent='Начало главы';b.onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});subchapPanel.classList.remove('open')};subchapPanel.append(b);return;}
  headings.forEach((heading,i)=>{heading.id='subsection-'+index+'-'+i;const b=document.createElement('button');b.textContent=heading.textContent;b.onclick=()=>{subchapPanel.classList.remove('open');heading.scrollIntoView({behavior:'smooth',block:'center'})};subchapPanel.append(b)});
}
subchapToggle.addEventListener('click',()=>subchapPanel.classList.toggle('open'));
document.addEventListener('click',e=>{if(!e.target.closest('.subchap-wrap'))subchapPanel.classList.remove('open')});
document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('larger').onclick=()=>{fontSize=Math.min(32,fontSize+2);document.documentElement.style.setProperty('--fs',fontSize+'px');localStorage.setItem('shalom-font',fontSize)};document.getElementById('smaller').onclick=()=>{fontSize=Math.max(14,fontSize-2);document.documentElement.style.setProperty('--fs',fontSize+'px');localStorage.setItem('shalom-font',fontSize)};document.getElementById('night').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('shalom-dark',document.body.classList.contains('dark')?'1':'0')};
// Search through all chapters, including chapters not currently visible.
const searchBox=document.getElementById('search');
const searchCount=document.getElementById('searchCount');
let matches=[],matchPosition=-1,searchTerm='';
function findMatches(){
  searchTerm=searchBox.value.trim();matches=[];matchPosition=-1;
  if(!searchTerm){searchCount.textContent='';return;}
  const needle=searchTerm.toLocaleLowerCase('ru');
  chapters.forEach((chapter,chapterIndex)=>{
    const temp=document.createElement('div');temp.innerHTML=chapter.body.join('');
    const text=temp.textContent.toLocaleLowerCase('ru');
    let pos=0;
    while((pos=text.indexOf(needle,pos))!==-1){matches.push({chapterIndex,offset:pos});pos+=needle.length;}
  });
  searchCount.textContent=matches.length?`0 / ${matches.length}`:'Не найдено';
}
function highlightChapter(chapterIndex){
  // Use text nodes, never HTML string replacement, to avoid damaging tags.
  if(!searchTerm)return [];
  const needle=searchTerm.toLocaleLowerCase('ru');
  const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  const marks=[];
  nodes.forEach(node=>{
    const txt=node.nodeValue;
    const lower=txt.toLocaleLowerCase('ru');
    if(!lower.includes(needle))return;
    const frag=document.createDocumentFragment();let last=0,pos=0;
    while((pos=lower.indexOf(needle,last))!==-1){
      frag.append(document.createTextNode(txt.slice(last,pos)));
      const mark=document.createElement('mark');mark.textContent=txt.slice(pos,pos+searchTerm.length);
      frag.append(mark);marks.push(mark);last=pos+searchTerm.length;
    }
    frag.append(document.createTextNode(txt.slice(last)));node.replaceWith(frag);
  });
  return marks;
}
function searchNext(){
  if(searchBox.value.trim()!==searchTerm)findMatches();
  if(!matches.length){if(!searchTerm)searchCount.textContent='Введите слово';return;}
  matchPosition=(matchPosition+1)%matches.length;
  const hit=matches[matchPosition];
  if(index!==hit.chapterIndex)show(hit.chapterIndex,true);
  const marks=highlightChapterIfNeeded();
  const chapterHitNumber=matches.slice(0,matchPosition+1).filter(x=>x.chapterIndex===hit.chapterIndex).length-1;
  marks.forEach(m=>m.classList.remove('current-hit'));
  const mark=marks[chapterHitNumber];
  if(mark){mark.classList.add('current-hit');mark.scrollIntoView({behavior:'smooth',block:'center'});}
  searchCount.textContent=`${matchPosition+1} / ${matches.length}`;
}
let highlightedChapter=-1,highlightedTerm='';
function highlightChapterIfNeeded(){
  if(highlightedChapter!==index||highlightedTerm!==searchTerm){
    content.innerHTML=chapters[index].body.join('');populateSubchapters();
    highlightChapter(index);highlightedChapter=index;highlightedTerm=searchTerm;
  }
  return Array.from(content.querySelectorAll('mark'));
}
const originalShow=show;
show=function(i,fromSearch=false){
  originalShow(i);
  highlightedChapter=-1;
  if(fromSearch){searchBox.value=searchTerm;}
  else if(searchTerm){searchBox.value=searchTerm;highlightChapterIfNeeded();}
};
searchBox.addEventListener('input',()=>{findMatches();highlightedChapter=-1;highlightChapterIfNeeded();});
searchBox.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchNext();}});
document.getElementById('searchNext').addEventListener('click',searchNext);
const hash=location.hash.match(/chapter-(\d+)/);show(hash?Number(hash[1])-1:0);

(function(){
 const header=document.querySelector('.top');
 if(!header)return;
 const update=()=>document.documentElement.style.setProperty('--header-height',Math.ceil(header.getBoundingClientRect().height)+'px');
 update();window.addEventListener('resize',update);
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(update).observe(header);
})();
</script></body></html>
