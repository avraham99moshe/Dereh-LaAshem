g>Доколе?..</strong></p><p><strong>Весы (Мознаим), созвездие месяца Тишрей,</strong> склонили чашу суда к обвинению. Поэтому они возносят мольбы, ибо многие предпочли смерть страданиям жизни.</p><p><strong>Скорпион (Акрав), созвездие месяца Хешван,</strong> обитающий в местах, орошаемых росой, содрогнулся от страха и трепета. Ведь Господь обещал нам, что наши потомки будут многочисленны, как капли росы, а теперь Он судит нас мечом и голодом.</p><p><strong>Доколе?..</strong></p><p>Наши глаза проливали слёзы, словно потоки воды и бурные ручьи. Господь больше не являл радугу — знак завета, что не будет нового потопа (символ созвездия <strong>Стрелец (Кешет), месяца Кислев</strong>). Вместо этого на нас обрушились бедствия, захлестнувшие нас, как воды, поднимающиеся выше головы.</p><p><strong>Водолей (Дли), созвездие месяца Шват,</strong> месяца, богатого дождями, стал символом нашей жажды: наши языки прилипли к нёбу от мучительной жажды.</p><p><strong>Доколе?..</strong></p><p>Мы приносили жертвы в Храме, но они более не принимались.</p><p><strong>Козерог (Гди), созвездие месяца Тевет,</strong> напоминает о том, что прекратилось принесение козлов в очистительную жертву.</p><p>Матери варили собственных детей, чтобы утолить голод.</p><p><strong>Рыбы (Дагим), созвездие месяца Адар,</strong> чьи глаза всегда открыты, словно сами стали подобны спящим, не в силах смотреть на гибель и ужас происходящего.</p><p><strong>Доколе?..</strong></p><p>Мы, согрешившие, забыли хранить субботу, и словно Господь забыл все наши добрые дела.</p><p>Да пробудится ради Иерусалима гнев Господа на народы, и да озарит Он его вновь светом Своего Божественного Присутствия, которое некогда пребывало среди многочисленного народа.</p><p>Ты, Господи, помилуешь Сион, как обещал, и восстановишь его, как изрёк.</p><p>Поспеши с их спасением и скорее принеси избавление. Возвратись в Иерусалим по Своему великому милосердию, а не по нашим заслугам.</p><p>Как Ты сказал через Своих пророков: хотя народы причинили великое зло, Израиль возвратится в Иерусалим с милостью, Мой Храм будет вновь построен в нём, а мерная верёвка снова протянется, чтобы измерить стены Иерусалима по их длине и ширине.</p><p>И ещё провозгласит пророк:</p><p><strong>«Так сказал Господь: ещё умножится население городов Иудеи; они будут исполнены всякого блага в будущем Избавлении. Господь вновь утешит Сион и снова изберёт Иерусалим.»</strong></p><p>И ещё сказано:</p><p><strong>Святой, благословен Он, вспомнит Сион и все его опустошённые места. Он восстановит их, как прежде; сделает пустыню подобной Эденскому саду, а опустевшую степь — садом Господним. Тогда вновь будут звучать в ней радость и веселье, благодарственные песнопения и хвала за чудеса и великие деяния Господа.</strong></p>", "subs": []}, {"id": "chapter-6", "title": "Кина 6", "html": "<p class=\"meta\"><strong>Тема:</strong> Разрушение Храма и изгнание в Вавилон.</p><p class=\"meta\"><strong>Форма:</strong> акростих (от буквы <strong>самех</strong> и далее). В каждом разделе содержатся шесть слов из Книги Плач Иеремии, соответствующие шести алфавитным акростихам книги.</p><p class=\"meta\"><strong>Автор:</strong> рабби Элазар га-Калир.</p><p>Когда исчезли моя радость и моё величие, меня объявили нечистой и удалили прочь. Народы говорили, что меня изгнали из моей земли.</p><p>Подобно отрезанному куску дерева, отброшенному прочь, меня оставили презренной среди полчищ народов.</p><p>Ты закрыл завесой Небесное Святилище, чтобы не взирать на земной Храм, созданный по его образу, и тем самым перестал щадить меня.</p><p>Ты преградил путь моей молитве. Враги одолели моих сильных воинов, хлопали в ладоши от радости, а все мои крепкие мужи были попраны, и внутренности мои содрогнулись.</p><p>Город пал и словно погрузился в бездну, намекая на вавилонское изгнание.</p><p>Мои глаза ожидали исполнения пророчества Захарии, сына Берехии, о том, что старцы и старицы вновь будут сидеть на улицах Иерусалима. Я вспоминала чудеса Гилгала, когда Господь низверг с неба огромные камни на врагов. Но мои глаза лишь истомились ожиданием.</p><p>Мои глаза потускнели, лицо покрылось стыдом, ибо я погрузилась в вязкую трясину унижения, из которой невозможно выбраться.</p><p>Святой, благословен Он, разрушил Свой Дом и, говоря человеческим языком, Сам воззвал к плачу, сказав: <strong>«Об этом Я плачу».</strong></p><p>Из-за быстрых вод Евфрата страдали внутренности изгнанников, и, приняв свой суд, они очистились и стали благочестивыми.</p><p>Община Израиля вспомнила рассечение Красного моря, когда открылась морская бездна и народ прошёл по суше, а также чудо, когда горькие воды стали сладкими. Теперь же даже сладкие воды стали для нас горькими.</p><p>Исполнился ужас разрушения, подобный разрушению Шило из-за грехов сыновей Эли, и наши преступления дали врагам возможность поспешить к разрушению Храма.</p><p>Народы мира открыли свои уста и спросили:</p><p><strong>«Где же благочестие Общины Израиля?»</strong></p><p>Они показали всем изображения херувимов, найденные в своих дворцах, и насмехались над нашим народом, утверждая, что мы — идолопоклонники.</p><p>Сион распростёр свои руки от великой скорби.</p><p>На горе Иерусалима устроили засаду многочисленные враги и противники мои.</p><p>Они нахлынули и прошли над головами людей, словно бурные воды потока.</p><p>Связана со мной вина за убийство в Нове, и этот грех стоит против меня как обвинение.</p><p>Чтобы захватить Иерусалим, Ты сохранил этот грех, чтобы привести врагов против меня.</p><p>Народ Израиля взывал во дни Элазара бен Динай, когда он пытался восстать против римлян.</p><p>В тот час они признали справедливость суда над ними.</p><p>Ты, Господи, возвысил презренных халдеев, позволив им завоевать великие царства, чтобы они не унижали меня за то, что я пала перед низким и страшным народом. Они сняли с меня мои украшения и мою славу.</p><p>Ты приблизил врага, чтобы он быстро пришёл ко мне и разрушил меня.</p><p>Когда я вышла в изгнание, я призвала гибеонитов, заключивших со мной союз, чтобы они помогли мне, но и они захлестнули меня, словно поток воды.</p><p>Мой голос, обращённый к сыновьям Исмаила с просьбой о хлебе и воде, привёл ко мне разбойников.</p><p>«Встань и пройди через нашу землю», — говорили мне исмаильтяне насмешливо.</p><p>Они хитростью поднесли нам солёные продукты и надутые мехи с водой, и так я была погублена. Я называла их своими друзьями, а они обманули меня.</p><p>Почему Йошиягу (Иосия), который был праведником, был обречён на смерть? — так спрашивали его.</p><p>Ты видел, Господи, как моя кожа раскалилась словно печь, а я иссохла от голода.</p><p>Ты видел, что их злые замыслы были направлены против Тебя: в Храме они совершали грабеж и осквернение.</p><p>Ты предупреждал нас через пророка Йехезкеля (Иезекииля), что придёт возмездие за то, что мы восстали против Тебя.</p><p>Посмотри и отомсти за нас, — говорили народы, — ведь они хотят уничтожить нас, стереть нас с лица земли.</p><p>Посмотри, Господи, как мне тяжело; мои внутренности горят от боли.</p><p>Наша просьба к Тебе — исполни сказанное:</p><p><strong>«Веселись и радуйся, дочь Эдома»</strong>, — пусть прозвучит возмездие над врагами, которые изгнали меня из моей земли.</p><p>Разруши места их обитания так же, как они разрушили мои дворы и сокрушили меня.</p><p>Враги заставили замолчать священников и левитов, которые воспевали в Доме Господа, чтобы причинить мне ещё большую скорбь.</p><p>Ты услышал слова врагов, которые приготовились уничтожить нас с лица земли.</p><p>Мы сидели на пути в изгнание. Камни и острые осколки смешались с прахом дороги, а когда мы ели хлеб — наши зубы ломались. Мои враги слышали голос моих стонов.</p><p>Ибо образ нашего праотца Яакова Ты высек на Престоле Своей славы, в колесах Небесной колесницы. Поэтому народы думают, что, уничтожая Израиль внизу, они словно наносят удар Самому Господу.</p><p>Воздай им по делам их, как они поступили с нами, и удостой нас вновь увидеть Твоё Лицо, подобно тому, как Ты явил его нам у Красного моря.</p><p>Приведи народы к Гейном, ибо они замышляли зло против Израиля, который скрывается под Твоей защитой.</p><p>Предай их огню, поскольку они разрушили Дом Святилища. Назначь день, когда Ты напоишь их чашей возмездия, скрытой в углу Твоего сокровищницы.</p><p>Наша просьба к Тебе — вспомни перед Собой всё их зло.</p><p>Принеси народам воздаяние за их грехи, за то, что они убивали нас.</p><p>В гневе Ты привёл нас к входу Хамата.</p><p>К Халаху и Хавору, находящимся в Ассирии, Ты изгнал десять колен.</p><p>Старцев, юношей и девушек.</p><p>Ты связал их железными цепями.</p><p><strong>Владыка мира, внемли нашей просьбе и увидь, что весь Твой народ — мы, верующие в Тебя.</strong></p><p>Поэтому:</p><p><strong>«Вспомни, Господи, что случилось с нами».</strong></p>", "subs": []}, {"id": "chapter-7", "title": "Кина 7", "html": "<p class=\"meta\"><strong>Тема:</strong> как Всевышний позволил врагам поступить с Израилем по их желанию и не вспомнил прежний завет.</p><p class=\"meta\"><strong>Знак:</strong> алфавитный порядок (א\"ב). Порядок букв начинается после начальных слов «Эйха» («Как») и «Ве-ло захарта» («И не вспомнил Ты»). Первый раздел построен на пяти словах, начинающихся с буквы א (алеф), второй — на шести словах, начинающихся с ב (бет), и так далее. Это намёк на пять книг Торы и шесть разделов Мишны — письменную и устную Тору, которые, несмотря на свою святость, не смогли защитить Израиль от бедствия.</p><p class=\"meta\"><strong>Автор:</strong> рабби Элазар ха-Калир; его имя скрыто в конце акростиха.</p><p><strong>Как же поспешил Ты в Своём гневе</strong><br/>отдать в руки римлян Израиль, верующий в Тебя,<br/>и не вспомнил Ты завет между частями жертвоприношения,<br/>который ясно обещал Ты Аврааму и праотцам,<br/>избранным через испытания.</p><p>Поэтому мы сказали:<br/><strong>«Вспомни, Господи, что случилось с нами»</strong>.</p><p><strong>Как же вознёсся Твой гнев</strong>,<br/>чтобы через римлян изгнать<br/>гордый народ Израиля,<br/>который Ты вывел из Египта,</p><p>и не вспомнил Ты короткую дорогу<br/>от горы Хорев до Кадеш-Барнеа,<br/>которую прошли сыны Израиля за один день,<br/>чтобы ускорить своё прибытие в Землю Израиля.</p><p>Поэтому мы говорили:<br/><strong>«Вспомни…»</strong></p><p><strong>Как говорил Ты словами Своими</strong>,<br/>чтобы через римлян,<br/>занятых удовольствиями этого мира,<br/>отвергнуть многочисленный народ Израиля,</p><p>и не вспомнил Ты Храм —<br/>место Шхины и силы Израиля,<br/>где постоянно пребывало Божественное присутствие<br/>среди народа Израиля.</p><p>Поэтому мы скорбим:<br/><strong>«Вспомни…»</strong></p><p><strong>Как оставил Ты в Своём гневе</strong>,<br/>чтобы нечестивцы осквернили Храм,</p><p>и не вспомнил Ты день свадьбы —<br/>дарование Торы на горе Синай,<br/>когда её законы были переданы Израилю,<br/>народу, которому Ты проявляешь милость.</p><p>Поэтому мы сказали:<br/><strong>«Вспомни…»</strong></p><p><strong>Как утрудил Ты Себя</strong>,<br/>чтобы отдать добычу чужим —<br/>Твоё стадо Израиль,</p><p>и не вспомнил Ты заслугу драгоценной Торы,<br/>учащей прямому пути,<br/>которую Ты дал одному лишь Израилю.</p><p>Поэтому мы плачем:<br/><strong>«Вспомни…»</strong></p><p><strong>Как задумал Ты в Своём гневе</strong><br/>уничтожить руками грешников<br/>Израиль, называемый виноградником Господа,</p><p>и не вспомнил Ты,<br/>что никогда не оставишь нас навсегда,<br/>как обещал тем, кто занимается Твоей Торой.</p><p>Поэтому мы сказали:<br/><strong>«Вспомни…»</strong></p><p><strong>Как говорил Ты в час, когда отверг нас</strong>,<br/>желая стереть с лица земли<br/>народы, причиняющие страдания словами насмешек,</p><p>Израиль, который возвышает Святого, благословен Он,<br/>своими молитвами.</p><p>И не вспомнил Ты,<br/>что нёс Израиль на крыльях орлов,<br/>когда вывел его из Египта,<br/>и терпел его страдания, чтобы спасти его.</p><p>Поэтому мы плачем:<br/><strong>«Вспомни…»</strong></p><p><strong>Как говорил Ты в Своём гневе</strong>,<br/>чтобы отдать в руки тех, кто замышляет зло,<br/>Израиль, свидетельствующий о Твоём единстве,</p><p>и не вспомнил Ты заслугу Торы<br/>и двух венцов, которыми Ты украсил<br/>Израиль, Твоих слуг.</p><p>Поэтому мы скорбим:<br/><strong>«Вспомни…»</strong></p><p><strong>Как открыл Ты уста Свои в ярости</strong>,<br/>чтобы убить руками разбойников<br/>Израиль, которому Ты совершил чудеса,</p><p>и не вспомнил Ты песни левитов<br/>в Храме, который желаешь,</p><p>и Иерусалим, где были установлены законы справедливости,<br/>который Ты связал с Небесным Иерусалимом<br/>ради Израиля, Твоего народа.</p><p>Поэтому мы рыдаем:<br/><strong>«Вспомни…»</strong></p><p><strong>Как назначил Ты в назначенный день</strong>,<br/>чтобы продать в руки врагов<br/>Израиль, избранный и дорогой перед Тобой,</p><p>и не вспомнил Ты собрание двадцати двух тысяч ангелов,<br/>которые явились Израилю<br/>на горе Синай.</p><p>Поэтому мы оплакиваем себя и жалуемся:<br/><strong>«Вспомни…»</strong></p><p><strong>Как поглотил Ты в Своём разрушении</strong>,<br/>чтобы бросить в руки грабителей<br/>Израиль, Твоих совершенных и верных,</p><p>и не вспомнил Ты красоту Израиля —<br/>Храм и Тору,</p><p>и отдал Ты Свой народ,<br/>чистый и невинный.</p><p>Поэтому мы страдали и скорбели:<br/><strong>«Вспомни…»</strong></p><p>Мы скорбим и рыдаем,<br/>пока сердце наше не изливается, как вода,</p><p>ибо в этот день Ты дважды отдал нас в плен —<br/>при разрушении Первого и Второго Храма.</p><p>О моих воспоминаниях,<br/>о моих воспоминаниях —<br/>когда я была спокойна<br/>и жила в Иерусалиме.</p><p>Я оплакивала,<br/>а теперь подниму голос<br/>моего плача,<br/>чтобы он полетел до края мира…</p>", "subs": []}, {"id": "chapter-8", "title": "Кина 8", "html": "<p class=\"meta\"><strong>Тема:</strong> призыв к душе оплакать разрушение с горечью и великим плачем.<br/><strong>Основа построения:</strong> система Атбаш и Баш (перестановка букв еврейского алфавита). В каждом разделе четыре строки, все начинаются с одной и той же буквы. В первых трёх строках вторая буква следует порядку алеф-бет, а в четвёртой строке — обратному порядку (תשר״ק). Таким образом, кина построена по системе א״ת, ב״ש.</p><p>Каждая строка начинается с первой буквы (א), чтобы намекнуть: даже если пришли многочисленные бедствия и кажется, что наступило самое последнее, на самом деле это лишь начало новых испытаний.<br/>Четвёртая строка состоит из тридцати стихов, начинающихся словом <strong>«Ми» (מי — «кто»)</strong>.</p><p class=\"meta\"><strong>Автор:</strong> рабби Элазар ха-Калир; его имя скрыто в конце.</p><p>Я подниму голос моего плача,<br/>пусть он достигнет круга небес.</p><p>Я буду скорбеть,<br/>пока вместе со мной не будут оплакивать небеса.</p><p>Я прокляну день девятого ава,<br/>в который дважды был разрушен Храм.</p><p>В плаче и горести —<br/>кто даст, чтобы моя голова стала водой,<br/>а из моих глаз текли реки слёз?</p><p>Я размышлю о том,<br/>что такое был плач напрасный<br/>в пустыне —<br/>из-за греха разведчиков.</p><p>И пойму различие<br/>между ночью плача напрасного<br/>и ночью разрушения.</p><p>Моё состояние у горы Синай,<br/>где было у меня всё благо,<br/>отличалось от моего выхода<br/>в пустыню народов —<br/>в изгнание без ничего.</p><p>И пойму:<br/>это произошло со мной<br/>из-за моих грехов.</p><p>Я заставлю плакать весь мой народ —<br/>всех сынов Израиля,<br/>вышедших из пустыни.</p><p>Я закричу громким голосом:</p><p>«Лучше бы я был в пустыне<br/>и не переносил страданий рабства».</p><p>Пусть я буду срублен<br/>и останусь подобно оливковому дереву,<br/>на котором остались лишь последние плоды.</p><p>Я буду жаловаться,<br/>пока вместе со мной не пробудятся ангелы —<br/>обитатели дома Господнего.</p><p>Я не успокоюсь,<br/>пока Хозяин дома — Святой, благословен Он —<br/>не скажет: «Я буду говорить».</p><p>Кто даст, чтобы было постановлено,<br/>что мои враги станут подобны колючкам?</p><p>Я причиню боль своему сердцу,<br/>может быть, Господь примет меня.</p><p>Кто даст мне знать слова молитвы,<br/>чтобы через них приблизить своё сердце к Нему?</p><p>Я тревожился,<br/>потому что оставил меня мой Пастырь.</p><p>Я буду искать Его через раскаяние<br/>и добрые дела —<br/>но не найду Его.</p><p>Я буду взывать в молитве,<br/>чтобы узнать, чем я могу быть угоден Ему,<br/>чтобы Он возвратил Своё присутствие.</p><p>Я буду вращаться в множестве слов,<br/>как колесо, которое поворачивается из стороны в сторону,<br/>чтобы оплакивать.</p><p>Я буду скорбеть перед Святым, благословен Он,<br/>и расскажу Ему обо всех моих страданиях.</p><p>Пусть солнце и луна оплакивают мой народ<br/>и перестанут светить передо мной.</p><p>Я закричу:</p><p>«Кто даст, чтобы мои слова были записаны в книге,<br/>чтобы они помнились навеки?»</p><p>Путь тех, кто приносил первые плоды, был таков:<br/>они обвязывали коров сухими инжирами,<br/>и этим обманывали стража,<br/>который был поставлен во времена указа царства<br/>не приносить первые плоды.</p><p>На плечах они несли ступу и пестик —<br/>орудия для измельчения инжира.</p><p>Я расскажу всем,<br/>что это наказание —<br/>мера за меру<br/>за погоню за богатством и грабительство.</p><p>Уменьшилось изобилие и благословение,<br/>которые нисходили с небес,<br/>с тех пор как разрушен Храм<br/>и прекратилось служение.</p><p>Я закричу:</p><p>«Кто даст, чтобы Святой, благословен Он, услышал мои просьбы?»</p><p>Община Израиля вышла из своей земли,<br/>когда прекратилась заслуга праотцов.</p><p>Когда я вспомню,<br/>что была обручена с Ним<br/>при даровании Торы,</p><p>я пролью слёзы своего плача<br/>как воды большого источника.</p><p>Я закричу:</p><p>«Лучше бы мне дали крылья, как голубю,<br/>чтобы улететь в пустыню<br/>и не терпеть изгнания».</p><p>Аммон и Моав, сыновья Лота,<br/>были изгнаны со своего места,<br/>чтобы прийти к потомкам Авраама,<br/>но в Тире они были убиты.</p><p>Их поля высохли от воды,<br/>ибо в гневе Своём Господь остановил небеса.</p><p>Враг схватил и убил отцов<br/>во время жатвы колосьев,<br/>а детей —<br/>как при сборе винограда.</p><p>Поэтому я буду говорить с горечью души:</p><p>«Кто приведёт меня к Эдому,<br/>чтобы отомстить им?»</p><p>Я построю своё жилище среди мёртвых,<br/>ибо зачем мне жизнь?</p><p>Я расцвету<br/>и поселюсь в доме могил,<br/>где нет живых.</p><p>Я присоединюсь к тем,<br/>кто желает смерти<br/>из-за множества своих страданий.</p><p>Я воскликну с печалью:</p><p>«Кто тот человек,<br/>который будет жить и избежит смерти?»</p><p>Я искал Святого, благословен Он,<br/>мою силу, чтобы Он помог мне.</p><p>Община Израиля каждый год говорит,<br/>что этот год — год избавления.</p><p>Я объявлю всем:</p><p>Когда придёт избавление,<br/>оно станет известно всей земле.</p><p>И станет ясно:<br/>если бы не рука Господа, сражавшаяся против меня,<br/>враги не смогли бы причинить мне зло.</p><p>Я склоню голову в раскаянии<br/>перед Тобой, Господь, моя сила.</p><p>Я преклоню перед Тобой колено,<br/>чтобы Ты исцелил<br/>болезнь моего изгнания.</p><p>И тогда я прославлю Тебя<br/>песней левитов<br/>с музыкальными инструментами.</p><p>Я попрошу в молитве:</p><p>«Кто даст, чтобы Ты пришёл утешить меня,<br/>как Йосеф утешил своих братьев?»</p><p>Не забудь плач разрушенного Храма,<br/>который взывает к Тебе о восстановлении,<br/>желая собрать Иудею и Израиль.</p><p>Ангелы Земли Израиля и Иерусалима,<br/>которых Святой, благословен Он, поставил охранять Израиль,</p><p>также молятся о его восстановлении:</p><p>«Пусть придёт от Обитающего в Сионе<br/>спасение Израиля».</p><p>Господь отвечает:</p><p>«Израиль со времени,<br/>когда не ходил Моими путями,<br/>оставил Меня.</p><p>Поэтому Я удалил их<br/>и скрыл от них Моё лицо».</p><p>Я скорбел и рыдал,<br/>и внутренности мои и сердце моё<br/>излились.</p><p>Как же народы мира<br/>сбросили Храм<br/>с моей головы?</p>", "subs": []}, {"id": "chapter-9", "title": "Кина 9", "html": "<p class=\"meta\"><strong>Содержание:</strong> проклятия из книги Тохаха (предупреждений и наказаний) вместо обещанных благословений.<br/><strong>Знак:</strong> система «Атбаш». Первое слово в начале строк составлено из первых букв стихов из главы «Эйха я’ив» (Плач Иеремии, 2:1). Второе слово каждой строки идёт в обратном порядке алфавита (та́шрак), и так продолжается до конца еврейского алфавита. Последняя строка основана на стихах из книги Ваикра (Левит 26:3–24).<br/><strong>Автор:</strong> рабби Элазар ха-Калир.</p><p>Господь оплакивает:<br/>«Как же народы сбросили с моей головы Храм,<br/>а в Святилище, напротив Небесного престола славы,<br/>поставили деревья и приносили жертвы!</p><p>Это произошло тогда, когда народ Израиля нарушил условие,<br/>о котором пророки наставляли их — вернуться в раскаянии.<br/>Ведь Господь заключил с ними завет,<br/>что в Торе они будут трудиться».</p><p>Господь говорит:<br/>«Почему вы спорите со Мной, народ Мой?<br/>Ваши слова против Меня сильны и тяжки,<br/>ведь именно вы навлекли всё это на себя.</p><p>Искажены были мысли Моего суда,<br/>и замысел был направлен так,<br/>чтобы отдать вас в руки врага.<br/>Лицо Моё было скрыто от вас,<br/>когда Я увидел тяжесть справедливого суда.</p><p>Я превратил ваши дожди в пыль,<br/>чтобы сделать землю бесплодной —<br/>это стало проклятием вместо благословения дождей в своё время.</p><p>Я сделал меня презираемым и отвергнутым среди народов,<br/>и чтобы погубить нас в Своём гневе,<br/>Я хранил вражду против вас.</p><p>Наша просьба:<br/>пусть пророчества утешения ускорятся,<br/>и в наши дни они принесут мне радость.</p><p>Он отнял их славу и силу,<br/>дни их молодости стали коротки,<br/>и мечом поражающим поставил город в осаду.</p><p>Он сделал их изнемогающими от голода,<br/>хотя прежде они были богаты урожаем,<br/>вместо благословения — чтобы они много трудились на жатве<br/>до прихода времени сбора винограда.</p><p>Он приготовил Свой лук и уничтожил их,<br/>и словно железом укрепил небеса,<br/>чтобы они не давали там дождя.</p><p>В стене Храма сделали тринадцать проломов,<br/>вместо обещанного благословения,<br/>что будет мир на земле».</p><p>Народы говорят:<br/>«Господь, который был вашей силой и защитой,<br/>стал жестоким и воюет против вас.</p><p>Господь, ваш хранитель, отдаляет вас от Себя;<br/>Тот, кто желал вас прежде,<br/>теперь отверг вас.</p><p>И где же обещание,<br/>которое Он дал вам —<br/>что вы будете преследовать своих врагов?»</p><p>Он сокрушил святой город — Иерусалим,<br/>наполненный праведностью,<br/>потому что в его тайных местах нашёл нечистоту, которую ненавидел.</p><p>Все те, кто прежде почитал его, теперь унизили его,<br/>как нечистую женщину периода ниды.</p><p>Вместо обещания:<br/>«Пятеро из вас будут преследовать сто» —<br/>Господь оставил Иерусалим,<br/>где народ собирался в праздничные дни,<br/>и разрушил укреплённые ворота стен,<br/>где стояли стражи города.</p><p>«Кто просил вас попирать Мои дворы?» — сказал Господь.<br/>«Поэтому Я изгнал вас<br/>и отменил обещание, что обращу к вам Своё лицо<br/>и умножу вас».</p><p>Пришло Ему в сердце возненавидеть Свой народ,<br/>который подобен розе среди народов.</p><p>Народами мира были удобрены их виноградники<br/>жиром и кровью их детей.</p><p>Дым горящего Храма поднялся<br/>как огонь печи.</p><p>И спросили они вместо обещания о хлебе:<br/>«Где же обещание,<br/>что ваш урожай будет сохраняться<br/>на три года?»</p><p>Погибли и были закланы стоявшие<br/>на каменном полу двора Храма.</p><p>В земле Хамат царь Вавилона убил<br/>Сераю — главного священника,<br/>и Цефанию — второго священника.</p><p>Уже долгое время открыты<br/>основания Храма.</p><p>И удалился Господь от меня,<br/>хотя Он обещал,<br/>что поставит Своё жилище среди меня,<br/>но из-за наших грехов Он удалил его от нас.</p><p>Сидели плачущие<br/>из-за криков близких, обречённых на смерть.</p><p>Четырьмя видами бедствий Он поразил ваш народ:<br/>мечом, голодом, зверями и мором.</p><p>Он разрушил вас,<br/>когда Шхина (Божественное присутствие) ушла от нас из-за наших грехов,<br/>вопреки обещанию,<br/>что Она будет пребывать среди нас.</p><p>В одно мгновение были уничтожены<br/>ваши шатры — через грабёж и разорение.</p><p>И вами клялись враги:<br/>«Пусть со мной никогда не случится то, что случилось с вами».</p><p>В ваши руки упали ваши маленькие дети,<br/>потому что вы отвергли слова:<br/>«Я — Господь, Бог ваш».</p><p>От матерей просили пищу для детей...</p><p>Господь сказал ангелам:<br/>«Оставьте Меня, отойдите от Меня,<br/>пусть Я плачу.<br/>Я привёл их в землю полей и виноградников,<br/>где у них было наслаждение,<br/>а они отвергли слова пророков, которые предупреждали:<br/>\"Если не будете слушать...\"»</p><p>«Какую мать приведу Я, чтобы сравнить её с тобой<br/>и утешить тебя?<br/>Такого ещё не было,<br/>ведь старцы и юноши были растоптаны».</p><p>Израиль сказал, что на быстрых конях<br/>они убегут от врага,<br/>и не поверил предупреждению пророка,<br/>что им не удастся вернуться на своё место.</p><p>Господь сказал:<br/>«Я устал нести ваши грехи,<br/>которые являются тяжёлым грузом.<br/>Я уже наказал вас, как сказал:<br/>\"Если же не будете соблюдать Моих установлений...\"»</p><p>Ваши пророки ввели вас в заблуждение —<br/>они пророчествовали ложь и пустоту.</p><p>Я взывал к вам через истинных пророков,<br/>и если бы вы раскаялись — Я простил бы вас.<br/>Но вы не вернулись.<br/>И сказал Я:<br/>«Неужели за это Я прощу тебя?»</p><p>Я убеждал вас вернуться ко Мне,<br/>но вы ответили Мне с дерзостью:<br/>«Мы не раскаемся».</p><p>И разгневался Я и сказал:<br/>«Тогда и Я сделаю то, что постановил».</p><p>Они хлопали руками, скрежетали зубами<br/>и издевались над Израилем своими словами.</p><p>Через нечестивцев нашего народа<br/>и через меч врага были уничтожены люди,<br/>потому что злодеи осквернили Храм,<br/>в котором скрывалась Шхина.</p><p>«Во зло, а не во благо, — сказал Господь, —<br/>Я обращу к вам Моё лицо».</p><p>Открыли народы свои уста и сказали:<br/>«Перед кем вы будете молиться?<br/>Вы — народ, полный грехов,<br/>и Господь оставил вас,<br/>Он устал слушать вас.</p><p>Не надейтесь, что Он снова совершит для вас чудеса,<br/>как прежде.<br/>Он разгневался и удалил Свою Шхину,<br/>и сказал, что если после наказаний вы не услышите,<br/>то добавит ещё страдания».</p><p>Господь возвысил народы,<br/>которые подобны шуму великих вод,<br/>и они разлились моей кровью<br/>в землях изгнания.</p><p>Каждый год Он прибавлял<br/>плач о юноше,<br/>с того времени, когда разгневался<br/>и сказал, что разрушит Дом Свой.</p><p>В скорби Господа о изгнании<br/>раздался вопль траура,<br/>хотя колчан стрел был опустошён на меня.</p><p>Со всех сторон Он послал против меня<br/>гонцов, чтобы изгнать меня.</p><p>Из-за доноса перед императором<br/>враг оскалил зубы<br/>и разрушил Храм.</p><p>И это удалось им<br/>силой проклятия, сказанного Господом:<br/>«И истощится напрасно ваша сила».</p><p>Восстань, община Израиля,<br/>стучи в ворота молитвы, не молчи.</p><p>В смирении, подобно тихому голосу духа,<br/>который слышен из земли,<br/>молись и взывай к Господу.</p><p>Он навёл на меня бедствия,<br/>и я сижу молча, как скорбящий.</p><p>Он сделал мой путь тёмным, как сказано:<br/>«Если же будете идти со Мною случайно...<br/>то Я добавлю вам семь наказаний».</p><p>Посмотри, Господь, на землю,<br/>которую Ты дал нам по жребию<br/>и которой Ты возжелал —<br/>как она превратилась в пустыню и развалины.</p><p>Я стал подобен перелётной птице в пустыне.</p><p>Народы называют меня изгнанницей,<br/>говорят: «Отойдите от неё,<br/>не прикасайтесь к ней»,<br/>и унижают меня.</p><p>Я услышал проклятие Господа,<br/>что Он наведёт на меня зверей земли.</p><p>В изгнании они лежат измученные,<br/>как дикий бык, пойманный в сеть,<br/>и нет того, кто поднимет его.</p><p>Мы наполнены упрёком Господа,<br/>и нет того, кто принесёт нам исцеление.</p><p>На протяжении многих лет Он сокрушал меня,<br/>чтобы я исчез,<br/>как было сказано в споре, который Господь вёл с нами:<br/>если мы не исправимся — придут ещё большие бедствия.</p><p>Назначь день разрушения,<br/>как ты сделал мне — сделай Эдому:<br/>уничтожь его и разбей многократно,<br/>как разбили меня.</p><p>Сокруши и уничтожь преследователей Израиля,<br/>как сказано:<br/>«Голос из Храма... воздающий возмездие врагам Моим».</p><p>Как смятение от вражеской борьбы против меня,<br/>как написано:<br/>«И Я пойду против вас в ярости».</p><p>Даже я попался в ловушку,<br/>как пьяный, спотыкающийся на дороге.</p><p>Моя радость была смешана с печалью,<br/>а теперь гнев прекратился.</p><p>На полу я сяду<br/>и буду говорить из глубины моего горла.</p><p>Как одиноко сидит община Израиля,<br/>которая была подобна влажной розе —<br/>всегда прекрасной и любимой.</p>", "subs": []}, {"id": "chapter-10", "title": "Кина 10", "html": "<p class=\"meta\"><strong>Содержание:</strong> о двадцати четырёх сменах священников (ми́шмарот кехуна), которые служили в Храме.<br/><strong>Знак (симан):</strong> алфавитный порядок — алеф-бет. Каждая строфа начинается словом, взятым из начальных слов стихов книги «Эйха» («Как сидит одиноко», глава 1). В конце каждой строки упоминается название одной из священнических смен.<br/><strong>Автор:</strong> рабби Элазар ха-Калир.</p><p>Как сидела одиноко община Израиля, уподобленная прекрасной и нежной розе,<br/>всегда украшенная и славная,<br/>как замолчала песнь из уст левитов, носивших Ковчег Завета,<br/>и покинули свои служебные череды священники —<br/>потомки Аарона,<br/>в то время,<br/>когда был передан Дом Святилища<br/>в руки врага,<br/>во время служения<br/>смены Йеоярива,<br/>место которой было в <strong>Месеревей Марон</strong>.</p><p>Плакал Израиль, получивший пять книг Торы,<br/>когда был убит Захария, который был<br/>священником и пророком в день Йом-Кипура.<br/>И над его кровью Навузардан зарезал тысячи детей дома учителя, словно козлят,<br/>а священники смены <strong>Йедайя</strong>,<br/>чьё место было в Циппори,<br/>были изгнаны, словно птицы, улетающие вдаль,<br/>из долины Циппори.</p><p>Изгнан был Израиль<br/>из своей земли,<br/>он, который был уподоблен украшенной невесте,<br/>потому что не соблюдал отделение десятин<br/>и законы седьмого года (шмита).</p><p>И четырьмя судами был наказан:<br/>мором,<br/>мечом,<br/>голодом<br/>и пленением.</p><p>И была лишена священных одежд смена <strong>Харем</strong>,<br/>которая находилась в месте <strong>Мафтешата</strong>.</p><p>Пути Храма замолчали,<br/>когда были проломлены его стены и он был разрушен.<br/>И звук колокольчиков на верхней одежде первосвященника прекратился,<br/>когда прекратилось служение,<br/>и была разорвана одежда, сделанная из голубой нити (тхелет).</p><p>Был низвергнут Храм со своей славы,<br/>унижен от своей силы,<br/>и были вырваны со своих мест и изгнаны<br/>стражи ворот — смена,<br/>место которой было в <strong>Айте́ло</strong>.</p><p>Враги мучили изучающих Тору,<br/>которых называли «хлебом»,<br/>когда их руки перестали давать хлеб бедняку,<br/>и они сами остались голодными и жаждущими<br/>воды и хлеба.</p><p>Когда была отменена жертва двух хлебов,<br/>которые приносили из нового урожая<br/>в праздник Шавуот,<br/>ведь через эти два хлеба и хлебы предложения<br/>нисходило благословение на пищу.</p><p>И это намекает на смену <strong>Малкии</strong>,<br/>которая укладывала хлебы предложения,<br/>место которой было в <strong>Бейт-Лехем</strong>.</p><p>Вышла красота народа,<br/>который был подобен очищенному серебру в чистой Торе,<br/>и вместо Торы, которая является его украшением,<br/>оказался пепел на их головах как знак скорби и искупления.</p><p>Погасли<br/>светильники Храма,<br/>и менора была повержена лицом вниз,<br/>потому что они не давали хлеба и пищи бедному.</p><p>Была захвачена <strong>Йодфат</strong>,<br/>где жили священники смены <strong>Миямин</strong>.</p><p>Вспомнили Израиль о том великом событии, когда они сказали:<br/><strong>«Сделаем и услышим»</strong>,<br/>ещё до того как услышали заповеди — они уже приняли их.</p><p>А теперь, когда пришли пророки<br/>и увещевали их вернуться,<br/>и от них требовалось лишь согласиться и сказать «амен»,<br/>они отказались ответить.</p><p>Поэтому множество тяжёлых и горьких бед<br/>напитали их и насытили,<br/>и были уничтожены и стали посмешищем<br/>священники смены <strong>Коца</strong>,<br/>место которой было в <strong>Эйлаву</strong>.</p><p>Согрешил Израиль,<br/>обратившись к идолу — к своему дурному желанию, называемому <strong>Эли</strong>,<br/>и насмехался и обманывал пророков Всевышнего.</p><p>Поэтому пришла их кара<br/>через врагов,<br/>которые приводят гнев Всевышнего.</p><p>И вышла из Храма смена <strong>Авия</strong>,<br/>место которой было в селении <strong>Узиэль</strong>.</p><p>Из-за разврата Израиль осквернил землю,<br/>и был обязан уйти в изгнание.<br/>И удалилась Шхина Всевышнего,<br/>Который управляет землёй.</p><p>И как будто облако пыли у Его ног —<br/>подобно скорбящему, который идёт босиком,<br/>Он уже не облачается в одежды священства<br/>из-за священников смены <strong>Йешуа</strong>,<br/>которые жили в <strong>Арбеле</strong>.</p><p>Враг протянул руку к Дому Святилища,<br/>где осталось лишь немного живых людей,<br/>которых Он любил, словно в поколении Потопа.</p><p>Трон Всевышнего там<br/>враг предал огню и насмешке.</p><p>И вышли в изгнание, скованные железными цепями,<br/>священники смены <strong>Шхания</strong>,<br/>жившие в <strong>Кавуле</strong>.</p><p>Весь народ поднял плач и произнёс кину<br/>за то, что разгневали они Всевышнего,<br/>Который ревнует о Своём имени,<br/>чтобы отомстить.</p><p>В руки низкого народа передал их Всевышний,<br/>и отомстил им за то, что они разгневали Его.</p><p>И была изгнана со своего места<br/>смена <strong>Эльканы</strong>,<br/>которая является сменой <strong>Эльяшива</strong>.</p><p>Не на спасение от Господа надеялся Израиль,<br/>и их внешний вид был чист, словно серебро,<br/>покрывающее глиняный сосуд,<br/>но внутри их содержание было нечистым.</p><p>От тяжести страданий ослабли их руки,<br/>и прекратилась и затем возобновилась смена <strong>Яким</strong>,<br/>место которой было в Цфате.</p><p>С высоты Всевышний возвысил Свой голос через пророка Йешаягу:</p><p><strong>«Я устал нести их грехи»</strong>.</p><p>И поэтому Он поразил меня слепотой и безумием,<br/>и вспомнил мне грех убийства священников из Нов<br/>и грех против жителей Гивона.</p><p>И ушла из Храма смена <strong>Хапа</strong>,<br/>место которой было в Бейт-Маоне.</p><p>Укажи перед Господом мои грехи,<br/>и пусть наказание исправит меня.</p><p>Он посадил меня, словно вдову без отца,<br/>и прекратил мою песнь под музыкальные инструменты.</p><p>И была возложена на меня кина<br/>смены <strong>Ишвав</strong>.</p><p>Он сокрушил сильных — членов Санхедрина,<br/>и Господь не вспомнил мне заслугу жертвоприношения Ицхака.</p><p>Из-за великого бунта и восстания против Господа<br/>была выставлена без одежд смена священников <strong>Маадия</strong>,<br/>которая является сменой <strong>Билга</strong>.</p><p>Они заставили меня работать тяжёлой работой.<br/>Пахари словно провели борозды по моей спине,<br/>и удлинили тяжесть изгнания,<br/>подобно тому как удлиняется линия плуга.</p><p>Они вынули из ножен свои мечи и копья,<br/>готовые убивать.</p><p>Я умножил посты и дни скорби<br/>из-за новых указов,<br/>и исчезло величие и устройство Храма.</p><p>Смена <strong>Амар</strong>,<br/>место которой было в Йеваните.</p><p>Они простёрли руки в молитве, но не были услышаны,<br/>потому что не поверили пророкам Господа,<br/>которых Он каждый день посылал к ним с поспешностью.</p><p>Прекратилось служение священников и жертвоприношения,<br/>и больше нет масла помазания,<br/>которым помазывали первосвященников<br/>из смены <strong>Хазир</strong>,<br/>место которой было в Мамлах.</p><p><strong>Праведен Господь во всех Своих судах</strong>,<br/>ибо я не слушал Его голоса.</p><p>И был наказан тем,<br/>что разрушили Дом,<br/>пока даже его основания не открылись.</p><p>И вместо песен и восхвалений,<br/>которые пели у моря,<br/>был записан и определён в этот день плач по Израилю,<br/>и он был рассеян до краёв земли.</p><p>Смена <strong>Пецец</strong>,<br/>место которой было в Нацрате.</p><p>В бедствии своём я воззвал к Господу,<br/>но моя молитва не была принята.</p><p>Я просил ради своего блага у проходящих караванов,<br/>идущих через землю ишмаэльтян,<br/>которые ночуют в лесах Аравии,<br/>и многие погибли от их рук.</p><p>Перед разрушением Храма<br/>погас светильник постоянного огня на западе,<br/>как знак того, что Дом будет разрушен.</p><p>И запах благовония уже не был приятен<br/>из-за смены <strong>Птахия</strong>,<br/>которая жила в Акахале Арав.</p><p>Узри, Господи,<br/>как Ты качаешь меня, словно корабль в море,<br/>в скорби и плаче,<br/>и всё моё собрание — словно стадо овец, приготовленное к закланию.</p><p>И была изгнана со своего места смена <strong>Йехезкеля</strong>,<br/>место которой было в Мигдаль-Нуния.</p><p>Враги услышали,<br/>что я вышел в изгнание,<br/>и что Тора, данная с Небес, была сожжена.</p><p>Я стал для них удивлением и смешением.</p><p>И из Дома Святилища,<br/>где скрывается Шхина,<br/>ушла смена,<br/>место которой было в Бейт-Гамуль,<br/>и также место которой — Ховия.</p><p>Все народы услышали,<br/>что я осквернился грехами.</p><p>И Господь закрыл передо мной Свои врата,<br/>чтобы не принимать мои просьбы,<br/>не миловать меня и не проявлять ко мне милость.</p><p>И из Иерусалима вышла в изгнание смена <strong>Яхин</strong>,<br/>место которой было в Кфар-Юхана.</p><p>Да придёт зло на врагов,<br/>которые разорвали меня на части,<br/>и пусть будет им суд,<br/>ведь они превратили мои города в пустыню.</p><p>И Всевышний отстранил Свою руку от поддержки меня.</p><p>А из-за того, что поставили идолов в Храме,<br/>ушла смена <strong>Длаягу</strong>,<br/>место которой было в Гантон-Цалмин.</p><p>Даруй исцеление моей ране,<br/>и пусть тьма изгнания будет освещена через избавление.</p><p>Как трава поля восстанавливается,<br/>так укрепятся наши кости во время радости.</p><p>И запах наших жертвоприношений Ты снова примешь, как прежде.</p><p>И с престола хлебов предложения<br/>Ты будешь кормить священников,</p><p>и снова удостоятся этого<br/>священники смены <strong>Маазиягу</strong>,<br/>место которой было в Хамат-Арих.</p>", "subs": []}, {"id": "chapter-11", "title": "Кина 11", "html": "<p class=\"meta\"><strong>Тема:</strong> праведность царя Иошиягу и его смерть.</p><p class=\"meta\"><strong>Знак:</strong> алфавитный порядок (алеф-бет). Каждая часть начинается словом, взятым из первых слов стихов книги «Эйха йуам» (Плач Иеремии 4). Выражение «Эйха йуам» истолковывается как относящееся к смерти царя Иошиягу. В комментарии, приписываемом Раши к книге Диврей аямим II (35:22), приведены из этой кина буквы ד, כ и ל.</p><p class=\"meta\"><strong>Автор:</strong> рабби Элазар ha-Калир. Его имя зашифровано в конце произведения. Так же это приводится у Раши там.</p><p>«Как плачевно мы оплакиваем грех поколения царя Иошиягу.</p><p>В восемь лет он начал самостоятельно искать Всевышнего, потому что его отец служил идолам.</p><p>Фараон Нехо, царь Египта, когда выступил на войну, хотел пройти через землю Израиля, но Иошиягу не позволил ему.</p><p>И не удостоился Иошиягу того, чтобы Всевышний вспомнил ему заслугу в этой войне.</p><p>Ведь среди всех царей Израиля, которые пытались исправить разрушения и восстановить порядок, не было такого, как Иошиягу, который искоренил идолопоклонство со времён Моше-рабейну.</p><p>Но он был наказан из-за греха насмешников своего поколения: они тайно поклонялись дереву. Внутри дверей они сделали изображение дерева на двух половинах двери, и только когда двери закрывались, изображение становилось целым. Иошиягу не знал об этом.</p><p>Египтяне, жители Нила, потемнили лицо Иошиягу, которое было сияющим, и оно стало темнее, чем угольная черная птица.</p><p>И поскольку грех народа был велик, Всевышний удержал Свою правую руку от спасения их, и рука Его, поднятая для наказания за грехи отцов, не вернулась назад, чтобы отменить приговор.</p><p>Слова Иошиягу были справедливы, когда он сказал, что на нём лежит обязанность восстановить всю Тору в своём поколении.</p><p>Он разорвал свои одежды, когда Хилкия, первосвященник, принёс ему книгу Торы и нашёл в ней проклятие: «Проклят тот, кто не исполнит слов этой Торы». Ведь Иошиягу мог вернуть своё поколение к пути Торы, но до него этого никто не сделал.</p><p>Люди почернели лицами из-за своих грехов: они видели, как он раскаялся, но сами не раскаялись.</p><p>Они были грабителями, отвергшими законы Торы и её установления.</p><p>Фараон Нехо, хотя и выступал с добрыми словами, послал посланника к Иошиягу, чтобы попросить пропустить его через землю Израиля, говоря:<br/>«Что за спор между мной и тобой, из-за которого ты хочешь выступить против меня на войну?»</p><p>Это привело к тому, что руки народа земли наполнились кровью погибшего царя, и ты был наказан, ведь с разрешения Всевышнего я иду в Ассирию завершить гнев Всевышнего.</p><p>Египтяне убили множество людей по пути в Арам-Нахараим. Иошиягу отказался пропустить их, потому что истолковал стих:<br/>«Не пройдёт меч через вашу землю».</p><p>Он не прислушался к словам пророка Ирмиягу, который предупреждал его не выходить на войну, поскольку приговор был вынесен: враги будут сражаться друг с другом именно в их земле, а не на чужой территории.</p><p>Из-за греха, совершённого тайно за дверью, и из-за пророчеств Ирмиягу, призывавшего их к раскаянию, они начали презирать его слова.</p><p>Пришли египтяне и в битве унизили его тело. Поскольку он не отступил — он был убит, и по его смерти народ оплакивал его.</p><p>Его предупреждали вернуться назад ещё до начала войны.</p><p>Но Иошиягу отказался отступить, и пал праведник — основа земли.</p><p>Он вступил в битву, но его раны не получили исцеления, потому что стрелы лучников были выпущены в царя Иошиягу.</p><p>Пока он закрывал глаза перед смертью, стрелы продолжали входить в его тело — одна за другой. Они спешили стрелять и теснили его.</p><p>Они сделали его тело мишенью для стрел и выпустили в него триста стрел, пока оно не стало подобно решету.</p><p>Они наклонились к нему, когда увидели, что он шепчет губами, и подумали, что он, возможно, ропщет на суд Всевышнего.</p><p>Но до последнего вздоха его дела были прекрасны.</p><p>Они услышали слова, исходившие из его уст:</p><p>«Праведен Господь во всех судах Своих, ибо я не слушал голоса Его».</p><p>Радуйся, Египет, во время разрушения Израиля, но придёт день, когда Всевышний обратит на тебя Свой гнев.</p><p>Он воздаст множеству народов за их грабёж и насилие.</p><p>Завершилась жизнь Иошиягу, который был как прекрасное золото ради Израиля — народа, названного украшением, но согрешившего.</p><p>И оплакал его Ирмиягу словами:<br/>«Как потускнело золото».</p><p>Иошиягу, который приносил жертвы Всевышнему, был убит стрелами, как Ахав, который приносил жертвы самому себе. Чашу гнева Всевышнего в долине Мегиддо выпил Иошиягу.</p><p>В год шмиты, во время заповеди собрания (הקהל), когда весь народ пришёл, был убит Иошиягу.</p><p>Было достойно, чтобы Храм был разрушен уже тогда, но Всевышний проявил долготерпение ещё двадцать два года, пока не поднял руку на Храм и не изгнал Свой народ.</p><p>Ибо народ оплакивал Иошиягу, а Ирмиягу произнёс:<br/>«Как потускнело золото» — согласно порядку двадцати двух букв алфавита.</p><p>В порядке букв алеф-бет в этих плачах моя радость превратилась в скорбь.</p><p>Когда я забыл Всевышнего, моего Творца, я думал, что навсегда будет сиять надо мной свет Его Шхины.</p><p>Но когда я согрешил перед Ним, я отправился в изгнание, и Всевышний вышел из Храма, который защищал меня подобно шатру».</p>", "subs": []}, {"id": "chapter-12", "title": "Кина 12", "html": "<p class=\"meta\"><strong>Тема:</strong> Драгоценность Храма в глазах Всевышнего.<br/><strong>Знак:</strong> Ташрак (תשר\"ק) — порядок букв после начальных слов «אהלי אשר» («шатры, которые…»), «למה לנצח» («почему навеки…»), и других строк.<br/><strong>Автор:</strong> Рабби Элазар hа-Калир; его имя зашифровано в конце кина.</p><p><strong>Храм, который Ты желал ещё до сотворения мира,</strong><br/>который был создан вместе с Троном Славы и напротив него был установлен.</p><p>Почему же навеки он был предан разграблению в руки грабителей?</p><p>И Ты стал подобен пастуху, потерявшему своё стадо,<br/>который покрывает голову как скорбящий,<br/>и Ты печалился и жаловался после разрушения Храма:<br/>«Какое место осталось Мне на земле?!»</p><p><strong>Храм, который Ты возвысил благодаря заслугам праотцов,</strong><br/>которые являются опорой мира,<br/>при его разрушении содрогнулся Ицхак,<br/>когда Эсав вошёл и увидел разрушение, которое совершат его потомки.</p><p>Почему же навеки он был уничтожен народами?</p><p>И Ты стал, Всевышний, как одинокая птица,<br/>перепрыгивающая с крыши на крышу,<br/>и горьким голосом Ты воззвал к Аврааму, пришедшему оплакивать:<br/>«Что ты здесь делаешь?»</p><p><strong>Храм, о котором Ты говорил перед Моше-рабейну,</strong><br/>и передал ему стоя образ Храма,<br/>который должен был быть построен,</p><p>почему же навеки открылись его основания перед чужаками?</p><p>И Ты стал как враг и притеснитель,<br/>и где Твоё желание вновь пребывать в Сионе?</p><p><strong>Шатёр собрания (Мишкан), который Ты вёл в облаках славы,</strong><br/>и весь Израиль, вступивший в завет,<br/>стоял в этом месте.</p><p>Почему же навеки Ты отверг его в руках восставших против Тебя?</p><p>И Ты стал, Всевышний, как сильный воин, который не может спасти,<br/>а народы насмехаются и говорят:<br/>«На кого вы надеетесь, что Он вас спасёт?»</p><p><strong>Храм, который Ты основал напротив Небесного Храма,</strong><br/>который Ты желал защищать,</p><p>почему же навеки он был устранён высокомерными?</p><p>И Ты стал как птица, летящая в пространстве без отдыха,<br/>ибо Твоё Присутствие (Шхина) удалилось,<br/>и больше нет пророка,<br/>и сказано: «Не будет больше пророков».</p><p><strong>Храм, в котором Ты пребывал во всех его покоях,</strong><br/>со всех сторон,</p><p>почему же навеки он оставлен в руках чужих?</p><p>И Ты стал, Всевышний, как слабый человек,<br/>выходящий из дома, который разрушили его враги,<br/>и не идёт отомстить за своё разрушение.</p><p><strong>Храм, где священники бросали жребий для распределения служения,</strong></p><p>почему же навеки он отдан народам, наполненным кровью?</p><p>И Ты стал как чужеземец на земле,<br/>и сказал, что не войдёшь в Небесный Иерусалим,<br/>пока Израиль не войдёт в земной Иерусалим.</p><p><strong>Храм, который из-за греха погони за богатством погрузился во тьму,</strong><br/>хотя прежде он сиял как свет утра,</p><p>почему же навеки он затемнён руками чужих?</p><p>И Ты стал как путник в гостинице,<br/>которому будто бы нет здесь места для отдыха.</p><p><strong>Поколения, жившие до разрушения, и поколения после него знают о разрушении,</strong></p><p>ведь известно: каждое поколение, в дни которого Храм не был восстановлен,<br/>как будто само разрушило его.</p><p>Известен гнев разрушения Храма:<br/>за что больше всего Ты возложил руку Свою, чтобы разрушить меня?</p><p>Всем известно,<br/>что моё сокрушение было заранее начертано перед Тобой.</p><p>Я уверен в окончательном избавлении,<br/>ибо гнев Всевышнего — лишь как мгновение ока.</p><p>Но я всё же спрашиваю:<br/>как же до сих пор Ты затемняешь меня Своим гневом?</p>", "subs": []}, {"id": "chapter-13", "title": "Кина 13", "html": "<p class=\"meta\"><strong>Тема:</strong> Все спасения и чудеса, которые были совершены для Израиля, выраженные словом «כה» («так», «вот так»).<br/><strong>Знак:</strong> Алфавитный порядок (א״ב). Порядок букв начинается после вступительных слов: «Айе ко» («Где же это?»), «Ве-hен ата» («И вот теперь»). Последний стих основан на стихах из книги Тегилим (Псалмы 74:1–10).<br/><strong>Автор:</strong> Рабби Элазар hа-Калир.</p><p><strong>Где же обещание, которое Ты дал Аврааму, нашему праотцу,</strong><br/>ясным словом в союзе между рассечёнными частями жертвоприношений,<br/>когда сказал: его потомство будет как звёзды навеки?</p><p>А теперь мои кости сокрушены,<br/>они погибли от руки врагов.</p><p>Почему, Господи, Ты оставил нас навсегда?</p><p><strong>Где исполнение обещания,</strong><br/>когда Авраам привёл своего сына как овцу для жертвы,<br/>чтобы исполнить Твою волю?</p><p>Он сказал юношам:<br/>«Останьтесь здесь, а мы пойдём до этого места поклониться»,<br/>чтобы выполнить Твои заповеди.</p><p>А теперь мечом разрубают народ Израиля на части,<br/>и воспылал Твой гнев против Твоего стада — Израиля.</p><p><strong>Где обещание Яакову — о множестве стад,</strong><br/>которое было открыто ему в ночном видении?</p><p>Когда Лаван сказал:<br/>«Пусть будут пёстрые животные твоей наградой»,<br/>Всевышний поспешил помочь Яакову и умножил его стада.</p><p>А теперь Ты наказанием и укором поразил Иерусалим,<br/>наполненный людьми.</p><p>Возвысь разрушение над врагами Твоими,<br/>которые разрушили Твой Храм.</p><p><strong>Где «так», когда Моше-рабейну захотел убить египтянина</strong><br/>с помощью Святого Имени среди народа Израиля?</p><p>Он проверил свои дела и увидел,<br/>что из него выйдет будущее спасение,<br/>и убил египтянина так, что никто не узнал,<br/>потому что сыны Израиля не разгласили его поступок.</p><p>А теперь всё их добро исчезло<br/>в месяце, предназначенном для бедствия,<br/>из-за зла, которое враги сделали в Храме.</p><p><strong>Где исполнение обещания,</strong><br/>когда Ты послал Моше освободить Своих рабов<br/>словами: «Я буду тем, кто Я буду»?</p><p>Чтобы вывести их из Египта,<br/>чтобы они приняли Тору.</p><p>А теперь злодеи сидят в Твоём Храме<br/>и насмехаются внутри него.</p><p><strong>Где обещание,</strong><br/>когда после того, как в Египте забыли обрезание,<br/>они обновили завет и сделали обрезание перед жертвоприношением Песаха?</p><p>И сказал Господь:<br/>«В полночь Я выйду и совершу чудеса»,<br/>и поразил первенцев.</p><p>А теперь народы собрались,<br/>и в своих обувях вошли осквернять святость Храма.</p><p>Они сделали знак: стрелы упали в сторону Иерусалима —<br/>как предвестие того, что город будет завоёван.</p><p><strong>Где то «так», которое было сказано,</strong><br/>когда Моше поднялся на гору Синай<br/>и получил повеление передать Израилю важнейшую заповедь?</p><p>А теперь народы разгневали его.</p><p>Враги знали,<br/>что разрушение тяжело перед Всевышним.</p><p><strong>Где «так» из благословения священников,</strong><br/>в котором шестьдесят букв,<br/>которое превосходит другие благословения<br/>и начинается словами:<br/>«Так благословите…»?</p><p>Его буквы укрепляют шестьдесят воинов Израиля.</p><p>А теперь усилился Вавилон, который раньше был слаб,<br/>и его люди словно во сне.</p><p>Они бьют топорами по входам Храма,<br/>а дерево будто запутывает топоры,<br/>ломает их и поглощает.</p><p><strong>Где «так», когда Билам открыл свои уста, чтобы проклясть </strong><strong>Израиль,</strong><br/>но в конце благословил его?</p><p>А теперь они осадили святой город<br/>и подожгли Твой Храм.</p><p><strong>Где «так», сказанное при выборе левитов,</strong><br/>которые не согрешили с золотым тельцом?</p><p>Так был установлен порядок их очищения,<br/>чтобы они могли войти служить в Храме.</p><p>А теперь народы разрушили Храм,<br/>и Твоё Имя потрясено из места Твоего пребывания.</p><p>Земные злодеи осквернили жилище Твоего Имени.</p><p><strong>Где «так», сказанное священникам,</strong><br/>которые несли семь сильных шофаров?</p><p>Господь сказал им:<br/>«Шесть дней обходите город»,<br/>чтобы стены Иерихона упали на землю.</p><p>А теперь ворота Храма погрузились в землю.</p><p>Враги сожгли все Твои жилища и места собраний.</p><p>Филистимляне разрушили Мишкан в Шило,<br/>Навуходоносор разрушил Первый Храм,<br/>а Тит — Второй Храм.</p><p><strong>Где обещания утешения о Третьем Храме?</strong></p><p>Ведь именно «так» сказал Господь пророкам,<br/>и их пророчества сохраняются для будущего избавления.</p><p>А теперь изнемогающие от голода<br/>бросают цветы священников во дворе Храма.</p><p>До каких пор, Господи,<br/>враги будут насмехаться,<br/>ведь Ты отдал Своих детей в их руки?</p>", "subs": []}, {"id": "chapter-14", "title": "Кина 14", "html": "<p class=\"meta\"><strong>Тема:</strong> Разрушение Храма было предопределено заранее, но время конца и избавления было скрыто до его наступления.</p><p class=\"meta\"><strong>Знак:</strong> Тройной алфавитный порядок (א״ב משולש). Каждая часть состоит из четырёх строк. Автор — <strong>рабби Элазар hа-Калир</strong>.</p><p><strong>Как получилось, что приговор о разрушении был вынесен ещё до сотворения мира,</strong><br/>и с меня потребовали уплаты этого долга,</p><p>ещё до того, как были созданы небеса?</p><p>Ради меня было намекнуто в словах Торы,<br/>что Храм будет разрушен.</p><p>Разрушение Храма было скрыто в стихах Торы,<br/>а затем скрыто и его восстановление:</p><p>«И был вечер, и было утро» —<br/>это прекрасное указание на то,<br/>что прежде чем наступят будущие времена,<br/>Храм будет разрушен,<br/>а затем вновь построен во время окончательного избавления.</p><p>Из-за наших грехов разрушение Храма было записано заранее,<br/>ведь сказано:<br/>«Всё предвидено, но свобода выбора дана».</p><p>В Торе был начертан мрак изгнания,<br/>чтобы показать: будущее видели праотцы и пророки.</p><p>Они уже видели разрушенный Храм,<br/>и главы поколений знали о его гибели.</p><p>Ещё до строительства Храма было определено,<br/>что его стены будут разрушены.</p><p>Всевышний уменьшил величие Адама после его греха.</p><p>Мудрецы объясняют написанное:<br/>«Мои глаза видели зародыш твой» —<br/>что перед Адамом были показаны все будущие поколения.</p><p>Ему было открыто всё, что произойдёт в будущем.</p><p>Когда Адам вошёл в райский сад,<br/>после его греха Всевышний изгнал его оттуда.</p><p>Ему было показано, что грех как бы отталкивает ноги Шхины.</p><p>Это также было знаком его потомкам:<br/>из-за грехов, которые они внесут в Храм,<br/>он будет разрушен,<br/>ведь Шхина и грех не могут находиться в одном месте.</p><p>Сердце Адама болело,<br/>когда он увидел, что враг придёт к Храму,</p><p>и Всевышний будет оплакивать разрушение словами «Эйха» («Как?»),<br/>подобно тому как было сказано о грехе Адама.</p><p>Всевышний показал пророку,<br/>что разрушивший Храм разрушил его:</p><p>сломал стены,<br/>которые были готовы упасть,<br/>и ограды, которые были сняты со своих мест.</p><p>Чтобы будущие поколения научились оплакивать<br/>то бедствие, которое произошло.</p><p>Аврааму, нашему праотцу, Всевышний повелел выйти из земли его рождения.</p><p>В союзе между рассечёнными частями<br/>на него снизошёл свет пророчества.</p><p>Ему было показано рабство четырёх царств<br/>во время глубокого сна.</p><p>И Авраам закричал горьким голосом<br/>из-за будущего падения ворот Храма.</p><p>Он увидел разрушение Храма<br/>и снятие с Израиля его венцов:</p><p>венца Торы,<br/>венца священства,<br/>венца царства.</p><p>Также были потеряны святые предметы:</p><p>Ковчег Завета,<br/>стол хлебов предложения,<br/>золотой жертвенник.</p><p>Авраам увидел падение славы Израиля,<br/>и страх охватил его,</p><p>когда он увидел, что народ Израиля будет рассеян.</p><p>Но несмотря на это,<br/>он признал справедливость суда Всевышнего.</p><p>Авраам увидел своих детей в изгнании —<br/>нагими и униженными.</p><p>Он вздохнул.</p><p>И Ицхаку во время жертвоприношения<br/>была открыта тайна будущего изгнания.</p><p>Его глаза ослабли от слёз по разрушению Храма,<br/>и он не находил покоя,<br/>видя, что его потомков оставил Всевышний.</p><p>Яаков-авину отдалил от себя мысли о разрушении<br/>и о рабстве царств.</p><p>В пророческом сне он увидел ангелов народов,<br/>которые поднимались и спускались.</p><p>Он не поверил, что такое может произойти,</p><p>пока Всевышний не открылся ему на месте Храма.</p><p>Тогда он увидел его разрушение<br/>и заплакал:</p><p>«Это плач о разрушении».</p><p>Яаков размышлял и тревожился,<br/>когда увидел князей народов, которые поднимались и падали.</p><p>Когда он увидел подъём Эдома,<br/>он понял:</p><p>эти народы будут властвовать над Израилем.</p><p>Он спросил:</p><p>«За что мои дети, дети Всевышнего, стали виновными?»</p><p>И понял, что разрушение Дома произошло<br/>из-за их грехов.</p><p>Враги разрушили Храм.</p><p>Херувимы были изгнаны.</p><p>Гвоздями на своих сапогах они пробили пол Храма.</p><p>Где же сияние ворот Святилища?</p><p>Почему они были взяты от нас?</p><p>И вот — они скрыты в земле,<br/>потому что когда пришёл враг,<br/>они были погребены.</p><p>Кина 14</p><p class=\"meta\">Содержание: разрушение было предрешено заранее, но конец (время избавления) не был открыт до его наступления. </p><p class=\"meta\">Знак: тройной алфавитный порядок. В каждом разделе — четыре строки. Первая строка начинается словом из начала стихов «באיכה יעיב» (глава 2). Второе слово в строке также идёт в алфавитном порядке, однако после каждых двух разделов первое слово в первой строке совпадает с последним словом в четвёртой строке, а второе слово в первой строке начинается с буквы из имени автора по порядку его имени Элазар бен Риби Калир (буквы ליר его имени идут подряд в начале строк последнего раздела этого пиютa). Третья строка начинается словом по алфавиту, а после каждых двух разделов третья строка начинается с буквы из имени автора. Таким образом, имя автора дважды вплетено в этот пиют. </p><p class=\"meta\">Автор: рабби Элазар Калир.</p><p>Как же взыщешь с меня долг за разрушение, которое было предопределено ещё до сотворения мира?</p><p>Ещё до того, как были созданы небеса,</p><p>ради меня было намёком указано в полосах Торы, что будет разрушен Храм.</p><p>Он скрыл в словах о начале творения намёк на разрушение Храма, а затем и на его строительство, в стихе: «И был вечер, и было утро» — прекрасный намёк Того, Кто заранее знает будущее: что Храм будет построен, разрушен и снова построен в будущем избавлении.</p><p>Из-за наших грехов разрушение Храма было начертано, ведь всё предвидено, но свобода выбора дана.</p><p>В Торе был начертан мрак изгнания, чтобы показать, что будущие события были предвидены. Отцы и пророки уже видели разрушенный Храм, и главы поколений знали о его разрушении ещё до его строительства: было предрешено, что его рога будут отсечены.</p><p>Всевышний уменьшил величие Адама после его греха, и поколения и их толкователи нашли это записанным. Перед Адамом были открыты слова стиха: «Зародыш мой видели глаза Твои», что является дополнительным доказательством того, что перед ним были проведены все будущие поколения.</p><p>Едва Адам вошёл в Ган Эден,</p><p>Всевышний изгнал его оттуда после</p><p>его греха</p><p>и показал ему, что грех словно отталкивает ноги Шхины. Это также было знаком для его потомков: из-за греха, который они внесли в Храм, будет разрушен Дом, потому что Шхина и грех не могут находиться в одном месте.</p><p>Боль охватила сердце Адама, когда он увидел, что в будущем враг придёт к Храму и Всевышний будет оплакивать разрушение языком книги «Эйха», которая была предсказана через грех Адама.</p><p>Всевышний показал Адаму, что разрушенный Дом будет разбит: стены наклонятся к падению, а ограды будут сняты со своих мест,</p><p>чтобы поколения научились оплакивать</p><p>разрушение, которое произошло.</p><p>Аврааму, нашему праотцу, Всевышний велел выйти из земли его рождения.</p><p>В завете между рассечёнными частями ему был открыт свет пророчества, и в его сне ему были показаны порабощения четырёх царств. Авраам закричал горьким голосом</p><p>из-за потопления ворот Храма.</p><p>Он уничтожил Храм и снял</p><p>с Меня венцы: венец Торы, венец священства и венец царства; также были убраны заслуги Ковчега, стола и золотого жертвенника, на которые есть намёк.</p><p>Он увидел отвержение славы Израиля, и ужас охватил его, когда он увидел, что народ Израиля будет рассеян, однако, несмотря на это, он оправдал меру суда, когда всё это увидел.</p><p>Авраам увидел своих детей в изгнании — нагих и обнажённых, — вздохнул, а Ицхаку во время связывания открыл тайну изгнания.</p><p>Его глаз, плакавший о разрушении, потускнел, и не было ему покоя, когда он увидел своё потомство, которое добрый Всевышний оставил.</p><p>Удалил от Яакова, нашего праотца, пророчество о разрушении и порабощении царствами. Он увидел во сне лестницу, но не поверил, что такое случится, пока Всевышний не открылся ему на месте Храма, и он увидел его разрушение и оплакал: «Это — о разрушении».</p><p>Яаков думал и тревожился, увидев князей народов, которые поднимались и спускались, а при подъёме Эдома понял, что они будут властвовать над Израилем. Он спросил: за что мои дети, народ Всевышнего, были осуждены и почему с них взыскивается разрушение Его Дома за их грехи?</p><p>Враги разрушили Храм, и херувимы были изгнаны. Гвоздями в своих сапогах они пробили землю Храма.</p><p>Сияние ворот Святилища — почему они были взяты от нас? Ведь они спрятаны в земле; когда придёт враг, они погрузились туда.</p><p>Колена, измученные в Египте, просили узнать время избавления, ведь Яаков был готов открыть конец, но после того как Всевышний открыл ему приготовленный конец,</p><p>Он скрыл это и сдержался от раскрытия, и время конца осталось сокрытым.</p><p>Сидели сыновья Яакова и спрашивали своего отца узнать время конца,</p><p>время конца, которое было скрыто от Яакова, — когда оно откроется?</p><p>Когда они смогут надеяться на приход спасения, но его время неизвестно,</p><p>пока не наступит «в своё время» или «ускорю его», и тогда оно станет известным.</p><p>Узнать тайну избавления их сердце стремилось, но она скрылась от них, и Израиль не смог раскрыть её. От просьбы отомстить разрушителям Твоего Дома их сердца сгорели, и от великой скорби их жизни угасли.</p><p>Закончились мысли Моше Рабейну, когда Всевышний послал его вывести Свой народ, и он попросил Всевышнего послать того, кто в будущем освободит их вечным избавлением. Ведь какая мне польза быть посланником сейчас,</p><p>а в будущем Элиягу из Гилада спасёт их?</p><p>К их матерям с полным сердцем обращались младенцы у Красного моря:</p><p>«Когда придёт этот день?»</p><p>Они страстно ожидали будущего, когда придёт Всевышний. Он вложил в их сердца мудрость, чтобы они воспели у Красного моря:</p><p>«Господь будет царствовать вовеки» — чтобы Его царство открылось с поднятой рукой.</p><p>Всевышний явился с силой Своей левой руки,</p><p>и также откроется с силой Своей правой руки, которой будет построен Храм обеими Его руками.</p><p>Когда Его сыновья увидели Его гнев,</p><p>излитый на них как дождь,</p><p>их душа не выдержала изгнания Эдома, и они просили узнать, почему всё это произошло.</p><p>Отвечает Всевышний: «Какую несправедливость вы нашли во Мне,</p><p>что вы восстали против Меня?</p><p>Ещё в пустыне вы восставали против Меня,</p><p>и до сих пор вы не верите в Меня».</p><p>Пророки, ученики Моше Рабейну, который стоял в проломе в их дни, — проломы были расширены в ограде.</p><p>Всевышний открыл Своим пророкам, что в Его сердце есть желание отомстить за грехи Своих сыновей, однако они должны были проложить им путь к раскаянию. Но пророки не смогли освятить их из-за лжепророков.</p><p>Мудрецы каждого поколения пытались узнать тайну избавления и углублялись в этом, когда слышали клятву Всевышнего не приближать конец.</p><p>Их силы ослабевали.</p><p>Вместе, когда они поняли, что изгнание затягивается, их сердца растаяли от скорби, и, словно скорбящие, они хлопали ладонями.</p><p>Хлопали в ладоши от великой радости люди, вошедшие в землю во времена Йеошуа, когда в их руки пали тридцать один царь народов.</p><p>Тогда они надеялись, что Всевышний, спасший их, будет всегда доволен ими,</p><p>и через них будет построен Храм, который является радостью всех жителей земли.</p><p>Они открыли уста и провозгласили: «Праздник Господу» в Ту бе-Ав в Шило.</p><p>Они думали, что навечно останется там Его Шхина,</p><p>но когда сыновья Эли совершили грех, поступали ложно и после осквернения святыни — Всевышний разрушил Скинию,</p><p>пока не придёт Машиах и не построит Храм.</p><p>Скиния в Шило была желанна, как «халла» — первая часть теста, но Он отверг её, когда там согрешили, проявив неуважение к святыням. Они увидели, что делает грех: из-за него был разрушен Дом. Отсюда учатся, что всё происходит согласно воле Всевышнего.</p><p>Всевышний совершал с нами чудеса, когда был доволен нашими путями, а когда из-за жестокосердия Он поспешил принести наказание, мы испугались без отдыха, как стоящий под солнцем во время засухи, пока Всевышний не осветит Храм Своим светом.</p><p>Кричит житель Сиона: как произошло такое, что на меня было возложено рабство жестокого и наглого народа, который радовался и топтал порог Храма, и в своём гневе навёл на меня страх?</p><p>Он навёл Свой ужас на народы в то время, когда Всевышний поднял меня к Себе. Я думал в своём сердце, что навеки буду стоять в земле, но я был посрамлён и унижен, когда грех вошёл в Храм.</p><p>И в гневе Он сказал мне: «Встань и выйди в изгнание».</p><p>«Встань, — услышал я голос, когда Всевышний удалил Свою Шхину. — Встань и иди в изгнание, потому что в этой земле ты больше не найдёшь покоя. Я отверг жизнь в скорби и вздохах разрушения,</p><p>и приносил жертвы, но моё приношение не было принято».</p><p>Увидь, Всевышний, тяжесть моей оставленной души,</p><p>лишённой мира, спокойствия и отдыха.</p><p>Пробираясь в горах тьмы, брошенная, когда разбойники вели нас ночью, и наши ноги спотыкались.</p><p>Даже в изгнании моя душа не нашла покоя.</p><p>Обрушился удар руки Всевышнего на Израиль, и вместе с ним были сожжены.</p><p>Низкие враги стали властвовать над их головами.</p><p>Они плакали у рек Вавилона в час своего отдыха.</p><p>И поскольку они насмехались над словами Всевышнего, они были наказаны на чужой земле, где стали посмешищем.</p><p>Разбойники лежали в покое, а тела Израиля они пронзали.</p><p>Они издевались над ними, словно над животными.</p><p>Их тела были растерзаны; когда их животы вскрывались, запах жареного мяса врага распространялся, а острые воды Евфрата пронзали их внутренности.</p><p>Приблизится день мести — чтобы уничтожить их и напоить чашей яда тех, кто оставил нас.</p><p>Стражи Дома разрушили его, а разрушители уничтожили его.</p><p>И все народы удивлялись падению Израиля,</p><p>и о них скорбят: «Сыны Сиона, как такое могло с ними случиться?»</p><p>Отцы Израиля подняли голос в Раме в своём плаче:</p><p>«Почему и за что произошло такое?»</p><p>Вместе они поняли, что Израиль нарушил слова Торы и слова пророков.</p><p>Они сетовали, что им пришлось заменить и прочитать слово «Эйха» («Как?») вместо «Ай ко» («Где обещанные блага?») — языка добрых обещаний.</p>", "subs": []}, {"id": "chapter-15", "title": "Кина 15", "html": "<p class=\"meta\">Содержание: разрушение и страдания в плену.</p><p class=\"meta\">Знак: тройной алфавитный порядок. Каждый раздел состоит из четырёх строк, каждая строка разделена на три части. Первые части открываются словами из начала стихов трёх первых глав книги «Эйха»: «Как сидела» (гл. 1), «Как омрачил» (гл. 2), «Как потускнело» (гл. 4). Также второе слово в этой части идёт по порядку алфавита. Третьи части основаны на стихах «Я — человек» (гл. 3). Строки первых частей открываются словами из начала стихов «Вспомни, Господь» (Эйха, гл. 5), и второе слово в этой части идёт по порядку алфавита. Третьи части основаны на стихах из книги Ваикра (гл. 26, стихи 25–46). Таким образом, алфавитный знак находится во всех частях — десять раз. Автор: рабби Элазар Калир.</p><p>Как же произошло, что мой колчан был открыт, чтобы стрелять в меня, как могила, приготовленная для наказания,</p><p>и народам, властвующим надо мной, в гневе Всевышний добавил крыло, чтобы они пришли быстро.</p><p>«Я — тот человек, который видел всё это».</p><p>Сказал Всевышний: «Как мне нести грех оставления Торы,</p><p>когда уста Моих сыновей были закрыты от молитвы,</p><p>когда закрылись врата молитвы?</p><p>Поэтому меня увели в изгнание».</p><p>Как быстро вспыхнул Его гнев, чтобы излить его,</p><p>ведь сказал Всевышний: «Я устал терпеть грехи Израиля», и сказал:</p><p>«Я изолью Свой гнев»,</p><p>и все Его удары обрушились на меня.</p><p>Вспомни мой грех, который окружил меня в пустыне Хорев, когда я сделал золотого тельца.</p><p>Ты сказал, что этот грех не будет стёрт до разрушения Храма, который будет подожжён огнём вечером.</p><p>И тогда Я взыщу с вас за грех тельца, когда приведу на вас меч.</p><p>Я буду много плакать в час, когда у меня отняты служение Храма, пророчество, священство и царство. И поскольку я оставил прямой путь, Всевышний наказал меня, пока не разрушил мою плоть и кожу.</p><p>Он разрушил Храм, который стоял прямо и высота которого была сто локтей, крепкий как железо. Так же с силой Он уничтожил моих важных людей и окружил меня бедами.</p><p>Указ о поедании детей услышал я от Мореи и Египта, и от этой скорби Он повернул меня назад, как беглеца, и в изгнании, подобном тьме, поселил меня.</p><p>Когда Храм был предан в руки врага, сказал Всевышний: «Я не пожалею и не помилую, и разрушу для вас источники пищи».</p><p>Изгнан был Израиль, который очистил себя, как драгоценные сосуды, чтобы носить венцы, данные ему при даровании Торы,</p><p>когда они ещё стояли у горы Синай. К изгнанию они были предназначены из-за греха тельца.</p><p>Всевышний поставил передо мной стену, чтобы я был заключён в изгнании.</p><p>Он сломил гордость князей</p><p>и отвёл Свою правую руку назад, чтобы не спасать меня, даже когда я взывал к Нему и просил помощи.</p><p>Также усилились надо мной враги, которые поработили меня тяжёлым рабством.</p><p>И от крика моей молитвы Он закрыл окна небесные, чтобы не принять мою молитву,</p><p>закрыл мой путь, чтобы я не мог вернуться из изгнания.</p><p>Израиль называют сиротами в изгнании, потому что их Отец удалил от них Свою Шхину. Они были изгнаны из Иерусалима, и Он не отступил от Своего гнева, сказав: «Если и после этого вы не послушаете Меня, Я продолжу наказывать вас».</p><p>Дороги Сиона, наполненные радостью и благодарностью в праздничные дни, закрылись колючками, и они скорбят. В изгнание Вавилона Он повёл меня в железных цепях. Тот, кто был моим светом, превратился во тьму.</p><p>Враг ступил на меня, тот, кто теснил меня от беды к беде, возложил на мою шею ярмо, чтобы властвовать надо мной. «Оставьте меня и не утешайте меня». С большим плачем я огорчу сердца слушающих, потому что там, где была моя слава, выросли колючки.</p><p>Меня настигли преследователи и поймали в свою сеть. На меня направили острие меча и приготовили лук, чтобы стрелять в меня.</p><p>Мои лучшие дни он омрачил и сказал, что сделает нас пустыней. Даже в глубину изгнания он бросит нас, чтобы посрамить нас, и пойдёт с нами в ярости Своего гнева.</p><p>Были крики «О горе!» В дни моего плача моё лицо обожглось и опалилось от множества слёз. Жар проник внутрь моих почек.</p><p>Передо мной был враг, а я был позади него. Как сладким вином, он напоил меня моей кровью, и я стал посмешищем в глазах всех народов.</p><p>Израиль, который ел святыни пасхальной жертвы в ночь охраны,</p><p>теперь от голода ел голову осла — презренную и дешёвую пищу. Я насытился горечью.</p><p>На наши шеи поднялись многочисленные грехи, которые стали как плетение и привели к разрушению Храма.</p><p>И сказал Всевышний: «Я взыщу за ваши грехи и накажу вас тем, что вы будете есть плоть ваших сыновей. Красивые дочери Иерусалима — на их головах появилась проказа, а князья выбросили их и сломали их».</p><p>Он навёл на меня тяжёлые страдания, потому что я насмехался над словами пророков и не принял наставления. Были сломаны мои зубы, когда в моей пище оказался песок.</p><p>Он разрушил Храм и удалил Свою Шхину, и покрыл меня пеплом, как сосуд, перевёрнутый лицом вниз.</p><p>После того как Он возвысил меня до небес, Он низверг меня на землю одним ударом ила, и я был осквернён.</p><p>Моя душа была оставлена без мира.</p><p>Он увеличил и усилил крики моих стенаний, и на моей голове поднялись мои крики, потому что я бросал слова наверх, повышая голос. Я думал, что мой мир и моя надежда потеряны.</p><p>К Египту и Кушу сказал Всевышний: «Я возвращу вас и буду судить вас согласно вашим злым мыслям, разрушу ваши башни и крепости».</p><p>Всевышний вспомнил то, что я испортил делом золотого тельца, и Израилю, которого называют «невестой», Он сказал, что из-за этого они спустятся со своей славы. Вспомните мою скорбь и мой плач.</p><p>Всевышний оставил Свой Храм и ожесточил Своё сердце, чтобы не утешаться о Своих сыновьях. И из-за Своего гнева на Йошиягу, царя Иудеи, Он поразил его. Когда я вспоминаю это, моя душа унижается от великой скорби.</p><p>Я принесу перед Всевышним заслуги отцов и их добрые дела, чтобы Он смилостивился надо мной, потому что умножились мои грехи и я не могу оправдаться в суде без их заслуг. Я понимаю, что моё спасение возможно только благодаря заслугам отцов.</p><p>Наши отцы взывали в скорби, и их жизни закончились из-за греха разведчиков, когда они приняли их слова вместо слова Всевышнего. И Всевышний сказал о наших грехах: «Так как их много, Я отдам ваши города на разрушение».</p><p>Всевышний увидел во мне тяжёлый грех, и из-за него были записаны наказания. Они пришли из-за греха золотого тельца в пустыне, где мы осквернились. Тем не менее мы ожидаем спасения Всевышнего, чьи милости не прекращаются.</p><p>Враг, который поработил нас тяжёлым рабством, думал искоренить сынов Израиля. И они будут горько плакать о разрушении Храма, которое видят ангелы каждое утро.</p><p>Прекратилось пророчество, прекратили священники своё служение, поэтому стены стали для меня как для слепого — я ощупываю их.</p><p>Всевышний — моя доля, сказала моя душа, и поэтому я буду надеяться на Него.</p><p>Халдеи, называемые рабами, удерживали меня от того, чтобы стоять в проломе. С тяжёлыми упрёками сказал Всевышний уничтожить меня и сделать пустынной мою землю.</p><p>Нечистота идолов соединилась со Шхиной, когда они поставили их в Храме. И Всевышний протянул мерную верёвку разрушения, чтобы уничтожить их. Но даже в изгнании Он не перестал желать спасти тех, кто ревнует о Нём. Благ Всевышний к ожидающим Его спасения.</p><p>Погрузились чертоги Храма, и от множества бед мои уста замолчали.</p><p>Все проходящие и возвращающиеся поражались моей низости.</p><p>Поэтому хорошо человеку молча ожидать спасения Всевышнего.</p><p>Лучшие из маленьких детей исчезли, когда я продолжал грешить.</p><p>И как умножались злые дела, так усиливался гнев Всевышнего на меня. Поэтому хорошо человеку привыкать к исполнению заповедей с детства.</p><p>С опасностью для жизни мы приносили пищу для еды.</p><p>Как зерно, найденное на гумне и рассыпанное ветром,</p><p>так сказал Всевышний, что Он рассеет нас.</p><p>Рука Всевышнего бросила в меня огонь, как в Сдоме.</p><p>Кроме того, я был наказан за своё высокомерие, поэтому мне пришлось сидеть в одиночестве и молчать.</p><p>Сидели в печали сыновья на месте разрушения Дома, где находилось жилище Всевышнего.</p><p>Потому что гнев Всевышнего тяжёл для меня. От множества бед каждый склоняется до праха и наполняет им свои уста.</p><p>Руки наказывающего обрушили на меня удары, и я услышал от врага: «Смири себя и служи мне». Я предал себя его ударам.</p><p>Кожа наша потемнела и высохла, как глина, и была уничтожена. Наши спины согнулись к земле. Опустошение земли в течение семидесяти лет искупало гнев Всевышнего за то, что мы нарушали годы Шмиты и юбилея.</p><p>Вся наша красота потемнела,</p><p>но я утешился Всевышним, чьи пути — милость, и Он никогда не оставит нас навсегда.</p><p>Мы почти полностью исчезли, когда Всевышний сражался со мной, но Его злой замысел превратился в добро.</p><p>Хотя человек сам навлекает на себя скорбь своими грехами, Всевышний милует его.</p><p>Утихомирил Всевышний Свой гнев, когда поджёг Храм, но только спустя шесть лет Гавриэль бросил угли после того, как они остыли в его руках. Это показывает, что Он разрушил Дом не по Своему желанию, а из-за грехов Израиля.</p><p>Израиль, чьи силы иссякли как у женщин, униженные, как женщина с распущенными волосами, сидят в трауре каждый год в Тиша бе-Ав и признают, что из-за их грехов был разрушен Дом.</p><p>Так происходит все годы разрушения.</p><p>Не постигла врагов, угнетающих Израиль, такая беда, как беда Израиля. Ведь он уподобляется мерам Всевышнего, и на Свой народ Он послал волны бедствий, как волны моря, чтобы покорить их Себе.</p><p>Сыновья взывали к своим матерям, когда желали есть. Наказание пришло, потому что они открыли свои глотки, как могила, поглощающая тело: они поглощали чужое имущество, а также брали взятки, чтобы искажать суд людей.</p><p>«Не сотру, — сказал Всевышний, — имя Израиля.</p><p>И как же из ножен Он вынул Свой меч, чтобы уничтожить нас?</p><p>Искажать человеческий суд при Своём суде — не было угодно Ему, но только наши грехи привели к этому».</p><p>Князей Израиля, скованных цепями, вывели из ворот Иерусалима,</p><p>чтобы сделать их подобными испорченным и грязным смоквам.</p><p>Также и остаток Израиля враг продолжил изгонять.</p><p>С небес был написан свиток наказания, в котором были записаны четыре выражения скорби:</p><p>стоны, плачи, размышления и горе — потому что Всевышний повелел, чтобы это произошло.</p><p>Какое сравнение я приведу тебе, чтобы ты утешилась в своём наказании? Ведь не было народа, подобного тебе, отданного в руки спорящих с тобой. По слову Всевышнего не определяется ни зло, ни добро — только дела человека являются причиной.</p><p>О моих грехах, которые привели ко мне лжепророков, отдаливших меня от пути Всевышнего, мне следует скорбеть.</p><p>Всевышний подобен пьяному, который пробуждается</p><p>от своего вина — с песней и криком.</p><p>О чём должен скорбеть живой человек, если не о своих грехах?</p><p>Юноши пошатнулись в своей силе, Всевышний умножил тех, кто спотыкается, и Шхина удалилась из нашей среды. Из-за этого каждый падал перед своим братом, словно перед мечом.</p><p>Он поставил перед Собой груз наших грехов, которые под бременем бедствий сокрушают</p><p>и ломают нас. Он отверг жертвы, которые мы приносили перед Ним.</p><p>Проверим наши пути и вернёмся к Всевышнему.</p><p>Лжепророки оскорбили Всевышнего и движением глаза обещали ложные утешения. Они стали жестокими к нам, тогда как Всевышний — Тот, чья мера долготерпения велика.</p><p>Поэтому поднимем наши сердца и наши руки, чтобы вернуться в раскаянии.</p><p>Они качали головами и удивлялись, видя величину нашего падения. Даже злодеи, которые поймали меня в сети изгнания, удивлялись этому, потому что знали, что мы согрешили и восстали.</p><p>Отцов и сыновей было очень много,</p><p>а народы сделали их притчей среди народов,</p><p>как сказал Всевышний, что мы будем потеряны среди народов.</p><p>Он растоптал священников, приносивших перед Ним благовония. Я открыл свои уста и проглотил наказание.</p><p>Ты поставил преграду между нами и Тобой в гневе Твоём и преследовал нас этим.</p><p>Мои враги хлопали в ладоши от радости, и моё сердце разорвалось внутри. Я кричал о совершённом ими насилии надо мной, скорбным голосом говорил о том, что Ты поставил облако, чтобы не принять мою молитву.</p><p>«Отойдите от нас, нечистые кровью», — говорили наши разрушители,</p><p>когда наши небеса были словно железо, многие умерли от голода, и наш народ стал отвратительным и презренным среди народов.</p><p>Прекратилась радость, когда опустошились левиты-певцы, а враги преследовали быстрее орла, чтобы убить оставшихся.</p><p>За чудо сгустка крови на завесе Храма они мучили меня словами оскорбления и усилили свои насмешки, совершая мерзость в Храме. Они открыли свои уста против меня, говоря: «Где Тот, о Ком я слышал: “Я услышу Его голос”?»</p><p>Они открыли свои уста, чтобы поглотить меня больше, чем сегодня. И в изгнании они замкнули меня через наказание Всевышнего, который предупреждал меня, что я убегу от одного страха и упаду в другой, но я не прислушался.</p><p>Вид великолепия Храма</p><p>Всевышний уничтожил и поднял против меня врага, мучителя. Из-за этого мои глаза прольют много слёз.</p><p>Пали царство и Храм, которые были силой и опорой Израиля. Всевышний притеснил меня семью видами суда, чтобы я признал свои грехи и вернулся к Нему.</p><p>Сион распростёрла руки и сказала:</p><p>«Горе мне, потому что я передана в руки врага. Вместо того чтобы препоясать чресла силой, я лишь слабо подпоясываюсь и поражена ужасом. Мои глаза проливают слёзы в плаче».</p><p>Всевышний поразил меня в Своём гневе, и ярость Его распростёрлась надо мной.<br/>Он уничтожил нечестивых и
