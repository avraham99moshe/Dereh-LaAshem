з Израиля, которые своим спором между Богом и Его народом возбуждали раздор,<br/>пока Он не возвратится и не увидит моего унижения.</p><p>Шхина покинула Храм и поднялась в высоты небес.<br/>Десятью переходами поднял Всевышний Своё присутствие, — быть может, Израиль раскается.<br/>От этого мои глаза наполнились слезами, и лицо моё стало униженным.</p><p>Из-за этого был разрушен Храм — красота Израиля и его величие.<br/>Но сказал Всевышний, что не оставит их в изгнании навсегда.<br/>И Я пойду с ними в изгнание, чтобы хранить их.</p><p>Господь считал мои шаги прежде моего греха, чтобы они не были потеряны.<br/>Но когда я исказил Его прямые заповеди и отверг их,<br/>тогда враги поймали меня без причины, как птицу в ловушку.</p><p>Возопил Господь в вышине и закрыл врата небес,<br/>чтобы крик народа Израиля и его молитва не проходили.<br/>Когда я осквернил Его святость,<br/>Он приготовил оружие Своей войны против меня — и заключили меня в плен.</p><p>Враги подстерегали меня на каждом шагу,<br/>а Господь, Который прежде заботился о моём благополучии, отдалился от меня,<br/>когда они поднялись искать моего зла.<br/>Беды словно покрыли мою голову.</p><p>На горе Сион собрались войска, чтобы уничтожить её жителей,<br/>но Господь сказал, что пощадит остаток Израиля<br/>и вспомнит Свой завет с праотцами.</p><p>Я воззвал к Всевышнему, чтобы Он услышал слова оскорблений моих мучителей,<br/>которые бьют детей по щекам.<br/>Поэтому я призвал Твоё имя, Господь.</p><p>Встань, Сион, и воззови к Господу,<br/>ибо Твоя молитва не вернётся напрасной.<br/>Полное возмездие Он воздаст тем, кто гневил Его,<br/>как Ты услышал мой голос — так и ныне не закрывай ухо от моей молитвы.</p><p>Халдеи разрушили Храм,<br/>а Ты словно сделал вид, что не видишь.<br/>Пусть народы возвратятся и убоятся Тебя.</p><p>До сих пор Ты приближался ко мне, когда я взывал к Тебе,<br/>приблизься же ко мне снова в день, когда я призову Тебя.</p><p>Имя Твоё, Господь, — потому что Ты верен исполнить Свои слова.<br/>Несомненно, придёт избавление, и Ты не отменишь Своего обещания.<br/>До каких пор я буду как заброшенный лес,<br/>который никто не охраняет,<br/>и земля будет лишена своих сыновей?</p><p>Увидь гнев и горечь моей слабости,<br/>которыми поразил меня враг.<br/>И я скажу тогда, когда Господь воздаст врагам нашим:<br/>хотя Он как будто оставил меня в забвении,<br/>Он не оставил меня полностью,<br/>а вступится за мою тяжбу и искупит мою душу из их рук.</p><p>Увидь весь мой страх,<br/>увидь разрушение моего собрания.<br/>Ты видел, Господь, что сделали со мной мои враги.</p><p>Дух мой ослаб внутри меня от великого ужаса перед ними.<br/>Они хотели поглотить меня и навлекли на меня свой гнев.<br/>Но Ты, Господь, видел все их дела.</p><p>Почему, словно бы, Ты стоишь напротив нас,<br/>когда враги нас поносят?<br/>Ты сказал, что опустошённая земля будет заселена без страха врага,<br/>и также обещал: «И при всём этом…» — не отвергну вас.</p><p>Народы услышали, что я пал в их глазах,<br/>и пришли многочисленные, как саранча,<br/>затемняя землю, чтобы отомстить мне.<br/>Кто даст, чтобы Ты услышал их оскорбления<br/>и отомстил им?</p><p>Лежат согбенные и пленённые сыны Израиля<br/>от великой скорби,<br/>а разбойники и враги мои чрезвычайно возгордились.<br/>Их слова — против нас, и их мысли — против нас.</p><p>Радуйся, Эдом, похитивший меня,<br/>ибо ныне моя рука опущена вниз,<br/>я унижен до могилы.<br/>Ты всегда держишь меня в устах своих, чтобы причинить мне зло,<br/>но увидит это Господь.</p><p>Верни нас в Иерусалим,<br/>возмести нам годы нашего пребывания в изгнании,<br/>и скажи, что избавишь нас от множества народов.<br/>Исполни для нас завет праотцов.</p><p>Приди, взгляни на моих мучителей,<br/>которые стремятся уничтожить меня.<br/>Они сильны, а Храм мой разрушен.<br/>Пусть Ты воздашь им Своим возмездием.</p><p>Провозгласи и открой день избавления,<br/>скрытый у Тебя.<br/>Сделай добро нам — убери от нас сокрушение сердца.</p><p>Пошли вскоре Свою помощь<br/>и помилуй нас,<br/>ибо мы — Твои дети,<br/>ожидающие Твоего спасения.</p><p>Ибо постоянно народы поражают нас<br/>и насмехаются над нами своими словами.<br/>Но мы не отдаляемся от Твоей Торы.<br/>Благодаря этому возврати нас, Господь, к Себе<br/>и научи нас исполнять эти законы.</p>", "subs": []}, {"id": "chapter-16", "title": "Кина 16", "html": "<p class=\"meta\">Тема: Деяния Тита при его вступлении в ХрамАвтор: рабби Элазар hа-Калир</p><p>Вспомни, что сделал Тит,<br/>в углах Дома Святого.</p><p>Он обнажил свой меч, когда вошёл в Храм,<br/>и Иерусалим был потрясён его нечистотой.<br/>Он осквернил хлебы лица,<br/>благодаря которым земля получает благословение.</p><p>Он пронзил своим мечом завесу, сотканную<br/>с изображением льва с одной стороны и орла с другой.</p><p>Народ Израиля, оставшийся словно сироты,<br/>отвергнутый, он был поражён оружием,<br/>красным от крови убитых.</p><p>Их пересчитали, проверили и приговорили к смерти,<br/>а зрелище было красным, как кровь.</p><p>Тору он заставил забыть, уничтожив наших великих мудрецов.<br/>Он был словно опьяневший —<br/>его стрелы были полны крови,<br/>когда он вышел из Храма,<br/>а его меч был наполнен кровью, которая чудесным образом стекала с него.</p><p>Из-за злого замысла Тита<br/>он поднял свою руку против Господа, говоря,<br/>что одержал победу над Ним.</p><p>Он сказал:<br/>«Египет и все народы — даже над ними Господь одержал победу,<br/>а я внутри Его Храма стою с поднятой головой».</p><p>Во времена наших отцов<br/>Надав и Авигу принесли чужой огонь<br/>и были немедленно сожжены небесным огнём.</p><p>А Тит ввёл в Храм распутную женщину —<br/>и огонь не поглотил его.</p><p>Вавилоняне зажгли огонь в Храме.<br/>Почему же в Доме Господа,<br/>который есть огонь, пожирающий огонь,<br/>Господь послал огонь с небес?</p><p>Душой своей мы думали, что погибли,<br/>когда Тит вынес священные сосуды<br/>и положил их на свой корабль,<br/>чтобы использовать их.</p><p>Наша кожа растаяла от страдания,<br/>когда утром священнослужитель пришёл<br/>и не нашёл девяносто трёх сосудов,<br/>необходимых для ежедневного служения.</p><p>Женщины, увидев, что пришёл могучий Тит,<br/>который своими сапогами пробивал пол Храма,<br/>ужаснулись.</p><p>Князья Израиля содрогнулись,<br/>когда злодей Тит вошёл<br/>в Святая Святых<br/>и внёс туда свою нечистоту.</p><p>Юноши стояли снаружи уверенные,<br/>что злодей не войдёт.<br/>Они думали, что при его входе<br/>его уничтожат шестьдесят тысяч вредоносных ангелов.</p><p>Но старцы испугались,<br/>увидев, что ему было дано разрешение с Небес<br/>исполнить своё намерение,<br/>а Господь словно связан цепями и молчит.</p><p>Прекратилось царство Израиля,<br/>и сразу пришло царство Рима.</p><p>Его войска окружили стены<br/>и разрушили Иерусалим.<br/>В нём погибло великое множество людей,<br/>и ярость обрушилась на сынов Яакова.</p><p>Так продолжалось,<br/>пока Храм не был оставлен Небесами.</p><p>У входа на Храмовую гору<br/>Тит начал своё наступление<br/>и разделил разрушение Храма между четырьмя главами своих войск.</p><p>Тот, кому была поручена четвёртая часть,<br/>оставил остаток для памяти.</p><p>И Господь стоял позади Западной стены<br/>и не вступил в борьбу.</p><p>Ты разгневался<br/>и позволил вывести из Храма детей,<br/>в которых не было никакого порока.</p><p>Почему собрались народы против нас?<br/>Почему Ты не принял мою молитву?<br/>Почему не обратил внимания на моё приношение?</p><p>Враги отправили юношей и девушек<br/>в землю Уц на трёх кораблях.</p><p>Они молились, желая вернуть себе жизнь будущего мира,<br/>стоя перед бушующими волнами моря.</p><p>Когда они почувствовали,<br/>что их ведут к позору и плену,<br/>они решили броситься в море.</p><p>Они пели песни и восхваления,<br/>словно у моря Тростникового (Красного моря):</p><p>«За честь Твоего имени<br/>мы бросаем себя в глубины моря».</p><p>Ибо воды бездны достигли уже предела души.</p><p>Всё это пришло на нас,<br/>но мы не забыли молиться Господу,<br/>Который действительно существует.</p><p>Они возложили свою надежду на Того,<br/>Кто обещал вернуть их из плена.</p><p>И раздался Небесный голос:</p><p><strong>«Восстань, Господь! Почему Ты спишь?»</strong></p>", "subs": []}, {"id": "chapter-17", "title": "Кина 17", "html": "<p class=\"meta\">Тема: голод во время разрушения Храма</p><p class=\"meta\"><strong>Знак:</strong> алфавитный порядок (акростих). Порядок букв начинается после вступления «Им…».<br/><strong>Автор:</strong> рабби Элазар ха-Калир.</p><p>Когда я вспоминаю, что женщины ели своих нежных детей, своих маленьких младенцев —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что милосердные женщины варили своих детей, которых они взвешивали и отдавали золото в Храм по весу их тела —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что волосы с голов людей вырывали, привязывая их к хвостам быстро бегущих коней —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что язык младенца прилипал к нёбу от великой жажды и сухости —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, как женщины плакали и говорили друг другу: «Приди, и мы вместе съедим наших детей, которые кричат» —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что женщины объединялись, чтобы съесть одна другую, и одна просила другую привести также её сына — а он был спрятан и уже зарезан —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что в городе отцы встречали сыновей, которые тайно выходили к пещерам и кустам, чтобы есть тела убитых —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что дочери умирали и падали на колени своих матерей, когда их тела распухали от голода —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что души маленьких детей покидали их тела на улицах города, потому что они были измучены голодом —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю тяжесть бедствий: от страха падали младенцы, от высохшего молока умирали грудные дети, и мать оплакивала своих детей —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что восемьсот моих цветущих юношей, подобных оленям, носивших золотые щиты, были поражены и погибли в сражении —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что их тела были наполнены солёной пищей и раздутыми бурдюками, в них вошёл воздух, и они умерли —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что они уменьшились числом: из тысячи осталось сто, из ста — десять, пока не остался один человек для скорби и печали —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что в Храм спаслись восемьдесят тысяч детей священников —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что там все эти души были сожжены, как сухие колючки —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что за кровь пророка Захарии были убиты восемьдесят тысяч помазанных священников —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что дух покидал тела истощённых голодом от запаха мяса, которое враги жарили на траве —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что на одном камне собрали девять кавов мозгов детей, которые были там оставлены —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что триста младенцев были повешены: они висели на одной ветви —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что нежные и изнеженные женщины были увидены связанными цепями руками Навузарадана —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что у дорог лежали отдыхать дочери царей, знатные и важные —<br/>горе мне и беда мне.</p><p>Когда я вспоминаю, что сердца девушек и юношей ослабели из-за жажды и сухости —<br/>горе мне и беда мне.</p><p>И Святой, благословен Он, отвечает им голосом грома:</p><p>«Горе всем злодеям в Израиле! О том, что произошло с ними, рассказывают, но о их делах не рассказывают.</p><p>Рассказывают, как женщины ели своих детей, но не рассказывают, что они убили в самом Храме Захарию — священника и пророка».</p>", "subs": []}, {"id": "chapter-18", "title": "Кина 18", "html": "<p class=\"meta\">Тема: Деяния врагов перед разрушением Храма и чудеса Святого, благословен Он</p><p class=\"meta\"><strong>Знак:</strong> алфавитный порядок (акростих). Порядок букв идёт после вступительных слов «Ата» («Ты») и «Велама» («И почему»).<br/><strong>Автор:</strong> рабби Элазар ха-Калир.</p><p>Ты обещал Яакову, что<br/>Ты будешь благотворить Своему народу и его потомкам.</p><p>Моше просил, чтобы Израиль был выделен среди народов<br/>благодаря пребыванию Твоей Шхины среди них.</p><p>И почему же сыновья нечестия осквернили Твоё Имя,<br/>а Ты не излил на них весь Свой гнев?</p><p>Ты возвысил и прославил сыновей Израиля<br/>и дал им землю Израиля,<br/>как воспитатель, который носит на руках младенца.</p><p>И почему сыновья Исмаила радовались,<br/>прыгая через добычу Израиля,<br/>и убивали детей Израиля?</p><p>Ты кормил детей Израиля мёдом из скалы в Египте<br/>и вывел воду из скалы в пустыне.</p><p>И почему же их судьи последовали за тяжёлым злым началом, твёрдым как скала,<br/>и поэтому мозги их детей были разбиты о скалу?</p><p>Ты оставил и отверг народы,<br/>а в наследие избрал народ Израиля среди всех народов.</p><p>И почему же быстро поднялся на Твою землю чужой народ<br/>и сказал: «Пойдём и овладеем этой землёй,<br/>сделаем её нашей державой»?</p><p>Ты изгнал народы из земли Израиля —<br/>семьдесят народов, происходящих от Авраама:<br/>сыновья Кетуры, Исмаил и его сыновья, Ицхак и его потомки, Яаков и его сыновья, Эсав и его потомки —<br/>чтобы привести туда Свой народ, хранящий веру в Тебя.</p><p>И почему же Моав и Аммон задумали злой замысел против Моего народа,<br/>вынося изображения херувимов и обманывая народы, показывая им, будто Израиль поклоняется идолам?</p><p>Ты направил против Небесного Храма<br/>нижний Храм, который Ты создал Своими двумя руками.</p><p>И почему Ты возвратил Свою правую руку назад, не спасая нас?<br/>Ты разрушил Свой Храм наверху,<br/>когда разрушился Храм внизу.</p><p>Ты, Господь, пребываешь на Небесах вечно,<br/>и начало всех созданий Ты создал.</p><p>Ты создал Храм ещё до сотворения мира.</p><p>И почему злодей возносил устами своими и языком своим хулу,<br/>пока враг не разрушил Храм?</p><p>Ты радовался делать нам добро,<br/>сказав, что приведёшь нас и поселишь нас в земле Израиля.</p><p>И почему Титос, укрепившись в своём злодействе, насмехался и говорил:<br/>«Где Бог Израиля, который вкушает жир жертвоприношений?»</p><p>Ты Своей силой разделил Красное море,<br/>закрыл его после того, как вышел Израиль,<br/>чтобы египтяне не вышли и не причинили им вред.</p><p>И почему теперь я утонул в глубинах бедствий?<br/>Моя скорбь стала велика, как море.</p><p>Ты в древние времена сидел, чтобы слушать хвалы Твоего народа Израиля, святого народа,<br/>среди Сангедрина — старцев, освящающих Имя Твоё.</p><p>И почему же собрались народы — развращённые люди —<br/>и разрушили Святую Святых?</p><p>Ты услышь, Господь, ибо мы стали посмешищем и позором.<br/>Храм был сожжён огнём.</p><p>И почему Ты уничтожаешь Израиль, Своё наследие?</p><p>Ты будь для них как свадебный покров,<br/>вырасти нам избавление,<br/>и оно станет для нас защитой.</p><p>И суд справедлив с Тобой за все страдания, которые пришли на нас.</p><p>С Тобой, Господь, — правда в Твоём наказании,<br/>и мы принимаем его с любовью.</p><p>И почему же мы плачем и произносим слова скорби?</p><p>Мы оправдываем Твой суд,<br/>ибо всё это произошло с нами из-за наших грехов.</p>", "subs": []}, {"id": "chapter-19", "title": "Кина 19", "html": "<p class=\"meta\">Тема: признание справедливости суда Всевышнего и стыда Израиля за свои проступки</p><p class=\"meta\"><strong>Знак:</strong> алфавитный порядок (акростих). Буквенный порядок идёт после вступительных слов:<br/>«Тебе, Господь, праведность…» и «А нам — стыд лица…».<br/><strong>Автор:</strong> рабби Элазар ха-Калир.</p><p>Тебе, Господь, принадлежит праведность —<br/>за все благодеяния, которые Ты совершил с нами,<br/>с того времени, как мы вышли из Египта, и до сегодняшнего дня.</p><p>А нам подобает стыд,<br/>ибо во всех испытаниях, которыми Ты испытывал нас, чтобы очистить нас,<br/>мы не оказались совершенными,<br/>и поэтому Ты отдалил нас от Себя.</p><p>Тебе, Господь, принадлежит праведность,<br/>когда Ты взял нас сделать Своим народом среди египтян чудесами.</p><p>А нам подобен стыд,<br/>ибо в наших делах проявилось,<br/>что мы поступали подобно египтянам.</p><p>Тебе, Господь, принадлежит праведность,<br/>когда Ты Сам, в Своей славе, пришёл обучать нас быть Твоим народом.</p><p>А нам подобен стыд,<br/>ибо мы восстали, когда переходили Красное море,<br/>имея в руках идола Михи,<br/>и согрешили против Тебя.</p><p>Тебе, Господь, принадлежит праведность,<br/>когда мы вспомнили Твою клятву:<br/>«Небеса — свидетели того, что нет Бога кроме Меня».</p><p>А нам подобен стыд,<br/>когда мы оскорбили Тебя в пустыне Синая,<br/>потребовав сделать перед нами божество — золотого тельца.</p><p>Тебе, Господь, принадлежит праведность,<br/>за вкус манны, которой Ты нас кормил,<br/>она была подобна тесту, замешанному с мёдом.</p><p>А нам подобен стыд,<br/>когда мы принесли перед тельцом ту самую манну,<br/>которая имела вкус тонкой муки с маслом и мёдом.</p><p>Тебе, Господь, принадлежит праведность,<br/>за то, что Ты обеспечивал нас манной и водой из колодца Мирьям,<br/>и облачный столп шёл перед нами.</p><p>А нам подобен стыд,<br/>ибо даже о лёгкой манне, которая полностью усваивалась телом,<br/>наши отцы в шатрах роптали и говорили,<br/>что она принесёт им вред.</p><p>Тебе, Господь, принадлежит праведность,<br/>ибо когда мы шли по пустыне, нам ничего не недоставало.</p><p>А нам подобен стыд,<br/>ибо мы разгневали Тебя из-за манны,<br/>в споре Кораха и в грехе золотого тельца,<br/>как написано в Торе.</p><p>Тебе, Господь, принадлежит праведность,<br/>ибо Ты воевал с Сихоном и Огом<br/>и с другими царствами Ханаана.</p><p>А нам подобен стыд,<br/>ибо Ахан протянул руку к запрещённому имуществу,<br/>и не нашёл оправдания своему поступку.</p><p>Тебе, Господь, принадлежит праведность,<br/>за то, что Ты поставил нам четырнадцать судей,<br/>чтобы спасать нас,<br/>несмотря на то, что мы служили идолам.</p><p>А нам подобен стыд,<br/>ибо мы тайно служили идолу Михи,<br/>и через это споткнулись до самого разрушения Храма.</p><p>Тебе, Господь, принадлежит праведность,<br/>за создание Скинии в Шило,<br/>за служение в Нове и Гивоне,<br/>и за строительство Храма.</p><p>А нам подобен стыд,<br/>ибо из-за найденных в нас грехов<br/>были разрушены святыни,<br/>и поэтому мы стыдимся.</p><p>Тебе, Господь, принадлежит праведность,<br/>за разрушение двух Храмов,<br/>которые были разрушены из-за наших грехов,<br/>и всё же Ты не уничтожил нас полностью.</p><p>А нам подобен стыд,<br/>ибо мы должны были вернуться к Тебе всем сердцем,<br/>чтобы Ты вернулся к нам с милосердием,<br/>но мы не вернулись.</p><p>Тебе, Господь, принадлежит праведность<br/>за все те девятьсот лет,<br/>когда ненависть к нашим грехам была скрыта у Тебя,<br/>и Ты не спешил отправить нас в изгнание.</p><p>А нам подобен стыд,<br/>когда Даниэль просил о строительстве Второго Храма<br/>после того, как исполнились семьдесят лет изгнания.</p><p>Народ Израиля не был достоин этого,<br/>но он молился Тебе, чтобы Ты услышал его.</p><p>И поэтому мы стыдимся и испытываем позор<br/>из-за наших грехов.</p>", "subs": []}, {"id": "chapter-20", "title": "Кина 20", "html": "<p class=\"meta\">Тема: просьба к Всевышнему обратить слух к оскорблениям врагов и их злым делам</p><p class=\"meta\"><strong>Автор: рабби Элазар hа-Калир</strong></p><p><strong>Склони, Боже, ухо Твоё</strong> к насмешкам народов мира, которые хулят Тебя и говорят:<br/>«Кто подобен мне на небесах?»</p><p><strong>И услышь крик Эдома</strong>, который говорит:<br/>«Разрушим всё до основания, пока не откроются тайны Храма — Дома Божьего, являющегося вратами небес».</p><p><strong>Склони, Боже, ухо Твоё</strong> к врагам, которые собираются вместе и говорят дурные речи о Тебе, Праведном Судье мира.</p><p><strong>И услышь голос множества Рима</strong>, шумящего, чтобы уничтожить нас; пусть изольётся Твой гнев и заставит их замолчать.</p><p><strong>Обрати, Боже, ухо Твоё</strong> к словам пророчества о будущем, когда будто посланник будет направлен против народов, и скажут они друг другу:<br/>«Встанем и пойдём войной против Эдома».</p><p><strong>Услышь наш страх</strong> из-за слов народов, ибо пришло время, когда враги поднялись против Храма и вступили с ним в борьбу, как сделал Тит.</p><p><strong>Склони, Боже, ухо Твоё</strong> к советам, которые они замышляли, и к злым мыслям их, говоря, что невозможно, чтобы святое существовало.</p><p><strong>И услышь слова народов</strong>, которые объединились одним советом: подняться против Тебя в своей безумной гордыне.</p><p><strong>Склони, Боже, ухо Твоё</strong> к оскорблениям врагов, которые вошли в Храм в девятый день месяца Ав, ели и пили там и хулили Всевышнего своими насмешками до десятого Ава, а в этот день подожгли его.</p><p><strong>И услышь голос тех, кто хулит Тебя</strong>, ибо они прекратили песни благодарности и пение левитов.</p><p><strong>Склони, Боже, ухо Твоё</strong> к народам, ибо их сердце желает насмехаться над Израилем.</p><p><strong>И услышь все слова их позора</strong>, которыми они поносили Тебя наверху, и пусть Твой страх падёт на них.</p><p><strong>Склони, Боже, ухо Твоё</strong> к гордости народов, которые вынесли херувимов из Святая Святых и носили их по улицам.</p><p><strong>И услышь</strong>, что пришлось Тебе вынести, когда они приносили на Твой жертвенник чужие жертвы.</p><p><strong>Склони, Боже, ухо Твоё</strong> к осквернению и нечистоте, которую они совершили в Святая Святых.</p><p><strong>И услышь слова Амалека</strong>, которые изрыгают хулу против Небес, разрывая одежды Израиля и говоря:<br/>«Пусть будет с тобой тот, кого ты избрал».</p><p><strong>Склони, Боже, ухо Твоё</strong> к идолопоклонникам, которые дерзко говорят:<br/>«Пойдём и будем воевать с Богом в Его Храме».</p><p><strong>И услышь их злые слова</strong>, которые послали соседи Израиля, говоря с гордостью, что Бог больше не пребывает в Своём доме.</p><p><strong>Обрати, Боже, ухо Твоё</strong> к народу, который говорит:<br/>«Я — и никто кроме меня».</p><p><strong>И услышь его хулу и оскорбления</strong> того, кто превозносится против Твоего престола и Твоего Божественного Имени.</p><p><strong>Склони, Боже, ухо Твоё</strong> к народам, которые насмехаются над Израилем и говорят:<br/>«Почему вы надеетесь на Храм? Он больше никогда не будет построен».</p><p><strong>И услышь плач Твоего народа</strong>, который скорбит и оплакивает разрушение Храма и ждёт его восстановления.</p><p><strong>Склони, Боже, ухо Твоё</strong> к словам тех, кто говорит, что Храм оставлен, забыт и покинут, и что навеки останется разрушенным.</p><p><strong>И услышь наше сокрушение</strong>, отомсти за нас и верни Своё Присутствие в Твой Храм, который ныне лежит в запустении.</p>", "subs": []}, {"id": "chapter-21", "title": "Кина 21", "html": "<p class=\"meta\"><strong>Тема: Десять мучеников царства (по Талмуду и мидрашам)</strong></p><p class=\"meta\"><strong>Автор: рабби Элазар hа-Калир</strong></p><p>Мудрецы Израиля, герои Торы,<br/>обладатели щита её истины, побеждающие друг друга в споре закона,<br/>в битве Торы — в Мишне и Гемаре.</p><p>Они сокрушали ряды противников своей силой,<br/>трудились над Торой в чистоте и святости.</p><p>Их кровь была пролита словно вода,<br/>и с тех пор умолкли великие герои Торы.</p><p>Это они — святые, убитые царской властью,<br/>и число их было десять.</p><p>О них я обращаю свой плач,<br/>и мои глаза проливают слёзы.</p><p>Когда я вспомню это — я закричу горьким голосом,<br/>ибо не было подобных им среди Израиля:<br/>святых и отделённых от зла,<br/>увенчанных короной Торы.</p><p>Они оградили себя даже от дозволенного,<br/>а были осуждены на страшную смерть.</p><p>Бросили жребий — кто первым будет выбран для казни.</p><p>Когда жребий пал на раббана Шимона,<br/>он сразу приготовился к испытанию<br/>и заплакал от того, что ему предстоит необычная смерть.</p><p>Правитель обратился к раббану Шимону,<br/>чтобы убить его, с сердцем, наполненным жестокостью.</p><p>Рабби Ишмаэль, из потомков Аарона-коэна,<br/>попросил императора позволить ему оплакать раббана Шимона.</p><p>Рабби Шимон был из рода Давида.<br/>Он взял его голову и положил на свои колени с любовью,<br/>крича о его чистоте и свете его Торы,<br/>которые были заслугой его поколения.</p><p>Его глаза были напротив его глаз,<br/>его уста напротив его уст —<br/>из великой любви.</p><p>Рабби Ишмаэль сказал:</p><p>«Где тот рот, который возвышался в Торе?<br/>Как же внезапно вынесен над ним приговор<br/>на такую позорную и необычную смерть?»</p><p>Правитель приказал снять кожу с головы рабби Ишмаэля<br/>острым ножом — по просьбе своей дочери.</p><p>Исполнилось над ним то, что словно человек говорит своему товарищу:<br/>«Ляг, и я пройду по тебе».</p><p>Когда злодей дошёл до места тфилин,<br/>которые являются чистой заповедью Всевышнего,<br/>рабби Ишмаэль издал великий крик.</p><p>Мир содрогнулся,<br/>ибо казалось, что Всевышний хочет уничтожить Свой мир,<br/>но рабби Ишмаэль сдержался,<br/>пока его душа не покинула тело.</p><p>После него привели рабби Акиву —<br/>толкователя строгих законов Торы,<br/>который выводил новые законы из глубины своего изучения.</p><p>Они расчесали его тело железными гребнями,<br/>раскалёнными в огне.</p><p>Наступило время чтения «Шма Исраэль»,<br/>и он принял на себя царство Небес.</p><p>Его душа вышла, когда он произнёс слово «Один».</p><p>И тогда раздался Небесный голос:</p><p>«Счастлив ты, рабби Акива!<br/>Твоё тело было чисто всеми видами святости».</p><p>После него привели рабби Йегуду бен Бава.<br/>Смиренного сердцем и осторожного во всех делах.</p><p>Он был убит в возрасте семидесяти лет<br/>рукой злой власти,<br/>когда он посвятил пятерых старейшин Израиля.</p><p>В день своей казни он постился,<br/>чистый и праведный,<br/>вся его жизнь была посвящена служению Небесам.</p><p>После него привели рабби Ханину бен Терадион,<br/>за то, что он собирал людей в домах учения<br/>и обучал их законам Торы.</p><p>Его схватили, когда он сидел и учил,<br/>а свиток Торы был рядом с ним.</p><p>Его окружили связками сухих ветвей винограда,<br/>подожгли их и сожгли его вместе со свитком Торы.</p><p>Чтобы его смерть не наступила быстро,<br/>его обложили влажными шерстяными тканями,<br/>которые задерживали огонь.</p><p>Праведного рабби Йешевава Софера<br/>убили народы, подобные в своей жестокости народу Содома.</p><p>Они бросили его псам,<br/>не похоронили его и не оплакали.</p><p>Но вышел Небесный голос и засвидетельствовал о нём:</p><p>«Он не оставил ничего из Торы Моисея,<br/>которую он хранил полностью».</p><p>После него был приведён рабби Хацефит в день гнева.</p><p>Он был подобен Йонатану бен Узиэлю,<br/>у которого даже птица, пролетавшая над ним во время изучения Торы,<br/>сгорала от огня его святости.</p><p>Праведный рабби Элазар бен Шамуа<br/>был последним из убитых мечом.</p><p>Это было в пятницу перед Шаббатом.<br/>Наступило время кидуша,<br/>он освятил день и начал читать:</p><p>«И завершены были небеса и земля…»</p><p>Но сразу вынесли против него меч,<br/>и не оставили ему жизни,<br/>пока он не завершил свой кидуш.</p><p>Его душа вышла, когда он произнёс:</p><p>«И завершил Бог» —<br/>ведь Он Творец и Создатель формы.</p><p>Так и так продолжали злодеи увеличивать свои преступления в ярости.</p><p>Четырьмя видами смерти в руках их —<br/>кто может измерить величину страданий?</p><p>Оставшийся народ Израиля<br/>враги пожирали словно звери.</p><p>Избранных и лучших среди народа<br/>они терзали, как лев и молодой лев.</p><p>Пусть Всевышний будет добр к нам<br/>и больше не будет нас наказывать.</p><p>Пусть Он укрепит ослабевшие колени Израиля в изгнании.</p><p>Господь — их удел и Спаситель во время беды.</p><p>В будущем Он справедливо будет судить народы,<br/>когда будет царствовать Всевышний,<br/>и скажет Израилю:</p><p><strong>«Закончились дни твоего страдания».</strong></p><p>Мы выйдем и пойдём навстречу свету<br/>Шхины Всевышнего в час избавления.</p>", "subs": []}, {"id": "chapter-22", "title": "Кина 22", "html": "<p class=\"meta\">Тема: призыв к душе продолжать плакать и не принимать утешений, ибо во время усиления обвинений и преследований со стороны народов, великие и малые Израиля — старцы, юноши и девицы — встали с самоотверженностью, чистотой и святостью. Даже сама Тора должна облачиться во вретище и скорбеть по всем изучающим её, которых уничтожили враги.</p><p><strong>Замолчите ваши слова и оставьте меня говорить о моих бедах, ибо я больше не могу сдерживаться.<br/>О насилии я буду кричать, о разрушении и грабеже обращусь к Тому, Кто пребывает на небесах.</strong></p><p>Моя душа измучена страданиями, и потому я не могу молчать.</p><p>Как роженица кричит в муках, так и я буду вопить, поглощённый скорбью; я устрою горький плач и буду оплакивать с громким криком.</p><p>От множества моих рыданий мои слёзы прольются как море.<br/>Я устрою скорбь по общине Израиля, которая была отдана на опустошение.</p><p>Я буду жаловаться на бедствия громким голосом, поднимая крик плача.</p><p><strong>Как исчезла радость и прекратилось веселье!</strong></p><p>Лица всех людей стали чёрными, как горшок после огня.<br/>Каждая голова лишилась волос, каждая борода была сбрита от великого горя.<br/>В каждом сердце поселилась печаль с того времени, когда восстал сильный народ, желающий повергнуть меня и уничтожить.</p><p>Он наступил на великих Израиля и его мудрецов, изучающих Тору.<br/>Моих девиц и юношей он искоренил и разрушил.</p><p>На главных улицах города их тела были выброшены, словно презренный мусор.</p><p>Младенцы и дети были подобны овцам, ведущимым на заклание.<br/>Я буду плакать об этом, и моя слеза будет стекать по моей щеке.</p><p>Соберитесь ко мне, все скорбящие сердцем, ибо нет никого из народа Израиля, кто мог бы помочь.<br/>Они стали как овцы, удалённые от пастбища.</p><p>Усильте плач и поднимите голос вопля.<br/>Плачьте вместе с нами, небеса, и кричи, земля!</p><p><strong>Ангелы, выйдите наружу и громко возопите горьким плачем.<br/>Соберитесь вместе, поднимите голос, как женщина в первых родовых муках.</strong></p><p>Скорбите о народе Израиля, который подобен овце, изгнанной с пастбища.<br/>Плачьте над ним, ибо был вынесен приговор.</p><p>В гневе, ярости и великом негодовании собрались они,<br/>но в чистоте и отделённости посвятили себя освящению великого и страшного Имени Всевышнего.</p><p>Каждый укреплял своего брата словами поддержки и помощи, чтобы они держались в чистом страхе перед Богом.</p><p>Они не преклонились перед идолами и не отреклись от веры.</p><p>И они не проявили жалости ни к юноше, ни к девице, ни к детям, сияющим как царские украшения.</p><p>Более того — они обрели ещё большую силу духа в своих сердцах:<br/>они были готовы собственными руками поразить своих детей и отсечь их головы, чтобы не дать врагам осквернить их веру.</p><p>И к ним обращались отцы:</p><p>«Мы не удостоились вырастить вас в Торе и заповедях, поэтому принесём вас как жертву Всевышнему.</p><p>И этим мы удостоимся быть вместе с вами в скрытом Эдемском саду, который недоступен глазу человека и предназначен для праведников».</p><p>В тот час согласились великие и малые принять с любовью суд Всевышнего, пребывающего на небесах.</p><p>И старцы, чьи силы ещё были свежи и чьи годы были полны мудрости,<br/>были первыми, кто был предан суду.</p><p>Вышли им навстречу бесстыдные враги,<br/>и убивали их группами одну за другой.</p><p>Смешались кровь и внутренности убитых,<br/>а отцы, которые были милосердными, превратились в суровых и стойких, словно камни.</p><p>Они бросили жребий между отцами и детьми,<br/>и тот, на кого выпал первый жребий, был заколот ножом, как жертвенное животное.</p><p>Юноши, которые выросли в красивых разноцветных одеждах,<br/>ели землю, словно змеи.</p><p>Невесты, одетые в вышитые красные одежды,<br/>падали в объятия женихов, уже потеряв сознание.</p><p>Они были разрублены на части мечами и копьями.</p><p>Помните это, мудрое собрание Израиля,<br/>и не молчите о разрушении через произнесение кин и плачей.</p><p>Вознесите скорбь о святых и достойных людях,<br/>которые утонули в руках врагов, словно в бурных водах.</p><p>Когда я вспоминаю это, моя душа наполнена болью.</p><p><strong>Тора, Тора!</strong></p><p>Облачись во вретище, посыпь себя пеплом и катайся в прахе.</p><p>Скорби, как мать скорбит по своему единственному сыну,<br/>и устрой горький плач.</p><p>Оплакивай мудрецов поколения, учителей и изучающих Тору,<br/>которые были подобны тем, кто держит вёсла и расправляет сети.</p><p>Они были подобны кормчим корабля в море,<br/>ибо Тора уподоблена воде.</p><p>Толкователи Торы, которые устраивали её перед народом как накрытый стол,<br/>выпрямляли запутанные пути, раскрывали тайны Торы<br/>и открывали скрытое.</p><p>Кто теперь вынесет решение?<br/>Кто разъяснит строгие и возвышенные законы, высокие как горы и холмы?</p><p>Кто разрешит трудные вопросы?<br/>Кто ответит на возражения в законах?</p><p>Кто отделит назореев?<br/>Кто составит обеты и найдёт путь их разрешения?</p><p>Кто приготовит пути раскаяния для грешников Израиля?</p><p>Ведь погибли мудрецы Израиля!</p><p>Кто теперь будет вести войну Торы<br/>и вернётся к воротам дома учения?</p><p>Ученики мудрецов исчезли,<br/>и пали они — герои Израиля.</p><p>Счастливы они, святые,<br/>высоки их ступени, подобны высоким небесам.</p><p>В покое мира они отдыхают в своих могилах.</p><p>Но скорбь, плач, разрушение и беда остались тем, кто находится в изгнании.</p><p>Они оставлены одни в страданиях и боли,<br/>как женщина в родовых муках.</p><p>Они ждут спасения, но всё вокруг — тьма, всё приводит в смятение.</p><p>Вечером они говорят:</p><p>«Кто даст, чтобы наступило утро?»</p><p>А утром они ждут:</p><p>«Когда же придёт вечер?»</p><p>По тому, что видят их глаза, они живут в постоянном страхе:</p><p>За пределами города слышится шум мечей войск,<br/>а в домах — ужас бедствий и болезней.</p><p><strong>До каких пор Ты будешь смотреть, Господи,<br/>Ты, Который видишь всё сокрытое?</strong></p><p>Возревнуй за Твою Тору и отомсти за то, что народы сожгли её.</p><p>Они сожгли её, отменяли её слова, разрывали её на части, словно колючки, из которых поднимается пламя.</p><p>Они раздували великий костёр для сожжения Торы.</p><p><strong>Разве перед этим Ты будешь молчать и не проявишь милосердия,<br/>Господь, Владыка всех созданий?</strong></p><p>Взыщи кровь нашу, пролитую словно вода,<br/>которая изливается на землю.</p><p>Из-за ограбления бедных,<br/>из-за крика угнетённых в их страданиях,</p><p>из-за народа, который желает вернуться в раскаянии,<br/>который насытился бедами и горечью —</p><p><strong>помилуй их, не отвергай их.</strong></p><p>Возвысь их достоинство и подними их силу<br/>своим спасением.</p>", "subs": []}, {"id": "chapter-23", "title": "Кина 23", "html": "<p class=\"meta\">Тема: история о сыне и дочери рабби Ишмаэля, первосвященника, которые были захвачены в плен (по трактату Гитин 58а).Автор: рабби Йехиэль.</p><p>За грехи наши был разрушен Храм,<br/>и слёзы мои текут по моим щекам, словно поток воды.<br/>В этот день я возвышаю голос плача и скорби,<br/>и стону, словно рёв моря, из года в год.</p><p>Скорбит моё сердце, и утешения я не могу принять.<br/>Из всех страданий мира — моё страдание самое особенное и великое:<br/>о сыне и дочери рабби Ишмаэля, великого коэна.<br/>Память о них — словно горящий огонь в моём сердце,<br/>и я вспоминаю их.</p><p><strong>И возопию…</strong></p><p>В то время, когда они были захвачены в плен<br/>и попали в руки разбойников,<br/>два пленителя, жившие рядом друг с другом,<br/>рассказывали один другому о своих захваченных рабах.</p><p>Один сказал:</p><p>«Из пленных дочерей Сиона я захватил служанку.<br/>Её одежды вышиты красной нитью.<br/>Она прекрасна, как луна,<br/>лицом своим и красотой своей.<br/>Её облик подобен двум прекраснейшим дочерям Иова,<br/>которых не было красивее во всей земле».</p><p><strong>И возопию…</strong></p><p>Его товарищ рассказал своему соседу ещё большую похвалу:</p><p>«Я пришёл из плена Иерусалима.<br/>Я захватил юношу-раба с прекрасными глазами.<br/>Его лицо подобно солнцу, которое сияет особенно ярко в полдень».</p><p>И посоветовал ему:</p><p>«Давай поженим их между собой<br/>и разделим между нами детей, которые родятся от них,<br/>и умножатся они, словно звёзды небесные».</p><p>Тот, кто услышит об этой беде,<br/>содрогнутся его уши от ужаса.<br/>В память об этом я разорву свои одежды.</p><p><strong>И возопию…</strong></p><p>Когда два пленителя решили это сделать,<br/>вечером они соединили юношу и девушку в одной комнате,<br/>а сами двое стояли снаружи.</p><p>Но в сердцах их пленники приняли другое решение:<br/>сын и дочь плакали горьким плачем и боялись,<br/>и до самого утра их рыдания не прекращались.</p><p><strong>И возопию…</strong></p><p>Юноша произнёс скорбную речь, дрожа,<br/>и сердце его растаяло внутри него. Он сказал:</p><p>«Сын Аарона — как может он стать рабом?»</p><p>И дочь также плакала о намерении пленителя унизить её и осквернить её.</p><p>Она сказала:</p><p>«Дочь Йохевед — как может она стать рабыней?»</p><p>О горе! Так постановил Всевышний —<br/>Он говорит, и Его слово исполняется.<br/>И о такой трагедии достойны плакать даже звёзды небес.</p><p><strong>И возопию…</strong></p><p>Когда наступило утро,<br/>они узнали друг друга:</p><p>«О мой брат! О моя сестра!»</p><p>И усилили свой плач.<br/>Они плакали вместе и обнялись,<br/>пока их души не вышли одновременно,<br/>одним дыханием.</p><p><strong>И возопию…</strong></p><p>О таком несчастье, которое пророк увидел заранее,<br/>пророк Йирмияху оплакивал с изумлением и сказал:</p><p>«Из-за такого приговора я буду постоянно скорбеть».</p><p>В моём сердце горит пылающий огонь,<br/>я обжигаюсь от воспоминания об этом сыне и дочери.<br/>Великую скорбь я вознесу о них.</p><p>Я буду рассказывать о страданиях<br/>громким голосом стенания,<br/>и подниму голос плача и рыдания.</p>", "subs": []}, {"id": "chapter-24", "title": "Кина 24", "html": "<p class=\"meta\">Тема: разрушение Храма и всех его священных сосудов.Автор: рабби Элазар hа-Калир.</p><p>О разрушении Дома Святилища,<br/>основания которого и глубины его были разрушены и попраны,<br/>я буду каждый год возносить новый плач и скорбь<br/>о красоте Святилища и унижении Храма.</p><p>Трижды Ты скрыл Своё лицо,<br/>чтобы заставить ангелов замолчать и прекратить их песнь:</p><p>во время, когда Ты перевернул мир во времена поколения Потопа,<br/>по отношению к Египту,<br/>и теперь — когда я вижу огонь среди шестов Ковчега.</p><p>Два Храма — высший и нижний,<br/>которые соответствовали друг другу,<br/>были омрачены и разрушены.<br/>И Ты сказал:<br/>«Я промолчу и удержусь от того, чтобы спасти их».</p><p>Концы шестов Ковчега укоротились<br/>и больше не выступали из-за завесы.<br/>Четыре угля упали с Небес и сожгли Храм,<br/>а сорок оснований Святилища и дворов его<br/>были сожжены потоками огня из глубин.</p><p>Когда Святая Святых перестала быть Домом Господа,<br/>Ты сказал с плачем:</p><p>«Моё жилище на земле разрушено».</p><p>И Ты ударил ладонью о ладонь, как скорбящий,<br/>и закричал громким голосом:<br/>«Горе!»</p><p>Храм — венец Твоей славы,<br/>когда он был предан в руки врага<br/>вместе с драгоценными сосудами Дома Святилища.</p><p>У Тебя есть сила и могущество вынести это,<br/>но враги сказали, будто Твоя сила исчезла.</p><p>В тот час лицо небес потемнело,<br/>и высоты небес склонились к тьме,<br/>когда два столпа Храма рухнули и разбились.</p><p>Десять столов, которые сделал царь Шломо,<br/>враги захватили как добычу.</p><p>Священникам, которые раскладывали хлебы предложения,<br/>они насмешливо говорили:</p><p>«Где же ваш Господь — Владыка всех сосудов?<br/>Вот они теперь в сокровищницах Вавилона,<br/>в наших домах посвящения и стали нашим наследием».</p><p>Вечные ангелы покинули свои места на небесах<br/>и не произносили песнь в день разрушения,<br/>когда были уничтожены сооружения под умывальниками Храма.</p><p>А злодеи кричали:</p><p>«Настало время уничтожить Израиль!»</p><p>Медь и десять умывальников Храма,<br/>когда были переданы в руки халдеев,<br/>разбились сами собой,<br/>и солнце и луна с того времени потемнели.</p><p>Подставки под умывальниками,<br/>созданные подобно образу Небесной Колесницы,<br/>когда были сброшены на землю войском Вавилона —<br/>померкло сияние небес.</p><p>Вавилонский царь бросал жребий между царями,<br/>кто будет служить ему каждый день,<br/>а перед херувимами в Храме вошёл его голос и его деяния.</p><p>Когда были сняты и увезены врагами священные сосуды,<br/>дождь благословения больше не нисходил.</p><p>С войском халдеев ушло от Храма Облако Славы.</p><p>Все серебряные и золотые сосуды<br/>были отняты и похищены из Дома Святилища.</p><p>Когда Шхина покинула место,<br/>ангелы народов также были низвергнуты со своих ступеней.</p><p>День разрушения, называемый смятением и замешательством,<br/>привёл ангельские воинства в растерянность,<br/>как женщину, страдающую при родах.</p><p>Господь начал песнь скорби,<br/>и ангелы ответили:</p><p>«Как… как это произошло?!»</p><p>Поспешили аммонитяне и моавитяне,<br/>вытащили херувимов из Святого Святых<br/>и носили их по улицам в сделанном из сетей сооружении.</p><p>Они говорили:</p><p>«Вот, подобно всем народам, Дом Иудеи считается народом идолопоклонников».</p><p>Все высшие князья-ангелы были заменены Всевышним,<br/>и Святой, благословен Он, не хотел, чтобы перед Ним пели песнь<br/>во время падения камней и разрушения Храма.</p><p>Ангелы высоты замолчали от сладости своей песни,<br/>и Господь сказал:</p><p>«Что вы хотите петь здесь?<br/>Сегодня нет разрешения произносить песнь.<br/>Как можете вы славить Царя в день Его гнева?»</p><p>Священники и левиты во время своих служений были убиты.</p><p>В их чередах слышался голос крика множества певцов.</p><p>Они спрашивали:</p><p>«Где Царь Израиля,<br/>Который связал Себя клятвой,<br/>что Его Шхина будет пребывать среди них?»</p><p>Священные сосуды Храма и служащие коэны были уведены в плен.</p><p>Князья Израиля и их заместители были повлечены в железных цепях.</p><p>Ангелы, вместо своих одеяний служения,<br/>надели одежды скорби и траура.</p><p>Навуходоносор возрадовался,<br/>когда его глаза увидели, что ангел Михаэль пришёл перед ним<br/>и как бы ввёл его в Святое Святых.</p><p>Так исполнилось унижение Израиля:<br/>его небесный князь пошёл перед рабом —<br/>перед тем, кто ехал на своей лошади.</p><p>Это увидели войска Вавилона.</p><p>С гордостью он поднялся,<br/>погасил свет Меноры<br/>и поднял руку к Небесам.</p><p>Но не поклонился страху перед Всевышним.<br/>Своими поступками он затемнил свет Господа,<br/>Который облачается светом.</p><p>Когда он заревел, как лев, в Храме,<br/>Всевышний вышел из Святилища.</p><p>И как человек, который скорбит,<br/>Он оплакивал разрушение.</p><p>Души, которые каждую ночь находятся под властью Господа,<br/>в ночь разрушения Он не принял,<br/>потому что весь мир был оставлен без защиты<br/>из-за бедствия разрушения.</p><p>Господь позволил шести ангелам разрушить Иерусалим и сказал:</p><p>«Мой гнев Я излил на них.<br/>Израиль — народ Моего удела —<br/>Я предал в руки врагов.</p><p>Я оставил Мой Дом,<br/>и Я оставил Яакова, Моё наследие».</p>", "subs": []}];

function closeMenus(){ $('drawer').hidden=true;$('scrim').hidden=true; }

function show(i){if(i<0||i>=chapters.length)return;index=i;closeMenus();$('current-title').textContent=chapters[i].title;$('chapter-title').textContent=chapters[i].title;content.innerHTML=chapters[i].html;$('prev').disabled=i===0;$('next').disabled=i===chapters.length-1;nav();updateSearch(false);window.scrollTo({top:0,behavior:'instant'});}
$('menu').onclick=()=>{const closed=$('drawer').hidden;closeMenus();$('drawer').hidden=!closed;$('scrim').hidden=!closed;};$('scrim').onclick=closeMenus;$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);

content.addEventListener('click',e=>{const btn=e.target.closest('.note-ref');if(btn){const n=btn.dataset.note;const next=btn.nextElementSibling;if(next&&next.classList.contains('inline-note')){next.remove();btn.setAttribute('aria-expanded','false');return;}content.querySelectorAll('.inline-note').forEach(x=>x.remove());content.querySelectorAll('.note-ref[aria-expanded=true]').forEach(x=>x.setAttribute('aria-expanded','false'));const panel=document.createElement('span');panel.className='inline-note';panel.innerHTML='<button class="note-close" aria-label="Закрыть примечание">×</button>'+(notes[n]||'Примечание отсутствует');btn.insertAdjacentElement('afterend',panel);btn.setAttribute('aria-expanded','true');return;}if(e.target.closest('.note-close')){const panel=e.target.closest('.inline-note');panel.previousElementSibling?.setAttribute('aria-expanded','false');panel.remove();}});
function updateSearch(jump=true){content.querySelectorAll('mark[data-search]').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));content.normalize();searchHits=[];hit=-1;const q=$('search').value.trim().toLocaleLowerCase();if(!q){$('count').textContent='';return;}const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode()){const n=walker.currentNode;if(n.parentElement.closest('script,button,mark,.inline-note'))continue;if(n.textContent.toLocaleLowerCase().includes(q))nodes.push(n);}for(const n of nodes){const s=n.textContent,lower=s.toLocaleLowerCase();let at=0,frag=document.createDocumentFragment();while(true){const pos=lower.indexOf(q,at);if(pos<0)break;frag.append(document.createTextNode(s.slice(at,pos)));const m=document.createElement('mark');m.dataset.search='1';m.textContent=s.slice(pos,pos+q.length);frag.append(m);searchHits.push(m);at=pos+q.length;}frag.append(document.createTextNode(s.slice(at)));n.replaceWith(frag);}$('count').textContent=searchHits.length?`0/${searchHits.length}`:'0';if(jump)nextHit();}
function nextHit(){if(!searchHits.length)return;if(hit>=0&&searchHits[hit])searchHits[hit].classList.remove('current-hit');hit=(hit+1)%searchHits.length;searchHits[hit].classList.add('current-hit');$('count').textContent=`${hit+1}/${searchHits.length}`;searchHits[hit].scrollIntoView({behavior:'smooth',block:'center'});}
$('search').addEventListener('input',()=>updateSearch(true));$('searchnext').onclick=()=>{if(!searchHits.length)updateSearch(true);else nextHit();};show(0);
