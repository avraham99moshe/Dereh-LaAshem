нию;\nвоспоминание приводит к действию»<br/>\n(Менахот\n43б; см. Шульхан Арух, Орах Хаим 24).<\/blockquote>", "<p>Но он закрывает глаза, чтобы не смотреть\nна то, что способно пробудить сердце к\nдурному желанию.<\/p>", "<p>Он не станет смотреть в книги нечестивцев;\nне пойдёт в дом пира и веселья, где\nсобираются вместе мужчины и женщины;\nне будет вглядываться в лица женщин и\nнечестивых людей.<\/p>", "<p>Он также не станет ходить в дома\nбогачей, наполненные всевозможными\nпредметами роскоши и желания, которые\nпробуждают в сердце смотрящего страсть\nи стремление обладать ими.<\/p>", "<p><strong>Таков путь всякого мудрого сердцем.<\/strong><\/p>", "<p>Если же найдётся человек, который\nпоступает наоборот — закрывает глаза,\nчтобы не видеть добро и всё то, что могло\nбы пробудить его сердце к добру, но\nоткрывает их для зла и всего того, что\nпробуждает сердце ко злу, — он подобен\nбезумцу, лишённому разума, который\nзакрывает ставни своего дома при утреннем\nсвете, а в глубокой ночи открывает их.<\/p>", "<h1 class=\"western\" id=\"section-37\"><font size=\"4\">«Глаза\nтвои пусть смотрят прямо»<\/font><\/h1>", "<p>На основании сказанного становится\nпонятен стих:<\/p>", "<blockquote>«Глаза твои пусть смотрят прямо,\nи веки твои пусть направляются прямо\nперед тобою»<br/>\n(Мишлей 4:25).<\/blockquote>", "<p>Сын человеческий, задумайся!<\/p>", "<p>Господь дал тебе <strong>глаза, чтобы\nвидеть<\/strong>, и <strong>веки, чтобы закрывать\nглаза и не видеть<\/strong>.<\/p>", "<p>Поэтому знай, <strong>на что следует\nсмотреть глазами и от чего следует\nзакрывать их веками<\/strong>.<\/p>", "<blockquote>«Глаза твои — прямо…»<\/blockquote>", "<p>Пусть они смотрят на всё правильное,\nпрямое и доброе.<\/p>", "<p>Подобно сказанному:<\/p>", "<blockquote>«Смотри, дела твои хороши и\nправильны»<br/>\n(II Шмуэль 15:3),<\/blockquote>", "<p>и:<\/p>", "<blockquote>«Отвечающий словами\nправильными»<br/>\n(Мишлей 24:26).<\/blockquote>", "<blockquote>«…пусть смотрят».<\/blockquote>", "<p>Потому что, когда ты станешь смотреть\nглазами на добро, сердце твоё пожелает\nего, а затем органы твоего тела осуществят\nего на деле.<\/p>", "<blockquote>«И веки твои…»<\/blockquote>", "<p>То есть те веки, посредством которых\nты закрываешь глаза:<\/p>", "<blockquote>«…пусть направляются прямо».<\/blockquote>", "<p>Пусть они избирают прямой путь.<\/p>", "<p>Так объясняет рабби Авраам ибн Эзра.<\/p>", "<p>Можно также истолковать слово <strong>«яяширу»<\/strong>\nкак: пусть веки <strong>сами выпрямятся<\/strong>,\nто есть пусть сомкнутся и закроют глаза.<\/p>", "<p>Ведь когда глаза открыты, веки согнуты\nи сокращены; а когда человек закрывает\nглаза, веки распрямляются.<\/p>", "<blockquote>«…перед тобою» —<\/blockquote>", "<p>то есть <strong>напротив твоей страсти и\nтвоего желания<\/strong>.<\/p>", "<p>Когда перед глазами находится предмет\nстрасти и ты смотришь на него, сердце\nначинает его желать.<\/p>", "<p>Тогда подкуп собственного желания\nспособен ослепить глаза разума, заставляя\nчеловека называть зло добром, а кривое\n— прямым, как уже объяснялось в первом\n«Видении».<\/p>", "<p>Но когда ты закроешь веками <strong>телесные\nглаза<\/strong>, тогда сможешь увидеть прямой\nпуть <strong>глазами своего разума<\/strong>.<\/p>", "<h1 class=\"western\" id=\"section-38\"><font size=\"4\">Следует\nмолиться, чтобы не увидеть зло даже\nнепреднамеренно<\/font><\/h1>", "<p>Однако иногда человек видит нечто\nдурное <strong>не по своей воле<\/strong>.<\/p>", "<p>Так рассказывали наши мудрецы:<\/p>", "<blockquote>Однажды раббан Шимон бен Гамлиэль\nподнимался по ступеням Храмовой горы\nи неожиданно увидел чрезвычайно красивую\nнееврейскую женщину. Он произнёс:<br/>\n«Как\nмногочисленны дела Твои, Господи!»<br/>\n(Теилим\n104:24).<\/blockquote>", "<p>Также рабби Акива увидел жену нечестивого\nТурнусруфуса и плюнул, засмеялся и\nзаплакал…<\/p>", "<p>Талмуд спрашивает:<\/p>", "<blockquote>«Но разве разрешено смотреть?\nВедь учили: “Берегись всего дурного”\n— чтобы человек не смотрел на красивую\nженщину…»<\/blockquote>", "<p>И отвечает:<\/p>", "<blockquote><strong>«Она неожиданно появилась\nиз-за угла»<\/strong><br/>\n(Авода Зара 20а).<\/blockquote>", "<p>То есть взгляд произошёл непреднамеренно.<\/p>", "<p>Однако даже если человек увидел\nчто-либо без намерения, впоследствии\nдурное начало может овладеть им и\nзаставить желать увиденную красоту,\nтак что человеку станет трудно отвести\nот неё глаза.<\/p>", "<p>Поэтому каждый боящийся греха должен\nмолиться Господу об этом, подобно тому\nкак рабби Александри после своей молитвы\nговорил:<\/p>", "<blockquote>«Да будет воля Твоя, Господь, Бог\nнаш, чтобы Ты поставил нас в угол света\nи не поставил нас в угол тьмы…»<br/>\n(Брахот\n17а).<\/blockquote>", "<p>То есть: чтобы мы не оказались в\nположении, где непреднамеренно увидим\nто, что не следует видеть, и вследствие\nэтого не придём к духовному падению.<\/p>", "<p>И далее:<\/p>", "<blockquote><strong>«И пусть не скорбит наше\nсердце, и пусть не померкнут наши глаза».<\/strong><\/blockquote>"]}, {"title": "МАХАЗЕ III", "body": ["<h2 class=\"western\" id=\"section-39\"><font size=\"6\">МАХАЗЕ\nIII<\/font><\/h2>", "<h1 class=\"western\" id=\"section-40\"><font size=\"4\">Сила\nдурного начала соблазнять и вводить\nчеловека в грех действует посредством\nзрения<\/font><\/h1>", "<h1 class=\"western\" id=\"section-41\"><font size=\"4\">Дурное\nначало ловит человека посредством того,\nчто видят его глаза<\/font><\/h1>", "<p>В книге Теилим написано:<\/p>", "<blockquote>«Изречение греха нечестивцу —\nв глубине сердца моего: нет страха\nБожьего перед глазами его. Ибо льстит\nон ему в глазах его, чтобы найти грех\nего и возненавидеть. Слова уст его —\nбеззаконие и обман; перестал он разуметь,\nчтобы творить добро. Беззаконие замышляет\nон на ложе своём, становится на путь\nнедобрый, зла не отвергает»<br/>\n(Теилим\n36:2–5).<\/blockquote>", "<p>В этих стихах сладкозвучный певец\nИзраиля приходит научить всех людей\nтому, <strong>как действует дурное начало<\/strong>.<\/p>", "<p>Оно ловит душу человека посредством\nтого, что видят его глаза: человек смотрит\nна всевозможные предметы страсти и\nжелания и на всё нечистое.<\/p>", "<h1 class=\"western\" id=\"section-42\"><font size=\"4\">Дурное\nначало склоняет человека относиться к\nохране глаз легкомысленно<\/font><\/h1>", "<p>Первое, что дурное начало говорит\nсердцу человека:<\/p>", "<p>«Подними же глаза свои и смотри на\nвсё, чего пожелает твоя душа: на красивую\nженщину — незамужнюю или замужнюю, дочь\nИзраиля или женщину из другого народа.<\/p>", "<p>Смотри на их лица, руки, внешний вид,\nодежды и украшения.<\/p>", "<p>Ведь не за такие вещи Бог приведёт\nтебя на суд! Ты же не совершаешь никакого\nдурного действия — ты всего лишь\nсмотришь».<\/p>", "<p>Так дурное начало соблазняет человека.<\/p>", "<p>И посредством этого оно ловит его,\nчтобы толкать всё дальше — от одного\nпадения к другому.<\/p>", "<p>Сначала:<\/p>", "<p><strong>глаз видит.<\/strong><\/p>", "<p>После этого:<\/p>", "<p><strong>сердце желает.<\/strong><\/p>", "<p>А затем органы действия совершают\nвсевозможные мерзости.<\/p>", "<p>Вначале — лёгкие преступления, а после\nних — тяжёлые.<\/p>", "<p>Так дурное начало постепенно сталкивает\nчеловека вниз.<\/p>", "<p>В начале своего падения человек\nспотыкается посредством зрения, а в\nконце его умышленным грехам уже нет\nчисла — в мысли, речи и действии.<\/p>", "<p>Поэтому каждый духовно чувствительный\nчеловек должен укрепиться и приложить\nвсе силы, чтобы <strong>закрывать глаза и\nне видеть зло<\/strong>.<\/p>", "<p>Тогда дурное начало не будет властвовать\nнад ним.<\/p>", "<p>И так сказал сладкозвучный певец\nИзраиля:<\/p>", "<blockquote>«В глубине сердца моего…»<\/blockquote>", "<p>Эта мысль постоянно скрыта в моём\nсердце.<\/p>", "<p>Об этом я размышляю каждый день, во\nвсякое время и во всякий час, никогда\nне выпуская из сознания, что:<\/p>", "<blockquote>«Изречение греха…»<\/blockquote>", "<p>— это дурное начало.<\/p>", "<p>Как сказали наши мудрецы:<\/p>", "<blockquote>«Нечестивых судит дурное начало,\nкак сказано: “Изречение греха\nнечестивцу…”»<br/>\n(Брахот 61б).<\/blockquote>", "<p>Первое «изречение», с которым дурное\nначало обращается к нечестивцу, состоит\nв следующем:<\/p>", "<blockquote>«Нет страха Божьего… перед\nглазами его».<\/blockquote>", "<p>То есть оно говорит человеку:<\/p>", "<p>«Относительно того, <strong>что видят\nтвои глаза<\/strong>, тебе нечего бояться\nсуда и отчёта».<\/p>", "<p>Иными словами, оно внушает ему:<\/p>", "<p>«Да, конечно, перед твоими руками,\nногами и прочими органами должен\nнаходиться страх Божий, ибо:<\/p>", "<blockquote>“Всякое дело Бог приведёт на\nсуд”.<\/blockquote>", "<p>Но за один только взгляд Он тебя на\nсуд не приведёт. Смотреть и разглядывать\nвсё, что возбуждает страсть и желание,\nразрешено».<\/p>", "<h1 class=\"western\" id=\"section-43\"><font size=\"4\">Соблазн\nдурного начала: смотреть на зло, но не\nгрешить<\/font><\/h1>", "<p>Но «грех» — то есть дурное начало —\nне довольствуется тем, что внушает\nчеловеку отсутствие суда за взгляд и\nчто смотреть на зло якобы разрешено.<\/p>", "<p>Оно ещё более:<\/p>", "<blockquote>«льстит ему…»<\/blockquote>", "<p>своими речами, подобно сказанному:<\/p>", "<blockquote>«Льстивы её речи»<br/>\n(Мишлей 7:5).<\/blockquote>", "<p>Оно начинает утверждать, что смотреть\nглазами на зло — не просто разрешено,\nа будто бы даже <strong>является заповедью<\/strong>.<\/p>", "<p>Как?<\/p>", "<blockquote>«В глазах его — чтобы найти грех\nего».<\/blockquote>", "<p>То есть дурное начало советует:<\/p>", "<p>«Ищи своими глазами и найди именно\n<strong>свой грех<\/strong> — то преступление,\nк которому ты особенно стремишься и\nкоторого желаешь».<\/p>", "<p>Ведь разные люди испытывают особое\nвлечение к разным грехам.<\/p>", "<p>«А затем, — продолжает дурное начало,\n— преодолей свою природу и возненавидь\nэтот грех.<\/p>", "<p>Даже увидев его собственными глазами,\nне желай его в сердце.<\/p>", "<p>Тогда ты действительно будешь человеком,\n<strong>покоряющим своё дурное начало<\/strong>.<\/p>", "<p>Ты увидел предмет страсти, но твои\nмысли всё равно остались чистыми.<\/p>", "<p>И тогда тебя по праву можно будет\nназвать героем».<\/p>", "<p>Как учили в Мишне:<\/p>", "<blockquote>«Кто герой? Тот, кто покоряет своё\nдурное начало»<br/>\n(Авот 4:1).<\/blockquote>", "<p>Чему это подобно?<\/p>", "<p>Воину, служащему в армии.<\/p>", "<p>Если он будет избавлен от встречи со\nвсяким врагом и вообще не выйдет сражаться\nс ним, как можно будет увидеть, что он\nдействительно храбрый воин и человек\nвойны?<\/p>", "<p>Но если он выйдет на войну против\nсильных и вооружённых врагов, одолеет\nих и полностью разгромит, тогда он\nвозвысится в глазах царя и князей.<\/p>", "<p>Его поставят на высокий военный пост,\nи царь даст ему большую награду.<\/p>", "<p>Так же, говорит автор, дурное начало\nобращается к человеку:<\/p>", "<p>«Если ты закроешь глаза, чтобы не\nвидеть зло, как можно будет доказать,\nчто ты герой и владеешь своим духом?<\/p>", "<p>Но если ты выйдешь на войну — поднимешь\nглаза и будешь смотреть на всё, чего\nжелает твоя душа, — и при этом сумеешь\nвладеть собой, не возжелаешь и не\nподдашься страсти, тогда ты возвысишься\nв глазах Господа и получишь от Него\nсовершенную награду».<\/p>", "<h1 class=\"western\" id=\"section-44\"><font size=\"4\">Дурной\nвзгляд запрещён сам по себе, даже если\nвслед за ним человек не согрешит<\/font><\/h1>", "<p>Однако:<\/p>", "<blockquote>«Слова уст его…»<\/blockquote>", "<p>то есть слова «греха» — дурного начала\n—<\/p>", "<blockquote>«…беззаконие и обман».<\/blockquote>", "<p>То, что дурное начало внушало человеку:<\/p>", "<blockquote>«Нет страха Божьего перед глазами\nего»,<\/blockquote>", "<p>будто разрешено смотреть и разглядывать\nвсё, что возбуждает страсть и желание,\nи в самом зрении нет никакого преступления,\n— <strong>неверно<\/strong>.<\/p>", "<p>В действительности это:<\/p>", "<blockquote>«беззаконие».<\/blockquote>", "<p>Сам такой взгляд запрещён.<\/p>", "<p>А то, что дурное начало добавляет:<\/p>", "<p>«Более того, смотреть — это даже\nзаповедь, поскольку таким образом ты\nсможешь покорить дурное начало и\nпреодолеть свою природу»,<\/p>", "<p>— это уже:<\/p>", "<blockquote>«слова обмана».<\/blockquote>", "<p>Оно обманывает человека, заставляя\nего считать <strong>преступление заповедью<\/strong>.<\/p>", "<p>Поэтому каждый человек должен\nчрезвычайно тщательно оберегать свою\nдушу от дурного начала, чтобы оно не\nпоймало его в расставленную сеть.<\/p>", "<p>Оно может попытаться привести в\nдоказательство следующий рассказ\nТалмуда:<\/p>", "<p>Рабби Ханина и рабби Йонатан шли по\nдороге и подошли к месту, где расходились\nдве тропы.<\/p>", "<p>Одна проходила мимо входа в место\nидолопоклонства, а другая — мимо входа\nк блудницам.<\/p>", "<p>Один сказал другому:<\/p>", "<blockquote>«Пойдём мимо места идолопоклонства,\nпоскольку это дурное начало уже зарезано».<\/blockquote>", "<p>Раши объясняет: мужи Великого Собрания\nмолились об уничтожении дурного начала\nидолопоклонства и уничтожили его.<\/p>", "<p>Но другой сказал:<\/p>", "<blockquote>«Пойдём мимо входа к блудницам\nи покорим наше дурное начало»<br/>\n(Авода\nЗара 17а).<\/blockquote>", "<p>Однако из этого рассказа <strong>нельзя\nдоказывать<\/strong>, будто существует\nдостоинство в том, чтобы намеренно\nсмотреть на запрещённое, а затем\nпреодолевать желание согрешить.<\/p>", "<p>Напротив, смысл слов:<\/p>", "<blockquote>«и покорим наше дурное начало»<\/blockquote>", "<p>состоит в том, что они пройдут там <strong>и\nне станут смотреть на них<\/strong>.<\/p>", "<p>Ибо смотреть на чужую женщину — <strong>само\nпо себе преступление<\/strong>, независимо\nот того, последует ли за взглядом другой\nгрех.<\/p>", "<p>Тора прямо предостерегает об этом:<\/p>", "<blockquote>«Берегись всего дурного»<br/>\n(Дварим\n23:10).<\/blockquote>", "<p>И наши мудрецы объяснили:<\/p>", "<blockquote>«Чтобы человек не смотрел на\nженщину…»<br/>\n(Авода Зара 20а).<\/blockquote>", "<p>Следовательно, борьба с дурным началом\nзаключается не в том, чтобы намеренно\nподвергать себя запрещённому зрелищу,\nсмотреть на него, а затем пытаться\nпобедить возникшее желание.<\/p>", "<p>Напротив: <strong>сама охрана глаз и отказ\nот запрещённого взгляда уже являются\nпобедой над дурным началом.<\/strong><\/p>", "<h1 class=\"western\" id=\"section-45\"><font size=\"4\">Дурное\nначало соблазняет человека, ведя его\nот лёгкого к тяжёлому<\/font><\/h1>", "<blockquote>«Перестал разуметь, чтобы творить\nдобро».<\/blockquote>", "<p>Если человек <strong>«перестал разуметь»<\/strong>,\nто есть перестал вдумываться и с\nразумением размышлять — «объясняя\nсмысл» (Нехемья 8:8) — о коварстве дурного\nначала, которое обманом ловит его душу;\nесли его сердце поддалось соблазну\nсмотреть глазами на всё, что возбуждает\nстрасть, и он:<\/p>", "<blockquote>«перестал… творить добро»,<\/blockquote>", "<p>то есть перестал исправлять свой путь,\nвозвращаться от этого греха и впредь\nостерегаться дурных зрелищ, — тогда\nконец будет следующим.<\/p>", "<p>После того как человек увидел глазами\nбеззаконие:<\/p>", "<blockquote>«Беззаконие замышляет он на ложе\nсвоём»,<\/blockquote>", "<p>ибо его сердце начинает желать\nувиденного.<\/p>", "<p>А затем:<\/p>", "<blockquote>«Становится на путь недобрый,\nзла не отвергает».<\/blockquote>", "<p>Органы его тела отступают от совершения\nдобра и начинают творить зло.<\/p>", "<p>Почему Писание словно повторяет эту\nмысль дважды:<\/p>", "<blockquote>«становится на путь недобрый»<\/blockquote>", "<p>и:   «зла не отвергает»?<\/p>", "<p>Потому что сначала человек <strong>отступает\nот добра<\/strong>: перестаёт совершать\nдобрые дела и тратит своё время на вещи,\nкоторые хотя и не обязательно являются\nзлом, но и добром не являются.<\/p>", "<p>Однако каждое мгновение человеческой\nжизни драгоценнее любого богатства.<\/p>", "<p>Как учил рабби Тарфон:<\/p>", "<blockquote>«День короток, а работы много…»<br/>\n(Авот\n2:15).<\/blockquote>", "<p>См. также книгу «Шем Олам» гаона рабби\nИсраэля Меира а-Коэна, гл. 20, где объясняется\nтяжесть нерадения и воздержания от\nизучения Торы и исполнения заповедей:\nэто вечная потеря, которая в определённом\nотношении ещё тяжелее наказания за\nсовершённые преступления.<\/p>", "<p>А после того как человек отступил от\nдобра, он начинает уже <strong>совершать\nзло<\/strong>.<\/p>", "<p>Именно таков путь дурного начала:\nсначала склонить человека к лёгкому\nгреху, а затем — к тяжёлому; сначала\nзаставить его отойти от добра, а затем\nпривести к совершению зла.<\/p>", "<p>Как сказали наши мудрецы:<\/p>", "<blockquote>«Таково ремесло дурного начала:\nсегодня оно говорит ему: “Сделай это”,\nзавтра говорит: “Сделай то”, пока\nнаконец не скажет ему: “Иди и служи\nидолам”, — и тот идёт и служит»<br/>\n(Шаббат\n105б).<\/blockquote>", "<p>В книге Мишлей написано:<\/p>", "<blockquote>«Не будь мудрецом в собственных\nглазах; бойся Господа и удаляйся от\nзла»<br/>\n(Мишлей 3:7).<\/blockquote>", "<p>Не мудрствуй, говоря:<\/p>", "<p>«Я могу смотреть своими глазами на\nлюбое зло и всё же не пожелать его в\nсвоём сердце».<\/p>", "<p>Нет.  «Бойся Господа» —<\/p>", "<p>Который заповедал в Своей Торе:<\/p>", "<blockquote>«Берегись всего дурного»,<\/blockquote>", "<p>и:   «удаляйся от зла» —<\/p>", "<p>не смотри на зло.<\/p>", "<p>Тогда дурное начало не будет властвовать\nнад тобой.<\/p>", "<p>Ибо наши мудрецы сказали:<\/p>", "<blockquote>«Принято нами: дурное начало\nвластвует лишь над тем, что видят глаза\nчеловека»<br/>\n(Сота 8а).<\/blockquote>", "<p>И ещё сказали мудрецы:<\/p>", "<blockquote>«Не споткнись посредством своих\nглаз, ибо препятствие прежде всего\nсвязано с глазами. Так ты находишь у Узы\nи Азаэля: они споткнулись именно\nпосредством глаз своих, как сказано: “И\nувидели сыны Божьи дочерей\nчеловеческих…”»<br/>\n(Калла Раббати;\nБерешит 6:2).<\/blockquote>", "<h1 class=\"western\" id=\"section-46\"><font size=\"4\">Слёзы\nв глазах — потому что глаза стали\nпричиной всего зла<\/font><\/h1>", "<p>Задумаемся.<\/p>", "<p>Когда человек плачет от сильной боли\nи множества бед, вода течёт именно <strong>из\nего глаз<\/strong>.<\/p>", "<p>Почему Господь устроил так, чтобы вода\nисходила из глаз, а не из других органов?<\/p>", "<p>Если поражена рука, нога или иной орган\nтела — всё равно плачут глаза.<\/p>", "<p>Почему же именно глаза плачут за все\nорганы тела?<\/p>", "<p>Причина в следующем.<\/p>", "<p><strong>Глаза человека являются началом\nвсякого греха.<\/strong><\/p>", "<p>А вследствие своих грехов человек\nприходит к бедам и страданиям.<\/p>", "<p>Поэтому, когда человеку тесно, тяжело\nи горько, именно глаза проливают слёзы\n— ведь они привели человека ко всему\nэтому злу и ко всем этим бедствиям.<\/p>", "<p>И об этом сказано:<\/p>", "<blockquote>«Потоки вод изливают глаза мои,\nпотому что не хранили Тору Твою»<br/>\n(Теилим\n119:136).<\/blockquote>", "<p>Не сказано:  «потому что <strong>я<\/strong> не\nхранил Тору Твою»,<\/p>", "<p>но:   «потому что <strong>они не хранили<\/strong>\nТору Твою».<\/p>", "<p>То есть — <strong>потому что глаза не\nхранили Твою Тору<\/strong><br/>\n(см. «Рамат\nШмуэль», маамар «Бейт Авель», гл. 7).<\/p>", "<p>И потому именно они проливают потоки\nводы.<\/p>", "<h1 class=\"western\" id=\"section-47\"><font size=\"4\">Закрывание\nглаз — защита от всех грехов<\/font><\/h1>", "<p>Чему это подобно?<\/p>", "<p>Государству, на границе которого стоят\nстражники, чтобы следить, чтобы из-за\nграницы не ввозили различные товары\nбез уплаты пошлины.<\/p>", "<p>Если стражники находятся на своём\nпосту <strong>у самой границы<\/strong>, им не\nприходится чрезмерно трудиться и\nутомляться, а польза от их охраны весьма\nвелика.<\/p>", "<p>Но если они оставят границу и станут\nходить по всей стране — из города в\nгород и из деревни в деревню, разыскивая\nи расследуя, где находятся товары, уже\nввезённые из-за границы, — тогда их\nработа станет огромной и тяжёлой.<\/p>", "<p>Они будут трудиться и изнемогать, а\nпользы принесут мало.<\/p>", "<p>Ведь после того, как торговцы уже\nпровезли свои товары через границу, у\nних имеется множество мест, где можно\nих спрятать, так что стражники не найдут\nих даже после самых тщательных поисков.<\/p>", "<p>То же самое происходит с человеком.<\/p>", "<p>Если человек <strong>закрывает глаза,\nчтобы не видеть зло<\/strong>, он подобен\nстражнику, стоящему непосредственно\nна границе.<\/p>", "<p>Он не позволяет дурному началу вообще\nвойти на его территорию.<\/p>", "<p>Но если человек уже увидел глазами и\nвозжелал сердцем, дурное начало <strong>перешло\nграницу<\/strong> и провезло через неё свой\nтовар — всё то, что было вожделенно для\nглаз.<\/p>", "<p>Теперь у него есть множество мест, где\nможно спрятать свои товары.<\/p>", "<p>Эти места — <strong>все органы человеческого\nтела<\/strong>.<\/p>", "<p>А товары дурного начала — <strong>грехи,\nбеззакония и преступления<\/strong>.<\/p>", "<p>Иногда оно заставляет человека\nсогрешить рукой, иногда — ногой, иногда\n— ртом и губами и т. д.<\/p>", "<p>После этого человеку уже чрезвычайно\nтрудно избавиться от него, исследовать\nи проверять свои поступки<br/>\n(см. Эрувин\n13б) и находить спрятанные «товары»\nдурного начала.<\/p>", "<p>Таково общее правило:<\/p>", "<p><strong>у человека, который смотрит глазами\nна всё, что возбуждает страсть и желание,\nумножаются как неумышленные, так и\nумышленные грехи<\/strong>, ибо он открыл\nграницу перед деятельным торговцем,\nисполненным коварства.<\/p>", "<p>Поэтому каждый духовно чувствительный\nчеловек должен закрывать глаза, чтобы\nне видеть зло, и не позволять дурному\nначалу войти в свои пределы.<\/p>", "<h1 class=\"western\" id=\"section-48\"><font size=\"4\">Возвращаясь\nот грехов, следует проливать слёзы,\nисправляя то, что было испорчено глазами<\/font><\/h1>", "<p>Если человек видит, что на него приходят\nстрадания, пусть исполнит наставление\nнаших мудрецов:<\/p>", "<blockquote>«Если человек видит, что на него\nприходят страдания, пусть исследует\nсвои поступки, как сказано: “Исследуем\nпути наши и испытаем их”. Исследовал и\nнашёл [грех] — пусть совершит тшуву, как\nсказано: “И возвратимся к Господу”»<br/>\n(Брахот\n5а; Эйха 3:40).<\/blockquote>", "<p>Когда человек возвращается от своих\nгрехов, пусть молится Господу, чтобы Он\nпростил его и благоволил к нему так,\nсловно тот никогда не грешил.<\/p>", "<p>Пусть просит Его помочь ему возвратиться\nвсем сердцем и более не возвращаться к\nбезумию, как объясняет Рабейну Йона в\nкниге «Шаарей Тшува»<br/>\n(врата 1, принцип\n15).<\/p>", "<p>И когда человек молится об этом, пусть\nтакже <strong>проливает слёзы<\/strong>.<\/p>", "<p>Ибо наши мудрецы сказали:<\/p>", "<blockquote>«Со дня разрушения Храма врата\nмолитвы закрылись, как сказано: “Даже\nкогда я взываю и кричу, Он преграждает\nмолитву мою” (Эйха 3:8). Но хотя врата\nмолитвы закрылись, врата слёз не\nзакрылись, как сказано: “К слезе моей\nне будь безмолвен”»<br/>\n(Брахот 32б; Теилим\n39:13).<\/blockquote>", "<p>И всякий раз, когда из его глаз потекут\nслёзы, пусть он скажет в своём сердце:<\/p>", "<p><strong>«Кто стал причиной всего, что\nпостигло меня? Разве не глаза?»<\/strong><\/p>", "<p>Именно поэтому сказано:<\/p>", "<blockquote>«Глаз мой, глаз мой изливает\nводу»<br/>\n(Эйха 1:16).<\/blockquote>", "<p>Мидраш объясняет:  <strong>«Глаз мой плачет\nо глазе моём».<\/strong><\/p>", "<p>Мой глаз плачет и проливает слёзы,\nпотому что именно он привёл меня ко всем\nмоим грехам и ко всем моим бедам — тем,\nчто смотрел на всё возбуждающее страсть\nи желание и на всё нечистое.<\/p>", "<p>И об этом говорит Плачущий пророк:<\/p>", "<blockquote>«Потоки вод изливает глаз мой\nиз-за сокрушения дочери народа моего.\nГлаз мой течёт и не перестаёт, без\nпередышки, пока не взглянет и не увидит\nГосподь с Небес. Глаз мой причинил зло\nдуше моей более всех дочерей города\nмоего»<br/>\n(Эйха 3:48–51).<\/blockquote>", "<p>Почему:   «потоки вод изливает глаз\nмой»,<\/p>", "<p>и:      «глаз мой течёт»?<\/p>", "<p>Потому что:     «глаз мой причинил зло\nдуше моей».<\/p>", "<p>То есть мой глаз <strong>испортил и\nзагрязнил мою душу<\/strong><br/>\n(см. Раши)<\/p>", "<p>больше, чем:   «все дочери города моего».<\/p>", "<p>Здесь «город» можно понимать как образ\nчеловеческого тела, а его «жителей» —\nкак органы человека.<\/p>", "<p>Подобно тому как наши мудрецы истолковали\nстих:<\/p>", "<blockquote>«Маленький город, и людей в нём\nнемного» \n<\/blockquote>", "<p><strong>«это органы [человеческого\nтела]»<\/strong><br/>\n(Недарим 32б).<\/p>", "<p>Таким образом, глаз оплакивает то, что\nсам же испортил: слёзы становятся частью\nтшувы и исправления того вреда, начало\nкоторому было положено зрением.<\/p>"]}, {"title": "МАХАЗЕ IV", "body": ["<h2 class=\"western\" id=\"section-49\"><font size=\"6\">МАХАЗЕ\nI<span lang=\"en-US\">V<\/span><\/font><\/h2>", "<p>\n<font face=\"Times New Roman, serif\"><font size=\"4\"><b>Всякий\nзапретный взгляд приводит к греху, а\nвсякий добрый взгляд ведёт к святости<\/b><\/font><\/font><\/p>", "<h1 class=\"western\" id=\"section-50\"><font size=\"4\">Тот,\nкто смотрит глазами на запретное, в\nконце концов может согрешить своим\nтелом<\/font><\/h1>", "<p>Написано в книге Мишлей (Притчи 21:4):<\/p>", "<p>«Надменные глаза и гордое сердце —\nсветильник нечестивых, грех».<\/p>", "<p>Этот стих объясняется словами наших\nмудрецов (Мидраш, глава 10).<\/p>", "<p>Написано (Мишлей 23:26):<\/p>", "<p>«Сын мой, отдай Мне своё сердце, и пусть\nглаза твои хранят пути Мои».<\/p>", "<p>Почему Всевышний потребовал от народа\nИзраиля именно сердце и глаза, чтобы\nони следовали за Ним?<\/p>", "<p>Потому что именно от них зависит\nсовершение греха.<\/p>", "<p>Об этом сказано в Торе:<\/p>", "<p>«И не следуйте за сердцем вашим и за\nглазами вашими, вслед за которыми вы\nблуждаете» (Бемидбар 15:39).<\/p>", "<p>Глаза и сердце — два посредника,\nведущие человека к греху. Глаза видят,\nа сердце начинает размышлять об увиденном.<\/p>", "<p>Наши мудрецы также сказали (Иерусалимский\nТалмуд, Брахот 1:5):<\/p>", "<p>Написано: «Сын мой, отдай Мне своё\nсердце, и пусть глаза твои хранят пути\nМои» (Мишлей 23:26).<\/p>", "<p>Сказал Всевышний:<\/p>", "<p>«Если ты отдашь Мне своё сердце и свои\nглаза, Я буду знать, что ты принадлежишь\nМне».<\/p>", "<p>Именно в этом заключается смысл стиха:<\/p>", "<p>«Надменные глаза» — это когда человек\nподнимает свой взор и рассматривает\nвсевозможные соблазны этого мира.<\/p>", "<p>«И широкое сердце» — это когда его\nсердце размышляет обо всём, что увидели\nглаза, желает этого и стремится получить\nудовольствие от увиденного.<\/p>", "<p>Именно они становятся «светильником\nнечестивых», ведущим ко всякому греху.<\/p>", "<p>Ведь когда сердце начинает вынашивать\nдурные мысли о том, что увидели глаза,\nиз этого произрастает грех.<\/p>", "<p>Глаз видит, сердце желает, а органы\nтела завершают действие.<\/p>", "<p>А слово «светильник» (<font face=\"Tahoma\"><span lang=\"he-IL\">נר<\/span><\/font>)\nздесь объясняется автором в связи с\nобразом вспахивания земли и последующего\nпроизрастания.<\/p>", "<p>Ведь наши мудрецы сказали (Брахот\n61а):<\/p>", "<p>«Злое начало подобно пшеничному зерну,\nкак сказано: \"У входа грех лежит\"\n(Берешит 4:7)».<\/p>", "<p>Раши объясняет, что мудрецы истолковывают\nэто выражение через образ пшеницы.<\/p>", "<p>Подобно тому как вспахивание земли в\nконечном итоге приводит к произрастанию\nпшеницы, так и запретный взгляд вместе\nс дурными мыслями способствует развитию\nзлого начала в человеке.<\/p>", "<p>Общее правило таково:<\/p>", "<p>Всякий, кто смотрит глазами на запретное\nи желает этого в своих мыслях, в конце\nконцов придёт к греху посредством своего\nтела и может оказаться неспособным\nудержаться от осуществления своего\nдурного замысла.<\/p>", "<p>Так сказали наши мудрецы (Недарим\n20а):<\/p>", "<p>«Всякий, кто пристально рассматривает\nженщин, в конце концов приходит к греху».<\/p>", "<p>И написано в книге Бен-Сиры:<\/p>", "<p>«Отведи глаза свои от красивой женщины,\nчтобы не попасть в её сети. Не садись\nрядом с её мужем, чтобы пить с ним вино\nи крепкие напитки, ибо красота женщины\nпогубила многих, и многочисленны те,\nкто пал из-за неё» (Санhedрин 100б).<\/p>", "<h1 class=\"western\" id=\"section-51\"><font size=\"4\">Даже\nв старости человек обязан беречь свои\nглаза<\/font><\/h1>", "<p>Пусть пожилой человек, достигший\nпреклонных лет, не говорит:<\/p>", "<p>«Вот я состарился, и, как сказано: \"И\nослабеет желание\" (Коэлет 12:5; см.\nШаббат 152а). Почему же я должен опасаться\nсмотреть на женщину? Ведь страсть и\nвлечение уже покинули меня».<\/p>", "<p>Пусть он не говорит так — по двум\nпричинам.<\/p>", "<p><b>Первая причина: никогда не полагайся\nна себя до последнего дня своей жизни<\/b><\/p>", "<p>Ведь учили наши мудрецы (Пиркей Авот\n2:4):<\/p>", "<p>«Не верь самому себе до дня своей\nсмерти».<\/p>", "<p>И сказали наши мудрецы (Иерусалимский\nТалмуд, Шаббат 1:3):<\/p>", "<p>Однажды один благочестивый человек\nсидел и повторял слова:<\/p>", "<p>«Не верь самому себе до дня своей\nстарости».<\/p>", "<p>Он рассуждал так, потому что считал:\n«Я уже состарился и больше не могу\nсогрешить».<\/p>", "<p>Тогда пришёл к нему один дух, принявший\nоблик красивой женщины, и подверг его\nиспытанию.<\/p>", "<p>Этот человек поддался искушению и\nначал сильно раскаиваться в своём\nпоступке.<\/p>", "<p>Но дух сказал ему:<\/p>", "<p>«Не печалься! Я — дух, а не настоящая\nженщина, поэтому ты не согрешил с\nженщиной. Однако иди и расскажи своим\nтоварищам, что правильно учить: \"Не\nверь самому себе до дня своей смерти\"».<\/p>", "<p>Также сказали наши мудрецы (Мидраш\nТеилим, 15):<\/p>", "<p>Написано:<\/p>", "<p>«К святым, которые на земле» (Теилим\n16:3).<\/p>", "<p>Всевышний не называет праведников\nсвятыми до тех пор, пока они не окажутся\nв земле, то есть до дня их смерти.<\/p>", "<p>Почему?<\/p>", "<p>Потому что злое начало преследует\nчеловека на протяжении всей его жизни\nв этом мире.<\/p>", "<p>Поэтому даже праведнику нельзя\nокончательно доверять в этом отношении\nдо дня его смерти.<\/p>", "<p>Так и царь Шломо говорит:<\/p>", "<p>«Ибо нет праведного человека на земле,\nкоторый делал бы только добро и не\nгрешил» (Коэлет 7:20).<\/p>", "<p>Поэтому человек не называется святым\nокончательно, пока не будет предан\nземле.<\/p>", "<p>Даже праотцы не назывались святыми\nдо того, как покинули этот мир.<\/p>", "<p>Как сказано (Иов 15:15):<\/p>", "<p>«Вот, даже святым Своим Он не доверяет».<\/p>", "<p>На этом заканчиваются слова Мидраша.<\/p>", "<p>А если так, то тем более это относится\nк обычным людям.<\/p>", "<p>Ведь если даже величайшие праведники,\nкоторые всю жизнь строго оберегали себя\nот запретных связей, не считались\nполностью защищёнными от греха до самого\nдня смерти, то насколько же больше это\nотносится к людям, которые на протяжении\nсвоей жизни допускали дурные мысли!<\/p>", "<p>См. Бава Батра 164б.<\/p>", "<p>Поэтому написано в книге Иова (15:15–16):<\/p>", "<p>«Вот, даже святым Своим Он не доверяет...\nТем более человеку мерзкому и развращённому,\nкоторый пьёт беззаконие, словно воду».<\/p>", "<p>И даже если человек уже достиг глубокой\nстарости, когда, как выражаются мудрецы,\n«в доме наступил мир» и телесная сила\nослабела (см. Шаббат 152а), всё же, когда\nдело касается греха, в нём неожиданно\nмогут пробудиться силы и страсть.<\/p>", "<p>Подобное произошло с рабби Хией бар\nАши, о чём рассказывается в трактате\nКидушин.<\/p>", "<p><b>Вторая причина: даже если человек\nне совершает грех телом, он всё ещё может\nсогрешить в мыслях<\/b><\/p>", "<p>Даже если в старости человек уже не\nспособен совершить определённый грех\nфизически, это ещё не означает, что он\nсвободен от греховных мыслей.<\/p>", "<p>Как сказали наши мудрецы (Шаббат 64а):<\/p>", "<p>Написано:<\/p>", "<p>«И разгневался Моше на военачальников»\n(Бемидбар 31:14).<\/p>", "<p>Сказал рав Нахман от имени Раббы бар\nАвуа:<\/p>", "<p>Моше спросил сынов Израиля:<\/p>", "<p>«Неужели вы снова вернулись к своему\nпрежнему греху?»<\/p>", "<p>Они ответили ему:<\/p>", "<p>«Никто из нас не совершил греха».<\/p>", "<p>Тогда Моше спросил:<\/p>", "<p>«Если так, зачем же вам необходимо\nискупление?»<\/p>", "<p>Они ответили:<\/p>", "<p>«Хотя мы и избежали самого греховного\nпоступка, но греховных мыслей нам\nизбежать не удалось».<\/p>", "<p>И сразу после этого сказано:<\/p>", "<p>«И принесли мы жертву Господу» (Бемидбар\n31:50).<\/p>", "<p>В школе рабби Ишмаэля учили:<\/p>", "<p>Почему сыны Израиля того поколения\nнуждались в искуплении?<\/p>", "<p>Потому что они питали свои глаза\nсозерцанием запретного.<\/p>", "<p>Рав Шешет сказал:<\/p>", "<p>Почему Тора перечисляет внешние\nукрашения женщин вместе с украшениями,\nкоторые носят на скрытых частях тела?<\/p>", "<p>Чтобы научить нас:<\/p>", "<p>«Всякий, кто смотрит на мизинец женщины\nс намерением получить от этого чувственное\nудовольствие, словно смотрит на её\nинтимные части тела».<\/p>", "<p>Следовательно, подобно тому как\nчеловеку запрещено смотреть на интимные\nчасти тела женщины ради наслаждения,\nдаже если он достиг глубокой старости,\nтак же запрещено ему смотреть с подобным\nнамерением даже на её мизинец.<\/p>", "<p>Также сказали наши мудрецы (Брахот\n61а):<\/p>", "<p>«Тот, кто передаёт деньги женщине из\nруки в руку специально для того, чтобы\nсмотреть на неё, даже если у него есть\nзаслуги изучения Торы и добрых дел,\nподобные заслугам Моше Рабейну, не\nизбежит наказания Геенома».<\/p>", "<p>Как сказано (Мишлей 11:21):<\/p>", "<p>«Рука об руку — злодей не останется\nбез наказания».<\/p>", "<p>То есть он не избежит наказания Геенома.<\/p>", "<p>И сказали наши мудрецы (Ваикра Рабба,\nглава 23):<\/p>", "<p>«Не думай, что прелюбодеем называется\nтолько тот, кто совершает прелюбодеяние\nсвоим телом. Даже тот, кто совершает\nпрелюбодеяние глазами, называется\nпрелюбодеем».<\/p>", "<p>Как сказано (Иов 24:15):  «И глаз\nпрелюбодея...»<\/p>", "<p>Из этого видно, насколько тяжёлым\nсчитается грех запретного созерцания\nженщины.<\/p>", "<p>Ведь даже если человек, который смотрит\nна неё, не совершит вследствие увиденного\nфизического греха и не придёт к ночной\nнечистоте, тем не менее он всё равно\nназывается прелюбодеем.<\/p>", "<p>Почему?<\/p>", "<p>Потому что он грешит посредством\nорганов зрения и питает свои глаза\nзапретными образами.<\/p>", "<p>Ведь удовольствие от созерцания\nженщины может быть даже сильнее\nудовольствия от самого физического\nдействия.<\/p>", "<p>Как сказали наши мудрецы (Йома 74б):<\/p>", "<p>Написано (Коэлет 6:9):<\/p>", "<p>«Лучше видеть глазами, чем блуждать\nдушой».<\/p>", "<p>Мудрецы объяснили:<\/p>", "<p>«Удовольствие от созерцания женщины\nможет быть сильнее удовольствия от\nсамого действия».<\/p>", "<p>Также сказали наши мудрецы (трактат\nКалла; см. примечания Виленского Гаона):<\/p>", "<p>«Всякий, кто намеренно смотрит на\nженщину ради чувственного наслаждения,\nсловно вступил с ней в запрещённую\nсвязь».<\/p>", "<p>Поэтому каждый мужчина, даже достигший\nглубокой старости, должен беречь свои\nглаза и не смотреть на женщину с намерением\nполучить запретное наслаждение — даже\nна её мизинец.<\/p>", "<h1 class=\"western\" id=\"section-52\"><font size=\"4\">Запрещено\nсмотреть даже на изображения и рисунки\nженщин<\/font><\/h1>", "<p>Запрещено смотреть на нарисованные\nизображения женщин [фотографии], поскольку\nэто приводит к греховным мыслям и сильно\nпробуждает страсть.<\/p>", "<p>Наши мудрецы сказали (Санhedрин 39б):<\/p>", "<p>«И блудницы омывались» (Млахим I, 22:38)\n— речь идёт о настоящих блудницах. Ахав\nбыл человеком холодной природы, и Изевель\nсделала для него два изображения блудниц\nв его колеснице, чтобы он смотрел на них\nи возбуждался.<\/p>", "<p>Ведь наши мудрецы сказали (Авода Зара\n20б), что человеку запрещено смотреть\nдаже на цветные одежды женщины, развешанные\nна стене. Тем более запрещено смотреть\nна изображение женщины, будь то объёмная\nскульптура или рисунок, выполненный\nкрасками (см. Йоре Деа, 141:4).<\/p>", "<p>Ведь изображение, выполненное красками\n[картина], пробуждает страсть даже\nсильнее, чем объёмная скульптура.<\/p>", "<p>И написано в книге «Решит Хохма» (Шаар\nа-Кдуша, глава 8):<\/p>", "<p>«Из этой барайты ты учишь, что если\nмудрецы запретили смотреть на цветные\nодежды женщины, развешанные на стене,\nкогда человек знаком с этой женщиной,\nто тем более запрещено смотреть на\nкровать, на которой спят муж и жена, если\nчеловек знаком с ними, поскольку это\nещё сильнее пробуждает в нём страсть\nдурного начала».<\/p>", "<p>Конец цитаты.    А если так, то тем более\nзапрещено смотреть на нарисованные\nизображения женщин.<\/p>", "<p>Особенно на изображения, подобные\nописанным словами «как изображения\nмужчины и сопровождающей его женщины»\n(Млахим I, 7:36), то есть мужчины и женщины,\nкоторые держатся за руки и обнимают\nдруг друга, поскольку такие изображения\nещё сильнее пробуждают страсть дурного\nначала.<\/p>", "<p>И это совершенно очевидно.<\/p>", "<p>Хотя запрет смотреть на цветные одежды\nженщины, развешанные на стене, относится\nтолько к случаю, когда человек знаком\nс этой женщиной, однако смотреть на\nизображения женщин, висящие на стене,\nзапрещено даже тогда, когда он не знаком\nс изображёнными женщинами.<\/p>", "<p>Ведь изображение красивой женщины\nпробуждает страсть, и это входит в\nзапрет:<\/p>", "<p>«И берегись всего дурного» (Дварим\n23:10).<\/p>", "<p>А если так, насколько же предосудительно\nто, что во многих домах висят изображения\n[фотографии] женщин!<\/p>", "<p>То, что в прежние времена Изевель\nсделала в колеснице Ахава, теперь делают\nдочери Израиля в своих домах: развешивают\nна стенах изображения женщин из своих\nсемей, а также самых красивых женщин\nмира, и никто не препятствует им в этом.<\/p>", "<p>Ведь с точки зрения пробуждения страсти\nнет различия между объёмной скульптурой\nи изображением, выполненным красками.\nИ то и другое пробуждает страсть.<\/p>", "<h1 class=\"western\" id=\"section-53\"><font size=\"4\">Тот,\nкто может воспрепятствовать греху, но\nне делает этого, несёт ответственность\nза грехи других<\/font><\/h1>", "<p>Поэтому каждый богобоязненный человек\nдолжен сказать изображениям женщин:\n«Прочь!»<\/p>", "<p>И не должен позволять своей жене и\nдочерям развешивать их на стенах дома.<\/p>", "<p>А если он не препятствует им в этом,\nто несёт ответственность за их грех,\nсловно он сам развешивал в своём доме\nэти вещи, отвратительные в глазах\nВсевышнего.<\/p>", "<p>Как сказали наши мудрецы (Шаббат 54б):<\/p>", "<p>«Корова рабби Элазара бен Азарьи\nвыходила в Шаббат с ремнём между рогами,\nчто было против воли мудрецов».<\/p>", "<p>Учили мудрецы:<\/p>", "<p>«На самом деле это была не его корова,\nа корова его соседки. Но поскольку он\nне воспрепятствовал этому, она стала\nназываться его именем».<\/p>", "<p>И ещё сказали наши мудрецы (там же):<\/p>", "<p>«Всякий, кто может воспрепятствовать\nгреху членов своей семьи, но не делает\nэтого, несёт ответственность за грехи\nчленов своей семьи.<\/p>", "<p>Если он может воспрепятствовать грехам\nжителей своего города, но не делает\nэтого, он несёт ответственность за грехи\nжителей своего города.<\/p>", "<p>Если он может воспрепятствовать грехам\nвсего мира, но не делает этого, он несёт\nответственность за грехи всего мира».<\/p>", "<p>Поэтому, если раввин города не\nпрепятствует своей жене и дочерям\nразвешивать изображения женщин в своём\nдоме, а жители города, видя это, начинают\nпоступать так же во всех домах города,\nто он несёт ответственность за грех\nвсего города.<\/p>", "<p>И считается, словно он сам ходил из\nдома в дом и развешивал эти отвратительные\nвещи в каждом доме.<\/p>", "<p>И горе ему от того стыда и позора,\nкоторые ожидают его в День Суда!<\/p>", "<p>Также предосудителен обычай,\nраспространившийся в наши дни, — ставить\nкровати в тех помещениях дома, куда\nвходят и откуда выходят посторонние\nлюди, а не в отдельной комнате, как это\nбыло принято прежде.<\/p>", "<p>И всё это — происки дурного начала,\nнаправленные на то, чтобы пробуждать\nстрасть в людях.<\/p>", "<h1 class=\"western\" id=\"section-54\"><font size=\"4\">Запрещено\nсмотреть на лицо нечестивого человека<\/font><\/h1>", "<p>Запрещено пристально смотреть на лицо\nнечестивого человека, поскольку наши\nмудрецы сказали (Мегила 28а):<\/p>", "<p>Рабби спросил рабби Йеошуа бен Корху:<\/p>", "<p>— Благодаря чему ты удостоился\nдолголетия?<\/p>", "<p>Тот ответил ему:<\/p>", "<p>— Неужели тебе надоела моя жизнь?<\/p>", "<p>Рабби сказал ему:<\/p>", "<p>— Учитель мой, ведь это Тора, и я должен\nеё изучить!<\/p>", "<p>Тогда рабби Йеошуа бен Корха ответил:<\/p>", "<p>— За всю свою жизнь я ни разу не смотрел\nна облик нечестивого человека.<\/p>", "<p>Ведь рабби Йоханан сказал:<\/p>", "<p>«Запрещено человеку смотреть на образ\nи облик нечестивого человека».<\/p>", "<p>Как сказано (Млахим II, 3:14):<\/p>", "<p>«Если бы не уважение к Йеошафату, царю\nИудеи, я бы не взглянул на тебя и не\nпосмотрел бы на тебя».<\/p>", "<p>Рабби Элазар сказал:<\/p>", "<p>«У того, кто смотрит на нечестивого\nчеловека, ослабевает зрение».<\/p>", "<p>Как сказано (Берешит 27:1):<\/p>", "<p>«И было, когда Ицхак состарился, и\nослабели глаза его, и он перестал видеть».<\/p>", "<p>Это произошло потому, что он смотрел\nна своего нечестивого сына Эсава.<\/p>", "<p>Рава сказал, что это учение выводится\nиз другого стиха (Мишлей 18:5):<\/p>", "<p>«Оказывать предпочтение нечестивому\n— нехорошо, чтобы отклонить праведника\nот справедливого суда».<\/p>", "<p>И представляется, что Рава объясняет\nслова «оказывать предпочтение нечестивому»\nследующим образом:<\/p>", "<p>Поднимать глаза, чтобы смотреть на\nлицо нечестивого человека, — «нехорошо».<\/p>", "<p>Почему нехорошо смотреть на него?<\/p>", "<p>Потому что это приводит к ослаблению\nзрения: глаза человека тускнеют, а сердце\nослабевает.<\/p>", "<p>Ведь сказали наши мудрецы:<\/p>", "<p>«Зрение глаз зависит от устройства\nсердца» (Авода Зара 28б).<\/p>", "<p>Раши объясняет, что свет глаз связан\nс внутренними оболочками сердца, а\nТосафот пишут, что зрение глаз зависит\nот понимания сердца.<\/p>", "<p>И это лишает человека долголетия.<\/p>", "<p>Кроме того, слова «чтобы отклонить\nправедника от справедливого суда»\nозначают, что лицо нечестивого человека\nспособно повлиять на праведника, который\nсмотрит на него, и отклонить его от пути\nВсевышнего.<\/p>", "<p>И речь идёт не только о вопросах\nблагочестия и поступках, выходящих за\nрамки строгого требования закона, но\nдаже о самом соблюдении законов и\nпостановлений Торы.<\/p>", "<p>Причина заключается в том, что нечестивый\nчеловек представляет собой нечистое\nтело, «сосуд, полный стыда и позора»\n(Брахот 17а), сосуд, наполненный духовной\nнечистотой, грехами, преступлениями и\nзлодеяниями.<\/p>", "<p>И эта нечистота отражается на его\nлице.<\/p>", "<p>Как сказано (Йешаяу 3:9):<\/p>", "<p>«Выражение их лиц свидетельствует\nпротив них».<\/p>", "<p>И как объясняется в комментарии Маарша\n(Мегила 28а):<\/p>", "<p>«Согласно учению мудрецов Каббалы, в\nчеловеческом облике и внешнем виде\nприсутствует духовная форма, относящаяся\nлибо к добру, либо ко злу, в соответствии\nс поступками человека — в сторону\nчистоты или в сторону нечистоты».<\/p>", "<p>См. там подробнее.<\/p>", "<p>Поэтому, когда человек видит лицо\nнечестивца и смотрит на отражающуюся\nв нём нечистоту, его сердце может\nсклониться ко злу, побуждая его выбирать\nпути нечестивца и следовать его дорогами.<\/p>", "<p>Как рассказывали наши мудрецы (Мидраш\nКоэлет, глава 1):<\/p>", "<p>Рабби Йонатан убегал от еретиков, а\nони бежали за ним.<\/p>", "<p>Он продолжал убегать, пока не добрался\nдо ворот, и захлопнул их перед ними.<\/p>", "<p>Тогда они закричали ему:<\/p>", "<p>— Рабби Йонатан! Иди и расскажи своей\nматери, похвастайся перед ней тем, что\nты не обернулся и не посмотрел на нас!<\/p>", "<p>Ведь если бы ты обернулся и посмотрел\nна нас, то вместо того, чтобы нам бежать\nза тобой, ты сам побежал бы за нами,\nстремясь согрешить вместе с нами!<\/p>", "<p>Насколько страшны эти слова для того,\nкто глубоко задумывается над ними!<\/p>", "<p>И каждый человек должен записать это\nнаставление на скрижали своего сердца.<\/p>", "<p>Пусть он не поднимает глаза, чтобы\nсмотреть и всматриваться в лицо\nнечестивого человека.<\/p>", "<p>И пусть очень опасается того, что через\nсозерцание лица нечестивца его собственное\nсердце может соблазниться его злодеяниями.<\/p>", "<h1 class=\"western\" id=\"section-55\"><font size=\"4\">Созерцание\nлица праведника приводит к святости<\/font><\/h1>", "<p>Пусть каждый человек поднимает свои\nглаза, чтобы видеть и созерцать лицо\nправедника, который размышляет над\nТорой Всевышнего днём и ночью и соблюдает\nвсе Его заповеди.<\/p>", "<p>Ведь праведник обладает чистым телом,\nон — сосуд, наполненный святостью,\nприобретённой благодаря изучению Торы\nи исполнению заповедей.<\/p>", "<p>И эта святость отражается на его лице.<\/p>", "<p>Поэтому, когда человек видит лицо\nправедника и созерцает отражающуюся в\nнём святость, его сердце становится\nлучше, пробуждая в нём желание выбирать\nпути праведника и следовать его дорогами.<\/p>", "<p>И подобным образом сказали наши мудрецы\n(Рош а-Шана 16б; Сукка 27б):<\/p>", "<p>«Человек обязан посещать своего\nучителя в праздник, чтобы предстать\nперед ним».<\/p>", "<p>Маарша объясняет, почему здесь\nупоминается именно праздник, хотя это\nне сказано прямо в стихе. А в книге «Июн\nЯаков» приводится другая версия текста:\n«В Шаббат и в праздник».<\/p>", "<p>Смысл этого заключается в том, чтобы\nчеловек своими глазами увидел лицо\nсвятого человека в святой день, и тогда\nв него войдёт дух святости.<\/p>", "<p>Кроме того, благодаря этому человек\nудостаивается встречи с Божественным\nПрисутствием — Шхиной.<\/p>", "<p>Как сказали наши мудрецы (Хагига 5б):<\/p>", "<p>Рабби и рабби Хия шли вместе по дороге.<\/p>", "<p>Когда они пришли в один город, они\nспросили:<\/p>", "<p>— Есть ли здесь молодой мудрец Торы,\nчтобы мы могли пойти и увидеть его лицо?<\/p>", "<p>Им ответили:<\/p>", "<p>— Здесь есть один мудрец Торы, но он\nслеп.<\/p>", "<p>Тогда рабби Хия сказал Рабби:<\/p>", "<p>— Останься здесь, чтобы не умалять\nдостоинства своего положения главы\nнарода. Я сам пойду и встречусь с ним.<\/p>", "<p>Однако Рабби настоял на своём и пошёл\nвместе с ним.<\/p>", "<p>Когда они собрались уходить от этого\nмудреца, тот сказал им:<\/p>", "<p>«Вы удостоились увидеть лицо того,\nкто сам не видит. Да удостоитесь вы\nувидеть лик Шхины, которая видит, но\nСама невидима».<\/p>", "<p>И далее сказано о мудрецах Торы (Теилим\n49:10–11):<\/p>", "<p>«Чтобы жить ему вечно и не увидеть\nмогилы. Ведь он видит, что мудрецы\nумирают».<\/p>", "<p>Если даже тот, кто видит мудрецов в\nмомент их смерти, удостаивается столь\nвеликой награды, то насколько же больше\nнаграда того, кто видит их при жизни!<\/p>", "<h1 class=\"western\" id=\"section-56\"><font size=\"4\">Тот,\nкто смотрит на лицо своего учителя,\nразвивает остроту ума<\/font><\/h1>", "<p>Когда ученик во время совместного\nизучения Торы смотрит своими глазами\nна лицо своего мудрого учителя, его\nразум становится более острым.<\/p>", "<p>Ведь Рабейну а-Кадош (рабби Йеуда\nа-Наси) сказал (Эрувин 13б):<\/p>", "<p>«То, что я превосхожу своих товарищей\nостротой ума, объясняется тем, что я\nвидел рабби Меира со спины. А если бы я\nвидел его лицо, мой разум стал бы ещё\nострее».<\/p>", "<p>Как сказано (Йешаяу 30:20):<\/p>", "<p>«И глаза твои будут видеть твоих\nучителей».<\/p>", "<p>Кроме того, благодаря этому укрепляется\nпамять ученика.<\/p>", "<p>Ведь наши мудрецы сказали (Ваикра\nРабба, глава 20):<\/p>", "<p>Написано о царе Давиде (Шмуэль I, 16:12):<\/p>", "<p>«И он был красив видом».<\/p>", "<p>Сказал рабби Ицхак:<\/p>", "<p>«Красив видом» означает, что он обладал\nпрекрасным пониманием Галахи, и всякий,\nкто видел его, вспоминал изученное им\nв Торе.<\/p>", "<p>(См. также комментарий «Эц Йосеф» к\nэтому месту.)<\/p>", "<h1 class=\"western\" id=\"section-57\"><font size=\"4\">Тот,\nкто смотрит на лицо мудреца, становится\nмудрее<\/font><\/h1>", "<p>И в этом заключается смысл стиха\n(Мишлей 17:24):<\/p>", "<p>«Мудрость — перед лицом разумного, а\nглаза глупца — на краю земли».<\/p>", "<p>Слова «перед лицом разумного» следует\nпонимать подобно сказанному (Теилим\n140:14):<\/p>", "<p>«Праведные будут пребывать перед\nлицом Твоим».<\/p>", "<p>То есть те, кто сидит перед мудрым и\nразумным человеком и смотрит на его\nлицо во время учёбы, приобретают ещё\nбольшую мудрость.<\/p>", "<p>Как сказал Рабейну а-Кадош:<\/p>", "<p>«Если бы я видел его лицо, мой разум\nстал бы ещё острее».<\/p>", "<p>Поэтому каждый человек должен поднимать\nсвои глаза, чтобы смотреть на лица\nмудрецов и разумных людей, обладающих\nглубоким пониманием, на мудрецов, которые\nделают мудрыми других, и на совершенных\nправедников.<\/p>", "<p>А слова «глаза глупца — на краю земли»\nследует понимать в соответствии со\nсказанным (Бемидбар 11:1):<\/p>", "<p>«И пожрал огонь край стана».<\/p>", "<p>Раши объясняет, что речь идёт о людях,\nнаходившихся на самом низком духовном\nуровне.<\/p>", "<p>Глаза глупца не обращены к лицам\nвозвышенных людей.<\/p>", "<p>Вместо этого он смотрит на лица самых\nнизких и презренных людей земли, на\nлюдей, погружённых в земные дела и\nсовершающих всевозможные мерзости\nперед Всевышним.<\/p>", "<p>Поэтому он остаётся глупцом, лишённым\nмудрости, разумения и знания.<\/p>", "<p>Ведь подобно тому как человек, смотрящий\nна лицо мудрого и разумного, приобретает\nдополнительную мудрость, так и тот, кто\nсмотрит на низких и невежественных\nлюдей, находящихся на самом низком\nдуховном уровне, приобретает ещё большую\nглупость.<\/p>", "<p>В заключение:<\/p>", "<p>Пусть каждый человек не смотрит на\nлицо посторонней женщины, на лицо\nнечестивого и злого человека, а также\nна изображения идолопоклонства.<\/p>", "<p>И подобным образом написано в книге\n«Сефер Хасидим» (параграф 178; см. там\nподробнее):<\/p>", "<p>«На три вида лиц запрещено смотреть:\nна образы идолопоклонства, на лицо\nженщины и на лицо нечестивца».<\/p>"]}, {"title": "МАХАЗЕ V", "body": ["<h2 class=\"western\" id=\"section-58\"><font size=\"6\">МАХАЗЕ\nV<\/font><\/h2>", "<h1 class=\"western\" id=\"section-59\"><font size=\"4\">Обязанность\nберечь свои глаза, особенно мудрецам\nТоры<\/font><\/h1>", "<h1 class=\"western\" id=\"section-60\"><font size=\"4\">Мудрый\nчеловек избегает созерцания зла<\/font><\/h1>", "<p>Написано в книге Мишлей (Притчи 28:26):<\/p>", "<p>«Надеющийся на своё сердце — глупец,\nа поступающий мудро — спасётся».<\/p>", "<p>Известно, что путь грешников таков:\nглаз видит, сердце желает, а органы тела\nсовершают действие.<\/p>", "<p>И если человек говорит, что он уверен\nв своём сердце, поскольку его сердце\nнаполнено мудростью, разумением и\nзнанием, наполнено Торой и глубоким\nпониманием, Письменной и Устной Торой,\nнаполнено страхом перед Всевышним и\nлюбовью к Нему, а также очищено от всякой\nстрасти и вожделения, и поэтому он\n«надеется на своё сердце», полагая, что\nдаже если его глаза увидят всякое зло,\nсердце его не выберет зла и не возжелает\nего, — такой человек является глупцом,\nпоскольку не способен предвидеть\nпоследствия своих поступков с самого\nих начала.<\/p>", "<p>А слова «поступающий мудро» относятся\nк человеку, который во всех своих делах\nруководствуется мудростью и уже в начале\nкаждого дела размышляет о том, к чему\nоно приведёт в конце.<\/p>", "<p>Ведь именно в этом заключается истинная\nмудрость.<\/p>", "<p>Как сказали наши мудрецы (Коэлет Рабба,\nглава 2):<\/p>", "<p>«Глаза мудреца — в его голове».<\/p>", "<p>Разве у глупца глаза находятся в ногах?<\/p>", "<p>Но смысл этих слов заключается в том,\nчто мудрец уже в самом начале дела знает,\nчем оно закончится.<\/p>", "<p>И ещё сказали наши мудрецы (Тамид 32а):<\/p>", "<p>«Кто мудр? Тот, кто предвидит последствия».<\/p>", "<p>Такой человек «спасётся» от войны со\nсвоим дурным началом, поскольку он\nзакрывает глаза, чтобы не видеть зла.<\/p>", "<p>Как сказали наши мудрецы (Сота 8а):<\/p>", "<p>«Известно нам по преданию, что дурное\nначало властвует лишь над тем, что видят\nглаза человека».<\/p>", "<p>Поэтому человек не должен полагаться\nна своё сердце, даже если оно наполнено\nстрахом перед Всевышним и любовью к\nНему, даже если он размышляет над Торой\nВсевышнего днём и ночью.<\/p>", "<p>Ведь дурное начало обладает чрезвычайно\nбольшой силой.<\/p>", "<p>Как сказали наши мудрецы (Кидушин 30б;\nсм. также комментарий «Июн Яаков»):<\/p>", "<p>«Столь сильно дурное начало, что даже\nСам его Создатель называет его злым».<\/p>", "<p>Как сказано (Берешит 8:21):<\/p>", "<p>«Ибо помышление сердца человека —\nзло от юности его».<\/p>", "<h1 class=\"western\" id=\"section-61\"><font size=\"4\">Мудрецы\nТоры обязаны беречь себя больше, чем\nостальные люди<\/font><\/h1>", "<p>Если мы глубоко задумаемся над этим,\nто поймём, что «глаза общины», то есть\nмудрецы Торы, обязаны оберегать свои\nглаза от созерцания всякого зла с ещё\nбольшей строгостью, чем остальные люди.<\/p>", "<p>Причина заключается в том, что дурное\nначало стремится поймать их в свои сети\nсильнее, чем кого-либо другого.<\/p>", "<p>Ведь наши мудрецы сказали (Сукка 52а):<\/p>", "<p>«Чем выше человек по своему духовному\nуровню, тем сильнее его дурное начало».<\/p>", "<p>Мудрецы Торы, являющиеся «глазами\nобщины», подобны глазам человеческого\nтела.<\/p>", "<p>Подобно тому как, если дурное начало\nовладевает глазами человека, оно через\nглаза получает власть над его сердцем\nи всеми органами тела, так и если дурное\nначало овладевает «глазами общины», то\nесть её духовными руководителями, через\nних оно получает власть над всеми членами\nобщины.<\/p>", "<p>(См. Мидраш Шир а-Ширим, глава 1, на слова\n«Глаза твои — голуби».)<\/p>", "<p>Поэтому дурное начало прилагает особые\nусилия, чтобы поймать в свои сети «глаза\nобщины», побуждая их поднимать свои\nглаза и смотреть на зло.<\/p>", "<p>Чему это можно уподобить?<\/p>", "<p>Войне.<\/p>", "<p>Во время войны воины каждого войска\nстараются прежде всего убить или\nзахватить в плен военачальника противника,\nпоскольку тогда всё его войско окажется\nпобеждённым и подчинится победителям.<\/p>", "<p>Точно так же поступает дурное начало.<\/p>", "<p>Оно ведёт войну против духовных\nвоеначальников мира — тех, кто идёт по\nжизни, освещая свой путь светом Торы и\nзаповедей.<\/p>", "<p>Ведь если ему удастся поймать в свои\nсети хотя бы одного великого мудреца\nТоры, одного из выдающихся руководителей\nнарода Израиля, тогда вслед за ним падут\nи окажутся под его властью многие другие\nлюди.<\/p>", "<h1 class=\"western\" id=\"section-62\"><font size=\"4\">Каждый\nгрех великого человека является также\nосквернением Имени Всевышнего и приводит\nдругих к греху<\/font><\/h1>", "<p>Поэтому пусть человек не говорит:<\/p>", "<p>«Я велик в Торе, я преуспеваю в исполнении\nзаповедей и не боюсь никакого зла.<\/p>", "<p>Даже если я пойду долиной смертной\nтени, буду общаться с нечестивцами и\nсмотреть на лица женщин, дурное начало\nне отвратит моё сердце от правильного\nпути и ничем меня не соблазнит».<\/p>", "<p>Пусть он не говорит так!<\/p>", "<p>Напротив, он должен чрезвычайно\nтщательно оберегать свою душу.<\/p>", "<p>Ведь дурное начало подстерегает его,\nстремясь поймать в свои сети.<\/p>", "<p>И оно желает всеми силами добиться\nтого, чтобы этот человек совершил хотя\nбы один небольшой грех, даже больше, чем\nжелает поймать других людей на\nмногочисленных и тяжёлых грехах.<\/p>", "<p>Почему?<\/p>", "<p>Потому что через грех великого человека\nпроисходит осквернение Имени Всевышнего.<\/p>", "<p>Как сказали наши мудрецы (Йома 86а):<\/p>", "<p>«Если человек нарушил повелительную\nзаповедь и раскаялся, ему прощают сразу\nже».<\/p>", "<p>Как сказано (Ирмияу 3:22):<\/p>", "<p>«Вернитесь, непокорные дети, и Я исцелю\nваше отступничество».<\/p>", "<p>Если человек нарушил запретительную\nзаповедь и совершил тшуву, то раскаяние\nприостанавливает наказание, а Йом-Кипур\nприносит искупление.<\/p>", "<p>Как сказано (Ваикра 16:30):<\/p>", "<p>«Ибо в этот день Он искупит вас...»<\/p>", "<p>Если человек совершил грехи, за которые\nполагается карет — отсечение души, или\nсмертная казнь по решению суда, и затем\nраскаялся, то раскаяние и Йом-Кипур\nприостанавливают наказание, а страдания\nочищают его от греха.<\/p>", "<p>Как сказано (Теилим 89:33):<\/p>", "<p>«И накажу жезлом за преступления их\nи ударами — за грехи их».<\/p>", "<p>Однако если человек совершил грех\nосквернения Имени Всевышнего — хилуль\nа-Шем, — то ни раскаяние само по себе не\nобладает силой приостановить наказание,\nни Йом-Кипур не способен полностью\nискупить его, ни страдания не могут\nокончательно очистить его.<\/p>", "<p>Все они лишь приостанавливают наказание,\nа смерть завершает искупление.<\/p>", "<p>Как сказано (Йешаяу 22:14):<\/p>", "<p>«И открылось мне в уши от Господа... Не\nбудет искуплен вам этот грех, пока не\nумрёте».<\/p>", "<p>Что считается осквернением Имени\nВсевышнего?<\/p>", "<p>Рав сказал:<\/p>", "<p>«Например, если бы я взял мясо у мясника\nи не заплатил ему сразу же».<\/p>", "<p>Рабби Йоханан сказал:<\/p>", "<p>«Например, если бы я прошёл четыре\nлоктя без изучения Торы и без тфилин».<\/p>", "<p>(См. там подробнее.)<\/p>", "<p>Ведь каждый грех следует оценивать с\nдвух сторон: по самому поступку и по\nличности того, кто его совершил.<\/p>", "<p>Со стороны самого поступка необходимо\nучитывать, был ли грех совершён по\nошибке, умышленно или в открытом бунте\nпротив Всевышнего.<\/p>", "<p>Нарушил ли человек повелительную или\nзапретительную заповедь?<\/p>", "<p>Является ли это нарушением запрета,\nне связанным с физическим действием,\nили запрета, который совершается\nпосредством действия?<\/p>", "<p>Относится ли этот грех к числу тех, за\nкоторые полагается карет, или к числу\nпреступлений, за которые предусмотрен\nодин из четырёх видов смертной казни\nпо решению суда, и так далее.<\/p>", "<p>А со стороны личности совершившего\nгрех необходимо учитывать, кто именно\nсогрешил.<\/p>", "<p>Глупец или мудрец?<\/p>", "<p>Невежественный человек или знаток\nТоры?<\/p>", "<p>Человек, который уже давно является\nнечестивцем, или праведник и благочестивый\nчеловек?<\/p>", "<p>Обычный торговец или раввин и наставник\nнарода Израиля?<\/p>", "<p>И так далее.<\/p>", "<p>(См. «Бина ле-Итим», проповедь 49, и «Оэль\nЯаков», начало главы Ваэтханан.)<\/p>", "<p>И об этом сказали наши мудрецы, что\nвсякий грех, даже если сам по себе он\nсчитается небольшим, может оказаться\nчрезвычайно тяжёлым из-за высокого\nположения человека, который его совершил.<\/p>", "<p>И тогда вина этого человека становится\nтяжелее, чем вина за многочисленные и\nсерьёзные преступления, если оценивать\nих только по самим действиям.<\/p>", "<p>Почему?<\/p>", "<p>Потому что через него оскверняется\nИмя Всевышнего.<\/p>", "<p>Кроме того, все начинают учиться у\nнего и поступать подобным образом.<\/p>", "<p>Сотни и тысячи людей могут начать\nсовершать тот же самый грех.<\/p>", "<p>И все они будут говорить:<\/p>", "<p>«Если он, будучи праведником и\nблагочестивым человеком, если он, будучи\nраввином и наставником, выносящим\nпостановления по законам Торы для народа\nИзраиля, поступает таким образом, то\nтем более мы, простые люди, можем поступать\nтак же!<\/p>", "<p>Мы будем смотреть на него и брать с\nнего пример».<\/p>", "<p>И когда они согрешат, ответственность\nза их грехи ляжет на него.<\/p>", "<h1 class=\"western\" id=\"section-63\"><font size=\"4\">Великий\nчеловек несёт ответственность за грехи,\nкоторые другие совершают по его примеру<\/font><\/h1>", "<p>И тем более это следует из следующего\nрассуждения.<\/p>", "<p>Ведь наши мудрецы сказали (Шаббат\n54б):<\/p>", "<p>«Всякий, кто может воспрепятствовать\nгрехам членов своей семьи, но не делает\nэтого, несёт ответственность за грехи\nчленов своей семьи.<\/p>", "<p>Кто может воспрепятствовать грехам\nжителей своего города, но не делает\nэтого, несёт ответственность за грехи\nжителей своего города.<\/p>", "<p>А кто может воспрепятствовать грехам\nвсего мира, но не делает этого, несёт\nответственность за грехи всего мира».<\/p>", "<p>Человек, который имеет возможность\nвоспрепятствовать греху, видит, как\nдругие грешат, но не останавливает их,\nдаже если сам он не совершает этого\nгреха, несёт ответственность за их\nпреступления.<\/p>", "<p>Почему?<\/p>", "<p>Потому что он должен был воспрепятствовать\nим, и если бы он это сделал, они не\nсогрешили бы.<\/p>", "<p>А если так, то тем более человек, который\nсам совершает грех, а многие другие,\nвидя его поступки, начинают поступать\nтак же, несёт ответственность за их\nгрехи.<\/p>", "<p>Ведь он не должен был грешить, и если\nбы он сам не согрешил, то и они не совершили\nбы этого греха.<\/p>", "<p>Более того, все дополнительные\nпреступления, которые они совершат\nвследствие этого, также лягут на его\nголову.<\/p>", "<p>Как сказали наши мудрецы (Санhedрин\n102б):<\/p>", "<p>«Лёгкие грехи, совершённые Ахавом,\nподобны тяжёлым грехам, совершённым\nЯровамом.<\/p>", "<p>Почему же Писание связывает эти грехи\nименно с Яровамом?<\/p>", "<p>Потому что он первым положил начало\nэтому духовному падению».<\/p>", "<h1 class=\"western\" id=\"section-64\"><font size=\"4\">Тому,\nкто вводит многих людей в грех, чрезвычайно\nтрудно совершить раскаяние<\/font><\/h1>", "<p>Наши мудрецы сказали (Йома 87а):<\/p>", "<p>«Всякому, кто приводит многих людей\nк греху, не предоставляют возможности\nсовершить тшуву — раскаяние».<\/p>", "<p>Почему?<\/p>", "<p>Чтобы не получилось так, что он сам\nокажется в Ган-Эдене — Райском саду, а\nего ученики — в Гееноме.<\/p>", "<p>Как сказано (Мишлей 28:17):<\/p>", "<p>«Человек, обременённый кровью души,\nбудет бежать до могилы — пусть никто\nне поддерживает его».<\/p>", "<p>Следовательно, человеку, который\nсовершил осквернение Имени Всевышнего\nи по вине которого многие люди согрешили,\nчрезвычайно трудно совершить тшуву.<\/p>", "<p>И даже если он раскается, он не очищается\nот этого греха ни посредством раскаяния,\nни посредством Йом-Кипура, ни посредством\nстраданий — вплоть до своей смерти.<\/p>", "<p>А если так, то на протяжении всей своей\nжизни он остаётся подверженным опасности\nсовершения новых грехов, поскольку ещё\nне очистился от преступления осквернения\nИмени Всевышнего.<\/p>", "<p>Ведь сказано (Пиркей Авот 4:2):<\/p>", "<p>«Один грех влечёт за собой другой\nгрех».<\/p>", "<p>Поэтому «глаза общины», то есть её\nдуховные руководители и мудрецы Торы,\nдолжны особенно укрепляться и прилагать\nвеличайшие усилия, чтобы оберегать свои\nглаза от созерцания зла, дабы дурное\nначало не смогло поймать их в свои сети.<\/p>", "<h1 class=\"western\" id=\"section-65\"><font size=\"4\">Чем\nвыше человек по своему духовному уровню,\nтем сильнее его дурное начало<\/font><\/h1>", "<p>Я уже объяснял с Божьей помощью в своей\nкниге «Двар Тора» (глава 5) следующее\nвысказывание наших мудрецов (Сукка\n52а).<\/p>", "<p>Написано (Йоэль 2:20):<\/p>", "<p>«И северного удалю от вас».<\/p>", "<p>Это относится к дурному началу, которое\nскрывается и пребывает в сердце человека.<\/p>", "<p>«И изгоню его в землю сухую и пустынную»\n— в место, где нет людей, которых оно\nмогло бы искушать.<\/p>", "<p>«Лицом его — к морю восточному» —\nпотому что оно обратило свой взор на\nПервый Храм, разрушило его и погубило\nнаходившихся там мудрецов Торы.<\/p>", "<p>«И поднимется зловоние его, и\nраспространится смрад его» — потому\nчто оно оставляет народы мира и особенно\nнападает на Израиль.<\/p>", "<p>«Ибо великое совершил оно».<\/p>", "<p>Сказал Абайе:<\/p>", "<p>«А на мудрецов Торы дурное начало\nнападает сильнее, чем на всех остальных».<\/p>", "<p>Подобно тому, что произошло с самим\nАбайе.<\/p>", "<p>Однажды Абайе услышал, как один мужчина\nсказал женщине:<\/p>", "<p>— Давай встанем пораньше и отправимся\nвместе в дорогу.<\/p>", "<p>Абайе подумал:<\/p>", "<p>— Я пойду за ними, чтобы не позволить\nим совершить грех.<\/p>", "<p>И он последовал за ними.<\/p>", "<p>Он шёл за ними на протяжении трёх парс\n— значительного расстояния — через\nболотистую местность.<\/p>", "<p>Когда они подошли к развилке дорог,\nто расстались.<\/p>", "<p>Раши объясняет, что они были из двух\nразных городов и, дойдя до перекрёстка,\nразошлись: мужчина пошёл в одну сторону,\nа женщина — в другую.<\/p>", "<p>Перед расставанием Абайе услышал, как\nони сказали друг другу:<\/p>", "<p>— Дорога ещё далека, а наше общение\nбыло таким приятным!<\/p>", "<p>То есть им было приятно идти вместе,\nи они сожалели о том, что больше не смогут\nпродолжать путь вдвоём.<\/p>", "<p>Тогда Абайе сказал:<\/p>", "<p>— Если бы на моём месте оказался\nчеловек, которого я считаю хуже себя,\nон не смог бы удержаться от греха.<\/p>", "<p>Этими словами Абайе говорил о самом\nсебе: если бы он оказался наедине с этой\nженщиной, то, как ему казалось, не смог\nбы преодолеть своё дурное начало.<\/p>", "<p>После этого Абайе пошёл, прислонился\nк дверному засову и стоял там, глубоко\nпереживая и мучаясь.<\/p>", "<p>Он опирался на дверной засов, словно\nчеловек, погружённый в тяжёлые размышления\nи страдания.<\/p>", "<p>Тогда к нему подошёл один старец и\nсказал ему:<\/p>", "<p>«Чем выше человек по сравнению со\nсвоим товарищем, тем сильнее его дурное\nначало».<\/p>", "<p>(До этого места — слова Гемары.)<\/p>", "<p>Многие люди говорят:<\/p>", "<p>— О, какой стыд для нас!<\/p>", "<p>Абайе — человек Божий, великий святой,\nодин из мудрецов Талмуда!<\/p>", "<p>И он сам свидетельствует о себе, что\nесли бы однажды оказался наедине с\nженщиной, то не смог бы преодолеть своё\nдурное начало!<\/p>", "<p>Какой позор и какое унижение!<\/p>", "<p>Разве не должен всякий человек, услышав\nподобные слова, содрогнуться от страха?<\/p>", "<p>Кроме того, необходимо понять, почему\nмудрецы сочли нужным рассказать будущим\nпоколениям именно эту подробность:<\/p>", "<p>«Он пошёл, прислонился к дверному\nзасову и стал страдать».<\/p>", "<p>Разве это не лишние слова?<\/p>", "<p>Какое нам дело до того, где именно он\nнаходился в тот момент, когда переживал,\nи что он тогда делал?<\/p>", "<p>Сидел ли он, ходил ли или опирался на\nстол — какое это имеет для нас значение?<\/p>", "<p>Ведь совершенно недопустимо предполагать,\nчто мудрецы Талмуда стали бы приводить\nненужные подробности, не содержащие\nникакой пользы.<\/p>", "<p>И уже сказали наши мудрецы (Сукка 21б):<\/p>", "<p>«Даже обычная беседа мудрецов Торы\nтребует изучения».<\/p>", "<p>Кроме того, необходимо понять слова\nтого старца, который пришёл утешить\nАбайе и сказал ему:<\/p>", "<p>«Чем выше человек по сравнению со\nсвоим товарищем, тем сильнее его дурное\nначало».<\/p>", "<p>То есть он как бы говорил ему, что по\nэтой причине не следует чрезмерно\nпереживать.<\/p>", "<p>Многие удивляются этому.<\/p>", "<p>Ведь, казалось бы, должно быть совершенно\nнаоборот!<\/p>", "<p>Разве не так сказал Всевышний народу\nИзраиля (Кидушин 30б):<\/p>", "<p>«Сыновья Мои! Я создал дурное начало\nи создал Тору как средство против него.<\/p>", "<p>Если вы занимаетесь Торой, вы не будете\nотданы в его власть».<\/p>", "<p>Как сказано (Берешит 4:7):<\/p>", "<p>«Ведь если будешь поступать хорошо —\nбудешь возвышен».<\/p>", "<p>«Но если вы не занимаетесь Торой, то\nбудете отданы в его власть».<\/p>", "<p>Как сказано:<\/p>", "<p>«У входа грех лежит».<\/p>", "<p>И не только это, но все его стремления\nнаправлены на тебя.<\/p>", "<p>Как сказано:<\/p>", "<p>«И к тебе его влечение».<\/p>", "<p>Однако если ты захочешь, то сможешь\nвластвовать над ним.<\/p>", "<p>Как сказано:<\/p>", "<p>«Но ты властвуй над ним».<\/p>", "<p>И Раши объясняет:<\/p>", "<p>«Если ты желаешь, занимайся Торой —\nи тогда ты сможешь властвовать над\nдурным началом».<\/p>", "<h1 class=\"western\" id=\"section-66\"><font size=\"4\">Вор\nизбегает краж в домах богатых людей\nиз-за их надёжной охраны<\/font><\/h1>", "<p>Однако чему можно уподобить это?<\/p>", "<p>Представим себе вора, который прилагает\nогромные усилия, чтобы изготовить\nразличные орудия взлома: инструменты\nдля разрушения медных дверей, вскрытия\nоконных решёток и устройства подкопов.<\/p>", "<p>Он тратит большие деньги, чтобы\nприобрести всевозможные орудия взлома,\nодно сложнее другого.<\/p>", "<p>Куда же направлены помыслы этого вора?\nКакова главная цель его стремлений?<\/p>", "<p>Проникнуть в дома богачей, где хранятся\nогромные богатства и всевозможные\nдрагоценности?<\/p>", "<p>Или в дома бедняков, где царят нищета\nи нужда и где нет ничего, кроме грубого\nкуска хлеба, деревянного ведра и глиняной\nпосуды?<\/p>", "<p>Кто же настолько глуп, чтобы не понимать,\nчто каждый вор всеми силами стремится\nпроникнуть именно в дома богатых людей,\nи все его мысли сосредоточены на\nдрагоценном имуществе, которое там\nхранится?<\/p>", "<p>Но тогда возникает вопрос: почему же\nв действительности воры часто обкрадывают\nдома бедняков, тогда как кражи из домов\nбогачей происходят гораздо реже?<\/p>", "<p>Почему это так?<\/p>", "<p>Ведь главное желание каждого вора —\nукрасть имущество богатого человека!<\/p>", "<p>Однако причина этого хорошо известна.<\/p>", "<p>Что пробуждает в сердце вора желание\nпроникнуть в покои богатых людей?<\/p>", "<p>Конечно же, хранящиеся там богатства.<\/p>", "<p>Но именно эти богатства одновременно\nстановятся причиной того, что проникнуть\nтуда чрезвычайно трудно.<\/p>", "<p>Ведь их владельцы тратят огромные\nсредства, чтобы защитить своё имущество.<\/p>", "<p>Они возводят основания домов из\nпрочного камня, устанавливают медные\nвходные двери, укрепляют их железными\nзасовами, а окна закрывают железными\nрешётками.<\/p>", "<p>Вор будет трудиться и прилагать\nогромные усилия, пытаясь проникнуть в\nдом через дверь, сделать подкоп под\nоснование здания или забраться через\nокно.<\/p>", "<p>Но все его старания окажутся напрасными.<\/p>", "<p>Он не сможет осуществить своё намерение,\nпоскольку дом надёжно закрыт и защищён\nсо всех сторон.<\/p>", "<p>С другой стороны, что удерживает вора\nот желания проникнуть в дом бедняка?<\/p>", "<p>Конечно же, царящие там нищета и\nбедность.<\/p>", "<p>Но именно эта бедность одновременно\nоблегчает вору проникновение в дом.<\/p>", "<p>Ведь из-за крайней нужды основание\nдома непрочно, входные двери сломаны,\nа окна открыты.<\/p>", "<p>Поэтому вор, проходя мимо такого дома,\nможет без труда войти через дверь,\nзабраться через окно или проделать\nотверстие в стене и проникнуть внутрь.<\/p>", "<p>Как сказали наши мудрецы (Сукка 26а):<\/p>", "<p>«Пролом в ограде призывает вора».<\/p>", "<p>Но представим теперь, что богатый\nчеловек, обладающий огромным состоянием,\nраспахнёт двери и окна своего дома и\nразрушит его защитные укрепления, так\nчто его жилище станет столь же незащищённым,\nкак дом бедняка.<\/p>", "<p>Разве не очевидно, что уже в ту же ночь\nвор поспешит воспользоваться этим и\nпроникнет внутрь, чтобы забрать всё\nнаходящееся там имущество?<\/p>", "<p>Ведь в дом бедняка, даже если его дверь\nоткрыта, вор иногда войдёт, а иногда\nпройдёт мимо.<\/p>", "<p>Потому что там почти нечего брать:\nлишь грубый хлеб, деревянное ведро и\nдругие скудные принадлежности бедного\nчеловека.<\/p>", "<p>Но если открыта дверь богатого дома,\nвор немедленно устремится туда, поскольку\nтам он найдёт богатую добычу — огромное\nколичество драгоценного имущества.<\/p>", "<h1 class=\"western\" id=\"section-67\"><font size=\"4\">Главная\nцель дурного начала — привести праведников\nк греху<\/font><\/h1>", "<p>Из этого примера мы можем постичь\nглубокую истину.<\/p>", "<p>Дурное начало — это вор!<\/p>", "<p>Всё его стремление направлено на то,\nчтобы похитить у человека всё его\nдуховное богатство: веру во Всевышнего,\nстрах перед Ним и любовь к Нему, знание\nТоры, исполнение заповедей и все добрые\nкачества характера.<\/p>", "<p>Оно изобретает всевозможные хитрости\nи уловки, чтобы украсть всё добро,\nхранящееся в глубинах человеческого\nсердца.<\/p>", "<p>Оно трудится и прилагает огромные\nусилия, подготавливая разрушительные\nорудия, чтобы взломать двери человеческих\nуст.<\/p>", "<p>Как сказано (Мишлей 13:3):<\/p>", "<p>«Широко раскрывающий свои уста\nнавлекает на себя погибель».<\/p>", "<p>Оно стремится разбить окна человека\n— его глаза, чтобы они смотрели на\nвсевозможное зло.<\/p>", "<p>И пытается проделать отверстия в\nстенах его сердца, побуждая его размышлять\nо дурных вещах.<\/p>", "<p>Как сказали наши мудрецы (Бемидбар\nРабба, глава 10):<\/p>", "<p>«Глаза и сердце — два посредника\nгреха».<\/p>", "<p>Но куда направлены стремления этого\nвора — дурного начала?<\/p>", "<p>Где оно желает совершить свою главную\nкражу?<\/p>", "<p>В домах праведников, в глубинах их\nсердец, где хранятся огромные сокровища\nТоры и страха перед Всевышним?<\/p>", "<p>Там находятся драгоценнейшие богатства:\nчистая вера, сильная любовь ко Всевышнему,\nмножество заповедей Торы и добрые\nкачества характера.<\/p>", "<p>Или же оно стремится проникнуть в дома\nлюдей, бедных духовным знанием, в глубины\nих сердец, где царят духовная нищета,\nпустые помыслы и отвратительные мысли?<\/p>", "<p>Там нет ничего, кроме нечистой веры и\nисполнения заповедей по привычке, без\nглубокого понимания и внутреннего\nчувства.<\/p>", "<p>Разве не скажет каждый разумный\nчеловек, что дурное начало всеми силами\nстремится проникнуть именно в сердца\nлюдей, богатых духовным знанием?<\/p>", "<p>Ведь все его мысли направлены на то,\nчтобы похитить хранящиеся там сокровища\nТоры и добрых дел.<\/p>", "<p>Но тогда снова возникает вопрос.<\/p>", "<p>Почему же дурное начало так часто\nпохищает духовные сокровища из сердец\nлюдей, бедных знанием?<\/p>", "<p>Почему они каждый день, в любое время\nи почти каждый час нарушают заповеди\nВсевышнего?<\/p>", "<p>И почему лишь изредка случается, что\nдурному началу удаётся похитить Тору\nи заповеди из сердец людей, богатых\nдуховным знанием?<\/p>", "<p>Ведь именно на них направлены все его\nстремления и все его уловки!<\/p>", "<h1 class=\"western\" id=\"section-68\"><font size=\"4\">Только\nсоблюдение защитных оград спасает от\nдурного начала<\/font><\/h1>", "<p>Однако причина этого ясна каждому\nзнающему и понимающему человеку.<\/p>", "<p>Что побуждает дурное начало стремиться\nпроникнуть в сердца людей, богатых\nТорой, мудростью и знанием?<\/p>", "<p>Именно их духовные сокровища: Тора,\nмудрость, страх перед Всевышним и любовь\nк Нему.<\/p>", "<p>Но эти же сокровища одновременно\nзащищают себя от дурного начала, не\nпозволяя ему проникнуть внутрь и\nприкоснуться к ним.<\/p>", "<p>Ведь благодаря своему глубокому знанию\nТоры и мудрости такие люди возводят\nстены своего сердца из крепчайшего\nкамня — из чистой веры, страха перед\nВсевышним и любви к Нему.<\/p>", "<p>Они закрывают двери своих уст, чтобы\nне произносить дурных слов и не вести\nпустых разговоров.<\/p>", "<p>Как сказано (Мишлей 13:3):<\/p>", "<p>«Оберегающий свои уста хранит свою\nдушу».<\/p>", "<p>Они закрывают свои глаза, чтобы не\nвидеть зла и всего, что способно пробудить\nв них вожделение.<\/p>", "<p>Поэтому, даже если дурное начало будет\nтрудиться и прилагать огромные усилия,\nпытаясь проникнуть в глубины их сердец\nчерез дверь — то есть через рот, язык и\nгубы, — оно не добьётся успеха.<\/p>", "<p>Даже если оно попытается сделать\nподкоп под стены сердца посредством\nдурных размышлений или проникнуть через\nокна — глаза, побуждая их смотреть на\nзло, — все его старания окажутся\nнапрасными.<\/p>", "<p>Оно не сможет проникнуть внутрь,\nпоскольку стены сердца надёжно закрыты\nи укреплены со всех сторон.<\/p>", "<p>С другой стороны, что удерживает дурное\nначало от особого стремления проникнуть\nв сердца людей, бедных духовным знанием?<\/p>", "<p>Именно их духовная нищета: недостаток\nТоры, мудрости, страха перед Всевышним\nи любви к Нему.<\/p>", "<p>Однако эта самая духовная бедность\nоблегчает дурному началу проникновение\nв глубины их сердец.<\/p>", "<p>Ведь из-за недостатка Торы, мудрости\nи знания основания стен их сердца\nнепрочны.<\/p>", "<p>Их сердца открыты для всевозможных\nпустых и бессмысленных размышлений.<\/p>", "<p>Их уста широко раскрываются для всяких\nшуток, насмешек и легкомысленных\nразговоров, которые приучают человека\nк греху.<\/p>", "<p>А их глаза смотрят на всё, что способно\nпробудить вожделение.<\/p>", "<p>Поэтому дурное начало без труда и\nусилий проникает в глубины их сердец.<\/p>", "<p>Оно входит через открытые двери их\nуст.<\/p>", "<p>Или проникает через открытые окна —\nих глаза.<\/p>", "<p>Или проделывает отверстия в стенах\nих сердец посредством греховных мыслей\nи злых замыслов.<\/p>", "<h1 class=\"western\" id=\"section-69\"><font size=\"4\">Великий\nчеловек, который не оберегает себя,\nнепременно оступится<\/font><\/h1>", "<p>Однако если человек, богатый Торой,\nмудростью и знанием, обладающий великими\nдуховными сокровищами — верой, страхом\nперед Всевышним и любовью к Нему, Торой\nи заповедями, — откроет двери своих уст\nдля пустых разговоров и шуток, распахнёт\nсвои окна — глаза, чтобы смотреть на\nвсевозможное зло, и разрушит основания\nсвоего дома — стены сердца, предаваясь\nгреховным помыслам, разве не очевидно,\nчто тогда дурное начало поспешит\nпроникнуть в глубины его сердца и похитит\nвсё находящееся там?<\/p>", "<p>Если дверь открыта в доме бедняка,\nесли горло человека, бедного Торой,\nмудростью и знанием, подобно открытой\nмогиле, из которой исходят насмешки,\nшутки и пустые разговоры, то дурное\nначало иногда войдёт через эту дверь,\nа иногда не войдёт.<\/p>", "<p>Но если дверь открыта в доме богача,\nесли человек, богатый Торой, мудростью\nи знанием, открывает свои уста для шуток\nи пустословия, дурное начало немедленно\nустремится туда.<\/p>", "<p>Ведь там оно найдёт богатую добычу:\nТору, мудрость и знание, совершенную\nверу, чистый страх перед Всевышним,\nсильную любовь к Нему, заповеди и добрые\nдела.<\/p>", "<p>Поэтому человек, богатый Торой,\nмудростью и знанием, должен чрезвычайно\nтщательно оберегать свои уста и язык\nот пустых разговоров, свои глаза — от\nсозерцания соблазнов этого мира, а свои\nуши — от слушания непристойных речей\nи пустословия.<\/p>", "<p>После всего сказанного мы сможем, с\nпомощью благословенного Всевышнего,\nпонять мудрые слова наших учителей и\nскрытый в них смысл.<\/p>", "<p>Абайе сказал:<\/p>", "<p>«Если бы на моём месте оказался человек,\nкоторого я считаю хуже себя, он не смог\nбы удержаться от греха».<\/p>", "<p>То есть:<\/p>", "<p>«Если бы я открыл входную дверь и\nостался наедине с женщиной, я знаю, что\nдурное начало — этот вор — немедленно\nпроникло бы в глубины моего сердца,\nчтобы похитить его, лишить меня здравого\nрассудка и заставить поступить вопреки\nмоей воле и воле моего Создателя.<\/p>", "<p>Оно стало бы соблазнять меня совершить\nгрех».<\/p>", "<p>Ведь сказано (Берешит 4:7):<\/p>", "<p>«У входа грех лежит».<\/p>", "<p>(См. Йома 20а и комментарий Маарша,\nначинающийся словами «Святой, благословен\nОн, говорит».)<\/p>", "<p>Дурное начало постоянно подстерегает\nчеловека, ожидая момента, когда откроется\nдверь.<\/p>", "<p>«Он пошёл и прислонился к дверному\nзасову».<\/p>", "<p>Этим он словно говорил:<\/p>", "<p>«Смотрите, сыны Израиля, и задумайтесь!<\/p>", "<p>Подобно тому как дверной засов охраняет\nвсё добро, находящееся внутри дома, так\nи все ограды, установленные Торой,\nохраняют всё добро, хранящееся в глубинах\nчеловеческого сердца.<\/p>", "<p>Я никогда не совершал греха распутства\nи ревностно стремлюсь служить\nблагословенному Всевышнему, чтобы\nникогда не согрешить.<\/p>", "<p>И причина этого заключается в том, что\nя оберегаю свою душу, закрываю дверь\nкрепким засовом и не остаюсь наедине с\nженщиной».<\/p>", "<p>«И он страдал».<\/p>", "<p>Почему же тот человек не подвергся\nнападению дурного начала, которое могло\nбы похитить его сердце, когда он открыл\nдверь и оказался наедине с женщиной?<\/p>", "<p>Почему дурное начало не соблазнило\nего совершить грех?<\/p>", "<p>А я, если бы открыл дверь, знаю, что\nдурное начало немедленно проникло бы\nв глубины моего сердца, чтобы похитить\nего.<\/p>", "<p>Если так, значит, тот человек праведнее\nменя, поскольку дурное начало не может\nприблизиться к нему!<\/p>", "<p>Тогда пришёл тот старец и сказал ему:<\/p>", "<p>«Чем выше человек по сравнению со\nсвоим товарищ
