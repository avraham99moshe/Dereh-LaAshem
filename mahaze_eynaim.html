ё человек\nумирает».<\/p>", "<p>Но разве это не противоречит словам\nотца Шмуэля?<\/p>", "<p>Ведь отец Шмуэля говорил:<\/p>", "<p>«Ангел смерти сказал мне: \"Если бы\nя не заботился о чести людей, то рассекал\nбы им горло, как скоту\"».<\/p>", "<p>Однако, возможно, та самая капля яда\nрассекает жизненно важные органы горла.<\/p>", "<p>И об этом сказано (Мишлей 5:4): <strong>«Но\nконец её горек, как полынь, остр, как\nобоюдоострый меч».<\/strong><\/p>", "<p>Ведь горькая капля остра, словно меч.<\/p>", "<h1 class=\"western\" id=\"section-154\"><strong><font size=\"4\">Всё\nстремление дурного начала — привести\nк греху знатоков Торы<\/font><\/strong><\/h1>", "<p>И этот <strong>«человек, искусный в своём\nделе»<\/strong>, то есть в том, чтобы вводить\nв заблуждение, обвинять и забирать души,\nвсе свои усилия направляет на то, чтобы\nсоблазнять знатоков Торы, обвинять их\nи забирать их души.<\/p>", "<p>Ведь учили наши мудрецы (Сукка 52а):<\/p>", "<p>«\"И удалю от вас северного\" (Йоэль\n2:20) — это дурное начало, которое скрыто\nи пребывает в сердце человека.<\/p>", "<p>\"И изгоню его в землю сухую и\nпустынную\" — туда, где нет людей,\nкоторых оно могло бы искушать.<\/p>", "<p>\"Переднюю часть его — к морю\nвосточному\" — потому что оно обратило\nсвой взор на Первый Храм, разрушило его\nи погубило находившихся там знатоков\nТоры.<\/p>", "<p>\"А заднюю часть его — к морю западному\"\n— потому что оно обратило свой взор на\nВторой Храм, разрушило его и погубило\nнаходившихся там знатоков Торы.<\/p>", "<p>\"И поднимется зловоние его, и\nраспространится смрад его\" — потому\nчто оно оставляет народы мира и нападает\nна врагов Израиля [то есть на сам Израиль].<\/p>", "<p>\"Ибо великое совершило оно\".<\/p>", "<p>Сказал Абайе: \"А против знатоков\nТоры оно выступает ещё сильнее, чем\nпротив всех остальных...\"»<\/p>", "<p>И всё это уже подробно объяснялось\nвыше, в пятой главе.<\/p>", "<p>Именно об этом сказано (Теилим 37:32):<\/p>", "<p><strong>«Нечестивец подстерегает праведника\nи стремится умертвить его».<\/strong><\/p>", "<p>Поистине, дурное начало желает зла\nкаждому человеку.<\/p>", "<p>И всё же <strong>«нечестивец»<\/strong>, то\nесть дурное начало, подстерегает прежде\nвсего <strong>«праведника»<\/strong>, стремясь\nсоблазнить его и выступить против него\nс обвинением.<\/p>", "<p><strong>«И стремится умертвить его»<\/strong>\n— оно просит Всевышнего дать ему\nразрешение забрать душу праведника.<\/p>", "<p>Ведь если праведники согрешат, все\nостальные станут учиться у них грешить.<\/p>", "<p>А если праведники к тому же умрут,\nлюдям не у кого будет учиться пути\nВсевышнего, не у кого будет перенимать\nдобрые пути и праведные поступки.<\/p>", "<p>С другой стороны, дурное начало просит\nВсевышнего, чтобы нечестивцы продолжали\nжить, поскольку тогда они будут грешить\nсами и многие другие научатся у них\nгрешить.<\/p>", "<p>Наши мудрецы сказали (Санедрин 72а):<\/p>", "<p><strong>«Смерть нечестивцев — благо для\nних самих и благо для мира, а смерть\nправедников — зло для них самих и зло\nдля мира».<\/strong><\/p>", "<p>Но каким образом дурное начало может\nовладеть человеком и соблазнить его на\nгрех?<\/p>", "<p>Ведь только посредством того, что\nвидят его глаза.<\/p>", "<p>Ибо наши мудрецы сказали:<\/p>", "<p><strong>«Известно нам из предания, что\nдурное начало властвует лишь над тем,\nчто видят глаза человека».<\/strong><\/p>", "<p>Поэтому над теми, кто закрывает глаза,\nчтобы не видеть никакого зла, никаких\nпредметов страсти и вожделения и ничего\nнечистого, дурное начало не может\nвластвовать.<\/p>", "<p>Именно об этом сказано в Писании:<\/p>", "<p><strong>«Видел ли ты человека, искусного\nв своём деле? Перед царями он предстанет,\nне будет стоять перед людьми незнатными»<\/strong>\n(Мишлей 22:29).<\/p>", "<p><strong>«Человек, искусный в своём деле»<\/strong>\n— это дурное начало.<\/p>", "<p><strong>«Перед царями»<\/strong> — а кто\nназывается царями? Наши мудрецы (см.\nГитин 62а).<\/p>", "<p><strong>«Он предстанет»<\/strong> — чтобы\nсражаться с ними.<\/p>", "<p>Ведь <strong>«чем выше человек своего\nближнего, тем сильнее его дурное начало»<\/strong>.<\/p>", "<p>И никто не способен самостоятельно\nспастись от него.<\/p>", "<p>Но <strong>«не будет стоять»<\/strong>, чтобы\nсражаться, <strong>«перед людьми незнатными»<\/strong>\n— то есть перед теми, кто закрывает свои\nглаза и словно ходит по земле во тьме,\nне глядя на всевозможные соблазны этого\nмира.<\/p>", "<p>Перед такими людьми дурное начало не\nможет предстать, чтобы воевать с ними.<\/p>", "<p>Ведь если глаза не видят, то и сердце\nне желает.<\/p>", "<p>А поскольку они оберегают свои глаза\nот созерцания зла, Святой, благословен\nОн, помогает им.<\/p>", "<p>Как сказали наши мудрецы (Йома 38б):<\/p>", "<p><strong>«Тому, кто приходит очиститься,\nпомогают».<\/strong><\/p>", "<p>Но те, кто смотрит на зло своими глазами,\nдаже если они <strong>«цари»<\/strong>, то есть\nзнатоки Торы, которые днём и ночью\nразмышляют над Торой Всевышнего, о\nкоторой сказано (Мишлей 8:15):<\/p>", "<p>«Мною царствуют цари...»<\/p>", "<p>— даже против них дурное начало\nвыступит на войну и одолеет их.<\/p>", "<p>Потому что их глаза видят, а сердце\nжелает.<\/p>", "<p>И поскольку они приходят не для того,\nчтобы очиститься, а, напротив, чтобы\nоскверниться, ведь они смотрят своими\nглазами на зло, то к ним относятся слова\nнаших мудрецов (там же):<\/p>", "<p><strong>«Тому, кто приходит оскверниться,\nоткрывают путь».<\/strong><\/p>", "<p>Поэтому, сын человеческий, обрати своё\nсердце к тому, что видят твои глаза, и\nзадумайся над тем, на что ты смотрел во\nвсе дни своей жизни.<\/p>", "<p>Ведь от того, что видят глаза, зависит\nвся жизнь: жизнь тела на земле и жизнь\nдуши в небесных высотах.<\/p>"]}, {"title": "МАХАЗЕ XIII", "body": ["<h2 class=\"western\" id=\"section-155\"><font size=\"6\"><strong>МАХАЗЕ\nX<\/strong><strong><span lang=\"en-US\">III<\/span><\/strong><\/font><\/h2>", "<h1 class=\"western\" id=\"section-156\"><strong><font size=\"4\">Тот,\nкто оберегает свои глаза, сможет познать\nвсю мудрость мироздания посредством\nТоры<\/font><\/strong><\/h1>", "<h1 class=\"western\" id=\"section-157\"><strong><font size=\"4\">Откуда\nнаши мудрецы знали законы природы?<\/font><\/strong><\/h1>", "<p>Сладкозвучный певец Израиля молился\nВсевышнему и говорил (Теилим 119:18):<\/p>", "<p><strong>«Открой глаза мои, и увижу чудеса\nиз Торы Твоей».<\/strong><\/p>", "<p>В этой молитве возникает большой\nвопрос.<\/p>", "<p>Почему он просит: <strong>«И увижу чудеса\nиз Торы Твоей»<\/strong>, а не «чудеса Торы\nТвоей»?<\/p>", "<p>Ведь выражение «из Торы Твоей»\nподразумевает, что речь идёт не обо всей\nТоре, а о чём-то, что можно извлечь из\nнеё.<\/p>", "<p>(См. внимательно Брахот 50а, где в\nотношении слов Торы сказано: «Раскрой\nуста твои, и Я наполню их». И этого\nдостаточно для понимающего.)<\/p>", "<p>Известно каждому человеку, что познание\nзаконов природы достигается посредством\nнаблюдений и опытов.<\/p>", "<p>Все естествоиспытатели трудятся и\nприлагают усилия на протяжении всей\nжизни, используя пять человеческих\nчувств: слух, зрение, осязание, вкус и\nобоняние, чтобы исследовать и испытывать\nвсё существующее — неживую природу,\nрастения, животных и человека, — познавая\nсущность и свойства каждой вещи.<\/p>", "<p>Если так, то откуда наши мудрецы,\nкоторые посвятили всю свою жизнь\nБожественной мудрости, днём и ночью\nтрудились над Торой Всевышнего, не\nобращали своего взора за пределы четырёх\nлоктей Галахи и проводили все свои дни\nв доме учения, знали всё, что происходит\nво вселенной?<\/p>", "<p>Это удивительно!<\/p>", "<p>Откуда они знали свойства всего\nсуществующего — неживой природы,\nрастений, животных и человека, — не\nисследуя их посредством наблюдений и\nопытов с помощью пяти чувств?<\/p>", "<h1 class=\"western\" id=\"section-158\"><strong><font size=\"4\">Из\nТоры можно познать всю мудрость мироздания<\/font><\/strong><\/h1>", "<p>В действительности наши мудрецы\nпознали все законы природы не посредством\nорганов чувств, а благодаря Божественной\nмудрости.<\/p>", "<p>Из Торы благословенного Всевышнего,\nКоторый сотворил все миры и создал всё\nсуществующее, они постигли всё.<\/p>", "<p>Как сказали наши мудрецы (Хулин 60б):<\/p>", "<p>«\"Шасуа\" — это особое создание,\nимеющее две спины и два позвоночника.<\/p>", "<p>Разве Моше, учитель наш, был охотником\nили ловцом зверей?<\/p>", "<p>Отсюда следует ответ тому, кто\nутверждает, что Тора не дана с Небес».<\/p>", "<p>Поэтому наши мудрецы знали даже то,\nчто находится в высочайших небесах и в\nглубинах морских пучин, куда не могут\nпроникнуть человеческие чувства.<\/p>", "<p>И так сказали наши мудрецы (Мидраш\nТеилим 19; см. также Бемидбар Рабба, глава\n8):<\/p>", "<p>«Сказал Шмуэль бар Абба:<\/p>", "<p>\"Я знаю небесные пути так же хорошо,\nкак знаю улицы Неардеи\".<\/p>", "<p>Разве Шмуэль поднимался на небеса?<\/p>", "<p>Но благодаря тому, что он усердно\nизучал мудрость Торы, он узнал из неё\nвсё, что находится в небесных высотах».<\/p>", "<h1 class=\"western\" id=\"section-159\"><strong><font size=\"4\">И\nони знают даже то, что недоступно\nчеловеческому познанию<\/font><\/strong><\/h1>", "<p>Как глубоки слова мудрецов!<\/p>", "<p>Вначале они говорят о небесном своде:<\/p>", "<p><strong>«Разве Шмуэль поднимался на\nнебесный свод?»<\/strong><\/p>", "<p>А заканчивают словами:<\/p>", "<p><strong>«Он узнал из неё всё, что находится\nв небесных высотах».<\/strong><\/p>", "<p>Ведь наши мудрецы сказали (Хагига\n12б):<\/p>", "<p>«Существует семь небес: Вилон, Ракия,\nШхаким, Звуль, Маон, Махон и Аравот».<\/p>", "<p>(В «Мидраше десяти речений» порядок\nприводится иначе: «Выше Звуля находится\nМахон... выше Махона — Маон...» См. там.)<\/p>", "<p>«Вилон ничему не служит, но утром\nсворачивается, а вечером разворачивается...<\/p>", "<p>Ракия — небесный свод, на котором\nзакреплены солнце, луна, звёзды и\nсозвездия...<\/p>", "<p>Шхаким — небеса, на которых находятся\nжернова...»<\/p>", "<p>И вот небеса, называемые <strong>«Вилон»<\/strong>\nи <strong>«Ракия»<\/strong>, в определённой мере\nдоступны человеческим чувствам.<\/p>", "<p>Ведь солнце, луна и звёзды оказывают\nвлияние на земной мир, разделяя день и\nночь, и служат знамениями для определения\nвремён, как сказано (Берешит 1:14):<\/p>", "<p>«И будут они знамениями, и для времён...\nи будут светилами...»<\/p>", "<p>И в соответствии с движением небесных\nсветил происходят посев и жатва, холод\nи жара, лето и зима, а также определяются\nразличные свойства неживой природы,\nрастений, животных и человека (см. Шаббат\n156а).<\/p>", "<p>Поэтому среди народов мира есть\nмудрецы, сведущие в астрологии (см.\nПсахим 94б).<\/p>", "<p>Но небеса, называемые <strong>«Шхаким»<\/strong>,\n<strong>«Звуль»<\/strong> и последующие, совершенно\nнедоступны человеческим чувствам.<\/p>", "<p>И никто не может узнать, что находится\nтам, иначе как посредством Торы Всевышнего.<\/p>", "<p>Именно это имели в виду наши мудрецы,\nкогда сказали:<\/p>", "<p><strong>«Благодаря тому, что он усердно\nизучал мудрость Торы, он узнал из неё\nвсё, что находится в небесных высотах».<\/strong><\/p>", "<p>То есть он узнал из Торы не только то,\nчто находится на небесах Вилон и Ракия,\nно даже то, что находится на небесах\nШхаким.<\/p>", "<p>(См. также Берешит Рабба, глава 2; Бехорот\n8б.)<\/p>", "<p>Именно об этом говорил Бен Баг-Баг\n(Пиркей Авот 5:23):<\/p>", "<p><strong>«Переворачивай её и снова\nпереворачивай, ибо всё заключено в ней.\nИ в ней созерцай...»<\/strong><\/p>", "<p><strong>«Ибо всё заключено в ней»<\/strong> —\nвся мудрость и все знания находятся в\nТоре.<\/p>", "<p>Даже законы природы, ради познания\nкоторых учёные трудятся, исследуют\nкаждую вещь, наблюдают за ней и подвергают\nеё опытам, — <strong>«в ней созерцай»<\/strong>.<\/p>", "<p>Ведь посредством Божественной мудрости\nчеловек сможет постичь и мудрость\nприроды.<\/p>", "<h1 class=\"western\" id=\"section-160\"><strong><font size=\"4\">Только\nизучающим Тору ради неё самой раскрывается\nмудрость мироздания<\/font><\/strong><\/h1>", "<p>Но когда человек сможет постичь\nпосредством Божественной мудрости всё\nсуществующее?<\/p>", "<p>Когда его стремлением будет Божественная\nмудрость, а целью — Тора Всевышнего:\nизучать её и обучать ей других, соблюдать\nеё и исполнять.<\/p>", "<p>Тогда исполнится сказанное: <strong>«Тайна\nГоспода — боящимся Его»<\/strong> (Теилим\n25:14; см. также Санедрин 48б, Сота).<\/p>", "<p>И человек сможет познать посредством\nБожественной мудрости всё, что необходимо\nему для её постижения.<\/p>", "<p>Именно это имели в виду наши мудрецы\n(Пиркей Авот 6:1):<\/p>", "<p><strong>«Всякий, кто занимается Торой\nради неё самой, удостаивается многого».<\/strong><\/p>", "<p>Тот, кто изучает Тору ради самой Торы,\nчтобы познать её, а не только для того,\nчтобы посредством неё узнать о других\nвещах, удостаивается постичь из неё\nмножество знаний.<\/p>", "<p>Как сказали наши мудрецы (Брахот 17а)\nо стихе (Теилим 111:10):<\/p>", "<p>«Доброе разумение — всем исполняющим\nих».<\/p>", "<p>Это относится к тем, кто занимается\nТорой ради неё самой, а не к тем, кто\nзанимается ею ради посторонних целей.<\/p>", "<p>(См. также Сукка 28а и Сота 49а. И этого\nдостаточно для понимающего.)<\/p>", "<p>Именно об этом сказано (Коэлет 1:13):<\/p>", "<p><strong>«И обратил я сердце своё к\nисследованию и изучению мудростью\nвсего, что совершается под небесами...»<\/strong><\/p>", "<p>Наши мудрецы объясняли (Шир а-Ширим\nРабба, глава 1):<\/p>", "<p>«Если есть человек, который хорошо и\nкрасиво читает Писание, пойдём к нему.<\/p>", "<p>Если есть человек, который хорошо\nизучает и преподаёт Мишну, пойдём к\nнему».<\/p>", "<p>(В комментарии «Эц Йосеф» объясняется,\nчто Шломо разыскивал и исследовал\nкаждого, кто хорошо читал Писание и\nизучал Мишну.)<\/p>", "<p>Как сказано: «И исследовал мудростью...»<\/p>", "<p>«И не только слова Торы исследовал\nШломо, но и всё, что совершается под\nнебесами.<\/p>", "<p>Например, как сделать горчицу сладкой,\nкак устранить горечь люпина.<\/p>", "<p>Сказал ему Святой, благословен Он:<\/p>", "<p>\"Ты трудился ради слов Торы. Клянусь\nжизнью твоей, Я не лишу тебя награды. Я\nниспошлю на тебя дух святости\"».<\/p>", "<p>То есть Шломо исследовал всё, что\nсовершается под небесами, не посредством\nопытов и наблюдений с помощью пяти\nчувств, а <strong>«мудростью»<\/strong> —\nпосредством Торы Всевышнего.<\/p>", "<p>(Ведь Тора называется «мудростью»,\nкак объясняется в книге «Ган Науль».)<\/p>", "<p>Именно в Торе он увидел всё.<\/p>", "<p>Однако он исследовал эти вещи не\nпотому, что его главной целью было\nпознание самих этих вещей, а ради\nпостижения мудрости, чтобы глубже понять\nТору Всевышнего.<\/p>", "<p>Поэтому слова <strong>«И обратил я сердце\nсвоё к исследованию и изучению\nмудростью...»<\/strong> имеют два значения.<\/p>", "<p><strong>Во-первых, внутри мудрости.<\/strong>\nОн исследовал всё внутри Торы и нашёл\nв ней ответы на все вопросы.<\/p>", "<p><strong>Во-вторых, ради мудрости.<\/strong> Он\nисследовал всё ради более глубокого\nпознания Торы.<\/p>", "<p>Именно это означают слова Всевышнего,\nобращённые к нему:<\/p>", "<p><strong>«Ты трудился ради слов Торы.\nКлянусь жизнью твоей, Я не лишу тебя\nнаграды».<\/strong><\/p>", "<p>И об этом сказано (Мишлей 17:24):<\/p>", "<p><strong>«Перед лицом разумного — мудрость,\nа глаза глупца — на краю земли».<\/strong><\/p>", "<p>Перед человеком, который понимает\nБожественную мудрость, раскрывается\nвся мудрость, и он созерцает в Торе\nВсевышнего всё, что существует в мире.<\/p>", "<p>Но глупец, который не стремится к\nпониманию Торы, желая познать законы\nприроды, обращает свои глаза к самым\nдальним краям земли, чтобы увидеть и\nисследовать каждую вещь.<\/p>", "<p>И всё сказанное заключено в соединении\nпоследних слов Торы с её первыми словами:<\/p>", "<p><strong>«Перед глазами всего Израиля. В\nначале сотворил Бог небо и землю».<\/strong><\/p>", "<p>Ведь наши мудрецы сказали (Берешит\nРабба, глава 1), объясняя стих (Мишлей\n8:30):<\/p>", "<p>«И была я при Нём искусным мастером».<\/p>", "<p>«Искусным мастером» — Тора говорит:<\/p>", "<p>«Я была орудием мастерства Святого,\nблагословен Он.<\/p>", "<p>Ведь в мире принято, что когда царь\nстроит дворец, он пользуется чертежами\nи планами, чтобы знать, как расположить\nкомнаты и другие помещения.<\/p>", "<p>Так и Святой, благословен Он, смотрел\nв Тору и творил мир».<\/p>", "<p>И Тора сказала:<\/p>", "<p>«В начале...»<\/p>", "<p>А слово <strong>«начало»<\/strong> означает\nне что иное, как Тору.<\/p>", "<p>Как сказано (Мишлей 8:22):<\/p>", "<p>«Господь создал меня началом пути\nСвоего».<\/p>", "<p>Поэтому слова <strong>«Перед глазами\nвсего Израиля»<\/strong> означают, что перед\nглазами тех сынов Израиля, которые\nпостоянно изучают Тору Всевышнего,\nраскрывается в слове <strong>«Берешит»<\/strong>\n— в Торе, являющейся началом Его пути,\n— всё, что <strong>«сотворил Бог: небо и\nземлю»<\/strong>.<\/p>", "<p>А слово <strong>«эт»<\/strong> («<font face=\"Tahoma\"><span lang=\"he-IL\">את<\/span><\/font>»)\nуказывает также на всё порождённое\nнебом и землёй.<\/p>", "<p>Таким образом, в Торе они могут увидеть\nвсё.<\/p>", "<p>Подобно тому как человек, рассматривающий\nархитектурные чертежи и понимающий\nизображённое на них, знает расположение\nвсех помещений дворца, так и изучающий\nТору постигает устройство всего\nмироздания.<\/p>", "<p>Поэтому сладкозвучный певец Израиля\nмолился:<\/p>", "<p><strong>«Открой глаза мои»<\/strong> — те\nглаза, которые я закрываю, чтобы не\nвидеть всего, что находится на земле.<\/p>", "<p><strong>«И увижу чудеса»<\/strong> — все\nтворения миров, их сущность и свойства,\nкоторые сокрыты от моих глаз.<\/p>", "<p><strong>«Из Торы Твоей»<\/strong> — чтобы\nпосредством Торы я смог увидеть и познать\nвсё.<\/p>"]}];

const content=document.getElementById('content'), nav=document.getElementById('nav'), searchBox=document.getElementById('search'), count=document.getElementById('searchCount');
const sidebar=document.getElementById('sidebar'), panel=document.getElementById('subchapPanel');
let index=0, fontSize=20, term='', matches=[], cursor=-1, marks=[], highlighted=-1;
const plain=chapters.map(c=>{let d=document.createElement('div');d.innerHTML=c.body.join('');return d.textContent||''});
function show(i, keepSearch=false){
 index=Math.max(0,Math.min(chapters.length-1,i));let c=chapters[index];
 content.innerHTML=c.body.join('');
 // The chapter title is already displayed above the text; remove only its duplicate at the beginning of the body.
 const firstHeading=content.firstElementChild;
 if(firstHeading && /^H[1-6]$/.test(firstHeading.tagName)){
   const normalized=t=>t.replace(/\s+/g,' ').trim().toLocaleLowerCase('ru');
   if(normalized(firstHeading.textContent)===normalized(c.title)) firstHeading.remove();
 }
 document.getElementById('num').textContent='';
 document.getElementById('title').textContent=c.title;
 document.getElementById('chapterIndicator').textContent=c.title;
 document.querySelectorAll('.navitem').forEach((b,j)=>b.classList.toggle('active',j===index));
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===chapters.length-1;
 panel.replaceChildren();
 const headings=content.querySelectorAll('h1, h2');
 if(!headings.length){let b=document.createElement('button');b.textContent='Начало главы';b.onclick=()=>{panel.hidden=true;content.scrollIntoView({behavior:'smooth',block:'start'})};panel.append(b)}
 headings.forEach((h,j)=>{h.id='sub-'+index+'-'+j;let b=document.createElement('button');b.textContent=h.textContent.trim().replace(/\s+/g,' ');b.onclick=()=>{panel.hidden=true;h.scrollIntoView({behavior:'smooth',block:'start'})};panel.append(b)});
 panel.hidden=true;sidebar.classList.remove('open');
 history.replaceState(null,'','#chapter-'+(index+1));
 highlighted=-1;marks=[];
 if(term)highlight();
 if(!keepSearch)window.scrollTo({top:0,behavior:'instant'});
}
chapters.forEach((c,i)=>{let b=document.createElement('button');b.className='navitem';b.textContent=c.title;b.onclick=()=>show(i);nav.append(b)});
document.getElementById('menu').onclick=()=>sidebar.classList.toggle('open');
document.getElementById('subchapToggle').onclick=(e)=>{e.stopPropagation();panel.hidden=!panel.hidden};
document.addEventListener('click',e=>{if(!e.target.closest('.subchap-wrap'))panel.hidden=true});
document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);
document.getElementById('smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);content.style.fontSize=fontSize+'px'};
document.getElementById('larger').onclick=()=>{fontSize=Math.min(32,fontSize+1);content.style.fontSize=fontSize+'px'};
document.getElementById('night').onclick=()=>document.body.classList.toggle('dark');
function scan(){term=searchBox.value.trim().toLocaleLowerCase('ru');matches=[];cursor=-1;marks=[];highlighted=-1;if(!term){count.textContent='';show(index,true);return;}
 plain.forEach((txt,i)=>{let start=0;let low=txt.toLocaleLowerCase('ru');while(true){let at=low.indexOf(term,start);if(at<0)break;matches.push({chapter:i,offset:at});start=at+Math.max(1,term.length)}});
 count.textContent=matches.length?'0 / '+matches.length:'0';
 show(index,true);
}
function highlight(){
 if(!term)return;
 let walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(let n of nodes){let txt=n.nodeValue, low=txt.toLocaleLowerCase('ru');if(!low.includes(term))continue;
 let frag=document.createDocumentFragment(),pos=0,at;
 while((at=low.indexOf(term,pos))!==-1){frag.append(document.createTextNode(txt.slice(pos,at)));let mark=document.createElement('mark');mark.className='search-hit';mark.textContent=txt.slice(at,at+term.length);frag.append(mark);pos=at+term.length}
 frag.append(document.createTextNode(txt.slice(pos)));n.parentNode.replaceChild(frag,n);
 }
 marks=Array.from(content.querySelectorAll('mark.search-hit'));highlighted=index;
}
function nextResult(){
 if(searchBox.value.trim().toLocaleLowerCase('ru')!==term)scan();
 if(!matches.length){count.textContent='0';return;}
 cursor=(cursor+1)%matches.length;
 const m=matches[cursor];
 if(index!==m.chapter)show(m.chapter,true);
 else if(highlighted!==index)highlight();
 const localIndex=matches.slice(0,cursor).filter(x=>x.chapter===index).length;
 marks.forEach(x=>x.classList.remove('current'));
 let mark=marks[localIndex];
 if(mark){mark.classList.add('current');mark.scrollIntoView({behavior:'smooth',block:'center'})}
 count.textContent=(cursor+1)+' / '+matches.length;
}
searchBox.addEventListener('input',scan);
searchBox.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nextResult()}});
