ем, тем сильнее его дурное\nначало».<\/p>", "<p>То есть:<\/p>", "<p>«Не переживай, Абайе!<\/p>", "<p>Не думай, что тот человек праведнее\nтебя.<\/p>", "<p>Это вовсе не так.<\/p>", "<p>Тот человек беден духовным знанием,\nпоэтому дурное начало — этот вор — не\nспешит проникнуть в его сердце.<\/p>", "<p>Но ты богат духовным знанием, и\nвсевозможные драгоценные сокровища\nскрыты в глубинах твоего сердца.<\/p>", "<p>Поэтому, если ты откроешь дверь, дурное\nначало немедленно устремится туда,\nчтобы похитить всё, чем ты обладаешь.<\/p>", "<p>Ведь дурное начало подобно вору.<\/p>", "<p>А каждый вор всеми силами стремится\nпроникнуть в дом богатого человека.<\/p>", "<p>И чем богаче человек, тем больше усилий\nвор готов приложить, чтобы проникнуть\nв его покои.<\/p>", "<p>Так и человек, который превосходит\nсвоего товарища по духовному уровню,\nобладает большим духовным богатством.<\/p>", "<p>Поэтому и его дурное начало — этот\nвор — сильнее, чем дурное начало его\nтоварища».<\/p>", "<p>(Всё сказанное выше уже приводилось\nв моей книге «Двар Тора», глава 5; см.\nтам.)<\/p>", "<h1 class=\"western\" id=\"section-70\"><font size=\"4\">Тот,\nкто предоставляет свои органы для\nсовершения греха, разрушает ограду<\/font><\/h1>", "<p>Написано в книге «Сефер Хасидим»\n(параграф 148):<\/p>", "<p>«Три органа создал Святой, благословен\nОн, в человеке: уши, глаза и язык.<\/p>", "<p>Уши — чтобы слышать, глаза — чтобы\nвидеть, язык — чтобы говорить.<\/p>", "<p>Именно посредством этих органов\nсовершаются многие человеческие\nпоступки.<\/p>", "<p>Если бы у человека не было ушей, он не\nслышал бы пустых и бессмысленных речей.<\/p>", "<p>А сколько преступлений совершается\nвследствие услышанного!<\/p>", "<p>Например, человек услышал, что в\nопределённом месте находится женщина\nили имущество, которое можно украсть,\nи отправился туда, чтобы совершить грех.<\/p>", "<p>Если бы у человека не было глаз, он не\nсмотрел бы на наготу и не испытывал бы\nк ней вожделения.<\/p>", "<p>И так происходит во многих других\nслучаях.<\/p>", "<p>Если бы у человека не было языка, он\nне произносил бы злословия.<\/p>", "<p>А сколько грехов совершается посредством\nязыка!<\/p>", "<p>Что же сделал Святой, благословен Он?<\/p>", "<p>Он установил для каждого из этих\nорганов ограду и стену, чтобы отделить\nчеловека от греха и отдалить его от\nпреступления.<\/p>", "<p>Для ушей Он создал пальцы, заострённые\nподобно колышкам, а также мягкие мочки\nушей.<\/p>", "<p>И возложил на человека обязанность\nзакрывать ими уши, создавая преграду,\nкогда он слышит греховные речи.<\/p>", "<p>(Как объясняется в трактате Ктубот\n5б.)<\/p>", "<p>Для глаз Он создал веки, чтобы человек\nмог прикрывать и закрывать ими глаза,\nне позволяя им смотреть на зло.<\/p>", "<p>А для языка Он создал две стены: стену\nиз кости и стену из плоти — зубы и губы,\n— чтобы человек не произносил злословия\nи никаких других греховных речей.<\/p>", "<p>(Как объясняется в трактате Арахин\n15б.)<\/p>", "<p>Но когда низкий человек направляет\nсвои уши на слушание греховных речей,\nсвои глаза — на созерцание греха, а свой\nязык — на произнесение лживых и обманных\nслов, что он делает?<\/p>", "<p>Он разрушает ограду, установленную\nЦарём мира.<\/p>", "<p>И сколько грехов совершается вследствие\nэтого!<\/p>", "<p>Представь себе человека, который\nразрушает ограду, установленную земным\nцарём.<\/p>", "<p>За это он подлежит смертной казни.<\/p>", "<p>Тем более человек, разрушающий ограду\nЦаря всего мира, которую Всевышний\nдоверил ему охранять, заслуживает\nсмерти.<\/p>", "<p>И об этом сказано (Коэлет 10:8):<\/p>", "<p>«И разрушающего ограду ужалит змей».<\/p>", "<p>(Конец цитаты.)<\/p>", "<h1 class=\"western\" id=\"section-71\"><font size=\"4\">Создание\nзащитных оград в человеческом теле\nобязывает человека соблюдать их<\/font><\/h1>", "<p>Поэтому каждый человек должен задуматься\nи сказать в своём сердце:<\/p>", "<p>«Как могу я напрасно обманывать самого\nсебя, утверждая, будто являюсь исключением\nиз общего правила?<\/p>", "<p>Как могу я говорить, что даже если мои\nглаза увидят всякое зло, а мои уши услышат\nего, дурное начало не сможет склонить\nменя к греху?<\/p>", "<p>Ведь Всевышний создал в моём теле\nвеки, чтобы я мог закрывать ими глаза.<\/p>", "<p>Он создал мягкие мочки ушей и пальцы\nрук, заострённые подобно колышкам, чтобы\nя мог закрывать ими свои уши.<\/p>", "<p>И разве из самого существования этих\nорганов в моём теле, как и в телах всех\nостальных людей, я не должен понять, что\nничем не отличаюсь от других?<\/p>", "<p>Следовательно, я тоже обязан защищать\nсебя посредством этих оград, подобно\nвсем остальным людям».<\/p>", "<h1 class=\"western\" id=\"section-72\"><font size=\"4\">Не\nдоверяй самому себе даже в старости<\/font><\/h1>", "<p>Наши мудрецы сказали (Пиркей Авот\n2:4):<\/p>", "<p>Гилель говорил: «Не отделяй себя от\nобщины и не верь самому себе до дня своей\nсмерти».<\/p>", "<p>Представляется, что связь между этими\nдвумя наставлениями можно объяснить\nследующим образом.<\/p>", "<p>«Не отделяй себя от общины».<\/p>", "<p>Не говори:  «Я отличаюсь от всех\nостальных людей.<\/p>", "<p>Даже если мои глаза увидят всякое зло,\nа мои уши услышат его, дурное начало не\nсможет соблазнить меня».<\/p>", "<p>Не говори так!<\/p>", "<p>Ведь уже был человек, который говорил\nподобное, и он был мудрее всех людей,\nоднако всё же оступился.<\/p>", "<p>Это был царь Шломо.<\/p>", "<p>Ведь в Торе написано (Дварим 17:17):<\/p>", "<p>«И пусть не умножает себе жён, чтобы\nне уклонилось его сердце».<\/p>", "<p>Но Шломо сказал:<\/p>", "<p>«Я умножу число жён, и моё сердце не\nуклонится».<\/p>", "<p>(Санхедрин 21б.)<\/p>", "<p>И не говори:<\/p>", "<p>«В молодости я действительно ничем\nне отличаюсь от остальных людей.<\/p>", "<p>Но когда на протяжении всей своей\nжизни я буду побеждать своё дурное\nначало, то в старости уже не буду бояться\nзла».<\/p>", "<p>Не говори так!<\/p>", "<p>«И не верь самому себе до дня своей\nсмерти».<\/p>", "<p>Ведь о Шломо написано (Млахим I, 11:4):<\/p>", "<p>«И было, во время старости Шломо жёны\nего склонили его сердце».<\/p>", "<p>Поэтому каждый человек должен\nукрепляться и прилагать все усилия,\nчтобы закрывать свои глаза от соблазнов\nэтого мира.<\/p>", "<p>Ведь это — первая и главная из всех\nзащитных оград.<\/p>", "<p>И так написано в книге «Орхот Цадиким»\n(врата 26, раздел о раскаянии и защитных\nоградах, от имени книги «Баалей а-Нефеш»\nРаавада):<\/p>", "<p>«Каждый человек может самостоятельно\nопределить, какие ограды ему необходимо\nустановить в соответствии со своими\nобстоятельствами. Но главная из всех\nоград — оберегать свои глаза от того,\nчто ему не принадлежит».<\/p>"]}, {"title": "МАХАЗЕ VI", "body": ["<h2 class=\"western\" id=\"section-73\"><font size=\"6\">МАХАЗЕ\nVI<\/font><\/h2>", "<h1 class=\"western\" id=\"section-74\"><font size=\"4\">Каждый\nвзгляд на зло приводит к духовному\nпадению, а оберегающий свои глаза\nспасается от дурного начала<\/font><\/h1>", "<h1 class=\"western\" id=\"section-75\"><font size=\"4\">Даже\nстрах перед Небесами достигает\nсовершенства с помощью Всевышнего<\/font><\/h1>", "<p>Написано в книге Теилим (66:16–18):<\/p>", "<p>«Придите, послушайте, и я расскажу\nвсем боящимся Бога, что Он сделал для\nмоей души. К Нему взывал я устами своими,\nи хвала Ему была на языке моём. Если бы\nя видел беззаконие в сердце моём, не\nуслышал бы меня Господь».<\/p>", "<p>Наши мудрецы сказали (Брахот 33б):<\/p>", "<p>«Всё в руках Небес, кроме страха перед\nНебесами».<\/p>", "<p>Как сказано (Дварим 10:12):<\/p>", "<p>«А теперь, Израиль, чего Господь, Бог\nтвой, требует от тебя, кроме того, чтобы\nты боялся Его?..»<\/p>", "<p>Однако следует знать, что даже страх\nперед Небесами находится в руках Небес.<\/p>", "<p>Это объясняется словами наших мудрецов\n(Авода Зара 5а):<\/p>", "<p>Когда Святой, благословен Он, сказал\nнароду Израиля (Дварим 5:26):<\/p>", "<p>«О, если бы сердце их всегда было таким,\nчтобы бояться Меня!..»<\/p>", "<p>Народ Израиля должен был ответить:<\/p>", "<p>«Ты Сам даруй нам такое сердце!»<\/p>", "<p>И действительно, мы находим, что царь\nДавид, мир ему, молился Всевышнему и\nговорил (Теилим 86:11):<\/p>", "<p>«Научи меня, Господи, пути Твоему, и я\nбуду ходить в истине Твоей; объедини\nсердце моё, чтобы бояться Имени Твоего».<\/p>", "<p>А слова наших мудрецов «Всё в руках\nНебес, кроме страха перед Небесами»\nозначают следующее.<\/p>", "<p>Все остальные дела находятся в руках\nНебес от начала до конца.<\/p>", "<p>Но в отношении страха перед Небесами\nначало зависит от человека, тогда как\nзавершение и достижение совершенства\nнаходятся в руках Всевышнего.<\/p>", "<p>Как сказано (Теилим 57:3):<\/p>", "<p>«Воззову к Богу Всевышнему, к Богу,\nзавершающему дело за меня».<\/p>", "<p>«Воззову» — то есть буду молиться\nВсевышнему обо всём, поскольку Он\n«Всевышний», первопричина всех причин\nи всего происходящего.<\/p>", "<p>(См. комментарий Мальбима.)<\/p>", "<p>И я буду взывать к Нему также о страхе\nперед Небесами, поскольку Он завершает\nи доводит до совершенства то, что\nвозложено на меня, — приобретение страха\nперед Небесами.<\/p>", "<p>Хотя эта обязанность лежит на мне, я\nлишь начинаю это дело, а Всевышний\nзавершает его.<\/p>", "<p>И в этом заключается смысл стиха:<\/p>", "<p>«А теперь, Израиль, чего Господь, Бог\nтвой, требует от тебя, кроме того, чтобы\nты боялся Его?»<\/p>", "<p>В стихе сказано не просто «от тебя» —\nмимха, а «с тебя» — меимха, что указывает\nна участие Всевышнего вместе с человеком\nв приобретении страха перед Небесами.<\/p>", "<p>Человек начинает, а Всевышний завершает.<\/p>", "<p>Ведь если Всевышний не поможет человеку,\nтот своими силами не сможет исполнить\nЕго волю.<\/p>", "<h1 class=\"western\" id=\"section-76\"><font size=\"4\">Только\nтому, кто стремится очиститься, оказывают\nпомощь с Небес<\/font><\/h1>", "<p>И так сказали наши мудрецы (Сукка 52б):<\/p>", "<p>«Дурное начало человека ежедневно\nусиливается против него и стремится\nпогубить его».<\/p>", "<p>Как сказано (Теилим 37:32):<\/p>", "<p>«Нечестивец подстерегает праведника\nи стремится умертвить его».<\/p>", "<p>«И если бы Святой, благословен Он, не\nпомогал человеку, тот не смог бы\nпротивостоять дурному началу».<\/p>", "<p>Как сказано (там же, 37:33):<\/p>", "<p>«Господь не оставит его в его руке».<\/p>", "<p>Даже праведник, который всеми силами\nборется со своим дурным началом, не\nспособен победить его без помощи\nВсевышнего.<\/p>", "<p>Но Всевышний помогает человеку лишь\nтогда, когда тот сам стремится к\nправедности и прилагает усилия, чтобы\nподчинить своё дурное начало.<\/p>", "<p>И так сказали наши мудрецы (Йома 38б):<\/p>", "<p>«Что означают слова Писания (Мишлей\n3:34):<\/p>", "<p>\"Если над насмешниками Он насмехается,\nто смиренным дарует милость\"?<\/p>", "<p>Тому, кто приходит оскверниться,\nоткрывают возможность для этого, а тому,\nкто приходит очиститься, помогают».<\/p>", "<p>И сказал великий мудрец, мой учитель\nрабби Йеошуа Геллер, благословенна\nпамять праведника:<\/p>", "<p>Святой, благословен Он, говорит и\nисполняет.<\/p>", "<p>То есть то, что Он повелевает в Торе,\nОн Сам исполняет.<\/p>", "<p>А в Торе Он сказал (Шмот 23:5):<\/p>", "<p>«Если увидишь осла ненавистника\nтвоего, лежащего под своей ношей...\nнепременно помоги ему вместе с ним».<\/p>", "<p>И наши мудрецы сказали (Бава Меция\n32а):<\/p>", "<p>Если хозяин осла отошёл в сторону, сел\nи сказал:<\/p>", "<p>«Поскольку на тебе лежит заповедь\nпомочь мне, если хочешь разгрузить осла\n— разгружай сам»,<\/p>", "<p>то другой человек освобождается от\nобязанности помогать ему.<\/p>", "<p>Как сказано:<\/p>", "<p>«Вместе с ним».<\/p>", "<p>Но если хозяин осла стар или болен,\nдругой человек обязан помочь ему.<\/p>", "<p>Поэтому, когда человек сгибается под\nтяжестью своего дурного начала, Святой,\nблагословен Он, помогает ему снять с\nсебя это бремя.<\/p>", "<p>Однако лишь при условии «вместе с\nним», то есть когда сам человек стремится\nочиститься.<\/p>", "<p>И Рамхаль, рабби Моше Хаим Луцатто,\nблагословенна память святого праведника,\nнаписал («Месилат Йешарим», глава 2):<\/p>", "<p>«Если человек следит за собой, тогда\nСвятой, благословен Он, помогает ему, и\nон спасается от дурного начала.<\/p>", "<p>Но если человек сам не следит за собой,\nто, несомненно, Святой, благословен Он,\nне станет оберегать его.<\/p>", "<p>Ведь если человек сам себя не жалеет,\nкто пожалеет его?<\/p>", "<p>И это подобно тому, что сказали наши\nмудрецы (Брахот 33а):<\/p>", "<p>\"Всякого, в ком нет разумения,\nзапрещено жалеть\".<\/p>", "<p>И об этом говорил Гилель (Пиркей Авот\n1:14):<\/p>", "<p>\"Если я не за себя, то кто за меня?\"»<\/p>", "<p>(До этого места — его слова.)<\/p>", "<p>Поэтому, если человек закрывает свои\nглаза, чтобы не видеть зла, тем самым он\nпоказывает, что стремится очиститься.<\/p>", "<p>И тогда Святой, благословен Он, помогает\nему преодолеть и подчинить своё дурное\nначало.<\/p>", "<p>Но если человек широко раскрывает\nглаза, чтобы смотреть на всё, что\nпробуждает страсть и вожделение, на\nвсякую нечистоту, то этим он показывает,\nчто стремится не к очищению, а к\nосквернению.<\/p>", "<p>Поэтому Святой, благословен Он, не\nпомогает ему в борьбе с дурным началом.<\/p>", "<p>А когда Всевышний не помогает человеку,\nтот не способен самостоятельно победить\nсвоё дурное начало и падает, побеждённый\nим.<\/p>", "<p>И поэтому созерцание запрещённой\nнаготы относится к числу двадцати\nчетырёх поступков, препятствующих\nраскаянию.<\/p>", "<p>(Риф, Йома 6а; Рамбам, «Законы о раскаянии»,\nглава 4.)<\/p>", "<p>Ведь человек не способен раскаяться\nво всех своих грехах без помощи Всевышнего.<\/p>", "<p>Но Всевышний не помогает ему совершить\nтшуву, пока тот продолжает смотреть на\nвещи, пробуждающие вожделение.<\/p>", "<p>Поскольку самим своим взглядом он\nпоказывает, что стремится к осквернению,\nа не к очищению.<\/p>", "<p>И именно это с самого начала привело\nего к греху и совершению зла.<\/p>", "<h1 class=\"western\" id=\"section-77\"><font size=\"4\">Изучение\nТоры приводит к страху перед Небесами<\/font><\/h1>", "<p>И в этом заключается смысл слов\nсладкозвучного певца Израиля, царя\nДавида:<\/p>", "<p>«Придите, послушайте, все боящиеся\nБога, и я расскажу» вам о страхе перед\nНебесами, о том, «что Он сделал для души\nмоей», то есть о том, что Всевышний\nсовершил для моей души.<\/p>", "<p>Ведь я сам не смог бы этого сделать. Я\nне смог бы победить своё дурное начало\nбез помощи Всевышнего, поскольку я лишь\nначинаю дело, а Он завершает его за меня.<\/p>", "<p>И начал я с того, что «к Нему взывал\nя», то есть посвятил свои уста чтению и\nизучению Его Торы.<\/p>", "<p>Как сказано (Йеошуа 1:8):<\/p>", "<p>«Да не отходит эта книга Торы от уст\nтвоих, и размышляй над ней днём и ночью,\nчтобы тщательно исполнять всё написанное\nв ней, ибо тогда преуспеешь на пути своём\nи тогда будешь поступать мудро».<\/p>", "<p>Ведь изучение Торы приводит человека\nк страху перед Небесами.<\/p>", "<p>Как сказано (Дварим 17:19):  «И будет она\nс ним, и пусть читает он её все дни жизни\nсвоей, чтобы научиться бояться Господа,\nБога своего, соблюдать все слова этой\nТоры и эти установления, чтобы исполнять\nих».<\/p>", "<p>И сказали наши мудрецы (Сифри, там же):<\/p>", "<p>«Слова \"чтобы научиться бояться\"\nучат нас, что изучение Торы приводит к\nстраху перед Небесами, страх приводит\nк соблюдению заповедей, а соблюдение —\nк их исполнению».<\/p>", "<p>И сказали наши мудрецы (Пиркей Авот\n3:17):<\/p>", "<p>«Если нет мудрости, нет и страха перед\nНебесами».<\/p>", "<p>И также написано в книге Мишлей (2:3–5):<\/p>", "<p>«Если к разумению будешь взывать и к\nпониманию возвысишь голос свой, если\nбудешь искать его, как серебро, и\nразыскивать его, как скрытые сокровища,\nтогда постигнешь страх перед Господом...»<\/p>", "<p>И только посредством изучения Торы\nчеловек может победить своё дурное\nначало.<\/p>", "<p>Как сказали наши мудрецы (Кидушин\n30б):<\/p>", "<p>«Так сказал Святой, благословен Он,\nнароду Израиля:<\/p>", "<p>\"Сыновья Мои! Я создал дурное начало\nи создал Тору как средство против него.<\/p>", "<p>Если вы занимаетесь Торой, то не будете\nотданы в его власть\".<\/p>", "<p>Как сказано (Берешит 4:7):<\/p>", "<p>\"Ведь если будешь поступать хорошо\n— будешь возвышен\".<\/p>", "<p>\"А если вы не занимаетесь Торой, то\nбудете отданы в его власть\".<\/p>", "<p>Как сказано (там же):  \"У входа грех\nлежит\"».<\/p>", "<h1 class=\"western\" id=\"section-78\"><font size=\"4\">Молитва\nи приведение многих людей к заслугам\nради спасения от дурного начала<\/font><\/h1>", "<p>И когда я начал с того, что посвятил\nЕму свои уста, чтобы днём и ночью\nпроизносить слова Торы, — и следует\nобратить внимание, что написано «уста\nмои», а не «устами моими» (см. комментарий\nИбн Эзры к этому стиху), — после этого\nя «к Нему взывал», то есть молился\nВсевышнему, чтобы Он завершил начатое\nмною дело и спас меня от дурного начала.<\/p>", "<p>Можно также истолковать слова «к Нему\nвзывал я» следующим образом.<\/p>", "<p>Я обращался ко многим людям, наставлял\nих и пробуждал их сердца к возвращению\nко Всевышнему.<\/p>", "<p>Ведь один из способов избежать ловушек\nдурного начала — помогать многим людям\nприобретать заслуги.<\/p>", "<p>Как сказано в Мишне (Пиркей Авот 5:18):<\/p>", "<p>«Всякий, кто приводит многих людей к\nзаслугам, не будет приведён к греху».<\/p>", "<p>И наши мудрецы объяснили (Йома 87а):<\/p>", "<p>«Почему?<\/p>", "<p>Чтобы не получилось так, что он окажется\nв Гееноме, а его ученики — в Ган-Эдене».<\/p>", "<p>Как сказано (Теилим 16:10):<\/p>", "<p>«Ибо Ты не оставишь душу мою в\nпреисподней, не дашь преданному Тебе\nувидеть погибель».<\/p>", "<p>Кроме того, слова «и возвышение Его\nбыло под языком моим» означают следующее.<\/p>", "<p>Прославление Всевышнего и восхваление\nЕго за то, что Он спас меня от дурного\nначала, уже были приготовлены под моим\nязыком в то время, когда я ещё только\nвзывал к Нему и молился о спасении от\nдурного начала.<\/p>", "<p>Ведь я был уверен во Всевышнем, что Он\nспасёт меня от моего дурного начала, и\nуже тогда прославлял Его за это.<\/p>", "<h1 class=\"western\" id=\"section-79\"><font size=\"4\">Только\nтому, кто оберегает свои глаза, Всевышний\nпомогает спастись от дурного начала<\/font><\/h1>", "<p>Однако сказано:<\/p>", "<p>«Если бы я видел беззаконие в сердце\nмоём, не услышал бы меня Господь».<\/p>", "<p>То есть если бы я поднимал свои глаза,\nчтобы смотреть на зло, созерцать всё,\nчто пробуждает страсть, вожделение и\nнечистоту, и делал бы это по желанию\nсвоего сердца, тогда «не услышал бы меня\nГосподь».<\/p>", "<p>Ведь иногда человек видит что-либо\nпротив своей воли.<\/p>", "<p>Как сказали наши мудрецы (Авода Зара\n20а):<\/p>", "<p>«Разве разрешено смотреть?.. Это было\nна повороте дороги».<\/p>", "<p>А иногда человек смотрит по собственному\nжеланию, но ради определённой пользы,\nа не для созерцания запретного, как\nобъясняется в «Тур» и «Шулхан Арух»\n(Эвен а-Эзер, 21:3).<\/p>", "<p>Но если бы я по желанию своего сердца\nсмотрел на зло, тогда Всевышний не\nуслышал бы моей молитвы, в которой я\nпросил бы Его спасти меня от дурного\nначала.<\/p>", "<p>И Он ничем не помог бы мне, пока я\nпродолжал бы совершать этот грех —\nсмотреть на запретное.<\/p>", "<p>Ведь человек сам возбуждает против\nсебя дурное начало тем, что открывает\nсвои глаза для созерцания всякого зла.<\/p>", "<p>Чему это можно уподобить?<\/p>", "<p>Человеку, который разжигает огонь в\nсобственном доме и раздувает пламя,\nчтобы оно разгорелось ещё сильнее.<\/p>", "<p>При этом он кричит и просит других\nпожалеть его и поспешить потушить пожар.<\/p>", "<p>Он сам разжигает огонь и раздувает\nпламя, но желает, чтобы другие пришли и\nтрудились над его тушением.<\/p>", "<p>Разве такой человек не является\nглупцом, лишённым разума?<\/p>", "<p>То же самое происходит и здесь.<\/p>", "<p>Человек разжигает в глубинах своего\nсердца огонь страсти и вожделения\nпосредством своих глаз, которыми он\nсмотрит на зло.<\/p>", "<p>Тем самым он возбуждает против себя\nдурное начало.<\/p>", "<p>Ведь сказали наши мудрецы:<\/p>", "<p>«Дурное начало властвует лишь над\nтем, что видят глаза человека».<\/p>", "<p>И после этого он желает, чтобы Всевышний\nпотушил этот огонь и спас его от дурного\nначала?<\/p>", "<p>И тем более, если человек смотрит на\nженщин с вожделением (см. «Гей Хизайон»,\nглава 1, раздел 1), намереваясь получить\nудовольствие от их красоты, Всевышний\nне поможет ему раскаяться во всех его\nгрехах.<\/p>", "<p>Ведь в Торе прямо сказано (Дварим\n23:15):<\/p>", "<p>«Ибо Господь, Бог твой, ходит среди\nстана твоего, чтобы спасать тебя и\nпредавать врагов твоих в руки твои. И\nда будет стан твой свят, чтобы не увидел\nОн у тебя ничего непристойного и не\nотступил от тебя».<\/p>", "<p>И сказали наши мудрецы (Сифри, там же):<\/p>", "<p>«Это учит нас, что разврат удаляет\nБожественное присутствие».<\/p>", "<p>Следовательно, подобно тому как во\nвремя обычной войны, если Всевышний\nвидит среди людей непристойность, Он\nотступает от человека и не помогает\nему, так и во время войны с дурным началом.<\/p>", "<p>Если Всевышний увидит в человеке\nнепристойность, Он не поможет ему\nпобедить дурное начало.<\/p>", "<p>А если Святой, благословен Он, не\nпоможет человеку, тот падёт, побеждённый\nсвоим дурным началом.<\/p>", "<p>Ведь сказали наши мудрецы:<\/p>", "<p>«Если бы Святой, благословен Он, не\nпомогал человеку, тот не смог бы\nпротивостоять дурному началу».<\/p>", "<p>Поэтому каждый человек должен закрывать\nсвои глаза, чтобы не видеть зла, и тогда\nВсевышний поможет ему победить дурное\nначало.<\/p>", "<p>И в этом заключается смысл слов\nсладкозвучного певца Израиля, царя\nДавида (Теилим 25:15):<\/p>", "<p>«Глаза мои всегда обращены к Господу,\nибо Он извлечёт ноги мои из сети».<\/p>", "<p>«Глаза мои всегда» обращены к Господу.<\/p>", "<p>Как сказано:<\/p>", "<p>«Дай Мне, сын Мой, сердце твоё, и глаза\nтвои...» (см. главу 4).<\/p>", "<p>То есть мои глаза по моей собственной\nволе не смотрят ни на какое зло.<\/p>", "<p>И поэтому «Он извлечёт ноги мои из\nсети» — спасёт меня из сетей дурного\nначала.<\/p>", "<p>Ведь дурное начало расставляет сети\nперед ногами человека, стремясь поймать\nего посредством грехов, преступлений\nи злодеяний.<\/p>", "<p>(См. комментарий Ибн Эзры.)<\/p>", "<p>Человек не способен спастись от своего\nдурного начала, если Всевышний не поможет\nему.<\/p>", "<p>Но Всевышний не поможет ему спасти\nсвою душу из сетей дурного начала, если\nон сам не начнёт выбираться из этих\nсетей.<\/p>", "<p>А первый шаг к освобождению из сетей\nдурного начала — закрыть глаза, чтобы\nне видеть зла.<\/p>", "<p>Поэтому каждый человек, который\nстремится очиститься и вернуться ко\nВсевышнему, раскаявшись во всех своих\nгрехах, должен прежде всего очистить\nсвои глаза от созерцания зла.<\/p>", "<h1 class=\"western\" id=\"section-80\"><font size=\"4\">Тому,\nкто тщательно оберегает свои глаза,\nВсевышний обещает, что он не оступится<\/font><\/h1>", "<p>Наши мудрецы сказали («Мидраш Асерет\nа-Диброт», «Ялкут Шимони», Ваехи):<\/p>", "<p>«Пусть человек не гневит своего\nСоздателя и не огорчает Его своими\nдурными поступками.<\/p>", "<p>Пусть он не обращает своих помыслов\nк другой женщине и не смотрит на женщин.<\/p>", "<p>Ведь если человек стремится очиститься,\nему помогают с Небес.<\/p>", "<p>Сам Святой, благословен Он, приближается\nк нему, чтобы освятить его, и не позволяет\nдурному началу властвовать над ним.<\/p>", "<p>Однажды произошла история с рабби\nМатьей бен Харашем.<\/p>", "<p>Он сидел и преподавал Тору, и лицо его\nсияло, подобно солнцу, а облик его\nнапоминал служебных ангелов благодаря\nего страху перед Небесами.<\/p>", "<p>Ведь за всю свою жизнь он ни разу не\nподнимал глаз, чтобы посмотреть на\nженщину.<\/p>", "<p>Однажды он сидел в доме учения и\nзанимался Торой.<\/p>", "<p>Проходивший мимо Сатан увидел его и\nпозавидовал ему.<\/p>", "<p>Он сказал:<\/p>", "<p>— Разве возможно, чтобы такой человек\nникогда не согрешил?<\/p>", "<p>Что сделал Сатан?<\/p>", "<p>Он поднялся на Небеса, предстал перед\nСвятым, благословен Он, и сказал:<\/p>", "<p>— Владыка мира! Дай мне разрешение\nиспытать его.<\/p>", "<p>Всевышний ответил ему:<\/p>", "<p>— Иди.<\/p>", "<p>Сатан отправился к рабби Матье и нашёл\nего сидящим за изучением Торы.<\/p>", "<p>Что же он сделал?<\/p>", "<p>Он принял облик женщины необычайной\nкрасоты, подобной которой не было со\nвремён Наамы, сестры Туваль-Каина, из-за\nкоторой, согласно этому мидрашу, ошиблись\nдаже служебные ангелы.<\/p>", "<p>Как сказано (Берешит 6:2):<\/p>", "<p>«И увидели сыны Божьи дочерей\nчеловеческих, что они красивы...»<\/p>", "<p>И эта женщина предстала перед рабби\nМатьей.<\/p>", "<p>Увидев её, он отвернулся влево.<\/p>", "<p>Тогда она села слева от него.<\/p>", "<p>Он повернул лицо вправо.<\/p>", "<p>Но когда он увидел, что она перемещается\nвслед за ним, то сказал:<\/p>", "<p>— Я боюсь, как бы дурное начало не\nодолело меня и не привело к греху.<\/p>", "<p>Что же сделал этот праведник?<\/p>", "<p>Он сказал ученикам, сидевшим перед\nним:<\/p>", "<p>— Пойдите и принесите огонь и железные\nгвозди.<\/p>", "<p>Он положил гвозди в огонь, пока они не\nраскалились докрасна, и приложил их к\nсвоим глазам.<\/p>", "<p>Когда Сатан увидел это, он содрогнулся,\nупал лицом вниз и задрожал.<\/p>", "<p>Затем он поднялся на Небеса, вновь\nпредстал перед Святым, благословен Он,\nи рассказал Ему обо всём произошедшем.<\/p>", "<p>Святой, благословен Он, сказал ему:<\/p>", "<p>— Разве Я не говорил тебе, что ты не\nсможешь одолеть его?<\/p>", "<p>В тот же час Святой, благословен Он,\nпризвал ангела Рафаэля и сказал ему:<\/p>", "<p>— Иди и исцели глаза рабби Матьи бен\nХараша.<\/p>", "<p>Рафаэль пришёл к нему и сказал:<\/p>", "<p>— Святой, благословен Он, послал меня\nк тебе, чтобы исцелить твои глаза.<\/p>", "<p>Рабби Матья ответил:<\/p>", "<p>— Оставь меня. Что произошло, то\nпроизошло.<\/p>", "<p>Рафаэль вернулся к Святому, благословен\nОн, и сказал:<\/p>", "<p>— Владыка мира! Вот что он мне ответил.<\/p>", "<p>Тогда Всевышний сказал ему:<\/p>", "<p>— Иди и скажи ему, что дурное начало\nникогда больше не будет властвовать\nнад ним.<\/p>", "<p>И тотчас Рафаэль отправился и исцелил\nего.<\/p>", "<p>Отсюда мудрецы сказали:<\/p>", "<p>Всякий, кто не обращает своих глаз на\nчужую женщину, не подпадает под власть\nдурного начала.<\/p>", "<p>Поэтому человек должен остерегаться\nподнимать свои глаза на другую женщину,\nкроме собственной жены».<\/p>", "<h1 class=\"western\" id=\"section-81\"><font size=\"4\">Тяжесть\nгреха, связанного с созерцанием запретного<\/font><\/h1>", "<p>Разве не должен каждый человек\nиспытывать страх и трепет, когда поднимает\nсвои глаза, чтобы посмотреть на лицо\nженщины, если вспомнит о том, что сделал\nс собой рабби Матья бен Хараш?<\/p>", "<p>Ведь он приложил к своим векам\nраскалённые докрасна железные гвозди!<\/p>", "<p>И этим он причинил себе два страшных\nнесчастья.<\/p>", "<p>Во-первых, подверг себя чрезвычайно\nсильным и мучительным страданиям.<\/p>", "<p>Во-вторых, лишил себя зрения.<\/p>", "<p>А наши мудрецы сказали (Недарим 64б):<\/p>", "<p>«Слепой считается подобным мёртвому».<\/p>", "<p>Как сказано (Эйха 3:6):<\/p>", "<p>«В местах тёмных поселил Он меня,\nсловно умерших издревле».<\/p>", "<p>Ведь Тора запрещает человеку причинять\nсамому себе страдания и телесные\nповреждения (см. Бава Кама 91б).<\/p>", "<p>Однако он подверг себя страданиям и\nнанёс себе увечье, чтобы отдалиться от\nзапретного и избежать греха.<\/p>", "<p>(См. Гитин 57б и Тосафот, начинающийся\nсловами «Кафцу»; Авода Зара 18а и Тосафот,\nначинающийся словами «Ве-аль».)<\/p>", "<p>Ведь он боялся, что дурное начало\nодолеет его и побудит поднять глаза,\nчтобы посмотреть на эту женщину, и что,\nувидев её, он начнёт испытывать к ней\nвожделение в своих мыслях.<\/p>", "<p>А если так, то как может человек,\nкоторый, по словам Писания (Иов 15:16),\n«пьёт беззаконие, как воду», то есть\nпривык постоянно совершать грехи,\nподнимать свои глаза, чтобы смотреть\nна женщину, и при этом говорить:<\/p>", "<p>«Я буду в безопасности от дурного\nначала, и никакой грех со мной не\nслучится»?<\/p>", "<h1 class=\"western\" id=\"section-82\"><font size=\"4\">Запретный\nвзгляд влечёт за собой тяжкие грехи<\/font><\/h1>", "<p>Задумаемся над следующим.<\/p>", "<p>Ведь даже один взгляд на лицо женщины\nс запретным намерением является серьёзным\nгрехом, поскольку этим человек нарушает\nзаповедь Всевышнего, данную в Торе\n(Дварим 23:10):<\/p>", "<p>«И берегись всякого дурного дела».<\/p>", "<p>(См. главу 2.)<\/p>", "<p>Поэтому, помимо того что человеку по\nсамой его природе свойственно испытывать\nвожделение в мыслях, когда он видит\nкрасивую женщину, существует ещё одна\nпричина, по которой такой взгляд приводит\nк дальнейшему греху.<\/p>", "<p>Само преступление, совершённое им при\nнарушении заповеди Всевышнего посредством\nзапретного взгляда, влечёт его к\nследующему преступлению — греховному\nвожделению в мыслях.<\/p>", "<p>Как сказано в Мишне (Пиркей Авот 4:2;\nсм. также комментарий «Толдот Йеошуа»\nрабби Йеошуа Геллера, благословенна\nпамять праведника):<\/p>", "<p>Бен Азай говорил:<\/p>", "<p>«Спеши исполнить даже лёгкую заповедь\nи убегай от греха, ибо одна заповедь\nвлечёт за собой другую заповедь, а один\nгрех влечёт за собой другой грех. Ведь\nнаграда за заповедь — заповедь, а\nвоздаяние за грех — грех».<\/p>", "<p>И в этом заключается смысл слов Писания\n(Мишлей 5:22):   «Беззакония его поймают\nнечестивца, и путами греха своего он\nбудет связан».<\/p>", "<p>«Беззакония его» — то есть грехи\nсамого человека.<\/p>", "<p>Ведь этот стих следует за словами:<\/p>", "<p>«Ибо перед глазами Господа все пути\nчеловека...»<\/p>", "<p>Поэтому не сказано просто «его\nбеззакония поймают нечестивца» или\n«беззакония нечестивца поймают его».<\/p>", "<p>(См. комментарий Ральбага.)<\/p>", "<p>Смысл заключается в том, что собственные\nбеззакония человека «поймают его»,\nпобуждая совершать новые преступления,\n«вместе с нечестивцем», то есть вместе\nс известным нечестивцем — дурным\nначалом, которое также называется\nнечестивцем.<\/p>", "<p>Как сказано:  «Нечестивец подстерегает\nправедника...»<\/p>", "<p>Иными словами, совершённые человеком\nгрехи вместе с дурным началом ловят его\nв свои сети, чтобы побудить к новым\nпреступлениям.<\/p>", "<p>И не только преступления, совершённые\nсознательно и намеренно, могут поймать\nчеловека.<\/p>", "<p>Даже «путами греха своего», то есть\nгреха, совершённого по ошибке, он может\nоказаться связанным.<\/p>", "<p>Более того, не только многочисленные\nгрехи и преступления способны поймать\nчеловека в свои сети.<\/p>", "<p>Даже один-единственный грех, совершённый\nпо ошибке, может связать его своими\nпутами.<\/p>", "<p>И не только к совершению новых грехов\nможет привести человека одно случайное\nпрегрешение.<\/p>", "<p>Сказано также:<\/p>", "<p>«И путами греха своего он будет связан»,\nто есть словно подвешен на этих путах.\n  (См. комментарий Раши.)<\/p>", "<p>Это означает, что даже один грех,\nсовершённый по ошибке, обладает силой\nдуховно погубить человека, пусть даже\nон был праведником, и превратить его в\nзаконченного нечестивца, который\nназывается мёртвым.<\/p>", "<p>Как сказали наши мудрецы (Брахот 18б):\n «Нечестивцы даже при жизни называются\nмёртвыми».<\/p>", "<h1 class=\"western\" id=\"section-83\"><font size=\"4\">Грех,\nсовершённый по ошибке, открывает путь\nк умышленным преступлениям<\/font><\/h1>", "<p>И в этом заключается смысл слов\nВсевышнего, обращённых к Каину (Берешит\n4:7):<\/p>", "<p>«Ведь если будешь поступать хорошо —\nбудешь возвышен, а если не будешь\nпоступать хорошо — у входа грех лежит...»<\/p>", "<p>«Ведь если будешь поступать хорошо»\n— если ты начнёшь совершать добро, пусть\nдаже исполнишь всего одну заповедь,\nтогда «будешь возвышен», то есть\nподнимешься на более высокую духовную\nступень.<\/p>", "<p>Как сказали наши мудрецы (Сифри, Шлах):<\/p>", "<p>«Тот, кто исполнил одну заповедь ради\nнеё самой, пусть радуется не только этой\nзаповеди, но и тому, что впоследствии\nона повлечёт за собой множество других\nзаповедей».<\/p>", "<p>«А если не будешь поступать хорошо»,\nтогда «у входа грех лежит».<\/p>", "<p>То есть первый совершённый грех\nоткрывает дверь всем последующим грехам,\nбеззакониям и преступлениям.<\/p>", "<p>Как сказали наши мудрецы (Танхума,\nВаикра):<\/p>", "<p>«Пусть человек огорчается не только\nиз-за греха, который он совершил по\nошибке, но и потому, что этим он открыл\nсебе путь к совершению грехов даже\nумышленно.<\/p>", "<p>Поэтому, если человек согрешил по\nошибке, это дурной знак для него.<\/p>", "<p>Как сказано (Мишлей 19:2):<\/p>", "<p>\"И душа без знания — нехорошо\".<\/p>", "<p>И если совершение греха по ошибке\nявляется дурным знаком для человека,\nто тем более — совершение греха\nумышленно».<\/p>", "<p>И сказали наши мудрецы (Калла Раббати,\nглава 4):<\/p>", "<p>«Отступай даже от лёгкого греха,\nопасаясь, что он приведёт тебя к тяжёлому».<\/p>", "<p>Но ведь мы уже учили в Мишне (Пиркей\nАвот 4:2), что Бен Азай говорил:<\/p>", "<p>«Спеши исполнить даже лёгкую заповедь\nи убегай от греха».<\/p>", "<p>В чём же заключается новое наставление?<\/p>", "<p>Там речь идёт о грехе, который человек\nсовершает по собственному желанию, а\nздесь добавляется, что следует остерегаться\nдаже греха, который может произойти\nпротив его воли, вследствие обстоятельств,\nне зависящих от него.<\/p>", "<p>Именно поэтому сказано: «Отступай от\nгреха».<\/p>", "<h1 class=\"western\" id=\"section-84\"><font size=\"4\">Один\nгрех приводит к многочисленным\nпреступлениям<\/font><\/h1>", "<p>На основании этих слов автор книги\n«Лехем Димъа» объясняет стих (Эйха 1:8):\n «Тяжко согрешил Иерусалим, поэтому\nстал он нечистым...»<\/p>", "<p>Разве из-за одного греха, совершённого\nпо ошибке, Иерусалим стал нечистым и\nбыл обречён скитаться по земле?<\/p>", "<p>Ведь написано (Эйха 1:5):  «Ибо Господь\nподверг его страданиям за множество\nпреступлений его».<\/p>", "<p>Кроме того, наши мудрецы сказали (Йома\n36б):<\/p>", "<p>«Беззакония — это умышленные грехи;\nпреступления — это сознательный бунт\nпротив Всевышнего; грехи — это проступки,\nсовершённые по ошибке».<\/p>", "<p>Почему же здесь написано «согрешил\nИерусалим», словно речь идёт об одном\nгрехе, совершённом по ошибке?<\/p>", "<p>Однако причина заключается в том, что\n«у входа грех лежит».<\/p>", "<p>Вначале человек совершает один грех\nпо ошибке или какое-либо лёгкое\nпреступление.<\/p>", "<p>Но затем один грех влечёт за собой\nдругой.<\/p>", "<p>От неумышленного греха человек\nпереходит к умышленному, от умышленного\n— к сознательному бунту против Всевышнего,\nот лёгкого преступления — к тяжёлому.<\/p>", "<p>И так постепенно умножаются его грехи,\nбеззакония и преступления.<\/p>", "<p>Что же стало причиной всех многочисленных\nи тяжких преступлений Иерусалима?<\/p>", "<p>Что привело ко всем наказаниям,\nпостигшим его за множество преступлений?<\/p>", "<p>Разве не тот первый грех, который\nсовершил Иерусалим?<\/p>", "<p>Поэтому и сказано:<\/p>", "<p>«Тяжко согрешил Иерусалим, поэтому\nстал он нечистым».<\/p>", "<p>Ведь один грех, совершённый им вначале,\nстал причиной всех последующих бедствий\nи страданий.<\/p>", "<h1 class=\"western\" id=\"section-85\"><font size=\"4\">Оберегающий\nсвои глаза удостаивается исполнения\nзаповедей, духовного возвышения и\nсвятости<\/font><\/h1>", "<p>Поэтому каждый человек должен опасаться\nсмотреть на лицо женщины с запретным\nнамерением, чтобы, увидев её, не начать\nиспытывать к ней вожделение в своих\nмыслях.<\/p>", "<p>Ведь эти грехи могут поймать его в\nсвои сети и привести к ещё более\nмногочисленным умышленным преступлениям.<\/p>", "<p>И тогда он будет опускаться всё ниже\nи ниже, переходя от одного греха к\nдругому.<\/p>", "<p>Но когда человек закрывает свои глаза,\nчтобы не смотреть на женщину с запретным\nнамерением, он соблюдает повеление\nВсевышнего и исполняет заповедь.<\/p>", "<p>Как сказали наши мудрецы (Кидушин\n39б):  «Если человек воздержался от\nсовершения греха, ему дают награду,\nсловно он исполнил заповедь».<\/p>", "<p>А одна заповедь влечёт за собой другую\nзаповедь.<\/p>", "<p>И человек начинает подниматься по\nпути жизни, переходя от одной заповеди\nк другой, всё выше и выше.<\/p>", "<p>И сказали наши мудрецы (Йома 39а):<\/p>", "<p>Написано (Ваикра 11:43): «И не оскверняйте\nсебя ими, чтобы не стать нечистыми через\nних».<\/p>", "<p>Если человек немного оскверняет себя,\nего оскверняют ещё сильнее.<\/p>", "<p>Если он оскверняет себя внизу, его\nоскверняют свыше.<\/p>", "<p>Если он оскверняет себя в этом мире,\nего оскверняют и в Мире грядущем.<\/p>", "<p>А также написано (Ваикра 11:44): «И\nосвящайте себя, и будьте святы».<\/p>", "<p>Если человек немного освящает себя,\nего освящают ещё сильнее.<\/p>", "<p>Если он освящает себя внизу, его\nосвящают свыше.  Если он освящает себя\nв этом мире, его освящают и для Мира\nгрядущего.<\/p>"]}, {"title": "МАХАЗЕ VII", "body": ["<h2 class=\"western\" id=\"section-86\"><font size=\"6\">МАХАЗЕ\nVII<\/font><\/h2>", "<h1 class=\"western\" id=\"section-87\"><font size=\"4\">Достоинство\nчеловека, оберегающего свои глаза даже\nв опасном месте, и тяжесть греха посещения\nмест распущенности, даже если он закрывает\nглаза<\/font><\/h1>", "<h1 class=\"western\" id=\"section-88\"><font size=\"4\">Благочестивый\nчеловек оберегает свои глаза даже в\nопасном месте<\/font><\/h1>", "<p>Пророк Йешаяу сказал по Божественному\nвдохновению (Йешаяу 33:15–17):<\/p>", "<p>«Тот, кто ходит путями праведности и\nговорит правду, отвергает прибыль от\nпритеснения, отряхивает руки свои, чтобы\nне принимать взяток, затыкает уши свои,\nчтобы не слышать о кровопролитии, и\nзакрывает глаза свои, чтобы не видеть\nзла.<\/p>", "<p>Он будет обитать на высотах, скалистые\nкрепости будут его убежищем; хлеб его\nбудет дан ему, и вода его будет надёжна.<\/p>", "<p>Царя в красоте его увидят глаза твои,\nувидят землю далёкую».<\/p>", "<p>И сказали наши мудрецы (Бава Батра\n57б; см. также Макот 24а и комментарий\nМаарша):<\/p>", "<p>«Закрывает глаза свои, чтобы не видеть\nзла».<\/p>", "<p>Рабби Хия бар Абба сказал:<\/p>", "<p>«Это человек, который не смотрит на\nженщин, когда они занимаются стиркой\nбелья».<\/p>", "<p>О каком случае идёт речь?<\/p>", "<p>Если существует другая дорога, то он\nнечестивец.<\/p>", "<p>А если другой дороги нет, то он вынужден\nидти этим путём.<\/p>", "<p>Следовательно, речь идёт о случае,\nкогда другой дороги нет, но даже тогда\nчеловек должен принудить себя не\nсмотреть.<\/p>", "<p>Представляется, что наши мудрецы\nстолкнулись здесь с двумя затруднениями.<\/p>", "<p>Во-первых, в чём заключается особое\nдостоинство человека, который «закрывает\nглаза свои, чтобы не видеть зла»?<\/p>", "<p>Ведь он обязан поступать так по закону\nТоры, как сказано (Дварим 23:10):<\/p>", "<p>«И берегись всякого дурного дела».<\/p>", "<p>(См. Авода Зара 20б, Тосафот, начинающийся\nсловами «Шело», и Хулин 37б, Тосафот,\nначинающийся словами «Шело».)<\/p>", "<p>Во-вторых, почему в стихе сказано\n«чтобы не видеть во зле» — бе-ра, с\nдополнительной буквой «бет»?<\/p>", "<p>Ведь следовало бы сказать просто\n«чтобы не видеть зла».<\/p>", "<p>Поэтому наши мудрецы истолковали эти\nслова следующим образом.<\/p>", "<p>«Закрывает глаза свои, чтобы не видеть»\nтого, на что Тора запрещает смотреть,\nдаже тогда, когда он находится «во зле»,\nто есть в опасном месте.<\/p>", "<p>Например, когда человек идёт по берегу\nреки или переправляется через реку на\nлодке и выходит из неё на берег, где\nженщины занимаются стиркой белья.<\/p>", "<h1 class=\"western\" id=\"section-89\"><font size=\"4\">Тот,\nкто проявляет благочестие ценой опасности\nдля других, — неразумный благочестивец<\/font><\/h1>", "<p>Поэтому вполне обоснован вопрос\nГемары:<\/p>", "<p>«О каком случае идёт речь? Если\nсуществует другая дорога, то он\nнечестивец».<\/p>", "<p>Даже если он закрывает глаза, он\nсчитается нечестивцем, поскольку\nподвергает себя опасности, идя с закрытыми\nглазами по берегу реки.<\/p>", "<p>Он не оберегает свою жизнь от возможного\nнесчастья.<\/p>", "<p>Почему же он не пошёл другой дорогой,\nгде мог бы держать глаза открытыми?<\/p>", "<p>«А если другой дороги нет, то он вынужден\nидти этим путём».<\/p>", "<p>Ведь человек обязан оберегать свою\nжизнь, открывать глаза и смотреть, куда\nступает, идя по берегу реки.<\/p>", "<p>В опасном месте он вынужден держать\nглаза открытыми.<\/p>", "<p>А если он всё-таки закрывает их, разве\nне является он неразумным благочестивцем?<\/p>", "<p>Ведь наши мудрецы сказали (Сота 21б):<\/p>", "<p>«Кто такой неразумный благочестивец?<\/p>", "<p>Например, человек видит, что женщина\nтонет в реке, и говорит: \"Неприлично\nмне смотреть на неё, чтобы спасти её\"».<\/p>", "<p>Поэтому Гемара отвечает:<\/p>", "<p>«Речь идёт о случае, когда другой\nдороги нет, но даже тогда человек должен\nпринудить себя не смотреть».<\/p>", "<p>То есть он поступает так из благочестия,\nхотя находится в опасном месте.<\/p>", "<p>Ведь когда человек считается неразумным\nблагочестивцем?<\/p>", "<p>Когда он проявляет подобное благочестие\nв ущерб другим людям.<\/p>", "<p>Если он не спасает женщину от опасности\nиз-за своего чрезмерного благочестия,\nтогда он действительно неразумный\nблагочестивец.<\/p>", "<p>Но в отношении собственной жизни\nчеловек вправе принять на себя более\nстрогое ограничение, и в этом случае он\nявляется разумным благочестивцем.<\/p>", "<h1 class=\"western\" id=\"section-90\"><font size=\"4\">Тот,\nкто подвергает себя опасности ради\nНебес, — разумный благочестивец<\/font><\/h1>", "<p>Вспомним историю рабби Матьи бен\nХараша, который приложил к своим глазам\nраскалённые гвозди, поскольку боялся\nпосмотреть на лицо женщины.<\/p>", "<p>(«Ялкут Шимони», Ваехи; см. конец главы\n6.)<\/p>", "<p>А рав Йосеф и рав Шешет лишили себя\nзрения, как объясняется в «Тшувот\nа-Геоним» (Шаарей Тшува, 178; «Гей Хизайон»,\nглава 1, раздел 3), чтобы на протяжении\nвсей жизни не видеть зла.<\/p>", "<p>Разве их не восхваляют за эти поступки?<\/p>", "<p>Общее правило заключается в следующем.<\/p>", "<p>Всякий, кто ради собственного благочестия\nне щадит жизнь, честь или имущество\nдругих людей, является неразумным\nблагочестивцем.<\/p>", "<p>Он разрушает мир подобно хитрому\nнечестивцу (см. Сота 20а).<\/p>", "<p>Но тот, кто ради своего благочестия\nне щадит собственную жизнь, честь или\nимущество, является разумным благочестивцем\n— при условии, что такое поведение\nдействительно соответствует благочестию\nсогласно Торе и заповедям.<\/p>", "<h1 class=\"western\" id=\"section-91\"><font size=\"4\">Достоинство\nдовольства малым относится только к\nсамому человеку<\/font><\/h1>", "<p>На основании этого правила можно\nпрекрасно объяснить слова наших мудрецов\n(Пиркей Авот 6:4):<\/p>", "<p>«Таков путь Торы: хлеб с солью ешь,\nводу пей в меру, на земле спи, жизнью\nлишений живи и над Торой трудись.<\/p>", "<p>И если ты поступаешь так, счастлив ты,\nи благо тебе.<\/p>", "<p>Счастлив ты в этом мире, и благо тебе\nв Мире грядущем».<\/p>", "<p>Многие уже обращали внимание на то,\nчто слова «и если ты поступаешь так»\nкажутся излишними.<\/p>", "<p>Однако можно объяснить, что наши\nмудрецы специально добавили эти слова,\nчтобы устранить ошибочное представление,\nкоторое могло бы возникнуть у многих\nлюдей.<\/p>", "<p>Услышав наставление «Таков путь\nТоры...», они могли бы проявить чрезмерное\nблагочестие, стремясь исполнить его не\nпо отношению к себе, а по отношению к\nдругим.<\/p>", "<p>Они стали бы давать изучающим Тору\nлишь хлеб с солью и немного воды, отказывая\nим в мясе, вине и другой пище и напитках.<\/p>", "<p>И оправдывали бы это словами:<\/p>", "<p>«Ведь таков путь Торы: хлеб с солью\nешь и воду пей в меру».<\/p>", "<p>Они не предоставляли бы им кроватей,\nподушек и одеял, говоря:<\/p>", "<p>«Ведь таков путь Торы: на земле спи».<\/p>", "<p>И не давали бы им одежды, утверждая:<\/p>", "<p>«Ведь таков путь Торы: жизнью лишений\nживи».<\/p>", "<p>Поэтому наши мудрецы тщательно\nподобрали слова и сказали:<\/p>", "<p>«И если ты поступаешь так, счастлив\nты, и благо тебе».<\/p>", "<p>Именно ты сам, по отношению к самому\nсебе.<\/p>", "<p>Тогда счастлив ты, и благо тебе.<\/p>", "<p>Но не тогда, когда ты поступаешь\nподобным образом по отношению к другим\nлюдям.<\/p>", "<p>Ибо в таком случае — горе тебе и горе\nтвоей душе.<\/p>", "<h1 class=\"western\" id=\"section-92\"><font size=\"4\">Достоинство\nупования на Всевышнего — только в\nотношении самого себя<\/font><\/h1>", "<p>Рассмотрим также вопрос упования на\nВсевышнего.<\/p>", "<p>Как велико достоинство упования! Ведь\nдаже если нечестивец уповает на\nВсевышнего, Он поможет ему и не оставит\nего.<\/p>", "<p>Как сказали наши мудрецы («Ялкут\nШимони», Теилим 32):<\/p>", "<p>«Много страданий у нечестивца, но\nуповающего на Господа окружает милость»\n(Теилим 32:10).<\/p>", "<p>Даже если человек нечестивец, но\nуповает на Всевышнего, милость окружает\nего.<\/p>", "<p>И насколько дурным качеством является\nчрезмерное беспокойство!<\/p>", "<p>Общее правило таково: чем больше\nчеловек уповает на Всевышнего и чем\nменьше предаётся тревогам, тем большей\nпохвалы он достоин.<\/p>", "<p>Однако это относится лишь к делам,\nкасающимся самого человека, но не к\nделам, затрагивающим других людей.<\/p>", "<p>Если к человеку придёт кто-либо,\nрасскажет ему о своих тревогах, бедах\nи страданиях и попросит помочь ему и\nизбавить от бедственного положения, а\nтот подумает:<\/p>", "<p>«Зачем мне беспокоиться о нём? Зачем\nприлагать усилия ради его благополучия?\nВедь я всем сердцем уповаю на Всевышнего\nи с полной верой убеждён, что Он поможет\nэтому человеку и не оставит его».<\/p>", "<p>Такой человек — глупец и негодяй.<\/p>", "<p>И в этом заключается смысл слов\nсладкозвучного певца Израиля, царя\nДавида (Теилим 37:3): \n<\/p>", "<p>«Уповай на Господа и делай добро...»<\/p>", "<p>«Уповай на Господа» — во всём, что\nкасается тебя самого.<\/p>", "<p>«И делай добро» — другим людям,\nнасколько позволяют твои возможности.<\/p>", "<p>Но не проявляй упования вместо помощи\nдругим в делах, которые касаются их.<\/p>", "<h1 class=\"western\" id=\"section-93\"><font size=\"4\">Достоинство\nсмирения — только в отношении самого\nсебя<\/font><\/h1>", "<p>Рассмотрим также качество смирения.<\/p>", "<p>Как велико достоинство смирения!<\/p>", "<p>Чем глубже человек осознаёт собственную\nничтожность, понимая, что он сам по себе\nничто, что жизнь его подобна дуновению,\nчто начало его — зловонная капля, а\nконец — черви, тем большей похвалы он\nдостоин.<\/p>", "<p>Однако обо всём этом человек должен\nразмышлять применительно к самому себе.<\/p>", "<p>Пусть он будет малым и ничтожным в\nсобственных глазах (выражение из «Тана\nдевей Элияу Рабба», глава 15).<\/p>", "<p>Пусть считает себя прахом и пеплом,\nкак сказал наш праотец Авраам (Берешит\n18:27):<\/p>", "<p>«А я — прах и пепел».<\/p>", "<p>Пусть считает себя червём, как сказал\nДавид (Теилим 22:7):<\/p>", "<p>«А я — червь, а не человек».<\/p>", "<p>И пусть считает себя ничем, как сказали\nМоше и Аарон (Шмот 16:7):<\/p>", "<p>«А мы — что мы такое?»<\/p>", "<p>Поэтому человек должен прощать\nнанесённые ему оскорбления (Пиркей Авот\n6:1) и избегать почестей.<\/p>", "<p>Но ни в коем случае нельзя так думать\nо других людях!<\/p>", "<p>Нельзя рассуждать следующим образом:<\/p>", "<p>«Все люди — лишь прах и пепел, подобны\nчервям и ничего собой не представляют.\nПоэтому, если я унижаю людей, в этом нет\nгреха, как нет греха в том, чтобы унижать\nпрах и пепел.<\/p>", "<p>А если я ударю человека, это подобно\nтому, как наступить на червя.<\/p>", "<p>И если я заставлю его покраснеть от\nстыда, в этом нет греха.<\/p>", "<p>Ведь кого я унизил?<\/p>", "<p>Комок праха!<\/p>", "<p>Человека, который, согласно словам\nнаших мудрецов (Сота 5а), представляет\nсобой \"прах, кровь и желчь\".<\/p>", "<p>Плоть, которая есть \"стыд, зловоние\nи черви\" (там же)».<\/p>", "<p>Ни в коем случае нельзя так думать о\nдругих!<\/p>", "<p>Всякий, кто рассуждает подобным\nобразом, — нечестивец и негодяй, человек,\nотвратительный в глазах Бога и людей.<\/p>", "<p>И пусть каждый человек помнит и никогда\nне забывает слова наших мудрецов (Пиркей\nАвот 3:14):<\/p>", "<p>«Дорог человек, ибо он создан по образу\nБожьему. Особая любовь проявлена к нему\nтем, что ему было открыто, что он создан\nпо образу Божьему».<\/p>", "<p>Как сказано (Берешит 9:6):<\/p>", "<p>«Ибо по образу Божьему создал Он\nчеловека».<\/p>", "<p>«Дороги сыны Израиля, ибо они названы\nдетьми Всевышнего. Особая любовь\nпроявлена к ним тем, что им было открыто,\nчто они названы детьми Всевышнего».<\/p>", "<p>Как сказано (Дварим 14:1):<\/p>", "<p>«Сыны вы Господу, Богу вашему».<\/p>", "<p>И сказали наши мудрецы (Санhedрин 58б):<\/p>", "<p>«Тот, кто ударяет израильтянина по\nщеке, словно ударяет по лику Божественного\nприсутствия».<\/p>", "<p>Как сказано (Мишлей 20:25):<\/p>", "<p>«Ловушка для человека — посягать на\nсвятыню».<\/p>", "<p>И сказали наши мудрецы (Пиркей Авот\n3; Бава Меция 58б):<\/p>", "<p>«Тот, кто публично заставляет своего\nближнего покраснеть от стыда, даже если\nобладает знанием Торы и добрыми делами,\nне имеет доли в Мире грядущем».<\/p>", "<p>Ведь чрезвычайно велико достоинство\nкаждого еврея, поскольку сыны Израиля\n— дети Всевышнего, дети Царя царей,\nСвятого, благословен Он.<\/p>", "<p>И велико достоинство каждого человека,\nпоскольку он создан по образу Божьему.<\/p>", "<h1 class=\"western\" id=\"section-94\"><font size=\"4\">Судить\nблагосклонно — только других людей<\/font><\/h1>", "<p>Рассмотрим также обязанность судить\nдругих людей благосклонно.<\/p>", "<p>Как велико достоинство этого качества!<\/p>", "<p>Наши мудрецы сказали (Шаббат 127б):<\/p>", "<p>«Того, кто судит других благосклонно,\nи на Небесах судят благосклонно».<\/p>", "<p>И такой человек «вкушает плоды своей\nзаслуги в этом мире, а основная награда\nсохраняется для него в Мире грядущем»\n(там же).<\/p>", "<p>Однако это относится лишь к тому, кто\nблагосклонно судит других людей, но не\nк тому, кто оправдывает самого себя.<\/p>", "<p>Ведь о каждом, кто оправдывает самого\nсебя, сказано (Ирмияу 2:35):<\/p>", "<p>«Вот, Я буду судиться с тобой за то,\nчто ты говоришь: \"Я не согрешил\"».<\/p>", "<h1 class=\"western\" id=\"section-95\"><font size=\"4\">Следует\nразличать своё поведение по отношению\nк себе и к другим людям<\/font><\/h1>", "<p>Итак, если человек по отношению к\nсамому себе следует пути Торы, ест хлеб\nс солью и пьёт воду в меру, а другим людям\nпредоставляет изысканные угощения, то\nпоступает правильно.<\/p>", "<p>Но если он сам наслаждается деликатесами,\nа других заставляет жить в лишениях,\nссылаясь на путь Торы, то поступает\nнесправедливо.<\/p>", "<p>Если в собственных делах он уповает\nна Всевышнего, не предаётся тревогам и\nне прилагает чрезмерных усилий, а о\nдругих людях заботится и усердно\nстарается им помочь, то поступает\nправильно.<\/p>", "<p>Но если ради самого себя он постоянно\nтревожится, прилагает чрезмерные усилия\nи не уповает на Всевышнего, либо, когда\nдело касается других, ограничивается\nупованием на Всевышнего, не беспокоясь\nо них и не предпринимая никаких усилий\nради их благополучия, то поступает\nнесправедливо.<\/p>", "<p>Если человек принижает самого себя и\nвозвышает других, то поступает правильно.<\/p>", "<p>Но если он возвышает самого себя или\nунижает других людей, то поступает\nнесправедливо.<\/p>", "<p>Если человек судит других благосклонно,\nно не оправдывает самого себя, то\nпоступает правильно.<\/p>", "<p>Но если он оправдывает самого себя\nили не желает судить других благосклонно,\nто поступает несправедливо.<\/p>", "<p>И в этом заключается смысл слов\nмудрейшего из людей, царя Шломо (Мишлей\n21:8):<\/p>", "<p>«Извилист путь человека и чужого, а\nчистый — прям в своих поступках».<\/p>", "<p>«Извилист» — то есть каждый человек\nдолжен изменять и различать свои пути\nи качества в зависимости от обстоятельств.<\/p>", "<p>«Путь человека» — это его поведение\nи качества по отношению к самому себе.<\/p>", "<p>«И чужого» — это путь и качества,\nкоторые он должен проявлять по отношению\nк другому человеку.<\/p>", "<p>«А чистый — прям в своих поступках».<\/p>", "<p>То есть человек с чистым разумом умеет\nпоступать правильно и знает, как ему\nследует вести себя по отношению к самому\nсебе и как — по отношению к другим людям.<\/p>", "<h1 class=\"western\" id=\"section-96\"><font size=\"4\">Даже\nв опасном месте закрывать глаза —\nпроявление благочестия<\/font><\/h1>", "<p>После всего сказанного, основанного\nна истине и справедливости, становятся\nсовершенно понятными слова наших\nмудрецов:<\/p>", "<p>«Речь идёт о случае, когда другой\nдороги нет, но даже тогда человек должен\nпринудить себя не смотреть».<\/p>", "<p>Даже если это сопряжено с опасностью\nдля его жизни, тот, кто желает быть\nблагочестивым, должен, согласно этому\nобъяснению, подвергнуть себя опасности\nи закрыть глаза, чтобы не смотреть на\nженщин, занимающихся стиркой белья.<\/p>", "<p>И это несмотря на то, что во время\nстирки женщины бывают испачканными и\nгрязными.<\/p>", "<p>Тем более это относится к женщинам,\nукрашенным драгоценностями и нарядами.<\/p>", "<p>И если даже на берегу реки, в опасном\nместе, когда человек просто идёт своей\nдорогой и занят своими делами, проявлением\nблагочестия считается закрывать глаза,\nчтобы не смотреть на женщин, то тем более\nв месте, где нет никакой опасности,\nкаждый человек обязан закрывать глаза\nот созерцания женщин.<\/p>", "<h1 class=\"western\" id=\"section-97\"><font size=\"4\">Тот,\nкто отправляется в место распущенности,\nназывается нечестивцем<\/font><\/h1>", "<p>Рашбам пишет:<\/p>", "<p>«Если существует другая дорога, то он\nнечестивец, даже если закрывает глаза,\nпоскольку ему следовало не приближаться\nк греху, а отдаляться от него, ведь мы\nпридерживаемся правила: \"Отдаляйся\nот всего непристойного\"».<\/p>", "<p>И если даже человек, закрывающий глаза,\nсчитается нечестивцем, то тем более\nнечестивцем является тот, кто не закрывает\nглаза, хотя и не намеревается любоваться\nженской красотой.<\/p>", "<p>И уж тем более тот, кто намеренно\nсмотрит на женщин, является нечестивцем,\nзлонамеренным человеком и негодяем.<\/p>", "<p>Всё это служит открытым обличением\nтех, кто отправляется на лесные гулянья,\nгде собираются вместе мужчины и женщины,\nюноши и девушки, и называют подобные\nсобрания «вечерами любви».<\/p>", "<p>Все приходят туда в роскошных одеждах,\nукрашенные драгоценностями, и главная\nцель их — услаждать свои глаза созерцанием\nзапретного.<\/p>", "<p>Ведь они сами открыто говорят, нисколько\nне стесняясь, что если назначить время\nдля отдельного собрания мужчин и\nотдельного собрания женщин, юношей\nотдельно и девушек отдельно, то они\nвовсе не придут.<\/p>", "<p>Такие люди называются нечестивцами.<\/p>", "<p>И они называются прелюбодеями.<\/p>", "<p>Ведь наши мудрецы сказали (Ваикра\nРабба, глава 23):<\/p>", "<p>«Не думай, что прелюбодеем называется\nлишь тот, кто совершает прелюбодеяние\nсвоим телом. Даже тот, кто прелюбодействует\nглазами, называется прелюбодеем».<\/p>", "<p>Как сказано (Иов 24:15):<\/p>", "<p>«И глаз прелюбодея ожидает сумерек...»<\/p>", "<p>И такой прелюбодей сидит и ждёт:<\/p>", "<p>«Когда же наступят сумерки? Когда\nпридёт вечер?»<\/p>", "<p>Как сказано (Мишлей 7:9):<\/p>", "<p>«В сумерках, вечером дня».<\/p>", "<p>Иными словами, этот прелюбодей не\nтолько грешит в тот момент, когда\nсовершает запретное действие.<\/p>", "<p>На протяжении всего дня он погружён\nв греховные замыслы.<\/p>", "<p>Все мысли и стремления его сердца\nсводятся к одному:<\/p>", "<p>«Когда же наступит вечер? Когда? Когда?»<\/p>", "<p>И душа его изнемогает от силы вожделения.<\/p>", "<p>Ведь наши мудрецы сказали (Санhedрин\n107а; Сукка 52б):<\/p>", "<p>«Есть в человеке маленький орган: если\nнасыщать его, он остаётся голодным, а\nесли держать его в голоде, он насыщается».<\/p>", "<p>И такой человек на протяжении всего\nдня грешит запретными мыслями, разрушая\nэтим своё тело и губя свою душу.<\/p>", "<p>То же самое происходит с участниками\n«вечеров любви».<\/p>", "<p>Они назначают подобное собрание один\nраз в год.<\/p>", "<p>А те, кто особенно усердствует,\nустраивают его раз в полгода.<\/p>", "<p>И самые усердные из усердных — раз в\nтри месяца.<\/p>", "<p>Все остальные дни они проводят в тоске\nи унынии, с изнывающим сердцем, думая:<\/p>", "<p>«Когда же наступит тот день, когда я\nвновь увижу ту женщину, которую видел\nтогда, прекрасную, одетую в великолепные\nрасшитые одежды?<\/p>", "<p>Когда же я снова смогу посмотреть на\nеё лицо?<\/p>", "<p>Когда? Когда?» Увы!<\/p>", "<p>Они разрушают своё тело, ослабляют\nсвои силы и разум и губят собственную\nдушу. Увы!<\/p>", "<p>Это вожделение лишает человека и этого\nмира, и Мира грядущего.<\/p>", "<h1 class=\"western\" id=\"section-98\"><font size=\"4\">Даже\nесли там занимаются благотворительностью\nи исполняют заповеди, их намерения дурны<\/font><\/h1>", "<p>А когда во время подобных собраний\nони собирают пожертвования на\nблаготворительные цели, к ним относятся\nслова Писания (Йешаяу 5:7):<\/p>", "<p>«И ждал Он справедливости, но вот —\nвопль».<\/p>", "<p>То есть вместо буквы «далет» появляется\nбуква «айн».<\/p>", "<p>Ведь их цель — не благотворительность\nдля бедных, а насыщение собственных\nглаз.<\/p>", "<p>Они стремятся смотреть на красивых\nженщин, удовлетворяя своё вожделение.<\/p>", "<p>А пожертвования они делают лишь для\nтого, чтобы выглядеть праведными в\nглазах окружающих.<\/p>", "<p>И в этом заключается смысл слов Писания\n(Иов 24:15):<\/p>", "<p>«И глаз прелюбодея ожидает сумерек,\nговоря: \"Не увидит меня ничей глаз\",\n— и скрывает лицо своё».<\/p>", "<p>«И глаз прелюбодея ожидает сумерек,\nговоря: \"Не увидит меня ничей глаз\"».<\/p>", "<p>То есть ни один человеческий глаз не\nспособен проникнуть в глубины моего\nсердца и узнать, какова истинная цель\nмоего прихода на это собрание.<\/p>", "<p>«И скрывает лицо своё».<\/p>", "<p>Чтобы скрыть то, что таится в глубинах\nего сердца, человек придумывает прикрытие.<\/p>", "<p>Он жертвует деньги на благотворительность,\nчтобы окружающие не догадались, к чему\nв действительности стремится его сердце.<\/p>", "<p>Однако на самом деле такая\nблаготворительность ничтожна и по\nколичеству, и по качеству.<\/p>", "<p>По количеству — поскольку расходы на\nпроведение собрания огромны, а на\nблаготворительность остаётся лишь\nничтожная сумма.<\/p>", "<p>По качеству — поскольку даже те\nнемногие деньги, которые остаются, не\nстановятся подлинной благотворительностью.<\/p>", "<p>Как сказано (Миха 1:7):<\/p>", "<p>«Ибо из платы блудницы собрано это, и\nв плату блудницы обратится».<\/p>", "<p>И они могут совершить ещё один грех,\nпередав эти деньги недостойным людям,\nвследствие чего не получат награды за\nсвою благотворительность (см. Бава Кама\n16б).<\/p>", "<p>Само же посещение подобных собраний\nявляется тяжким грехом.<\/p>", "<p>Ведь если человек смотрит на лицо\nженщины с вожделением, он нарушает\nнаписанное в Торе (Бемидбар 15:39):<\/p>", "<p>«И не следуйте за сердцем вашим и за\nглазами вашими, вслед за которыми вы\nблудодействуете».<\/p>", "<p>(См. главу 1.)<\/p>", "<p>И даже если он смотрит не с вожделением,\nа просто бросает взгляд, то нарушает\nнаписанное в Торе (Дварим 23:10):<\/p>", "<p>«И берегись всякого дурного дела».<\/p>", "<p>(См. главу 2.)<\/p>", "<p>И даже если он вовсе не смотрит на лица\nженщин, а смотрит лишь на лица участников\nэтих «вечеров любви», разве наши мудрецы\nне сказали (Мегила 28а):<\/p>", "<p>«Запрещено смотреть на лицо нечестивца».<\/p>", "<p>(См. главу 4.)<\/p>", "<p>И даже если он закрывает глаза и не\nсмотрит ни на женщин, ни на мужчин,\nнаходящихся там, всё равно он считается\nнечестивцем.<\/p>", "<p>Ведь ему следовало не приближаться к\nгреху, а отдаляться от него.<\/p>", "<p>Ибо мы придерживаемся правила:<\/p>", "<p>«Отдаляйся от всего непристойного».<\/p>", "<p>Как объясняет Рашбам.<\/p>", "<h1 class=\"western\" id=\"section-99\"><font size=\"4\">Если\nчеловек изучает Тору, он тем самым\nоскверняет Имя Всевышнего<\/font><\/h1>", "<p>Если же такой человек пользуется\nуважением, обладает знаниями Торы или\nявляется сыном раввина, то он оскверняет\nИмя Всевышнего.<\/p>", "<p>[Горе тем раввинам, чьи сыновья и дочери\nпосещают подобные собрания! Горе им и\nгоре их душам! Ведь именно они, не\nпрепятствующие членам своих семей\nпосещать подобные места разврата,\nпонесут ответственность за грехи всей\nобщины Израиля.]<\/p>", "<p>Такой человек оскверняет Имя Всевышнего\nи вводит многих людей в грех, а потому\nгрехи множества людей ложатся на него\n(см. главу 5).<\/p>", "<p>Ведь многие будут продолжать посещать\nподобные места и грешить там, следуя\nсвоим желаниям, а перед окружающими\nстанут оправдываться словами:<\/p>", "<p>«Разве сын раввина тоже не ходит туда?»<\/p>", "<h1 class=\"western\" id=\"section-100\"><font size=\"4\">Запрещено\nпосещать свадьбу, на которой царит\nраспущенность<\/font><\/h1>", "<p>Тяжким грехом является посещение\nсвадьбы, на которой мужчины и женщины,\nюноши и девушки танцуют вместе.<\/p>", "<p>Так написано в книге «Сефер Хасидим»\n(параграф 393):<\/p>", "<p>«Всякую заповедь, исполнение которой\nприводит к греху, лучше не исполнять.<\/p>", "<p>Например, существует заповедь радовать\nжениха.<\/p>", "<p>Но если там находятся распущенные\nлюди и человек знает, что происходящее\nне обойдётся без непристойности, или\nон не сможет избежать греховных мыслей,\nили не сможет удержаться от созерцания\nженщин, пусть он там не присутствует».<\/p>", "<p>(См. также книгу «Аават Хесед», часть\n3, глава 6.)<\/p>", "<h1 class=\"western\" id=\"section-101\"><font size=\"4\">Божественное\nприсутствие не пребывает над таким\nбраком, но огонь пожирает супругов<\/font><\/h1>", "<p>Задумаемся над следующим.<\/p>", "<p>Наши мудрецы сказали (Сота 17а):<\/p>", "<p>«Рабби Акива учил: если мужчина и\nженщина удостоились, Божественное\nприсутствие пребывает между ними. Если\nже не удостоились, огонь пожирает их».<\/p>", "<p>(См. комментарий Раши.)<\/p>", "<p>Рабби Йеошуа бен Корха говорил («Пиркей\nде-рабби Элиэзер», глава 12):<\/p>", "<p>«Первоначально человек назывался\n\"адам\" по имени плоти и крови.<\/p>", "<p>Но когда Всевышний создал ему помощницу,\nон стал называться \"иш\" — мужчина,\nа она — \"иша\" — женщина.<\/p>", "<p>Что сделал Святой, благословен Он?<\/p>", "<p>Он поместил Своё Имя между ними.<\/p>", "<p>Если они следуют Его путями, Моё Имя\nпребывает между ними и спасает их от\nвсякой беды.<\/p>", "<p>Но если они не следуют Моим путям, Я\nзабираю Своё Имя, и они превращаются в\nогонь и огонь, и огонь пожирает огонь.<\/p>", "<p>Ибо это огонь, который пожирает до\nполного уничтожения».<\/p>", "<p>И вот, когда мужчина берёт себе жену\nи они желают, чтобы Всевышний поместил\nСвоё Имя между ними, именно в это время\nони, образно говоря, изгоняют Всевышнего!<\/p>", "<p>Ведь мужчины начинают танцевать вместе\nс женщинами, юноши — вместе с девушками.<\/p>", "<p>Эти люди, преследующие греховные\nнаслаждения, словно изгоняют Всевышнего.<\/p>", "<p>Как сказано (Дварим 23:15):<\/p>", "<p>«И будет стан твой свят, и да не увидит\nОн у тебя ничего непристойного и не\nотступит от тебя».<\/p>", "<p>И какую пользу принесут многочисленные\nблагословения, которыми родственники\nжениха и невесты осыпают их перед хупой,\nесли Сам Всевышний не благословит их?<\/p>", "<p>Поэтому, утверждает автор, после\nсвадьбы жених и невеста могут заболеть,\nостаться бездетными, а если у них родятся\nдети, те могут умереть в раннем возрасте\n— всё вследствие этого тяжкого греха.<\/p>", "<p>Ведь известно, что у юношей, танцующих\nвместе с девушками, в сердцах разгорается\nгреховное вожделение, подобное пылающему\nогню.<\/p>", "<p>Они развращают свой путь на земле и в\nогромном количестве изливают своё семя,\nсловно воду, подобно людям поколения\nПотопа, которые изливали своё семя на\nдеревья и камни (Берешит Рабба, глава\n26).<\/p>", "<p>И сказали наши мудрецы (Берешит Рабба,\nтам же; Ваикра Рабба, глава 23):<\/p>", "<p>«Всюду, где ты находишь разврат, в мир\nприходит бедствие, уничтожающее и\nдобрых, и злых».<\/p>", "<p>И тем более, согласно рассуждению\nавтора, такое бедствие может поразить\nжениха и невесту и их родителей, даже\nесли сами они хорошие люди, поскольку\nони оказывают поддержку грешникам и не\nпрепятствуют их поступкам.<\/p>", "<h1 class=\"western\" id=\"section-102\"><font size=\"4\">Запрет\nсовместного пребывания мужчин и женщин\nв одном помещении, даже если они сидят\nотдельно<\/font><\/h1>", "<p>Запрещено мужчинам и женщинам находиться\nв одном помещении, даже если мужчины\nвеселятся отдельно, а женщины отдельно.<\/p>", "<p>Ведь они будут смотреть друг на друга\nи слышать голоса друг друга.<\/p>", "<p>Наши мудрецы сказали (Брахот 24а):<\/p>", "<p>«Женский голос — эрва».<\/p>", "<p>Как сказано (Шир а-Ширим 2:14):<\/p>", "<p>«Ибо голос твой приятен...»<\/p>", "<p>И сказали наши мудрецы (Сукка 51б):<\/p>", "<p>«Учили наши мудрецы:<\/p>", "<p>Первоначально женщины находились\nвнутри, а мужчины снаружи, но это приводило\nк легкомысленному поведению.<\/p>", "<p>Тогда установили, чтобы женщины\nнаходились снаружи, а мужчины внутри,\nоднако и это продолжало приводить к\nлегкомысленному поведению.<\/p>", "<p>Поэтому постановили, чтобы женщины\nнаходились наверху, а мужчины внизу.<\/p>", "<p>Но как они могли установить такой\nпорядок?<\/p>", "<p>Ведь написано (Диврей а-Ямим I, 28:19):<\/p>", "<p>\"Всё это в письменном виде, от руки\nГоспода, Который дал мне разумение\".<\/p>", "<p>Рав сказал: Они нашли стих Писания и\nистолковали его.<\/p>", "<p>Как сказано (Зхарья 12:12):<\/p>", "<p>\"И будет скорбеть земля, каждое\nсемейство отдельно: семейство дома\nДавида отдельно и женщины их отдельно\".<\/p>", "<p>Они рассудили по принципу каль ва-хомер\n— от менее строгого случая к более\nстрогому.<\/p>", "<p>Если в будущем, когда люди будут заняты\nоплакиванием убитого дурного начала и\nдурное начало уже не будет властвовать\nнад ними, Тора всё равно предписывает\nмужчинам находиться отдельно, а женщинам\nотдельно, то тем более это необходимо\nсейчас, когда люди заняты весельем и\nдурное начало ещё властвует над ними!»<\/p>"]}, {"title": "МАХАЗЕ VIII", "body": ["<h2 class=\"western\" id=\"section-103\"><font size=\"6\">МАХАЗЕ\nVIII<\/font><\/h2>", "<h1 class=\"western\" id=\"section-104\"><font size=\"4\">Наказание\nгрешников за запретное созерцание и\nтяжесть этого греха в нашем поколении<\/font><\/h1>", "<h1 class=\"western\" id=\"section-105\"><font size=\"4\">Нечестивцы\nоступаются из-за своих глаз, а праведники\nвозвышаются благодаря тому, что видят<\/font><\/h1>", "<p>Давид, царь Израиля, проклиная\nнечестивцев, сказал по Божественному\nвдохновению (Теилим 69:24):<\/p>", "<p>«Да померкнут глаза их, чтобы не\nвидеть».<\/p>", "<p>Но возникает вопрос: ведь всем известно,\nчто глаза предназначены для зрения, а\nуши — для слуха. Зачем же добавлять\nлишние слова?<\/p>", "<p>Достаточно было бы сказать: «Да\nпомеркнут глаза их».<\/p>", "<p>Разве кто-нибудь не понял бы, что речь\nидёт о потере зрения, а не слуха?<\/p>", "<p>Однако смысл стиха заключается в\nследующем:<\/p>", "<p>«Да померкнут глаза их» — вследствие\nтого, что они смотрели на запретное,\nследуя за своими глазами.<\/p>", "<p>Ведь именно с этого начинаются все\nгрехи, беззакония и преступления.<\/p>", "<p>Сначала глаз видит, затем сердце\nжелает, а после этого тело совершает\nгрех.<\/p>", "<p>И так сказали наши мудрецы («Ялкут\nШимони», Теилим, там же):<\/p>", "<p>«Да померкнут глаза их, чтобы не видеть»\n— это относится к нечестивцам, которые\nсмотрят и грешат.<\/p>", "<p>Как сказано (Берешит 3:6): «И увидела\nженщина...»<\/p>", "<p>И сказано (Берешит 6:2): «И увидели сыны\nБожьи...»<\/p>", "<p>И сказано (Берешит 9:22): «И увидел Хам,\nотец Кнаана...»<\/p>", "<p>И сказано (Берешит 34:2): «И увидел её\nШхем, сын Хамора...»<\/p>", "<p>И сказано (Бемидбар 22:2):  «И увидел\nБалак...»<\/p>", "<p>И сказано (Эстер 3:5): «И увидел Аман...»<\/p>", "<p>И сказано (Берешит 28:8): «И увидел\nЭсав...»<\/p>", "<p>Но о праведниках сказано (Иов 22:19):\n«Увидят праведники и возрадуются».<\/p>", "<p>О Моше сказано (Шмот 2:11): «И увидел он\nстрадания их».<\/p>", "<p>О Пинхасе сказано (Бемидбар 25:7): «И\nувидел Пинхас...»<\/p>", "<p>О Яакове сказано (Берешит 42:1): «И увидел\nЯаков...»<\/p>", "<p>Об Аврааме сказано (Берешит 22:13): «И\nувидел: вот овен...»<\/p>", "<p>И также (Берешит 22:4): «И поднял глаза\nсвои, и увидел...»<\/p>", "<p>И ещё сказали наши мудрецы (Танхума,\nВаешев): \n<\/p>", "<p>«Ты находишь, что праведники возвышаются\nблагодаря своим глазам».<\/p>", "<p>Как сказано об Аврааме (Берешит 22:4):\n«И поднял Авраам глаза свои, и увидел\nто место».<\/p>", "<p>И также (Берешит 22:13): «И поднял Авраам\nглаза свои, и увидел: вот овен...»<\/p>", "<p>И ещё (Берешит 18:2): «И поднял глаза\nсвои, и увидел: вот три человека...»<\/p>", "<p>Об Ицхаке сказано (Берешит 24:63): \n<\/p>", "<p>«И вышел Ицхак беседовать в поле под\nвечер, и поднял глаза свои, и увидел...»<\/p>", "<p>О Яакове сказано (Берешит 33:1): «И поднял\nЯаков глаза свои, и увидел: вот Эсав\nидёт...»<\/p>", "<p>Но нечестивцы падают из-за своих глаз.<\/p>", "<p>Как сказано (Берешит 13:10): \n<\/p>", "<p>«И поднял Лот глаза свои, и увидел всю\nдолину Иордана». Речь идёт о Сдоме.<\/p>", "<p>Ведь Лот оставил Авраама и отправился\nв Сдом, чтобы поступать подобно его\nжителям.<\/p>", "<p>Поэтому он и получил имя Лот, которое\nистолковывается как выражение проклятия:\nего имя определило его судьбу.<\/p>", "<p>И сказано (Бемидбар 22:2): «И увидел\nБалак, сын Ципора...»<\/p>", "<p>И таким же образом следует истолковывать\nвсе подобные случаи.<\/p>", "<h1 class=\"western\" id=\"section-106\"><font size=\"4\">Человеку\nсвойственно испытывать сильное\nвпечатление от увиденного<\/font><\/h1>", "<p>Ведь такова природа каждого человека:\nто, что он видит своими глазами, вызывает\nотклик в его сердце.<\/p>", "<p>Поэтому, когда нечестивцы видят дурное,\nв них пробуждается стремление совершать\nзло.<\/p>", "<p>А когда праведники видят достойные\nвещи, в них пробуждается желание совершать\nдобро.<\/p>", "<p>И поскольку грех нечестивцев начинается\nсо зрения, их глаза подвергаются наказанию\nи меркнут.<\/p>", "<p>Как сказали наши мудрецы (Сота 8б):<\/p>", "<p>«Какой мерой человек мерит, такой\nмерой отмеряют ему».<\/p>", "<p>«Шимшон следовал за своими глазами,\nпоэтому филистимляне выкололи ему\nглаза».<\/p>", "<p>И поэтому наши мудрецы сказали (Мегила\n28а):<\/p>", "<p>«У того, кто смотрит на облик нечестивого\nчеловека, тускнеют глаза».<\/p>", "<p>Как сказано (Берешит 27:1):  «И было, когда\nИцхак состарился, и притупилось зрение\nего глаз».<\/p>", "<p>Это произошло потому, что он смотрел\nна нечестивого Эсава.<\/p>", "<p>Мудрецы истолковали стих следующим\nобразом:<\/p>", "<p>«И притупилось зрение его глаз» —\nвследствие того, что он смотрел на\nнечестивого Эсава.<\/p>", "<p>Ведь какой мерой человек мерит, такой\nмерой отмеряют ему.<\/p>", "<h1 class=\"western\" id=\"section-107\"><font size=\"4\">Необходимость\nносить очки — следствие запретных\nвзглядов<\/font><\/h1>", "<p>После этих истинных и справедливых\nслов поднимем глаза и собственными\nглазами увидим, что в нынешнем поколении\nчрезвычайно много людей, страдающих\nнарушениями зрения и помутнением глаз.<\/p>", "<p>Очень многие носят на носу стеклянные\nприспособления — очки.<\/p>", "<p>Наши мудрецы сказали (Брахот 5а):<\/p>", "<p>«Если человек видит, что его постигают\nстрадания, пусть исследует свои поступки».<\/p>", "<p>Ведь Святой, благословен Он, не совершает\nнесправедливого суда.<\/p>", "<p>Поэтому исследуем наши пути и постараемся\nпонять, почему Всевышний поступил так,\nчто у большинства людей нынешнего\nпоколения зрение начинает слабеть ещё\nв юности, когда они совсем молоды, и им\nприходится носить очки.<\/p>", "<p>И почему Всевышний устроил так, что\nнекоторые люди уже в детстве вынуждены\nносить стёкла, уменьшающие видимое\nизображение?<\/p>", "<p>Причина, по мнению автора, заключается\nисключительно в грехах, совершаемых\nпосредством зрения.<\/p>", "<p>Ведь люди следуют за своими глазами,\nсмотрят на лица женщин и нечестивцев,\nа также на всё, что привлекает и возбуждает\nих взор.<\/p>", "<p>Увы!<\/p>", "<p>Опустошение и ужасное беззаконие\nвоцарились на земле!<\/p>", "<p>Запретное созерцание распространилось\nчрезвычайно широко, и никто не требует\nисправления, никто не обличает людей\nза грехи, совершаемые глазами.<\/p>", "<p>Юноши и девушки надевают роскошные\nодежды и целыми днями разгуливают по\nулицам и площадям.<\/p>", "<p>Особенно часто это происходит в\nсубботние и праздничные дни.<\/p>", "<p>И всё это ради того, чтобы другие\nсмотрели на них, а они могли смотреть\nна других.<\/p>", "<p>Женщины постоянно меняют свои наряды,\nподобно жене Потифара.<\/p>", "<p>Ведь наши мудрецы сказали (Йома 35б):<\/p>", "<p>«Одежду, которую она надевала утром,\nона не надевала вечером, а одежду, которую\nнадевала вечером, не надевала утром».<\/p>", "<p>И всё это ради того, чтобы привлечь\nсердца мужчин и побудить их смотреть\nна их лица и одежды.<\/p>", "<h1 class=\"western\" id=\"section-108\"><font size=\"4\">Строгость\nобязанности женщин соблюдать скромность\nв одежде<\/font><\/h1>", "<p>И действительно, наши мудрецы сказали\n(«Ялкут Шимони», Иов 31; Танхума, Ваишлах):<\/p>", "<p>«Женщине запрещено выходить в\nобщественное место в своих украшениях\nдаже в будний день, поскольку люди\nсмотрят на неё.<\/p>", "<p>Ведь Святой, благословен Он, дал женщине\nукрашения лишь для того, чтобы она\nукрашала себя ими у себя дома.<\/p>", "<p>Ибо не оставляют открытого прохода\nдаже перед честным человеком, а тем\nболее перед вором».<\/p>", "<p>Поэтому рассказывается (Брахот 20а):<\/p>", "<p>«Рав Ада бар Ахава увидел на рынке\nодну нееврейку, одетую в карбальту [Раши\nобъясняет, что это название дорогой\nодежды; см. также комментарий Мааршаля].<\/p>", "<p>Он подумал, что она еврейка, подошёл\nи сорвал с неё эту одежду.<\/p>", "<p>Когда выяснилось, что она нееврейка,\nего обязали выплатить четыреста зузов.<\/p>", "<p>Он спросил её:<\/p>", "<p>— Как тебя зовут?<\/p>", "<p>Она ответила:<\/p>", "<p>— Матун.<\/p>", "<p>Он сказал ей:<\/p>", "<p>— Матун, матун — четыреста зузов\nстоят!»<\/p>", "<p>Задумаемся над этой историей.<\/p>", "<p>Рав Ада бар Ахава, поскольку считал\nэту женщину еврейкой, позволил себе\nразорвать дорогую одежду, хотя уничтожение\nодежды связано с запретом «Не уничтожай».<\/p>", "<p>Он также позволил себе опозорить её\nперед множеством людей, несмотря на то\nчто тот, кто публично заставляет своего\nближнего покраснеть от стыда без\nдостаточного основания, не имеет доли\nв Мире грядущем.<\/p>", "<p>Однако наши мудрецы упомянули его\nпоступок с похвалой и сказали (там же):<\/p>", "<p>«Прежние поколения жертвовали собой\nради освящения Имени Всевышнего, как\nэто видно из поступка рава Ады бар\nАхавы...»<\/p>", "<p>Ведь он не пожалел ни собственного\nдостоинства, ни имущества.<\/p>", "<p>А его слова:<\/p>", "<p>«Матун, матун — четыреста зузов стоят!»<\/p>", "<p>означают, согласно объяснению автора,\nследующее.<\/p>", "<p>Хотя выяснилось, что женщина была\nнееврейкой, и рав Ада бар Ахава должен\nбыл заплатить четыреста зузов — огромное\nсостояние, — он всё же радовался своему\nпоступку.<\/p>", "<p>Услышав, что её зовут Матун, он сказал\nэти слова, намекая на то, что этот случай\nследует повторять и помнить на протяжении\nдвухсот и ещё двухсот лет.<\/p>", "<p>Чтобы дочери Израиля знали, что рав\nАда бар Ахава разорвал карбальту посреди\nрынка, и не надевали подобные наряды,\nвыходя из дома.<\/p>", "<h1 class=\"western\" id=\"section-109\"><font size=\"4\">Выход\nв роскошной одежде приводит к греху<\/font><\/h1>", "<p>Так и мы, сыны Израиля, должны теперь\nзадуматься над поступком рава Ады бар\nАхавы и не позволять нашим жёнам и\nдочерям украшать себя роскошными\nнарядами, когда они выходят из дома.<\/p>", "<p>Ведь этим они разжигают огонь вожделения,\nподобный пламени раскалённой печи, и\nсловно мечут искры, стрелы и смерть в\nсердца людей.<\/p>", "<p>Женщины забыли, что должны украшать\nсебя перед своими мужьями.<\/p>", "<p>Дома они сидят неопрятными, одетыми\nв старые лохмотья.<\/p>", "<p>Но когда собираются выйти на улицу,\nумывают лица и надевают роскошные\nнаряды.<\/p>", "<p>Перед кем же они стараются выглядеть\nкрасивыми?<\/p>", "<p>Перед посторонними мужчинами!<\/p>", "<p>Как дурен и горек обычай нынешнего\nпоколения!<\/p>", "<p>Ведь когда мужчина выходит на улицу\nи видит женщин в ярких одеждах, украшенных\nдрагоценностями, то, вернувшись домой\nи взглянув на свою жену, начинает\nиспытывать к ней отвращение.<\/p>", "<p>И смотри, что сказано в трактате Таанит\n(23б):<\/p>", "<p>«Почему, когда господин возвращается\nв город, его жена выходит ему навстречу\nнарядно одетой и украшенной?»<\/p>", "<p>Он ответил:<\/p>", "<p>«Чтобы я не обращал внимания на другую\nженщину».<\/p>", "<p>И тем более тяжёлым становится\nположение, когда мужчины и женщины,\nюноши и девушки собираются вместе на\nпраздничном пиршестве — свадьбе и тому\nподобных торжествах.<\/p>", "<p>Все одеты в дорогие одежды, украшены\nдрагоценностями, серебром и золотом.<\/p>", "<p>Они веселятся друг перед другом и\nвыходят танцевать совместные танцы,\nюноши вместе с девушками.<\/p>", "<p>Увы!<\/p>", "<p>Как ужасно это зрелище!<\/p>", "<p>Ведь от созерцания красивых женских\nлиц их семя изливается подобно воде.<\/p>", "<p>Огонь вожделения пылает в глубине их\nсердец, словно пламя раскалённой печи.<\/p>", "<p>И «руки их полны крови» — согласно\nсловам наших мудрецов (Нида 13б).<\/p>", "<p>А сердца их полны печали, поскольку\nони не могут удовлетворить своё желание\nи соединиться с теми, кого возжелали.<\/p>", "<h1 class=\"western\" id=\"section-110\"><font size=\"4\">Опасность,\nсвязанная с участием женщин в торговле<\/font><\/h1>", "<p>И во всех торговых заведениях стоят\nженщины, украшенные драгоценностями,\nчтобы привлекать мужчин и побуждать их\nприходить за покупками.<\/p>", "<p>Именно об этом предостерегал мудрейший\nиз людей, говоря (Мишлей 11:16):<\/p>", "<p>«Благонравная женщина хранит честь,\nа жестокие люди удерживают богатство».<\/p>", "<p>Ведь достоинство женщины заключается\nв том, чтобы находиться дома, как сказано\n(Теилим 128:3):<\/p>", "<p>«Жена твоя — как плодоносная виноградная\nлоза во внутренних покоях дома твоего;\nсыновья твои — как молодые масличные\nдеревья вокруг стола твоего».<\/p>", "<p>И сказали наши мудрецы (Танхума,\nВаишлах):<\/p>", "<p>«Когда она подобна плодоносной\nвиноградной лозе?<\/p>", "<p>Когда она находится во внутренних\nпокоях твоего дома.<\/p>", "<p>И если она поступает так, то \"сыновья\nтвои — как молодые масличные деревья\":\nона родит сыновей, которые будут помазаны\nмаслом помазания».<\/p>", "<p>И ещё сказано там:<\/p>", "<p>«Рабби Пинхас а-Коэн бар Хама говорил:<\/p>", "<p>Когда женщина соблюдает скромность\nв своём доме, она искупает грехи своего\nдома подобно тому, как жертвенник\nискупает грехи.<\/p>", "<p>Ведь слово \"внутренние покои\"\nсвязано со словом, обозначающим сторону\nжертвенника, как сказано (Ваикра 1:11):<\/p>", "<p>\"На северной стороне жертвенника\"».<\/p>", "<p>И сказали наши мудрецы («Тана девей\nЭлияу Рабба», глава 18):<\/p>", "<p>«Пусть жена твоя будет подобна\nвиноградной лозе, приносящей плоды, а\nне лозе, которая не приносит плодов.<\/p>", "<p>Когда же жена твоя будет подобна\nплодоносной виноградной лозе?<\/p>", "<p>Когда она будет находиться во внутренних\nпокоях твоего дома».<\/p>", "<p>А что написано далее?<\/p>", "<p>«Сыновья твои — как молодые масличные\nдеревья».<\/p>", "<p>Подобно тому как плоды масличного\nдерева используются по-разному — одни\nдля еды, другие для сушки, третьи для\nполучения масла, которое горит в\nсветильниках, — так и дети женщины,\nпребывающей во внутренних покоях своего\nдома, будут отличаться разнообразными\nдостоинствами.<\/p>", "<p>Такая женщина подобна виноградной\nлозе, которая никогда не покидает своего\nместа.<\/p>", "<p>А её сыновья подобны плодам масличного\nдерева.<\/p>", "<p>Одни из них будут знатоками Писания,\nдругие — знатоками Мишны, третьи —\nзнатоками Талмуда.<\/p>", "<p
