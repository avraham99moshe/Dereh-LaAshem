>Среди них будут люди, искусные в\nторговых делах, мудрецы и разумные люди,\nумеющие правильно понимать каждое дело\nв надлежащее время».<\/p>", "<p>И в этом заключается достоинство\nженщины, как сказано (Теилим 45:14):<\/p>", "<p>«Всё достоинство царской дочери —\nвнутри; одежда её расшита золотом».<\/p>", "<p>И сказали наши мудрецы (Танхума, там\nже):<\/p>", "<p>«Когда женщина соблюдает скромность\nвнутри своего дома, она достойна стать\nженой первосвященника и родить\nпервосвященников.<\/p>", "<p>Как сказано:<\/p>", "<p>\"Всё достоинство царской дочери —\nвнутри\".<\/p>", "<p>Если она бережёт своё достоинство,\nнаходясь дома, то:<\/p>", "<p>\"Одежда её расшита золотом\".<\/p>", "<p>Она удостоится выйти замуж за того, о\nком сказано (Шмот 28:39):<\/p>", "<p>\"И выткешь хитон из виссона\"».<\/p>", "<p>И сказали наши мудрецы (Йевамот 76б;\nсм. также Швуот 30а):<\/p>", "<p>«За то, что они не встретили вас с\nхлебом и водой» (Дварим 23:5).<\/p>", "<p>Мужчине свойственно выходить навстречу\nпутникам, но женщине не свойственно\nвыходить навстречу.<\/p>", "<p>Но разве мужчины не должны были выйти\nнавстречу мужчинам, а женщины — навстречу\nженщинам?<\/p>", "<p>Здесь объяснили:<\/p>", "<p>«Всё достоинство царской дочери —\nвнутри».<\/p>", "<p>А в Земле Израиля говорили, по другой\nверсии — рабби Ицхак говорил, что это\nследует из стиха (Берешит 18:9):<\/p>", "<p>«И сказали ему: \"Где Сара, жена твоя?\"\nИ ответил он: \"Вот, в шатре\"».<\/p>", "<p>Отсюда, по мнению автора, ясно, что\nдостоинство женщины заключается в\nпребывании дома.<\/p>", "<p>И даже находясь дома, ей не следует\nсидеть у входа, где её могут видеть\nпроходящие мимо люди.<\/p>", "<p>Ведь так поступает дурная женщина,\nкак сказано (Мишлей 9:14):<\/p>", "<p>«И сидит она у входа в свой дом».<\/p>", "<p>Напротив, ей следует находиться во\nвнутренних покоях дома, как сказано:<\/p>", "<p>«Жена твоя — как плодоносная виноградная\nлоза во внутренних покоях дома твоего».<\/p>", "<p>(См. комментарий Радака к этому стиху.)<\/p>", "<p>Поэтому в прежние времена женщины не\nзанимались торговлей.<\/p>", "<p>Как сказали наши мудрецы (Бава Кама\n15а, 79а):<\/p>", "<p>«Мужчина занимается торговыми делами,\nа женщина, которой не свойственно\nзаниматься торговлей, — нет».<\/p>", "<p>Но в нынешние поколения всё перевернулось.<\/p>", "<p>Женщины стали управлять всевозможными\nторговыми делами.<\/p>", "<p>Многие предпочитают нанимать в свои\nмагазины красивых молодых девушек,\nчтобы привлекать внимание каждого\nпрохожего и побуждать его заходить за\nпокупками.<\/p>", "<p>Женщины украшают себя косметическими\nсредствами, надевают роскошные расшитые\nодежды и стоят у входа в торговые\nзаведения, чтобы множество людей заходило\nтуда покупать товары.<\/p>", "<p>И в этом заключается смысл слов\nмудрейшего из людей:<\/p>", "<p>«Благонравная женщина» — женщина,\nкоторая пользуется расположением всех,\nкто её видит.<\/p>", "<p>«Хранит честь» — именно на ней лежит\nособая обязанность, в ещё большей\nстепени, чем на других женщинах, беречь\nженское достоинство, пребывая во\nвнутренних покоях дома.<\/p>", "<p>Ведь в этом заключается их честь, как\nсказано:<\/p>", "<p>«Всё достоинство царской дочери —\nвнутри».<\/p>", "<p>Но теперь всё перевернулось.<\/p>", "<p>«Жестокие люди» — это те, кто стремится\nразрушить ограды скромности.<\/p>", "<p>Они «удерживают богатство» посредством\nпривлекательной женщины.<\/p>", "<p>Ведь в их торговом заведении распоряжается\nженщина.<\/p>", "<p>Она продаёт товары, убеждает покупателей\nв их качестве.<\/p>", "<p>И эта женщина, «как невеста, украшает\nсебя драгоценностями» (Йешаяу 61:10).<\/p>", "<p>Она стоит у входа в магазин, чтобы\nмножество людей, глядя на неё, заходило\nтуда за покупками.<\/p>", "<h1 class=\"western\" id=\"section-111\"><font size=\"4\">Без\nскромности нет благословения в имуществе<\/font><\/h1>", "<p>Из-за этого, по мнению автора, изменился\nпорядок вещей в мире, и такие люди не\nвидят благословения в делах своих рук.<\/p>", "<p>Как сказали наши мудрецы (Псахим 50б):<\/p>", "<p>«Тот, кто рассчитывает на заработок\nсвоей жены, никогда не увидит благословения».<\/p>", "<p>Маарша объяснил причину этого следующим\nобразом.<\/p>", "<p>Достоинство женщины заключается в\nпребывании дома, чтобы она не разжигала\nогонь вожделения в сердцах мужчин.<\/p>", "<p>И Всевышний не пребывает с такими\nлюдьми, как сказано (Дварим 23:15):<\/p>", "<p>«И да не увидит Он у тебя ничего\nнепристойного и не отступит от тебя».<\/p>", "<p>И поскольку женщине подобает находиться\nдома, а не показываться перед мужчинами,\nВиленский Гаон, благословенна память\nправедника, написал своей жене в письме:<\/p>", "<p>«Всё, что тебе необходимо, приобретай\nчерез посыльного.<\/p>", "<p>И даже если это будет стоить в два или\nтри раза дороже, разве рука Господа\nстала короче?<\/p>", "<p>Ведь благословенный Всевышний питает\nвсех, от огромных буйволов до самых\nмалых существ, и каждому даёт всё\nнеобходимое».<\/p>", "<p>И сказали наши мудрецы (Берешит Рабба,\nглава 88):<\/p>", "<p>«Мужчина удерживает свою жену от\nвыхода на рынок, поскольку всякая\nженщина, выходящая на рынок, в конце\nконцов может оступиться.<\/p>", "<p>Откуда мы это знаем?  Из истории Дины.<\/p>", "<p>Как сказано (Берешит 34:1):  \"И вышла\nДина...\"<\/p>", "<p>А в конце она попала в беду.<\/p>", "<p>Как написано далее (Берешит 34:2):<\/p>", "<p>\"И увидел её Шхем...\"»<\/p>", "<p>Итак, запретное созерцание чрезвычайно\nраспространилось в нынешнем поколении.<\/p>", "<p>И поэтому, заключает автор, меркнут\nих глаза.<\/p>", "<h1 class=\"western\" id=\"section-112\"><font size=\"4\">Тяжесть\nгреха тех, кто причиняет вред дурным\nглазом<\/font><\/h1>", "<p>И все они смотрят дурным глазом на всё\nпрекрасное и желанное, что принадлежит\nдругим людям, и причиняют им вред своими\nглазами.<\/p>", "<p>Они навлекают на людей нужду, бедность,\nстрадания и всевозможные несчастья,\nкогда смотрят дурным глазом на них\nсамих, на их состояние и имущество, и\nбезжалостно лишают людей жизни.<\/p>", "<p>Ведь наши мудрецы сказали (Бава Меция\n107б):<\/p>", "<p>«Девяносто девять человек умирают от\nдурного глаза, и лишь один — естественной\nсмертью».<\/p>", "<p>Увы! Как страшен тот, кто причиняет\nвред дурным глазом!<\/p>", "<p>Он причиняет вред, оставаясь невидимым.<\/p>", "<p>Он видит своими дурными глазами и\nнаносит вред, но сам остаётся незамеченным:\nникто не узнаёт и не догадывается, что\nименно он причинил несчастье.<\/p>", "<p>Кроме того, всякий вор и всякий убийца\nможет быть пойман и подвергнут судебному\nнаказанию.<\/p>", "<p>Но этот человек видит, оставаясь\nневидимым.<\/p>", "<p>Он убивает людей, повергает множество\nжертв, и многочисленны те, кого он\nпогубил, однако за всю свою жизнь он так\nи не будет пойман.<\/p>", "<p>И ещё: когда человек собственноручно\nсовершает убийство, душа его приходит\nв смятение, а сердце трепещет и сильно\nбьётся.<\/p>", "<p>Но у того, кто убивает людей своими\nглазами, сердце остаётся спокойным и\nневозмутимым, и он даже не знает, что\nявляется убийцей.<\/p>", "<p>Сын человеческий! Задумайся и познай\nсамого себя!<\/p>", "<p>Быть может, ты — убийца людей!<\/p>", "<p>Быть может, своими дурными глазами ты\nпогубил и умертвил множество душ!<\/p>", "<p>Быть может, ты убил грудного младенца\nна глазах его матери!<\/p>", "<p>Быть может, ты погубил человека, оставив\nего жену вдовой, а детей сиротами!<\/p>", "<p>Увы! Горе тебе!<\/p>", "<p>Что ответишь ты в день расплаты, когда\nВсевышний приведёт тебя на суд, обличит\nтебя и представит перед твоими глазами\nвсё зло, которое ты причинил своими\nглазами за все дни своей жизни?<\/p>", "<p>И в этом заключается смысл слов Писания\n(Иов 11:11):<\/p>", "<p>«Ибо Он знает людей лживых, видит\nбеззаконие, хотя человек и не замечает\nего».<\/p>", "<p>«Ибо Он» — Всевышний.<\/p>", "<p>«Знает людей лживых» — ведь обмануть\nложью можно только людей, но не Всевышнего.<\/p>", "<p>И Всевышний знает каждого человека,\nкоторый «видит беззаконие», то есть\nсовершает зло посредством своего зрения,\nно «не замечает» и не осознаёт, что\nименно он совершил.<\/p>", "<p>Однако Всевышний знает всё и будет\nсудить его за каждое деяние.<\/p>", "<h1 class=\"western\" id=\"section-113\"><font size=\"4\">Обязанность\nсовершить раскаяние<\/font><\/h1>", "<p>Каждый год мы исповедуемся и произносим:<\/p>", "<p>«За грех, который мы совершили перед\nТобой лукавым взглядом».<\/p>", "<p>Но какую пользу принесут эти слова,\nесли мы не раскаемся и не обратим внимания\nна необходимость остерегаться этого\nгреха?<\/p>", "<p>Ведь наши мудрецы сказали (Таанит\n16а):<\/p>", "<p>«Человек, который совершил грех,\nисповедуется в нём, но не оставляет его,\nчему подобен?<\/p>", "<p>Человеку, который держит в руке нечистое\nпресмыкающееся.<\/p>", "<p>Даже если он окунётся во все воды мира,\nего погружение не принесёт ему очищения.<\/p>", "<p>Но стоит ему выбросить нечистое\nсущество из руки, как погружение сразу\nприносит ему очищение».<\/p>", "<p>Как сказано (Мишлей 28:13):<\/p>", "<p>«Признающийся и оставляющий грех\nбудет помилован».<\/p>", "<p>И ещё сказано (Эйха 3:41):<\/p>", "<p>«Вознесём наши сердца вместе с руками\nк Богу на небесах».<\/p>", "<p>И вот мы видим, что очень многие страдают\nнарушениями зрения и что глаза их\nмеркнут, вследствие чего они нуждаются\nв очках.<\/p>", "<p>Поэтому нам следует исполнить\nнаставление наших мудрецов (см. Брахот\n5а):<\/p>", "<p>«Если человек видит, что его постигают\nстрадания, пусть исследует свои поступки.<\/p>", "<p>Если, исследовав их, он обнаружит грех,\nпусть совершит раскаяние».<\/p>", "<p>И сказали наши мудрецы («Ялкут Шимони»,\nЙешаяу 40):<\/p>", "<p>«Согрешили глазами, как сказано (Йешаяу\n3:16):<\/p>", "<p>\"И строят глазки\".<\/p>", "<p>И были наказаны через глаза, как сказано\n(Эйха 1:16):<\/p>", "<p>\"Глаз мой, глаз мой источает слёзы\".<\/p>", "<p>И получат утешение через глаза, как\nсказано (Йешаяу 52:8):<\/p>", "<p>\"Ибо своими глазами увидят они, как\nГосподь возвращается в Сион\"».<\/p>"]}, {"title": "МАХАЗЕ IX", "body": ["<h2 class=\"western\" id=\"section-114\"><font size=\"6\">МАХАЗЕ\nIX <\/font>\n<\/h2>", "<h1 class=\"western\" id=\"section-115\"><font size=\"4\">Тяжесть\nгреха запретного созерцания<\/font><\/h1>", "<h1 class=\"western\" id=\"section-116\"><font size=\"4\">Тот,\nкто идёт за женщиной при переходе через\nреку, не имеет доли в Мире грядущем<\/font><\/h1>", "<p>В книге Коэлет сказано (2:14):<\/p>", "<p>«У мудрого глаза в голове его, а глупец\nходит во тьме».<\/p>", "<p>Наши мудрецы сказали (Брахот 61а):<\/p>", "<p>«Пусть человек не идёт по дороге позади\nженщины, даже если это его собственная\nжена.<\/p>", "<p>Если женщина оказалась перед ним на\nмосту, пусть обойдёт её сбоку.<\/p>", "<p>А всякий, кто идёт позади женщины при\nпереходе через реку, не имеет доли в\nМире грядущем».<\/p>", "<p>Раши объясняет:<\/p>", "<p>«Речь идёт о замужней женщине, которая\nприподнимает свою одежду из-за воды, а\nмужчина смотрит на неё».<\/p>", "<p>Тосафот пишут:<\/p>", "<p>«Всякий, кто идёт позади женщины при\nпереходе через реку, не имеет доли в\nМире грядущем».<\/p>", "<p>Это означает, что речь идёт о человеке,\nкоторый привык так поступать, поскольку\nподобное поведение приведёт его к\nпрелюбодеянию и в конце концов он\nокажется в Гееноме.<\/p>", "<p>Однако эти слова требуют объяснения.<\/p>", "<p>Почему такой человек не имеет доли в\nМире грядущем?<\/p>", "<p>Ведь даже тот, кто совершил прелюбодеяние\nс замужней женщиной, подлежит смертной\nказни через удушение, но всё же имеет\nдолю в Мире грядущем (Бава Меция 59а).<\/p>", "<h1 class=\"western\" id=\"section-117\"><font size=\"4\">Предназначение\nМира грядущего — наслаждение сиянием\nБожественного присутствия<\/font><\/h1>", "<p>Однако всё становится совершенно\nпонятным на основании слов наших мудрецов\n(Брахот 17а).<\/p>", "<p>Рав часто повторял:<\/p>", "<p>«Мир грядущий не подобен этому миру.\nВ Мире грядущем нет ни еды, ни питья и\nтак далее. Праведники сидят с венцами\nна головах и наслаждаются сиянием\nБожественного присутствия».<\/p>", "<p>Как сказано (Шмот 24:11):<\/p>", "<p>«И созерцали они Бога, и ели, и пили».<\/p>", "<p>Следует понимать, что даже старейшины,\nкоторые созерцали Всевышнего и\nнаслаждались сиянием Божественного\nприсутствия, всё же не созерцали благодать\nГоспода и не наслаждались сиянием Шхины\nпри жизни в этом мире так, как будут\nсозерцать свет Его Лика и наслаждаться\nсиянием Его присутствия в Мире грядущем.<\/p>", "<p>Ведь наши мудрецы сказали (Брахот\n34б):<\/p>", "<p>«Все пророки пророчествовали лишь о\nднях Машиаха, но о жизни в Мире грядущем\nсказано: \"Никакой глаз не видел...\"»<\/p>", "<p>И об этом сказали наши мудрецы (Пиркей\nАвот 4:17):<\/p>", "<p>«Один час духовного наслаждения в\nМире грядущем лучше всей жизни в этом\nмире».<\/p>", "<p>«Всей жизни в этом мире» — включая\nдаже жизнь всех пророков, которые\nсозерцали благодать Всевышнего.<\/p>", "<p>Причина заключается в том, что даже\nпророк и провидец, пока его душа покрыта\nзавесой материального тела, не способен\nсозерцать свет Лика Всевышнего так, как\nсможет после того, как материальная\nзавеса будет снята с его души.<\/p>", "<p>И все наши надежды обращены исключительно\nк жизни в Мире грядущем.<\/p>", "<p>Ведь жизнь в этом мире подобна проходящей\nтени, исчезающему облаку и тому подобному.<\/p>", "<p>И те немногие годы, которые мы живём\nв этом мире, даны нам не для того, чтобы\nнаслаждаться самой земной жизнью и её\nматериальными удовольствиями, а для\nтого, чтобы приготовить пропитание для\nдуши к жизни в Мире грядущем.<\/p>", "<p>Как сказали наши мудрецы (Авода Зара\n3а; Рут Рабба 3; Коэлет Рабба 1):<\/p>", "<p>«Этот мир подобен кануну субботы, а\nМир грядущий подобен субботе. Кто\nтрудился накануне субботы, тот будет\nесть в субботу. А кто не трудился накануне\nсубботы, откуда возьмёт пищу в субботу?»<\/p>", "<h1 class=\"western\" id=\"section-118\"><font size=\"4\">В\nМире грядущем душа питается посредством\nсозерцания<\/font><\/h1>", "<p>А теперь задумаемся.<\/p>", "<p>В этом мире тело поддерживает своё\nсуществование посредством еды и питья,\nкоторые поступают внутрь тела через\nпищевод.<\/p>", "<p>В Мире грядущем душа поддерживает\nсвоё существование сиянием Божественного\nприсутствия, и это сияние проникает в\nдушу через глаза.<\/p>", "<p>Ведь подобно тому как в материальном\nтеле есть 248 органов и 365 жил, так и душа\nобладает 248 духовными органами и 365\nдуховными жилами.<\/p>", "<p>Как объясняется в книге «Шаарей Кдуша»\nрабби Хаима Виталя (часть 1, врата 1).<\/p>", "<p>Следовательно, если внутри пищевода\nвозникает тяжёлое повреждение, из-за\nкоторого пища и питьё не могут проходить\nчерез него, то всё тело лишается питания.<\/p>", "<p>Ведь без пищи человек не может жить.<\/p>", "<p>То же самое происходит и с душой.<\/p>", "<p>Если человек грешит своими глазами,\nони утрачивают способность созерцать\nсияние Божественного присутствия.<\/p>", "<p>Как сказано (Теилим 69:24):<\/p>", "<p>«Да померкнут глаза их, чтобы не\nвидеть».<\/p>", "<p>То есть вследствие того, что они смотрят\nсвоими глазами на дурное, их глаза\nпомеркнут и не смогут созерцать сияние\nШхины.<\/p>", "<p>Но разве в таком случае вся душа не\nлишится своего питания?*<\/p>", "<p>[И подобное сказано в «Авот де-рабби\nНатан» (1:8) и в «Ялкут Шимони» (Теилим,\n748):<\/p>", "<p>«Праведники сидят с венцами на головах\nи питаются сиянием Божественного\nприсутствия».<\/p>", "<p>Ведь именно это сияние является их\nпищей.]<\/p>", "<p>* Примечание, которое автор написал\nна полях страницы («Гей Хизайон»),\nпомещено в конце книги, на странице 214.<\/p>", "<h1 class=\"western\" id=\"section-119\"><font size=\"4\">Ради\nмгновенного удовольствия от созерцания\nчеловек теряет вечное наслаждение<\/font><\/h1>", "<p>Поэтому трепет и ужас должны охватывать\nкаждого человека, если он заботится о\nсвоей душе, когда он поднимает глаза,\nчтобы посмотреть на лицо женщины, на\nлицо нечестивого человека или на что-либо\nдругое, возбуждающее вожделение.<\/p>", "<p>Ведь этим он подвергает опасности\nсобственную душу и лишает её жизни в\nМире грядущем, на которую только и\nвозлагает надежду человеческая душа.<\/p>", "<p>Как же человек не задумывается о том,\nнасколько он лишён разума, когда поднимает\nглаза, чтобы посмотреть на красивую\nженщину?<\/p>", "<p>Ведь он обменивает наслаждение\nсозерцанием благодати Всевышнего и\nсияния Божественного присутствия —\nвеличайшее, несравненное наслаждение,\nкоторое будет продолжаться вечно, во\nвеки веков, — на удовольствие от\nсозерцания женского лица.<\/p>", "<p>А ведь женщина, как сказали наши\nмудрецы, происходит «из зловонной капли»\n(Авода Зара 20а), представляет собой\n«сосуд, наполненный нечистотами, и уста\nеё полны крови» (Шаббат 152а).<\/p>", "<p>И ради этого ничтожного удовольствия,\nдлящегося всего несколько мгновений,\nчеловек отказывается от вечного\nблаженства!<\/p>", "<p>И в этом заключается смысл слов Писания\n(Иов 31:1–2):<\/p>", "<p>«Завет заключил я с глазами моими, и\nкак же стану смотреть на девицу? И какова\nдоля от Бога свыше и наследие Всемогущего\nс высот?»<\/p>", "<p>«Завет заключил я с глазами моими» —\nчтобы не смотреть на лицо женщины, на\nидолов, на лица нечестивцев и на всё\nнечистое.<\/p>", "<p>«И как же» — то есть насколько ничтожно\nэто удовольствие, подобно выражениям\n«А мы — что мы такое?» и «Что есть\nчеловек?..»<\/p>", "<p>«Стану смотреть» — я обращу своё\nсердце к размышлению о том, что представляет\nсобой это удовольствие.<\/p>", "<p>Даже когда я смотрю «на девицу», что\nсчитается одним из величайших удовольствий\nэтого мира.<\/p>", "<p>Ведь наши мудрецы сказали (Йома 74б),\nобъясняя стих (Коэлет 6:9):<\/p>", "<p>«Лучше то, что видят глаза, нежели\nблуждание души».<\/p>", "<p>То есть удовольствие от созерцания\nженщины бывает сильнее удовольствия\nот самого телесного действия.<\/p>", "<p>И всё же чего стоит это удовольствие\nпо сравнению с наслаждением, которое\nожидает человека в Мире грядущем?<\/p>", "<p>«И какова доля от Бога свыше» — то\nесть насколько велико это наслаждение,\nподобно словам «Как величественно Имя\nТвоё...»<\/p>", "<p>Это наслаждение близостью ко Всевышнему\nи сиянием Его Божественного присутствия.<\/p>", "<p>Как же могу я обменять духовное и\nвечное наслаждение на удовольствие\nтелесное и преходящее?<\/p>", "<h1 class=\"western\" id=\"section-120\"><font size=\"4\">Тот,\nкто привык грешить глазами, лишается\nвозможности созерцать благодать\nВсевышнего<\/font><\/h1>", "<p>Поэтому наши мудрецы сказали:<\/p>", "<p>«Всякий, кто идёт позади женщины при\nпереходе через реку, не имеет доли в\nМире грядущем».<\/p>", "<p>Ведь в чём заключается сама сущность\nдоли в Мире грядущем?<\/p>", "<p>В созерцании света Лика Всевышнего и\nнаслаждении сиянием Его Божественного\nприсутствия.<\/p>", "<p>И это наслаждение поступает в душу\nчерез глаза.<\/p>", "<p>Поэтому, если человек привык грешить\nсвоими глазами, его глаза померкнут и\nне смогут созерцать сияние Шхины.<\/p>", "<p>И потому он не имеет доли в Мире\nгрядущем.<\/p>", "<p>Следовательно, каждый человек должен\nчрезвычайно остерегаться смотреть на\nдурное и закрывать глаза от созерцания\nзла.<\/p>", "<p>Благодаря этому он удостоится созерцать\nблагодать Всевышнего и наслаждаться\nсиянием Божественного присутствия.<\/p>", "<p>И так сказали наши мудрецы (Ваикра\nРабба, конец главы 23):<\/p>", "<p>«Мы находим, что всякий, кто видит\nнечто непристойное, но не услаждает\nэтим свои глаза, удостаивается предстать\nперед Божественным присутствием.<\/p>", "<p>Откуда это следует?<\/p>", "<p>Как сказано (Йешаяу 33:15):<\/p>", "<p>\"И закрывает глаза свои, чтобы не\nвидеть зла\".<\/p>", "<p>А что написано далее (Йешаяу 33:17)?<\/p>", "<p>\"Царя в красоте Его увидят глаза\nтвои\"».<\/p>", "<p>И в этом заключается смысл слов Писания\n(Коэлет 2:14):<\/p>", "<p>«У мудрого глаза в голове его».<\/p>", "<p>То есть прежде всего мудрый человек\nбережёт свои глаза.<\/p>", "<p>Ведь именно от того, как он пользуется\nглазами, зависит жизнь его души в Мире\nгрядущем.<\/p>", "<p>«А глупец ходит во тьме».<\/p>", "<p>Когда глупец отправится в свой вечный\nдом, он будет идти там во тьме.<\/p>", "<p>Ведь его глаза померкнут и не смогут\nсозерцать Лик Всевышнего и наслаждаться\nсиянием Его Божественного присутствия.<\/p>", "<h1 class=\"western\" id=\"section-121\"><font size=\"4\">Царь\nДавид удостоился созерцать свет\nВсевышнего, поскольку ему был прощён\nгрех, совершённый глазами<\/font><\/h1>", "<p>На основании этих истинных и справедливых\nслов мы сможем понять сказанное\nсладкоголосым певцом Израиля (Теилим\n139:11):<\/p>", "<p>«И сказал я: только тьма покроет меня,\nно и ночь станет светом вокруг меня».<\/p>", "<p>Наши мудрецы сказали (Псахим 2б):<\/p>", "<p>«Так сказал Давид:<\/p>", "<p>Я думал, что тьма покроет меня в Мире\nгрядущем, который подобен дню.<\/p>", "<p>Но теперь даже этот мир, который подобен\nночи, стал для меня светом».<\/p>", "<p>(См. комментарий Раши.)<\/p>", "<p>И смысл этих слов заключается в\nследующем.<\/p>", "<p>«И сказал я: только тьма покроет меня».<\/p>", "<p>Я думал, что в Мире грядущем мои глаза\nпомеркнут и не смогут созерцать свет\nЛика Всевышнего.<\/p>", "<p>Ведь своими глазами я увидел Бат-Шеву,\nкак сказано (Шмуэль II, 11:2):<\/p>", "<p>«И ходил он по крыше царского дома, и\nувидел с крыши купающуюся женщину, и\nженщина эта была очень красива. И послал\nДавид разузнать о женщине...»<\/p>", "<p>Но вот:  «И ночь станет светом вокруг\nменя».<\/p>", "<p>То есть даже в этом мире, который\nподобен ночи, для меня сияет свет.<\/p>", "<p>Иными словами, я не только удостоюсь\nсозерцать свет Лика Всевышнего и\nнаслаждаться сиянием Шхины в Мире\nгрядущем, но и в этом мире мои глаза не\nутратили способности видеть.<\/p>", "<p>Я вижу своими глазами, как и все\nостальные люди, и удостаиваюсь Божественных\nвидений, подобно другим пророкам.<\/p>", "<p>Ведь Давид был пророком, как сказали\nнаши мудрецы (Сота 48б):<\/p>", "<p>«Кто такие первые пророки? Шмуэль,\nДавид и Шломо».<\/p>", "<p>И всё это потому, что Святой, благословен\nОн, простил Давиду тот грех (Санхедрин\n107б; Шаббат 30а).<\/p>"]}, {"title": "МАХАЗЕ X", "body": ["<h2 class=\"western\" id=\"section-122\"><font size=\"6\">МАХАЗЕ\nX<\/font><\/h2>", "<h1 class=\"western\" id=\"section-123\"><strong><font size=\"4\">Достоинство\nчеловека, довольствующегося своей долей\nи радующегося ей<\/font><\/strong><\/h1>", "<h1 class=\"western\" id=\"section-124\"><strong><font size=\"4\">Тот,\nкто желает всего, что видят его глаза,\nнисходит в преисподнюю<\/font><\/strong><\/h1>", "<p>Мудрейший из людей сказал (Мишлей\n27:20):<\/p>", "<p><strong>«Преисподняя и погибель ненасытны,\nи глаза человеческие ненасытны».<\/strong><\/p>", "<p>Этот стих учит нас тому, что преисподняя\nи погибель не насытятся, поглощая людей,\nесли человеческие глаза не будут\nдовольствоваться всеми благами, которыми\nлюди уже обладают.<\/p>", "<p>Если человек желает и жаждет всего,\nчто видят его глаза, то даже если он не\nворует, не грабит, не смотрит дурным\nглазом и ничего не просит у других людей,\nа лишь обращается к Всевышнему и молится,\nчтобы Тот умножил его серебро и золото,\nдаровал ему дома, наполненные всевозможными\nблагами и всеми сокровищами мира, —\nтакой человек, по словам автора, низойдёт\nв преисподнюю, отправится в погибель и\nбудет судим в Гееноме.<\/p>", "<p>Ведь наши мудрецы установили великое\nправило (Сота 8б):<\/p>", "<p><strong>«Какой мерой человек мерит, такой\nмерой отмеряют ему».<\/strong><\/p>", "<p>И сказали наши мудрецы (Мидраш,\nприведённый в книге «Микдаш Меат» к\nТеилим; см. также Рамбана к Шмот 3:14 и\n«Нефеш а-Хаим», 1:7):<\/p>", "<p>«И сказал Бог Моше: \"Я буду Тем, Кем\nбуду\"» (Шмот 3:14).<\/p>", "<p>Что означают слова «Я буду Тем, Кем\nбуду»?<\/p>", "<p>Как ты относишься ко Мне, так и Я\nотношусь к тебе.<\/p>", "<p>И так сказал Давид (Теилим 121:5):<\/p>", "<p>«Господь — тень твоя».<\/p>", "<p>Что означает «Господь — тень твоя»?<\/p>", "<p>Он подобен твоей тени.<\/p>", "<p>Если ты улыбаешься своей тени, она\nулыбается тебе.<\/p>", "<p>Если ты плачешь перед ней, она словно\nплачет вместе с тобой.<\/p>", "<p>Если ты показываешь ей сердитое или\nприветливое лицо, она отвечает тебе тем\nже.<\/p>", "<p>Так и Святой, благословен Он: «Господь\n— тень твоя».<\/p>", "<p>Как ты относишься к Нему, так и Он\nотносится к тебе.<\/p>", "<h1 class=\"western\" id=\"section-125\"><strong><font size=\"4\">Отношение\nТворца к человеку соответствует отношению\nчеловека к деяниям Всевышнего<\/font><\/strong><\/h1>", "<p>Поэтому, если человек радуется своей\nдоле, которую дал ему Всевышний, — будь\nона большой или малой, хорошей или\nплохой, — и с радостью произносит\nблагословение:<\/p>", "<p><strong>«Благословен Ты... обеспечивший\nменя всем необходимым»,<\/strong><\/p>", "<p>поскольку он твёрдо верит, что «всё,\nчто делает Милосердный, — к добру»\n(Брахот 60б), и что всё, что Всевышний\nпосылает ему, от хорошего до дурного,\nнеобходимо именно ему, — тогда и Всевышний\nбудет радоваться заповедям, исполненным\nэтим человеком, будь их много или мало,\nи будет судить все его поступки\nблагосклонно.<\/p>", "<p>Но если человек жалуется на долю,\nкоторую дал ему Всевышний, и говорит,\nчто добра ему дано мало, а зла — много,\nтогда и Всевышний скажет о совершённых\nим заповедях, что их мало, а грехов,\nкоторые он совершил, — много.<\/p>", "<p>И такой человек низойдёт в Гееном.<\/p>", "<h1 class=\"western\" id=\"section-126\"><strong><font size=\"4\">Достоинство\nчеловека, довольствующегося малым и\nрадующегося ему<\/font><\/strong><\/h1>", "<p>И в этом заключается смысл слов\nНебесного голоса, исходящего с горы\nХорев и возвещающего (Брахот 17б):<\/p>", "<p><strong>«Весь мир получает пропитание\nради Ханины, сына Моего, а Ханине, сыну\nМоему, достаточно одного кава плодов\nрожкового дерева от кануна субботы до\nследующего кануна субботы».<\/strong><\/p>", "<p>То есть весь мир получает пропитание\nради Ханины, сына Моего, именно потому,\nчто Ханине, сыну Моему, достаточно одного\nкава рожковых плодов на целую неделю.<\/p>", "<p>Ему достаточно того малого, что дал\nему Всевышний.<\/p>", "<p>Ему хватает одного кава рожковых\nплодов на семь дней, и большего он не\nпросит.<\/p>", "<p>Так и Всевышний говорит: достаточно\nдобрых дел рабби Ханины бен Досы,\nдостаточно его заслуг, чтобы благодаря\nим поддерживать жизнь всех обитателей\nземли.<\/p>", "<h1 class=\"western\" id=\"section-127\"><strong><font size=\"4\">Замечательное\nобъяснение достоинства рабби Ханины\nбен Досы<\/font><\/strong><\/h1>", "<p>На основании сказанного, с помощью\nблагословенного Всевышнего, мы сможем\nпонять слова наших мудрецов (Брахот\n34б):<\/p>", "<p>«Однажды рабби Ханина бен Доса пришёл\nизучать Тору у рабби Йоханана бен Заккая.<\/p>", "<p>И заболел сын рабби Йоханана бен\nЗаккая.<\/p>", "<p>Сказал ему рабби Йоханан:<\/p>", "<p>— Ханина, сын мой, помолись о нём, чтобы\nон выздоровел.<\/p>", "<p>Рабби Ханина положил голову между\nколенями, попросил о милосердии к\nбольному, и тот выздоровел.<\/p>", "<p>Сказал рабби Йоханан бен Заккай:<\/p>", "<p>— Если бы сам бен Заккай весь день\nдержал голову между коленями и молился,\nна его молитву не обратили бы внимания.<\/p>", "<p>Спросила его жена:<\/p>", "<p>— Разве Ханина выше тебя?<\/p>", "<p>Ответил он:<\/p>", "<p>— Нет. Но он подобен слуге перед царём,\nа я подобен сановнику перед царём».<\/p>", "<p>Однако возникает вопрос.<\/p>", "<p>Почему рабби Йоханан бен Заккай ответил\nжене: «Нет»?<\/p>", "<p>И какое ему дело до того, выше ли рабби\nХанина бен Доса, чем он сам?<\/p>", "<p>Разве он хотел возвеличить себя перед\nженой, чтобы она не подумала, будто рабби\nХанина бен Доса праведнее его?<\/p>", "<p>Кроме того, ведь каждый праведник\nсчитает другого человека более великим\nправедником, чем он сам.<\/p>", "<p>Как же рабби Йоханан бен Заккай мог\nсказать о рабби Ханине бен Досе, что тот\nне выше его?<\/p>", "<p>Однако прежде всего следует задуматься\nнад словами рабби Йоханана бен Заккая:<\/p>", "<p><strong>«Он подобен слуге перед царём, а\nя подобен сановнику перед царём».<\/strong><\/p>", "<p>Разве слуга, который просит что-либо\nу царя, скорее добьётся исполнения своей\nпросьбы, чем сановник, обращающийся с\nтакой же просьбой?<\/p>", "<p>Но рабби Йоханан бен Заккай имел в\nвиду следующее.<\/p>", "<p>«Он подобен слуге перед царём» —\nслуге, который получает от царя совсем\nнебольшое жалованье.<\/p>", "<p>Ведь рабби Ханине достаточно одного\nкава рожковых плодов от кануна субботы\nдо следующего кануна субботы.<\/p>", "<p>И поскольку он сам говорит, что ему\nдостаточно, Всевышний также говорит о\nего добрых делах: «Достаточно».<\/p>", "<p>Поэтому его молитва принимается.<\/p>", "<p>(См. книгу «Июн Яаков» к Сота 49 и конец\nкниги «Кохвей Ор» великого учителя\nрабби Ицхака Блазера.)<\/p>", "<p>«А я подобен сановнику перед царём»\n— сановнику, который получает от царя\nбольшое жалованье.<\/p>", "<p>Ведь я и члены моей семьи имеем\nдостаточно средств для безбедного\nсуществования.<\/p>", "<p>Мы едим мясо и рыбу и не говорим, что\nнам достаточно одного кава рожковых\nплодов.<\/p>", "<p>И подобно тому как мы просим у Всевышнего\nвсевозможных благ в большом изобилии,\nтак и Всевышний требует от нас значительно\nбольшего количества добрых дел.<\/p>", "<p>Поэтому моя молитва не принимается.<\/p>", "<p>А слова «Нет», которые рабби Йоханан\nбен Заккай сказал своей жене, означали\nследующее:<\/p>", "<p>Когда я сказал: «Если бы сам бен Заккай\nвесь день держал голову между коленями,\nна его молитву не обратили бы внимания»,\nя не имел в виду, что добрые дела рабби\nХанины бен Досы многочисленнее и лучше\nмоих.<\/p>", "<p>Я вовсе не собирался сравнивать его\nпоступки со своими.<\/p>", "<p>Я хотел сказать лишь то, что ему\nдостаточно одного кава рожковых плодов,\nтогда как я желаю мяса и рыбы.<\/p>", "<p>Поэтому Всевышний считает его добрые\nдела достаточными, а от меня требует\nбольшего совершенства в исполнении\nзаповедей.<\/p>", "<p>И теперь становится понятно, почему\nрабби Йоханан бен Заккай сообщил об\nэтом своей жене.<\/p>", "<p>Он хотел, чтобы и она задумалась, когда\nих сын заболел, о своём грехе — о том,\nчто она желает слишком многих благ и не\nговорит: «Достаточно».<\/p>", "<p>(См. мою книгу «Рамат Шмуэль», раздел\n«Эмек а-Баха», глава 3, где это высказывание\nобъясняется иным образом.)<\/p>", "<h1 class=\"western\" id=\"section-128\"><strong><font size=\"4\">Стремление\nк материальному обязывает к духовному\nвозвышению<\/font><\/strong><\/h1>", "<p>На основании сказанного, с помощью\nблагословенного Всевышнего, мы сможем\nпонять рассказ наших мудрецов (Таанит\n25а):<\/p>", "<p>«Однажды жена рабби Ханины бен Досы\nсказала ему:<\/p>", "<p>— До каких пор мы будем жить в таких\nстраданиях?<\/p>", "<p>Он ответил ей:<\/p>", "<p>— Что же нам делать?<\/p>", "<p>Она сказала:<\/p>", "<p>— Помолись о милосердии, чтобы тебе\nдали что-нибудь.<\/p>", "<p>Он помолился, и появилось подобие\nчеловеческой руки, которая протянула\nему одну золотую ножку от стола.<\/p>", "<p>Затем он увидел во сне, что все праведники\nедят за золотыми столами на трёх ножках,\nа он — за столом, у которого только две\nножки.<\/p>", "<p>Он сказал жене:<\/p>", "<p>— Разве тебе будет приятно, если все\nправедники будут есть за столами на\nтрёх ножках, а мы будем есть за столом,\nу которого недостаёт одной ножки?<\/p>", "<p>Она ответила:<\/p>", "<p>— Что же нам делать?<\/p>", "<p>Он сказал:<\/p>", "<p>— Помолись, чтобы её забрали обратно.<\/p>", "<p>Он помолился, и золотую ножку забрали.<\/p>", "<p>Учили мудрецы: последнее чудо было\nбольше первого, поскольку существует\nпредание, что с Небес дают, но обратно\nне забирают».<\/p>", "<p>Однако возникает вопрос.<\/p>", "<p>Почему, когда рабби Ханине дали золотую\nножку от стола, то есть благо этого мира,\nему показали с Небес, что за это у него\nотнимают золотую ножку от благ Мира\nгрядущего?<\/p>", "<p>Ведь все блага этого мира — сокровища\nзолота, драгоценности и богатства всех\nземных царей — совершенно ничтожны по\nсравнению даже с самой малой частью\nблаг Мира грядущего.<\/p>", "<p>Как сказано в Мишне (Пиркей Авот 4:17):<\/p>", "<p><strong>«Один час духовного наслаждения\nв Мире грядущем лучше всей жизни в этом\nмире».<\/strong><\/p>", "<p>Если так, то каким образом можно\nуменьшать награду в Мире грядущем — в\nмире вечной жизни, бесконечного и\nистинного существования — ради благ\nэтого мира, где жизнь кратковременна и\nпреходяща?<\/p>", "<p>Как можно сопоставлять одно с другим:\nзолотую ножку от вечной жизни и золотую\nножку от жизни временной?<\/p>", "<p>Однако объяснение заключается именно\nв том, о чём мы говорили выше.<\/p>", "<p>Пока рабби Ханина бен Доса говорил,\nчто ему достаточно одного кава рожковых\nплодов от кануна субботы до следующего\nкануна субботы, Всевышний также говорил,\nчто достаточно его трудов в изучении\nТоры и исполнении заповедей.<\/p>", "<p>Поэтому награда рабби Ханины в Мире\nгрядущем была чрезвычайно велика.<\/p>", "<p>Но когда он начал просить у Всевышнего\nблаг этого мира, поскольку одного кава\nрожковых плодов ему стало недостаточно,\nтогда Всевышний сказал, что и труды\nрабби Ханины в изучении Торы и исполнении\nзаповедей недостаточны.<\/p>", "<p>И потому ему показали с Небес, что его\nнаграда в Мире грядущем уменьшилась.<\/p>", "<p>Эта история служит нравственным\nнаставлением для всех людей, чьи глаза\nникогда не насыщаются благами этого\nмира.<\/p>", "<p>Как сказано (Коэлет 5:9):<\/p>", "<p><strong>«Любящий серебро не насытится\nсеребром...»<\/strong><\/p>", "<p>И сказали наши мудрецы (Коэлет Рабба,\nглава 1):<\/p>", "<p>«Ни один человек не уходит из этого\nмира, исполнив хотя бы половину своих\nжеланий.<\/p>", "<p>Если у него есть сто, он хочет двести.<\/p>", "<p>А если у него есть двести, он хочет\nчетыреста» — и так далее.<\/p>", "<p>Есть люди, которые всю жизнь жалуются,\nговоря:<\/p>", "<p>«Мне плохо! Зачем мне такая жизнь?»<\/p>", "<p>Ведь из-за своих многочисленных\nжеланий, стремления к богатству и зависти\nвсё, чем они обладают, кажется им малым\nи плохим.<\/p>", "<p>Пусть же они обратят на это внимание\nи задумаются: какой мерой они мерят,\nтакой мерой отмерят и им.<\/p>", "<p>И в ответ на их жалобы Всевышний скажет:<\/p>", "<p>«Плохи его дела! Зачем Мне даровать\nему жизнь в Мире грядущем?»<\/p>", "<p>И в этом заключается смысл слов Писания\n(Мишлей 28:22):<\/p>", "<p><strong>«Спешит к богатству человек с\nдурным глазом и не знает, что нужда\nпостигнет его».<\/strong><\/p>", "<p>«Человек с дурным глазом», глядя на\nвсе блага, которыми обладают другие\nлюди, «спешит» умножить своё богатство.<\/p>", "<p>Но он не задумывается и не понимает,\nчто «нужда постигнет его».<\/p>", "<p>Ведь подобно тому как он говорит, что\nему недостаёт имущества и богатства,\nВсевышний скажет, что ему недостаёт\nдобрых дел.<\/p>", "<p>И пусть каждый богобоязненный человек\nпримет это к сердцу.<\/p>", "<p>Когда он обращается к Всевышнему с\nпросьбой даровать ему земные блага,\nпусть не просит слишком многого, поскольку\nтогда и Всевышний потребует от него\nзначительно большего усердия в изучении\nТоры и исполнении заповедей.<\/p>", "<p>И пусть он не говорит, что Всевышний\nдал ему мало и не обеспечил всем\nнеобходимым.<\/p>", "<p>Ведь тогда Всевышний, в свою очередь,\nскажет, что этот человек исполнил мало\nзаповедей и не выполнил всех возложенных\nна него обязанностей.<\/p>", "<h1 class=\"western\" id=\"section-129\"><strong><font size=\"4\">Поведение\nчеловека определяет отношение к нему\nна Небесах<\/font><\/strong><\/h1>", "<p>И именно в этом заключается смысл слов\nнаших мудрецов (Брахот 50а):<\/p>", "<p>«По благословениям человека можно\nопределить, является ли он знатоком\nТоры или невеждой.<\/p>", "<p>Каким образом?<\/p>", "<p>Рабби говорит:<\/p>", "<p>Тот, кто произносит в благословении\nперед совместной благодарственной\nмолитвой после еды: \"И благостью Его\nмы живём\", — является знатоком Торы.<\/p>", "<p>А тот, кто говорит: \"И частью благости\nЕго\", — невежда».<\/p>", "<p>Раши объясняет:<\/p>", "<p>«Поскольку он умаляет благодеяния\nВсевышнего, словно речь идёт лишь о\nнебольшой части благ, достаточной для\nподдержания жизни».<\/p>", "<p>Авней спросил рава Дими:<\/p>", "<p>— Но ведь написано (Шмуэль II, 7:29):<\/p>", "<p>«И от благословения Твоего да будет\nблагословен дом раба Твоего навеки».<\/p>", "<p>Здесь употребляется выражение «от\nблагословения Твоего», то есть лишь\nчасть благословения!<\/p>", "<p>Ответил рав Дими:<\/p>", "<p>— Когда человек обращается с просьбой,\nдело обстоит иначе.<\/p>", "<p>Ведь просящий подобен бедняку, стоящему\nу дверей: он не осмеливается поднять\nголову и просить слишком многого.<\/p>", "<p>Но тогда возникает другой вопрос:<\/p>", "<p>— Ведь и о просьбе сказано (Теилим\n81:11):<\/p>", "<p>«Широко раскрой уста твои, и Я наполню\nих».<\/p>", "<p>То есть проси всего, чего желаешь!<\/p>", "<p>На это ответили:<\/p>", "<p>— Этот стих относится к изучению Торы.<\/p>", "<p>Однако возникает затруднение.<\/p>", "<p>Зачем нам определять по благословениям\nчеловека, является ли он знатоком Торы\nили невеждой?<\/p>", "<p>Достаточно принести книгу и проверить\nего знания!<\/p>", "<p>Если он способен отвечать на вопросы\nпо Торе, значит, он знаток Торы, даже\nесли произносит «от благости Его».<\/p>", "<p>А если он совершенно ничего не знает\nв Торе, значит, он невежда, даже если\nпроизносит «благостью Его».<\/p>", "<p>Однако наши мудрецы хотели научить\nнас определять, каким человек считается\nперед благословенным Всевышним, Творцом\nвсех миров.<\/p>", "<p>Если человек говорит <strong>«благостью\nЕго»<\/strong>, значит, он радуется своей\nдоле, которую дал ему Всевышний, и\nпризнаёт, что Всевышний даровал ему все\nблага.<\/p>", "<p>Тогда и Всевышний, в свою очередь,\nсловно говорит: «Благостью его».<\/p>", "<p>Иными словами, Всевышний как бы радуется\nтой доле, которую человек уделил Ему, и\nговорит, что человек дал Ему всё благо\n— то есть Тору.<\/p>", "<p>Поэтому такой человек считается\nзнатоком Торы.<\/p>", "<p>Но если человек говорит <strong>«от\nблагости Его»<\/strong>, значит, он недоволен\nсвоей долей, которую дал ему Всевышний,\nи считает, что получил лишь небольшую\nчасть благ.<\/p>", "<p>Тогда и Всевышний, в свою очередь,\nсловно говорит: «От благости его».<\/p>", "<p>То есть Он как бы выражает недовольство\nтой долей, которую человек уделил Ему,\nи говорит, что человек дал Ему лишь малую\nчасть блага — то есть Торы.<\/p>", "<p>Поэтому такой человек считается\nневеждой.<\/p>", "<p>А слова <strong>«Когда человек обращается\nс просьбой, дело обстоит иначе»<\/strong>\nозначают, что человеку следует просить\nу Всевышнего лишь немного земных благ.<\/p>", "<p>Тогда и Всевышний будет требовать от\nнего лишь немного благого — то есть\nизучения Торы и добрых дел.<\/p>", "<p>Но когда речь идёт <strong>об изучении\nТоры<\/strong>, которым человек обязан\nзаниматься, изучая и обучая, соблюдая\nи исполняя, — во всём этом человек\nникогда не должен говорить: «Достаточно».<\/p>", "<p>Пусть он не говорит:<\/p>", "<p>«Я уже много учился и обучал, много\nсоблюдал и исполнял».<\/p>", "<p>Напротив, пусть он сокрушается в сердце\nсвоём, что изучил и преподал совсем\nмало, что недостаточно соблюдал и\nисполнял.<\/p>", "<p>И пусть просит у Всевышнего помощи,\nчтобы укрепиться в изучении Торы и\nусерднее совершать добрые дела.<\/p>", "<p>И чем больше человек будет сокрушаться,\nговоря:<\/p>", "<p>«Я совершил мало добра, мало изучал\nТору и мало совершил добрых дел», —<\/p>", "<p>тем больше Всевышний, в свою очередь,\nбудет говорить:<\/p>", "<p>«Я сделал мало добра этому человеку».<\/p>", "<p>И тогда Он прибавит ему благ.<\/p>", "<p>Ведь это великое правило:<\/p>", "<p><strong>«Какой мерой человек мерит, такой\nмерой отмеряют ему».<\/strong><\/p>"]}, {"title": "МАХАЗЕ XI", "body": ["<h2 class=\"western\" id=\"section-130\"><font size=\"6\"><strong>МАХАЗЕ\nX<\/strong><strong><span lang=\"en-US\">I<\/span><\/strong><\/font><\/h2>", "<h1 class=\"western\" id=\"section-131\"><strong><font size=\"4\">Ещё\nо достоинстве человека, радующегося\nсвоей доле<\/font><\/strong><\/h1>", "<h1 class=\"western\" id=\"section-132\"><strong><font size=\"4\">Тот,\nкто питается плодами собственного\nтруда, выше богобоязненного человека<\/font><\/strong><\/h1>", "<p>В книге Теилим сказано (128:2):<\/p>", "<p><strong>«Когда будешь есть от трудов рук\nтвоих, счастлив ты, и благо тебе».<\/strong><\/p>", "<p>И сказал рабби Хия бар Ами от имени\nУлы (Брахот 8а):<\/p>", "<p>«Выше тот, кто пользуется плодами\nсобственного труда, чем богобоязненный\nчеловек.<\/p>", "<p>Ведь о богобоязненном сказано (Теилим\n112:1):<\/p>", "<p>\"Счастлив человек, боящийся Господа\".<\/p>", "<p>А о том, кто пользуется плодами\nсобственного труда, сказано (Теилим\n128:2):<\/p>", "<p>\"Когда будешь есть от трудов рук\nтвоих, счастлив ты, и благо тебе\".<\/p>", "<p>\"Счастлив ты\" — в этом мире, \"и\nблаго тебе\" — в Мире грядущем.<\/p>", "<p>А о богобоязненном человеке слова \"и\nблаго тебе\" не написаны».<\/p>", "<p>И вот уже многие мудрецы и знатоки\nТоры трудились над объяснением этого\nвысказывания.<\/p>", "<p>Ведь кажется чрезвычайно удивительным\nутверждать, что человек, который питается\nплодами собственного труда, но не\nобладает богобоязненностью, выше\nбогобоязненного человека, который\nпользуется помощью других людей.<\/p>", "<p>Разве наши мудрецы не сказали (Брахот\n10б):<\/p>", "<p>«Кто желает пользоваться помощью\nдругих, пусть пользуется, подобно Элише.\nА кто не желает пользоваться помощью\nдругих, пусть не пользуется, подобно\nШмуэлю из Рамы».<\/p>", "<p>Однако на основании сказанного выше\n(глава 10) это высказывание становится\nсовершенно понятным.<\/p>", "<h1 class=\"western\" id=\"section-133\"><strong><font size=\"4\">Как\nчеловек оценивает своё положение<\/font><\/strong><\/h1>", "<p>А теперь, с помощью благословенного\nВсевышнего, рассмотрим четыре вида\nотношения людей к своей жизни и поступкам.<\/p>", "<p><strong>1. Человек, радующийся деяниям\nВсевышнего и огорчающийся собственными\nпоступками.<\/strong><\/p>", "<p>Он радуется деяниям Всевышнего, то\nесть доволен своей долей, которую дал\nему Господь, будь она большой или малой,\nхорошей или плохой (см. Брахот 54а, 60б;\nТаанит 21а; Йома 23а).<\/p>", "<p>Но он огорчается собственными поступками\nв вопросах богобоязненности, которые\nзависят от самого человека.<\/p>", "<p>Как сказали наши мудрецы (Брахот 33б):<\/p>", "<p>«Всё в руках Небес, кроме страха перед\nНебесами».<\/p>", "<p>Как сказано (Дварим 10:12):<\/p>", "<p>«А теперь, Израиль, чего Господь, Бог\nтвой, требует от тебя, кроме того, чтобы\nты боялся Его...»<\/p>", "<p>«Сердце его тревожится внутри него»\n(Хагига 13а), и он говорит:<\/p>", "<p>«Как велико милосердие Всевышнего ко\nмне! Но как же мало моих добрых дел!»<\/p>", "<p>Ведь «всё, что делает Милосердный, —\nк добру» (Брахот 60б), однако то, что делает\nсам человек, далеко не всегда хорошо.<\/p>", "<p><strong>2. Человек, радующийся собственным\nпоступкам и огорчающийся деяниями\nВсевышнего.<\/strong><\/p>", "<p>Он доволен собственными поступками\nв вопросах богобоязненности и говорит,\nчто совершил чрезвычайно много добрых\nдел.<\/p>", "<p>Но он недоволен деяниями Всевышнего,\nогорчается своей долей, которую дал ему\nГосподь, и говорит, что Всевышний даровал\nему плохую участь.<\/p>", "<p><strong>3. Человек, радующийся и деяниям\nВсевышнего, и собственным поступкам.<\/strong><\/p>", "<p>Он говорит, что всё, что дал ему\nВсевышний, хорошо и достаточно.<\/p>", "<p>И всё, что он сам делает перед Всевышним,\nтакже хорошо и достаточно.<\/p>", "<p><strong>4. Человек, огорчающийся и деяниями\nВсевышнего, и собственными поступками.<\/strong><\/p>", "<p>Он говорит, что его поступки перед\nВсевышним малочисленны и плохи и что\nВсевышний также даровал ему плохую\nдолю.<\/p>", "<h1 class=\"western\" id=\"section-134\"><strong><font size=\"4\">Какое\nкачество является самым достойным?<\/font><\/strong><\/h1>", "<p>А теперь вернёмся к этим четырём\nкатегориям и задумаемся.<\/p>", "<p>Тот, кто радуется деяниям Всевышнего\nи огорчается собственными поступками,\n— праведник.<\/p>", "<p>Тот, кто огорчается деяниями Всевышнего\nи радуется собственным поступкам, —\nнечестивец. (По этому вопросу см.\nкомментарий Рана к Недарим 9б.)<\/p>", "<p>Тот, кто радуется и деяниям Всевышнего,\nи собственным поступкам, является\nправедником в одном отношении: он доволен\nсвоей долей, которую дал ему Господь.<\/p>", "<p>Но в другом отношении он нечестивец,\nпоскольку доволен собственными поступками\nи говорит, что его дела перед Всевышним\nмногочисленны и хороши.<\/p>", "<p>Тот же, кто огорчается и деяниями\nВсевышнего, и собственными поступками,\nявляется нечестивцем в одном отношении:\nон недоволен своей долей, которую дал\nему Господь.<\/p>", "<p>Но в другом отношении он праведник,\nпоскольку огорчается собственными\nпоступками и говорит, что его добрых\nдел перед Всевышним мало и что они\nнедостаточно хороши.<\/p>", "<p>И нам следует исследовать и выяснить:\nкто из этих двух людей выше другого?<\/p>", "<p>Многие полагают, что человек, огорчающийся\nи деяниями Всевышнего, и собственными\nпоступками, выше того, кто радуется и\nдеяниям Всевышнего, и собственным\nпоступкам.<\/p>", "<p>Ведь почему достоинство человека\nдолжно умаляться из-за того, что он\nпросит у Всевышнего даровать ему ещё\nбольше всевозможных благ?<\/p>", "<p>К тому же такой человек обладает\nбольшим достоинством: он недоволен\nсобственными поступками и поэтому с\nещё большим усердием продолжает исполнять\nзаповеди и совершать добрые дела.<\/p>", "<p>Именно так думают многие люди.<\/p>", "<h1 class=\"western\" id=\"section-135\"><strong><font size=\"4\">Тот,\nкто радуется своей доле, выше богобоязненного\nчеловека<\/font><\/strong><\/h1>", "<p>Поэтому рабби Хия бар Аба от имени Улы\nпришёл научить нас, что это не так.<\/p>", "<p>Напротив, <strong>«выше тот, кто пользуется\nплодами собственного труда»<\/strong>, то\nесть человек, радующийся своей доле,\nкоторую дал ему Всевышний, даже если\nэта доля тяжела и горька и ему приходится\nтрудиться в поте лица ради куска хлеба,\nкоторый он ест.<\/p>", "<p>И хотя такой человек доволен собственными\nпоступками в вопросах богобоязненности,\nон всё же выше богобоязненного человека,\nкоторый огорчается своими поступками\nв вопросах служения Всевышнему, но не\nдовольствуется плодами собственного\nтруда и не радуется своей доле, которую\nдал ему Господь.<\/p>", "<p>Ведь <strong>«какой мерой человек мерит,\nтакой мерой отмеряют ему»<\/strong> (Сота\n8б).<\/p>", "<p>«Господь — тень твоя»: как ты относишься\nк Нему, так и Он относится к тебе (Мидраш\nТеилим 121).<\/p>", "<p>Поэтому, если человек радуется своей\nдоле, которую дал ему Всевышний, и\nговорит, что ему достаточно, тогда и\nВсевышний, в свою очередь, будет доволен\nпоступками этого человека и скажет, что\nсделанного им достаточно.<\/p>", "<p>Но если человек огорчается своей\nдолей, которую дал ему Всевышний, и\nговорит, что получил слишком мало и что\nему плохо, тогда и Всевышний, в свою\nочередь, будет недоволен поступками\nэтого человека и скажет, что его добрых\nдел мало и что они недостаточно хороши.<\/p>", "<p>Именно об этом сказано в Мишне (Пиркей\nАвот 4:1):<\/p>", "<p><strong>«Кто богат? Тот, кто радуется своей\nдоле, как сказано (Теилим 128:2): \"Когда\nбудешь есть от трудов рук твоих, счастлив\nты, и благо тебе\". \"Счастлив ты\"\n— в этом мире, \"и благо тебе\" — в\nМире грядущем».<\/strong><\/p>", "<p>Счастлив он в этом мире, потому что\nрадуется своей доле и не желает большего,\nчем имеет.<\/p>", "<p>И благо ему в Мире грядущем, поскольку\nон радуется своей доле, которую дал ему\nВсевышний, и говорит: «Достаточно».<\/p>", "<p>Поэтому и Всевышний скажет, что\nдостаточно тех заповедей, которые он\nисполнил, и его награда в Мире грядущем\nбудет чрезвычайно велика.<\/p>", "<p>А ведь нет богатства, подобного\nбогатству Мира грядущего.<\/p>", "<p>Поэтому нет человека богаче того, кто\nрадуется своей доле: он богат в этом\nмире и богат в Мире грядущем.<\/p>", "<p>И нет человека беднее того, кто недоволен\nсвоей долей.<\/p>", "<p>Он беден в этом мире, поскольку не\nимеет всего, чего желает. Все его дни\nнаполнены гневом и страданиями, ведь\nон постоянно чего-то жаждет, но не\nполучает желаемого.<\/p>", "<p>И плохо ему будет в Мире грядущем.<\/p>", "<p>Ведь подобно тому как он недоволен\nсвоей долей, которую дал ему Всевышний,\nи говорит, что получил мало и что ему\nплохо, так и Всевышний скажет, что\nзаповедей, исполненных этим человеком,\nмало и что они недостаточно хороши.<\/p>", "<p>Поэтому его награда в Мире грядущем\nбудет мала.<\/p>", "<p>А ведь нет бедности, подобной бедности\nв Мире грядущем.<\/p>", "<p>Ибо это великое правило:<\/p>", "<p><strong>«Какой мерой человек мерит, такой\nмерой отмеряют ему».<\/strong><\/p>", "<p>И так сказал сладкоголосый певец\nИзраиля (Теилим 18:26–27):<\/p>", "<p>«С милостивым Ты поступаешь милостиво,\nс человеком непорочным — непорочно. С\nчистым Ты поступаешь чисто, а с лукавым\n— по его лукавству».<\/p>", "<h1 class=\"western\" id=\"section-136\"><strong><font size=\"4\">Святой,\nблагословен Он, проявляет особое\nблаговоление к Израилю<\/font><\/strong><\/h1>", "<p>На основании всех этих истинных и\nсправедливых слов мы сможем раскрыть\nсокровенный смысл высказывания наших\nмудрецов (Брахот 20б):<\/p>", "<p>«Рав Авира объяснял, иногда от имени\nрабби Ами, а иногда от имени рабби Аси:<\/p>", "<p>Ангелы-служители сказали Святому,\nблагословен Он:<\/p>", "<p>— Владыка мира! Ведь в Твоей Торе\nнаписано (Дварим 10:17): \"Который не\nлицеприятствует и не берёт взяток\".<\/p>", "<p>Однако Ты проявляешь особое благоволение\nк Израилю, как сказано (Бемидбар 6:26): \"Да\nобратит Господь Лик Свой к тебе\".<\/p>", "<p>Он ответил им:<\/p>", "<p>— Как же Мне не проявлять особого\nблаговоления к Израилю, если Я написал\nдля них в Торе (Дварим 8:10): \"И будешь\nесть, и насытишься, и благословишь...\",\nа они настолько строги к себе, что\nпроизносят благословение после еды\nдаже за съеденное в количестве размером\nс маслину или с яйцо?»<\/p>", "<p>Однако это высказывание непонятно.<\/p>", "<p>Ведь всякий, кто проявляет к кому-либо\nособое благоволение, делает это по\nкакой-то причине.<\/p>", "<p>Но о Всевышнем написано: «Который не\nлицеприятствует».<\/p>", "<p>Если так, то что означает Его ответ\nангелам-служителям:<\/p>", "<p>«Как же Мне не проявлять особого\nблаговоления к Израилю, если Я написал\nдля них в Торе: \"И будешь есть...\", а\nони настолько строги к себе...»?<\/p>", "<p>Ведь первоначальный вопрос остаётся\nбез ответа: разве Ты не проявляешь\nособого благоволения к Израилю?<\/p>", "<p>Кроме того, почему за все заповеди,\nизложенные в Торе, и за все дополнительные\nстрогости, которые народ Израиля\nдобровольно принимает на себя, он не\nудостаивается такого благоволения, а\nудостаивается его именно за то, что люди\nпроизносят благословение после еды,\nсъев количество пищи размером с маслину\nили с яйцо?<\/p>", "<p>И ещё одно затруднение.<\/p>", "<p>Авторы Тосафот уже писали (Рош а-Шана\n17б, комментарий «Ашер»; Нида 70б, комментарий\n«Катув»), что при буквальном понимании\nстихов здесь вообще нет противоречия.<\/p>", "<p>Ведь слова <strong>«Который не лицеприятствует»<\/strong>\nотносятся к человеческому лицу: Всевышний\nне оказывает человеку предпочтения\nиз-за его высокого положения.<\/p>", "<p>А слова <strong>«Да обратит Господь Лик\nСвой к тебе»<\/strong> относятся к Лику\nБожественного присутствия и означают,\nчто Всевышний явит человеку приветливый,\nулыбающийся Лик, а не Лик, выражающий\nгнев.<\/p>", "<p>Неужели ангелы-служители не знали\nпростого смысла стихов?<\/p>", "<p>И почему Всевышний ответил им: «Как\nже Мне не проявлять особого благоволения...»\n— вместо того чтобы объяснить им\nбуквальный смысл Писания?<\/p>", "<h1 class=\"western\" id=\"section-137\"><strong><font size=\"4\">Достоинство\nчеловека, который радуется и благодарит\nдаже за малое<\/font><\/strong><\/h1>", "<p>И действительно, слова Писания <strong>«Да\nобратит Господь Лик Свой к тебе...»<\/strong>\nотносятся к Миру грядущему.<\/p>", "<p>Наши мудрецы сказали (Брахот 17а):<\/p>", "<p>«В Мире грядущем нет ни еды, ни питья...\nНо праведники сидят с венцами на головах\nи наслаждаются сиянием Божественного\nприсутствия, как сказано (Шмот 24:11): \"И\nсозерцали они Бога\"».<\/p>", "<p>И в этом заключается смысл слов Писания:\n«Да обратит Господь Лик Свой к тебе»,\nто есть приблизит Свой Лик к тебе, чтобы\nты наслаждался сиянием Его Божественного\nприсутствия.<\/p>", "<p>Ведь чем ближе Всевышний, если можно\nтак выразиться, находится к человеку,\nтем сильнее наслаждение светом Его Лика\nи сиянием Шхины.<\/p>", "<p>И если Всевышний приблизит Свой Лик\nк человеку, разве не достигнет тогда\nэто наслаждение наивысшей степени?<\/p>", "<p>Именно об этом спросили ангелы-служители.<\/p>", "<p>Ведь среди сынов Израиля нет ни одного\nчеловека, который исполнил бы волю\nВсевышнего совершенно безупречно, как\nсказано (Коэлет 7:20):<\/p>", "<p>«Ибо нет на земле праведного человека,\nкоторый делал бы добро и не грешил».<\/p>", "<p>Если так, почему Всевышний дарует им\nнаграду в Мире грядущем без малейшего\nуменьшения?<\/p>", "<p>Очевидно, лишь потому, что Он проявляет\nк ним особое благоволение.<\/p>", "<p>Именно это имели в виду ангелы-служители,\nкогда сказали:<\/p>", "<p>«В Твоей Торе написано: \"Который не\nлицеприятствует...\", но ведь Ты\nпроявляешь особое благоволение к\nИзраилю, как сказано: \"Да обратит\nГосподь Лик Свой к тебе\"».<\/p>", "<p>То есть в Мире грядущем Ты даруешь им\nвысочайшее благо.<\/p>", "<p>Но разве они заслуживают этого? Разве\nони исполнили волю Всевышнего в этом\nмире в полной мере?<\/p>", "<p>На это Он ответил им:<\/p>", "<p>«Как же Мне не проявлять особого\nблаговоления к Израилю, если Я написал\nдля них в Торе: \"И будешь есть, и\nнасытишься, и благословишь...\", а они\nнастолько строги к себе, что произносят\nблагословение даже за количество пищи\nразмером с маслину или с яйцо?»<\/p>", "<p>Однако здесь возникает вопрос.<\/p>", "<p>Как они могут произносить благословение,\nесли не насытились?<\/p>", "<p>Ведь в Писании сказано: «И будешь есть,\nи насытишься, и благословишь».<\/p>", "<p>Если же мы скажем, что разрешено\nблагословлять и без насыщения, почему\nтогда не благословляют даже за количество\nпищи меньше маслины?<\/p>", "<p>Почему, в действительности, запрещено\nпроизносить благословение за количество\nпищи меньше маслины?<\/p>", "<p>Потому что в Писании прямо сказано:\n«И будешь есть... и благословишь», а\nупотреблением пищи в пищу не считается\nколичество меньше маслины.<\/p>", "<p>И всякий, кто произносит ненужное\nблагословение, нарушает запрет «Не\nпроизноси напрасно Имени...» (Брахот\n33а).<\/p>", "<p>Если так, то почему разрешено\nблагословлять даже за количество\nразмером с маслину?<\/p>", "<p>Ведь сказано: «И будешь есть, и\nнасытишься, и благословишь», а они не\nнасытились.<\/p>", "<p>Объяснение заключается в том, что они\nочищают свою материальную природу и\nизменяют свои естественные потребности,\nговоря, что им достаточно количества\nпищи размером с маслину или с яйцо и что\nэтим они вполне довольны.<\/p>", "<p>Как объясняется в святой книге «Зоар»,\nглава Трума (153б):<\/p>", "<p>«Начал рабби Хия и сказал:<\/p>", "<p>\"И будешь есть, и насытишься, и\nблагословишь Господа, Бога твоего...\"<\/p>", "<p>Разве до тех пор, пока человек не поест\nдосыта и не наполнит свой желудок, он\nне должен благословлять Святого,\nблагословен Он?<\/p>", "<p>Если так, как следует понимать слова\nПисания: \"И будешь есть, и насытишься\",\nа затем \"и благословишь\"?<\/p>", "<p>Однако даже если человек съел всего\nлишь количество пищи размером с маслину,\nно он доволен этим и считает эту пищу\nсвоим основным пропитанием, это называется\nнасыщением.<\/p>", "<p>Ведь сказано (Теилим 145:16):<\/p>", "<p>\"Открываешь Ты руку Свою и насыщаешь\nвсё живое по желанию\".<\/p>", "<p>Не написано: \"Даёшь всякому живому\nпищу\", но сказано: \"По желанию\".<\/p>", "<p>Именно довольство той пищей, которую\nчеловек получил, называется насыщением.<\/p>", "<p>И даже если перед человеком находится\nлишь небольшое количество пищи размером\nс маслину и ничего больше, но он доволен\nэтим, такое состояние считается\nнасыщением.<\/p>", "<p>Поэтому сказано: \"И насыщаешь всё\nживое по желанию\".<\/p>", "<p>Написано именно \"по желанию\", а\nне \"пищей\".<\/p>", "<p>И потому сказано: \"И благословишь\".<\/p>", "<p>Человек обязан благословлять Святого,\nблагословен Он, чтобы доставить радость\nв высших мирах».<\/p>", "<p>(Перевод: Разве до тех пор, пока человек\nне поест досыта и не наполнит свой\nжелудок, он не должен благословлять\nСвятого, благословен Он? Если так, как\nследует понимать слова стиха «И будешь\nесть, и насытишься», а затем «и\nблагословишь»?<\/p>", "<p>Однако даже если человек съест лишь\nколичество пищи размером с маслину, но\nбудет доволен этим и сочтёт эту пищу\nсвоим основным пропитанием, это называется\nнасыщением.<\/p>", "<p>Как сказано: «Открываешь Ты руку Свою\nи насыщаешь всё живое по желанию».<\/p>", "<p>Не написано «всё живое пищей», но\nсказано «по желанию».<\/p>", "<p>То довольство, которое человек\nиспытывает от полученной пищи, называется\nнасыщением, даже если перед ним находится\nлишь небольшое количество пищи размером\nс маслину и ничего больше.<\/p>", "<p>Ведь он испытывает удовлетворение и\nсытость от неё.<\/p>", "<p>Поэтому сказано: «И насыщаешь всё\nживое по желанию».<\/p>", "<p>Написано «по желанию», а не «пищей».<\/p>", "<p>И об этом сказано: «И благословишь».<\/p>", "<p>И человек обязан благословлять Святого,\nблагословен Он, чтобы доставить радость\nв высших мирах.)<\/p>", "<p>Поэтому, когда сыны Израиля довольны\nсвоей долей и говорят, что им достаточно\nтого количества хлеба размером с маслину,\nкоторое дал им Всевышний, тогда и\nВсевышний, в свою очередь, скажет, что\nвсех совершённых ими добрых дел достаточно\nи что им полагается полная награда в\nМире грядущем.<\/p>", "<p>Именно это означают слова святого\n«Зоара»:<\/p>", "<p><strong>«И человек обязан благословлять\nСвятого, благословен Он, чтобы доставить\nрадость в высших мирах».<\/strong><\/p>", "<p>То есть человек должен благословлять\nза количество пищи размером с маслину\nили с яйцо и говорить: «Достаточно».<\/p>", "<p>И это — «чтобы доставить радость в\nвысших мирах».<\/p>", "<p>Ведь в ответ Всевышний будет доволен\nпоступками человека и скажет, что их\nдостаточно.<\/p>", "<p>Мера за меру.<\/p>", "<h1 class=\"western\" id=\"section-138\"><strong><font size=\"4\">Довольствующийся\nмалым будет чувствовать насыщение, а\nжаждущий большего всегда будет испытывать\nнедостаток<\/font><\/strong><\/h1>", "<p>На основании сказанного становится\nпонятным стих (Мишлей 13:25):<\/p>", "<p><strong>«Праведник ест до насыщения души\nсвоей, а чрево нечестивых испытывает\nнедостаток».<\/strong><\/p>", "<p>«Праведник» — это человек, который\nбоится Всевышнего и исполняет Его волю.<\/p>", "<p>Он доволен тем, что дал ему Господь, и\nговорит, что Всевышний даровал ему\nдостаточно.<\/p>", "<p>И не только во всём, что находится вне\nего тела, — в серебре, золоте и всевозможных\nсокровищах мира — он говорит: «Мне\nдостаточно».<\/p>", "<p>Даже в том, что касается потребностей\nсамого тела, он говорит: «Достаточно».<\/p>", "<p>Он ест минимальное количество пищи,\nсчитающееся едой, — размером с маслину,\n— и этого хватает «для насыщения его\nдуши», то есть для удовлетворения его\nжелания.<\/p>", "<p>Как сказано (Дварим 23:25):<\/p>", "<p>«И можешь есть виноград по желанию\nсвоему, досыта».<\/p>", "<p>Раши объясняет слова «по желанию\nсвоему» — сколько пожелаешь.<\/p>", "<p>Ведь праведник доволен даже количеством\nпищи размером с маслину.<\/p>", "<p>А «нечестивые», нарушающие волю\nВсевышнего, не довольны тем, что Он им\nдаёт, и говорят, что Всевышний не\nобеспечивает их всем необходимым.<\/p>", "<p>И не только во всём, что находится вне\nих тела, они считают себя обделёнными.<\/p>", "<p>Даже в отношении потребностей\nсобственного тела они говорят, что им\nнедостаточно.<\/p>", "<p><strong>«Чрево нечестивых испытывает\nнедостаток»<\/strong> — им постоянно недостаёт\nпищи (см. комментарий Ибн Эзры).<\/p>", "<p>И никогда их желудок не бывает насыщен.<\/p>", "<p>Но ведь, на первый взгляд, у желудка\nесть определённая вместимость.<\/p>", "<p>Если человек съел меньше необходимого\nколичества, желудок ещё не наполнен, а\nсверх определённого количества он уже\nне способен принять пищу.<\/p>", "<p>Поэтому, согласно обычному человеческому\nпониманию, желудок праведника и желудок\nнечестивца устроены одинаково.<\/p>", "<p>Желудок праведника не должен насыщаться\nменьшим количеством пищи, а желудок\nнечестивца не должен требовать всё\nбольше и больше сверх своей вместимости.<\/p>", "<p>Однако мудрейший из людей учит нас,\nчто даже в отношении желудка праведник\nговорит: «Достаточно», получив совсем\nнемного.<\/p>", "<p>А нечестивец говорит: «Недостаточно»,\nдаже получив чрезвычайно много.<\/p>", "<h1 class=\"western\" id=\"section-139\"><strong><font size=\"4\">В\nслужении Всевышнему всегда следует\nстремиться к большему<\/font><\/strong><\/h1>", "<p>Итак, праведник достоин похвалы в двух\nотношениях.<\/p>", "<p>В том, что касается <strong>богобоязненности<\/strong>,\nон стремится всё больше соблюдать\nзаповеди и совершать добрые дела.<\/p>", "<p>А в том, что касается <strong>«всё в руках\nНебес»<\/strong>, он старается получать от\nВсевышнего как можно меньше и говорит:\n«Достаточно, достаточно».<\/p>", "<p>Нечестивец же заслуживает порицания\nв двух отношениях.<\/p>", "<p>В том, что касается богобоязненности,\nон делает мало.<\/p>", "<p>А в том, что касается всего находящегося\nв руках Небес, он желает получать от\nВсевышнего как можно больше и постоянно\nговорит: «Дай, дай!»<\/p>", "<p>На основании сказанного становится\nпонятным стих (Мишлей 4:1–2):<\/p>", "<p><strong>«Слушайте, дети, наставление отца\nи внимайте, чтобы познать разумение.\nИбо доброе учение Я дал вам, Торы Моей\nне оставляйте».<\/strong><\/p>", "<p>Ведь так говорит Всевышний сынам\nИзраиля:<\/p>", "<p><strong>Во-первых: «Доброе учение Я дал\nвам».<\/strong><\/p>", "<p>Всё, что Я дал вам, будь то доброе или\nдурное, принимайте с радостью и говорите,\nчто это хорошо.<\/p>", "<p>Ведь даже то, что кажется дурным, в\nконечном итоге окажется благом.<\/p>", "<p>Поэтому сказано: «Доброе учение» —\nвсё, что Я дал вам, принимайте как добро.<\/p>", "<p><strong>Во-вторых: «Торы Моей не оставляйте».<\/strong><\/p>", "<p>Укрепляйтесь и прилагайте усилия,\nвсегда считая, что всего, что вы делаете\nв служении Всевышнему, ещё недостаточно.<\/p>"]}, {"title": "МАХАЗЕ XII", "body": ["<h2 class=\"western\" id=\"section-140\"><font size=\"6\"><strong>МАХАЗЕ\nX<\/strong><strong><span lang=\"en-US\">II<\/span><\/strong><\/font><\/h2>", "<h1 class=\"western\" id=\"section-141\"><strong><font size=\"4\">Спасение\nот борьбы с дурным началом — только\nпосредством оберегания глаз<\/font><\/strong><\/h1>", "<h1 class=\"western\" id=\"section-142\"><strong><font size=\"4\">Кто\nтакой «человек, искусный в своём деле»?<\/font><\/strong><\/h1>", "<p>Да будет благословенно Имя Всевышнего,\nКоторый просветил наши глаза, чтобы мы\nмогли ясно увидеть истину в вопросе о\nзрении и взглядах человека, объяснить\nэту тему и связанные с ней вопросы.<\/p>", "<p>Теперь вернёмся к разъяснению стиха\n(Мишлей 22:29), чтобы разрешить затруднения,\nпоставленные в начале книги:<\/p>", "<p><strong>«Видел ли ты человека, искусного\nв своём деле? Перед царями он предстанет,\nне будет стоять перед людьми незнатными».<\/strong><\/p>", "<p>И мы увидим удивительные вещи, ибо всё\nэто уже заключено в словах Писания.<\/p>", "<p>Прежде всего нам необходимо выяснить:\nкто же этот человек, искусный в своём\nделе?<\/p>", "<p>И вот мы приложили усилия и, с помощью\nблагословенного Всевышнего, нашли этого\nчеловека и установили, кто он.<\/p>", "<p>Это — дурное начало.<\/p>", "<p>Ведь наши мудрецы сказали (Сукка 52б):<\/p>", "<p>«Сначала оно названо прохожим» — Раши\nобъясняет: человеком, который проходит\nмимо и не остаётся ночевать.<\/p>", "<p>«Затем оно названо гостем» — то есть\nчеловеком, остановившимся на ночлег.<\/p>", "<p>«А в конце оно названо хозяином», как\nсказано (Шмуэль II, 12:4):<\/p>", "<p>«И пришёл путник к богатому человеку,\nи тот пожалел взять из своих овец и\nкрупного скота, чтобы приготовить\nугощение гостю...»<\/p>", "<p>И далее написано:<\/p>", "<p>«И взял он овечку бедняка и приготовил\nеё для человека, пришедшего к нему».<\/p>", "<h1 class=\"western\" id=\"section-143\"><strong><font size=\"4\">Три\nназвания дурного начала<\/font><\/strong><\/h1>", "<p>Почему у дурного начала есть три\nназвания: прохожий, гость и хозяин?<\/p>", "<p>Когда оно называется прохожим?<\/p>", "<p>Когда это название сменяется другим\nи оно становится гостем?<\/p>", "<p>И когда оно получает третье название\n— хозяин?<\/p>", "<p>Правильное объяснение заключается в\nследующем.<\/p>", "<p>Наши мудрецы сказали (Сота 8а):<\/p>", "<p><strong>«Известно нам из предания, что\nдурное начало властвует лишь над тем,\nчто видят глаза человека».<\/strong><\/p>", "<p>Поэтому сначала дурное начало побуждает\nчеловека смотреть глазами, затем —\nжелать сердцем, а после этого — совершать\nгрех телом.<\/p>", "<p>Именно так объясняет Раши (Бемидбар\n15:39, комментарий к словам «И не следуйте»):<\/p>", "<p><strong>«Глаз видит, сердце желает, а тело\nсовершает грехи».<\/strong><\/p>", "<p>Когда дурное начало побуждает человека\nсмотреть глазами, оно называется\n<strong>«прохожим»<\/strong>, то есть человеком,\nпроходящим мимо.<\/p>", "<p>Ведь оно проводит предмет желания\nперед глазами человека.<\/p>", "<p>Затем, когда оно побуждает человека\nжелать сердцем, оно называется <strong>«гостем»<\/strong>,\nостановившимся на ночлег.<\/p>", "<p>Ведь оно проникает во внутренние покои\nчеловеческого сердца и поселяется там.<\/p>", "<p>А после этого, когда оно побуждает\nчеловека к действию, оно называется\n<strong>«хозяином дома»<\/strong>.<\/p>", "<p>Теперь оно уже приказывает человеку\nдействовать посредством органов тела,\nа человек слушается его и исполняет его\nповеления.<\/p>", "<p>(Подобное объяснение уже приводится\nу Мальбима в комментарии к указанному\nместу книги Шмуэля.)<\/p>", "<h1 class=\"western\" id=\"section-144\"><strong><font size=\"4\">Стремление\nдурного начала — стать господином над\nчеловеком<\/font><\/strong><\/h1>", "<p>И вот конечная цель задумана с самого\nначала.<\/p>", "<p>Когда дурное начало побуждает человека\nсмотреть глазами, его злой замысел\nзаключается в том, чтобы затем склонить\nего к желанию в сердце, а после этого —\nк совершению греха телом.<\/p>", "<p>Так оно стремится подчинить себе\nчеловека и властвовать над ним, как\nгосподин над своим рабом.<\/p>", "<p>Поэтому дурное начало называется <strong>«иш»\n— «господин»<\/strong>.<\/p>", "<p>Как сказано в Мишне (Йома 18б):<\/p>", "<p>«И говорили ему: \"Иши, первосвященник...\"»<\/p>", "<p>Раши объясняет, что слово «иши» означает\n«господин мой».<\/p>", "<p>Ведь конечная цель дурного начала —\nвластвовать над человеком и стать его\nгосподином.<\/p>", "<h1 class=\"western\" id=\"section-145\"><strong><font size=\"4\">Борьба\nс дурным началом тяжелее любой другой\nвойны<\/font><\/strong><\/h1>", "<p>И оно <strong>«искусно в своём деле»<\/strong>\n— в том, чтобы соблазнять всех людей на\nгрех. Оно не прекращает своего занятия\nни на мгновение, днём и ночью воюя с\nкаждым человеком с самого его рождения\nи до дня смерти.<\/p>", "<p>Оно ведёт войну хитростью, поскольку\nпредставляется каждому человеку верным\nдругом, заботящимся о его благе. Оно\nпостоянно обращается к его сердцу и не\nумолкает ни на мгновение.<\/p>", "<p>Оно чрезвычайно сильный и могучий\nвоин, который борется с каждым человеком,\nстремясь повергнуть его и низвергнуть\nв яму погибели.<\/p>", "<p>Оно искусно в войне и возводит мощные\nосадные укрепления (см. Недарим 32б).<\/p>", "<p>И нет войны, подобной войне с дурным\nначалом, как сказано в Мишне (Пиркей\nАвот 4:1):<\/p>", "<p><strong>«Кто силён? Тот, кто побеждает\nсвоё дурное начало, как сказано (Мишлей\n16:32): \"Долготерпеливый лучше могучего,\nи владеющий собой — лучше завоевателя\nгорода\"».<\/strong><\/p>", "<p>И рассказывается в книгах («Ховот\nа-Левавот», раздел «Единство деяния»,\nглава 5) нравоучительная история об\nодном из благочестивых людей прежних\nпоколений.<\/p>", "<p>Однажды он встретил огромное войско:\nмногочисленные отряды, храбрых воинов\nво главе с полководцем. Все они шли с\nликованием, песнями и радостными\nвозгласами.<\/p>", "<p>Он спросил их:<\/p>", "<p>— Чему вы так радуетесь? Почему все\nвы вместе поёте и ликуете?<\/p>", "<p>Они ответили:<\/p>", "<p>— Сегодня мы возвращаемся живыми и\nневредимыми с великой и жестокой войны.\nНаши ненавистники и смертельные враги\nокружили нас со всех сторон. И всё же мы\nодержали над ними победу, полностью\nразгромили их и захватили всю их добычу.\nПоэтому мы поём и ликуем!<\/p>", "<p>Тогда благочестивый человек сказал\nим:<\/p>", "<p>— Вы действительно вернулись сегодня\nс малой войны. Однако впереди вас ожидает\nдругая война, чрезвычайно великая и\nтяжёлая. И кто знает, сумеете ли вы\nпобедить в ней?<\/p>", "<p>Если так, почему вы столь горды и почему\nподнимаете голоса в песнях и ликовании?\nРазве вы не боитесь и не страшитесь той\nвойны, которая ожидает вас впереди?<\/p>", "<p>Все воины рассмеялись и стали насмехаться\nнад ним, говоря:<\/p>", "<p>— Глупый праведник! Что за пустые речи\nты произносишь? Разве ты не знаешь и не\nслышал, что война, в которой мы сражались\nи победили, была величайшей войной на\nземле?<\/p>", "<p>Царь был жесток, народ суров, страна\nнеприступна. Нет войны тяжелее этой!<\/p>", "<p>Что же это за сон тебе приснился, будто\nвсе мы должны вступить в ещё более\nвеликую и жестокую войну?<\/p>", "<p>Где же она? Ведь впереди у нас нет ни\nбольшой, ни малой войны. Во всей нашей\nстране царят мир, покой и безмятежность!<\/p>", "<p>Тогда он ответил им:<\/p>", "<p>— О неразумные, заблудшие, лишённые\nпонимания!<\/p>", "<p>Разве не предстоит вам каждый день, в\nлюбое время и каждый час вести великую\nи тяжёлую войну против дурного начала,\nкоторое обитает внутри вас и пребывает\nв глубине ваших сердец?<\/p>", "<p>Оно направляет против вас огненные\nискры, стрелы и смерть, соблазняет и\nподстрекает вас оставить прямые пути\nи идти дорогами тьмы, покинуть путь\nжизни и низвергнуться в преисподнюю, в\nдолину смертной тени.<\/p>", "<p>Разве эта война не тяжелее всех\nостальных войн?<\/p>", "<p>О многочисленное войско! Как же все\nвы забыли об этой войне?<\/p>", "<p>Придите и рассудим, придите и подсчитаем,\nнасколько война человека со своим дурным\nначалом тяжелее и ожесточённее войны\nодного человека с другим и одного народа\nс другим!<\/p>", "<h1 class=\"western\" id=\"section-146\"><strong><font size=\"4\">Война,\nкоторая начинается без подготовки<\/font><\/strong><\/h1>", "<p><strong>1.<\/strong> На всякой обычной войне\nзаранее назначают время, когда войско\nдолжно выступить в поход.<\/p>", "<p>До этого срока воины готовят оружие\nи всё необходимое для поддержания жизни:\nеду, питьё и прочие припасы, чтобы ни в\nчём не испытывать недостатка.<\/p>", "<p>И только после того, как они подготовятся\nи будут обеспечены всем необходимым\nдля войны, они отправляются сражаться.<\/p>", "<p>Но о войне с дурным началом в Торе\nсказано (Берешит 8:21):<\/p>", "<p><strong>«Ибо помыслы сердца человека злы\nс юности его».<\/strong><\/p>", "<p>И наши мудрецы сказали (Берешит Рабба,\nглава Ноах; Санедрин 91б):<\/p>", "<p>«С того мгновения, когда он начинает\nвыходить из утробы матери».<\/p>", "<p>Таким образом, дурное начало начинает\nвести войну с человеком с самого момента\nего рождения.<\/p>", "<h1 class=\"western\" id=\"section-147\"><strong><font size=\"4\">Война\nбез отдыха<\/font><\/strong><\/h1>", "<p><strong>2.<\/strong> На обычной войне, после\nтого как воины сражаются день или два,\nони прекращают сражение и отдыхают день\nили два.<\/p>", "<p>Но в войне с дурным началом нет отдыха.<\/p>", "<p>Дурное начало сражается днём и ночью\nи не прекращает своей войны даже на\nмгновение — со дня рождения человека\nдо дня его смерти.<\/p>", "<h1 class=\"western\" id=\"section-148\"><strong><font size=\"4\">Война,\nкоторой нет конца<\/font><\/strong><\/h1>", "<p><strong>3.<\/strong> На обычной войне те, кто\nодолел своих врагов, покорил их и поразил\nмечом, больше не боятся этих врагов.<\/p>", "<p>Но в войне с дурным началом даже\nчеловек, который уже победил своё дурное\nначало, должен продолжать опасаться и\nстрашиться его.<\/p>", "<p>Как сказано в Мишне (Пиркей Авот 2:4):<\/p>", "<p><strong>«Не верь в себя до дня своей\nсмерти».<\/strong><\/p>", "<p>Ведь первосвященник Йоханан служил\nв качестве первосвященника восемьдесят\nлет, но в конце концов стал саддукеем\n(Брахот 29а).<\/p>", "<h1 class=\"western\" id=\"section-149\"><strong><font size=\"4\">Война,\nот которой невозможно убежать<\/font><\/strong><\/h1>", "<p><strong>4.<\/strong> На обычной войне, если воины\nодной из армий увидят, что их положение\nстало безнадёжным, они могут обратиться\nв бегство и спасти свои жизни.<\/p>", "<p>Но в войне с дурным началом бежать\nнекуда.<\/p>", "<p>Ведь куда может убежать человек от\nдурного начала, которое обитает в глубине\nего собственного сердца?<\/p>", "<h1 class=\"western\" id=\"section-150\"><strong><font size=\"4\">Война\nза саму жизнь<\/font><\/strong><\/h1>", "<p><strong>5.<\/strong> На обычной войне каждая\nармия стремится одержать победу и\nподчинить себе противника, чтобы все\nего воины стали рабами и платили дань.<\/p>", "<p>Но целью такой войны не обязательно\nявляется полное уничтожение противника.<\/p>", "<p>Дурное же начало стремится убить и\nпогубить всего человека.<\/p>", "<p>Как сказали наши мудрецы (Кидушин 30б;\nСукка 52б):<\/p>", "<p><strong>«Дурное начало человека ежедневно\nусиливается против него и стремится\nумертвить его».<\/strong><\/p>", "<h1 class=\"western\" id=\"section-151\"><strong><font size=\"4\">Война\nс врагом, притворяющимся другом<\/font><\/strong><\/h1>", "<p><strong>6.<\/strong> На обычной войне все воины\nзнают своих врагов, с которыми сражаются,\nи понимают, что те стремятся убить их\nили захватить живыми.<\/p>", "<p>Но в войне с дурным началом человек\nне узнаёт своего врага, подстерегающего\nего душу.<\/p>", "<p>Ведь дурное начало предстаёт перед\nчеловеком не врагом, а другом.<\/p>", "<p>Оно убеждает человека, что желает ему\nдобра и постоянно заботится о его\nблагополучии.<\/p>", "<p>Оно соблазняет его прислушиваться ко\nвсем своим словам, пока наконец хитростью\nне приводит его к гибели.<\/p>", "<h1 class=\"western\" id=\"section-152\"><strong><font size=\"4\">Война,\nисход которой не находится в руках Небес<\/font><\/strong><\/h1>", "<p><strong>7.<\/strong> На всякой обычной войне\nдействует правило: <strong>«Господь — муж\nбрани»<\/strong> (Шмот 15:3), и всё находится в\nруках Небес.<\/p>", "<p>Поэтому сказано (Ирмияу 9:22):<\/p>", "<p><strong>«Да не хвалится сильный силою\nсвоею».<\/strong><\/p>", "<p>Ведь сила принадлежит Всевышнему, и\nименно Он дарует человеку могущество.<\/p>", "<p>Но в войне с дурным началом человек\nсам должен сражаться со своим дурным\nначалом.<\/p>", "<p>Как сказал рабби Ханина (Брахот 33б):<\/p>", "<p><strong>«Всё в руках Небес, кроме страха\nперед Небесами».<\/strong><\/p>", "<p>Как сказано (Дварим 10:12):<\/p>", "<p>«А теперь, Израиль, чего Господь, Бог\nтвой, требует от тебя, кроме того, чтобы\nты боялся Его...»<\/p>", "<p>Поэтому сказано в Мишне (Пиркей Авот\n4:1):<\/p>", "<p><strong>«Кто силён? Тот, кто побеждает\nсвоё дурное начало».<\/strong><\/p>", "<p>Только человек, победивший своё дурное\nначало, является подлинным героем,\nкоторый может гордиться своей силой.<\/p>", "<p>Но тот, кто завоевал город, не должен\nхвалиться своим могуществом, поскольку\nэто не его собственная сила, а сила\nВсевышнего.<\/p>", "<p>Поэтому человек должен чрезвычайно\nопасаться за свою душу в войне с дурным\nначалом и ни на мгновение не забывать,\nчто на протяжении всей своей жизни он\nнаходится посреди великой и жестокой\nбитвы.<\/p>", "<p>И если дурное начало одолеет его, оно\nпогубит его и для этого мира, и для Мира\nгрядущего.<\/p>", "<p>Итак, дурное начало <strong>«искусно в\nсвоём деле»<\/strong>.<\/p>", "<p>Ведь оно приходит к каждому человеку\nс того самого мгновения, когда тот\nначинает выходить из материнской утробы,\nи не оставляет его ни на мгновение на\nпротяжении всей жизни, вплоть до смерти.<\/p>", "<p>Оно обращается к его сердцу днём и\nночью, не умолкая ни на миг, и хитростью\nсоблазняет его отступить от Всевышнего.<\/p>", "<p>И так оно поступает со всеми людьми\nна всей земле, не пропуская никого.<\/p>", "<p>Оно не отдыхает, не знает покоя ни на\nмгновение, не спит и не забывает ни об\nодном человеке на всей земле, чтобы хотя\nбы на миг перестать его соблазнять.<\/p>", "<p>И если мы задумаемся над этим, то\nчрезвычайно удивимся тому, насколько\nоно искусно и неутомимо в своём деле.<\/p>", "<p>Ведь Рейш Лакиш сказал (Бава Батра\n16а):<\/p>", "<p><strong>«Он — Сатан, он — дурное начало,\nон — ангел смерти».<\/strong><\/p>", "<p>И учили в барайте:<\/p>", "<p><strong>«Он спускается и вводит в\nзаблуждение, поднимается и обвиняет,\nполучает разрешение и забирает душу».<\/strong><\/p>", "<p>Таким образом, один ангел назначен\nдля исполнения трёх задач.<\/p>", "<p>Во-первых, вводить в заблуждение всех\nлюдей на земле: мужчин и женщин, стариков,\nюношей и детей, не оставляя никого.<\/p>", "<p>Во-вторых, выступать обвинителем\nпротив них.<\/p>", "<p>И в-третьих, забирать их души.<\/p>", "<h1 class=\"western\" id=\"section-153\"><strong><font size=\"4\">Молитва\nцаря Давида о спасении от трёх проявлений\nдурного начала<\/font><\/strong><\/h1>", "<p>Поэтому царь Давид, мир ему, молился\nи говорил (Теилим 17:13):<\/p>", "<p><strong>«Восстань, Господи, выступи против\nнего, повергни его! Избавь душу мою от\nнечестивца — меча Твоего».<\/strong><\/p>", "<p>Ведь наши мудрецы сказали (Сукка 52б):<\/p>", "<p>«Дурное начало человека ежедневно\nусиливается против него и стремится\nумертвить его, как сказано (Теилим\n37:32):<\/p>", "<p>\"Нечестивец подстерегает праведника\nи стремится умертвить его\".<\/p>", "<p>И если бы Святой, благословен Он, не\nпомогал человеку, тот не смог бы одолеть\nдурное начало, как сказано (Теилим\n37:33):<\/p>", "<p>\"Господь не оставит его в руке его\nи не допустит осуждения его, когда его\nбудут судить\"».<\/p>", "<p>Поэтому Давид просил:<\/p>", "<p><strong>«Восстань, Господи!»<\/strong><\/p>", "<p><strong>1. «Выступи против него».<\/strong><\/p>", "<p>Когда оно выступает как дурное начало,\nкоторое «спускается и вводит в\nзаблуждение», и начинает воевать против\nменя, Ты выступи ему навстречу и сразись\nс ним.<\/p>", "<p>Не дай ему приблизиться ко мне, чтобы\nввести меня в заблуждение.<\/p>", "<p><strong>2. «Повергни его».<\/strong><\/p>", "<p>Когда оно выступает как Сатан, который\n«поднимается и обвиняет», и начинает\nобвинять меня за то, что прежде само же\nсоблазнило меня совершить, Ты повергни\nего и низвергни, чтобы оно не могло\nпредстать перед Тобой и обвинить меня.<\/p>", "<p><strong>3. «Избавь душу мою».<\/strong><\/p>", "<p>Когда оно выступает как ангел смерти,\nкоторый «получает разрешение забрать\nдушу», и приходит умертвить меня за то,\nв чём прежде само же обвинило меня, Ты\nизбавь мою душу.<\/p>", "<p><strong>«От нечестивца»<\/strong> — это дурное\nначало, Сатан и ангел смерти, который\nназывается нечестивцем, как сказано:<\/p>", "<p>«Нечестивец подстерегает праведника...»<\/p>", "<p><strong>«Меча Твоего»<\/strong> — ведь он\nпослан Тобой, чтобы поражать мечом всех\nживущих на земле.<\/p>", "<p>Как учили в барайте (Авода Зара 20б):<\/p>", "<p>«В час кончины человека ангел смерти\nстоит над его изголовьем с обнажённым\nмечом в руке, а на острие меча висит\nкапля яда.<\/p>", "<p>Когда больной видит его, он содрогается\nи открывает рот, а ангел смерти бросает\nэту каплю ему в рот.<\/p>", "<p>От неё человек умирает, от неё его тело\nначинает разлагаться, от неё его лицо\nприобретает зеленоватый оттенок...»<\/p>", "<p>Сказал учитель: «От не
