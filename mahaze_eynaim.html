:root{--bg:#f6f1e8;--paper:#fffdf9;--text:#302c29;--accent:#5a6f82;--border:#e1d7c8;--muted:#766f67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}body.dark{--bg:#171b20;--paper:#222930;--text:#eee8dc;--accent:#b8d0e2;--border:#45505a;--muted:#b4a99a}.top{height:62px;position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--border);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}.brand{font-weight:900;font-size:17px;color:var(--accent)}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button:hover,.navitem:hover{background:var(--bg)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{border-right:1px solid var(--border);background:var(--paper);padding:20px 14px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}aside h2{font-size:18px;margin:5px 10px 18px}.navitem{display:block;width:100%;text-align:left;line-height:1.5;border:0;border-radius:8px;padding:11px 13px;margin:3px 0;font-family:Arial,sans-serif;font-size:14px}.navitem.active{background:var(--bg);border-left:4px solid var(--accent);font-weight:bold}.main{width:100%;min-width:0;padding:30px 24px 60px}.paper{max-width:850px;margin:auto;background:var(--paper);padding:45px clamp(20px,5vw,65px);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 24px #00000008}.book-title{font-weight:900;text-align:center;color:var(--accent);font-size:clamp(26px,4vw,38px);line-height:1.3;margin:0 0 25px}.chapter-num{text-align:center;font-size:clamp(30px,5vw,43px);color:var(--accent);margin:10px 0 12px}.chapter-title{text-align:center;font-size:clamp(23px,3vw,31px);line-height:1.35;margin:0 0 34px}.content{font-size:var(--fs,20px);line-height:1.85;te </style></head><body><header class="top"><div class="top-row first-row"><button id="menu" title="Выбрать главу" aria-label="Выбрать главу">☰</button><div class="subchap-wrap"><button id="subchapToggle" title="Выбрать подраздел" aria-label="Выбрать подраздел">§ ▾</button><div id="subchapPanel" class="subchap-panel" hidden></div></div><div class="brand">Зрелище очей — Махазе Эйнаим</div></div><div class="top-row second-row"><span id="chapterIndicator" class="chapter-indicator">Предисловие</span><div class="tools"><input id="search" class="search" placeholder="Поиск" aria-label="Поиск"><button id="searchNext" aria-label="Следующее совпадение" title="Следующее совпадение">🔍</button><span id="searchCount" style="font:11px Arial,sans-serif;white-space:nowrap"></span><button id="smaller" title="Уменьшить">А−</button><button id="larger" title="Увеличить">А+</button><button id="night" title="Ночной режим">☾</button></div></div></header><div class="layout"><aside id="sidebar"><h2>Содержание</h2><nav id="nav"></nav></aside><main class="main"><article class="paper"><h1 class="book-title">ЗРЕЛИЩЕ ОЧЕЙ — МАХАЗЕ ЭЙНАИМ</h1><h2 id="num" class="chapter-num"></h2><h2 id="title" class="chapter-title"></h2><div class="content" id="content"></div><div class="bottom"><button id="prev">← Предыдущая глава</button><button id="next">Следующая глава →</button></div></article></main></div><script>const chapters=[{"title": "Предисловие", "body": ["<h2 class=\"western\" id=\"section-1\"><strong><font face=\"Times New Roman, serif\"><font size=\"6\">Предисловие<\/font><\/font><\/strong><\/h2>", "<p><font face=\"Times New Roman, serif\">С помощью\nВосседающего на небесах написана эта\nкнига «Махазе Эйнаим», чтобы возвестить,\nчто от закрывания глаз от дурных зрелищ,\nот лица чужой женщины, от лица нечестивца\nи от идолопоклонства зависит вся жизнь\n— тела на земле и души на небесах. Поэтому\nпусть все люди читают эту книгу без\nлености.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И скажу\nсловами человека Божьего, совершенного\nв мудростях и знаниях, рабби Моше Хаима\nЛуцатто, да будет память праведника и\nсвятого благословенна, в его предисловии\nк книге «Месилат Йешарим»: «Это сочинение\nя написал не для того, чтобы научить\nлюдей тому, чего они не знали, но чтобы\nнапомнить им то, что им уже известно и\nшироко им известно. Ибо в большинстве\nмоих слов ты не найдёшь ничего, кроме\nвещей, которые большинство людей знают\nи в которых совершенно не сомневаются.\nОднако в той же мере, в какой они широко\nизвестны и их истинность очевидна всем,\nнастолько же часто люди упускают их из\nвиду и предают забвению. Поэтому польза,\nизвлекаемая из этой книги, не будет\nдостигнута одним её прочтением и т. д.;\nно польза придёт от повторного чтения\nи постоянного обращения к ней, ибо тогда\nчеловек вспомнит эти вещи, которые по\nприроде своей забываются людьми, и\nобратит сердце своё к обязанности, от\nкоторой он уклоняется».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И знаю я\nмеру свою: вот я беден знанием, чтобы\nкак следует разъяснить вопрос «Махазе\nЭйнаим» согласно Галахе, Агаде и\nчеловеческому разуму. Однако сказал я\nв сердце своём, что подобен я больному\nчеловеку, который ворочается на своём\nложе и не может уснуть от множества\nстраданий. И вот однажды, около полуночи,\nкогда сон овладел людьми, взглянул он\nчерез окно и увидел, что из одного дома\nвырывается пылающий огонь. И закричал\nон великим и горьким криком: «Ах! Пожар\nв городе!» Голосом своего крика он\nразбудил нескольких людей; они поспешно\nпобежали и разбудили всех жителей\nгорода. И все жители города поспешили\nвыйти из своих домов и потушили пожар.\nВот один больной человек своим криком\nспас всех жителей города — их самих, их\nдома, их потомство и всё, что у них было.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Так и я: вот\nя болен недугами души; от множества\nстраданий своих не могу я успокоиться.\nИ вот я кричу великим и горьким криком,\nибо огонь дурного начала выходит из\n«видения глаз» и сжигает всю жизнь. Ах!\n«Огонь в доме Амрама!» (Кидушин 81а; см.\nСукка 52а).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">На голос\nмоего крика многие пробудятся от сна\nбезрассудства и будут беречь свои глаза\nсо всей тщательностью. А глаза Израиля\n— мудрецы Торы — обратят своё сердце\nк разъяснению и выяснению этого вопроса\n«Махазе Эйнаим» согласно закону и\nГалахе, а также согласно Драшу и Агаде,\nибо они — глаза общины, и они осветят\nнаши глаза, чтобы идти путём Торы и\nзаповеди.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И да будет\nволя Твоя, Господь, Бог наш, чтобы Тора\nТвоя была нашим постоянным занятием,\nчтобы не болело наше сердце и не померкли\nнаши глаза (Брахот 17а), и да увидят наши\nглаза приход нашего Избавителя вскоре,\nв наши дни. Амен.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">[Вот, в\nМидраше «Шир а-Ширим» и в Мидраше «Коэлет»\nначинают со стиха (Мишлей 22:29): «Видел\nли ты человека, проворного в своём\nделе…», и вся книга «Махазе Эйнаим»\nоснована на этом стихе. Поэтому те, кто\nпроизносят толкования перед общиной\nЙешуруна в праздник мацы по Мидрашу\n«Шир а-Ширим», а в праздник Суккот — по\nМидрашу «Коэлет», пусть, пожалуйста,\nговорят о «Махазе Эйнаим». И да будет\nзаслуга многих зависеть от них.]<\/font><\/p>"]}, {"title": "Петах Эйнаим", "body": ["<h2 class=\"western\" id=\"section-2\"><strong><font size=\"6\">Петах\nЭйнаим<\/font><\/strong><\/h2>", "<h2 class=\"western\" id=\"section-3\"><strong><font face=\"Times New Roman, serif\"><font size=\"6\">[Введение]<\/font><\/font><\/strong><\/h2>", "<h1 class=\"western\" id=\"section-4\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Достоинства\nи вред, зависящие от того, что видят\nглаза<\/font><\/font><\/strong><\/h1>", "<p><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Многочисленные\nвопросы к стиху «Видел ли ты человека,\nпроворного в своём деле»<\/font><\/font><\/strong><\/p>", "<p><font face=\"Times New Roman, serif\">Мудрейший\nиз всех людей сказал (Мишлей 22:29): «Видел\nли ты человека, проворного в своём деле?\nПеред царями предстанет он, не предстанет\nперед тёмными». Вот этот стих не вполне\nпонятен. Чему учит нас мудрейший из всех\nлюдей? Ведь в этом стихе, казалось бы,\nнет ни мудрого наставления, ни закона\nи постановления, ни доброго качества,\nни нравственного увещевания. Кто не\nзнает, что мастер, являющийся необычайно\nискусным в своём ремесле, выполняет\nработу для царей и вельмож, а не для\nнищих и обездоленных, для которых мир\nпогружён во тьму?<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Кроме того,\nбывает человек, проворный в своём деле,\nкоторый выполняет свою работу быстро,\nно сама работа нехороша; а бывает человек,\nкоторый не проворен в своём деле, однако\nсама работа, которую он выполняет, очень\nхороша. Если так, почему в похвалу\nчеловеку сказано лишь то, что «он проворен\nв своём деле»? Ведь даже если он проворен\nв своём деле, но сама его работа нехороша,\nон не предстанет перед царями; а если\nсама его работа очень хороша, то, даже\nесли он не способен выполнять её быстро,\nон предстанет перед царями, чтобы\nвыполнять их работу.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Кроме того,\nпочему бедных и неимущих он называет\n«тёмными»? Ведь нигде более во всех\nСвященных Писаниях не встречается такое\nназвание бедных и неимущих. Рабби Авраам\nИбн Эзра (там же) написал: «„Тёмные“ —\nбедные; и перевод слова „тощие“ (Берешит\n41:19) — „хашихан“, а слов „из бедного\nнарода“ (Ирмияу 39:10) — „амма хашира“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Однако это\nобъяснение не вполне удовлетворительно:\nпочему же тогда не написано «не предстанет\nперед бедными», согласно обычному\nвыражению Писания?<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Кроме того,\nслово «видел ли ты» представляется\nизлишним. Также следует внимательно\nрассмотреть, почему сказано: «человек,\nпроворный в своём деле» — именно мужчина,\nа не женщина? (Авода Зара 19а; см. там).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">В конечном\nсчёте, этот стих словно сам говорит:\n«Истолкуй меня» (и в Мидраше «Шир\nа-Ширим», гл. 1, он действительно\nистолковывается несколькими способами;\nсм. там).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Сделать\nзаключение ближе к оригиналуСохранить\nеврейские термины точнее<\/font><\/p>", "<h1 class=\"western\" id=\"section-5\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Видение\nглазами — начало всякого греха<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Да будет\nблагословенно Имя Господа: Он открыл\nглаза, чтобы увидеть чудеса в этом стихе.\nИбо мудрейший из всех людей увещевает\nкаждого человека относительно того,\nчто видят его глаза: своими глазами люди\nсозерцают всё, что вызывает страсть и\nвожделение, смотрят и глядят на всё\nнечистое. Ведь это начало всякого греха,\nбеззакония и преступления: «Глаз видит,\nсердце желает, а тело совершает\nпреступления» (Раши к Бемидбар 15:39). И\nсказали наши мудрецы, благословенной\nпамяти (Сота 8а; Санедрин 45а): «Мы знаем\nпо преданию: дурное начало властвует\nлишь над тем, что видят глаза человека».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И в качестве\nобразного толкования уместно объяснить\nслова наших мудрецов, благословенной\nпамяти (Авода Зара 20б): «Сказали об ангеле\nсмерти, что весь он полон глаз». Ведь\nнаши мудрецы, благословенной памяти,\nсказали (Бава Батра 16а): «Он — дурное\nначало, он — Сатан, он — ангел смерти».\nИ там же: «Спускается и соблазняет,\nподнимается и обвиняет, получает\nдозволение и забирает душу».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И он\nсоблазняет человека, подстрекая его\nсмотреть и глядеть на всё, что вызывает\nстрасть и вожделение, и на всё нечистое.\nЕсли так, следует задуматься: когда он\nстановится ангелом смерти? Только если\nпрежде был Сатаном. А когда он становится\nСатаном? Только если прежде был дурным\nначалом и соблазнил человека пойти\nдурным путём и совершить беззаконие. А\nкогда человек совершает беззаконие?\nТолько если прежде возжелало его сердце.\nА когда его сердце желает? Только если\nпрежде увидели его глаза.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Если так,\nполучается, что конец всего — когда\nангел смерти умерщвляет человека —\nпроисходит от самого начала: от того,\nчто человек увидел своими глазами. И\nсогласно этому, насколько удивительно\nобразное выражение: «Ангел смерти весь\nполон глаз»! Ибо эти «глаза» и есть\n«ангелы смерти» — именно они приносят\nсмерть человеку.<\/font><\/p>", "<h1 class=\"western\" id=\"section-6\"><strong><font size=\"4\">Смертный\nприговор <\/font><\/strong><strong><font size=\"4\"><span lang=\"ru-RU\">в\n<\/span><\/font><\/strong><strong><font size=\"4\">мир<\/font><\/strong><strong><font size=\"4\"><span lang=\"ru-RU\">е<\/span><\/font><\/strong><strong><font size=\"4\">\nвследствие видения глаз<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Также\nпервоначальное побуждение Адама и Хавы\nвкусить от плода Древа познания возникло\nвследствие увиденного глазами, как\nсказано (Берешит 3:6): «И увидела женщина,\nчто дерево хорошо для еды и т. д., и взяла\nот плодов его, и ела и т. д.».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И то, что\nзмей соблазнил Хаву, также произошло\nвследствие увиденного глазами. По мнению\nрабби Йеошуа бен Корхи — потому, что\nзмей увидел и смотрел в то время, когда\nАдам познал Хаву, как сказали наши\nмудрецы, благословенной памяти (Берешит\nРабба, гл. 18): «„А змей был хитёр и т. д.“\n(Берешит 3:1). Сказал рабби Йеошуа бен\nКорха: это сообщается тебе, чтобы\nпоказать, вследствие какого греха\nнабросился на них тот нечестивец: увидев,\nчто они занимаются супружеской близостью,\nон возжелал её».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">А по мнению\nрабби Йеуды бен Теймы — потому, что змей\nсмотрел и увидел почёт и величие Адама.\nИбо учили (Санедрин 59б): «Рабби Йеуда\nбен Тейма говорит: Первый человек\nвозлежал в Ган Эдене, а ангелы-служители\nжарили для него мясо и процеживали ему\nвино. Змей взглянул на него, увидел его\nпочёт и позавидовал ему».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Таким\nобразом, вследствие увиденного глазами\nдело дошло до того, что Адам и Хава\nвкусили от Древа познания, и смерть была\nпредопределена всему живущему на земле.<\/font><\/p>", "<h1 class=\"western\" id=\"section-7\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Дурной\nглаз и причиняемый им вред<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Также многие\nумирают прежде назначенного им срока\nвследствие того, что видят их глаза. Ибо\nсвоими глазами они видят всё, что\nпринадлежит другим: их богатство и\nпочёт, все человеческие удовольствия\nи предметы их желаний; а поскольку сами\nне в силах приобрести это, сердце их\nтает внутри них, и они умирают от множества\nсвоих желаний и зависти. Как учили мы\n(Авот 4:21): «Рабби Элазар а-Капар говорит:\nзависть, страсть и стремление к почёту\nвыводят человека из мира».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Более того,\nочень многие умерщвляют других посредством\nвзгляда своих глаз, ибо смотрят на них\nдурным глазом. Как сказали наши мудрецы,\nблагословенной памяти (Бава Мециа 107б):\n«„И удалит Господь от тебя всякую\nболезнь“ (Дварим 7:15). Сказал Рав: это —\nглаз. И Рав следует своему мнению: Рав\nпришёл на кладбище, сделал то, что сделал,\nи сказал: девяносто девять умерли от\nдурного глаза, а один — естественным\nобразом».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И даже если\nчеловек всем сердцем является верным\nдругом своему ближнему, всё же, если он\nсмотрит на него с сильным чувством из-за\nчего-либо удивительного, что увидел в\nнём, он причиняет ему вред и умерщвляет\nего взглядом своих глаз.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Как\nрассказывали наши мудрецы, благословенной\nпамяти (Брахот 58б): «Рав Папа и рав Уна,\nсын рава Йеошуа, шли по дороге. Встретили\nони рава Ханину, сына рава Ики. Сказали\nему: когда мы увидели тебя, мы произнесли\nнад тобой два благословения: „Благословен\nТот, Кто уделил от Своей мудрости боящимся\nЕго“ и „Шеэхеяну“. Он сказал им: я тоже,\nкогда увидел вас, счёл вас для себя\nподобными шестистам тысячам Израиля и\nпроизнёс над вами три благословения:\nэти два и „Благословен Мудрец тайн“.\nСказали ему: настолько ты мудр?! Обратили\nна него свои глаза — и он умер».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И в Бава\nБатра (14а): «Рав Уна написал семьдесят\nсвитков Торы, и лишь в одном из них\nполучилось, чтобы длина его была равна\nего окружности. Рав Аха бар Яаков написал\nодин свиток на коже телёнка, и у него\nэто получилось. Обратили на него мудрецы\nсвои глаза — и он умер».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И в Бава\nМециа (85б): «Рабби Зейра каждые тридцать\nдней испытывал себя: разжигал печь,\nвходил и садился внутри неё, и огонь не\nвластвовал над ним. Однажды мудрецы\nобратили на него свои глаза, и обгорели\nего ноги; и называли его „маленький с\nобгоревшими ногами“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Также дурным\nглазом человек причиняет вред и губит\nимущество другого, как учили (Псахим\n50б): «Тот, кто зарабатывает на тростнике\nи больших кувшинах, никогда не увидит\nзнака благословения. Почему? Поскольку\nих объём велик и они заметны, над ними\nвластвует дурной глаз».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И даже если\nчеловек является верным другом своему\nближнему, всё же, когда он с сильным\nчувством смотрит на его имущество и на\nто, как умножилось его богатство, он\nстановится причиной утраты его состояния.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Так мудрецы\nсказали Раве (Хагига 5б; см. там): «Господин\nне находится ни под „сокрытием Лица“,\nни под „и будет он отдан на съедение“\n(Дварим 31:17)». [Раши объясняет: «что\nнеевреи расхищают его имущество».] Он\nсказал им: «Разве вы знаете, сколько я\nтайно посылаю дому царя Шапура?» Несмотря\nна это, мудрецы обратили на него свои\nглаза, и тем временем из дома царя Шапура\nприслали людей и разграбили его.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И сказал\nрав Йеуда Равину бар рав Нахману (Бава\nМециа 107а): «Равин, брат мой, не покупай\nземлю, расположенную рядом с городом».\n[Раши объясняет: «Не покупай поле возле\nгорода, поскольку глаза людей постоянно\nобращены на него».] Ибо рабби Абау сказал\nот имени рава Уны, сказавшего от имени\nРава: «Запрещено человеку стоять возле\nполя своего ближнего в то время, когда\nоно покрыто созревшими колосьями».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И написано\nв «Сефер Хасидим» (§119): «Есть тот, кто\nграбит, но этого не видно: это человек,\nживущий среди людей и имеющий дурной\nглаз на принадлежащее им».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">А я говорю,\nчто он — причиняющий вред, который\nвидит, но сам не виден. Он видит — дурным\nглазом смотрит на всех обитателей мира\nи причиняет вред им и всему, что им\nпринадлежит; но сам он не виден — их\nглаза не видят, что именно он причиняет\nим вред.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Того, кто\nпричиняет вред своими руками, схватят\nи заключат в тюрьму; но того, кто причиняет\nвред взглядом своих глаз, — кто увидит\nего и кто распознает, что это именно он?<\/font><\/p>", "<h1 class=\"western\" id=\"section-8\"><strong><font size=\"4\">Смотрящий\nдурным глазом сам терпит вред<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">И вот, те,\nкто умерщвляет других и причиняет им\nвред своими дурными глазами, сами плохо\nкончат, ибо и они умрут прежде назначенного\nим срока и будут страдать тяжёлыми\nболезнями, как сказали наши мудрецы,\nблагословенной памяти (Сота 9а; см. там):\n«Всякому, кто обращает свои глаза на\nто, что ему не принадлежит, не дают того,\nчего он желает, а то, что находится у\nнего в руках, отнимают у него».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Также и те,\nкто дурным глазом уменьшает имущество\nдругих, плохо кончат, ибо и их собственное\nимущество уменьшится. Об этом говорит\nПисание (Мишлей 28:22): «Спешит к богатству\nчеловек с дурным глазом и не знает, что\nнужда постигнет его».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Человек с\nдурным глазом приходит в возбуждение,\nувидев чужое богатство, и смотрит на\nнего дурным глазом; «и не знает» — не\nпринимает близко к сердцу и не осознаёт,\nчто за то, что обращает свои глаза на не\nпринадлежащее ему, «нужда постигнет\nего» — его собственное богатство\nуменьшится, и то, что находится у него\nв руках, будет отнято у него.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">В конечном\nсчёте, «ангел смерти весь полон глаз»:\nглаза каждого человека — это «ангелы\nсмерти», умерщвляющие его самого и\nдругих.<\/font><\/p>", "<h1 class=\"western\" id=\"section-9\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Глаза\nчеловека могут погубить его тело и душу<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Об этом\nговорит Писание (Мишлей 27:20): «Шеол и\nАваддон не насытятся, и глаза человека\nне насытятся». «Шеол и Аваддон не\nнасытятся», поглощая в себя людей, —\nвследствие того, что «глаза человека\nне насытятся».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Наши мудрецы,\nблагословенной памяти, рассказывали\nоб Александре Македонском (Тамид 32б;\nсм. там также Маарша): когда он достиг\nвхода в Ган Эден, возвысил голос и сказал:\n«Откройте мне врата!» Сказали ему: «Это\nврата Господа — праведники войдут в\nних». Он сказал им: «Я тоже царь, я человек\nзначительный; дайте мне хотя бы что-нибудь\n[раз вы не желаете открыть мне врата]».\nДали ему один предмет — глазное яблоко\nчеловека.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Он положил\nего на весы напротив всего своего серебра\nи золота, но они не смогли перевесить\nего. Спросил он мудрецов: «Что это?»\nСказали ему: «Это глаз человека из плоти\nи крови, который никогда не насыщается».\nСпросил их: «Откуда известно, что он\nдействительно не насыщается?» Сказали\nему: «Возьми немного земли и покрой его\nею» — и тотчас он перевесился. Ибо\nнаписано (Мишлей 27:20): «Шеол и Аваддон\nне насытятся, и глаза человека не\nнасытятся».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Таким\nобразом объясняется смысл стиха: «Шеол»\n— это могила, а «Аваддон» — это Геином.\nОни «не насытятся», потому что «глаза\nчеловека не насытятся». Из-за того, что\nглаза человека смотрят на всё вызывающее\nстрасть и вожделение, человек губит\nсвоё тело и свою душу, губит оба мира —\nэтот мир и Мир грядущий.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Поэтому\nвсякий человек, дорожащий своей душой,\nдолжен принять близко к сердцу\nнеобходимость закрывать свои глаза от\nсозерцания зла, от всего вызывающего\nстрасть и вожделение и от всякой\nнечистоты. Тогда дурное начало не будет\nвластвовать над ним.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И тогда\nтакже дурной глаз не будет властвовать\nнад ним, как сказали наши мудрецы,\nблагословенной памяти (Брахот 20а): «Глаз,\nкоторый не пожелал наслаждаться тем,\nчто ему не принадлежит, — дурной глаз\nне властвует над ним».<\/font><\/p>", "<h1 class=\"western\" id=\"section-10\"><strong><font size=\"4\">Ангел\nсмерти причиняет вред и убивает своими\nглазами<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Однако\nизречение «Ангел смерти весь полон\nглаз» не утрачивает и своего буквального\nсмысла, ибо Ангел смерти действительно\nвесь полон глаз. Доказательством этому\nслужат слова наших мудрецов, благословенной\nпамяти (Авода Зара 20б): «„И остерегайся\nвсякого дурного дела“ (Дварим 23:10) —\nчтобы человек не смотрел на женщину и\nт. д.; и даже если бы [человек] был полон\nглаз, как Ангел смерти». [Отсюда следует,\nчто Ангел смерти действительно полон\nглаз в буквальном смысле.]<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И он навлекает\nна человека тяжёлые болезни, «ведущие\nк смерти» (см. Брахот 8а), смотря на него\nсвоими дурными глазами.* Ведь сказали\nнаши мудрецы, благословенной памяти\n(Бава Мециа 107б): «Девяносто девять\nумирают от дурного глаза и т. д.». Если\nчеловек способен причинять вред и\nумерщвлять своими дурными глазами, то\nАнгел смерти — тем более! Если человек\nдвумя глазами способен причинять вред\nи умерщвлять, то Ангел смерти, который\nвесь полон глаз, — тем более и тем более!<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Наши мудрецы,\nблагословенной памяти, сказали (Дварим\nРабба, гл. 4): «Нет пространства размером\nв четверть кава во всём мировом\nпространстве, в котором не находилось\nбы нескольких тысяч вредоносных существ;\nи у каждого из них перед лицом находится\nпокрывало, чтобы он не посмотрел на\nчеловека и не причинил ему вреда. А когда\nгрехи человека становятся тому причиной,\nпокрывало снимается с его лица, и он\nсмотрит на человека и причиняет ему\nвред».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">На основании\nэтого изречения гаон, наш учитель рабби\nШауль из Вильно, да будет память праведника\nблагословенна, объяснил слова наших\nмудрецов (Брахот 6а): «Если бы глазу было\nдано разрешение видеть, ни одно творение\nне смогло бы устоять перед вредоносными\nсуществами».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Если бы\nкаждому «глазу» всякого вредоносного\nсущества было дано разрешение видеть\nи перед его глазами не было бы покрывала\nи завесы, тогда ни одно творение не\nсмогло бы устоять перед вредоносными\nсуществами, ибо они причиняли бы вред\nвсем людям своими дурными глазами.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И если все\nвредоносные существа обладают столь\nвеликой и могучей силой причинять вред\nи умерщвлять своими глазами, то Ангел\nсмерти, который поражает самих вредоносных\nсуществ и умерщвляет их (см. Хагига 16а:\n«и умирают, как люди»; и достаточно\nпонимающему), — тем более и тем более\nспособен причинять вред и умерщвлять\nсвоими глазами.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И это —\nмера за меру: человек грешит посредством\nсвоих глаз, смотря на всё вызывающее\nстрасть и вожделение и на всякую\nнечистоту, и дурным глазом смотрит на\nпринадлежащее другим; поэтому он\nподвергается наказанию и смерти\nпосредством глаз Ангела смерти.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">*То, что\nавтор написал по этому поводу на полях\n(«Гей Хизайон»), мы поместили в конце\nкниги, на стр. 191.<\/font><\/p>", "<ul>\n<li><p style=\"font-weight: normal\">\n<\/p><\/li>\n<\/ul>", "<h1 class=\"western\" id=\"section-11\"><strong><font size=\"4\">Смерть\nчеловека при виде Ангела смерти<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Обратим же\nвнимание и вдумаемся в слова наших\nмудрецов, благословенной памяти (Авода\nЗара 20б): «В час кончины больного [Ангел\nсмерти] становится у его изголовья с\nобнажённым мечом в руке, и на нём висит\nкапля желчи. Когда больной видит его,\nон содрогается и открывает рот; тот\nбросает её ему в рот, и от неё он умирает\nи т. д.».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Таким\nобразом, начало смерти человека — в\nтом, что он видит Ангела смерти и\nсодрогается от великого страха. Ведь\nнаши мудрецы, благословенной памяти,\nсказали (Брахот 6а): «Если бы глазу было\nдано разрешение видеть [Раши объясняет:\nвсех бесов, находящихся перед ним], ни\nодно творение не смогло бы устоять перед\nвредоносными существами» — из-за\nвеликого страха и ужаса.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И сказали\nнаши мудрецы, благословенной памяти\n(там же): «Тот, кто желает увидеть их,\nпусть возьмёт плаценту чёрной кошки\n[Раши объясняет: плаценту детёныша\nкошки-самки], дочери чёрной кошки,\nпервородной дочери первородной [то есть\nпервородной у своей матери, причём её\nмать также была первородной], пусть\nсожжёт её в огне, истолчёт, наполнит ею\nсвои глаза [то есть положит немного\nэтого на глаза] — и увидит их. Рав Биби\nбар Абайе сделал так, увидел их и\nпострадал. Мудрецы попросили для него\nмилосердия, и он исцелился».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И сказали\nнаши мудрецы, благословенной памяти, о\n«Кетев Мерири» (Бемидбар Рабба, гл. 12;\nЭйха Рабба, гл. 1; см. также Мехильта,\nБешалах, «Вайаса Моше», и Танхума там):\n«Всякий, кто видит его, падает и умирает».\nТем более — когда больной видит Ангела\nсмерти.<\/font><\/p>", "<h1 class=\"western\" id=\"section-12\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Все\nгрехи человека происходят вследствие\nувиденного им<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">И это —\nмера за меру: начало греха человека\nсвязано с тем, что видят его глаза,\nпоэтому и начало его смерти связано с\nтем, что видят его глаза: своими глазами\nон видит Ангела смерти и содрогается.\nКак сказали наши мудрецы, благословенной\nпамяти, в трактате Сота (8б): «Бедро первым\nначало совершение греха и т. д., поэтому\nбедро первым и будет поражено и т. д.».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">В конечном\nсчёте, человек умирает, увидев своими\nглазами Ангела смерти, который весь\nполон глаз, а Ангел смерти смотрит на\nнего своими дурными глазами, поскольку\nначало греха человека — в его глазах.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Как сказали\nнаши мудрецы, благословенной памяти\n(Сота 9б): «Шимшон восстал посредством\nсвоих глаз, как сказано (Шофтим 14:3): „И\nсказал Шимшон своему отцу: её возьми\nмне, ибо она хороша в моих глазах“.\nПоэтому филистимляне выкололи ему\nглаза, как сказано (там же 16:21): „И схватили\nего филистимляне, и выкололи ему глаза“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И написано\nв «Сефер Хасидим» (§845): «Когда приходит\nчеловеку время умереть, ангел его\nсозвездия видит Ангела смерти, который\nвесь полон глаз, за то, что было сказано:\n„И что оно вожделенно для глаз“ (Берешит\n3:6); „И открылись глаза их обоих“ (там\nже, 3:7) — чтобы увидеть Ангела смерти,\nкоторый полон глаз; „и узнали они, что\nнаги“ (там же), — „Нагим вышел я из чрева\nматери моей, и нагим возвращусь туда“\n(Иов 1:21)».<\/font><\/p>", "<h1 class=\"western\" id=\"section-13\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Предвидящий\nпоследствия бережёт свои глаза<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Поэтому\nкаждый человек должен принять близко\nк сердцу необходимость всеми силами\nберечь свои глаза и никогда не отвлекаться\nот этого, ибо это — начало всего.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Так написано\nв книге Коэлет (2:14): «У мудреца глаза в\nголове его». Всякий мудрый сердцем\nпрежде всего обращает внимание на то,\nчтобы беречь свои глаза от созерцания\nвсякого зла.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Наши мудрецы,\nблагословенной памяти, сказали (Коэлет\nРабба, гл. 2): «„У мудреца глаза в голове\nего“ — разве у глупца глаза в ногах? Но\nсмысл в том, что, когда мудрый находится\nещё в начале дела, он уже знает, что будет\nв его конце».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Поэтому в\nсамом начале дела, когда дурное начало\nсоблазняет его посмотреть своими\nглазами, он уже знает, что будет в конце.\nОн — «мудрец, предвидящий последствия»\n(Тамид 32а): если глаз увидит, затем сердце\nвозжелает, а затем тело совершит грехи.\nПоэтому он закрывает свои глаза, чтобы\nне видеть зла.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И вместе с\nтем он открывает глаза, чтобы видеть\nдобро. Ибо если глаз видит, затем сердце\nжелает, а затем тело совершает заповеди.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Так сказали\nнаши мудрецы, благословенной памяти, о\nцицит (Менахот 43б), как написано (Бемидбар\n15:39): «И увидите его, и вспомните все\nзаповеди Господа, и исполните их»:\n«Зрение приводит к воспоминанию, а\nвоспоминание приводит к действию».<\/font><\/p>", "<h1 class=\"western\" id=\"section-14\"><strong><font size=\"4\">Чистота\nдуши человека зависит от его глаз<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">И каждый\nчеловек должен обратить своё сердце на\nвыражение «зеница ока» (Теилим 17:8) —\n«образ человека, видимый внутри глаза»\n(Радак, там же), ибо это указывает на то,\nчто весь человек зависит от глаза. Как\nсказали наши мудрецы, благословенной\nпамяти (Мидраш Шир а-Ширим, гл. 1): «В\nчеловеке двести сорок восемь органов,\nи все они идут и следуют лишь за глазами;\nи все поступки человека, от добра до\nзла, — всё следует за тем, что видят\nглаза».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И сказали\nнаши мудрецы, благословенной памяти\n(там же, гл. 4): «Всякая невеста, глаза\nкоторой некрасивы, — всё её тело требует\nпроверки; а если глаза её красивы, всё\nеё тело не требует проверки».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Подобно\nтому как мы находим относительно женщины,\nчто если глаза её красивы, то всё её тело\nкрасиво, так и человек: если он человек,\nзаботящийся о своей душе, который\nтщательно бережёт себя и не смотрит\nсвоими глазами ни на что вызывающее\nстрасть и вожделение, то вся его душа\nочищается от всякого преступления,\nбеззакония и греха.<\/font><\/p>", "<h1 class=\"western\" id=\"section-15\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Соблюдение\nТоры и заповедей зависит от сохранения\nглаз<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Об этом\nговорит Писание (Шир а-Ширим 1:15; 4:1): «Вот,\nты прекрасна, возлюбленная моя, вот, ты\nпрекрасна; глаза твои — голуби». [И в\nМидраше Рабба там; см. подробно:] «Вот,\nты прекрасна в повелительных заповедях;\nвот, ты прекрасна в запретительных\nзаповедях».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И согласно\nэтому объясняется продолжение стиха:\n«Глаза твои — голуби». Если ты не будешь\nследовать за своими глазами, как написано\n(Бемидбар 15:39): «И не следуйте за сердцем\nвашим и за глазами вашими, вслед за\nкоторыми вы блудно уклоняетесь». И\nсказали наши мудрецы, благословенной\nпамяти (Брахот 12б): «„За глазами вашими“\n— это греховные помыслы, как сказано\n(Шофтим 14:3): „И сказал Шимшон своему\nотцу: её возьми мне, ибо она хороша в\nмоих глазах“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И пусть\nтвои глаза будут подобны голубям, ибо\nнаши мудрецы, благословенной памяти,\nсказали (Эрувин 100б): «Если бы Тора не\nбыла дана Израилю, мы научились бы\nзаконам запретных связей у голубя».\n[Раши объясняет: «Он соединяется только\nсо своей парой».]<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">[И ещё\nсказано там:] «Вот, ты прекрасна в\nзаповедях; вот, ты прекрасна в\nблаготворительности».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">«В заповедях»\n— это все дела между человеком и\nВсевышним, а «в благотворительности»\n— все дела между человеком и его ближним\n(см. внимательно комментарий Рамбама к\nМишне, Пеа 1:1).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">«Глаза твои\n— голуби»: если ты не будешь смотреть\nдурным глазом на людей — на них самих,\nна их потомство, на их деньги и на всё,\nчто принадлежит им, — и не будешь желать\nничего из принадлежащего им. Как сказали\nнаши мудрецы, благословенной памяти\n(Шаббат 31а; и достаточно понимающему):\n«То, что ненавистно тебе, не делай своему\nближнему. В этом вся Тора целиком, а\nостальное — её объяснение».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И пусть\nтвои глаза будут подобны голубям, ибо\nнаши мудрецы, благословенной памяти,\nсказали (Эрувин 18б; Санедрин 108б): «Что\nозначает написанное (Берешит 8:11): „И\nвот, сорванный оливковый лист в её\nклюве“? Сказала голубка перед Святым,\nблагословен Он: „Владыка мира! Пусть\nпища моя будет горькой, как олива, но\nнаходящейся в Твоей руке, и пусть не\nбудет она сладкой, как мёд, но находящейся\nв руках плоти и крови“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И тем более\nследует заключить: если даже брать у\nчеловека, который даёт ему добрым глазом,\nкак Ноах давал голубю, — нехорошо, то\nтем более и тем более нехорошо желать\nпринадлежащее другим, завидовать им и\nсмотреть на них дурным глазом.<\/font><\/p>", "<h1 class=\"western\" id=\"section-16\"><strong><font size=\"4\">Жизнь\nв <\/font><\/strong><strong><font size=\"4\"><span lang=\"ru-RU\">двух<\/span><\/font><\/strong><strong><font size=\"4\">\nмирах зависит от сохранения глаз<\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">[И ещё\nистолковали там:] «Вот, ты прекрасна в\nэтом мире; вот, ты прекрасна в Мире\nгрядущем». «Глаза твои — голуби»: если\nтвои глаза не будут обращены к руке,\nдающей дары плоти и крови, а будут уповать\nна Господа, тогда «счастлива ты» в этом\nмире и «благо тебе» в Мире грядущем.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Как сказали\nнаши мудрецы, благословенной памяти\n(Брахот 8а): «Велик тот, кто питается\nплодами труда своих рук, более боящегося\nНебес. Ибо о боящемся Небес написано\n(Теилим 112:1): „Счастлив муж, боящийся\nГоспода“, а о питающемся плодами труда\nсвоих рук написано (там же, 128:2): „Когда\nбудешь есть от труда рук своих — счастлив\nты и благо тебе“: „счастлив ты“ — в\nэтом мире, „и благо тебе“ — в Мире\nгрядущем. А о боящемся Небес не написано\n„и благо тебе“» (см. там Риф к «Эйн\nЯаков»).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">«Глаза твои\n— голуби»: если ты не будешь следовать\nза своими глазами и не будешь смотреть\nна всё вызывающее страсть и вожделение,\nтогда «вот, ты прекрасна в этом мире» —\nтвоё тело будет здоровым и крепким\n(Теилим 73:4).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Не таковы\nте, кто следует за своими глазами: видя\nвсевозможные человеческие наслаждения\nи не имея возможности приобрести их,\nони ощущают, как сердце тает внутри них\nот множества желаний, вожделений и\nзависти; все они страдают тяжёлыми\nболезнями, худеют телом, и старость\nвнезапно настигает их.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">«И вот, ты\nпрекрасна в Мире грядущем» — твоя душа\nбудет наслаждаться Господом, созерцая\nсвет Его Лика. Не таковы те, кто следует\nза своими глазами, чтобы смотреть на\nвсё вызывающее страсть, вожделение и\nнечистоту: померкнут их глаза и не смогут\nвидеть свет.<\/font><\/p>", "<h1 class=\"western\" id=\"section-17\"><strong><font face=\"Times New Roman, serif\"><font size=\"4\">Мудрец\nбережёт свои глаза, чтобы в будущем\nсозерцать ими свет Лика Господа<\/font><\/font><\/strong><\/h1>", "<p><font face=\"Times New Roman, serif\">Вдумаемся\nже: какова надежда человека в дни его\nсуетной жизни в этом мире? Только вечная\nжизнь, жизнь непреходящая, в Мире\nгрядущем, ибо «один час духовного\nнаслаждения в Мире грядущем прекраснее\nвсей жизни этого мира» (Авот 4:17).<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">А что\nпредставляет собой жизнь Мира грядущего?\nВедь наши мудрецы, благословенной\nпамяти, сказали (Брахот 17а): «Мир грядущий\nне подобен этому миру. В Мире грядущем\nнет ни еды, ни питья, ни размножения и\nт. д.; но праведники сидят с венцами на\nголовах и наслаждаются сиянием Шехины,\nкак сказано (Шмот 24:11): „И созерцали\nБога, и ели, и пили“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Если же\nчеловек согрешит своими глазами и будет\nсмотреть на всё вызывающее страсть и\nвожделение, то померкнут его глаза и не\nсмогут видеть свет Лика Господа.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Об этом\nговорит Писание (Коэлет 2:14): «У мудреца\nглаза в голове его, а глупец ходит во\nтьме». Глупец, который не бережёт свои\nглаза согласно закону Торы, когда «идёт»\nпутём всей земли, «идёт в дом вечности\nсвоей» (Коэлет 12:5), — во тьме идёт туда,\nибо глаза его померкнут и он не наслаждается\nсиянием Шехины.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Но «у мудреца\nглаза в голове его»: мудрец принимает\nблизко к сердцу, что его конечное\nпредназначение — жизнь Мира грядущего,\nчтобы «созерцать красоту Господа» и\nнаслаждаться сиянием Его Шехины. Поэтому\nон бережёт свои глаза от созерцания\nзла, чтобы своими глазами увидеть свет\nЛика Господа.*<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Так сказали\nнаши мудрецы, благословенной памяти\n(Ваикра Рабба, конец гл. 23): «Всякий, кто\nвидит нечто запретное и не питает этим\nсвои глаза, удостаивается принять Лик\nШехины, как сказано (Йешаяу 33:15): „И\nзакрывающий глаза свои, чтобы не видеть\nзла“. А что написано вслед за этим (там\nже, 33:17)? „Царя в красоте его увидят глаза\nтвои и т. д.“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И теперь\nраскрывается тайный смысл слов мудрейшего\nиз всех людей в стихе: «Видел ли ты\nчеловека, проворного в своём деле и т.\nд.», ибо этот стих говорит о том, что\nвидят глаза, как будет объяснено, с\nпомощью Господа, благословен Он, в\n«Махазе» [2].<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Поэтому он\nначал словами «видел ли ты». Ты, человек!\nПрежде всего обрати своё сердце на то,\nчто видят твои глаза,** ибо это — врата\nдля стучащихся в двери покаяния. Ищи и\nисследуй, что видели твои глаза во все\nдни твоей жизни — от добра до зла, ибо\nот того, что видят твои глаза, зависят\nвсе твои поступки.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">От того,\nчто видят глаза, зависит вся жизнь: тела\n— на земле, а души — на небесах.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Если человек\nбудет смотреть на нечто запретное,\nявляющееся телесным наслаждением, как\nнаписано (Шир а-Ширим 7:1): «Вернись,\nвернись, и мы посмотрим на тебя», — а\nэто величайшее из телесных наслаждений\nэтого мира, ибо нет телесного наслаждения,\nподобного страсти распутства; и сказали\nнаши мудрецы, благословенной памяти\n(Йома 74б): «„Лучше видение глаз, чем\nхождение души“ (Коэлет 6:9) — созерцание\nженщины глазами приятнее самого\nдействия», — тогда он не будет созерцать\nсвет Лика Господа, сияние Шехины,\nявляющееся духовным наслаждением, как\nнаписано (Шмот 24:11): «И созерцали Бога,\nи ели, и пили».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">И хотя\nпрямого доказательства моему объяснению\nстиха «Видел ли ты…» нет, намёк на это\nимеется в словах наших мудрецов,\nблагословенной памяти (Бава Батра 15б):\n«Поколение Иова было погружено в\nраспутство, как сказано (Иов 27:12): „Вот,\nвсе вы видели, так зачем же предаваться\nсуете?“ И написано (Шир а-Ширим 7:1):\n„Вернись, вернись, и мы посмотрим на\nтебя“».<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">Да будет\nблагословенно Имя Господа, Который\nпомог мне открыть «Петах Эйнаим» —\n«врата глаз». Теперь я буду молить Его,\nчтобы Он помог мне разъяснить вопрос\n«Махазе Эйнаим» во всех его подробностях.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">* То, что\nавтор написал по этому поводу на полях\n(«Гей Хизайон»), помещено нами в конце\nкниги, на стр. 193.<\/font><\/p>", "<p><font face=\"Times New Roman, serif\">** То, что\nавтор написал по этому поводу на полях\n(«Гей Хизайон»), помещено нами в конце\nкниги, на стр. 195.<\/font><\/p>"]}, {"title": "МАХАЗЕ I", "body": ["<h2 class=\"western\" id=\"section-18\"><font size=\"6\">МАХАЗЕ\nI<\/font><\/h2>", "<h1 class=\"western\" id=\"section-19\"><font size=\"4\">Основная\nсила дурного начала действует посредством\nтого, что видят глаза<\/font><\/h1>", "<h1 class=\"western\" id=\"section-20\"><font size=\"4\">Главная\nпричина страсти — то, что видят глаза<\/font><\/h1>", "<p>Написано в Торе (Бемидбар 15:39–40): «И\nне следуйте за сердцем вашим и за глазами\nвашими, вслед за которыми вы блудно\nуклоняетесь, чтобы вы помнили* и исполняли\nвсе Мои заповеди и были святы перед\nвашим Богом».<\/p>", "<p>И Раши объясняет: «„И не следуйте“ —\nподобно выражению „разведать землю“.\nСердце и глаза — разведчики тела, которые\nсводят его с грехами: глаз видит, сердце\nжелает, а тело совершает грехи».<\/p>", "<p>И согласно этому объясняется смысл\nстиха: «вслед за которыми вы блудно\nуклоняетесь» от Господа, поступая\nсогласно всему, чего желает ваша душа;\n«вслед за ними» — вслед за сердцем и\nглазами. Ибо сначала идут они, а вслед\nза ними движутся все органы тела.<\/p>", "<p>Но почему в стихе сердце упомянуто\nпрежде глаз? Ведь, казалось бы, всё\nпроисходит наоборот: сначала глаз видит,\nа затем сердце желает?<\/p>", "<p>Это следует объяснить тем, что само\nжелание открыть глаза и посмотреть\nисходит из сердца: сердце желает увидеть,\nглаз видит, а затем сердце вновь желает\nто, что увидели глаза.<\/p>", "<p>* То, что автор написал по этому поводу\nна полях («Гей Хизайон»), помещено нами\nв конце книги, на стр. 208.<\/p>", "<h1 class=\"western\" id=\"section-21\"><font size=\"4\">Два\nвида дурного начала: неверие и страсть<\/font><\/h1>", "<p>Наши мудрецы, благословенной памяти,\nистолковали (Брахот 12б): «„Вслед за\nсердцем вашим“ — это ересь, и так сказано\n(Теилим 14:1; 53:2): „Сказал негодный в сердце\nсвоём: нет Бога“. „И вслед за глазами\nвашими“ — это греховные помыслы, как\nсказано (Шофтим 14:3): „И сказал Шимшон\nсвоему отцу: её возьми мне, ибо она хороша\nв моих глазах“. „Вслед за которыми вы\nблудно уклоняетесь“ — это помыслы об\nидолопоклонстве, и так сказано (там же,\n8:33): „И блудно последовали они за\nБаалами“».<\/p>", "<p>Ибо два дурных начала создал Святой,\nблагословен Он, в мире: первое — дурное\nначало неверия, второе — дурное начало\nстрасти. Именно они называются у наших\nмудрецов «дурным началом идолопоклонства»\nи «дурным началом распутства» (Йома\n69б; Мидраш Шир а-Ширим, гл. 7).<\/p>", "<p>Дурное начало неверия — отрицать\nсуществование Господа, или отрицать\nнадзор Господа над всеми Его творениями,\nили отрицать, что Тора дана с Небес, а\nтакже награду и наказание. Это дурное\nначало происходит и берёт своё начало\nиз «испорченного источника» (Мишлей\n25:26) — из сердца, замышляющего преступные\nмысли.<\/p>", "<p>А дурное начало страсти — стремление\nк распутству и ко всему вызывающему\nстрасть и вожделение. Это дурное начало\nпроисходит и берёт своё начало из\n«замутнённого источника» (там же) — из\nглаза, смотрящего на всё вызывающее\nстрасть.<\/p>", "<p>И против этих двух дурных начал Святой,\nблагословен Он, заповедал в Своей Торе:\n«И не следуйте за сердцем вашим» — за\nдурным началом неверия; «и за глазами\nвашими» — за дурным началом страсти.<\/p>", "<h1 class=\"western\" id=\"section-22\"><strong><font size=\"4\">Дурное\nначало страсти приводит к неверию<\/font><\/strong><\/h1>", "<p>Однако следует знать, что и дурное\nначало неверия происходит от дурного\nначала страсти, как написано (Мишлей\n18:1): «Стремящийся к страсти ищет отделения;\nпротив всякой мудрости восстаёт».<\/p>", "<p>Тот, кто отделяется от Господа и\nблуждает в пустоте, по пути, который не\nесть путь, говоря: «Нет Бога», — не\nвеликая мудрость увлекла его в заблуждение,\nне острый ум овладел им и столкнул его\nна путь смертной тени. Не мудрость и\nразум стали причиной его падения, ибо\n«Бог создал человека прямым»: Он вложил\nв его сердце мудрость и правильное\nразумение, чтобы познавать правду,\nпостигать и понимать путь истины и путь\nдобра.<\/p>", "<p>Только страсть губит его. Она ослепляет\nглаза мудрецов и разумных людей; она\nлишает человека здравого рассудка и\nзаставляет его идти против воли своего\nСоздателя. Она изгоняет веру и разум из\nсердца человека и вносит в глубины его\nсердца дух безумия, глупости и простодушия.\nОна меняет названия: дух безумия называет\n«знанием», глупость — «мудростью»,\nпростодушие — «разумением», а своё\nсобственное имя — страсть — меняет на\n«просвещённость»; и всех, кто следует\nза ней и прилепляется к ней, называет\n«просвещёнными».<\/p>", "<p>Об этом говорит Писание: «Стремящийся\nк страсти ищет отделения». Тот, кто\nотделяется от Господа и Его Торы,\nотделяется потому, что возжелал страсти\nи именно её ищет. «Против всякой мудрости\nвосстаёт» — лишь в глазах других он\nпредстаёт человеком, рассуждающим о\nразличных воззрениях, исполненным\nмудрости, знания и разума, и кажется,\nбудто именно вследствие своей мудрости\nон отделился.<\/p>", "<p>Но в действительности это не так. Он\nотделился вследствие своей страсти и\n«стремится к страсти»: ищет и исследует,\nчтобы найти довод, склоняющий чашу весов\nв сторону страсти, дабы поступать\nсогласно своему желанию.<\/p>", "<p>Так сказали наши мудрецы, благословенной\nпамяти (Санедрин 63б; см. там внимательно):\n«Знали сыны Израиля, что в идолопоклонстве\nнет ничего действительного, и поклонялись\nидолам лишь для того, чтобы разрешить\nсебе запретные связи открыто».<\/p>", "<p>Таким образом, наши мудрецы ясно\nсказали, что дурное начало идолопоклонства\nберёт своё начало из источника дурного\nначала распутства, а дурное начало\nраспутства, в свою очередь, начинается\nс того, что видят глаза. Поэтому прежде\nвсего человек должен беречь свои глаза\nот созерцания зла, и тогда дурное начало\nвообще не будет властвовать над ним.<\/p>", "<h1 class=\"western\" id=\"section-23\"><strong><font size=\"4\">В\nнаше время следует особенно усердно\nпротивостоять дурному началу страсти<\/font><\/strong><\/h1>", "<p>Кроме того, дурное начало идолопоклонства\nвластвовало лишь в прежние времена. Ибо\nнаши мудрецы, благословенной памяти,\nсказали (Мидраш Шир а-Ширим, гл. 7; см.\nтакже Санедрин 102б; Йома 69б; Авода Зара\n17а): «Два дурных начала создал Святой,\nблагословен Он, в Своём мире: дурное\nначало идолопоклонства и дурное начало\nраспутства. Дурное начало идолопоклонства\nуже было искоренено, а дурное начало\nраспутства существует. Сказал Святой,\nблагословен Он: всякому, кто способен\nустоять перед распутством, Я засчитываю\nэто так, словно он устоял перед обоими».<\/p>", "<p>И если так, то теперь, когда в мире\nвластвует лишь дурное начало распутства,\nа это дурное начало возникает вследствие\nувиденного глазами, — ведь наши мудрецы\nясно сказали: «„И вслед за глазами\nвашими“ — это распутство», — и о дурном\nначале распутства наши мудрецы сказали\n(Сота 8а): «Установлено: дурное начало\nвластвует лишь над тем, что видят глаза\nчеловека».<\/p>", "<p>Поэтому теперь на каждом человеке\nлежит обязанность беречь свои глаза\nсамым тщательным образом. Теперь каждый\nчеловек должен всеми силами своей души\nтрудиться над исполнением слова Господа:\n«И не следуйте за глазами вашими» — с\nещё большим усердием и ещё большей\nсилой, чем он трудится над исполнением\nслова Господа: «И не следуйте за сердцем\nвашим».<\/p>", "<h1 class=\"western\" id=\"section-24\"><strong><font size=\"4\">Увиденное\nглазами — подкуп разума<\/font><\/strong><\/h1>", "<p>И всякий боящийся Господа должен\nпринять близко к сердцу следующее: если\nчеловек видит что-либо своими глазами,\nначинает желать этого и в мыслях своих\nвожделеет этого, тогда ему легко\nоступиться — разрешить запрещённое и\nсчесть грех заповедью, ибо он подкуплен\nсвоей страстью и своим вожделением. А\nв Торе написано (Дварим 16:19): «Ибо подкуп\nослепляет глаза мудрых».<\/p>", "<p>И сказали наши мудрецы, благословенной\nпамяти (Ктубот 105а): «Чему учит этот стих?\nЕсли тому, что нельзя оправдывать\nвиновного и обвинять невиновного, —\nведь уже сказано (там же): „Не искажай\nсуда“. Но Тора сказала: даже для того,\nчтобы оправдать невиновного и обвинить\nвиновного, — „подкупа не бери“ (Шмот\n23:8)».<\/p>", "<p>[И ещё там:] «Сказал Рава: причина\nзапрета подкупа в том, что, когда судья\nпринимает от человека подкуп, его\nсознание сближается с ним, и тот становится\nкак бы частью его самого, а человек не\nвидит собственной вины». [Раши объясняет:\n«Его разум не склоняется к стороне\nобвинения, даже если он намеревается\nсудить по истине».] «Почему подкуп\nназывается „шохад“? Потому что он\nстановится с ним одним целым. Сказал\nрав Папа: пусть человек не судит того,\nкого любит, и того, кого ненавидит: у\nлюбимого он не увидит вины, а у ненавистного\nне увидит заслуги».<\/p>", "<p>Если так, то как же человек может судить\nсамого себя и выносить решение в\nсобственную пользу, утверждая, что нечто\nхорошо и дозволено ему, если он уже\nизбрал то, что увидел своими глазами и\nчего возжелал в мыслях? Ведь он близок\nсамому себе и подкуплен своей страстью\nи своим вожделением.<\/p>", "<p>И потому, даже если он будет усердно\nтрудиться, исследуя и разыскивая истину,\nон не найдёт и не распознает её, пока\nпродолжает желать этого, ибо страсть\nослепляет глаза его разума, и вследствие\nэтого он будет блуждать в своих мыслях.<\/p>", "<p>Поэтому всякий боящийся Господа должен\nберечь свою душу и не поднимать глаз,\nчтобы смотреть на всевозможные прелести\nмира. Ибо если он увидит их глазами и\nвозжелает сердцем, то уже будет подкуплен.\nИ даже если он праведник и не совершит\nгреха умышленно, он совершит его по\nошибке, поскольку станет считать\nзапрещённое дозволенным, а грехи —\nзаповедями.<\/p>", "<h1 class=\"western\" id=\"section-25\"><strong><font size=\"4\">Вожделение\nослепляет глаза человека<\/font><\/strong><\/h1>", "<p>А поскольку всё это — слова истины и\nсправедливости, становится понятен\nстих (Мишлей 25:26): «Замутнённый источник\nи испорченный родник — праведник,\nсклоняющийся перед нечестивым».<\/p>", "<p>«Источник» — это глаз человека, ибо\nодно и то же слово «аин» означает и\nисточник воды, и глаз, которым видят.<\/p>", "<p>И сказали наши мудрецы, благословенной\nпамяти (Санедрин 108а): «Поколение Потопа\nвозгордилось лишь из-за глазного яблока,\nподобного воде, как сказано (Берешит\n6:2): „И брали себе жён из всех, каких\nвыбирали“. Поэтому Он судил их водой,\nподобной глазному яблоку, как сказано\n(там же, 7:11): „Разверзлись все источники\nвеликой бездны“».<\/p>", "<p>А «родник» — это сердце, как сказано\n(Мишлей 13:14): «Учение мудрого — источник\nжизни и т. д.»; и (там же, 16:22): «Источник\nжизни — разум его обладателей и т. д.».\nВедь мудрость и разум находятся в сердце.<\/p>", "<p>И сказали наши мудрецы, благословенной\nпамяти (Ялкут Шимони, Мишлей 1): «Почему\nмудрость помещена в сердце? Потому что\nвсе органы зависят от сердца». Истоки\nжизни всех органов исходят из источника\nсердца, как написано (Мишлей 4:23): «Больше\nвсего хранимого береги сердце своё, ибо\nиз него — источники жизни».<\/p>", "<p>Так сказал мудрейший из всех людей:\nесли «источник замутнён» — то есть глаз\nпомутнён, поскольку человек смотрит\nсвоими глазами на всякое зло, — и «родник\nиспорчен» — сердце испорчено, поскольку\nчеловек замышляет в своём сердце\nпреступные мысли, — тогда «праведник\nсклоняется перед нечестивым», перед\nдурным началом, которое называется\n«нечестивым».<\/p>", "<p>Как сказали наши мудрецы, благословенной\nпамяти (Кидушин 30б; Сукка 52б): «Каждый\nдень дурное начало человека усиливается\nпротив него и стремится умертвить его,\nкак сказано: „Нечестивый высматривает\nправедника и стремится умертвить его“».<\/p>", "<p>Даже если он «праведник», боится\nГоспода и соблюдает Его заповеди и не\nсовершает беззакония умышленно, всё же\nпосле того, как он увидел своими глазами\nнечто греховное и возжелал его в мыслях,\nон уже подкуплен своим вожделением. И\nвожделение ослепляет глаза его разума,\nсклоняя его мнение в сторону желаемого\nи заставляя говорить: «Это дозволено и\nправильно». И в конце концов он согрешит\nпо ошибке.*<\/p>", "<p>Об этом говорит Писание (Мишлей 4:19):\n«Путь нечестивых — как тьма; они не\nзнают, обо что споткнутся».<\/p>", "<p>Путь, по которому они шли, переходя от\nлёгкого греха к тяжёлому, пока не стали\nзаконченными «нечестивцами», — «как\nтьма», ибо глаза их разума померкли\nиз-за всех страстей и вожделений, которые\nони видели телесными глазами. Они по\nошибке разрешали себе запрещённое, ибо\nподкуп ослепил глаза их разума, и они\nходили во тьме.<\/p>", "<p>Таково было начало их пути. А затем\nони переходили от падения к падению,\nпока не стали умышленно совершать всякое\nзло. «Не знают» — не принимали близко\nк сердцу необходимость знать и заранее\nзадуматься [см. Брахот 18а, комментарий\nРаши к словам «эти забыты»: «а мёртвые\nне знают ничего» — они делают себя\nсловно не знающими], «обо что споткнутся».<\/p>", "<p>Ибо преткновение связано прежде всего\nс глазами, как сказали наши мудрецы\n(Калла Раббати, гл. 3): «Не споткнись\nглазами своими, ибо преткновение — в\nглазах. Так ты находишь, что Уза и Азаэль\nспоткнулись лишь своими глазами, как\nсказано (Берешит 6:2): „И увидели сыны\nБожьи дочерей человеческих и т. д.“».<\/p>", "<p>И чем больше они смотрят телесными\nглазами на всевозможные прелести мира,\nтем сильнее ослепляют глаза своего\nразума и спотыкаются, словно слепой во\nтьме.<\/p>", "<p>* То, что автор написал по этому поводу\nна полях («Гей Хизайон»), помещено в\nконце книги. на стр. 216.<\/p>", "<h1 class=\"western\" id=\"section-26\"><strong><font size=\"4\">Берегущий\nсвои глаза видит истину<\/font><\/strong><\/h1>", "<p>Об этом говорит Писание (Коэлет 2:14):\n«У мудреца глаза в голове его, а глупец\nходит во тьме». Мудрец принимает близко\nк сердцу необходимость прежде всего\nберечь свои глаза: он закрывает телесные\nглаза, чтобы не смотреть на всё вызывающее\nстрасть и вожделение, дабы не померкли\nглаза его разума. Поэтому он мудр и видит\nсвет на всех своих путях.<\/p>", "<p>А глупец смотрит телесными глазами\nна всевозможные прелести мира, как\nнаписано (Мишлей 17:24): «Перед лицом\nразумного — мудрость, а глаза глупца —\nна краю земли».* Поэтому глаза его разума\nпомеркли, и он «ходит во тьме»: из-за\nпомрачения глаз своего разума он идёт\nот падения к падению по путям смерти.\nНачинает он с неумышленного греха, ибо\nглаза его разума померкли и он называет\nзло добром, а заканчивает тем, что\nумышленно избирает всякое зло.<\/p>", "<p>Поэтому всякий человек, дорожащий\nсвоей душой, должен принять близко к\nсердцу необходимость укрепиться и\nприложить все силы, чтобы закрывать\nсвои глаза от созерцания всевозможных\nпрелестей мира. Пусть опасается за свою\nдушу: если он увидит глазами, то возжелает\nсердцем, и тогда померкнут глаза его\nразума, так что запрещённое он назовёт\nдозволенным, а кривое — прямым, как\nнаписано (Мишлей 21:2): «Всякий путь\nчеловека прям в его глазах, но Господь\nиспытывает сердца». Когда человек видит\nнечто телесными глазами, он оказывается\nподкуплен, и это начинает казаться\nпрямым в глазах его разума.<\/p>", "<p>А если он уже увидел что-либо своими\nглазами и возжелал это в своих мыслях,\nпусть не полагается на глаза своего\nразума, ибо человек не видит собственной\nвины. Пусть лишь прислушивается к совету\nдругих, как написано (Мишлей 12:15): «Путь\nглупца прям в его глазах, а слушающий\nсовет — мудр».<\/p>", "<p><font face=\"Times New Roman, serif\">*  («Гей\nХизайон»), помещено в конце книги, на\nстр. 216.<\/font><\/p>", "<h1 class=\"western\" id=\"section-27\"><strong><font size=\"4\">Даже\nодно увиденное ослепляет здравый разум<\/font><\/strong><\/h1>", "<p>Доказательством этому служат слова\nнаших мудрецов, благословенной памяти\n(Хагига 11б): «Не разъясняют троим тайны\nзапретных связей [Раши объясняет: те,\nкоторые не изложены явно]. Почему? Это\nследует из рассуждения. Когда двое сидят\nперед своим учителем, один обсуждает\nвопрос с учителем, а другой внимательно\nслушает учение. Если же их трое, один\nобсуждает вопрос с учителем, а двое\nдругих обсуждают его между собой и не\nзнают, что говорит их учитель, и могут\nприйти к тому, чтобы разрешить запрещённое\nв области запретных связей.<\/p>", "<p>Если так, то и всю Тору следовало бы\nпреподавать таким же образом? Запретные\nсвязи отличаются тем, что, как сказал\nучитель: „К грабежу и запретным связям\nдуша человека стремится и желает их“.\nЕсли так, то и относительно грабежа\nдолжно быть то же самое? В отношении\nзапретных связей — находится ли запретное\nперед ним или не находится перед ним —\nего дурное начало сильно; в отношении\nже грабежа, когда желаемое перед ним,\nего дурное начало сильно, а когда его\nперед ним нет — не столь сильно».<\/p>", "<p>И написали Тосафот (Сота 8а): «Установлено:\nдурное начало властвует лишь над тем,\nчто видят глаза человека». Возникает\nвопрос из главы «Эйн доршин», где сказано,\nчто относительно запретных связей —\nнаходится ли запретное перед ним или\nне находится перед ним — его дурное\nначало сильно. Но здесь нет никакого\nпротиворечия, ибо там смысл таков: после\nтого как он однажды увидел запретную\nженщину, он продолжает постоянно думать\nо ней, даже когда её нет перед ним и т.\nд.<\/p>", "<p>И вот, вдумаемся: мудрецы настолько\nстрого отнеслись к этому, что запретили\nразъяснять это троим из опасения, что\nдвое начнут обсуждать вопрос между\nсобой, не услышат, что говорит их учитель,\nи придут к тому, чтобы разрешить\nзапрещённое. Такой запрет мудрецы\nустановили именно в отношении запретных\nсвязей, поскольку дурное начало запретных\nсвязей сильнее дурного начала остальных\nгрехов.<\/p>", "<p>Однако сама необходимость отдаляться\nот греха и не смотреть на него глазами\n— потому что, увидев его глазами, человек\nвозжелает его в мыслях, а подкуп вожделения\nвведёт его в заблуждение и заставит\nсказать, что это дозволено, — относится\nко всем грехам.<\/p>", "<p>Поэтому всякий человек, дорожащий\nсвоей душой, должен опасаться за неё и\nзакрывать свои глаза от всевозможных\nпрелестей мира, и тогда просветлеют\nглаза его разума.<\/p>"]}, {"title": "МАХАЗЕ II", "body": ["<h2 class=\"western\" id=\"section-28\"><font size=\"6\">МАХАЗЕ\nII<\/font><\/h2>", "<h1 class=\"western\" id=\"section-29\"><font size=\"4\">Обязанность\nзакрывать глаза, чтобы не видеть зла, и\nдостоинство открывать их, чтобы видеть\nдобро<\/font><\/h1>", "<h1 class=\"western\" id=\"section-30\"><font size=\"4\">Строгость\nзапрета смотреть на запрещённое<\/font><\/h1>", "<p>В Торе написано:<\/p>", "<blockquote>«Когда выйдешь станом против\nврагов твоих, то берегись всего\nдурного»<br/>\n(Дварим 23:10).<\/blockquote>", "<p>Наши мудрецы сказали:<\/p>", "<blockquote>«“Берегись всего дурного”\n(Дварим 23:10) — пусть человек не смотрит\nна красивую женщину, даже незамужнюю;\nна замужнюю женщину — даже некрасивую;*\nи на цветные одежды женщины; и на осла\nи ослицу, на кабана и свинью, и на птиц\nв то время, когда они совокупляются друг\nс другом, — даже если бы он был весь\nполон глаз, подобно Ангелу смерти».<\/blockquote>", "<p>Об Ангеле смерти сказали, что весь он\nполон глаз и т. д.<\/p>", "<p>А относительно слов «и не [смотреть]\nна цветные одежды женщины» рав Йеуда\nсказал от имени Шмуэля: даже если они\nрасстелены на стене.<\/p>", "<p>Рав Папа сказал: это относится к тому\nслучаю, когда человек знает их владелицу.<\/p>", "<p>Рава сказал: это следует также из\nточности формулировки Барайты, ибо\nсказано: «И не [смотреть] на цветные\nодежды <strong>женщины<\/strong>», а не просто:\n«И не [смотреть] на цветные одежды».\nСледовательно, именно таков смысл.<\/p>", "<p>И нет различия между старыми одеждами\nи новыми<br/>\n(Авода Зара 20а).<\/p>", "<p>Можно истолковать слова:<\/p>", "<blockquote>«Когда выйдешь станом…»<\/blockquote>", "<p>следующим образом.<\/p>", "<p>Даже если ты праведник и с тобой\nнаходится «стан Бога» — святые ангелы,\nпоскольку ты совершил множество заповедей\nи добрых дел; и даже если ты:<\/p>", "<blockquote>«выйдешь на войну против врагов\nтвоих»,<\/blockquote>", "<p>то есть против дурного начала\nидолопоклонства и дурного начала\nразврата, — ибо наши мудрецы сказали:<\/p>", "<blockquote>«Два дурных начала создал Святой,\nблагословен Он, в Своём мире: дурное\nначало идолопоклонства и дурное начало\nразврата…»<br/>\n(Мидраш Шир а-Ширим, гл.\n7),<\/blockquote>", "<p>— несмотря на всё это, не говори:<\/p>", "<p>«Я буду смотреть своими глазами на\nвсё, что возбуждает желание, но зло не\nпостигнет меня; дурное начало не соблазнит\nменя и не одолеет меня, ибо со мной\nнаходится великий и могучий стан».<\/p>", "<p>Нет!<\/p>", "<p>Напротив:<\/p>", "<blockquote>«Берегись всего дурного».<\/blockquote>", "<p><strong>Закрой свои глаза и не смотри на\nзло.<\/strong><\/p>", "<p><em>* Примечание: то, что автор написал\nпо этому поводу на полях («Гей Хизайон»),\nпомещено в конце книги, стр. <font face=\"Tahoma\"><span lang=\"he-IL\">רכז<\/span><\/font>.<\/em><\/p>", "<h1 class=\"western\" id=\"section-31\"><font size=\"4\">Человек\nспособен остерегаться запрещённых\nзрелищ<\/font><\/h1>", "<p>Пусть человек примет близко к сердцу\nслова наших мудрецов:<\/p>", "<blockquote>«Пусть не смотрит… даже если бы\n[человек] был весь полон глаз, подобно\nАнгелу смерти».<\/blockquote>", "<p>Почему мудрецам понадобилось говорить\nо таком явлении, которого вообще не\nсуществует в мире, — о человеке, всё\nтело которого покрыто глазами?<\/p>", "<p>Они желали устранить из сердца человека\nследующее возражение.<\/p>", "<p>Человек может сказать:<\/p>", "<blockquote>«Святой, благословен Он, не\nпредъявляет Своим созданиям невыполнимых\nтребований»<br/>\n(Авода Зара 3а).<\/blockquote>", "<p>Как же тогда можно утверждать, что\nкаждому человеку из Израиля заповедано\nвсю жизнь остерегаться того, чтобы\nсмотреть на женщину?<\/p>", "<p>Причём даже когда он выходит на войну\nпротив врагов, когда его глаза должны\nбыть открыты и смотреть во все стороны,\nчтобы защищаться от неприятеля!<\/p>", "<p>И как можно сказать ещё больше: что\nвсякий раз, когда мужчина смотрит на\nженщину, даже если при этом совершенно\nо ней не помышляет, он нарушает запрет:<\/p>", "<blockquote>«Берегись всего дурного»?<\/blockquote>", "<p>Ведь наши мудрецы сказали:<\/p>", "<blockquote>«Везде, где сказано “берегись”,\n“как бы не” или “не”, — это означает\nзапретительную заповедь»<br/>\n(Эрувин\n96а; см. также Ктубот 46а, Раши, «ве-нишмарта»).<\/blockquote>", "<p>Разве возможно полностью остеречься\nтакого?<\/p>", "<p>Можно было бы поэтому утверждать, что\nнаписанное в Торе:<\/p>", "<blockquote>«Берегись…»<\/blockquote>", "<p>является лишь предостережением против\nраспространения дурной молвы<br/>\n(Ктубот,\nтам же),<\/p>", "<p>а также предостережением:<\/p>", "<blockquote>«Чтобы человек не предавался\n[нечистым] мыслям днём и вследствие\nэтого не пришёл к нечистоте ночью»<br/>\n(Авода\nЗара 20б; см. Тосафот там).<\/blockquote>", "<p>Но простой взгляд на женщину, можно\nбыло бы возразить, сам по себе не запрещён\nТорой и не выводится из слов «берегись»,\nпоскольку полностью избежать этого\nневозможно.<\/p>", "<p>На все эти доводы наши мудрецы ответили:\n<strong>это не так<\/strong>.<\/p>", "<p>На самом деле остерегаться этого\nвозможно — и вполне возможно.<\/p>", "<p>Даже если бы человек был:<\/p>", "<blockquote>«весь полон глаз, подобно Ангелу\nсмерти»,<\/blockquote>", "<p>он всё равно мог бы беречь себя и\nзакрыть все свои многочисленные глаза,\nрасположенные по всему его телу —\nспереди и сзади.<\/p>", "<p>Тем более теперь, когда у человека\nвсего два глаза, расположенные спереди\nна голове.<\/p>", "<p>Несомненно, каждый человек способен\nотвернуть лицо от женщины.<\/p>", "<p>И даже если он стоит посередине, а\nвокруг него находится множество женщин,\nон способен закрыть глаза.<\/p>", "<p>Поэтому и это входит в повеление:<\/p>", "<blockquote>«Берегись всего дурного».<\/blockquote>", "<p><em>* Примечание: написанное автором по\nэтому вопросу на полях («Гей Хизайон»)\nпомещено в конце книги, стр. <font face=\"Tahoma\"><span lang=\"he-IL\">רכט<\/span><\/font>.<\/em><\/p>", "<h1 class=\"western\" id=\"section-32\"><font size=\"4\">В\nруках человека — не позволить ушам\nслышать, а глазам видеть зло<\/font><\/h1>", "<p>Пусть каждый человек обратит внимание\nна то, что Господь создал человеку два\nглаза и для каждого глаза — веки.<\/p>", "<p><strong>Глаза — чтобы видеть, а веки —\nчтобы закрывать глаза и не видеть.<\/strong><\/p>", "<p>И об этом говорит стих:<\/p>", "<blockquote>«Ухо слышащее и глаз видящий —\nГосподь создал также их обоих»<br/>\n(Мишлей\n20:12).<\/blockquote>", "<p>На первый взгляд этот стих непонятен.<\/p>", "<p>Ведь Господь создал всего человека и\nвсе творения мира. Всё это уже включено\nв общее утверждение о Творце.<\/p>", "<p>Почему же Писание особо выделяет <strong>ухо\nи глаз<\/strong>?<\/p>", "<p>Кроме того, слова:<\/p>", "<blockquote>«также их обоих»<\/blockquote>", "<p>кажутся лишними.<\/p>", "<p>Можно было бы просто сказать:<\/p>", "<blockquote>«Ухо слышащее и глаз видящий —\nГосподь создал».<\/blockquote>", "<p>Зачем добавлено «также их обоих»?<\/p>", "<p>Однако следует задуматься: глаза и\nуши человека отличаются от остальных\nего органов тем, что они не находятся\nпод властью человека в той же степени,\nкак остальные части его тела.<\/p>", "<p>Все прочие органы действуют согласно\nжеланию человека.<\/p>", "<p>Если он хочет — его рука действует;\nесли не хочет — рука не действует.<\/p>", "<p>Если он хочет — ноги идут; если не\nхочет — они не идут.<\/p>", "<p>Если он хочет — рот говорит; если не\nхочет — не говорит.<\/p>", "<p>И так со всеми органами.<\/p>", "<p>Но <strong>ухо и глаз совершают свою\nфункцию независимо от желания человека<\/strong>.<\/p>", "<blockquote>«Ухо слышит» —<\/blockquote>", "<p>даже когда человек желает, чтобы оно\nне слышало, оно слышит само по себе.<\/p>", "<blockquote>«Глаз видит» —<\/blockquote>", "<p>даже когда человек желает, чтобы он\nне видел, глаз видит сам по себе<br/>\n(см.\nНедарим 32б, Ран; также Танхума, гл.\n«Толдот»).<\/p>", "<p>И всё же даже уши и глаза Господь\nпередал во власть человека.<\/p>", "<p>Для глаз Он создал веки.<\/p>", "<p>Хотя сам глаз видит независимо от\nжелания человека, человек способен\nпосредством век закрыть ему возможность\nвидеть.<\/p>", "<p>А для ушей Он создал мягкую мочку и\nпальцы, заострённые словно колышки.<\/p>", "<p>Как сказали наши мудрецы:<\/p>", "<blockquote>«Почему всё ухо твёрдое, а мочка\n— мягкая? Чтобы, если человек услышит\nнечто непристойное, он согнул мочку\nвнутрь уха»<br/>\n(Ктубот 5б).<\/blockquote>", "<p>И ещё сказали мудрецы:<\/p>", "<blockquote>«Почему пальцы человека заострены\nподобно колышкам? Чтобы, если человек\nуслышит нечто непристойное, он вложил\nпальцы в уши»<br/>\n(там же).<\/blockquote>", "<p>Таким образом, хотя само ухо слышит\nнезависимо от желания человека, в его\nсилах преградить слуху путь — посредством\nмочки уха или пальца.<\/p>", "<p>И в этом смысл стиха:<\/p>", "<blockquote>«Ухо слышащее» —<\/blockquote>", "<p>само по себе;<\/p>", "<blockquote>«и глаз видящий» —<\/blockquote>", "<p>сам по себе, независимо от желания\nчеловека.<\/p>", "<p>Однако:<\/p>", "<blockquote>«Господь создал [аса]…»<\/blockquote>", "<p>Здесь слово <strong>«аса»<\/strong> можно\nпонимать в значении <strong>«устроил,\nисправил, привёл в надлежащее состояние»<\/strong>.<\/p>", "<p>Подобное употребление встречается в\nстихе:<\/p>", "<blockquote>«А Мефивошет… не приводил в\nпорядок ног своих и не подстригал усов\nсвоих»<br/>\n(II Шмуэль 19:25).<\/blockquote>", "<p>Раши объясняет там, что это выражение\nозначает «исправление, приведение в\nпорядок».<\/p>", "<p>Подобным образом сказано:<\/p>", "<blockquote>«И сделает ногти свои»<br/>\n(Дварим\n21:12),<\/blockquote>", "<p>что рабби Элиэзер объясняет как\n«подрежет»<br/>\n(Йевамот 48а).<\/p>", "<p>Поэтому слова:<\/p>", "<blockquote>«Господь создал также их обоих»<\/blockquote>", "<p>означают: <strong>и эти два органа — ухо\nи глаз — Господь устроил таким образом,\nчтобы они также находились во власти\nчеловека, подобно остальным его органам.<\/strong><\/p>", "<p>Для уха Он предусмотрел мочку и палец,\nа для глаза — веки.<\/p>", "<p>Следовательно, в руках самого человека\nнаходится возможность <strong>не позволить\nсвоим ушам слушать и своим глазам видеть\nто, что непристойно и недостойно<\/strong>.<\/p>", "<h1 class=\"western\" id=\"section-33\"><font size=\"4\">Зрением\nуправлять легче, чем слухом<\/font><\/h1>", "<p>Пусть каждый человек примет близко к\nсердцу следующее.<\/p>", "<p>Чтобы не позволить уху слышать, Господь\nсоздал средство, которое не действует\nсамо собой и не осуществляется в одно\nмгновение: человеку необходимо поднять\nобе руки к обоим ушам, загнуть мочку\nвнутрь уха и плотно приложить туда\nпалец.<\/p>", "<p>В этом есть определённое действие,\nусилие и труд.<\/p>", "<p>А если человеку приходится оставаться\nтак час или два — например, когда он\nсидит среди людей, говорящих непристойные,\nпостыдные и насмешливые речи, но не\nможет уйти оттуда, как бывает, когда\nнесколько человек вместе едут в одной\nповозке, — то это уже весьма тяжёлое и\nутомительное усилие.<\/p>", "<p>Но чтобы не позволить <strong>глазу видеть<\/strong>,\nГосподь создал чрезвычайно лёгкое\nсредство, которое действует почти само\nсобой и совершается мгновенно.<\/p>", "<p>Настолько быстро, что это стало\nобщеизвестным выражением для обозначения\nвсякого действия, совершающегося с\nнеобычайной быстротой:<\/p>", "<blockquote><strong>«Ке-хереф айн» — «в мгновение\nока».<\/strong><\/blockquote>", "<p>Слово «хереф» означает ослабление,\nпрекращение усилия и отдых от работы,\nибо закрывание глаз является отдыхом\nдля глаз и век.<\/p>", "<p>Держать глаза закрытыми днём и ночью\nи вовсе не открывать их — для глаз и век\nэто не представляет никакого труда.<\/p>", "<p>Напротив: для них это именно <strong>отдых\nот работы<\/strong>.<\/p>", "<p>А вот открыть глаза и смотреть ими —\nэто уже работа для глаз.<\/p>", "<p>Держать их открытыми, совершенно не\nсмыкая век, — дело чрезвычайно трудное,\nдаже в течение одного часа.<\/p>", "<p>Поэтому веко называется <strong>«афъаф»<\/strong>\n— оно словно постоянно «пролетает» над\nглазом, то и дело опускаясь на него.<\/p>", "<p>Из этого человек должен понять, что\nволя Господа состоит в том, чтобы человек\nзакрывал глаза и не смотрел на все\nсоблазнительные вещи этого мира, открывая\nих тогда, когда это необходимо: ради\nзаповеди или ради действительно нужного\nдела.<\/p>", "<p>Рамбам в комментарии к Мишне (Авот\n1:17) пишет, что речь человека, с точки\nзрения требований Торы, разделяется на\nпять категорий:<\/p>", "<p><strong>заповеданная, дозволенная,\nпохвальная, праздная и запрещённая.<\/strong><\/p>", "<p>Подобным образом можно рассматривать\nтакже то, <strong>что слышат уши и что видят\nглаза<\/strong>.<\/p>", "<h1 class=\"western\" id=\"section-34\"><font size=\"4\">Обязанность\nбыть осторожным со зрением строже, чем\nсо слухом<\/font><\/h1>", "<p>Если человек не закрывает глаза, чтобы\nне видеть зло, его проступок тяжелее,\nчем если он не закрывает уши, чтобы не\nслышать зло.<\/p>", "<p>Для этого есть несколько причин.<\/p>", "<p><strong>Первая причина.<\/strong> Зло посредством\nзрения проникает в самые глубокие\nкомнаты человеческого сердца гораздо\nсильнее, чем посредством того, что слышит\nухо.<\/p>", "<p>Ибо:<\/p>", "<blockquote><strong>«Слышать — не то же самое,\nчто видеть».<\/strong><\/blockquote>", "<p>Увиденное собственными глазами\nпроизводит на человека более сильное\nвпечатление, чем услышанное.<\/p>", "<p><strong>Вторая причина.<\/strong> Закрыть глаза\nчеловеку намного легче, чем закрыть\nуши.<\/p>", "<p>Закрывание глаз не требует никакой\nработы, усилия или труда, тогда как\nзакрывание ушей требует значительно\nбольшего действия и усилия.<\/p>", "<p><strong>Третья причина.<\/strong> Человеку не\nприходится стыдиться или смущаться,\nкогда он закрывает глаза.<\/p>", "<p>Но если он станет закрывать уши мочкой\nи пальцами, он может почувствовать стыд\nи неловкость перед окружающими, поскольку\nлюди могут начать смеяться над ним.<\/p>", "<p>Поэтому ответственность человека за\nохрану зрения особенно велика.<\/p>", "<h1 class=\"western\" id=\"section-35\"><font size=\"4\">Глаза\nчеловека подобны окнам дома, а веки —\nставням<\/font><\/h1>", "<p>Пусть каждый человек примет близко к\nсердцу следующее сравнение.<\/p>", "<p><strong>Глаза человека подобны окнам\nдома<\/strong><br/>\n(как объясняется в Берешит\nРабба, гл. 65),<\/p>", "<p>а <strong>веки подобны дверцам, или ставням,\nэтих окон<\/strong>.<\/p>", "<p>Обычай всех людей таков: утром они\nоткрывают ставни окон навстречу дневному\nсвету, чтобы солнечный свет проник через\nокна внутрь дома и осветил все его\nкомнаты.<\/p>", "<p>А вечером они закрывают их, чтобы в\nночной тьме и мраке, когда все обитатели\nдома спят на своих ложах, воры не проникли\nчерез окна в дом и не похитили всё добро,\nнаходящееся в нём.<\/p>", "<p>Так поступает каждый разумный человек.<\/p>", "<p>Но если найдётся человек, который\nстанет поступать совершенно наоборот\n— <strong>утром закрывать ставни окон, а\nвечером открывать их<\/strong>, — все будут\nсмеяться над ним и скажут:<\/p>", "<p>«Это глупец, лишённый разума!<\/p>", "<p>Весь день он сидит во тьме и не видит\nсвета, а ночью оставляет своё имущество\nи всё добро своего дома доступным для\nворов!»<\/p>", "<h1 class=\"western\" id=\"section-36\"><font size=\"4\">Мудрец\nоткрывает глаза только для Торы и добрых\nдел<\/font><\/h1>", "<p>Таков путь всякого мудрого сердцем:\n<strong>открывать глаза для света, ибо он\nблаг<\/strong>, смотреть в книгу Торы Господа\nи читать её; видеть лица праведников —\nлюдей цельных и прямых сердцем — и\nнаблюдать за всеми их добрыми поступками.<\/p>", "<p>Тогда свет добра проникает через окна\n— то есть через глаза — внутрь дома, то\nесть в сердце, и свет добра озаряет все\nкомнаты его сердца.<\/p>", "<p>Увидев добрые поступки праведников,\nсердце человека пожелает и самому\nпоступать подобно им, а все его органы\nустремятся со святым воодушевлением\nвслед за светом добра, который через\nглаза воссиял в глубинах его сердца.<\/p>", "<p>Но когда наступает время тьмы — когда\nперед глазами появляется нечто дурное,\nвозбуждающее страсть и желание, или\nнечто нечистое, — мудрый закрывает\nглаза веками.<\/p>", "<p>Он делает это, чтобы вор — <strong>дурное\nначало<\/strong> — не проник в дом, то есть\nв сердце, через окна, то есть через глаза,\nи не похитил его сердце, разумение и\nзнание, мудрость и рассудок, а затем не\nсоблазнил его совершить зло.<\/p>", "<p>Как гласит известное изречение:<\/p>", "<blockquote>«Глаз видит, сердце желает, а тело\nсовершает [грех]».<\/blockquote>", "<p>Также путь всякого мудрого сердцем —\nсмотреть и обращать внимание на всё,\nчто пробуждает его сердце <strong>избирать\nдобро<\/strong>.<\/p>", "<p>Он пойдёт в дом скорбящего, чтобы\nсобственными глазами увидеть конец\nкаждого человека.<\/p>", "<p>Там он приобретёт «сердце мудрых» и\nзадумается о своём собственном конце:\nпридёт день его смерти, он оставит свой\nдом и всё дорогое ему и возвратится в\nземлю; вся его земная надежда окажется\n«суетой сует».<\/p>", "<p>Поэтому он пробудится идти путём\nГоспода — хранить и исполнять написанное\nв Его Торе.<\/p>", "<p>Ибо тогда его удел будет в высотах\nНебес; там будет дом его духа, души и\nнешамы.<\/p>", "<p>Как сказано:<\/p>", "<blockquote>«Лучше идти в дом скорби, нежели\nидти в дом пира, ибо таков конец всякого\nчеловека, и живой примет это к\nсердцу»<br/>\n(Коэлет 7:2).<\/blockquote>", "<p>Он пойдёт также к больным, чтобы увидеть\nих болезни, и в дома бедных и нуждающихся,\nчтобы увидеть их нищету и лишения.<\/p>", "<p>Когда он собственными глазами увидит\nболезни людей и колесо бедности,\nвращающееся в мире, он примет близко к\nсердцу, каков может быть конец человеческой\nжизни.<\/p>", "<p>Кроме того, увиденное собственными\nглазами пробудит в его сердце милосердие\nи сострадание: он захочет помочь им в\nбеде и несчастье, восполнить их нужды\nи молиться за них Господу, чтобы Он\nисцелил их и избавил от всякой беды и\nтесноты.<\/p>", "<p>Также он смотрит на <strong>цицит<\/strong>,\nчтобы вспомнить и исполнить все заповеди\nГоспода, как написано:<\/p>", "<blockquote>«И увидите его, и вспомните все\nзаповеди Господа, и исполните их; и не\nследуйте…»<br/>\n(Бемидбар 15:39).<\/blockquote>", "<p>И сказали наши мудрецы:<\/p>", "<blockquote>«Зрение приводит к воспомина
