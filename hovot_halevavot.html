но в этом мире.<\/li><\/ul><p>Но, по их мнению, Тора дана не для того, чтобы даровать за её исполнение награду в грядущем мире или наказывать нарушающих её.<\/p><p>Они пришли к этой ошибке потому, что в книгах пророков многократно говорится о награде и наказании в этом мире, но не столь явно говорится о грядущем мире.<\/p><p>Однако наш учитель рабби Саадия, благословенна его память, подробно объяснил в разделе «Бехукотай» ясные доводы, опровергающие мнение этих людей.<\/p><p>Кроме того, в книгах пророков имеются убедительные доказательства награды и наказания в грядущем мире.<\/p><p>Одним из доказательств являются слова царя Шломо:<\/p><p>«Ибо всякое дело Бог приведёт на суд, включая всё сокрытое, будь то добро или зло».<\/p><p>(Коэлет, 12:14.) (<button aria-expanded=\"false\" aria-label=\"Примечание 63\" class=\"note-ref\" data-note=\"63\" type=\"button\">63<\/button>)<\/p><p>Ещё одно доказательство:<\/p><p>«И вновь увидите разницу между праведником и злодеем, между служащим Богу и тем, кто не служил Ему. Ибо вот, приходит день, пылающий как печь, и будут все гордецы и все творящие зло соломой, и сожжёт их грядущий день, — сказал Господь Воинств, — так что не оставит им ни корня, ни ветви... И будете попирать злодеев, ибо они станут пеплом под ступнями ваших ног в день, который Я приготовлю, — сказал Господь Воинств».<\/p><p>(Малахи, 3:18–4:3.) (<button aria-expanded=\"false\" aria-label=\"Примечание 64\" class=\"note-ref\" data-note=\"64\" type=\"button\">64<\/button>)<\/p><p>И сказано:<\/p><p>«И выйдут, и увидят трупы людей, восставших против Меня, ибо червь их не умрёт и огонь их не погаснет, и будут они мерзостью для всякой плоти».<\/p><p>(Йешаяу, 66:24.) (<button aria-expanded=\"false\" aria-label=\"Примечание 65\" class=\"note-ref\" data-note=\"65\" type=\"button\">65<\/button>)<\/p><p>И сказано:<\/p><p>«Как велико благо Твоё, которое Ты сокрыл для боящихся Тебя, которое приготовил для уповающих на Тебя перед сынами человеческими».<\/p><p>(Теилим, 31:20.) (<button aria-expanded=\"false\" aria-label=\"Примечание 66\" class=\"note-ref\" data-note=\"66\" type=\"button\">66<\/button>)<\/p><p>И сказано:<\/p><p>«Так сказал Господь Воинств: если будешь ходить путями Моими и соблюдать установления Мои... то Я дам тебе возможность ходить среди этих стоящих».<\/p><p>(Зхария, 3:7.) (<button aria-expanded=\"false\" aria-label=\"Примечание 67\" class=\"note-ref\" data-note=\"67\" type=\"button\">67<\/button>)<\/p><p>И сказано:<\/p><p>«Ничей глаз не видел, кроме Тебя, Боже, того, что Он сделает для ожидающего Его».<\/p><p>(Йешаяу, 64:3.) (<button aria-expanded=\"false\" aria-label=\"Примечание 68\" class=\"note-ref\" data-note=\"68\" type=\"button\">68<\/button>)<\/p><p>И сказано:<\/p><p>«И многие из спящих в прахе земли пробудятся: одни — к вечной жизни, а другие — к позору и вечному отвращению».<\/p><p>(Даниэль, 12:2.)<\/p><p>Ещё одно доказательство:<\/p><p>«И пойдёт перед тобой праведность твоя, слава Господа примет тебя».<\/p><p>(Йешаяу, 58:8.) (<button aria-expanded=\"false\" aria-label=\"Примечание 69\" class=\"note-ref\" data-note=\"69\" type=\"button\">69<\/button>)<\/p><p>Существует множество подобных стихов, и если перечислять их все, изложение станет слишком длинным.<\/p><h3 class=\"subheading\" id=\"sub-5-28\"><strong>Четвёртая ступень<\/strong><\/h3><p>На четвёртой ступени находятся люди, в которых прочно укоренилась вера в истинность Торы и в существование награды и наказания в грядущем мире.<\/p><p>Однако они настолько сильно привязаны к этому миру и его удовольствиям, которых не могут достичь в желаемой мере, что превращают действия, предназначенные для служения Всевышнему, в ловушки для других людей.<\/p><p>Они внешне изображают себя праведниками, чтобы обманывать окружающих, добиваться их доверия, получать от них материальную поддержку и почёт.<\/p><p>Они принимают Тору лишь внешне, но не внутренне; устами, но не сердцем.<\/p><p>О таких людях сказано:<\/p><p>«Устами своими он говорит мирное ближнему своему, а внутри себя устраивает ему засаду».<\/p><p>(Ирмияу, 9:7.)<\/p><p>«Устами своими и губами своими почитали Меня, но сердце своё удалили от Меня».<\/p><p>(Йешаяу, 29:13.)<\/p><h3 class=\"subheading\" id=\"sub-5-29\"><strong>Пятая ступень<\/strong><\/h3><p>На пятой ступени находятся люди, которым ясно всё сказанное выше об истинности Торы.<\/p><p>Они также знают, что за её исполнение полагается награда, а за нарушение — наказание в грядущем мире.<\/p><p>Однако из-за сильной привязанности к удовольствиям этого мира они приняли на себя исполнение Торы с намерением получить за это как награду от Всевышнего, так и похвалу и уважение людей в этом мире.<\/p><p>Такое стремление является одной из форм лицемерия, называемой <strong>«скрытым соучастием»<\/strong>.<\/p><p>Внешне создаётся впечатление, будто они служат только Всевышнему.<\/p><p>Но в действительности в своём сердце они намереваются служить наряду с Творцом также самим себе и собственным удовольствиям.<\/p><h3 class=\"subheading\" id=\"sub-5-30\"><strong>Шестая ступень<\/strong><\/h3><p>На шестой ступени находятся люди, которые не стремятся посредством своих поступков получить похвалу и уважение от других людей.<\/p><p>Они желают получить награду исключительно от Творца, но только в этом мире.<\/p><p>Причина заключается в том, что они любят этот мир и предпочитают его удовольствия.<\/p><p>Хотя они знают о существовании награды в грядущем мире, они не стремятся к ней, поскольку не способны постичь её сущность и духовную сладость.<\/p><h3 class=\"subheading\" id=\"sub-5-31\"><strong>Седьмая ступень<\/strong><\/h3><p>На седьмой ступени находятся люди, которым ясно всё сказанное выше.<\/p><p>Они служат Всевышнему ради получения награды как в этом мире, так и в мире грядущем.<\/p><p>Однако они не знают, как служить Всевышнему исключительно ради Его имени: как возвеличивать, почитать и прославлять Его так, как подобает только Ему.<\/p><p>О таких людях наши мудрецы, благословенна их память, сказали:<\/p><p>«Не будьте подобны рабам, которые служат господину ради получения награды, но будьте подобны рабам, которые служат господину не ради получения награды, и да будет страх Небес на вас».<\/p><p>(Пиркей Авот, 1:3.)<\/p><h3 class=\"subheading\" id=\"sub-5-32\"><strong>Восьмая ступень<\/strong><\/h3><p>На восьмой ступени находятся люди, которым ясно всё сказанное выше.<\/p><p>Они даже не намереваются получать награду ни в этом мире, ни в мире грядущем.<\/p><p>Однако принимают на себя служение Всевышнему из страха перед Его наказанием в этом мире и в мире грядущем.<\/p><p>Мы уже объяснили выше, в третьей главе этого раздела, недостатки обеих этих форм служения — ради награды и из страха перед наказанием.<\/p><h3 class=\"subheading\" id=\"sub-5-33\"><strong>Девятая ступень<\/strong><\/h3><p>На девятой ступени находятся люди, которые верят в Тору и в то, что за её исполнение полагается награда, а за нарушение — наказание как в этом мире, так и в мире грядущем.<\/p><p>Когда они служат Всевышнему, их намерение направлено исключительно ради Его благословенного имени, как и подобает.<\/p><p>Однако они недостаточно остерегаются вещей, способных испортить их служение.<\/p><p>Поэтому недостаток проникает в их служение, а они даже не замечают, откуда он возник.<\/p><p>Это подобно сказанному:<\/p><p>«Мёртвые мухи делают зловонным и вспенивают благовонное масло; небольшая глупость перевешивает мудрость и почёт».<\/p><p>(Коэлет, 10:1.) (<button aria-expanded=\"false\" aria-label=\"Примечание 70\" class=\"note-ref\" data-note=\"70\" type=\"button\">70<\/button>)<\/p><p>И сказано:<\/p><p>«Один грешник уничтожает много добра».<\/p><p>(Коэлет, 9:18.) (<button aria-expanded=\"false\" aria-label=\"Примечание 71\" class=\"note-ref\" data-note=\"71\" type=\"button\">71<\/button>)<\/p><p>Один из праведников однажды сказал своим ученикам:<\/p><p>«Если бы у вас не было грехов, я опасался бы, что вы можете оступиться в чём-то ещё более тяжёлом, чем грехи».<\/p><p>Ученики спросили его:<\/p><p>«Что же может быть хуже грехов?»<\/p><p>Праведник ответил:<\/p><p>«Высокомерие и гордыня».<\/p><p>Как сказано:<\/p><p>«Мерзость перед Господом всякий гордый сердцем».<\/p><p>(Мишлей, 16:5.) (<button aria-expanded=\"false\" aria-label=\"Примечание 72\" class=\"note-ref\" data-note=\"72\" type=\"button\">72<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-5-34\"><strong>Десятая ступень — высшая<\/strong><\/h3><p>На десятой ступени находятся люди, которые убедились в истинности Торы.<\/p><p>Они верят во всё, во что обязаны верить относительно награды и наказания за соблюдение или нарушение Торы в обоих мирах.<\/p><p>Они постоянно бодрствуют духовно, чтобы не пренебречь служением Всевышнему.<\/p><p>Их сердце понимает обязанности перед Творцом, возникающие из осознания Его великой доброты и милости к ним.<\/p><p>Их сердце не находится под влиянием надежды на награду или страха перед наказанием.<\/p><p>Напротив, они с готовностью и усердием приступают к служению Всевышнему ради Его благословенного имени.<\/p><p>Они возвеличивают и прославляют Его с воодушевлением и всем сердцем, поскольку знают Его величие и возвышенность, осознают Его мудрость и доброту.<\/p><p>Это самая высокая ступень среди изучающих Тору.<\/p><p>Это ступень пророков и праведников, которые полностью предали себя руководству Всевышнего и Его воле.<\/p><p>Они заключили с Ним завет вечной верности.<\/p><p>Они полностью посвятили себя Ему и положились на Него.<\/p><p>Они вверили Ему свои души, своих детей и своё имущество.<\/p><p>Они остались твёрдыми в своей вере и исполнили принятое на себя обязательство освящать имя Небес перед многими людьми.<\/p><p>О них сказано:<\/p><p>«Соберите ко Мне праведников Моих, заключивших со Мной завет посредством жертвы».<\/p><p>(Теилим, 50:5.) (<button aria-expanded=\"false\" aria-label=\"Примечание 73\" class=\"note-ref\" data-note=\"73\" type=\"button\">73<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-5-35\"><strong>Заключение главы<\/strong><\/h3><p>Итак, в этой главе мы объяснили:<\/p><ol><li>Сущность побуждения к служению посредством Торы.<\/li><li>Ступени людей в познании мудрости Торы.<\/li><li>Ступени людей в вере в Тору.<\/li><\/ol><p>Возможно, существуют и другие ступени в знаниях людей и их вере, помимо перечисленных нами.<\/p><p>Однако мы упомянули те ступени, к которым относится большинство представителей нашего народа.<\/p><p>Польза от перечисления этих ступеней очевидна каждому, кто ищет прямой путь.<\/p><p>Когда человек увидит, что находится близко к одной из этих ступеней, и узнает о следующей ступени, он постарается подняться на неё.<\/p><p>Благодаря этому он также поймёт, насколько далёк от самой высокой ступени, и начнёт постепенно приближаться к ней, поднимаясь со ступени на ступень.<\/p><p>Именно такой постепенный путь восхождения позволит ему легче достичь высочайшего духовного уровня, чем если бы он пытался достигнуть его сразу, без последовательного продвижения.<\/p>", "subs": [{"id": "sub-5-1", "title": "«Ховот а-Левавот» — Обязанности сердец"}, {"id": "sub-5-2", "title": "Сущность побуждения посредством Торы"}, {"id": "sub-5-3", "title": "Три категории человеческих поступков согласно Торе"}, {"id": "sub-5-4", "title": "Повелительные заповеди"}, {"id": "sub-5-5", "title": "Запретительные заповеди"}, {"id": "sub-5-6", "title": "Три вида дозволенных действий"}, {"id": "sub-5-7", "title": "Первый вид — необходимое"}, {"id": "sub-5-8", "title": "Второй вид — излишнее"}, {"id": "sub-5-9", "title": "Третий вид — меньше необходимого"}, {"id": "sub-5-10", "title": "Все поступки человека относятся либо к заповедям, либо к грехам"}, {"id": "sub-5-11", "title": "Десять ступеней знания Торы"}, {"id": "sub-5-12", "title": "Подробное объяснение десяти ступеней"}, {"id": "sub-5-13", "title": "Первая ступень"}, {"id": "sub-5-14", "title": "Вторая ступень"}, {"id": "sub-5-15", "title": "Третья ступень"}, {"id": "sub-5-16", "title": "Четвёртая ступень"}, {"id": "sub-5-17", "title": "Пятая ступень"}, {"id": "sub-5-18", "title": "Шестая ступень"}, {"id": "sub-5-19", "title": "Седьмая ступень"}, {"id": "sub-5-20", "title": "Восьмая ступень"}, {"id": "sub-5-21", "title": "Девятая ступень"}, {"id": "sub-5-22", "title": "Десятая ступень"}, {"id": "sub-5-23", "title": "Десять ступеней веры в Тору и побуждений к служению Всевышнему"}, {"id": "sub-5-24", "title": "Подробное объяснение десяти ступеней веры"}, {"id": "sub-5-25", "title": "Первая ступень"}, {"id": "sub-5-26", "title": "Вторая ступень"}, {"id": "sub-5-27", "title": "Третья ступень"}, {"id": "sub-5-28", "title": "Четвёртая ступень"}, {"id": "sub-5-29", "title": "Пятая ступень"}, {"id": "sub-5-30", "title": "Шестая ступень"}, {"id": "sub-5-31", "title": "Седьмая ступень"}, {"id": "sub-5-32", "title": "Восьмая ступень"}, {"id": "sub-5-33", "title": "Девятая ступень"}, {"id": "sub-5-34", "title": "Десятая ступень — высшая"}, {"id": "sub-5-35", "title": "Заключение главы"}]}, {"id": "chapter-5", "title": "Глава 5", "html": "<h3 class=\"subheading\" id=\"sub-6-1\"><strong>Введение: Пробуждение разума к служению Всевышнему<\/strong><\/h3><p>Начиная с этой главы и до конца раздела подробно объясняется понятие разумного пробуждения, упомянутое в первых трёх главах.<\/p><p>Рабейну Бахья определяет его как напоминание, которое Всевышний посылает человеку посредством его разума, чтобы напомнить ему о его обязанностях перед Творцом.<\/p><p>Разум выполняет свою миссию, раскрывая перед человеком многочисленные и великие благодеяния, которыми Творец одаряет его.<\/p><p>Разум требует от человека следовать ясному нравственному принципу, заложенному в его совести: необходимо поступать справедливо и отвечать добром на добро.<\/p><p>Когда человек осознаёт, что не способен даже перечислить и постичь все эти благодеяния, а тем более отплатить за них, он приходит к глубокому осознанию собственной ограниченности и ничтожности.<\/p><p>Тогда он чувствует необходимость обратиться к своему разуму с просьбой научить его, какие поступки помогут ему приблизиться к Всевышнему и обрести Его благоволение.<\/p><p>Эти поступки смогут хотя бы в некоторой степени заменить ту благодарность, которую человек обязан воздать Творцу за Его многочисленные благодеяния.<\/p><h3 class=\"subheading\" id=\"sub-6-2\"><strong>Сущность разумного пробуждения<\/strong><\/h3><p>Начиная отсюда и до конца раздела мы должны объяснить пути разумного пробуждения.<\/p><p>Мы изложим их в форме вопросов и ответов, словно душа и разум ведут между собой беседу. Благодаря этому обсуждаемая нами тема станет более понятной и ясной для каждого (<button aria-expanded=\"false\" aria-label=\"Примечание 74\" class=\"note-ref\" data-note=\"74\" type=\"button\">74<\/button>).<\/p><p>Прежде всего следует объяснить, что разумное пробуждение представляет собой напоминание, посредством которого Всевышний пробуждает человека через его разум и душу, чтобы тот познал Его и осознал Его мудрость, проявляющуюся в сотворённом мире.<\/p><p>Всевышний дарует такое пробуждение тому, кто сделал Тору светом на своём пути, не отклонялся от неё ни вправо, ни влево, освободился от власти своих страстей и достиг высшей степени разумного понимания и ясного осознания.<\/p><p>Такой человек стремится исполнить волю Всевышнего, подняться на ступени праведников и благочестивых людей и освободить своё сердце от забот и тревог материального мира.<\/p><h3 class=\"subheading\" id=\"sub-6-3\"><strong>Путь к разумному пробуждению<\/strong><\/h3><p>Чтобы человек достиг разумного пробуждения, он должен ясно понимать нравственные принципы, которые Творец заложил в человеческий разум.<\/p><p>К ним относятся следующие положения:<\/p><ol><li>Следует восхвалять истину и осуждать ложь.<\/li><li>Необходимо выбирать справедливость и удаляться от несправедливости.<\/li><li>Следует воздавать добром и выражать благодарность тем, кто делает добро, а злодеев считать заслуживающими воздаяния за зло и осуждения (75).<\/li><li>Необходимо поддерживать мирные отношения с людьми и делать им добро.<\/li><li>Следует ценить благодеяния в соответствии с их значимостью.<\/li><li>Необходимо воздавать человеку в соответствии с мерой добра, которое он совершил, а наказание должно соответствовать тяжести совершённого зла.<\/li><li>Следует различать степени награды, чтобы воздаяние соответствовало величине благодеяния.<\/li><li>Необходимо понимать различия между степенями наказания.<\/li><li>Следует прощать согрешивших, когда они искренне раскаиваются.<\/li><\/ol><p>Когда эти принципы становятся ясными человеку благодаря разуму и осознанию, его разум достигает совершенства, а понимание становится глубоким и устойчивым.<\/p><p>Когда Всевышний вложит в его сердце мысли, пробуждающие его к добру, чтобы направить по пути, ведущему к благополучию в этом мире и в будущем, человек начнёт размышлять о благодеяниях Творца и стремиться глубоко их постичь.<\/p><p>Он попытается перечислить и осознать все эти благодеяния, но не сможет сделать этого, поскольку каждое благо включает в себя множество других благ, а сами благодеяния многочисленны, постоянны и непрерывно следуют одно за другим.<\/p><p>Тогда человек потребует от себя исполнения обязанностей, которые уже известны его разуму: отвечать добром на добро и поступать справедливо.<\/p><p>Он решит воздать Благословенному Творцу за все Его многочисленные благодеяния.<\/p><p>Однако, когда человек поймёт, что это превосходит его возможности (<button aria-expanded=\"false\" aria-label=\"Примечание 76\" class=\"note-ref\" data-note=\"76\" type=\"button\">76<\/button>), и, кроме того, что Творец совершенно не нуждается в его воздаянии, он почувствует необходимость смириться и осознать собственную малость.<\/p><p>После этого он обратится к своему разуму с просьбой научить его поступкам, посредством которых можно приблизиться к Всевышнему.<\/p><p>Эти поступки хотя бы в некоторой степени смогут служить заменой того воздаяния, которое человек обязан принести Творцу за Его благодеяния.<\/p><p>Тогда разум начнёт обучать его правильному пути, как будет объяснено далее.<\/p><h3 class=\"subheading\" id=\"sub-6-4\"><strong>Беседа разума и души<\/strong><\/h3><h3 class=\"subheading\" id=\"sub-6-5\"><strong>Первое условие: искреннее желание служить Всевышнему<\/strong><\/h3><p>Прежде чем разум начнёт обучать человека тому, как служить Всевышнему, он желает убедиться в четырёх вещах:<\/p><ol><li>Человек ясно понимает, что обязан воздать Творцу благодарностью за Его благодеяния.<\/li><li>Он действительно намерен исполнить эту обязанность.<\/li><li>Он искренне стремится к этому.<\/li><li>Его стремление основано на полном внутреннем осознании этой обязанности.<\/li><\/ol><p>Разум обращается к душе (<button aria-expanded=\"false\" aria-label=\"Примечание 77\" class=\"note-ref\" data-note=\"77\" type=\"button\">77<\/button>):<\/p><p>— Ясно ли тебе и сохранилось ли в твоей памяти, что ты являешься должницей своего Творца, что ты находишься у Него в залоге за все благодеяния, которые Он тебе оказал, и что ты принадлежишь Ему благодаря Его многочисленным и великим милостям (<button aria-expanded=\"false\" aria-label=\"Примечание 78\" class=\"note-ref\" data-note=\"78\" type=\"button\">78<\/button>)?<\/p><p><strong>Душа отвечает:<\/strong><\/p><p>— Да, это совершенно ясно мне, и я хорошо помню об этом.<\/p><p><strong>Разум продолжает:<\/strong><\/p><p>— Намерена ли ты воздать Творцу хотя бы часть того, что ты Ему должна?<\/p><p><strong>Душа отвечает:<\/strong><\/p><p>— Да, я намерена это сделать.<\/p><p><strong>Разум удивляется:<\/strong><\/p><p>— Как же это возможно, если твоё стремление к этому настолько слабо?<\/p><p>Ведь только тот, кто действительно желает выздороветь, готов терпеть горечь лекарства.<\/p><p>Но человек, который не стремится к выздоровлению, не захочет переносить неприятный вкус лекарства.<\/p><p><strong>Душа заверяет его:<\/strong><\/p><p>— Моё стремление сильно, и я очень желаю воздать Всевышнему по мере своих возможностей всё, что я Ему должна.<\/p><p>Побуждай меня ещё больше и научи, каким образом и чем я могу воздать Ему.<\/p><p><strong>Разум объясняет:<\/strong><\/p><p>— Если твои слова правдивы, возможно, лекарство поможет тебе.<\/p><p>Но если сказанное тобой неправда, ты обманешь только саму себя.<\/p><p>Ведь больной, который лжёт врачу, обманывает прежде всего себя.<\/p><p>Врач теряет лишь свои усилия, тогда как болезнь самого больного продолжает усиливаться.<\/p><p><strong>Душа спрашивает:<\/strong><\/p><p>— Как я могу узнать, является ли моё желание воздать Творцу истинным или ложным?<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Если твоё желание исходит из ясного понимания величины долга перед Всевышним, осознания того, что ты не в состоянии полностью воздать Ему, а также понимания, что пренебрежение этой обязанностью приведёт тебя к гибели, тогда твоё стремление истинно.<\/p><p>Если ты понимаешь, что от твоих усилий зависят спасение от наказаний и достижение вечной жизни, значит, твоё желание воздать Творцу действительно исходит из осознания необходимости этого.<\/p><p>Но если твоё стремление не основано на таком понимании, знай, что оно ложно.<\/p><p><strong>Душа говорит:<\/strong><\/p><p>— Вначале я действительно пробудилась к служению Всевышнему благодаря изучению событий прошлых поколений.<\/p><p>Я узнала, как были наказаны грешники, например поколение Потопа, поколение Вавилонской башни, община Кораха и подобные им.<\/p><p>Я также узнала, как праведники получали награду, например наши праотцы Авраам, Ицхак и Яаков, его сыновья и поколение пустыни.<\/p><p>Но несмотря на всё это, моё желание оставалось слабым, а стремление — неискренним.<\/p><p>Так продолжалось до тех пор, пока посредством мудрости мне не стало ясно, что всё сказанное тобой является истиной.<\/p><p>Сначала я осознала это благодаря пробуждению, исходящему от Торы, а затем — благодаря разумным доказательствам.<\/p><p>И тогда моё стремление стало истинным, а желание — сильным.<\/p><h3 class=\"subheading\" id=\"sub-6-6\"><strong>Второе условие: отказ от дурных качеств и привычек<\/strong><\/h3><p>Чтобы разум смог успешно выполнить свою миссию по отношению к душе, он прежде всего требует от неё отказаться от дурных качеств и привычек, укрепляющих эти качества.<\/p><p>Чтобы душа могла добровольно и с большей лёгкостью исполнить это требование, разум объясняет ей, что от этого зависит всё её будущее — как в этом мире, так и в будущем.<\/p><p><strong>Разум говорит душе:<\/strong><\/p><p>— Если сказанное тобой правда, сначала откажись от вредной пищи, к которой ты привыкла, а затем преодолей страдания лечения и вытерпи горечь и неприятный вкус лекарства.<\/p><p><strong>Душа спрашивает:<\/strong><\/p><p>— Что это за вредная пища, к которой я привыкла?<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Это дурное качество, которое овладело тобой с самого начала твоего существования, а также силы, укрепляющие его с первых этапов твоего развития.<\/p><p><strong>Душа спрашивает:<\/strong><\/p><p>— Что это за качество и какие силы его укрепляют?<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Твоих дурных качеств много, но в своей основе они сводятся к двум.<\/p><p><strong>Первое — любовь к телесным удовольствиям:<\/strong> еде, питью и удовлетворению остальных потребностей тела.<\/p><p>Этому качеству ты научилась у своего дурного соседа — собственного тела.<\/p><p><strong>Второе — стремление властвовать и соперничать с другими:<\/strong> гордость, высокомерие и зависть.<\/p><p>Это качество мешает тебе в достаточной мере воздавать благодарностью тем, кто делает тебе добро.<\/p><p>Ему ты научилась у людей, среди которых выросла, — своих братьев, родственников и окружающих.<\/p><p><strong>Душа спрашивает:<\/strong><\/p><p>— Какие же силы я должна перестать укреплять в себе?<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Силы, укрепляющие стремление к удовольствиям, — это излишества в еде, питье, одежде, сне, телесном отдыхе, душевном покое и тому подобном.<\/p><p>А силы, укрепляющие гордыню, — это излишние разговоры, чрезмерное пребывание среди людей, постоянное стремление нравиться им, любовь к власти и почестям.<\/p><p>К ним также относятся зависть к чужому имуществу, стремление силой или давлением отнять у людей принадлежащее им, пренебрежение другими и злословие о них.<\/p><p>Если ты действительно искренне стремишься воздать благодарностью за благодеяния Всевышнего, постарайся всеми силами удалить от себя перечисленные качества и силы, укрепляющие их (<button aria-expanded=\"false\" aria-label=\"Примечание 79\" class=\"note-ref\" data-note=\"79\" type=\"button\">79<\/button>).<\/p><p>После этого я проведу тебя через первые врата исцеления.<\/p><p><strong>Душа говорит:<\/strong><\/p><p>— Мне трудно отказаться от всего этого, поскольку я привыкла к этим вещам за долгое время.<\/p><p>Поэтому научи меня, пожалуйста, как я могу с лёгкостью освободиться от них.<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Разве ты не знаешь, что разумный человек легко соглашается на хирургическую операцию, даже если из-за неё он потеряет один из органов?<\/p><p>Когда его поражает опасная болезнь и он опасается, что она распространится на другие органы и приведёт к смерти, он соглашается на операцию.<\/p><p>Он понимает разницу между болью от операции и спасением от смерти.<\/p><p>Он знает, какое из двух зол больше: потерять один орган или потерять всё тело.<\/p><p>То же самое относится и к тебе.<\/p><p>Если ты хочешь, чтобы отказ от привычек, с которыми тебе трудно расстаться, стал для тебя лёгким, задумайся и воспользуйся своим разумом.<\/p><p>Сравни благо, которое ты получишь, освободившись от дурных качеств и сил, укрепляющих их, со злом, которое постигнет тебя, если ты продолжишь жить под их влиянием.<\/p><p>Тогда тебе станет легче отказаться от своих дурных привычек.<\/p><p><strong>Душа спрашивает:<\/strong><\/p><p>— Какое благо я получу, если откажусь от них, и какое зло постигнет меня, если я продолжу следовать им?<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Благо заключается в том, что ты обретёшь спокойствие и избавишься от мрака материального мира, удовольствия которого смешаны с печалью, а наслаждения временны.<\/p><p>Ты придёшь к глубокому осознанию того, что твоё истинное место покоя находится в будущем мире и что ты должна стараться и спешить достичь его.<\/p><p>Это благо, которое ты получишь благодаря отказу от дурных качеств, является одними из врат, через которые тебе необходимо пройти ради собственного спасения от гибели и достижения вечной жизни.<\/p><p>А зло заключается в том, что тебя будут постоянно преследовать тревоги, глубокая печаль и непрерывное огорчение из-за неудовлетворённых желаний в этом мире.<\/p><p>Даже если ты достигнешь желаемого, приобретённое благо окажется временным и непрочным.<\/p><p>Со временем оно непременно перейдёт к другим.<\/p><p>В результате ты не сохранишь за собой блага этого мира и не достигнешь будущего мира.<\/p><p>Тем более печальным будет твоё положение, если ты вообще не сможешь осуществить свои земные желания, несмотря на долгие усилия.<\/p><p><strong>Душа говорит:<\/strong><\/p><p>— Я поняла твоё объяснение и надеюсь, что благодаря ему смогу легко отказаться от привычек, с которыми раньше мне было трудно расстаться.<\/p><p>Но прошу тебя, проведи меня через следующие врата исцеления, чтобы я смогла узнать то, что желаю понять о служении Всевышнему.<\/p><h3 class=\"subheading\" id=\"sub-6-7\"><strong>Третье условие: правильное отношение к Творцу<\/strong><\/h3><p>Теперь разум начинает обучать душу тому, что она должна делать, чтобы приблизиться к Всевышнему и обрести Его благоволение.<\/p><p>В качестве вступления он объясняет основной принцип служения Всевышнему.<\/p><p>Человек должен относиться к Всевышнему, Который бесконечно выше его и одаряет его благами, по крайней мере так, как сам человек ожидает отношения к себе со стороны своего слуги, находящегося ниже его по положению и получающего от него благодеяния.<\/p><p><strong>Разум говорит:<\/strong><\/p><p>— Основной принцип и общее правило служения Всевышнему заключается в следующем.<\/p><p>Ты должна принять власть Того, Кто выше тебя, то есть власть Всевышнего, так же, как желаешь, чтобы тот, кто находится ниже тебя, принимал твою власть.<\/p><p>Представь, словно отношение между тобой и Тем, Кто выше тебя, подобно отношению между тобой и тем, кто ниже тебя (<button aria-expanded=\"false\" aria-label=\"Примечание 80\" class=\"note-ref\" data-note=\"80\" type=\"button\">80<\/button>).<\/p><p>Относись к Тому, Кто выше тебя, так, как ты ожидаешь отношения к себе от того, кто ниже тебя.<\/p><p>И не поступай по отношению к Тому, Кто выше тебя, так, как тебе самой было бы неприятно, если бы так поступал с тобой тот, кто ниже тебя.<\/p><p><strong>Душа говорит:<\/strong><\/p><p>— Объясни мне это подробнее.<\/p><p><strong>Разум объясняет:<\/strong><\/p><p>— Представь себе все благодеяния, которыми Всевышний одаряет тебя.<\/p><p>Подумай как о тех благах, которые Он дарует и тебе, и другим людям, так и о тех, которые Он дарует лично тебе.<\/p><p>Затем представь, что ты сама оказываешь такие благодеяния своему слуге, которого приобрела за собственные деньги.<\/p><p>После этого реши относиться к своему Творцу так, как ты ожидала бы отношения к себе от своего слуги.<\/p><p>И то отношение, которое было бы неприятно тебе со стороны слуги, должно быть неприемлемым и для тебя в отношениях с Творцом.<\/p><p><strong>Душа говорит:<\/strong><\/p><p>— Я поняла общий смысл твоих слов.<\/p><p>Но прошу тебя, подробно объясни, каким должно быть правильное отношение слуги к своему господину.<\/p><h3 class=\"subheading\" id=\"sub-6-8\"><strong>Подробное описание правильного отношения слуги к господину<\/strong><\/h3><p><strong>Разум говорит:<\/strong><\/p><p>— Правильное поведение слуги по отношению к господину, который оказал ему хотя бы малую часть тех благодеяний, которыми Творец одарил тебя, должно быть следующим.<\/p><h3 class=\"subheading\" id=\"sub-6-9\"><strong>1. Служение и верность<\/strong><\/h3><p>Слуга должен служить своему господину ради его чести как словами, так и поступками.<\/p><p>Он должен быть верным и усердным в делах господина как открыто, так и втайне.<\/p><h3 class=\"subheading\" id=\"sub-6-10\"><strong>2. Трепет и страх<\/strong><\/h3><p>Он должен испытывать трепет перед величием своего господина и бояться наказания, находясь перед ним.<\/p><p>Как сказал один из благочестивых людей:<\/p><p>«Не восставай против своего господина, пока он видит тебя» (<button aria-expanded=\"false\" aria-label=\"Примечание 81\" class=\"note-ref\" data-note=\"81\" type=\"button\">81<\/button>).<\/p><h3 class=\"subheading\" id=\"sub-6-11\"><strong>3. Смирение и покорность<\/strong><\/h3><p>Он должен быть смиренным и покорным перед своим господином как в видимых поступках, так и в глубине своей души.<\/p><p>Его смирение должно проявляться в одежде, поведении и чертах характера.<\/p><h3 class=\"subheading\" id=\"sub-6-12\"><strong>4. Почтение и благодарность<\/strong><\/h3><p>Он должен уважать и возвеличивать господина устами и сердцем.<\/p><p>Он должен восхвалять и благодарить его днём и ночью, вспоминая его благодеяния:<\/p><ul><li>Наедине с самим собой.<\/li><li>В присутствии других людей, говоря о нём слова похвалы и благодарности, соответствующие его достоинству.<\/li><\/ul><h3 class=\"subheading\" id=\"sub-6-13\"><strong>5. Радость в служении<\/strong><\/h3><p>Он должен с радостью и добрым сердцем спешить исполнять свои обязанности, искренне стремясь заслужить благоволение господина.<\/p><h3 class=\"subheading\" id=\"sub-6-14\"><strong>6. Стремление заслужить благоволение господина<\/strong><\/h3><p>Он должен постоянно просить господина быть довольным им и простить ему совершённые перед ним проступки.<\/p><h3 class=\"subheading\" id=\"sub-6-15\"><strong>7. Любовь и опасение<\/strong><\/h3><p>Он должен любить своего господина и одновременно опасаться, что, возможно, недостаточно хорошо исполняет его повеления.<\/p><h3 class=\"subheading\" id=\"sub-6-16\"><strong>8. Соблюдение повелений и удаление от запретного<\/strong><\/h3><p>Он должен соблюдать все повеления господина и избегать всего, что тот запретил ему делать.<\/p><h3 class=\"subheading\" id=\"sub-6-17\"><strong>9. Осознание благодеяний и смирение<\/strong><\/h3><p>Он должен:<\/p><ul><li>Постоянно помнить о своих проступках перед господином.<\/li><li>Считать благодеяния господина многочисленными и великими.<\/li><li>Считать свои поступки недостаточными по сравнению с тем, что он обязан делать для господина.<\/li><li>Считать свои усилия недостаточными по сравнению с тем усердием, которого заслуживает господин.<\/li><li>Считать собственное достоинство малым по сравнению с величием, которое он признаёт за господином.<\/li><\/ul><h3 class=\"subheading\" id=\"sub-6-18\"><strong>10. Поклоны и преклонение<\/strong><\/h3><p>Он должен часто преклоняться и склоняться перед господином со смирением и покорностью.<\/p><h3 class=\"subheading\" id=\"sub-6-19\"><strong>11. Доверие и принятие решений господина<\/strong><\/h3><p>Он должен:<\/p><ul><li>Полагаться на господина во всех своих нуждах и добровольно принимать всё, что тот определяет для него.<\/li><li>Если господин насытит его, благодарить и восхвалять его.<\/li><li>Если оставит его голодным, принимать это добровольно и терпеливо.<\/li><li>Не подозревать господина в несправедливом суде и не считать, что тот поступил с ним неправильно.<\/li><li>Довольствоваться тем, что господин даровал ему по своей милости.<\/li><li>Признавать справедливость господина даже тогда, когда тот подвергает его страданиям.<\/li><\/ul><h3 class=\"subheading\" id=\"sub-6-20\"><strong>Полная преданность господину<\/strong><\/h3><p>Кроме того, от слуги требуется, чтобы все движения его тела и все качества его характера свидетельствовали о том, что он является слугой своего господина и принадлежит ему.<\/p><p>А именно:<\/p><p>Чтобы он говорил и думал только о нём.<\/p><p>Чтобы учился только его путям.<\/p><p>Чтобы подчинялся только его словам.<\/p><p>Чтобы ел лишь то, что господин выделяет ему для пропитания.<\/p><p>Чтобы размышлял только о его величии.<\/p><p>Чтобы радовался лишь тогда, когда господин доволен им.<\/p><p>Чтобы находил радость только в служении ему.<\/p><p>Чтобы стремился исполнять только его волю.<\/p><p>Чтобы спешил лишь по его поручениям.<\/p><p>Чтобы воздерживался только от того, что противоречит его воле.<\/p><p>Чтобы пребывал только в его доме.<\/p><p>Чтобы был твёрд только в верности ему.<\/p><p>Чтобы одевался лишь в одеяние трепета перед ним.<\/p><p>Чтобы засыпал лишь на ложе любви к нему.<\/p><p>Чтобы в своём воображении представлял только его образ.<\/p><p>Чтобы пробуждался лишь от воспоминания о сладости близости к нему.<\/p><p>Чтобы находил душевное удовлетворение только в пребывании рядом с ним.<\/p><p>Чтобы убегал лишь от того, что вызывает его недовольство.<\/p><p>Чтобы печалился лишь тогда, когда господин гневается на него.<\/p><p>Чтобы боялся только его.<\/p><p>Чтобы надеялся только на его милость.<\/p><p>Чтобы гневался лишь на то, на что, согласно воле господина, следует гневаться.<\/p><p>Чтобы считал достойным благоволения господина лишь того, кто исполняет его волю.<\/p><p>Чтобы брал только то, что господин разрешает ему брать.<\/p><p>Чтобы давал лишь тому, кому господин повелевает давать.<\/p><p>И так во всех своих движениях: чтобы он не поднимал ноги и не двигал даже веком, если этим не исполняет волю своего господина.<\/p><h3 class=\"subheading\" id=\"sub-6-21\"><strong>Неправильное поведение слуги<\/strong><\/h3><p>Неправильное поведение слуги является полной противоположностью тому поведению, которое желательно его господину.<\/p><p>Нет необходимости подробно перечислять его, поскольку его можно понять, рассматривая противоположность правильному поведению.<\/p><p>Таким образом, я изложил перед тобой общее правило, составленное из отдельных примеров.<\/p><p>На его основе ты сможешь самостоятельно понять и остальные подробности как правильного, так и неправильного поведения.<\/p><p>И поскольку правильное отношение слуги к господину именно таково, как мы объяснили, а ты уже знаешь, насколько малы благодеяния господина своему слуге по сравнению с благодеяниями, которыми Всевышний одаряет тебя, теперь ты можешь понять, насколько больше твои обязанности перед Творцом.<\/p><p>Если ты действительно желаешь воздать Ему за многочисленные благодеяния, которые Он тебе дарует, ты должна осознать, что твоя обязанность перед Ним неизмеримо превосходит всё перечисленное.<\/p>", "subs": [{"id": "sub-6-1", "title": "Введение: Пробуждение разума к служению Всевышнему"}, {"id": "sub-6-2", "title": "Сущность разумного пробуждения"}, {"id": "sub-6-3", "title": "Путь к разумному пробуждению"}, {"id": "sub-6-4", "title": "Беседа разума и души"}, {"id": "sub-6-5", "title": "Первое условие: искреннее желание служить Всевышнему"}, {"id": "sub-6-6", "title": "Второе условие: отказ от дурных качеств и привычек"}, {"id": "sub-6-7", "title": "Третье условие: правильное отношение к Творцу"}, {"id": "sub-6-8", "title": "Подробное описание правильного отношения слуги к господину"}, {"id": "sub-6-9", "title": "1. Служение и верность"}, {"id": "sub-6-10", "title": "2. Трепет и страх"}, {"id": "sub-6-11", "title": "3. Смирение и покорность"}, {"id": "sub-6-12", "title": "4. Почтение и благодарность"}, {"id": "sub-6-13", "title": "5. Радость в служении"}, {"id": "sub-6-14", "title": "6. Стремление заслужить благоволение господина"}, {"id": "sub-6-15", "title": "7. Любовь и опасение"}, {"id": "sub-6-16", "title": "8. Соблюдение повелений и удаление от запретного"}, {"id": "sub-6-17", "title": "9. Осознание благодеяний и смирение"}, {"id": "sub-6-18", "title": "10. Поклоны и преклонение"}, {"id": "sub-6-19", "title": "11. Доверие и принятие решений господина"}, {"id": "sub-6-20", "title": "Полная преданность господину"}, {"id": "sub-6-21", "title": "Неправильное поведение слуги"}]}, {"id": "chapter-6", "title": "Глава 6", "html": "<h3 class=\"subheading\" id=\"sub-7-1\"><strong>Введение: Чем больше благодеяний получает человек, тем больше он обязан служить Всевышнему<\/strong><\/h3><p>Чем больше Всевышний одаряет человека благами, тем больше человек обязан служить Ему.<\/p><p>Благодеяния Творца, оказываемые людям, делятся на четыре вида:<\/p><ol><li>Благодеяния, которыми в равной степени пользуются все люди.<\/li><li>Благодеяния, дарованные одному определённому народу.<\/li><li>Благодеяния, которых удостоилась одна определённая семья.<\/li><li>Благодеяния, дарованные только одному конкретному человеку.<\/li><\/ol><p>Каждый человек должен задуматься о том, какими именно благами он пользуется, чтобы определить, насколько он обязан увеличить своё служение Всевышнему.<\/p><h3 class=\"subheading\" id=\"sub-7-2\"><strong>Беседа души и разума<\/strong><\/h3><p><strong>Душа говорит:<\/strong><\/p><p>— Я уже поняла общий принцип служения Всевышнему, и ты достаточно подробно объяснил его мне.<\/p><p>Но объясни теперь, насколько больше я должна служить Благословенному Творцу по сравнению с тем служением, которое слуга обязан оказывать своему господину (<button aria-expanded=\"false\" aria-label=\"Примечание 82\" class=\"note-ref\" data-note=\"82\" type=\"button\">82<\/button>).<\/p><p><strong>Разум отвечает:<\/strong><\/p><p>— Степень дополнительного служения Всевышнему, возлагаемого на людей, должна соответствовать общим и личным благодеяниям, которые они получают.<\/p><p>Эти благодеяния делятся на четыре вида.<\/p><h3 class=\"subheading\" id=\"sub-7-3\"><strong>Первый вид: Благодеяния, общие для всего человечества<\/strong><\/h3><p>Первый вид — это благодеяния Творца, которыми все люди пользуются в равной степени.<\/p><p>К ним относится то, что Всевышний привёл людей к существованию из небытия, то есть сотворил их из ничего.<\/p><p>К ним также относится то, что Он поддерживает их жизнь и дарует им все блага, о которых мы уже говорили во «Вратах размышления о творении».<\/p><p>Поскольку эти благодеяния распространяются на всех людей одинаково, все люди обязаны служить Творцу посредством общего для всех служения.<\/p><p>Это исполнение всех заповедей, необходимость которых понятна человеческому разуму.<\/p><p>Такие заповеди соблюдали Адам, Ханох, Ноах и его сыновья, Иов и его товарищи — вплоть до времён Моше Рабейну, мир ему.<\/p><p>Тому, кто исполняет все эти заповеди с намерением служить Всевышнему, Творец дарует особые благодеяния, превосходящие блага остальных людей.<\/p><p>Он возвысит такого человека в этом мире и даст ему великую награду в будущем мире.<\/p><p>Так было с нашим праотцом Авраамом, которому Всевышний сказал:<\/p><p>«Не бойся, Аврам, Я — твой щит; награда твоя весьма велика» (Берешит, Бытие 15:1) (<button aria-expanded=\"false\" aria-label=\"Примечание 83\" class=\"note-ref\" data-note=\"83\" type=\"button\">83<\/button>).<\/p><p>Но тот, кто использует полученные от Всевышнего блага для неповиновения Ему, опускается с человеческой ступени до низшей ступени животных.<\/p><p>Его положение в этом мире будет подобно положению скота, который откармливают перед убоем.<\/p><p>Как сказано:<\/p><p>«А враги Всевышнего — словно великолепие пастбищных ягнят» (Теилим, Псалмы 37:20) (<button aria-expanded=\"false\" aria-label=\"Примечание 84\" class=\"note-ref\" data-note=\"84\" type=\"button\">84<\/button>).<\/p><p>В будущем мире такого человека постигнет величайшее зло: его душа будет отсечена и погибнет (<button aria-expanded=\"false\" aria-label=\"Примечание 85\" class=\"note-ref\" data-note=\"85\" type=\"button\">85<\/button>), и он не удостоится жизни в будущем мире.<\/p><p>Как сказано:<\/p><p>«Ваш собственный дух, словно огонь, пожрёт вас» (Йешаяу, Исаия 33:11).<\/p><h3 class=\"subheading\" id=\"sub-7-4\"><strong>Второй вид: Благодеяния, дарованные отдельному народу<\/strong><\/h3><p>Второй вид — это благодеяния, которые Творец оказывает определённому народу.<\/p><p>Например, Всевышний оказал особое благодеяние народу Израиля, выведя его из Египта и приведя в землю Кнаан.<\/p><p>Поэтому, помимо служения, основанного на требованиях разума, Он обязал сынов Израиля исполнять дополнительные заповеди.<\/p><p>К ним относятся установления Торы, необходимость которых невозможно вывести исключительно из человеческого разума.<\/p><p>Например, заповедь о красной корове и запрет шаатнеза — ношения одежды из смеси шерсти и льна.<\/p><p>При этом Всевышний также повелел им соблюдать заповеди, понятные разуму, и побуждал к их исполнению.<\/p><p>Если человек принимает на себя и это дополнительное служение ради чести Всевышнего, Творец одаряет его особыми благами.<\/p><p>В ответ на эти благодеяния на него возлагается ещё большее служение, помимо обязанностей, лежащих на всём его народе и остальных членах его колена.<\/p><p>Примером служит колено Леви.<\/p><p>Когда его представители откликнулись на призыв Моше и были готовы пожертвовать собой ради чести Всевышнего, выступив против поклонявшихся золотому тельцу, как сказано:<\/p><p>«И сказал он: кто за Всевышнего — ко мне! И собрались к нему все сыны Леви» (Шмот, Исход 32:26),<\/p><p>Всевышний даровал им дополнительное благо.<\/p><p>Он избрал из их среды Аарона и его сыновей для священного служения и возложил на них больше заповедей, чем на остальных представителей народа.<\/p><p>Он также предназначил им великую награду в будущем мире.<\/p><p>Но если человек из народа Израиля восстаёт против воли Благословенного Творца, он теряет достоинство, связанное с двумя ступенями: принадлежностью к своему народу и принадлежностью к человечеству.<\/p><p>За это он будет наказан в обоих мирах.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«И не будет добра нечестивому, и не продлит он дней своих» (Коэлет, Экклезиаст 8:13) (<button aria-expanded=\"false\" aria-label=\"Примечание 86\" class=\"note-ref\" data-note=\"86\" type=\"button\">86<\/button>).<\/p><h3 class=\"subheading\" id=\"sub-7-5\"><strong>Третий вид: Благодеяния, дарованные отдельной семье<\/strong><\/h3><p>Третий вид — это благодеяния, которые Всевышний оказывает определённой семье внутри народа.<\/p><p>Например, дарование священства и левитского служения колену Леви, а также царской власти потомкам царя Давида.<\/p><p>Поэтому на них возлагаются дополнительные обязанности служения.<\/p><p>Обязанности коэнов и левитов известны и подробно изложены в Торе Всевышнего.<\/p><p>Что же касается обязанностей дома Давида, о них сказано:<\/p><p>«Дом Давида! Так сказал Всевышний: с раннего утра вершите справедливый суд и спасайте ограбленного из руки притеснителя» (Ирмияу, Иеремия 21:12) (<button aria-expanded=\"false\" aria-label=\"Примечание 87\" class=\"note-ref\" data-note=\"87\" type=\"button\">87<\/button>).<\/p><p>Тому, кто исполняет эти дополнительные обязанности в совершенстве, искренне стремясь исполнить волю Всевышнего, Творец дарует особые блага в этом мире и великую награду в будущем.<\/p><p>Такой человек может быть избран руководителем или наставником справедливости.<\/p><p>Как сказано о Пинхасе:<\/p><p>«И встал Пинхас, и совершил суд, и прекратилась эпидемия. И это было зачтено ему в праведность из поколения в поколение, навеки» (Теилим, Псалмы 106:30–31).<\/p><p>И ещё сказано:<\/p><p>«А коэны-левиты, сыны Цадока, которые соблюдали службу в Моём святилище, когда сыны Израиля отступили от Меня, — они приблизятся ко Мне, чтобы служить Мне» (Йехезкель, Иезекииль 44:15).<\/p><p>Но тот, кто использует эти особые благодеяния для нарушения воли Всевышнего, теряет все свои высокие ступени в этом мире и подвергается тяжёлым страданиям в будущем.<\/p><p>Как известно из истории Кораха и его общины (<button aria-expanded=\"false\" aria-label=\"Примечание 88\" class=\"note-ref\" data-note=\"88\" type=\"button\">88<\/button>).<\/p><h3 class=\"subheading\" id=\"sub-7-6\"><strong>Четвёртый вид: Благодеяния, дарованные отдельному человеку<\/strong><\/h3><p>Четвёртый вид — это благодеяния, которыми Всевышний одаряет отдельного человека, выделяя его среди членов его семьи, народа и всего человечества.<\/p><p>Например, человек может быть избран пророком Всевышнего, правителем и руководителем народа или мудрецом, которому Творец даровал особую мудрость, понимание и способность давать советы.<\/p><p>За каждое из этих благодеяний человек обязан дополнительным служением Всевышнему.<\/p><p>Если он исполняет это служение в совершенстве, полученные им блага продолжают сохраняться.<\/p><p>Это относится как к благам, общим для него и остальных людей, так и к благодеяниям, дарованным лично ему.<\/p><p>Кроме того, Всевышний прибавляет ему силы и знания для исполнения его обязанностей.<\/p><p>Как сказано:<\/p><p>«Поклялся Всевышний Давиду истинной клятвой, от которой не отступит: от плода чрева твоего посажу на престол твой. Если сыновья твои будут соблюдать Мой завет и свидетельства Мои, которым Я научу их, то и их сыновья вовеки будут сидеть на престоле твоём» (Теилим, Псалмы 132:11–12).<\/p><p>Такой человек получит награду и в будущем мире.<\/p><p>Как сказано:<\/p><p>«Если бы я не верил, что увижу благо Всевышнего в земле жизни...» (Теилим, Псалмы 27:13) (<button aria-expanded=\"false\" aria-label=\"Примечание 89\" class=\"note-ref\" data-note=\"89\" type=\"button\">89<\/button>).<\/p><p>Но тот, кто использует свои особые благодеяния для неповиновения Всевышнему, теряет все исключительные ступени, которых был удостоен.<\/p><p>Творец подвергает его особенно строгому суду уже в этом мире.<\/p><p>Как сказано:<\/p><p>«Через близких ко Мне освящусь, и перед всем народом прославлюсь. И замолчал Аарон» (Ваикра, Левит 10:3) (<button aria-expanded=\"false\" aria-label=\"Примечание 90\" class=\"note-ref\" data-note=\"90\" type=\"button\">90<\/button>).<\/p><p>И ещё сказано:<\/p><p>«Только вас Я избрал из всех семейств земли, поэтому взыщу с вас за все ваши грехи» (Амос 3:2).<\/p><p>В будущем мире его наказание будет ещё более суровым.<\/p><p>Как сказано:<\/p><p>«Ибо давно приготовлен Тофет, также для царя он приготовлен; глубоким и широким сделал Он его; костёр его — огонь и множество дров; дыхание Всевышнего, словно поток серы, воспламеняет его» (Йешаяу, Исаия 30:33) (<button aria-expanded=\"false\" aria-label=\"Примечание 91\" class=\"note-ref\" data-note=\"91\" type=\"button\">91<\/button>).<\/p><h3 class=\"subheading\" id=\"sub-7-7\"><strong>Основной принцип: Служение должно соответствовать полученным благам<\/strong><\/h3><p>За все четыре вида благодеяний люди обязаны служить Всевышнему — каждый в соответствии с теми благами, которыми пользуется.<\/p><p><strong>Чем больше Творец одаряет человека, тем больше человек обязан прибавлять в<\/strong> <strong>служении Ему.<\/strong><\/p><p>Доказательством этого является заповедь Торы отделять десятину от урожая.<\/p><p>Как сказано:<\/p><p>«Непременно отделяй десятину от всего урожая семян твоих» (Дварим, Второзаконие 14:22).<\/p><p>Следовательно, если Всевышний даровал человеку сто коров зерна (кор — древняя мера объёма), он обязан отделить десять коров.<\/p><p>А если другому человеку Всевышний даровал десять коров, тот обязан отделить один кор.<\/p><p>Предположим, первый человек, имеющий сто коров, отделил только девять с половиной коров.<\/p><p>А второй, имеющий десять коров, отделил один полный кор.<\/p><p>В таком случае первый будет наказан, а второй получит награду (<button aria-expanded=\"false\" aria-label=\"Примечание 92\" class=\"note-ref\" data-note=\"92\" type=\"button\">92<\/button>).<\/p><p>Другим доказательством служит то, что человек, у которого нет сына, не обязан исполнять заповеди, возложенные на отца: совершить обрезание своему сыну и обучать его Торе.<\/p><p>Точно так же человек, который хромает, освобождён от обязанности паломничества в Иерусалим в праздники.<\/p><p>И больной человек освобождается от исполнения тех заповедей, которые он физически не способен выполнить.<\/p><p>Подобным образом каждый, кому Благословенный Творец даровал особое благо, обязан прибавить в служении Ему соответственно этому благу.<\/p><h3 class=\"subheading\" id=\"sub-7-8\"><strong>Почему древние праведники опасались материальных благ?<\/strong><\/h3><p>По этой причине благочестивые люди прежних поколений испытывали тревогу, когда получали какое-либо благо в этом мире.<\/p><p>У этого были две причины.<\/p><p><strong>Первая причина:<\/strong> они опасались, что не смогут служить Всевышнему и благодарить Его за полученное благо в полной мере, как подобает.<\/p><p>Тогда они могли бы понести наказание, и полученное благо обернулось бы для них злом.<\/p><p>Как сказал наш праотец Яаков:<\/p><p>«Я стал мал от всех милостей...» (Берешит, Бытие 32:11) (<button aria-expanded=\"false\" aria-label=\"Примечание 93\" class=\"note-ref\" data-note=\"93\" type=\"button\">93<\/button>).<\/p><p><strong>Вторая причина:<\/strong> они опасались, что посредством полученного земного блага Творец выплачивает им награду за их служение.<\/p><p>В таком случае их награда в будущем мире могла бы уменьшиться.<\/p><p>Так мудрецы прежних поколений (<button aria-expanded=\"false\" aria-label=\"Примечание 94\" class=\"note-ref\" data-note=\"94\" type=\"button\">94<\/button>) объясняли стих:<\/p><p>«И воздаёт ненавидящим Его при их жизни, чтобы погубить их» (Дварим, Второзаконие 7:10) (<button aria-expanded=\"false\" aria-label=\"Примечание 95\" class=\"note-ref\" data-note=\"95\" type=\"button\">95<\/button>).<\/p><p><strong>Разум заключает:<\/strong><\/p><p>— Теперь я достаточно подробно объяснил тебе общий принцип того, насколько ты обязана увеличивать своё служение Всевышнему.<\/p><h3 class=\"subheading\" id=\"sub-7-9\"><strong>Опасность неправильного намерения в служении Всевышнему<\/strong><\/h3><p>Человек должен остерегаться служения Творцу с неправильным намерением — ради получения дополнительных благ.<\/p><p>Чтобы избежать этого, необходимо удалить из себя три причины, приводящие к подобному намерению.<\/p><p>1. <strong>Чрезмерная любовь к себе.<\/strong> Из-за неё человек стремится во всех своих действиях, включая служение Творцу, прежде всего обеспечить себе удобства и удовольствия.<\/p><p>2. <strong>Недостаточное понимание милосердия Творца.<\/strong> Человек ошибочно полагает, что получает благо только тогда, когда просит о нём. Между тем Творец одаряет его благами и без просьбы, причём даже такими, о существовании которых человек не знает.<\/p><p>3. <strong>Чрезмерно высокая оценка самого себя.<\/strong> Из-за неё человек стремится получить блага, которых он совершенно не заслуживает.<\/p><p>Когда человек удалит из себя эти три причины, он сможет служить Творцу с чистым намерением и цельным сердцем.<\/p><h3 class=\"subheading\" id=\"sub-7-10\"><strong>Душа признаёт трудность бескорыстного служения<\/strong><\/h3><p><strong>Душа говорит:<\/strong><\/p><p>— Я поняла всё, что ты объяснил.<\/p><p>Но я не чувствую себя способной воздать Творцу даже за те благодеяния, которыми Он одаряет всех людей одинаково.<\/p><p>Тем более я не чувствую себя способной воздать Ему за особые благодеяния, которые Он дарует лично мне.<\/p><p>Ведь когда я желаю и намереваюсь воздать Ему за полученные блага, ещё до того, как успеваю осуществить своё намерение, я уже ожидаю нового блага, которое смогу получить благодаря этому (<button aria-expanded=\"false\" aria-label=\"Примечание 96\" class=\"note-ref\" data-note=\"96\" type=\"button\">96<\/button>).<\/p><p>То же происходит и с моей благодарностью Всевышнему.<\/p><p>Когда я устами благодарю Его за великое добро, которое Он мне оказал, мои мысли и намерения направлены главным образом на то, чтобы попросить о продолжении и увеличении этих благ.<\/p><p>Между тем правильно было бы служить Ему и благодарить Его не ради того, чтобы блага продолжались и умножались.<\/p><p>Ведь я должна стремиться служить Творцу, а не самой себе.<\/p><p>И если даже в отношении благодеяний, общих для всех людей, в моём служении и благодарности лишь небольшая часть намерений направлена на исполнение долга перед Творцом за уже полученные блага, а главная цель — получить ещё большие блага в будущем, то как я смогу исполнить свои обязанности за особые благодеяния, которыми пользуюсь только я?<\/p><p>Поэтому мне необходимо, чтобы ты научил меня самому необходимому служению Всевышнему (<button aria-expanded=\"false\" aria-label=\"Примечание 97\" class=\"note-ref\" data-note=\"97\" type=\"button\">97<\/button>), без которого человек не может исполнить свой долг.<\/p><p>Объясни мне, какое служение я обязана совершать за эти благодеяния, чтобы оставаться достойной постоянно пользоваться ими.<\/p><h3 class=\"subheading\" id=\"sub-7-11\"><strong>Ответ разума: Три дурных качества, мешающих чистому служению<\/strong><\/h3><p><strong>Разум говорит:<\/strong><\/p><p>— Ты жалуешься на недостаток правильного намерения в своём служении и благодарности Всевышнему.<\/p><p>Ты говоришь, что, произнося слова благодарности за прошлые благодеяния, на самом деле просишь о будущих и ожидаешь новых, постоянных благ.<\/p><p>Это происходит из-за трёх дурных качеств, которые имеются в тебе.<\/p><h3 class=\"subheading\" id=\"sub-7-12\"><strong>Первое дурное качество: Чрезмерная любовь к себе<\/strong><\/h3><p>Первое качество — твоя чрезмерная любовь к самой себе и стремление привлекать к себе удовольствия.<\/p><p>Поэтому ты не делаешь ни одного шага — ни в служении Всевышнему, ни ради какой-либо другой цели, — не рассчитывая получить от этого удовольствие.<\/p><p>И даже когда ты служишь своему Творцу и благодаришь Его, ты прежде всего стремишься принести пользу самой себе.<\/p><p>Я уже говорил тебе, когда начал твоё духовное исцеление, что ты должна всеми силами стараться удалить из себя это качество.<\/p><p>И я надеюсь, что благодаря этому ты достигнешь истинного блага.<\/p><h3 class=\"subheading\" id=\"sub-7-13\"><strong>Второе дурное качество: Непонимание милосердия Творца<\/strong><\/h3><p>Второе качество — недостаточное понимание милосердия, которое Творец проявляет к тебе.<\/p><p>Ты полагаешь, что получаешь добро только тогда, когда просишь о нём.<\/p><p>При этом ты не замечаешь, что Творец уже одарил тебя многочисленными благами ещё до того, как ты попросила о них.<\/p><p>Среди них есть как известные тебе блага, так и те, о которых ты даже не подозреваешь.<\/p><p>Когда же ты обращаешься с просьбой, ты не задумываешься о Том, Кто даровал тебе всё это без всякой просьбы с твоей стороны.<\/p><p>Если бы ты избавилась от этого качества, ты служила бы Творцу с совершенным намерением и благодарила бы Его не только устами, но и в глубине сердца.<\/p><p>Тогда ты стала бы более достойной получения благ, и у Творца было бы больше оснований даровать тебе те блага, которых ты ожидаешь.<\/p><h3 class=\"subheading\" id=\"sub-7-14\"><strong>Третье дурное качество: Неправильная оценка себя и своего отношения к Творцу<\/strong><\/h3><p>Третье качество заключается в том, что ты не понимаешь должным образом ни собственной значимости, ни своего положения по отношению к Творцу.<\/p><p>Ты считаешь себя достойной величайших благ и не перестаёшь просить о них.<\/p><p>Каждый раз, когда получаешь какое-либо благо, ты уже строишь планы, как достичь ещё большего.<\/p><p>При этом ты не считаешь Творца достойным самого высокого служения с твоей стороны.<\/p><p>Когда ты совершаешь какое-либо служение Всевышнему, тебе кажется, будто ты оказываешь Ему этим услугу.<\/p><p>И это несмотря на то, что ты прекрасно знаешь: ты нуждаешься в Нём, чтобы Он восполнял твои потребности, а Он не нуждается ни в тебе, ни в твоём служении.<\/p><p>Если бы ты избавилась от этого невежества, посмотрела на действительность открытыми глазами и поняла, что Творец, Который создал тебя, заботится о тебе и лучше тебя знает, что тебе полезно, а что вредно, ты была бы довольна получаемым благом.<\/p><p>Ты благодарила бы Творца за него от всего сердца.<\/p><p>И ты не связывала бы свои надежды с вещами, которые отвлекают тебя от осознания уже полученных благ и мешают исполнить свой долг благодарности перед Всевышним.<\/p><h3 class=\"subheading\" id=\"sub-7-15\"><strong>Заключение главы<\/strong><\/h3><p>Когда ты удалишь из себя эти три дурных качества, ты непременно достигнешь тех благ, которых действительно достойна и которые соответствуют твоему служению.<\/p><p>И это произойдёт даже тогда, когда ты не будешь ожидать этих благ и думать о них.<\/p>", "subs": [{"id": "sub-7-1", "title": "Введение: Чем больше благодеяний получает человек, тем больше он обязан служить Всевышнему"}, {"id": "sub-7-2", "title": "Беседа души и разума"}, {"id": "sub-7-3", "title": "Первый вид: Благодеяния, общие для всего человечества"}, {"id": "sub-7-4", "title": "Второй вид: Благодеяния, дарованные отдельному народу"}, {"id": "sub-7-5", "title": "Третий вид: Благодеяния, дарованные отдельной семье"}, {"id": "sub-7-6", "title": "Четвёртый вид: Благодеяния, дарованные отдельному человеку"}, {"id": "sub-7-7", "title": "Основной принцип: Служение должно соответствовать полученным благам"}, {"id": "sub-7-8", "title": "Почему древние праведники опасались материальных благ?"}, {"id": "sub-7-9", "title": "Опасность неправильного намерения в служении Всевышнему"}, {"id": "sub-7-10", "title": "Душа признаёт трудность бескорыстного служения"}, {"id": "sub-7-11", "title": "Ответ разума: Три дурных качества, мешающих чистому служению"}, {"id": "sub-7-12", "title": "Первое дурное качество: Чрезмерная любовь к себе"}, {"id": "sub-7-13", "title": "Второе дурное качество: Непонимание милосердия Творца"}, {"id": "sub-7-14", "title": "Третье дурное качество: Неправильная оценка себя и своего отношения к Творцу"}, {"id": "sub-7-15", "title": "Заключение главы"}]}, {"id": "chapter-7", "title": "Глава 7", "html": "<h3 class=\"subheading\" id=\"sub-8-1\"><strong>Введение: Десять основных обязанностей в служении Всевышнему<\/strong><\/h3><p>Существуют десять основных обязанностей в служении Всевышнему, которые каждый человек должен и способен исполнить.<\/p><ol><li><strong>Не проявлять неблагодарности Творцу<\/strong> за благодеяния, которыми Он одаряет человека.<\/li><li><strong>Быть благодарным Творцу<\/strong> за все полученные от Него блага.<\/li><li><strong>Правильно оценивать благодеяния Всевышнего<\/strong>, осознавая их истинную значимость.<\/li><li><strong>Приписывать все полученные блага исключительно Творцу<\/strong>, а не тем, через кого они приходят.<\/li><li><strong>Осознавать, что все благодеяния являются незаслуженной милостью Творца.<\/strong><\/li><li><strong>Верить, что сохранение полученных благ зависит не от собственных усилий человека, а от воли Всевышнего.<\/strong><\/li><li><strong>Понимать истинную цель полученных благ<\/strong>, не считая их доказательством своего духовного превосходства.<\/li><li><strong>Улучшать хотя бы качество служения Всевышнему<\/strong>, даже если нет возможности увеличить количество добрых дел.<\/li><li><strong>Использовать стремление к соперничеству исключительно ради духовного роста<\/strong>, а не ради приобретения материальных благ.<\/li><li><strong>Помнить, что Всевышний взыщет с человека за каждый совершённый грех<\/strong>, даже если наказание не наступает сразу.<\/li><\/ol><p>Если человек исполняет эти десять обязанностей ради Небес, он будет пользоваться благодеяниями Творца и в будущем — либо в прежнем виде, либо в иной форме.<\/p><h3 class=\"subheading\" id=\"sub-8-2\"><strong>Беседа разума и души<\/strong><\/h3><h3 class=\"subheading\" id=\"sub-8-3\"><strong>Какие обязанности являются необходимыми для каждого человека?<\/strong><\/h3><p><strong>Разум продолжает:<\/strong><\/p><p>— Ты спросила меня, в чём заключается то необходимое служение Всевышнему, без которого человек не может исполнить свой долг и благодаря которому он становится достойным того, чтобы Творец продолжал одарять его благами.<\/p><p>Я отвечу тебе: это служение включает десять обязанностей, исполнение которых доступно каждому человеку.<\/p><h3 class=\"subheading\" id=\"sub-8-4\"><strong>Первая обязанность: Не использовать полученные блага для нарушения воли Творца<\/strong><\/h3><p>Человек не должен превращать благо, полученное от Всевышнего, в средство (<button aria-expanded=\"false\" aria-label=\"Примечание 98\" class=\"note-ref\" data-note=\"98\" type=\"button\">98<\/button>), с помощью которого он восстаёт против воли Творца.<\/p><p>Иными словами, полученные благодеяния не должны становиться причиной греха.<\/p><h3 class=\"subheading\" id=\"sub-8-5\"><strong>Вторая обязанность: Постоянно благодарить Всевышнего<\/strong><\/h3><p>Человек должен постоянно вспоминать и упоминать своими устами благодеяния, которые Всевышний оказывает ему.<\/p><p>Он обязан искренне благодарить и восхвалять Творца за эти блага — как в своём сердце, так и словами.<\/p><h3 class=\"subheading\" id=\"sub-8-6\"><strong>Третья обязанность: Высоко ценить благодеяния Творца<\/strong><\/h3><p>Человек не должен считать полученные от Всевышнего блага незначительными или маловажными.<\/p><p>Напротив, он должен дорожить ими и осознавать их величие.<\/p><h3 class=\"subheading\" id=\"sub-8-7\"><strong>Четвёртая обязанность: Приписывать все блага только Творцу<\/strong><\/h3><p>Если Всевышний оказывает человеку благодеяние посредством другого человека или какого-либо иного средства, получатель не должен считать, будто именно это средство является самостоятельным источником добра.<\/p><p>Он не должен благодарить только посредника, забывая о благодарности Творцу.<\/p><p>Напротив, человек обязан осознавать, что истинным источником полученного блага является Сам Всевышний.<\/p><h3 class=\"subheading\" id=\"sub-8-8\"><strong>Пятая обязанность: Осознавать, что полученные блага являются незаслуженной милостью<\/strong><\/h3><p>Человек не должен гордиться тем добром, которым обладает.<\/p><p>Он не должен думать, будто приобрёл его исключительно благодаря собственной силе или мудрости.<\/p><p>Также он не должен считать, что получил это благо потому, что заслужил его.<\/p><p>Напротив, человек обязан верить, что Творец проявил к нему бескорыстную милость, хотя сам человек совершенно не заслуживает такого благодеяния.<\/p><h3 class=\"subheading\" id=\"sub-8-9\"><strong>Шестая обязанность: Не считать собственные усилия источником благополучия<\/strong><\/h3><p>Человек не должен полагать, что полученное благо обязательно сохранится у него благодаря усилиям, направленным на его приобретение и сохранение.<\/p><p>Также он не должен считать, что непременно потеряет это благо, если перестанет заботиться о нём.<\/p><p>Напротив, он должен верить, что благо сохраняется у него по воле Творца, независимо от собственных усилий человека.<\/p><h3 class=\"subheading\" id=\"sub-8-10\"><strong>Седьмая обязанность: Не считать материальные блага доказательством духовного превосходства<\/strong><\/h3><p>Человек не должен пренебрежительно относиться к тем, кто не пользуется благами, которыми обладает он сам.<\/p><p>Он не должен думать, будто пользуется большим благоволением Всевышнего только потому, что получил эти благодеяния, а другие люди — нет.<\/p><p>Ведь возможно, что Всевышний даровал ему эти блага ради испытания.<\/p><p>То есть полученные блага могут стать для него искушением, которое приведёт его к греху.<\/p><p>Благодаря этому скрытое в глубине его сердца зло обнаружится и станет очевидным для всех (<button aria-expanded=\"false\" aria-label=\"Примечание 99\" class=\"note-ref\" data-note=\"99\" type=\"button\">99<\/button>).<\/p><p>Если это действительно так, то положение человека, который не получил подобных благ, может оказаться даже лучше.<\/p><p>Возможно, именно он пользуется большим благоволением Всевышнего, поскольку Творец не поставил перед ним препятствий, способных привести его к греху.<\/p><h3 class=\"subheading\" id=\"sub-8-11\"><strong>Восьмая обязанность: Служить Всевышнему с искренним намерением<\/strong><\/h3><p>Человек должен стремиться к тому, чтобы его служение Всевышнему и смирение перед Благословенным Творцом исходили из цельного и искреннего сердца.<\/p><p>Даже если после получения новых благодеяний он не увеличивает количество добрых дел по сравнению с тем, что делал прежде, и не прибавляет слов благодарности и восхваления Всевышнего, он должен по крайней мере продолжать усердно исполнять прежние добрые дела.<\/p><p>Он должен сохранять привычную благодарность и восхваление Творца.<\/p><p>При этом необходимо стараться всё больше направлять своё сердце к Всевышнему во время исполнения добрых дел.<\/p><p>Полученное благо ни в коем случае не должно становиться причиной уменьшения прежнего служения.<\/p><p>И оно не должно мешать человеку совершенствовать своё намерение служить ради Всевышнего.<\/p><h3 class=\"subheading\" id=\"sub-8-12\"><strong>Девятая обязанность: Быть довольным своей долей и стремиться к духовному росту<\/strong><\/h3><p>В отношении материальных благ человеку следует постоянно смотреть на тех, кто обладает меньшим, чем он сам.<\/p><p>Это поможет ему радоваться своей доле.<\/p><p>Он не должен постоянно сравнивать себя с людьми, обладающими большими благами, чтобы не прийти к зависти.<\/p><p>Но в отношении служения Всевышнему следует поступать наоборот.<\/p><p>Человек должен смотреть на тех, кто служит Творцу лучше и усерднее, чем он сам.<\/p><p>Это побудит его стремиться подняться до их духовного уровня.<\/p><p>При этом он не должен сравнивать себя с людьми, которые служат Всевышнему меньше, чем он.<\/p><p>Иначе он может возгордиться собственными поступками или перенять у них небрежность и ослабить своё служение.<\/p><h3 class=\"subheading\" id=\"sub-8-13\"><strong>Десятая обязанность: Не обманываться тем, что наказание откладывается<\/strong><\/h3><p>Человек не должен ошибочно истолковывать то, что Благословенный Творец временно не наказывает его за грехи и проявляет долготерпение.<\/p><p>Он не должен успокаивать себя мыслью, будто это означает, что Всевышний никогда не разгневается на него и в будущем.<\/p><h3 class=\"subheading\" id=\"sub-8-14\"><strong>Почему именно эти десять обязанностей являются основными?<\/strong><\/h3><p><strong>Разум продолжает:<\/strong><\/p><p>— Эти десять обязанностей составляют необходимую основу служения Всевышнему.<\/p><p>Доказательством служит следующее.<\/p><p>Все люди, которых Творец одарял различными благодеяниями, но которые, несмотря на это, отступили от служения Всевышнему и восстали против Него, пришли к такому состоянию только потому, что не исполнили перечисленные десять обязанностей.<\/p><p>Это относится как к людям прежних поколений, так и к тем, кто живёт в наше время.<\/p><p>Мы знаем об этом из того, что слышали о них и что наблюдаем собственными глазами.<\/p><p>Эта истина ясно раскрывается в книгах пророков, мир им, рассказывающих о событиях разных поколений.<\/p><p>Пренебрежение этими десятью обязанностями разрушает всю основу того, что объясняется в третьих вратах этой книги, а именно — обязанность человека принять на себя служение Всевышнему.<\/p><h3 class=\"subheading\" id=\"sub-8-15\"><strong>Что происходит с человеком, который исполняет эти десять обязанностей?<\/strong><\/h3><p>Если человек, несмотря на многочисленные благодеяния, которыми пользуется, не способен увеличить своё служение Всевышнему сверх этих десяти обязанностей, но исполняет хотя бы их ради Небес, он становится достойным того, чтобы полученные им особые блага сохранялись у него постоянно.<\/p><p>Однако если Всевышний всё же лишает его этих благ, это происходит по одной из двух причин.<\/p><p><strong>Первая причина — искупление прежнего греха.<\/strong><\/p><p>Всевышний может лишить человека какого-либо блага, чтобы посредством этой потери искупить грех, совершённый им в прошлом.<\/p><p><strong>Вторая причина — воздаяние в будущем мире.<\/strong><\/p><p>Творец может лишить человека определённых благ в этом мире, чтобы вознаградить его за них в будущем мире.<\/p><p>А награда будущего мира гораздо больше, ценнее и выше всех благ этого мира.<\/p><p>Таким образом, даже утрата материальных благ может в конечном счёте обернуться для человека добром.<\/p><p>Это добро может проявиться либо в одной форме, либо в другой.<\/p>", "subs": [{"id": "sub-8-1", "title": "Введение: Десять основных обязанностей в служении Всевышнему"}, {"id": "sub-8-2", "title": "Беседа разума и души"}, {"id": "sub-8-3", "title": "Какие обязанности являются необходимыми для каждого человека?"}, {"id": "sub-8-4", "title": "Первая обязанность: Не использовать полученные блага для нарушения воли Творца"}, {"id": "sub-8-5", "title": "Вторая обязанность: Постоянно благодарить Всевышнего"}, {"id": "sub-8-6", "title": "Третья обязанность: Высоко ценить благодеяния Творца"}, {"id": "sub-8-7", "title": "Четвёртая обязанность: Приписывать все блага только Творцу"}, {"id": "sub-8-8", "title": "Пятая обязанность: Осознавать, что полученные блага являются незаслуженной милостью"}, {"id": "sub-8-9", "title": "Шестая обязанность: Не считать собственные усилия источником благополучия"}, {"id": "sub-8-10", "title": "Седьмая обязанность: Не считать материальные блага доказательством духовного превосходства"}, {"id": "sub-8-11", "title": "Восьмая обязанность: Служить Всевышнему с искренним намерением"}, {"id": "sub-8-12", "title": "Девятая обязанность: Быть довольным своей долей и стремиться к духовному росту"}, {"id": "sub-8-13", "title": "Десятая обязанность: Не обманываться тем, что наказание откладывается"}, {"id": "sub-8-14", "title": "Почему именно эти десять обязанностей являются основными?"}, {"id": "sub-8-15", "title": "Что происходит с человеком, который исполняет эти десять обязанностей?"}]}, {"id": "chapter-8", "title": "Глава 8", "html": "<p><strong>Творец не принуждает человека совершать добро или зло. Этот выбор предоставлен исключительно воле самого человека, поэтому только он несёт ответственность за последствия своих поступков.<\/strong><\/p><p><strong>Душа сказала:<\/strong><\/p><p>— Ты занимался моим исцелением и принёс мне облегчение. Ты открыл мне истину. Ты совершил великое дело, когда направил свет своего разума на моё исцеление и тем самым рассеял тьму невежества, окутывавшую меня.<\/p><p>Однако меня всё ещё тревожит одно затруднение, которое может разрушить всё моё служение Всевышнему. Если ты избавишь меня от страдания, причиняемого этим затруднением, и устранишь тревогу, которую оно вызывает, ты спасёшь меня от величайшего страдания, и, вероятно, я полностью исцелюсь от всех своих недугов.<\/p><p><strong>Разум спросил:<\/strong><\/p><p>— Что это за затруднение, которое причиняет тебе столь сильное страдание?<\/p><p><strong>Душа ответила:<\/strong><\/p><p>— Меня тревожит следующее противоречие.<\/p><p>С одной стороны, я нахожу в священных книгах, что силы «воли», «способности», «повеления» и «принуждения» (<button aria-expanded=\"false\" aria-label=\"Примечание 100\" class=\"note-ref\" data-note=\"100\" type=\"button\">100<\/button>) следует приписывать исключительно Всевышнему. Только Он приводит эти силы в действие во всём сотворённом Им, независимо от того, относится ли оно к неживой природе, растениям, животным или человеку.<\/p><p>Все они действуют по необходимости, согласно Его воле.<\/p><p>Как сказано:<\/p><p>«Всё, что пожелал Всевышний, Он совершил на небесах и на земле» (Теилим, Псалмы 135:6).<\/p><p>И сказано:<\/p><p>«Всевышний умерщвляет и оживляет, низводит в преисподнюю и поднимает. Всевышний делает бедным и обогащает, унижает и возвышает» (Шмуэль I, Первая книга Самуила 2:6–7).<\/p><p>И сказано:<\/p><p>«Кто это сказал — и сбылось (<button aria-expanded=\"false\" aria-label=\"Примечание 101\" class=\"note-ref\" data-note=\"101\" type=\"button\">101<\/button>), если Господь не повелел? Разве не из уст Всевышнего исходят бедствия и добро?» (Эйха, Плач Иеремии 3:37–38).<\/p><p>И сказано:<\/p><p>«Образующий свет и творящий тьму, делающий мир и творящий зло» (Йешаяу, Исаия 45:7).<\/p><p>И сказано:<\/p><p>«Если Всевышний не построит дом, напрасно трудятся строящие его; если Всевышний не охранит город, напрасно бодрствует страж» (Теилим, Псалмы 127:1).<\/p><p>И сказано:<\/p><p>«Напрасно вам рано вставать (<button aria-expanded=\"false\" aria-label=\"Примечание 102\" class=\"note-ref\" data-note=\"102\" type=\"button\">102<\/button>), поздно садиться, есть хлеб скорбей; ведь Он даёт возлюбленному Своему во сне» (Теилим, Псалмы 127:2).<\/p><p>Существует множество подобных стихов, из которых, на первый взгляд, можно заключить, что Творец создал людей только для того, чтобы они наполняли и населяли этот мир, подобно остальным живым существам, без какой-либо дополнительной цели.<\/p><p>Люди движутся лишь тогда, когда Творец приводит их в движение, — с Его позволения, Его силой и Его могуществом. А когда Творец постановляет, чтобы они прекратили действовать, они останавливаются.<\/p><p>Как сказано:<\/p><p>«Если Он дарует покой (<button aria-expanded=\"false\" aria-label=\"Примечание 103\" class=\"note-ref\" data-note=\"103\" type=\"button\">103<\/button>), кто может нарушить его?» (Иов 34:29).<\/p><p>И сказано:<\/p><p>«Скроешь лицо Твоё (<button aria-expanded=\"false\" aria-label=\"Примечание 104\" class=\"note-ref\" data-note=\"104\" type=\"button\">104<\/button>) — они приходят в смятение; отнимешь дух их — умирают и возвращаются в прах свой» (Теилим, Псалмы 104:29).<\/p><p>И все древние философы в своих исследованиях единодушно соглашаются со всем сказанным, без разногласий.<\/p><p>Но, с другой стороны, я нахожу в Торе стихи, противоречащие этому мнению.<\/p><p>Из них следует, что поступки человека находятся в его собственной власти, что он сам выбирает их по своему желанию и что они совершаются по его воле и выбору.<\/p><p>Поэтому он заслуживает награды за служение и наказания за нарушение.<\/p><p>Как сказано:<\/p><p>«Смотри, предложил Я тебе сегодня жизнь и добро, смерть и зло» (Дварим, Второзаконие 30:15).<\/p><p>И сказано:<\/p><p>«И избери жизнь» (Дварим, Второзаконие 30:19).<\/p><p>И сказано:<\/p><p>«От ваших рук произошло это» (<button aria-expanded=\"false\" aria-label=\"Примечание 105\" class=\"note-ref\" data-note=\"105\" type=\"button\">105<\/button>) (Малахи 1:9).<\/p><p>И сказано:<\/p><p>«Ибо за дело человека Он воздаст ему» (<button aria-expanded=\"false\" aria-label=\"Примечание 106\" class=\"note-ref\" data-note=\"106\" type=\"button\">106<\/button>) (Иов 34:11).<\/p><p>И сказано:<\/p><p>«Глупость человека искажает его путь» (<button aria-expanded=\"false\" aria-label=\"Примечание 107\" class=\"note-ref\" data-note=\"107\" type=\"button\">107<\/button>) (Мишлей, Притчи 19:3).<\/p><p>Само существование в нашей Торе наставлений, заповедей и нравственных поучений ясно свидетельствует в пользу этого взгляда.<\/p><p>Ведь невозможно наставлять, приказывать и упрекать того, кто не распоряжается собой и действует исключительно под давлением необходимости.<\/p><p>Также и то, что Тора обещает награду за служение и наказание за нарушение, указывает на то, что поступки человека находятся в его собственной власти и что Всевышний не принуждает его совершать добро или зло, справедливость или несправедливость.<\/p><p>Это противоречие и угнетает меня, поскольку чрезвычайно трудно найти решение, которое согласовало бы эти две противоположности.<\/p><p>Если существует средство от этого страдания, пусть Всевышний исцелит меня от него через тебя.<\/p><p><strong>Разум ответил:<\/strong><\/p><p>— Согласовать стихи, которые кажутся тебе противоречащими друг другу, не труднее, чем согласовать противоположности, которые мы наблюдаем в самой действительности.<\/p><p>Ведь, с одной стороны, мы видим, что иногда человеку удаётся действовать согласно своему разумению и желанию, а иногда результаты его действий оказываются противоположными его воле и намерению.<\/p><p>Это показывает тебе, что Благословенный Творец обладает властью над человеком и что человек зависит от Его воли. Творец позволяет человеку совершать то, чего Сам желает, и препятствует ему совершать то, чего не желает.<\/p><p>То же можно наблюдать в способности человека говорить, слышать и видеть.<\/p><p>В определённые моменты Творец предоставляет человеку возможность по своему выбору говорить, слышать и видеть, а в другие моменты лишает его этой возможности.<\/p><p>Но, с другой стороны, я вижу, что в конечном счёте человек получает награду или наказание за свои поступки и действия в соответствии с тем, насколько он намеревался посредством них служить Всевышнему или противиться Ему.<\/p><p>Это указывает на то, что человеку предоставлена свобода выбора действовать по собственной воле.<\/p><p>Таким образом, то противоречие, которое ты находишь в стихах, обнаруживается и в самой действительности.<\/p><p>Следовательно, то решение, которое удовлетворит тебя при согласовании противоположностей, наблюдаемых в действительности, удовлетворит тебя и при согласовании кажущегося противоречия между стихами.<\/p><p>Древние мудрецы уже подробно спорили о том, как следует решить этот вопрос: действует ли человек по необходимости или по свободному выбору.<\/p><p>Некоторые утверждали, что все человеческие действия совершаются согласно желанию человека, в соответствии с его способностями и силами.<\/p><p>По их мнению, Всевышний передал человеку свободу выбора и власть над собственными поступками и не принуждает его совершать их.<\/p><p>Поэтому человек заслуживает за них награды и наказания.<\/p><p>Другие утверждали, что все действия людей, как и действия остальных творений, следует относить к Благословенному Творцу.<\/p><p>Каждое движение, происходящее в мире, начиная с человека и заканчивая неживыми предметами, совершается исключительно с позволения Творца, силой Его постановления, суда и повеления.<\/p><p>Ничто не может произойти иначе даже на толщину волоса — от самого малого движения до самого великого.<\/p><p>Когда их спрашивали, почему же человек заслуживает награды и наказания за свои поступки, если совершает их по необходимости, они отвечали:<\/p><p>— Подобно тому как мы не способны постичь сущность награды и наказания, мы не способны понять и правила, по которым они назначаются, а также почему и кому они полагаются.<\/p><p>Но мы полагаемся на Всевышнего, зная, что Он судит справедливо и не совершает несправедливости.<\/p><p>Он верен Своему обещанию воздавать награду и наказание и не нарушит его.<\/p><p>Мы верим, что наш разум слишком слаб, чтобы постичь, каким образом Он управляет миром по Своей мудрости.<\/p><p>Его справедливость настолько очевидна, а Его милосердие насто
