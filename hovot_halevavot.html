</style></head><body><header class="top"><div class="top-row first-row"><span class="bookbrand">Ховот ха-Левавот</span><span class="separator"></span><span class="current-title" id="current-title"></span></div><div class="top-row second-row"><div class="menu-buttons"><button id="menu" title="Выбрать главу">☰</button><div class="subwrap"><button id="subtoggle" title="Выбрать подраздел">§</button></div></div><div class="tools"><input id="search" placeholder="Поиск" type="search"><button id="searchnext" title="Следующий результат">⌕</button><span class="search-count" id="count"></span><button id="smaller" title="Уменьшить шрифт">А−</button><button id="larger" title="Увеличить шрифт">А+</button><button id="night" title="Ночной режим">☾</button></div></div></header><div class="scrim" id="scrim" hidden></div><div class="drawer" id="drawer" hidden></div><div class="subpanel" id="subpanel" hidden></div><div class="layout"><aside class="desktop-sidebar"><h2>Содержание</h2><nav id="desktop-nav"></nav></aside><main class="paper" id="book"><div class="repeated-book-heading"><h3>Ховот ха-Левавот «Обязанности сердец»</h3><h3>Врата 3</h3><h3>Врата служения Всевышнему</h3></div><h1 class="chapter-title" id="chapter-title"></h1><div class="content" id="content"></div><div class="bottom"><button id="prev">← Предыдущая глава</button><button id="next">Следующая глава →</button></div></main></div><script id="note-data" type="application/json">{"6": "<h4>(6) «Природные силы и сочетание четырёх элементов»<\/h4><p>Подобно тому как тело человека состоит из четырёх элементов — огня, воздуха, воды и земли, — его природная душа также связана с этими элементами.<\/p><p>Это животная душа, существующая как у человека, так и у всех животных. Она стремится к материальным удовольствиям, заботится о потребностях тела и усиливает склонность человека заниматься устройством земной жизни.<\/p><p>Над этой душой находится святая душа, происходящая из высших духовных миров.<\/p><p>О ней сказано:<\/p><p>«И вдохнул в ноздри его дыхание жизни» (Берешит, Бытие 2:7).<\/p><p>Эта душа связана с разумом, дарованным человеку. Её предназначение — управлять животной душой и телом.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "7": "<h4>(7) «Молитва, пост, цдака и добрые дела»<\/h4><p>Молитва противоположна стремлению к полной независимости от всяких обязанностей и отказу принимать на себя власть Всевышнего.<\/p><p>Пост противоположен стремлению к удовольствиям от еды.<\/p><p>Цдака противоположна стремлению накапливать материальные богатства.<\/p><p>Добрые дела противоположны эгоизму и жестокости.<\/p><p>По комментарию «Пат лехем».<\/p>", "8": "<h4>(8) «Освещать человеку путь»<\/h4><p>Поскольку желания одолевают человека и ослепляют его, как объяснил Рабейну Бахья ранее, человек нуждается в свете Торы, который освещает ему путь.<\/p><p>Благодаря этому он не будет блуждать подобно слепому во тьме.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "9": "<h4>(9) «Тора Всевышнего»<\/h4><p>Слова:<\/p><p>«Тора Всевышнего совершенна, возвращает душу; свидетельство Всевышнего верно, умудряет простодушного. Повеления Всевышнего справедливы, радуют сердце; заповедь Всевышнего чиста, просветляет глаза» (Теилим 19:8–9)<\/p><p>описывают четыре действия, которые Тора производит в человеческом разуме, как объяснил Рабейну Бахья.<\/p><p>«Возвращает душу» — укрепляет силу разума.<\/p><p>«Умудряет простодушного» — очищает и совершенствует разум.<\/p><p>«Радуют сердце» — озаряют разум и наполняют сердце радостью.<\/p><p>«Просветляет глаза» — устраняют тьму невежества, мешающую человеку видеть свет мудрости.<\/p><p>По комментарию «Пат лехем».<\/p>", "10": "<h4>(10) «Служение Всевышнему»<\/h4><p>Служение Всевышнему, к которому человек обязан прийти посредством разумного осознания, заключается в любви к Благословенному Творцу и трепете перед Ним.<\/p><p>Оно включает постоянное исполнение принципа:<\/p><p>«Всегда представляю Всевышнего перед собой» (Теилим, Псалмы 16:8).<\/p><p>Человек должен постоянно стремиться очищать свою душу, совершенствоваться и всё больше приближаться к Всевышнему.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "11": "<h4>11. «Приводит за собой второй вид смирения».<\/h4><p>Вначале человек должен очистить себя посредством смирения, основанного на страхе перед наказанием и надежде на награду.<\/p><p>В противном случае он не сможет преодолеть свои желания, которые господствуют над разумом и не позволяют ему использовать свои духовные силы, как объяснил наш учитель в предыдущих главах этого раздела.<\/p><p>Лишь после достижения такого смирения разум человека озаряется светом, и он становится способным к правильному размышлению.<\/p><p>Тогда он может подняться на высшую ступень смирения, основанную на разумном осознании.<\/p><p>Именно это смирение является истинным, желанным Всевышнему и угодным перед Ним.<\/p><p>(По объяснению «Тов а-Леванон».)<\/p>", "12": "<h4>12. «Скрытом в сердце».<\/h4><p>Поскольку человек служит Всевышнему лишь ради получения награды и избавления от наказания, его сердце не полностью предано служению.<\/p><p>Ведь если бы он мог получить ту же награду без необходимости служить Всевышнему, он был бы ещё более доволен.<\/p><p>(Комментарий «Пат Лехем».)<\/p>", "13": "<h4>13. «Подобно зерну, посеянному в землю».<\/h4><p>Подобно тому, как зерно сеют в землю ради получения урожая, цель служения Всевышнему, возникающего под воздействием Торы, заключается в том, чтобы из него выросло истинное служение, основанное на разумном осознании и внутреннем стремлении сердца, совершаемое ради Его благословенного имени.<\/p><p>И подобно тому, как обработка земли подготавливает её к успешному прорастанию зерна, Тора подготавливает сердце человека к служению Всевышнему, основанному на разумном понимании.<\/p><p>А подобно тому, как дождь помогает земле передать свои силы зерну, помощь Всевышнего позволяет человеку подняться на эту ступень.<\/p><p>(Составитель.)<\/p>", "14": "<h4>14. «Ради получения награды».<\/h4><p>То есть из надежды получить вознаграждение.<\/p><p>Но следует быть «подобными рабам, которые служат господину не ради получения награды» — из любви к Всевышнему, ради Его благословенного имени.<\/p><p>«И да будет страх Небес на вас» — то есть благоговение перед Всевышним, а не страх перед наказанием.<\/p><p>(По объяснению «Марпе ла-Нефеш».)<\/p>", "15": "<h4>15. «День дню передаёт речь».<\/h4><p>Каждый новый день всё больше раскрывает величие Всевышнего и Его чудеса.<\/p><p>(Составитель.)<\/p>", "16": "<h4>16. «Потому что глаза не соблюдали Тору Твою».<\/h4><p>Из того, что царь Давид, мир ему, скорбел именно о том, что его глаза не соблюдали Тору, но не упоминал при этом остальные органы тела, наш учитель делает вывод, что Давид сожалел о недостаточно совершенном исполнении обязанностей сердца, зависящих от правильного духовного видения и разумного постижения.<\/p><p>Как уже объяснил наш учитель выше, царь Давид молил Всевышнего помочь ему исполнять обязанности сердца и снять с его глаз завесу невежества.<\/p><p>Поэтому он говорил:<\/p><p>«Открой глаза мои, и увижу чудеса Торы Твоей».<\/p><p>(Теилим, 119:18.)<\/p><p>Поскольку каждый день царь Давид достигал нового понимания величия Всевышнего и Его чудес, как наш учитель доказал из стиха «День дню передаёт речь», Давид постоянно скорбел и проливал потоки слёз из-за того, что прежде не служил Всевышнему в соответствии с тем уровнем постижения, которого достиг теперь.<\/p><p>Так поступали и праведные, отрешённые от мирских излишеств служители Всевышнего, о которых рассказывает наш учитель.<\/p><p>(Составитель.)<\/p>", "17": "<h4>17. «Более высокой и возвышенной».<\/h4><p>Как подробно объясняет наш учитель далее (раздел «Врата самоанализа», глава 3, размышление 21), человек должен постоянно стремиться служить Всевышнему выше своих нынешних возможностей и молить Его о помощи в достижении этой ступени.<\/p><p>Если человек будет постоянно поступать таким образом, Всевышний исполнит его просьбу и откроет перед ним врата познания.<\/p><p>Тогда укрепятся его разум и силы тела, и он сможет исполнять обязанности сердца на уровне, который прежде превосходил его возможности.<\/p><p>Так он будет подниматься со ступени на ступень.<\/p><p>Перед ним откроются врата духовных уровней, являющихся драгоценным даром Всевышнего Его избранному народу и любящим Его.<\/p><p>Как сказал царь Шломо:<\/p><p>«Ибо человеку, который хорош перед Ним, Он дал мудрость, знание и радость».<\/p><p>(Коэлет, 2:26.)<\/p><p>(По объяснению «Марпе ла-Нефеш».)<\/p>", "18": "<h4>18. «И сердце твоё обрати к знанию моему»<\/h4><p>Согласно простому смыслу стиха, следовало бы написать «к их знанию», то есть к словам мудрецов, упомянутых ранее.<\/p><p>Однако, согласно объяснению нашего учителя, Тора дана нам для сохранения равновесия человека, чтобы он не склонялся ни к чрезмерной духовности, ни к чрезмерной материальности, но избрал золотую середину между разумом и вожделением.<\/p><p>Исходя из этого, приведённые стихи можно объяснить следующим образом.<\/p><p>«Приклони ухо твоё и слушай слова мудрых» — то есть изучай Тору и хорошо знай её.<\/p><p>«И сердце твоё обрати к знанию моему» — однако при этом не впадай в духовную крайность, которая приведёт тебя к отвращению от этого мира и отказу заниматься его благоустройством.<\/p><p>Обрати внимание на Моё намерение.<\/p><p>«Ибо приятно будет, если сохранишь их внутри себя» — когда ты будешь направлять свои материальные занятия согласно путям Торы и избегать чрезмерной склонности к материальному, тогда эти слова будут вместе утверждены на твоих устах.<\/p><p>Таким образом, одновременно с занятиями повседневными делами ты сможешь изучать Тору и духовно возвышаться.<\/p><p>Если же ты спросишь: как возможно совместить Тору и земные занятия, которые на первый взгляд противоречат друг другу?<\/p><p>Ответ заключается в словах:<\/p><p>«Чтобы на Господа было упование твоё, я научил тебя сегодня».<\/p><p>То есть сегодня Я сообщаю тебе: не только те, кто полностью посвящает себя Торе и духовности, подобно колену Леви, должны полагаться на Всевышнего в вопросах своего пропитания.<\/p><p>Ты тоже должен уповать на Всевышнего и верить, что Он поможет тебе успешно сочетать изучение Торы с земными занятиями.<\/p><p>«Разве не написал я тебе превосходных наставлений» — относись с должной серьёзностью к важным и возвышенным словам, которые Я написал тебе в наставлениях и знаниях.<\/p><p>Это необходимо, чтобы открыть тебе прямой и истинный путь в этом мире.<\/p><p>Тогда ты сможешь дать убедительный ответ тем, кто пытается отклонить тебя от этого истинного среднего пути к какой-либо крайности.<\/p><p>(Составитель.)<\/p>", "19": "<h4>19. «И Бог сделал»<\/h4><p>Всё сотворение мира и его дальнейшее существование предназначены для того, чтобы люди благоговели перед Всевышним.<\/p><p>(«Тов а-Леванон».)<\/p>", "20": "<h4>20. «В конце раздела &quot;Врата единства&quot;»<\/h4><p>Наш учитель сравнивает Тору со светом солнца, а способность людей к разумному пониманию — с силой их зрения.<\/p><p>Подобно тому как солнечный свет одинаково освещает всех людей, Тора одинаково обращается ко всем.<\/p><p>Но так же, как люди не в равной мере пользуются солнечным светом, поскольку зрение каждого человека различно, понимание Торы также неодинаково у всех.<\/p><p>Ведь каждый обладает собственным уровнем понимания.<\/p><p>(Составитель.)<\/p>", "21": "<h4>21. «В зависимости от изменений в его способности к пониманию»<\/h4><p>Способность человека к пониманию изменяется под воздействием различных обстоятельств, например болезни, забот, старости и тому подобного.<\/p><p>(Составитель.)<\/p>", "22": "<h4>22. «Перечисленных выше людей»<\/h4><p>Поскольку каждый человек понимает Тору по-разному, в соответствии со степенью своего разума, как объяснялось выше в примечании 20, исполнение заповедей также различается от человека к человеку.<\/p><p>Это выражается в тщательности соблюдения подробностей заповедей и в радости от их исполнения.<\/p><p>Каждый человек ощущает эту радость в соответствии со своими знаниями и пониманием.<\/p><p>(Составитель.)<\/p>", "23": "<h4>23. «Более возвышенным образом, чем другие народы»<\/h4><p>Этот вопрос подробно объясняется далее, в шестой главе данного раздела.<\/p><p>(«Марпе ла-Нефеш».)<\/p>", "24": "<h4>24. «Величайшие благодеяния»<\/h4><p>Ведь нет большего блага, чем то, что Всевышний превратил нас из народа рабов в избранный и драгоценный для Него народ.<\/p><p>Среди всех народов земли Всевышний освятил нас Своими заповедями, приблизил к служению Ему и нарёк над нами Своё великое и святое имя.<\/p><p>Но и этого великого достоинства недостаточно: мы также удостоились огромной награды в этом мире и в мире грядущем.<\/p><p>Эта награда настолько велика, что её невозможно описать словами.<\/p><p>Подобных благ не удостоился ни один другой народ.<\/p><p>(Составитель.)<\/p>", "25": "<h4>25. «Вы видели»<\/h4><p>Согласно словам нашего учителя, народ Израиля обязан в каждом поколении служить Всевышнему особым образом, больше остальных народов, поскольку мы удостоились трёх исключительных благодеяний.<\/p><p>Первое: мы вышли из рабства на свободу.<\/p><p>Второе: мы удостоились получения Торы и приближения к служению благословенному Всевышнему.<\/p><p>Третье: мы стали избранным народом и получаем награду за наше служение.<\/p><p>Исходя из этого, стихи можно объяснить следующим образом.<\/p><p>«Вы видели» — то есть вы сами стали свидетелями трёх великих благодеяний.<\/p><p>«Что Я сделал Египту» — чтобы вывести вас из дома рабства.<\/p><p>«И нёс вас на орлиных крыльях и привёл вас к Себе» — Я приблизил вас к служению Мне.<\/p><p>«И будете Моим драгоценным достоянием среди всех народов, ибо Мне принадлежит вся земля» — вы не только стали Моим избранным народом, но и получили дополнительное обещание.<\/p><p>«И будете вы Мне царством священнослужителей и святым народом» — то есть получите награду за своё служение.<\/p><p>Как объясняет Сфорно, Всевышний обещал, что благодаря соблюдению Торы они удостоятся всех благ будущего.<\/p><p>Как сказано:<\/p><p>«И будет оставшийся в Сионе и уцелевший в Иерусалиме назван святым».<\/p><p>(Йешаяу, 4:3.)<\/p><p>А наши мудрецы объяснили (Санедрин, 92а):<\/p><p>«Подобно тому как святое существует вечно, так и они будут существовать вечно».<\/p><p>Именно в этом заключалось намерение Всевышнего при даровании Торы — даровать им всё благо, которое должно раскрыться в будущем.<\/p><p>Следовательно, в благодарность за эти три особых благодеяния мы обязаны принять на себя более возвышенное и особое служение, чем остальные народы.<\/p><p>(Составитель.)<\/p>", "26": "<h4>26. «На надежде на награду и страхе перед наказанием»<\/h4><p>Тора многократно упоминает важность соблюдения законов и заповедей ради получения награды и избавления от наказания.<\/p><p>Ниже приведены некоторые стихи, подтверждающие это.<\/p><p>1. «А теперь, Израиль, слушай законы и постановления... чтобы вы жили, и пришли, и унаследовали землю». (Дварим, 4:1.)<\/p><p>2. «Когда родятся у тебя дети... и сделаете зло в глазах Господа, Бога твоего, чтобы разгневать Его, то свидетельствую сегодня перед вами небом и землёй, что непременно быстро исчезнете с земли... не продлятся ваши дни на ней, ибо непременно будете уничтожены». (Дварим, 4:25–26.)<\/p><p>3. «И соблюдай Его законы и Его заповеди, которые Я заповедую тебе сегодня, чтобы хорошо было тебе и детям твоим после тебя и чтобы продлились дни твои на земле, которую Господь, Бог твой, даёт тебе на все времена». (Дварим, 4:40.)<\/p><p>4. «По всему пути, который заповедал вам Господь, Бог ваш, ходите, чтобы вы жили, и хорошо было вам, и продлились ваши дни на земле, которую унаследуете». (Дварим, 5:30.)<\/p>", "5": "<h4>5. «И делай прямое и доброе в глазах Господа, чтобы хорошо было тебе, и пришёл ты, и унаследовал добрую землю, о которой Господь поклялся отцам твоим». (Дварим, 6:18.)<\/h4>", "27": "<h4>27. «Обретены были слова Твои, и я вкусил их»<\/h4><p>Когда на меня снизошёл дух пророчества, я принял слова Всевышнего с радостью и наслаждением, подобно человеку, который вкушает приятную и вкусную пищу.<\/p><p>(Радак и «Мецудат Давид».)<\/p>", "28": "<h4>28. «Возрадуется праведник о Господе»<\/h4><p>Праведник радуется служению Всевышнему и его духовной сладости.<\/p><p>Он уповает на Всевышнего, испытывая счастье от того, что удостоился находиться под покровительством своего Бога.<\/p><p>«И прославятся все прямые сердцем» — все люди с прямыми сердцами радуются и прославляют своё достоинство, заключающееся в том, что они удостоились разумного познания и служения Всевышнему.<\/p><p>(По объяснениям Радака и «Мецудат Давид».)<\/p>", "29": "<h4>29. «Свет посеян для праведника»<\/h4><p>Свет, предназначенный праведнику, постоянно умножается, подобно посеянному зерну, которое прорастает и приносит всё больший урожай.<\/p><p>«И для прямых сердцем — радость» — радость, приготовленная для людей с прямыми сердцами, является радостью о Всевышнем, как сказано в следующем стихе:<\/p><p>«Радуйтесь, праведники, о Господе и благодарите при воспоминании святости Его».<\/p><p>Награда праведников заключается в радости, возникающей благодаря близости ко Всевышнему.<\/p><p>(Составитель.)<\/p>", "30": "<h4>30. «И Я дам тебе возможность ходить среди этих стоящих»<\/h4><p>Если ты будешь ходить путями Всевышнего и соблюдать Его заповеди, то удостоишься находиться среди серафимов и ангелов-служителей, стоящих перед Всевышним в высшем небесном дворце.<\/p><p>Из этого следует, что величайшая награда избранных служителей Всевышнего заключается в возможности приблизиться к высшему свету.<\/p><p>(По объяснениям Раши и «Тов а-Леванон».)<\/p>", "31": "<h4>31. «Как велико благо Твоё»<\/h4><p>Как чрезвычайно велико благо, которое Ты приготовил для боящихся Тебя в грядущем мире, помимо того блага, которое Ты открыто даруешь уповающим на Тебя в этом мире, перед людьми.<\/p><p>(По объяснениям Ибн Эзры и «Мецудат Давид».)<\/p>", "32": "<h4>32. «Ничей глаз не видел»<\/h4><p>Глаз ни одного пророка не видел этого, кроме Тебя Самого, Боже.<\/p><p>Всевышний совершит для ожидающих Его спасения то, что приготовлено Им для них.<\/p><p>(Раши и Таргум Йонатан.)<\/p>", "33": "<h4>33. «Основные правила и коренные принципы»<\/h4><p>Но не все подробности и ответвления разумных заповедей, поскольку они чрезвычайно многочисленны и разветвляются без ограничения.<\/p><p>Как уже писал наш учитель выше в этой главе, объясняя пятую причину необходимости разумного побуждения, а также во введении.<\/p><p>(Составитель.)<\/p>", "34": "<h4>34. «Пути её — пути приятные»<\/h4><p>Благодаря Торе каждый человек может приятным и доступным путём достичь совершенства в служении Всевышнему.<\/p><p>Если бы Тора не заповедала также разумные заповеди и нам пришлось бы исполнять их исключительно на основании собственного разумного осознания, мы были бы вынуждены прилагать огромные усилия, прежде чем смогли бы постичь их.<\/p><p>Многие люди даже остались бы на протяжении всей жизни без религиозного руководства и Торы.<\/p><p>Но теперь, поскольку разумные заповеди также записаны в Торе, все могут исполнять их, даже если не постигли их смысл собственным разумом.<\/p><p>(«Менухат а-Левавот».)<\/p>", "35": "<h4>35. «Подобно остальным людям»<\/h4><p>Служение, возникающее из разумного осознания, возлагается на человека в благодарность за благодеяния, которые благословенный Творец оказывает ему с самого начала его сотворения.<\/p><p>К ним относятся его развитие, устройство тела, способности души и способы получения питания.<\/p><p>Как подробно объяснялось выше, в пятой главе раздела «Врата размышления о творении».<\/p><p>Эти благодеяния распространяются на всех людей в равной степени.<\/p><p>Поэтому каждый человек обязан принять на себя виды служения, необходимость которых устанавливает разум, подобно остальным людям.<\/p><p>(«Тов а-Леванон».)<\/p>", "36": "<h4>36. «Их двадцать четыре, и вот они»<\/h4><p>Речь идёт о двадцати четырёх видах священного служения, возложенных на коэнов.<\/p><ol><li>Возлияние масла — йецикот.<\/li><li>Смешивание — блилот.<\/li><li>Разделение на части — птитот.<\/li><li>Посыпание солью — млихот.<\/li><li>Возношение и размахивание приношением — тнуфот.<\/li><li>Поднесение приношения к жертвеннику — агашот.<\/li><li>Взятие горсти мучного приношения — кмицот.<\/li><li>Воскурение на жертвеннике — актарот.<\/li><li>Отделение головы птицы особым способом — мликот.<\/li><li>Принятие жертвенной крови — кабалот.<\/li><li>Перенесение жертвенной крови — олахот.<\/li><li>Отсечение головы телицы — арифот.<\/li><li>Окропление кровью — азаот.<\/li><li>Поение женщины, подозреваемой в супружеской неверности, особой водой — ашкаат сота.<\/li><li>Очищение человека, поражённого цараат, — таарат мецора.<\/li><li>Священническое благословение — несиат капаим.<\/li><li>Удаление пепла с жертвенника — трумат а-дешен.<\/li><li>Устройство дровяного костра на жертвеннике — сидур а-маараха.<\/li><li>Размещение двух поленьев — сидур шней гезирей эцим.<\/li><li>Очищение внутреннего жертвенника от пепла — дишун мизбеах а-пними.<\/li><li>Очищение Меноры — дишун а-Менора.<\/li><li>Приготовление и размещение хлебов предложения — лехем а-паним.<\/li><li>Чаши с ладаном — базихей а-левона.<\/li><li>Подготовка светильников Меноры — арахат а-нерот.<\/li><\/ol><p>(«Марпе ла-Нефеш» и «Тов а-Леванон».)<\/p>", "37": "<h4>37. «А золото использовали для Бааля»<\/h4><p>Они не только не увеличили своё служение Всевышнему в благодарность за огромное количество серебра, которым Он их одарил, но поступили прямо противоположным образом — использовали полученное богатство для идолопоклонства.<\/p><p>(«Тов а-Леванон».)<\/p>", "38": "<h4>38. «Становится причиной того, что перестаёт служить Всевышнему»<\/h4><p>Это соответствует словам наших мудрецов:<\/p><p>«Один грех влечёт за собой другой грех».<\/p><p>(Пиркей Авот, 4:2.)<\/p><p>(«Тов а-Леванон».)<\/p>", "39": "<h4>39. «Живое разумное существо»<\/h4><p>Определение «живое» отличает человека от остальных творений, не обладающих жизнью.<\/p><p>Определение «говорящее» отличает человека от остальных живых существ.<\/p><p>Наш учитель использует такое определение человека также выше, в разделе «Врата размышления о творении», глава 5.<\/p>", "40": "<h4>40. «Ибо злодеи погибнут»<\/h4><p>Поскольку в этом мире они не исполняли ни заповедей Торы, ни обязанностей, устанавливаемых разумом, они опустили себя до уровня животных и даже ниже их, как объясняет наш учитель.<\/p><p>Поэтому после смерти от них ничего не останется: их тело и душа исчезнут и погибнут, подобно лучшим из ягнят, которые полностью исчезают в дыму при приготовлении.<\/p><p>Так злодеи погибнут по принципу «мера за меру».<\/p><p>Подобно тому как они сами низвели себя до низменного уровня животных, так и погибнут подобно им.<\/p><p>(По объяснениям «Менухат а-Левавот» и «Тов а-Леванон».)<\/p>", "41": "<h4>41. «По Своей милости, щедрости и доброте»<\/h4><p>Ведь на самом деле нам не полагается никакая награда за наше служение.<\/p><p>Мы и без того обязаны служить Всевышнему всеми своими силами в благодарность за огромные и особые благодеяния, которые Он оказал именно нам, как объяснялось в предыдущей главе, в четвёртой причине необходимости побуждения посредством Торы.<\/p><p>Поэтому награда, которую Всевышний дарует нам, является исключительно проявлением Его милости, щедрости и доброты.<\/p><p>Ведь благословенный Всевышний добр, творит добро и исполнен великого милосердия.<\/p><p>(По объяснению «Марпе ла-Нефеш».)<\/p>", "42": "<h4>42. «Сукка, лулав, цицит»<\/h4><p>При исполнении всех этих заповедей требуется соединение намерения сердца с действием органов тела.<\/p><p>Человек должен совершать их ради Небес.<\/p><p>(«Менухат а-Левавот».)<\/p>", "43": "<h4>43. «Хорош человек, который милостив и даёт взаймы»<\/h4><p>Счастлив человек, который помогает бедным и даёт взаймы нуждающимся.<\/p><p>«Он ведёт свои дела справедливо» — то есть все его поступки взвешены и соответствуют справедливой мере.<\/p><p>Он не отказывается полностью от этого мира, но и не погружается в него чрезмерно.<\/p><p>Он следует среднему, золотому пути.<\/p><p>Точно так же, когда он помогает бедным, он не проявляет чрезмерной скупости, но и не раздаёт слишком много, чтобы самому впоследствии не оказаться в положении человека, вынужденного зависеть от помощи других.<\/p><p>(По объяснению Радака.)<\/p>", "44": "<h4>44. «Оставь собственную мудрость твою»<\/h4><p>То есть: «Даже не принимая во внимание мой совет, прекрати».<\/p><p>Смысл заключается в следующем: перестань полагаться на собственное разумение, ведь какую пользу принесёт тебе огромное богатство?<\/p><p>(«Мецудат Давид».)<\/p>", "45": "<h4>45. «Сердце мудрых — в доме скорби»<\/h4><p>Мудрые люди постоянно размышляют о дне смерти, чтобы смирить и подчинить своё сердце.<\/p><p>Из этого следует, что стремление использовать средства, которые смиряют сердце и ослабляют его желания, достойно похвалы.<\/p><p>Следовательно, человек, который достигает этого посредством чрезмерного самоограничения, также достоин похвалы.<\/p><p>(Составитель.)<\/p>", "46": "<h4>46. «Подобен человеку, который пытается потушить огонь соломой»<\/h4><p>Человеку, который пытается потушить огонь соломой, в первое мгновение кажется, будто он погасил пламя, накрыв его соломой.<\/p><p>Но вскоре выясняется, что произошло обратное: он лишь усилил огонь и заставил его разгореться ещё сильнее.<\/p><p>То же происходит с человеком, который отдаляется от мира из любви к самому миру.<\/p><p>На первый взгляд кажется, что он отказывается от удовольствий и страстей и приближается к духовности.<\/p><p>Но в действительности он достигает противоположного результата — ещё глубже погружается в желания и удовольствия этого мира.<\/p><p>(Составитель.)<\/p>", "47": "<h4>47. «Не спеши устами своими»<\/h4><p>Не торопись произносить слова.<\/p><p>И пусть сердце твоё не побуждает тебя поспешно говорить, ведь твои слова предстанут перед Всевышним.<\/p><p>«Ибо Бог на небесах, а ты на земле» — знай, что над тобой есть ухо, которое всё слышит.<\/p><p>«Поэтому пусть слова твои будут немногочисленны» — ведь при многословии невозможно избежать греха.<\/p><p>(Составитель.)<\/p>", "48": "<h4>48. «Будь то излишнее... оно неизбежно относится к заповеди, если совершается ради Небес»<\/h4><p>Я не удостоился понять это высказывание.<\/p><p>Ведь различие между намерением «ради Небес» и намерением «не ради Небес» упоминается как в предыдущем отрывке, так и в следующем, но только в отношении чрезмерного самоограничения, которое оценивается в зависимости от намерения человека.<\/p><p>Однако относительно излишних действий наш учитель пишет в предыдущем отрывке:<\/p><p>«И всё, что мы упомянули относительно удовлетворения телесных потребностей и удовольствий, в конечном итоге заслуживает порицания, поскольку приводит человека к нарушению того, от чего Творец предостерёг и что запретил».<\/p><p>При этом он не оговаривает, что это относится только к случаям, когда человек действует не ради Небес.<\/p><p>Из его слов следует, что излишества заслуживают порицания в любом случае, даже если человек намеревается действовать ради Небес.<\/p><p>Ведь они приводят к нарушению запретов Творца.<\/p><p>То же следует и из слов нашего учителя в следующем отрывке:<\/p><p>«А если он умножает и превышает меру необходимого, то уменьшает своё служение, поскольку это приводит к тому, от чего предостерёг Всевышний».<\/p><p>И здесь наш учитель снова не уточняет, что речь идёт только о действиях, совершаемых не ради Небес.<\/p><p>Следовательно, можно понять, что даже если человек совершает излишние действия ради Небес, он всё равно уменьшает своё служение Всевышнему.<\/p><p>Его доброе намерение не делает излишества дозволенными, поскольку они приводят к тому, что запретил Всевышний.<\/p><p>Однако здесь наш учитель пишет:<\/p><p>«Ибо всё, что выходит за пределы необходимого, будь то увеличение или уменьшение, неизбежно относится к заповеди, если совершается ради Небес».<\/p><p>То есть даже излишние действия являются заповедью, если совершаются ради Небес.<\/p><p>Да просветит Всевышний мои глаза, чтобы я понял истинное намерение нашего учителя.<\/p><p>(Составитель.)<\/p>", "49": "<h4>49. «Вот, Я дал вам»<\/h4><p>Смысл стиха заключается в следующем.<\/p><p>Подобно тому как слова «плодитесь и размножайтесь» в предыдущем стихе являются заповедью, так и слова «и овладевайте ею», а также следующие за ними слова «вот, Я дал вам...» также имеют характер повеления.<\/p><p>(«Менухат а-Левавот».)<\/p>", "50": "<h4>50. «Они также не совершали несправедливости»<\/h4><p>Даже то, что они не совершали несправедливости, засчитывается им так, словно они действительно ходили путями Всевышнего, то есть словно исполнили положительную заповедь.<\/p><p>(Радак.)<\/p>", "51": "<h4>51. «Он ведёт свои дела справедливо»<\/h4>", "52": "<h4>52. «Размышлял я о путях своих»<\/h4><p>Благодаря тому, что я внимательно взвешивал все свои поступки, исследуя, являются ли они добрыми, я смог сказать:<\/p><p>«И обратил стопы мои к свидетельствам Твоим».<\/p><p>(«Марпе ла-Нефеш».)<\/p>", "53": "<h4>53. «Ибо всякое дело»<\/h4><p>Каждый поступок человека без исключения Всевышний приведёт на суд.<\/p><p>Он будет судить человека за всё сокрытое.<\/p><p>Не по тому, что видят другие люди, а по намерению сердца, скрытому от окружающих.<\/p><p>Было ли намерение добрым или дурным — в соответствии с этим Всевышний воздаст человеку награду или наказание.<\/p><p>(«Мецудат Давид».)<\/p>", "54": "<h4>54. «Все термины, которые перечисляет наш учитель, относятся к правилам грамматики»<\/h4><p>«Существительные, глаголы и служебные слова».<\/p><p>Это три основные части языка, к которым относятся все слова.<\/p><p>Существительные — названия предметов и понятий, например:<\/p><p>שמים — небеса.<\/p><p>ארץ — земля.<\/p><p>אדם — человек.<\/p><p>בית — дом.<\/p><p>Глаголы и слова, обозначающие действие или состояние, например:<\/p><p>אדם בא — человек приходит.<\/p><p>בית גדול — большой дом.<\/p><p>Служебные слова соединяют отдельные слова или уточняют их значение, например:<\/p><p>גם — также.<\/p><p>למען — ради, чтобы.<\/p><p>מפני — по причине.<\/p><p>עם — с.<\/p><p>את — показатель прямого дополнения.<\/p><p>כל — весь, каждый.<\/p><p>«Какие слова находятся в сопряжённом состоянии».<\/p><p>Например:<\/p><p>עבודת הבורא — служение Творцу.<\/p><p>דבר ה&#x27; — слово Всевышнего.<\/p><p>И какие слова употребляются самостоятельно, вне сопряжённого состояния.<\/p><p>«Употребление будущего времени для выражения прошлого».<\/p><p>Например:<\/p><p>«ויש אשר ישכון הענן» — «И бывало, что облако оставалось».<\/p><p>«על פי ה&#x27; יחנו» — «По слову Господа они располагались станом».<\/p><p>«ככה יעשה איוב» — «Так поступал Иов».<\/p><p>«Повелительная форма в виде неопределённой формы глагола».<\/p><p>Например:<\/p><p>«זכור את יום השבת» — «Помни день субботний».<\/p><p>Здесь повеление выражено формой, совпадающей с неопределённой формой глагола, то есть той формой, которой обозначается само действие памятования — «זכור».<\/p><p>«Полные и неполные формы слов».<\/p><p>Существуют слова, в которых все корневые буквы сохраняются в полной форме как в прошедшем, так и в настоящем и будущем времени.<\/p><p>Например, корень פקד:<\/p><p>פקדתי — я посетил, сосчитал.<\/p><p>פוקד — посещает, считает.<\/p><p>אפקוד — я посещу, сосчитаю.<\/p><p>Но существуют и слова, в которых одна из корневых букв иногда исчезает.<\/p><p>Например, корень הלך — идти.<\/p><p>В прошедшем и настоящем времени все корневые буквы сохраняются:<\/p><p>הלכתי — я шёл.<\/p><p>הולך — идёт.<\/p><p>Но в будущем времени:<\/p><p>- אלך — я пойду.<\/p><p>Здесь отсутствует буква ה, первая буква корня.<\/p><p>«Слабые буквы».<\/p><p>Это слова, в которых одна из букв не имеет собственной огласовки, а находится в состоянии покоя.<\/p><p>При этом существуют буквы, которые слышны при произношении, например:<\/p><p>Буква מ в слове אברהם.<\/p><p>Буква ר в слове היצר.<\/p><p>И существуют буквы, которые не слышны:<\/p><p>Буква א в слове ברא.<\/p><p>Буква ה в слове עשה.<\/p><p>«Удвоенные корневые буквы».<\/p><p>Например:<\/p><p>בלל.<\/p><p>גלל.<\/p><p>סבב.<\/p><p>(«Марпе ла-Нефеш» и «Пат Лехем».)<\/p>", "55": "<h4>55. «В переносном, образном значении»<\/h4><p>Например:<\/p><p>«בלב ים» — в сердце моря.<\/p><p>«ראש ההר» — вершина горы, буквально «голова горы».<\/p><p>«בצורות בשמים» — укреплённые до небес.<\/p><p>(«Марпе ла-Нефеш».)<\/p>", "56": "<h4>56. «Образованы от других слов»<\/h4><p>Например:<\/p><p>«אדם» — человек, от слова «אדמה» — земля.<\/p><p>«גיבור» — сильный человек, герой, от слова «גבורה» — сила, мужество.<\/p><p>(«Марпе ла-Нефеш» и комментарий Ри&#x27;а.)<\/p>", "57": "<h4>57. «Условия»<\/h4><p>Имеются в виду способы приобретения Торы и правила, посредством которых Тора толкуется и исследуется.<\/p><p>(Составитель.)<\/p>", "58": "<h4>58. «И в зависимости от места, в котором они действуют»<\/h4><p>Например:<\/p><p>Заповеди, связанные с землёй Израиля, не действуют за её пределами.<\/p><p>Чтение Свитка Эстер в городах, окружённых стеной со времён Йеошуа бин Нуна, совершается 15 адара, а в остальных местах — 14 адара.<\/p><p>Также второй праздничный день, соблюдаемый за пределами Земли Израиля, не соблюдается в самой Земле Израиля.<\/p><p>(Составитель.)<\/p>", "59": "<h4>59. «Барайта»<\/h4><p>Слово «Барайта» происходит из арамейского языка и переводится на святой язык как «внешняя».<\/p><p>Так называют собрание высказываний танаим, которые были переданы отдельно от тех высказываний, что вошли в Мишну, и дополняют их.<\/p><p>(Составитель.)<\/p>", "60": "<h4>60. «Бремя Торы — узы разума»<\/h4><p>Наш учитель имеет в виду два вида побуждения к служению, о которых говорил в двух предыдущих главах.<\/p><p>«Бремя Торы» означает побуждение посредством изучения Торы.<\/p><p>«Узы разума» означают побуждение, возникающее благодаря разумному осознанию.<\/p><p>(«Пат Лехем».)<\/p>", "61": "<h4>61. «Раскрыть то, что у него на сердце»<\/h4><p>То есть открыто демонстрировать всем желания своего сердца и стремление к удовольствиям.<\/p><p>(По объяснению Меири на книгу Мишлей.)<\/p>", "62": "<h4>62. «Поймите, простодушные, благоразумие»<\/h4><p>Задумайтесь и поймите, что ваше мнение несостоятельно и не имеет под собой основания.<\/p><p>«И глупцы, обретите разумное сердце» — осознайте, что даже согласно вашему ошибочному взгляду вы обязаны исполнять Тору и верить в награду и наказание.<\/p><p>(«Менухат а-Левавот» и «Тов а-Леванон».)<\/p>", "63": "<h4>63. «Бог приведёт на суд»<\/h4><p>Несомненно, этот стих не может относиться исключительно к награде и наказанию в этом мире.<\/p><p>Ведь мы собственными глазами видим, что многие праведники живут в страданиях, тогда как многие злодеи наслаждаются изобилием и удовольствиями этого мира.<\/p><p>Следовательно, речь обязательно идёт о награде и наказании в грядущем мире.<\/p><p>(«Пат Лехем».)<\/p>", "64": "<h4>64. «И вновь увидите разницу между праведником и злодеем»<\/h4><p>Хотя сейчас вы видите, что злодеи живут спокойно, а праведники страдают, наступит время, когда вы ясно увидите различие между праведником и злодеем.<\/p><p>(«Мецудат Давид».)<\/p>", "65": "<h4>65. «И выйдут, и увидят»<\/h4><p>В грядущий великий День суда праведники выйдут за пределы Иерусалима, к долине Бен-Гинном, чтобы увидеть оттуда суд над злодеями в Геенне.<\/p><p>Ведь там находится один из входов в Геенну, как сказали наши мудрецы (Сукка, 32б).<\/p><p>Они увидят злодеев, «ибо червь их не умрёт» — черви, пожирающие их плоть, не погибнут.<\/p><p>«И огонь их не погаснет» — огонь, сжигающий их, не угаснет.<\/p><p>«И будут они мерзостью для всякой плоти» — они станут предметом позора в глазах всех, кто придёт поклониться Всевышнему.<\/p><p>(По объяснениям Радака и «Мецудат Давид».)<\/p>", "66": "<h4>66. «Как велико благо Твоё»<\/h4><p>Как чрезвычайно велико благо, которое Ты приготовил для боящихся Тебя в грядущем мире.<\/p><p>Это помимо того блага, которое Ты открыто даруешь уповающим на Тебя в этом мире, перед людьми.<\/p><p>(По объяснениям Ибн Эзры и «Мецудат Давид».)<\/p>", "67": "<h4>67. «Ходить среди этих стоящих»<\/h4><p>Ты удостоишься того, что после отделения души от тела она сможет находиться среди ангелов, которые вечно стоят перед Всевышним.<\/p><p>(По объяснению Радака.)<\/p>", "68": "<h4>68. «Ничей глаз не видел»<\/h4><p>Глаз ни одного пророка не видел этого.<\/p><p>«Кроме Тебя, Боже» — никто, кроме Тебя Самого, Всевышний.<\/p><p>«Того, что Он сделает для ожидающего Его» — того, что Святой, благословен Он, приготовил для ожидающих Его спасения.<\/p><p>(Раши и Таргум Йонатан.)<\/p>", "69": "<h4>69. «И пойдёт перед тобой праведность твоя»<\/h4><p>Благотворительность, которую ты совершал, пойдёт перед тобой, чтобы привести тебя в Ган Эден — Райский сад.<\/p><p>«Слава Господа примет тебя» — в место, где сокрыты души праведников.<\/p><p>(«Мецудат Давид».)<\/p>", "70": "<h4>70. «Мёртвые мухи»<\/h4><p>В зимние дни мухи слабы и близки к смерти.<\/p><p>И даже такое ничтожное существо, как умирающая муха, если попадёт в благовонное масло, смешанное с ароматическими веществами, может испортить его, вызвать неприятный запах и образование пены.<\/p><p>Так же и небольшая глупость в человеке может перевесить его мудрость и почёт в сторону вины.<\/p><p>Хотя сама по себе эта глупость кажется незначительной, она способна уничтожить всё достоинство человека, даже если он обладает мудростью и уважением окружающих.<\/p><p>(Раши.)<\/p>", "71": "<h4>71. «Много добра»<\/h4><p>Даже один грех, который портит служение, способен уничтожить ценность всего служения.<\/p><p>(«Марпе ла-Нефеш» и «Пат Лехем».)<\/p>", "72": "<h4>72. «Высокомерие и гордыня»<\/h4><p>Когда человек совершает грех, он может осознать это и пробудиться к раскаянию.<\/p><p>Но когда он не совершил греха и начинает гордиться этим, он не чувствует необходимости раскаиваться.<\/p><p>Поэтому гордыня может быть хуже самих грехов.<\/p><p>(«Марпе ла-Нефеш».)<\/p>", "73": "<h4>73. «Соберите ко Мне праведников Моих»<\/h4><p>В грядущем будущем Святой, благословен Он, обратится к небесам и земле и скажет им:<\/p><p>«Соберите и приведите ко Мне Моих праведников, заключивших со Мной завет».<\/p><p>Это те, кто заключил со Мной завет, остался верен своей вере и освятил Моё имя, принося себя в жертву даже тогда, когда другие народы убивали их.<\/p><p>(Раши и «Пат Лехем».)<\/p>", "74": "<h4>(74) Почему беседа в форме вопросов и ответов помогает лучше раскрыть тему?<\/h4><p>Потому что задающий вопрос обычно старается подробно и убедительно объяснить своё затруднение, чтобы его вопрос был понятен.<\/p><p>Отвечающий, со своей стороны, стремится тщательно рассмотреть все стороны вопроса и дать убедительное объяснение, устраняющее возникшее сомнение.<\/p><p>По комментарию «Пат лехем».<\/p>", "75": "<h4>(75) «Воздавать злом злодеям»<\/h4><p>Хотя Тора запрещает человеку мстить, как сказано:<\/p><p>«Не мсти и не храни злобы» (Ваикра, Левит 19:18),<\/p><p>тем не менее человек должен понимать, что с точки зрения принципа справедливого воздаяния зло заслуживает соответствующего наказания.<\/p><p>Если, не дай Бог, человек отвечает Творцу злом на многочисленные благодеяния, которые получает от Него, то по справедливости он заслуживает наказания за свои дурные поступки.<\/p><p>Осознание этого должно удерживать человека от нарушения воли Всевышнего из страха перед наказанием.<\/p><p>По пояснению составителя.<\/p>", "76": "<h4>(76) «Это превосходит его возможности»<\/h4><p>Как пишет Рабейну Бахья далее, во «Вратах упования» (глава 4, часть 6), даже если добрых дел человека будет столько же, сколько песчинок на берегу моря, они не смогут сравниться даже с одним из многочисленных благодеяний, которыми Творец одаряет его в этом мире.<\/p><p>Тем более это верно, если у человека имеются грехи.<\/p><p>Если бы Творец потребовал от человека благодарности и служения в полной мере, соответствующей полученным благам, все человеческие поступки оказались бы ничтожными даже по сравнению с самым малым благодеянием Творца.<\/p><p>Святой Шла объясняет это с помощью притчи.<\/p><p>Представим человека, который, не дай Бог, ослеп. К нему пришёл великий врач и совершенно бесплатно вернул ему зрение.<\/p><p>Разве этот человек не будет испытывать к врачу глубокую и искреннюю любовь? Разве ему будет трудно выполнять просьбы и указания врача?<\/p><p>Но ведь этот врач не создал ему глаза, а лишь исцелил их.<\/p><p>Насколько же больше человек обязан благодарить Всевышнего, Который создал все его органы, питает и обеспечивает его, заботится о нём и даровал ему душу, благодаря которой он может достичь вечной жизни.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "77": "<h4>(77) «Разум обращается к душе»<\/h4><p>Под душой здесь понимается жизненная сила человека, благодаря которой тело живёт и существует.<\/p><p>Поэтому она называется «жизненной душой», поскольку необходима для существования человека.<\/p><p>Творец вложил в эту душу стремление к материальным удовольствиям. Поэтому она также называется «животной душой», поскольку, подобно душе животного, стремится поддерживать существование тела и удовлетворять его потребности.<\/p><p>Поскольку эта душа стремится к наслаждениям, она принимает на себя бремя Торы главным образом ради получения награды и избежания наказания, то есть ради собственной выгоды.<\/p><p>Разум же представляет собой святую душу, стремящуюся к духовности.<\/p><p>Она дана человеку для того, чтобы он мог обуздывать свои желания и управлять своей животной душой и телом.<\/p><p>Разум вступает в спор с душой и доказывает ей, что служить Всевышнему следует из нравственного осознания и благодарности за Его многочисленные благодеяния.<\/p><p>Иными словами, служение должно исходить не из личной заинтересованности в награде или страха перед наказанием, а из любви к Всевышнему.<\/p><p>По комментариям «Марпе ла-нефеш» и «Тов ха-Леванон».<\/p>", "78": "<h4>(78) «Находишься у Него в залоге — принадлежишь Ему»<\/h4><p>В обычной жизни, когда бедный человек нуждается в деньгах, он сначала берёт заём и оставляет какую-либо вещь в залог.<\/p><p>Он не продаёт её, поскольку надеется, что со временем сможет вернуть долг и выкупить заложенное имущество.<\/p><p>Но когда наступает срок возврата долга, а у него нет средств для его погашения, заложенная вещь переходит в собственность кредитора.<\/p><p>Подобным образом происходит и с человеком.<\/p><p>Сначала его душа словно находится в залоге у Творца за многочисленные благодеяния, полученные от Него.<\/p><p>Но когда выясняется, что человек не способен полностью воздать за них, его душа оказывается всецело принадлежащей Творцу.<\/p><p>По комментарию «Пат лехем».<\/p>", "79": "<h4>(79) «Удалить от себя силы и дурные качества»<\/h4><p>Прежде всего человек должен отдалиться от факторов, укрепляющих дурные качества.<\/p><p>Когда эти качества лишатся поддерживающих их сил, человеку станет гораздо легче избавиться и от самих дурных качеств.<\/p><p>По комментарию «Пат лехем».<\/p><p>Примечание<\/p>", "80": "<h4>(80) «Словно эти отношения равны»<\/h4><p>Даже если бы отношение человека к Творцу было сопоставимо с отношением слуги к своему господину, человек уже мог бы учиться служению Всевышнему на примере того поведения, которого он сам ожидает от своего слуги.<\/p><p>Тем более это верно, когда человек осознаёт, что между этими отношениями нет никакого действительного равенства.<\/p><p>Ведь Благословенный Творец бесконечно выше человека, несравнимо больше, чем человек выше своего слуги.<\/p><p>Поэтому человек должен прийти к выводу, что обязан служить Всевышнему неизмеримо больше, чем слуга обязан служить своему господину.<\/p><p>По пояснению составителя.<\/p>", "81": "<h4>(81) «Пока он видит тебя»<\/h4><p>Ведь Святой, благословен Он, видит нас всегда.<\/p><p>Как сказано:<\/p><p>«Может ли человек скрыться в тайном месте, чтобы Я не увидел его? — говорит Всевышний. — Разве не наполняю Я небо и землю? — говорит Всевышний» (Ирмияу, Иеремия 23:24).<\/p><p>И царь Давид сказал:<\/p><p>«Всегда представляю Всевышнего перед собой» (Теилим, Псалмы 16:8).<\/p><p>По комментариям «Марпе ла-нефеш» и «Тов ха-Леванон».<\/p>", "82": "<h4>(82) «Насколько больше я должна служить Всевышнему, чем слуга своему господину?»<\/h4><p>В конце предыдущей главы разум подробно описал душе поведение слуги, которое считается правильным в глазах его господина.<\/p><p>Он добавил, что на основе этого примера душа может понять, насколько больше она обязана служить Творцу, поскольку благодеяния Всевышнего несравнимо превосходят благодеяния господина своему слуге.<\/p><p>Теперь душа просит разум объяснить ей общий принцип, позволяющий определить, насколько её служение Всевышнему должно превосходить служение слуги своему господину.<\/p><p>По пояснению составителя.<\/p>", "83": "<h4>(83) «Я — твой щит; награда твоя весьма велика»<\/h4><p>Слова «Я — твой щит» относятся к защите и благополучию в этом мире.<\/p><p>А слова «награда твоя весьма велика» относятся к награде в будущем мире.<\/p><p>По комментариям «Марпе ла-нефеш» и «Пат лехем».<\/p>", "84": "<h4>(84) «Словно великолепие пастбищных ягнят»<\/h4><p>Подобно тому как овец откармливают, чтобы затем быстрее отправить на убой, так и материальные блага, которые нечестивцы получают в этом мире, могут служить подготовкой к их наказанию в Гееноме.<\/p><p>По комментариям Раши и «Мецудат Давид».<\/p>", "85": "<h4>(85) «Его душа будет отсечена и погибнет»<\/h4><p>Так писал и Рамбам в «Законах о раскаянии» (8:5):<\/p><p>«Наказание, страшнее которого нет, заключается в том, что душа будет отсечена и не удостоится той жизни», то есть жизни в будущем мире.<\/p><p>Как сказано:<\/p><p>«Истреблена будет та душа, грех её на ней».<\/p><p>По комментарию «Пат лехем».<\/p>", "86": "<h4>(86) «И не будет добра нечестивому, и не продлит он дней своих»<\/h4><p>Слова «не будет добра нечестивому» означают, что он не удостоится того блага, которое приготовлено праведникам в будущем мире.<\/p><p>А слова «не продлит он дней своих» относятся к его жизни в этом мире.<\/p><p>По комментарию «Пат лехем».<\/p>", "87": "<h4>(87) «С раннего утра вершите справедливый суд»<\/h4><p>Поскольку Всевышний выделил дом Давида особым благодеянием царской власти, Он возложил на его представителей обязанность заботиться о справедливости, честности и защите угнетённых.<\/p><p>По комментарию «Тов ха-Леванон».<\/p>", "88": "<h4>(88) «Как известно из истории Кораха и его общины»<\/h4><p>Корах и его сторонники были наказаны в этом мире тем, что земля поглотила их вместе со всем их имуществом.<\/p><p>А о наказании в будущем мире мудрецы рассказывают, что они подвергаются суду Геенома из поколения в поколение.<\/p><p>Как сказано в Талмуде (Бава Батра 74а; Санhedрин 110а):<\/p><p>Один путник сказал Рабе бар бар Хане, что каждые тридцать дней Гееном возвращает поглощённых вместе с Корахом и переворачивает их, словно мясо в кипящем котле.<\/p><p>По комментарию «Тов ха-Леванон».<\/p>", "89": "<h4>(89) «Если бы я не верил, что увижу благо Всевышнего в земле жизни...»<\/h4><p>В предыдущем стихе Давид просил Всевышнего:<\/p><p>«Не предавай меня воле врагов моих».<\/p><p>То есть он просил, чтобы его враги не смогли добиться желаемого — лишить его возможности спокойно служить Всевышнему, вынуждая постоянно заниматься войнами.<\/p><p>Далее сказано:<\/p><p>«Ибо восстали против меня лжесвидетели и дышащий насилием».<\/p><p>Они распространяли о Давиде ложные и злые обвинения, утверждая, будто он нечестивец и кровопроливец, не имеющий доли и наследия во Всевышнем.<\/p><p>Эти обвинения едва не привели его к отчаянию и отказу от служения Творцу.<\/p><p>Но Давид не прислушался к их словам и сохранил веру в то, что у него ещё есть надежда увидеть благо Всевышнего в земле жизни — в будущем мире.<\/p><p>По комментариям Раши и Радака.<\/p>", "90": "<h4>(90) «Через близких ко Мне освящусь»<\/h4><p>Когда Всевышний вершит суд и наказывает даже избранных людей, которые близки к Нему и служат Ему, Его святость становится очевидной для всех.<\/p><p>«И перед всем народом прославлюсь» — то есть Всевышний будет почитаем всем народом.<\/p><p>Когда люди увидят, что даже праведники подвергаются строгому суду, они испытают трепет перед Всевышним.<\/p><p>Они поймут: если Творец строго судит праведников, то тем более Он будет судить нечестивцев.<\/p><p>Так объясняли наши мудрецы (Бава Кама 50а) стих:<\/p><p>«И вокруг Него буря весьма сильная» (Теилим, Псалмы 50:3).<\/p><p>Это учит нас, что Святой, благословен Он, чрезвычайно строго относится к тем, кто близок к Нему, то есть к праведникам, преданным Ему, и взыскивает с них даже за проступки величиной с волосок.<\/p><p>По комментарию Раши.<\/p>", "91": "<h4>(91) «Ибо давно приготовлен Тофет»<\/h4><p>Гееном приготовлен заранее и горит с огромной силой, словно огонь в нём был разожжён только вчера.<\/p><p>«Также для царя он приготовлен; глубоким и широким сделал Он его».<\/p><p>Это означает, что Всевышний особенно углубил и расширил Гееном для согрешившего царя.<\/p><p>Поскольку царь удостоился особых благодеяний, превосходящих блага остальных представителей его народа, его грех считается более тяжёлым.<\/p><p>Поэтому и наказание его суровее наказания остальных людей.<\/p><p>«Костёр его — огонь и множество дров».<\/p><p>Костёр Геенома состоит из потоков огня и множества горящих дров.<\/p><p>«Дыхание Всевышнего, словно поток серы, воспламеняет его».<\/p><p>Образно говорится, что дыхание, исходящее из уст Всевышнего, подобно потоку горящей серы, который поддерживает пламя, чтобы оно не угасало.<\/p><p>По комментариям Радака и «Мецудат Давид».<\/p>", "92": "<h4>(92) «А второй получает награду»<\/h4><p>Хотя первый человек отделил значительно больше зерна, чем второй, награду получает именно второй.<\/p><p>Это объясняется тем, что второй исполнил свою обязанность в соответствии с величиной полученного блага.<\/p><p>Первый же не исполнил свою обязанность в полной мере, соответствующей тому благу, которого удостоился.<\/p><p>Поэтому он получает наказание.<\/p><p>Отсюда следует, что если человек не служит Всевышнему в соответствии с полученными благодеяниями, то, даже если его служение превосходит служение других людей, он всё равно считается недостаточно исполняющим свой долг.<\/p><p>По комментарию, обозначенному в источнике как «ע״ט».<\/p>", "93": "<h4>(93) «Я стал мал от всех милостей»<\/h4><p>Смысл этих слов следующий:<\/p><p>«Я стал меньше, то есть опустился со своей прежней духовной ступени, из-за всех милостей, которые Ты оказал мне.<\/p><p>Прежде, до получения этих благодеяний, моё служение соответствовало тем благам, которые Ты мне даровал.<\/p><p>Теперь же я опасаюсь, что моё служение уже не соответствует величине Твоих благодеяний.<\/p><p>И я боюсь, что за это Ты можешь наказать меня».<\/p><p>По пояснению составителя.<\/p>", "94": "<h4>(94) «Мудрецы прежних поколений»<\/h4><p>Здесь имеются в виду авторы переводов Торы — Онкелос и Йонатан бен Узиэль.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "95": "<h4>(95) «При их жизни»<\/h4><p>Это означает, что Всевышний воздаёт им при жизни в этом мире, чтобы они лишились блага будущего мира.<\/p>", "96": "<h4>(96) «Я уже ожидаю нового блага, которое получу благодаря этому»<\/h4><p>Ранее разум подробно объяснил, что человек обязан размышлять о благодеяниях, которыми пользуется, и служить Творцу в соответствии с ними.<\/p><p>Он также объяснил, что если человек исполняет эту обязанность, Творец продолжает одарять его благами и даже увеличивает их.<\/p><p>Поэтому душа опасается, что начнёт служить Творцу с личной заинтересованностью, рассчитывая получить благодаря этому новые и ещё большие благодеяния.<\/p><p>Но пока человек служит с таким намерением, он фактически служит самому себе, а не Творцу.<\/p><p>Возникает вопрос: как же тогда человек сможет приблизиться к Всевышнему, заслужить Его благоволение и воздать Ему за полученные блага?<\/p><p>По пояснению составителя.<\/p>", "97": "<h4>(97) «Самому необходимому служению Всевышнему»<\/h4><p>Душа словно говорит разуму:<\/p><p>«Если ты возложишь на меня слишком много обязанностей, возможно, я не смогу их исполнить.<\/p><p>Но если ты научишь меня только тому служению, которое действительно необходимо, я уверена, что оно не окажется для меня чрезмерно тяжёлым.<\/p><p>Ведь если Творец обязывает меня исполнять это служение, значит, оно наверняка не превосходит моих возможностей».<\/p><p>По комментарию «Пат лехем».<\/p>", "98": "<h4>(98) «Не превращать благо в средство нарушения воли Творца»<\/h4><p>Примером может служить богатство Кораха.<\/p><p>Его огромное состояние стало причиной гордыни, которая привела его к выступлению против Моше Рабейну.<\/p><p>Подобное описывается в Торе:<\/p><p>«И растолстел Йешурун, и стал брыкаться... и оставил Бога, создавшего его» (Дварим, Второзаконие 32:15).<\/p><p>То есть материальное благополучие может привести человека к гордости, неблагодарности и отступлению от служения Всевышнему.<\/p><p>По комментариям «Марпе ла-нефеш» и «Пат лехем».<\/p>", "99": "<h4>(99) «Чтобы скрытое зло стало очевидным для всех»<\/h4><p>Когда Всевышний дарует человеку многочисленные блага и посредством этого испытания обнаруживается зло, скрытое в его сердце, окружающие люди могут увидеть его истинное состояние.<\/p><p>Поэтому, когда Всевышний впоследствии наказывает его за дурные качества и поступки, все признают справедливость Божественного суда.<\/p><p>Но если бы Всевышний наказал такого человека раньше, когда зло ещё оставалось скрытым в его сердце и окружающие считали его праведником, это могло бы привести к осквернению Имени Всевышнего.<\/p><p>Людям могло бы показаться, будто Творец, не дай Бог, наказывает невиновного праведника.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "100": "<h4>(100) «Силы воли, способности, повеления и принуждения»<\/h4><p>Каждое действие в мире осуществляется посредством этих четырёх свойств Благословенного Творца.<\/p><p>Например, рост плода.<\/p><p>После того как по воле Благословенного Творца должно появиться плодовое растение, Он осуществляет Свою волю посредством силы «способности», позволяющей Ему делать всё, что Он желает.<\/p><p>Затем силой «повеления» Он приказывает земле, дереву и всем остальным необходимым причинам произвести плод согласно Его воле.<\/p><p>А силой «принуждения» Он заставляет их исполнить Своё повеление.<\/p><p>По комментарию «Пат лехем».<\/p>", "101": "<h4>(101) «Кто это сказал — и сбылось?»<\/h4><p>Кто тот глупец, который станет утверждать, что нечто происходит и осуществляется в мире без повеления Всевышнего?<\/p><p>И кто тот глупец, который скажет, будто добро и зло не исходят от Всевышнего, а находятся исключительно во власти человеческого выбора?<\/p><p>Следовательно, именно Всевышний постановляет возникновение добра и зла.<\/p><p>По комментариям «Пат лехем» и «Тов ха-Леванон».<\/p>", "102": "<h4>(102) «Напрасно вам рано вставать»<\/h4><p>Это обращение к ремесленникам, которые рано встают, поздно ложатся и усердно трудятся.<\/p><p>«Есть хлеб скорбей» — означает зарабатывать на жизнь тяжёлым трудом и заботами.<\/p><p>Но ведь Всевышний даёт всё необходимое и Своему возлюбленному, который лишает себя сна и занимается изучением Торы.<\/p><p>Следовательно, пропитание человека зависит не от его усилий, а от постановления Всевышнего.<\/p><p>По комментарию Раши.<\/p>", "103": "<h4>(103) «Если Он дарует покой»<\/h4><p>Когда Всевышний постановляет, чтобы кто-либо пребывал в покое и неподвижности, кто может заставить его двигаться?<\/p><p>По комментариям Ибн Эзры и «Мецудат Давид».<\/p>", "104": "<h4>(104) «Скроешь лицо Твоё»<\/h4><p>Когда Ты прекращаешь приводить их в движение —<\/p><p>«Они приходят в смятение» — их движение прекращается, подобно человеку, который внезапно испугался и перестал двигаться.<\/p><p>Отсюда следует, что всякое движение сотворённых существ происходит силой Всевышнего.<\/p><p>По комментарию «Пат лехем».<\/p>", "105": "<h4>(105) «От ваших рук произошло это»<\/h4><p>Имеется в виду: это наказание произошло вследствие ваших собственных поступков.<\/p><p>По комментарию «Пат лехем».<\/p>", "106": "<h4>(106) «Ибо за дело человека Он воздаст ему»<\/h4><p>Всевышний воздаёт человеку добром или злом в соответствии с его поступками.<\/p><p>По комментарию «Мецудат Давид».<\/p>", "107": "<h4>(107) «Глупость человека искажает его путь»<\/h4><p>Глупость, которую совершает человек, искривляет его жизненный путь, поскольку из-за собственного неразумия он терпит неудачи.<\/p><p>По комментарию «Мецудат Давид».<\/p>", "108": "<h4>(108) «Придерживаться обоих мнений одновременно»<\/h4><p>Таково мнение наших мудрецов, которые сказали (Брахот 33б):<\/p><p>«Всё в руках Небес, кроме страха перед Небесами».<\/p><p>Раши объясняет:<\/p><p>Всё, что происходит с человеком, находится в руках Святого, благословен Он.<\/p><p>Например, будет ли человек высоким или низким, бедным или богатым, мудрым или глупым, белым или чёрным — всё это в руках Небес.<\/p><p>Но станет ли человек праведником или нечестивцем — это не определяется Небесами.<\/p><p>Этот выбор Всевышний передал самому человеку, поставив перед ним два пути, чтобы он сам избрал страх перед Небесами.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "109": "<h4>(109) «Через более тонкую завесу»<\/h4><p>То же относится и к нашему вопросу.<\/p><p>Если бы эта глубокая тайна была открыта человеку, он мог бы впасть в заблуждение и ложные убеждения, поскольку его разум слишком слаб, чтобы постичь её во всей полноте.<\/p><p>Поэтому Всевышний предпочёл скрыть этот вопрос от человека ради его же блага, чтобы человек служил Ему и не приходил к ошибкам и ложным взглядам.<\/p><p>По комментарию «Тов ха-Леванон».<\/p>", "110": "<h4>(110) «Рычажные весы»<\/h4><p>Устройство этих весов таково.<\/p><p>Точка опоры весов расположена не посередине коромысла, поэтому одно его плечо длиннее другого.<\/p><p>На длинном плече подвешена гиря.<\/p><p>Чем дальше гирю отодвигают от точки опоры, тем более тяжёлый предмет можно уравновесить ею, хотя взвешиваемый предмет значительно тяжелее самой гири.<\/p><p>В этом и заключается удивительное свойство таких весов.<\/p><p>Основной принцип этого способа взвешивания:<\/p><p>«Каково отношение расстояний, таково и отношение весов».<\/p><p>То есть для достижения равновесия отношение расстояний гири и взвешиваемого предмета до точки опоры должно соответствовать обратному отношению их тяжестей.<\/p><p>Например, если на одной стороне весов висит гиря весом один килограмм на расстоянии десяти сантиметров от точки опоры, то на другой стороне можно подвесить предмет весом десять килограммов на расстоянии одного сантиметра от точки опоры.<\/p><p>Тогда весы окажутся в равновесии.<\/p><p>По комментариям «Пат лехем» и «Тов ха-Леванон».<\/p>", "111": "<h4>(111) «Значительно слабее силы стремительного потока»<\/h4><p>Ведь если бросить само колесо в поток воды, оно не погрузится на дно, подобно маленькому камню, а будет увлечено течением.<\/p><p>Следовательно, сила колеса слабее силы водного потока.<\/p><p>По комментарию «Тов ха-Леванон».<\/p>", "112": "<h4>(112) «Разве не успокоил я и не утихомирил душу мою»<\/h4><p>Ты, Всевышний, знаешь истину: я уподобил себя младенцу, находящемуся у своей матери.<\/p><p>Младенец полностью доверяет матери, хотя совершенно не понимает того, что она с ним делает.<\/p><p>Так и я доверяю Тебе, Всевышний.<\/p><p>«Словно младенец — душа моя во мне» — моя душа по отношению к Тебе подобна младенцу по отношению к его матери.<\/p><p>По комментариям «Пат лехем» и «Мецудат Давид».<\/p>", "113": "<h4>(113) «Досталось другим людям»<\/h4><p>Этот глупый царь — замечательная притча о неразумном человеке в этом мире.<\/p><p>Дни его проходят, словно исчезающая тень, но он не замечает, что всё его пребывание в этом мире временно и что он должен сделать всё возможное, чтобы использовать короткий срок своей жизни для подготовки к вечной жизни.<\/p><p>На деле же он поступает наоборот.<\/p><p>Он не только вкладывает все силы и энергию в суету этого мира, словно собирается жить здесь вечно, но даже Тору и заповеди исполняет ради получения награды и почёта в этом мире.<\/p><p>Когда же приходит конец его жизни и он обнаруживает, что остался ни с чем в обоих мирах и ничего не принёс с собой в будущий мир, он испытывает глубокое сожаление.<\/p><p>Но оно уже бесполезно, поскольку в тот момент раскаяние ничем ему не поможет.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "114": "<h4>(114) «И достиг желаемого в обоих местах»<\/h4><p>Так и разумный человек понимает, что его жизнь ограничена.<\/p><p>Он всеми силами старается использовать своё краткое пребывание в этом мире для подготовки к вечной жизни будущего мира.<\/p><p>Он как можно больше занимается Торой и исполнением заповедей.<\/p><p>Даже необходимые повседневные дела он совершает ради Небес.<\/p><p>Когда его жизнь подходит к концу, он доволен и рад тому, что сумел правильно использовать этот мир и приготовить себе достойную долю в будущем мире.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "115": "<h4>(115) «Вместе с другими сотворёнными Им духовными сущностями»<\/h4><p>До своего нисхождения в этот мир человеческая душа подобна ангелам в высшем мире, которые не обладают свободой выбора, подобной человеческой.<\/p><p>Поэтому к ним не относятся награда и наказание так, как они относятся к человеку.<\/p><p>Всевышний пожелал поднять человеческую душу на ступень выше ступени ангелов, поскольку души праведников становятся настоящей колесницей Божественного присутствия.<\/p><p>Чтобы удостоиться этой высокой ступени, душа должна сначала спуститься в этот мир, пройти испытания и очиститься посредством исполнения Торы и заповедей.<\/p><p>По комментариям «Марпе ла-нефеш» и «Пат лехем».<\/p>", "116": "<h4>(116) «Подобное миру»<\/h4><p>Так же пишет наш учитель во «Вратах размышления о творении», глава 4.<\/p>", "117": "<h4>(117) «Мозг»<\/h4><p>Мозг является вместилищем разума и сознания.<\/p><p>Сердце — вместилищем жизненной души и воли.<\/p><p>Печень — вместилищем растительной души.<\/p><p>Половые органы — вместилищем силы размножения, от которой зависят возникновение человека и продолжение человеческого рода.<\/p><p>Эти четыре духовные силы управляют телом.<\/p><p>По комментариям «Марпе ла-нефеш» и «Тов ха-Леванон».<\/p>", "118": "<h4>(118) «Притягивающая сила»<\/h4><p>Притягивающая сила привлекает пищу в желудок.<\/p><p>Удерживающая сила задерживает пищу в желудке до её переваривания.<\/p><p>Переваривающая сила отделяет от пищи её очищенную, полезную часть и передаёт её органам тела.<\/p><p>Изгоняющая сила выводит отходы из организма.<\/p><p>Наш учитель объясняет это выше, во «Вратах размышления о творении», глава 5.<\/p>", "119": "<h4>(119) «Два писца»<\/h4><p>Всё, что делает человек, оставляет след в высших мирах — как доброе, так и дурное, словно человек действительно записывает свои поступки.<\/p><p>Известно, что каждым поступком и словом человека создаётся защитник или обвинитель.<\/p><p>Как сказали наши мудрецы (Пиркей Авот 4:11):<\/p><p>Рабби Элиэзер бен Яаков говорит:<\/p><p>«Исполняющий одну заповедь приобретает себе одного защитника, а совершающий одно нарушение приобретает себе одного обвинителя».<\/p><p>Также наши мудрецы сказали (Таанит 11а):<\/p><p>Когда человек уходит из этого мира, перед ним подробно перечисляют все его поступки.<\/p><p>Ему говорят:<\/p><p>«Такой-то поступок ты совершил в таком-то месте, в такой-то день».<\/p><p>Он отвечает:<\/p><p>«Да».<\/p><p>Ему говорят:<\/p><p>«Подпиши».<\/p><p>И он подписывает, как сказано:<\/p><p>«Рукой каждого человека Он запечатлевает».<\/p><p>Более того, человек признаёт справедливость вынесенного ему приговора и говорит:<\/p><p>«Вы судили меня справедливо».<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "120": "<h4>(120) «Служители и помощники»<\/h4><p>Служителем называется тот, чья обязанность — служить постоянно.<\/p><p>Помощником называется тот, кто выполняет определённые обязанности лишь время от времени.<\/p><p>Среди душевных качеств, перечисляемых нашим учителем, имеются обе эти категории.<\/p><p>Добрые качества относятся к категории постоянных служителей, поскольку человек должен пользоваться ими постоянно.<\/p><p>Дурные качества относятся к категории временных помощников, поскольку иногда человек также должен пользоваться ими ради Небес, как наш учитель объясняет в следующей главе.<\/p><p>По комментарию «Пат лехем».<\/p>", "121": "<h4>(121) «Подобно яичной скорлупе»<\/h4><p>Хотя скорлупа необходима птенцу, чтобы защищать и сохранять его до завершения формирования, она не является частью самого птенца.<\/p><p>Она также сама по себе не влияет на его развитие, здоровье и ощущения, а служит лишь временным средством защиты.<\/p><p>Подобным образом человеческое тело и весь этот мир относятся к душе.<\/p><p>Они не являются частью души, не необходимы для её существования, не прибавляют ей совершенства и не определяют её ощущения.<\/p><p>Они лишь инструменты и средства, которыми душа временно пользуется во время пребывания в теле, чтобы посредством них подготовить себя к более высокой ступени.<\/p><p>По комментарию «Тов ха-Леванон».<\/p>", "122": "<h4>(122) «В число твоих добрых дел»<\/h4><p>Если человек осознаёт, что цель его прихода в этот мир заключается в служении Всевышнему, он направляет все свои мысли и действия к этой цели.<\/p><p>Тогда даже поступки, которые сами по себе не являются ни заповедями, ни прямыми нарушениями, например еда, питьё, заработок и удовлетворение остальных потребностей тела, считаются добрыми делами.<\/p><p>Это происходит потому, что человек использует их как средства достижения своей цели — служения Всевышнему.<\/p><p>И наоборот, если человек ставит перед собой цель гнаться за удовольствиями и суетой этого мира, следовать прихотям собственного сердца и тем самым нарушать волю Творца, то даже его разрешённые действия считаются нарушениями.<\/p><p>Ведь он использует их как средства достижения своей дурной цели.<\/p><p>По комментариям «Марпе ла-нефеш» и «Тов ха-Леванон».<\/p>", "123": "<h4>(123) «Приклони ухо твоё и слушай»<\/h4><p>Согласно подходу нашего учителя, эти стихи можно объяснить следующим образом.<\/p><p>«Приклони ухо твоё и слушай слова мудрых» — внимательно прислушивайся к словам мудрецов, обучающих тебя Моей Торе, и с любовью принимай на себя бремя Торы и заповедей.<\/p><p>«И сердце своё обрати к моему знанию» — пойми, что Я делаю это ради твоего блага: чтобы испытать тебя, очистить и посредством этого подготовить к восхождению на высочайшую ступень.<\/p><p>«Ибо приятно будет, если сохранишь их внутри себя» — тебе будет хорошо в будущем мире, если ты будешь руководствоваться Торой во всех своих материальных делах в этом мире.<\/p><p>«Разве не написал Я тебе наставления» — смотри, Я предупредил тебя посредством Торы, Пророков и Писаний.<\/p><p>«В советах и знании» — чтобы открыть тебе подлинную истину о том, ради чего ты пришла в этот мир и что обязана в нём делать.<\/p><p>Это необходимо, чтобы ты не пришла в мир истины с пустыми руками и в стыде, пытаясь оправдаться ложными доводами.<\/p><p>Напротив, когда тебе потребуется дать отчёт перед Царём царей, ты сможешь «отвечать словами истины пославшему тебя», то есть дать правильный ответ о том, что исполнила поручение, ради которого была послана в этот мир.<\/p><p>По комментариям Раши и «Марпе ла-нефеш».<\/p>", "124": "<h4>(124) «Когда ты уверена, что удовольствие будет вечным»<\/h4><p>Это означает, что человеку следует радоваться только служению Всевышнему и исполнению Торы и заповедей.<\/p><p>Ведь тогда он уверен, что наслаждение, которое он получит благодаря этому в будущем мире, будет вечным и не смешается с печалью.<\/p><p>Но никакому другому удовольствию человеку не следует радоваться, поскольку оно может сопровождаться страданием и в конечном счёте непременно прекратится.<\/p><p>То же относится и к качеству печали.<\/p><p>Человек должен печалиться только тогда, когда нарушает волю Всевышнего, поскольку страдание, которое он получит вследствие этого, будет вечным и от него невозможно будет избавиться.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "125": "<h4>(125) «Когда ты совершаешь поступки»<\/h4><p>Это означает, что человеку не следует бояться того, что может произойти с ним в будущем, кроме случая, когда он нарушает волю Творца.<\/p><p>Ведь вследствие этого ему предстоит испытать вечное страдание в будущем мире, и его конец не будет благим.<\/p><p>Но всего остального человеку не следует бояться. Он должен полагаться на Всевышнего, Который делает только то, что служит его благу.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>", "126": "<h4>(126) «Пусть праведник ударит меня»<\/h4><p>Для меня лучше, чтобы праведник ударил и обличил меня, поскольку своими ударами и обличениями он оказывает мне милость.<\/p><p>Следовательно, человек должен укрепиться мужеством и терпеливо переносить страдание, причиняемое обличением праведника.<\/p><p>По комментариям Раши и «Менухат ха-левавот».<\/p>", "127": "<h4>(127) «Расскажи дому Израиля о Храме»<\/h4><p>Сообщи им, каким великолепным и просторным будет Третий Храм, который вскоре будет построен, с Божьей помощью, и в котором Всевышний будет пребывать вечно.<\/p><p>«И пусть они устыдятся своих грехов».<\/p><p>Ибо горе тому стыду и горе тому позору!<\/p><p>Мы знаем, насколько великим и великолепным будет последний Храм, и тем не менее из-за наших многочисленных грехов святой город Иерусалим до сих пор находится в униженном положении.<\/p><p>А о каждом поколении, в дни которого Храм не был построен, сказано, что это подобно тому, как если бы Храм был разрушен в его дни.<\/p><p>И нет большего стыда и позора, чем этот.<\/p><p>По комментарию «Марпе ла-нефеш».<\/p>"}</script><script>
const chapters=[{"id": "introduction", "title": "Введение", "html": "<p>Место \"Врат служения Богу\" расположено после \"Врат Единства\" и \"Врат размышления\", потому что результат веры в Единство и результат размышления должны привести к принятию служения Богу. Так как мы объяснили в \"Вратах Единства\" обязанность полностью верить в Единство, а в \"Вратах размышления\" — пути анализа благодеяний Бога, Который творит добро для людей, автор говорит: \"Нам необходимо после этих врат напомнить об обязанности человека, когда ему становятся очевидны эти блага. А именно — принять на себя служение Богу\".<br/>Как разум обязывает получающего благо благодарить и осознавать доброту того, кто сделал ему благо, даже если он сделал это не от себя, а с помощью Бога, и если его доброта не постоянна — то тем более человек обязан признавать добро Бога и Его благодеяния, которые делаются без эгоистичных намерений, от Его щедрости, и они вечны и безграничны.<\/p><p>Далее необходимо объяснить в начале этих врат различные виды благ, которые люди оказывают друг другу, и как они обязаны быть благодарными за них. Это поможет нам понять, насколько больше мы обязаны восхвалять и благодарить Творца за Его многочисленные благодеяния и великое добро, оказанное нам.<\/p><p>Начнем с того, что очевидно: любой, кто сделал нам добро, заслуживает нашей благодарности. И даже если он по какой-либо причине не смог помочь нам в том объеме, в котором намеревался, мы обязаны благодарить его за его добрые намерения.<br/>И наоборот: если нам было оказано благо кем-то, кто не намеревался нам помочь, мы не обязаны выражать благодарность.<\/p><p>Рассмотрим виды благ, которые люди оказывают друг другу, и увидим, что они делятся на пять категорий:<\/p><ol><li>Благо, которое отец оказывает сыну.<\/li><li>Благо господина своему рабу.<\/li><li>Благо богатого бедному, с намерением получить награду.<\/li><li>Блага, которые люди делают друг другу, чтобы обрести славу, уважение или чтобы получить взамен награду в будущем.<\/li><li>Благо сильного слабому из жалости и сострадания к его состоянию.<\/li><\/ol><p>Теперь рассмотрим эти пять видов благодетелей: делают ли они добро исключительно ради пользы другого, или в конечном итоге ради себя?<\/p><p>Первый вид — благо отца сыну. Очевидно, что отец действует ради собственной пользы, потому что сын — это часть отца. Поэтому отец заботится о сыне даже больше, чем о себе. Более того, любовь отца к сыну заложена в его природе, и это проявляется в том, что отец снабжает сына едой, одеждой, защищает его от любого вреда, готов терпеть трудности и идти на жертвы ради благополучия сына.<br/>Тем не менее сын обязан по разуму служить своему отцу, уважать и бояться его, как сказано: \"Почитай отца своего и мать свою\" (Шмот 20:12), и \"Бойтесь каждый матери своей и отца своего\" (Ваикра 19:3).<\/p><p><strong>Второй вид — благо господина рабу.<\/strong> Так как господин приобрел раба и его имущество, он заботится о том, чтобы через раба увеличить свой доход. Таким образом, благо оказывается ради собственной выгоды. Тем не менее раб обязан служить своему господину и благодарить его, как сказано: \"Сын чтит отца, и раб — господина\" (Малахи 1:6).<\/p><p><strong>Третий вид — благо богатого бедному.<\/strong> Это похоже на сделку, в которой богатый человек, вкладывая небольшую и временную помощь, рассчитывает на получение значительной вечной награды в мире грядущем. Тем не менее бедный обязан благодарить богатого, как сказано в книге Иова: \"Благословение погибающего приходило ко мне\" (Иов 29:13).<\/p><p><strong>Четвёртый вид — человек оказывает благо ближнему ради похвалы или славы, или<\/strong> <strong>чтобы получить взамен благо в этом мире. Это похоже на человека, который вкладывает своё имущество у друга, где оно будет более защищено. И хотя он действует ради собственной пользы, тем не менее он заслуживает благодарности и похвалы. Как сказано у царя Соломона:<\/strong> <strong>\"Дар человека даёт ему простор и приводит его перед великих\"<\/strong> <strong>(Мишлей 18:16), и также:<\/strong> <strong>\"Многие добиваются благосклонности щедрого, и все друзья человека дающего\"<\/strong> <strong>(Мишлей 19:6).<\/strong><\/p><p><strong>Пятый вид — тот, кто жалеет бедного и помогает ему, чтобы избавить себя от страданий и душевной боли при виде несчастья другого.<\/strong> Это похоже на человека, который облегчает свои собственные страдания, помогая другим. Как сказал Иов: \"Если я видел погибающего без одежды и не было одеяния для нищего, если он не благословил меня за то, что согрелся шерстью моих овец\" (Иов 31:19-20).<\/p><p>Из сказанного видно, что любое добро, которое человек оказывает ближнему, в конечном итоге имеет под собой намерение принести пользу себе — будь то в этом мире или в мире грядущем. Но это не освобождает получающего благо от обязанности благодарить и хвалить благодетеля, бояться его, любить его и воздавать ему добром.<\/p><p>Если так, то насколько больше человек обязан служить, благодарить и хвалить Творца, который оказывает благо абсолютно бескорыстно, безо всякой личной выгоды, исключительно по Своей милости. Его блага вечны и неисчислимы.<\/p><p><strong>Обязанность быть благодарным лежит на получателе благодеяния, даже если благодетель не превосходит его ни духовно, ни физически.<\/strong> Чем выше достоинство благодетеля, тем больше обязанность благодарности. Если человек представляет себе с одной стороны величие Творца, Его доброту, безграничную щедрость и вечные блага, а с другой — свою собственную ничтожность и слабость, он осознает, насколько он обязан благодарить своего Создателя и служить Ему всем своим существом.<\/p><p><strong>Любой благодетель превосходит получателя блага только внешними преимуществами, такими как богатство или знания, но их сущность остаётся одинаковой.<\/strong> Люди равны в телесных, умственных и природных характеристиках. Тем не менее, получающий благо обязан благодарить и восхвалять своего благодетеля.<\/p><p>Если мы примем во внимание, что Творец превосходит человека во всём, а человек полностью зависит от Его милости, разум подсказывает, что человек обязан благодарить Творца безгранично и служить Ему с полной самоотдачей.<\/p><p>Поскольку любой, кто приносит благо другим людям из всех упомянутых нами категорий, не превосходит того, кому он сделал добро, иначе как внешним превосходством, которое у него есть, но нет у другого, например, большими богатствами или знаниями, то в своей сущности они почти равны друг другу: по своим телам, облику, составу органов и внешнему виду они схожи, так же как и по разуму и свойствам. Во многом их участь одинакова.<br/>И несмотря на это, тот, кто получил добро, обязан благодарить, восхвалять, бояться и любить того, кто сделал ему добро.<br/>Если же мы примем во внимание, что сущность того, кто делает добро, более возвышенна, что он совершенен в своих качествах, а тот, кто получает добро, находится в крайней нужде и в худшем состоянии по своей природе, то разум обязывает получившего благо быть ещё более благодарным и стремиться к добру по отношению к благодетелю без меры. <\/p><p><strong>Когда мы размышляем о взаимоотношениях между Творцом и человеком, то видим, что Творец возвышен над всем существующим в мире, и Его величие превосходит любое постижение разума и чувств. Об этом говорилось в первой части книги. С другой стороны, если сравнить человека с другими живыми существами, то мы обнаружим, что человек слабее и более нуждающийся, чем все они.<\/strong><\/p><p>Это видно с трёх точек зрения:<\/p><ol><li><strong>Развитие и детство.<\/strong> У большинства животных детёныши способны самостоятельно заботиться о себе, переносить трудности и не доставлять своих родителям столько хлопот, сколько доставляет человеческий ребёнок.<\/li><li><strong>Неопрятность и грязь.<\/strong> Внутренние и внешние выделения человеческого тела в естественном состоянии являются более грязными и зловонными, чем у животных. Даже после смерти человеческое тело разлагается сильнее, чем трупы животных.<\/li><li><strong>Психическая слабость.<\/strong> Человек быстрее теряет разум в случае повреждения мозга или потери слуха. Его состояние в этих случаях хуже, чем у животных.<\/li><\/ol><p>Однако, несмотря на эти недостатки, Бог дал человеку разум, с помощью которого он может достичь совершенства.<\/p><p>Большинство животных интуитивно умеют добывать пищу и улучшать своё положение, в чём многие люди уступают им. Тем не менее, если человек сравнит могущество Творца и свою собственную слабость, он поймёт, насколько он зависим от Него.<\/p><p>Человек нуждается в бесчисленных вещах для своего существования, которые он сам не способен добыть, будь то пища, одежда или другие потребности. Только благодаря милости Творца он получает возможность удовлетворить эти потребности.<\/p><p>Когда человек осознаёт, что его существование зависит только от милосердия Творца, он должен прилепиться к служению Богу, для которого он был создан.<\/p><p><strong>Размышляя над этим, человек понимает: с одной стороны, величие Творца и Его доброта к людям, с другой — свою слабость и зависимость.<\/strong> Это осознание приводит к пониманию своей обязанности постоянно хвалить и благодарить Творца, служить Ему, бояться Его и надеяться на награду в грядущем мире.<\/p><p>Если человек понимает, что другие люди обязаны благодарить своих благодетелей, то тем более он должен благодарить и восхвалять Творца за все Его милости.<\/p><p><strong>Обязанность человека перед Творцом очевидна для любого разумного существа. Эта обязанность принимать на себя служение Богу вытекает из логики и здравого смысла, а также из ясных доказательств, известных чудес и знамений, которые были явлены нашим предкам во время Исхода из Египта, у горы Синай и в пустыне. Все эти события свидетельствуют о Единстве, могуществе и доброте Творца.<\/strong><\/p><p>О тех, кто игнорирует эти доказательства, Моисей, мир ему, сказал: \"Так ли воздаёте Господу, народ глупый и неразумный? Разве не Он — Отец твой, который создал тебя, утвердил теб
