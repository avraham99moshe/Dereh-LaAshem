я и дал тебе опору?\" (Дварим 32:6).<\/p><p>Содержание десяти глав раздела \"Служение Богу\":<br/>Итак, становится ясно, что на человеке лежит обязанность принимать на себя служение Богу за Его постоянные благодеяния. В этом разделе будут рассмотрены десять тем:<\/p><ol><li>Необходимость пробуждения к служению Богу и способы, с помощью которых можно пробудиться.<\/li><li>Важность каждого из путей пробуждения.<\/li><li>Суть служения Богу, его части и достоинства.<\/li><li>Что такое пробуждение через Тору, её составляющие и уровни понимания Торы разными людьми.<\/li><li>Пробуждение разума через диалог между разумом и душой.<\/li><li>Разделение обязанностей служения Богу в зависимости от видов получаемых благ.<\/li><li>Минимальная обязанность человека, получившего благо, перед благодетелем.<\/li><li>Разногласия между мудрецами: действует ли человек под принуждением или по свободному выбору, и какое из мнений ближе к истине.<\/li><li>Разъяснение, для чего человек был создан в этом мире.<\/li><li>Как и в каких обстоятельствах следует использовать каждое из своих качеств.<\/li><\/ol>", "subs": []}, {"id": "chapter-1", "title": "Глава 1", "html": "<p><strong>Почему человек должен пробуждаться к служению Всевышнему и какими путями он должен это делать?<\/strong><\/p><p>Автор говорит:<\/p><p>Необходимость пробуждения человека к служению Всевышнему в различных его формах заключается в следующем.<\/p><p>Человек обязан служить Благословенному Творцу в силу разума и осознания, как уже было объяснено во введении к этим вратам.<\/p><p>Однако между моментом появления человека на свет, когда он начинает пользоваться благами Творца, и временем, когда его разум созревает и он осознаёт свою обязанность служить Всевышнему в благодарность за эти блага, проходит длительный период.<\/p><p>Поэтому в течение этого времени необходимо побуждать человека к совершению добрых дел и укоренять веру в его сердце. Благодаря этому он сможет достичь совершенства в служении Всевышнему и не останется без религиозного руководства до тех пор, пока его разум не созреет.<\/p><p>Существуют два пути такого пробуждения.<\/p><p>Первый путь исходит из разума, заложен в человеческом сознании с момента его сотворения и рождения. Это естественное чувство благодарности.<\/p><p>Второй путь человек приобретает посредством изучения Торы, переданной людям через Моше Рабейну, мир ему, чтобы указать им путь служения, которым они обязаны следовать перед Благословенным Творцом.<\/p>", "subs": []}, {"id": "chapter-2", "title": "Глава 2", "html": "<p><strong>Почему человеку необходимо пробуждаться к служению Всевышнему посредством Торы, помимо побуждения со стороны собственного разума?<\/strong><\/p><p>Человек обязан пробуждаться к служению Всевышнему посредством Торы, поскольку силы его души, влекущие его к материальным удовольствиям и земным занятиям, превосходят силы разума, побуждающие его к служению Всевышнему и духовному возвышению.<\/p><p>Это происходит по трём причинам.<\/p><p>1. Душа, связанная с телесными желаниями, действует в человеке с самого начала его существования. Она предшествует развитию разума, и человек с детства привыкает подчиняться ей.<\/p><p>2. Эта сторона человеческой души связана с природными элементами материального мира. Пища и телесные удовольствия укрепляют её. Разум же, то есть святая душа человека, происходящая из высших духовных миров, является чуждым этому миру. В материальном мире ничто естественным образом не укрепляет её, а телесная природа противодействует ей.<\/p><p>3. Силы телесных желаний действуют в человеке непрерывно, днём и ночью, и от постоянного использования становятся сильнее. Разумом же человек пользуется для духовных целей лишь в определённые моменты.<\/p><p>Поэтому человеку необходимо пробуждение посредством Торы, чтобы с её помощью укрепить власть разума над телесными желаниями и достичь служения Всевышнему, основанного на разумном осознании. Именно ради этой цели Всевышний создал человека.<\/p><h3 class=\"subheading\" id=\"sub-3-1\"><strong>Первая причина: борьба между разумом и телесными желаниями<\/strong><\/h3><p>Необходимость пробуждения посредством Торы, в дополнение к пробуждению посредством разума, обусловлена тем, что сила разума ослабляется тремя факторами.<\/p><p>Первый фактор заключается в том, что человек создан из души и тела, которые отличаются друг от друга, противодействуют друг другу по своей природе и обладают противоположными свойствами.<\/p><p>Благословенный Творец вложил в человеческую душу определённые качества и силы, благодаря которым человек стремится к вещам, укрепляющим его тело и побуждающим заниматься обустройством материального мира.<\/p><p>Это необходимо для продолжения существования человеческого рода, несмотря на то что отдельные люди приходят в этот мир и покидают его.<\/p><p>К таким качествам относятся стремления к телесным удовольствиям, присущие всем живым существам.<\/p><p>Но Благословенный Творец вложил в человеческую душу также другие качества. Когда человек использует их, он начинает испытывать отвращение к привязанности к земной жизни и стремится освободиться от неё.<\/p><p>Этими качествами являются разум и совершенная мудрость.<\/p><p>Поскольку телесные удовольствия сопровождают человека с раннего детства, прочно связаны с ним с самого начала его существования и он привыкает стремиться к ним с малых лет, сила желания начинает преобладать над остальными его качествами.<\/p><p>В результате она способна одержать верх даже над разумом, ради которого человек был создан, ослепить его и лишить способности правильно воспринимать действительность.<\/p><p>Поэтому человеку необходима помощь извне, чтобы бороться с порочным качеством — стремлением к животным удовольствиям — и пробуждать и укреплять благородные качества своего разума.<\/p><p>Этой помощью является Тора, посредством которой Всевышний через Своих посланников и пророков, мир им, указал Своим творениям путь служения Ему.<\/p><h3 class=\"subheading\" id=\"sub-3-2\"><strong>Вторая причина: разум принадлежит духовному миру<\/strong><\/h3><p>Второй фактор заключается в том, что разум имеет духовную природу и происходит из высшего духовного мира. Поэтому он является чуждым миру материальных тел.<\/p><p>Напротив, человеческие желания связаны с природными силами и сочетанием четырёх элементов(<button aria-expanded=\"false\" aria-label=\"Примечание 6\" class=\"note-ref\" data-note=\"6\" type=\"button\">6<\/button>). Их основа и корень находятся в этом мире.<\/p><p>Пища, которую употребляет человек, придаёт этим желаниям силу, а телесные удовольствия укрепляют их.<\/p><p>Разум же, будучи чуждым материальному миру, не имеет здесь естественного источника укрепления и помощника.<\/p><p>Более того, материальные создания противодействуют ему. Поэтому он слаб и нуждается во вспомогательных средствах, позволяющих противостоять усиливающимся желаниям и побеждать их.<\/p><p><strong>Тора является лекарством от этой болезни — одной из болезней души и пороков характера.<\/strong><\/p><p>Именно поэтому Тора запрещает многие виды пищи, одежды, приобретения имущества и действий, которые усиливают власть телесных желаний.<\/p><p>Вместе с тем Тора предписывает действия, противоположные этим желаниям:<\/p><ul><li>Молитву.<\/li><li>Пост.<\/li><li>Цдаку — помощь нуждающимся.<\/li><li>Гмилут хасадим<button aria-expanded=\"false\" aria-label=\"Открыть примечание 7\" class=\"note-ref\" data-note=\"7\" type=\"button\">(7)<\/button> — совершение добрых дел и оказание помощи другим.<\/li><\/ul><p>Всё это предназначено для оживления и укрепления сил разума, чтобы они освещали путь человека(<button aria-expanded=\"false\" aria-label=\"Примечание 8\" class=\"note-ref\" data-note=\"8\" type=\"button\">8<\/button>) как в этом мире, так и в будущем.<\/p><p>Как сказано:<\/p><p>«Слово Твоё — светильник для ноги моей и свет для стези моей» (Теилим, Псалмы 119:105).<\/p><p>«Ибо заповедь — светильник, а Тора — свет» (Мишлей, Притчи 6:23).<\/p><p>«И увидел я, что мудрость имеет преимущество перед глупостью, как свет имеет преимущество перед тьмой» (Коэлет, Экклезиаст 2:13).<\/p><h3 class=\"subheading\" id=\"sub-3-3\"><strong>Третья причина: постоянное использование желаний укрепляет их<\/strong><\/h3><p>Третий фактор заключается в том, что человек постоянно пользуется своими желаниями для удовлетворения потребностей тела. Эти желания не прекращают действовать ни днём, ни ночью.<\/p><p>Разум же человек использует для действий, противоположных телесным желаниям, например для изучения Торы, молитвы и подобных занятий, которыми он не занимается постоянно.<\/p><p>Известно, что органы тела при постоянном использовании развиваются, а их способности укрепляются.<\/p><p>Когда же ими пользуются редко, их состояние ухудшается и способность действовать ослабевает.<\/p><p>Таким образом, понятно, почему телесные желания сильнее: человек постоянно пользуется ими.<\/p><p>Разум же слабее, поскольку человек использует его гораздо реже и лишь изредка задействует присущую ему способность к глубокому размышлению.<\/p><p>Поэтому возникла необходимость дать разуму Тору.<\/p><p>Для истинного постижения Торы человек не должен пользоваться ни органами тела, ни своими животными желаниями, а лишь чистым разумом, над которым не господствуют страсти.<\/p><p>Благодаря размышлению над Торой разум укрепляется, очищается и озаряется светом.<\/p><p>Он отгоняет от человека невежество, которое овладевает им, мешает видеть вещи такими, какие они есть на самом деле, и поступать должным образом.<\/p><p>Как сказано:<\/p><p>«Тора Всевышнего совершенна, возвращает душу(<button aria-expanded=\"false\" aria-label=\"Примечание 9\" class=\"note-ref\" data-note=\"9\" type=\"button\">9<\/button>); свидетельство Всевышнего верно, умудряет простодушного» (Теилим, Псалмы 19:8).<\/p><p>«Повеления Всевышнего справедливы, радуют сердце; заповедь Всевышнего чиста, просветляет глаза» (Теилим, Псалмы 19:9).<\/p><h3 class=\"subheading\" id=\"sub-3-4\"><strong>Заключение второй главы<\/strong><\/h3><p>Из всего сказанного мы узнаём, что человек обязан пробуждаться к служению Всевышнему посредством Торы.<\/p><p>Тора включает как заповеди, необходимость которых понятна человеческому разуму, так и заповеди, смысл которых мы не понимаем.<\/p><p>Благодаря исполнению этих заповедей человек может подняться к служению Всевышнему, основанному на разумном осознании своей обязанности(<button aria-expanded=\"false\" aria-label=\"Примечание 10\" class=\"note-ref\" data-note=\"10\" type=\"button\">10<\/button>).<\/p><p>Именно такое служение является главной целью, ради которой Всевышний создал человечество в этом мире.<\/p><ul><li>«Возвращает душу» — укрепляет силу разума.<\/li><li>«Умудряет простодушного» — очищает и совершенствует разум.<\/li><li>«Радуют сердце» — озаряют разум и наполняют сердце радостью.<\/li><li>«Просветляет глаза» — устраняют тьму невежества, мешающую человеку видеть свет мудрости.<\/li><\/ul>", "subs": [{"id": "sub-3-1", "title": "Первая причина: борьба между разумом и телесными желаниями"}, {"id": "sub-3-2", "title": "Вторая причина: разум принадлежит духовному миру"}, {"id": "sub-3-3", "title": "Третья причина: постоянное использование желаний укрепляет их"}, {"id": "sub-3-4", "title": "Заключение второй главы"}]}, {"id": "chapter-3", "title": "Глава 3", "html": "<h3 class=\"subheading\" id=\"sub-4-1\"><strong>Что такое служение Всевышнему?<\/strong><\/h3><p>Служение Всевышнему — это смирение перед Ним, вызванное осознанием великих благодеяний, которые Он оказывает человеку. Оно выражается в благодарности Всевышнему и стремлении всеми силами отплатить Ему добром за Его многочисленные благодеяния.<\/p><p>Вначале, пока желания человека преобладают над его разумом, это смирение должно исходить из страха перед наказанием и надежды на награду. Однако благодаря такому служению человек постепенно поднимается на более высокую ступень — к истинному смирению, основанному на осознании и понимании.<\/p><p>Такое служение превосходит служение, основанное на страхе наказания и ожидании награды, по семи причинам.<\/p><h3 class=\"subheading\" id=\"sub-4-2\"><strong>Два вида служения Всевышнему<\/strong><\/h3><p>Объяснение сущности служения Всевышнему, его разделения на различные виды и достоинств каждого из них заключается в следующем.<\/p><p>Суть служения состоит в том, чтобы человек, получивший благо, проявлял смирение перед своим благодетелем и стремился по мере своих возможностей отплатить ему добром за полученное благо.<\/p><p>Это смирение делится на два вида.<\/p><p><strong>Первый вид<\/strong> — смирение, возникающее под воздействием необходимости, из страха перед наказанием и надежды на награду.<\/p><p><strong>Второй вид<\/strong> — добровольное смирение, возникающее из осознания долга и разумного понимания того, что следует признавать величие и превосходство Того, перед Кем человек смиряется, даже если он не испытывает перед Ним страха и не надеется получить от Него награду.<\/p><p>Первый вид смирения перед Всевышним является результатом побуждения со стороны Торы, о котором я говорил в предыдущих главах. Ведь Тора обязывает нас исполнять её заповеди, указывая на награду и наказание, ожидающие нас в этом мире и в мире грядущем.<\/p><p>Второй же вид смирения является результатом пробуждения естественного чувства благодарности, укоренённого в человеческом разуме. Это чувство заложено в природе человека с самого начала его сотворения, с того момента, когда его душа соединилась с телом.<\/p><p>Оба вида смирения достойны похвалы и ведут человека по пути спасения в грядущем мире.<\/p><p>Однако первый вид смирения, возникающий под воздействием Торы, приводит человека ко второму виду смирения (<button aria-expanded=\"false\" aria-label=\"Примечание 11\" class=\"note-ref\" data-note=\"11\" type=\"button\">11<\/button>). Он является ступенью, с которой человек поднимается к более высокому уровню.<\/p><p>Второй вид смирения, возникающий благодаря пробуждению разума и осознанию доводов, обязывающих человека служить Всевышнему, более угоден и желанен перед Ним по семи причинам.<\/p><h3 class=\"subheading\" id=\"sub-4-3\"><strong>Семь преимуществ служения Всевышнему, основанного на разумном осознании<\/strong><\/h3><p>Служение Всевышнему, основанное на разумном понимании, превосходит служение, возникающее из надежды на награду и страха перед наказанием, по следующим семи причинам.<\/p><ol><li>Оно может совершаться исключительно ради Небес, а не ради приобретения почёта среди людей.<\/li><li>Оно требует от человека приложения всех его сил и большого воодушевления, поскольку иначе он не сможет достичь его цели.<\/li><li>Благодаря ему внутреннее служение сердца, то есть исполнение обязанностей сердца, значительно превосходит внешнее служение, совершаемое органами тела.<\/li><li>Оно является целью и желаемым результатом служения Всевышнему, возникающего под воздействием Торы.<\/li><li>Его заповеди не имеют определённого числа и границ.<\/li><li>Оно находится на гораздо более высокой и возвышенной ступени, поскольку Всевышний помогает человеку достичь в нём того, что превосходит его собственные возможности.<\/li><li>Благодаря ему человек защищён от греха и может быть уверен, что не потерпит неудачи в своём служении.<\/li><\/ol><h3 class=\"subheading\" id=\"sub-4-4\"><strong>Первая причина<\/strong><\/h3><p>Служение, возникающее под воздействием Торы, человек может совершать как ради Небес, так и из лицемерия и стремления прославиться, чтобы заслужить похвалу и уважение окружающих.<\/p><p>Ведь поскольку основой его служения являются надежда получить награду от Всевышнего и страх перед Его наказанием, он может рассуждать следующим образом:<\/p><p>«Если я в любом случае служу ради получения награды, то какая разница, получу ли я её от Всевышнего или от людей?»<\/p><p>Но служение Всевышнему, возникающее из пробуждения разума, может быть направлено исключительно ради Небес. В нём не могут присутствовать лицемерие, притворство или желание прославиться перед окружающими.<\/p><p>Ведь оно основывается не на ожидании награды и страхе перед наказанием, а на мудрости и осознании обязанностей, возложенных на творение по отношению к своему Творцу.<\/p><h3 class=\"subheading\" id=\"sub-4-5\"><strong>Вторая причина<\/strong><\/h3><p>Служение Всевышнему, возникающее под воздействием Торы, поскольку оно основывается на надежде на награду и страхе перед наказанием, не побуждает человека прилагать к нему все свои силы и способности.<\/p><p>Но служение Всевышнему, возникающее благодаря пробуждению разума, может исходить только из добровольного стремления души и её искреннего желания всеми силами и с великим воодушевлением служить Всевышнему ради Его имени, после того как человек осознал и понял величие и возвышенность Творца.<\/p><p>Ведь душа не станет добровольно служить Всевышнему, пока не убедится, что результат, которого она достигнет благодаря своему служению, — благоволение Всевышнего — превосходит само служение.<\/p><p>А достичь этой цели она сможет лишь тогда, когда полностью посвятит себя служению Всевышнему, приложив все свои силы и способности.<\/p><h3 class=\"subheading\" id=\"sub-4-6\"><strong>Третья причина<\/strong><\/h3><p>Служение, возникающее исключительно под воздействием Торы, в большей степени выражается в совершении добрых дел посредством органов тела, чем во внутреннем служении Всевышнему, скрытом в сердце (<button aria-expanded=\"false\" aria-label=\"Примечание 12\" class=\"note-ref\" data-note=\"12\" type=\"button\">12<\/button>).<\/p><p>Но когда служение возникает благодаря разумному пониманию, внутреннее служение сердца — то есть исполнение обязанностей сердца — во много раз превосходит служение, совершаемое органами тела.<\/p><h3 class=\"subheading\" id=\"sub-4-7\"><strong>Четвёртая причина<\/strong><\/h3><p>Служение, возникающее под воздействием Торы, является своего рода вступлением к служению, основанному на разумном понимании.<\/p><p>Его можно сравнить с зерном, посеянным в землю (<button aria-expanded=\"false\" aria-label=\"Примечание 13\" class=\"note-ref\" data-note=\"13\" type=\"button\">13<\/button>).<\/p><p>Польза, которую приносит служение, основанное на Торе, подобна пользе, которую приносит земле её обработка, вспашка и очищение.<\/p><p>Помощь, которую Всевышний оказывает человеку в его служении, подобна дождю, орошающему землю.<\/p><p>И подобно тому, как целью посева зерна является получение урожая, так и главная цель служения Всевышнему, возникающего под воздействием Торы, заключается в том, чтобы в сердцах людей укоренилось истинное служение Творцу — исключительно ради Его благословенного имени, а не ради получения награды и не из страха перед наказанием.<\/p><p>Как учили наши мудрецы, благословенна их память:<\/p><p>«Не будьте подобны рабам, которые служат господину ради получения награды (<button aria-expanded=\"false\" aria-label=\"Примечание 14\" class=\"note-ref\" data-note=\"14\" type=\"button\">14<\/button>), но будьте подобны рабам, которые служат господину не ради получения награды, и да будет страх Небес на вас».<\/p><p>(Пиркей Авот, 1:3.)<\/p><h3 class=\"subheading\" id=\"sub-4-8\"><strong>Пятая причина<\/strong><\/h3><p>Заповеди Торы имеют определённое число и границы. Их количество составляет 613 заповедей.<\/p><p>Но разумные обязанности, постигаемые человеческим разумом, практически не имеют границ.<\/p><p>Ведь с каждым днём человек всё глубже осознаёт их. И чем больше он познаёт благодеяния Всевышнего, Его могущество и владычество, тем сильнее становится его смирение перед Ним и тем глубже он ощущает собственную малость перед Его величием.<\/p><p>Поскольку обязанности, постигаемые разумом, постоянно возрастают по мере углубления понимания человеком величия и доброты Творца, царь Давид, мир ему, молил Всевышнего пробудить его к исполнению обязанностей сердца и снять с его глаз завесу невежества.<\/p><p>Как сказано:<\/p><p>«Открой глаза мои, и увижу чудеса Торы Твоей».<\/p><p>(Теилим, 119:18.)<\/p><p>«Укажи мне, Господи, путь уставов Твоих, и я буду соблюдать его до конца».<\/p><p>(Там же, 119:33.)<\/p><p>«Склони сердце моё к свидетельствам Твоим».<\/p><p>(Там же, 119:36.)<\/p><p>И ещё сказано:<\/p><p>«Всякому совершенству видел я предел, но заповедь Твоя безмерно широка».<\/p><p>(Там же, 119:96.)<\/p><p>Смысл этих слов заключается в следующем:<\/p><p>Нет предела и конца тому служению, которое мы обязаны совершать ради Тебя в благодарность за Твои постоянные благодеяния, поскольку нет предела и конца благу, которое Ты нам оказываешь.<\/p><p>Рассказывают о некоторых праведных служителях Всевышнего, которые на протяжении всей своей жизни постоянно возвращались к раскаянию.<\/p><p>Причина заключалась в том, что с каждым днём они всё глубже постигали величие Творца.<\/p><p>Каждый новый день они осознавали, что с высоты достигнутого теперь понимания их прежнее служение было недостаточным.<\/p><p>Поэтому каждый день они вновь раскаивались в недостатках своего прошлого служения.<\/p><p>Как сказал царь Давид, мир ему:<\/p><p>«День дню передаёт речь (<button aria-expanded=\"false\" aria-label=\"Примечание 15\" class=\"note-ref\" data-note=\"15\" type=\"button\">15<\/button>), и ночь ночи открывает знание».<\/p><p>(Теилим, 19:3.)<\/p><p>И ещё сказано:<\/p><p>«Потоки вод текут из глаз моих, потому что не соблюдали Тору Твою».<\/p><p>(Теилим, 119:136.) (<button aria-expanded=\"false\" aria-label=\"Примечание 16\" class=\"note-ref\" data-note=\"16\" type=\"button\">16<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-9\"><strong>Шестая причина<\/strong><\/h3><p>Служение, возникающее под воздействием Торы, находится в пределах человеческих возможностей. Если человек проявит внимание и подготовит себя к его исполнению, оно будет ему доступно.<\/p><p>Но служение, возникающее из разумного осознания, человек не способен исполнить в совершенстве без великих усилий и помощи Всевышнего.<\/p><p>Ведь собственных возможностей человека недостаточно, чтобы достичь этой ступени самостоятельно.<\/p><p>Поэтому такое служение находится на гораздо более высокой и возвышенной ступени (<button aria-expanded=\"false\" aria-label=\"Примечание 17\" class=\"note-ref\" data-note=\"17\" type=\"button\">17<\/button>).<\/p><p>Именно поэтому мы видим, что царь Давид, мир ему, постоянно обращался к Всевышнему с мольбой помочь ему достичь этого уровня, как можно увидеть в главе «Счастливы непорочные в пути» (Теилим, 119).<\/p><h3 class=\"subheading\" id=\"sub-4-10\"><strong>Седьмая причина<\/strong><\/h3><p>Когда служение является лишь результатом побуждения со стороны Торы, человек не может быть уверен, что не потерпит в нём неудачи.<\/p><p>Ведь сила вожделения постоянно подстерегает его, ожидая тех моментов, когда он ослабит свою бдительность.<\/p><p>Но когда служение возникает благодаря пробуждению разума, человек защищён от неудачи и греха.<\/p><p>Ведь душа приходит к такому служению лишь после того, как телесные желания уже подчинены, а разум одержал над ними победу и управляет ими по своей воле.<\/p><p>Поэтому человек, достигший этой ступени, защищён от греха.<\/p><p>Как сказано:<\/p><p>«Не приключится праведнику никакого зла».<\/p><p>(Мишлей, 12:21.)<\/p><h3 class=\"subheading\" id=\"sub-4-11\"><strong>Семь причин, по которым необходимо побуждение к служению Всевышнему посредством Торы<\/strong><\/h3><p>Несмотря на то что пробуждение разума более угодно Всевышнему и по своему духовному уровню превосходит побуждение, исходящее от Торы, тем не менее существует необходимость в побуждении посредством Торы по семи причинам.<\/p><ol><li>Чтобы сохранять равновесие между телесными и духовными стремлениями человека и не допускать крайностей.<\/li><li>Чтобы определить подробности исполнения разумных заповедей: каким образом, когда и в какой мере их следует исполнять.<\/li><li>Чтобы служение Всевышнему не зависело от душевного состояния человека и не подвергалось колебаниям, а оставалось постоянным при любых обстоятельствах.<\/li><li>Чтобы человек не думал, будто другие народы, находящиеся в более благоприятном положении, обязаны служить Всевышнему больше, чем его народ, но знал, что Всевышний оказал народу Израиля особые благодеяния, превосходящие благодеяния, оказанные другим народам.<\/li><li>Чтобы воспитывать и направлять человека в детстве, пока его разум ещё не созрел, а также руководить теми, чей разум недостаточно силён, чтобы преодолеть свои желания.<\/li><li>Чтобы научить нас заповедям, которые мы не могли бы постичь собственным разумом, например заповеди о красной корове, запрету шаатнеза — смешения шерсти и льна — и другим подобным заповедям.<\/li><li>Чтобы посредством чудес и знамений, описанных в Торе, мы имели доказательства истинности нашей веры и нашей Торы.<\/li><\/ol><p>Теперь я объясню достоинства побуждения к служению посредством Торы, которые приходят мне на ум.<\/p><p>Причин, по которым необходимо такое побуждение, семь, как было сказано выше.<\/p><h3 class=\"subheading\" id=\"sub-4-12\"><strong>Первая причина — сохранение равновесия между телом и душой<\/strong><\/h3><p>Человек состоит из души и тела, и поэтому в нём присутствуют противоположные склонности.<\/p><p>С одной стороны, телесные качества побуждают его предаваться удовольствиям этого мира, погружаться в материальные желания и освобождаться от власти разума.<\/p><p>С другой стороны, духовные качества пробуждают в нём стремление отдалиться от удовольствий этого мира и пренебрегать заботами о его благоустройстве.<\/p><p>Это происходит вследствие осознания того, что приобретения этого мира временны, могут исчезнуть и постоянно сопровождаются трудностями и страданиями.<\/p><p>Духовная склонность направляет мысли человека к высшему миру разума и к грядущему миру.<\/p><p>Однако обе эти склонности, когда они доходят до крайности, не заслуживают похвалы.<\/p><p><strong>Чрезмерное стремление к духовности<\/strong> приводит к разрушению основ существования этого мира, поскольку человек пренебрегает своими обязанностями по его благоустройству.<\/p><p><strong>Чрезмерное стремление к телесным удовольствиям<\/strong> губит человека как в этом мире, так и в мире грядущем.<\/p><p>Поэтому Творец по Своему милосердию и великой доброте даровал человеку средство, позволяющее сохранять равновесие между двумя крайностями и достигать совершенства как в делах этого мира, так и в делах мира грядущего.<\/p><p>Этим средством является Тора.<\/p><p><strong>Тора — совершенное средство достижения равновесия.<\/strong><\/p><p>Тора направляет человека по среднему пути между разумом и вожделением. Именно этот путь ведёт к совершенству.<\/p><p>Тора истинна и достойна полного доверия, поскольку она:<\/p><ul><li>Сохраняет справедливость как в открытых, так и в скрытых поступках.<\/li><li>Отдаляет человека от чрезмерной привязанности к удовольствиям этого мира.<\/li><li>Сохраняет для человека его вечную награду в грядущем мире.<\/li><\/ul><p>Как сказано в книге Мишлей:<\/p><p>«Приклони ухо твоё и слушай слова мудрых, и сердце твоё обрати к знанию моему. Ибо приятно будет, если сохранишь их внутри себя, и будут они вместе утверждены на устах твоих. Чтобы на Господа было упование твоё, я научил тебя сегодня, именно тебя. Разве не написал я тебе превосходных наставлений и знаний, чтобы научить тебя верности истинных слов, дабы ты мог отвечать словами истины посылающим тебя?»<\/p><p>(Мишлей, 22:17–21.) (<button aria-expanded=\"false\" aria-label=\"Примечание 18\" class=\"note-ref\" data-note=\"18\" type=\"button\">18<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-13\"><strong>Вторая причина — определение подробностей заповедей<\/strong><\/h3><p>Хотя разум также обязывает человека служить Всевышнему посредством молитвы, поста, раздачи милостыни, отделения десятины и совершения добрых дел, всё же разум не определяет подробностей этих обязанностей.<\/p><p>Он не указывает, каким образом, в каком количестве и в какое время их следует исполнять.<\/p><p>Кроме того, человек не мог бы самостоятельно определить разумом меру наказания, полагающегося тем, кто недостаточно усерден в служении Всевышнему.<\/p><p>Поэтому возникла необходимость установить и определить все эти подробности посредством Торы и пророческого откровения.<\/p><p>Благодаря совокупности всех деталей заповедей должным образом осуществляется цель, ради которой Всевышний сотворил нас.<\/p><p>Какова же эта цель?<\/p><p>Служение благословенному Всевышнему.<\/p><p>Как сказано:<\/p><p>«И Бог сделал так, чтобы благоговели перед Ним».<\/p><p>(Коэлет, 3:14.) (<button aria-expanded=\"false\" aria-label=\"Примечание 19\" class=\"note-ref\" data-note=\"19\" type=\"button\">19<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-14\"><strong>Третья причина — одинаковое обязательство для всех людей<\/strong><\/h3><p>Разумное побуждение не способно одинаково пробуждать к служению Всевышнему всех людей, на которых возложена эта обязанность.<\/p><p>Ведь у одних способность к размышлению слабее, а у других способность к пониманию сильнее.<\/p><p>Но побуждение посредством Торы в равной степени распространяется на всех, кому заповедано служить Всевышнему, хотя они и понимают Тору неодинаково.<\/p><p>Как мы уже объяснили выше, в конце раздела «Врата единства» (<button aria-expanded=\"false\" aria-label=\"Примечание 20\" class=\"note-ref\" data-note=\"20\" type=\"button\">20<\/button>).<\/p><p>Кроме того, человек, служащий Всевышнему исключительно на основании разумного осознания, может недостаточно исполнять одни обязанности и чрезмерно усердствовать в других.<\/p><p>Его разумное побуждение также будет изменяться в зависимости от изменений в его способности к пониманию (<button aria-expanded=\"false\" aria-label=\"Примечание 21\" class=\"note-ref\" data-note=\"21\" type=\"button\">21<\/button>).<\/p><p>Но побуждение посредством Торы само по себе неизменно и одинаково для всех: для ребёнка и юноши, для пожилого человека и старца, для мудреца и неразумного.<\/p><p>При этом само исполнение заповедей, возникающее благодаря побуждению Торы, неодинаково у перечисленных людей (<button aria-expanded=\"false\" aria-label=\"Примечание 22\" class=\"note-ref\" data-note=\"22\" type=\"button\">22<\/button>).<\/p><p>Однако обязанность, исходящая от Торы, одинакова для всех.<\/p><p>Это видно из того, что Тора обращается ко всему народу как к единому целому.<\/p><p>Как сказано:<\/p><p>«Собери народ, мужчин, женщин и детей, и пришельца твоего, который во вратах твоих, чтобы они слушали и чтобы учились».<\/p><p>(Дварим, 31:12.)<\/p><p>И ещё сказано:<\/p><p>«Читай эту Тору перед всем Израилем, во всеуслышание».<\/p><p>(Дварим, 31:11.)<\/p><h3 class=\"subheading\" id=\"sub-4-15\"><strong>Четвёртая причина — особая обязанность народа Израиля<\/strong><\/h3><p>Очевидно, что люди обязаны служить Всевышнему в соответствии с величиной благодеяний, которые они получают.<\/p><p>В каждом поколении возникают определённые обстоятельства, благодаря которым один из народов получает от благословенного Всевышнего особое благо, которого не удостаиваются остальные народы.<\/p><p>В благодарность за это особое благо на данный народ возлагается особая обязанность служить Творцу более возвышенным образом, чем другие народы (<button aria-expanded=\"false\" aria-label=\"Примечание 23\" class=\"note-ref\" data-note=\"23\" type=\"button\">23<\/button>).<\/p><p>Следовательно, если бы обязанность служить Всевышнему возникала исключительно из разумного осознания, мы не знали бы, что именно мы, народ Израиля, удостоились получить от Всевышнего величайшие благодеяния (<button aria-expanded=\"false\" aria-label=\"Примечание 24\" class=\"note-ref\" data-note=\"24\" type=\"button\">24<\/button>).<\/p><p>По этой причине на нас возложена особая обязанность служить Ему больше, чем на остальные народы.<\/p><p>Почему одного разума недостаточно?<\/p><p>Потому что посредством одного лишь разума невозможно узнать, что Всевышний избрал нас, когда вывел из Египта, рассёк перед нами море и совершил для нас в то время множество других благодеяний, о которых нет необходимости подробно рассказывать, поскольку они широко известны.<\/p><p>В благодарность за эти благодеяния благословенный Творец возложил особую обязанность исполнения заповедей именно на нас, выделив нас среди всех народов.<\/p><p>Исполнение заповедей является выражением благодарности за всё, что Всевышний совершил для нас.<\/p><p>Более того, по Своей великой милости и доброте Он обещал нам за исполнение заповедей огромную награду как в этом мире, так и в мире грядущем.<\/p><p>И обо всём этом мы могли узнать только благодаря Торе.<\/p><p>Как сказано:<\/p><p>«Вы видели, что Я сделал Египту, и как Я нёс вас на орлиных крыльях и привёл вас к Себе. А теперь, если будете слушаться голоса Моего и соблюдать завет Мой, то будете Моим драгоценным достоянием среди всех народов, ибо Мне принадлежит вся земля. И будете вы Мне царством священнослужителей и святым народом».<\/p><p>(Шмот, 19:4–6.) (<button aria-expanded=\"false\" aria-label=\"Примечание 25\" class=\"note-ref\" data-note=\"25\" type=\"button\">25<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-16\"><strong>Пятая причина — Тора подготавливает человека к разумному служению<\/strong><\/h3><p>Побуждение посредством Торы является подготовкой и вступлением к пробуждению разума, а также источником доказательств для него.<\/p><p>В детстве человек нуждается в воспитании, руководстве и ограничении своих желаний, пока его разум не созреет и не станет устойчивым.<\/p><p>То же относится к женщинам и людям с недостаточно развитым разумом, которые, согласно объяснению автора, не следуют руководству разума вследствие слабости его влияния на них.<\/p><p>Поэтому разум не способен преодолеть их желания.<\/p><p>В силу этой необходимости требуется умеренное руководство — путь, находящийся между крайней материальностью и крайней духовностью.<\/p><p>Этот путь не должен быть для них слишком тяжёлым, чтобы они могли ему следовать.<\/p><p>Поэтому заповеди Торы были основаны также на надежде на награду и страхе перед наказанием (<button aria-expanded=\"false\" aria-label=\"Примечание 26\" class=\"note-ref\" data-note=\"26\" type=\"button\">26<\/button>).<\/p><p><strong>Ступени служения Всевышнему<\/strong><\/p><p>Первая ступень.<\/p><p>Человек, который не пренебрегает исполнением обязанностей, возложенных на него Торой, даже если он исполняет их только из надежды на награду и страха перед наказанием, достигает ступени чистых благочестивых людей.<\/p><p>Такой человек достоин награды в этом мире и в мире грядущем.<\/p><p>Высшая ступень.<\/p><p>Тот, кто поднимается с этой ступени к служению Всевышнему, основанному на пробуждении разума, достигает уровня пророков и избранных праведников Всевышнего.<\/p><p>Его наградой в этом мире становится радость от сладости служения Всевышнему.<\/p><p>Как сказано:<\/p><p>«Обретены были слова Твои, и я вкусил их, и стало слово Твоё для меня весельем и радостью сердца моего, ибо имя Твоё наречено надо мной, Господь, Бог Воинств».<\/p><p>(Ирмияу, 15:16.) (<button aria-expanded=\"false\" aria-label=\"Примечание 27\" class=\"note-ref\" data-note=\"27\" type=\"button\">27<\/button>)<\/p><p>«Возрадуется праведник о Господе и будет уповать на Него, и прославятся все прямые сердцем».<\/p><p>(Теилим, 64:11.) (<button aria-expanded=\"false\" aria-label=\"Примечание 28\" class=\"note-ref\" data-note=\"28\" type=\"button\">28<\/button>)<\/p><p>«Свет посеян для праведника, и для прямых сердцем — радость».<\/p><p>(Теилим, 97:11.) (<button aria-expanded=\"false\" aria-label=\"Примечание 29\" class=\"note-ref\" data-note=\"29\" type=\"button\">29<\/button>)<\/p><p><strong>Награда в грядущем мире<\/strong><\/p><p>Тот, кто достигает ступени пророков и высших праведников, удостоится приблизиться к высшему свету, который невозможно описать или сравнить с чем-либо.<\/p><p>Как сказано:<\/p><p>«Если будешь ходить путями Моими и соблюдать установления Мои, то будешь также судить дом Мой и охранять дворы Мои, и Я дам тебе возможность ходить среди этих стоящих».<\/p><p>(Зхария, 3:7.) (<button aria-expanded=\"false\" aria-label=\"Примечание 30\" class=\"note-ref\" data-note=\"30\" type=\"button\">30<\/button>)<\/p><p>«Как велико благо Твоё, которое Ты сокрыл для боящихся Тебя, которое приготовил для уповающих на Тебя перед сынами человеческими».<\/p><p>(Теилим, 31:20.) (<button aria-expanded=\"false\" aria-label=\"Примечание 31\" class=\"note-ref\" data-note=\"31\" type=\"button\">31<\/button>)<\/p><p>«Ничей глаз не видел, кроме Тебя, Боже, того, что Он сделает для ожидающего Его».<\/p><p>(Йешаяу, 64:3.) (<button aria-expanded=\"false\" aria-label=\"Примечание 32\" class=\"note-ref\" data-note=\"32\" type=\"button\">32<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-17\"><strong>Шестая причина — заповеди, которые разум не способен постичь<\/strong><\/h3><p>Тора включает как заповеди, причины обязательности которых человеческий разум не способен объяснить, например заповедь о красной корове, запрет шаатнеза и подобные им, так и основные правила и коренные принципы (<button aria-expanded=\"false\" aria-label=\"Примечание 33\" class=\"note-ref\" data-note=\"33\" type=\"button\">33<\/button>) заповедей, необходимость которых разум способен понять.<\/p><p>Поэтому необходимо побуждение посредством Торы, чтобы мы исполняли также заповеди, смысл которых не могли бы постичь одним лишь разумом.<\/p><p><strong>Почему в Торе записаны также разумные заповеди?<\/strong><\/p><p>Причина, по которой Тора должна была изложить и те заповеди, необходимость которых человек способен понять разумом, заключается в том, что народ, получивший Тору, в то время был погружён в телесные желания.<\/p><p>Сила его разума и способность к осознанию были слишком слабы, чтобы понять многие разумные понятия.<\/p><p>Поэтому:<\/p><ol><li>Тора дала также разумные заповеди, чтобы люди исполняли их хотя бы благодаря побуждению со стороны Торы.<\/li><li>Благодаря этому и в последующих поколениях человек, разум которого не способен самостоятельно постичь эти заповеди, сможет исполнять их по повелению Торы.<\/li><li>Тот, чей разум и способность к пониманию достаточно сильны, будет побуждаться к исполнению заповедей из двух источников: посредством Торы и посредством разума.<\/li><li>Тот же, чей разум недостаточно силён для понимания причин заповедей, примет их на себя исключительно благодаря побуждению Торы, подобно тому как он исполняет заповеди, необходимость которых разум сам по себе не устанавливает.<\/li><\/ol><p><strong>Результат<\/strong><\/p><p>Благодаря этому все — как мудрые, так и люди со слабым разумом — смогут достичь совершенства в служении Всевышнему.<\/p><p>Как сказано:<\/p><p>«Пути её — пути приятные, и все стези её — мир».<\/p><p>(Мишлей, 3:17.) (<button aria-expanded=\"false\" aria-label=\"Примечание 34\" class=\"note-ref\" data-note=\"34\" type=\"button\">34<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-4-18\"><strong>Седьмая причина — чудеса, сопровождавшие дарование Торы<\/strong><\/h3><p>Тору мы получили через Моше, нашего учителя, мир ему.<\/p><p>Всевышний совершил через него знамения и чудеса, которые все люди могли увидеть и ощутить и которые, согласно словам автора, невозможно отрицать.<\/p><p>Посредством этих знамений и чудес была подтверждена истинность всего, что Моше, наш учитель, говорил от имени Творца.<\/p><p>Это подтверждение происходило как посредством чудес, воспринимаемых органами чувств, так и посредством доказательств, постигаемых разумом.<\/p><p><strong>Особенность этого откровения<\/strong><\/p><p>Всё это дополняет естественное разумное пробуждение, заложенное в людях с самого начала их сотворения.<\/p><p>Откровение, данное через Моше, нашего учителя, не только укрепляет разумное побуждение, но и предоставляет ему ощутимую, прочную и неоспоримую основу.<\/p><h3 class=\"subheading\" id=\"sub-4-19\"><strong>Чем больше благодеяний человек получает, тем больше он обязан служить Всевышнему<\/strong><\/h3><p>Чем больше Всевышний оказывает человеку добра, тем больше человек должен проявлять благодарность и усиливать своё служение Творцу.<\/p><p>Тот же, кто не прибавляет в служении Всевышнему и не поднимается на более высокие ступени, сам становится причиной своего постепенного падения, пока не опустится на самую низкую ступень. Да сохранит нас Всевышний от этого.<\/p><p>Очевидно, что мы обязаны служить благословенному Творцу как благодаря пробуждению разума, так и благодаря побуждению со стороны Торы.<\/p><p>Поэтому человек, размышляющий о благодеяниях, которые Всевышний оказывает ему наравне со всеми людьми, понимает, что обязан принять на себя все виды служения, необходимость которых устанавливает разум, подобно остальным людям (<button aria-expanded=\"false\" aria-label=\"Примечание 35\" class=\"note-ref\" data-note=\"35\" type=\"button\">35<\/button>).<\/p><p>Когда же он размышляет о благодеяниях, которые благословенный Творец оказал исключительно Своему народу, в отличие от остальных народов, он понимает, что помимо служения, обязательного с точки зрения разума для всех людей, должен принять на себя также заповеди Торы, необходимость которых разум сам по себе не устанавливает.<\/p><p>И когда он размышляет об особых благодеяниях, которые благословенный Творец даровал только его колену, но не остальным коленам народа, например священство или служение левитов, он осознаёт свою обязанность принять на себя также заповеди, данные исключительно его колену.<\/p><p>Эти обязанности дополняют служение, вытекающее из разума, и заповеди Торы, необходимость которых разум сам по себе не устанавливает.<\/p><p>По этой причине мы находим, что число видов служения, возложенных на коэнов, составляет двадцать четыре (<button aria-expanded=\"false\" aria-label=\"Примечание 36\" class=\"note-ref\" data-note=\"36\" type=\"button\">36<\/button>), в соответствии с двадцатью четырьмя благодеяниями, которыми Творец наделил коэнов, — двадцатью четырьмя дарами священства.<\/p><p>По аналогии с этим каждый человек, которому Всевышний оказал особое благодеяние, не оказанное другим людям, обязан добавить к своему общему служению Всевышнему особое служение, возложенное именно на него.<\/p><p>Он должен проявлять благодарность благословенному Всевышнему по мере своих сил и понимания за то благо, которое было даровано ему лично.<\/p><p>Благодаря этому он удостоится и дальше пользоваться этим особым благом, Всевышний прибавит ему ещё благодеяний, а также дарует награду за его служение в грядущем мире.<\/p><p>Это противоположно поведению тех, о ком сказано:<\/p><p>«И серебро Я умножил для неё, и золото, а они использовали его для Бааля».<\/p><p>(Ошеа, 2:10.) (<button aria-expanded=\"false\" aria-label=\"Примечание 37\" class=\"note-ref\" data-note=\"37\" type=\"button\">37<\/button>)<\/p><p>Но тот, кто не прибавляет особого служения Всевышнему в благодарность за особые благодеяния, оказанные ему, становится причиной того, что постепенно начинает пренебрегать даже служением, соответствующим благодеяниям, оказанным его семье.<\/p><p>После этого он может перестать служить Всевышнему в соответствии с благодеяниями, которые Всевышний оказывает его народу.<\/p><p>В конце концов он может полностью оставить Тору (<button aria-expanded=\"false\" aria-label=\"Примечание 38\" class=\"note-ref\" data-note=\"38\" type=\"button\">38<\/button>).<\/p><p>Когда он перестанет принимать на себя обязанности, возложенные Торой, он постепенно придёт к тому, что перестанет принимать на себя даже обязанности, необходимость которых устанавливает разум.<\/p><p>Если он не примет на себя эти обязанности, несмотря на то что знает о них и разум побуждает его к их исполнению, он перестанет соответствовать определению «живого разумного существа» (<button aria-expanded=\"false\" aria-label=\"Примечание 39\" class=\"note-ref\" data-note=\"39\" type=\"button\">39<\/button>).<\/p><p>В таком состоянии даже животные будут лучше него понимать то, что приносит им пользу.<\/p><p>Как сказано:<\/p><p>«Вол знает своего хозяина, и осёл — кормушку своего владельца, а Израиль не знает, народ Мой не разумеет».<\/p><p>(Йешаяу, 1:3.)<\/p><p>Он последует путём тех, о ком сказано:<\/p><p>«Ибо злодеи погибнут, и враги Господа, словно красота пастбищ, исчезнут; в дыму исчезнут».<\/p><p>(Теилим, 37:20.) (<button aria-expanded=\"false\" aria-label=\"Примечание 40\" class=\"note-ref\" data-note=\"40\" type=\"button\">40<\/button>)<\/p>", "subs": [{"id": "sub-4-1", "title": "Что такое служение Всевышнему?"}, {"id": "sub-4-2", "title": "Два вида служения Всевышнему"}, {"id": "sub-4-3", "title": "Семь преимуществ служения Всевышнему, основанного на разумном осознании"}, {"id": "sub-4-4", "title": "Первая причина"}, {"id": "sub-4-5", "title": "Вторая причина"}, {"id": "sub-4-6", "title": "Третья причина"}, {"id": "sub-4-7", "title": "Четвёртая причина"}, {"id": "sub-4-8", "title": "Пятая причина"}, {"id": "sub-4-9", "title": "Шестая причина"}, {"id": "sub-4-10", "title": "Седьмая причина"}, {"id": "sub-4-11", "title": "Семь причин, по которым необходимо побуждение к служению Всевышнему посредством Торы"}, {"id": "sub-4-12", "title": "Первая причина — сохранение равновесия между телом и душой"}, {"id": "sub-4-13", "title": "Вторая причина — определение подробностей заповедей"}, {"id": "sub-4-14", "title": "Третья причина — одинаковое обязательство для всех людей"}, {"id": "sub-4-15", "title": "Четвёртая причина — особая обязанность народа Израиля"}, {"id": "sub-4-16", "title": "Пятая причина — Тора подготавливает человека к разумному служению"}, {"id": "sub-4-17", "title": "Шестая причина — заповеди, которые разум не способен постичь"}, {"id": "sub-4-18", "title": "Седьмая причина — чудеса, сопровождавшие дарование Торы"}, {"id": "sub-4-19", "title": "Чем больше благодеяний человек получает, тем больше он обязан служить Всевышнему"}]}, {"id": "chapter-4", "title": "Глава 4", "html": "<h3 class=\"subheading\" id=\"sub-5-1\"><strong>«Ховот а-Левавот» — Обязанности сердец<\/strong><\/h3><p><strong>С Божьей помощью<\/strong><\/p><p>В этой главе объясняется побуждение к служению Всевышнему посредством Торы, о котором говорилось в трёх предыдущих главах.<\/p><p>Наш учитель определяет это побуждение как пророчество, которое Всевышний посылает людям, чтобы сообщить им, какого служения Он от них требует.<\/p><p>Наш учитель также объясняет, что для достижения желаемой цели этого побуждения — очищения разума от влияния животной души, чтобы человек пришёл к служению Всевышнему на основе разумного осознания, — необходимо достичь высочайшего уровня в трёх областях:<\/p><ol><li>В знании Торы.<\/li><li>В вере в истинность Торы.<\/li><li>В чистоте намерений, воодушевлении и безграничной готовности служить Всевышнему.<\/li><\/ol><p>Теперь нам предстоит объяснить сущность побуждения посредством Торы, на какие категории Тора разделяет поступки человека, а также на какие ступени делятся изучающие Тору в зависимости от глубины их знаний, степени веры в неё и того, насколько они исполняют её предписания.<\/p><h3 class=\"subheading\" id=\"sub-5-2\"><strong>Сущность побуждения посредством Торы<\/strong><\/h3><p>Чтобы объяснить сущность побуждения посредством Торы, скажу следующее.<\/p><p>Это пророчество от Всевышнего, переданное нам через Моше, нашего учителя, мир ему, чтобы сообщить нам, какого служения желает от нас Всевышний, и чтобы даровать нам за это служение награду в этом мире и в мире грядущем — по Своей милости, щедрости и доброте (<button aria-expanded=\"false\" aria-label=\"Примечание 41\" class=\"note-ref\" data-note=\"41\" type=\"button\">41<\/button>).<\/p><p>На первый взгляд все поступки человека делятся на три категории:<\/p><ol><li><strong>Заповеди<\/strong> — действия, которые человек обязан совершать.<\/li><li><strong>Грехи<\/strong> — действия, которые человеку запрещено совершать.<\/li><li><strong>Дозволенные действия<\/strong> — поступки, в отношении которых человеку предоставлена свобода выбора: совершать их или воздерживаться от них.<\/li><\/ol><p>Дозволенные действия, в свою очередь, подразделяются на три вида.<\/p><p><strong>Первый вид — удовлетворение необходимых потребностей.<\/strong><\/p><p>Это образ жизни, при котором человек ограничивается лишь тем, что действительно необходимо для его существования. Такой образ жизни достоин похвалы.<\/p><p><strong>Второй вид — жизнь в излишествах.<\/strong><\/p><p>Это образ жизни, включающий вещи, предназначенные для удовлетворения страстей и удовольствий человека. Он заслуживает порицания и в конечном итоге оборачивается человеку во вред.<\/p><p><strong>Третий вид — чрезмерное самоограничение.<\/strong><\/p><p>Это образ жизни, при котором человек отказывается даже от того, что необходимо для его существования.<\/p><p>Оценка такого поведения зависит от намерений человека.<\/p><p>Если оно исходит из чистого намерения, то достойно похвалы. Если же нет — заслуживает порицания и является дурным.<\/p><p>Однако более глубокое исследование показывает, что все поступки человека, даже те, которые на первый взгляд относятся к категории дозволенных, в действительности являются либо исполнением заповеди, либо грехом.<\/p><p>Ведь первый вид дозволенного — удовлетворение только необходимых потребностей — относится к исполнению заповеди.<\/p><p>Второй вид — жизнь в излишествах — относится к греху.<\/p><p>Третий вид — чрезмерное самоограничение — оценивается в зависимости от намерения человека.<\/p><p>Если оно совершается ради Небес, то также относится к исполнению заповеди.<\/p><p>Если же намерение не направлено ради Небес, то оно относится к греху.<\/p><p>Таким образом, все поступки человека без исключения являются либо исполнением заповеди, либо грехом.<\/p><h3 class=\"subheading\" id=\"sub-5-3\"><strong>Три категории человеческих поступков согласно Торе<\/strong><\/h3><p>Чтобы объяснить, на какие категории делятся поступки человека, скажу, что Тора разделяет их на три части.<\/p><ol><li>Действия, которые человеку заповедано совершать, то есть повелительные заповеди Торы.<\/li><li>Действия, которые человеку запрещено совершать, то есть запретительные заповеди Торы.<\/li><li>Действия, которые человеку разрешено совершать и которые сами по себе не относятся ни к заповедям, ни к грехам.<\/li><\/ol><h3 class=\"subheading\" id=\"sub-5-4\"><strong>Повелительные заповеди<\/strong><\/h3><p>Повелительные заповеди делятся на две категории.<\/p><p><strong>Первая категория — заповеди, возложенные исключительно на сердце.<\/strong><\/p><p>К ним относятся:<\/p><ul><li>Признание единства Всевышнего: вера в то, что только Он является Богом и кроме Него не существует никакой иной божественной силы.<\/li><li>Не допускать сомнений и недоверия по отношению к Нему, благословенному.<\/li><li>Уповать на Него.<\/li><li>Полностью вверять себя и всё, что нам принадлежит, Его руководству.<\/li><li>Быть довольными Его постановлениями, то есть принимать их с любовью и радостью.<\/li><li>Верить в Его пророков и Его Тору.<\/li><li>Благоговеть перед Ним и соблюдать Его заповеди.<\/li><li>Размышлять о Его чудесах и вдумываться в Его благодеяния.<\/li><\/ul><p>И существует множество других подобных обязанностей, перечисление которых потребовало бы слишком пространного изложения.<\/p><p><strong>Вторая категория — заповеди, возложенные одновременно на сердце и на органы тела.<\/strong><\/p><p>К ним относятся:<\/p><ul><li>Согласовывать слова с мыслями сердца, чтобы человек не говорил одно, а в сердце не держал другое.<\/li><li>Читать и изучать свиток Торы.<\/li><li>Молиться.<\/li><li>Поститься.<\/li><li>Давать милостыню.<\/li><li>Воздерживаться от работы в субботы и праздники.<\/li><li>Исполнять заповеди о сукке, лулаве и циците (42).<\/li><\/ul><h3 class=\"subheading\" id=\"sub-5-5\"><strong>Запретительные заповеди<\/strong><\/h3><p>Запретительные заповеди также делятся на две категории.<\/p><p><strong>Первая категория — запреты, относящиеся исключительно к сердцу.<\/strong><\/p><p>К ним относятся следующие запреты:<\/p><ul><li>Не верить, будто наряду с Творцом существует какая-либо другая божественная сила.<\/li><li>Не служить Творцу ради того, чтобы угождать людям и получать от них похвалу и почёт.<\/li><li>Не желать совершать грехи, даже если человек не совершает их на деле.<\/li><li>Не допускать в сердце гордости, высокомерия и надменности.<\/li><li>Не презирать других людей в своём сердце.<\/li><li>Не насмехаться над пророками и словами, которые они передают от имени Всевышнего.<\/li><li>Не испытывать отвращения к добру и к людям, совершающим добро.<\/li><li>Не радоваться успехам злодеев.<\/li><li>Не завидовать другим людям.<\/li><li>Не желать присвоить то, что принадлежит другим.<\/li><li>Не любить причинять зло людям.<\/li><li>Не роптать на постановления Творца.<\/li><\/ul><p>И существует множество других подобных запретов.<\/p><p><strong>Вторая категория — запреты, относящиеся к действиям органов тела.<\/strong><\/p><p>К ним относятся:<\/p><ul><li>Не заниматься идолопоклонством.<\/li><li>Не давать ложных клятв.<\/li><li>Не распространять сплетни.<\/li><li>Не употреблять запрещённую пищу.<\/li><li>Не проливать кровь.<\/li><\/ul><p>И множество других подобных запретов.<\/p><h3 class=\"subheading\" id=\"sub-5-6\"><strong>Три вида дозволенных действий<\/strong><\/h3><p>Действия, которые человеку разрешено совершать и которые сами по себе не являются ни заповедями, ни грехами, делятся на три категории:<\/p><ol><li>Необходимое.<\/li><li>Излишнее.<\/li><li>Недостаточное по сравнению с необходимым.<\/li><\/ol><h3 class=\"subheading\" id=\"sub-5-7\"><strong>Первый вид — необходимое<\/strong><\/h3><p>К категории необходимого относятся вещи, без которых человек не может существовать, поддерживать здоровье своего тела и надлежащим образом устраивать свои дела.<\/p><p>Например:<\/p><ul><li>Еда и питьё.<\/li><li>Одежда.<\/li><li>Жилище.<\/li><li>Разговоры, необходимые для ведения дел, работы и торговли.<\/li><li>Различные действия и движения тела.<\/li><\/ul><p>Во всём этом человек должен брать лишь столько, сколько ему действительно необходимо, соблюдая правильную меру, чтобы поддерживать своё существование.<\/p><p>Как сказано:<\/p><p>«Хорош человек, который милостив и даёт взаймы; он ведёт свои дела справедливо».<\/p><p>(Теилим, 112:5.) (<button aria-expanded=\"false\" aria-label=\"Примечание 43\" class=\"note-ref\" data-note=\"43\" type=\"button\">43<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-5-8\"><strong>Второй вид — излишнее<\/strong><\/h3><p>Ко второй категории дозволенных действий относятся излишества, то есть всё, что выходит за пределы жизненной необходимости и представляет собой ненужное дополнение.<\/p><p>Например, чрезмерное употребление пищи и напитков.<\/p><p>Мудрец уже предостерегал от этого:<\/p><p>«Не будь среди упивающихся вином, среди объедающихся мясом».<\/p><p>(Мишлей, 23:20.)<\/p><p>Сюда же относятся:<\/p><p>Человек, чрезмерно украшающий себя дорогими одеждами.<\/p><p>Человек, живущий в слишком просторном жилище, хотя не нуждается в нём.<\/p><p>Человек, говорящий слишком много, поскольку он не может быть уверен, что не оступится в своих словах.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«При многословии не избежать греха».<\/p><p>(Мишлей, 10:19.)<\/p><p>Также о женщинах сказано:<\/p><p>«А водящийся с блудницами растратит богатство».<\/p><p>(Мишлей, 29:3.)<\/p><p>«Не отдавай женщинам силы твоей».<\/p><p>(Мишлей, 31:3.)<\/p><p>О царе сказано:<\/p><p>«И пусть не умножает себе жён».<\/p><p>(Дварим, 17:17.)<\/p><p>Сюда же относится стремление накопить огромное имущество и собрать большие денежные богатства.<\/p><p>Как сказано:<\/p><p>«Не трудись, чтобы разбогатеть; оставь собственную мудрость твою».<\/p><p>(Мишлей, 23:4.)<\/p><p>И о царе сказано:<\/p><p>«И серебра и золота пусть не умножает себе чрезмерно».<\/p><p>(Дварим, 17:17.)<\/p><p>Все эти излишества, предназначенные для удовлетворения телесных потребностей и удовольствий, в конечном итоге оборачиваются человеку во вред.<\/p><p>Ведь они приводят его к нарушению запретов, установленных Творцом (<button aria-expanded=\"false\" aria-label=\"Примечание 44\" class=\"note-ref\" data-note=\"44\" type=\"button\">44<\/button>).<\/p><h3 class=\"subheading\" id=\"sub-5-9\"><strong>Третий вид — меньше необходимого<\/strong><\/h3><p>Третья категория дозволенных действий — это чрезмерное самоограничение, когда человек не обеспечивает себя даже тем, что необходимо для его существования.<\/p><p>Это может относиться к пище, питью, разговорам, занятиям ради заработка и другим подобным вещам.<\/p><p>Такое самоограничение может возникать по двум причинам.<\/p><p><strong>Первая причина — благочестие.<\/strong><\/p><p>Если человек ограничивает себя ради приближения ко Всевышнему, стремясь таким образом обуздать свои желания, то такое поведение достойно похвалы и заслуживает награды.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«Сердце мудрых — в доме скорби, а сердце глупых — в доме веселья».<\/p><p>(Коэлет, 7:4.) (<button aria-expanded=\"false\" aria-label=\"Примечание 45\" class=\"note-ref\" data-note=\"45\" type=\"button\">45<\/button>)<\/p><p><strong>Вторая причина — любовь к этому миру.<\/strong><\/p><p>Если же чрезмерное самоограничение возникает из скупости, чтобы у человека оставалось больше денег, либо из желания получить похвалу окружающих за то, что он якобы из благочестия отказывается даже от дозволенных вещей и довольствуется меньшим, чем необходимо для питания, — такое поведение заслуживает порицания.<\/p><p>Ведь человек отклоняется от среднего пути и причиняет вред собственному телу из-за чрезмерной любви к этому миру.<\/p><p>Один из мудрецов сказал:<\/p><p>«Всякий, кто отдаляется от мира из любви к миру, подобен человеку, который пытается потушить огонь соломой» (<button aria-expanded=\"false\" aria-label=\"Примечание 46\" class=\"note-ref\" data-note=\"46\" type=\"button\">46<\/button>).<\/p><p><strong>Однако сокращение разговоров и сна достойно похвалы.<\/strong><\/p><p>Сокращение разговоров похвально, поскольку плоды молчания превосходят плоды речи.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«Не спеши устами своими, и сердце твоё пусть не торопится произнести слово перед Богом, ибо Бог на небесах, а ты на земле; поэтому пусть слова твои будут немногочисленны».<\/p><p>(Коэлет, 5:1.) (<button aria-expanded=\"false\" aria-label=\"Примечание 47\" class=\"note-ref\" data-note=\"47\" type=\"button\">47<\/button>)<\/p><p>Умеренное сокращение сна также достойно похвалы.<\/p><p>Как сказано:<\/p><p>«Немного поспать, немного подремать, немного сложить руки, чтобы полежать».<\/p><p>(Мишлей, 6:10.)<\/p><h3 class=\"subheading\" id=\"sub-5-10\"><strong>Все поступки человека относятся либо к заповедям, либо к грехам<\/strong><\/h3><p>Из всего сказанного становится ясно, что дозволенные действия человека могут относиться к одной из трёх категорий:<\/p><ol><li>Заповедь.<\/li><li>Грех.<\/li><li>Необходимое.<\/li><\/ol><p>Ведь всё, что выходит за пределы необходимого, будь то излишество или чрезмерное самоограничение, неизбежно относится либо к заповеди, если совершается ради Небес (<button aria-expanded=\"false\" aria-label=\"Примечание 48\" class=\"note-ref\" data-note=\"48\" type=\"button\">48<\/button>), либо к греху, если совершается не ради Небес.<\/p><p>Но если мы исследуем саму категорию необходимого, то есть действия, без которых невозможно добывать пропитание и поддерживать существование в этом мире, обнаружим, что нам также заповедано их совершать.<\/p><p>Как сказано в начале сотворения мира:<\/p><p>«И благословил их Бог, и сказал им Бог: плодитесь и размножайтесь, и наполняйте землю, и овладевайте ею».<\/p><p>(Берешит, 1:28.)<\/p><p>А в следующем стихе сказано:<\/p><p>«Вот, Я дал вам всякую траву, сеющую семя, которая на поверхности всей земли».<\/p><p>(Берешит, 1:29.) (<button aria-expanded=\"false\" aria-label=\"Примечание 49\" class=\"note-ref\" data-note=\"49\" type=\"button\">49<\/button>)<\/p><p>Следовательно, действия, необходимые для получения пропитания, также относятся к категории заповедей.<\/p><p>А раз это так, выходит, что все поступки людей без исключения относятся либо к заповедям, либо к грехам.<\/p><p>Объяснение этого заключается в следующем.<\/p><p>Если человек совершает какое-либо действие, относящееся к заповеди, то это доброе дело.<\/p><p>Если же он не совершает его, хотя имеет возможность исполнить свою обязанность, то нарушает повеление Творца.<\/p><p>Точно так же человек, совершающий запрещённое действие, грешит.<\/p><p>А если он воздерживается от запрещённого действия из страха перед Всевышним, то считается праведником.<\/p><p>Как сказано:<\/p><p>«Они также не совершали несправедливости, путями Его ходили».<\/p><p>(Теилим, 119:3.) (<button aria-expanded=\"false\" aria-label=\"Примечание 50\" class=\"note-ref\" data-note=\"50\" type=\"button\">50<\/button>)<\/p><p>Если же человек совершает одно из дозволенных действий, которые сами по себе не относятся ни к заповедям, ни к грехам, и делает это разумно, соблюдая правильную меру, то он праведник.<\/p><p>Как сказано:<\/p><p>«Хорош человек, который милостив и даёт взаймы; он ведёт свои дела справедливо».<\/p><p>(Теилим, 112:5.) (<button aria-expanded=\"false\" aria-label=\"Примечание 51\" class=\"note-ref\" data-note=\"51\" type=\"button\">51<\/button>)<\/p><p>Если же он превышает необходимую меру, то этим уменьшает своё служение Творцу, поскольку излишества приводят к тому, что Всевышний запретил.<\/p><p>А если человек ограничивает себя ниже необходимой меры, хотя способен обеспечить себя необходимым, и делает это с намерением:<\/p><ul><li>Воспитать свою душу посредством самоограничения, чтобы приучить её к служению Всевышнему.<\/li><li>Подчинить свои желания, чтобы приблизиться к Творцу.<\/li><li>Отдалиться от удовольствий этого мира и направить себя к тому, что приведёт его к грядущему миру.<\/li><\/ul><p>Тогда такой человек является праведником, а его поступок — добрым.<\/p><p>Но если он делает это не ради Небес, а из скупости или стремления приобрести почёт, то он уменьшает своё служение Всевышнему, и его поступок является дурным.<\/p><p>Таким образом, поступки людей делятся на добрые и дурные.<\/p><p>Разумный человек, который перед совершением каждого поступка взвешивает его таким образом и тщательно исследует его с помощью своего разума и способности к пониманию, выбирает доброе и оставляет всё остальное.<\/p><p>Как сказал царь Давид, мир ему:<\/p><p>«Размышлял я о путях своих и обратил стопы мои к свидетельствам Твоим. Поспешил я и не медлил соблюдать заповеди Твои».<\/p><p>(Теилим, 119:59–60.) (<button aria-expanded=\"false\" aria-label=\"Примечание 52\" class=\"note-ref\" data-note=\"52\" type=\"button\">52<\/button>)<\/p><p>Доказательством того, что каждый поступок является либо добрым, либо дурным, служат слова мудрого царя Шломо:<\/p><p>«Ибо всякое дело Бог приведёт на суд, включая всё сокрытое, будь то добро или зло».<\/p><p>(Коэлет, 12:14.) (<button aria-expanded=\"false\" aria-label=\"Примечание 53\" class=\"note-ref\" data-note=\"53\" type=\"button\">53<\/button>)<\/p><p>Таким образом, он включил все поступки в две категории: добро и зло.<\/p><p>Это и есть то, о чём мы говорили: все поступки являются либо добрыми, либо дурными.<\/p><p>Итак, выяснилось, что все человеческие поступки без исключения относятся к одной из двух категорий Торы: либо к заповедям, либо к грехам.<\/p><h3 class=\"subheading\" id=\"sub-5-11\"><strong>Десять ступеней знания Торы<\/strong><\/h3><p>Изучающие Тору делятся на десять ступеней.<\/p><ol><li>Те, кто читает Тору, не понимая значения слов.<\/li><li>Те, кто обращает внимание на правильное написание и произношение слов.<\/li><li>Те, кто старается изучить также правила языка.<\/li><li>Те, кто исследует трудные слова и простой смысл Торы.<\/li><li>Те, кто глубже проникает в буквальный смысл, но полагается исключительно на собственное понимание, а не на предание наших мудрецов, благословенна их память.<\/li><li>Те, кто объясняет Тору согласно преданию мудрецов, но занимается только изучением Мишны.<\/li><li>Те, кто изучает также Талмуд, но не углубляется в его содержание.<\/li><li>Те, кто глубоко изучает Талмуд, однако делает это ради славы и не занимается познанием и исполнением обязанностей сердца.<\/li><li>Те, кто изучает и исполняет также обязанности сердца, истинно служит Всевышнему и владеет всей Торой — как её открытым, так и сокровенным смыслом.<\/li><li>Те, кто благодаря своей мудрости и благочестию достиг высочайшей ступени, близкой к пророчеству и святому вдохновению — руах а-кодеш.<\/li><\/ol><p>Каждый человек должен исследовать своё положение, определить ступень, на которой находится, и стремиться подняться выше.<\/p><h3 class=\"subheading\" id=\"sub-5-12\"><strong>Подробное объяснение десяти ступеней<\/strong><\/h3><p>Чтобы объяснить, сколько существует ступеней среди изучающих Тору, скажу следующее.<\/p><p>Поскольку Тора включает слова и их содержание, люди делятся на десять ступеней в зависимости от глубины их знания Торы.<\/p><p>Каждый должен определить, на какой ступени он находится, и стараться подняться на более высокую.<\/p><h3 class=\"subheading\" id=\"sub-5-13\"><strong>Первая ступень<\/strong><\/h3><p>На самой низкой ступени находятся люди, которые в детстве научились читать Хумаш — Пятикнижие, но не продвинулись дальше.<\/p><p>Они довольствуются произнесением стихов, не понимая их содержания.<\/p><p>Они не знают значения слов и правил грамматики языка.<\/p><p>Такие люди подобны «ослу, несущему книги».<\/p><h3 class=\"subheading\" id=\"sub-5-14\"><strong>Вторая ступень<\/strong><\/h3><p>На второй ступени находятся люди, которые тщательно следят за правильностью чтения и произношения согласно правилам грамматики.<\/p><p>Они главным образом стараются знать, какие огласовки имеют слова и какими буквами они пишутся.<\/p><p>Это знатоки огласовок и масоретской традиции.<\/p><h3 class=\"subheading\" id=\"sub-5-15\"><strong>Третья ступень<\/strong><\/h3><p>На третьей ступени находятся люди, которые осознали недостаток знаний у представителей двух предыдущих групп.<\/p><p>Поэтому они стараются изучить также причины и правила постановки огласовок и знаков кантилляции, способы употребления языка и его грамматику.<\/p><p>Они изучают существительные, глаголы и служебные слова (<button aria-expanded=\"false\" aria-label=\"Примечание 54\" class=\"note-ref\" data-note=\"54\" type=\"button\">54<\/button>).<\/p><p>Они исследуют:<\/p><ul><li>Какие слова находятся в сопряжённом состоянии, а какие употребляются самостоятельно.<\/li><li>Употребление будущего времени для выражения прошлого и повелительной формы в виде неопределённой формы глагола.<\/li><li>Полные и неполные формы слов.<\/li><li>Какие из слабых букв произносятся, а какие не слышны при произношении.<\/li><li>Слова с удвоенными корневыми буквами и другие подобные особенности.<\/li><\/ul><h3 class=\"subheading\" id=\"sub-5-16\"><strong>Четвёртая ступень<\/strong><\/h3><p>На четвёртой ступени находятся люди, которые, помимо всего перечисленного, стараются узнать значение трудных слов Танаха и его простой буквальный смысл.<\/p><p>Они исследуют:<\/p><ul><li>Какие слова святого языка употребляются в переносном, образном значении (55).<\/li><li>Какие слова используются в своём прямом значении.<\/li><li>Какие слова являются синонимами, то есть разными словами с одинаковым значением.<\/li><li>Какие слова образованы от других слов (56).<\/li><li>Какие слова являются первоначальными и не производятся от других.<\/li><li>Какие слова представляют собой исключения и не имеют аналогов в Писании.<\/li><li>Какие слова могут употребляться и как существительные, и как глаголы.<\/li><\/ul><p>И другие подобные вопросы.<\/p><h3 class=\"subheading\" id=\"sub-5-17\"><strong>Пятая ступень<\/strong><\/h3><p>На пятой ступени находятся люди, которые, помимо всего сказанного, стараются понять простой смысл Торы и проникнуть в его глубину.<\/p><p>Они исследуют, какие выражения, относящиеся ко Всевышнему, употребляются образно.<\/p><p>Например, телесные действия, приписываемые благословенному Творцу:<\/p><p>«И увидел Господь».<\/p><p>«И услышал Господь».<\/p><p>«И сошёл Господь».<\/p><p>Они также исследуют, какие выражения следует понимать в их прямом значении.<\/p><p>Однако эти люди объясняют Божественное Писание исключительно согласно тому, как им представляется его буквальный смысл, а не согласно преданию наших мудрецов, благословенна их память.<\/p><p>К этой группе автор относит караимов и саддукеев.<\/p><h3 class=\"subheading\" id=\"sub-5-18\"><strong>Шестая ступень<\/strong><\/h3><p>На шестой ступени находятся люди, которые объясняют Тору согласно преданию наших мудрецов, благословенна их память.<\/p><p>Изучая Мишну, они приобретают некоторое понимание того, как исполнять Тору, её заповеди и законы.<\/p><p>Однако они не изучают Талмуд глубоко, чтобы понять источники законов и их подробности.<\/p><h3 class=\"subheading\" id=\"sub-5-19\"><strong>Седьмая ступень<\/strong><\/h3><p>На седьмой ступени находятся люди, которые, помимо всего перечисленного, занимаются также изучением Талмуда.<\/p><p>Они стараются изучить его и знать содержащиеся в нём законы.<\/p><p>Однако делают это, не разъясняя трудных мест и не раскрывая скрытого смысла его учения.<\/p><h3 class=\"subheading\" id=\"sub-5-20\"><strong>Восьмая ступень<\/strong><\/h3><p>На восьмой ступени находятся люди, которые не довольствуются уровнем знаний предыдущих групп.<\/p><p>Они усердно трудятся, чтобы понять слова мудрецов Талмуда, разрешить возникающие при его изучении сомнения и раскрыть глубину его смысла.<\/p><p>Однако делают это ради приобретения известности и почёта.<\/p><p>Они пренебрегают обязанностями сердца и не стремятся остерегаться того, что может испортить их добрые дела.<\/p><p>Они проводят свои дни, изучая редко встречающиеся законы и сложные, необычные судебные решения.<\/p><p>Они запоминают споры мудрецов Талмуда относительно новых выводов из законов.<\/p><p>Но при этом не занимаются исследованием вопросов, касающихся их собственной души, которыми они не имеют права пренебрегать и которые обязаны изучать.<\/p><p>К таким вопросам относятся:<\/p><ul><li>Истинные знамения величайшего из пророков — Моше, нашего учителя, мир ему.<\/li><li>Предание, полученное нами от мудрецов, благословенна их память, и условия (57), благодаря которым можно достоверно его понять.<\/li><li>Обязанность, возложенная на нас Творцом, приводить разумные доказательства Его существования, единства, свойств и качеств.<\/li><li>Обязанность служить Ему всем сердцем.<\/li><\/ul><p>И множество других подобных вопросов, которые можно постичь разумом и которые я объясню далее в этом разделе.<\/p><h3 class=\"subheading\" id=\"sub-5-21\"><strong>Девятая ступень<\/strong><\/h3><p>На девятой ступени находятся люди, которые усердно стараются познать:<\/p><ul><li>Обязанности, возложенные на сердце и органы тела.<\/li><li>То, что может испортить добрые дела.<\/li><li>Простой смысл Торы и её сокровенные тайны.<\/li><\/ul><p>Они доказали на основании стихов Писания и разумных доводов истинность Устной Торы.<\/p><p>Они упорядочили законы и разделили практические заповеди в зависимости от времени и места (<button aria-expanded=\"false\" aria-label=\"Примечание 58\" class=\"note-ref\" data-note=\"58\" type=\"button\">58<\/button>), в которых они действуют.<\/p><p>Они постигли основные принципы заповедей Торы, тщательно соблюдают их и побуждают других к их исполнению.<\/p><p>Они следуют путём истины как втайне, так и открыто.<\/p><p>Они идут за истиной, куда бы она ни вела, независимо от того, в каком направлении она находится.<\/p><p>К этой ступени относятся амораим — мудрецы Гемары, — а также последовавшие за ними гаоны, которые придерживались их пути.<\/p><h3 class=\"subheading\" id=\"sub-5-22\"><strong>Десятая ступень<\/strong><\/h3><p>На десятой ступени находятся люди, получившие мудрость Торы от пророков вместе со всеми её объяснениями и новыми законами, вытекающими из её основных принципов.<\/p><p>Это мужи Великого собрания — Аншей Кнессет а-Гдола — и получившие от них традицию танаим, мудрецы Мишны и Барайты (<button aria-expanded=\"false\" aria-label=\"Примечание 59\" class=\"note-ref\" data-note=\"59\" type=\"button\">59<\/button>).<\/p><p>Как сказано в трактате Авот (1:1):<\/p><p>«Моше получил Тору на Синае и передал её Йеошуа, Йеошуа — старейшинам, старейшины — пророкам, а пророки передали её мужам Великого собрания».<\/p><p>Мужи Великого собрания передали её Шимону Праведнику.<\/p><p>Шимон Праведник передал её Антигносу.<\/p><p>Антигнос передал её Йоси бен Йоэзеру и Йоси бен Йоханану из Иерусалима.<\/p><p>Они передали её Йеошуа бен Перахье и Нитаю из Арбеля.<\/p><p>Они передали её Йеуде бен Табаю и Шимону бен Шетаху.<\/p><p>Они передали её Шмае и Автальону.<\/p><p>Они передали её Шамаю и Гилелю.<\/p><p>Шамай и Гилель передали её Рабану Йоханану бен Закаю.<\/p><p>Рабан Йоханан бен Закай передал её:<\/p><ul><li>Раби Элиэзеру.<\/li><li>Раби Йеошуа.<\/li><li>Рабану Гамлиэлю.<\/li><li>Раби Элазару бен Араху.<\/li><li>Раби Йоси а-Коэну.<\/li><li>Раби Шимону бен Нетанэлю.<\/li><\/ul><p>Они передали её рабби Акиве, рабби Элазару бен Азарье, рабби Тарфону и раббану Шимону бен Гамлиэлю.<\/p><p>Они передали её рабби Меиру, рабби Йеуде, рабби Йоси, рабби Шимону и рабби Йеуде а-Наси, которого называют Рабейну а-Кадош — наш святой учитель.<\/p><p>Рабейну а-Кадош собрал законы, содержащиеся в мишнаёт, упорядочил их, разделил на главы и составил из них Мишну.<\/p><p>Мишна представляет собой краткое изложение всей достоверной традиции, на которую мы опираемся при объяснении нашей Торы.<\/p><h3 class=\"subheading\" id=\"sub-5-23\"><strong>Десять ступеней веры в Тору и побуждений к служению Всевышнему<\/strong><\/h3><p>Люди также делятся на десять ступеней в зависимости от своей веры в Тору и мотивов, побуждающих их служить Всевышнему.<\/p><ol><li><strong>Самая низкая ступень.<\/strong> Невежественные люди, которые из стремления к распущенной жизни и удовлетворению своих желаний сбрасывают с себя бремя Торы и, чтобы успокоить свою совесть, отрицают её, приводя пустые доводы.<\/li><li>Люди, отрицающие Тору вследствие ложных убеждений и еретических взглядов.<\/li><li>Люди, верящие в Божественное происхождение Торы, но отрицающие награду и наказание в грядущем мире.<\/li><li>Лицемеры, которые верят в награду и наказание в грядущем мире, но из-за сильной привязанности к удовольствиям этого мира исполняют Тору не ради служения Всевышнему, а ради обмана людей, чтобы казаться праведниками и приобретать богатство и почёт.<\/li><li>Люди, которые действительно стремятся служить Всевышнему, но одновременно желают удовлетворить своё стремление к славе и уважению.<\/li><li>Люди, служащие Всевышнему ради получения награды в этом мире.<\/li><li>Люди, служащие Всевышнему ради получения награды также в грядущем мире.<\/li><li>Люди, служащие Всевышнему из страха перед наказанием в этом мире и в мире грядущем.<\/li><li>Люди, служащие Всевышнему ради Его имени, но чистота их служения нарушается гордостью или другими недостатками.<\/li><li><strong>Ступень пророков и праведников.<\/strong> Их служение совершенно свято, чисто и основано на полной самоотдаче.<\/li><\/ol><p>Каждый человек должен определить свою ступень и постепенно стремиться подняться к самой высокой.<\/p><h3 class=\"subheading\" id=\"sub-5-24\"><strong>Подробное объяснение десяти ступеней веры<\/strong><\/h3><p>Взгляды людей на веру в Тору и причины, по которым следует принять на себя служение благословенному Всевышнему, делятся на десять ступеней.<\/p><h3 class=\"subheading\" id=\"sub-5-25\"><strong>Первая ступень<\/strong><\/h3><p>На самой низкой ступени находятся люди, которые под влиянием невежества и одолевших их страстей стали презирать Тору.<\/p><p>Они считают её чем-то подобным обычаям, которые правители народов придумали для управления своими подданными, или законам, посредством которых мудрецы руководят неразумными людьми.<\/p><p>К такому взгляду они пришли потому, что их желания одержали верх над разумом, а также вследствие грубости их натуры.<\/p><p>Они отказываются принять на себя бремя Торы (<button aria-expanded=\"false\" aria-label=\"Примечание 60\" class=\"note-ref\" data-note=\"60\" type=\"button\">60<\/button>).<\/p><p>Они не желают следовать руководству разума, поскольку стремятся к жизни без ограничений.<\/p><p>О таких людях мудрый царь Шломо сказал:<\/p><p>«Глупец не желает разумения, а лишь раскрыть то, что у него на сердце».<\/p><p>(Мишлей, 18:2.) (<button aria-expanded=\"false\" aria-label=\"Примечание 61\" class=\"note-ref\" data-note=\"61\" type=\"button\">61<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-5-26\"><strong>Вторая ступень<\/strong><\/h3><p>На второй ступени находятся люди, которые не могут отрицать знамения и чудеса, совершённые через пророков, поскольку они широко известны.<\/p><p>Они признают, что эти чудеса совершил Всевышний.<\/p><p>Однако они сомневаются в истинности Торы, поскольку, по их мнению, невозможно, чтобы возвышенный и величественный Бог говорил с телесным человеком.<\/p><p>Поэтому они придерживаются взгляда, близкого к мнению предыдущей группы.<\/p><p>Они полагают, что Всевышний пожелал указать Своим творениям правильный и упорядоченный образ жизни в этом мире.<\/p><p>Для этого Он побудил пророка установить необходимые людям законы и дал ему силу совершать знамения и чудеса, чтобы люди слушались его и принимали его постановления.<\/p><p>Но представители этой группы не верят, что Всевышний даёт награду за исполнение заповедей и наказывает за грехи.<\/p><p>Я считаю необходимым кратко объяснить опровержения их взглядов.<\/p><p>С одной стороны, я опровергну их мнение и докажу невозможность того, что они утверждают.<\/p><p>С другой стороны, я покажу, что даже согласно их ошибочному взгляду Всевышний обязывает исполнять всю Тору и устанавливает награду и наказание.<\/p><p><strong>Первое опровержение<\/strong><\/p><p>Невозможно, чтобы всё происходило так, как они утверждают.<\/p><p>Ведь Творец слишком возвышен и велик, чтобы изменять законы природы ради человека, который ложно говорит от Его имени и приписывает Ему слова, которых Он не произносил, даже если этот человек намеревается посредством такой лжи приблизить народ ко Всевышнему.<\/p><p>Почему же Всевышний не повелел бы Сам, каким образом следует исполнять Его волю?<\/p><p>Ведь для Всевышнего ниспослать пророку пророчество не труднее и не удивительнее, чем изменить ради него законы природы.<\/p><p>Если они верят, что Всевышний изменил порядок мира, чтобы люди слушались пророка, почему же они не верят, что пророчество, которое он произносит от имени Всевышнего, истинно?<\/p><p><strong>Второе опровержение<\/strong><\/p><p>Даже если допустить их ошибочное мнение и представить, что существуют ясные доказательства его истинности, разум всё равно обязывал бы слушаться пророка.<\/p><p>Ведь благословенный Творец не изменил бы законы природы и не совершил бы чудеса через человека, который не знает правильного и доброго пути.<\/p><p>А пророк, которого избрал благословенный Творец, поскольку Он совершил через него чудеса, чтобы указать нам добрый и прямой путь и руководить нами, достоин того, чтобы мы полагались на него в устройстве нашей жизни и поведении.<\/p><p>Ведь Всевышний повелел нам подчиняться царю или правителю, даже если они не обладают мудростью.<\/p><p>Как сказано:<\/p><p>«Бойся Господа, сын мой, и царя».<\/p><p>(Мишлей, 24:21.)<\/p><p>Тем более мы обязаны слушаться пророка, через которого Всевышний совершил чудеса.<\/p><p>Следовательно, представители этой группы обязаны принять на себя Тору и верить в награду и наказание по двум причинам:<\/p><ol><li>Их собственное мнение несостоятельно.<\/li><li>Даже согласно их взгляду разум обязывает их к этому.<\/li><\/ol><p>О таких людях мудрый царь Шломо сказал:<\/p><p>«Поймите, простодушные, благоразумие, и глупцы, обретите разумное сердце».<\/p><p>(Мишлей, 8:5.) (<button aria-expanded=\"false\" aria-label=\"Примечание 62\" class=\"note-ref\" data-note=\"62\" type=\"button\">62<\/button>)<\/p><h3 class=\"subheading\" id=\"sub-5-27\"><strong>Третья ступень<\/strong><\/h3><p>На третьей ступени находятся люди, которые уверены в истинности Торы, однако считают, что Тора была дана как проявление милости Всевышнего:<\/p><ul><li>Чтобы направлять Его творения по прямому пути в этом мире.<\/li><li>Чтобы установить для них правильный и полезный образ жизни исключитель
