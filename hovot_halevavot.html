лько ясно проявляется, что нет оснований подозревать несправедливость в Его решениях.<\/p><p>Нет Бога, кроме Него.<\/p><p>Были среди мудрецов и такие, которые предпочитали придерживаться обоих мнений одновременно: как того, что человек действует по необходимости, согласно воле Всевышнего, так и того, что человеку предоставлена свобода действовать по собственному выбору.<\/p><p>Объясняя, как можно принять обе эти противоположные точки зрения, они говорили, что человек, углубляющийся в этот вопрос, каким бы способом он ни пытался его разрешить, всё равно не сможет полностью избежать ошибки и заблуждения.<\/p><p>Поэтому они считали, что лучше придерживаться обоих мнений одновременно (<button aria-expanded=\"false\" aria-label=\"Примечание 108\" class=\"note-ref\" data-note=\"108\" type=\"button\">108<\/button>).<\/p><p>То есть в отношении исполнения заповедей и добрых дел мы должны следовать мнению тех, кто считает, что поступки человека предоставлены его собственному выбору и что он получает за них награду или наказание.<\/p><p>Исходя из этого, мы должны стараться делать всё, что принесёт нам благо от Творца в обоих мирах.<\/p><p>А в отношении остальных дел этого мира мы должны полагаться на Всевышнего, веря, что Он делает с нами только то, что служит нашему благу.<\/p><p>Так полагаются на Него те, кто убеждён, что именно Всевышний приводит в действие все поступки и движения, определяет пользу и вред силой Своего постановления, Своим позволением и Своим словом.<\/p><p>Благодаря одновременному принятию обоих взглядов получается, что, когда человек выбирает зло, у Всевышнего есть неопровержимое основание предъявить ему обвинение, поскольку у человека была возможность выбрать добро.<\/p><p>Сам же человек не может предъявить обвинение Благословенному Творцу, поскольку всё, что Всевышний делает с ним, направлено исключительно на его благо.<\/p><h3 class=\"subheading\" id=\"sub-9-1\"><strong>Опасность чрезмерного исследования вопроса о необходимости и свободе выбора<\/strong><\/h3><p>Углублённое исследование вопроса о том, действует ли человек по необходимости или по свободному выбору, представляет опасность.<\/p><p>Оно может привести человека к отрицанию веры и ложным убеждениям, поскольку человеческий разум совершенно не способен постичь правильное решение этого вопроса из-за своей ограниченности.<\/p><p>Это можно объяснить с помощью примера.<\/p><p>Мнение о том, что человек не способен постичь правильное решение данного вопроса, представляется более разумным, чем все приведённые выше взгляды.<\/p><p>Оно защищает человека от ошибок и ложных убеждений, к которым он может прийти вследствие запутанных рассуждений.<\/p><p>Ведь истина и здравый смысл требуют признать, что наше незнание этого вопроса, вызванное слабостью нашего разума и недостаточностью нашего понимания, является проявлением мудрости Творца.<\/p><p>Это незнание служит нашему благу, и поэтому данный вопрос скрыт от нас.<\/p><p>Ведь если бы постижение этой тайны приносило нам пользу, Творец открыл бы её нам.<\/p><p>Подходящий пример — человек со слабым зрением.<\/p><p>Солнечный свет не помогает ему видеть, пока он не поместит между светом и своими глазами тонкую завесу, ослабляющую яркость света.<\/p><p>Чем сильнее болезнь его глаз, тем более плотная завеса ему необходима.<\/p><p>А по мере улучшения зрения он становится способен видеть через всё более тонкую завесу (<button aria-expanded=\"false\" aria-label=\"Примечание 109\" class=\"note-ref\" data-note=\"109\" type=\"button\">109<\/button>).<\/p><p>Даже в вещах, которыми человек постоянно пользуется, он не постигает скрытых в них тайн мудрости.<\/p><p>Тем более он не способен понять удивительные и сокрытые пути Творца в столь глубоком вопросе, как необходимость и свобода выбора.<\/p><h3 class=\"subheading\" id=\"sub-9-2\"><strong>Примеры из устройства мира<\/strong><\/h3><p>Я приведу тебе ещё одно доказательство того, что многие тайны творения скрыты от нас.<\/p><p>Мы видим, что в большинстве ремёсел люди используют такие способы действия, о которых, если бы мы не наблюдали их собственными глазами, а лишь услышали от кого-нибудь, мы немедленно решили бы, что рассказчик лжёт.<\/p><p>Например, астролябия — измерительный прибор, которым пользуются знатоки астрономии.<\/p><p>Если бы мы не видели его собственными глазами, а кто-нибудь рассказал нам о его устройстве и форме, о том, как с его помощью можно определять движение небесных сфер, расположение звёзд, точное время каждого времени года, расстояния между различными предметами и многое другое, чего мы не знали бы без него, мы не смогли бы ясно понять и представить себе его истинное устройство.<\/p><p>То же можно увидеть и на примере более распространённых среди нас приборов, которыми пользуется множество людей.<\/p><p>Например, рычажные весы (<button aria-expanded=\"false\" aria-label=\"Примечание 110\" class=\"note-ref\" data-note=\"110\" type=\"button\">110<\/button>).<\/p><p>Если бы мы не видели их собственными глазами, нам было бы трудно поверить, что на весах, у которых одно плечо длиннее другого, можно получать точный результат взвешивания.<\/p><p>Ещё более удивительно то, что на таких весах можно взвешивать различные тяжести, пользуясь только одной гирей.<\/p><p>Ещё более распространённое устройство, действие которого вызывает удивление, — водяная мельница.<\/p><p>Как может слабое деревянное колесо, приводимое в движение водой, заставлять тяжёлый верхний жернов вращаться с постоянной скоростью?<\/p><p>Ведь если мы бросим в стремительный поток воды даже небольшой камень, не пройдёт и мгновения, как он опустится на дно.<\/p><p>А мельничный жернов во много раз тяжелее этого маленького камня.<\/p><p>При этом сила колеса, приводящего жернов в движение, значительно слабее силы стремительного водного потока (<button aria-expanded=\"false\" aria-label=\"Примечание 111\" class=\"note-ref\" data-note=\"111\" type=\"button\">111<\/button>).<\/p><p>Если поток воды не способен преодолеть тяжесть маленького камня, то как же колесо, сила которого меньше силы воды, способно преодолеть тяжесть большого жернова?<\/p><p>Если бы мы только услышали об этом от кого-нибудь, но не видели своими глазами, то сразу отвергли бы и опровергли его слова.<\/p><p>Причина этого — недостаточность наших знаний о тайнах мудрости, заключённых в устройстве творения, и слабость нашего понимания основ существования созданных вещей, их свойств, законов природы и особых сил, присущих каждой из них.<\/p><p>Если человек не обладает полным знанием даже о вещах, которые постоянно находятся перед ним, то неудивительно, что он не понимает и путей суда Благословенного Творца в вопросе необходимости и свободы выбора.<\/p><p>Ведь тайны этого вопроса несравнимо глубже и сокровеннее тайн мудрости, заключённых в упомянутых вещах.<\/p><p>Об этом недостатке знания в вопросе необходимости и свободы выбора сказал царь Давид, мир ему:<\/p><p>«Всевышний, не возгордилось сердце моё и не вознеслись глаза мои, и не стремился я к великому и недоступному для меня» (Теилим, Псалмы 131:1).<\/p><p>После того как Давид выразил своё незнание в этом вопросе, он сказал нечто подобное, также вытекающее из признания ограниченности своего понимания: что он полагается на Всевышнего и вручает Ему управление собой.<\/p><p>Как сказано:<\/p><p>«Разве не успокоил я и не утихомирил душу мою (<button aria-expanded=\"false\" aria-label=\"Примечание 112\" class=\"note-ref\" data-note=\"112\" type=\"button\">112<\/button>), словно младенец у матери своей; словно младенец — душа моя во мне» (Теилим, Псалмы 131:2).<\/p>", "subs": [{"id": "sub-9-1", "title": "Опасность чрезмерного исследования вопроса о необходимости и свободе выбора"}, {"id": "sub-9-2", "title": "Примеры из устройства мира"}]}, {"id": "chapter-9", "title": "Глава 9", "html": "<p>Человек должен хорошо понимать, ради какой цели он был создан, чтобы правильно использовать своё краткое пребывание в этом мире. Притча, показывающая правильное и неправильное использование временного пребывания человека в этом мире.<\/p><p><strong>Душа сказала:<\/strong><\/p><p>— Ты успокоил меня, приведя к пониманию того, что я не способна постичь тайну необходимости и свободы выбора из-за её тонкости и глубины. Но открой мне тайну того, какова цель моего сотворения и с каким намерением Всевышний низвёл мою душу в этот мир.<\/p><p>Объясни мне, насколько сможешь, вкратце, какие действия я совершаю по необходимости, а какие — по собственному выбору, чтобы моё поведение не уподобилось поведению одного царя, о котором мне рассказывали и который не понимал, какой образ действий принесёт ему пользу.<\/p><p>Вот эта история.<\/p><p>На одном из островов Индии находился город, жители которого решили каждый год назначать своим царём чужеземца, а по окончании года изгонять его из города, после чего он возвращался к тому положению, в котором находился до своего назначения царём.<\/p><p>Однажды они назначили царём глупого человека, который не знал их тайного намерения и не подозревал, что они собираются сделать с ним по окончании года.<\/p><p>Этот человек накапливал деньги, строил дворцы, укреплял город стенами и башнями. Он ничего не вывозил из города, а, напротив, старался привезти туда всё, что имел за его пределами: имущество, жену и детей.<\/p><p>Когда же год его царствования закончился, жители города изгнали его нагим и лишённым всего. Они отняли у него всё, что он построил и приобрёл как до прибытия в город, так и после него.<\/p><p>Покинув город, он не сохранил ничего из того, чем владел внутри города и за его пределами.<\/p><p>Он сожалел и скорбел обо всех трудах и усилиях, вложенных в строительство зданий и накопление имущества, которое досталось другим людям (<button aria-expanded=\"false\" aria-label=\"Примечание 113\" class=\"note-ref\" data-note=\"113\" type=\"button\">113<\/button>).<\/p><p>После этого жители города решили назначить царём другого чужеземца — умного и рассудительного человека.<\/p><p>Когда он стал царём, то выбрал одного из жителей города, оказал ему благодеяние и спросил, как горожане поступили с предыдущим царём.<\/p><p>Этот человек раскрыл царю их тайну и рассказал, что они собираются сделать с ним.<\/p><p>Узнав об этом, новый царь совершенно не занимался тем, чем занимался его предшественник.<\/p><p>Вместо этого он усердно трудился, вывозя всё ценное из города в другой город, где складывал все свои сокровища и драгоценности.<\/p><p>Он не поддавался влиянию величия и почестей, которые оказывали ему жители города.<\/p><p>Всё время пребывания в городе он испытывал одновременно печаль и радость.<\/p><p>С одной стороны, он печалился о том, что время его ухода из города приближается и что вывезенных им сокровищ, по его мнению, ещё слишком мало. Ведь если бы он оставался там дольше, то смог бы вывезти ещё больше.<\/p><p>С другой стороны, он радовался тому, что вскоре покинет город и поселится в месте, куда перенёс свои сокровища, чтобы пользоваться ими с пользой и удовольствием, в душевном спокойствии, безопасности и постоянстве.<\/p><p>Когда год его царствования закончился, он нисколько не тревожился о необходимости покинуть город.<\/p><p>Напротив, он поспешил сделать это с радостным сердцем и охотной душой.<\/p><p>Он одобрял собственные поступки и усилия и с постоянной радостью отправился навстречу великому благу и большому почёту.<\/p><p>Он радовался времени своего пребывания в городе и радовался времени своего ухода из него.<\/p><p>Таким образом, он достиг желаемого в обоих местах (<button aria-expanded=\"false\" aria-label=\"Примечание 114\" class=\"note-ref\" data-note=\"114\" type=\"button\">114<\/button>).<\/p><p>Такова история, которую я слышала.<\/p><p>Я опасаюсь, как бы со мной не случилось то же, что произошло с глупым царём, который трудился до прибытия в город и после него, а в конце концов потерял всё, что приобрёл в обоих местах.<\/p><p>И поскольку Всевышний по Своей милости даровал мне тебя, научи меня и объясни моё положение, расскажи всё, что знаешь о тайне цели моего прихода в этот мир, и укажи, что принесёт мне пользу.<\/p><p><strong>Разум сказал:<\/strong><\/p><p>— В приведённой тобой притче ты уже описала своё положение в мире, подобное положению тех царей, о которых рассказала.<\/p><p>Тебе уже стало ясно, что ты подобна чужеземцу в чужой стране и что время твоего ухода из этого мира приближается.<\/p><p>Поэтому ты должна поступать так, как поступил умный и рассудительный царь, и вести себя в этом мире так, как он вёл себя в том городе.<\/p><p>Если же ты поступишь иначе, мои слова не принесут тебе пользы, и мои советы не доставят тебе блага.<\/p><p><strong>Душа ответила:<\/strong><\/p><p>— Если бы я не стремилась поступать именно так, я не стала бы исследовать то, что скрыто от меня относительно моей сущности, цели моего прихода в этот мир и моих обязанностей в нём.<\/p><h3 class=\"subheading\" id=\"sub-10-1\"><strong>Цель сотворения человека<\/strong><\/h3><p>Цель сотворения человека заключается в том, чтобы испытать душу в этом мире: изберёт ли она служение Всевышнему или нет; и очистить её посредством принятия на себя бремени Торы и заповедей, чтобы благодаря этому она удостоилась высочайшей ступени в высшем духовном мире.<\/p><p>Ради этой цели Всевышний сотворил мир и всё, что в нём находится, и передал управление им человеку.<\/p><p><strong>Разум сказал:<\/strong><\/p><p>— Тайна истинной причины твоего прихода в этот мир заключается в следующем.<\/p><p>Творец создал тебя из абсолютного небытия вместе с другими сотворёнными Им духовными сущностями (<button aria-expanded=\"false\" aria-label=\"Примечание 115\" class=\"note-ref\" data-note=\"115\" type=\"button\">115<\/button>).<\/p><p>Он пожелал возвысить тебя и поднять твою ступень до уровня Своих возлюбленных, избранных и чистых, приближённых к свету Его славы, чтобы оказать тебе благо и проявить к тебе милосердие.<\/p><p>Однако ты можешь стать достойной этого только после того, как Всевышний подготовит тебя посредством трёх вещей.<\/p><ol><li>Он устранит с тебя завесу невежества и просветит тебя Своей мудростью.<\/li><li>Он испытает и проверит тебя: изберёшь ли ты служение Ему или предпочтёшь восстать против Него.<\/li><li>Он подвергнет тебя испытаниям в этом мире, возложив на тебя бремя служения Ему, чтобы поднять тебя до ступени ангелов, несущих бремя Его служения.<\/li><\/ol><p>О них сказано:<\/p><p>«Благословите Всевышнего, ангелы Его, могучие силой, исполняющие слово Его» (Теилим, Псалмы 103:20).<\/p><p>Поскольку невозможно было подготовить тебя посредством этих средств, пока ты находилась в высшем мире, Творец привёл тебя в этот мир.<\/p><p>Ради этой цели Благословенный Творец по Своей мудрости создал для тебя этот мир со всем, что в нём находится: неживой природой, растениями и животными.<\/p><p>Всё было устроено в определённом порядке и под правильным управлением, и всё приготовлено для твоей пользы.<\/p><p>Творец избрал лучшее и наиболее совершенное из четырёх элементов мира — огня, воздуха, воды и земли — и соединил их, создав совершенный дворец, который должен служить твоим жилищем.<\/p><p>Этот дворец — человеческое тело, подобное малому миру (<button aria-expanded=\"false\" aria-label=\"Примечание 116\" class=\"note-ref\" data-note=\"116\" type=\"button\">116<\/button>) по своим основам, происхождению и свойствам.<\/p><p>В этом дворце Он открыл для тебя пять ворот, ведущих во внешний мир, и поставил при них пять верных стражей, чтобы они открывали и закрывали ворота по мере необходимости.<\/p><p>Эти ворота — материальные органы, которыми пользуются духовные чувства: глаза, уши, нос, язык и руки.<\/p><p>А стражи — пять чувств, действующих посредством этих органов: зрение, слух, обоняние, вкус и осязание.<\/p><p>Посредством них ты получаешь всё необходимое для своей пользы в этом мире.<\/p><p>Творец также приготовил внутри этого дворца четырёх правителей, управляющих им, причём положение каждого из них выше положения другого.<\/p><p>Это мозг (<button aria-expanded=\"false\" aria-label=\"Примечание 117\" class=\"note-ref\" data-note=\"117\" type=\"button\">117<\/button>), сердце, печень и половые органы.<\/p><p>Кроме того, Творец установил во дворце четырёх служащих:<\/p><ul><li>притягивающую силу (118);<\/li><li>удерживающую силу;<\/li><li>переваривающую силу;<\/li><li>изгоняющую силу.<\/li><\/ul><p>Они обеспечивают сохранение чёрной желчи в селезёнке, зелёной желчи в желчном пузыре, белой слизи в мозге и лёгких, а также крови — ради поддержания существования дворца.<\/p><p>Творец разместил слуг по всему дворцу, внутри и снаружи, чтобы они обслуживали и охраняли его.<\/p><p>Эти слуги — органы человеческого тела.<\/p><p>Внутренние слуги дворца — кишечник, вены, мышцы, нервы и артерии.<\/p><p>Внешние слуги — руки, ноги, язык, зубы, ногти и подобные им органы.<\/p><p>Затем Творец приготовил во дворце то, что связывает тебя с ним, — промежуточные звенья между духовным и материальным.<\/p><p>Это текущая кровь, являющаяся вместилищем природного тепла; природное тепло, являющееся вместилищем жизненной души; и жизненная душа, являющаяся вместилищем духовной души.<\/p><p>После этого Творец тесно соединил тебя с этим дворцом и связал тебя с ним упорядоченной связью посредством Своего могущества и мудрости.<\/p><p>Всё это Творец сделал для того, чтобы три упомянутых ранее средства, подготавливающих тебя в этом мире к высшей ступени в будущем мире, могли быть применены к тебе в совершенстве.<\/p><p>Творец приготовил для твоих нужд двух советников и назначил над ними двух писцов (<button aria-expanded=\"false\" aria-label=\"Примечание 119\" class=\"note-ref\" data-note=\"119\" type=\"button\">119<\/button>).<\/p><p>Он также дал тебе служителей и помощников в количестве, необходимом для твоего пребывания в этом мире.<\/p><p>Первый из двух советников — разум, доброе начало, обучающее тебя тому, в чём заключается воля Всевышнего.<\/p><p>Второй советник — твоё вожделение, злое начало, которое соблазняет и подстрекает тебя совершать поступки, вызывающие гнев Всевышнего, твоего Бога, Который сотворил тебя.<\/p><p>Один из двух писцов записывает твои добрые поступки, совершаемые тайно и открыто, в глубине твоего сознания и на виду у других.<\/p><p>Эти поступки совершаются посредством всех обитателей упомянутого дворца: стражей, правителей, служащих, слуг, советников, служителей и помощников.<\/p><p>Второй писец записывает твои дурные поступки таким же образом, каким первый записывает добрые.<\/p><p>Служители и помощники (<button aria-expanded=\"false\" aria-label=\"Примечание 120\" class=\"note-ref\" data-note=\"120\" type=\"button\">120<\/button>) — это душевные качества, например:<\/p><p>радость и беспокойство о будущем; ликование и скорбь из-за происходящего в настоящем; память и забывчивость; мудрость и глупость; мужество и трусость; щедрость и скупость; справедливость и нечестие; стыдливость и дерзость; надежда и страх перед тем, что может произойти в будущем; любовь и ненависть; удовольствие и страдание; гордость и смирение; властность и покорность.<\/p><p>И множество подобных качеств, которыми ты пользуешься в глубине своей души.<\/p><h3 class=\"subheading\" id=\"sub-10-2\"><strong>Необходимость и свобода выбора в действиях человека<\/strong><\/h3><p>То, что человек способен приводить свои органы и силы в действие согласно собственной воле, относится к области его свободного выбора.<\/p><p>А то, что органы и силы человека вынуждены действовать согласно его воле, относится к области необходимости.<\/p><p>Благословенный Творец повелел стражам, служащим, слугам, советникам, служителям и помощникам подчиняться тебе и находиться в твоём распоряжении в течение определённого срока — до дня смерти.<\/p><p>Он повелел им исполнять особые обязанности, которые возложил на каждого из них при сотворении человека.<\/p><p>Исполнение этих обязанностей относится к действиям, которые человек совершает по необходимости, то есть к области, в которой он действует согласно постановлению Творца, а не по собственному выбору.<\/p><h3 class=\"subheading\" id=\"sub-10-3\"><strong>Предупреждение человеку о цели его пребывания в мире<\/strong><\/h3><p>Когда человек приходит в мир, Творец предупреждает его, чтобы он помнил, ради чего был создан, и направлял все свои действия к этой цели.<\/p><p>После ухода человека из мира Всевышний судит его в соответствии со степенью намерения и стремления, которые были у него при жизни, достичь цели своего сотворения.<\/p><p>Творец разрешил тебе пользоваться всеми этими силами определёнными способами и при особых условиях — ради поддержания существования твоего тела и совершения всех действий, власть над которыми Он предоставил тебе в этом мире.<\/p><p>К этим действиям относятся исполнение всех заповедей — как тех, необходимость которых понятна разуму, так и тех, необходимость которых разум не устанавливает, — а также разрешённые действия.<\/p><p>Творец предупредил тебя следующими словами:<\/p><p>— Пусть все вещи, которые Я передал в твоё распоряжение и которыми дал тебе возможность пользоваться в этом мире, не введут тебя в заблуждение, будто они сами по себе необходимы для твоего существования, совершенства или наслаждения.<\/p><p>Ведь эти вещи ничего не прибавляют тебе и ничего не отнимают у тебя.<\/p><p>Ты не получаешь от них самих ни удовольствия, ни страдания.<\/p><p>Они относятся только к твоему телу и воздействуют на него изнутри или извне.<\/p><p>Ни одна из них сама по себе не необходима для тебя.<\/p><p>По отношению к тебе они подобны плаценте по отношению к плоду или яичной скорлупе (<button aria-expanded=\"false\" aria-label=\"Примечание 121\" class=\"note-ref\" data-note=\"121\" type=\"button\">121<\/button>) по отношению к птенцу.<\/p><p>Если ты поймёшь и осознаешь, с каким намерением Я привёл тебя в этот мир и какое благо оказал тебе этим, если изберёшь служение Мне и воздержишься от неповиновения Мне при управлении всем тем, что Я предоставил в твоё распоряжение, тогда Я подниму тебя до высочайшей ступени Моих избранных и возлюбленных.<\/p><p>Я приближу тебя к Моему милосердию и облачу тебя в сияние Моей славы.<\/p><p>Но если ты предпочтёшь восстать против Меня, Я накажу тебя суровым наказанием и подвергну продолжительным мучениям.<\/p><p>Если же из-за забот о теле и связанных с ним делах, посредством которых Я испытываю тебя, чтобы узнать, изберёшь ли ты служение Мне, ты не будешь знать, как правильно пользоваться чем-либо из того, что Я предоставил тебе для служения, — знай, что Я дал тебе особого, мудрого и верного советника.<\/p><p>Он будет направлять тебя, когда ты обратишься к нему за советом, и пробуждать тебя, когда ты станешь пренебрегать своими обязанностями.<\/p><p>Этот советник — разум.<\/p><p>Советуйся с ним во всех своих делах, поскольку он укажет тебе, как использовать все имеющиеся в твоём распоряжении средства для служения Мне.<\/p><p>Благодаря этому твои дурные качества превратятся в достойные похвалы.<\/p><p>Подобно тому как искусный врач использует на пользу телу лекарства, которые обычно могут причинять вред, например ядовитые вещества и другие сильнодействующие средства.<\/p><p>Если ты будешь поступать так, укрепишь власть разума и станешь прислушиваться к его советам, писец добрых дел запишет все твои разрешённые действия, которые сами по себе не являются ни заповедями, ни нарушениями, в число твоих добрых дел (<button aria-expanded=\"false\" aria-label=\"Примечание 122\" class=\"note-ref\" data-note=\"122\" type=\"button\">122<\/button>).<\/p><p>Они прибавятся к твоим заслугам, и все находящиеся в твоём распоряжении будут помогать тебе служить Мне.<\/p><p>Но если ты восстанешь против советов разума и последуешь совету второго советника — злого начала, Сатана, противостоящего разуму во всех его делах, — и станешь использовать всё, что находится в твоём распоряжении, согласно его советам, тогда твои хорошие качества превратятся в дурные.<\/p><p>Это подобно глупому врачу, который убивает человека полезными лекарствами, потому что не понимает, как правильно ими пользоваться.<\/p><p>Тогда писец дурных поступков запишет и все твои разрешённые действия в число твоих злых дел, и они прибавятся к ним.<\/p><p>Я передал власть в твои руки, чтобы все твои помощники, служители и слуги, а также всё, с чем ты соприкасаешься, подчинялись твоей воле и исполняли твои желания.<\/p><p>И тебе предоставлен выбор, чтобы посредством них увеличить свою радость и ликование.<\/p><p><strong>Разум продолжает:<\/strong><\/p><p>— То, что я сказал тебе о включении Творцом разрешённых действий в число добрых или дурных поступков, является справедливым с Его стороны.<\/p><p>Ведь в глубине своего сознания, в своих намерениях и внутреннем мире ты избрала либо неповиновение Ему вместо служения, либо служение Ему вместо неповиновения.<\/p><p>И свои разрешённые действия ты направляешь к избранной тобой цели.<\/p><p>Для Него явное и скрытое одинаково открыты.<\/p><p>Он воздаёт тебе награду или наказание в соответствии с мыслями и намерениями, которые видит в глубине твоего сознания, даже если они скрыты от людей.<\/p><p>Доказательство справедливости такого суда заключается в следующем.<\/p><p>Ты видишь, что судья выносит решение в соответствии с тем, что ему становится известно — из показаний свидетелей или посредством собственного наблюдения.<\/p><p>Если бы он мог узнать мысли человека, то, несомненно, судил бы и в соответствии с ними.<\/p><p>Следовательно, Благословенный Творец, Которому одинаково известно явное и скрытое, как сказано:<\/p><p>«Сокрытое принадлежит Всевышнему, Богу нашему» (Дварим, Второзаконие 29:28),<\/p><p>по справедливости судит согласно Своему знанию.<\/p><p>Когда Творец пожелает пробудить тебя к раскаянию и укорить за твои грехи, Он повелит одному из служителей перестать служить тебе.<\/p><p>Тогда заболеет соответствующий орган твоего тела, или несколько органов, или все они, и тело будет страдать от болезни и боли до определённого времени.<\/p><p>Если ты пробудишься и вернёшься к Нему, Творец повелит этому органу вновь служить тебе, исцелит твоё тело и вернёт его в прежнее состояние.<\/p><p>Как сказано:<\/p><p>«Безумцы из-за пути своего преступления и из-за беззаконий своих страдают. Всякую пищу отвергает душа их, и приближаются они к вратам смерти. И воззвали они к Всевышнему в бедствии своём, и от страданий их Он спас их. Послал Он слово Своё и исцелил их, и избавил от погибели» (Теилим, Псалмы 107:17–20).<\/p><p>Когда дни твоего испытания подойдут к концу, Благословенный Творец повелит всем упомянутым стражам, правителям, служащим, слугам, советникам, служителям и помощникам отойти от тебя.<\/p><p>Тогда разорвутся связи и средства соединения между тобой и твоим телом.<\/p><p>Ты вернёшься в своё прежнее состояние.<\/p><p>Тело же останется без движения и ощущений и также возвратится к своему прежнему состоянию.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«И возвратится прах в землю, как был, а дух возвратится к Богу, Который дал его» (Коэлет, Экклезиаст 12:7).<\/p><p>Тебе покажут книги записей, в которых записаны твои поступки, мысли и желания, а также всё, что ты избирала и чем занимала себя в своём мире.<\/p><p>И в соответствии с этим будет назначено воздаяние.<\/p><p>Творец уже предупредил тебя обо всём, что я рассказал, и предостерёг посредством Своих посланников, пророков и Своей истинной Торы.<\/p><p>Как сказал мудрый царь Шломо:<\/p><p>«Приклони ухо твоё и слушай слова мудрых (<button aria-expanded=\"false\" aria-label=\"Примечание 123\" class=\"note-ref\" data-note=\"123\" type=\"button\">123<\/button>), и сердце своё обрати к моему знанию. Ибо приятно будет, если сохранишь их внутри себя... Разве не написал я тебе наставления в советах и знании, чтобы сообщить тебе достоверность слов истины, чтобы ты мог отвечать словами истины пославшему тебя?» (Мишлей, Притчи 22:17–21).<\/p>", "subs": [{"id": "sub-10-1", "title": "Цель сотворения человека"}, {"id": "sub-10-2", "title": "Необходимость и свобода выбора в действиях человека"}, {"id": "sub-10-3", "title": "Предупреждение человеку о цели его пребывания в мире"}]}, {"id": "chapter-10", "title": "Глава 10", "html": "<p>Человек должен служить Всевышнему всеми своими душевными качествами — как достойными похвалы, так и порицаемыми. Когда он использует каждое из этих качеств в надлежащем месте и в подходящее время, все его качества становятся достойными похвалы.<\/p><p>Примеры правильного использования душевных качеств.<\/p><p><strong>Душа сказала:<\/strong><\/p><p>— Я поняла то, что ты сказал, и внимательно выслушала всё, что ты упомянул. Теперь я прошу тебя объяснить мне, где и когда следует пользоваться моими хорошими качествами, а где и когда — дурными, чтобы меня хвалили за мои качества и признавали, что я использую их в надлежащем месте и в подходящее время.<\/p><p><strong>Разум объясняет:<\/strong><\/p><p>— Твои душевные качества многочисленны. Я кратко упомяну те из них, которые сейчас приходят мне на ум.<\/p><h3 class=\"subheading\" id=\"sub-11-1\"><strong>Радость и печаль<\/strong><\/h3><p>Среди твоих качеств есть два противоположных друг другу: радость и печаль.<\/p><p>Радость следует проявлять тогда, когда ты уверена, что полученное удовольствие будет вечным (<button aria-expanded=\"false\" aria-label=\"Примечание 124\" class=\"note-ref\" data-note=\"124\" type=\"button\">124<\/button>), что к нему не примешается печаль и что оно сохранится во всей своей полноте. Тогда ты должна пробудить в себе чувство радости.<\/p><p>Печаль же следует проявлять тогда, когда с тобой происходит нечто такое, что будет постоянно причинять тебе страдание, и у тебя нет возможности отдалить это от себя или каким-либо образом избежать его. Тогда ты должна пробудить в себе чувство печали и воспользоваться им.<\/p><h3 class=\"subheading\" id=\"sub-11-2\"><strong>Страх и надежда<\/strong><\/h3><p>Среди твоих качеств есть ещё два: страх и надежда относительно того, что может произойти в будущем.<\/p><p>Страх уместен тогда, когда ты совершаешь поступки (<button aria-expanded=\"false\" aria-label=\"Примечание 125\" class=\"note-ref\" data-note=\"125\" type=\"button\">125<\/button>), которые приведут тебя к состоянию, причиняющему страдание, последствия которого будут для тебя дурными и от которого у тебя не будет ни сил, ни возможности избавиться.<\/p><p>Надежда же уместна тогда, когда ты стараешься совершать поступки, которые принесут тебе добро и обещают такое несомненное блаженство, что никакое препятствие не сможет помешать его достижению и ничто не сможет отделить тебя от него.<\/p><p>Такие поступки — исполнение заповедей, которые Всевышний повелел соблюдать, поскольку они приводят к благому исходу.<\/p><h3 class=\"subheading\" id=\"sub-11-3\"><strong>Мужество и мягкость сердца<\/strong><\/h3><p>Среди твоих качеств есть ещё два: мужество и мягкость сердца.<\/p><p>Мужество следует проявлять тогда, когда ты противостоишь врагам Всевышнего. В таком случае ты должна бороться с ними, переносить любые страдания и выдерживать любые испытания ради исполнения воли Благословенного Творца и Его благочестивых служителей.<\/p><p>Как сказано:<\/p><p>«Ведь ради Тебя убивают нас весь день, считают нас овцами, предназначенными на заклание» (Теилим, Псалмы 44:23).<\/p><p>И сказано:<\/p><p>«Пусть праведник ударит меня (<button aria-expanded=\"false\" aria-label=\"Примечание 126\" class=\"note-ref\" data-note=\"126\" type=\"button\">126<\/button>) — это милость, и пусть обличает меня» (Теилим, Псалмы 141:5).<\/p><p>Мягкость сердца следует проявлять при общении с любящими Всевышнего и служащими Ему.<\/p><p>Ты не должна бороться с ними и восставать против того, кто делает тебе замечание ради твоего блага.<\/p><p>Как сказала пророчица Хульда царю Йошияу:<\/p><p>«За то, что смягчилось сердце твоё и ты смирился перед Всевышним» (Млахим II, Вторая книга Царей 22:19).<\/p><h3 class=\"subheading\" id=\"sub-11-4\"><strong>Стыдливость и дерзость<\/strong><\/h3><p>Среди твоих качеств есть ещё два: стыдливость и дерзость.<\/p><p>Стыд следует испытывать тогда, когда ты нарушаешь волю Творца, оказывающего тебе благодеяния, используя для этого само благо, которое Он тебе даровал.<\/p><p>Ты делаешь это перед Ним, в Его присутствии, в то время как Он предостерегает тебя посредством Своих обещаний добра и наказания, а также посредством обличений Своих пророков.<\/p><p>Как сказано:<\/p><p>«Сын человеческий, расскажи дому Израиля о Храме, и пусть они устыдятся своих грехов» (<button aria-expanded=\"false\" aria-label=\"Примечание 127\" class=\"note-ref\" data-note=\"127\" type=\"button\">127<\/button>) (Йехезкель, Иезекииль 43:10).<\/p><p>И сказано:<\/p><p>«Боже мой! Стыжусь и смущаюсь поднять лицо моё к Тебе, Боже мой, ибо беззакония наши умножились выше головы, и вина наша возросла до небес» (Эзра 9:6).<\/p><p>Дерзость же следует проявлять тогда, когда необходимо обличать нечестивцев, нарушителей и тех, кто противится истине.<\/p><p>Также она уместна, когда необходимо призывать людей к милосердию, предостерегать их от несправедливости, пристыжать грешников и обличать как младших, так и старших.<\/p><p>Как сказано:<\/p><p>«Я сделал лицо моё подобным кремню и знаю, что не буду посрамлён» (Йешаяу, Исаия 50:7).<\/p><h3 class=\"subheading\" id=\"sub-11-5\"><strong>Гнев и удовлетворённость<\/strong><\/h3><p>Есть также два качества: гнев и удовлетворённость.<\/p><p>Гнев уместен тогда, когда люди отклоняются от пути истины и справедливого суда, когда ложь одерживает верх над истиной и людьми истины.<\/p><p>Удовлетворённость же уместна тогда, когда всё происходит надлежащим образом, всё устроено правильно и люди во всех своих делах следуют путями истины.<\/p><h3 class=\"subheading\" id=\"sub-11-6\"><strong>Милосердие и жестокость<\/strong><\/h3><p>Есть также два качества: милосердие и жестокость.<\/p><p>Милосердие следует проявлять по отношению к нуждающимся, бедным, больным и благочестивым служителям Всевышнего, отстранившимся от мирской суеты.<\/p><p>Также следует проявлять милосердие к тому, кто не знает путей, ведущих к его благу, — такому человеку необходимо давать советы и направлять его.<\/p><p>Милосердие уместно и по отношению к тому, кто не способен самостоятельно управлять своими делами; к пленнику, находящемуся во власти врага; к человеку, который прежде обладал многими благами, но потерял их, например к разорившемуся богачу и подобным ему людям.<\/p><p>Оно также уместно по отношению к тому, кто раскаивается в своих грехах и плачет о совершённых проступках из страха перед наказанием Всевышнего.<\/p><p>Жестокость же уместна тогда, когда необходимо наказать нечестивцев и совершить возмездие над врагами.<\/p><p>Как сказано:<\/p><p>«И пусть не пощадит его глаз твой, и не жалей его, и не укрывай его» (Дварим, Второзаконие 13:9).<\/p><h3 class=\"subheading\" id=\"sub-11-7\"><strong>Гордость и смирение<\/strong><\/h3><p>Есть также два качества: гордость и смирение.<\/p><p>Гордость и возвышенность духа уместны тогда, когда ты сталкиваешься с отрицающими Всевышнего и грешниками.<\/p><p>Не унижай себя и не склоняйся перед ними, чтобы не создалось впечатление, будто ты оправдываешь их и склоняешься к их испорченным взглядам.<\/p><p>Напротив, проявляй по отношению к ним гордость и твёрдость духа, чтобы показать своё несогласие с их взглядами и своё противодействие им.<\/p><p>Так, как тебе известно, Мордехай отказался склониться перед Аманом.<\/p><p>Смирение же следует проявлять по отношению к благочестивому человеку с чистым сердцем, боящемуся Всевышнего, мудрому в Торе и занимающемуся служением Ему.<\/p><p>Также следует проявлять смирение по отношению к тому, кто оказал тебе добро и милость, за которые ты должна ему отплатить.<\/p><p>Тем более ты должна проявлять смирение перед Благословенным Творцом, Чьи благодеяния столь велики и многочисленны, что ты не в состоянии воздать Ему за них.<\/p><p>Кроме того, смирение необходимо для того, чтобы добровольно и с любовью принимать постановления Всевышнего и Его суд.<\/p><p>Как сказано:<\/p><p>«Или тогда смирится их необрезанное сердце, и тогда они искупят свою вину» (Ваикра, Левит 26:41).<\/p><h3 class=\"subheading\" id=\"sub-11-8\"><strong>Любовь и ненависть<\/strong><\/h3><p>Есть также два качества: любовь и ненависть.<\/p><p>Любовь следует проявлять по отношению к тем, кто, подобно тебе, считает необходимым служить Всевышнему, а также к тому, кто побуждает тебя совершать поступки, которые принесут тебе радость в будущем мире.<\/p><p>Ненависть же уместна по отношению к тому, кто нарушает волю Всевышнего, восстаёт против людей истины и побуждает тебя совершать поступки, вызывающие гнев твоего Творца.<\/p><p>Как сказано:<\/p><p>«Оставляющие Тору восхваляют нечестивца, а соблюдающие Тору противостоят им» (Мишлей, Притчи 28:4).<\/p><h3 class=\"subheading\" id=\"sub-11-9\"><strong>Щедрость и скупость<\/strong><\/h3><p>Есть также два качества: щедрость и скупость.<\/p><p>Щедрость следует проявлять, заботясь о том, чтобы всё было устроено надлежащим образом, давая деньги и обучая мудрости каждого человека, обладающего хорошими качествами, в соответствии с тем, что ему подобает.<\/p><p>Как сказано:<\/p><p>«Не отказывай в добре тому, кому оно полагается, когда рука твоя в силах сделать это» (Мишлей, Притчи 3:27).<\/p><p>И сказано:<\/p><p>«Пусть разольются источники твои наружу» (Мишлей, Притчи 5:16).<\/p><p>Скупость же следует проявлять по отношению к жестоким и глупым людям.<\/p><p>Как сказано:<\/p><p>«Поучающий насмешника навлекает на себя позор, а обличающий нечестивца — бесчестье» (Мишлей, Притчи 9:7).<\/p><p>Также она уместна по отношению к тем, кто не осознаёт ни собственного ничтожества, ни великой ценности получаемых благ и проявляет неблагодарность.<\/p><p>Как сказали наши мудрецы:<\/p><p>«Всякий, кто оказывает добро тому, кто его не ценит, подобен человеку, бросающему камень Меркулису».<\/p><h3 class=\"subheading\" id=\"sub-11-10\"><strong>Лень и усердие<\/strong><\/h3><p>Есть также два качества: лень и усердие.<\/p><p>Лень уместна по отношению к животным страстям, удовольствия от которых проходят, оставляя человеку позор в этом мире и наказание за них в будущем мире.<\/p><p>Усердие же следует проявлять в делах, посредством которых человек стремится исполнить волю Благословенного Всевышнего и которые принесут ему духовное наслаждение в будущем мире.<\/p><p>Как сказал царь Давид, мир ему:<\/p><p>«Я поспешил и не медлил соблюдать Твои заповеди» (Теилим, Псалмы 119:60).<\/p><p><strong>Автор завершает:<\/strong><\/p><p>— Того, что я упомянул в этих вратах, достаточно для человека, который избирает прямой путь, ищет истину ради самой истины и стремится к мудрости ради самой мудрости, а не ради какой-либо иной цели.<\/p><p>И да поможет нам Всевышний по Своему милосердию достичь путей служения Ему. Амен.<\/p>", "subs": [{"id": "sub-11-1", "title": "Радость и печаль"}, {"id": "sub-11-2", "title": "Страх и надежда"}, {"id": "sub-11-3", "title": "Мужество и мягкость сердца"}, {"id": "sub-11-4", "title": "Стыдливость и дерзость"}, {"id": "sub-11-5", "title": "Гнев и удовлетворённость"}, {"id": "sub-11-6", "title": "Милосердие и жестокость"}, {"id": "sub-11-7", "title": "Гордость и смирение"}, {"id": "sub-11-8", "title": "Любовь и ненависть"}, {"id": "sub-11-9", "title": "Щедрость и скупость"}, {"id": "sub-11-10", "title": "Лень и усердие"}]}];
const notes=JSON.parse(document.getElementById('note-data').textContent);
let index=0,fs=18,searchHits=[],hit=-1;const $=id=>document.getElementById(id),content=$('content');
function closeMenus(){ $('drawer').hidden=true;$('scrim').hidden=true;$('subpanel').hidden=true; }
function makeButton(label,fn,active){const b=document.createElement('button');b.textContent=label;if(active)b.className='active';b.onclick=fn;return b;}
function nav(){for(const id of ['desktop-nav','drawer']){const n=$(id);n.replaceChildren();chapters.forEach((ch,i)=>n.appendChild(makeButton(ch.title,()=>show(i),i===index)));}const p=$('subpanel');p.replaceChildren();chapters[index].subs.forEach(sub=>p.appendChild(makeButton(sub.title,()=>{closeMenus();document.getElementById(sub.id)?.scrollIntoView({behavior:'smooth',block:'start'});})));if(!chapters[index].subs.length)p.textContent='Нет подразделов';}
function show(i,fromSearch=false){if(i<0||i>=chapters.length)return;index=i;closeMenus();$('current-title').textContent=chapters[i].title==='Введение'?'Врата служения Всевышнему — Введение':'Врата служения Всевышнему — '+chapters[i].title;$('chapter-title').textContent=chapters[i].title;content.innerHTML=chapters[i].html;$('prev').disabled=i===0;$('next').disabled=i===chapters.length-1;nav();if(fromSearch)paintCurrentChapter();else {globalPos=-1;paintCurrentChapter();$('count').textContent=globalHits.length?`0/${globalHits.length}`:'0';}window.scrollTo({top:0,behavior:'instant'});}
$('menu').onclick=()=>{const closed=$('drawer').hidden;closeMenus();$('drawer').hidden=!closed;$('scrim').hidden=!closed;};$('subtoggle').onclick=()=>{const closed=$('subpanel').hidden;closeMenus();$('subpanel').hidden=!closed;};$('scrim').onclick=closeMenus;$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);
$('larger').onclick=()=>{fs=Math.min(27,fs+1);content.style.fontSize=fs+'px';};$('smaller').onclick=()=>{fs=Math.max(14,fs-1);content.style.fontSize=fs+'px';};$('night').onclick=()=>document.body.classList.toggle('dark');
content.addEventListener('click',e=>{const btn=e.target.closest('.note-ref');if(btn){const n=btn.dataset.note;const next=btn.nextElementSibling;if(next&&next.classList.contains('inline-note')){next.remove();btn.setAttribute('aria-expanded','false');return;}content.querySelectorAll('.inline-note').forEach(x=>x.remove());content.querySelectorAll('.note-ref[aria-expanded=true]').forEach(x=>x.setAttribute('aria-expanded','false'));const panel=document.createElement('span');panel.className='inline-note';panel.innerHTML='<button class="note-close" aria-label="Закрыть примечание">×</button>'+(notes[n]||'Примечание отсутствует');btn.insertAdjacentElement('afterend',panel);btn.setAttribute('aria-expanded','true');return;}if(e.target.closest('.note-close')){const panel=e.target.closest('.inline-note');panel.previousElementSibling?.setAttribute('aria-expanded','false');panel.remove();}});
let globalHits=[],globalPos=-1;
function collectHits(){
  globalHits=[];const q=$('search').value.trim().toLocaleLowerCase();
  if(!q)return;
  chapters.forEach((ch,ci)=>{
    const holder=document.createElement('div');holder.innerHTML=ch.html;
    const walker=document.createTreeWalker(holder,NodeFilter.SHOW_TEXT);
    while(walker.nextNode()){
      const n=walker.currentNode;
      if(n.parentElement.closest('script,button,mark,.inline-note'))continue;
      const str=n.textContent.toLocaleLowerCase();let from=0,pos;
      while((pos=str.indexOf(q,from))!==-1){globalHits.push(ci);from=pos+q.length;}
    }
  });
}
function paintCurrentChapter(){
  content.querySelectorAll('mark[data-search]').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  content.normalize();searchHits=[];
  const q=$('search').value.trim().toLocaleLowerCase();if(!q)return;
  const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT),nodes=[];
  while(walker.nextNode()){
    const n=walker.currentNode;
    if(n.parentElement.closest('script,button,mark,.inline-note'))continue;
    if(n.textContent.toLocaleLowerCase().includes(q))nodes.push(n);
  }
  for(const n of nodes){
    const s=n.textContent,lower=s.toLocaleLowerCase();let at=0,frag=document.createDocumentFragment(),pos;
    while((pos=lower.indexOf(q,at))!==-1){
      frag.append(document.createTextNode(s.slice(at,pos)));
      const m=document.createElement('mark');m.dataset.search='1';m.textContent=s.slice(pos,pos+q.length);
      frag.append(m);searchHits.push(m);at=pos+q.length;
    }
    frag.append(document.createTextNode(s.slice(at)));n.replaceWith(frag);
  }
  if(globalPos>=0&&globalHits[globalPos]===index){
    let local=0;for(let j=0;j<globalPos;j++)if(globalHits[j]===index)local++;
    if(searchHits[local])searchHits[local].classList.add('search-active');
  }
}
function updateSearch(jump=true){
  collectHits();globalPos=-1;paintCurrentChapter();
  $('count').textContent=globalHits.length?`0/${globalHits.length}`:'0';
  if(jump&&globalHits.length)nextHit();
}
function nextHit(){
  if(!globalHits.length)return;
  globalPos=(globalPos+1)%globalHits.length;
  const chapter=globalHits[globalPos];
  if(chapter!==index)show(chapter,true);
  else paintCurrentChapter();
  $('count').textContent=`${globalPos+1}/${globalHits.length}`;
  const active=content.querySelector('mark.search-active');
  if(active)active.scrollIntoView({behavior:'smooth',block:'center'});
}
$('search').addEventListener('input',()=>updateSearch(true));$('searchnext').onclick=()=>{if(!globalHits.length)updateSearch(true);else nextHit();};show(0);
</script></body></html>
