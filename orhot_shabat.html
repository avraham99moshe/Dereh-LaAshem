const chapters=[{"title": "Мелаха «Бишуль» (приготовление пищи)", "body": "<h1 id=\"part-2\"><font size=\"6\">Мелаха\n\t\t\t\t\t«Бишуль» (приготовление пищи)<\/font><\/h1><p><font size=\"3\">Рамбам пишет\n\t\t\t\t\tв 9-й главе «Законов Шаббата»: «Как\n\t\t\t\t\tтот, кто варит пищу или нагревает\n\t\t\t\t\tводу, так и тот, кто печёт хлеб, — всё\n\t\t\t\t\tэто одно и то же понятие».<\/font><\/p><p><font size=\"3\">Запрет бишуля\n\t\t\t\t\tотносится не только к продуктам\n\t\t\t\t\tпитания, но также и к другим вещам,\n\t\t\t\t\tсвойства которых изменяются под\n\t\t\t\t\tвоздействием тепла огня. Ведь мы\n\t\t\t\t\tнаходим это в Мишкане — в варке\n\t\t\t\t\tкрасителей: варили вещества, из\n\t\t\t\t\tкоторых приготовляли краску для\n\t\t\t\t\tработ Мишкана.<\/font><\/p><p><font size=\"3\">И так же\n\t\t\t\t\tразъясняется у Рамбама там, в галахе\n\t\t\t\t\t6, что тот, кто расплавляет металл или\n\t\t\t\t\tрастапливает воск, совершает\n\t\t\t\t\tпроизводную мелахи «Мевашель» и\n\t\t\t\t\tобязан.<\/font><\/p><p><font size=\"3\"><b>Приготовление\n\t\t\t\t\tна огне и на солнце.<\/b><\/font><\/p><p><font size=\"3\">В Гемаре,\n\t\t\t\t\tШаббат, лист 39, разъясняется, что\n\t\t\t\t\tразрешено готовить посредством\n\t\t\t\t\tсолнечного тепла, то есть положить\n\t\t\t\t\tпищу на солнце, чтобы она приготовилась.\n\t\t\t\t\tИ в этом вообще нет запрета, даже\n\t\t\t\t\tмудрецов. Причина в том, что это не\n\t\t\t\t\tявляется обычным способом приготовления\n\t\t\t\t\tпищи — см. Раши там.<\/font><\/p><p><font size=\"3\">И действие\n\t\t\t\t\tприготовления посредством солнечного\n\t\t\t\t\tтепла совершенно не подобно мелахе\n\t\t\t\t\tбишуль, запрещённой Торой, поскольку\n\t\t\t\t\tоснова мелахи бишуль — приготовление\n\t\t\t\t\tна огне или посредством «тольдот\n\t\t\t\t\tа-эш», то есть вещей, которые получили\n\t\t\t\t\tсвоё тепло от огня и настолько горячие,\n\t\t\t\t\tчто способны приготовить другие\n\t\t\t\t\tвещи.<\/font><\/p><p><font size=\"3\">Например,\n\t\t\t\t\tгорячая вода, находящаяся в сосуде,\n\t\t\t\t\tв котором она была сварена: запрещено\n\t\t\t\t\tкласть в неё пищу из-за запрета бишуля,\n\t\t\t\t\tдаже если эта вода уже не находится\n\t\t\t\t\tна огне, поскольку её тепло происходит\n\t\t\t\t\tот огня, и поэтому такая горячая вода\n\t\t\t\t\tназывается «тольдот а-эш».<\/font><\/p><p><font size=\"3\">И хотя нет\n\t\t\t\t\tзапрета готовить посредством самого\n\t\t\t\t\tсолнечного тепла, тем не менее мудрецы\n\t\t\t\t\tпостановили не готовить посредством\n\t\t\t\t\t«тольдот хама», то есть вещей, которые\n\t\t\t\t\tполучили своё тепло от солнца.\n\t\t\t\t\tНапример, запрещено, согласно\n\t\t\t\t\tпостановлению мудрецов, готовить в\n\t\t\t\t\tводе, нагретой солнцем.<\/font><\/p><p><font face=\"Times New Roman, serif\"><font size=\"3\">Причина\n\t\t\t\t\tэтого постановления заключается в\n\t\t\t\t\tтом, что люди могут ошибиться и\n\t\t\t\t\tразрешить также приготовление\n\t\t\t\t\tпосредством «тольдот а-эш», и в\n\t\t\t\t\tрезультате будут нарушать запрет\n\t\t\t\t\tТоры.<\/font><\/font><\/p><h3 id=\"part-3\"><font size=\"3\">Бишуль\n— приготовление пищи<\/font><\/h3><p><strong><font size=\"3\">Приготовление\nна огне и с помощью электрических\nнагревательных элементов<\/font><\/strong><\/p><p><strong><font size=\"3\">1.<\/font><\/strong><font size=\"3\">\nЗапрещено Торой готовить в Шаббат на\nогне и посредством его производных\n(«тольдот а-эш»), и нет различия между\nоткрытым и закрытым огнём. Электрические\nприборы, в которых имеются нагревательные\nэлементы, раскаляющиеся и краснеющие,\nрассматриваются как сам огонь, и\nприготовление с их помощью запрещено\nТорой.<\/font><\/p><p><font size=\"3\">Следует знать,\nчто всё, что будет написано в этой книге\nотносительно использования электрических\nприборов, относится к случаю, когда нет\nопасения нарушения запрета, связанного\nс производством электричества в Шаббат.<\/font><\/p><h3 id=\"part-4\"><font size=\"3\">Приготовление\nв кли ришон, снятом с огня<\/font><\/h3><p><strong><font size=\"3\">2.<\/font><\/strong><font size=\"3\">\nВ воде или других горячих жидкостях,\nтемпература которых достигает уровня\n«яд соледет бо», если они были сняты с\nогня, но всё ещё находятся в сосуде, в\nкотором варились, и не были перелиты в\nдругой сосуд, запрещено готовить,\nпоскольку их статус подобен статусу\n«тольдот а-ор» — производного огня.<\/font><\/p><p><font size=\"3\">Поэтому, если\nкастрюлю с супом сняли с огня, запрещено\nкласть в неё, пока её температура\nдостигает уровня «яд соледет бо»,\nпродукты, в отношении которых существует\nзапрет бишуля.<\/font><\/p><h3 id=\"part-5\"><font size=\"3\">Приготовление\nпосредством солнечного тепла<\/font><\/h3><p><strong><font size=\"3\">3.<\/font><\/strong><font size=\"3\">\nРазрешено готовить непосредственно\nпосредством солнечного тепла. Поэтому\nразрешено положить неприготовленный\nпродукт на солнце, чтобы он приготовился.<\/font><\/p><h3 id=\"part-6\"><font size=\"3\">Приготовление\nпосредством «тольдот хама»<\/font><\/h3><p><strong><font size=\"3\">4.<\/font><\/strong><font size=\"3\">\nМудрецы запретили готовить посредством\n«тольдот хама» — производных солнечного\nтепла. То есть на предмет, нагревшийся\nот солнца, нельзя класть пищу с целью\nеё приготовления.<\/font><\/p><p><font size=\"3\">Относительно\nиспользования солнечного водонагревателя\n(«дуд шемеш») в Шаббат см. далее, пункты\n102–104.<\/font><\/p><h3 id=\"part-7\"><font size=\"3\">Электрический\nводонагреватель<\/font><\/h3><p><strong><font size=\"3\">5.<\/font><\/strong><font size=\"3\">\nГотовить в электрическом водонагревателе\nзапрещено Торой. См. далее, глава 2, пункты\n27–32, где приведены подробные законы,\nкасающиеся использования такого\nводонагревателя.<\/font><\/p><h3 id=\"part-8\"><font size=\"3\">Приготовление\nв микроволновой печи<\/font><\/h3><p><strong><font size=\"3\">6.<\/font><\/strong><font size=\"3\">\nНекоторые авторитеты писали, что\nприготовление в микроволновой печи\nзапрещено Торой. И хотя здесь нет огня\nили «тольдот а-эш», тем не менее это\nявляется обычным способом приготовления\nпищи.<\/font><\/p><h3 id=\"part-9\"><font size=\"3\">Продукт,\nпригодный для еды и без приготовления<\/font><\/h3><p><strong><font size=\"3\">7.<\/font><\/strong><font size=\"3\">\nТот, кто готовит в Шаббат, обязан за\nнарушение запрета даже в том случае,\nесли продукт пригоден для употребления\nи без приготовления. Поэтому тот, кто\nварит фрукты, обязан, даже если эти\nфрукты можно есть сырыми, поскольку\nприготовление улучшает их.<\/font><\/p><p><font size=\"3\">По этой же причине\nтот, кто нагревает воду и доводит её до\nсостояния приготовления, обязан.<\/font><\/p><h3 id=\"part-10\"><font size=\"3\">Количество\nпищи, в отношении которого действует\nзапрет приготовления<\/font><\/h3><p><strong><font size=\"3\">8.<\/font><\/strong><font size=\"3\">\nТот, кто приготовил в Шаббат пищу в\nколичестве «ке-грогерет» (объём сушёного\nинжира), обязан принести хатат. Тем не\nменее Тора запрещает готовить даже\nколичество меньше «ке-грогерет», согласно\nзакону о «хаци шиур» — количестве меньше\nустановленной меры, которое также\nзапрещено Торой. См. примечание.<\/font><\/p><h3 id=\"part-11\"><font size=\"3\">Сушка\nодежды<\/font><\/h3><p><strong><font size=\"3\">9.<\/font><\/strong><font size=\"3\">\nНельзя помещать мокрую одежду напротив\nогня или на радиатор в таком месте, где\nона может нагреться до температуры «яд\nсоледет бо», поскольку тепло приводит\nк приготовлению воды, впитавшейся в\nодежду.<\/font><\/p><p><font size=\"3\">И хотя вода\nиспаряется, перестаёт существовать и\nчеловек ею не пользуется, тем не менее\n«бишуль ле-ибуд» — приготовление,\nрезультат которого не используется, —\nтакже запрещён.<\/font><\/p><p><strong><font size=\"3\">10.<\/font><\/strong><font size=\"3\">\nТакже человек, одежда которого промокла,\nдолжен остерегаться стоять рядом с\nпечью таким образом, что вода, впитавшаяся\nв его одежду, может нагреться до\nтемпературы «яд соледет бо».<\/font><\/p><p><font size=\"3\"><b>11.<\/b> Подобным\nобразом следует воздерживаться от\nпомещения влажного полотенца на\nводонагреватель и тому подобное, даже\nесли при этом нет запрета «атмана»\n(укутывания), поскольку тепло приводит\nк приготовлению воды, впитавшейся в\nполотенце.<\/font><\/p><h3 id=\"part-12\"><font size=\"3\">Разогрев\nзамороженной халы<\/font><\/h3><p><strong><font size=\"3\">12.<\/font><\/strong><font size=\"3\">\nТот, кто достаёт замороженную халу из\nморозильника и хочет разморозить её,\nчтобы съесть: если на хале имеется лёд,\nзапрещено помещать её в такое место,\nгде она может нагреться до температуры\n<\/font><strong><font size=\"3\">«яд соледет\nбо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Причина в том,\nчто тепло растапливает лёд, вода увлажняет\nхалу, а затем эта вода нагревается до\nтех пор, пока не испарится. Человеку\nжелательно такое «приготовление»,\nпоскольку благодаря этому хала не\nостаётся мокрой. Это подобно сушке\nодежды, которая была запрещена в\nпредыдущих пунктах.<\/font><\/p><p><font size=\"3\">Если же человек\nхочет сначала удалить лёд с халы — см.\nпримечание.<\/font><\/p><p><font size=\"3\">Если на хале <\/font><strong><font size=\"3\">нет\nльда<\/font><\/strong><font size=\"3\">,\nразрешается положить её сверху на\nводонагреватель (<\/font><strong><font size=\"3\">михам<\/font><\/strong><font size=\"3\">),\nстоящий на огне. Однако нельзя класть\nеё непосредственно на металлический\nлист (<\/font><strong><font size=\"3\">пах<\/font><\/strong><font size=\"3\">)\nили на электрическую плату (<\/font><strong><font size=\"3\">плата\nхашмалит<\/font><\/strong><font size=\"3\">)\nиз-за запрета первоначального помещения\nпищи для разогрева, как будет разъяснено\nдалее, в главе 2, пунктах 61–63.<\/font><\/p><h3 id=\"part-13\"><font size=\"3\">Ускорение\nприготовления<\/font><\/h3><p><strong><font size=\"3\">13.<\/font><\/strong><font size=\"3\">\nЕсли пища ещё не полностью приготовлена\nи находится на огне таким образом, что\nчерез определённое время она должна\nполностью приготовиться, запрещено\nсовершать какие-либо действия, ускоряющие\nеё приготовление.<\/font><\/p><p><font size=\"3\">Поэтому запрещено\nпридвигать кастрюлю ближе к огню или\nставить её на более сильное пламя. Даже\nесли огонь покрыт и кастрюля стоит на\nпокрытии, запрещено передвигать её\nближе к месту, где температура выше.<\/font><\/p><p><font size=\"3\">По этой же причине\nзапрещено накрывать кастрюлю крышкой,\nесли это увеличит тепло и ускорит\nприготовление. Также, если крышку\nкастрюли подняли, запрещено возвращать\nеё на место, поскольку этим ускоряется\nприготовление пищи.<\/font><\/p><p><font size=\"3\">Если же пища\n<\/font><strong><font size=\"3\">полностью\nприготовлена<\/font><\/strong><font size=\"3\">,\nто есть уже пригодна для еды, то в\nдействиях, увеличивающих её нагрев, нет\nзапрета бишуля — при условии, что человек\nне увеличивает сам огонь, поскольку в\nэтом имеется запрет <\/font><strong><font size=\"3\">«авара»\n(разжигание огня)<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Относительно\nприближения кастрюли к огню см. главу\n2, пункт 69.<\/font><\/p><p><font size=\"3\">Также запрещено\n<\/font><strong><font size=\"3\">помешивать\nсодержимое кастрюли<\/font><\/strong><font size=\"3\">.\nПодробности запрета помешивания\n(<\/font><strong><font size=\"3\">«агаса»<\/font><\/strong><font size=\"3\">)\nсм. далее, пункты 89–98.<\/font><\/p><h3 id=\"part-14\">\n<font size=\"4\">Неполное\n\t\t\t\t\tприготовление<\/font><\/h3><p><font size=\"3\">Даже если\n\t\t\t\t\tчеловек не приготовил пищу полностью,\n\t\t\t\t\tон всё равно обязан за нарушение\n\t\t\t\t\tзапрета <\/font><strong><font size=\"3\">«Мевашель»\n\t\t\t\t\t(Бишуль)<\/font><\/strong><font size=\"3\">,\n\t\t\t\t\tесли довёл её до такой степени\n\t\t\t\t\tготовности, что её уже можно есть в\n\t\t\t\t\tслучае крайней необходимости.<\/font><\/p><p><font size=\"3\">Такая степень\n\t\t\t\t\tприготовления называется в Гемаре\n\t\t\t\t\t<\/font><strong><font size=\"3\">«маахаль\n\t\t\t\t\tбен Друсай»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Ришоним\n\t\t\t\t\tрасходятся во мнениях относительно\n\t\t\t\t\tтого, что именно считается этой\n\t\t\t\t\tстепенью готовности: когда пища\n\t\t\t\t\tдостигла <\/font><strong><font size=\"3\">одной\n\t\t\t\t\tтрети полной готовности<\/font><\/strong><font size=\"3\">\n\t\t\t\t\tили когда она достигла <\/font><strong><font size=\"3\">половины\n\t\t\t\t\tполной готовности<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Относительно\n\t\t\t\t\tтого, как определить половину или\n\t\t\t\t\tтреть степени приготовления, <\/font><strong><font size=\"3\">Хазон\n\t\t\t\t\tИш<\/font><\/strong><font size=\"3\">\n\t\t\t\t\tпишет, что это определяется по времени,\n\t\t\t\t\tнеобходимому для полного приготовления.<\/font><\/p><p><font size=\"3\">То есть если\n\t\t\t\t\tдля полного приготовления блюда\n\t\t\t\t\tтребуется один час, то после <\/font><strong><font size=\"3\">получаса<\/font><\/strong><font size=\"3\">\n\t\t\t\t\tприготовления оно считается достигшим\n\t\t\t\t\tполовины готовности, а после <\/font><strong><font size=\"3\">двадцати\n\t\t\t\t\tминут<\/font><\/strong><font size=\"3\">\n\t\t\t\t\t— одной трети готовности.<\/font><\/p><p><font size=\"3\">Всё это\n\t\t\t\t\tотносится к установленной мере для\n\t\t\t\t\tобязанности принести <\/font><strong><font size=\"3\">жертву\n\t\t\t\t\tхатат<\/font><\/strong><font size=\"3\">.\n\t\t\t\t\tОднако в Шаббат запрещено готовить\n\t\t\t\t\tпищу даже в том случае, если она не\n\t\t\t\t\tдостигнет степени <\/font><strong><font size=\"3\">«маахаль\n\t\t\t\t\tбен Друсай»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><strong><font size=\"3\">14.<\/font><\/strong><font size=\"3\">\nТот, кто готовит пищу до тех пор, пока\nона не достигнет <\/font><strong><font size=\"3\">половины\nстепени своей готовности<\/font><\/strong><font size=\"3\">,\nа по некоторым мнениям — <\/font><strong><font size=\"3\">одной\nтрети готовности<\/font><\/strong><font size=\"3\">,\nтаким образом, что её уже можно есть в\nслучае крайней необходимости, — а это\nсостояние называется в Гемаре <\/font><strong><font size=\"3\">«маахаль\nбен Друсай»<\/font><\/strong><font size=\"3\">,\n— обязан за нарушение запрета бишуля.<\/font><\/p><p><font size=\"3\">Однако даже если\nпища не достигнет степени <\/font><strong><font size=\"3\">«маахаль\nбен Друсай»<\/font><\/strong><font size=\"3\">,\nвсё равно запрещено её готовить.<\/font><\/p><h3 id=\"part-15\">\n<font size=\"4\">Дополнительное\n\t\t\t\tприготовление после достижения\n\t\t\t\tстепени «маахаль бен Друсай»<\/font><\/h3><p><font size=\"3\">В трудах поским\n\t\t\t\tразъясняется, что следует различать\n\t\t\t\tнесколько степеней готовности пищи:<\/font><\/p><p><strong><font size=\"3\">А.<\/font><\/strong><font size=\"3\">\n\t\t\t\tПища немного приготовилась, но ещё\n\t\t\t\tне достигла степени <\/font><strong><font size=\"3\">«маахаль\n\t\t\t\tбен Друсай»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><strong><font size=\"3\">Б.<\/font><\/strong><font size=\"3\">\n\t\t\t\tПища достигла степени <\/font><strong><font size=\"3\">«маахаль\n\t\t\t\tбен Друсай»<\/font><\/strong><font size=\"3\">,\n\t\t\t\tно ещё не приготовилась полностью.<\/font><\/p><p><strong><font size=\"3\">В.<\/font><\/strong><font size=\"3\">\n\t\t\t\tПища приготовилась полностью и уже\n\t\t\t\tсовершенно пригодна для еды, однако\n\t\t\t\tдальнейшее приготовление улучшает\n\t\t\t\tеё. Такое состояние называется в\n\t\t\t\tтерминологии поским <\/font><strong><font size=\"3\">«мицтамек\n\t\t\t\tве-яфе ло»<\/font><\/strong><font size=\"3\">\n\t\t\t\t— дальнейшее уваривание улучшает\n\t\t\t\tпищу.<\/font><\/p><p><strong><font size=\"3\">Г.<\/font><\/strong><font size=\"3\">\n\t\t\t\tСуществует ещё одна степень — <\/font><strong><font size=\"3\">«мицтамек\n\t\t\t\tве-ра ло»<\/font><\/strong><font size=\"3\">:\n\t\t\t\tпища уже приготовлена настолько, что\n\t\t\t\tдальнейшее приготовление ухудшает\n\t\t\t\tеё вкус.<\/font><\/p><p><font size=\"3\">Этот вопрос\n\t\t\t\tбудет разъяснён далее, в главе 2, пункте\n\t\t\t\t37.<\/font><\/p><p><font size=\"3\">Подробные\n\t\t\t\tзаконы, относящиеся к этим степеням\n\t\t\t\tприготовления, будут разъяснены\n\t\t\t\tдалее.<\/font><\/p><h3 id=\"part-16\"><font size=\"3\">15.\n<\/font><font size=\"3\"><span style=\"font-weight: normal\">Даже\nесли пища уже приготовилась до степени\n<\/span><\/font><strong><font size=\"3\"><span style=\"font-weight: normal\">«маахаль\nбен Друсай»<\/span><\/font><\/strong><font size=\"3\"><span style=\"font-weight: normal\">,\nно ещё не приготовилась полностью,\nзапрещено продолжать её приготовление.<\/span><\/font><\/h3><p><font size=\"3\">Однако если пища\nуже <\/font><strong><font size=\"3\">полностью\nприготовлена<\/font><\/strong><font size=\"3\">\nи совершенно пригодна для еды, то запрета\nбишуля в ней больше нет, даже если\nдальнейшее приготовление улучшает её.\nТакое состояние называется <\/font><strong><font size=\"3\">«мицтамек\nве-яфе ло»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Поэтому следует\nсоблюдать осторожность с кастрюлей, в\nкоторой находится пища, ещё не\nприготовившаяся полностью: нельзя\nпридвигать её ближе к огню и нельзя\nнакрывать её, поскольку эти действия\nускоряют приготовление.<\/font><\/p><p><font size=\"3\">Также, если сняли\nс огня кастрюлю, содержимое которой ещё\nне приготовилось полностью, запрещено\nвозвращать её на огонь, даже если огонь\nявляется <\/font><strong><font size=\"3\">«гаруф\nве-катум»<\/font><\/strong><font size=\"3\">\n(угли выгребены или покрыты), — из-за\nзапрета бишуля.<\/font><\/p><p><font size=\"3\">Но если содержимое\nкастрюли уже полностью приготовлено,\nразрешается добавить сверху покрытие\nпри условии, что при этом нет запрета\n<\/font><strong><font size=\"3\">«атмана»\n(укутывания)<\/font><\/strong><font size=\"3\">,\nкак разъясняется далее, в главе 2, в\nзаконах атманы. Также разрешается\nприблизить её к огню таким образом,\nчтобы при этом не нарушался запрет\n<\/font><strong><font size=\"3\">«хазара»\n(возвращения на огонь)<\/font><\/strong><font size=\"3\">,\nкак разъясняется далее, в главе 2, в\nзаконах хазары.<\/font><\/p><p><font size=\"3\">Относительно\nпомешивания (<\/font><strong><font size=\"3\">«агаса»<\/font><\/strong><font size=\"3\">)\nв полностью приготовленной кастрюле,\nстоящей на огне, см. далее, пункт 93.<\/font><\/p><p><font size=\"3\">Поэтому изначально\nследует следить за тем, чтобы <\/font><strong><font size=\"3\">вся\nпища была полностью приготовлена до\nнаступления Шаббата<\/font><\/strong><font size=\"3\">,\nчтобы не прийти к нарушению запрета\nбишуля.<\/font><\/p><h3 id=\"part-17\"><font size=\"3\">Степень\nнагрева воды<\/font><\/h3><p><strong><font size=\"3\">16.<\/font><\/strong><font size=\"3\">\nТот, кто нагревает воду до температуры\n<\/font><strong><font size=\"3\">«яд соледет\nбо»<\/font><\/strong><font size=\"3\">, обязан\nза нарушение запрета бишуля, даже если\nвода ещё не дошла до полного кипения.<\/font><\/p><p><strong><font size=\"3\">17.<\/font><\/strong><font size=\"3\">\nВоду, уже достигшую температуры <\/font><strong><font size=\"3\">«яд\nсоледет бо»<\/font><\/strong><font size=\"3\">,\nзапрещено продолжать нагревать до\nкипения.<\/font><\/p><p><font size=\"3\">Поэтому, если до\nнаступления Шаббата не успели вскипятить\nводу в <\/font><strong><font size=\"3\">михаме\n(водонагревателе)<\/font><\/strong><font size=\"3\">,\nв Шаббат запрещено совершать какие-либо\nдействия, увеличивающие её нагрев,\nнапример придвигать михам ближе к огню\nили накрывать его сверху тканью.<\/font><\/p><h3 id=\"part-18\">\n<font size=\"4\">Постановление\n\t\t\t\tо подогреве — «Гзейрат афшер»<\/font><\/h3><p><font size=\"3\">Тот, кто\n\t\t\t\tнагревает пищу или напиток, которые\n\t\t\t\tранее не были приготовлены, до\n\t\t\t\tтемпературы ниже <\/font><strong><font size=\"3\">«яд\n\t\t\t\tсоледет бо»<\/font><\/strong><font size=\"3\">,\n\t\t\t\tне нарушает запрет бишуля по Торе.<\/font><\/p><p><font size=\"3\">Однако мудрецы\n\t\t\t\tпостановили, что нельзя помещать пищу\n\t\t\t\tили напиток в такое место, где они\n\t\t\t\tмогут достичь температуры <\/font><strong><font size=\"3\">«яд\n\t\t\t\tсоледет бо»<\/font><\/strong><font size=\"3\">,\n\t\t\t\tдаже если человек намеревается лишь\n\t\t\t\tнемного их подогреть и убрать до того,\n\t\t\t\tкак они достигнут этой температуры.<\/font><\/p><p><font size=\"3\">Причина\n\t\t\t\tзаключается в опасении, что человек\n\t\t\t\tможет забыть и оставить воду на огне\n\t\t\t\tдо тех пор, пока она не достигнет\n\t\t\t\tтемпературы «яд соледет бо», и тем\n\t\t\t\tсамым нарушит запрет бишуля.<\/font><\/p><p><font size=\"3\">Этот запрет\n\t\t\t\tназывается у поским <\/font><strong><font size=\"3\">«гзейрат\n\t\t\t\tафшер»<\/font><\/strong><font size=\"3\">\n\t\t\t\t— постановление мудрецов относительно\n\t\t\t\tподогрева.<\/font><\/p><p><font size=\"3\">Разрешается\n\t\t\t\tпомещать пищу или напиток в такое\n\t\t\t\tместо, где они <\/font><strong><font size=\"3\">не\n\t\t\t\tмогут достичь температуры «яд соледет\n\t\t\t\tбо»<\/font><\/strong><font size=\"3\">,\n\t\t\t\tдаже если они будут находиться там\n\t\t\t\tпродолжительное время.<\/font><\/p><h3 id=\"part-19\"><font size=\"3\">18.\n<\/font><font size=\"3\"><span style=\"font-weight: normal\">Нельзя\nпомещать неприготовленную пищу на огонь\nили рядом с ним, если в этом месте она\nможет нагреться до температуры <\/span><\/font><strong><font size=\"3\"><span style=\"font-weight: normal\">«яд\nсоледет бо»<\/span><\/font><\/strong><font size=\"3\"><span style=\"font-weight: normal\">.<\/span><\/font><\/h3><p><font size=\"3\">Даже если человек\nнамеревается лишь немного согреть пищу\nи убрать её с огня до того, как она\nдостигнет такой температуры, это\nзапрещено из-за постановления <\/font><strong><font size=\"3\">«гзейрат\nафшер»<\/font><\/strong><font size=\"3\">.\nМудрецы опасались, что человек может\nзабыть пищу там, и она нагреется до\nстепени приготовления.<\/font><\/p><p><font size=\"3\">Запрет <\/font><strong><font size=\"3\">«гзейрат\nафшер»<\/font><\/strong><font size=\"3\">\nотносится также к жидкостям, которые\nуже были приготовлены, но затем остыли.\nПоэтому нельзя ставить холодный суп на\nмихам, чтобы немного его подогреть, если\nон может достичь температуры <\/font><strong><font size=\"3\">«яд\nсоледет бо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Однако разрешается\nставить воду и любую пищу для подогрева\nв такое место, где они <\/font><strong><font size=\"3\">не\nмогут достичь температуры «яд соледет\nбо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-20\">\n<font size=\"5\">Бишуль после\n\t\t\t\tбишуля — повторное приготовление<\/font><\/h3><p>Пища, которая уже полностью\n\t\t\t\tприготовлена, не подпадает под запрет\n\t\t\t\tбишуля. Однако в этом вопросе следует\n\t\t\t\tразличать между <strong>сухой пищей<\/strong>\n\t\t\t\tи <strong>жидкостями или блюдами,\n\t\t\t\tсодержащими соус<\/strong>.<\/p><h3 id=\"part-21\"><font size=\"4\">Повторное\n\t\t\t\tприготовление сухой пищи<\/font><\/h3><p>Сухая приготовленная пища, которую\n\t\t\t\tхотят снова разогреть в Шаббат, не\n\t\t\t\tподпадает под запрет бишуля, поскольку\n\t\t\t\tдействует правило: <strong>«эйн бишуль\n\t\t\t\tахар бишуль» — нет приготовления\n\t\t\t\tпосле приготовления<\/strong>.<\/p><p>Однако мудрецы постановили, что в\n\t\t\t\tШаббат нельзя ставить пищу непосредственно\n\t\t\t\tна огонь из-за постановлений, связанных\n\t\t\t\tс <strong>«хазара»<\/strong> (возвращением\n\t\t\t\tпищи на источник тепла) и <strong>первоначальным\n\t\t\t\tпомещением пищи на источник тепла<\/strong>,\n\t\t\t\tкак будет разъяснено далее, в главе\n\t\t\t\t2, пунктах 61–63.<\/p><p>Причина правила «эйн бишуль ахар\n\t\t\t\tбишуль» заключается в том, что второе\n\t\t\t\tприготовление не производит нового\n\t\t\t\tизменения в самой пище, поскольку она\n\t\t\t\tуже была приготовлена.<\/p><p>Поэтому если нечто было приготовлено,\n\t\t\t\tа затем результат первого приготовления\n\t\t\t\tполностью исчез, то существует полный\n\t\t\t\tзапрет приготовить это повторно.<\/p><p>Например, металл, который был\n\t\t\t\tрасплавлен и по своему статусу\n\t\t\t\tсчитается приготовленным, как было\n\t\t\t\tразъяснено выше во введении к законам\n\t\t\t\tбишуля, а затем остыл и снова стал\n\t\t\t\tтвёрдым, запрещено снова расплавлять.\n\t\t\t\tПричина в том, что с того момента, как\n\t\t\t\tметалл вернулся в твёрдое состояние,\n\t\t\t\tрезультат первого «приготовления»\n\t\t\t\tисчез.<\/p><h3 id=\"part-22\"><font size=\"3\">Повторное\n\t\t\t\tприготовление жидкой пищи<\/font><\/h3><p>Относительно жидкой пищи, например\n\t\t\t\t<strong>воды, супа или блюда, содержащего\n\t\t\t\tсоус<\/strong>, ришоним расходятся во\n\t\t\t\tмнениях, разрешено ли снова нагревать\n\t\t\t\tеё после того, как она была приготовлена\n\t\t\t\tи остыла.<\/p><p>Некоторые считают, что в отношении\n\t\t\t\tжидкости действует принцип <strong>«еш\n\t\t\t\tбишуль ахар бишуль» — существует\n\t\t\t\tприготовление после приготовления<\/strong>,\n\t\t\t\tи поэтому повторный нагрев запрещён.<\/p><p>Причина заключается в том, что в\n\t\t\t\tжидкой пище основным результатом\n\t\t\t\tприготовления является её <strong>тепло<\/strong>.\n\t\t\t\tКогда жидкость остывает, результат\n\t\t\t\tпервого приготовления исчезает, и\n\t\t\t\tкогда её снова нагревают, это\n\t\t\t\tрассматривается как новое приготовление.<\/p><p>Другие считают, что правило <strong>«эйн\n\t\t\t\tбишуль ахар бишуль»<\/strong> действует\n\t\t\t\tдаже в отношении жидкой пищи.<\/p><h3 id=\"part-23\"><font size=\"3\">Практическая\n\t\t\t\tалаха<\/font><\/h3><p>На практике поским придерживаются\n\t\t\t\tболее строгого мнения и запрещают\n\t\t\t\tповторный бишуль жидкой пищи, которая\n\t\t\t\tбыла приготовлена, а затем остыла.<\/p><p>Однако <strong>Шульхан Арух и Рамо\n\t\t\t\tрасходятся во мнениях<\/strong> относительно\n\t\t\t\tтого, насколько должна остыть жидкость,\n\t\t\t\tчтобы её повторный нагрев считался\n\t\t\t\tбишулем.<\/p><p>По мнению <strong>Шульхан Аруха (Орах\n\t\t\t\tХаим 318:4)<\/strong>, если жидкость остыла\n\t\t\t\tдо температуры <strong>ниже «яд соледет\n\t\t\t\tбо»<\/strong>, её повторный нагрев уже\n\t\t\t\tподпадает под запрет бишуля, даже\n\t\t\t\tесли она всё ещё немного тёплая.<\/p><p><strong>Рамо<\/strong> постановил, что запрет\n\t\t\t\tбишуля возникает только в том случае,\n\t\t\t\tесли жидкость <strong>полностью остыла<\/strong>.\n\t\t\t\tНо если она ещё не остыла полностью,\n\t\t\t\tто даже если её температура уже ниже\n\t\t\t\t«яд соледет бо», запрета бишуля в её\n\t\t\t\tповторном нагревании нет.<\/p><p>Подробные законы о том, <strong>что\n\t\t\t\tсчитается жидкой пищей, а что — сухой<\/strong>,\n\t\t\t\tбудут разъяснены далее.<\/p><h3 id=\"part-24\"><font size=\"3\">Повторное\nприготовление сухой пищи<\/font><\/h3><p><strong>19.<\/strong> В отношении сухой пищи,\nкоторая уже полностью приготовлена,\nнет запрета бишуля, даже если она остыла,\nпоскольку действует правило <strong>«эйн\nбишуль ахар бишуль» — нет приготовления\nпосле приготовления<\/strong>.<\/p><p>Поэтому разрешается положить такую\nпищу сверху на кастрюлю с едой или на\n<strong>михам<\/strong>, стоящие на огне, даже\nесли эта пища в результате нагреется\nдо температуры <strong>«яд соледет бо»<\/strong>.<\/p><p>Однако даже если сама пища уже была\nприготовлена, но после приготовления\nв неё добавили специи, запрещено снова\nподвергать её приготовлению, поскольку\nспеции ещё не были приготовлены.<\/p><p>Поэтому нельзя класть для разогрева\nна михам зёрна нута, называемые <strong>«арбес»<\/strong>,\nпоскольку специи будут готовиться от\nтепла огня.<\/p><h3 id=\"part-25\"><font size=\"3\">Повторное\nприготовление жидкой пищи<\/font><\/h3><p><strong>20.<\/strong> В отношении жидкой пищи,\nто есть жидкости, которая была приготовлена,\nа затем остыла, следует различать два\nслучая:<\/p><p><strong>А.<\/strong> Если она <strong>полностью\nостыла<\/strong>, запрещено снова её нагревать\nиз-за запрета бишуля.<\/p><p><strong>Б.<\/strong> Если она <strong>не остыла\nполностью<\/strong>, то даже если она остыла\nнастолько, что её температура уже ниже\n<strong>«яд соледет бо»<\/strong>, разрешается\nснова её нагреть, поскольку в таком\nслучае действует правило, что <strong>нет\nбишуля после бишуля даже в отношении\nжидкой пищи<\/strong>.<\/p><p>То, что мы сказали — что если жидкость\nне остыла полностью, то в её повторном\nнагревании нет запрета бишуля, —\nотносится именно к случаю, когда она\nвсё ещё пригодна для употребления\nблагодаря сохранившемуся в ней теплу.\nТо есть человек, желающий выпить горячий\nнапиток, стал бы пить её как напиток,\nкоторый ещё немного горячий.<\/p><p>Но если жидкость остыла настолько,\nчто люди уже не воспринимают её как\nгорячую, а считают просто <strong>тёплой<\/strong>,\nона рассматривается как полностью\nостывшая, и, согласно всем мнениям,\nзапрещено снова её нагревать. См.\nпримечание.<\/p><h3 id=\"part-26\"><font size=\"3\">Что\nсчитается жидкой пищей<\/font><\/h3><p><strong>21.<\/strong> Существуют различные\nстепени густоты пищи и разные виды\nсоусов. В трудах поским не установлено\nточного определения и меры, позволяющих\nоднозначно определить, что считается\n<strong>жидкой пищей<\/strong>, в отношении\nкоторой существует запрет повторного\nприготовления, а что считается <strong>сухой\nпищей<\/strong>, в отношении которой такого\nзапрета нет. См. примечание.<\/p><h3 id=\"part-27\"><font size=\"3\">Пища,\nбольшая часть которой сухая, а меньшая\n— жидкая<\/font><\/h3><p><strong><font size=\"3\">22.<\/font><\/strong><font size=\"3\">\nПоским расходятся во мнениях относительно\nпищи, <\/font><strong><font size=\"3\">большая\nчасть которой сухая, а меньшая — жидкая<\/font><\/strong><font size=\"3\">,\nнапример куски мяса или хамин с соусом.<\/font><\/p><p><font size=\"3\">Следует ли\nрассматривать всё блюдо как сухую пищу,\nв отношении которой нет запрета повторного\nприготовления, или же соус имеет статус\nжидкости и в отношении него действует\nзапрет повторного бишуля?<\/font><\/p><p><font size=\"3\">На практике\nкрупные законоучители постановляют:\nесли в посуде имеется <\/font><strong><font size=\"3\">самостоятельное\nколичество соуса<\/font><\/strong><font size=\"3\">,\nнаходящееся отдельно от твёрдой пищи,\nследует запрещать его повторное\nнагревание.<\/font><\/p><p><font size=\"3\">Однако если соус\nлишь <\/font><strong><font size=\"3\">увлажняет\nповерхность куска пищи<\/font><\/strong><font size=\"3\">,\nон считается второстепенным по отношению\nк твёрдой части, и всё рассматривается\nтак, словно это сухая пища.<\/font><\/p><p><font size=\"3\">См. примечание,\nа также далее, <\/font><strong><font size=\"3\">глава\n4, пункт 47<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-28\"><font size=\"3\">Приготовленный\nтвёрдый продукт, который тает во время\nнагревания<\/font><\/h3><p><strong><font size=\"3\">23.<\/font><\/strong><font size=\"3\">\nПоским расходятся во мнениях, разрешено\nли разогревать холодный приготовленный\nпродукт, который в начале нагревания\nявляется твёрдым, но затем должен\nрастаять и нагреться до температуры\n<\/font><strong><font size=\"3\">«яд соледет\nбо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Например, холодный\nкусок мяса, из которого во время нагревания\nвыделяются сок и жир.<\/font><\/p><p><font size=\"3\">Некоторые\nразрешают это, поскольку в момент, когда\nпродукт помещают возле огня, он является\nсухим, а в отношении сухой пищи действует\nправило <\/font><strong><font size=\"3\">«эйн\nбишуль ахар бишуль» — нет приготовления\nпосле приготовления<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Другие считают,\nчто такой продукт имеет статус жидкой\nпищи, поскольку он сначала тает, а затем\nнагревается, и поэтому это запрещено.<\/font><\/p><p><strong><font size=\"3\">Мишна Брура\nи Хазон Иш<\/font><\/strong><font size=\"3\">\nпридерживаются более разрешающего\nмнения.<\/font><\/p><p><font size=\"3\">Поэтому разрешается\nразогревать приготовленные куски мяса,\nс которыми нет жидкого соуса, например\nесли они находились в холодильнике и\nчеловек хочет положить их сверху на\nмихам, даже если во время нагревания из\nних выделяется жидкость, которая затем\nнагревается до температуры «яд соледет\nбо». См. далее, глава 4, пункт 47.<\/font><\/p><p><font size=\"3\">Если же в посуде\nимеется большое количество застывшего\nжира или соуса, их нельзя нагревать\nиз-за запрета <\/font><strong><font size=\"3\">«молид»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Однако относительно\nдобавления сахара и соли, которые уже\nподвергались приготовлению, в горячую\nводу <\/font><strong><font size=\"3\">Мишна\nБрура<\/font><\/strong><font size=\"3\">\nпишет, что желательно соблюдать\nосторожность и изначально не класть их\nв <\/font><strong><font size=\"3\">кли\nришон<\/font><\/strong><font size=\"3\">. Но\nв <\/font><strong><font size=\"3\">кли шени<\/font><\/strong><font size=\"3\">\nон разрешает это.<\/font><\/p><p><font size=\"3\">Также нельзя\nлить из кли ришон на сахар, находящийся\nв стакане. См. далее, пункт 69, где\nразъясняется, что также нельзя наливать\nиз кли ришон в горячую воду, в которой\nуже растворён сахар.<\/font><\/p><p><font size=\"3\">Поэтому следует\nсоблюдать осторожность и <\/font><strong><font size=\"3\">не\nдоливать горячую воду из михама в стакан\nс чаем<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-29\"><font size=\"3\">Остатки\nсупа в половнике<\/font><\/h3><p><strong><font size=\"3\">24.<\/font><\/strong><font size=\"3\">\nЧасто бывает, что человек набирает\nполовником суп из <\/font><strong><font size=\"3\">кли\nришон<\/font><\/strong><font size=\"3\"> и\nразливает его по тарелкам. При этом в\nполовнике остаётся немного супа, который\nпостепенно остывает.<\/font><\/p><p><font size=\"3\">Следует соблюдать\nосторожность: если эти остатки остыли\nнастолько, что они уже не считаются\nгорячими, а являются лишь слегка тёплыми,\nкак разъяснялось выше в пункте 20, нельзя\nснова опускать половник в кли ришон, в\nкотором находится суп.<\/font><\/p><p><font size=\"3\">В противном\nслучае остатки супа, находящиеся в\nполовнике, снова подвергаются\nприготовлению, а это подобно повторному\nприготовлению остывшей жидкой пищи.<\/font><\/p><h3 id=\"part-30\"><font size=\"3\">Капли\nводы на крышке<\/font><\/h3><p><strong><font size=\"3\">25.<\/font><\/strong><font size=\"3\">\nЕсли человек снял крышку с кипящей\nкастрюли и прошло достаточно времени,\nчтобы пар на крышке сконденсировался\nи превратился в капли воды, следует\nсоблюдать осторожность и не возвращать\nкрышку на кастрюлю, если эти капли уже\nостыли.<\/font><\/p><p><font size=\"3\">Причина в том,\nчто при возвращении крышки эти капли\nводы будут снова нагреваться и тем самым\nподвергнутся повторному бишулю.<\/font><\/p><h3 id=\"part-31\">\n<font size=\"4\">Бишуль после\n\t\t\t\tжарки и жарка после бишуля<\/font><\/h3><p>Выше было разъяснено, что действует\n\t\t\t\tправило <strong>«эйн бишуль ахар бишуль»\n\t\t\t\t— нет приготовления после приготовления<\/strong>.<\/p><p>Однако существуют и другие способы\n\t\t\t\tприготовления пищи, которые также\n\t\t\t\tвходят в мелаху <strong>«Бишуль»<\/strong>,\n\t\t\t\tнапример <strong>жарка («цлия») и выпечка\n\t\t\t\t(«афия»)<\/strong>.<\/p><p>Ришоним, мнения которых приведены\n\t\t\t\tв <strong>Туре и Бейт-Йосефе, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ח<\/span><\/font>,\n\t\t\t\t<font face=\"Tahoma\"><span>סעיף ה׳ <\/span><\/font>(318:5)<\/strong>,\n\t\t\t\tрасходятся во мнениях, распространяется\n\t\t\t\tли правило «эйн бишуль ахар бишуль»\n\t\t\t\tтакже на два различных способа\n\t\t\t\tприготовления. Например, когда варят\n\t\t\t\tуже поджаренный продукт или жарят\n\t\t\t\tуже сваренный продукт.<\/p><p>По мнению <strong>Раавьи<\/strong>, и в этом\n\t\t\t\tслучае действует правило: <strong>нет\n\t\t\t\tбишуля после жарки и нет жарки после\n\t\t\t\tбишуля<\/strong>. Причина заключается в\n\t\t\t\tтом, что пища уже стала пригодной для\n\t\t\t\tеды благодаря воздействию тепла огня,\n\t\t\t\tи нет различия, произошло это посредством\n\t\t\t\tварки или жарки.<\/p><p>Однако автор <strong>«Сефер Йереим»<\/strong>\n\t\t\t\tсчитает, что за бишуль после жарки и\n\t\t\t\tза жарку после бишуля существует\n\t\t\t\tобязанность по Торе. Причина в том,\n\t\t\t\tчто <strong>варка и жарка являются двумя\n\t\t\t\tразличными действиями<\/strong>, каждое\n\t\t\t\tиз которых придаёт пище иной вкус.<\/p><p>Подобным образом они расходятся во\n\t\t\t\tмнениях относительно <strong>бишуля\n\t\t\t\tпосле выпечки и выпечки после бишуля<\/strong>.<\/p><p>Практически <strong>Шульхан Арух (Орах\n\t\t\t\tХаим 318:5)<\/strong> приводит оба мнения, а\n\t\t\t\t<strong>Рамо<\/strong> пишет, что принято\n\t\t\t\tсоблюдать в этом вопросе осторожность.<\/p><p>Основное различие между <strong>жаркой\n\t\t\t\tи выпечкой<\/strong>, с одной стороны, и\n\t\t\t\t<strong>варкой<\/strong>, с другой, заключается\n\t\t\t\tв том, что варка происходит <strong>в\n\t\t\t\tводе<\/strong>, тогда как жарка и выпечка\n\t\t\t\tпроисходят <strong>под воздействием жара\n\t\t\t\tогня без воды<\/strong>.<\/p><p>Однако существует ещё один вид\n\t\t\t\tжарки, называемый <strong>«цли кедар»<\/strong>\n\t\t\t\t— жарка в кастрюле. Это случай, когда\n\t\t\t\tмясо находится в кастрюле без воды и\n\t\t\t\tжарится в жидкости, которая выделяется\n\t\t\t\tиз самого мяса.<\/p><p>В трудах поским прямо не разъяснено,\n\t\t\t\tкакой статус имеет <strong>«цли кедар»<\/strong>\n\t\t\t\tв отношении мелахи «Бишуль»: считается\n\t\t\t\tли он варкой или жаркой.<\/p><p>См. <strong>Хазон Иш<\/strong>, который\n\t\t\t\tсклоняется к мнению, что его статус\n\t\t\t\tподобен <strong>бишулю — варке<\/strong>.<\/p><h3 id=\"part-32\"><font size=\"3\">Бишуль\nпосле выпечки или жарки<\/font><\/h3><p><strong><font size=\"3\">26.<\/font><\/strong><font size=\"3\">\nПоским пишут, что нельзя варить продукт,\nкоторый был испечён или поджарен. Хотя\nмелаха <\/font><strong><font size=\"3\">«афия»\n(выпечка)<\/font><\/strong><font size=\"3\">\nвходит в общее понятие мелахи «Бишуль»,\nтем не менее процесс варки придаёт пище\nновый вкус, и поэтому опасаются запрета\n<\/font><strong><font size=\"3\">бишуля\nпосле выпечки<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Поэтому нельзя\nкласть хлеб в горячий суп, температура\nкоторого достигает <\/font><strong><font size=\"3\">«яд\nсоледет бо»<\/font><\/strong><font size=\"3\">.\nЭто запрещено даже в том случае, если\nсуп находится в <\/font><strong><font size=\"3\">кли\nшени<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-33\"><font size=\"3\">Добавление\nвыпечки в стакан чая<\/font><\/h3><p><strong><font size=\"3\">27.<\/font><\/strong><font size=\"3\">\nНельзя класть бисквит или печенье в\nстакан чая, даже если стакан является\n<\/font><strong><font size=\"3\">кли шени<\/font><\/strong><font size=\"3\">,\nесли температура чая достигает «яд\nсоледет бо».<\/font><\/p><p><font size=\"3\">Также нельзя\nкласть <\/font><strong><font size=\"3\">блинчики\n(блинцес)<\/font><\/strong><font size=\"3\">\nв суп, даже если он находится в кли шени.<\/font><\/p><p><font size=\"3\">Относительно\n<\/font><strong><font size=\"3\">кли шлиши<\/font><\/strong><font size=\"3\">\nсм. далее, пункт 41.<\/font><\/p><h3 id=\"part-34\"><font size=\"3\">Использование\nсахарозаменителя и других растворимых\nпорошков<\/font><\/h3><p><strong><font size=\"3\">28.<\/font><\/strong><font size=\"3\">\nНельзя класть таблетки или порошок\nсахарозаменителя даже в кли шени, если\nэтот продукт не был сварен, а только\nподвергался выпечке, поскольку в таком\nслучае возникает вопрос <\/font><strong><font size=\"3\">бишуля\nпосле выпечки<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Если хотят\nположить его в <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">,\nсм. далее, пункт 41.<\/font><\/p><p><font size=\"3\">То же самое\nотносится к другим растворимым порошкам,\nнапример <\/font><strong><font size=\"3\">какао\nили порошку для приготовления супа<\/font><\/strong><font size=\"3\">.\nИх нельзя класть в кли шени, если только\nдостоверно не известно, что все компоненты,\nвходящие в состав этих порошков, прошли\nтакже процесс варки, а не только выпечки.<\/font><\/p><h3 id=\"part-35\"><font size=\"3\">Выпечка\nили жарка после бишуля<\/font><\/h3><p><strong><font size=\"3\">29.<\/font><\/strong><font size=\"3\">\nПодобно тому как поским придерживаются\nстрогого мнения относительно бишуля\nпосле выпечки или жарки, они также\nпридерживаются строгого мнения\nотносительно <\/font><strong><font size=\"3\">выпечки\nили жарки после бишуля<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Поэтому нельзя\nпомещать приготовленную курицу или\nдругие приготовленные блюда напротив\nогня в таком месте, где жар огня способен\nих поджарить.<\/font><\/p><h3 id=\"part-36\"><font size=\"3\">Разогрев\nприготовленной пищи на михаме<\/font><\/h3><p><strong><font size=\"3\">30.<\/font><\/strong><font size=\"3\">\nХотя выше было разъяснено, что нельзя\nпомещать приготовленное блюдо напротив\nогня в месте, где огонь способен его\nподжарить, тем не менее разрешается\nставить приготовленную курицу или\nдругие приготовленные блюда <\/font><strong><font size=\"3\">сверху\nна михам, стоящий на огне<\/font><\/strong><font size=\"3\">,\nдаже если они нагреются до высокой\nтемпературы. Причину см. в примечании.<\/font><\/p><p><font size=\"3\">Не следует класть\nкурицу непосредственно на михам без\nразделяющей поверхности, поскольку\nвкус мяса проникает в михам, в результате\nчего сам михам и находящаяся в нём вода\nстановятся <\/font><strong><font size=\"3\">мясными<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Даже если курица\nзавёрнута в алюминиевую фольгу, часто\nбывает, что соус вытекает через щели в\nфольге и впитывается в михам. Поэтому\nкурицу следует помещать <\/font><strong><font size=\"3\">в\nпосуду<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Однако необходимо\nсоблюдать осторожность: даже если курицу\nкладут в посуду или хорошо заворачивают,\nесли между этой посудой и крышкой михама\nимеется влага — как это часто бывает,\nкогда крышку михама переворачивают и\nставят на неё посуду, — вкус мяса через\nэту влагу переходит из посуды в михам.\nВ результате михам также становится\n<\/font><strong><font size=\"3\">мясным<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-37\"><font size=\"3\">Бишуль\nпосле жарки, последовавшей после бишуля<\/font><\/h3><p><strong><font size=\"3\">31.<\/font><\/strong><font size=\"3\">\nОтносительно продукта, который сначала\nбыл сварен, а затем поджарен или испечён,\nахроним обсуждают, возникает ли после\nэтого вновь запрет подвергать его\nбишулю.<\/font><\/p><p><font size=\"3\">См. примечание,\nа также далее, пункт 86, где рассматривается\nвопрос приготовления <\/font><strong><font size=\"3\">растворимого\nкофе<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-38\"><font size=\"3\">Законы\nбишуля и жарки в хамине (чолнте)<\/font><\/h3><h3 id=\"part-39\"><font size=\"3\">Опасения\nнарушения запрета в кастрюле с хамином,\nкоторый ещё не полностью приготовлен<\/font><\/h3><p><strong><font size=\"3\">32.<\/font><\/strong><font size=\"3\">\nВыше, в пункте 15, было разъяснено, что\nследует следить за тем, чтобы все блюда,\nнаходящиеся на огне или на электрической\nплате в Шаббат, были <\/font><strong><font size=\"3\">полностью\nприготовлены к наступлению Шаббата<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Если блюдо\nприготовлено не полностью — даже если\nтолько один из его компонентов ещё не\nготов полностью, например фасоль в\nхамине ещё не сварилась до конца, —\nзапрещено совершать какие-либо действия,\nкоторые увеличивают тепло в кастрюле\nи тем самым ускоряют приготовление, как\nбыло разъяснено выше, в пункте 13.<\/font><\/p><p><font size=\"3\">Поэтому:<\/font><\/p><p><strong><font size=\"3\">А.<\/font><\/strong><font size=\"3\">\nНельзя придвигать такую кастрюлю ближе\nк огню, поскольку этим увеличивается\nеё нагрев, даже если часть кастрюли уже\nнаходится напротив пламени.<\/font><\/p><p><strong><font size=\"3\">Б.<\/font><\/strong><font size=\"3\">\nТем более, если такую кастрюлю сняли с\nогня, запрещено возвращать её обратно.<\/font><\/p><p><strong><font size=\"3\">В.<\/font><\/strong><font size=\"3\">\nЕсли подняли крышку кастрюли, запрещено\nснова накрывать её, поскольку этим\nувеличивается тепло внутри кастрюли и\nускоряется приготовление пищи.<\/font><\/p><p><strong><font size=\"3\">Г.<\/font><\/strong><font size=\"3\">\nТакже нельзя добавлять дополнительное\nпокрытие, например накрывать кастрюлю\nс хамином тканью, поскольку это ускоряет\nприготовление.<\/font><\/p><p><font size=\"3\">Поэтому необходимо\nсоблюдать осторожность в следующем\nслучае: если ещё до наступления Шаббата\nна кастрюлю с супом было положено\nпокрытие, которое одновременно покрывает\nи кастрюлю с хамином, то после того, как\nкастрюлю с супом снимают с огня, нельзя\nскладывать освободившуюся часть этого\nпокрытия поверх кастрюли с хамином,\nесли в ней имеются продукты, которые\nещё не полностью приготовлены.<\/font><\/p><p><font size=\"3\">Причина в том,\nчто таким складыванием добавляется\nдополнительный слой покрытия, что\nускоряет приготовление и связано с\nзапретом <\/font><strong><font size=\"3\">«Мевашель»\n(бишуль)<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-40\"><font size=\"3\">Кости\nв кастрюле с хамином<\/font><\/h3><p><strong><font size=\"3\">33.<\/font><\/strong><font size=\"3\">\nЧасто в хамин кладут части курицы с\nкостями, которые по своей природе\nразмягчаются после продолжительного\nприготовления. Есть люди, которые едят\nэти кости после того, как они размягчились,\nнапример кости шеи, ножек и крыльев.\nТакже существуют кости, концы которых\nразмягчаются и становятся пригодными\nдля еды.<\/font><\/p><p><font size=\"3\">Некоторые крупные\nзаконоучители постановили, что статус\nэтих костей подобен статусу пищи, которая\nещё не полностью приготовлена, и поэтому\nздесь существует опасение нарушения\nзапрета бишуля <\/font><strong><font size=\"3\">по\nТоре<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Поэтому необходимо\nсоблюдать все меры предосторожности,\nразъяснённые в предыдущем пункте.<\/font><\/p><p><font size=\"3\">Относительно\nлюдей, которые не имеют обыкновения\nесть такие кости, см. примечание.<\/font><\/p><p><font size=\"3\">Однако очевидно,\nчто если курица предназначена для еды\n<\/font><strong><font size=\"3\">в пятницу\nвечером<\/font><\/strong><font size=\"3\">,\nто приготовление находящихся в ней\nтонких костей не имеет никакого значения,\nпоскольку к моменту этой трапезы они\nвсё равно ещё не станут пригодными для\nеды.<\/font><\/p><p><font size=\"3\">Поэтому, если\nсамо блюдо полностью приготовлено,\nопасения нарушения запрета бишуля в\nэтом случае нет.<\/font><\/p><h3 id=\"part-41\"><font size=\"3\">Жарка\nпосле варки в хамине<\/font><\/h3><p><strong><font size=\"3\">34.<\/font><\/strong><font size=\"3\">\nЕсли содержимое кастрюли с хамином\nполностью приготовлено и кастрюлю сняли\nс огня, разрешается вернуть её обратно\nпри условии, что при этом не нарушается\nзапрет <\/font><strong><font size=\"3\">«хазара»\n(возвращения на огонь)<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Это разрешено,\nнесмотря на то что находящаяся в кастрюле\nвода впоследствии испарится, а блюдо\nбудет высыхать и увариваться, пока не\nприобретёт вкус, близкий ко вкусу жареной\nпищи. В данном случае не опасаются\nзапрета <\/font><strong><font size=\"3\">жарки\nпосле варки<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><strong><font size=\"3\">35.<\/font><\/strong><font size=\"3\">\nТакже разрешается добавлять <\/font><strong><font size=\"3\">горячую\nводу<\/font><\/strong><font size=\"3\"> в\nкастрюлю с хамином, чтобы находящаяся\nв ней пища не подгорела, при условии,\nчто при этом нет нарушения запрета\n«хазара», как разъясняется далее, в\nглаве 2, пунктах 71–73.<\/font><\/p><p><font size=\"3\">Это разрешено\nдаже в том случае, если блюдо уже высохло\nи начало подгорать. В данном случае не\nопасаются запрета <\/font><strong><font size=\"3\">бишуля\nпосле жарки, последовавшей после бишуля<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-42\">\n<font size=\"4\">Кли ришон — кли\n\t\t\t\tшени — ируй<\/font><\/h3><p>В Мишне, лист 42, сказано:<\/p><p><strong>«Ильпас и кастрюля, которые\n\t\t\t\tсняли с огня, пока они горячие, —\n\t\t\t\tнельзя класть в них специи, однако\n\t\t\t\tможно положить специи в миску или в\n\t\t\t\tтамхуй».<\/strong><\/p><p>То есть <strong>ильпас и кастрюля<\/strong>\n\t\t\t\t— это посуда, в которой готовилась\n\t\t\t\tпища. Нельзя класть в неё специи даже\n\t\t\t\tпосле того, как её сняли с огня.<\/p><p>А <strong>миска и тамхуй<\/strong> — это\n\t\t\t\tпосуда, в которую переложили пищу из\n\t\t\t\tкастрюли, наподобие наших тарелок и\n\t\t\t\tсервировочных мисок. В такую посуду\n\t\t\t\tразрешается класть специи.<\/p><p>Из этой Мишны следует важнейший\n\t\t\t\tпринцип законов бишуля:<\/p><p><strong>Кли ришон готовит всё время,\n\t\t\t\tпока его содержимое имеет температуру\n\t\t\t\t«яд соледет бо».<\/strong><\/p><p>То есть пища, которая всё ещё находится\n\t\t\t\tв сосуде, в котором она готовилась,\n\t\t\t\tсохраняет достаточно тепла, чтобы\n\t\t\t\tприготовить другие продукты, которые\n\t\t\t\tбудут помещены в неё. Это относится\n\t\t\t\tдаже к случаю, когда сосуд уже снят с\n\t\t\t\tогня, — всё время, пока его содержимое\n\t\t\t\tимеет температуру «яд соледет бо».<\/p><p><strong>Кли шени не готовит, даже если\n\t\t\t\tего содержимое имеет температуру «яд\n\t\t\t\tсоледет бо».<\/strong><\/p><p>То есть если пищу переложили из\n\t\t\t\tсосуда, в котором она готовилась, в\n\t\t\t\tдругой сосуд, её тепло уже не обладает\n\t\t\t\tдостаточной силой для приготовления.<\/p><p>Ришоним расходятся во мнениях\n\t\t\t\tотносительно случая, когда горячую\n\t\t\t\tжидкость <strong>льют из кли ришон («ируй\n\t\t\t\tми-кли ришон»)<\/strong> на продукты,\n\t\t\t\tнаходящиеся, например, в тарелке:\n\t\t\t\tимеет ли такое обливание статус кли\n\t\t\t\tришон и способно приготовить находящуюся\n\t\t\t\tв тарелке пищу, или же оно имеет статус\n\t\t\t\tкли шени и не готовит.<\/p><p>Практически поским постановили,\n\t\t\t\tчто <strong>ируй из кли ришон готовит\n\t\t\t\tверхний слой продукта — «кдей клипа»<\/strong>.<\/p><p>Поэтому <strong>по Торе запрещено<\/strong>\n\t\t\t\tлить из кли ришон на пищу, которую\n\t\t\t\tзапрещено подвергать бишулю.<\/p><p>Следует знать, что, хотя в общем\n\t\t\t\tслучае <strong>кли шени не готовит<\/strong>,\n\t\t\t\tв Гемаре и трудах поским приводится\n\t\t\t\tнесколько случаев, когда запрет бишуля\n\t\t\t\tсуществует даже в кли шени:<\/p><p><strong>А. «Калей а-бишуль» — легко\n\t\t\t\tприготовляющиеся продукты.<\/strong><br/>\nПродукт,\n\t\t\t\tкоторый по своей природе легко\n\t\t\t\tподвергается приготовлению, может\n\t\t\t\tприготовиться даже в кли шени.<\/p><p><strong>Б. «Давар гуш» — цельный горячий\n\t\t\t\tкусок пищи.<\/strong><br/>\nНекоторые поским\n\t\t\t\tпридерживаются строгого мнения, что\n\t\t\t\tгорячий цельный кусок, например кусок\n\t\t\t\tмяса, температура которого достигает\n\t\t\t\t«яд соледет бо», способен приготовить\n\t\t\t\tдругой продукт, соприкасающийся с\n\t\t\t\tним, даже если сам этот кусок находится\n\t\t\t\tв кли шени.<\/p><p><strong>В. «Мехазе кимевашель» — выглядит\n\t\t\t\tкак приготовление.<\/strong><br/>\nНекоторые\n\t\t\t\tпоским считают, что, хотя кли шени не\n\t\t\t\tготовит по Торе, мудрецы запретили\n\t\t\t\tпомещать в него неприготовленную\n\t\t\t\tпищу, поскольку это выглядит как\n\t\t\t\tприготовление.<\/p><p>Только в отношении специй такого\n\t\t\t\tпостановления не было, поскольку\n\t\t\t\tочевидно, что человек кладёт специи\n\t\t\t\tне для того, чтобы их приготовить, а\n\t\t\t\tдля того, чтобы придать вкус блюду.<\/p><p><strong>Г. «Яд нихвет бо» — температура,\n\t\t\t\tпри которой рука обжигается.<\/strong><br/>\nНекоторые\n\t\t\t\tпоским ввели дополнительную строгость:\n\t\t\t\tправило о том, что кли шени не готовит,\n\t\t\t\tотносится только к температуре «яд\n\t\t\t\tсоледет бо». Но если пища настолько\n\t\t\t\tгорячая, что <strong>обжигает руку («яд\n\t\t\t\tнихвет бо»)<\/strong>, она способна готовить\n\t\t\t\tдаже в кли шени.<\/p><p>Поэтому всякий раз, когда человек\n\t\t\t\tхочет положить <strong>неприготовленный\n\t\t\t\tпродукт в кли шени<\/strong>, необходимо\n\t\t\t\tубедиться, что отсутствует каждая из\n\t\t\t\tперечисленных причин, по которым это\n\t\t\t\tможет быть запрещено даже в кли шени.<\/p><h3 id=\"part-43\"><font size=\"3\">Кли\nришон<\/font><\/h3><p><strong><font size=\"3\">36.<\/font><\/strong><font size=\"3\">\n<\/font><strong><font size=\"3\">Кли ришон<\/font><\/strong><font size=\"3\">\n— это сосуд, в котором готовилась пища.\nОн способен приготовить продукт,\nпомещённый в него, всё время, пока его\nсодержимое имеет температуру <\/font><strong><font size=\"3\">«яд\nсоледет бо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Поэтому нельзя\nкласть в него продукты или другие вещи,\nв отношении которых существует запрет\nбишуля.<\/font><\/p><p><font size=\"3\">Этот закон\nдействует даже в том случае, если кли\nришон уже снят с огня и постепенно\nостывает. Всё время, пока его температура\nдостигает уровня «яд соледет бо», он\nспособен готовить.<\/font><\/p><p><strong><font size=\"3\">37.<\/font><\/strong><font size=\"3\">\nСосуд считается <\/font><strong><font size=\"3\">кли\nришон<\/font><\/strong><font size=\"3\">\nнезависимо от того, находился ли источник\nтепла под ним, как при обычном приготовлении,\nили источник тепла находился внутри\nнего, например в электрическом михаме,\nгде нагревательный элемент находится\nвнутри воды.<\/font><\/p><p><font size=\"3\">Также сосуд\nсчитается кли ришон, если пища была\nприготовлена в нём другим способом,\nнапример <\/font><strong><font size=\"3\">в\nмикроволновой печи<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-44\"><font size=\"3\">Кли\nшени<\/font><\/h3><p><strong><font size=\"3\">38.<\/font><\/strong><font size=\"3\">\n<\/font><strong><font size=\"3\">Кли шени<\/font><\/strong><font size=\"3\">\n— это сосуд, в который пищу или жидкость\nперелили из кли ришон.<\/font><\/p><p><font size=\"3\">Мудрецы сказали,\nчто <\/font><strong><font size=\"3\">кли\nшени не готовит<\/font><\/strong><font size=\"3\">.\nТо есть даже если находящаяся в кли шени\nпища имеет температуру «яд соледет бо»,\nкли шени всё же не готовит.<\/font><\/p><p><font size=\"3\">Поэтому разрешается\nдобавлять <\/font><strong><font size=\"3\">холодную\nводу в горячую воду, находящуюся в кли\nшени<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">Относительно\nсосуда, в который перелили непосредственно\nиз кли ришон, стоящего на огне, см.\nпримечание.<\/font><\/p><p><font size=\"3\">Однако следует\nзнать, что <\/font><strong><font size=\"3\">не\nво всех случаях разрешается помещать\nпищу в кли шени<\/font><\/strong><font size=\"3\">,\nтемпература которого достигает «яд\nсоледет бо», как будет разъяснено далее.<\/font><\/p><h3 id=\"part-45\">\n<font size=\"4\">«Калей а-бишуль»\n\t\t\t\t— продукты, которые легко готовятся<\/font><\/h3><p>В Мишне, <strong>Шаббат 145<\/strong>, сказано:<\/p><blockquote>«Всё, что не было помещено в\n\t\t\t\tгорячую воду до наступления Шаббата»\n\t\t\t\t— то есть любая неприготовленная\n\t\t\t\tпища — «в Шаббат можно обдать горячей\n\t\t\t\tводой», то есть разрешается полить\n\t\t\t\tеё горячей водой из <strong>кли шени<\/strong>,\n\t\t\t\t«за исключением старой солёной рыбы\n\t\t\t\tи кольяс а-испани», определённых видов\n\t\t\t\tрыбы, для которых такое обдавание\n\t\t\t\tгорячей водой завершает процесс их\n\t\t\t\tприготовления.<\/blockquote><p>Из Гемары, <strong>Шаббат 39<\/strong>, следует,\n\t\t\t\tчто в таком случае существует\n\t\t\t\tобязанность принести <strong>хатат<\/strong>.\n\t\t\t\tРаши там, в комментарии <strong>«ше-адахато»<\/strong>,\n\t\t\t\tобъясняет, что эта обязанность связана\n\t\t\t\tс мелахой <strong>Бишуль<\/strong>.<\/p><p>Отсюда следует, что существуют\n\t\t\t\tпродукты, которые <strong>готовятся очень\n\t\t\t\tлегко<\/strong>, и поэтому существует\n\t\t\t\tзапрет Торы даже в случае, когда на\n\t\t\t\tних льют горячую воду из кли шени. Тем\n\t\t\t\tболее запрещено помещать такие\n\t\t\t\tпродукты непосредственно в кли шени,\n\t\t\t\tнесмотря на то что обычно действует\n\t\t\t\tправило: <strong>«кли шени не готовит»<\/strong>.<\/p><p>Кроме того, в Гемаре, <strong>Шаббат 42<\/strong>,\n\t\t\t\tприводится мнение, согласно которому\n\t\t\t\t<strong>соль готовится даже в кли шени<\/strong>.<\/p><p>На основании этого автор <strong>«Сефер\n\t\t\t\tЙереим»<\/strong> (стр. 134; приведён в\n\t\t\t\tБейт-Йосефе, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ח<\/span><\/font>)\n\t\t\t\tделает вывод, что помимо старой солёной\n\t\t\t\tрыбы и кольяс а-испани, упомянутых в\n\t\t\t\tМишне, существуют и другие продукты,\n\t\t\t\tкоторые легко подвергаются приготовлению.<\/p><p>Поэтому он пишет, что нельзя класть\n\t\t\t\t<strong>хлеб даже в кли шени<\/strong>, поскольку,\n\t\t\t\tвозможно, он относится к категории\n\t\t\t\t<strong>«калей а-бишуль»<\/strong>.<\/p><p>Хотя хлеб уже испечён, «Йереим»\n\t\t\t\tсчитает, что существует <strong>бишуль\n\t\t\t\tпосле выпечки<\/strong>, как было разъяснено\n\t\t\t\tвыше, в пункте 26.<\/p><p><strong>Маген Авраам и Мишна Брура<\/strong>\n\t\t\t\tпишут, что в отношении любого продукта,\n\t\t\t\tо котором у нас нет ясного доказательства\n\t\t\t\tиз Гемары, что он <strong>не относится к\n\t\t\t\t«калей а-бишуль»<\/strong>, следует\n\t\t\t\tопасаться, что он относится к этой\n\t\t\t\tкатегории, и поэтому нельзя помещать\n\t\t\t\tего даже в кли шени.<\/p><p><strong>Хазон Иш<\/strong>, однако, пишет,\n\t\t\t\tчто обычно нет необходимости опасаться\n\t\t\t\tкатегории «калей а-бишуль». Опасаться\n\t\t\t\tследует лишь в отношении тех продуктов,\n\t\t\t\tо которых мы сами видим, что они легко\n\t\t\t\tготовятся, например <strong>хлеб или\n\t\t\t\tсырое яйцо<\/strong>.<\/p><p>Подробные законы будут разъяснены\n\t\t\t\tдалее.<\/p><h3 id=\"part-46\"><font size=\"3\">«Калей\nа-бишуль» в кли шени<\/font><\/h3><p><strong><font size=\"3\">39.<\/font><\/strong><font size=\"3\">\nХотя выше было разъяснено, что <\/font><strong><font size=\"3\">кли\nшени не готовит<\/font><\/strong><font size=\"3\">,\nтем не менее существуют продукты, которые\nлегко подвергаются приготовлению и\nмогут приготовиться даже в кли шени.<\/font><\/p><p><font size=\"3\">Поэтому поским\nпишут, что нельзя класть <\/font><strong><font size=\"3\">хлеб\nдаже в кли шени<\/font><\/strong><font size=\"3\">,\nвсё время пока его температура достигает\n<\/font><strong><font size=\"3\">«яд соледет\nбо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-47\"><font size=\"3\">Что\nсчитается «калей а-бишуль»<\/font><\/h3><p><strong><font size=\"3\">40.<\/font><\/strong><font size=\"3\">\nПоским пишут, что, поскольку мы не умеем\nточно определять, какие продукты\nотносятся к легко приготовляющимся,\nнельзя класть в кли шени, температура\nкоторого достигает «яд соледет бо»,\nникакую пищу, относительно которой в\nГемаре прямо не указано, что это разрешено.<\/font><\/p><p><font size=\"3\">Разрешается\nкласть в кли шени <\/font><strong><font size=\"3\">воду\nи специи<\/font><\/strong><font size=\"3\">,\nпоскольку в Гемаре прямо указано, что\nвода и специи не готовятся в кли шени.<\/font><\/p><p><font size=\"3\">Однако <\/font><strong><font size=\"3\">Хазон\nИш<\/font><\/strong><font size=\"3\"> пишет,\nчто следует придерживаться строгости\nтолько в отношении хлеба, который легко\nподвергается приготовлению, поскольку\nуже был испечён, или в отношении <\/font><strong><font size=\"3\">яйца<\/font><\/strong><font size=\"3\">,\nо котором мы сами видим, что оно готовится\nдаже в кли шени.<\/font><\/p><p><font size=\"3\">Логично, что то\nже самое относится к <\/font><strong><font size=\"3\">чайным\nлистьям и подобным продуктам<\/font><\/strong><font size=\"3\">.\nОднако относительно остальных продуктов\nнет необходимости опасаться, что они\nотносятся к «калей а-бишуль».<\/font><\/p><h3 id=\"part-48\"><font size=\"3\">«Калей\nа-бишуль» в кли шлиши<\/font><\/h3><p><strong><font size=\"3\">41.<\/font><\/strong><font size=\"3\">\nНекоторые поским пишут, что разрешается\nпомещать «калей а-бишуль» в <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">,\nпоскольку только кли шени или обливание\nиз кли шени способны приготовить «калей\nа-бишуль», но не кли шлиши.<\/font><\/p><p><font size=\"3\">Однако <\/font><strong><font size=\"3\">Хазон\nИш<\/font><\/strong><font size=\"3\"> пишет,\nчто в этом отношении нет различия, и\nдаже в кли шлиши запрещено помещать\nпродукты, относящиеся к «калей а-бишуль».<\/font><\/p><p><font size=\"3\">Тем не менее\nстрогость Хазон Иша относительно кли\nшлиши относится именно к тем продуктам,\nо которых <\/font><strong><font size=\"3\">прямо\nсказано в Гемаре<\/font><\/strong><font size=\"3\">,\nчто они относятся к «калей а-бишуль».<\/font><\/p><p><font size=\"3\">Что же касается\nостальных продуктов, которые мы лишь\nиз-за строгости опасаемся отнести к\n«калей а-бишуль», то и Хазон Иш согласен,\nчто на практике следует придерживаться\nстрогости только в кли шени, но не в кли\nшлиши.<\/font><\/p><p><font size=\"3\">Поэтому Хазон\nИш разрешает класть <\/font><strong><font size=\"3\">хлеб\nв кли шлиши<\/font><\/strong><font size=\"3\">.\nОн объясняет, что запрет бишуля хлеба\nоснован лишь на дополнительной строгости,\nа эта строгость была принята только в\nотношении кли шени.<\/font><\/p><p><font size=\"3\">На основании\nсказанного выше приведём несколько\nпрактических примеров.<\/font><\/p><h3 id=\"part-49\"><font size=\"3\">Добавление\nхалы в суп<\/font><\/h3><p><strong><font size=\"3\">42.<\/font><\/strong><font size=\"3\">\nНельзя класть кусочки <\/font><strong><font size=\"3\">халы\nили мацы<\/font><\/strong><font size=\"3\">\nв горячий суп, температура которого\nдостигает «яд соледет бо», если суп\nнаходится в <\/font><strong><font size=\"3\">кли\nшени<\/font><\/strong><font size=\"3\">,\nпоскольку следует опасаться, что хлеб\nотносится к «калей а-бишуль».<\/font><\/p><p><font size=\"3\">В <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\"> это\nразрешено. См. примечание.<\/font><\/p><p><strong><font size=\"3\">Мишна Брура<\/font><\/strong><font size=\"3\">\nпишет, что если половник опустили в кли\nришон, а затем из половника налили суп\nв тарелку, можно облегчить и рассматривать\nтарелку как <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">,\nразрешая положить в неё хлеб.<\/font><\/p><p><font size=\"3\">Поэтому на\nпрактике обычно суп, находящийся в\nтарелке, имеет статус кли шлиши, и\nразрешается класть в него кусочки <\/font><strong><font size=\"3\">хлеба,\nмацы, а также блинчики (блинцес)<\/font><\/strong><font size=\"3\">.\nСм. примечание 105.<\/font><\/p><h3 id=\"part-50\"><font size=\"3\">Чайный\nпакетик<\/font><\/h3><p><strong><font size=\"3\">43.<\/font><\/strong><font size=\"3\">\nНельзя класть <\/font><strong><font size=\"3\">чайный\nпакетик<\/font><\/strong><font size=\"3\">\nв воду, температура которой достигает\n«яд соледет бо», даже если вода находится\nв чашке, имеющей статус <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-51\"><font size=\"3\">Лимон\nв чае<\/font><\/h3><p><strong><font size=\"3\">44.<\/font><\/strong><font size=\"3\">\nПоским расходятся во мнениях, разрешено\nли класть <\/font><strong><font size=\"3\">ломтик\nлимона<\/font><\/strong><font size=\"3\"> в\nчашку чая, имеющую статус кли шени.<\/font><\/p><p><font size=\"3\">Согласно <\/font><strong><font size=\"3\">Маген\nАврааму и Мишна Бруре<\/font><\/strong><font size=\"3\">,\nэто запрещено. По мнению <\/font><strong><font size=\"3\">Хазон\nИша<\/font><\/strong><font size=\"3\">, это\nразрешено, если вода не настолько\nгорячая, чтобы считаться <\/font><strong><font size=\"3\">«яд\nнихвет бо» — обжигающей руку<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><font size=\"3\">В <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">\nможно придерживаться облегчённого\nмнения. См. примечание. То же правило\nотносится к <\/font><strong><font size=\"3\">листьям\nмяты<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-52\"><font size=\"3\">Молоко<\/font><\/h3><p><strong><font size=\"3\">45.<\/font><\/strong><font size=\"3\">\nРазрешается наливать <\/font><strong><font size=\"3\">пастеризованное\nмолоко<\/font><\/strong><font size=\"3\"> в\nкли шени, если его температура не\nдостигает уровня <\/font><strong><font size=\"3\">«яд\nнихвет бо»<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-53\"><font size=\"3\">Молотый\nкофе<\/font><\/h3><p><strong><font size=\"3\">46.<\/font><\/strong><font size=\"3\">\nНельзя класть <\/font><strong><font size=\"3\">молотый\nнерастворимый кофе<\/font><\/strong><font size=\"3\">\nдаже в кли шлиши.<\/font><\/p><h3 id=\"part-54\"><font size=\"3\">Растворимый\nкофе<\/font><\/h3><p><strong><font size=\"3\">47.<\/font><\/strong><font size=\"3\">\nМожно придерживаться облегчённого\nмнения и класть <\/font><strong><font size=\"3\">порошок\nрастворимого кофе<\/font><\/strong><font size=\"3\">,\nкоторый был сварен в процессе производства,\nв кли шени.<\/font><\/p><p><font size=\"3\">Однако некоторые\nсчитают, что желательно соблюдать\nстрогость и класть его только в <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">.<\/font><\/p><h3 id=\"part-55\"><font size=\"3\">Мёд<\/font><\/h3><p><strong><font size=\"3\">48.<\/font><\/strong><font size=\"3\">\nПредставляется, что закон относительно\n<\/font><strong><font size=\"3\">мёда<\/font><\/strong><font size=\"3\">\nподобен закону о ломтике лимона,\nприведённому выше в пункте 44: поским\nрасходятся во мнениях, разрешено ли\nпомещать его в кли шени.<\/font><\/p><p><font size=\"3\">В <\/font><strong><font size=\"3\">кли\nшлиши<\/font><\/strong><font size=\"3\">\nможно придерживаться облегчённого\nмнения.<\/font><\/p><p><font size=\"3\">Относительно\nдобавления <\/font><strong><font size=\"3\">застывшего\nмёда<\/font><\/strong><font size=\"3\"> в\nчашку чая см. далее, глава 4, пункт 50.<\/font><\/p><h3 id=\"part-56\">\n<font size=\"4\">Законы бишуля\n\t\t\t\tв отношении соли<\/font><\/h3><p>В Гемаре, <strong>Шаббат 42<\/strong>, сказано:<\/p><p>Абайе сказал: «Раби Хия учил: соль\n\t\t\t\tне подобна специям, поскольку она\n\t\t\t\tготовится даже в <strong>кли шени<\/strong>».<\/p><p>Существует и другая версия: Абайе\n\t\t\t\tсказал: «Раби Хия учил: соль не подобна\n\t\t\t\tспециям, поскольку она не готовится\n\t\t\t\tдаже в <strong>кли ришон<\/strong>».<\/p><p>И это соответствует словам рава\n\t\t\t\tНахмана: <strong>«Соль требует приготовления,\n\t\t\t\tкак мясо быка»<\/strong>, то есть требует\n\t\t\t\tдлительного и сильного приготовления.<\/p><p>Из Гемары следует, что свойства соли\n\t\t\t\tотличаются от свойств других продуктов.\n\t\t\t\tОбычные продукты готовятся в <strong>кли\n\t\t\t\tришон<\/strong>, даже если он уже не находится\n\t\t\t\tна огне, и не готовятся в кли шени.<\/p><p>Относительно соли существуют два\n\t\t\t\tмнения в Гемаре: согласно одному\n\t\t\t\tмнению, её закон строже, чем у других\n\t\t\t\tпродуктов, и она готовится даже в <strong>кли\n\t\t\t\tшени<\/strong>. Согласно другому мнению,\n\t\t\t\tнаоборот, соль труднее подвергается\n\t\t\t\tприготовлению, чем другие продукты,\n\t\t\t\tи она готовится только в <strong>кли\n\t\t\t\tришон, стоящем на огне<\/strong>.<\/p><p>Практически большинство поским\n\t\t\t\tпостановили в соответствии со вторым\n\t\t\t\tмнением, согласно которому разрешается\n\t\t\t\tдобавлять соль даже в <strong>кли ришон<\/strong>,\n\t\t\t\tесли он уже не находится на огне.<\/p><p>Однако <strong>Тосафот и Мордехай<\/strong>\n\t\t\t\tпишут, что, хотя основная алаха\n\t\t\t\tсоответствует облегчающему мнению,\n\t\t\t\tтот, кто придерживается более строгого\n\t\t\t\tмнения, <strong>достоин благословения\n\t\t\t\t(«таво алав браха»)<\/strong>.<\/p><p>См. <strong>Шульхан Арух<\/strong>, который\n\t\t\t\tпостановил согласно облегчающему\n\t\t\t\tмнению. <strong>Рамо<\/strong> приводит слова\n\t\t\t\tТосафот: тот, кто придерживается\n\t\t\t\tстрогости и не кладёт соль даже в <strong>кли\n\t\t\t\tшени<\/strong>, достоин благословения.<\/p><p>Всё это относится к <strong>соли, которая\n\t\t\t\tранее не была приготовлена<\/strong>.<\/p><p>Что касается <strong>уже приготовленной\n\t\t\t\tсоли<\/strong>, Маген Авраам пишет, что её\n\t\t\t\tразрешается добавлять даже в <strong>кли\n\t\t\t\tришон, который уже не находится на\n\t\t\t\tогне<\/strong>, поскольку действует правило\n\t\t\t\t<strong>«эйн бишуль ахар бишуль» — нет\n\t\t\t\tприготовления после приготовления<\/strong>.<\/p><p><strong>Мишна Брура<\/strong> приводит это\n\t\t\t\tмнение, однако также упоминает, что\n\t\t\t\tнекоторые поским сомневаются в таком\n\t\t\t\tразрешении. В заключение Мишна Брура\n\t\t\t\tпишет, что <strong>изначально желательно\n\t\t\t\tсоблюдать осторожность и не класть\n\t\t\t\tприготовленную соль в кли ришон<\/strong>.<\/p><h3 id=\"part-57\"><font size=\"3\">49.\nЗаконы бишуля в отношении соли<\/font><\/h3><p><font size=\"3\">В вопросе бишуля\nсоли следует различать между <\/font><strong><font size=\"3\">варёной\nсолью<\/font><\/strong><font size=\"3\"> и\n<\/font><strong><font size=\"3\">солью,\nкоторая не проходила процесс варки<\/font><\/strong><font size=\"3\">.<\/font><\/p><p><strong><font size=\"3\">Неварёная\nсоль.<\/font><\/strong><font size=\"3\">\nПоским пишут, что по основному закону\nв отношении такой соли нет запрета\nбишуля даже в <\/font><strong><font size=\"3\">кли\nришон<\/font><\/strong><font size=\"3\">,\nесли он уже не находится на огне. Однако\nесли кли ришон стоит на огне, существует\nзапрет бишуля также и в отношении соли.<\/font><\/p><p><font size=\"3\">Тем не менее тот,\nкто придерживается более строгого\nмнения и не кладёт такую соль даже в <\/font><strong><font size=\"3\">кли\nшени<\/font><\/strong><font size=\"3\">, —\n<\/font><strong><font size=\"3\">«таво алав\nбраха»<\/font><\/strong><font size=\"3\">,\nдостоин благословения.<\/font><\/p><p><font size=\"3\">Таким образом,\nтот, кто придерживается строгости и не\nдобавляет неварёную соль в горячий суп,\nтемпература которого достигает <\/font><strong><font size=\"3\">«яд\nсоледет бо»<\/font><\/strong><font size=\"3\">,\nдостоин благословения.<\/font><\/p><p><strong><font size=\"3\">Варёная\nсоль.<\/font><\/strong><font size=\"3\">\nРазрешается класть её в <\/font><strong><font size=\"3\">кли\nшени<\/font><\/strong><font size=\"3\">, даже\nесли его температура достигает «яд\nсоледет бо».<\/font><\/p><p><font size=\"3\">Однако запрещено\nдобавлять её в кастрюлю, которая стоит\nна огне. Также изначально желательно\nсоблюдать осторожность и не класть её\nв <\/font><strong><font size=\"3\">кли\nришон<\/font><\/strong><font size=\"3\">,\nдаже если он уже снят с огня.<\/font><\/p><p><font size=\"3\">Относительно\nсоли, распространённой <\/font><strong><font size=\"3\">в\nнаше время<\/font><\/strong><font size=\"3\">,\nсм. примечание.<\/font><\/p><p><font size=\"3\">Относительно\nдобавления соли на <\/font><strong><font size=\"3\">«давар\nгуш» — цельный горячий кусок пищи<\/font><\/strong><font size=\"3\">,\nнаходящийся в кли шени, см. далее, пункт\n60.<\/font><\/p><p>\n<font size=\"3\"><strong><font size=\"4\">Михзе<\/font><\/strong><strong><font size=\"4\"><span>й<\/span><\/font><\/strong><strong><font size=\"4\">\n\t\t\t\tке-мевaшель — «выглядит как приготовление»<\/font><\/strong><\/font><\/p><p>Выше уже было объяснено, что <strong>кли\n\t\t\t\tшени<\/strong> не варит и не готовит пищу.\n\t\t\t\tОднако мы объяснили, что существуют\n\t\t\t\tслучаи, когда и в <strong>кли шени<\/strong>\n\t\t\t\tесть запрет приготовления — например,\n\t\t\t\tв отношении продуктов <strong>клей\n\t\t\t\tа-бишуль<\/strong>, то есть продуктов,\n\t\t\t\tкоторые легко подвергаются приготовлению.\n\t\t\t\tВ отношении таких продуктов существует\n\t\t\t\tзапрет даже в <strong>кли шени<\/strong>, как\n\t\t\t\tбыло разъяснено в предыдущих <span>главах<\/span>.<\/p><p>Есть ещё один запрет, который Ришоним\n\t\t\t\tупоминают относительно <strong>кли шени<\/strong>:\n\t\t\t\tмудрецы запретили класть сырые\n\t\t\t\tпродукты в <strong>кли шени<\/strong>, если\n\t\t\t\tего содержимое настолько горячее,\n\t\t\t\tчто <strong>яд соледет бо<\/strong>, поскольку\n\t\t\t\tэто выглядит так, будто человек\n\t\t\t\tзанимается приготовлением пищи —\n\t\t\t\t<strong>махази ке-мевaшель<\/strong>.<\/p><p>Однако в тех случаях, когда действие\n\t\t\t\tне выглядит как приготовление, запрета\n\t\t\t\tнет. Поэтому Мишна на странице <strong>42а\n\t\t\t\tтрактата Шаббат<\/strong> разрешает класть\n\t\t\t\t<strong>тавлин<\/strong> — специи — в <strong>кли\n\t\t\t\tшени<\/strong>. Причина заключается в том,\n\t\t\t\tчто при добавлении специй очевидно,\n\t\t\t\tчто человек хочет <strong>приправить\n\t\t\t\tблюдо<\/strong>, а не приготовить сами\n\t\t\t\tспеции.<\/p><p>Этот закон не был приведён\n\t\t\t\tнепосредственно в <strong>Шулхан Арухе<\/strong>\n\t\t\t\tи <strong>Рамо<\/strong>, однако <strong>Маген\n\t\t\t\tАвраам<\/strong> приводит это постановление,\n\t\t\t\tи <strong>Мишна Брура<\/strong> также приводит\n\t\t\t\tего как практический закон.<\/p><p>То есть основная идея такова: хотя\n\t\t\t\tобычно нельзя класть сырую пищу в\n\t\t\t\tгорячий <strong>кли шени<\/strong>, поскольку\n\t\t\t\tэто выглядит как приготовление, в\n\t\t\t\tслучае со специями это разрешено,\n\t\t\t\tпоскольку очевидно, что цель человека\n\t\t\t\t— придать вкус блюду, а не приготовить\n\t\t\t\tспеции.<\/p><h3 id=\"part-58\"><font size=\"3\">Добавление\nлимона в чашку чая<\/font><\/h3><p><strong>52.<\/strong> Запрет <strong>«ниръэ кимевашель»\n— выглядит как приготовление<\/strong> не\nотносится к добавлению лимона в чашку\nчая, поскольку очевидно, что человек\nкладёт лимон для того, чтобы придать\nнапитку вкус, а не для того, чтобы\nприготовить сам лимон.<\/p><p>Однако см. выше, пункт 40: согласно\nмнению <strong>Маген Авраама и Мишна Бруры<\/strong>,\nкоторые опасаются в отношении любого\nпродукта, что он может относиться к\nкатегории <strong>«калей а-бишуль» — легко\nприготовляющихся продуктов<\/strong>, нельзя\nкласть лимон в чашку, имеющую статус\n<strong>кли шени<\/strong>, из-за опасения «калей\nа-бишуль».<\/p><h3 id=\"part-59\">Добавление воды в кли шени<\/h3><p><strong>53.<\/strong> Разрешается наливать\n<strong>некипячёную воду<\/strong> в кли шени.\nМудрецы не запретили это из-за того, что\nтакое действие выглядит как приготовление.<\/p><h3 id=\"part-60\">Помещение сосуда с пищей\nвнутрь кли шени<\/h3><p><strong>54.<\/strong> Разрешается поместить\nсосуд, в котором находится неприготовленная\nпища или напиток, в горячую воду,\nнаходящуюся в <strong>кли шени<\/strong>, с целью\nих подогрева. Мудрецы не запретили это.<\/p><p>При этом следует следить, чтобы вода\n<strong>не покрывала помещённый в неё сосуд\nполностью<\/strong>, как разъясняется далее,\nв главе 2, пункте 90.<\/p><h3 id=\"part-61\">Помещение остывшей жидкости\nв кли шени<\/h3><p><strong>55.<\/strong> Жидкость, которая была\nприготовлена, а затем остыла, разрешается\nпомещать в <strong>кли шени<\/strong>. В данном\nслучае не опасаются запрета <strong>«мехазе\nкимевашель» — выглядит как приготовление<\/strong>.<\/p><h3 id=\"part-62\">Ируй из кли шени на\nнеприготовленный продукт<\/h3><p><strong>56.<\/strong> Разрешается лить горячую\nпищу или горячую воду из <strong>кли шени<\/strong>\nна неприготовленный продукт. В данном\nслучае не опасаются запрета «мехазе\nкимевашель».<\/p><p>Всё это относится к продуктам, которые\n<strong>не являются легко приготовляющимися<\/strong>.<\/p><p>Однако на продукты категории <strong>«калей\nа-бишуль»<\/strong> нельзя лить даже из кли\nшени, поскольку следует опасаться, что\nони приготовятся, как было разъяснено\nвыше, в пункте 41.<\/p><h3 id=\"part-63\">\n<font size=\"4\">«Яд нихвет бо»\n\t\t\t\t— температура, обжигающая руку<\/font><\/h3><p>Хотя выше было разъяснено, что <strong>кли\n\t\t\t\tшени не готовит<\/strong>, тем не менее\n\t\t\t\tавтор книги <strong>«Хаей Адам»<\/strong>\n\t\t\t\tпишет, что если содержимое этого\n\t\t\t\tсосуда настолько горячее, что достигает\n\t\t\t\tтемпературы <strong>«яд нихвет бо» —\n\t\t\t\tрука обжигается<\/strong>, то оно способно\n\t\t\t\tготовить, и это является запретом <strong>по\n\t\t\t\tТоре<\/strong>.<\/p><p>Источником этого мнения служат\n\t\t\t\tслова <strong>Рамбама, Законы Маасера,\n\t\t\t\t3:15<\/strong>, который пишет, что если масло\n\t\t\t\tпомещают в кли шени, настолько горячий,\n\t\t\t\tчто он достигает степени «яд нихвет\n\t\t\t\tбо», то масло в нём подвергается\n\t\t\t\tприготовлению. Там этот вопрос\n\t\t\t\tрассматривается относительно\n\t\t\t\tустановления обязанности отделения\n\t\t\t\t<strong>маасера<\/strong>.<\/p><p>Автор «Хаей Адам» в своей книге\n\t\t\t\t<strong>«Шаарей Цедек»<\/strong> пишет, что\n\t\t\t\tисточником Рамбама является\n\t\t\t\t<strong>Иерусалимский Талмуд, первая\n\t\t\t\tглава трактата Маасрот<\/strong>. См. там.<\/p><p>Кроме того, он приводит ещё один\n\t\t\t\tисточник для строгого мнения\n\t\t\t\tотносительно «яд нихвет бо» — слова\n\t\t\t\t<strong>Тура, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ח<\/span><\/font><\/strong>,\n\t\t\t\tсогласно которым горячая ванна\n\t\t\t\t(<strong>амбати<\/strong>) способна готовить\n\t\t\t\tдаже в кли шени.<\/p><p>Однако у крупнейших ришоним и\n\t\t\t\tпозднейших поским мы не находим этой\n\t\t\t\tстрогости ни в законах Шаббата, ни в\n\t\t\t\tзаконах <strong>исур ве-этер<\/strong>. На\n\t\t\t\tпервый взгляд, из общего смысла их\n\t\t\t\tслов следует, что они вообще не\n\t\t\t\tпридерживаются этого мнения.<\/p><p><strong>Мишна Брура<\/strong> приводит\n\t\t\t\tвышеупомянутые слова «Хаей Адам».<\/p><p><strong>Хазон Иш<\/strong> пишет, что из того,\n\t\t\t\tчто остальные поским не приводят\n\t\t\t\tзапрет, связанный с «яд нихвет бо»,\n\t\t\t\tследует, что они не придерживаются\n\t\t\t\tэтого мнения. Тем не менее Хазон Иш\n\t\t\t\tпишет, что трудно придерживаться\n\t\t\t\tоблегчённого мнения, когда речь идёт\n\t\t\t\tо возможном <strong>запрете Торы<\/strong>.<\/p><p>В заключение Хазон Иш постановляет,\n\t\t\t\tчто эту строгость следует соблюдать\n\t\t\t\tтолько в <strong>кли шени<\/strong>, но не в\n\t\t\t\t<strong>кли шлиши<\/strong>.<\/p><h3 id=\"part-64\"><font size=\"3\">57.\n«Яд нихвет бо» — дополнительная строгость\nв отношении кли шени<\/font><\/h3><p>Ещё одна дополнительная строгость,\nупомянутая поским относительно <strong>кли\nшени<\/strong>, заключается в следующем: если\nпища или вода, находящиеся в кли шени,\nнастолько горячие, что достигают\nтемпературы <strong>«яд нихвет бо» — рука\nобжигается<\/strong>, а это более высокая\nтемпература, чем <strong>«яд соледет бо»<\/strong>,\nто такой кли шени способен готовить.<\/p><p>Поэтому нельзя класть неприготовленные\nпродукты в кли шени, если он настолько\nгорячий, что достигает степени «яд\nнихвет бо».<\/p><p>Согласно этой строгости, в кли шени,\nтемпература которого достигает «яд\nнихвет бо», нельзя класть даже те\nпродукты, которые <strong>не относятся к\n«калей а-бишуль»<\/strong> и в отношении\nкоторых также нет опасения <strong>«мехазе\nкимевашель» — выглядит как
