о холодным\nи вследствие возвращения на огонь\nнагрелось.<\/p><p>В таком случае блюдо также запрещено\nв пищу в Шаббат, даже если запрет хазары\nбыл нарушен <strong>бе-шогег — по ошибке<\/strong>.<\/p><p><strong>38.<\/strong> Если блюдо не улучшилось\nвследствие запрещённой хазары и его\nтемпература также не повысилась —\nнапример, в момент возвращения на огонь\nоно уже было горячим, — оно <strong>не\nзапрещается в пищу<\/strong>.<\/p><p>Это верно даже несмотря на то, что без\nвозвращения на огонь блюдо остыло бы,\nа хазара помогла сохранить его тепло.<\/p><p><strong>39.<\/strong> Следует знать, что в\nотношении блюда, которое было запрещено\nпотому, что оно было холодным и нагрелось\nвследствие запрещённой хазары, некоторые\nпоским пишут, что существует способ\nразрешить его в пищу: следует подождать,\nпока оно снова остынет <strong>до той\nтемпературы, которую имело до запрещённого\nвозвращения на огонь<\/strong>.<\/p><p>В таком случае дополнительная польза,\nполученная вследствие нарушения запрета,\nустраняется, и поэтому постфактум\n(<strong>бедиавад<\/strong>) блюдо больше не\nследует запрещать.<\/p><p>Однако <strong>Хазон Иш<\/strong> запрещает и\nв этом случае.<\/p><p>Но если качество самого блюда улучшилось\nвследствие запрещённой хазары, например\nоно находилось в состоянии <strong>«мицтамек\nве-яфе ло»<\/strong>, то, по мнению всех, нет\nспособа разрешить его в пищу в Шаббат,\nпоскольку невозможно устранить то\nулучшение, которое было получено\nпосредством запрещённого действия.<\/p><h3 id=\"part-144\">\n<font size=\"5\">Условия разрешённой\n\t\t\t\tхазары<\/font><\/h3><p>При соблюдении определённых условий\n\t\t\t\tмудрецы разрешили возвращать кастрюлю\n\t\t\t\tна огонь.<\/p><p><strong>а.<\/strong> Огонь должен иметь статус\n\t\t\t\t<strong>«груфа у-ктума»<\/strong>. Если же\n\t\t\t\tогонь не является «груфа у-ктума»,\n\t\t\t\t<strong>нет никакого разрешения возвращать\n\t\t\t\tна него кастрюлю<\/strong>.<\/p><p><strong>б.<\/strong> Кроме того, мудрецы\n\t\t\t\tпотребовали, чтобы возвращение\n\t\t\t\tкастрюли на огонь совершалось таким\n\t\t\t\tобразом, чтобы было заметно, что это\n\t\t\t\t<strong>не новая установка кастрюли на\n\t\t\t\tогонь<\/strong>. Новую установку на огонь\n\t\t\t\tмудрецы не разрешили, даже если огонь\n\t\t\t\tявляется «груфа у-ктума».<\/p><p>Поэтому в Гемаре, <strong>Шаббат 38<\/strong>,\n\t\t\t\tприводится мнение, согласно которому,\n\t\t\t\tесли человек поставил кастрюлю <strong>на\n\t\t\t\tземлю<\/strong>, её уже нельзя возвращать\n\t\t\t\tна огонь. Поскольку после того, как\n\t\t\t\tкастрюлю поставили на землю, прежняя\n\t\t\t\t<strong>Шеhия<\/strong> считается прекратившейся,\n\t\t\t\tи её возвращение рассматривается как\n\t\t\t\tновая установка кастрюли на огонь.<\/p><p><strong>в.<\/strong> Кроме того, в Гемаре там\n\t\t\t\tже приводится мнение, что разрешается\n\t\t\t\tвернуть кастрюлю на огонь только в\n\t\t\t\tтом случае, если <strong>в момент снятия\n\t\t\t\tеё с огня человек намеревался вернуть\n\t\t\t\tеё обратно<\/strong>.<\/p><p>Если же он снял кастрюлю с огня без\n\t\t\t\tнамерения вернуть её, возвращать её\n\t\t\t\tзапрещено, поскольку прежняя Шеhия\n\t\t\t\tпрекратилась, и теперь это рассматривается\n\t\t\t\tкак новая установка кастрюли на огонь.<\/p><p>В практической алахе поским расходятся\n\t\t\t\tво мнениях относительно того, какие\n\t\t\t\tименно условия необходимы для\n\t\t\t\tразрешённой хазары.<\/p><p>Далее, с Божьей помощью, будет\n\t\t\t\tразъяснено практическое постановление:\n\t\t\t\tсуществует случай, когда разрешается\n\t\t\t\t<strong>изначально — лехатхила<\/strong>\n\t\t\t\tвернуть кастрюлю на огонь, и существует\n\t\t\t\tслучай, когда это разрешается только\n\t\t\t\t<strong>бедиавад, при необходимости<\/strong>.<\/p><p>Следует также знать, что относительно\n\t\t\t\tприведённых выше условий разрешённой\n\t\t\t\tхазары у <strong>Рана<\/strong> существует\n\t\t\t\tособое мнение.<\/p><p>По его мнению, ограничения, приведённые\n\t\t\t\tв Гемаре, — не ставить кастрюлю на\n\t\t\t\tземлю и снимать её с огня с намерением\n\t\t\t\tвернуть — относятся только к случаю,\n\t\t\t\tкогда кастрюля находилась на огне <strong>с\n\t\t\t\tкануна Шаббата<\/strong>, затем её сняли\n\t\t\t\tещё в канун Шаббата и хотят вернуть\n\t\t\t\tна огонь уже в Шаббат.<\/p><p>Однако в обычном случае, когда\n\t\t\t\tкастрюлю сняли с огня <strong>в сам Шаббат<\/strong>,\n\t\t\t\tпо мнению Рана, разрешается вернуть\n\t\t\t\tеё в любом случае.<\/p><p>Поским постановили практическую\n\t\t\t\tалаху <strong>не согласно мнению Рана<\/strong>.\n\t\t\t\tОднако его мнение присоединяют в\n\t\t\t\tкачестве дополнительного основания\n\t\t\t\tдля разрешения в определённых случаях,\n\t\t\t\tкак будет разъяснено далее.<\/p><h3 id=\"part-145\"><font size=\"3\">Подробности\nразрешённой хазары<\/font><\/h3><p><strong>40.<\/strong> Тот, кто снимает кастрюлю\nс огня и намеревается вернуть её обратно,\nдолжен следить за тем, чтобы при\nвозвращении не возникло опасения\nнарушения запрета <strong>бишуля<\/strong>.<\/p><p>То есть находящееся в кастрюле блюдо\nдолжно быть <strong>полностью приготовлено<\/strong>.<\/p><p>Если же это блюдо с жидкостью или\nсоусом, необходимо также следить за\nтем, чтобы жидкость оставалась горячей.\nЕсли она остыла, при возвращении возникает\nзапрет <strong>бишуля<\/strong>.<\/p><p><strong>41.<\/strong> Кроме того, необходимо,\nчтобы огонь имел статус <strong>«груфа\nу-ктума»<\/strong>. Если огонь не является\n«груфа у-ктума», возвращать на него\nкастрюлю запрещено.<\/p><p>См. выше, пункты <strong>8 и 15<\/strong>, где\nразъясняется, какой огонь считается\n«груфа у-ктума».<\/p><p><strong>42.<\/strong> Изначально (<strong>лехатхила<\/strong>)\nследует соблюдать два условия: кастрюлю\nнужно снимать с огня <strong>с намерением\nвпоследствии вернуть её на огонь<\/strong>,\nа также следует <strong>продолжать держать\nкастрюлю в руке<\/strong>, не ставя её даже\nна кухонную столешницу.<\/p><p>Если человек снял кастрюлю с огня с\nнамерением вернуть её и всё это время\nпродолжает держать её в руке, такая\n<strong>хазара разрешена лехатхила без\nкаких-либо сомнений<\/strong>.<\/p><p><strong>43.<\/strong> Если человек снял кастрюлю\nс огня, имеющего статус «груфа у-ктума»,\n<strong>без намерения вернуть её<\/strong>, а\nзатем передумал и решил вернуть, то,\nесли кастрюля всё ещё находится у него\nв руке, <strong>при необходимости можно\nоблегчить и вернуть её<\/strong>.<\/p><h3 id=\"part-146\">Если поставил кастрюлю на\nземлю<\/h3><p><strong>44.<\/strong> Если человек снял кастрюлю\nс огня, имеющего статус «груфа у-ктума»,\nс намерением вернуть её, но затем <strong>поставил\nеё на землю<\/strong>, возвращать кастрюлю\nна огонь нельзя.<\/p><h3 id=\"part-147\">Поставил кастрюлю на землю,\nпродолжая держать её рукой<\/h3><p><strong>45.<\/strong> Если человек снял кастрюлю\nс огня, имеющего статус «груфа у-ктума»,\nи поставил её на землю, возвращать её\nзапрещено, <strong>даже если он не убирал\nрук с кастрюли<\/strong>.<\/p><p>Однако если только <strong>часть кастрюли\nопирается на землю, а другая её часть\nнаходится в воздухе<\/strong>, и человек\nпродолжает держать её рукой, можно\nпридерживаться облегчённого мнения.<\/p><h3 id=\"part-148\">\n<font size=\"5\">Установка\n\t\t\t\tкастрюли на стул или стол<\/font><\/h3><p>В Гемаре, <strong>Шаббат 38<\/strong>,\n\t\t\t\tрассматривается вопрос о человеке,\n\t\t\t\tкоторый снял кастрюлю с огня и поставил\n\t\t\t\tеё на <strong>кровать<\/strong>, то есть на\n\t\t\t\tстул, скамью или что-либо подобное:\n\t\t\t\tразрешается ли после этого вернуть\n\t\t\t\tеё на огонь?<\/p><p>С одной стороны, поскольку он не\n\t\t\t\tпоставил её на землю, возможно, это\n\t\t\t\tещё не считается полным отвлечением\n\t\t\t\tвнимания от возвращения кастрюли, и\n\t\t\t\tпоэтому разрешается вернуть её на\n\t\t\t\tогонь, имеющий статус <strong>«груфа\n\t\t\t\tу-ктума»<\/strong>.<\/p><p>С другой стороны, поскольку кастрюля\n\t\t\t\tуже не находится у него в руке, возможно,\n\t\t\t\tвозвращать её запрещено.<\/p><p>Суть этого сомнения заключается в\n\t\t\t\tтом, что <strong>стул занимает промежуточное\n\t\t\t\tположение<\/strong>. С одной стороны,\n\t\t\t\tкастрюля уже не находится в руке\n\t\t\t\tчеловека, и это больше похоже на\n\t\t\t\tокончательное снятие её с огня. С\n\t\t\t\tдругой стороны, он не поставил кастрюлю\n\t\t\t\tна землю, которая является обычным\n\t\t\t\tместом для установки кастрюль, снятых\n\t\t\t\tс огня.<\/p><p>Этот вопрос не был разрешён в Гемаре.<\/p><p>В практической алахе <strong>Шулхан\n\t\t\t\tАрух и Рамо<\/strong> расходятся во мнениях:\n\t\t\t\t<strong>Шулхан Арух придерживается\n\t\t\t\tоблегчённого мнения, а Рамо — строгого<\/strong>.<\/p><p>В наше время кастрюлю не так часто\n\t\t\t\tставят на стул. Более распространённые\n\t\t\t\tвопросы возникают, когда её ставят\n\t\t\t\t<strong>на кухонную столешницу или на\n\t\t\t\tстол<\/strong>.<\/p><p>Подробности этих законов см. далее.<\/p><h3 id=\"part-149\"><font size=\"3\">Установка\nкастрюли на стул или кухонную столешницу<\/font><\/h3><p><strong>46.<\/strong> Если человек снял кастрюлю\nс огня, имеющего статус <strong>«груфа\nу-ктума»<\/strong>, с намерением вернуть её\nобратно и поставил кастрюлю <strong>на\nстул<\/strong>, можно придерживаться\nоблегчённого мнения и разрешить ему\nвернуть её на огонь.<\/p><p>По мнению <strong>Хазон Иша<\/strong>, даже\nесли человек снял кастрюлю <strong>без\nнамерения вернуть её<\/strong>, поставил её\nна стул, а затем передумал и решил\nвернуть, можно придерживаться облегчённого\nмнения и вернуть её.<\/p><p><strong>47.<\/strong> Если человек снял кастрюлю\nс огня, имеющего статус <strong>«груфа\nу-ктума»<\/strong>, и поставил её <strong>на\nкухонную столешницу<\/strong>, некоторые\nпоским постановили, что закон в этом\nслучае такой же, как если бы он поставил\nеё на стул, что было разъяснено в\nпредыдущем пункте.<\/p><h3 id=\"part-150\">\n<font size=\"4\">Кастрюля, снятая\n\t\t\t\t\tс огня непреднамеренно, и огонь,\n\t\t\t\t\tпогасший сам по себе<\/font><\/h3><p>В предыдущих пунктах были разъяснены\n\t\t\t\t\tзаконы о кастрюле, которую <strong>намеренно\n\t\t\t\t\tсняли с огня<\/strong>, и условия, при\n\t\t\t\t\tкоторых разрешается вернуть её.<\/p><p>В следующих пунктах будут разъяснены\n\t\t\t\t\tзаконы о кастрюле, которую сняли с\n\t\t\t\t\tогня <strong>по ошибке<\/strong>, а также о\n\t\t\t\t\tслучае, когда <strong>огонь погас сам по\n\t\t\t\t\tсебе<\/strong>.<\/p><p>Основы этих законов зависят от\n\t\t\t\t\tвопроса, что считается полным\n\t\t\t\t\tпрекращением нахождения кастрюли\n\t\t\t\t\tна огне в отношении законов <strong>хазары<\/strong>.\n\t\t\t\t\tВ этом вопросе крупнейшие законоучители\n\t\t\t\t\tнашего времени расходятся во мнениях.\n\t\t\t\t\tПодробно это будет разъяснено в\n\t\t\t\t\tпримечании.<\/p><p><strong>48.<\/strong> Если человек по ошибке\nснял кастрюлю, предназначенную для\nзавтрашней трапезы, полагая, что эта\nкастрюля предназначена для нынешней\nтрапезы, и поставил её <strong>на землю<\/strong>,\nкрупнейшие законоучители расходятся\nво мнениях.<\/p><p>Некоторые пишут, что разрешается\nвернуть её на огонь, имеющий статус\n<strong>«груфа у-ктума»<\/strong>, а другие\nзапрещают.<\/p><p>Даже согласно разрешающим, это относится\nтолько к случаю, когда находящееся в\nкастрюле блюдо <strong>полностью приготовлено<\/strong>.<\/p><p>Если же в кастрюле находится жидкость,\nразрешается вернуть её только при\nусловии, что она <strong>не остыла полностью<\/strong>.\nВ противном случае возвращать кастрюлю\nна огонь запрещено из-за запрета <strong>бишуля<\/strong>.<\/p><p>Если кастрюлю поставили на кухонную\nстолешницу или на кухонный стол, см.\nпримечание.<\/p><h3 id=\"part-151\">Огонь под кастрюлей погас<\/h3><p><strong>49.<\/strong> Если огонь погас и человек\nхочет снять кастрюлю и поставить её на\n<strong>другой огонь, имеющий статус «груфа\nу-ктума»<\/strong>, мнения расходятся:\nнекоторые разрешают перенести кастрюлю\nна другой огонь, а другие запрещают.<\/p><h3 id=\"part-152\">Отключение электричества<\/h3><p><strong>50.<\/strong> Если кастрюля стоит на\nэлектрической плате и подача электричества\nпрекратилась, а затем электричество\nвозобновилось разрешённым способом,\nне связанным с нарушением мелахи в\nШаббат, закон соответствует разъяснённому\nвыше в пункте <strong>49<\/strong>.<\/p><h3 id=\"part-153\">Забыл поставить кастрюлю на\nогонь<\/h3><p><strong>51.<\/strong> Если человек нагрел кастрюлю\nв канун Шаббата, снял её с огня и поставил\nна кухонную столешницу, намереваясь\nпоставить её на огонь, имеющий статус\n<strong>«груфа у-ктума»<\/strong>, но забыл\nсделать это до наступления Шаббата, а\nв Шаббат вспомнил и хочет вернуть её на\nэтот огонь, — см. примечание.<\/p><h3 id=\"part-154\">Кастрюля, находящаяся на\nдругой кастрюле<\/h3><p><strong>52.<\/strong> Если человек нагрел кастрюлю\nв канун Шаббата, снял её с огня и, чтобы\nсохранить её тепло, поставил <strong>на\nдругую кастрюлю<\/strong>, находящуюся на\nогне со статусом «груфа у-ктума», при\nэтом намереваясь убрать нижнюю кастрюлю\nвечером в Шаббат, запрещено после\nудаления нижней кастрюли ставить верхнюю\nкастрюлю непосредственно на этот огонь.<\/p><p>Это рассматривается как <strong>новая\nустановка кастрюли на огонь в Шаббат<\/strong>.<\/p><h3 id=\"part-155\">Хазара внутрь духовки<\/h3><p><strong>53.<\/strong> Дополнительное ограничение\nв законах хазары состоит в том, что\nмудрецы разрешили возвращать кастрюлю\nтолько <strong>на поверхность плиты<\/strong>,\nно не разрешили возвращать её <strong>внутрь\nпечи<\/strong>.<\/p><p>Поэтому нельзя возвращать кастрюлю\nвнутрь газовой или электрической\nдуховки, даже если находящийся в ней\nисточник тепла имел бы статус <strong>«груфа\nу-ктума»<\/strong>.<\/p><p>Однако и без этого обычная современная\nдуховка имеет статус источника тепла,\nкоторый <strong>не является «груфа у-ктума»<\/strong>,\nпоскольку в ней обычно готовят и выпекают,\nа также имеется возможность изменять\nстепень нагрева.<\/p><h3 id=\"part-156\">Хазара внутрь приспособления,\nустановленного на огне — «химумит»<\/h3><p><strong>54.<\/strong> Металлический ящик,\nустановленный на огне или на электрической\nплате: закон возвращения кастрюль внутрь\nнего такой же, как закон возвращения\nкастрюль на металлический лист,\nпокрывающий огонь, или на электрическую\nплату, законы которых были разъяснены\nвыше, в пунктах <strong>8 и 13<\/strong>.<\/p><p>Это не рассматривается как возвращение\nкастрюли <strong>внутрь печи<\/strong>, которое\nбыло запрещено в предыдущем пункте,\nпоскольку такой ящик является лишь\n<strong>покрытием<\/strong>.<\/p><h3 id=\"part-157\">Разрешение «туах бе-тит» в\nотношении хазары<\/h3><p><strong>55.<\/strong> Выше, в пунктах <strong>17–20<\/strong>,\nбыло разъяснено разрешение оставлять\nкастрюлю на огне, когда печь имеет статус\n<strong>«туах бе-тит»<\/strong>, то есть невозможно\nповорошить угли, пока человек не удалит\nглину и не откроет печь.<\/p><p>Причина заключается в том, что, вероятнее\nвсего, пока он совершит эти действия,\nон вспомнит, что ворошить угли запрещено.\nПоэтому мудрецы не установили в таком\nслучае запрет <strong>Шеhия<\/strong>.<\/p><p>Однако относительно <strong>хазары<\/strong>\nна огонь, который не является «груфа\nу-ктума», поским прямо не разъяснили,\nразрешена ли хазара в случае, когда\nместо, позволяющее вмешаться в огонь,\nимеет статус «туах бе-тит».<\/p><p>Представляется, что в этом случае\nследует придерживаться <strong>строгого\nмнения<\/strong>. См. примечание.<\/p><h3 id=\"part-158\">Хазара посредством нееврея<\/h3><p><strong>56.<\/strong> Если человек снял кастрюлю\nс огня таким образом, что самому ему\nзапрещено вернуть её, поским пишут, что\n<strong>при необходимости<\/strong>, то есть\nесли без этой кастрюли у него не будет\nгорячего блюда для трапезы Шаббата,\nразрешается попросить <strong>нееврея<\/strong>\nвернуть кастрюлю на огонь.<\/p><p>Однако <strong>Хазон Иш<\/strong> запрещает\nэто.<\/p><h3 id=\"part-159\">\n<font size=\"5\">Хазара с кануна\n\t\t\t\t\tШаббата<\/font><\/h3><p>В Гемаре, <strong>Шаббат 38<\/strong>, сказано:<\/p><p>«Сказал рав Шешет: согласно мнению\n\t\t\t\t\tтого, кто говорит, что возвращают»,\n\t\t\t\t\t— то есть разрешается возвращать\n\t\t\t\t\tкастрюлю на огонь, имеющий статус\n\t\t\t\t\t<strong>«груфа у-ктума»<\/strong>, — «возвращают\n\t\t\t\t\tдаже в Шаббат».<\/p><p><strong>Тосафот и Рош<\/strong> делают вывод\n\t\t\t\t\tиз этой формулировки, что запрет\n\t\t\t\t\tхазары на огонь, который не является\n\t\t\t\t\t<strong>«груфа у-ктума»<\/strong>, действует\n\t\t\t\t\tдаже в том случае, когда кастрюлю\n\t\t\t\t\tставят на огонь <strong>ещё с кануна\n\t\t\t\t\tШаббата<\/strong>.<\/p><p>На это возникает вопрос: ведь тот,\n\t\t\t\t\tкто ставит кастрюлю на огонь с кануна\n\t\t\t\t\tШаббата, подпадает под законы <strong>Шеhия<\/strong>,\n\t\t\t\t\tа не хазары. Шеhия же разрешена даже\n\t\t\t\t\tна огне, который не является «груфа\n\t\t\t\t\tу-ктума», если блюдо ещё до Шаббата\n\t\t\t\t\tприготовилось до степени <strong>«маахаль\n\t\t\t\t\tбен Друсай»<\/strong>.<\/p><p>Они отвечают, что следует различать,\n\t\t\t\t\t<strong>в какое время кастрюлю ставят\n\t\t\t\t\tна огонь<\/strong>.<\/p><p>Если её ставят за значительное\n\t\t\t\t\tвремя до наступления Шаббата, это\n\t\t\t\t\tотносится к законам <strong>Шеhия<\/strong>.\n\t\t\t\t\tЕсли же её ставят непосредственно\n\t\t\t\t\tперед наступлением Шаббата, это\n\t\t\t\t\tотносится к законам <strong>хазары<\/strong>,\n\t\t\t\t\tи так поступать нельзя, если огонь\n\t\t\t\t\tне является «груфа у-ктума».<\/p><p>Относительно того, какой промежуток\n\t\t\t\t\tвремени считается достаточным, чтобы\n\t\t\t\t\tустановка кастрюли рассматривалась\n\t\t\t\t\tкак Шеhия, <strong>Тосафот и Рош<\/strong>\n\t\t\t\t\tсказали следующее: если с момента\n\t\t\t\t\tустановки кастрюли на огонь до захода\n\t\t\t\t\tсолнца остаётся достаточно времени,\n\t\t\t\t\tчтобы <strong>нагреть её<\/strong>, это\n\t\t\t\t\tотносится к законам Шеhия.<\/p><p>Однако если в момент установки\n\t\t\t\t\tкастрюли на огонь до захода солнца\n\t\t\t\t\tуже <strong>не остаётся достаточно\n\t\t\t\t\tвремени, чтобы нагреть её<\/strong>, и\n\t\t\t\t\tкастрюлю ставят с кануна Шаббата,\n\t\t\t\t\tрассчитывая на то, что она нагреется\n\t\t\t\t\tуже в Шаббат, это считается установкой\n\t\t\t\t\tнепосредственно перед Шаббатом.<\/p><p>В таком случае мудрецы постановили\n\t\t\t\t\tне ставить её на огонь, который не\n\t\t\t\t\tявляется «груфа у-ктума», из опасения,\n\t\t\t\t\tчто человек может впоследствии\n\t\t\t\t\tнарушить запрет <strong>хазары также в\n\t\t\t\t\tсамом Шаббате<\/strong>.<\/p><p>Следует знать, что этот закон о\n\t\t\t\t\t<strong>хазаре с кануна Шаббата<\/strong> не\n\t\t\t\t\tбыл приведён большинством ришоним.\n\t\t\t\t\t<strong>Шулхан Арух<\/strong> также его не\n\t\t\t\t\tприводит.<\/p><p><strong>Рамо<\/strong> приводит этот закон\n\t\t\t\t\tи пишет, что принято придерживаться\n\t\t\t\t\t<strong>облегчённого мнения<\/strong>, однако\n\t\t\t\t\tзавершает словами, что <strong>желательно\n\t\t\t\t\tпридерживаться строгого мнения там,\n\t\t\t\t\tгде в этом нет особой необходимости<\/strong>.<\/p><p><font size=\"3\"><strong>57.<\/strong>\nНекоторые из ришоним установили, что\nзапрет <strong>хазары<\/strong> действует даже\nв том случае, когда человек возвращает\nкастрюлю <strong>в канун Шаббата непосредственно\nперед его наступлением<\/strong> на огонь,\nкоторый не является <strong>«груфа у-ктума»<\/strong>.<\/font><\/p><p>Поскольку он делает это непосредственно\nперед Шаббатом, мудрецы установили\nзапрет из опасения, что он может прийти\nк тому, чтобы вернуть кастрюлю на огонь\nи <strong>в самом Шаббате<\/strong>.<\/p><p>Эти ришоним определили временную\nграницу данного запрета: если до захода\nсолнца и наступления Шаббата <strong>уже\nне остаётся достаточно времени, чтобы\nнагреть эту кастрюлю<\/strong>, это подпадает\nпод постановление о запрете хазары, и\nв это время нельзя ставить кастрюлю на\nогонь.<\/p><p>Даже если в момент установки на огонь\nкастрюля <strong>не холодная<\/strong>, расчёт\nвсё равно производится исходя из того,\nкак если бы она была холодной. То есть\nесли до наступления Шаббата не осталось\nбы достаточно времени нагреть эту\nкастрюлю, <strong>если бы она была холодной<\/strong>,\nэто подпадает под данный запрет.<\/p><p><strong>Рамо<\/strong> пишет, что принято\nпридерживаться в этом вопросе облегчённого\nмнения, однако желательно остерегаться\nэтого там, где в этом нет особой\nнеобходимости.<\/p><p>Всё сказанное относится к огню, который\n<strong>не является «груфа у-ктума»<\/strong>.\nЕсли же огонь имеет статус «груфа\nу-ктума», разрешается вернуть кастрюлю\nещё с кануна Шаббата, даже если её\nпоставили на землю и человек <strong>не\nнамеревался возвращать её на огонь<\/strong>,\nпоскольку всё постановление о запрете\nхазары с кануна Шаббата относится только\nк огню, который не является «груфа\nу-ктума».<\/p><p>Поэтому согласно принятому обычаю,\nпо которому огонь, покрытый металлическим\nлистом, считается <strong>«груфа у-ктума»<\/strong>,\nа также согласно обычаю многих считать\nтаким образом <strong>электрическую плату<\/strong>,\nкак было разъяснено выше, в пункте 13,\nэтот закон на практике встречается не\nтак часто.<\/p><p>Однако согласно мнению <strong>Хазон Иша<\/strong>,\nкоторый считает, что огонь, покрытый\nметаллическим листом, имеет статус\nогня, <strong>не являющегося «груфа у-ктума»<\/strong>,\nэтот закон имеет практическое применение.<\/p><h3 id=\"part-160\">\n<font size=\"5\">Перекладывание\n\t\t\t\t\tпищи из одной кастрюли в другую<\/font><\/h3><p>В Гемаре, <strong>Шаббат 38<\/strong>, рав Аши\n\t\t\t\t\tзадаёт вопрос: <strong>«Пина ми-михам\n\t\t\t\t\tле-михам — чтоов закон?»<\/strong><\/p><p>То есть человек снял кастрюлю с\n\t\t\t\t\tогня и переложил находившееся в ней\n\t\t\t\t\tблюдо в другую, пустую кастрюлю,\n\t\t\t\t\tкоторая до этого <strong>не находилась\n\t\t\t\t\tна огне<\/strong>.<\/p><p>Возник вопрос: разрешается ли\n\t\t\t\t\tпоставить вторую кастрюлю на огонь,\n\t\t\t\t\tимеющий статус <strong>«груфа у-ктума»<\/strong>?<\/p><p>Возможно, поскольку блюдо было\n\t\t\t\t\tпереложено в другую кастрюлю и при\n\t\t\t\t\tэтом немного остыло, установку второй\n\t\t\t\t\tкастрюли на огонь следует рассматривать\n\t\t\t\t\tкак <strong>«нетина батхила» —\n\t\t\t\t\tпервоначальную установку на огонь<\/strong>,\n\t\t\t\t\tчто запрещено даже на огне, имеющем\n\t\t\t\t\tстатус «груфа у-ктума».<\/p><p>В практической алахе <strong>Маген\n\t\t\t\t\tАвраам, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tרנ״ג<\/span><\/font>, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן כ׳<\/span><\/font><\/strong>, пишет, что в этом\n\t\t\t\t\tслучае следует придерживаться\n\t\t\t\t\tстрогого мнения.<\/p><p>Однако <strong>Мишна Брура, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tרנ״ג<\/span><\/font>, Шаар а-Циюн, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן מ״ז<\/span><\/font><\/strong>, пишет, что на\n\t\t\t\t\tпрактике в вышеописанном случае\n\t\t\t\t\tможно придерживаться облегчённого\n\t\t\t\t\tмнения и поставить вторую кастрюлю\n\t\t\t\t\tна огонь. См. там приведённую им\n\t\t\t\t\tпричину.<\/p><p>Следует знать, что всё приведённое\n\t\t\t\t\tвыше сомнение относится именно к\n\t\t\t\t\tслучаю, когда блюдо переложили в\n\t\t\t\t\t<strong>пустую кастрюлю, которая не\n\t\t\t\t\tнаходилась на огне<\/strong>.<\/p><p>Однако если блюдо перекладывают в\n\t\t\t\t\tдругую кастрюлю, которая <strong>уже\n\t\t\t\t\tнаходится на огне<\/strong>, это\n\t\t\t\t\tрассматривается как обычная <strong>хазара<\/strong>,\n\t\t\t\t\tразрешённая на огне, имеющем статус\n\t\t\t\t\t<strong>«груфа у-ктума»<\/strong>.<\/p><p><font size=\"3\"><strong>58.<\/strong>\nРазрешается переливать воду или суп из\nкастрюли, находящейся на огне, в другую\nкастрюлю, находящуюся на огне, имеющем\nстатус <strong>«груфа у-ктума»<\/strong>.<\/font><\/p><p>Такое переливание из одной кастрюли\nв другую рассматривается как <strong>хазара<\/strong>,\nпоскольку блюдо выходит из первой\nкастрюли и вновь попадает в другую\nкастрюлю, стоящую на огне. Поэтому, если\nогонь имеет статус «груфа у-ктума», это\nявляется разрешённой хазарой.<\/p><p>См. далее, примечание <strong>123<\/strong>, где\nразъясняется, что при таком переливании\nиз одной кастрюли в другую могут возникать\nдополнительные вопросы, связанные с\nзапретами Шаббата, а также с законами\n<strong>мяса и молока<\/strong>.<\/p><p>Относительно того, кто хочет налить\nгорячую воду в стакан, чтобы затем\nперелить её в другую кастрюлю, см. далее,\nпункт <strong>60<\/strong>.<\/p><p><strong>59.<\/strong> Если человек снял кастрюлю\nс огня, чтобы взять из неё часть блюда\nдля своей трапезы, разрешается переложить\nоставшееся блюдо в <strong>пустую кастрюлю,\nкоторая до этого не находилась на огне<\/strong>,\nа затем вновь поставить её на огонь,\nесли он имеет статус «груфа у-ктума».<\/p><p>Это рассматривается как разрешённая\nхазара. Несмотря на то что вторая\nкастрюля, в которую переложили блюдо,\nдо этого не находилась на огне, само\nперекладывание блюда в эту кастрюлю <strong>не\nзапрещает последующую хазару на огонь<\/strong>.<\/p><p>Следует знать, что если человек хочет\nнагреть <strong>холодную пищу<\/strong> для\nтрапезы Шаббата, ему запрещено ставить\nеё непосредственно на огонь, даже если\nон имеет статус «груфа у-ктума». Ведь\nна такой огонь разрешена только <strong>хазара<\/strong>,\nно не <strong>«нетина батхила» — первоначальная\nустановка на огонь<\/strong>, как будет\nразъяснено далее, в пункте 61.<\/p><p>Однако согласно сказанному выше\nразрешается налить горячую воду из\nмихама, находящегося на огне, в пустую\nкастрюлю, а затем поставить эту кастрюлю\nс водой на огонь, имеющий статус «груфа\nу-ктума», при условии, что вода всё ещё\n<strong>хотя бы немного горячая<\/strong>. Если\nже она остыла, возникает запрет бишуля.<\/p><p>Такая установка кастрюли с водой\nсчитается разрешённой хазарой.<\/p><p>После этого можно поставить холодную\nпищу <strong>на эту кастрюлю<\/strong> и таким\nобразом нагреть её, как будет разъяснено\nдалее, в пункте <strong>64<\/strong>: разрешается\nнагревать холодную сухую пищу на кастрюле\nс блюдом, находящейся на огне.<\/p><p><strong>60.<\/strong> Разрешается налить горячую\nводу из михама, стоящего на огне, либо\nиз электрического михама <strong>в то время,\nкогда его нагревательные элементы\nвключены<\/strong>, в стакан, а затем перелить\nводу из стакана в кастрюлю с блюдом,\nнаходящуюся на огне, имеющем статус\n<strong>«груфа у-ктума»<\/strong>.<\/p><p>Это рассматривается как разрешённая\nхазара. Несмотря на то что вода была\nперелита в <strong>холодный стакан<\/strong>,\nвсё же разрешается вернуть её на огонь.<\/p><h3 id=\"part-161\">\n<font size=\"5\">Установка блюд\n\t\t\t\t\tна огонь в Шаббат<\/font><\/h3><p>Блюдо, которое <strong>не находилось\n\t\t\t\t\tна огне с кануна Шаббата<\/strong>, запрещено\n\t\t\t\t\tставить на огонь в Шаббат, даже если\n\t\t\t\t\tогонь имеет статус <strong>«груфа у-ктума»<\/strong>\n\t\t\t\t\tи даже если при этом <strong>нет запрета\n\t\t\t\t\tбишуля<\/strong>.<\/p><p>Этот закон выводится из запрета\n\t\t\t\t\t<strong>хазары<\/strong> в случае, когда\n\t\t\t\t\tкастрюлю поставили на землю.<\/p><p>Если даже кастрюлю, которая ранее\n\t\t\t\t\tнаходилась на огне, а затем была снята\n\t\t\t\t\tс него, запрещено возвращать после\n\t\t\t\t\tтого, как её поставили на землю, то\n\t\t\t\t\tтем более запрещено ставить на огонь\n\t\t\t\t\tкастрюлю, которая <strong>с самого начала\n\t\t\t\t\tШаббата находилась в другом месте<\/strong>.<\/p><p>Этот запрет называется <strong>«нетина\n\t\t\t\t\tбатхила» — первоначальная установка\n\t\t\t\t\tна огонь<\/strong>.<\/p><h3 id=\"part-162\"><font size=\"3\">Установка\nблюда на огонь<\/font><\/h3><p><strong>61.<\/strong> Блюдо, которое не находилось\nна огне с кануна Шаббата, нельзя ставить\nна огонь в Шаббат, даже если огонь имеет\nстатус <strong>«груфа у-ктума»<\/strong> и даже\nесли при этом вообще нет запрета бишуля,\nнапример если блюдо сухое и полностью\nприготовленное.<\/p><p>Поэтому нельзя достать блюдо из\nхолодильника и поставить его на\n<strong>электрическую плату<\/strong> или на\n<strong>металлический лист, покрывающий\nогонь<\/strong>. См. далее, пункт 66.<\/p><p>Если человек по ошибке поставил\nполностью приготовленное сухое блюдо\nна огонь и оно нагрелось, оно запрещено\nв пищу, даже если огонь был покрыт.<\/p><p>Если же он поставил его на электрическую\nплату, предназначенную для поддержания\nтепла и обычно не используемую для\nприготовления пищи, следует обратиться\nк раввину с вопросом, запрещается ли\nэто блюдо постфактум (<strong>бедиавад<\/strong>).\nСм. примечание.<\/p><h3 id=\"part-163\">Установка блюда не напротив\nпламени<\/h3><p><strong>62.<\/strong> Если человек хочет в Шаббат\nпоставить блюдо, которое не находилось\nна огне с кануна Шаббата, на металлический\nлист, покрывающий огонь, <strong>не\nнепосредственно напротив пламени<\/strong>,\nследует различать два случая:<\/p><p><strong>а.<\/strong> Если температура\nметаллического листа в этом месте\nдостаточно высока, чтобы довести блюдо\nдо температуры <strong>«яд соледет бо»<\/strong>,\nставить туда блюдо запрещено.<\/p><p><strong>б.<\/strong> Если температура\nметаллического листа в этом месте\nнедостаточно высока, чтобы довести\nблюдо до температуры «яд соледет бо»,\nмнения расходятся: некоторые разрешают\nставить туда блюдо, а другие придерживаются\nстрогого мнения и запрещают. См.\nпримечание.<\/p><h3 id=\"part-164\">Установка блюда на электрическую\nплату<\/h3><p><strong>63.<\/strong> Нельзя первоначально\nставить блюда на электрическую плату\nв Шаббат, даже на то место, которое <strong>не\nнаходится непосредственно над\nнагревательными элементами<\/strong>.<\/p><h3 id=\"part-165\">Установка блюда на наполненную\nкастрюлю<\/h3><p><strong>64.<\/strong> Разрешается поставить\n<strong>холодное сухое блюдо<\/strong> на\nнаполненную кастрюлю или михам с водой,\nнаходящиеся на огне. То же относится и\nк электрическому михаму.<\/p><p>Это разрешено, даже если данное блюдо\nвообще не находилось на огне с кануна\nШаббата.<\/p><p>Такое разрешение действует даже в\nслучае, если огонь <strong>не является\n«груфа у-ктума»<\/strong>.<\/p><p>Однако если в блюде имеется жидкость\nили соус, это запрещено из-за мелахи\n<strong>бишуль<\/strong>, если жидкость может\nдостичь температуры «яд соледет бо».<\/p><p>Следует также следить за тем, чтобы\nне накрывать верхнюю кастрюлю таким\nобразом, при котором возникает запрет\n<strong>атмана<\/strong>. См. далее, пункт 75.<\/p><p>Однако представляется, что нельзя\nпомещать пищу <strong>внутрь кастрюли с\nедой, находящейся на огне<\/strong>, даже\nесли добавляемая пища не смешивается\nс содержимым кастрюли, а лишь лежит\nсверху, и даже если между ними проложена\nалюминиевая фольга.<\/p><p>Причина заключается в том, что всё\nнаходящееся внутри кастрюли рассматривается\nкак находящееся <strong>на самом огне<\/strong>,\nи это считается <strong>«нетина батхила»\n— первоначальной установкой на огонь<\/strong>.<\/p><h3 id=\"part-166\">Установка блюда на пустую\nкастрюлю<\/h3><p><strong>65.<\/strong> Разрешение, приведённое\nв предыдущем пункте, — поставить холодное\nсухое блюдо на кастрюлю, находящуюся\nна огне, — относится именно к случаю,\nкогда эта кастрюля <strong>наполнена пищей<\/strong>.<\/p><p>Если же находящаяся на огне кастрюля\n<strong>пустая<\/strong>, ставить на неё блюдо\nнельзя.<\/p><p><strong>66.<\/strong> Запрет ставить холодное\nсухое блюдо на пустую кастрюлю действует\nкак в случае, когда пустая кастрюля\nнаходится <strong>непосредственно на огне<\/strong>,\nтак и в случае, когда она находится на\nогне, имеющем статус <strong>«груфа у-ктума»<\/strong>,\nнапример на металлическом листе,\nпокрывающем огонь, или на электрической\nплате.<\/p><p>Однако некоторые разрешают это, если\nпустая кастрюля находится на огне,\nимеющем статус «груфа у-ктума», или на\nэлектрической плате.<\/p><h3 id=\"part-167\">Установка блюда на радиатор<\/h3><p><strong>67.<\/strong> Разрешается изначально\n(<strong>лехатхила<\/strong>) в Шаббат поставить\n<strong>холодное сухое блюдо на радиатор<\/strong>,\nпредназначенный для отопления дома.<\/p><p>Следует остерегаться укутывать\nкастрюлю одеялами из-за запрета <strong>атмана\nбе-давар а-мосиф эвель — укутывания\nматериалом, добавляющим тепло<\/strong>, как\nбудет разъяснено далее в этой главе, в\nзаконах атманы, начиная с пункта 74.<\/p><h3 id=\"part-168\">Установка блюда на электрическую\nплату, которая должна включиться\nпосредством таймера<\/h3><p><strong>68.<\/strong> Если электрическая плата\nдолжна включиться в Шаббат посредством\nтаймера, нельзя ставить на неё блюдо <strong>в\nсам Шаббат<\/strong>, даже пока плата ещё не\nвключилась.<\/p><p>Это запрещено даже в отношении блюда,\nпри нагревании которого нет запрета\nбишуля, например если оно полностью\nприготовлено и является сухим, без\nжидкости или соуса.<\/p><p>Однако разрешается поставить блюдо\nна такую плату <strong>ещё с кануна Шаббата<\/strong>.<\/p><p>Когда впоследствии плата включится,\nэто разрешено согласно законам <strong>Шеhия<\/strong>,\nразъяснённым выше в этой главе.<\/p><h3 id=\"part-169\">\n<font size=\"4\">Перемещение\n\t\t\t\t\tкастрюль по металлическому листу\n\t\t\t\t\tили электрической плате<\/font><\/h3><p>Следует рассмотреть случай, когда\n\t\t\t\t\tнад конфорками установлен металлический\n\t\t\t\t\tлист, под ним зажжено одно пламя, а с\n\t\t\t\t\tкануна Шаббата на лист поставили\n\t\t\t\t\tкастрюли <strong>не непосредственно над\n\t\t\t\t\tогнём<\/strong>. Возникает вопрос:\n\t\t\t\t\tразрешается ли передвигать эти\n\t\t\t\t\tкастрюли на место, находящееся\n\t\t\t\t\t<strong>непосредственно над пламенем<\/strong>?<\/p><p>На первый взгляд, это следует\n\t\t\t\t\tзапретить, поскольку кастрюля не\n\t\t\t\t\tнаходилась с кануна Шаббата\n\t\t\t\t\tнепосредственно над огнём, а теперь\n\t\t\t\t\tеё ставят на огонь. <strong>«Нетина\n\t\t\t\t\tбатхила» — первоначальная установка\n\t\t\t\t\tна огонь<\/strong> — запрещена даже на\n\t\t\t\t\tплите, имеющей статус <strong>«груфа\n\t\t\t\t\tу-ктума»<\/strong>.<\/p><p>Однако этот вопрос можно рассмотреть\n\t\t\t\t\tс нескольких сторон.<\/p><p><strong>а.<\/strong> Есть основание считать,\n\t\t\t\t\tчто даже кастрюли, находящиеся не\n\t\t\t\t\tнепосредственно над огнём, всё же\n\t\t\t\t\tрассматриваются как находящиеся <strong>на\n\t\t\t\t\tогне<\/strong>, поскольку они получают\n\t\t\t\t\tтепло от этого огня.<\/p><p>Если это так, возможно, разрешается\n\t\t\t\t\tпередвигать такие кастрюли с этих\n\t\t\t\t\tмест на место непосредственно над\n\t\t\t\t\tпламенем.<\/p><p><strong>б.<\/strong> Даже если предположить,\n\t\t\t\t\tчто эти кастрюли не считаются\n\t\t\t\t\tнаходящимися на огне, возможно, их\n\t\t\t\t\tследует рассматривать как находящиеся\n\t\t\t\t\t<strong>рядом с огнём — «смиха»<\/strong>.<\/p><p>Закон <strong>«смиха»<\/strong> разъясняется\n\t\t\t\t\tв Гемаре, <strong>Шаббат 37<\/strong>: нахождение\n\t\t\t\t\tрядом с огнём не считается таким же,\n\t\t\t\t\tкак установка непосредственно на\n\t\t\t\t\tогонь. Поэтому в Гемаре рассматривается\n\t\t\t\t\tвопрос: согласно мнению, запрещающему\n\t\t\t\t\t<strong>Шеhия<\/strong> на плите, разрешается\n\t\t\t\t\tли с кануна Шаббата поставить кастрюлю\n\t\t\t\t\tна землю рядом со стенкой плиты.<\/p><p>Если действительно считать кастрюли,\n\t\t\t\t\tнаходящиеся на металлическом листе\n\t\t\t\t\tне напротив пламени, подобными\n\t\t\t\t\tкастрюлям, стоящим рядом с плитой,\n\t\t\t\t\tвозможно, разрешается передвинуть\n\t\t\t\t\tих <strong>непосредственно над пламенем<\/strong>.<\/p><p>Как разъясняется в <strong>Хазон Иш,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סימן ל״ז<\/span><\/font>,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סעיף קטן י׳<\/span><\/font><\/strong>,\n\t\t\t\t\tразрешается переместить кастрюлю\n\t\t\t\t\tиз положения <strong>«смиха» — рядом с\n\t\t\t\t\tогнём<\/strong> непосредственно <strong>на\n\t\t\t\t\tплиту<\/strong>.<\/p><p>См. также примечание.<\/p><h3 id=\"part-170\"><font size=\"3\">Перемещение\nкастрюль, находящихся на металлическом\nлисте или электрической плате<\/font><\/h3><p><strong>69.<\/strong> Если кастрюля находится\nна металлическом листе, покрывающем\nогонь, но не непосредственно над пламенем,\nи человек хочет передвинуть её на место\nнепосредственно над пламенем, при этом\nблюдо полностью приготовлено и запрета\n<strong>бишуля<\/strong> нет, следует различать\nнесколько случаев:<\/p><p><strong>а.<\/strong> Если хотя бы <strong>небольшая\nчасть кастрюли находится над огнём<\/strong>,\nразрешается передвинуть её так, чтобы\nона оказалась непосредственно над\nпламенем, даже если большая часть\nкастрюли в данный момент не находится\nнад огнём.<\/p><p><strong>б.<\/strong> Если кастрюля <strong>вообще\nне находится над огнём<\/strong>, современные\nпоским расходятся во мнениях.<\/p><p>Некоторые запрещают передвигать её\nнепосредственно над огнём, даже если\nона находится в таком месте металлического\nлиста, где может нагреться до температуры\n<strong>«яд соледет бо»<\/strong>.<\/p><p>Другие разрешают передвинуть её\nнепосредственно над огнём. По их мнению,\nэто разрешается даже в том случае, если\nв нынешнем месте она не может нагреться\nдо температуры «яд соледет бо», при\nусловии, что в этом месте она всё же\nможет получить <strong>существенное\nдополнительное тепло<\/strong>.<\/p><p><strong>в. Электрическая плата.<\/strong>\nПредставляется, что на электрической\nплате разрешается передвигать кастрюли\n<strong>с одного места на другое во всех\nслучаях<\/strong>.<\/p><p>Причина заключается в том, что всё\nнаходящееся на поверхности электрической\nплаты рассматривается как находящееся\n<strong>непосредственно на самом огне<\/strong>.<\/p><p><strong>70.<\/strong> Если кастрюля находится\nна огне, имеющем статус <strong>«груфа\nу-ктума»<\/strong>, и человек хочет передвинуть\nеё на место, которое не находится\nнепосредственно над огнём, намереваясь\nзатем <strong>сразу же вернуть её обратно\nна огонь<\/strong>, это разрешено.<\/p><p>Например, он хочет достать из неё часть\nблюда и не желает делать это, пока\nкастрюля находится непосредственно\nнад огнём, из-за опасения нарушения\nзапрета <strong>агаса — помешивания<\/strong>,\nкак было разъяснено выше, в главе 1,\nпункте 93.<\/p><p>В таком случае разрешается вернуть\nкастрюлю обратно на огонь.<\/p><h3 id=\"part-171\">\n<font size=\"3\">Добавление воды\n\t\t\t\t\tв кастрюлю с хамином в Шаббат<\/font><\/h3><p>Если человек видит, что находящееся\n\t\t\t\t\tв кастрюле блюдо слишком сильно\n\t\t\t\t\tуварилось и может подгореть, и хочет\n\t\t\t\t\tдобавить в кастрюлю воду, следует\n\t\t\t\t\tрассмотреть несколько возможных\n\t\t\t\t\tзапретов:<\/p><p><strong>а. Запрет бишуля<\/strong> — в\n\t\t\t\t\tотношении воды, которую добавляют в\n\t\t\t\t\tкастрюлю.<\/p><p><strong>б. Запрет агасы — помешивания<\/strong>\n\t\t\t\t\t— в случае, если при наливании воды\n\t\t\t\t\tнаходящееся в кастрюле блюдо\n\t\t\t\t\tперемешивается.<\/p><p><strong>в. Запрет хазары или «нетина\n\t\t\t\t\tбатхила»<\/strong> — в отношении воды,\n\t\t\t\t\tкоторую добавляют в кастрюлю.<\/p><p><strong>г. Запрет бишуля после цлии<\/strong>\n\t\t\t\t\t— если блюдо высохло или подгорело\n\t\t\t\t\tи теперь в него добавляют воду. Следует\n\t\t\t\t\tрассмотреть, не считается ли это\n\t\t\t\t\t<strong>бишулем после цлии, последовавшей\n\t\t\t\t\tза бишулем<\/strong>.<\/p><p><strong>д. Возможные запреты, связанные\n\t\t\t\t\tс законами мяса и молока.<\/strong><\/p><p>См. примечание, где эти вопросы\n\t\t\t\t\tподробно рассмотрены.<\/p><p><font size=\"3\">Следует\n\t\t\t\t\tразличать во всех приведённых выше\n\t\t\t\t\tвопросах, <strong>каким именно способом\n\t\t\t\t\tгорячую воду наливают в кастрюлю<\/strong>.<\/font><\/p><p>Есть те, кто делает это непосредственно:\n\t\t\t\t\tподнимает михам с огня и наливает из\n\t\t\t\t\tнего воду прямо в кастрюлю с хамином,\n\t\t\t\t\tнаходящуюся на огне.<\/p><p>Другой способ — поднять кастрюлю\n\t\t\t\t\tс хамином, поднести её под кран михама\n\t\t\t\t\tи открыть кран.<\/p><p>Есть также способ наполнить стакан\n\t\t\t\t\tгорячей водой из михама, а затем\n\t\t\t\t\tперелить эту воду из стакана в кастрюлю\n\t\t\t\t\tс хамином.<\/p><p>Подробности этих законов см. далее.<\/p><p><font size=\"3\"><strong>71.<\/strong>\nЕсли человек видит, что кастрюля с\nхамином высохла и блюдо может подгореть,\nи хочет добавить в неё воду, он должен\nследить за тем, чтобы не добавлять\n<strong>неприготовленную воду<\/strong>, из-за\nзапрета <strong>бишуля<\/strong>.<\/font><\/p><p>Также нельзя добавлять в неё воду,\nкоторая ранее была приготовлена, но\nзатем <strong>остыла<\/strong>.<\/p><p><strong>72.<\/strong> Также запрещено наливать\nв кастрюлю с хамином, находящуюся на\nогне, горячую воду <strong>из термоса<\/strong>.<\/p><p>Хотя запрета бишуля здесь нет, поскольку\nвода уже была приготовлена и ещё не\nостыла, всё же существует запрет <strong>«нетина\nбатхила» — первоначальной установки\nна огонь<\/strong>: человек берёт воду, которая\nне находилась на огне, и помещает её в\nкастрюлю, стоящую на огне.<\/p><p><strong>73.<\/strong> Если человек хочет добавить\nв кастрюлю с хамином горячую воду <strong>из\nмихама, находящегося на огне<\/strong>, таким\nобразом, что запрета бишуля нет, следует\nосторожно, не вызывая перемешивания,\nналить воду в кастрюлю, находящуюся на\nогне.<\/p><p>Это можно сделать несколькими способами:<\/p><p><strong>а.<\/strong> Разрешается снять кастрюлю\nс хамином с покрытого огня, поднести её\nпод кран михама и открыть кран.<\/p><p>Следует следить за тем, чтобы <strong>пар,\nподнимающийся от кастрюли с хамином,\nне достигал крана михама<\/strong>.<\/p><p><strong>б.<\/strong> Также разрешается поднять\nмихам и осторожно налить из него воду\nнепосредственно в кастрюлю, находящуюся\nна огне.<\/p><p>И в этом случае следует следить за\nтем, чтобы <strong>пар от мясной кастрюли\nне достигал михама<\/strong>.<\/p><p><strong>в.<\/strong> Также разрешается налить\nводу из михама <strong>в стакан<\/strong>, а затем\nосторожно перелить её из стакана в\nкастрюлю с хамином.<\/p><h3 id=\"part-172\">\n<font size=\"5\">Запрет атманы<\/font><\/h3><p>В Гемаре, <strong>Шаббат 34<\/strong>, сказано:<\/p><p>Сказал Рава: «Почему мудрецы\n\t\t\t\tпостановили, что после наступления\n\t\t\t\tтемноты нельзя совершать атману\n\t\t\t\tматериалом, который не добавляет\n\t\t\t\tтепло? Это постановление из опасения,\n\t\t\t\tчто человек может вскипятить [блюдо]»\n\t\t\t\tи т. д.<\/p><p>И ещё сказал Рава: «Почему мудрецы\n\t\t\t\tпостановили, что нельзя совершать\n\t\t\t\tатману материалом, добавляющим тепло,\n\t\t\t\tдаже с кануна Шаббата? Это постановление\n\t\t\t\tиз опасения, что человек может укутать\n\t\t\t\tкастрюлю горячей золой, в которой\n\t\t\t\tнаходится тлеющий уголь».<\/p><p><strong>Атмана<\/strong> означает укутывание\n\t\t\t\tкастрюли, в которой находится блюдо,\n\t\t\t\tлибо самого блюда с целью <strong>сохранить\n\t\t\t\tего тепло или увеличить его<\/strong>.<\/p><p>Из приведённой выше Гемары следует,\n\t\t\t\tчто в запрете атманы необходимо\n\t\t\t\tразличать <strong>два отдельных\n\t\t\t\tпостановления мудрецов<\/strong>, каждое\n\t\t\t\tиз которых имеет свою причину.<\/p><h3 id=\"part-173\">а. Атмана материалом,\n\t\t\t\tдобавляющим тепло<\/h3><p>Запрещено укутывать кастрюлю\n\t\t\t\tматериалом, который <strong>добавляет\n\t\t\t\tей тепло<\/strong>.<\/p><p>Причина этого запрета разъяснена\n\t\t\t\tв приведённой выше Гемаре: мудрецы\n\t\t\t\tопасались, что человек может совершить\n\t\t\t\tатману в <strong>«ремец ше-еш бо гахелет»\n\t\t\t\t— горячей золе, в которой находится\n\t\t\t\tтлеющий уголь<\/strong>, то есть в горячем\n\t\t\t\tпепле, смешанном с ещё не погасшими\n\t\t\t\tуглями.<\/p><p>Если он поступит так, существует\n\t\t\t\tопасение, что он станет <strong>ворошить\n\t\t\t\tугли<\/strong>.<\/p><p>Поскольку основа запрета связана\n\t\t\t\tс опасением, что человек станет\n\t\t\t\tворошить угли, мудрецы запретили\n\t\t\t\tтакую атману, даже если кастрюлю\n\t\t\t\tукутали <strong>ещё с кануна Шаббата<\/strong>.\n\t\t\t\tВедь сам факт того, что в Шаббат\n\t\t\t\tкастрюля находится в материале,\n\t\t\t\tдобавляющем тепло, создаёт опасение,\n\t\t\t\tчто человек станет ворошить угли.<\/p><h3 id=\"part-174\">б. Атмана материалом, не\n\t\t\t\tдобавляющим тепло<\/h3><p>Запрещено укутывать кастрюлю также\n\t\t\t\tматериалом, который <strong>не добавляет\n\t\t\t\tей тепло<\/strong>, а лишь сохраняет уже\n\t\t\t\tимеющееся тепло.<\/p><p>Причина этого запрета также разъяснена\n\t\t\t\tв Гемаре. Мудрецы опасались, что, когда\n\t\t\t\tчеловек захочет совершить атману, он\n\t\t\t\tобнаружит, что кастрюля уже остыла,\n\t\t\t\tи, поскольку он хочет получить горячее\n\t\t\t\tблюдо, может нарушить запрет и <strong>вновь\n\t\t\t\tвскипятить кастрюлю<\/strong>.<\/p><p>Однако атмана материалом, который\n\t\t\t\tне добавляет тепло, запрещена <strong>только\n\t\t\t\tв сам Шаббат<\/strong>. Разрешается совершить\n\t\t\t\tтакую атману с кануна Шаббата.<\/p><p>Причина заключается в том, что при\n\t\t\t\tэтом постановлении основное опасение\n\t\t\t\tотносится именно <strong>к моменту\n\t\t\t\tсовершения атманы<\/strong>, когда человек\n\t\t\t\tможет прийти к тому, чтобы вновь\n\t\t\t\tвскипятить кастрюлю. Поэтому, если\n\t\t\t\tатмана совершается ещё с кануна\n\t\t\t\tШаббата, такого опасения нет.<\/p><h3 id=\"part-175\"><font size=\"5\">Частичная\n\t\t\t\tатмана<\/font><\/h3><p>Ришоним расходятся во мнениях\n\t\t\t\tотносительно случая, когда человек\n\t\t\t\tукутал <strong>не всю кастрюлю, а только\n\t\t\t\tеё часть<\/strong>: подпадает ли это также\n\t\t\t\tпод постановление о запрете атманы,\n\t\t\t\tили же атмана запрещена только тогда,\n\t\t\t\tкогда укутана <strong>вся кастрюля\n\t\t\t\tцеликом<\/strong>.<\/p><p>Это разногласие относится как к\n\t\t\t\tатмане <strong>материалом, добавляющим\n\t\t\t\tтепло<\/strong>, так и к атмане <strong>материалом,\n\t\t\t\tне добавляющим тепло<\/strong>.<\/p><p><font size=\"3\">В\n\t\t\t\tотношении практической алахи <strong>Шулхан\n\t\t\t\tАрух и Рамо<\/strong> расходятся во мнениях\n\t\t\t\tпо этому вопросу в <strong>симан 253, <\/strong><\/font><font face=\"Tahoma\"><font size=\"3\"><span><strong>סעיף\n\t\t\t\tא׳<\/strong><\/span><\/font><\/font><font size=\"3\">.<\/font><\/p><p><strong>Шулхан Арух<\/strong> запрещает\n\t\t\t\tставить кастрюлю таким образом, чтобы\n\t\t\t\tона соприкасалась с углями, поскольку\n\t\t\t\tсчитает, что <strong>частичная атмана\n\t\t\t\tтакже считается атманой<\/strong>.<\/p><p><strong>Рамо<\/strong> разрешает это.<\/p><p>Большинство поским придерживаются\n\t\t\t\tоблегчённого мнения, согласно <strong>Рамо<\/strong>.\n\t\t\t\tТак же постановляет <strong>Мишна Брура<\/strong>,\n\t\t\t\tи таков принятый обычай.<\/p><p>Однако, по мнению <strong>Хазон Иша<\/strong>,\n\t\t\t\tчастичная атмана считается атманой\n\t\t\t\tи запрещена.<\/p><h3 id=\"part-176\"><font size=\"4\">Укутывание\n\t\t\t\tкастрюли, находящейся на огне<\/font><\/h3><p>Если человек укутывает тканью\n\t\t\t\tкастрюлю, находящуюся на огне, даже\n\t\t\t\tесли огонь покрыт, и то же самое\n\t\t\t\tотносится к кастрюле, находящейся на\n\t\t\t\t<strong>электрической плате<\/strong>, это\n\t\t\t\tзапрещено по закону <strong>атманы\n\t\t\t\tматериалом, добавляющим тепло<\/strong>.<\/p><p>Так поступать запрещено даже <strong>с\n\t\t\t\tкануна Шаббата<\/strong>.<\/p><p>Хотя сама ткань не добавляет тепло,\n\t\t\t\tсочетание <strong>тепла, поступающего\n\t\t\t\tснизу<\/strong>, с тканью, которой укутана\n\t\t\t\tкастрюля, рассматривается как <strong>атмана\n\t\t\t\tматериалом, добавляющим тепло<\/strong>.<\/p><h3 id=\"part-177\"><font size=\"3\">Подробности\nзаконов атманы<\/font><\/h3><p><strong>74.<\/strong> Мудрецы запретили укутывать\nкастрюлю с целью сохранить её тепло.\nЭтот запрет называется <strong>атмана<\/strong>.<\/p><p>Запрет атманы разделяется на два\nотдельных постановления:<\/p><p><strong>а. Атмана материалом, добавляющим\nтепло.<\/strong> То есть человек укутывает\nкастрюлю материалом, который добавляет\nей тепло.<\/p><p>Этот запрет действует даже в том\nслучае, если атмана совершается <strong>с\nкануна Шаббата<\/strong>. Причина заключается\nв том, что мудрецы опасались, что человек\nможет совершить атману в горячей золе,\nсодержащей угли, а затем станет ворошить\nих в Шаббат и нарушит запрет <strong>авъара\n— разжигания огня<\/strong>.<\/p><p><strong>б. Атмана материалом, не добавляющим\nтепло.<\/strong> То есть человек укутывает\nкастрюлю материалом, который не добавляет\nей тепло, а лишь сохраняет уже имеющееся\nтепло.<\/p><p>Этот запрет легче, чем запрет атманы\nматериалом, добавляющим тепло, и действует\nтолько в случае, когда атмана совершается\n<strong>в сам Шаббат<\/strong>. Если же она\nсовершается с кануна Шаббата, это\nразрешено.<\/p><p>Причина запрета заключается в опасении,\nчто, когда человек захочет укутать свою\nкастрюлю, он обнаружит, что она остыла,\nи, поскольку он хочет получить горячее\nблюдо, может нарушить запрет и вновь\nнагреть кастрюлю.<\/p><h3 id=\"part-178\">\n\t\t\t\tАтмана материалом, добавляющим тепло<\/h3><p>Во времена мудрецов было принято\n\t\t\t\tсовершать атману с использованием\n\t\t\t\tматериалов, которые по своей природе\n\t\t\t\tдобавляют тепло. В наше время такие\n\t\t\t\tматериалы обычно не используются.<\/p><p>Тем не менее и сегодня существуют\n\t\t\t\tнекоторые случаи атманы материалом,\n\t\t\t\tдобавляющим тепло, как будет разъяснено\n\t\t\t\tдалее.<\/p><h3 id=\"part-179\">Укутывание тканью кастрюли,\nнаходящейся на огне<\/h3><p><strong>75.<\/strong> Выше, во введении к законам\nатманы, было разъяснено, что запрещается\nукутывать тканью кастрюлю, находящуюся\nна огне, поскольку тепло, поступающее\nснизу, соединяется с тканью, которой\nукутана кастрюля, и это рассматривается\nкак <strong>атмана, добавляющая тепло<\/strong>.<\/p><p>Этот закон часто встречается в наше\nвремя:<\/p><p><strong>а.<\/strong> Если кастрюля находится\nна огне, даже если огонь покрыт, запрещено\nукутывать её тканью, одеялами и тому\nподобным. Это запрещено даже с кануна\nШаббата, поскольку рассматривается как\nатмана материалом, добавляющим тепло.<\/p><p>Если же укутана не вся кастрюля, а\nтолько её часть, см. далее, пункт 78.<\/p><p><strong>б.<\/strong> Также запрещено укутывать\nкастрюлю, находящуюся на <strong>электрической\nплате<\/strong>.<\/p><p><strong>в.<\/strong> Также запрещено укутывать\n<strong>михам<\/strong> — как электрический,\nтак и михам, находящийся на огне.<\/p><p>Также нельзя оборачивать михам\nспециальным тканевым покрытием,\nизготовленным по размеру михама.<\/p><p><strong>г.<\/strong> Даже если кастрюля не\nнаходится непосредственно на источнике\nтепла, а стоит <strong>на другой кастрюле,\nнаходящейся на огне<\/strong>, укутывать её\nзапрещено, поскольку она получает тепло\nот огня и от находящейся под ней кастрюли.<\/p><h3 id=\"part-180\">Покрытия, в отношении которых\nнет запрета атманы<\/h3><p><strong>76.<\/strong> Обычная <strong>крышка кастрюли<\/strong>\nне рассматривается как атмана, даже\nесли она соприкасается с пищей, поскольку\nеё основное предназначение — защищать\nпищу от загрязнения.<\/p><p><strong>77.<\/strong> Если на михам положили\nпищу, которая не находится в закрытой\nкастрюле, например положили её на\nтарелку, разрешается накрыть её <strong>одним\nпокрытием<\/strong>.<\/p><p>Это не рассматривается как атмана, а\nсчитается обычным накрыванием для\nзащиты пищи от пыли и загрязнений,\nкоторые могут попасть на неё.<\/p><p>Поэтому разрешается завернуть пищу\n<strong>в алюминиевую фольгу<\/strong> и положить\nеё на михам.<\/p><p>Однако не следует оборачивать её\nлишними слоями алюминиевой фольги,\nпоскольку внешний слой уже не нужен для\nзащиты пищи от загрязнения, а служит\nдля сохранения тепла, и это считается\n<strong>атманой<\/strong>.<\/p><h3 id=\"part-181\">Частичная атмана<\/h3><p><strong>78.<\/strong> Ришоним расходятся во\nмнениях, запрещена ли <strong>частичная\nатмана<\/strong>, или же она вообще не считается\nатманой.<\/p><p>Согласно практической алахе, <strong>Шулхан\nАрух<\/strong> запрещает, а <strong>Рамо<\/strong>\nпридерживается облегчённого мнения.<\/p><p>Так же, как Рамо, постановляет <strong>Мишна\nБрура<\/strong>, и таков принятый обычай.<\/p><p>Однако <strong>Хазон Иш<\/strong> постановляет\nсогласно мнению запрещающих.<\/p><p><strong>79.<\/strong> Частичной атманой считается\nслучай, когда <strong>значительная часть\nкастрюли остаётся открытой<\/strong>, причём\nэто открытое пространство приводит к\nсущественной потере тепла кастрюли.<\/p><p>Если же открытой оставлена лишь\nнебольшая часть, это не считается\nчастичной атманой, а рассматривается\nкак <strong>полная атмана<\/strong>, и запрещено.<\/p><p><strong>80.<\/strong> Нет различия между случаем,\nкогда кастрюлю укутали сверху, оставив\nоткрытой значительную часть снизу, и\nслучаем, когда её укутали снизу, оставив\nоткрытой значительную часть сверху.<\/p><p>Всякий раз, когда значительная часть\nкастрюли остаётся открытой таким\nобразом, что из-за этого теряется тепло\nкастрюли, это считается <strong>частичной\nатманой<\/strong>.<\/p><p><strong>81.<\/strong> Даже если снаружи укутана\nвся та часть кастрюли, которая находится\nнапротив самого блюда, а открытой\nоставлена часть кастрюли <strong>выше\nуровня блюда<\/strong>, если открытая часть\nимеет значительный размер, как было\nразъяснено выше, в пункте 79, это считается\n<strong>частичной атманой и разрешено<\/strong>.<\/p><h3 id=\"part-182\">\n<font size=\"5\">Покрытие, не\n\t\t\t\t\tсоприкасающееся с кастрюлей<\/font><\/h3><p>Выше было разъяснено, что <strong>атмана<\/strong>\n\t\t\t\t\tзаключается в том, что кастрюлю\n\t\t\t\t\tукутывают тканью или другим материалом,\n\t\t\t\t\tблагодаря чему сохраняется её тепло.<\/p><p>Поским пишут, что если ткань <strong>не\n\t\t\t\t\tсоприкасается с кастрюлей<\/strong>, а\n\t\t\t\t\tмежду ней и кастрюлей имеется воздушный\n\t\t\t\t\tпромежуток, это не считается атманой\n\t\t\t\t\tи разрешено даже согласно мнениям,\n\t\t\t\t\tзапрещающим частичную атману.<\/p><p>Поэтому <strong>Шулхан Арух, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tרנ״ז סעיף ח׳<\/span><\/font><\/strong>, пишет: если\n\t\t\t\t\tнад кастрюлей поставить большой\n\t\t\t\t\tсосуд, который шире самой кастрюли\n\t\t\t\t\tи не соприкасается с её боковыми\n\t\t\t\t\tстенками, разрешается укутать этот\n\t\t\t\t\tвнешний сосуд тканью со всех сторон.<\/p><p>Поскольку между тканью и кастрюлей,\n\t\t\t\t\tв которой находится блюдо, имеется\n\t\t\t\t\t<strong>воздушный промежуток<\/strong>, это\n\t\t\t\t\tне считается атманой.<\/p><p><strong>82.<\/strong> Если ткань не соприкасается\nс кастрюлей, это не считается атманой.<\/p><p>Поэтому тот, кто хочет хорошо сохранить\nтепло блюда, может поступить следующим\nобразом: поставить над кастрюлей с\nблюдом широкий сосуд таким образом,\nчтобы его стенки <strong>не соприкасались\nс боковыми стенками кастрюли<\/strong>. После\nэтого разрешается положить на внешний\nсосуд ткань и укутать его со всех сторон.<\/p><p>Так разрешается поступать даже с\nкастрюлей, <strong>находящейся на огне<\/strong>.<\/p><p><strong>83.<\/strong> Также разрешается положить\nна верх кастрюли широкий поднос таким\nобразом, чтобы он <strong>выступал за её\nкрая<\/strong>, а затем положить на этот\nподнос ткань.<\/p><p>Это разрешено даже в том случае, если\nткань свисает по сторонам, поскольку\nмежду тканью и кастрюлей имеется\nвоздушный промежуток.<\/p><p><strong>84.<\/strong> Воздушный промежуток между\nтканью и кастрюлей должен быть <strong>заметным<\/strong>.\nНезначительного промежутка недостаточно.<\/p><h3 id=\"part-183\">Укутывание нескольких\nкастрюль, стоящих рядом<\/h3><p><strong>85.<\/strong> Если на огне стоят несколько\nкастрюль рядом друг с другом, представляется,\nчто нельзя накрывать их тканью таким\nобразом, чтобы она <strong>укутывала их все\nвместе<\/strong>.<\/p><h3 id=\"part-184\">Установка кастрюли внутрь\nдуховки<\/h3><p><strong>86.<\/strong> Разрешается с кануна\nШаббата поставить кастрюлю <strong>внутрь\nдуховки<\/strong>. Сама духовка не рассматривается\nкак атмана, поскольку она не соприкасается\nс кастрюлей со всех сторон.<\/p><h3 id=\"part-185\">Покрытие михама<\/h3><p><strong>87.<\/strong> Если михам устроен таким\nобразом, что в его верхнюю часть\nвставляется дополнительный сосуд,\nразмеры которого соответствуют ширине\nмихама, этот верхний сосуд рассматривается\nкак <strong>укутанный с боков стенками\nмихама<\/strong>.<\/p><p>Это подобно частичной атмане, закон\nкоторой был разъяснён выше, в пункте\n<strong>78<\/strong>.<\/p><p>При использовании такого михама\nследует следить за тем, чтобы <strong>не\nкласть ткань поверх крышки<\/strong>, поскольку\nтогда верхний сосуд окажется укутанным\nсо всех сторон, и это будет запрещённой\nатманой даже с кануна Шаббата.<\/p><h3 id=\"part-186\">Кастрюля для медленного\nприготовления<\/h3><p><strong>88.<\/strong> Относительно закона\n<strong>кастрюли для медленного приготовления\n(slow cooker)<\/strong> см. примечание.<\/p><h3 id=\"part-187\">\n<font size=\"5\">Атмана в воде\n\t\t\t\t\tили в пище, находящейся внутри сосуда<\/font><\/h3><p>Если хотят поместить пищу или сосуд,\n\t\t\t\t\tсодержащий пищу либо напиток, <strong>в\n\t\t\t\t\tсосуд с горячей водой, который не\n\t\t\t\t\tнаходится на огне<\/strong>, или <strong>в\n\t\t\t\t\tкастрюлю с хамином, которая не\n\t\t\t\t\tнаходится на огне<\/strong>, необходимо\n\t\t\t\t\tрассмотреть этот вопрос с нескольких\n\t\t\t\t\tразличных сторон.<\/p><h3 id=\"part-188\">а. То, что постепенно\n\t\t\t\t\tостывает, не считается материалом,\n\t\t\t\t\tдобавляющим тепло<\/h3><p>Поским пишут, что то, что <strong>постепенно\n\t\t\t\t\tостывает и его тепло не обновляется\n\t\t\t\t\tпостоянно<\/strong>, не определяется как\n\t\t\t\t\tматериал, добавляющий тепло.<\/p><p>Поэтому, если имеется <strong>кипящий\n\t\t\t\t\tмихам, снятый с огня<\/strong>, разрешается\n\t\t\t\t\tс кануна Шаббата поставить на него\n\t\t\t\t\tкастрюлю с пищей и укутать её тканью.\n\t\t\t\t\tХотя горячая вода в михаме нагревает\n\t\t\t\t\tкастрюлю, находящуюся на нём и\n\t\t\t\t\tукутанную тканью, это не рассматривается\n\t\t\t\t\tкак <strong>атмана материалом, добавляющим\n\t\t\t\t\tтепло<\/strong>, которая запрещена даже\n\t\t\t\t\tс кануна Шаббата, поскольку михам\n\t\t\t\t\tпостепенно остывает.<\/p><p>По этой же причине разрешается с\n\t\t\t\t\tкануна Шаббата поместить сосуд с\n\t\t\t\t\tпищей <strong>в горячую воду, находящуюся\n\t\t\t\t\tв сосуде, который не стоит на огне<\/strong>.\n\t\t\t\t\tЭто не считается атманой материалом,\n\t\t\t\t\tдобавляющим тепло, поскольку вода\n\t\t\t\t\tпостепенно остывает.<\/p><h3 id=\"part-189\">б. Создание тепла в Шаббат\n\t\t\t\t\tпосредством атманы<\/h3><p>Ришоним пишут, что <strong>в сам Шаббат<\/strong>\n\t\t\t\t\tзапрещено укутывать кастрюлю с пищей\n\t\t\t\t\tтканью и ставить её на михам с горячей\n\t\t\t\t\tводой, даже если михам не находится\n\t\t\t\t\tна огне.<\/p><p>И хотя выше было разъяснено, что\n\t\t\t\t\tэто не является атманой материалом,\n\t\t\t\t\tдобавляющим тепло, поскольку вода\n\t\t\t\t\tпостепенно остывает, тем не менее\n\t\t\t\t\tмудрецы установили запрет из-за <strong>молид\n\t\t\t\t\t— создания тепла в Шаббат посредством\n\t\t\t\t\tатманы<\/strong>, поскольку это подобно\n\t\t\t\t\tматериалу, добавляющему тепло.<\/p><p>Однако поскольку здесь нет настоящего\n\t\t\t\t\tдобавления тепла, этот запрет действует\n\t\t\t\t\tтолько в случае, когда человек делает\n\t\t\t\t\tэто <strong>в сам Шаббат<\/strong>, но если он\n\t\t\t\t\tделает это <strong>с кануна Шаббата<\/strong>,\n\t\t\t\t\tэто разрешено.<\/p><p>В Гемаре, <strong>Шаббат 40<\/strong>,\n\t\t\t\t\tразъясняется, что разрешается взять\n\t\t\t\t\tсосуд с маслом и поместить его в\n\t\t\t\t\tбольший сосуд с горячей водой, то\n\t\t\t\t\tесть когда нет опасения бишуля,\n\t\t\t\t\tнапример, если это <strong>кли шени<\/strong>.<\/p><p>Здесь нет запрета атманы материалом,\n\t\t\t\t\tдобавляющим тепло, поскольку, как\n\t\t\t\t\tбыло разъяснено выше, то, что постепенно\n\t\t\t\t\tостывает, не считается материалом,\n\t\t\t\t\tдобавляющим тепло.<\/p><p>Однако необходимо разобраться,\n\t\t\t\t\tпочему мудрецы не запретили это из-за\n\t\t\t\t\tвторого запрета, приведённого выше\n\t\t\t\t\tпо мнению Ришоним, — <strong>запрета\n\t\t\t\t\tсоздавать тепло в Шаббат посредством\n\t\t\t\t\tатманы<\/strong>, который запрещён даже\n\t\t\t\t\tтогда, когда вода постепенно остывает.<\/p><p>Приведены две причины:<\/p><p><strong>а.<\/strong> Согласно поским,\n\t\t\t\t\tсчитающим, что <strong>частичная атмана\n\t\t\t\t\tразрешена<\/strong>, как было разъяснено\n\t\t\t\t\tвыше, в пункте <strong>78<\/strong>, вопрос не\n\t\t\t\t\tвозникает, поскольку можно объяснить,\n\t\t\t\t\tчто Гемара говорит о случае, когда\n\t\t\t\t\tвода <strong>не полностью покрывает\n\t\t\t\t\tсосуд<\/strong>.<\/p><p>Однако согласно мнению тех, кто\n\t\t\t\t\tсчитает, что <strong>частичная атмана\n\t\t\t\t\tзапрещена<\/strong>, этот вопрос остаётся\n\t\t\t\t\tтребующим объяснения.<\/p><p><strong>б.<\/strong> <strong>Хазон Иш<\/strong> пишет,\n\t\t\t\t\tчто мудрецы вообще <strong>не установили\n\t\t\t\t\tзапрет атманы внутри воды, находящейся\n\t\t\t\t\tв сосуде<\/strong>.<\/p><p>Получается, что если рассматривать\n\t\t\t\t\tвопрос о запрете атманы в воде или в\n\t\t\t\t\tпище, находящейся внутри сосуда, то,\n\t\t\t\t\tсогласно <strong>Хазон Ишу<\/strong>, здесь\n\t\t\t\t\tнет запрета атманы.<\/p><p>Однако согласно остальным поским\n\t\t\t\t\t<strong>нет основания разрешать это<\/strong>.<\/p><p>Всё сказанное относится к случаю,\n\t\t\t\t\tкогда вода или пища находятся в\n\t\t\t\t\tсосуде, <strong>не стоящем на огне<\/strong>.<\/p><p>Но запрещено помещать пищу <strong>в\n\t\t\t\t\tкастрюлю, находящуюся на огне<\/strong>,\n\t\t\t\t\tиз-за запрета <strong>«нетина батхила»\n\t\t\t\t\t— первоначальной установки на огонь<\/strong>,\n\t\t\t\t\tприведённого выше в пункте <strong>61<\/strong>.<\/p><h3 id=\"part-190\"><font size=\"3\">Подробности\nзаконов атманы в воде или в пище,\nнаходящейся в сосуде, который не стоит\nна огне<\/font><\/h3><p><strong>89.<\/strong> Разрешается с кануна\nШаббата поместить кастрюлю или бутылочку\nс пищей <strong>в сосуд с горячей водой<\/strong>,\nкоторый не находится на огне. Это не\nсчитается атманой материалом, добавляющим\nтепло.<\/p><p><strong>90.<\/strong> Однако в сам Шаббат нельзя\nпомещать сосуд с пищей <strong>в сосуд с\nгорячей водой<\/strong>, даже если этот сосуд\nне находится на огне.<\/p><p>Это запрещено даже в случае, когда\nздесь нет запрета бишуля, например если\nгорячая вода, в которую помещают пищу,\nнаходится в <strong>кли шени<\/strong>.<\/p><p>Причина заключается в том, что мудрецы\nзапретили <strong>создавать тепло в Шаббат\nпосредством атманы<\/strong>.<\/p><p>Это относится именно к случаю, когда\nвода <strong>полностью покрывает<\/strong> пищу,\nпомещённую в неё, или сосуд, внутри\nкоторого находится пища.<\/p><p>Но если <strong>значительная часть пищи\nили сосуда остаётся непокрытой<\/strong>,\nэто разрешено.<\/p><p><strong>91.<\/strong> По мнению <strong>Хазон Иша<\/strong>,\nдаже если пища или сосуд полностью\nпокрыты водой, это разрешено.<\/p><p>Поэтому тот, кто хочет в Шаббат нагреть\nбутылочку с кашей для ребёнка и хочет\nпоместить её в сосуд с горячей водой,\nдолжен следить за тем, чтобы вода <strong>не\nпокрывала бутылочку полностью<\/strong>, а\nоставляла значительную её часть над\nводой.<\/p><p>Согласно мнению <strong>Хазон Иша<\/strong>,\nэто разрешено даже в случае, когда\nбутылочка покрыта водой полностью.<\/p><p><strong>92.<\/strong> Если человек хочет в Шаббат\nпоместить <strong>холодную пищу, которая\nне находится внутри сосуда, в горячую\nводу<\/strong>, находящуюся в сосуде, чтобы\nнагреть её — например, положить очищенное\nсваренное яйцо в горячую воду, которая\nне находится на огне, — или хочет положить\nхолодную пищу, например кусок курицы,\nв кастрюлю с хамином (<strong>чолнтом<\/strong>),\nкоторая не находится на огне, и покрыть\nеё хамином, чтобы нагреть, — некоторые\nразрешают это и утверждают, что здесь\nнет запрета атманы.<\/p><p>Однако этот вопрос требует дополнительного\nрассмотрения. См. примечание.<\/p><h3 id=\"part-191\">Помещение пищи, завернутой\nв пакет, в кастрюлю с хамином<\/h3><p><strong>93.<\/strong> Разрешается с кануна\nШаббата положить в кастрюлю с хамином\nпищу, завернутую в тканевый пакет или\nалюминиевую фольгу, например рис, кугель\nи тому подобное.<\/p><p>Здесь нет запрета атманы, даже если\n<strong>вся пища полностью покрыта хамином<\/strong>.<\/p><p>Однако некоторые требуют сделать\n<strong>отверстия в алюминиевой фольге<\/strong>,\nчтобы хамин придавал свой вкус пище и\nвсё рассматривалось как <strong>одно блюдо<\/strong>.<\/p><p>См. примечание.<\/p><h3 id=\"part-192\">\n<font size=\"5\">Запрет атманы\n\t\t\t\t\tматериалом, не добавляющим тепло<\/font><\/h3><p>Мудрецы запретили совершать <strong>атману\n\t\t\t\t\tв Шаббат<\/strong> даже материалом, который\n\t\t\t\t\tне добавляет тепла. Поэтому запрещено\n\t\t\t\t\tчеловеку укутывать в Шаббат горячую\n\t\t\t\t\tпищу в ткани и тому подобное, чтобы\n\t\t\t\t\tсохранить её тепло.<\/p><p>И хотя ткань не добавляет тепла\n\t\t\t\t\tпище, тем не менее, поскольку она\n\t\t\t\t\t<strong>сохраняет её тепло<\/strong>, это\n\t\t\t\t\tвходит в запрет атманы.<\/p><p>Причина запрета разъяснена в Гемаре,\n\t\t\t\t\t<strong>Шаббат 35<\/strong>: это постановление\n\t\t\t\t\tиз опасения, что человек обнаружит,\n\t\t\t\t\tчто его кастрюля остыла, и вновь\n\t\t\t\t\tнагреет её.<\/p><p>То есть существует опасение, что,\n\t\t\t\t\tкогда человек придёт укутать пищу,\n\t\t\t\t\tкоторую он хочет сохранить горячей,\n\t\t\t\t\tон увидит, что пища уже остыла, и может\n\t\t\t\t\tошибочно <strong>вновь поставить её на\n\t\t\t\t\tогонь и нагреть<\/strong>, нарушив запрет.<\/p><p>Однако мудрецы <strong>не запретили\n\t\t\t\t\tукутывать холодную пищу в ткани<\/strong>,\n\t\t\t\t\tнезависимо от того, хочет ли человек\n\t\t\t\t\tсохранить её холодной или лишь немного\n\t\t\t\t\tустранить её холод.<\/p><p>Но нельзя укутывать холодную пищу\n\t\t\t\t\t<strong>материалом, добавляющим тепло<\/strong>\n\t\t\t\t\t— и это запрещено даже <strong>с кануна\n\t\t\t\t\tШаббата<\/strong>.<\/p><h3 id=\"part-193\"><font size=\"3\">Законы\nатманы материалом, не добавляющим тепло<\/font><\/h3><p><strong>94.<\/strong> Запрещено в Шаббат укутывать\nгорячую пищу в ткани, одеяла и тому\nподобное с целью сохранить её тепло. И\nхотя ткань не добавляет тепла пище, это\nвходит в постановление об атмане\nматериалом, <strong>не добавляющим тепло<\/strong>,\nкоторое запрещено в Шаббат.<\/p><p><strong>95.<\/strong> Такая атмана материалом,\nне добавляющим тепло, разрешена <strong>с\nкануна Шаббата<\/strong>. Поэтому если человек\nнагрел с кануна Шаббата кастрюлю с\nблюдом или другую пищу, он может укутать\nеё одеялами и тому подобным, чтобы\nсохранить её тепло.<\/p><p>Однако при этом нельзя ставить укутанную\nкастрюлю на источник тепла, например\nна огонь, электрическую плату, радиатор,\nмихам, находящийся на огне, и тому\nподобное.<\/p><p>В этом заключается различие между\nатманой материалом, не добавляющим\nтепло, и атманой материалом, <strong>добавляющим\nтепло<\/strong>: атмана материалом, добавляющим\nтепло, запрещена даже тогда, когда её\nсовершают с кануна Шаббата, тогда как\nатмана материалом, не добавляющим тепло,\nзапрещена только в сам Шаббат.<\/p><p><strong>96.<\/strong> Разрешается совершать\nатману материалом, не добавляющим тепло,\nво время <strong>бейн а-шмашот<\/strong> — в\nсумеречный период, продолжительностью\nоколо тринадцати минут после захода\nсолнца.<\/p><p>Однако если человек <strong>явно принял\nна себя Шаббат<\/strong>, или сказал <strong>«Мизмор\nшир ле-Йом»<\/strong>, либо женщина зажгла\nсвечи, или община в его месте уже приняла\nна себя Шаббат, ему нельзя совершать\nатману даже материалом, не добавляющим\nтепло, и даже <strong>до захода солнца<\/strong>.<\/p><h3 id=\"part-194\">Частичная атмана<\/h3><p><strong>97.<\/strong> Понятие атманы было\nразъяснено выше, в пункте <strong>78<\/strong>:\nэто укутывание пищи или кастрюли со\nвсех сторон тканью, одеялами и тому\nподобным.<\/p><p>Если оставлено открытым место,\nвследствие чего происходит <strong>существенная\nпотеря тепла<\/strong>, это называется\n<strong>частичной атманой<\/strong>.<\/p><p>Согласно мнению большинства поским,\nэто разрешено, и таков принятый обычай.<\/p><p>Однако <strong>Хазон Иш<\/strong> придерживается\nстрогого мнения и запрещает.<\/p><h3 id=\"part-195\">Добавление покрытия в Шаббат<\/h3><p><strong>98.<\/strong> Если с кануна Шаббата\nчеловек совершил атману материалом, не\nдобавляющим тепло, ему разрешается\n<strong>добавить в Шаббат ещё ткани<\/strong> и\nукутать ими кастрюлю.<\/p><p>Также разрешается снять первоначальные\nткани и положить вместо них другие ткани\nи укутать ими кастрюлю, даже если новые\nткани <strong>толще и лучше сохраняют тепло<\/strong>.<\/p><p>Даже если кастрюля сама раскрылась в\nШаббат, разрешается снова укутать её.<\/p><h3 id=\"part-196\">Накрывание открытой пищи<\/h3><p><strong>99.<\/strong> Пищу, которая не накрыта,\nразрешается накрыть в Шаббат даже\nтканью. Это не рассматривается как\nатмана, а как защита пищи от загрязнения\nпылью, мухами и тому подобным.<\/p><p>Однако для этой цели разрешается\nположить на пищу <strong>только одну ткань,\nно не более<\/strong>.<\/p><p>Если же пища уже накрыта крышкой,\nнельзя класть на неё даже одну ткань\nили какое-либо другое покрытие, например\nалюминиевую фольгу.<\/p><h3 id=\"part-197\">Атмана холодной пищи<\/h3><p><strong>100.<\/strong> Холодную пищу разрешается\nукутывать в Шаббат материалом, <strong>не\nдобавляющим тепло<\/strong>, независимо от\nтого, хочет ли человек сохранить её\nхолодной или лишь немного устранить её\nхолод.<\/p><p>Однако нельзя укутывать холодную пищу\nматериалом, <strong>добавляющим тепло<\/strong>.<\/p><p>См. выше, пункты <strong>89 и 92<\/strong>.<\/p><h3 id=\"part-198\">Атмана кастрюли, снятой с\nогня<\/h3><p><strong>101.<\/strong> Если человек снял кастрюлю\nс пищей с огня, запрещено укутывать её\nтканью. Это входит в запрет атманы\nматериалом, не добавляющим тепло, которая\nзапрещена в Шаббат.<\/p><p>Если же человек переложил горячую\nпищу из этой кастрюли в <strong>другую\nкастрюлю, которая ранее не находилась\nна огне<\/strong>, разрешается укутать вторую\nкастрюлю тканью или любым другим\nматериалом, не добавляющим тепло.<\/p><p><strong>102.<\/strong> Если человек снял кастрюлю\nс огня и она остыла до состояния, когда\n<strong>«яд соледет бо»<\/strong> уже нет,\nразрешается при необходимости укутать\nеё материалом, не добавляющим тепло,\nхотя она всё ещё остаётся тёплой.<\/p><h3 id=\"part-199\">Термос-бутылка<\/h3><p><strong>103.<\/strong> Разрешается наливать в\nШаббат кипяток в <strong>термос-бутылку<\/strong>,\nи в этом нет запрета атманы.<\/p><h3 id=\"part-200\">Резиновая грелка<\/h3><p><strong>104.<\/strong> Если человек наливает\nгорячую воду в резиновую грелку,\nпредназначенную для согревания тела,\nи перед сном помещает эту грелку в\nкровать под одеяла с двойной целью —\n<strong>согреть кровать и сохранить тепло\nгрелки<\/strong>, — это разрешено.<\/p><h3 id=\"part-201\">\n<font size=\"4\">Если атмана\n\t\t\t\t\tбыла совершена запрещённым образом\n\t\t\t\t\t— запрещается ли блюдо?<\/font><\/h3><p>В <strong>симан 318, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tא׳<\/span><\/font><\/strong> была приведена\n\t\t\t\t\tдискуссия поским относительно закона\n\t\t\t\t\tо человеке, который варил в Шаббат.<\/p><p>По мнению <strong>Шулхан Аруха<\/strong>,\n\t\t\t\t\tдаже если человек сварил пищу <strong>по\n\t\t\t\t\tошибке (бе-шогег)<\/strong>, блюдо запрещено\n\t\t\t\t\tв сам Шаббат — как для того, кто его\n\t\t\t\t\tсварил, так и для других. Только после\n\t\t\t\t\tокончания Шаббата его разрешается\n\t\t\t\t\tесть.<\/p><p>Если же он сварил <strong>умышленно\n\t\t\t\t\t(бе-мезид)<\/strong>, ему самому запрещено\n\t\t\t\t\tесть это блюдо навсегда, а другим оно\n\t\t\t\t\tразрешено после окончания Шаббата.<\/p><p>По мнению <strong>Гра<\/strong>, если человек\n\t\t\t\t\tсварил по ошибке, блюдо разрешено\n\t\t\t\t\tдаже в сам Шаббат — как для него\n\t\t\t\t\tсамого, так и для других. Если же он\n\t\t\t\t\tсварил умышленно, его разрешается\n\t\t\t\t\tесть только после окончания Шаббата.<\/p><p>См. <strong>Мишна Брура<\/strong> там, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן ז׳<\/span><\/font>, где написано, что\n\t\t\t\t\tосновная алаха соответствует мнению\n\t\t\t\t\t<strong>Шулхан Аруха<\/strong>. Однако в случае\n\t\t\t\t\tнеобходимости можно опереться на\n\t\t\t\t\tмнение <strong>Гра<\/strong> и облегчить в\n\t\t\t\t\tотношении того, кто сварил по ошибке,\n\t\t\t\t\tразрешив ему есть блюдо уже в сам\n\t\t\t\t\tШаббат.<\/p><p>Однако в отношении постановлений\n\t\t\t\t\tо <strong>Шеhия, хазара и атмане<\/strong>\n\t\t\t\t\tмудрецы установили, что блюдо\n\t\t\t\t\tзапрещается в сам Шаббат даже тогда,\n\t\t\t\t\tкогда нарушение было совершено <strong>по\n\t\t\t\t\tошибке<\/strong>.<\/p><p>То есть даже согласно мнению <strong>Гра<\/strong>,\n\t\t\t\t\tпридерживающемуся облегчённого\n\t\t\t\t\tмнения относительно бишуля, совершённого\n\t\t\t\t\tпо ошибке, <strong>нельзя облегчать<\/strong>\n\t\t\t\t\tв случае, когда человек оставил,\n\t\t\t\t\tвернул или укутал блюдо запрещённым\n\t\t\t\t\tобразом, даже если он сделал это по\n\t\t\t\t\tошибке.<\/p><p>Кроме того, необходимо предварительно\n\t\t\t\t\tотметить, что поским разъясняют:\n\t\t\t\t\t<strong>штраф за «маасе Шаббат»<\/strong>\n\t\t\t\t\tприменяется только в случае, когда\n\t\t\t\t\tзапрещённое действие улучшило блюдо\n\t\t\t\t\tили когда блюдо было холодным и в\n\t\t\t\t\tрезультате нагрелось.<\/p><p>Но если в блюде не произошло никакого\n\t\t\t\t\tулучшения и не прибавилось тепла, а\n\t\t\t\t\tзапрещённое действие лишь привело\n\t\t\t\t\tк тому, что блюдо <strong>не остыло<\/strong>,\n\t\t\t\t\tэто не считается положительным\n\t\t\t\t\tулучшением блюда, и в таком случае\n\t\t\t\t\tвообще нет штрафа за <strong>маасе Шаббат<\/strong>,\n\t\t\t\t\tдаже если человек сделал это умышленно,\n\t\t\t\t\tи тем более если по ошибке.<\/p><p>Далее, с Божьей помощью, будут\n\t\t\t\t\tразъяснены различия в законах между\n\t\t\t\t\tчеловеком, который нарушил и совершил\n\t\t\t\t\tатману <strong>материалом, добавляющим\n\t\t\t\t\tтепло<\/strong>, и человеком, который\n\t\t\t\t\tнарушил и совершил атману <strong>материалом,\n\t\t\t\t\tне добавляющим тепло<\/strong>.<\/p><p>Также следует знать, что поским в\n\t\t\t\t\tнескольких местах законов Шаббата\n\t\t\t\t\tпишут, что <strong>штраф за маасе Шаббат\n\t\t\t\t\tимеет статус постановления мудрецов<\/strong>.<\/p><p>Поэтому там, где поским расходятся\n\t\t\t\t\tво мнениях относительно того, является\n\t\t\t\t\tли само действие запрещённым или\n\t\t\t\t\tразрешённым, нельзя задним числом\n\t\t\t\t\tналагать штраф на человека, который\n\t\t\t\t\tэто сделал, хотя <strong>изначально\n\t\t\t\t\t(лехатхила)<\/strong> мы указываем ему не\n\t\t\t\t\tсовершать этого.<\/p><p>Причина в том, что относительно\n\t\t\t\t\tсамого запрета возникает <strong>сомнение\n\t\t\t\t\tв вопросе, связанном с Торой\n\t\t\t\t\t(сфек-дэорайта)<\/strong>, тогда как\n\t\t\t\t\tотносительно штрафа это <strong>сомнение\n\t\t\t\t\tв постановлении мудрецов (сфек-дерабанан)<\/strong>,\n\t\t\t\t\tа в таком случае мы облегчаем.<\/p><p>Однако поскольку в некоторых местах\n\t\t\t\t\tмы находим, что мудрецы запрещали\n\t\t\t\t\tблюдо <strong>постфактум (бедиавад)<\/strong>\n\t\t\t\t\tдаже в случаях, когда сами поским\n\t\t\t\t\tрасходятся во мнениях относительно\n\t\t\t\t\tзапрета, не следует облегчать без\n\t\t\t\t\t<strong>обращения к знающему алаху\n\t\t\t\t\tраввину<\/strong>.<\/p><h3 id=\"part-202\"><font size=\"5\">Если\n\t\t\t\t\tчеловек нарушил и совершил атману\n\t\t\t\t\tматериалом, добавляющим тепло<\/font><\/h3><p>В предыдущих разделах были разъяснены\n\t\t\t\t\tзаконы <strong>Шеhия<\/strong> — оставления\n\t\t\t\t\tблюда на <strong>кира<\/strong>, а также на\n\t\t\t\t\tметаллическом листе, электрической\n\t\t\t\t\tплате и тому подобном, и законы <strong>атманы\n\t\t\t\t\tматериалом, добавляющим тепло<\/strong>.<\/p><p>Из этого следует, что между\n\t\t\t\t\tпостановлением о <strong>Шеhия<\/strong> и\n\t\t\t\t\tпостановлением об <strong>атмане<\/strong>\n\t\t\t\t\tсуществуют различия в законах.<\/p><p>Например: в отношении <strong>Шеhия<\/strong>\n\t\t\t\t\tразрешается оставить на огне блюдо,\n\t\t\t\t\tесли оно приготовлено хотя бы до\n\t\t\t\t\tстепени <strong>маахаль бен Друсай<\/strong>.\n\t\t\t\t\tОднако в отношении атманы запрещено\n\t\t\t\t\tукутывать блюдо даже в том случае,\n\t\t\t\t\tесли оно <strong>полностью приготовлено<\/strong>,\n\t\t\t\t\tи даже если оно относится к категории\n\t\t\t\t\t<strong>мицтамек ве-ра ло<\/strong> — блюдо,\n\t\t\t\t\tкоторому дальнейшее уваривание во\n\t\t\t\t\tвред.<\/p><p>Однако некоторые из Ришоним\n\t\t\t\t\tрасходятся с этим законом и считают,\n\t\t\t\t\tчто законы атманы материалом,\n\t\t\t\t\tдобавляющим тепло, <strong>такие же, как\n\t\t\t\t\tзаконы Шеhия<\/strong>.<\/p><p>Поскольку причина обоих постановлений\n\t\t\t\t\tодинакова — опасение, что человек\n\t\t\t\t\tстанет <strong>ворошить угли<\/strong>, — по\n\t\t\t\t\tих мнению, атмана материалом,\n\t\t\t\t\tдобавляющим тепло также разрешена\n\t\t\t\t\tс кануна Шаббата, если блюдо приготовлено\n\t\t\t\t\tдо такой степени, при которой\n\t\t\t\t\tотсутствует постановление о Шеhия.<\/p><p>Поским пишут, что <strong>не следует\n\t\t\t\t\tопираться на этот подход в качестве\n\t\t\t\t\tпрактической алахи<\/strong>, поскольку\n\t\t\t\t\tмы придерживаемся мнения, что в\n\t\t\t\t\tотношении атманы мудрецы установили\n\t\t\t\t\t<strong>более строгое постановление<\/strong>,\n\t\t\t\t\tчем в отношении Шеhия.<\/p><p>Однако <strong>постфактум (бедиавад)<\/strong>,\n\t\t\t\t\tесли человек с кануна Шаббата нарушил\n\t\t\t\t\tи совершил атману такого блюда, в\n\t\t\t\t\tотношении которого Шеhия была\n\t\t\t\t\tразрешена, можно опереться на\n\t\t\t\t\tупомянутые мнения и <strong>не налагать\n\t\t\t\t\tштраф и не запрещать блюдо<\/strong>.<\/p><p>Причина в том, что согласно некоторым\n\t\t\t\t\tиз приведённых выше мнений, человек\n\t\t\t\t\tвообще <strong>не совершил никакого\n\t\t\t\t\tзапрета<\/strong>, совершив эту атману.<\/p><h3 id=\"part-203\"><font size=\"3\">Если\nчеловек с кануна Шаббата совершил\nзапрещённую атману материалом, добавляющим\nтепло<\/font><\/h3><p><strong>105.<\/strong> Если человек с кануна\nШаббата совершил атману материалом,\nдобавляющим тепло, и блюдо было <strong>полностью\nприготовлено<\/strong> ещё с кануна Шаббата,\nразрешается есть его в Шаббат, даже если\nоно относится к категории <strong>мицтамек\nве-яфе ло<\/strong> — блюдо, которому дальнейшее\nуваривание идёт на пользу.<\/p><p>В случае необходимости можно облегчить\nдаже тогда, когда до наступления Шаббата\nблюдо было приготовлено только до\nстепени <strong>маахаль бен Друсай<\/strong>.<\/p><p><strong>106.<\/strong> Если человек в Шаббат\nположил <strong>холодную пищу на михам<\/strong>\nи укутал её запрещённым образом, см.\nвыше, пункты <strong>75 и 78<\/strong>, и пища\nнагрелась, <strong>запрещено есть её<\/strong>.<\/p><p>Если же человек подождал, пока пища\nостынет и снова достигнет той степени\nтемпературы, которая была у неё <strong>до\nзапрещённой атманы<\/strong>, некоторые\nпоским разрешают её есть.<\/p><p>Однако <strong>Хазон Иш запрещает<\/strong>.<\/p><p>На практике часто бывает, что холодную\nпищу достают из холодильника и кладут\nна михам. Если по ошибке её укутали\nзапрещённым образом, <strong>нельзя разрешить\nесть пищу<\/strong>, опираясь на упомянутые\nвыше разрешающие мнения, пока не вернуть\nеё в холодильник, чтобы она потеряла\n<strong>всё тепло, которое получила вследствие\nзапретного действия<\/strong>. После этого\nеё можно будет снова нагреть разрешённым\nспособом.<\/p><p>Согласно мнению <strong>Хазон Иша<\/strong>,\nпоскольку пища стала запрещённой, <strong>уже\nнет способа разрешить её<\/strong>.<\/p><p><strong>107.<\
