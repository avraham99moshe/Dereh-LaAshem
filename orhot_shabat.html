кольку в отношении мелахи\nбоне он имеет статус постройки.<\/p><p>Однако если шкаф не достигает объёма\n40 сеа и не прикреплён к земле, он имеет\nстатус обычного предмета. Поэтому\nразрешается вынимать из него ящик и\nвозвращать его на место, поскольку\nсоединение неплотное и не закреплено\nжёстко, как будет объяснено далее, в\nразделе 48.<\/p><p>10. <b>Извлечение полки из шкафа<\/b><\/p><p>Если в книжном шкафу имеются полки,\nкоторые вообще не прикреплены к нему,\nа просто лежат на крючках, по-видимому,\nне следует вынимать полку из шкафа или\nвозвращать её на место.<\/p><p>Это относится именно к шкафу объёмом\n40 сеа или к шкафу, прикреплённому к земле\nлибо стене.<\/p><p>Однако если шкаф не достигает объёма\n40 сеа и не прикреплён к земле, разрешается\nвынимать из него полки и возвращать их\nна место, если они установлены свободно\nи не закреплены плотно, как будет\nобъяснено далее, в разделе 48.<\/p><p>11. <b>Подвешивание занавески на\nнаправляющую<\/b><\/p><p>Запрещено подвешивать занавеску на\nнаправляющую или на штангу, поскольку\nзанавеска считается частью постройки.<\/p><p>12. <b>Пластиковый крючок, прикрепляющийся\nк стене<\/b><\/p><p>Пластиковый крючок, который крепится\nк стене посредством вакуумного\nприсасывания, нельзя прикреплять таким\nспособом в Шаббат из-за запрета боне.\nЭто запрещено даже в том случае, если\nкрючок держится недолго — всего несколько\nчасов.<\/p><p>Однако разрешается прикрепить детскую\nтарелку к столу посредством вакуумного\nприсасывания.<\/p><p>13. <b>Магнит, прикреплённый к холодильнику<\/b><\/p><p>Если магнит прикреплён к холодильнику,\nа под ним находятся листы бумаги, нет\nзапрета снимать его или возвращать на\nместо. В этом нет мелахи боне.<\/p><p>14. <b>Картина, висящая на стене<\/b><\/p><p>Если картина висит на стене, но никак\nне прикреплена к ней, то её подвешивание\nи снятие не нарушают запрет боне или\nсотер (разрушение).<\/p><p>Однако иногда в этом может быть запрет\nперемещения мукце, как будет объяснено\nдалее, в главе, посвящённой законам\nмукце.<\/p><p>15. <b>Установка качелей на дверную\nкоробку<\/b><\/p><p>Качели, которые обычно закрепляют на\nдверной коробке и снимают через несколько\nчасов, — см. примечание, разрешается ли\nзакреплять и снимать их в Шаббат.<\/p><p>16. <b>Прикрепление ручки к двери<\/b><\/p><p>Если ручка двери выпала, и человек\nвозвращает её на место, вставляя\nудерживающий её гвоздь, это является\nнарушением запрета боне уровня Торы.<\/p><p>Если же он возвращает ручку без\nустановки гвоздя, так что соединение\nостаётся несколько неплотным, это\nзапрещено постановлением мудрецов.<\/p><p>Если же ручка вообще не держится на\nдвери и сразу же должна упасть, такое\nдействие не имеет статуса мелахи боне.<\/p><p>Однако иногда это действие запрещено\nиз-за постановления мудрецов, опасающихся,\nчто человек станет устанавливать ручку\nобычным способом, как в будни, или из-за\nзапрета мукце. См. примечание 71, а также\nглаву, посвящённую законам мукце.<\/p><p>17. <b>Извлечение вилки электроприбора\nиз розетки<\/b><\/p><p>Если вилка электроприбора вставлена\nв розетку и человек хочет вынуть её в\nто время, когда электрический ток не\nподаётся, некоторые писали, что вилка\nне считается частью постройки, поэтому\nеё извлечение из розетки не нарушает\nзапрет сотер (разрушение).<\/p><p>Также нет запрета боне, если человек\nвставляет вилку в розетку в то время,\nкогда электрический ток не подаётся.\nСм. примечание 23.<\/p><p>Однако, поскольку вилка является\nпредметом, предназначенным для\nзапрещённого использования (кли\nше-мелахто ле-исур), её разрешается\nперемещать только ради самого предмета\nили ради освобождения занимаемого им\nместа. Поэтому нет разрешения вынимать\nеё из стены.<\/p><p>См. примечание 24.<\/p><p>Но когда человек вставляет вилку в\nрозетку, это считается перемещением\nпредмета ради его использования, и\nпоэтому разрешено.<\/p><p>18. <b>Стержни, прикреплённые к конструкции<\/b><\/p><p>Стержень с пружиной, предназначенный\nдля подвешивания туалетной бумаги, —\nнекоторые считают, что его нельзя\nустанавливать или снимать в Шаббат\nиз-за запретов боне и сотер, поскольку\nэтот стержень рассматривается как часть\nконструкции здания.<\/p><p>Другие разрешают это.<\/p><p>19. <b>Стержень для подвешивания полотенец<\/b><\/p><p>В общественных местах часто встречается\nстержень, предназначенный для подвешивания\nполотенец.<\/p><p>По-видимому, если этот стержень\nприкручен к своему месту, нельзя\nоткручивать его, чтобы заменить полотенце,\nдаже если крепление ослаблено.<\/p><p>Однако если стержень вообще не\nприкреплён к своему месту, а просто\nлежит на держателях, это разрешено.\nПоскольку он никак не соединён и не\nзакреплён на своём месте, он не считается\nчастью конструкции.<\/p><p>По-видимому, это разрешение действует\nдаже в случае, когда установлен замок,\nиз-за которого невозможно вынуть\nстержень, не открыв замок.<\/p><p>20. То же относится, по-видимому, к\nстержню для парохет (занавеса перед\nковчегом Торы), который выпал со своего\nместа: если он прикреплён резьбовым\nсоединением, запрещено возвращать его\nна место; если же он не прикреплён, а\nпросто лежит на своём месте, это разрешено.<\/p><p>21. <b>Крючок, надеваемый на дверь<\/b><\/p><p>Пластиковый крючок, который надевают\nна дверь, чтобы вешать на него пальто и\nподобные вещи, по-видимому, разрешается\nустанавливать и снимать в Шаббат,\nпоскольку он вообще не прикреплён к\nдвери и не считается частью конструкции.<\/p><p>22. <b>Стержень, помещаемый в шкафу для\nсвитков Торы<\/b><\/p><p>Стержень, помещаемый в ковчег Торы,\nчтобы свитки Торы не падали, по-видимому,\nразрешается вынимать и возвращать на\nместо. Здесь нет запрета строительства\nили разрушения, поскольку стержень\nникак не прикреплён к своему месту.<\/p><p>23. <b>Мезуза, выпавшая со своего места<\/b><\/p><p>Корпус мезузы, выпавший со своего\nместа, нельзя возвращать на место, даже\nесли он устанавливается неплотно.<\/p><p>Если из мезузы выпал один гвоздь, также\nнельзя возвращать его на место.<\/p><p>24. <b>Корпус мезузы, который открылся<\/b><\/p><p>Если корпус мезузы открылся и пергамент\nвыпал со своего места, некоторые из\nпоздних законоучителей писали, что нет\nзапрета возвращать пергамент на место.<\/p><p>25. <b>Ремонт эрува, который порвался<\/b><\/p><p>В Шаббат нельзя ремонтировать эрув —\nни устанавливая столбы на свои места,\nни связывая нить, поскольку это нарушает\nзапрет боне.<\/p><p>Однако в местах, где есть опасение,\nчто многие люди могут ошибиться и начать\nпереносить предметы с нарушением\nзапрета, поздние законоучители разрешили\nпопросить нееврея отремонтировать\nэрув.<\/p><p>26. <b>Разбитое окно<\/b><\/p><p>Если окно разбилось, разрешается\nнакрыть его одеялом. Это не считается\nмелахой боне.<\/p><p>Однако запрещено прикреплять одеяло\nк окну гвоздиками, поскольку это нарушает\nзапрет боне.<\/p><p>27. <b>Разбитое окно с оставшимися\nосколками стекла<\/b><\/p><p>Если окно разбилось, но осколки стекла\nостались прикреплёнными к раме, запрещено\nудалять их из окна из-за запрета сотер.<\/p><p>Если существует опасность, что люди\nмогут пораниться об осколки, разрешается\nпопросить нееврея удалить их. Также это\nразрешается еврею, если он сделает это\nнеобычным способом, например ногой.<\/p><p>28. <b>Утечка газа из трубы<\/b><\/p><p>Если в газовой трубе образовалась\nтрещина и газ выходит наружу, а временное\nрешение проблемы заключается в том,\nчтобы заклеить трещину липким материалом,\nнапример жевательной резинкой, нельзя\nделать это в Шаббат.<\/p><p>Если же существует сомнение в опасности\nдля жизни (сфек пикуах нефеш), это\nразрешено.<\/p><p>29. <b>Смазывание дверных петель<\/b><\/p><p>Запрещено наносить масло на дверные\nпетли, поскольку это считается ремонтом\nи нарушает запрет маке бе-патиш.<\/p><p>30. <b>Полив бетонной заливки<\/b><\/p><p>Запрещено поливать бетонную заливку\nв Шаббат.<\/p><p>31. <b>Засорившаяся раковина<\/b><\/p><p>Если засор образовался в трубе,\nотходящей от раковины, и человек хочет\nпрочистить его специальным приспособлением\n— резиновой помпой, — среди современных\nкрупных законоучителей существует\nразногласие. Некоторые разрешают это\nв случае большой необходимости, другие\nзапрещают. См. примечание.<\/p><p>Если же засор плотно закрепился и\nчеловек хочет устранить его профессиональным\nспособом, например введением металлической\nпружины, это запрещено согласно всем\nмнениям.<\/p><p>Категорически запрещено разбирать\nтрубу под раковиной, чтобы удалить из\nнеё отходы, а затем снова собрать её.\nЭто является настоящим нарушением\nзапретов сотер и боне.<\/p><p>32. <b>Сетка раковины, на которой скопились\nостатки пищи<\/b><\/p><p>Если на сетке раковины скопились\nостатки пищи, разрешается поднять сетку\nвместе с находящимися на ней отходами,\nстряхнуть их в мусорное ведро и вернуть\nсетку на место.<\/p><p>33. <b>Отверстие для засова двери, которое\nзасорилось<\/b><\/p><p>В дверях дома при закрывании засов\nвходит в отверстие в полу. Если отверстие\nзаполнилось землёй и из-за этого дверь\nневозможно закрыть, следует различать\nдва случая:<\/p><p>Если засор плотно закреплён в земле,\nнельзя разрешать его удаление из опасения\nнарушения запрета боне и ремонта.<\/p><p>Если же засор не закреплён в земле\nплотно, в его удалении нет запрета боне.<\/p><p>См. примечание.<\/p><p>34. <b>Использование берушей<\/b><\/p><p>В отношении использования берушей\nследует различать два вида:<\/p><p>А. Беруши, изготовленные из губчатого\nматериала, который не принимает постоянную\nформу при введении в ухо и возвращается\nк первоначальной форме после извлечения,\nразрешается использовать.<\/p><p>Б. Беруши, изготовленные из материала,\nкоторый принимает постоянную форму при\nвведении в ухо, например силиконовые\nберуши, запрещено использовать.<\/p><p>35. <b>Выпрямление погнувшейся ложки<\/b><\/p><p>Запрещено выпрямлять погнувшуюся\nложку в Шаббат из-за запрета маке\nбе-патиш.<\/p><p>36. <b>Придание формы пластиковой ложке<\/b><\/p><p>Пластиковая ложка, находящаяся в\nупаковке с порошком для детского молока,\nкоторая принимает свою форму при лёгком\nнажатии, — разрешается придать ей эту\nформу в Шаббат. Это не относится к запрету\nмаке бе-патиш.<\/p><p>37. <b>Складывание бумаги и салфеток<\/b><\/p><p>Запрещено складывать бумагу таким\nобразом, чтобы из неё получались фигуры\nв форме кораблика, самолёта, птицы и\nтому подобного.<\/p><p>Также не следует складывать бумажные\nсалфетки в особую форму для украшения\nстола.<\/p><p>Однако разрешается складывать их\nобычным способом, без придания им особой\nформы.<\/p><p>38. <b>Нанесение лака на капроновые чулки<\/b><\/p><p>Нельзя наносить мыло или лак на\nкапроновые чулки в том месте, где они\nначинают распускаться, поскольку это\nможет нарушать запрет исправления\nпредмета.<\/p><p>39. <b>Изготовление снежков<\/b><\/p><p>Запрещено лепить снежки или делать\nснеговиков.<\/p><p>\n<font size=\"5\"><b>Строительство\n\t\t\t\tпредметов (бине́н бе-келим)<\/b><\/font><\/p><p>В Талмуде мы находим несколько\n\t\t\t\tобсуждений, посвящённых вопросу о\n\t\t\t\tтом, распространяются ли мелахот боне\n\t\t\t\t(строительство) и сотер (разрушение)\n\t\t\t\tтакже на предметы и инструменты\n\t\t\t\t(келим), или же эти мелахот вообще не\n\t\t\t\tотносятся к предметам.<\/p><p>В отношении практического закона\n\t\t\t\tранние законоучители разошлись во\n\t\t\t\tмнениях. Одни постановили, что\n\t\t\t\tсуществует запрет строительства и\n\t\t\t\tразрушения предметов, если сборка\n\t\t\t\tпроизводится существенным образом,\n\t\t\t\tнапример, когда части плотно соединены\n\t\t\t\tдруг с другом, либо когда человек\n\t\t\t\tизготавливает предмет с самого начала.\n\t\t\t\tДругие постановили, что в отношении\n\t\t\t\tпредметов вообще нет мелахот\n\t\t\t\tстроительства и разрушения.<\/p><p>Шульхан Арух (симан 314, пункт 1)\n\t\t\t\tпостановляет, что строительство и\n\t\t\t\tразрушение предметов существует.\n\t\t\t\tРама там пишет, что предмет, объём\n\t\t\t\tкоторого составляет 40 сеа, перестаёт\n\t\t\t\tсчитаться обычным предметом, и закон\n\t\t\t\tего строительства подобен закону\n\t\t\t\tстроительства на земле.<\/p><p>Следует знать, что даже те, кто\n\t\t\t\tсчитает, что в отношении предметов\n\t\t\t\tнет строительства и разрушения,\n\t\t\t\tсогласны: тот, кто собирает предмет,\n\t\t\t\tплотно соединяя его части друг с\n\t\t\t\tдругом, либо изготавливает предмет\n\t\t\t\tс самого начала, обязан принести\n\t\t\t\tхатат. Однако это связано с мелахой\n\t\t\t\tмаке бе-патиш (завершающее действие\n\t\t\t\tпри изготовлении предмета).<\/p><p>Практическое различие между\n\t\t\t\tупомянутыми мнениями относительно\n\t\t\t\tстроительства и разрушения предметов\n\t\t\t\tпроявляется в двух случаях:<\/p><p>1. Если человек ломает или разбирает\n\t\t\t\tпредмет: согласно мнению поским,\n\t\t\t\tсчитающих, что строительство и\n\t\t\t\tразрушение предметов существует, это\n\t\t\t\tзапрещено из-за мелахи сотер. Согласно\n\t\t\t\tмнению поским, считающих, что\n\t\t\t\tстроительства и разрушения предметов\n\t\t\t\tне существует, здесь нет запрета.<\/p><p>2. Если человек соединяет части\n\t\t\t\tпредмета друг с другом, но ещё не\n\t\t\t\tзавершил сборку всего предмета:\n\t\t\t\tсогласно мнению тех, кто считает, что\n\t\t\t\tстроительство предметов существует,\n\t\t\t\tон несёт ответственность. Согласно\n\t\t\t\tмнению тех, кто считает, что строительства\n\t\t\t\tпредметов не существует, он не несёт\n\t\t\t\tответственности, поскольку обязанность\n\t\t\t\tза маке бе-патиш возникает лишь тогда,\n\t\t\t\tкогда изготовление предмета завершено.<\/p><p>Что касается соединения частей\n\t\t\t\tпредметов, в Гемаре и у поским мы\n\t\t\t\tнаходим три степени соединения:\n\t\t\t\tплотное закрепление, затягивание и\n\t\t\t\tнеплотное соединение.<\/p><p>1. Тот, кто плотно соединяет части\n\t\t\t\tдруг с другом с помощью гвоздей, клея\n\t\t\t\tили иным подобным способом прочного\n\t\t\t\tсоединения, обязан из-за мелахи боне\n\t\t\t\tили маке бе-патиш.<\/p><p>2. Тот, кто затягивает части, соединяя\n\t\t\t\tих друг с другом, нарушает запрет\n\t\t\t\tмудрецов.<\/p><p>3. Тот, кто соединяет части неплотно,\n\t\t\t\tпоступает разрешённым образом. Однако\n\t\t\t\tв этом вопросе существуют дополнительные\n\t\t\t\tподробности, которые, с Б-жьей помощью,\n\t\t\t\tбудут разъяснены далее.<\/p><p><b>Сборка предметов путём плотного\nзакрепления<\/b><\/p><p>40. Запрещено собирать части предмета\nтаким способом, который определяется\nкак плотное закрепление («тика»). Тот,\nкто делает это, обязан принести хатат.\nПод плотным закреплением понимается\nсоединение частей друг с другом настолько\nпрочно, что они становятся единым целым.\nНапример, если человек соединяет их\nгвоздями, болтами, склеивает клеем,\nочень сильно затягивает или использует\nдругой подобный способ.<\/p><p>41. Относительно частей предмета,\nкоторые соединяются друг с другом\nпосредством туго затянутой резьбы,\nпоским разошлись во мнениях: считается\nли такое соединение плотным закреплением,\nзапрещённым Торой, или же оно считается\nзатягиванием, запрещённым постановлением\nмудрецов, как будет объяснено далее, в\nпункте 45.<\/p><p>42. Разборка предмета, части которого\nбыли плотно закреплены, имеет статус\nразрушения (сотер). Человек нарушает\nзапрет Торы, если разбирает его с целью\nпоследующей сборки или если делает это\nне с целью разрушения. Если же он разбирает\nпредмет с целью испортить его, это\nсчитается порчей (мекалькель) и запрещено\nпостановлением мудрецов.<\/p><p>43. Предмет, крышка которого очень\nплотно привинчивается к нему, разрешается\nоткрывать и закрывать. Такое действие\nне определяется как плотное закрепление.\nСм. выше, во вступлении к мелахе боне, в\nразделе «Временное строительство», где\nмы привели разногласия поздних\nзаконоучителей относительно причины\nэтого разрешения.<\/p><p>44. Относительно предмета, который\nпринято постоянно собирать и разбирать,\nпоздние законоучители разошлись во\nмнениях. Одни писали, что даже если\nсоединение является плотным или тугим,\nзапрета боне нет, если предмет принято\nразбирать каждый день. Другие писали,\nчто запрет боне существует, если части\nпредмета плотно закреплены или туго\nсоединены.<\/p><p><b>Сборка предметов посредством\nзатягивания<\/b><\/p><p>45. Запрещено соединять части предмета\nдруг с другом, если соединение является\nтугим. Этот запрет установлен мудрецами\nиз опасения, что человек может закрепить\nчасти настолько плотно, что придёт к\nнарушению запрета Торы.<\/p><p>Трудно установить точную границу\nмежду тугим соединением, запрещённым\nмудрецами, и неплотным соединением, на\nкоторое запрет не распространяется.\nТем не менее из Гемары следует, что даже\nкровать и стул, собранные неплотно,\nможно было использовать и сидеть на\nних. По-видимому, если для разборки\nпредмета требуется приложить усилие,\nтакая сборка считается тугой. Если же\nчасти можно легко отделить друг от\nдруга, такая сборка считается неплотной.<\/p><p><b>Разборка предмета с тугим соединением<\/b><\/p><p>46. Некоторые поздние законоучители\nписали, что разрешается разбирать\nпредмет, части которого соединены туго.\nСм. примечание.<\/p><p><b>Сборка предмета с тугим соединением,\nесли его не принято закреплять плотно<\/b><\/p><p>47. Из слов некоторых поским следует,\nчто не следует разрешать собирать\nпредмет тугим соединением даже в том\nслучае, когда не принято закреплять его\nчасти настолько плотно, чтобы это\nповлекло нарушение запрета Торы. Однако\nХазон Иш написал, что в этом случае можно\nразрешить.<\/p><p><b>Сборка предметов неплотным соединением<\/b><\/p><p>48. Разрешается собирать части предмета\nнеплотным соединением, поскольку такая\nсборка совершенно не похожа на\nстроительство, и мудрецы не установили\nздесь запрета из опасения, что человек\nможет закрепить части плотно.<\/p><p>Однако существуют случаи, когда\nзапрещено собирать предмет даже неплотным\nсоединением:<\/p><p><b>1.<\/b> Если принято плотно закреплять\nчасти данного предмета друг с другом\nтаким образом, что это запрещено Торой,\nнельзя собирать его даже неплотно,\nпоскольку существует опасение, что\nчеловек поступит так, как обычно поступает\nв будни, и закрепит части плотно.<\/p><p><b>2. <\/b>Разрешение собирать предмет\nнеплотным соединением относится только\nк случаю, когда предмет уже был собран,\nзатем разобран, и человек хочет вернуть\nего на место в Шаббат. Но если предмет\nникогда прежде не собирали и человек\nвпервые собирает его в Шаббат, то это\nявляется нарушением запрета Торы маке\nбе-патиш.<\/p><p><b>3. <\/b>Некоторые писали, что не следует\nсобирать предмет даже неплотным\nсоединением, если именно такой способ\nсборки является обычным для данного\nпредмета, то есть предмет обычно собирают\nнеплотно, и после сборки он должен\nоставаться в таком состоянии постоянно.\nСм. примечание, где мы разъяснили, в\nкаком случае действует этот запрет.<\/p><p><b>Приведём несколько практических\nпримеров.<\/b><\/p><p><b>Винт в очках<\/b><\/p><p>49. Если винт в очках выпал со своего\nместа, запрещено возвращать его обратно.\nТот, кто делает это в Шаббат, нарушает\nзапрет, поскольку такое завинчивание,\nвыполняемое с большой силой, имеет\nстатус плотного закрепления. Даже если\nвинт не завинчивают очень сильно, а лишь\nтуго затягивают, это запрещено\nпостановлением мудрецов.<\/p><p>Даже если винт не выпал полностью, а\nлишь ослаб, запрещено его затягивать.<\/p><p>См. далее главу, посвящённую законам\nмукце, где мы подробно разобрали вопрос\nо том, разрешается ли переносить очки,\nих дужку или линзу. Краткое изложение\nэтих положений приведено в примечании.<\/p><p>Если винт потерялся, по-видимому,\nразрешается соединить отсоединившуюся\nдужку с помощью английской булавки\nвместо винта. Однако нельзя соединять\nеё посредством приклеивания пластыря.<\/p><p><b>Линза очков<\/b><\/p><p>50. Если линза очков вышла из оправы,\nнеобходимо различать несколько случаев:<\/p><p><b>а)<\/b> Если линза вышла из своего места\nиз-за того, что удерживающий её винт\nослаб, нельзя возвращать её в оправу\nдаже неплотно, поскольку существует\nопасение, что человек туго затянет винт.\nВ этом случае запрещено даже переносить\nочки и линзу из опасения, что человек\nзакрепит их способом, нарушающим запрет\nТоры, как объясняется в примечании.<\/p><p><b>б)<\/b> Если линза вышла из своего места\nиз-за того, что оправа немного расширилась,\nчто часто бывает в оправах без винтов,\nразрешается вернуть её на место, если\nона будет держаться свободно, но не в\nтом случае, когда она плотно закрепляется\nв оправе.<\/p><p><b>Удлинение стола<\/b><\/p><p>51. Если у стола имеются деревянные\nвставки, с помощью которых его можно\nудлинить, разрешается присоединить их\nв Шаббат, поскольку соединение является\nнеплотным.<\/p><p><b>Выпавшее колесо<\/b><\/p><p>52. Если колесо выпало из ножки детской\nкроватки или подобного предмета, и после\nвозвращения на место оно совершенно не\nзакрепляется, так что при поднятии\nкроватки снова выпадает, однако кроваткой\nпривыкли пользоваться в таком состоянии,\nпо-видимому, разрешается вернуть колесо\nв Шаббат, поскольку здесь вообще нет\nдействия, которое считалось бы\nстроительством.<\/p><p>По-видимому, даже если после возвращения\nколесо не выпадает при поднятии кроватки,\nразрешается вернуть его, если соединение\nнеплотное и колесо можно легко вставить\nи вынуть.<\/p><p><b>Пряжка ремня<\/b><\/p><p>53. Если пряжка ремня соединяется с ним\nнеплотно, то есть её можно вернуть на\nместо лёгким нажатием после того, как\nона отсоединилась, см. примечание\nотносительно того, разрешается ли\nвозвращать её на место.<\/p><p><b>Резиновые наконечники ножек стула<\/b><\/p><p>54. Если резиновые наконечники, надетые\nна ножки стула, выпали со своих мест,\nзапрещено возвращать их, если они сидят\nтуго. Если же они держатся свободно, это\nразрешено.<\/p><p><b>Поднос, прикрепляемый к детскому\nстульчику<\/b><\/p><p>55. В отношении подноса, который\nприкрепляется к детскому стульчику,\nнеобходимо различать разные виды\nкрепления.<\/p><p>Если поднос присоединяется к стульчику\nнеплотно, например, посредством зажимов,\nкоторые фиксируются лёгким нажатием,\nэто разрешено согласно закону о неплотной\nсборке предметов.<\/p><p>Если же поднос присоединяется туго,\nто есть для его установки требуется\nприложить усилие, и люди обычно регулярно\nснимают и устанавливают его обратно,\nсм. примечание.<\/p><p><b>Игрушечная кукла, у которой\nотсоединилась часть<\/b><\/p><p>56. Если от игрушечной куклы отсоединилась\nодна из частей, нельзя возвращать её на\nместо, если соединение будет тугим. См.\nпримечание.<\/p><p><b>Газовый баллон «Сифолукс»<\/b><\/p><p>57. Относительно газового баллона,\nиспользуемого для приготовления\nгазированной воды и известного под\nназванием «Сифолукс», необходимо\nрассмотреть, разрешается ли собирать\nего в Шаббат. См. Примечание 84.<\/p><p>\n<font size=\"2\"><b>84.<\/b> См. выше\n\t\t\t\tпримечания 3 и 4, где мы подробно\n\t\t\t\tрассмотрели этот вопрос.<\/font><\/p><p><font size=\"2\">Мы написали,\n\t\t\t\tчто, согласно мнению Га-Раза, в отношении\n\t\t\t\tпредмета, который принято разбирать\n\t\t\t\tв тот же день, запрета боне нет. Поэтому\n\t\t\t\tи эту бутылку разрешается собирать.<\/font><\/p><p><font size=\"2\">Согласно мнению\n\t\t\t\tХазон Иша, на первый взгляд, это следует\n\t\t\t\tзапретить. Однако мы обсудили\n\t\t\t\tвозможность того, что, поскольку если\n\t\t\t\tплотно закрепить и соединить её части\n\t\t\t\tдруг с другом, она утратит статус\n\t\t\t\tпредмета (кли), то её сборка вообще не\n\t\t\t\tсчитается строительством.<\/font><\/p><p><font size=\"2\">Кроме того, мы\n\t\t\t\tпривели мнение современных поским,\n\t\t\t\tкоторые разрешают подобное действие.<\/font><\/p><p><b>Солонка и детская бутылочка<\/b><\/p><p>58. Разрешается завинчивать верхнюю\nчасть солонки, а также крышку детской\nбутылочки, даже если соединение является\nтугим.  См. Примечание 85.<\/p><p>\n<font size=\"2\"><b>85<\/b>. См. предыдущее\n\t\t\t\tпримечание. В рассматриваемом случае\n\t\t\t\tесть ещё больше оснований для\n\t\t\t\tпослабления, поскольку здесь речь\n\t\t\t\tидёт не о плотном закреплении (ткиа),\n\t\t\t\tа лишь о затягивании (гидук), и поэтому\n\t\t\t\tнет опасения нарушения запрета Торы.<\/font><\/p><p><font size=\"2\">Кроме того,\n\t\t\t\tможно присоединить к этому мнение\n\t\t\t\tХазон Иша, согласно которому разрешается\n\t\t\t\tпроявить снисхождение в отношении\n\t\t\t\tтугого соединения, если обычно не\n\t\t\t\tпринято закреплять части предмета\n\t\t\t\tнастолько плотно, как разъяснялось\n\t\t\t\tвыше, в пункте 47.<\/font><\/p><p><b>Сборка деталей «Лего»<\/b><\/p><p>59. Некоторые разрешают собирать детали\n«Лего» даже в том случае, когда соединение\nявляется тугим, другие же запрещают\nэто. См. примечание.<\/p><p><b>Изменение положения пюпитра<\/b><\/p><p>60. Пюпитр, высоту которого можно\nрегулировать в соответствии с потребностью\nи фиксировать в нужном положении с\nпомощью винта, разрешается раскручивать\nи снова затягивать по мере необходимости.\nВ этом нет запрета боне.<\/p><p><b>Изменение положения вентилятора<\/b><\/p><p>61. По-видимому, не следует поднимать\nили опускать головную часть вентилятора,\nесли для этого требуется ослабить винт,\nа затем снова затянуть его.<\/p><p><b>Соединение двух детских колясок<\/b><\/p><p>62. Если две детские коляски можно\nсоединить друг с другом, например, с\nпомощью пластиковых деталей с резьбовым\nкреплением или подобным способом, и их\nобычно соединяют и разъединяют каждый\nдень, поским разошлись во мнениях\nотносительно того, разрешается ли\nсоединять и разъединять их в Шаббат.<\/p><p>Если же их не принято разъединять\nкаждый день, это запрещено согласно\nвсем мнениям.<\/p><p>\n<font size=\"5\"><b>Завершение\n\t\t\t\t\tформы предмета<\/b><\/font><\/p><p>В трактате Шаббат, на странице 48,\n\t\t\t\t\tсказано: «Рав Хисда разрешил возвращать\n\t\t\t\t\tнабивку в подушку в Шаббат». Иными\n\t\t\t\t\tсловами, Рав Хисда разрешил возвращать\n\t\t\t\t\tнабивной материал в подушку, если он\n\t\t\t\t\tвыпал наружу.<\/p><p>В Гемаре объясняется, что в этом\n\t\t\t\t\tотношении существует различие между\n\t\t\t\t\tновыми и старыми набивными материалами.\n\t\t\t\t\tНовую набивку, которая прежде никогда\n\t\t\t\t\tне находилась внутри подушки, запрещено\n\t\t\t\t\tпомещать туда. Но набивку, которая\n\t\t\t\t\tуже находилась внутри подушки и\n\t\t\t\t\tвыпала, разрешается вернуть обратно.<\/p><p>Объясняя запрет помещать новую\n\t\t\t\t\tнабивку в подушку, Раши пишет, что\n\t\t\t\t\tпричина заключается в запрете\n\t\t\t\t\tизготовления предмета, то есть в\n\t\t\t\t\tзапрете исправления и завершения\n\t\t\t\t\tизготовления вещи (метакен мана).<\/p><p>Поским добавили, что разрешение\n\t\t\t\t\tвозвращать набивку, которая уже\n\t\t\t\t\tнаходилась внутри подушки, основано\n\t\t\t\t\tна том, что её можно вернуть легко,\n\t\t\t\t\tбез особых усилий. Но если возвращение\n\t\t\t\t\tтребует значительных усилий, это\n\t\t\t\t\tподобно первоначальному помещению\n\t\t\t\t\tнабивки в подушку, и тогда возникает\n\t\t\t\t\tзапрет исправления предмета (тикун\n\t\t\t\t\tкли).<\/p><p>Из этого закона поским вывели общий\n\t\t\t\t\tпринцип: нельзя производить новую\n\t\t\t\t\tсборку предмета даже в том случае,\n\t\t\t\t\tкогда она не нарушает запрет\n\t\t\t\t\tстроительства предметов (бине́н\n\t\t\t\t\tбе-келим), например, если соединение\n\t\t\t\t\tявляется неплотным.<\/p><p>Поэтому они постановили, что\n\t\t\t\t\tзапрещено вставлять в обувь новый\n\t\t\t\t\tшнурок. Однако если шнурок уже был\n\t\t\t\t\tпродет в обувь, а затем выпал,\n\t\t\t\t\tразрешается продеть его обратно.<\/p><p>В этом вопросе существует несколько\n\t\t\t\t\tдополнительных подробностей, которые\n\t\t\t\t\tбудут разъяснены далее.<\/p><p><b>Вставление нового шнурка в обувь<\/b><\/p><p>63. Запрещено вставлять в обувь шнурок,\nкоторый прежде не был в ней продет. И\nдаже если этот шнурок раньше был продет\nв другой обуви, запрещено переносить\nего в эту обувь.<\/p><p>Причина запрета заключается в том,\nчто таким образом завершается формирование\nобуви, и это подобно исправлению предмета\n(метакен кли).<\/p><p>Если человек начал продевать шнурок\nв обувь ещё до Шаббата, но не успел\nпродеть его через все отверстия,\nразрешается в Шаббат продеть его через\nверхние отверстия обуви.<\/p><p>Если человек продевает шнурок таким\nобразом, что он заведомо не останется\nв обуви постоянно, а будет вынут после\nокончания Шаббата, это разрешено,\nпоскольку в таком случае действие не\nсчитается исправлением предмета.<\/p><p>Поэтому можно поступить следующим\nобразом: продеть новый шнурок только\nчерез верхние отверстия обуви. В таком\nслучае он заведомо не останется там на\nпостоянной основе.<\/p><p><b>Возвращение шнурка, выпавшего из\nобуви<\/b><\/p><p>64. Если шнурок был продет в обувь, но\nвыскользнул из неё, необходимо различать\nдва случая:<\/p><p>а) Если вернуть шнурок в обувь можно\nлегко, без особых усилий, разрешается\nсделать это.<\/p><p>б) Если возвращение шнурка требует\nусилий, запрещено возвращать его.<\/p><p>То же самое относится к шнурку, который\nпорвался и выскользнул из обуви:\nразрешается вернуть его часть, чтобы\nзавязать обувь, если это не требует\nособых усилий.<\/p><p><b>Продевание шнурка в пальто<\/b><\/p><p>65. Если шнурок, продетый в пальто,\nвыскользнул со своего места, запрещено\nвозвращать его. Причина заключается в\nтом, что обычно на конце шнурка завязывают\nузел, и мудрецы установили запрет из\nопасения, что человек завяжет узел в\nШаббат.<\/p><p>Если же возвращение шнурка требует\nусилий, существует и дополнительный\nзапрет, как объяснялось выше, в пункте\n64: в таком случае действие рассматривается\nкак первоначальное помещение шнурка,\nчто является исправлением предмета.<\/p><p><b>Вставление ремня в брюки<\/b><\/p><p>66. <span style=\"font-weight: normal\">Разрешается\nвставлять ремень в брюки в Шаббат.<\/span><\/p><p>Однако если ремень предназначен\nисключительно для этой конкретной пары\nбрюк, например, он сделан из ткани того\nже цвета, что и брюки, или если речь идёт\nо поясах, являющихся частью женских\nплатьев, запрещено впервые вставлять\nих в Шаббат, согласно закону, приведённому\nвыше в пункте 63.<\/p><p>Но если ремень уже находился в одежде\nв будние дни, разрешается вернуть его\nв Шаббат.<\/p><p><b>Помещение подушки и одеяла в чехол<\/b><\/p><p>67. Разрешается помещать подушку или\nодеяло в чехол, даже если прежде они\nникогда не находились в этом чехле.<\/p><p><b>Накачивание резинового колеса<\/b><\/p><p>68. Запрещено впервые накачивать\nрезиновое колесо или резиновый мяч в\nШаббат. Но если их уже накачивали хотя\nбы один раз до наступления Шаббата,\nразрешается накачать их снова в Шаббат.<\/p><p><b>Глава: надувание воздушного шарика<\/b><\/p><p>69. Запрещено впервые надувать резиновый\nвоздушный шарик в Шаббат.<\/p><p>Если же его уже надували один раз до\nнаступления Шаббата и теперь хотят\nнадуть повторно, необходимо различать\nдва случая:<\/p><p>а) Если обычно горлышко шарика закрывают\nрезинкой, это разрешено.<\/p><p>б) Если же обычно горлышко шарика\nзавязывают узлом, запрещено надувать\nего в Шаббат, даже если человек намерен\nзакрыть его резинкой, а не завязывать\nузлом, из опасения, что он поступит так,\nкак привык поступать в будни, и завяжет\nузел.<\/p><p><b>Пряжка, выпавшая из ремешка<\/b><\/p><p>70. Относительно пряжки, выпавшей из\nремня, и вопроса о том, разрешается ли\nвозвращать её на место в Шаббат, см.\nвыше, примечание 70.<\/p><p><b>Бусины, выпавшие из ожерелья<\/b><\/p><p>71. Запрещено возвращать в Шаббат\nбусины, выпавшие из ожерелья, из опасения,\nчто человек завяжет узел.<\/p><p><b>Смачивание одноразового шприца<\/b><\/p><p>72. Разрешается собирать одноразовый\nшприц. В этом нет запрета, поскольку\nсоединение его частей является неплотным.<\/p><p>Хотя выше, в пункте 48, было объяснено,\nчто первоначальная сборка предмета\nзапрещена даже при неплотном соединении\nиз-за запрета маке бе-патиш, в отношении\nодноразового шприца этот запрет не\nдействует. Причина этого разъясняется\nв примечании.<\/p><p><b>Сборка одноразового стаканчика<\/b><\/p><p>73. Одноразовый стаканчик, состоящий\nиз двух частей, которые соединяются\nнеплотно, запрещено впервые собирать\nв Шаббат. Но если его уже собрали один\nраз до Шаббата, а затем разобрали,\nразрешается собрать его снова.<\/p><p><b>Плавающий фитиль<\/b><\/p><p>74. В Йом-Тов разрешается вставлять\nфитиль в кусочек пробки, используемый\nв качестве плавающего фитиля. Это не\nсчитается нарушением запрета маке\nбе-патиш.<\/p><p><font size=\"4\"><b>Крышки\nотверстий в полу<\/b><\/font><\/p><p>75. Крышку, установленную над отверстием\nили трубой, выходящей из пола, запрещено\nснимать и возвращать на место, поскольку\nэто выглядит как разрушение и строительство\n(сотер и боне).<\/p><p>Однако если у крышки имеется\nприспособление для захвата, свидетельствующее\nо том, что она предназначена для\nиспользования и не является частью\nпола, это разрешено.<\/p><p>Такое приспособление не обязательно\nдолжно быть выступающей ручкой. Любая\nособенность конструкции самой крышки,\nсделанная для того, чтобы её было легче\nприподнимать, считается приспособлением\nдля захвата. Например, если в крышке\nпроделаны отверстия, облегчающие её\nподнятие.<\/p><p>Поэтому, если в полу имеется крышка,\nкоторую при мытье пола поднимают, чтобы\nвода стекала в водосток, разрешается\nподнимать её и возвращать на место в\nШаббат, если у неё есть приспособление\nдля захвата или нечто подобное. Если же\nтакого приспособления нет, это запрещено.<\/p><p><b>Крышка электрической коробки<\/b><\/p><p>76. Если крышка электрической коробки,\nвстроенной в стену, выпала со своего\nместа, запрещено возвращать её в Шаббат.\nТакже запрещено устанавливать в Шаббат\nкрышку, предназначенную для электрического\nпровода, проложенного вдоль стены.<\/p><p><b>Крышки предметов, прикреплённых к\nземле<\/b><\/p><p>77. Разрешается поднимать крышку\nпредмета, прикреплённого к земле, даже\nесли у неё нет приспособления для\nзахвата. Поскольку крышка находится не\nнепосредственно на земле, а на самом\nпредмете, это не выглядит как строительство.<\/p><p>78. Крышку, расположенную в туалете над\nрезервуаром для воды (бачком), разрешается\nподнимать и возвращать на место, если\nона лежит свободно и совершенно не\nзакреплена, согласно закону о крышках\nпредметов, прикреплённых к земле.<\/p><p>Если же крышка плотно закреплена и её\nобычно не открывают регулярно, по-видимому,\nне следует открывать её в Шаббат.<\/p><p><b>Рассыпание земли для предотвращения\nскольжения<\/b><\/p><p>79. Если человек хочет рассыпать землю\nпо тротуару в месте, где пролилось масло\nили топливо, чтобы предотвратить\nскольжение, это запрещено постановлением\nмудрецов, поскольку выглядит как\nисправление поверхности земли. Запрет\nдействует даже в том случае, если сама\nземля не является мукце.<\/p><p>Однако, поскольку здесь существует\nопасность причинения вреда многим\nлюдям, это разрешается, если невозможно\nвыполнить работу с помощью нееврея.<\/p><p>То же самое относится к рассыпанию\nсоли по тротуару, чтобы предотвратить\nскольжение на льду.<\/p><p>80. Разрешается рассыпать землю, не\nявляющуюся мукце, или соль для\nпредотвращения скольжения внутри дома\nили синагоги. Причина заключается в\nтом, что такие помещения обычно убирают,\nи рассыпанная земля не должна оставаться\nтам постоянно. Поэтому этот случай не\nподобен строительству.<\/p><p>\n<font size=\"5\"><b>Завод часов<\/b><\/font><\/p><p>Поским разошлись во мнениях\n\t\t\t\tотносительно часов, работающих от\n\t\t\t\tзавода пружины: разрешается ли заводить\n\t\t\t\tих в Шаббат.<\/p><p>Одни считают, что это запрещено\n\t\t\t\tТорой, поскольку является исправлением\n\t\t\t\tпредмета (метакен мана), а часы, которые\n\t\t\t\tне идут, вообще не считаются пригодными\n\t\t\t\tк использованию. Другие разрешают\n\t\t\t\tэто.<\/p><p>См. также «Мишна Брура», где приведены\n\t\t\t\tмнения законоучителей, придерживающихся\n\t\t\t\tстрогого подхода.<\/p><p>Поским также обсуждали вопрос о\n\t\t\t\tзаводе часов, которые уже идут, и\n\t\t\t\tсклонялись к тому, что в этом нет\n\t\t\t\tнарушения запрета Торы.<\/p><p>Подробные законы относительно\n\t\t\t\tзавода часов неевреем или для нужд\n\t\t\t\tбольного будут разъяснены далее.<\/p><p>Всё сказанное относится только к\n\t\t\t\tчасам, работающим от завода пружины.\n\t\t\t\tОднако в наши дни большинство часов\n\t\t\t\tработает от батарейки. Очевидно, что\n\t\t\t\tзапрещено вставлять батарейку в часы,\n\t\t\t\tпоскольку это является исправлением\n\t\t\t\tпредмета (метакен мана).<\/p><p>Также запрещено изменять какие-либо\n\t\t\t\tнастройки часов нажатием кнопок,\n\t\t\t\tпоскольку каждое нажатие приводит в\n\t\t\t\tдействие электрическую цепь.<\/p><p><b>Завод часов<\/b><\/p><p>81. Часы, работающие от завода пружины,\nкоторые остановились, запрещено заводить\nв Шаббат. Некоторые поским писали, что\nэто является нарушением запрета Торы\nмаке бе-патиш.<\/p><p>82. Не следует заводить пружину часов,\nпока они ещё идут. Однако, поскольку,\nсогласно мнению большинства поским,\nэто не является нарушением запрета\nТоры, в этом вопросе существуют\nопределённые послабления, как будет\nразъяснено далее.<\/p><p>83. Разрешается заводить пружину часов,\nпока они ещё идут, для нужд больного,\nкоторому необходимо принимать лекарства\nв определённые часы, если трудно найти\nнееврея, который мог бы это сделать.<\/p><p>84. Больному, не находящемуся в опасном\nсостоянии, которому необходимо принимать\nлекарства в определённые часы, разрешается\nпопросить нееврея завести для него\nчасы. Это соответствует общему правилу:\nразрешается просить нееврея выполнять\nзапрещённые Торой мелахот ради больного.<\/p><p>85. Нельзя просить нееврея завести\nчасы, которые остановились, даже ради\nисполнения заповеди.<\/p><p>86. Часы, которые ещё идут, разрешается\nзаводить с помощью нееврея как ради\nбольного, так и ради исполнения заповеди.<\/p><p><b>Настройка стрелок часов<\/b><\/p><p>87. Некоторые писали, что в часах,\nработающих от пружины, разрешается\nустанавливать стрелки на точное время.\nСм. Примечание <span>124<\/span>.<\/p><p>Однако этого нельзя делать в часах,\nработающих от батарейки, если при\nповороте стрелок электрическая цепь\nпрерывается.<\/p><p>\n<font size=\"2\"><b>124.<\/b><\/font><font size=\"2\">\n<\/font><font size=\"2\">Разрешается\n\t\t\t\tустанавливать стрелки часов на точное\n\t\t\t\tвремя, то есть поворачивать их в нужное\n\t\t\t\tположение, при условии, что это не\n\t\t\t\tприводит к остановке часов, даже\n\t\t\t\tвременной. Это особенно актуально\n\t\t\t\tдля часов, работающих от батарейки.\n\t\t\t\tЕсли же при повороте стрелок работа\n\t\t\t\tчасов прерывается, запрещено производить\n\t\t\t\tв них какие-либо изменения.<\/font><\/p><p><font size=\"2\">Причина\n\t\t\t\tразрешения, заключается в том, что\n\t\t\t\tправильное время можно определить,\n\t\t\t\tсравнив часы с другими часами.<\/font><\/p><p><font size=\"2\">Я слышал от\n\t\t\t\tрава Шломо-Залмана Ойербаха,\n\t\t\t\tблагословенна память праведника, что\n\t\t\t\tв этом есть повод для сомнения: ведь\n\t\t\t\tдля тех, кто не знает точного времени,\n\t\t\t\tэто всё же считается исправлением\n\t\t\t\tпредмета (тикун кли).<\/font><\/p><p><font size=\"2\">Однако,\n\t\t\t\tпо-видимому, разрешение можно обосновать\n\t\t\t\tдругой причиной: человек не вносит\n\t\t\t\tникаких изменений в сам механизм\n\t\t\t\tчасов, а лишь настраивает их использование\n\t\t\t\tдля собственного удобства, как обычно\n\t\t\t\tи принято ими пользоваться. Кроме\n\t\t\t\tтого, стрелки часов обычно передвигают,\n\t\t\t\tпоэтому это действие не считается\n\t\t\t\tисправлением предмета. Таковы были\n\t\t\t\tего слова.<\/font><\/p><p><font size=\"2\">См. также «Каф\n\t\t\t\tа-Хаим», симан 308, параграф катан 280,\n\t\t\t\tгде сказано, что обычай святого\n\t\t\t\tИерусалима — запрещать передвижение\n\t\t\t\tстрелок. Однако в симан 338, параграф\n\t\t\t\tкатан 25, он разрешает это в некоторой\n\t\t\t\tстепени ради исполнения заповеди.<\/font><\/p><p><font size=\"2\">От имени Н.\n\t\t\t\tКарелица мы слышали, что следует\n\t\t\t\tопасаться нарушения запрета исправления\n\t\t\t\tпредмета (тикун кли).<\/font><\/p><p><b>Будильник<\/b><\/p><p>88. В будильнике, работающем не от\nбатарейки, запрещено заводить пружину,\nкоторая приводит в действие звонок,\nпоскольку это является исправлением\nпредмета (тикун мана).<\/p><p>89. Если пружина была заведена ещё до\nнаступления Шаббата, не следует поднимать\nфиксатор, который предотвращает звонок\nбудильника, поскольку этим человек\nвызывает звуковой сигнал.<\/p><p>Однако ради исполнения заповеди,\nнапример, если человек хочет проснуться\nдля молитвы или изучения Торы, это\nразрешено.<\/p><p>90. Если часы, работающие от пружины,\nначали звонить, разрешается нажать на\nфиксатор, прекращающий звонок, поскольку\nэтим действием не совершается никакая\nмелаха.<\/p><p>Но в будильнике, работающем от батарейки,\nэтого делать нельзя, поскольку нажатием\nна фиксатор человек размыкает электрическую\nцепь.<\/p><p>91. Если будильник был настроен до\nнаступления Шаббата на определённое\nвремя, но человек хочет передвинуть\nвремя звонка на более раннее, поворачивая\nстрелки, это разрешено только ради\nисполнения заповеди, например, если он\nхочет проснуться для молитвы или изучения\nТоры.<\/p><p>Если же человек хочет отложить звонок\nна более позднее время, поворачивая\nстрелки часов, в этом нет запрета.<\/p><p>Это правило относится также к\nэлектрическому будильнику, если при\nповороте стрелок никакая электрическая\nцепь не прерывается.<\/p><p><b>Игрушечная машинка<\/b><\/p><p>92. Относительно детской игрушечной\nмашинки, которая ездит благодаря\nзаведённой пружине, некоторые запрещают\nзаводить её в Шаббат. Другие писали, что\nне следует препятствовать детям играть\nс такой игрушкой.<\/p><p><b>Газовый таймер в Йом-Тов<\/b><\/p><p>93. Существуют часы-таймер, предназначенные\nдля отключения газа в определённое\nвремя. Они устанавливаются на газовую\nручку. Принцип их работы заключается в\nтом, что при повороте ручки заводится\nпружина, которая обеспечивает её\nмедленное вращение, и в назначенное\nвремя газ отключается.<\/p><p>Некоторые запрещают пользоваться\nтаким устройством, другие разрешают.<\/p><p><b>Пружинный механизм детских качелей<\/b><\/p><p>94. Относительно детских качелей, у\nкоторых завод пружины позволяет им\nраскачиваться в течение нескольких\nминут, см. примечание.<\/p>"}, {"title": "Законы сооружения шатра (оhель)", "body": "<p class=\"chapter-marker\" id=\"chapter-9\">\n<font size=\"6\"><b>Глава 9<\/b><\/font><\/p><p> <font size=\"6\"><b>Законы\n\t\t\t\t\tсооружения шатра (оhель)<\/b><\/font><\/p><p>В трактате Шаббат, на странице 138,\n\t\t\t\t\tобъясняется, что тот, кто сооружает\n\t\t\t\t\tпостоянный шатёр, обязан принести\n\t\t\t\t\tхатат. Рамбам пишет (Законы Шаббата,\n\t\t\t\t\tглава 10, закон 13), что это является\n\t\t\t\t\tпроизводной мелахи боне (строительство).\n\t\t\t\t\tСм. примечание, где объясняется\n\t\t\t\t\tразличие между мелахой боне, которая\n\t\t\t\t\tявляется основной мелахой, и сооружением\n\t\t\t\t\tшатра, которое является лишь её\n\t\t\t\t\tпроизводной.<\/p><p>Также в Гемаре там же разъясняется,\n\t\t\t\t\tчто мудрецы запретили сооружать\n\t\t\t\t\tвременный шатёр, то есть такой, который\n\t\t\t\t\tне является постоянным, из опасения,\n\t\t\t\t\tчто человек может прийти к сооружению\n\t\t\t\t\tпостоянного шатра.<\/p><p>Поским постановили, что запрет\n\t\t\t\t\tсооружения шатра распространяется\n\t\t\t\t\tтакже на установку перегородок.\n\t\t\t\t\tПоэтому тот, кто устанавливает\n\t\t\t\t\tпостоянные перегородки, обязан\n\t\t\t\t\tпринести хатат.<\/p><p>Что касается временной перегородки,\n\t\t\t\t\tпоским писали, что в этом нет запрета\n\t\t\t\t\tТоры. Относительно запрета,\n\t\t\t\t\tустановленного мудрецами, необходимо\n\t\t\t\t\tразличать два вида перегородок:<\/p><ul>\n<li><p>Перегородка, имеющая разрешающую\n\t\t\t\t\t\tфункцию (мехица матерет): например,\n\t\t\t\t\t\tперегородка, благодаря которой\n\t\t\t\t\t\tобразуется частное владение (решут\n\t\t\t\t\t\tа-яхид), либо перегородка, которая\n\t\t\t\t\t\tделает сукку пригодной для исполнения\n\t\t\t\t\t\tзаповеди, и тому подобное.<\/p><\/li>\n<li><p>Перегородка, не имеющая разрешающей\n\t\t\t\t\t\tфункции (мехица ше-эйна матерет):\n\t\t\t\t\t\tнапример, перегородка, установленная\n\t\t\t\t\t\tдля защиты от солнца или ветра, чтобы\n\t\t\t\t\t\tветер не погасил свечи, и тому\n\t\t\t\t\t\tподобное.<\/p><\/li>\n<\/ul><p>Установка временной перегородки,\n\t\t\t\t\tимеющей разрешающую функцию, запрещена\n\t\t\t\t\tпостановлением мудрецов. Однако\n\t\t\t\t\tразрешается временно устанавливать\n\t\t\t\t\tперегородку, не имеющую разрешающей\n\t\t\t\t\tфункции, поскольку мудрецы не\n\t\t\t\t\tраспространяли запрет сооружения\n\t\t\t\t\tвременного шатра на такие перегородки.<\/p><p>Тот, кто разрушает постоянный шатёр,\n\t\t\t\t\tнарушает производную мелахи сотер\n\t\t\t\t\t(разрушение). Речь идёт о разрушении\n\t\t\t\t\tс целью последующего строительства\n\t\t\t\t\tили в подобном случае. Если же\n\t\t\t\t\tразрушение совершается с целью\n\t\t\t\t\tиспортить, это считается порчей\n\t\t\t\t\t(мекалькель) и запрещено только\n\t\t\t\t\tпостановлением мудрецов.<\/p><p><font size=\"3\">Разрушение\n\t\t\t\t\tвременного шатра также запрещено\n\t\t\t\t\tпостановлением мудрецов.<\/font><\/p><h3 id=\"part-419\"><font size=\"3\">Изготовление\nпостоянного шатра (оhель кева)<\/font><\/h3><p><font size=\"3\">1. Тот, кто\nизготавливает постоянный шатёр, обязан\nпринести жертву хатат. Поэтому, если\nчеловек расстелил полотно с целью защиты\nот солнца или дождя и намерен оставить\nего на несколько дней, это считается\nизготовлением постоянного шатра, и он\nобязан принести хатат. Поским пишут,\nчто эта обязанность распространяется\nи на случай, когда человек не привязал\nполотно, а лишь положил его.<\/font><\/p><p><font size=\"3\">2. Запрет оhель\nдействует только тогда, когда под шатром\nимеется пространство размером не менее\nодного на один тефах и высотой не менее\nодного тефаха. Если же под шатром нет\nтакого пространства, это считается лишь\nобычным покрытием.<\/font><\/p><h3 id=\"part-420\"><font size=\"3\">Открывание\nнавеса, закреплённого на петлях<\/font><\/h3><p><font size=\"3\">3. Навес, закреплённый\nна петлях и устроенный наподобие двери,\nразрешается закрывать и открывать в\nШаббат. В этом нет запрета на изготовление\nшатра или его разрушение. То же правило\nотносится к навесу, который передвигается\nпо направляющей и устроен так, что его\nможно открывать и закрывать.<\/font><\/p><p><font size=\"3\">Причина этого в\nтом, что, поскольку крыша закреплена на\nпетлях и предназначена для открывания\nи закрывания, мы считаем, что шатёр\nсуществует в любом положении — даже\nкогда он открыт. Поэтому изменение\nположения крыши не считается строительством\nили разрушением.<\/font><\/p><p><font size=\"3\">Следовательно,\nтому, у кого над суккой установлен\nподобный навес, разрешается закрывать\nего и снова открывать при необходимости,\nнапример во время дождя.<\/font><\/p><h3 id=\"part-421\"><font size=\"3\">Открывание\nвыдвижного тента<\/font><\/h3><p><font size=\"3\">4. Разрешается\nоткрывать навес, сделанный из полотна,\nустановленного на петлях и металлических\nуголках. Хотя в закрытом состоянии такой\nнавес вообще не образует шатра, тем не\nменее, поскольку он закреплён на петлях\nи предназначен для открывания и\nзакрывания, его рассматривают как уже\nсуществующий и установленный. Поэтому\nего открывание не считается запрещённой\nработой по строительству шатра.<\/font><\/p><h3 id=\"part-422\"><font size=\"3\">Открывание\nкапюшона детской коляски<\/font><\/h3><p><font size=\"3\">5. Разрешается\nоткрывать капюшон детской коляски,\nустроенный подобно навесу, описанному\nв предыдущем пункте, либо подобно крыше,\nприкреплённой к коляске, которую обычно\nнаклоняют и поднимают. Некоторые\nразрешают открывать также капюшон\nколяски, сделанный по принципу зонта.<\/font><\/p><h3 id=\"part-423\"><font size=\"3\">Открывание\nзонта<\/font><\/h3><p><font size=\"3\">6. Запрещается\nходить с зонтом в Шаббат, даже если он\nбыл открыт ещё до наступления Шаббата.\nСм. примечание.<\/font><\/p><h3 id=\"part-424\"><font size=\"3\">Переворачивание\nпредмета<\/font><\/h3><p><font size=\"3\">7. Разрешается\nпереворачивать предмет, даже если\nчеловек намеревается, чтобы он служил\nукрытием над другими вещами. В этом нет\nзапрета на изготовление шатра.<\/font><\/p><p><font size=\"3\">Причина этого\nзакона заключается в том, что действие\nпо переворачиванию предмета само по\nсебе не считается достаточно значимым,\nчтобы называться строительством шатра.<\/font><\/p><p><font size=\"3\">Поэтому, если\nдетская коляска с капюшоном упала на\nбок, разрешается поставить её обратно\nв обычное положение, даже если, пока\nколяска лежала на боку, капюшон не служил\nшатром, а теперь, когда её подняли, он\nстал служить шатром.<\/font><\/p><h3 id=\"part-425\"><font size=\"3\">Расстилание\nскатерти на столе<\/font><\/h3><p><font size=\"3\">8. Разрешается\nрасстилать скатерть на столе, и в этом\nсовершенно нет запрета оhель, даже если\nкрая скатерти свисают по сторонам.<\/font><\/p><h3 id=\"part-426\">\n<font size=\"5\">Временный шатёр\n\t\t\t\t\t(оhель арай)<\/font><\/h3><p>Как было объяснено выше, мудрецы\n\t\t\t\t\tустановили запрет уровня рабанан на\n\t\t\t\t\tизготовление временного шатра.\n\t\t\t\t\tОбычный пример временного шатра —\n\t\t\t\t\tкогда человек расстилает полотно\n\t\t\t\t\tдля защиты от солнца или дождя,\n\t\t\t\t\tнамереваясь убрать его спустя короткое\n\t\t\t\t\tвремя, так чтобы оно не оставалось\n\t\t\t\t\tна месте несколько дней. См. примечание,\n\t\t\t\t\tгде приведены дополнительные примеры\n\t\t\t\t\tвременного шатра.<\/p><p>В Гемаре и у поским разъясняются\n\t\t\t\t\tдва вида временного шатра:<\/p><p>1. Временный шатёр, предназначенный\n\t\t\t\t\tдля защиты пространства под ним,\n\t\t\t\t\tнапример описанный выше случай, когда\n\t\t\t\t\tчеловек расстилает полотно для защиты\n\t\t\t\t\tот солнца. То же правило относится к\n\t\t\t\t\tтому, кто сооружает шатёр, чтобы\n\t\t\t\t\tпользоваться пространством под ним.<\/p><p>2. Временный шатёр, который не\n\t\t\t\t\tпредназначен для защиты пространства\n\t\t\t\t\tпод ним и вообще не сооружается с\n\t\t\t\t\tнамерением создать шатёр, однако\n\t\t\t\t\tчеловек создаёт конструкцию, похожую\n\t\t\t\t\tна шатёр. Например, как приводится в\n\t\t\t\t\tГемаре (Бейца, 32), когда человек\n\t\t\t\t\tскладывает дрова для костра в форме\n\t\t\t\t\tшатра. Это считается временным шатром\n\t\t\t\t\tи запрещено мудрецами.<\/p><p>В отношении такого шатра, который\n\t\t\t\t\tвообще не предназначен для защиты и\n\t\t\t\t\tне сооружается с намерением создать\n\t\t\t\t\tшатёр, мудрецы установили послабление:\n\t\t\t\t\tзапрет действует только тогда, когда\n\t\t\t\t\tу него есть стенки и человек\n\t\t\t\t\tустанавливает их в Шаббат, как будет\n\t\t\t\t\tразъяснено далее.<\/p><h3 id=\"part-427\">Добавление к существующему\n\t\t\t\t\tвременному шатру<\/h3><p>Если человек добавляет часть шатра\n\t\t\t\t\tк уже существующему шатру, мудрецы\n\t\t\t\t\tне установили запрета, если дополнение\n\t\t\t\t\tсделано на короткое время, то есть\n\t\t\t\t\tчеловек намеревается убрать его, а\n\t\t\t\t\tне оставлять на месте несколько дней.<\/p><p>Подробности этих законов будут\n\t\t\t\t\tразъяснены далее.<\/p><h3 id=\"part-428\"><font size=\"3\">Временный\nшатёр, предназначенный для защиты или\nиспользования пространства под ним<\/font><\/h3><p><font size=\"3\">9. Мудрецы запретили\nсооружать шатёр, предназначенный для\nзащиты от солнца, дождя и тому подобного,\nлибо предназначенный для использования\nпространства под ним, даже если человек\nне намеревается оставлять его надолго,\nа собирается разобрать спустя короткое\nвремя.<\/font><\/p><p><font size=\"3\">Поэтому нельзя\nрасстилать тканевое полотно в виде\nшатра для защиты от солнца, даже если\nчеловек делает это на короткое время.\nТакже нельзя класть сверху доски, картон\nи тому подобное для защиты от солнца и\nдождя. Запрещается и разрушать такой\nшатёр.<\/font><\/p><p><font size=\"3\">10. Этот шатёр,\nпредназначенный для защиты, запрещено\nсооружать даже в том случае, если у него\nвообще нет стенок.<\/font><\/p><h3 id=\"part-429\"><font size=\"3\">Изменение\nпорядка сооружения шатра<\/font><\/h3><p><font size=\"3\">11. Существует\nспособ, при котором мудрецы разрешили\nсооружать временный шатёр, даже если\nон предназначен для тени или для\nиспользования пространства под ним.\nЭто возможно, если изменить порядок его\nсооружения: например, сначала держать\nкрышу в руках, а затем поднести под неё\nножки или стенки, на которые эта крыша\nбудет опираться. См. примечание.<\/font><\/p><p><font size=\"3\">Однако если ножки\nили стенки, на которых должна лежать\nкрыша, уже установлены, разрешения\nрасстилать на них крышу нет, поскольку\nв результате получается шатёр,\nпредназначенный для использования\nпространства под ним.<\/font><\/p><h3 id=\"part-430\"><font size=\"3\">Шатёр,\nсооружаемый детьми для игры<\/font><\/h3><p><font size=\"3\">12. Детей, достигших\nвозраста воспитания, следует предостерегать\nот того, чтобы они расстилали одеяло и\nтому подобное, создавая укрытие, под\nкоторым можно находиться. Это запрещено\nкак изготовление шатра, даже если у него\nнет стенок. Если они уже сделали такой\nшатёр, запрещается его разбирать.<\/font><\/p><h3 id=\"part-431\"><font size=\"3\">Сооружение\nшатра из игровых кубиков<\/font><\/h3><p><font size=\"3\">13. Детей, достигших\nвозраста воспитания и играющих с игровыми\nкубиками, «абней пеле» и тому подобными\nпредметами, следует предостерегать от\nсооружения подобия дома или любого\nдругого пространства, у которого есть\nкрыша и под ней имеется свободное\nпространство размером не менее одного\nна один тефах и высотой не менее одного\nтефаха, если это пространство используется\nдля размещения вещей или игрушек.<\/font><\/p><p><font size=\"3\">Если дети уже\nсоорудили такой шатёр, запрещается его\nразбирать.<\/font><\/p><h3 id=\"part-432\"><font size=\"3\">Складной\nшатёр<\/font><\/h3><p><font size=\"3\">14. Металлический\nобруч, предназначенный для игры и\nскладывающийся в шатёр, запрещается\nоткрывать и складывать в Шаббат. Это не\nпохоже на законы, приведённые выше в\nпунктах 3–4, где разрешается открывать\nскладной навес. Причина различия в том,\nчто у такого шатра изначально нет\nоформленной конструкции, и его открывание\nсчитается сооружением шатра с самого\nначала.<\/font><\/p><h3 id=\"part-433\"><font size=\"3\">Временный\nшатёр, не предназначенный для защиты\nили использования пространства под ним<\/font><\/h3><p><font size=\"3\">14. Даже если\nчеловек сооружает шатёр не для защиты\nи вообще не намеревается создавать\nшатёр, а лишь делает конструкцию, похожую\nна шатёр, под которой имеется пространство\nразмером не менее одного на один тефах\nи высотой не менее одного тефаха, мудрецы\nустановили запрет на его сооружение\nкак на временный шатёр.<\/font><\/p><p><font size=\"3\">По мнению\nбольшинства ранних комментаторов, такой\nвременный шатёр, не предназначенный\nдля защиты, запрещён только тогда, когда\nу него есть стенки и человек устанавливает\nих в Шаббат. Но если стенок нет, а\nконструкция стоит на ножках, либо если\nстенки были установлены ещё до Шаббата,\nразрешается положить крышу сверху в\nШаббат.<\/font><\/p><p><font size=\"3\">Раби Шимон бен\nАдерет (Рашба) считает, что сооружение\nтакого шатра запрещено даже без стенок.\nВ «Беур а-Галаха» написано, что изначально\nследует, по-видимому, придерживаться\nстрогости согласно мнению Рашба, кроме\nслучаев крайней необходимости.<\/font><\/p><p><font size=\"3\">15. Запрет на\nвременный шатёр действует только тогда,\nкогда человек сначала установил стенки\nв Шаббат, а затем положил на них крышу.\nНо если он изменил порядок действий:\nсначала держал крышу на весу, а затем\nподнёс под неё стенки, мудрецы не\nустановили запрета.<\/font><\/p><p><font size=\"3\">Согласно мнению\nРашба, который считает, что такой шатёр\nзапрещён даже без стенок, Хазон Иш пишет,\nчто тем не менее запрет действует только\nтогда, когда человек сначала установил\nв Шаббат опоры шатра, а затем положил\nна них крышу. Но если он сначала держал\nкрышу на весу, а затем установил под ней\nопоры, это разрешено.<\/font><\/p><p><font size=\"3\">16. Мудрецы\nустановили запрет оhель только в том\nслучае, когда человеку необходимо\nпространство, образовавшееся под шатром,\nнапример, чтобы положить туда вещи или\nчтобы воздух проникал внутрь и проветривал\nместо. Но если человеку совершенно не\nтребуется образовавшееся пространство,\nзапрета нет.<\/font><\/p><h3 id=\"part-434\"><font size=\"3\">Сборка\nстола<\/font><\/h3><p><font size=\"3\">17. Тот, кто собирает\nстол, устанавливая ножки с одной стороны\nи ножки с другой стороны, а затем кладёт\nсверху столешницу, по существу, поступает\nразрешённым образом. Также разрешается\nразбирать такой стол. См. примечание.<\/font><\/p><p><font size=\"3\">18. Стол, ножки\nкоторого прикреплены к нему и складываются\nпод ним, разрешается раскрывать в Шаббат.\nТакже разрешается складывать его\nобратно.<\/font><\/p><h3 id=\"part-435\"><font size=\"3\">Удлинение\nстола<\/font><\/h3><p><font size=\"3\">19. Стол, имеющий\nдополнительные доски, с помощью которых\nего можно удлинить, разрешается удлинять\nи укорачивать в Шаббат. В этом нет запрета\nна сооружение шатра или его разрушение.<\/font><\/p><h3 id=\"part-436\"><font size=\"3\">Перемещение\nкастрюли с места на место<\/font><\/h3><p><font size=\"3\">20. Некоторые из\nпоздних авторитетов писали, что тот,\nкто переносит кастрюлю с места на место,\nа затем кладёт на неё крышку, фактически\nсначала устанавливает стенки, а потом\nкладёт крышу. Поэтому здесь может быть\nзапрет на сооружение шатра, если между\nедой в кастрюле и крышкой имеется\nсвободное пространство высотой один\nтефах.<\/font><\/p><p><font size=\"3\">Однако если у\nкрышки есть ручка и очевидно, что это\nименно крышка, а не шатёр, можно разрешить.<\/font><\/p><p><font size=\"3\">Хазон Иш\nпридерживается более мягкого подхода\nв отношении самого запрета оhель.<\/font><\/p><h3 id=\"part-437\"><font size=\"3\">Книга,\nположенная на стопки книг<\/font><\/h3><p><font size=\"3\">21. Тот, кто кладёт\nдве стопки книг — одну с одной стороны\nи другую с другой стороны, — чтобы\nположить сверху книгу, поступает\nразрешённым образом. Здесь нет запрета\nна сооружение временного шатра, поскольку\nему не требуется пространство между\nстопками книг.<\/font><\/p><h3 id=\"part-438\"><font size=\"3\">Вставление\nящика<\/font><\/h3><p><font size=\"3\">22. См. выше, глава\n8, пункт 9, где мы обсуждали вопрос о том,\nсуществует ли запрет боне при вставлении\nящика в шкаф. В случае, когда нет запрета\nбоне, некоторые поским запрещали\nвставлять ящик из-за запрета сооружения\nшатра: в результате под полкой шкафа\nили стола образуется пространство.<\/font><\/p><p><font size=\"3\">Это относится\nтолько к случаю, когда помимо предметов,\nнаходящихся в ящике, имеется свободное\nпространство размером не менее одного\nна один тефах и высотой не менее одного\nтефаха. Хазон Иш придерживается мнения,\nчто это разрешено.<\/font><\/p><h3 id=\"part-439\"><font size=\"3\">Шатёр,\nудерживаемый человеком в руках<\/font><\/h3><p><font size=\"3\">23. Разрешается\nдержать в руках одежду, талит или\nдеревянную доску, чтобы защитить себя\nот солнца или дождя. В этом нет запрета\nна сооружение шатра, поскольку шатёр,\nкоторый человек удерживает в руках, не\nсчитается шатром.<\/font><\/p><p><font size=\"3\">Тем не менее\nнельзя разрешать держать в руках зонт,\nкак объяснялось выше, в пункте 6.<\/font><\/p><p><font size=\"3\">Тем более\nразрешается держать талит в руках, когда\nнамерение человека не состоит в том,\nчтобы защититься от солнца или дождя,\nнапример, как принято расстилать талит\nнаподобие свадебного балдахина над\nголовой жениха Торы во время Симхат-Тора.<\/font><\/p><h3 id=\"part-440\">\n<font size=\"5\"><b>Законы\n\t\t\t\t\tдобавления к временному шатру<\/b><\/font><\/h3><p>Выше было разъяснено, что запрет\n\t\t\t\t\tна сооружение временного шатра —\n\t\t\t\t\tэто не запрет Торы, а запрет мудрецов\n\t\t\t\t\t(рабанан).<\/p><p>Мудрецы сделали послабление в этом\n\t\t\t\t\tзапрете: если часть шатра уже была\n\t\t\t\t\tсооружена до наступления Шаббата,\n\t\t\t\t\tразрешается добавить к ней в Шаббат\n\t\t\t\t\tвременное дополнение.<\/p><p>При этом нет разницы, является ли\n\t\t\t\t\tосновная часть шатра постоянной или\n\t\t\t\t\tвременной. Всё зависит от характера\n\t\t\t\t\tдополнения: если дополнение временное,\n\t\t\t\t\tего разрешается добавлять; если же\n\t\t\t\t\tдополнение постоянное, добавлять\n\t\t\t\t\tего запрещено, и это влечёт запрет\n\t\t\t\t\tуровня Торы.<\/p><p>В Гемаре (Эрувин, 102) описываются\n\t\t\t\t\tразличные виды дополнений к шатру.\n\t\t\t\t\tИх подробные законы будут разъяснены\n\t\t\t\t\tдалее.<\/p><h3 id=\"part-441\"><font size=\"3\">Законы\nдобавления к временному шатру<\/font><\/h3><p><font size=\"3\">24. Если над\nопределённым местом уже имеется покрытие\nшириной один тефах, установленное до\nнаступления Шаббата, разрешается\nдобавить к нему в Шаббат временное\nпокрытие, то есть такое, которое\nустанавливается на короткое время и не\nостаётся на месте несколько дней.<\/font><\/p><p><font size=\"3\">Некоторые пишут,\nчто начинать расстилать шатёр следует\nсо стороны, прилегающей к шатру,\nустановленному до Шаббата.<\/font><\/p><p><font size=\"3\">Поэтому, если\nчеловек хочет расстелить нейлон в\nпродолжение навеса детской коляски,\nчтобы защитить её от дождя, ему следует\nначинать расстилать нейлон от навеса,\nа не с противоположной стороны.<\/font><\/p><p><font size=\"3\">25. Если человек\nположил в пятницу свернутую циновку на\nместо, которое собирается покрыть в\nШаббат, ему не разрешается расстилать\nэту циновку в Шаббат, даже если ширина\nсвёрнутой циновки составляет один\nтефах.<\/font><\/p><p><font size=\"3\">Однако если он\nначал расстилать циновку ещё до\nнаступления Шаббата и расстелил её на\nширину одного тефаха, ему разрешается\nпродолжить расстилать её в Шаббат,\nпоскольку это считается временным\nдополнением к шатру.<\/font><\/p><h3 id=\"part-442\"><font size=\"3\">Добавление\nшатра на жерди, расположенные на\nрасстоянии менее трёх тефахов друг от\nдруга<\/font><\/h3><p><font size=\"3\">26. Существует\nещё одно разрешение добавлять к шатру:\nесли на месте, которое человек собирается\nпокрыть, ещё до наступления Шаббата\nнаходились жерди, балки или верёвки,\nрасстояние между которыми было менее\nтрёх тефахов, то, поскольку всё, что\nнаходится на расстоянии менее трёх\nтефахов, считается соединённым (лавуд),\nэто рассматривается так, словно здесь\nуже имеется начало шатра. Поэтому\nразрешается расстелить временное\nпокрытие поверх этих жердей.<\/font><\/p><h3 id=\"part-443\"><font size=\"3\">Расстилание\nнейлона над суккой<\/font><\/h3><p><font size=\"3\">27. Разрешается\nрасстилать нейлон над суккой в Шаббат,\nчтобы защитить её от дождя. В этом нет\nзапрета на сооружение шатра, поскольку\nчеловек лишь добавляет покрытие к уже\nсуществующему схаху.<\/font><\/p><p><font size=\"3\">При этом следует\nсоблюдать осторожность и не перемещать\nсхах руками, поскольку он является\nмукце.<\/font><\/p><h3 id=\"part-444\"><font size=\"3\">Добавление\nпокрытия к детской коляске<\/font><\/h3><p><font size=\"3\">28. Детскую коляску,\nу которой имеется складной навес,\nразрешается открывать в Шаббат, как\nобъяснялось выше, в пункте 5. Также\nразрешается расстилать временное\nпокрытие в продолжение этого навеса,\nпоскольку это тоже входит в разрешение\nдобавлять покрытие к шатру шириной один\nтефах.<\/font><\/p><p><font size=\"3\">И хотя к началу\nШаббата навес был сложен и не имел ширины\nодин тефах, мы всё же рассматриваем его\nтак, словно он был открыт. Ведь основание\nразрешения открывать складной навес\nзаключается в том, что он считается как\nбы установленным ещё до наступления\nШаббата.<\/font><\/p><p><font size=\"3\">29. Если у детской\nколяски есть навес и человек хочет\nрасстелить одеяло непосредственно над\nколяской таким образом, что между навесом\nи одеялом имеется разница по высоте,\nсм. примечание.<\/font><\/p><h3 id=\"part-445\"><font size=\"3\">Установка\nнавеса на коляску<\/font><\/h3><p><font size=\"3\">30. Если навес\nдетской коляски отсоединился от неё,\nзапрещается снова прикреплять его к\nколяске, даже если соединение будет\nнеплотным, поскольку этим человек\nсооружает шатёр.<\/font><\/p><h3 id=\"part-446\"><font size=\"3\">Добавление\nпокрытия к схаху сукки<\/font><\/h3><p><font size=\"3\">31. Из слов некоторых\nпоским следует, что это разрешение на\nдобавление покрытия распространяется\nдаже на случай, когда дополнение позволяет\nпользоваться суккой.<\/font><\/p><p><font size=\"3\">Например, если\nчасть схаха упала и осталось открытое\nпространство шириной три тефаха, из-за\nкоторого сукка становится непригодной,\nразрешается положить в это пространство\nодеяло, чтобы оно считалось непригодным\nсхахом, который не делает сукку\nнепригодной.<\/font><\/p><p><font size=\"3\">Однако некоторые\nзапрещают поступать таким образом. См.\nпримечание.<\/font><\/p><h3 id=\"part-447\"><font size=\"3\">Циновка,\nприкреплённая верёвками<\/font><\/h3><p><font size=\"3\">32. Если циновка\nили полог до наступления Шаббата не\nимели ширины один тефах, но были заранее\nпривязаны к каркасу шатра, а также к ним\nбыли прикреплены верёвки, с помощью\nкоторых можно потянуть циновку или\nполог и развернуть их, разрешается\nразворачивать их в Шаббат временным\nобразом. В этом нет запрета на сооружение\nвременного шатра.<\/font><\/p><p><font size=\"3\">Некоторые\nразрешают это уже в том случае, если\nциновка была привязана к каркасу до\nнаступления Шаббата, даже если к ней не\nбыли прикреплены верёвки для её\nнатягивания.<\/font><\/p><h3 id=\"part-448\"><font size=\"3\">Разрушение\nвременного шатра<\/font><\/h3><p><font size=\"3\">33. Любой шатёр,\nкоторый запрещено устанавливать,\nзапрещено и разбирать, поскольку это\nявляется запретом на разрушение шатра\n— производной работы сотер.<\/font><\/p><h3 id=\"part-449\"><font size=\"3\">Разборка\nвременного дополнения<\/font><\/h3><p><font size=\"3\">34. Если временный\nшатёр уже имел ширину один тефах до\nнаступления Шаббата, а человек продолжил\nустанавливать его в Шаббат, опираясь\nна разрешение добавлять покрытие к\nшатру, приведённое выше в пункте 24, ему\nразрешается убрать это дополнение в\nШаббат.<\/font><\/p><p><font size=\"3\">Однако если ещё\nдо наступления Шаббата весь шатёр был\nполностью расстелен, запрещается\nразбирать его в Шаббат, даже если человек\nоставляет часть покрытия шириной один\nтефах.<\/font><\/p><h3 id=\"part-450\"><font size=\"3\">Снятие\nпокрытия с детской коляски<\/font><\/h3><p><font size=\"3\">35. По-видимому,\nразрешается снимать нейлоновое покрытие,\nзакрывающее детскую коляску, если при\nэтом остаётся навес коляски шириной\nодин тефах, даже если это нейлоновое\nпокрытие было прикреплено к коляске\nещё до наступления Шаббата.<\/font><\/p><h3 id=\"part-451\"><font size=\"3\">Снятие\nкрыши с шатра, не предназначенного для\nиспользования пространства под ним<\/font><\/h3><p><font size=\"3\">36. Временный\nшатёр, который не предназначен для\nиспользования пространства под ним и,\nкак было разъяснено выше в пункте 14,\nзапрещён только в том случае, когда\nчеловек устанавливает в Шаббат стенки,\nа затем крышу, — запрещается разбирать\nв Шаббат, снимая с него крышу, даже если\nстенки при этом остаются на месте.<\/font><\/p><h3 id=\"part-452\"><font size=\"3\">Разрушение\nшатра посредством изменения порядка\nдействий<\/font><\/h3><p><font size=\"3\">37. Выше было\nразъяснено, что разрешается сооружать\nвременный шатёр с изменением порядка\nдействий: сначала устанавливая крышу,\nа затем стенки.<\/font><\/p><p><font size=\"3\">Что касается\nвопроса, разрешается ли также разбирать\nшатёр с изменением порядка действий,\nто есть чтобы один человек держал доску\nсверху, а другие убирали стенки по\nсторонам, после чего он снял бы доску,\n— см. примечание.<\/font><\/p><h3 id=\"part-453\">\n<font size=\"5\">Законы сооружения\n\t\t\t\t\tперегородок в Шаббат<\/font><\/h3><p>Выше, во введении к законам оhель,\n\t\t\t\t\tбыло разъяснено, что и при установке\n\t\t\t\t\tперегородок существует запрет уровня\n\t\t\t\t\tТоры как производная работа боне,\n\t\t\t\t\tесли человек устанавливает их на\n\t\t\t\t\tпостоянной основе. Это относится\n\t\t\t\t\tдаже к случаю, когда здесь нет основного\n\t\t\t\t\tвида работы боне, например, если\n\t\t\t\t\tперегородки не соединены со стенами\n\t\t\t\t\tили землёй.<\/p><p>Однако если человек устанавливает\n\t\t\t\t\tперегородки временно, мудрецы не\n\t\t\t\t\tустановили на это запрет.<\/p><p>Лишь в одном случае мудрецы запретили\n\t\t\t\t\tустанавливать временную перегородку:\n\t\t\t\t\tкогда она является мехица матерет —\n\t\t\t\t\tперегородкой, имеющей разрешающую\n\t\t\t\t\tфункцию. Например, когда человек\n\t\t\t\t\tустанавливает перегородку, разрешающую\n\t\t\t\t\tпереносить предметы в Шаббат, либо\n\t\t\t\t\tперегородку, благодаря которой сукка\n\t\t\t\t\tстановится пригодной, и тому подобное.<\/p><p>Но перегородку, не имеющую разрешающей\n\t\t\t\t\tфункции, разрешается временно\n\t\t\t\t\tустанавливать в Шаббат, например\n\t\t\t\t\tперегородку между мужчинами и\n\t\t\t\t\tженщинами во время молитвы.<\/p><h3 id=\"part-454\"><font size=\"3\">Установка\nпостоянной перегородки<\/font><\/h3><p><font size=\"3\">38. Запрещается\nна уровне Торы устанавливать перегородку,\nпредназначенную для разделения двух\nпространств, если человек намеревается\nоставить её на постоянной основе, то\nесть на несколько дней.<\/font><\/p><p><font size=\"3\">Также запрещается\nубирать перегородку, установленную на\nнесколько дней, поскольку это является\nнарушением запрета сотер — разрушения.<\/font><\/p><p><font size=\"3\">Этот запрет\nуровня Торы распространяется и на\nперегородку, которая не является мехица\nматерет, то есть не имеет разрешающей\nфункции.<\/font><\/p><h3 id=\"part-455\"><font size=\"3\">Установка\nвременной перегородки и законы\nперегородки, имеющей разрешающую функцию<\/font><\/h3><p><font size=\"3\">39. Разрешается\nустанавливать временную перегородку,\nто есть такую, которую устанавливают\nне на несколько дней, а на короткое\nвремя. Например, когда человек ставит\nперегородку для защиты от солнца или\nветра, либо чтобы отделить мужчин от\nженщин во время молитвы или трапезы, и\nтому подобное.<\/font><\/p><p><font size=\"3\">Однако если\nперегородка является мехица матерет,\nто есть благодаря ей возникает определённое\nразрешение, например перегородка,\nблагодаря которой пространство\nприобретает статус решут а-яхид и\nстановится разрешённым для переноса\nпредметов, или перегородка, благодаря\nкоторой сукка становится пригодной, —\nзапрещается устанавливать её даже\nвременно.<\/font><\/p><p><font size=\"3\">40. Запрещается\nсправлять нужду или вступать в супружескую\nблизость перед книгами или мезузой.<\/font><\/p><p><font size=\"3\">В будние дни\nсуществуют два способа разрешить это:<\/font><\/p><ol>\n<li><p><font size=\"3\">Если человек\n\tзакрывает книги двумя покрытиями, это\n\tразрешено.<\/font><\/p><\/li>\n<li><p><font size=\"3\">Также можно\n\tустановить перегородку, отделяющую\n\tместо, где находится человек, от места,\n\tгде находятся книги.<\/font><\/p><\/li>\n<\/ol><p><font size=\"3\">Однако в отношении\nШаббата поским пишут, что следует\nпользоваться только первым разрешением\n— закрыть книги двумя покрытиями. Но\nустанавливать перегородку не разрешается,\nпоскольку она является мехица матерет,\nа такую перегородку запрещено устанавливать\nв Шаббат.<\/font><\/p><p><font size=\"3\">Если же над\nкнигами уже имеется одно покрытие, а\nперегородка служит дополнительным\nпокрытием, то есть книги не видны над\nперегородкой, мнения поским расходятся.<\/font><\/p><p><font size=\"3\">Некоторые пишут,\nчто в таком случае разрешается установить\nперегородку, поскольку разрешение\nсуществует и без её функции перегородки:\nблагодаря двум покрытиям — покрытию\nнад книгами и самой перегородке, которая\nтакже служит покрытием. Следовательно,\nчеловеку не требуется прибегать к\nзаконам перегородки, чтобы разрешить\nсправлять нужду, и поэтому здесь нет\nзапрета на установку мехица матерет.<\/font><\/p><p><font size=\"3\">Другие запрещают\nэто, поскольку в конечном счёте человек\nвсё равно устанавливает перегородку,\nблагодаря которой ему разрешается\nсправлять нужду или вступать в супружескую\nблизость.<\/font><\/p><p><font size=\"3\">Мишна Брура\nпишет, что в случае крайней необходимости\nможно придерживаться облегчительного\nмнения.<\/font><\/p><h3 id=\"part-456\"><font size=\"3\">Дверь\nили окно, имеющие функцию разрешающей\nперегородки<\/font><\/h3><p><font size=\"3\">41. Разрешается\nзакрывать дверь или окно, даже если в\nрезультате их закрытия возникает\nразрешение, связанное со статусом решут\nа-яхид или пригодностью сукки, и тому\nподобное.<\/font><\/p><h3 id=\"part-457\"><font size=\"3\">Временное\nдополнение к перегородке, имеющей\nразрешающую функцию<\/font><\/h3><p><font size=\"3\">42. Подобно тому,\nкак мудрецы разрешили временно добавлять\nпокрытие к шатру, который был частично\nрасстелен ещё до наступления Шаббата,\nкак объяснялось выше в пункте 24, так же\nони разрешили временное дополнение к\nперегородке, имеющей разрешающую\nфункцию.<\/font><\/p><p><font size=\"3\">То есть если\nчеловеку необходимо установить такую\nперегородку, достаточно установить до\nнаступления Шаббата её часть шириной\nодин тефах. После этого разрешается\nдобавить в Шаббат перегородку до\nнеобходимой ему величины.<\/font><\/p><h3 id=\"part-458\"><font size=\"3\">Установка\nперегородки в больнице<\/font><\/h3><p><font size=\"3\">43. Некоторые\nразрешили устанавливать перегородку\nмежду двумя кроватями в больнице для\nразделения и соблюдения скромности,\nдаже если возможно, что в будущем эту\nперегородку будут использовать как\nмехица матерет.<\/font><\/p><h3 id=\"part-459\">\n<font size=\"5\">Ношение шляпы\n\t\t\t\t\tс широкими полями<\/font><\/h3><p>В Гемаре (Шаббат, 138) сказано: «А-сияна\n\t\t\t\t\t— разрешено», то есть в Шаббат\n\t\t\t\t\tразрешается носить шляпу, и нет\n\t\t\t\t\tопасения, что это будет считаться\n\t\t\t\t\tсооружением шатра.<\/p><p>Возникает вопрос: ведь сказано, что\n\t\t\t\t\t«итхамар сияна — запрещено»? Вначале\n\t\t\t\t\tГемара проводит различие между\n\t\t\t\t\tслучаями: если ширина полей составляет\n\t\t\t\t\tодин тефах, то это запрещено; если же\n\t\t\t\t\tона меньше одного тефаха, то разрешено.\n\t\t\t\t\tПричина запрета в случае, когда ширина\n\t\t\t\t\tсоставляет один тефах, — запрет\n\t\t\t\t\tоhель, сооружения шатра.<\/p><p>Затем Гемара задаёт ещё один вопрос:\n\t\t\t\t\t«Если так, то разве нельзя будет также\n\t\t\t\t\tнакинуть на себя талит, оставив перед\n\t\t\t\t\tсобой свисающую часть шириной один\n\t\t\t\t\tтефах?» Иными словами, разве если\n\t\t\t\t\tчеловек обернётся талитом и оставит\n\t\t\t\t\tего свисать перед собой на один тефах,\n\t\t\t\t\tэто тоже будет запрещено как сооружение\n\t\t\t\t\tшатра?<\/p><p>Гемара отвечает: «Нетрудно: здесь\n\t\t\t\t\tречь идёт о случае, когда он плотно\n\t\t\t\t\tприлегает, а там — когда не прилегает».<\/p><p>Ранние комментаторы расходятся в\n\t\t\t\t\tобъяснении окончательного вывода\n\t\t\t\t\tГемары:<\/p><p>1. Раши объясняет, что, согласно\n\t\t\t\t\tокончательному выводу, Гемара\n\t\t\t\t\tотказывается от первоначального\n\t\t\t\t\tпонимания. Он считает, что при ношении\n\t\t\t\t\tшляпы нет запрета оhель. Причина\n\t\t\t\t\tзапрета на ношение шляпы заключается\n\t\t\t\t\tв опасении, что ветер поднимет её с\n\t\t\t\t\tголовы, и человек может понести её\n\t\t\t\t\tна расстояние четырёх амот. Если же\n\t\t\t\t\tшляпа плотно держится на голове, её\n\t\t\t\t\tразрешается носить, поскольку нет\n\t\t\t\t\tопасения, что ветер поднимет её.<\/p><p>2. Рабейну Хананель, Рамбам и Тосафот\n\t\t\t\t\tобъясняют, что и согласно окончательному\n\t\t\t\t\tвыводу Гемары запрет связан с оhель.\n\t\t\t\t\tОднако мудрецы установили этот запрет\n\t\t\t\t\tтолько тогда, когда шляпа плотно\n\t\t\t\t\tдержит форму, то есть её поля не\n\t\t\t\t\tсгибаются. В таком случае она выглядит\n\t\t\t\t\tкак шатёр. Но если поля сгибаются,\n\t\t\t\t\tшляпа не выглядит как шатёр.<\/p><p>Между объяснениями Раши и Рамбама\n\t\t\t\t\tсуществуют следующие практические\n\t\t\t\t\tразличия:<\/p><p>А. Шляпа, ширина полей которой меньше\n\t\t\t\t\tодного тефаха:<\/p><ul>\n<li><p>Согласно Раши, запрещается носить\n\t\t\t\t\t\tеё на улице, если она недостаточно\n\t\t\t\t\t\tплотно держится на голове, из опасения,\n\t\t\t\t\t\tчто ветер поднимет её.<\/p><\/li>\n<li><p>Согласно Рамбаму, такого опасения\n\t\t\t\t\t\tне установлено, и запрета оhель нет,\n\t\t\t\t\t\tпоскольку ширина полей меньше одного\n\t\t\t\t\t\tтефаха.<\/p><\/li>\n<\/ul><p>Б. Согласно Рамбаму, запрещается\n\t\t\t\t\tносить шляпу с полями шириной один\n\t\t\t\t\tтефах даже в помещении. Согласно\n\t\t\t\t\tРаши, запрет существует только на\n\t\t\t\t\tулице.<\/p><p>Что касается практического закона,\n\t\t\t\t\tШульхан Арух (симан 301, пункты 40–41)\n\t\t\t\t\tпостановляет соблюдать строгость\n\t\t\t\t\tсогласно обоим мнениям.<\/p><p>Далее будут рассмотрены подробные\n\t\t\t\t\tзаконы, относящиеся к современным\n\t\t\t\t\tголовным уборам.<\/p><p>44. Если у шляпы широкие поля шириной\nодин тефах, сделанные из материала,\nнапример фетра, который не сгибается,\nнекоторые поским пишут, что запрещается\nносить такую шляпу в Шаббат даже в\nпомещении. Однако обычай — разрешать\nэто. См. примечание.<\/p><h3 id=\"part-460\"><font size=\"3\">Выход\nс шляпой в общественное владение<\/font><\/h3><p>45. Некоторые поским пишут, что запрещается\nвыходить в Шаббат в шляпе, которая\nнедостаточно плотно держится на голове,\nпоскольку есть опасение, что ветер\nподнимет её с головы и человек понесёт\nеё на расстояние четырёх амот в\nобщественном владении.<\/p><p>Это относится именно к случаю, когда\nчеловек носит под шляпой кипу. Но если\nпод шляпой он не носит кипу, это разрешено,\nпоскольку нет опасения, что он пойдёт\nс непокрытой головой.<\/p><p>В месте, где имеется надлежащим образом\nустроенный эрув, нет опасения нарушения\nэтого запрета.<\/p><h3 id=\"part-461\">\n<font size=\"5\"><b>Накрывание\n\t\t\t\t\tширокого сосуда<\/b><\/font><\/h3><p>В Гемаре (Шаббат, 139) сказано: «Рав\n\t\t\t\t\tсказал: этот прунка — на половину\n\t\t\t\t\tбочки разрешено, а на всю бочку\n\t\t\t\t\tзапрещено».<\/p><p>Раши объясняет: прунка — это ткань,\n\t\t\t\t\tкоторую расстилают на винной бочке,\n\t\t\t\t\tчтобы накрыть её. Накрыть половину\n\t\t\t\t\tбочки разрешено, поскольку это не\n\t\t\t\t\tсчитается шатром.<\/p><p>Большинство ранних комментаторов\n\t\t\t\t\tобъясняют, что запрет связан с тем,\n\t\t\t\t\tчто покрытие выглядит как шатёр.\n\t\t\t\t\tКогда же оно не накрывает всю бочку,\n\t\t\t\t\tоно не выглядит как шатёр. Так же\n\t\t\t\t\tпостановляет Шульхан Арух (симан\n\t\t\t\t\t315, пункт 13).<\/p><p>Поским пишут, что это относится\n\t\t\t\t\tдаже к случаю, когда человек не\n\t\t\t\t\tнамеревается сооружать шатёр, а лишь\n\t\t\t\t\tхочет накрыть сосуд обычным покрытием.\n\t\t\t\t\tВыше, в пункте 14 и примечании 31, было\n\t\t\t\t\tразъяснено, что в подобном случае\n\t\t\t\t\tзапрет обычно действует только тогда,\n\t\t\t\t\tкогда человек устанавливает также\n\t\t\t\t\tстенки. Однако здесь мудрецы установили\n\t\t\t\t\tзапрет, поскольку бочка является\n\t\t\t\t\tшироким сосудом, и поэтому её накрывание\n\t\t\t\t\tвыглядит как сооружение шатра даже\n\t\t\t\t\tбез установки стенок.<\/p><p>Некоторые ранние комментаторы —\n\t\t\t\t\t<font face=\"Tahoma\"><span>ראב<\/span><\/font>\"<font face=\"Tahoma\"><span>ד\n\t\t\t\t\t<\/span><\/font>и Рашба — считают, что запрет\n\t\t\t\t\tрасстилать ткань над бочкой связан\n\t\t\t\t\tне с оhель, а с тем, что это выглядит\n\t\t\t\t\tкак процеживание: будто человек\n\t\t\t\t\tфильтрует вино, отделяя от него\n\t\t\t\t\tосадок.<\/p><p>Согласно этому мнению, строгость\n\t\t\t\t\tследует соблюдать только в отношении\n\t\t\t\t\tбочки, наполненной вином, но не других\n\t\t\t\t\tнапитков.<\/p><p>Что касается практи
