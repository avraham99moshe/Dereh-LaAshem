ища сама по\n\t\t\t\t\tсебе отделяется от отходов, — или же\n\t\t\t\t\tон сделал это по другой причине. См.\n\t\t\t\t\tтам.<\/p><p>Из Гемары следует, что рас<span>сыпание<\/span>\n\t\t\t\t\tсмеси пищи и отходов перед человеком,\n\t\t\t\t\tкоторый собирается есть, не является\n\t\t\t\t\tзапретом борер.<\/p><p>Некоторые вывели отсюда, что\n\t\t\t\t\tрас<span>сыпание<\/span> фруктов\n\t\t\t\t\tвообще не считается действием борер.\n\t\t\t\t\tСледовательно, было бы разрешено\n\t\t\t\t\tрас<span>сыпать<\/span> фрукты или\n\t\t\t\t\tлюбую другую смесь таким образом,\n\t\t\t\t\tчтобы фрукты и отходы отдалились\n\t\t\t\t\tдруг от друга настолько, что уже не\n\t\t\t\t\tсчитались бы смесью, а затем\n\t\t\t\t\tрассортировать каждый вид по\n\t\t\t\t\tотдельности.<\/p><p>Однако некоторые запрещают поступать\n\t\t\t\t\tтаким образом. См. примечание 1<span>33<\/span>,\n\t\t\t\t\tгде приводится объяснение этих двух\n\t\t\t\t\tмнений.<\/p><p><strong>119. Если перед человеком находится\nсмесь и он хочет её рассортировать<\/strong><br/>\nНекоторые\nразрешают рас<span>сеять и  <\/span>расстелить\nвсю смесь до тех пор, пока пища и отходы\nили различные виды больше не будут\nсмешаны друг с другом, а затем можно\nбудет рассортировать каждый вид отдельно.\nДругие запрещают так поступать.<\/p><h3 id=\"part-305\">Сортировка предметов\nпосредством взятия первого попавшегося<\/h3><p><strong>120.<\/strong> Нельзя брать предметы из\nсмеси с целью рассортировать их, даже\nесли при взятии человек берёт первый\nпопавшийся предмет и ему безразлично,\nчто именно попадётся в руку, а затем,\nкогда предметы уже находятся у него в\nруках и больше не смешаны, кладёт каждый\nпредмет на своё место.<\/p><p>Поскольку его намерение при взятии\nсостоит в том, чтобы рассортировать и\nотделить предметы друг от друга, все\nэти действия рассматриваются как одно\nпродолжительное действие, и оно\nзавершается тем, что человек кладёт\nпредмет на предназначенное для него\nместо. Поэтому это считается борер.<\/p><p>Следовательно, если перед человеком\nнаходится смесь столовых приборов и он\nхочет рассортировать её, положив каждый\nприбор на своё место, так делать нельзя,\nдаже если он берёт каждый раз первый\nпопавшийся прибор.<\/p><p>Также нельзя брать столовые приборы\nиз смеси первый попавшийся и класть их\nна стол в предназначенное для них место,\nесли стол не накрывается непосредственно\nперед трапезой.<\/p><h3 id=\"part-306\">Сортировка посуды во время\nеё мытья<\/h3><p><strong>121.<\/strong> Хотя выше было разъяснено,\nчто запрещено сортировать предметы,\nнаходящиеся в смеси, посредством взятия\nпервого попавшегося предмета, существуют\nслучаи, когда это разрешено.<\/p><p>Например, если в смеси лежит грязная\nпосуда, разрешено взять первый попавшийся\nпредмет, вымыть его, а затем положить\nна его специальное место, хотя в результате\nпосуда оказывается рассортированной.<\/p><p>Причина в том, что основной целью\nвзятия предмета было не сортирование,\nа его мытьё, а помещение предмета на\nсвоё место производится отдельным\nдействием. Поэтому здесь нет одного\nпродолжительного действия, состоящего\nиз взятия предмета с целью сортировки.<\/p><p>Следует знать, что это разрешение\nотносится только к случаю, когда из\nсмеси берут первый попавшийся предмет\nи лишь после его мытья кладут на\nпредназначенное для него место. Однако\nзапрещено извлекать из смеси конкретный\nпредмет, который человек хочет сейчас\nвымыть, поскольку само извлечение именно\nэтого предмета из смеси является борер,\nне предназначенным для немедленного\nиспользования.<\/p><p><strong>122.<\/strong> То же относится к чистой\nпосуде, лежащей в смеси, которую человек\nхочет вытереть, чтобы из-за влаги на ней\nне образовались пятна. Разрешено брать\nпервый попавшийся предмет, вытирать\nего, а затем класть на предназначенное\nдля него место.<\/p><p>Если же человек хочет вытереть посуду\nне по этой причине, а только для того,\nчтобы положить её на место, некоторые\nразрешают это, а некоторые запрещают,\nкак будет разъяснено в следующем <font face=\"Tahoma\"><span>סעיף<\/span><\/font>.<\/p><h3 id=\"part-307\">Сортировка одежды во время\nеё складывания<\/h3><p><strong>123.<\/strong> Если выстиранная одежда\nлежит в смеси и человек хочет сложить\nеё и положить на своё место, некоторые\nразрешают взять первый попавшийся\nпредмет одежды, сложить его разрешённым\nспособом — см. далее, глава 13, <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>70 — а затем положить каждый вид\nодежды отдельно, хотя в результате он\nтем самым сортирует одежду.<\/p><p>Другие запрещают это.<\/p><h3 id=\"part-308\">Сортировка по ошибке<\/h3><p><strong>124.<\/strong> Если человек ест фрукты,\nвзял в руку фрукт и обнаружил, что он\nнепригоден для еды, разрешено положить\nего туда, куда он хочет, и это не считается\nотделением отходов от пищи.<\/p><p><strong>125.<\/strong> Если перед человеком\nнаходится смесь пищи и отходов или два\nвида пищи, и он заинтересован в одном\nиз них, а когда он взял что-либо из смеси,\nему в руку попались отходы или вид пищи,\nкоторый ему не нужен, существуют различные\nслучаи. См. примечание.<\/p><h3 id=\"part-309\">Удаление предметов для\nдоступа к находящимся под ними предметам<\/h3><p><strong>126.<\/strong> Если в миске или корзине\nлежат апельсины и яблоки, причём каждый\nвид расположен отдельно: апельсины в\nнижнем слое, а яблоки сверху, — и человек\nхочет взять апельсины и съесть их, ему\nразрешено убрать лежащие сверху яблоки,\nчтобы получить доступ к находящимся\nпод ними апельсинам. В этом нет запрета\nборер.<\/p><p>Что касается листов или карточек,\nлежащих стопкой, когда человек хочет\nубрать верхние, чтобы посмотреть\nнаходящиеся под ними, — см. примечание\n143.<\/p><p>Также, если на стене висят несколько\nпальто одно на другом и человек ищет\nсвоё пальто, ему разрешено снять верхнее\nпальто, чтобы добраться до находящегося\nпод ним.<\/p><p>Однако если пальто не расположены\nодно на другом, а лежат в смеси или висят\nвплотную друг к другу, см. примечание.<\/p><h3 id=\"part-310\">\n\t\t\t\t\tЕсли человек совершил борер с\n\t\t\t\t\tнарушением — запрещается ли пища?<\/h3><p>Шульхан Арух, в <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\t<\/span><\/font>318, приводит закон о человеке,\n\t\t\t\t\tкоторый с нарушением совершил бишуль\n\t\t\t\t\tв Шаббат, и постановляет: если он\n\t\t\t\t\tсделал это намеренно, ему самому\n\t\t\t\t\tзапрещено есть приготовленное блюдо\n\t\t\t\t\tнавсегда, а другим разрешено есть\n\t\t\t\t\tего после окончания Шаббата. Если же\n\t\t\t\t\tон сделал это по ошибке, запрещено\n\t\t\t\t\tесть его в этот Шаббат как ему самому,\n\t\t\t\t\tтак и другим, а после окончания Шаббата\n\t\t\t\t\tразрешено.<\/p><p>Мнение Гра состоит в том, что если\n\t\t\t\t\tэто было сделано по ошибке, разрешено\n\t\t\t\t\tесть приготовленное блюдо уже в сам\n\t\t\t\t\tШаббат — как самому человеку, так и\n\t\t\t\t\tдругим.<\/p><p>Мишна Брура, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\t<\/span><\/font>318, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן <\/span><\/font>7, пишет, что в случае\n\t\t\t\t\tнеобходимости можно опереться на\n\t\t\t\t\tмнение Гра и разрешить есть в Шаббат\n\t\t\t\t\tто, что было приготовлено по ошибке.<\/p><p>Что касается <font face=\"Tahoma\"><span>מלאכת\n\t\t\t\t\tבורר<\/span><\/font>, При Мегадим пишет, что\n\t\t\t\t\tне следует есть пищу, в отношении\n\t\t\t\t\tкоторой было совершено действие\n\t\t\t\t\tборер. Беур Галаха приводит это мнение\n\t\t\t\t\tв начале <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\t<\/span><\/font>319, а затем приводит вышеупомянутое\n\t\t\t\t\tмнение Гра, который разрешает\n\t\t\t\t\tпользоваться результатом <font face=\"Tahoma\"><span>מלאכה<\/span><\/font>,\n\t\t\t\t\tсовершённой по ошибке.<\/p><p><strong>127.<\/strong> Тот, кто по ошибке совершил\nборер, не должен есть эту пищу до окончания\nШаббата — ни он сам, ни другие. В случае\nнеобходимости можно облегчить и разрешить\nэто.<\/p><p>Что касается случая, когда борер был\nсовершён намеренно и возникает вопрос,\nзапрещено ли есть эту пищу навсегда, —\nсм. примечание 146.<\/p><p><strong>128.<\/strong> Если человек совершил\nборер таким образом, что пища стала\nзапрещённой, нет разрешения исправить\nситуацию даже посредством того, чтобы\nснова смешать пищу с отходами, а затем\nснова произвести борер разрешённым\nспособом.<\/p><p>Причина в том, что пища уже стала\nзапрещённой в тот момент, когда человек\nотделил от неё отходы. При этом нет\nразличия между намеренным и совершённым\nпо ошибке действием.<\/p><p><strong>129.<\/strong> См. выше <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>16: существуют виды сортировки,\nкоторые поским не запретили как несомненно\nзапрещённые, а лишь проявили в отношении\nних строгость, например в случае\nпредметов, которые отчётливо различимы\nдруг от друга. В таких случаях нет\nоснований запрещать пищу постфактум.<\/p><h3 id=\"part-311\">\n<font size=\"5\">Мелаха зоре —\n\t\t\t\tвеяние<\/font><\/h3><p>Зоре — одна из 39 основных мелахот.<\/p><p>Мелаха зри́я (веяние) выполняется\n\t\t\t\tпосле диши (обмолота). То есть после\n\t\t\t\tтого, как в результате мелахи диша\n\t\t\t\tзёрна отделились от своего соединения\n\t\t\t\tс колосом и от шелухи, которая их\n\t\t\t\tокружала, но солома и шелуха всё ещё\n\t\t\t\tоставались смешанными с зёрнами,\n\t\t\t\tвыполняли мелаху зоре, чтобы отделить\n\t\t\t\tзёрна от соломы и шелухи.<\/p><p>Обычно это делали с помощью ветра.\n\t\t\t\tКогда дул ветер, смесь зёрен, соломы\n\t\t\t\tи шелухи подбрасывали в воздух. Ветер\n\t\t\t\tуносил солому и шелуху на некоторое\n\t\t\t\tрасстояние, а более тяжёлые зёрна\n\t\t\t\tпадали на том месте, где их бросили.<\/p><p>Таким образом, тот, кто выполнял\n\t\t\t\tзоре, отделял зёрна от отходов, и это\n\t\t\t\tявляется <strong>мелахой махшевет<\/strong>,\n\t\t\t\tза совершение которой полагается\n\t\t\t\t<strong>хатат<\/strong>.<\/p><p><strong>130.<\/strong> Если человек веет зерно\nна ветру и отделяет шелуху от зёрен, он\nобязан за это как за мелаху зоре. То же\nотносится к случаю, когда он дует ртом\nна такую смесь зерна и удаляет из неё\nотходы.<\/p><p><strong>131.<\/strong> Арахис, смешанный с красной\nшелухой, запрещено обдувать ртом, чтобы\nудалить шелуху из смеси.<\/p><h3 id=\"part-312\">\n<font size=\"5\">Рассеивание с\n\t\t\t\tпомощью ветра<\/font><\/h3><p>Выше было разъяснено, что сущность\n\t\t\t\tмелахи <strong>зоре<\/strong> подобна мелахе\n\t\t\t\t<strong>борер<\/strong>, то есть отделению\n\t\t\t\tотходов от пищи. Так же объясняется\n\t\t\t\tв Гемаре, Шаббат 73б: «Зоре, борер и\n\t\t\t\tмеркакед — их сущность одинакова».\n\t\t\t\tТак же пишет Рамбам, <font face=\"Tahoma\"><span>הלכות\n\t\t\t\tשבת<\/span><\/font>, глава 8, галаха 11.<\/p><p>Однако в Иерусалимском Талмуде,\n\t\t\t\tШаббат, глава 7, галаха 2, сказано: «Если\n\t\t\t\tчеловек плюнул, и ветер разнёс слюну,\n\t\t\t\tон обязан как за зоре; и всякая вещь,\n\t\t\t\tдля рассеивания которой необходим\n\t\t\t\tветер, связана с мелахой зоре». Это\n\t\t\t\tприводят Ор Заруа и Рама, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t<\/span><\/font>319, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t<\/span><\/font>17.<\/p><p>Эти слова требуют объяснения,\n\t\t\t\tпоскольку ветер здесь лишь рассеивает\n\t\t\t\tслюну, но при этом нет отделения\n\t\t\t\tотходов от пищи. Последующие поским\n\t\t\t\tуже обращали внимание на эту трудность.<\/p><p>На практике последние поским писали,\n\t\t\t\tчто можно облегчить в отношении\n\t\t\t\tрассеивания различных вещей ветром,\n\t\t\t\tкогда при этом нет отделения смеси —\n\t\t\t\tво всяком случае, когда действие не\n\t\t\t\tявляется непосредственно подобным\n\t\t\t\tтому случаю, который приведён в\n\t\t\t\tИерусалимском Талмуде.<\/p><p><strong>132.<\/strong> Некоторые поским писали,\nчто не следует рассеивать различные\nвещи с помощью ветра, например плевать\nна ветер, чтобы ветер разносил слюну,\nили развеивать хамец на ветру. Однако\nна практике последние поским разрешили\nразвеивать хамец на ветру.<\/p><p><strong>133.<\/strong> Разрешено выливать воду\nв воздух, даже если ветер рассеивает\nеё.<\/p><p><strong>134.<\/strong> В случае необходимости\nразрешено наливать воду в прибор для\nхолодного увлажнения воздуха или в\nохладитель, даже если вода разбивается\nна мелкие капли и рассеивается в воздухе.\nСм. выше, глава 1, <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>108, где объясняются различные\nвиды приборов для холодного увлажнения\nвоздуха.<\/p><p><strong>135.<\/strong> Разрешено пользоваться\nаэрозольным спреем для того, чтобы\nпридать комнате приятный запах.<\/p>"}, {"title": "Работа «Даш» (молотьба) в субботу", "body": "<h2 id=\"part-314\"><font size=\"6\">Работа\n\t\t\t\t«Даш» (молотьба) в субботу<\/font><\/h2><p>Работа «Даш» — это отделение плода\n\t\t\t\tот оболочки и тех частей растения, к\n\t\t\t\tкоторым он был прикреплён во время\n\t\t\t\tроста.<\/p><p>Сначала объясним сущность этой\n\t\t\t\tработы на примере зерновых культур.<\/p><p>Зёрна пшеницы прикреплены к колосу\n\t\t\t\tи покрыты тонкой оболочкой, которую\n\t\t\t\tможно легко снять растиранием и\n\t\t\t\tнажатием. Эта оболочка называется\n\t\t\t\tмоц (<font face=\"Tahoma\"><span>מוץ<\/span><\/font>).<\/p><p>После жатвы и сбора снопов урожай\n\t\t\t\tдоставляют на гумно, где зёрна отделяют\n\t\t\t\tот колосьев и оболочек посредством\n\t\t\t\tударов. В древности эту работу обычно\n\t\t\t\tвыполняли с помощью животных, которые\n\t\t\t\tтянули за собой тяжёлые деревянные\n\t\t\t\tприспособления. Во время движения\n\t\t\t\tэти приспособления ударяли по\n\t\t\t\tсобранному урожаю, отделяя зёрна от\n\t\t\t\tоболочек.<\/p><p>После молотьбы зёрна всё ещё\n\t\t\t\tперемешаны с частями колосьев и\n\t\t\t\tсоломой. Поэтому требуется дополнительная\n\t\t\t\tработа, чтобы отделить их друг от\n\t\t\t\tдруга. Эта работа называется «Зоре»\n\t\t\t\t(<font face=\"Tahoma\"><span>זורה<\/span><\/font>) —\n\t\t\t\tвеяние, которое было рассмотрено\n\t\t\t\tвыше, в конце третьей главы.<\/p><p>Таким образом, общее определение\n\t\t\t\tработы «Даш» — это отделение съедобной\n\t\t\t\tчасти растения от того, в чём она росла\n\t\t\t\tи с чем была соединена.<\/p><p>Следует знать, что запрет работы\n\t\t\t\t«Даш» относится не только к зерновым\n\t\t\t\tкультурам, но и к бобовым растениям,\n\t\t\t\tкогда человек извлекает плод из\n\t\t\t\tстручка, к которому он был прикреплён.<\/p><p>Кроме того, в Гемаре (трактат Шаббат,\n\t\t\t\tлист 73) мы находим, что даже в отношении\n\t\t\t\tфиников существует работа «Даш»: она\n\t\t\t\tсовершается, когда человек ударяет\n\t\t\t\tпо ветвям, на которых растут финики,\n\t\t\t\tи таким образом сбивает с них плоды.<\/p><p>С другой стороны, в Гемаре (трактат\n\t\t\t\tБейца, лист 13) сказано, что разрешается\n\t\t\t\tочищать ячмень от оболочки и что это\n\t\t\t\tне считается нарушением запрета\n\t\t\t\t«Даш». Подобным образом в Мишне\n\t\t\t\t(трактат Шаббат, лист 122) разъясняется,\n\t\t\t\tчто в субботу разрешается раскалывать\n\t\t\t\tорехи.<\/p><p>Законоучители подробно обсуждали\n\t\t\t\tразличия между этими случаями, как\n\t\t\t\tбудет объяснено далее.<\/p><h3 id=\"part-315\">Производные работы,\n\t\t\t\tотносящиеся к «Даш»<\/h3><p>К производным работы «Даш» относятся:<\/p><ul>\n<li><p>Выжимание плодов — отделение\n\t\t\t\t\tсока от плода, с которым он был\n\t\t\t\t\tсоединён.<\/p><\/li>\n<li><p>Выжимание одежды — отделение\n\t\t\t\t\tжидкости от ткани.<\/p><\/li>\n<li><p>Доение — отделение молока от\n\t\t\t\t\tживотного, в котором оно находилось.<\/p><\/li>\n<\/ul><p>Следует знать, что даже в тех случаях,\n\t\t\t\tкогда, как будет объяснено далее, нет\n\t\t\t\tзапрета «Даш», иногда может возникать\n\t\t\t\tдругой запрет — «Борер» (<font face=\"Tahoma\"><span>בורר<\/span><\/font>),\n\t\t\t\tто есть отделение одного вида от\n\t\t\t\tдругого.<\/p><p><font face=\"Times New Roman, serif\"><font size=\"3\">Как\n\t\t\t\tбыло рассмотрено выше, в третьей\n\t\t\t\tглаве, в параграфах 90–96, не следует\n\t\t\t\tочищать плоды от кожуры, если до\n\t\t\t\tтрапезы остаётся значительное время;\n\t\t\t\tделать это следует непосредственно\n\t\t\t\tперед едой. См. также параграфы 100–101,\n\t\t\t\tгде рассматривается закон об удалении\n\t\t\t\tплодоножек и других частей плодов.<\/font><\/font><\/p><h2 id=\"part-316\"><font size=\"3\">Отделение\nзёрен от колосьев<\/font><\/h2><p><span>1<\/span>. Запрещается отделять\nзёрна злаковых культур от колосьев,\nпоскольку это относится к работе «Даш»\n(<font face=\"Tahoma\"><span>דש<\/span><\/font>) —\nмолотьбе. Даже если человек растирает\nколос пальцами и извлекает из него\nзерно, это также подпадает под запрет\nмолотьбы.<\/p><h2 id=\"part-317\"><font size=\"3\">Отделение\nфиников от ветвей<\/font><\/h2><p><span>2<\/span>. Запрещается отделять\nфиники от ветвей, на которых они висят.<\/p><h2 id=\"part-318\"><font size=\"3\">Отделение\nвинограда от грозди<\/font><\/h2><p><span>3<\/span>. Разрешается снимать\nвиноградины с грозди. Также разрешается\nснимать вишни с их плодоножек. См. выше,\nглаву 3, параграф 100, где объясняется,\nкак отделять плод от плодоножки, не\nнарушая запрета «Борер» (<font face=\"Tahoma\"><span>בורר<\/span><\/font>)\n— отделения одного вида от другого.<\/p><h2 id=\"part-319\"><font size=\"3\">Раскалывание\nорехов и миндаля<\/font><\/h2><p><span>4<\/span>. Разрешается раскалывать\nорехи и миндаль. Однако запрещается\nизвлекать миндаль из зелёной оболочки,\nв которой он растёт.<\/p><p>Также разрешается очищать арахис от\nскорлупы, даже если он находится в\nтвёрдой оболочке, поскольку с точки\nзрения данного закона он рассматривается\nподобно орехам.<\/p><p>См. выше, главу 3, параграф 90, где\nобъясняется, что плоды следует очищать\nот кожуры непосредственно перед трапезой,\nчтобы не нарушить запрет «Борер».<\/p><h2 id=\"part-320\"><font size=\"3\">Извлечение\nбобовых из стручков<\/font><\/h2><p><span>5<\/span>. Стручки бобовых,\nнапример гороха и тому подобного,\nзапрещено раскрывать, чтобы извлечь из\nних съедобное содержимое. Однако если\nсами стручки пригодны в пищу, разрешается\nих раскрывать.<\/p><p>Когда стручок пригоден для еды, здесь\nнет нарушения запрета на работу даш\n(обмолота), поскольку в таком случае\nчеловек извлекает пищу из пищи. А запрет\nдаш относится к извлечению пищи из\nотходов.<\/p><h2 id=\"part-321\"><font size=\"3\">Разделение\nзубчиков чеснока<\/font><\/h2><p><span>6<\/span>. Разрешается отделять\nзубчики чеснока друг от друга, снимая\nих с головки чеснока. Это не относится\nк запрету «Даш».<\/p><p>Однако делать это следует непосредственно\nперед трапезой, чтобы не нарушить запрет\n«Борер».<\/p><h2 id=\"part-322\"><font size=\"3\">Разделение\nбананов<\/font><\/h2><p><span>7<\/span>. Разрешается отделять\nбананы, соединённые друг с другом. Это\nне относится к работе «Даш». См. примечание.<\/p><h2 id=\"part-323\"><font size=\"3\">Снятие\nплодов с отломанной ветки<\/font><\/h2><p><span>8<\/span>. Если ветка была отломана\nещё до наступления субботы и на ней\nостались прикреплённые плоды, разрешается\nснимать эти плоды с ветки в субботу и\nупотреблять их в пищу.<\/p><h2 id=\"part-324\">\n<font size=\"6\">Выжимание\n\t\t\t\t\tфруктов и плодов в субботу<\/font><\/h2><p>Выжимание фруктов относится к\n\t\t\t\t\tработе «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>)\n\t\t\t\t\t— отделению содержимого от того, в\n\t\t\t\t\tчём оно находится. Эта работа является\n\t\t\t\t\tпроизводной от запрещённой в субботу\n\t\t\t\t\tработы «Даш» (<font face=\"Tahoma\"><span>דש<\/span><\/font>)\n\t\t\t\t\t— молотьбы.<\/p><p>Сходство между работами «Даш» и\n\t\t\t\t\t«Мефарек» заключается в следующем:\n\t\t\t\t\tподобно тому, как при молотьбе человек\n\t\t\t\t\tотделяет съедобную часть растения\n\t\t\t\t\tот места, где она росла, и тем самым\n\t\t\t\t\tзавершает определённый этап обработки\n\t\t\t\t\tпродукта, так и при выжимании оливок\n\t\t\t\t\tили винограда человек извлекает\n\t\t\t\t\tмасло или вино из того, где они\n\t\t\t\t\tнаходились, — из самого плода.<\/p><p>Хотя сам плод также пригоден в пищу,\n\t\t\t\t\tв данном случае нельзя применить\n\t\t\t\t\tразрешение на отделение одного\n\t\t\t\t\tпищевого продукта от другого. Причина\n\t\t\t\t\tв том, что сок, получаемый из оливок\n\t\t\t\t\tи винограда, имеет статус самостоятельного\n\t\t\t\t\tнапитка.<\/p><p>Поэтому отделение жидкости от\n\t\t\t\t\tтвёрдого пищевого продукта считается\n\t\t\t\t\tзапрещённой работой: в результате\n\t\t\t\t\tвыжимания появляется жидкость,\n\t\t\t\t\tкоторая до этого не существовала в\n\t\t\t\t\tсвободном виде. Это отличается от\n\t\t\t\t\tотделения одного пищевого продукта\n\t\t\t\t\tот другого.<\/p><p>В Гемаре (трактат Шаббат, лист 143)\n\t\t\t\t\tобъясняются три категории выжимания\n\t\t\t\t\tплодов:<\/p><p>1. Выжимание оливок и винограда<\/p><p>Выжимание оливок для получения\n\t\t\t\t\tмасла и винограда для получения вина\n\t\t\t\t\tзапрещено Торой. Причина в том, что\n\t\t\t\t\tмасло и вино имеют статус важных\n\t\t\t\t\tнапитков, а при выжимании человек\n\t\t\t\t\tотделяет жидкость от плода. Это и\n\t\t\t\t\tесть работа «Мефарек».<\/p><p>2. Выжимание ягод, гранатов и других\n\t\t\t\t\tплодов, из которых принято иногда\n\t\t\t\t\tвыжимать сок<\/p><p>Такое выжимание запрещено\n\t\t\t\t\tпостановлением мудрецов (мидерабанан),\n\t\t\t\t\tпоскольку эти плоды также принято\n\t\t\t\t\tиспользовать для получения сока.<\/p><p>3. Выжимание плодов, из которых\n\t\t\t\t\tобычно не выжимают сок<\/p><p>Выжимание таких плодов разрешено.<\/p><h2 id=\"part-325\"><font size=\"3\">Выжимание\nоливок и винограда<\/font><\/h2><p>9. Тот, кто выжимает оливки или виноград,\nнарушает запрет работы «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>),\nкоторая является производной от работы\n«Даш» (<font face=\"Tahoma\"><span>דש<\/span><\/font>).\nЭтот запрет установлен Торой.<\/p><h2 id=\"part-326\"><font size=\"3\">Выжимание\nдругих фруктов<\/font><\/h2><p>10. Если человек выжимает плоды, основное\nпредназначение которых не состоит в\nполучении сока, но из которых иногда\nпринято выжимать сок, например яблоки,\nморковь и тому подобное, это запрещено\nпостановлением мудрецов (мидерабанан).<\/p><p>11. Плоды, из которых вообще не принято\nвыжимать сок, разрешается выжимать в\nсубботу.<\/p><p>12. В наши дни многие виды фруктов иногда\nиспользуют для получения сока, поэтому\nвыжимать их в субботу запрещено\nпостановлением мудрецов.<\/p><h2 id=\"part-327\"><font size=\"3\">Выжимание\nапельсинов и грейпфрутов<\/font><\/h2><p>13. Запрещается выжимать апельсины и\nгрейпфруты. При этом остаётся вопрос,\nотносится ли данный запрет к запретам\nТоры или к постановлениям мудрецов. См.\nпримечание.<\/p><h2 id=\"part-328\"><font size=\"3\">Выжимание\nлимона<\/font><\/h2><p>14. Запрещается выжимать лимон. Что\nкасается выжимания лимона непосредственно\nв пищу, см. ниже, параграфы 16–20.<\/p><h2 id=\"part-329\"><font size=\"3\">Выжимание\nсолёных и варёных овощей<\/font><\/h2><p>15. Если солёные овощи, например солёные\nогурцы, пропитаны жидкостью и человек\nхочет их отжать, необходимо различать\nдва случая:<\/p><p>А. Если цель выжимания — использовать\nвыделившуюся жидкость, например чтобы\nобмакивать в неё хлеб, выжимать овощи\nзапрещается.<\/p><p>Б. Если цель состоит в том, чтобы съесть\nсами овощи и удалить из них избыток\nвпитавшейся жидкости, это разрешается.<\/p><h2 id=\"part-330\"><font size=\"3\">Выжимание\nжареной или варёной пищи<\/font><\/h2><p>1<span>5<\/span>. Если пища была обжарена\nили сварена и пропиталась маслом либо\nсоусом, действуют те же правила, что и\nв предыдущем параграфе:<\/p><ul>\n<li><p>Если человек выжимает пищу, чтобы\n\tиспользовать содержащееся в ней масло\n\tили соус, это запрещено.<\/p><\/li>\n<li><p>Если он делает это ради употребления\n\tсамой пищи, чтобы удалить избыток соуса\n\tили масла, это разрешается.<\/p><\/li>\n<\/ul><p>Что касается человека с повышенной\nчувствительностью к пище, который вообще\nне может есть данное блюдо без удаления\nмасла, см. выше, главу 3, параграф 41.<\/p><h2 id=\"part-331\">\n<font size=\"6\">Выжимание сока\n\t\t\t\t\tнепосредственно в пищу<\/font><\/h2><p>В Гемаре (трактат Шаббат, лист 144а)\n\t\t\t\t\tсказано: «Человек может выжать гроздь\n\t\t\t\t\tвинограда в кастрюлю, но не в чашу».<\/p><p>Речь идёт о кастрюле, в которой\n\t\t\t\t\tнаходится пища, и о чаше, то есть\n\t\t\t\t\tтарелке или ёмкости, в которой пищи\n\t\t\t\t\tнет.<\/p><p>Из этого следует, что разрешается\n\t\t\t\t\tвыжимать плоды таким образом, чтобы\n\t\t\t\t\tвыделяющийся сок сразу попадал в\n\t\t\t\t\tпищу, находящуюся в кастрюле. Однако\n\t\t\t\t\tвыжимать сок в пустую чашу запрещается,\n\t\t\t\t\tдаже если человек намеревается\n\t\t\t\t\tвпоследствии добавить этот сок в\n\t\t\t\t\tпищу.<\/p><p>Причина этого разрешения объясняется\n\t\t\t\t\tв Гемаре следующим образом: когда\n\t\t\t\t\tжидкость попадает непосредственно\n\t\t\t\t\tв пищу, она приобретает статус пищи.\n\t\t\t\t\tПоэтому такое выжимание не считается\n\t\t\t\t\tработой «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>),\n\t\t\t\t\tпоскольку суть этой работы заключается\n\t\t\t\t\tв отделении жидкости от пищи. В данном\n\t\t\t\t\tже случае жидкость, попадающая\n\t\t\t\t\tнепосредственно в пищу, рассматривается\n\t\t\t\t\tкак сама пища, и действие оказывается\n\t\t\t\t\tподобным отделению одного пищевого\n\t\t\t\t\tпродукта от другого, что не подпадает\n\t\t\t\t\tпод запрет «Мефарек».<\/p><p>Большинство законоучителей считают,\n\t\t\t\t\tчто это разрешение сохраняет силу и\n\t\t\t\t\tна практике.<\/p><p>Однако рабейну Хананэль придерживается\n\t\t\t\t\tдругого мнения. По его мнению, из\n\t\t\t\t\tокончательного обсуждения Гемары\n\t\t\t\t\tна листе 145 следует, что выжимание\n\t\t\t\t\tсока непосредственно в пищу не\n\t\t\t\t\tразрешается и считается полноценным\n\t\t\t\t\tзапрещённым действием.<\/p><p>На практике Шульхан Арух (Орах хаим,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סימן ש״כ<\/span><\/font>,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סעיף ד׳<\/span><\/font>)\n\t\t\t\t\tразрешает выжимать сок непосредственно\n\t\t\t\t\tв пищу.<\/p><p>Вместе с тем законоучители пишут,\n\t\t\t\t\tчто тот, кто проявляет строгость и\n\t\t\t\t\tвоздерживается от этого, достоин\n\t\t\t\t\tблагословения.<\/p><h2 id=\"part-332\"><font size=\"3\">Выжимание\nфруктов непосредственно в пищу<\/font><\/h2><p>16. Разрешается выжимать фрукты\nнепосредственно в пищу, если выделяющийся\nсок впитывается в неё. Однако некоторые\nзаконоучители запрещают это. Тот, кто\nпридерживается более строгого мнения,\nдостоин благословения. См. примечание,\nв котором объясняется, для каких видов\nфруктов следует соблюдать эту строгость.<\/p><p>Что касается выжимания лимона\nнепосредственно в пищу, можно придерживаться\nболее мягкого мнения и не опасаться\nстрогих подходов.<\/p><p>17. Это разрешение действует только в\nтом случае, когда весь выделившийся сок\nстановится частью пищи, например\nвпитывается в неё или равномерно\nсмешивается с ней.<\/p><p>Но если часть сока остаётся отдельно\nи не становится частью пищи, выжимание\nзапрещается.<\/p><p>Разрешается выжимать лимон непосредственно\nв овощной салат. Также разрешается\nвыжимать апельсин или лимон в пюре из\nморкови.<\/p><p>18. Разрешение выжимать фрукт\nнепосредственно в пищу действует только\nтогда, когда человек выжимает его прямо\nв саму пищу.<\/p><p>Запрещается сначала выжать сок в\nпустую ёмкость, даже если человек\nнамеревается впоследствии добавить\nего в пищу.<\/p><h2 id=\"part-333\"><font size=\"3\">Выжимание\nсока непосредственно в другую жидкость<\/font><\/h2><p>19. Разрешение выжимать фрукты в пищу\nне распространяется на выжимание\nнепосредственно в другую жидкость.<\/p><p>Причина заключается в том, что жидкость,\nпопадая в другую жидкость, сохраняет\nстатус напитка. Следовательно, человек\nотделяет жидкость от плода, что относится\nк работе «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>).<\/p><p>Поэтому запрещается выжимать лимон\nнепосредственно в чашку чая.<\/p><h2 id=\"part-334\"><font size=\"3\">Выжимание\nлимона в сахар с целью последующего\nдобавления в напиток<\/font><\/h2><p>20. Законоучители расходятся во мнениях\nотносительно того, разрешается ли\nвыжимать лимон в сахар, если человек\nнамеревается впоследствии добавить\nэтот сахар в напиток.<\/p><p>Одни законоучители разрешают это,\nдругие запрещают.<\/p><h2 id=\"part-335\">\n<font size=\"6\">Сосание фруктов<\/font><\/h2><p>Законоучители расходятся во мнениях\n\t\t\t\t\tотносительно того, запрещено ли\n\t\t\t\t\tсосать фрукты в субботу или это\n\t\t\t\t\tразрешено.<\/p><p>Причины запрета:<\/p><p>Те, кто запрещает это действие,\n\t\t\t\t\tобъясняют, что сосание плода по своей\n\t\t\t\t\tсути подобно выжиманию сока.<\/p><p>Причины разрешения:<\/p><p>Существуют два объяснения, приводимые\n\t\t\t\t\tзаконоучителями:<\/p><p>1. Некоторые законоучители пишут,\n\t\t\t\t\tчто сосание плода совершенно не\n\t\t\t\t\tпохоже на обычный способ выжимания\n\t\t\t\t\tсока. Поскольку форма выполнения\n\t\t\t\t\tработы существенно отличается от\n\t\t\t\t\tобычного способа её совершения,\n\t\t\t\t\tмудрецы не установили запрет даже\n\t\t\t\t\tна уровне постановлений мудрецов\n\t\t\t\t\t(мидерабанан).<\/p><p>2. Другие законоучители объясняют,\n\t\t\t\t\tчто сосание плода рассматривается\n\t\t\t\t\tкак употребление пищи, а не как питьё\n\t\t\t\t\tвыделившейся жидкости. Поэтому это\n\t\t\t\t\tдействие не считается отделением\n\t\t\t\t\tжидкости от пищи, то есть работой\n\t\t\t\t\t«Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>).<\/p><p>Практический закон:<\/p><p>«Мишна Брура» (<font face=\"Tahoma\"><span>משנה\n\t\t\t\t\tברורה<\/span><\/font>) пишет, что правильно\n\t\t\t\t\tпридерживаться строгого мнения в\n\t\t\t\t\tотношении оливок и винограда, выжимание\n\t\t\t\t\tкоторых запрещено Торой.<\/p><p>В отношении остальных плодов нет\n\t\t\t\t\tнеобходимости придерживаться\n\t\t\t\t\tстрогости.<\/p><p>Всё сказанное относится к случаю,\n\t\t\t\t\tкогда человек держит плод снаружи\n\t\t\t\t\tрта и сосёт его.<\/p><p>Однако если человек кладёт плод в\n\t\t\t\t\tрот, жуёт его и проглатывает выделяющийся\n\t\t\t\t\tсок, это разрешается. Даже если затем\n\t\t\t\t\tон выплёвывает мякоть плода, запрета\n\t\t\t\t\tнет, поскольку такое действие, согласно\n\t\t\t\t\tвсем мнениям, считается обычным\n\t\t\t\t\tупотреблением пищи.<\/p><h2 id=\"part-336\"><font size=\"3\">Сосание\nфруктов и употребление их в пищу<\/font><\/h2><p>21. Следует придерживаться строгого\nмнения и не сосать виноград, держа его\nв руке и высасывая сок ртом.<\/p><p>Однако разрешается положить виноград\nв рот, разжевать его, проглотить\nвыделившийся сок, а затем выплюнуть\nоставшуюся мякоть. Это разрешено,\nпоскольку такое действие считается\nупотреблением пищи, а не отделением\nжидкости от пищевого продукта, то есть\nработой «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>).<\/p><p>22. Другие фрукты, выжимание которых\nзапрещено только постановлением мудрецов\n(мидерабанан), разрешается сосать ртом\nлюбым способом.<\/p><p>Что касается сосания апельсинов и\nлимонов, см. примечание.<\/p><p>23. Разрешается сосать хлеб, размоченный\nв супе или вине.<\/p><p>24. Что касается сосания сахарного\nтростника, см. примечание.<\/p><p>25. По-видимому, запрещается сдавливать\nапельсин, не снимая кожуры, чтобы вставить\nв него соломинку и высасывать сок.<\/p><h2 id=\"part-337\">\n<font size=\"6\">Запрет на\n\t\t\t\tупотребление жидкости, самопроизвольно\n\t\t\t\tвыделившейся из плодов в субботу<\/font><\/h2><p>Как было объяснено выше, человек,\n\t\t\t\tвыжимающий плоды, нарушает запрет\n\t\t\t\tработы «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>),\n\t\t\t\tкоторая является производной от\n\t\t\t\tработы «Даш» (<font face=\"Tahoma\"><span>דש<\/span><\/font>)\n\t\t\t\t— молотьбы. Выжимание некоторых\n\t\t\t\tплодов запрещено Торой, а выжимание\n\t\t\t\tдругих — постановлением мудрецов.<\/p><p>Мудрецы установили дополнительный\n\t\t\t\tзапрет: даже если человек сам не\n\t\t\t\tвыжимал плоды, а жидкость выделилась\n\t\t\t\tиз них самостоятельно в субботу,\n\t\t\t\tзапрещается пить эту жидкость в\n\t\t\t\tсубботу.<\/p><p>Этот запрет называется «Гзера мешкин\n\t\t\t\tше-заву» (<font face=\"Tahoma\"><span>גזירת\n\t\t\t\tמשקין שזבו<\/span><\/font>) — постановление\n\t\t\t\tо жидкостях, самопроизвольно\n\t\t\t\tвыделившихся из плодов.<\/p><p>Причина постановления заключается\n\t\t\t\tв опасении, что если разрешить пить\n\t\t\t\tсок, который выделился сам по себе,\n\t\t\t\tчеловек может прийти к тому, чтобы\n\t\t\t\tнамеренно выжимать плоды руками.<\/p><p>Мудрецы разделили плоды на разные\n\t\t\t\tкатегории.<\/p><p>1. Оливки и виноград<\/p><p>Основное предназначение оливок и\n\t\t\t\tвинограда связано с получением\n\t\t\t\tжидкости из них: оливкового масла и\n\t\t\t\tвина.<\/p><p>Поэтому мудрецы запретили употреблять\n\t\t\t\tв субботу жидкость, самопроизвольно\n\t\t\t\tвыделившуюся из этих плодов, во всех\n\t\t\t\tслучаях. Это относится даже к ситуации,\n\t\t\t\tкогда человек принёс эти плоды домой\n\t\t\t\tдля употребления в пищу, а не для\n\t\t\t\tвыжимания сока.<\/p><p>2. Другие плоды<\/p><p>Существуют плоды, основное\n\t\t\t\tпредназначение которых — употребление\n\t\t\t\tв пищу, а не получение сока. Большую\n\t\t\t\tчасть таких плодов едят целиком, и\n\t\t\t\tлишь некоторые из них выжимают.<\/p><p>В отношении этих плодов мудрецы не\n\t\t\t\tустановили общего запрета на\n\t\t\t\tупотребление жидкости, выделившейся\n\t\t\t\tсамостоятельно в субботу.<\/p><p>Однако запрет действует, если человек\n\t\t\t\tпринёс такие плоды домой именно для\n\t\t\t\tвыжимания сока и заинтересован в\n\t\t\t\tжидкости, которая выделяется из них.<\/p><p>Если же он принёс плоды домой для\n\t\t\t\tупотребления в пищу, запрет на\n\t\t\t\tсамопроизвольно выделившуюся жидкость\n\t\t\t\tне распространяется на этот случай.<\/p><p>В наши дни подобная ситуация часто\n\t\t\t\tвстречается с цитрусовыми плодами,\n\t\t\t\tнапример апельсинами и грейпфрутами,\n\t\t\t\tкак будет объяснено далее.<\/p><h2 id=\"part-338\"><font size=\"3\">Жидкость,\nсамопроизвольно выделившаяся из оливок\nи винограда<\/font><\/h2><p>26. Если из оливок или винограда в\nсубботу самопроизвольно выделилась\nжидкость, запрещается пить её в субботу\nиз-за постановления мудрецов, опасавшихся,\nчто человек может прийти к намеренному\nвыжиманию плодов.<\/p><p>Кроме того, запрещается перемещать\nэту жидкость, поскольку она имеет статус\n«мукце» (<font face=\"Tahoma\"><span>מוקצה<\/span><\/font>)\n— предмета, использование и перемещение\nкоторого в субботу ограничено.<\/p><p>Этот закон действует даже в том случае,\nесли человек принёс оливки и виноград\nдомой для употребления в пищу и вовсе\nне собирался их выжимать.<\/p><h2 id=\"part-339\"><font size=\"3\">Жидкость,\nсамопроизвольно выделившаяся из других\nплодов<\/font><\/h2><p>27. Если в субботу из плодов, которые\nобычно едят, а не выжимают, самопроизвольно\nвыделилась жидкость, необходимо различать\nдва случая.<\/p><p>А. Если человек принёс эти плоды домой\nдля употребления в пищу, разрешается\nпить жидкость, выделившуюся из них\nсамостоятельно.<\/p><p>Б. Если же человек принёс плоды домой,\nчтобы выжать из них сок и выпить его,\nзапрещается пить жидкость, которая\nвыделилась самостоятельно, из-за\nпостановления мудрецов, опасавшихся,\nчто человек может намеренно выжать\nплоды руками.<\/p><h2 id=\"part-340\"><font size=\"3\">Нарезание\nапельсинов и грейпфрутов<\/font><\/h2><p>28. Если человек нарезает апельсины и\nгрейпфруты для приготовления фруктового\nсалата и в процессе приготовления в\nтарелке скапливается сок, по-видимому,\nразрешается пить этот сок. См. примечание.<\/p><h2 id=\"part-341\"><font size=\"3\">Сок,\nскопившийся на дне миски с фруктовым\nсалатом<\/font><\/h2><p>29. Если в миске с фруктовым салатом\nскопился сок на дне, по-видимому,\nразрешается его пить.<\/p><p>Также разрешается пить жидкость,\nвыделившуюся из клубники.<\/p><h2 id=\"part-342\"><font size=\"3\">Добавление\nломтика лимона в чашку чая<\/font><\/h2><p>30. Разрешается класть ломтик лимона\nв чашку чая, используя для этого третью\nёмкость, то есть не выжимая лимон\nнепосредственно в чашку.<\/p><p>Несмотря на то что из лимона выделяется\nсок, который смешивается с чаем и придаёт\nему вкус, запрет «Гзера мешкин ше-заву»\n(<font face=\"Tahoma\"><span>גזירת משקין שזבו<\/span><\/font>)\n— постановление о самопроизвольно\nвыделившейся жидкости — в данном случае\nне действует.<\/p><p>Однако запрещается сдавливать ломтик\nлимона, чтобы извлечь из него сок.<\/p><h2 id=\"part-343\"><font size=\"3\">Употребление\nгрейпфрута<\/font><\/h2><p>31. Разрешается есть разрезанный пополам\nгрейпфрут с помощью ложки, даже если в\nпроцессе еды плод выжимается. См.\nпримечание.<\/p><h2 id=\"part-344\">\n<font size=\"6\">Доение в субботу<\/font><\/h2><p>Доение в субботу запрещено Торой,\n\t\t\t\tпоскольку при доении человек отделяет\n\t\t\t\tмолоко от места его образования в\n\t\t\t\tорганизме животного. Это действие\n\t\t\t\tотносится к производной работе «Даш»\n\t\t\t\t(<font face=\"Tahoma\"><span>דש<\/span><\/font>) —\n\t\t\t\tмолотьбе, и называется «Мефарек»\n\t\t\t\t(<font face=\"Tahoma\"><span>מפרק<\/span><\/font>).<\/p><p>Молоко, полученное в субботу в\n\t\t\t\tрезультате запрещённого доения, имеет\n\t\t\t\tтот же статус, что и блюдо, приготовленное\n\t\t\t\tв субботу с нарушением запрета.\n\t\t\t\tСоответствующие законы будут\n\t\t\t\tрассмотрены в главе, посвящённой\n\t\t\t\tправилам действий, совершённых в\n\t\t\t\tсубботу с нарушением закона (маасе\n\t\t\t\tшабат — <font face=\"Tahoma\"><span>מעשה\n\t\t\t\tשבת<\/span><\/font>).<\/p><p>Однако животное испытывает сильные\n\t\t\t\tстрадания, если его не доить в течение\n\t\t\t\tцелого дня, и это также может нанести\n\t\t\t\tему вред. Поэтому мудрецы разрешили\n\t\t\t\tпросить нееврея подоить животное в\n\t\t\t\tсубботу из-за страданий животного\n\t\t\t\t(цаар баалей хаим — <font face=\"Tahoma\"><span>צער\n\t\t\t\tבעלי חיים<\/span><\/font>).<\/p><p>В ситуации, когда невозможно\n\t\t\t\tорганизовать доение с помощью нееврея,\n\t\t\t\tХазон Иш (<font face=\"Tahoma\"><span>חזון\n\t\t\t\tאיש<\/span><\/font>) в исключительных\n\t\t\t\tобстоятельствах и при крайней\n\t\t\t\tнеобходимости разрешил доение таким\n\t\t\t\tспособом, при котором молоко пропадает\n\t\t\t\tи не используется.<\/p><p>На основании этого постановления\n\t\t\t\tХазон Иша была разработана доильная\n\t\t\t\tмашина, принцип разрешения использования\n\t\t\t\tкоторой заключается в том, что первая\n\t\t\t\tпорция молока, выделяющаяся из\n\t\t\t\tживотного, уходит в отходы и не\n\t\t\t\tиспользуется.<\/p><p>Существуют различные виды доильных\n\t\t\t\tаппаратов, поэтому относительно\n\t\t\t\tпрактического применения необходимо\n\t\t\t\tпроконсультироваться с компетентным\n\t\t\t\tраввином.<\/p><h2 id=\"part-345\">Сцеживание грудного\n\t\t\t\tмолока<\/h2><p>Сцеживание грудного молока также\n\t\t\t\tотносится к работе «Мефарек» (<font face=\"Tahoma\"><span>מפרק<\/span><\/font>)\n\t\t\t\tи, следовательно, подпадает под\n\t\t\t\tсоответствующий запрет.<\/p><p>Поэтому во всех случаях, когда\n\t\t\t\tвозникает необходимость сцедить\n\t\t\t\tгрудное молоко в субботу, следует\n\t\t\t\tдействовать в соответствии с\n\t\t\t\tразрешёнными способами, которые будут\n\t\t\t\tрассмотрены далее.<\/p><h2 id=\"part-346\"><font size=\"3\">Доение\nживотного евреем и неевреем<\/font><\/h2><p>32. Доить животное в субботу запрещено\nТорой. Однако из-за страданий животного\n(цаар баалей хаим — <font face=\"Tahoma\"><span>צער\nבעלי חיים<\/span><\/font>) разрешили доить его\nс помощью нееврея.<\/p><p>При этом запрещается пить полученное\nмолоко в субботу. Поскольку пить его\nзапрещено, запрещается также перемещать\nего из-за закона о «мукце» (<font face=\"Tahoma\"><span>מוקצה<\/span><\/font>).<\/p><p>Разрешается попросить нееврея перенести\nмолоко в холодильник, поскольку в случае\nвозможного материального ущерба\nдействует послабление, называемое «швут\nде-швут» (<font face=\"Tahoma\"><span>שבות\nדשבות<\/span><\/font>), то есть сочетание двух\nзапретов, установленных мудрецами.<\/p><h2 id=\"part-347\"><font size=\"3\">Доение\nс уничтожением молока<\/font><\/h2><p>33. Если невозможно организовать доение\nс помощью нееврея, разрешается доить\nживотное только таким способом, при\nкотором молоко пропадает и не используется.<\/p><h2 id=\"part-348\"><font size=\"3\">Молоко,\nполученное в результате запрещённого\nдоения<\/font><\/h2><p>34. Молоко, полученное в результате\nзапрещённого доения, запрещается пить\nв субботу. Также запрещается перемещать\nего в субботу.<\/p><p>Если доение было совершено намеренно,\nмолоко навсегда запрещается к употреблению\nтому человеку, который намеренно нарушил\nзапрет и подоил животное.<\/p><p>Что касается молока, полученного в\nсубботу людьми, не соблюдающими законы\nТоры, с целью последующей продажи, см.\nглаву, посвящённую законам «Маасе шабат»\n(<font face=\"Tahoma\"><span>מעשה שבת<\/span><\/font>)\n— действиям, совершённым в субботу с\nнарушением запретов.<\/p><h2 id=\"part-349\"><font size=\"3\">Кормление\nгрудью и сцеживание молока<\/font><\/h2><p>35. Женщине запрещается сцеживать\nгрудное молоко в ёмкость, чтобы затем\nдать его выпить ребёнку, за исключением\nслучаев, когда существует сомнение в\nопасности для жизни (сафек пикуах нефеш\n— <font face=\"Tahoma\"><span>ספק פיקוח נפש<\/span><\/font>).<\/p><p>36. Разрешается женщине направить струю\nгрудного молока непосредственно в рот\nребёнка, чтобы побудить его начать\nсосать грудь.<\/p><p>37. Женщине, испытывающей дискомфорт\nиз-за избытка грудного молока, разрешается\nсцеживать молоко таким образом, чтобы\nоно пропадало и не использовалось.\nНапример, можно сцеживать молоко в\nёмкость, содержащую вещество, которое\nделает молоко непригодным для употребления,\nлибо непосредственно в раковину.<\/p><p>Также разрешается использовать ручной\nмолокоотсос при условии, что заранее в\nего резервуар помещено непригодное для\nупотребления и не являющееся «мукце»\nвещество, например мыльная вода.<\/p><p>38. Использование электрического\nмолокоотсоса для сцеживания грудного\nмолока разрешается только в ситуации,\nкогда существует сомнение в опасности\nдля жизни (сафек пикуах нефеш). Это\nсвязано с тем, что само включение\nэлектрического прибора предполагает\nвыполнение запрещённой работы в субботу.<\/p><p>Поэтому запрещается использовать\nэлектрический молокоотсос даже для\nсцеживания молока, которое будет\nуничтожено.<\/p><p>Даже в ситуации, когда существует\nопасность для жизни, если возможно\nиспользовать ручной молокоотсос, следует\nпредпочесть его, чтобы свести к минимуму\nколичество запрещённых работ.<\/p><h2 id=\"part-350\">\n<font size=\"6\">Дробление льда\n\t\t\t\t\tв субботу<\/font><\/h2><p>В Гемаре (трактат Шаббат, лист 51)\n\t\t\t\t\tприводится барайта:<\/p><p>«Не следует дробить снег и град в\n\t\t\t\t\tсубботу, чтобы вытекла из них вода.\n\t\t\t\t\tОднако разрешается положить их в\n\t\t\t\t\tчашку или миску, и в этом нет опасения».<\/p><p>Речь идёт о запрете намеренно\n\t\t\t\t\tдробить лёд, снег или град, чтобы\n\t\t\t\t\tпревратить их в воду.<\/p><p>Ранние законоучители (ришоним —\n\t\t\t\t\t<font face=\"Tahoma\"><span>ראשונים<\/span><\/font>)\n\t\t\t\t\tрасходятся во мнениях относительно\n\t\t\t\t\tпричины этого запрета.<\/p><h3 id=\"part-351\">Мнения законоучителей<\/h3><p>1. Мнение Раши<\/p><p>Раши объясняет, что запрет связан\n\t\t\t\t\tс тем, что человек производит воду в\n\t\t\t\t\tсубботу. Это действие подобно созданию\n\t\t\t\t\tнового вещества, поскольку вода\n\t\t\t\t\tпоявляется в результате превращения\n\t\t\t\t\tльда.<\/p><p>2. Мнение Рамбама, Рашбы и Рана<\/p><p>Рамбам (глава 21, закон 13), Рашба и\n\t\t\t\t\tРан объясняют, что этот запрет\n\t\t\t\t\tотносится к постановлению, связанному\n\t\t\t\t\tс выжиманием фруктов.<\/p><p>Подобно тому, как мудрецы запретили\n\t\t\t\t\tвыжимать плоды, предназначенные для\n\t\t\t\t\tполучения напитков, они запретили\n\t\t\t\t\tдробить лёд и превращать его в\n\t\t\t\t\tжидкость.<\/p><p>3. Мнение автора «Сефер ха-Трума»<\/p><p>В книге «Сефер ха-Трума» (симан 235)\n\t\t\t\t\tобъясняется, что запрет связан с\n\t\t\t\t\tпонятием «Нолад» (<font face=\"Tahoma\"><span>נולד<\/span><\/font>)\n\t\t\t\t\t— появлением нового объекта или\n\t\t\t\t\tсостояния, которое рассматривается\n\t\t\t\t\tкак новое образование в субботу.<\/p><p>Рамбам, Рашба и Ран понимали это\n\t\t\t\t\tмнение следующим образом: вода,\n\t\t\t\t\tобразовавшаяся при дроблении льда,\n\t\t\t\t\tсчитается «Нолад», поскольку в момент\n\t\t\t\t\tнаступления субботы в жидком виде\n\t\t\t\t\tеё ещё не было. Поэтому её употребление\n\t\t\t\t\tограничено.<\/p><p>Согласно этому объяснению, данный\n\t\t\t\t\tзапрет относится к законам «Мукце»\n\t\t\t\t\t(<font face=\"Tahoma\"><span>מוקצה<\/span><\/font>).<\/p><p>Однако перечисленные выше\n\t\t\t\t\tзаконоучители не согласились с «Сефер\n\t\t\t\t\tха-Трума» в этом вопросе. По их мнению,\n\t\t\t\t\tвода, полученная из льда, не считается\n\t\t\t\t\t«Нолад», поскольку лёд и в замёрзшем\n\t\t\t\t\tсостоянии обладает статусом жидкости.<\/p><h3 id=\"part-352\">Размягчение и растапливание\n\t\t\t\t\tзастывшего жира<\/h3><p>Автор «Сефер ха-Трума» также писал,\n\t\t\t\t\tчто, подобно тому как запрещается\n\t\t\t\t\tдробить лёд и превращать его в воду,\n\t\t\t\t\tзапрещается дробить застывший жир\n\t\t\t\t\tи превращать его в жидкий.<\/p><p>Поэтому он запрещал ставить возле\n\t\t\t\t\tогня блюдо, содержащее кусочки\n\t\t\t\t\tзастывшего жира, если жир в результате\n\t\t\t\t\tнагревания растает.<\/p><p>Многие ранние законоучители не\n\t\t\t\t\tсогласились с этим мнением. Они\n\t\t\t\t\tсчитали, что запрет касается именно\n\t\t\t\t\tнамеренного дробления льда или жира\n\t\t\t\t\tруками. Если же человек не дробит их\n\t\t\t\t\tвручную, а просто ставит рядом с\n\t\t\t\t\tогнём, и они тают сами по себе, это не\n\t\t\t\t\tзапрещается.<\/p><p>См. примечание, где подробнее\n\t\t\t\t\tобъясняется суть разногласия.<\/p><h3 id=\"part-353\">Практический закон<\/h3><p>В «Шульхан Арух» (Орах хаим, симан\n\t\t\t\t\t318, параграф 16, и симан 320, параграф 9)\n\t\t\t\t\tпостановлено не следовать мнению\n\t\t\t\t\t«Сефер ха-Трума»: разрешается ставить\n\t\t\t\t\tлёд и застывший жир возле огня, чтобы\n\t\t\t\t\tони растаяли.<\/p><p>Рамо (Орах хаим, симан 318) приводит\n\t\t\t\t\tмнение тех, кто придерживается более\n\t\t\t\t\tстрогого подхода, и заключает, что\n\t\t\t\t\tпринято соблюдать строгость.<\/p><p>Однако в случае необходимости\n\t\t\t\t\tразрешается полагаться на более\n\t\t\t\t\tмягкое мнение.<\/p><h2 id=\"part-354\"><font size=\"3\">Дробление\nльда и снега<\/font><\/h2><p>39. Запрещается дробить лёд и снег,\nпревращая их в воду.<\/p><h2 id=\"part-355\"><font size=\"3\">Добавление\nкубиков льда в воду<\/font><\/h2><p>40. Разрешается класть кубики льда в\nводу или другой напиток. Это не относится\nк запрету дробления льда, поскольку лёд\nтает самостоятельно, без намеренного\nдробления.<\/p><h2 id=\"part-356\"><font size=\"3\">Дробление\nи перемешивание льда в жидкости<\/font><\/h2><p>41. Законоучители расходятся во мнениях\nотносительно того, распространяется\nли запрет дробления льда и превращения\nего в воду также на случай, когда лёд\nнаходится внутри другой жидкости.<\/p><p>Многие законоучители разрешают это,\nоднако некоторые запрещают.<\/p><p>Поэтому желательно изначально\nпридерживаться строгого мнения и\nизбегать подобных действий.<\/p><h2 id=\"part-357\"><font size=\"3\">Размещение\nзамороженного напитка возле огня<\/font><\/h2><p>42. Если человек хочет ускорить\nразмораживание ёмкости с замороженным\nнапитком, следует придерживаться\nстрогого мнения и не ставить её\nнепосредственно возле огня, даже если\nнапиток не может нагреться до температуры,\nпри которой он будет приготовлен.<\/p><p>Причина заключается в опасении, что\nразмещение предмета в месте, куда доходит\nтепло огня, может рассматриваться\nнекоторыми законоучителями как намеренное\nдробление льда руками.<\/p><p>Однако в случае необходимости можно\nпридерживаться более мягкого мнения и\nпоставить напиток возле огня, чтобы он\nоттаял.<\/p><p>При этом необходимо соблюдать следующее\nусловие: нельзя ставить напиток в такое\nместо, где он может нагреться до\nтемпературы, при которой пища считается\nгорячей в соответствии с галахой (яд\nсоледет бо — <font face=\"Tahoma\"><span>יד\nסולדת בו<\/span><\/font>), если оставить его там\nна всю субботу.<\/p><p>Такое размещение запрещено даже в том\nслучае, если человек намеревается убрать\nнапиток от огня до того, как он достигнет\nэтой температуры. См. главу 1, параграф\n11.<\/p><p>Если же человек уже поставил замороженный\nнапиток возле огня, и напиток оттаял,\nразрешается его пить.<\/p><h2 id=\"part-358\">\n<font size=\"6\">Лёд, растаявший\n\t\t\t\t\tсамостоятельно<\/font><\/h2><p>Во введении к законам о дроблении\n\t\t\t\t\tльда мы уже приводили мнения ранних\n\t\t\t\t\tзаконоучителей (ришоним — <font face=\"Tahoma\"><span>ראשונים<\/span><\/font>)\n\t\t\t\t\tотносительно причины запрета. Также\n\t\t\t\t\tв примечании 64 рассматривалось\n\t\t\t\t\tразногласие ранних и поздних\n\t\t\t\t\tзаконоучителей относительно понимания\n\t\t\t\t\tслов автора «Сефер ха-Трума».<\/p><p>Теперь рассмотрим вопрос: разрешается\n\t\t\t\t\tли пить лёд или замороженный напиток,\n\t\t\t\t\tкоторые самостоятельно растаяли и\n\t\t\t\t\tпревратились в воду, если получившаяся\n\t\t\t\t\tжидкость не смешалась с другим\n\t\t\t\t\tнапитком?<\/p><p>Ответ зависит от упомянутых выше\n\t\t\t\t\tмнений.<\/p><p>1. Согласно мнению Раши, а также\n\t\t\t\t\tРамбана и Рашбы, запрет касается\n\t\t\t\t\tнамеренного дробления льда. Поэтому\n\t\t\t\t\tнет сомнения, что разрешается пить\n\t\t\t\t\tнапиток, образовавшийся в результате\n\t\t\t\t\tсамостоятельного таяния льда.<\/p><p>2. Согласно мнению автора «Сефер\n\t\t\t\t\tха-Трума», который запрещает это\n\t\t\t\t\tиз-за понятия «Нолад» (<font face=\"Tahoma\"><span>נולד<\/span><\/font>)\n\t\t\t\t\t— возникновения нового состояния\n\t\t\t\t\tили объекта, — вопрос зависит от\n\t\t\t\t\tтого, как понимать его слова. Рамо\n\t\t\t\t\tпостановил учитывать это мнение, как\n\t\t\t\t\tбыло объяснено выше.<\/p><p>Если принять объяснение Рамбана и\n\t\t\t\t\tдругих законоучителей, согласно\n\t\t\t\t\tкоторому «Сефер ха-Трума» считает\n\t\t\t\t\tобразовавшуюся воду новым объектом,\n\t\t\t\t\tупотребление такого напитка\n\t\t\t\t\tзапрещается.<\/p><p>Однако согласно другим объяснениям\n\t\t\t\t\tслов «Сефер ха-Трума» нет оснований\n\t\t\t\t\tзапрещать напиток, образовавшийся\n\t\t\t\t\tиз самостоятельно растаявшего льда,\n\t\t\t\t\tпоскольку человек не совершал\n\t\t\t\t\tзапрещённого действия.<\/p><p>Как уже упоминалось, в случае\n\t\t\t\t\tнеобходимости даже Рамо разрешает\n\t\t\t\t\tне учитывать строгое мнение «Сефер\n\t\t\t\t\tха-Трума».<\/p><p>Кроме того, «Мишна Брура» (симан\n\t\t\t\t\t318, пункт 107) приводит мнение\n\t\t\t\t\tзаконоучителей, согласно которому,\n\t\t\t\t\tесли человек уже растопил жир или\n\t\t\t\t\tдругой замороженный напиток,\n\t\t\t\t\tполучившуюся жидкость разрешается\n\t\t\t\t\tупотреблять постфактум (бедиавад —\n\t\t\t\t\t<font face=\"Tahoma\"><span>בדיעבד<\/span><\/font>).\n\t\t\t\t\tВ отношении уже растаявшей жидкости\n\t\t\t\t\tзаконоучители проявили снисходительность\n\t\t\t\t\tдаже тогда, когда размораживание не\n\t\t\t\t\tбыло необходимо.<\/p><p>Подробнее об отдельных практических\n\t\t\t\t\tслучаях будет рассказано далее.<\/p><h2 id=\"part-359\"><font size=\"3\">Кубики\nльда, растаявшие самостоятельно<\/font><\/h2><p>43. Если человек положил кубики льда в\nпустую миску, и они растаяли самостоятельно,\nпревратившись в воду, разрешается пить\nэту воду. Однако некоторые законоучители\nпишут, что желательно воздержаться от\nеё употребления, если в этом нет\nнеобходимости.<\/p><h2 id=\"part-360\"><font size=\"3\">Размораживание\nзамороженных напитков<\/font><\/h2><p>44. Если в этом есть необходимость для\nсубботней трапезы, разрешается достать\nиз морозильника замороженный сок,\nзамороженный компот и тому подобные\nпродукты и оставить их при комнатной\nтемпературе, чтобы они оттаяли и\nпревратились в жидкость.<\/p><p>Если напиток нужен в размороженном\nвиде в течение короткого времени,\nразрешается ускорить размораживание\nодним из следующих способов:<\/p><ul>\n<li><p>Поставить замороженный напиток\n\tрядом с огнём в такое место, где он не\n\tсможет нагреться до температуры «яд\n\tсоледет бо» (<font face=\"Tahoma\"><span>יד\n\tסולדת בו<\/span><\/font>) — температуры, при\n\tкоторой рука рефлекторно отдёргивается\n\tот горячего.<\/p><\/li>\n<li><p>Поместить замороженный напиток во\n\tвторой сосуд с горячей водой (кли шени\n\t— <font face=\"Tahoma\"><span>כלי שני<\/span><\/font>),\n\tпри условии, что вода не покроет ёмкость\n\tс напитком полностью.<\/p><\/li>\n<\/ul><h2 id=\"part-361\"><font size=\"3\">Размораживание\nзамороженного молока<\/font><\/h2><p>45. Если это необходимо для субботы,\nразрешается достать пакет замороженного\nмолока из морозильника и оставить его\nпри комнатной температуре, чтобы оно\nоттаяло.<\/p><p>Если молоко нужно в размороженном\nвиде в течение короткого времени,\nразрешается ускорить размораживание\nспособами, описанными в предыдущем\nпараграфе.<\/p><h2 id=\"part-362\"><font size=\"3\">Рыбный\nсоус, который оттаял<\/font><\/h2><p>46. Если человек достал из холодильника\nзастывший рыбный соус и тот самостоятельно\nоттаял, разрешается употреблять его в\nпищу.<\/p><p>При необходимости разрешается подогреть\nрыбу вместе с соусом в таком месте, где\nони не смогут нагреться до температуры\n«яд соледет бо».<\/p><h2 id=\"part-363\"><font size=\"3\">Подогрев\nкурицы или мяса<\/font><\/h2><p>47. Если человек хочет подогреть в\nсубботу кусочки курицы или мяса,\nнеобходимо различать два случая.<\/p><p>А. Если в посуде находится большое\nколичество застывшего жира или соуса,\nне следует подогревать их, поскольку\nжир или соус растают, а это может\nрассматриваться как запрещённое\nобразование жидкости (молид — <font face=\"Tahoma\"><span>מוליד<\/span><\/font>).<\/p><p>В случае необходимости разрешается\nэто сделать.<\/p><p>Если же в посуде находится незастывший\nсоус, запрещается подогревать его в\nсубботу на другой кастрюле, если он\nможет нагреться до температуры «яд\nсоледет бо», поскольку это связано с\nзапретом варки (бишуль — <font face=\"Tahoma\"><span>בישול<\/span><\/font>).<\/p><p>Б. Если в посуде находятся только\nкусочки курицы или мяса, без жира и\nсоуса, разрешается их подогревать, даже\nесли при нагревании небольшое количество\nжира, содержащегося внутри мяса или на\nего поверхности, растает и стечёт в\nпосуду.<\/p><p>Поэтому тому, кто хочет подогреть\nкурицу или мясо утром в субботу,\nрекомендуется заранее, до наступления\nсубботы, подготовить посуду с кусочками\nмяса без соуса.<\/p><p>Однако запрещается удалять застывший\nсоус с кусочков мяса непосредственно\nв субботу из-за запрета «Борер» (<font face=\"Tahoma\"><span>בורר<\/span><\/font>)\n— отделения одного вида от другого.<\/p><h2 id=\"part-364\"><font size=\"3\">Растаявшее\nмороженое<\/font><\/h2><p>48. Разрешается есть мороженое, которое\nрастаяло.<\/p><h2 id=\"part-365\"><font size=\"3\">Растворение\nсахара, растворимого кофе и других\nпорошков<\/font><\/h2><p>49. Разрешается класть сахар, растворимый\nкофе и другие растворимые порошки в\nводу и перемешивать их, чтобы они\nрастворились. Это не относится к запрету\n«Молид» (<font face=\"Tahoma\"><span>מוליד<\/span><\/font>)\n— образования нового состояния вещества.<\/p><p>Также разрешается наливать горячую\nводу на сахар, растворимый кофе и подобные\nпродукты, если при этом не возникает\nзапрета варки. См. примечание.<\/p><h2 id=\"part-366\"><font size=\"3\">Добавление\nмёда в чашку чая<\/font><\/h2><p>50. Если человек хочет добавить ложку\nмёда в чашку чая или другой напиток, и\nмёд застыл, желательно не размешивать\nего ложкой, поскольку это напоминает\nдробление льда в стакане с водой.<\/p><p>Что касается добавления застывшего\nмёда в чашку чая без размешивания ложкой,\nпо-видимому, это разрешается. См.\nпримечание.<\/p><p>Относительно опасения нарушения\nзапрета варки при добавлении мёда в\nчашку чая см. выше, главу 1, параграф 48.<\/p><h2 id=\"part-367\"><font size=\"3\">Размораживание\nзамороженного супа в праздник<\/font><\/h2><p>51. При необходимости разрешается в\nпраздничный день (Йом-Тов — <font face=\"Tahoma\"><span>יום\nטוב<\/span><\/font>) достать замороженный суп\nиз морозильника, поставить его на огонь,\nразморозить и сварить.<\/p><p>Поскольку это делается для нужд самого\nпраздничного дня, такой способ разрешается.\nСм. примечание.<\/p><p>\n<font size=\"6\"><b>Замораживание\n\t\t\t\t\tводы и других жидкостей<\/b><\/font><\/p><p>В предыдущих пунктах рассматривался\n\t\t\t\t\tвопрос о дроблении льда и превращении\n\t\t\t\t\tего в воду. Мы привели различные\n\t\t\t\t\tобъяснения ранних авторитетов\n\t\t\t\t\t(ришоним) относительно запрета на\n\t\t\t\t\tэто действие.<\/p><p>Позднейшие авторитеты (ахароним)\n\t\t\t\t\tобсуждали, распространяется ли этот\n\t\t\t\t\tзапрет и на обратный процесс: подобно\n\t\t\t\t\tтому как запрещено дробить лёд и\n\t\t\t\t\tпревращать его в воду, запрещено ли\n\t\t\t\t\tпомещать воду в морозильную камеру\n\t\t\t\t\tи превращать её в лёд.<\/p><p>Согласно мнению тех ришоним, которые\n\t\t\t\t\tобъясняли запрет на дробление льда\n\t\t\t\t\tтем, что это напоминает выжимание\n\t\t\t\t\tплодов, предназначенных для получения\n\t\t\t\t\tсока, нет оснований запрещать\n\t\t\t\t\tпревращение воды в лёд.<\/p><p>По мнению же тех, кто считает, что\n\t\t\t\t\tзапрет связан с созданием воды\n\t\t\t\t\t(молид), которое выглядит как совершение\n\t\t\t\t\tзапрещённой работы, представляется,\n\t\t\t\t\tчто запрет относится именно к случаю,\n\t\t\t\t\tкогда человек собственными руками\n\t\t\t\t\tдробит лёд. Это напоминает выполнение\n\t\t\t\t\tработы. Однако когда человек помещает\n\t\t\t\t\tводу в морозильную камеру, а лёд\n\t\t\t\t\tобразуется сам по себе, ситуация\n\t\t\t\t\tиная.<\/p><p>Даже согласно мнению Сефер а-Трума\n\t\t\t\t\t(<font face=\"Tahoma\"><span>סה״ת<\/span><\/font>),\n\t\t\t\t\tкоторый рассматривал помещение льда\n\t\t\t\t\tна огонь как действие, подобное\n\t\t\t\t\tдроблению льда, в нашем случае\n\t\t\t\t\tположение более мягкое: огонь — это\n\t\t\t\t\tявно действующая сила, которая\n\t\t\t\t\tнагревает и растапливает лёд, тогда\n\t\t\t\t\tкак холод в морозильной камере не\n\t\t\t\t\tоказывает столь заметного воздействия,\n\t\t\t\t\tсопоставимого с непосредственным\n\t\t\t\t\tдействием дробления.<\/p><p>Кроме того, возможно, что запрет\n\t\t\t\t\tотносится именно к превращению льда\n\t\t\t\t\tв воду, но не к превращению воды в\n\t\t\t\t\tлёд.<\/p><p>Позднейшие авторитеты также\n\t\t\t\t\tобсуждали вопрос с точки зрения\n\t\t\t\t\tмнения, согласно которому Сефер\n\t\t\t\t\tа-Трума запрещал это действие из-за\n\t\t\t\t\tпринципа нолад — возникновения\n\t\t\t\t\tнового состояния или предмета в\n\t\t\t\t\tШаббат: распространяется ли понятие\n\t\t\t\t\tнолад на лёд, образовавшийся из воды?<\/p><p>Некоторые из позднейших авторитетов\n\t\t\t\t\tзапретили это, а другие разрешили.<\/p><p><span>52. <\/span>Есть и такие авторитеты,\nкоторые разрешают замораживать воду и\nдругие жидкости в Шаббат и в Йом-Тов,\nесли они понадобятся в тот же день.<\/p><h3 id=\"part-368\"><font size=\"3\">Дробление\nльда и снега без намерения<\/font><\/h3><p>53. Разрешается ходить по снегу, и не\nнужно опасаться того, что снег при этом\nдробится и превращается в воду.<\/p><p>54. Ранние авторитеты обсуждали,\nразрешается ли мочиться на снег или\nследует запретить это, поскольку таким\nобразом снег тает и превращается в воду.\nНекоторые разрешали это без каких-либо\nсомнений, другие же опасались нарушения\nзапретов.<\/p><p>На практике позднейшие авторитеты\nпостановили, что в этом вопросе можно\nпроявить снисхождение, если только\nэтого нельзя избежать без особых усилий.<\/p><p>55. Разрешается разбивать лёд, чтобы\nполучить доступ к воде под ним. Не нужно\nопасаться того, что в результате\nразбивания льда из него вытекает вода.<\/p><p><font size=\"3\"><b>Рассыпание\nсоли на льду с целью растопить его.<\/b><\/font><\/p><ol start=\"56\">\n<li><p>Разрешается рассыпать соль на льду\n\tв Шаббат, чтобы растопить его, если это\n\tделается для предотвращения скольжения\n\tлюдей.<\/p><\/li>\n<li><p><\/p><\/li>\n<\/ol>"}, {"title": "Мелаха тохен — измельчение", "body": "<h1 id=\"part-370\"> <font size=\"6\">Мелаха\n\t\t\t\t\tтохен — измельчение<\/font><\/h1><p>Суть мелахи тохен состоит в том,\n\t\t\t\t\tчтобы взять единый предмет и разделить\n\t\t\t\t\tего на мелкие части. Поэтому тот, кто\n\t\t\t\t\tизмельчает зёрна или растирает\n\t\t\t\t\tспеции, совершает одну из основных\n\t\t\t\t\tмелахот и обязан принести хатат.<\/p><p>Мелаха тохен относится также к\n\t\t\t\t\tпредметам, не являющимся пищей.\n\t\t\t\t\tНапример, тот, кто измельчает металл\n\t\t\t\t\tили древесину, чтобы использовать\n\t\t\t\t\tполученные опилки, совершает эту\n\t\t\t\t\tмелаху.<\/p><p>Этот запрет действует независимо\n\t\t\t\t\tот того, измельчает ли человек с\n\t\t\t\t\tпомощью инструмента, например мельницы\n\t\t\t\t\tили ступки, либо руками, вилкой и тому\n\t\t\t\t\tподобными предметами. То же относится\n\t\t\t\t\tк измельчению во рту посредством\n\t\t\t\t\tпережёвывания.<\/p><p>Существуют случаи, в которых\n\t\t\t\t\tизмельчение разрешено. Подробности\n\t\t\t\t\tэтих законов будут разъяснены далее.<\/p><h2 id=\"part-371\">Измельчение продуктов\n\t\t\t\t\tпитания<\/h2><p>В Гемаре, Шаббат 74б, сказано: «Тот,\n\t\t\t\t\tкто мелко нарезает сальку, обязан\n\t\t\t\t\tкак за тохен». Раши объясняет, что\n\t\t\t\t\tречь идёт о нарезании овоща, называемого\n\t\t\t\t\tсалькой, на мелкие кусочки.<\/p><p>Из этого следует, что запрет тохен\n\t\t\t\t\tраспространяется также на нарезание\n\t\t\t\t\tовощей.<\/p><p>По этому вопросу существует спор\n\t\t\t\t\tсреди ранних законоучителей —\n\t\t\t\t\tришоним. Некоторые из них считают,\n\t\t\t\t\tчто если овощ пригоден для употребления\n\t\t\t\t\tв сыром виде, то запрещено не нарезать\n\t\t\t\t\tего на мелкие кусочки, поскольку\n\t\t\t\t\tтакое действие не считается достаточно\n\t\t\t\t\tзначимой работой. Согласно этому\n\t\t\t\t\tмнению, запрет измельчения при\n\t\t\t\t\tнарезании сальки относится лишь к\n\t\t\t\t\tслучаю, когда овощ непригоден для\n\t\t\t\t\tупотребления в сыром виде и человек\n\t\t\t\t\tнарезает его для последующего\n\t\t\t\t\tприготовления.<\/p><p>Другие же считают, что запрет тохен\n\t\t\t\t\tраспространяется и на овощи и фрукты,\n\t\t\t\t\tкоторые пригодны для употребления\n\t\t\t\t\tв пищу без приготовления.<\/p><p>На практике поским придерживаются\n\t\t\t\t\tмнения, что запрет тохен действует\n\t\t\t\t\tдаже в отношении фруктов и овощей,\n\t\t\t\t\tпригодных для еды. Поэтому нельзя\n\t\t\t\t\tнарезать овощи или фрукты на мелкие\n\t\t\t\t\tкусочки, кроме случаев, которые будут\n\t\t\t\t\tразъяснены далее.<\/p><p>Следует знать, что, согласно мнению\n\t\t\t\t\tРашбы, разрешено мелко нарезать овощи\n\t\t\t\t\tнепосредственно перед едой, подобно\n\t\t\t\t\tтому как в отношении мелахи борер\n\t\t\t\t\tразрешено отделять пищу от отходов\n\t\t\t\t\tнепосредственно перед употреблением.<\/p><p>Причина этого в том, что, когда\n\t\t\t\t\tчеловек нарезает овощи непосредственно\n\t\t\t\t\tперед едой, такое нарезание не\n\t\t\t\t\tсчитается полноценной мелахой тохен,\n\t\t\t\t\tа рассматривается как обычное\n\t\t\t\t\tдействие, связанное с приёмом пищи.\n\t\t\t\t\tТора не запрещает человеку есть свою\n\t\t\t\t\tпищу в виде мелких кусочков.<\/p><p>Что касается практического\n\t\t\t\t\tпостановления закона в этом вопросе,\n\t\t\t\t\tсм. подробности далее.<\/p><p>Кроме того, в Гемаре и у поским\n\t\t\t\t\tразъясняется, что в определённых\n\t\t\t\t\tслучаях разрешено измельчать овощи\n\t\t\t\t\tили специи, изменив обычный способ\n\t\t\t\t\tизмельчения. Это будет рассмотрено\n\t\t\t\t\tдалее.<\/p><p><font face=\"Times New Roman, serif\"><font size=\"5\">Также\n\t\t\t\t\tследует знать, что упомянутый спор\n\t\t\t\t\tмежду ришоним о том, действует ли\n\t\t\t\t\tзапрет тохен в отношении продуктов\n\t\t\t\t\tпитания, не касается растирания\n\t\t\t\t\tспеций. В отношении специй все\n\t\t\t\t\tсогласны, что действует запрет тохен,\n\t\t\t\t\tпоскольку до измельчения специи не\n\t\t\t\t\tвполне пригодны для использования.<\/font><\/font><\/p><h2 id=\"part-372\">Нарезание фруктов и овощей<\/h2><p>1. Нельзя нарезать фрукты и овощи на\nмелкие кусочки. Тот, кто делает это,\nнарушает запрет мелахи тохен.<\/p><p><font size=\"3\"><b>Размер кусочков,\nпри котором действует запрет тохен<\/b><\/font><\/p><p>2. Поским не установили точного размера\nкусочков, начиная с которого нарезание\nсчитается тохен. Однако очевидно, что\nразрешено нарезать фрукт или овощ на\nкрупные куски, и в этом вообще нет запрета\nтохен.<\/p><p><font size=\"3\"><b>Нарезание\nломтиками или полосками<\/b><\/font><\/p><p>3. Разрешено нарезать овощ ломтиками,\nи в этом нет запрета тохен. Что касается\nприспособления, предназначенного для\nнарезания ломтиками, см. примечание.<\/p><p>4. Нельзя нарезать овощ тонкими полосками\nиз-за запрета тохен. Поэтому запрещено\nнарезать морковь, капусту и тому подобные\nовощи тонкими полосками, например для\nсалата из моркови.<\/p><p><font size=\"3\"><b>Нарезание\nфруктов и овощей непосредственно перед\nедой<\/b><\/font><\/p><p>5. Поским разрешили нарезать фрукты и\nовощи на мелкие кусочки, если это делается\nнепосредственно перед трапезой. Однако\nпоследние законоучители писали, что\nдаже при нарезании непосредственно\nперед трапезой желательно остерегаться\nнарезать совсем маленькие кусочки, а\nделать их несколько крупнее.<\/p><p><font size=\"3\"><b>Нарезание\nнепосредственно перед едой с помощью\nспециального приспособления для\nизмельчения<\/b><\/font><\/p><p>6. Разрешение нарезать овощи\nнепосредственно перед трапезой относится\nтолько к нарезанию ножом. Однако запрещено\nпользоваться приспособлением, специально\nпредназначенным для измельчения,\nнапример тёркой и тому подобными\nинструментами. См. объяснение причины\nв примечании.<\/p><p><font size=\"3\"><b>Насколько\nблизко к еде должно происходить нарезание<\/b><\/font><\/p><p>7. Разрешение нарезать непосредственно\nперед едой не означает, что человек\nобязан нарезать и сразу же съесть. Однако\nпоским не установили точного временного\nпромежутка, который считается\n«непосредственно перед едой». По-видимому,\nречь идёт о времени, которое люди обычно\nтратят на подготовку к ближайшей трапезе.\nСм. Примечание.<\/p><p><font size=\"3\"><b>Измельчение и\nразминание фруктов и овощей непосредственно\nперед едой<\/b><\/font><\/p><p>8. Выше, в <font face=\"Tahoma\"><span>סעיף <\/span><\/font>5,\nбыло разъяснено, что разрешено нарезать\nфрукты и овощи на мелкие кусочки, если\nэто делается непосредственно перед\nтрапезой. Однако Хазон Иш писал, что это\nразрешение относится только к нарезанию\nна мелкие кусочки, но не к разминанию\nили растиранию овоща: это запрещено\nдаже непосредственно перед трапезой.<\/p><p>См. далее <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>18, где разъясняется, что при\nизменении обычного способа действия\nразрешено разминать овощи.<\/p><p>Мнение ряда поским состоит в том, что\nнет необходимости проводить такое\nразличие: подобно тому как разрешили\nнарезать непосредственно перед трапезой,\nтак же разрешили и разминать непосредственно\nперед трапезой.<\/p><p>См. <font face=\"Tahoma\"><span>סעיף <\/span><\/font>5\nи примечание 17, где приводятся мнения\nтех, кто оспаривает само основное\nразрешение нарезать непосредственно\nперед трапезой.<\/p><h2 id=\"part-373\">\n<font size=\"6\">Измельчение\n\t\t\t\t\tприготовленных продуктов<\/font><\/h2><p>Рамбам пишет в «Законах Шаббата»,\n\t\t\t\t\tглава 21, галаха 13:<\/p><p>«Разрешено завершить разминание\n\t\t\t\t\tразваренных круп деревянной ложкой\n\t\t\t\t\tв кастрюле в Шаббат, после того как\n\t\t\t\t\tеё сняли с огня».<\/p><p>Речь идёт о следующем случае: до\n\t\t\t\t\tШаббата готовили блюдо, состоящее\n\t\t\t\t\tиз крупы и мяса, и оно оставалось на\n\t\t\t\t\tогне в течение Шаббата. Когда хотели\n\t\t\t\t\tесть это блюдо, кастрюлю снимали с\n\t\t\t\t\tогня и тщательно разминали содержимое\n\t\t\t\t\tложкой, пока мясо и крупа не размягчались,\n\t\t\t\t\tхорошо не смешивались и не превращались\n\t\t\t\t\tв единую массу.<\/p><p>Из этих слов Рамбама следует новое\n\t\t\t\t\tправило: такое действие не подпадает\n\t\t\t\t\tпод запрет тохен.<\/p><p>Рамбам объясняет там, что причина\n\t\t\t\t\tзаключается в том, что крупу уже\n\t\t\t\t\tизмельчили до наступления Шаббата,\n\t\t\t\t\tа также сварили. Варка дополнительно\n\t\t\t\t\tразмягчила её, поэтому теперь на неё\n\t\t\t\t\tбольше не распространяется запрет\n\t\t\t\t\tтохен.<\/p><p>Поским вывели отсюда, что разрешено\n\t\t\t\t\tразминать фрукты и овощи, которые\n\t\t\t\t\tбыли сварены и хорошо размягчились.<\/p><p>Следует знать, что всё это относится\n\t\t\t\t\tтолько к случаю, когда фрукт размягчился\n\t\t\t\t\tв результате человеческого действия,\n\t\t\t\t\tнапример вследствие варки. Однако\n\t\t\t\t\tфрукт, размягчившийся естественным\n\t\t\t\t\tобразом, например авокадо или банан,\n\t\t\t\t\tразминать запрещено.<\/p><p>Продолжить перевод следующего <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\t<\/span><\/font>или разобрать практические\n\t\t\t\t\tпримеры применения этого правила?<\/p><h2 id=\"part-374\"><font size=\"3\">Измельчение\nфруктов, хорошо размягчившихся при\nварке<\/font><\/h2><p>9. Фрукт, который был сварен или запечён\nи хорошо размягчился в результате\nприготовления, разрешено разминать, и\nв этом нет запрета тохен.<\/p><p>Причина в том, что размягчение,\nпроизошедшее вследствие приготовления,\nпридаёт фрукту статус продукта, части\nкоторого уже как бы отделились друг от\nдруга. Поэтому разрешено разминать\nкартофель и бобовые, которые были сварены\nи хорошо размягчились. Это разрешено\nделать даже вилкой.<\/p><p>Однако нельзя использовать для\nразминания специальное приспособление,\nпредназначенное для этой цели, поскольку\nэто считается увдин де-холь — действием,\nхарактерным для будничных дней. См.\nпримечание 20.<\/p><p><font size=\"3\"><b>Намазывание\nваренья<\/b><\/font><\/p><p>10. Разрешено намазывать на ломтик\nхлеба варенье, содержащее фрукты, которые\nхорошо размягчились при приготовлении.<\/p><h2 id=\"part-375\"><font size=\"3\">Измельчение\nпродуктов, которые не разделяются на\nотдельные кусочки<\/font><\/h2><p>11. Запрет тохен распространяется также\nна разминание банана, авокадо и тому\nподобных продуктов, даже если они не\nразделяются на отдельные кусочки, а\nпревращаются в однородную массу.<\/p><h3 id=\"part-376\"><font size=\"3\">Разминание\nавокадо и банана и намазывание их на\nхлеб<\/font><\/h3><p>12. Фрукт, который не подвергался\nприготовлению, запрещено разминать,\nдаже если он очень мягкий. Поэтому\nзапрещено разминать авокадо или банан,\nдаже если они хорошо размягчились\nестественным образом. См. примечание.<\/p><p>13. Поэтому запрещено намазывать авокадо\nна ломтик халлы, поскольку разминание,\nпроисходящее при намазывании, считается\nизмельчением. Что касается измельчения\nфруктов непосредственно перед едой,\nсм. выше <font face=\"Tahoma\"><span>סעיף <\/span><\/font>8.<\/p><h2 id=\"part-377\">\n<font size=\"6\">Измельчение\n\t\t\t\t\tпродуктов, не являющихся плодами\n\t\t\t\t\tземли<\/font><\/h2><p>Выше, во введении к законам мелахи\n\t\t\t\t\tтохен, было разъяснено, что среди\n\t\t\t\t\tришоним существует спор о том,\n\t\t\t\t\tраспространяется ли запрет тохен на\n\t\t\t\t\tпродукты питания. На практике поским\n\t\t\t\t\tпостановили придерживаться строгого\n\t\t\t\t\tмнения.<\/p><p>Однако в книге Трумат а-Дешен, симан\n\t\t\t\t\t56, написано, что в отношении продуктов,\n\t\t\t\t\tне являющихся плодами земли, например\n\t\t\t\t\tмяса, по-видимому, можно облегчить\n\t\t\t\t\tсогласно всем мнениям. Причина в том,\n\t\t\t\t\tчто здесь добавляется ещё одно\n\t\t\t\t\tоснование для разрешения: возможно,\n\t\t\t\t\tмелаха тохен вообще относится только\n\t\t\t\t\tк продуктам, выросшим из земли.<\/p><p>Подобное мы находим и в отношении\n\t\t\t\t\tмелахи меамэр (собирание урожая в\n\t\t\t\t\tснопы): она запрещена только\n\t\t\t\t\tприменительно к продуктам, выросшим\n\t\t\t\t\tиз земли.<\/p><p>14. Разрешено нарезать продукты, не\nявляющиеся плодами земли, например\nварёное или жареное мясо, яйцо или\nтвёрдый сыр, на мелкие кусочки, и в этом\nнет запрета тохен.<\/p><p>15. Это разрешение на измельчение\nпродуктов, не являющихся плодами земли,\nне распространяется на использование\nспециального приспособления для\nизмельчения, например тёрки.<\/p><h2 id=\"part-378\">\n<font size=\"6\">Измельчение с\n\t\t\t\tизменением обычного способа действия<\/font><\/h2><p>Мы находим два случая, в которых\n\t\t\t\tразрешено измельчение с изменением\n\t\t\t\tобычного способа действия.<\/p><p>1. В Гемаре, Шаббат 141а, разъясняется,\n\t\t\t\tчто разрешили измельчать перец\n\t\t\t\tрукояткой ножа. Рамбам и Шульхан Арух\n\t\t\t\tдобавляют ещё одно условие: измельчать\n\t\t\t\tследует не в ступке, а в миске.<\/p><p>2. В Тосефте, Бейца, глава 1, приведённой\n\t\t\t\tв Шульхан Арух, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t<\/span><\/font>321, сказано: «Не разминают\n\t\t\t\tфиниковую массу, сушёный инжир и плоды\n\t\t\t\tрожкового дерева перед старцами в\n\t\t\t\tШаббат, однако разрешено разминать\n\t\t\t\tих рукояткой ножа или деревянной\n\t\t\t\tложкой, и не нужно опасаться запрета».<\/p><p>В этих законах есть новшество: в\n\t\t\t\tотношении мелахот Шаббата обычно не\n\t\t\t\tвстречается разрешение совершать\n\t\t\t\tзапрещённое действие с изменением\n\t\t\t\tобычного способа. Даже если человек\n\t\t\t\tвыполняет мелаху необычным способом,\n\t\t\t\tэто, как правило, остаётся запрещённым\n\t\t\t\tпостановлением мудрецов. Однако в\n\t\t\t\tэтих случаях мудрецы разрешили\n\t\t\t\tизмельчение при изменении обычного\n\t\t\t\tспособа действия.<\/p><p>16. Запрещено измельчать специи в\nШаббат. Тот, кто измельчает специи с\nпомощью специального приспособления,\nпредназначенного для этой цели, нарушает\nзапрет Торы.<\/p><p>17. Однако если человек измельчает\nспеции не с помощью специального\nприспособления, а рукояткой ножа на\nтарелке или на столе, это разрешено.<\/p><p>18. Хотя выше было разъяснено, что\nразминать фрукты запрещено из-за мелахи\nтохен, тем не менее, если человек делает\nэто изменённым способом, например\nразминает рукояткой ножа или ложкой,\nэто разрешено.<\/p><p>Однако разминание банана или авокадо\nзубцами вилки не считается изменением\nобычного способа действия, поэтому это\nзапрещено.<\/p><h2 id=\"part-379\">\n<font size=\"6\">Нет измельчения\n\t\t\t\t\tпосле измельчения — «Эйн тохен ахар\n\t\t\t\t\tтохен»<\/font><\/h2><p>Некоторые из ришоним писали, что\n\t\t\t\t\tразрешено крошить хлеб. Причина\n\t\t\t\t\tзаключается в принципе «эйн тохен\n\t\t\t\t\tахар тохен» — «нет измельчения после\n\t\t\t\t\tизмельчения».<\/p><p>То есть, поскольку зёрна уже прошли\n\t\t\t\t\tизмельчение, когда из них сделали\n\t\t\t\t\tмуку, повторное измельчение не\n\t\t\t\t\tзапрещается, даже если затем мука\n\t\t\t\t\tснова соединилась и превратилась в\n\t\t\t\t\tхлеб.<\/p><p>Так и постановлено в Рама.<\/p><p>Однако последние поским писали,\n\t\t\t\t\tчто если результат первоначального\n\t\t\t\t\tизмельчения полностью утратил свою\n\t\t\t\t\tпрежнюю форму и следы измельчения\n\t\t\t\t\tбольше никак не различимы, то повторное\n\t\t\t\t\tизмельчение может быть запрещено.\n\t\t\t\t\tНапример, металл измельчили в крошку,\n\t\t\t\t\tзатем снова расплавили и сформировали\n\t\t\t\t\tиз него цельный кусок.<\/p><p>Следовательно, во всех случаях,\n\t\t\t\t\tкогда хотят разрешить измельчение\n\t\t\t\t\tна основании принципа «эйн тохен\n\t\t\t\t\tахар тохен», необходимо выяснить,\n\t\t\t\t\tсохранился ли результат первоначального\n\t\t\t\t\tизмельчения или он полностью исчез.<\/p><p><font size=\"3\"><b>Крошение выпечки<\/b><\/font><\/p><p>19. Разрешается крошить хлеб, пирог,\nбисквит и тому подобное на мелкие крошки.\nВ этом нет опасения нарушения мелахи\nтохен, поскольку действует принцип «эйн\nтохен ахар тохен» — нет измельчения\nпосле измельчения. Однако нельзя делать\nэто с помощью специального приспособления\nдля измельчения, например тёрки и тому\nподобного.<\/p><p><font size=\"3\"><b>Крошение кубиков\nсахара или соли<\/b><\/font><\/p><p>20. Разрешается крошить кубик сахара.\nТакже разрешается измельчать сахар или\nсоль, слипшиеся из-за влаги в один комок.\nВсё это разрешено только для того, чтобы\nвернуть их в прежнее состояние гранул.\nНо запрещается измельчать сахар,\nпревращая его в сахарную пудру.<\/p><p><font size=\"3\"><b>Измельчение\nшоколада<\/b><\/font><\/p><p>21. По-видимому, запрещается измельчать\nшоколад на мелкие крошки остриём ножа.\nРазумеется, нельзя делать это с помощью\nтёрки. Однако, по-видимому, разрешается\nизмельчать шоколад необычным способом\n— разминая его ложкой или рукояткой\nножа.<\/p><p><font size=\"3\"><b>Измельчение\nтаблетки<\/b><\/font><\/p><p>22. Разрешается измельчать таблетку в\nпорошок, и в этом нет нарушения мелахи\nтохен. Причина в том, что таблетка\nизготовлена из порошка, который был\nспрессован, а принцип «эйн тохен ахар\nтохен» означает, что нет измельчения\nпосле измельчения. Если на таблетке\nвыгравированы буквы, см. ниже, главу 15,\nпараграф 22 и примечание 36.<\/p><p><font size=\"3\"><b>Раздробление\nкомьев земли<\/b><\/font><\/p><p>23. Запрещается дробить комья земли.\nТот, кто делает это, нарушает мелаху\nтохен.<\/p><p><font size=\"3\"><b>Удаление земли\nс обуви и одежды<\/b><\/font><\/p><p>24. Запрещается удалять сухую грязь\nили засохшую глину с одежды либо обуви,\nпоскольку их удаление связано с\nизмельчением земли. Однако в случае,\nкогда это необходимо ради сохранения\nчеловеческого достоинства, разрешается\nудалить их, попросив об этом нееврея.<\/p>"}, {"title": "Мелаха Лиша (замешивание)", "body": "<h1 id=\"part-381\"><font size=\"6\">Мелаха\n\t\t\t\tЛиша (замешивание)<\/font><\/h1><p>Суть мелахи лишá заключается в\n\t\t\t\tдобавлении воды в муку и её замешивании\n\t\t\t\tв тесто. То же относится и к другим\n\t\t\t\tспособам, когда жидкость смешивают\n\t\t\t\tс отдельными частицами вещества,\n\t\t\t\tсоединяя их и собирая в единую массу:\n\t\t\t\tэто также входит в данную мелаху.<\/p><p>Запрет лишá распространяется и на\n\t\t\t\tвещества, которые не являются пищевыми\n\t\t\t\tпродуктами, например на глину, цемент\n\t\t\t\tи тому подобное. Ведь при строительстве\n\t\t\t\tМишкана замешивание выполнялось с\n\t\t\t\tкрасящими веществами, как разъясняет\n\t\t\t\tРаши в трактате Шаббат, лист 73,\n\t\t\t\tкомментарий <font face=\"Tahoma\"><span>ד״ה\n\t\t\t\tהאופה<\/span><\/font>.<\/p><p>Следует знать, что в мелахе лишá\n\t\t\t\tнеобходимо различать два этапа:<\/p><ol>\n<li><p>Добавление воды в муку.<\/p><\/li>\n<li><p>Смешивание и замешивание воды с\n\t\t\t\t\tмукой.<\/p><\/li>\n<\/ol><p>В Гемаре, трактат Шаббат, лист 18,\n\t\t\t\tприводится барайта: «Если один\n\t\t\t\tдобавляет воду, а другой насыпает\n\t\t\t\tмуку, последний несёт ответственность»,\n\t\t\t\t— таково мнение раби. Раби Йоси, сын\n\t\t\t\tраби Йеуды, говорит: «Ответственность\n\t\t\t\tнаступает лишь тогда, когда замешивают».<\/p><p>Иными словами, раби считает, что\n\t\t\t\tсамо добавление воды в муку уже\n\t\t\t\tявляется нарушением запрета лишá на\n\t\t\t\tуровне Торы, даже если тесто ещё не\n\t\t\t\tзамешивали, поскольку вода впитывается\n\t\t\t\tв муку и начинает образовываться\n\t\t\t\tтесто.<\/p><p>Раби Йоси, сын раби Йеуды, полагает,\n\t\t\t\tчто запрет лишá на уровне Торы возникает\n\t\t\t\tлишь тогда, когда тесто замешивают.\n\t\t\t\tСамо же добавление воды в муку не\n\t\t\t\tзапрещено Торой, однако, согласно его\n\t\t\t\tмнению, оно всё равно запрещено\n\t\t\t\tпостановлением мудрецов.<\/p><p>В Гемаре, трактат Шаббат, лист 155,\n\t\t\t\tразъясняется, что из этого разногласия\n\t\t\t\tраби и раби Йоси, сына раби Йеуды,\n\t\t\t\tотносительно того, запрещено ли\n\t\t\t\tдобавление воды в муку Торой или\n\t\t\t\tпостановлением мудрецов, вытекают\n\t\t\t\tнесколько практических различий. В\n\t\t\t\tнекоторых случаях, по мнению раби\n\t\t\t\tЙоси, сына раби Йеуды, добав
