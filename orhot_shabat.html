/strong> Если человек в Шаббат\nсовершил атману горячего блюда материалом,\n<strong>не добавляющим тепло<\/strong>, например\nснял в Шаббат кастрюлю с огня и укутал\nеё тканью, <strong>постфактум нет необходимости\nзапрещать блюдо<\/strong>.<\/p><p>Причина в том, что такая атмана не\nдобавляет блюду тепла, а лишь предотвращает\nего остывание, поэтому блюдо остаётся\nпримерно в том же состоянии тепла, в\nкотором находилось первоначально.<\/p><p>См. примечание.<\/p>"}, {"title": "Мелехет борер и зоре", "body": "<h2 id=\"part-205\"><font size=\"7\">Мелехет\n\t\t\t\t\tборер и зоре<\/font><\/h2><p>Мелехет <strong>борер<\/strong> — одна из\n\t\t\t\t\tтридцати девяти основных категорий\n\t\t\t\t\tработ (<strong>39 мелахот<\/strong>), перечисленных\n\t\t\t\t\tв Мишне, Шаббат, лист 73, в рамках общего\n\t\t\t\t\tпорядка работ по приготовлению хлеба\n\t\t\t\t\t— <strong>сидура де-пата<\/strong>.<\/p><p>Суть этой работы заключается в\n\t\t\t\t\tследующем: после выполнения мелехет\n\t\t\t\t\t<strong>диша<\/strong> и <strong>зоре<\/strong> зёрна\n\t\t\t\t\tзлаков находились на гумне, и со\n\t\t\t\t\tвременем к ним примешивались земля\n\t\t\t\t\tи камешки. Когда приходило время\n\t\t\t\t\tмолоть зёрна, из них отделяли землю\n\t\t\t\t\tи камешки.<\/p><p>Существуют ещё две работы, входящие\n\t\t\t\t\tв число 39 основных мелахот, запрет\n\t\t\t\t\tкоторых связан с отделением отходов\n\t\t\t\t\tиз смеси.<\/p><p>Первая — <strong>мелехет зоре<\/strong>,\n\t\t\t\t\tкоторая выполняется на более раннем\n\t\t\t\t\tэтапе, когда зёрна ещё перемешаны с\n\t\t\t\t\tмякиной и колосьями. После выполнения\n\t\t\t\t\tмелехет <strong>диша<\/strong>, которая\n\t\t\t\t\tотделяет зёрна от окружающей их\n\t\t\t\t\tмякины, зёрна подбрасывают в воздух.\n\t\t\t\t\tВетер уносит мякину на расстояние,\n\t\t\t\t\tа зёрна падают на землю уже очищенными\n\t\t\t\t\tот примешанной к ним мякины.<\/p><p>Вторая — <strong>мелехет меркакед<\/strong>,\n\t\t\t\t\tкоторая выполняется на более позднем\n\t\t\t\t\tэтапе, после помола зерна: муку\n\t\t\t\t\tпомещают в сито и просеивают её, чтобы\n\t\t\t\t\tудалить отруби.<\/p><p>Как было разъяснено в Гемаре и у\n\t\t\t\t\tпоским, мелехет борер существует не\n\t\t\t\t\tтолько в этих трёх перечисленных\n\t\t\t\t\tслучаях. То же самое относится к\n\t\t\t\t\tлюбому способу, которым человек\n\t\t\t\t\tотделяет и разделяет пищу и перемешанные\n\t\t\t\t\tс ней отходы: это запрещено <font face=\"Tahoma\"><span>מן\n\t\t\t\t\tהתורה<\/span><\/font>.<\/p><p>Также было разъяснено в трактате\n\t\t\t\t\tШаббат, лист 74, что мелехет борер\n\t\t\t\t\tзапрещена даже в отношении предметов,\n\t\t\t\t\tкоторые не являются пищей. Например,\n\t\t\t\t\tесли человек измельчил комья земли\n\t\t\t\t\tи хочет замесить глину, а затем\n\t\t\t\t\tотделяет из земли комья, которые\n\t\t\t\t\tнедостаточно хорошо измельчены, он\n\t\t\t\t\tнарушает запрет борер.<\/p><p>Подобным образом, если человек\n\t\t\t\t\tсобрал прутья, чтобы изготовить из\n\t\t\t\t\tних какой-либо предмет, и отделяет\n\t\t\t\t\tхорошие прутья от плохих, он обязан\n\t\t\t\t\tпринести жертву за нарушение мелехет\n\t\t\t\t\tборер.<\/p><p>Кроме того, в Гемаре, Шаббат, лист\n\t\t\t\t\t74, разъясняется, что даже когда нет\n\t\t\t\t\tсмеси пищи и отходов, а имеется смесь\n\t\t\t\t\tдвух видов пищи, запрещено <font face=\"Tahoma\"><span>מן\n\t\t\t\t\tהתורה <\/span><\/font>отделять один вид от\n\t\t\t\t\tдругого.<\/p><h3 id=\"part-206\"><font size=\"5\">Условия\n\t\t\t\t\tразрешения в мелехет борер<\/font><\/h3><p>Хотя уже было разъяснено, что\n\t\t\t\t\tзапрещено отделять пищу от отходов,\n\t\t\t\t\tтем не менее в определённых случаях\n\t\t\t\t\tэто разрешено. А именно, при соблюдении\n\t\t\t\t\tтрёх условий:<\/p><p><strong>а)<\/strong> отделять пищу от отходов,\n\t\t\t\t\tа не отходы от пищи;<br/>\n<strong>б)<\/strong>\n\t\t\t\t\tотделять рукой, а не с помощью\n\t\t\t\t\tкакого-либо инструмента;<br/>\n<strong>в)<\/strong>\n\t\t\t\t\tотделять для немедленного употребления,\n\t\t\t\t\tа не для употребления спустя некоторое\n\t\t\t\t\tвремя.<\/p><p>При сочетании всех этих трёх условий\n\t\t\t\t\tразрешено выполнять борер. Но если\n\t\t\t\t\tотсутствует хотя бы одно из трёх\n\t\t\t\t\tусловий, в этом имеется запрет борер\n\t\t\t\t\t<font face=\"Tahoma\"><span>מן התורה<\/span><\/font>.<\/p><p>Причина разрешения в таком случае\n\t\t\t\t\tзаключается в том, что действие\n\t\t\t\t\tизвлечения пищи из смеси тогда не\n\t\t\t\t\tсчитается способом отделения (бриры),\n\t\t\t\t\tа считается способом еды.<\/p><p>См. примечание <font face=\"Tahoma\"><span>א<\/span><\/font>.<\/p><p><font face=\"Times New Roman, serif\"><font size=\"4\">Подробные\n\t\t\t\t\tзаконы, относящиеся к этим трём\n\t\t\t\t\tусловиям, с Божьей помощью будут\n\t\t\t\t\tразъяснены далее.<\/font><\/font><\/p><h3 id=\"part-207\">Отделение в смеси пищи и\nотходов<\/h3><p><strong>1.<\/strong> Если пища и отходы перемешаны\nмежду собой, запрещено извлекать отходы\nиз пищи в любом случае, даже если человек\nне использует никакого инструмента и\nдаже если его намерение — съесть пищу\nнемедленно, поскольку извлечение отходов\nиз пищи является способом выполнения\nмелехет борер.<\/p><p><strong>2.<\/strong> Если человек хочет отделить\nпищу от отходов, разрешение существует\nтолько при выполнении двух условий:<\/p><p><strong>а)<\/strong> он должен отделять руками\nи не использовать какой-либо инструмент;<br/>\n<strong>б)<\/strong>\nон должен отделять пищу с намерением\nсъесть её немедленно.<\/p><p>Когда выполняются вышеуказанные\nусловия, то есть человек отделяет пищу\nот отходов рукой, чтобы съесть её\nнемедленно, это разрешено, поскольку\nдействие отделения получает статус\nобычного способа еды, и в нём нет\nзначимости запрещённой работы.<\/p><p><strong>3.<\/strong> Поэтому косточку лимона,\nнаходящуюся в салате, запрещено вынимать,\nпоскольку это является отделением\nотходов из пищи. Однако разрешено\nотделить пищу в стороны или переложить\nеё в другую посуду рукой или ложкой²\nтаким образом, чтобы косточка осталась\nотдельно. В таком случае получается,\nчто человек отделяет пищу от отходов.\nЭто разрешено только в том случае, если\nего намерение — съесть салат немедленно.<\/p><p>Подобным образом, если в плоде\nобнаружился червяк, запрещено удалять\nего из плода. Однако разрешено взять\nмякоть плода и съесть её, оставив червяка\nна его месте.<\/p><p><strong>4.<\/strong> Условие, согласно которому\nнеобходимо съесть пищу немедленно, не\nозначает, что нужно начать есть сразу\nпосле завершения отделения. Любое\nотделение пищи незадолго до трапезы\nсчитается отделением для немедленного\nупотребления и разрешено.<\/p><p>См. подробности законов ниже, <font face=\"Tahoma\"><span>סעיף\nמ<\/span><\/font>\"<font face=\"Tahoma\"><span>ח<\/span><\/font>.<\/p><h3 id=\"part-208\">Отделение двух видов пищи<\/h3><p><strong>5.<\/strong> Если два вида пищи перемешаны\nмежду собой, запрещено отделять один\nот другого. И хотя здесь нет смеси отходов\nи пищи, поскольку оба вида пригодны для\nеды, тем не менее отделение одного от\nдругого является запретом <font face=\"Tahoma\"><span>מן\nהתורה<\/span><\/font>. См. объяснение причины в\nпримечании.<\/p><p><strong>6.<\/strong> Поэтому отделять два вида\nпищи друг от друга разрешено только при\nсоблюдении всех трёх условий разрешения\nборер, которые были приведены выше в\n<font face=\"Tahoma\"><span>סעיף כ<\/span><\/font>':\nнеобходимо отделять тот вид, который\nчеловек хочет съесть, с намерением\nсъесть его немедленно, и делать это\nрукой, а не инструментом. Таким образом,\nэто подобно отделению пищи от отходов\nрукой для немедленного употребления.<\/p><p><strong>7.<\/strong> Однако запрещено извлекать\nтот вид, который человек не хочет есть\nнемедленно, поскольку это подобно\nотделению отходов от пищи.<\/p><p><strong>8.<\/strong> Также запрещено отделять\nдва вида друг от друга, если человек не\nнамерен съесть их немедленно, даже если\nон отделяет их рукой.<\/p><p><strong>9.<\/strong> Также запрещено отделять\nдва вида друг от друга с помощью\nинструмента, даже если человек намерен\nсъесть оба вида немедленно.<\/p><p><strong>10.<\/strong> Разрешено отделить два\nвида пищи друг от друга с намерением\nсъесть оба вида немедленно, каждый\nотдельно, если сделать это рукой, а не\nинструментом, поскольку в таком случае\nсоблюдаются все три условия разрешения\nборер.<\/p><h3 id=\"part-209\">Сортировка игрушек<\/h3><p><strong>11.<\/strong> Игрушки, на которых имеются\nразличные изображения или цвета и\nкоторые обычно после игры сортируют,\nпомещая каждую форму на своё место,\nзапрещено сортировать в Шаббат, поскольку\nэто не делается непосредственно перед\nиспользованием. Однако разрешено\nсортировать их, если человек хочет\nиспользовать их немедленно.<\/p><p><strong>12.<\/strong> Если дети играли с различными\nвидами игрушек, и они лежат на полу\nвперемешку, нельзя сортировать их и\nкласть каждую игрушку на предназначенное\nдля неё место. Если же игрушки лежат\nтаким образом, что это не считается\nсмесью, это разрешено. См. ниже <font face=\"Tahoma\"><span>סעיפים\nט<\/span><\/font>\"<font face=\"Tahoma\"><span>ו–י<\/span><\/font>\"<font face=\"Tahoma\"><span>א<\/span><\/font>,\nгде будет разъяснено, в каком случае\nпредметы считаются перемешанными между\nсобой.<\/p><h3 id=\"part-210\">Сортировка фотографий и\nлистов<\/h3><p><strong>13.<\/strong> Нельзя сортировать\nфотографии в Шаббат. Также нельзя\nсортировать разбросанные листы и\nраскладывать их по темам или в надлежащем\nпорядке, кроме случая, когда человек\nсобирается использовать их немедленно.<\/p><h3 id=\"part-211\">Отделение вида, который\nчеловеку не нужен, чтобы передать его\nдругому<\/h3><p><strong>14.<\/strong> Если перед человеком\nнаходятся два вида пищи, перемешанные\nмежду собой, и он не хочет есть один из\nних, разрешено извлечь его из смеси и\nпередать своему товарищу, который хочет\nего съесть. Поскольку он передаёт его\nтоварищу с намерением, чтобы тот его\nсъел, это рассматривается как обычный\nспособ еды, подобно отделению пищи от\nотходов, которое разрешено, когда человек\nделает это рукой с намерением съесть\nнемедленно.<\/p><h3 id=\"part-212\">Отделение вида, который\nчеловек не хочет есть сейчас, но хочет\nсъесть в той же трапезе<\/h3><p><strong>15.<\/strong> Если перед человеком\nнаходятся два вида пищи, перемешанные\nмежду собой, и он хочет отделить их друг\nот друга, чтобы один из них съесть сразу,\nа второй — после первого, например суп,\nсмешанный с овощами, и он хочет съесть\nсначала сам суп отдельно, а затем овощи,\nи он хочет отделить их друг от друга,\nмнения по этому вопросу разделились.<\/p><p>Некоторые считают, что запрещено\nизвлекать тот вид, который человек не\nхочет съесть сразу, даже если он намерен\nсъесть его в той же трапезе после того,\nкак съест первый вид.<\/p><p>Другие разрешают отделять любой из\nдвух видов, который человек пожелает.<\/p><h3 id=\"part-213\">\n<font size=\"5\">Мелехет борер\n\t\t\t\tсуществует только при наличии смеси<\/font><\/h3><p>Общее правило заключается в том,\n\t\t\t\tчто мелехет борер существует только\n\t\t\t\tтогда, когда пища и отходы или различные\n\t\t\t\tвиды пищи перемешаны между собой.\n\t\t\t\tКогда человек отделяет их друг от\n\t\t\t\tдруга, это является <strong>мелехет\n\t\t\t\tмахшевет<\/strong> (осмысленной,\n\t\t\t\tцеленаправленной работой), и тем самым\n\t\t\t\tон исправляет пищу.<\/p><p>Однако если пища и отходы вообще не\n\t\t\t\tперемешаны, а находятся на некотором\n\t\t\t\tрасстоянии друг от друга, здесь нет\n\t\t\t\tмелехет борер.<\/p><p>Трудно установить точную границу\n\t\t\t\tтого, что считается «перемешанным»,\n\t\t\t\tа что считается «находящимся отдельно\n\t\t\t\tдруг от друга», и всё определяется по\n\t\t\t\tвосприятию глаза.<\/p><p>Иногда различные предметы отличаются\n\t\t\t\tдруг от друга своей формой или размером,\n\t\t\t\tи это различие приводит к тому, что\n\t\t\t\tони не считаются перемешанными, даже\n\t\t\t\tесли расстояние между ними не настолько\n\t\t\t\tвелико.<\/p><p>См. формулировку <strong>Трумат а-Дешен<\/strong>,\n\t\t\t\tприведённую в примечании.<\/p><h3 id=\"part-214\">Поднос, на котором находятся\nдва вида пищи<\/h3><p><strong>16.<\/strong> Если на подносе находятся\nкусочки рыбы двух видов или часть из\nних варёные, а часть жареные, которые\nсчитаются двумя разными видами, и они\nперемешаны между собой, так что каждый\nвид не разложен отдельно, нельзя отделять\nодин вид от другого иначе, как в\nсоответствии с правилами разрешения,\nприведёнными выше. То есть следует взять\nтолько тот вид, который человек намерен\nсъесть немедленно. И хотя разные виды\nпищи различимы между собой, тем не менее\nпоским опасались в этом запрета борер,\nпоскольку они лежат в виде смеси.<\/p><h3 id=\"part-215\">Тарелка, на которой лежит\nнесколько видов пищи<\/h3><p><strong>17.<\/strong> Если на тарелке лежит\nнесколько видов пищи, каждый из которых\nрасположен отдельно, например мясо,\nхамин и овощи, следует выяснить, имеет\nли это статус смеси, подобно кусочкам\nрыбы, упомянутым в <font face=\"Tahoma\"><span>סעיף\nט<\/span><\/font>\"<font face=\"Tahoma\"><span>ז<\/span><\/font>,\nили поскольку виды пищи не перемешаны\nмежду собой, а каждый вид находится\nотдельно, это не считается смесью.<\/p><h3 id=\"part-216\">Стол, на котором находятся\nразличные предметы<\/h3><p><strong>18.<\/strong> Если на столе находятся\nтарелки, стаканы, столовые приборы,\nбутылки и тому подобное, разрешено\nубирать с него каждый вид предметов\nотдельно, и это вообще не рассматривается\nкак смесь.<\/p><h3 id=\"part-217\">Сортировка стопки тарелок<\/h3><p><strong>19.<\/strong> Если имеется стопка тарелок\nнескольких видов, например плоские и\nглубокие, большие и маленькие, нельзя\nотделять одни от других и складывать\nих в отдельные стопки, кроме случая,\nкогда человек намерен использовать их\nнемедленно. В таком случае соблюдаются\nправила разрешения мелехет борер.       \n                   То же относится к столовым\nприборам, перемешанным между собой. См.\nниже <font face=\"Tahoma\"><span>סעיפים\nקכ<\/span><\/font>\"<font face=\"Tahoma\"><span>א–קכ<\/span><\/font>\"<font face=\"Tahoma\"><span>ב<\/span><\/font>.<\/p><h3 id=\"part-218\">Вилка или ложка, перемешанные\nс остатками пищи<\/h3><p><strong>20.<\/strong> Если на тарелке находятся\nостатки пищи и рядом с ними лежат столовые\nприборы, как это обычно бывает в конце\nтрапезы, столовые приборы не считаются\nперемешанными с остатками пищи, и\nразрешено убрать их, даже если человек\nне собирается использовать их немедленно.<\/p><p>Однако если на тарелке скопилось\nбольшое количество отходов, среди\nкоторых в отходах находится вилка или\nложка, следует соблюдать строгость и\nсчитать это смесью. Нельзя отделять\nстоловые приборы от отходов, кроме\nслучая, когда человек будет использовать\nих немедленно.<\/p><p>То же самое относится к случаю, когда\nстоловый прибор упал в мусорное ведро\nи оказался перемешанным и полностью\nпокрытым отходами: нельзя извлекать\nего, кроме случая, когда человек будет\nиспользовать его немедленно.<\/p><h3 id=\"part-219\">Полка холодильника, на которой\nнаходятся продукты<\/h3><p><strong>21.<\/strong> Если в холодильнике на\nполках стоят кастрюли и другие ёмкости\nрядом друг с другом, по-видимому, они не\nсчитаются перемешанными, и нет запрета\nотделять их друг от друга.<\/p><p>Однако если там в беспорядке лежат\nпохожие друг на друга предметы, например\nразные виды сыров или различные виды\nмолочных продуктов и тому подобное,\nздесь существует запрет борер, как было\nсказано выше в <font face=\"Tahoma\"><span>סעיף\nט<\/span><\/font>\"<font face=\"Tahoma\"><span>ז<\/span><\/font>.<\/p><p>Тем более это относится к продуктам,\nлежащим друг на друге в стопке, например\nв ящике для овощей в холодильнике.<\/p><h3 id=\"part-220\">Морозильная камера, в которой\nнаходятся различные продукты<\/h3><p><strong>22.<\/strong> Часто бывает, что в\nморозильной камере продукты складываются\nбез порядка и перемешиваются между\nсобой. Поэтому необходимо следить за\nтем, чтобы не извлекать предметы из этой\nсмеси иначе, как в соответствии с\nправилами разрешения мелехет борер.\nСм. примечание.<\/p><h3 id=\"part-221\">Книги, стоящие в шкафу<\/h3><p><strong>23.<\/strong> Книги, стоящие в шкафу и\nотличающиеся друг от друга, не считаются\nсмесью. Поэтому в таком случае разрешено\nвынуть книгу из шкафа, даже если человек\nне намерен использовать её немедленно.<\/p><p>Однако если книги не отличаются друг\nот друга, например название книги не\nнаписано снаружи и сам владелец также\nне может их различить, следует опасаться,\nчто это считается смесью. Поэтому нельзя\nв таком случае вынимать книгу из шкафа\nиначе, как в соответствии с правилами\nразрешения мелехет борер.<\/p><p>Если необходимо вынуть книгу из шкафа\nв ночь Шаббата для использования на\nследующий день, существует такой способ:\nможно открыть вынутую книгу и немного\nпоучиться по ней. В таком случае это\nсчитается отделением пищи от отходов\nдля немедленного использования, и это\nразрешено, хотя основное намерение\nчеловека — использовать книгу на\nследующий день.<\/p><h3 id=\"part-222\"><font size=\"2\">Книги,\nсложенные стопкой на столе<\/font><\/h3><p><strong><font size=\"2\">24.<\/font><\/strong><font size=\"2\">\nКниги, лежащие стопкой на столе,\nрассматриваются как смесь, даже если\nони отличаются друг от друга. Поэтому\nнельзя сортировать их или вынимать\nкнигу из стопки иначе, как в соответствии\nс правилами разрешения мелехет борер.<\/font><\/p><h3 id=\"part-223\">\n<font size=\"5\">Отделение\n\t\t\t\t\tтвёрдого предмета из жидкости<\/font><\/h3><p>Выше было разъяснено, что запрет\n\t\t\t\t\tборер существует только тогда, когда\n\t\t\t\t\tразличные виды перемешаны между\n\t\t\t\t\tсобой. Поэтому поским писали, что\n\t\t\t\t\tяйцо, находящееся в воде, разрешено\n\t\t\t\t\tвынуть, поскольку оно не считается\n\t\t\t\t\tперемешанным с водой.<\/p><p>То же самое относится и к нескольким\n\t\t\t\t\tяйцам, находящимся в воде: они не\n\t\t\t\t\tсчитаются перемешанными с водой,\n\t\t\t\t\tпоскольку яйца крупные и хорошо\n\t\t\t\t\tразличимы сами по себе.<\/p><p>Однако в случае более мелких кусочков\n\t\t\t\t\tвопрос требует решения отдельно в\n\t\t\t\t\tкаждом конкретном случае. Ниже будут\n\t\t\t\t\tприведены несколько примеров.<\/p><h3 id=\"part-224\">Яйца, находящиеся в воде<\/h3><p><strong>25.<\/strong> Яйца, находящиеся в воде,\nне считаются перемешанными с водой, и\nразрешено слить воду; это не рассматривается\nкак отделение отходов от пищи¹.<\/p><p>Также маринованные огурцы, находящиеся\nв консервной банке, не считаются смесью\nс водой, находящейся в банке.<\/p><h3 id=\"part-225\">Оливки, находящиеся в жидкости<\/h3><p><strong>26.<\/strong> Если оливки находятся в\nжидкости и оливок много, следует опасаться\nи считать их перемешанными с жидкостью.\nПоэтому нельзя сливать жидкость из этой\nсмеси. Также нельзя извлекать оливки\nиз смеси ложкой с отверстиями, как будет\nразъяснено ниже, в разделе <strong>74<\/strong>.\nТем более нельзя использовать для этого\nспециальное ситечко.<\/p><p>Однако отдельные оливки, находящиеся\nв жидкости, не считаются смесью, и\nразрешено извлекать их даже с помощью\nинструмента и даже без намерения съесть\nих немедленно.<\/p><p>См. ниже, в разделе <strong>84<\/strong>, закон\nо кувшине, в котором находятся напиток\nи кубики льда.<\/p><h3 id=\"part-226\">Консервная банка, содержащая\nсмесь пищи и жидкости<\/h3><p><strong>27.<\/strong> Также следует опасаться\nзапрета борер в смеси гороха, моркови,\nкукурузы, сардин и тому подобного,\nнаходящихся вместе с жидкостью. Поэтому\nнельзя сливать из них жидкость, поскольку\nэто считается отделением отходов от\nпищи.<\/p><h3 id=\"part-227\">Стакан лебена, в котором\nперемешана вода<\/h3><p><strong>28.<\/strong> Если в стакане лебена\n(кисломолочного продукта) сверху имеется\nслой воды, запрещено выливать эту воду,\nесли она перемешана с верхним слоем\nлебена.<\/p><p>Однако если лебен твёрдый, а его\nповерхность сверху ровная и гладкая,\nразрешено вылить воду, которая находится\nсверху на нём.<\/p><h3 id=\"part-228\">Муха, упавшая в жидкость<\/h3><p><strong>29.<\/strong> Если муха упала в жидкость,\nнельзя извлекать её отдельно из-за\nопасения нарушения борер. Следует\nизвлечь её с помощью ложки вместе с\nнебольшим количеством жидкости².<\/p><p>Если в жидкость упало несколько мух\n— см. примечание.<\/p><h3 id=\"part-229\">Кастрюля супа, в которой\nимеется смесь продуктов<\/h3><p><strong>30.<\/strong> Если в кастрюле находится\nсуп с кусочками курицы и овощами,\nнеобходимо различать два случая:<\/p><p><strong>а.<\/strong> Верхний слой, в котором\nнаходится только суп без кусочков, не\nсчитается смесью, и разрешено слить\nсуп³.<\/p><p><strong>б.<\/strong> На дне кастрюли суп считается\nперемешанным с кусочками мяса и овощей.\nПоэтому нельзя отделять суп от кусочков\nиначе, как в соответствии с правилами\nразрешения мелехет борер.<\/p><p>Если человек намерен в этой трапезе\nсъесть только суп, а курицу и овощи — в\nдругой трапезе, ему следует взять только\nтот суп, который он намерен съесть\nнемедленно, и не использовать инструмент\nдля этого отделения.<\/p><p>См. ниже, в разделе <strong>85<\/strong>, где\nбудет разъяснено, что разрешено брать\nнужный ему суп половником, и это не\nопределяется как отделение с помощью\nинструмента.<\/p><p>Если же он намерен съесть курицу и\nовощи в этой трапезе в более позднее\nвремя — см. выше, раздел <strong>15<\/strong>.<\/p><h3 id=\"part-230\">Кусочки рыбы или курицы,\nнаходящиеся в соусе<\/h3><p><strong>31.<\/strong> Если кусочки рыбы или\nкурицы находятся в соусе, и человек\nхочет вынуть их из соуса не для того,\nчтобы съесть их немедленно, вопрос\nзависит от того, считаются ли они\nперемешанными с соусом или же они сами\nпо себе хорошо различимы.<\/p><p>Поэтому, если кусочков много и они\nнаходятся близко друг к другу, а между\nними имеется соус, это считается смесью.\nЗапрещено извлекать кусочки из соуса\nиначе, как в соответствии с правилами\nразрешения мелехет борер, разъяснёнными\nвыше.<\/p><p>Если же кусочки находятся отдельно\nдруг от друга, а соус прозрачный, они не\nсчитаются перемешанными со всем соусом.\nОднако они считаются перемешанными с\nсоусом, находящимся непосредственно\nна них и между их углублениями.<\/p><p>Поэтому разрешено извлечь их из соуса\nбольшой ложкой таким образом, чтобы\nсоус, соприкасающийся с кусочками,\nподнялся вместе с ними⁴.<\/p><p>Если же соус густой, нельзя извлекать\nотдельный кусок сам по себе — его следует\nизвлекать вместе с окружающим его\nсоусом. Трудно установить точную меру\nтого, сколько соуса необходимо взять\nвместе с ним, чтобы это не считалось\nборер.<\/p><h3 id=\"part-231\">\n<font size=\"5\">Отделение внутри\n\t\t\t\t\tодного вида<\/font><\/h3><p>Рама пишет в <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ט<\/span><\/font>,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סעיף ג<\/span><\/font>',\n\t\t\t\t\tссылаясь на слова <strong>Трумат а-Дешен<\/strong>:\n\t\t\t\t\tесли перед человеком находятся\n\t\t\t\t\tкусочки рыбы, и все они относятся к\n\t\t\t\t\tодному виду, но он отделяет большие\n\t\t\t\t\tкусочки от маленьких, это не считается\n\t\t\t\t\tборер.<\/p><p>Получается, что даже если человек\n\t\t\t\t\tсортирует одни кусочки отдельно от\n\t\t\t\t\tдругих, это не приобретает статус\n\t\t\t\t\tборер, если только здесь нет смеси\n\t\t\t\t\tдвух разных видов или смеси пищи и\n\t\t\t\t\tотходов.<\/p><p>Отсюда возникает вопрос относительно\n\t\t\t\t\tразличных видов смесей: считаются\n\t\t\t\t\tли они одним видом, и тогда здесь нет\n\t\t\t\t\tборер, или же они считаются двумя\n\t\t\t\t\tвидами.<\/p><p>Например, смесь двух видов яблок —\n\t\t\t\t\tкислых и сладких — или смесь кусочков\n\t\t\t\t\tмяса, часть которых варёная, а часть\n\t\t\t\t\tжареная⁵.<\/p><h3 id=\"part-232\">Отделение больших и маленьких\nкусочков<\/h3><p><strong>32.<\/strong> Если перед человеком\nнаходятся большие и маленькие кусочки,\nперемешанные между собой, и все они\nотносятся к одному виду, разрешено\nотделять одни от других, даже если он\nделает это не с намерением съесть их\nнемедленно, и даже если использует\nинструмент для отделения¹¹.<\/p><p>Причина в том, что поскольку все кусочки\nотносятся к одному виду и используются\nодинаково, здесь нет статуса смеси, и,\nсоответственно, действие не считается\nотделением (борер).<\/p><p>Однако если речь идёт о предметах,\nпредназначение которых различается,\nнапример о больших и маленьких носках\nили больших и маленьких заколках для\nволос, это считается смесью, и здесь\nимеется запрет борер.<\/p><h3 id=\"part-233\">Отделение кусочков курицы<\/h3><p><strong>33.<\/strong> Если перед человеком\nнаходятся различные части курицы,\nперемешанные между собой, например\nножки, грудки, крылышки и т. п., некоторые\nразрешают отделять их друг от друга,\nпоскольку они считаются одним видом¹².\nДругие запрещают это¹³.<\/p><p>Однако курица и печень или мясо\nсчитаются различными видами, и отделять\nих разрешено только в соответствии с\nправилами разрешения мелехет борер,\nразъяснёнными выше.<\/p><p>Также если часть кусочков варёная, а\nчасть жареная, это считается смесью, и\nзапрещено отделять их друг от друга.<\/p><h3 id=\"part-234\">Человек, который принципиально\nне ест определённый вид<\/h3><p><strong>34.<\/strong> Поским писали, что даже в\nсмеси одного вида, если человек постоянно\nизбегает есть один из этих продуктов и\nвообще его не ест, для него такая смесь\nсчитается смесью двух видов, и ему\nзапрещено отделять их¹⁴.<\/p><p>Например, если перед ним перемешаны\nразличные части курицы — ножки, крылышки\nи тому подобное — и он принципиально\nне ест крылышки, то для него это считается\nсмесью двух видов.<\/p><h3 id=\"part-235\">Кислые и сладкие яблоки<\/h3><p><strong>35.<\/strong> Если перед человеком\nнаходятся кислые и сладкие яблоки,\nперемешанные между собой, поским\nсомневаются, разрешено ли отделять их\nдруг от друга по закону одного вида или\nже они считаются двумя различными\nвидами.<\/p><h3 id=\"part-236\">Целые и поломанные мацот<\/h3><p><strong>36.<\/strong> Если целые и поломанные\nмацот перемешаны между собой и человек\nхочет отделить целые для <strong>Лехем\nМишне<\/strong>, некоторые писали, что это\nсчитается смесью, и отделять их можно\nтолько в соответствии с правилами\nмелехет борер¹².<\/p><p>Другие разрешили это¹³.<\/p><h3 id=\"part-237\">Варёное яйцо<\/h3><p><strong>37.<\/strong> Варёное яйцо целиком\nсчитается одним видом, и мы не говорим,\nчто белок и желток считаются двумя\nразличными видами. Поэтому разрешено\nотделять их друг от друга любым способом.<\/p><h3 id=\"part-238\">\n\t\t\t\t\tСмесь, пригодная для еды из-за малого\n\t\t\t\t\tколичества отходов<\/h3><p>В трактате <strong>Шаббат, 139<\/strong>\n\t\t\t\t\tсказано: «Фильтруют вино через ткань».\n\t\t\t\t\tРаши объясняет, что речь идёт о мелких\n\t\t\t\t\tчастицах, находящихся в вине.<\/p><p>То есть в вине имеются мелкие крошки,\n\t\t\t\t\tкоторые человек хочет удалить, однако\n\t\t\t\t\tразрешено фильтровать вино, поскольку\n\t\t\t\t\tоно пригодно для большинства людей\n\t\t\t\t\tи без такого фильтрования. Поэтому\n\t\t\t\t\tэто не рассматривается как смесь\n\t\t\t\t\tотходов и пищи, поскольку отходы\n\t\t\t\t\tстановятся второстепенными по\n\t\t\t\t\tотношению к вину и считаются как\n\t\t\t\t\tбудто их нет.<\/p><p>Отсюда следует правило для любого\n\t\t\t\t\tслучая, когда в пище имеется очень\n\t\t\t\t\tнебольшое количество отходов, на\n\t\t\t\t\tналичие которых большинство людей\n\t\t\t\t\tвообще не обращает внимания и спокойно\n\t\t\t\t\tест продукт, не отделяя эти отходы:\n\t\t\t\t\tтот, кто хочет их удалить, может это\n\t\t\t\t\tсделать, даже с помощью специального\n\t\t\t\t\tинструмента для отделения¹⁵.<\/p><p>Так и постановлено <font face=\"Tahoma\"><span>להלכה\n\t\t\t\t\t<\/span><\/font>в <strong>Шульхан Арух, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ט<\/span><\/font>,\n\t\t\t\t\t<font face=\"Tahoma\"><span>סעיף י<\/span><\/font>'<\/strong>.<\/p><p>Однако если человек, который хочет\n\t\t\t\t\tотделить отходы, является <strong>истенисом<\/strong>\n\t\t\t\t\t— очень чувствительным и разборчивым\n\t\t\t\t\tв еде, — и принципиально не пьёт\n\t\t\t\t\tнапиток, не удалив из него эти отходы,\n\t\t\t\t\tпоским написали, что, возможно, в\n\t\t\t\t\tтаком случае это запрещено¹⁶.<\/p><p>Ниже будут разъяснены подробности\n\t\t\t\t\tэтих законов.<\/p><h3 id=\"part-239\">Фильтрование воды<\/h3><p><strong>38.<\/strong> Если вода пригодна для\nпитья для большинства людей и без\nфильтрования, разрешено фильтровать\nеё в Шаббат, даже с помощью специального\nприспособления для фильтрации. Поэтому\nразрешено пользоваться водопроводным\nкраном, даже если в отверстии крана\nимеется фильтр.<\/p><p>Также разрешено пользоваться краном,\nдаже если вода проходит через систему\nочистки воды и выходит чистой и прозрачной,\nпри условии, что в системе очистки нет\nэлектрического процесса.<\/p><h3 id=\"part-240\">Фильтрование воды для истениса<\/h3><p><strong>39.<\/strong> Если человек является\n<strong>истенисом<\/strong> и вообще не пьёт\nнефильтрованную воду, некоторые\nсовременные поским постановили, что\nему нельзя пользоваться краном,\nподключённым к системе очистки воды,\nпоскольку для него это считается\nдействием борер¹⁷.<\/p><p>Другие постановили, что это разрешено¹⁸.<\/p><p>Что касается человека, который сам не\nтребует фильтровать воду: разрешено ли\nему фильтровать воду для человека,\nкоторый этого требует, — см. примечание.<\/p><h3 id=\"part-241\">Очистка фруктов и овощей от\nкожуры<\/h3><p><strong>40.<\/strong> Фрукты и овощи, которые\nбольшинство людей едят вместе с кожурой,\nразрешено очищать от кожуры, даже если\nэто делается не непосредственно перед\nтрапезой.<\/p><p>Если же человек является <strong>истенисом<\/strong>\nи принципиально не ест данный фрукт с\nкожурой, возможно, ему запрещено очищать\nего иначе, как непосредственно перед\nтрапезой, как разъяснено в предыдущем\nразделе.<\/p><p>См. ниже разделы <strong>94–95<\/strong>, где\nбудут приведены законы об очистке яблок,\nогурцов и тому подобного.<\/p><h3 id=\"part-242\">Выжимание масла из варёных\nили жареных продуктов<\/h3><p><strong>41.<\/strong> Если продукт был сварен\nили пожарен и человек хочет выжать из\nнего масло, поскольку не хочет есть его\nс большим количеством масла, разрешено\nего выжимать, и в этом нет запрета борер.<\/p><p>Если же человек является <strong>истенисом<\/strong>\nи не может есть продукт с содержащимся\nв нём большим количеством масла, или же\nколичество масла настолько велико, что\nбольшинство людей не стали бы есть этот\nпродукт без его выжимания, следует\nзапретить это.<\/p><p><strong>42.<\/strong> Если рыба законсервирована\nв масле, например тунец или сардины,\nнельзя выливать из банки или с тарелки\nмасло, смешанное с рыбой, поскольку это\nявляется отделением отходов от пищи.<\/p><p>Разрешено извлечь пищу из масла с\nнамерением съесть её немедленно.<\/p><p>Если же количество масла невелико,\nтак что оно второстепенно по отношению\nк пище и люди обычно едят её в таком\nвиде, разрешено выжимать кусочки рыбы\nот смешанного с ними масла, поскольку\nэто не рассматривается как смесь двух\nвидов.<\/p><p>Если же человек является <strong>истенисом<\/strong>\nи не может есть рыбу без удаления этого\nмасла, возможно, ему запрещено её\nвыжимать, как разъяснено в предыдущих\nразделах.<\/p><h3 id=\"part-243\">Отделение отходов от отходов<\/h3><p><strong>43.<\/strong> Разрешено выливать в\nраковину остатки пищи, даже если они\nпроходят через фильтр, находящийся в\nраковине, и в этом нет запрета борер.<\/p><p>Причина в том, что все отходы считаются\nодним видом, и жидкость и находящиеся\nв ней твёрдые частицы не рассматриваются\nкак два различных вида.<\/p><p>См. также примечание.<\/p><h3 id=\"part-244\">Отходы пищи, часть которых\nобладает святостью шмиты<\/h3><p><strong>44.<\/strong> Если на тарелке находятся\nостатки пищи, которые человек хочет\nвыбросить, и часть отходов обладает\nсвятостью <strong>шмиты<\/strong>, следует\nвыяснить, разрешено ли отделить эти\nотходы для того, чтобы положить их в\nспециальный мусор для продуктов шмиты.\nСм. примечание.<\/p><h3 id=\"part-245\">Перемещение предметов внутри\nсмеси<\/h3><p><strong>45.<\/strong> Запрет борер относится\nтолько к случаю, когда человек извлекает\nпредмет или отходы из смеси. Но если он\nничего не извлекает, а только перемещает\nпредметы с одного места на другое внутри\nсмеси, и всё остаётся перемешанным, как\nбыло изначально, это разрешено.<\/p><p><strong>46.<\/strong> Поэтому поским писали, что\nесли муха плавает на поверхности стакана,\nразрешено подуть на неё и переместить\nеё в сторону, чтобы можно было пить¹⁹.\nСм. примечание.<\/p><p><strong>47.<\/strong> Если человек ищет определённый\nключ в связке ключей, разрешено отодвигать\nостальные ключи в стороны. В этом нет\nзапрета борер, поскольку он не извлекает\nих из смеси.<\/p><p>Однако нельзя вынимать из связки\nключи, которые ему не нужны.<\/p><h3 id=\"part-246\">Использование картотеки<\/h3><p><strong>47*.<\/strong> Картотека — это коробка\nс карточками, на которых записаны\nназвания книг, имена людей и тому\nподобное. Разрешено искать в ней нужную\nкарточку, даже если для этого необходимо\nперемещать ненужные ему карточки и\nотодвигать их в другую сторону.<\/p><p>Это не считается отделением отходов\nот пищи, поскольку все карточки остаются\nвнутри коробки. Это подобно перемещению\nразличных предметов внутри смеси, о чём\nбыло сказано в предыдущих разделах, и\nв этом нет запрета борер.<\/p><p>По этой же причине разрешено вернуть\nкарточку, вынутую из картотеки, на своё\nместо, даже если для поиска её места\nвнутри смеси необходимо перемещать\nкарточки с одной стороны на другую.<\/p><p>Также разрешено извлекать из картотеки\nкарточки, которые человек намерен\nиспользовать немедленно.<\/p><p>Поэтому <strong>габаи бейт-кнессета<\/strong>\nразрешено достать из картотеки карточки,\nна которых записаны имена людей, которых\nон намерен вызвать к Торе, если он делает\nэто непосредственно перед началом\nмолитвы.<\/p><p>Однако если после чтения Торы у него\nв руках находится несколько карточек\nодной пачкой, запрещено возвращать\nкаждую карточку на своё место, поскольку\nэта пачка считается смесью, а сортировка\nкарточек и возвращение каждой на\nпредназначенное ей место является\nборер, который выполняется не для\nнемедленного использования.<\/p><p>То же самое относится к поиску листов,\nнаходящихся внутри папки, и их извлечению\nиз неё.<\/p><h3 id=\"part-247\">\n<font size=\"5\">Отделение для\n\t\t\t\t\tнемедленного употребления<\/font><\/h3><p>Выше было разъяснено, что одним из\n\t\t\t\t\tусловий разрешения борер является\n\t\t\t\t\tто, чтобы человек отделял пищу для\n\t\t\t\t\t<strong>немедленного использования<\/strong>.<\/p><p>Поским писали, что это не означает,\n\t\t\t\t\tчто необходимо отделить пищу с\n\t\t\t\t\tнамерением съесть её сразу же. Любое\n\t\t\t\t\tотделение, которое делается для\n\t\t\t\t\tданной трапезы и непосредственно\n\t\t\t\t\tперед ней, рассматривается как\n\t\t\t\t\tотделение для немедленного употребления.<\/p><p>Даже если человек отделяет продукт\n\t\t\t\t\tдля блюда, которое будет съедено в\n\t\t\t\t\tконце трапезы, и сама трапеза должна\n\t\t\t\t\tпродолжаться ещё долгое время, это\n\t\t\t\t\tвсё равно входит в категорию отделения\n\t\t\t\t\tдля немедленного употребления.<\/p><p>В <strong>Беур а-Гра, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשי<\/span><\/font>\"<font face=\"Tahoma\"><span>ט\n\t\t\t\t\tסעיף א<\/span><\/font>'<\/strong>, это выводится\n\t\t\t\t\tиз формулировки Гемары, Шаббат, лист\n\t\t\t\t\t<strong>74<\/strong>: «тот, кто отделяет для\n\t\t\t\t\tэтого дня». Отсюда следует, что если\n\t\t\t\t\tчеловек отделяет для близкого по\n\t\t\t\t\tвремени использования, его действие\n\t\t\t\t\tне имеет статуса мелехет борер, даже\n\t\t\t\t\tесли он не съедает пищу непосредственно\n\t\t\t\t\tсразу после отделения. Это рассматривается\n\t\t\t\t\tкак извлечение пищи для еды.<\/p><p><span><b>48.<\/b><\/span><span> <\/span>Если\nчеловек отделяет пищу от отходов для\nеды и делает это непосредственно перед\nтрапезой, это считается бorer для\nнемедленного употребления и разрешено.<\/p><p>При этом поским не установили точную\nмеру того, насколько близко к трапезе\nдолжно происходить отделение. По-видимому,\nречь идёт о времени, необходимом людям\nдля обычной подготовки к ближайшей\nтрапезе. См. примечание.<\/p><p>Однако всё это при условии, что человек\nне намерен сделать какое-либо другое\nсущественное действие между подготовкой\nи трапезой. Но если он намерен прервать\nподготовку другим существенным действием,\nэто запрещено.<\/p><h3 id=\"part-248\">Раскладывание столовых\nприборов на столе<\/h3><p><strong>49.<\/strong> Нельзя отделять столовые\nприборы, перемешанные между собой, с\nцелью накрыть стол, кроме случая, когда\nэто делается непосредственно перед\nтрапезой.<\/p><h3 id=\"part-249\">Очистка овощей и яиц<\/h3><p><strong>49*.<\/strong> Нельзя очищать овощи и\nяйца для приготовления блюд к трапезе,\nкроме случая, когда это делается\nнепосредственно перед трапезой. Как\nбудет разъяснено ниже, в разделе <strong>90<\/strong>,\nочистка фруктов, овощей и тому подобного\nразрешена только непосредственно перед\nтрапезой.<\/p><h3 id=\"part-250\">Мера «немедленно» при большой\nтрапезе<\/h3><p><strong>50.<\/strong> Если человек готовит\nбольшую трапезу и ему необходимо\nсортировать столовые приборы, очищать\nовощи и тому подобное, а на эту подготовку\nтребуется много времени, некоторые из\nпоским постановили, что разрешено начать\nэту подготовку даже значительно раньше\nтрапезы — на столько времени заранее,\nсколько ему необходимо для подготовки.\nСм. примечание.<\/p><h3 id=\"part-251\">Отделение большого количества\nдля трапезы<\/h3><p><strong>51.<\/strong> Когда человек отделяет\nпищу для ближайшей трапезы, ему не\nтребуется ограничиваться и готовить\nточно необходимое количество. Разрешено\nприготовить с запасом, даже если\nпредположительно часть пищи останется\nдля следующей трапезы.<\/p><p>Однако запрещено намеренно готовить\nбольшое количество, которого хватит\nтакже для следующей трапезы.<\/p><h3 id=\"part-252\">Отделение, когда неизвестно,\nкогда придут гости<\/h3><p><strong>52.<\/strong> Если человек не уверен,\nкогда члены семьи или гости придут на\nтрапезу, по-видимому, ему разрешено\nотделять пищу непосредственно перед\nсамым ранним временем, когда трапеза\nможет начаться.<\/p><h3 id=\"part-253\">Отделение книг<\/h3><p><strong>53.<\/strong> Если человек отделяет\nкниги из смеси для учёбы, которая должна\nначаться, это считается отделением\nнепосредственно перед использованием,\nдаже если фактически он будет обращаться\nк этим книгам только в конце учебного\nзанятия.<\/p><p>Поэтому разрешено достать <strong>Хумаш<\/strong>\nперед утренней молитвой <strong>Шахарит<\/strong>,\nдаже если он будет использовать его\nтолько во время чтения Торы.<\/p><p>См. выше, раздел <strong>23<\/strong>, где было\nразъяснено, что если книги стоят в шкафу\nи отличаются друг от друга, это вообще\nне считается смесью.<\/p><h3 id=\"part-254\">Отделение с целью передать\nдругому<\/h3><p><strong>54.<\/strong> Если человек отделяет\nфрукт из смеси, чтобы дать его в дорогу\nгостю, который выходит из дома, некоторые\nзапрещают это, если он знает, что фрукт\nне будет съеден немедленно.<\/p><p>Другие разрешают это.<\/p><p>То же самое относится к отделению\nлекарства с целью передать его соседу,\nесли сосед нуждается в этом лекарстве\nтолько спустя некоторое время.<\/p><h3 id=\"part-255\">Отделение для размораживания\nили нагревания<\/h3><p><strong>55.<\/strong> Если человек достаёт халу\nиз морозильника с намерением, чтобы она\nразморозилась и стала пригодной для\nеды через час, к ближайшей трапезе, это\nне считается отделением для немедленного\nупотребления, поскольку он не ест халу\nнепосредственно после отделения. См.\nпримечание.<\/p><p><strong>56.<\/strong> Если человек хочет поставить\nего на михам с водой, и это блюдо смешано\nс соусом, а разогревать соус запрещено\nиз-за запрета бишуль, как объясняется\nвыше в главе 1, пункты 20–22, некоторые\nразрешили отделить пищу от соуса с целью\nеё разогрева. Основание этого заключается\nв том, что обычно люди разогревают блюда\nнепосредственно перед едой, поэтому\nразогрев считается частью подготовки\nк трапезе, и это подобно <strong>борер для\nнемедленного употребления<\/strong>. См.\nпримечание.<\/p><p>И всё это относится к случаю, когда\nчеловек берёт пищу из отходов. Но если\nон взял кусок мяса, а на нём находится\nзначительное количество застывшего\nжира, который запрещено размораживать\nу огня, как объясняется в главе 4, пункт\n47, запрещено снимать соус с мяса, поскольку\nон отделяет отходы от пищи, — если только\nсоус не виден отдельно настолько, что\nвообще не считается смешанным с мясом.<\/p><h3 id=\"part-256\">Отделил с намерением съесть\nнемедленно, а затем передумал<\/h3><p><strong>57.<\/strong> Если человек отделил\nпродукт с намерением съесть его\nнемедленно, а затем передумал и решил\nего не есть, см. примечание.<\/p><h3 id=\"part-257\">Отделил с намерением не есть\nнемедленно, а затем передумал и решил\nсъесть немедленно<\/h3><p><strong>58.<\/strong> Тот, кто нарушил и отделил\nпищу от отходов не с намерением съесть\nеё немедленно, а затем передумал и съел\nеё немедленно, этим не исправляет\nсовершённое им нарушение.<\/p><h3 id=\"part-258\">\n\t\t\t\t\tБорер непосредственно во время еды<\/h3><p>Хотя выше было объяснено, что\n\t\t\t\t\tзапрещено отделять отходы от пищи\n\t\t\t\t\tдаже тогда, когда это делается для\n\t\t\t\t\tнемедленного употребления, тем не\n\t\t\t\t\tменее, Ришоним написали, что\n\t\t\t\t\tнепосредственно в момент еды разрешено\n\t\t\t\t\tотделять даже отходы от пищи и даже\n\t\t\t\t\tс помощью приспособления.<\/p><p>Поэтому РаШ, приведённый в Шульхан\n\t\t\t\t\tАрух, симан 319, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\t<\/span><\/font>7, разрешил пить воду, в которой\n\t\t\t\t\tнаходятся черви, если положить кусок\n\t\t\t\t\tткани на край стакана и переливать\n\t\t\t\t\tнапиток в рот через эту ткань, хотя\n\t\t\t\t\tчерви фильтруются именно во время\n\t\t\t\t\tпитья.<\/p><p>Однако если это происходит не\n\t\t\t\t\tнепосредственно во время еды, а\n\t\t\t\t\tчеловек держит кусок пищи в руке,\n\t\t\t\t\tчтобы съесть его, и хочет удалить из\n\t\t\t\t\tнего отходы, см. Беур Галаха, симан\n\t\t\t\t\t319, <font face=\"Tahoma\"><span>סעיף <\/span><\/font>4,\n\t\t\t\t\t<font face=\"Tahoma\"><span>ד<\/span><\/font>\"<font face=\"Tahoma\"><span>ה\n\t\t\t\t\t<\/span><\/font>«<font face=\"Tahoma\"><span>הבורר<\/span><\/font>»,\n\t\t\t\t\tгде приводится, что Ахроним спорят\n\t\t\t\t\tпо этому вопросу. Он пишет, что это\n\t\t\t\t\tзависит от разногласия между Ришоним.<\/p><p>А Хазон Иш, симан 54, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן <\/span><\/font>1, пишет, что здесь вообще\n\t\t\t\t\tнет места для облегчения, поскольку\n\t\t\t\t\tРишоним разрешили это только тогда,\n\t\t\t\t\tкогда человек отделяет отходы\n\t\t\t\t\tнепосредственно изо рта в самый\n\t\t\t\t\tмомент еды.<\/p><p><strong>59.<\/strong> Если человек ест и\nпочувствовал во рту отходы, смешанные\nс пищей, ему разрешено вынуть их, и это\nне относится к запрету отделения отходов\nот пищи, который запрещён даже для\nнемедленного употребления.<\/p><p>Также разрешено положить кусок ткани\nна стакан с напитком, в котором смешаны\nотходы, и пить напиток через эту ткань.\nВ этом нет запрета борер, хотя напиток\nфильтруется через ткань непосредственно\nво время питья.<\/p><p><strong>60.<\/strong> Если человек собирается\nесть и держит в руке пищу или стакан с\nнапитком, ему запрещено отделять от них\nотходы, даже если он занят едой, поскольку\nэто всё же не считается <strong>борер\nнепосредственно во время еды<\/strong>.<\/p><h3 id=\"part-259\">\n<font size=\"5\">Отделение пищи\n\t\t\t\t\tот отходов<\/font><\/h3><p>Выше было разъяснено, что одним из\n\t\t\t\t\tусловий разрешения борер является\n\t\t\t\t\tотделение пищи от отходов, а не отходов\n\t\t\t\t\tот пищи. При этом должны соблюдаться\n\t\t\t\t\tещё два условия: отделять нужно рукой,\n\t\t\t\t\tа не с помощью приспособления, и\n\t\t\t\t\tделать это для немедленного\n\t\t\t\t\tупотребления. При соблюдении всех\n\t\t\t\t\tэтих условий отделение разрешено.<\/p><p>В связи с этим необходимо выяснить\n\t\t\t\t\tнесколько практических деталей, как\n\t\t\t\t\tбудет объяснено далее.<\/p><h3 id=\"part-260\"><font size=\"5\">Что\n\t\t\t\t\tименно считается отделяемым?<\/font><\/h3><p>В Гемаре, Шаббат 139, объясняется,\n\t\t\t\t\tчто если человек переливает шехар\n\t\t\t\t\t(напиток) из бочки, на дне которой\n\t\t\t\t\tнаходятся осадки, это разрешено до\n\t\t\t\t\tтех пор, пока он не дошёл до места,\n\t\t\t\t\tгде напиток и осадки смешаны. Но с\n\t\t\t\t\tтого момента, когда он начинает\n\t\t\t\t\tпереливать напиток из смеси, это\n\t\t\t\t\tзапрещено из-за борер — поскольку\n\t\t\t\t\tон отделяет напиток от осадка.<\/p><p>Маген Авраам, симан 319, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן <\/span><\/font>15, пишет, что запрет имеет\n\t\t\t\t\tместо именно тогда, когда отделение\n\t\t\t\t\tпроизводится с помощью приспособления\n\t\t\t\t\tили когда человек не использует\n\t\t\t\t\tнапиток немедленно. Но если он не\n\t\t\t\t\tиспользует приспособление и пьёт\n\t\t\t\t\tнапиток немедленно, это разрешено.<\/p><p>Из слов Маген Авраама следует, что\n\t\t\t\t\tтакое переливание напитка из смеси\n\t\t\t\t\tопределяется как <strong>отделение пищи\n\t\t\t\t\tот отходов<\/strong>, и это имеет место\n\t\t\t\t\tдаже тогда, когда человек держит\n\t\t\t\t\tсосуд в руке. Так же постановил Мишна\n\t\t\t\t\tБрура, <font face=\"Tahoma\"><span>סעיף קטן\n\t\t\t\t\t<\/span><\/font>55.<\/p><p>Однако мнение Гра\"З в его Сидуре\n\t\t\t\t\tтаково: если человек держит сосуд в\n\t\t\t\t\tруке и переливает из него, мы считаем,\n\t\t\t\t\tчто отделяемым является то, что\n\t\t\t\t\tнаходится у него в руке. Получается,\n\t\t\t\t\tчто это подобно отделению осадка от\n\t\t\t\t\tнапитка, и поэтому запрещено в любом\n\t\t\t\t\tслучае, даже если он намеревается\n\t\t\t\t\tвыпить напиток немедленно.<\/p><p>Основание мнения Маген Авраама и\n\t\t\t\t\tМишна Бруры заключается в том, что\n\t\t\t\t\tопределяют не по тому, что остаётся\n\t\t\t\t\tу человека в руке, а по тому, какой\n\t\t\t\t\tвид извлекается из смеси: именно тот\n\t\t\t\t\tвид, который был извлечён из смеси,\n\t\t\t\t\tсчитается отделяемым.<\/p><p><strong>62.<\/strong> Если в стакане находится\nнапиток, а на его поверхности плавают\nотходы таким образом, что они считаются\nсмесью, запрещено наклонять стакан так,\nчтобы отходы вытекли наружу, поскольку\nэто определяется как отделение отходов\nот пищи, что запрещено в любом случае.<\/p><h3 id=\"part-261\">Чай<\/h3><p><strong>63.<\/strong> Если в сосуде находится\nчайный настой, смешанный с чайными\nлистьями, следует различать два случая:<\/p><p><strong>а)<\/strong> Когда листья находятся на\nдне стакана, разрешено переливать\nнастой, находящийся сверху, поскольку\nон не смешан с листьями.<\/p><p><strong>б)<\/strong> Когда человек доходит до\nместа, где настой находится рядом с\nлистьями и смешан с ними, переливание\nопределяется как действие борер —\nотделение настоя от листьев. В таком\nслучае он отделяет пищу от отходов, и\nэто разрешено, если он намеревается\nиспользовать настой немедленно, то есть\nпри условии, что он не использует\nспециальное приспособление для борер.<\/p><p>Если на краю сосуда имеется ситечко,\nсм. далее пункт 77.<\/p><h3 id=\"part-262\">\n<font size=\"5\">Удаление отходов\n\t\t\t\t\tвместе с небольшим количеством пищи<\/font><\/h3><p>Поским разошлись во мнениях\n\t\t\t\t\tотносительно случая, когда человек\n\t\t\t\t\tудаляет отходы из смеси и вместе с\n\t\t\t\t\tними захватывает немного пищи.\n\t\t\t\t\tНекоторые пишут, что это разрешено,\n\t\t\t\t\tпоскольку он не удалил отходы отдельно\n\t\t\t\t\tот пищи, а вместе с отходами взял\n\t\t\t\t\tнемного пищи.<\/p><p>Другие запрещают это. Их основание\n\t\t\t\t\tзаключается в том, что даже если\n\t\t\t\t\tвместе с отходами было взято немного\n\t\t\t\t\tпищи, всё же оставшаяся пища была\n\t\t\t\t\tочищена от отходов, которые были с\n\t\t\t\t\tней смешаны.<\/p><p>Таз пишет, что разрешено удалить\n\t\t\t\t\tмуху из стакана, если вместе с ней он\n\t\t\t\t\tзахватывает немного напитка. Мишна\n\t\t\t\t\tБрура выводит из его слов, что в любом\n\t\t\t\t\tслучае, когда вместе с отходами\n\t\t\t\t\tчеловек удаляет немного пищи, запрета\n\t\t\t\t\tборер нет.<\/p><p>Хазон Иш с этим не согласен и считает,\n\t\t\t\t\tчто Таз разрешил удалять муху вместе\n\t\t\t\t\tс небольшим количеством напитка\n\t\t\t\t\tименно потому, что муха вообще не\n\t\t\t\t\tсмешана с напитком, находящимся в\n\t\t\t\t\tстакане. Она смешана только с напитком,\n\t\t\t\t\tкоторый находится на ней и между её\n\t\t\t\t\tкрыльями. Поэтому, когда человек\n\t\t\t\t\tудаляет муху ложкой вместе с небольшим\n\t\t\t\t\tколичеством напитка, он вообще не\n\t\t\t\t\tсовершает действия борер.<\/p><p>Но если отходы действительно смешаны\n\t\t\t\t\tс окружающей их пищей, запрещено\n\t\t\t\t\tудалять их вместе с небольшим\n\t\t\t\t\tколичеством пищи, поскольку этим\n\t\t\t\t\tчеловек исправляет оставшуюся смесь\n\t\t\t\t\tи отделяет её от отходов.<\/p><p>Однако если вместе с отходами он\n\t\t\t\t\tвозьмёт большое количество пищи, так\n\t\t\t\t\tчто это уже не определяется как\n\t\t\t\t\tудаление отходов из пищи, а как\n\t\t\t\t\tразделение смеси на две части, это\n\t\t\t\t\tразрешено даже по мнению Хазон Иша.<\/p><p>На основании этого будут объяснены\n\t\t\t\t\tследующие законы.<\/p><h3 id=\"part-263\">Удаление косточки вместе с\nнебольшим количеством пищи<\/h3><p><strong>64.<\/strong> Если косточка лимона упала\nв салат, запрещено вынимать её из него,\nпоскольку это отделение отходов от\nпищи. Если вместе с косточкой человек\nзахватывает немного пищи, мнение Мишна\nБруры — разрешить, а мнение Хазон Иша\n— запретить.<\/p><p>Если же вместе с косточкой он возьмёт\nбольшое количество пищи, так что действие\nвообще не будет выглядеть как удаление\nотходов из пищи, а будет выглядеть как\nразделение смеси на две части, это\nразрешено даже по мнению Хазон Иша.<\/p><h3 id=\"part-264\">Удаление мухи вместе с\nнебольшим количеством напитка<\/h3><p><strong>65.<\/strong> Как было объяснено выше,\nв пункте 29, если в напиток упала муха,\nразрешено удалить её ложкой вместе с\nнебольшим количеством напитка. Если же\nв стакан упало несколько мух, не следует\nудалять их ложкой.<\/p><p>Однако если человек переливает из\nстакана мух вместе с большим количеством\nнапитка в другой стакан, таким образом,\nчто действие определяется как разделение\nнаходящегося в стакане напитка на две\nчасти, а не как исправление оставшегося\nв стакане напитка, это разрешено.<\/p><h3 id=\"part-265\">Удаление кости вместе с\nнебольшим количеством мяса<\/h3><p><strong>66.<\/strong> Если человек ест кусок\nрыбы или курицы, в котором есть кости,\nи вынимает кость вместе с небольшим\nколичеством мяса и выбрасывает её,\nпоским разошлись во мнениях.<\/p><p>Мнение Мишна Бруры — разрешить,\nпоскольку вместе с отходами он удаляет\nнемного пищи.<\/p><p>Мнение Хазон Иша — запретить, поскольку\nэтим он исправляет оставшееся мясо.<\/p><p>Однако если он берёт кость и высасывает\nвлагу, находящуюся на ней, это разрешено,\nпоскольку такое действие определяется\nкак часть самого процесса еды, а не как\nудаление отходов из пищи.<\/p><h3 id=\"part-266\">Наклейка на хале<\/h3><p><strong>67.<\/strong> Наклейку, приклеенную к\nхале, запрещено снимать из-за запрета\nборер.<\/p><p>Однако если человек срезает тонкий\nслой халы вместе с наклейкой, это\nразрешено. Это разрешение относится и\nпо мнению Хазон Иша, который запрещает\nудалять отходы из смеси даже тогда,\nкогда вместе с ними человек берёт немного\nпищи.<\/p><p>Причина заключается в том, что в данном\nслучае местом смеси является только\nместо соприкосновения между наклейкой\nи халой. Поэтому, когда вместе с наклейкой\nчеловек снимает немного халы, здесь\nвообще нет исправления смеси.<\/p><h3 id=\"part-267\">Продукт, часть которого\nиспорчена<\/h3><p><strong>68.<\/strong> Если продукт частично\nиспортился, например яблоко, часть\nкоторого сгнила, следует различать три\nслучая:<\/p><p><strong>а)<\/strong> Если эта часть полностью\nиспортилась, она считается полноценными\nотходами, и запрещено по Торе отделять\nеё от пищи, с которой она смешана.<\/p><p><strong>б)<\/strong> Если эта часть не испортилась\nполностью и её ещё можно есть в крайнем\nслучае, она считается отходами,\nзапрещёнными по постановлению мудрецов,\nи запрещено по постановлению мудрецов\nотделять её от пищи.<\/p><p><strong>в)<\/strong> Если эта часть пригодна\nдля еды даже не в крайнем случае, она\nсчитается полноценной пищей, и разрешено\nотделять её от остальной пищи, несмотря\nна то что она немного испортилась.<\/p><p><strong>69. <\/strong>Поэтому, если яблоко\nчастично сгнило так, что испорченную\nчасть вообще нельзя есть или её можно\nесть только в крайнем случае, запрещено\nудалять испорченную часть из яблока,\nпоскольку это подобно отделению отходов\nот пищи.<\/p><p>Если человек не срезает испорченное\nместо отдельно, а вместе с ним срезает\nнемного неповреждённой части, это\nявляется предметом спора поским,\nприведённого выше в пункте 64.<\/p><p>Если же он срезает яблоко на некотором\nрасстоянии от испорченного места, это\nразрешено согласно всем мнениям. См.\nпримечание.<\/p><p>То же самое относится к пирогу, часть\nкоторого сгорела во время выпечки.<\/p><h3 id=\"part-268\">Удаление испорченного плода\nиз кучи плодов<\/h3><p><strong>70.<\/strong> Если среди яблок находится\nодно сгнившее яблоко, которое вообще\nнепригодно для еды или пригодно только\nв крайнем случае, оно считается отходами,\nи запрещено вынимать его из смеси.<\/p><p>Если яблоко частично сгнило, а другая\nего часть всё ещё пригодна для еды, и\nчеловек хочет вынуть его из смеси, то,\nесли он сейчас съест пригодную для еды\nчасть, разрешено вынуть яблоко из смеси,\nхотя его основной целью при извлечении\nяблока из остальных яблок является\nудаление из них содержащейся в нём\nсгнившей части.<\/p><p>Но если он не собирается сейчас есть\nэто яблоко, а вынимает его только для\nтого, чтобы оно не испортило остальные\nяблоки, поским разошлись во мнениях\nотносительно того, нарушает ли он запрет\nборер.<\/p><h3 id=\"part-269\">Отделение листьев салата<\/h3><p><strong>71.<\/strong> Запрещено отделять листья\nсалата от увядших листьев, если увядшие\nлистья непригодны для еды.<\/p><p>См. далее пункт 92 относительно закона\nоб отделении листьев салата.<\/p><h3 id=\"part-270\">Отделение части отходов<\/h3><p><strong>72.<\/strong> Запрет борер относится\nтакже к случаю, когда человек отделяет\nне все отходы из смеси, а удаляет только\nчасть из них.<\/p><h3 id=\"part-271\">\n<font size=\"5\">Отделение с\n\t\t\t\t\tпомощью приспособления<\/font><\/h3><p>Выше было объяснено, что отделение\n\t\t\t\t\tс помощью приспособления запрещено\n\t\t\t\t\tдаже в том случае, когда человек\n\t\t\t\t\tотделяет пищу от отходов для\n\t\t\t\t\tнемедленного употребления. Причина\n\t\t\t\t\tзаключается в том, что всякое отделение\n\t\t\t\t\tс помощью приспособления не является\n\t\t\t\t\tобычным способом еды, и такое действие\n\t\t\t\t\tполучает статус мелахи борер.<\/p><p>В Гемаре, Шаббат 74, объясняется, что\n\t\t\t\t\tздесь следует различать два вида\n\t\t\t\t\tприспособлений:<\/p><p><strong>а)<\/strong> Приспособление, специально\n\t\t\t\t\tпредназначенное для отделения,\n\t\t\t\t\tнапример сито или решето, — отделение\n\t\t\t\t\tс его помощью запрещено по Торе.<\/p><p><strong>б)<\/strong> Приспособление, не\n\t\t\t\t\tпредназначенное специально для\n\t\t\t\t\tотделения, например канон или тахуи,\n\t\t\t\t\t— отделение с его помощью запрещено\n\t\t\t\t\tтолько по постановлению мудрецов,\n\t\t\t\t\tпоскольку это считается борер,\n\t\t\t\t\tвыполненным необычным способом.<\/p><p>Практические законы, относящиеся\n\t\t\t\t\tк приспособлениям, используемым в\n\t\t\t\t\tнаши дни для отделения, приводятся\n\t\t\t\t\tдалее.<\/p><h3 id=\"part-272\">Ситечко<\/h3><p><strong>73.<\/strong> Ситечко — это приспособление,\nспециально предназначенное для борер,\nпоэтому запрещено по Торе процеживать\nс его помощью любую смесь, даже если\nчеловек отделяет пищу от отходов и\nнамеревается съесть её немедленно.<\/p><p>Поэтому нельзя процеживать через\nситечко апельсиновый сок, выжатый до\nШаббата, чтобы отделить мякоть. Также\nесли суп смешан с мясом, лапшой и т. п. и\nчеловек хочет отделить их друг от друга,\nнельзя использовать для этого ситечко.<\/p><h3 id=\"part-273\">Ложка с отверстиями<\/h3><p><strong>74.<\/strong> Нельзя использовать ложку\nс отверстиями для того, чтобы брать\nсалат, смешанный с соусом, поскольку\nтакая ложка является приспособлением,\nиспользуемым для борер: она предназначена\nдля процеживания соуса из пищи. См.\nпримечание.<\/p><h3 id=\"part-274\">Прижимание крышки к кастрюле<\/h3><p><strong>75.<\/strong> Если человек переливает\nсуп из кастрюли и прижимает крышку\nкастрюли к её краю, чтобы кусочки,\nсмешанные с супом, остались в кастрюле,\nнекоторые постановили, что это подобно\nборер с помощью приспособления и\nзапрещено делать даже для немедленного\nупотребления. Другие разрешили. См.\nпримечание.<\/p><h3 id=\"part-275\">Прижимание половника или\nложки к стенке кастрюли<\/h3><p><strong>76.<\/strong> Также некоторые постановили,\nчто не следует прижимать половник к\nстенке кастрюли, когда человек берёт\nиз неё блюдо, с целью дать супу или соусу\nстечь из половника, поскольку возможно,\nчто это подобно борер с помощью\nприспособления и запрещено даже тогда,\nкогда человек намеревается немедленно\nсъесть блюдо и суп.<\/p><p>Другие разрешили. См. примечание.<\/p><p>Тем более, если человек не намеревается\nнемедленно съесть суп или соус, это\nзапрещено, поскольку он отделяет вид\nпищи, который сейчас не хочет есть, от\nвида, который хочет есть, а это подобно\nотделению отходов от пищи. См. выше,\nпункт 15.<\/p><h3 id=\"part-276\">Чайник с ситечком на носике<\/h3><p><strong>77.<\/strong> Если у чайника на носике\nимеется ситечко, препятствующее выходу\nчайных листьев, некоторые рассматривают\nего как приспособление, специально\nпредназначенное для борер, и запрещают\nпользоваться им в Шаббат. Другие считают,\nчто это разрешено.<\/p><p>Однако весь этот вопрос относится\nтолько к случаю, когда листья смешаны\nс настоем. Если же листья находятся на\nдне сосуда, а настой находится сверху,\nсогласно всем мнениям разрешено\nпереливать настой сверху, поскольку\nздесь вообще нет смеси и, следовательно,\nнет опасения нарушения борер.<\/p><h3 id=\"part-277\">Пакетики чая<\/h3><p><strong>78.<\/strong> Если человек приготовил\nчайный концентрат до Шаббата, положив\nв сосуд несколько пакетиков чая и залив\nих кипятком, в Шаббат ему разрешено\nпереливать концентрат из сосуда до тех\nпор, пока количество концентрата\nдостаточно велико и он находится выше\nуровня пакетиков, поскольку он вообще\nне смешан с листьями.<\/p><p>Но когда остаётся только небольшое\nколичество концентрата, уже нельзя\nпереливать его из сосуда, поскольку\nтогда вместе с ним выливается и концентрат,\nнаходящийся внутри пакетиков. Этот\nконцентрат смешан с листьями в пакетике\nи фильтруется через листья посредством\nбумаги, которая служит ситечком, и это\nподобно борер с помощью приспособления.<\/p><p>Поэтому следует позаботиться о том,\nчтобы вынуть пакетики чая из сосуда до\nШаббата.<\/p><p><strong>79.<\/strong> Если человек не вынул\nпакетики до Шаббата и хочет вынуть их\nв Шаббат, запрещено встряхивать пакетик\nпосле того, как он его вынул, или держать\nего в воздухе, чтобы находящийся внутри\nнего концентрат стекал обратно в сосуд,\nпоскольку это является борер.<\/p><p>Если же он не держит пакетик в воздухе,\nа просто вынимает его наружу, это\nразрешено, даже если из пакетика\nпродолжают капать капли, поскольку\nфильтрация происходит сама по себе. См.\nпримечание.<\/p><p>Предпочтительно вынимать пакетик с\nпомощью ложки, чтобы не допустить ошибки.<\/p><p><strong>80.<\/strong> Если в сосуде находится\nнесколько пакетиков чая, расположенных\nблизко друг к другу, бывают случаи, когда\nсами пакетики считаются смешанными с\nконцентратом, находящимся между ними.\nЕсли вынуть их из концентрата, это\nподобно отделению отходов от пищи.\nПоэтому следует позаботиться о том,\nчтобы вынимать их ложкой из сосуда: в\nтаком случае они не отделяются от\nконцентрата, находящегося между ними.<\/p><h3 id=\"part-278\">Пакетик чая при допустимом\nприготовлении чая<\/h3><p><strong>81.<\/strong> Если человек готовит чайный\nконцентрат в Шаббат разрешённым способом,\nнапример кладёт пакетики чая в воду,\nтемпература которой ниже «яд соледет\nбо», разрешено встряхивать пакетик в\nводе, чтобы извлечь из него количество\nконцентрата. В этом нет запрета борер.\nСм. примечание.<\/p><h3 id=\"part-279\">Солонка с зёрнами риса<\/h3><p><strong>82.<\/strong> Если в солонке находятся\nзёрна риса, предназначенные для впитывания\nвлаги из соли, некоторые разрешили\nпользоваться такой солонкой в Шаббат.\nХотя соль отделяется от риса через\nотверстия в крышке, тем не менее это не\nрассматривается как борер с помощью\nприспособления. Другие запрещают это.<\/p><p>Следует знать, что всё это относится\nтолько к случаю, когда человек собирается\nнемедленно употребить пищу. Если же он\nне собирается есть её немедленно,\nполучается, что он отделяет пищу от\nотходов — соль от риса — не для\nнемедленного употребления, а это\nзапрещено.<\/p><h3 id=\"part-280\">Сосуд, предназначенный для\nхранения оливок и огурцов<\/h3><p><strong>83.<\/strong> Если имеется сосуд для\nхранения оливок и огурцов, внутри\nкоторого находится ситечко, и при\nизвлечении оливок из сосуда ситечко\nподнимают, в результате чего соус стекает\nс оливок, не следует пользоваться таким\nсосудом в Шаббат.<\/p><p>Однако если огурцы хорошо отделены\nдруг от друга и не считаются смешанными\nс водой, разрешено пользоваться таким\nсосудом, поскольку здесь нет смеси.<\/p><h3 id=\"part-281\">Кувшин с сеткой в крышке<\/h3><p><strong>84.<\/strong> Если у кувшина в крышке\nимеется сетка, предназначенная для\nотделения напитка от находящихся в нём\nкубиков льда, сетку в крышке следует\nрассматривать подобно сетке, находящейся\nв чайнике, о которой говорилось выше в\nпункте 76: некоторые запрещают, а некоторые\nразрешают.<\/p><p>Однако даже по мнению тех, кто запрещает,\nзапрет существует только тогда, когда\nкубики льда считаются смешанными с\nводой. Но пока они крупные и хорошо\nразличимы, по-видимому, это не считается\nсмесью. См. выше примечание 19.<\/p><p>Только после того, как они частично\nрастаяли, они считаются смешанными с\nводой.<\/p><h3 id=\"part-282\">Борер ложкой или вилкой<\/h3><p><strong>85.<\/strong> Разрешено извлекать из\nсмеси тот вид пищи, который человек\nхочет немедленно съесть, даже если он\nберёт его ложкой или вилкой. Это не\nсчитается борер с помощью приспособления.\nСм. примечание.<\/p><h3 id=\"part-283\">Очистка фруктов ножом<\/h3><p><strong>86.<\/strong> Разрешено чистить фрукты\nнепосредственно перед едой, даже если\nчеловек чистит их ножом.<\/p><h3 id=\"part-284\">Очистка фруктов овощечисткой<\/h3><p><strong>87.<\/strong> Запрещено чистить фрукты\nовощечисткой, даже если человек делает\nэто непосредственно перед едой.<\/p><h3 id=\"part-285\">Удаление косточек из оливок\nспециальным приспособлением<\/h3><p><strong>88.<\/strong> Приспособление, предназначенное\nдля удаления косточек из оливок, считается\nинструментом, специально предназначенным\nдля борер, и запрещено пользоваться им.<\/p><p>Кроме того, в данном случае есть\nдополнительная причина для запрета,\nпоскольку человек отделяет отходы от\nпищи.<\/p><h3 id=\"part-286\">Использование орехокола<\/h3><p><strong>89.<\/strong> Разрешено пользоваться\nорехоколом. Это не подобно использованию\nовощечистки, поскольку орехокол не\nотделяет скорлупу от пищи, а лишь\nраскалывает скорлупу.<\/p><h3 id=\"part-287\">\n<font size=\"5\">Очистка фруктов<\/font><\/h3><p>Поским писали, что использование\n\t\t\t\tовощечистки для очистки фруктов\n\t\t\t\tрассматривается как отделение отходов\n\t\t\t\tот пищи, и основывали свои слова на\n\t\t\t\tИерусалимском Талмуде, в трактате\n\t\t\t\tШаббат, глава «Клаль гадоль», где\n\t\t\t\tсказано: тот, кто измельчает чеснок,\n\t\t\t\tкогда очищает его от шелухи, обязан\n\t\t\t\tза нарушение борер. Они объяснили,\n\t\t\t\tчто имеется в виду: когда человек\n\t\t\t\tснимает шелуху чеснока, он отделяет\n\t\t\t\tшелуху от пищи.<\/p><p>Поским задали вопрос: в Гемаре в\n\t\t\t\tнескольких местах мы находим, что\n\t\t\t\tразрешено очищать фрукты. См. Бейца\n\t\t\t\t13, где в доме Рава для него очищали\n\t\t\t\tбольшое количество ячменя. Также в\n\t\t\t\tМишне, Шаббат 122, сказано, что разрешено\n\t\t\t\tраскалывать орехи в Шаббат.<\/p><p>Они ответили, что следует различать\n\t\t\t\tмежду очисткой фруктов для немедленного\n\t\t\t\tупотребления, которая является обычным\n\t\t\t\tспособом еды и разрешена, и очисткой\n\t\t\t\tне для немедленного употребления,\n\t\t\t\tкоторая является мелахой и за которую\n\t\t\t\tчеловек обязан.<\/p><p>Однако это всё ещё требует объяснения:\n\t\t\t\tведь при снятии кожуры человек удаляет\n\t\t\t\tотходы от пищи, так почему же это\n\t\t\t\tразрешено для немедленного употребления,\n\t\t\t\tесли запрещено отделять отходы от\n\t\t\t\tпищи даже для немедленного употребления?<\/p><p>Поским объяснили, что поскольку\n\t\t\t\tневозможно добраться до пищи иначе,\n\t\t\t\tкак посредством удаления кожуры,\n\t\t\t\tудаление кожуры считается обычным\n\t\t\t\tспособом еды и не имеет статуса мелахи.\n\t\t\t\tЭто отличается от обычного отделения\n\t\t\t\tотходов от пищи, когда человек может\n\t\t\t\tотделить саму пищу от отходов; поэтому\n\t\t\t\tдействие по удалению отходов в таком\n\t\t\t\tслучае получает статус мелахи.<\/p><p>Но если человек очищает фрукт не\n\t\t\t\tдля немедленного употребления, он\n\t\t\t\tобязан, поскольку в таком случае его\n\t\t\t\tдействие не считается обычным способом\n\t\t\t\tеды. Ведь даже отделение пищи от\n\t\t\t\tотходов не считается обычным способом\n\t\t\t\tеды, если человек не употребляет её\n\t\t\t\tнемедленно.<\/p><h3 id=\"part-288\">Очистка фруктов и овощей<\/h3><p><strong>90.<\/strong> Поским писали, что очистка\nфруктов и овощей считается действием\nборер, и разрешена только в том случае,\nесли человек очищает фрукты непосредственно\nперед едой. См. выше пункт 48, где\nобъясняется, какой промежуток времени\nсчитается «непосредственно перед едой».<\/p><h3 id=\"part-289\">Очистка яиц и лука<\/h3><p><strong>91.<\/strong> Если человек хочет\nприготовить яичный салат и ему нужно\nочистить яйца и лук, он должен делать\nэто только непосредственно перед едой.\nЕсли он сделал это не непосредственно\nперед едой, а, например, до похода в\nсинагогу и т. п., это является полным\nзапретом.<\/p><p>Что касается использования яиц или\nлука постфактум, см. далее пункты 127–129\nи примечание 151.<\/p><h3 id=\"part-290\">Удаление листьев салата<\/h3><p><strong>92.<\/strong> У кочана салата, внешние\nлистья которого непригодны для еды,\nразрешено удалить эти листья, чтобы\nдобраться до внутренних, при условии,\nчто это делается непосредственно перед\nедой.<\/p><p>Причина в том, что внешние листья\nподобны кожуре продукта.<\/p><h3 id=\"part-291\">Снятие кожи с курицы<\/h3><p><strong>93.<\/strong> Кожу с приготовленной\nкурицы разрешено снимать непосредственно\nперед едой, подобно очистке кожуры\nфрукта.<\/p><h3 id=\"part-292\">Очистка яблок<\/h3><p><strong>94.<\/strong> Поским разошлись во мнениях\nотносительно яблочной кожуры: следует\nли считать её кожурой, которая не\nупотребляется в пищу, и поэтому разрешать\nеё снятие только непосредственно перед\nедой, или же разрешено очищать яблоко\nдаже не непосредственно перед едой.<\/p><p>Если яблоко покрыто каким-либо\nвеществом, относительно которого есть\nопасение запрета, см. примечание.<\/p><h3 id=\"part-293\">Очистка огурца и моркови<\/h3><p><strong>95.<\/strong> Огурец и морковь следует\nочищать только непосредственно перед\nедой.<\/p><h3 id=\"part-294\">Удаление белой кожуры с\nапельсина<\/h3><p><strong>96.<\/strong> Если после очистки апельсина\nна плоде остаётся белая кожура, следует\nразличать три случая:<\/p><p><strong>а)<\/strong> Если белая кожура полностью\nпокрывает плод и невозможно добраться\nдо плода, не удалив её, она имеет статус\nобычной кожуры фрукта, и разрешено\nснимать её непосредственно перед едой.<\/p><p><strong>б)<\/strong> Если белой кожуры осталось\nнемного и большинство людей не придают\nзначения её удалению, она считается\nчастью плода, и здесь вообще нет запрета\nборер. То же относится к волокнам на\nбанане.<\/p><p><strong>в)<\/strong> Если белая кожура находится\nв центре апельсина между дольками в\nвиде волокон, её закон подобен закону\nкосточек фруктов, который будет объяснён\nв следующих пунктах. В этом вопросе\nМишна Брура и Хазон Иш разошлись во\nмнениях.<\/p><h3 id=\"part-295\">Удаление косточки из фрукта<\/h3><p><strong>97.<\/strong> Относительно фруктов с\nкосточкой, например абрикоса, персика\nили сливы, поским разошлись во мнениях.<\/p><p>Мнение Мишна Бруры состоит в том, что\nразрешено вынимать косточку из фрукта,\nкогда человек держит его в руке, чтобы\nсъесть. Он добавляет, что, возможно, это\nразрешено даже тогда, когда он не держит\nфрукт в руке, если делает это непосредственно\nперед трапезой.<\/p><p>Мнение Хазон Иша — запрещено удалять\nкосточку из фрукта, поскольку это\nотделение отходов от пищи. Вместо этого\nчеловек должен есть фрукт, пока не дойдёт\nдо косточки. Если он хочет отделить\nкосточку от фрукта, ему следует держать\nкосточку и подтягивать к себе фрукт.\nТаким образом, он отделяет пищу от\nотходов, при условии что делает это\nнепосредственно перед трапезой.<\/p><p>Если человек готовит яблоко к\nупотреблению и хочет удалить из него\nкосточки, это, по-видимому, зависит от\nприведённого выше спора.<\/p><h3 id=\"part-296\">Косточки арбуза<\/h3><p><strong>98.<\/strong> Относительно косточек\nарбуза существует сомнение в законе.\nЕсть основание уподобить их косточкам\nфруктов, и тогда этот вопрос зависит от\nспора, приведённого в предыдущем пункте.<\/p><p>По мнению Мишна Бруры, человек может\nудалить косточки, когда держит кусок\nарбуза и собирается его съесть; возможно,\nчто это разрешено даже до того, как он\nвзял кусок в руку, если делает это\nнепосредственно перед едой.<\/p><p>По мнению Хазон Иша, нет разрешения\nудалять косточки, поскольку человек\nможет есть сам арбуз и выплёвывать\nкосточки изо рта.<\/p><p>Есть основание рассмотреть возможность\nзапретить их удаление согласно всем\nмнениям. См. примечание.<\/p><h3 id=\"part-297\">Косточки дыни<\/h3><p><strong>99.<\/strong> Если человек разрезал дыню\nдля еды на две половины, ему разрешено\nвылить из неё косточки вместе с находящейся\nвнутри жидкостью. Также разрешено\nочистить ложкой внутреннюю часть дыни\nот остатков жидкости и прилипших\nкосточек.<\/p><p>После этого он разрезает дыню на\nдольки.<\/p><p>Если он хочет снять кожуру дыни с\nдолек, ему следует положить дольку на\nтарелку, держать её одной рукой, а другой\nрукой провести ножом между кожурой и\nмякотью. В таком случае он отделяет пищу\nот отходов, и это разрешено согласно\nвсем мнениям, если он делает это\nнепосредственно перед трапезой.<\/p><h3 id=\"part-298\">Плодоножки фруктов<\/h3><p><strong>100.<\/strong> Удаление плодоножки с\nфрукта подобно тому, что было объяснено\nв пункте 97 относительно удаления косточки\nиз фрукта.<\/p><p>По мнению Мишна Бруры, разрешено\nудалять плодоножку, когда человек держит\nфрукт в руке, чтобы съесть его. Он\nдобавляет, что, возможно, это разрешено\nдаже тогда, когда человек не держит его\nв руке, если делает это непосредственно\nперед трапезой.<\/p><p>По мнению Хавот Даат, нет разрешения\nудалять плодоножку с фрукта. Следует\nдержать плодоножку одной рукой, а другой\nрукой подтягивать к себе фрукт.<\/p><p><strong>101.<\/strong> Нельзя отделять виноград\nот грозди иначе как непосредственно\nперед трапезой.<\/p><h3 id=\"part-299\">Кости рыбы<\/h3><p><strong>102.<\/strong> Человек, который ест рыбу\nс костями, должен остерегаться нарушить\nзапрет борер, поскольку отделение костей\nот рыбы запрещено как отделение отходов\nот пищи.<\/p><p>Поэтому следует держать одной рукой\nкость и подтягивать к себе пищу. Таким\nобразом, он отделяет пищу от отходов.<\/p><p><strong>103.<\/strong> Однако Мишна Брура пишет,\nчто относительно тех, кто придерживается\nоблегчённого мнения и вынимает кости\nиз рыбы непосредственно перед трапезой,\nне следует им препятствовать.<\/p><p>Хазон Иш пишет, что для этого вообще\nнет разрешения. См. примечание.<\/p><p><strong>104.<\/strong> Если человек вынимает из\nрыбы кость, на которой осталось немного\nмяса рыбы, и его намерение состоит в\nтом, чтобы привести пищу в надлежащее\nсостояние, см. выше пункт 64: по мнению\nМишна Бруры это разрешено, а по мнению\nХазон Иша — запрещено.<\/p><p><strong>105.<\/strong> Но если человек берёт\nкость и съедает находящееся на ней мясо\nили высасывает его, а затем выбрасывает\nкость, по-видимому, это разрешено даже\nпо мнению Хазон Иша, даже если его\nосновное намерение — привести пищу в\nнадлежащее состояние, поскольку здесь\nон занимается действием, являющимся\nобычным способом еды.<\/p><h3 id=\"part-300\">Бумажные обёртки на продуктах<\/h3><p><strong>106. Бумага на колбасе или жёлтом\nсыре<\/strong><br/>\nНекоторые поским писали,\nчто бумага, находящаяся на колбасе или\nжёлтом сыре, имеет статус кожуры, и\nпоэтому её нельзя снимать иначе как\nнепосредственно перед трапезой. См.\nпримечание 117. Что касается снятия бумаги\nс нарезанной колбасы — см. примечание.<\/p><p><strong>107. Бумага на конфете<\/strong><br/>\nБумагу,\nобёртывающую конфету, разрешено снимать\nдаже не непосредственно перед едой,\nпоскольку она не рассматривается как\nкожура плода, а является лишь обёрткой,\nтогда как сама пища находится внутри\nнеё, подобно предмету, находящемуся в\nкоробке.<\/p><p><strong>108. Бумажная обёртка мороженого<\/strong><br/>\nРазрешено\nснимать бумажную обёртку с мороженого\nдаже не непосредственно перед едой. Что\nкасается разрывания бумаги — см. далее,\nглаву 12, <font face=\"Tahoma\"><span>סעיף <\/span><\/font>24.<\/p><p><strong>109. Бумага на дне пирога<\/strong><br/>\nРазрешено\nснимать бумагу, приклеенную ко дну\nпирога, даже не непосредственно перед\nтрапезой, поскольку пирог и находящаяся\nпод ним бумага совершенно отчётливо\nразличимы. Это подобно извлечению пирога\nиз формы для выпечки.<\/p><p><strong>110. Этикетка на халле<\/strong><br/>\nНе\nследует снимать этикетку, прикреплённую\nк халле, поскольку она считается подобной\nкожуре. Поэтому следует снять её вместе\nс частью халлы, и в таком случае нет\nзапрета борер.<\/p><p><strong>111. Этикетка на фрукте<\/strong><br/>\nЕсли\nна фрукт, например на яблоко, приклеена\nэтикетка, которую можно легко снять, по\nсути закона, по-видимому, разрешено\nснять её даже не непосредственно перед\nедой, поскольку она вообще не смешана\nс фруктом, а лишь находится на его\nповерхности. Если же человек хочет\nучесть мнение, согласно которому она\nимеет статус кожуры и её снятие связано\nс запретом борер, следует снять её вместе\nс небольшим количеством мякоти фрукта.<\/p><h3 id=\"part-301\">\n<font size=\"5\">Мытьё фруктов<\/font><\/h3><p>В Мишне, Шаббат, 140б, сказано: «Не\n\t\t\t\t\tпромывают каршинним и не протирают\n\t\t\t\t\tих». Раши объясняет: «Нельзя наливать\n\t\t\t\t\tна них воду в сосуде, чтобы отделить\n\t\t\t\t\tот них отходы, и нельзя протирать их\n\t\t\t\t\tрукой, чтобы удалить отходы».<\/p><p>Каршинним — это вид зерна,\n\t\t\t\t\tпредназначенный главным образом для\n\t\t\t\t\tкорма животных, в котором смешаны\n\t\t\t\t\tземля и мелкие камни. Посредством\n\t\t\t\t\tзамачивания в воде или протирания\n\t\t\t\t\tрукой земля и камни отделяются от\n\t\t\t\t\tкаршинним.<\/p><p>Из формулировки Мишны следует, и\n\t\t\t\t\tтак пишут поским, что не разрешается\n\t\t\t\t\tсовершать эти действия даже\n\t\t\t\t\tнепосредственно перед едой.<\/p><p>Мишна Брура пишет, что то же самое\n\t\t\t\t\tотносится к картофелю: запрещено\n\t\t\t\t\tзамачивать картофель в воде для\n\t\t\t\t\tудаления находящейся на нём земли.\n\t\t\t\t\tСогласно этому, запрещено замачивать\n\t\t\t\t\tгроздь винограда в воде для того,\n\t\t\t\t\tчтобы отделить от неё смешавшиеся с\n\t\t\t\t\tней загрязнения.<\/p><p>Что касается мытья одного отдельного\n\t\t\t\t\tфрукта от загрязнения, которое\n\t\t\t\t\tприлипло к нему снаружи, поским не\n\t\t\t\t\tразъяснили, относится ли и это к\n\t\t\t\t\tданному запрету, или поскольку здесь\n\t\t\t\t\tнет отделения отходов, смешанных\n\t\t\t\t\tмежду плодами, это не считается\n\t\t\t\t\tдействием борер. См. примечание 159.<\/p><p>Подробные законы этого вопроса\n\t\t\t\t\tбудут разъяснены далее.<\/p><p><strong>112.<\/strong> Запрещено замачивать\nгроздь винограда в воде с целью отделить\nот неё смешавшиеся с ней загрязнения,\nи даже непосредственно перед едой это\nзапрещено. Также запрещено держать\nгроздь в руках и промывать её водой,\nчтобы удалить смешавшиеся с ней\nзагрязнения. См. объяснение причины в\nпримечании 129. Также запрещено замачивать\nв воде фрукты, в которых смешаны земля\nили насекомые, например клубнику или\nизюм, чтобы удалить отходы с фруктов.<\/p><p><strong>113.<\/strong> Если на фрукте прилипли\nзагрязнения или к нему после падения\nприлипла земля, мнение многих современных\nпоским — разрешено помыть его\nнепосредственно перед едой. Однако от\nимени Хазон Иша приводят, что он запрещал\nэто. См. примечание 117.<\/p><p><strong>114.<\/strong> Если на фруктах нет заметных\nзагрязнений, которые были бы с ними\nсмешаны, и человек хочет помыть их от\nпыли, находящейся на их поверхности,\nэто разрешено, поскольку фрукты пригодны\nдля еды и без мытья, а моет он их только\nдля очистки.<\/p><p><strong>115.<\/strong> Если на фрукте остались\nследы вещества для опрыскивания, причём\nони заметны, его закон такой же, как\nизложено выше, в <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>113, относительно фрукта, к которому\nприлипли загрязнения.<\/p><p><strong>116.<\/strong> Если человек хочет замочить\nлистья салата в воде, а затем промыть\nкаждый лист отдельно под струёй воды:\nесли во время замачивания листьев\nзагрязнения отделяются от них и всплывают\nна поверхность или оседают на дно сосуда,\nэто запрещено, подобно замачиванию\nкаршинним, о котором говорилось выше\nво введении.<\/p><p>Если же во время замачивания листьев\nзагрязнения не отделяются от них, а\nпесок и загрязнения выпадают только\nтогда, когда каждый лист промывают\nотдельно, см. выше <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>113 и сказанное там в примечании.<\/p><p><strong>117.<\/strong> Если достают халлу из\nморозильника и на ней имеется иней,\nследует остерегаться снимать иней,\nнаходящийся между трещинами халлы. Что\nкасается инея, лежащего на поверхности\nхаллы, по-видимому, его закон такой же,\nкак изложено выше в <font face=\"Tahoma\"><span>סעיף\n<\/span><\/font>113.<\/p><h3 id=\"part-302\">Мытьё посуды<\/h3><p><strong>118.<\/strong> Несмотря на то, что выше\nбыло разъяснено, что мытьё фруктов\nсчитается действием борер, мыть посуду\nразрешено, и в этом вообще нет запрета\nборер.<\/p><h3 id=\"part-303\">\n<font size=\"5\">Различные формы\n\t\t\t\t\tдействия борер<\/font><\/h3><h4 id=\"part-304\"><font color=\"#000000\"><font size=\"4\">Ра<span>ссыпание<\/span>\n\t\t\t\t\tсмеси<\/font><\/font><\/h4><p>В Гемаре, Шаббат 74б, приводится\n\t\t\t\t\tслучай с Равом Биби: он подал гостям\n\t\t\t\t\tкорзину с фруктами, в которой фрукты\n\t\t\t\t\tбыли смешаны с отходами. Он не отделил\n\t\t\t\t\tпищу от отходов, а просто рассыпал и\n\t\t\t\t\tра<span>зложил<\/span> всю смесь\n\t\t\t\t\tперед гостями.<\/p><p>В Гемаре возникает сомнение: сделал\n\t\t\t\t\tли он это именно из-за запрета борер,\n\t\t\t\t\tпоскольку считал, что даже отделять\n\t\t\t\t\tпищу от отходов запрещено, а посредством\n\t\t\t\t\tрас<span>сыпания<\/span> смеси здесь\n\t\t\t\t\tнет борер, поскольку п
