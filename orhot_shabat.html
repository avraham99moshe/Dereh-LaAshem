ление воды\n\t\t\t\tразрешено, и мудрецы не установили\n\t\t\t\tзапрет, например когда это делается\n\t\t\t\tдля приготовления пищи человеку или\n\t\t\t\tживотному. Однако, согласно мнению\n\t\t\t\tраби, который считает это запретом\n\t\t\t\tТоры, оснований для подобного\n\t\t\t\tпослабления нет.<\/p><p>Практический закон: большинство\n\t\t\t\tпервых законоучителей постановили\n\t\t\t\tсогласно мнению раби Йоси, сына раби\n\t\t\t\tЙеуды: добавление воды в муку запрещено\n\t\t\t\tне Торой, а постановлением мудрецов.\n\t\t\t\tОднако Сефер а-Трума постановил\n\t\t\t\tсогласно мнению раби, что добавление\n\t\t\t\tводы в муку запрещено Торой. Принято\n\t\t\t\tпридерживаться строгого мнения Сефер\n\t\t\t\tа-Трума, за исключением определённых\n\t\t\t\tслучаев, которые будут рассмотрены\n\t\t\t\tдалее.<\/p><p>В Гемаре, трактат Зевахим, лист 94,\n\t\t\t\tразъясняется, что тот, кто кладёт\n\t\t\t\tсемена льна в воду, несёт ответственность\n\t\t\t\tза нарушение мелахи лишá. Причина\n\t\t\t\tзаключается в том, что семена льна\n\t\t\t\tобладают свойством: при замачивании\n\t\t\t\tв воде они хорошо склеиваются между\n\t\t\t\tсобой. Поэтому здесь присутствует\n\t\t\t\tмелаха лишá, даже если человек не\n\t\t\t\tсовершал никаких действий по\n\t\t\t\tзамешиванию.<\/p><p>Из этого следует, что в любом случае,\n\t\t\t\tкогда само добавление воды приводит\n\t\t\t\tк образованию полноценной однородной\n\t\t\t\tмассы, это считается полноценной\n\t\t\t\tмелахой даже согласно мнению раби\n\t\t\t\tЙоси, сына раби Йеуды.<\/p><p>В Иерусалимском Талмуде, глава\n\t\t\t\t«Клаль Гадоль», сказано: «Тот, кто\n\t\t\t\tзамешивает, раскатывает и обрабатывает\n\t\t\t\tтесто, несёт ответственность за мелаху\n\t\t\t\tлишá». Объяснение состоит в том, что\n\t\t\t\tраскатывание и обработка придают\n\t\t\t\tтесту более совершенный вид, поэтому\n\t\t\t\tвсе эти действия входят в мелаху лишá.<\/p><h2 id=\"part-382\"><font color=\"#000000\"><font face=\"Times New Roman, serif\"><font size=\"5\"><b><span>Виды\n\t\t\t\t<span>замешивания (<\/span><span><span><span><span style=\"font-style: normal\">жидкого\n\t\t\t\tи густого) теста (<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">”<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">Блила\n\t\t\t\tрака<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">”<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">\n\t\t\t\tили <\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">”<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">Блила\n\t\t\t\tава<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">”<\/span><\/span><\/span><\/span><span><span><span><span style=\"font-style: normal\">)<\/span><\/span><\/span><\/span><\/span><\/b><\/font><\/font><\/font><\/h2><p>В Гемаре, трактат Шаббат, лист 156,\n\t\t\t\tразъясняется, что в отношении мелахи\n\t\t\t\tлишá необходимо различать густую\n\t\t\t\tсмесь и жидкую смесь.<\/p><p>Причина заключается в том, что запрет\n\t\t\t\tзамешивания густой смеси относится\n\t\t\t\tк запретам Торы, поэтому к ней относятся\n\t\t\t\tстроже. В случае же жидкой смеси запрет\n\t\t\t\tимеет силу постановления мудрецов,\n\t\t\t\tпоэтому в некоторых деталях допускаются\n\t\t\t\tпослабления.<\/p><p>Определяя разницу между густой и\n\t\t\t\tжидкой смесью, Хазон Иш (симан 51, пункт\n\t\t\t\t9) пишет, что густая смесь — это тесто,\n\t\t\t\tкоторое невозможно перелить из одного\n\t\t\t\tсосуда в другой. Жидкая смесь — более\n\t\t\t\tтекучая масса, которую можно переливать\n\t\t\t\tиз одного сосуда в другой. Тем не менее\n\t\t\t\tона всё ещё считается тестообразной\n\t\t\t\tмассой, поскольку сохраняет густую\n\t\t\t\tконсистенцию и не является жидкостью.<\/p><p>Хазон Иш добавляет, что если смесь\n\t\t\t\tнастолько жидкая, что совершенно не\n\t\t\t\tобразует массы, а представляет собой\n\t\t\t\tлишь мутную воду, то запрета лишá в\n\t\t\t\tней нет вовсе, даже по постановлению\n\t\t\t\tмудрецов.<\/p><h2 id=\"part-383\">Виды смесей<\/h2><p>В Гемаре, трактат Шаббат, лист 18,\n\t\t\t\tразъясняется, что существуют два вида\n\t\t\t\tсмесей:<\/p><ol>\n<li><p>Смесь, которую можно замесить,\n\t\t\t\t\tнапример смесь воды и муки, которые\n\t\t\t\t\tпри замешивании хорошо соединяются\n\t\t\t\t\tи превращаются в единое тесто.<\/p><\/li>\n<li><p>Смесь, которую невозможно замесить,\n\t\t\t\t\tнапример вода и пепел: даже после\n\t\t\t\t\tтщательного перемешивания они не\n\t\t\t\t\tпревращаются в единое тесто. Пепел\n\t\t\t\t\tлишь собирается и скапливается\n\t\t\t\t\tблагодаря воде, но не склеивается в\n\t\t\t\t\tединую массу.<\/p><\/li>\n<\/ol><p>В той же Гемаре приводится разногласие\n\t\t\t\tмежду Абаем и Равом Йосефом.<\/p><p>Абай считает, что когда раби Йоси,\n\t\t\t\tсын раби Йеуды, говорит об отсутствии\n\t\t\t\tзапрета Торы при добавлении воды в\n\t\t\t\tмуку, это относится только к смеси,\n\t\t\t\tкоторую можно замесить. Однако в\n\t\t\t\tслучае смеси, которую невозможно\n\t\t\t\tзамесить, даже раби Йоси, сын раби\n\t\t\t\tЙеуды, согласен, что добавление воды\n\t\t\t\tв пепел<b>(1)<\/b> запрещено Торой.<\/p><div>\n<p>\n<font size=\"2\"><b>(1)<\/b> Причина\n\t\t\t\t\t\t\t\tэтого заключается в следующем: в\n\t\t\t\t\t\t\t\tслучае вещества, которое поддаётся\n\t\t\t\t\t\t\t\tсмешиванию (<\/font><font face=\"Tahoma\"><font size=\"2\"><span>בר\n\t\t\t\t\t\t\t\tגיבול<\/span><\/font><\/font><font size=\"2\">),\n\t\t\t\t\t\t\t\tсамо по себе добавление воды к муке\n\t\t\t\t\t\t\t\tне считается значимой частью работы\n\t\t\t\t\t\t\t\t(мелахи), поскольку вода лишь\n\t\t\t\t\t\t\t\tсмешивается с мукой, но они ещё не\n\t\t\t\t\t\t\t\tпревращаются в единую массу. Основная\n\t\t\t\t\t\t\t\tзначимость работы заключается в\n\t\t\t\t\t\t\t\tзавершающем этапе — во время самого\n\t\t\t\t\t\t\t\tзамешивания (<\/font><font face=\"Tahoma\"><font size=\"2\"><span>גיבול<\/span><\/font><\/font><font size=\"2\">),\n\t\t\t\t\t\t\t\tкогда ингредиенты превращаются в\n\t\t\t\t\t\t\t\tоднородное тесто.<\/font><\/p>\n<p><font size=\"2\"><b>В отличие\n\t\t\t\t\t\t\t\tот этого, в случае смеси, которая\n\t\t\t\t\t\t\t\tне поддаётся замешиванию (<\/b><\/font><font face=\"Tahoma\"><font size=\"2\"><span><b>אינה\n\t\t\t\t\t\t\t\tבת גיבול<\/b><\/span><\/font><\/font><font size=\"2\"><b>),\n\t\t\t\t\t\t\t\tдаже если её тщательно перемешать,\n\t\t\t\t\t\t\t\tона всё равно не превращается в\n\t\t\t\t\t\t\t\tединую массу. Поэтому основная суть\n\t\t\t\t\t\t\t\tзапрещённой работы заключается в\n\t\t\t\t\t\t\t\tсоединении отдельных частиц золы\n\t\t\t\t\t\t\t\tдруг с другом. Это соединение\n\t\t\t\t\t\t\t\tпроисходит благодаря тому, что вода\n\t\t\t\t\t\t\t\tсмешивается с золой. Именно поэтому\n\t\t\t\t\t\t\t\tуже в момент добавления воды к золе\n\t\t\t\t\t\t\t\tдействие приобретает статус значимой\n\t\t\t\t\t\t\t\tработы (<\/b><\/font><font face=\"Tahoma\"><font size=\"2\"><span><b>חשיבות\n\t\t\t\t\t\t\t\tמלאכה<\/b><\/span><\/font><\/font><font size=\"2\"><b>).<\/b><\/font><\/p>\n<p><font size=\"2\">Однако,\n\t\t\t\t\t\t\t\tсогласно мнению Рамбама (<\/font><font face=\"Tahoma\"><font size=\"2\"><span>הלכות\n\t\t\t\t\t\t\t\tשבת<\/span><\/font><\/font><font size=\"2\">,\n\t\t\t\t\t\t\t\t<\/font><font face=\"Tahoma\"><font size=\"2\"><span>פרק\n\t\t\t\t\t\t\t\tז׳ הלכה ה׳<\/span><\/font><\/font><font size=\"2\">;\n\t\t\t\t\t\t\t\t<\/font><font face=\"Tahoma\"><font size=\"2\"><span>פרק\n\t\t\t\t\t\t\t\tכ״א הלכה ל״ג<\/span><\/font><\/font><font size=\"2\">),\n\t\t\t\t\t\t\t\tв отношении вещества, которое не\n\t\t\t\t\t\t\t\tподдаётся замешиванию, вообще нет\n\t\t\t\t\t\t\t\tзапрета на уровне Торы, даже если\n\t\t\t\t\t\t\t\tего тщательно перемешали. Хазон Иш\n\t\t\t\t\t\t\t\tпишет там, что Рамбам придерживается\n\t\t\t\t\t\t\t\tэтого мнения в одиночку (<\/font><font face=\"Tahoma\"><font size=\"2\"><span>יחידי\n\t\t\t\t\t\t\t\tבדבר זה<\/span><\/font><\/font><font size=\"2\">).<\/font><\/p>\n<\/div><p><font size=\"3\">Рав Йосеф\n\t\t\t\tсчитает, что различия между этими\n\t\t\t\tвидами смесей нет. Даже в случае смеси,\n\t\t\t\tкоторую невозможно замесить, согласно\n\t\t\t\tмнению раби Йоси, сына раби Йеуды,\n\t\t\t\tдобавление воды в пепел запрещено\n\t\t\t\tлишь постановлением мудрецов.<\/font><\/p><p><font size=\"3\">См. также «Цион\n\t\t\t\tа-Галахa» (симан 324, <\/font><font face=\"Tahoma\"><font size=\"3\"><span>סעיף\n\t\t\t\t<\/span><\/font><\/font><font size=\"3\">1,\n\t\t\t\t<\/font><font face=\"Tahoma\"><font size=\"3\"><span>ד״ה\n\t\t\t\tאין<\/span><\/font><\/font><font size=\"3\">),\n\t\t\t\tгде сказано, что большинство первых\n\t\t\t\tзаконоучителей <b>постановили согласно\n\t\t\t\tмнению Абая<\/b>: в отношении вещества,\n\t\t\t\tкоторое невозможно замесить, даже\n\t\t\t\tраби Йоси, сын раби Йеуды, согласен с\n\t\t\t\tтем, что добавление воды в пепел\n\t\t\t\tзапрещено Торой, даже если человек\n\t\t\t\tне перемешивал их руками.<\/font><\/p><p><font size=\"3\">Хазон Иш (симан\n\t\t\t\t56, пункт 3) пишет, что, по-видимому,\n\t\t\t\tпервые законоучители постановили\n\t\t\t\tсогласно мнению Рава Йосефа: даже в\n\t\t\t\tотношении вещества, которое невозможно\n\t\t\t\tзамесить, согласно мнению раби Йоси,\n\t\t\t\tсына раби Йеуды, ответственность за\n\t\t\t\tдобавление воды в пепел наступает\n\t\t\t\tлишь после того, как человек тщательно\n\t\t\t\tперемешает их между собой.<\/font><\/p><p>Таким образом, согласно практическому\n\t\t\t\tзакону, по мнению «Беур а-Галаха»,\n\t\t\t\tвещество, которое невозможно замесить,\n\t\t\t\tимеет более строгий статус, чем\n\t\t\t\tвещество, которое можно замесить: в\n\t\t\t\tпервом случае даже раби Йоси, сын раби\n\t\t\t\tЙеуды, признаёт, что добавление воды\n\t\t\t\tзапрещено Торой.<\/p><p>Согласно же мнению Хазон Иша,\n\t\t\t\tвещество, которое невозможно замесить,\n\t\t\t\tимеет тот же статус, что и вещество,\n\t\t\t\tкоторое можно замесить. В обоих\n\t\t\t\tслучаях, согласно мнению раби Йоси,\n\t\t\t\tсына раби Йеуды, ответственность\n\t\t\t\tнаступает лишь тогда, когда человек\n\t\t\t\tзамешивает смесь или тщательно\n\t\t\t\tперемешивает её.<\/p><h2 id=\"part-384\">Замешивание с\n\t\t\t\tизменением обычного способа<\/h2><p>В Гемаре, трактат Шаббат, листы 156 и\n\t\t\t\t140, разъясняется, что в определённых\n\t\t\t\tслучаях мудрецы разрешили замешивание\n\t\t\t\tс изменением обычного способа. Хотя\n\t\t\t\tобщее правило для мелахот Шаббата\n\t\t\t\tсостоит в том, что даже выполнение\n\t\t\t\tзапрещённой работы необычным способом\n\t\t\t\tзапрещено постановлением мудрецов,\n\t\t\t\tв отношении мелахи лишá в этих случаях\n\t\t\t\tмудрецы всё же разрешили такое\n\t\t\t\tдействие.<\/p><p>Как уже объяснялось выше, в мелахе\n\t\t\t\tлишá необходимо различать два этапа:\n\t\t\t\tдобавление воды в муку и замешивание\n\t\t\t\tводы с мукой. Также было разъяснено,\n\t\t\t\tчто необходимо различать густую и\n\t\t\t\tжидкую смеси.<\/p><p>Следует знать, что даже в случаях,\n\t\t\t\tкогда мудрецы разрешили замешивание\n\t\t\t\tнеобычным способом, иногда изменение\n\t\t\t\tотносится к этапу добавления воды в\n\t\t\t\tмуку, а иногда — к этапу замешивания.\n\t\t\t\tКроме того, некоторые способы изменения\n\t\t\t\tразрешены как для густой, так и для\n\t\t\t\tжидкой смеси, тогда как другие разрешены\n\t\t\t\tтолько для жидкой смеси.<\/p><p><font size=\"3\">Подробности\n\t\t\t\tэтих законов будут разъяснены далее.<\/font><\/p><h1 id=\"part-385\"><font size=\"3\">Подробные\nзаконы мелахи лишá (замешивания)<\/font><\/h1><p>1. Тот, кто в Шаббат добавляет муку в\nводу и замешивает её, совершает мелаху\nлишá, запрещённую Торой, и обязан принести\nхатат. То же относится к веществам, не\nявляющимся пищевыми продуктами: например,\nесли человек добавляет воду в цемент\nили гипс и замешивает их, он обязан\nпринести хатат.<\/p><p>2. Запрещается добавлять жидкость в\nкрошки хлеба или мацу и замешивать их,\nпоскольку это нарушает мелаху лишá.\nТакже нельзя крошить бисквиты или пирог\nи смешивать их с творогом либо фруктовым\nпюре для приготовления пищи младенцу,\nесли только это не делается необычным\nспособом, как будет разъяснено ниже, в\nпараграфах 14–17.<\/p><h2 id=\"part-386\"><font size=\"3\">С какого\nмомента возникает ответственность за\nлишá<\/font><\/h2><p>3. Относительно человека, который\nдобавляет воду в муку в Шаббат, но не\nзамешивает её, существует разногласие\nтаннаев, как было разъяснено во вступлении\nк этой главе.<\/p><p>Практический закон: большинство первых\nзаконоучителей считают, что это не\nзапрещено Торой, а запрещено постановлением\nмудрецов. Некоторые первые законоучители\nсчитают, что здесь имеется запрет Торы.\nПринято придерживаться строгого мнения,\nсогласно которому это запрещено Торой.\nОднако в определённых случаях допускаются\nпослабления в соответствии с мнением,\nчто запрет имеет силу постановления\nмудрецов, как будет разъяснено далее.<\/p><h2 id=\"part-387\"><font size=\"3\">Добавление\nгустой жидкости в муку<\/font><\/h2><p>4. Хотя, как было разъяснено, запрещается\nдобавлять воду в муку, это относится\nименно к воде, маслу и подобным жидкостям,\nкоторые проникают в муку и смешиваются\nс ней. Однако если человек добавляет\nгустое вещество, которое не проникает\nв муку, например майонез, само добавление\nне запрещено и разрешено.<\/p><p>Однако это разрешение относится только\nк этапу добавления вещества в пищу.\nЗамешивать майонез с пищей можно лишь\nв соответствии с правилами разрешённого\nзамешивания необычным способом, которые\nбудут разъяснены ниже, в параграфах\n14–18.<\/p><h2 id=\"part-388\"><font size=\"3\">Разжижение\nтеста<\/font><\/h2><p>5. Если тесто было хорошо замешано до\nнаступления Шаббата, разрешается\nдобавить в него воду в Шаббат и перемешать,\nпоскольку такое перемешивание совершенно\nне способствует замешиванию теста, а,\nнапротив, делает его более жидким.<\/p><p>Однако если тесто до наступления\nШаббата не было хорошо замешано и его\nчасти ещё недостаточно соединились\nдруг с другом, а добавление воды и\nперемешивание улучшают замешивание,\nэто запрещено и относится к мелахе лишá.<\/p><h2 id=\"part-389\"><font size=\"3\">Приготовление\nтхины в Шаббат<\/font><\/h2><p>6. Запрещается готовить в Шаббат блюдо\nиз молотого кунжута, называемое тхиной,\nпоскольку при добавлении воды в сырую\nтхину и её перемешивании частицы тахины\nсоединяются и склеиваются, образуя\nгустую массу.<\/p><p>Если же блюдо было приготовлено и\nхорошо замешано до наступления Шаббата,\nразрешается добавить в него воду в\nШаббат и перемешать: вода лишь разжижает\nмассу.<\/p><p>Но если до наступления Шаббата блюдо\nне было хорошо перемешано, а в Шаббат\nчеловек добавляет в него воду и замешивает,\nэто запрещено, поскольку такое замешивание\nприводит к более плотному соединению\nчастей массы.<\/p><h2 id=\"part-390\"><font size=\"3\">Перемешивание\nжидкости, выступившей на поверхности\nтестообразной массы<\/font><\/h2><p>7. Если тестообразная масса была\nприготовлена и хорошо замешана до\nШаббата, а часть жидкости отделилась\nот неё и выступила на поверхность,\nразрешается перемешать эту жидкость с\nмассой. Это не относится к мелахе лишá,\nпоскольку масса уже была хорошо замешана,\nа перемешивание жидкости делает её\nболее жидкой.<\/p><p>Такое часто встречается в арахисовой\nпасте, которая долго стояла и на\nповерхности которой выступило масло.\nПодобное также бывает с различными\nсалатами, которые долго хранились.<\/p><p>Однако если отделилось так много\nмасла, что сама масса или её часть стала\nрассыпчатой, и при перемешивании жидкость\nвновь соединяет её части в единую массу,\nтакое замешивание разрешается только\nс одним из изменений обычного способа,\nкоторые будут перечислены ниже, в\nпараграфе 17.<\/p><h2 id=\"part-391\"><font size=\"3\">Смешивание\nдвух масс<\/font><\/h2><p>8. Некоторые законоучители писали, что\nзапрещается смешивать между собой две\nмассы из разных продуктов из-за запрета\nлишá. Поэтому запрещается смешивать\nваренье, мёд или сметану с мягким\nтворогом, если только это не делается\nнеобычным способом, как будет разъяснено\nдалее. Другие законоучители разрешали\nэто.<\/p><p>9. Однако разрешается смешивать две\nодинаковые массы, например творог с\nтворогом, тахину с тахиной и тому\nподобное.<\/p><h2 id=\"part-392\"><font size=\"3\">Замешивание\nизмельчённых фруктов<\/font><\/h2><p>10. Если фрукт был измельчён в Шаббат\nразрешённым способом, разрешается\nхорошо перемешать его и замесить в\nединую массу, даже если он склеивается\nблагодаря собственной естественной\nвлажности. Однако добавлять в него\nкакую-либо жидкость и перемешивать\nзапрещается.<\/p><p>11. Поэтому тому, кто хочет измельчить\nбанан и дать его младенцу, следует\nизмельчить его разрешённым способом,\nа именно обратной стороной ножа. После\nтого как банан измельчён, разрешается\nперемешать его и собрать в единую массу,\nдаже если он склеивается благодаря\nсобственной влажности. Однако добавлять\nв него другую жидкость запрещается.<\/p><h2 id=\"part-393\"><font size=\"3\">Замешивание\nнепосредственно перед едой<\/font><\/h2><p>12. Поским писали, что не следует\nразрешать замешивание пищевых продуктов\nдаже в том случае, если оно выполняется\nнепосредственно перед едой. См. примечание.<\/p><h2 id=\"part-394\">\n<font size=\"6\">Замешивание в\n\t\t\t\t\tготовом блюде<\/font><\/h2><p>Рамбам пишет в респонсе № 109,\n\t\t\t\t\tприведённой в <span>Бейт Йосефе\n\t\t\t\t\tв конце<\/span> симан<span>а<\/span> 321:\n\t\t\t\t\tесли на огне оставили кастрюлю с\n\t\t\t\t\tмясом и крупой, то в Шаббат разрешается\n\t\t\t\t\tснять её с огня, тщательно и энергично\n\t\t\t\t\tперемешать, пока крупа, мясо и вода\n\t\t\t\t\tне соединятся в единую однородную\n\t\t\t\t\tмассу. Иногда в блюдо добавляют\n\t\t\t\t\tгорячую воду — в зависимости от того,\n\t\t\t\t\tсколько ему требуется.<\/p><p>Причина заключается в следующем:\n\t\t\t\t\tесли, как мы учили, чеснок, незрелый\n\t\t\t\t\tвиноград и колосья, измельчённые и\n\t\t\t\t\tрастёртые до наступления Шаббата,\n\t\t\t\t\tразрешается окончательно растирать\n\t\t\t\t\tв Шаббат, то тем более это разрешено\n\t\t\t\t\tв отношении данной крупы, которая\n\t\t\t\t\tуже была растёрта в ступке и полностью\n\t\t\t\t\tсварена. Ей остаётся лишь немного\n\t\t\t\t\tдополнительного измельчения и\n\t\t\t\t\tперемешивания.<\/p><p>Рамбам также кратко приводит этот\n\t\t\t\t\tзакон в главе 21 законов Шаббата,\n\t\t\t\t\tгалаха 13; см. там.<\/p><p>На первый взгляд, следует разобраться:\n\t\t\t\t\tдаже если здесь нет нарушения мелахи\n\t\t\t\t\tтохен, почему такое действие не\n\t\t\t\t\tзапрещено из-за мелахи лишá? Ведь в\n\t\t\t\t\tрезультате перемешивания крупы с\n\t\t\t\t\tмясом образуется единая масса. См.\n\t\t\t\t\tпримечание, где мы подробно разбираем\n\t\t\t\t\tпричину этого.<\/p><p>13. Разрешается тщательно перемешать\nблюдо, содержащее соус, и превратить\nего в единую массу; в этом нет запрета\nлишá. Разрешается также добавить в это\nблюдо жидкость извне и перемешать её с\nним.<\/p><p>Что касается добавления соуса к рису\nили к картофельному пюре, см. Примечание.<\/p><h2 id=\"part-395\">\n<font size=\"6\">Замешивание\n\t\t\t\t\tнеобычным способом<\/font><\/h2><p>Во вступлении к главе о мелахе лишá\n\t\t\t\t\tбыло сказано, что в определённых\n\t\t\t\t\tслучаях мудрецы разрешили замешивание,\n\t\t\t\t\tесли оно выполняется необычным\n\t\t\t\t\tспособом. Однако в этом вопросе\n\t\t\t\t\tсуществует множество подробных\n\t\t\t\t\tзаконов, которые будут разъяснены\n\t\t\t\t\tдалее.<\/p><p>1. Как было разъяснено выше,\n\t\t\t\t\tзаконоучители спорят о том, запрещено\n\t\t\t\t\tли Торой добавление воды в муку без\n\t\t\t\t\tпоследующего замешивания. Большинство\n\t\t\t\t\tпоским считают, что закон соответствует\n\t\t\t\t\tмнению раби Йоси, сына раби Йеуды,\n\t\t\t\t\tсогласно которому это запрещено лишь\n\t\t\t\t\tпостановлением мудрецов, а запрет\n\t\t\t\t\tТоры возникает только при самом\n\t\t\t\t\tзамешивании. Некоторые поским считают,\n\t\t\t\t\tчто закон соответствует мнению раби,\n\t\t\t\t\tсогласно которому это запрещено\n\t\t\t\t\tТорой уже при добавлении воды в муку.<\/p><p>Принято учитывать строгое мнение,\n\t\t\t\t\tза исключением определённых случаев,\n\t\t\t\t\tкоторые будут рассмотрены далее.<\/p><p>Поэтому, если человек хочет\n\t\t\t\t\tвоспользоваться разрешением замешивать\n\t\t\t\t\tнеобычным способом, то, согласно\n\t\t\t\t\tмнению большинства поским, упомянутых\n\t\t\t\t\tвыше, которые считают, что запрет\n\t\t\t\t\tТоры возникает только при самом\n\t\t\t\t\tзамешивании, достаточно изменить\n\t\t\t\t\tспособ замешивания. При добавлении\n\t\t\t\t\tводы в тесто изменять способ не\n\t\t\t\t\tтребуется.<\/p><p>Однако, согласно мнению некоторых\n\t\t\t\t\tпоским, упомянутых выше, которые\n\t\t\t\t\tсчитают, что добавление воды в муку\n\t\t\t\t\tуже запрещено Торой, недостаточно\n\t\t\t\t\tизменить только способ замешивания.\n\t\t\t\t\tВедь нарушение возникает уже в момент\n\t\t\t\t\tдобавления воды в муку, поэтому\n\t\t\t\t\tнеобходимо изменить способ и на этом\n\t\t\t\t\tэтапе.<\/p><p>2. Ранее было разъяснено, что\n\t\t\t\t\tнеобходимо различать густую и жидкую\n\t\t\t\t\tсмеси: замешивание густой смеси\n\t\t\t\t\tзапрещено Торой, а жидкой —\n\t\t\t\t\tпостановлением мудрецов.<\/p><p>В Гемаре, трактат Шаббат, лист 156,\n\t\t\t\t\tразъясняется, что на этапе добавления\n\t\t\t\t\tводы в муку не существует такого\n\t\t\t\t\tизменения обычного способа, которое\n\t\t\t\t\tразрешало бы приготовление густой\n\t\t\t\t\tсмеси. Иными словами, если человек\n\t\t\t\t\tдобавляет небольшое количество воды\n\t\t\t\t\tв муку, чтобы после смешивания и\n\t\t\t\t\tзамешивания получилась густая смесь,\n\t\t\t\t\tэто не разрешается даже при изменении\n\t\t\t\t\tспособа добавления воды.<\/p><p>Лишь в отношении жидкой смеси в\n\t\t\t\t\tГемаре приводится изменение обычного\n\t\t\t\t\tспособа, позволяющее добавлять воду.<\/p><p>И наоборот: на этапе замешивания\n\t\t\t\t\tводы с мукой в Гемаре приводятся\n\t\t\t\t\tдругие способы изменения обычного\n\t\t\t\t\tспособа, которые разрешают замешивание\n\t\t\t\t\tдаже густой смеси.<\/p><p>Один способ изменения — замешивать\n\t\t\t\t\tнебольшими порциями, хотя обычно\n\t\t\t\t\tтакое тесто замешивают в большом\n\t\t\t\t\tколичестве.<\/p><p>Другой способ — перемещать ложку,\n\t\t\t\t\tкоторой перемешивают, крест-накрест,\n\t\t\t\t\tто есть в двух пересекающихся\n\t\t\t\t\tнаправлениях, вместо того чтобы\n\t\t\t\t\tперемешивать обычным способом, как\n\t\t\t\t\tв будни.<\/p><p>Подробные законы этих способов\n\t\t\t\t\tизменения будут разъяснены далее.<\/p><p>Таким образом, если человек хочет\n\t\t\t\t\tприготовить смесь в Шаббат,\n\t\t\t\t\tвоспользовавшись разрешением на\n\t\t\t\t\tзамешивание необычным способом, то:<\/p><ul>\n<li><p>Если он собирается приготовить\n\t\t\t\t\t\tжидкую смесь, это разрешается при\n\t\t\t\t\t\tизменении порядка добавления\n\t\t\t\t\t\tжидкости.<\/p><\/li>\n<li><p>Если он собирается приготовить\n\t\t\t\t\t\tгустую смесь, это запрещено, поскольку\n\t\t\t\t\t\tпринято придерживаться мнения\n\t\t\t\t\t\tпоским, согласно которому добавление\n\t\t\t\t\t\tводы в муку уже запрещено Торой, а\n\t\t\t\t\t\tдля густой смеси не существует\n\t\t\t\t\t\tизменения способа добавления воды,\n\t\t\t\t\t\tкоторое разрешало бы это действие.<\/p><\/li>\n<\/ul><p>Исключение составляют определённые\n\t\t\t\t\tслучаи, которые будут рассмотрены\n\t\t\t\t\tдалее. В них не учитывается строгое\n\t\t\t\t\tмнение упомянутых поским, и поэтому\n\t\t\t\t\tзамешивание густой смеси разрешается\n\t\t\t\t\tнеобычным способом — посредством\n\t\t\t\t\tизменения самого замешивания.<\/p><h2 id=\"part-396\">Приготовление густой смеси\nс изменением обычного способа<\/h2><p><b>14.<\/b> Запрещается готовить густую\nсмесь в Шаббат даже необычным способом.\nПричина в том, что мы придерживаемся\nстрогого мнения, согласно которому\nдобавление воды в муку или другие\nвещества, которые можно замешивать, уже\nзапрещено Торой. Согласно этому мнению,\nне существует такого изменения обычного\nспособа, которое разрешало бы добавление\nводы в муку для приготовления густой\nсмеси. <b>(33)<\/b><\/p><p><font size=\"2\"><i><b>Пункт 33. И мы\nне находим разрешения посредством\nизменения порядка добавления жидкости\nиначе как в случае жидкой смеси (<\/b><\/i><\/font><font face=\"Tahoma\"><font size=\"2\"><span><i><b>בלילה\nרכה<\/b><\/i><\/span><\/font><\/font><font size=\"2\"><i><b>),\nзапрет на приготовление которой действует\nлишь на уровне постановления мудрецов\n(мидерабанан). <\/b><\/i><\/font>\n<\/p><p><b>15<\/b>. Однако существуют случаи, которые\nбудут разъяснены далее, когда поским\nразрешили не учитывать указанное выше\nмнение, согласно которому добавление\nводы в муку запрещено Торой. В этих\nслучаях запрет лишá относится только\nк самому замешиванию, поэтому достаточно\nизменить способ замешивания, как будет\nразъяснено ниже, в параграфе 17. Это\nразрешено даже для густой смеси.<\/p><p>Тем не менее поским писали, что даже\nв этих случаях желательно изменить\nтакже порядок добавления воды в муку.<\/p><p>К таким случаям относятся:<\/p><p><b>а.<\/b> Если блюдо невозможно приготовить\nдо наступления Шаббата, поскольку его\nвкус испортится, разрешается приготовить\nего в Шаббат, изменив способ замешивания.\nЭто разрешение действует даже для густой\nсмеси. Поским писали, что желательно\nизменить также порядок добавления\nжидкости.<\/p><p><b>б.<\/b> Если человек хочет приготовить\nтесто для пищи младенцу, разрешается\nсделать это в Шаббат, изменив способ\nзамешивания.<\/p><p><b>в.<\/b> В случае крайней необходимости\nразрешается попросить нееврея добавить\nводу в муку. Поскольку просьба к нееврею\nзапрещена лишь постановлением мудрецов,\nв данном случае нет необходимости\nучитывать мнение раби. После этого еврей\nможет продолжить замешивание, изменив\nобычный способ.<\/p><p>Хотя выше были перечислены случаи, в\nкоторых разрешается замешивать густую\nсмесь необычным способом, всё это\nотносится именно к смесям, которые можно\nзамесить в единую массу.<\/p><p>Но если речь идёт о смесях, которые\nневозможно замесить, то есть даже при\nперемешивании они не склеиваются в\nединый комок, например густая смесь\nводы и песка, — в этом вопросе существует\nразногласие между Мишна Брура и Хазон\nИшем.<\/p><p>Мишна Брура считает, что в отношении\nвещества, которое невозможно замесить,\nдобавление воды запрещено Торой. Поэтому\nнет оснований для послабления даже при\nприготовлении пищи младенцу или блюда,\nкоторое невозможно было приготовить\nдо наступления Шаббата.<\/p><p>Хазон Иш считает, что даже в отношении\nвеществ, которые невозможно замесить,\nв перечисленных выше случаях можно\nразрешить замешивание при условии\nизменения способа замешивания. См.\nпримечание.<\/p><h2 id=\"part-397\"><font size=\"3\">Изменение\nспособа замешивания<\/font><\/h2><p>17. Изменить способ замешивания можно\nследующим образом.<\/p><p>а. Замешивание движениями крест-накрест.\nВместо того чтобы перемешивать смесь\nобычным способом, следует ввести ложку\nв смесь и провести ею один раз в одном\nнаправлении, а затем один раз в\nперпендикулярном направлении. Между\nэтими движениями ложку следует вынимать\nиз смеси. Это действие можно повторять\nмного раз.<\/p><p>б. Замешивание небольшими порциями.\nЕсли обычно данное блюдо готовят в\nбольшом количестве, следует каждый раз\nзамешивать лишь небольшое количество.\nСм. примечание.<\/p><p>Однако это разрешение действует только\nв том случае, когда очевидно, что\nзамешивание небольшого количества\nдействительно представляет собой\nсущественное изменение обычного способа.<\/p><p>Хазон Иш писал, что нельзя разрешать\nзамешивание муки из мацы небольшими\nпорциями, поскольку трудно утверждать,\nчто её обычно замешивают только в больших\nколичествах.<\/p><p>По этой же причине, если в будние дни\nопределённую смесь обычно готовят\nнебольшими порциями, нельзя разрешать\nеё приготовление в Шаббат в том же\nколичестве, которое принято в будни.<\/p><p>Следует знать, что каждое из этих\nизменений достаточно само по себе: нет\nнеобходимости выполнять оба изменения\nодновременно.<\/p><p>О дополнительных изменениях, упоминаемых\nв Гемаре, см. примечание.<\/p><h2 id=\"part-398\"><font size=\"3\">Добавление\nгустого вещества в смесь — майонез<\/font><\/h2><p>18. Как было разъяснено выше, принято\nпридерживаться строгого мнения раби,\nсогласно которому добавление воды в\nмуку запрещено Торой. По мнению Мишна\nБрура, в отношении веществ, которые\nневозможно замесить, добавление воды\nв муку, по всем мнениям, запрещено Торой.<\/p><p>Причина заключается в том, что вода\nпроникает в муку и смешивается с ней, в\nрезультате чего начинается процесс\nзамешивания.<\/p><p>Поздние законоучители писали, что это\nотносится именно к жидкостям, которые\nпроникают в вещество, например к воде,\nвину, маслу, уксусу и тому подобному.\nОднако при добавлении густого вещества,\nнапример майонеза или жира, само\nдобавление в муку не запрещено.<\/p><p>Поэтому тому, кто хочет приготовить\nтесто, добавляя майонез или подобное\nгустое вещество, разрешается сделать\nэто даже для густой смеси, при условии,\nчто он изменит способ замешивания.<\/p><h2 id=\"part-399\">\n<font size=\"6\">Приготовление\n\t\t\t\t\tжидкой смеси необычным способом<\/font><\/h2><p>Как было разъяснено выше, необходимо\n\t\t\t\t\tразличать густую и жидкую смеси:\n\t\t\t\t\tприготовление густой смеси запрещено\n\t\t\t\t\tТорой, а приготовление жидкой смеси\n\t\t\t\t\tзапрещено постановлением мудрецов.<\/p><p>В Гемаре, трактат Шаббат, лист 156,\n\t\t\t\t\tразъясняется, что мудрецы разрешили\n\t\t\t\t\tготовить жидкую смесь в Шаббат,\n\t\t\t\t\tизменив порядок добавления жидкости\n\t\t\t\t\tв муку.<\/p><p>Там также разъясняется, что это\n\t\t\t\t\tпослабление разрешает приготовление\n\t\t\t\t\tсмеси даже согласно мнению раби,\n\t\t\t\t\tкоторый обычно считает, что добавление\n\t\t\t\t\tводы в муку запрещено Торой.<\/p><p>Поским спорят о том, достаточно ли\n\t\t\t\t\tпри приготовлении жидкой смеси\n\t\t\t\t\tизменить только порядок добавления\n\t\t\t\t\tводы в муку или необходимо изменить\n\t\t\t\t\tтакже способ замешивания. Ведь,\n\t\t\t\t\tсогласно мнению раби Йоси, сына раби\n\t\t\t\t\tЙеуды, основная мелаха лишá заключается\n\t\t\t\t\tв самом замешивании. Поэтому можно\n\t\t\t\t\tпредположить, что изменение порядка\n\t\t\t\t\tдобавления воды в муку не будет\n\t\t\t\t\tдостаточным.<\/p><h2 id=\"part-400\"><font size=\"3\">Изменение\nпорядка добавления жидкости<\/font><\/h2><p>19. Разрешается приготовить жидкую\nсмесь, изменив порядок добавления воды\nв муку. То есть, если в будние дни обычно\nсначала насыпают муку, а затем добавляют\nводу, в Шаббат следует поступить иначе:\nсначала налить воду, а затем добавить\nмуку. И наоборот.<\/p><p>Однако если изменение заключается в\nтом, что муку добавляют первой, необходимо\nследить за тем, чтобы вся жидкость была\nвлита одним непрерывным потоком. Если\nсначала добавить к муке лишь небольшое\nколичество воды, то на этом этапе смесь\nокажется не жидкой, а густой. Согласно\nмнению раби, это будет нарушением запрета\nТоры.<\/p><p>20. Если же в будние дни нет установленного\nпорядка приготовления данной смеси —\nиногда сначала добавляют муку, а иногда\nжидкость, — поским спорят о том, как\nпоступать.<\/p><p>Некоторые писали, что даже в таком\nслучае можно облегчить закон, если\nсначала добавить муку, а затем жидкость.<\/p><p>Другие писали, что в этом случае нет\nразрешения готовить смесь посредством\nизменения порядка добавления ингредиентов,\nпоскольку любой выбранный порядок не\nбудет отличаться от способов приготовления,\nиспользуемых в будни.<\/p><p>Однако даже согласно строгому мнению,\nв случае необходимости можно облегчить\nзакон, изменив способ замешивания. То\nесть вместо обычного перемешивания\nследует перемешивать движениями\nкрест-накрест либо переливать смесь из\nодного сосуда в другой.<\/p><h2 id=\"part-401\"><font size=\"3\">Изменение\nспособа замешивания<\/font><\/h2><p>21. Если человек хочет приготовить\nжидкую смесь и изменил порядок добавления\nводы в муку, как было разъяснено выше,\nпоским спорят о том, необходимо ли\nизменить также способ замешивания.<\/p><p>Некоторые писали, что изменение способа\nзамешивания также обязательно.<\/p><p>Другие считали, что достаточно изменить\nпорядок добавления воды в муку.<\/p><p>Мишна Брура пишет, что желательно\nпридерживаться строгого мнения и\nизменить также способ замешивания.\nНапример, вместо перемешивания ложкой\nможно покачивать сосуд.<\/p><p>Хазон Иш придерживается более мягкого\nмнения.<\/p><h2 id=\"part-402\">\n<font size=\"6\">Замешивание\n\t\t\t\t\tизмельчённых овощей и фруктов<\/font><\/h2><p>Как было разъяснено выше, тот, кто\n\t\t\t\t\tдобавляет жидкость в муку или другие\n\t\t\t\t\tвещества и замешивает их, нарушает\n\t\t\t\t\tзапрет мелахи лишá. Поским обсуждали,\n\t\t\t\t\tраспространяется ли этот запрет\n\t\t\t\t\tтакже на добавление жидкости в\n\t\t\t\t\tизмельчённые или мелко нарезанные\n\t\t\t\t\tовощи и фрукты. Ведь добавленная\n\t\t\t\t\tжидкость не склеивает их в единое\n\t\t\t\t\tтесто. Кроме того, такая смесь не\n\t\t\t\t\tпохожа на пепел, в отношении которого\n\t\t\t\t\tсуществует запрет лишá, хотя его\n\t\t\t\t\tневозможно замесить в обычное тесто:\n\t\t\t\t\tпепел хорошо собирается в комки,\n\t\t\t\t\tтогда как мелкие кусочки овощей и\n\t\t\t\t\tфруктов так себя не ведут.<\/p><p>В Иерусалимском Талмуде, трактат\n\t\t\t\t\tШаббат, глава 7, сказано, что тот, кто\n\t\t\t\t\tв Шаббат добавляет жидкость в\n\t\t\t\t\tизмельчённый чеснок, несёт\n\t\t\t\t\tответственность за мелаху лишá.<\/p><p>С другой стороны, в Вавилонском\n\t\t\t\t\tТалмуде, трактат Шаббат, лист 140,\n\t\t\t\t\tразъясняется, что в Шаббат разрешается\n\t\t\t\t\tдобавлять жидкость в измельчённые\n\t\t\t\t\tовощи, например чеснок и шхалим, и\n\t\t\t\t\tперемешивать их, при условии, что\n\t\t\t\t\tчеловек не взбивает смесь энергично.\n\t\t\t\t\tИными словами, нельзя перемешивать\n\t\t\t\t\tеё ложкой с силой, как это обычно\n\t\t\t\t\tделают в будни, а следует перемешивать\n\t\t\t\t\tосторожно.<\/p><p>На первый взгляд, слова Вавилонского\n\t\t\t\t\tи Иерусалимского Талмудов противоречат\n\t\t\t\t\tдруг другу. Первые законоучители\n\t\t\t\t\tпредложили несколько способов\n\t\t\t\t\tразрешить это противоречие. См.\n\t\t\t\t\tПримечание.<b>(56)<\/b><\/p><div>\n<p>\n<font face=\"Arial, sans-serif\"><font size=\"1\"><b>(56)\n\t\t\t\t\t\t\t\t\t<\/b>В книге «Трумат а-Дешен», <\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סימן\n\t\t\t\t\t\t\t\t\tנ״נ<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">,\n\t\t\t\t\t\t\t\t\tа также в «Бейт Йосеф», <\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סימן\n\t\t\t\t\t\t\t\t\tשכ״א<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">,\n\t\t\t\t\t\t\t\t\tпринимается мнение, что существует\n\t\t\t\t\t\t\t\t\tзапрет замешивания (мелахат лешá)\n\t\t\t\t\t\t\t\t\tпри добавлении жидкости к растёртому\n\t\t\t\t\t\t\t\t\tчесноку и другим измельчённым\n\t\t\t\t\t\t\t\t\tовощам, как сказано в Иерусалимском\n\t\t\t\t\t\t\t\t\tТалмуде.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Что\n\t\t\t\t\t\t\t\t\tкасается упомянутой выше Гемары\n\t\t\t\t\t\t\t\t\tв трактате Шаббат, которая разрешает\n\t\t\t\t\t\t\t\t\tдобавлять жидкость в чеснок, то\n\t\t\t\t\t\t\t\t\tречь идёт о случае, когда жидкость\n\t\t\t\t\t\t\t\t\tуже была добавлена ещё накануне\n\t\t\t\t\t\t\t\t\tШаббата, а в сам Шаббат добавляют\n\t\t\t\t\t\t\t\t\tлишь дополнительное количество\n\t\t\t\t\t\t\t\t\tжидкости. В таком случае запрета\n\t\t\t\t\t\t\t\t\tзамешивания нет.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Согласно\n\t\t\t\t\t\t\t\t\tмнению Рабби Йосе бар Йегуды,\n\t\t\t\t\t\t\t\t\tкоторый считает, что добавление\n\t\t\t\t\t\t\t\t\tводы к муке само по себе не является\n\t\t\t\t\t\t\t\t\tзапретом Торы, а основная суть\n\t\t\t\t\t\t\t\t\tзапрета замешивания заключается\n\t\t\t\t\t\t\t\t\tименно в самом процессе смешивания\n\t\t\t\t\t\t\t\t\t(гибуль), разрешается добавлять\n\t\t\t\t\t\t\t\t\tжидкость в измельчённый чеснок в\n\t\t\t\t\t\t\t\t\tШаббат и перемешивать его с\n\t\t\t\t\t\t\t\t\tизменением обычного способа, то\n\t\t\t\t\t\t\t\t\tесть осторожно, без интенсивного\n\t\t\t\t\t\t\t\t\tвзбивания.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Именно\n\t\t\t\t\t\t\t\t\tтак постановил Шульхан Арух, <\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סימן\n\t\t\t\t\t\t\t\t\tשכ״א<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">,\n\t\t\t\t\t\t\t\t\t<\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סעיף\n\t\t\t\t\t\t\t\t\tי״ד<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">:\n\t\t\t\t\t\t\t\t\tразрешается добавлять в Шаббат\n\t\t\t\t\t\t\t\t\tжидкость в измельчённый чеснок и\n\t\t\t\t\t\t\t\t\tовощи и осторожно перемешивать\n\t\t\t\t\t\t\t\t\tих. Это мнение большинства\n\t\t\t\t\t\t\t\t\tзаконоучителей, которые придерживаются\n\t\t\t\t\t\t\t\t\tпозиции Рабби Йосе бар Йегуды.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">После\n\t\t\t\t\t\t\t\t\tэтого Шульхан Арух приводит и\n\t\t\t\t\t\t\t\t\tдругое мнение: нельзя добавлять\n\t\t\t\t\t\t\t\t\tжидкость в Шаббат к растёртому\n\t\t\t\t\t\t\t\t\tчесноку. Это мнение Сефер а-Трума,\n\t\t\t\t\t\t\t\t\tкоторый постановил согласно мнению\n\t\t\t\t\t\t\t\t\tРабби, а также мнение Яираим, Ор\n\t\t\t\t\t\t\t\t\tЗаруа (<\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סימן\n\t\t\t\t\t\t\t\t\tס״א<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">)\n\t\t\t\t\t\t\t\t\tи Тосафот РИД, приведённое в Риазе\n\t\t\t\t\t\t\t\t\tв книге Шилтей а-Гиборим.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\"><b>Они\n\t\t\t\t\t\t\t\t\tпридерживаются мнения, что, согласно\n\t\t\t\t\t\t\t\t\tВавилонскому Талмуду, в отношении\n\t\t\t\t\t\t\t\t\tрастёртого чеснока и подобных\n\t\t\t\t\t\t\t\t\tвеществ вообще не существует\n\t\t\t\t\t\t\t\t\tзапрета замешивания. По-видимому,\n\t\t\t\t\t\t\t\t\tпричина их мнения заключается в\n\t\t\t\t\t\t\t\t\tтом, что жидкость не склеивает эти\n\t\t\t\t\t\t\t\t\tкомпоненты в единую массу.<\/b><\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\"><b>См.\n\t\t\t\t\t\t\t\t\tтакже Хазон Иш, <\/b><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span><b>סימן\n\t\t\t\t\t\t\t\t\tנ״א<\/b><\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><b>,\n\t\t\t\t\t\t\t\t\t<\/b><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span><b>ס״ק\n\t\t\t\t\t\t\t\t\tד׳<\/b><\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><b>.\n\t\t\t\t\t\t\t\t\tИз его слов также следует, что он\n\t\t\t\t\t\t\t\t\tсклонялся к мнению, что замешивание\n\t\t\t\t\t\t\t\t\tчеснока, шхалим и других мягких\n\t\t\t\t\t\t\t\t\tовощей не запрещено на уровне Торы,\n\t\t\t\t\t\t\t\t\tа лишь постановлением мудрецов.\n\t\t\t\t\t\t\t\t\tПричина в том, что это действие не\n\t\t\t\t\t\t\t\t\tимеет такого же значения, как\n\t\t\t\t\t\t\t\t\tзамешивание золы: зола по своей\n\t\t\t\t\t\t\t\t\tприроде смешивается с водой и\n\t\t\t\t\t\t\t\t\tпревращается в жидкую грязь (тинит),\n\t\t\t\t\t\t\t\t\tтогда как овощ не превращается в\n\t\t\t\t\t\t\t\t\tоднородную жидкость, а остаётся\n\t\t\t\t\t\t\t\t\tотдельными кусочками.<\/b><\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Однако\n\t\t\t\t\t\t\t\t\tв завершение Хазон Иш пишет, что,\n\t\t\t\t\t\t\t\t\tнесмотря на это, возможно, интенсивное\n\t\t\t\t\t\t\t\t\tперемешивание с большой силой\n\t\t\t\t\t\t\t\t\tможет считаться замешиванием,\n\t\t\t\t\t\t\t\t\tзапрещённым самой Торой.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Там\n\t\t\t\t\t\t\t\t\tже Хазон Иш пишет, что, возможно,\n\t\t\t\t\t\t\t\t\tразрешение осторожно перемешивать\n\t\t\t\t\t\t\t\t\tсмесь основано не на принципе\n\t\t\t\t\t\t\t\t\tизменения обычного способа действия\n\t\t\t\t\t\t\t\t\t(шинуй), а на том, что, пока человек\n\t\t\t\t\t\t\t\t\tне взбивает смесь с силой, это\n\t\t\t\t\t\t\t\t\tдействие вообще не считается\n\t\t\t\t\t\t\t\t\tзамешиванием с точки зрения закона.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Кроме\n\t\t\t\t\t\t\t\t\tтого, следует ещё разобраться в\n\t\t\t\t\t\t\t\t\tследующем вопросе: согласно тому,\n\t\t\t\t\t\t\t\t\tчто приводит Биур Галаха в начале\n\t\t\t\t\t\t\t\t\t<\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\"><span>סימן\n\t\t\t\t\t\t\t\t\tשכ״ד<\/span><\/font><\/font><font face=\"Arial, sans-serif\"><font size=\"1\">,\n\t\t\t\t\t\t\t\t\tнекоторые первые комментаторы\n\t\t\t\t\t\t\t\t\tсчитают, что в отношении веществ,\n\t\t\t\t\t\t\t\t\tкоторые не поддаются замешиванию,\n\t\t\t\t\t\t\t\t\tмы постановляем согласно мнению\n\t\t\t\t\t\t\t\t\tАбаи в Гемаре, лист 18, который\n\t\t\t\t\t\t\t\t\tсчитает, что Рабби Йосе бар Йегуда\n\t\t\t\t\t\t\t\t\tпризнаёт наличие запрета Торы уже\n\t\t\t\t\t\t\t\t\tпри добавлении воды к муке.<\/font><\/font><\/p>\n<p><font face=\"Arial, sans-serif\"><font size=\"1\">Почему\n\t\t\t\t\t\t\t\t\tже в случае растёртого чеснока и\n\t\t\t\t\t\t\t\t\tподобных веществ разрешают в случае\n\t\t\t\t\t\t\t\t\tнеобходимости полагаться на мнение\n\t\t\t\t\t\t\t\t\tРабби Йосе бар Йегуды, не опасаясь\n\t\t\t\t\t\t\t\t\tзапрета добавления жидкости к\n\t\t\t\t\t\t\t\t\tчесноку? Ведь это тоже вещества,\n\t\t\t\t\t\t\t\t\tкоторые не поддаются замешиванию.\n\t\t\t\t\t\t\t\t\tСм. далее в конце примечания 63.<\/font><\/font><\/p>\n<\/div><p><font size=\"2\"><b>Практический\n\t\t\t\t\tзакон: из слов поским следует, что\n\t\t\t\t\tзамешивание измельчённого чеснока\n\t\t\t\t\tи других измельчённых овощей запрещено.\n\t\t\t\t\tОднако, согласно мнению большинства\n\t\t\t\t\tпоским, которые придерживаются мнения\n\t\t\t\t\tраби Йоси, сына раби Йеуды, это\n\t\t\t\t\tразрешается при изменении способа\n\t\t\t\t\tперемешивания.<\/b><\/font><\/p><p><font size=\"2\"><b>То есть если\n\t\t\t\t\tобычно смесь энергично взбивают, в\n\t\t\t\t\tШаббат её следует перемешивать\n\t\t\t\t\tосторожно либо использовать другие\n\t\t\t\t\tспособы изменения обычного способа,\n\t\t\t\t\tперечисленные выше, в параграфе 17.\n\t\t\t\t\tНапример:<\/b><\/font><\/p><ul>\n<li><p><font size=\"2\"><b>перемешивать\n\t\t\t\t\t\tдвижениями крест-накрест;<\/b><\/font><\/p><\/li>\n<li><p><font size=\"2\"><b>перемешивать\n\t\t\t\t\t\tпальцем;<\/b><\/font><\/p><\/li>\n<li><p><font size=\"2\"><b>готовить\n\t\t\t\t\t\tочень маленькими порциями, если\n\t\t\t\t\t\tобычно это блюдо готовят в большом\n\t\t\t\t\t\tколичестве.<\/b><\/font><\/p><\/li>\n<\/ul><p><font size=\"2\"><b>Согласно\n\t\t\t\t\tмнению некоторых поским, которые\n\t\t\t\t\tпридерживаются мнения раби,\n\t\t\t\t\tприготовление такой смеси в Шаббат\n\t\t\t\t\tне разрешается, поскольку уже при\n\t\t\t\t\tдобавлении жидкости в овощи человек\n\t\t\t\t\tнарушает запрет Торы.<\/b><\/font><\/p><p><font size=\"2\"><b>Как мы уже\n\t\t\t\t\tписали выше, в параграфе 14, принято\n\t\t\t\t\tпридерживаться строгого мнения.\n\t\t\t\t\tОднако если блюдо невозможно\n\t\t\t\t\tприготовить до наступления Шаббата,\n\t\t\t\t\tпоскольку его вкус испортится, поским\n\t\t\t\t\tразрешили положиться на более мягкое\n\t\t\t\t\tмнение. Подробности этого закона\n\t\t\t\t\tбудут рассмотрены далее.<\/b><\/font><\/p><p><font size=\"2\"><b>Кроме того,\n\t\t\t\t\tпоским постановили строже и в отношении\n\t\t\t\t\tовощей, которые не измельчены, а лишь\n\t\t\t\t\tочень мелко нарезаны: даже в таком\n\t\t\t\t\tслучае существует запрет лишá.<\/b><\/font><\/p><p>22. Запрет лишá распространяется также\nна измельчённые овощи и фрукты. Поэтому\nзапрещается добавлять в них жидкость.\nТакже запрещается добавлять майонез в\nовощное пюре, например в измельчённые\nбаклажаны и тому подобное, и перемешивать.<\/p><p>23. Как было разъяснено выше, в мелахе\nлишá существуют два этапа:<\/p><ol>\n<li><p>Добавление жидкости в муку.<\/p><\/li>\n<li><p>Смешивание жидкости с мукой и\n\tзамешивание их в единую массу.<\/p><\/li>\n<\/ol><p>Также было разъяснено, что согласно\nосновному закону мелаха лишá заключается\nв смешивании и замешивании воды с мукой.\nОднако принято придерживаться строгого\nмнения и учитывать запрет лишá уже на\nэтапе добавления воды в муку.<\/p><p>В случаях крайней необходимости,\nнапример при приготовлении пищи младенцу\nили блюда, вкус которого испортится,\nесли приготовить его до наступления\nШаббата, поским разрешили опираться на\nосновной закон.<\/p><p>Кроме того, выше, в параграфе 18, было\nразъяснено, что при добавлении майонеза\nи подобных густых веществ опасение\nвозникает только на этапе замешивания,\nпоскольку майонез не проникает в муку\nи не смешивается с ней так, как жидкость.<\/p><p>24. Поэтому тому, кто хочет приготовить\nблюдо из измельчённых овощей или фруктов,\nвкус которого не испортится, если\nприготовить его до наступления Шаббата,\nне следует добавлять в него жидкость в\nШаббат. Жидкость следует добавить до\nнаступления Шаббата.<\/p><p>Если жидкость была добавлена до\nнаступления Шаббата, разрешается\nперемешать её с измельчёнными овощами\nв Шаббат, изменив обычный способ.\nНапример, можно перемешивать осторожно,\nесли в будни такую смесь обычно энергично\nвзбивают; можно перемешивать движениями\nкрест-накрест, как было разъяснено выше,\nв параграфе 17; либо перемешивать пальцем.<\/p><p>25. Если человек хочет добавить майонез\nв измельчённые овощи и не собирается\nдобавлять в смесь какую-либо жидкость,\nразрешается добавить майонез в Шаббат\nи перемешать смесь движениями\nкрест-накрест.<\/p><p>26. Если речь идёт о блюде, вкус которого\nиспортится, если приготовить его до\nнаступления Шаббата, поским разрешили\nдобавлять в него жидкость в Шаббат и\nперемешивать необычным способом, как\nбыло разъяснено выше.<b>(59)<\/b><\/p><p>\n<font face=\"Arial, sans-serif\"><font size=\"1\"><b>(59)\n\t\t\t\t<\/b>Следует разобраться в следующем\n\t\t\t\tвопросе: в наше время принято заранее,\n\t\t\t\tдо наступления Шаббата, готовить\n\t\t\t\tразличные виды салатов и хранить их\n\t\t\t\tв холодильнике, причём их вкус при\n\t\t\t\tэтом практически не ухудшается.\n\t\t\t\tВозникает вопрос: не следует ли\n\t\t\t\tзапретить их приготовление в Шаббат?<\/font><\/font><\/p><p><font face=\"Arial, sans-serif\"><font size=\"1\">Ведь\n\t\t\t\tпоскольку теперь их можно приготовить\n\t\t\t\tзаранее, ещё до Шаббата, вновь следует\n\t\t\t\tвернуться к строгому мнению Рабби,\n\t\t\t\tсогласно которому существует запрет\n\t\t\t\tуже при добавлении жидкости к\n\t\t\t\tизмельчённым овощам.<\/font><\/font><\/p><p><font face=\"Arial, sans-serif\"><font size=\"1\"><b>Однако,\n\t\t\t\tпоскольку выше, в примечании 56, мы\n\t\t\t\tпривели слова нескольких первых\n\t\t\t\tкомментаторов, согласно которым в\n\t\t\t\tотношении растёртых овощей вообще\n\t\t\t\tне существует запрета замешивания,\n\t\t\t\tа весь вопрос заключается лишь в том,\n\t\t\t\tчто принято придерживаться строгого\n\t\t\t\tмнения Рабби, возможно, если человек\n\t\t\t\tне успел приготовить салаты до\n\t\t\t\tнаступления Шаббата, ему разрешается\n\t\t\t\tприготовить их в Шаббат с изменением\n\t\t\t\tобычного способа (шинуй), как было\n\t\t\t\tразъяснено выше.<\/b><\/font><\/font><\/p><p>Однако желательно изменить также\nпорядок добавления жидкости в измельчённые\nовощи. Если в будни обычно сначала кладут\nизмельчённые овощи, а затем добавляют\nжидкость, следует поступить наоборот:\nсначала налить жидкость, а затем добавить\nизмельчённые овощи.<\/p><p>27. Если человек хочет приготовить в\nШаббат пищу младенцу, разрешается\nдобавить жидкость в измельчённые фрукты\nи перемешать их движениями крест-накрест\nлибо осторожно. Если в эту смесь добавляют\nтакже хлебные крошки или сыр, необходимо\nперемешивать её именно движениями\nкрест-накрест.<\/p><h2 id=\"part-403\">Добавление жидкости в мелко\nнарезанные овощи<\/h2><p>28. Поским писали, что запрет лишá\nраспространяется также на добавление\nжидкости в мелко нарезанную редьку или\nогурцы с последующим перемешиванием,\nдаже если овощи не измельчены в пюре.<\/p><p>Однако поскольку вкус таких блюд\nпортится, если приготовить их до\nнаступления Шаббата, разрешается\nготовить их в Шаббат необычным способом:\nперемешивать осторожно, не взбивая\nэнергично. См. примечание.<\/p><p>Также было сказано, что желательно\nизменить и порядок добавления жидкости.<\/p><p>29. В отношении овощей, которые не\nнарезаны очень мелко, мелахи лишá нет.\nПоэтому разрешается перемешивать их с\nмаслом, уксусом и другими жидкостями.<\/p><p>По этой причине разрешается добавлять\nжидкость в овощной салат и салат из\nлистьев салата, поскольку такие овощи\nобычно не нарезают очень мелко.<\/p><p>\n<font size=\"6\"><b>Практические\n\t\t\t\t\tпримеры<\/b><\/font><\/p><p>Прежде чем перейти к примерам,\n\t\t\t\t\tотметим, что сказанное далее относится\n\t\t\t\t\tтолько к мелахе лишá. Помимо этого,\n\t\t\t\t\tпри приготовлении салатов в Шаббат\n\t\t\t\t\tследует остерегаться и других\n\t\t\t\t\tзапретов, например борер и тохен,\n\t\t\t\t\tподробности которых были изложены\n\t\t\t\t\tв предыдущих главах.<\/p><h2 id=\"part-404\">Практические примеры<\/h2><p>30. <b>Салат из баклажанов<\/b><\/p><p>Салат из баклажанов, приготовленный\nиз размятых баклажанов, смешанных с\nуксусом, маслом или майонезом, нельзя\nготовить в Шаббат. Однако если салат\nприготовили накануне Шаббата, а в Шаббат\nна его поверхности отделилось масло\nили что-то подобное, разрешается снова\nперемешать масло с салатом, и в этом нет\nзапрета лишá.<\/p><p>31. <b>Салат тахина<\/b><\/p><p>См. выше, раздел 6.<\/p><p>32. <b>Салат из капусты и моркови<\/b><\/p><p>Салат из капусты и моркови, нарезанных\nмелкими кусочками и смешанных с майонезом\nи уксусом, желательно приготовить\nнакануне Шаббата. Если не успели\nприготовить его до Шаббата, см. примечание\n10.<\/p><p>33. <b>Салат из моркови<\/b><\/p><p>Салат из моркови, натёртой на мелкой\nтёрке, с добавлением апельсинового сока\n— см. примечание 11.<\/p><p>34. <b>Овощной или фруктовый салат<\/b><\/p><p>Разрешается смешивать масло с овощным\nсалатом и подобными блюдами. В этом нет\nзапрета лишá, поскольку овощи не нарезаны\nочень мелко. См. также главу 5, разделы\n1–5, где объясняется, как следует нарезать\nовощи, чтобы избежать запрета тохен.<\/p><p>Также разрешается смешивать сок или\nвино с фруктовым салатом, и в этом нет\nзапрета лишá.<\/p><p>35. <b>Салат из листьев салата<\/b><\/p><p>Разрешается смешивать масло, уксус и\nмайонез с нарезанными листьями салата.\nВ этом нет запрета лишá, поскольку листья\nне нарезаны очень мелко.<\/p><p>36. <b>Картофельный салат<\/b><\/p><p>Разрешается смешивать в Шаббат майонез\nи уксус с нарезанным картофелем, поскольку\nкартофель не нарезан очень мелко. Если\nв этот салат добавляют измельчённое\nяйцо, см. ниже, раздел 40.<\/p><p>37. <b>Смешивание клубники или банана\nсо сливками<\/b><\/p><p>Разрешается смешивать кусочки клубники\nили банана со сливками, поскольку они\nне нарезаны очень мелко.<\/p><p>Если же клубника или банан размяты,\nследует различать два случая:<\/p><p>а. Если добавляют лишь небольшое\nколичество сливок, так что размятая\nклубника слипается благодаря сливкам,\nэто запрещено. Следует изменить обычный\nспособ замешивания, например перемешивать\nкрест-накрест.<\/p><p>б. Если добавляют большое количество\nсливок, так что клубника не слипается,\nа распределяется в сливках, это не\nсчитается лишá, и такое действие\nразрешено.<\/p><p>38. <b>Смешивание салата тахина со свёклой\nи хреном<\/b><\/p><p>Тому, кто хочет смешать салат тахина\nсо смесью свёклы и хрена, следует\nучитывать, что в некоторых случаях это\nможет быть запрещено из-за лишá. См.\nпримечание 13.<\/p><p>39. <b>Добавление листьев приправ в салат\nтахина<\/b><\/p><p>Разрешается добавлять листья приправ\nв салат тахина или хумус, поскольку\nлистья распределяются в смеси и не\nслипаются друг с другом.<\/p><p>40. <b>Яичный салат<\/b><\/p><p>Тому, кто готовит яичный салат из\nизмельчённого яйца с добавлением\nнарезанного лука и масла, желательно\nизменить порядок добавления масла и\nяйца: сначала налить масло, а затем\nдобавить яйцо. Следует также изменить\nспособ перемешивания — перемешивать\nкрест-накрест.<\/p><p>Многие, однако, привыкли готовить этот\nсалат без изменения обычного способа.\nСм. примечание 14.<\/p><p>41. <b>Салат из тунца<\/b><\/p><p>Салат из тунца, приготовленный из рыбы\nтунца, измельчённых яиц и майонеза,\nимеет тот же закон, что и яичный салат,\nописанный выше, в разделе 40.<\/p><p>42. <b>Добавление отрубей в лебен<\/b><\/p><p>Тому, кто хочет смешать отруби с лебеном\nтаким образом, чтобы получилась густая\nсмесь, следует изменить способ\nперемешивания — перемешивать\nкрест-накрест. Желательно также изменить\nпорядок добавления жидкости: сначала\nположить в миску отруби, а затем добавить\nлебен.<\/p><p>Если лебен имеет плотную консистенцию,\nизменять порядок добавления жидкости\nне требуется; достаточно изменить способ\nперемешивания, поскольку отруби,\nдобавленные в лебен, вообще не смешиваются\nс ним без перемешивания.<\/p><p>Если получается жидкая смесь, см. выше,\nразделы 19–21.<\/p><p>43. <b>Добавление сахара или какао в\nлебен<\/b><\/p><p>Разрешается смешивать сахар или какао\nс лебеном. В этом нет запрета лишá,\nпоскольку в результате такого смешивания\nне образуется тесто или единая масса\nиз соединённых частиц.<\/p><p>44. <b>Добавление варенья или мёда в сыр<\/b><\/p><p>Нельзя смешивать варенье или мёд с\nсыром.<\/p><p>45. <b>Кукурузные хлопья с молоком<\/b><\/p><p>Разрешается класть кукурузные хлопья\nв молоко, и нет опасения нарушения\nзапрета лишá.<\/p><p>46. <b>Каша, которая загустевает при\nдобавлении жидкости без перемешивания<\/b><\/p><p>Некоторые виды каши, в которые при\nдобавлении молока оно само по себе\nвмешивается и образует полноценную\nгустую массу, нельзя готовить в Шаббат.<\/p><p>47. <b>Приготовление картофельного пюре\nиз порошка<\/b><\/p><p>Что касается приготовления картофельного\nпюре из порошка, см. примечание 22.<\/p><p>48. <b>Приготовление желе<\/b><\/p><p>Нельзя готовить блюдо, называемое\nжеле. См. примечание.<\/p><p>49. <b>Приготовление пудинга<\/b><\/p><p>Нельзя готовить пудинг в виде густой\nсмеси. См. примечание.<\/p><p>50. <b>Разминание хлеба<\/b><\/p><p>Некоторые писали, что разрешается\nразминать халу или пирог до тех пор,\nпока они не превратятся в единый комок.\nДругие писали, что нет однозначных\nоснований разрешать это: хотя к ним не\nдобавляют жидкость извне, следует\nопасаться запрета лишá, поскольку они\nсоединяются в единую массу за счёт\nсобственной влаги.<\/p><p>51. <b>Взбивание кофе<\/b><\/p><p>Приготовление кофейной пенки путём\nсмешивания растворимого кофе, сахара\nи небольшого количества воды, в результате\nчего образуется масса, которую затем\nпредполагается залить горячей водой,\nчтобы получить растворимый кофе с\nпенкой, запрещено в Шаббат.<\/p><p>52. <b>Жевание жевательной резинки<\/b><\/p><p>При жевании жевательной резинки в\nШаббат нет запрета лишá.<\/p><h2 id=\"part-405\">Приготовление пищи для\nмладенца<\/h2><p>53. <b>Приготовление пищи для младенца\nв виде густой смеси<\/b><\/p><p>Хазон Иш писал, что при приготовлении\nпищи для младенца можно положиться на\nмнение большинства поским, согласно\nкоторому добавление воды в муку не\nявляется запретом Торы. Поэтому\nразрешается готовить для младенца пищу\nдаже в виде густой смеси, если изменить\nобычный способ перемешивания. См.\nподробности выше, в разделе 17.<\/p><p>Поэтому тому, кто хочет смешать сок с\nразмятым бананом или размятым яблоком\nдля младенца, это разрешается при\nусловии, что он изменит способ\nперемешивания, например будет перемешивать\nкрест-накрест или пальцем.<\/p><p>Следует остерегаться нарушения запрета\nтохен при измельчении банана и яблока.\nСм. сказанное выше, в главе 5, разделы\n1–8.<\/p><p>Если в эту смесь также добавляют крошки\nпеченья или пирога, Хазон Иш писал, что\nизменение способа перемешивания следует\nвыполнять именно движениями крест-накрест,\nа не пальцем. По-видимому, то же относится\nи к добавлению в смесь сыра: способ\nперемешивания следует изменить,\nперемешивая крест-накрест.<\/p><p>54. <b>Приготовление пищи для младенца\nв виде жидкой смеси<\/b><\/p><p>Тому, кто хочет приготовить пищу для\nмладенца в виде жидкой смеси, следует\nизменить порядок добавления жидкости,\nкак объяснялось выше, в разделах 19–20,\nотносительно приготовления жидкой\nсмеси.<\/p><p>Если в будни при приготовлении этой\nпищи нет установленного порядка\nдобавления жидкости, следует сначала\nналить жидкость в пищу, а затем изменить\nспособ перемешивания, как указано выше,\nв разделе 21.<\/p><p>55. <b>Приготовление каши<\/b><\/p><p>Здесь следует различать разные виды\nсмесей.<\/p><p>Тот, кто хочет приготовить кашу в виде\nгустой смеси, должен поступать согласно\nсказанному выше, в разделах 16–17.<\/p><p>Тот, кто хочет приготовить кашу в виде\nжидкой смеси, должен поступать согласно\nсказанному выше, в разделах 19–21.<\/p><p>Однако в отношении каши, которую едят\nиз бутылочки, иногда вообще нельзя\nсчитать её смесью: она представляет\nсобой жидкость, в отношении которой нет\nзапрета лишá, и поэтому её разрешается\nготовить любым способом.<\/p><p>Во всех случаях необходимо выяснить\nособенности производственного процесса\nизготовления порошка, чтобы не нарушить\nзапрет бишуль.<\/p><p>56. <b>Клей для зубных протезов<\/b><\/p><p>Порошок, предназначенный для приклеивания\nзубных протезов к дёснам: его рассыпают\nпо поверхности протеза, а затем помещают\nпротез в рот. Порошок смешивается со\nслюной и превращается в липкую массу.\nИспользовать его в Шаббат запрещено\nиз-за запрета лишá.<\/p><p>57. <b>Выливание воды на землю<\/b><\/p><p>При выливании воды на участок земли\nследует рассматривать вопрос о возможном\nнарушении мелахот зоре или хореш, как\nбудет объяснено далее, в главе 11, разделах\n6–7. Однако запрета лишá в этом действии\nнет.<\/p><p>58. <b>Засыпание масляных пятен в местах,\nгде ходят люди<\/b><\/p><p>Разрешается засыпать землёй масляные\nпятна и другие жидкости, которые могут\nпривести к скольжению. Однако если это\nможно легко сделать с помощью нееврея,\nпредпочтительнее поступить именно так.<\/p><p>59. <b>Мочеиспускание на землю<\/b><\/p><p>Не следует мочиться на глину или на\nземлю, отделённую от почвы. В случае\nкрайней необходимости это разрешается.\nМочиться непосредственно на землю\nразрешается.<\/p><h2 id=\"part-406\">Законы лишá постфактум<\/h2><p>60. <b>Если человек нарушил запрет лишá\nи замесил тесто в Шаббат<\/b><\/p><p>Закон в этом случае такой же, как и в\nотношении приготовления пищи посредством\nбишуль в Шаббат.<\/p><p>Если человек сделал это намеренно,\nблюдо запрещено ему навсегда, а другим\n— до исхода Шаббата.<\/p><p>Если он сделал это непреднамеренно,\nблюдо запрещено и ему, и другим до исхода\nШаббата. Однако, согласно мнению\nВиленского Гаона, если действие было\nсовершено непреднамеренно, блюдо\nразрешено и ему, и другим даже в сам\nШаббат. Мишна Брура пишет, что в случае\nнеобходимости можно положиться на\nмнение Виленского Гаона.<\/p><p>61. Однако в тех случаях, когда согласно\nосновному закону лишá не запрещена и\nзапрет учитывается лишь в качестве\nстрогости, нет оснований запрещать\nблюдо постфактум. Поэтому, если человек\nдобавил воду в муку, блюдо не запрещается\nпостфактум, если замешивание было\nвыполнено с изменением обычного способа,\nнапример движениями крест-накрест и\nтому подобным.<\/p>"}, {"title": "Исправление и улучшение пищевых продуктов", "body": "<h1 id=\"part-408\"><font size=\"6\">Исправление\n\t\t\t\tи улучшение пищевых продуктов<\/font><\/h1><h2 id=\"part-409\">Окрашивание пищевых\n\t\t\t\tпродуктов<\/h2><p>В книге Шульхан Арух, Орах Хаим, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tש<\/span><\/font>\"<font face=\"Tahoma\"><span>כ<\/span><\/font>,\n\t\t\t\tприводятся слова книги Шибли а-Лекет,\n\t\t\t\tкоторый на основании слов Йереим\n\t\t\t\tзаключил, что запрет окрашивания не\n\t\t\t\tраспространяется на пищевые продукты.\n\t\t\t\tПричина в том, что люди обычно не\n\t\t\t\tзанимаются окрашиванием еды.<\/p><p>По этой причине он разрешил добавлять\n\t\t\t\tкуркуму в приготовленное блюдо, если\n\t\t\t\tпри этом не нарушается запрет бишуль,\n\t\t\t\tхотя куркума и придаёт блюду цвет.<\/p><p>См. также Даркей Моше, где приводится\n\t\t\t\tиз Гемары, трактат Шаббат, лист 139, что\n\t\t\t\tразрешается помещать яичный желток\n\t\t\t\tв ситечко с горчицей, чтобы улучшить\n\t\t\t\tцвет горчицы.<\/p><p>В книге Нишмат Адам этот вопрос\n\t\t\t\tподробно рассматривается. Из его слов\n\t\t\t\tследует, что существует различие\n\t\t\t\tмежду профессионалом, который\n\t\t\t\tокрашивает пищевой продукт, чтобы\n\t\t\t\tсделать его привлекательнее в глазах\n\t\t\t\tпокупателей, и человеком, который\n\t\t\t\tокрашивает еду для собственного\n\t\t\t\tупотребления, добавляя в неё другой\n\t\t\t\tпищевой продукт. См. примечание, где\n\t\t\t\tэтот вопрос рассматривается подробнее.<\/p><p>Из слов поским следует, что в вопросе\n\t\t\t\tокрашивания пищевых продуктов\n\t\t\t\tнеобходимо различать несколько\n\t\t\t\tразличных случаев:<\/p><p>А. Когда основное намерение человека\n\t\t\t\t— придать пищевому продукту определённый\n\t\t\t\tцвет. Например, когда он добавляет\n\t\t\t\tкрасное вино в белое вино, чтобы\n\t\t\t\tпридать ему красный цвет.<\/p><p>Б. Когда основное намерение человека\n\t\t\t\t— не придать пищевому продукту\n\t\t\t\tопределённый цвет. Например, когда\n\t\t\t\tон добавляет чайный экстракт в воду.<\/p><p>В. Профессионал, который придаёт\n\t\t\t\tпищевым продуктам определённый цвет,\n\t\t\t\tчтобы сделать их привлекательнее в\n\t\t\t\tглазах покупателей.<\/p><p>Г. Окрашивание воды, не предназначенной\n\t\t\t\tдля питья, когда намерение человека\n\t\t\t\tсостоит именно в том, чтобы окрасить\n\t\t\t\tеё.<\/p><p>Д. Добавление окрашивающего вещества\n\t\t\t\tв воду, не предназначенную для питья,\n\t\t\t\tкогда намерение человека состоит не\n\t\t\t\tв том, чтобы окрасить воду.<\/p><h2 id=\"part-410\"><font size=\"4\">Добавление\nкрасного вина в белое вино<\/font><\/h2><p>1. Тому, кто хочет добавить красное\nвино в белое, чтобы придать ему красный\nоттенок, это разрешается согласно мнению\nбольшинства поским. Однако в Мишна Брура\nнаписано, что, согласно мнению Хаей\nАдам, правильно воздерживаться от этого.\nСм. примечание.<\/p><h2 id=\"part-411\"><font size=\"4\">Добавление\nвкусовых веществ в воду, в результате\nчего вода окрашивается<\/font><\/h2><p>2. Тому, кто хочет добавить в воду\nрастворимый кофе, чайный экстракт,\nконцентрированный сладкий сироп или\nчто-либо подобное, это разрешается, даже\nесли вода при этом окрашивается. См.\nпримечание.<\/p><h2 id=\"part-412\"><font size=\"4\">Профессионал,\nдобавляющий пищевой краситель в продукты<\/font><\/h2><p>3. Профессионалу, который производит\nпищевые продукты и добавляет в них\nпищевой краситель или другой окрашивающий\nпищевой продукт, например красное вино\nв белое вино, чтобы улучшить внешний\nвид продукта, запрещено делать это в\nШаббат.<\/p><h2 id=\"part-413\"><font size=\"4\">Добавление\nокрашивающего вещества в унитаз<\/font><\/h2><p>4. Что касается добавления мыла в\nунитаз: если мыло окрашивает воду, это\nзапрещено. Если же оно не окрашивает\nводу, а лишь придаёт ей запах, см. главу\n15, раздел 65.<\/p><h2 id=\"part-414\"><font size=\"4\">Разглаживание\nпищевых продуктов<\/font><\/h2><p>5. По основному закону разрешается\nразглаживать пищевые продукты, например\nсалат из хумуса, баклажанную пасту и\nтому подобное. Однако тот, кто придерживается\nстрогости в этом вопросе, достоин\nблагословения.<\/p><p>Что касается яичного салата,\nприготовленного в Шаббат, см. примечание.<\/p><p>6. Тому, кто намазывает пастообразный\nпродукт на ломтик халы, разрешается\nраспределить его ножом так, чтобы покрыть\nвесь ломтик. Однако если он хочет именно\nразгладить поверхность намазанного\nпродукта, тому, кто придерживается\nстрогости, воздастся благословение. То\nже относится к сказанному выше.<\/p><h2 id=\"part-415\">\n<font size=\"6\">Добавление соли\n\t\t\t\t\tк овощам<\/font><\/h2><p>В Гемаре, трактат Шаббат, лист 108,\n\t\t\t\t\tобъясняется, что в Шаббат запрещено\n\t\t\t\t\tсолить редьку. Среди первых комментаторов\n\t\t\t\t\tсуществует разногласие относительно\n\t\t\t\t\tпричины этого запрета.<\/p><p>Раши писал, что запрет связан с тем,\n\t\t\t\t\tчто соль по своей природе обрабатывает\n\t\t\t\t\tредьку, делая её твёрдой, и это\n\t\t\t\t\tсчитается исправлением продукта.\n\t\t\t\t\tСм. Мишна Брура, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשכ״א<\/span><\/font>, пункт 1: запрет обработки\n\t\t\t\t\tпищевых продуктов является лишь\n\t\t\t\t\tпостановлением мудрецов.<\/p><p>Запрещено солить кусочки редьки\n\t\t\t\t\tдаже в том случае, если человек\n\t\t\t\t\tнамеревается съесть их сразу, прежде\n\t\t\t\t\tчем они подвергнутся обработке,\n\t\t\t\t\tпоскольку в момент посыпания солью\n\t\t\t\t\tэто выглядит так, будто он собирается\n\t\t\t\t\tобрабатывать продукт.<\/p><p>Рамбам же в главе 22 законов Шаббата,\n\t\t\t\t\tгалаха 10, писал, что причина запрета\n\t\t\t\t\tзаключается в том, что это выглядит\n\t\t\t\t\tкак приготовление солений в Шаббат.\n\t\t\t\t\tПриготовление солений запрещено,\n\t\t\t\t\tпоскольку оно подобно варке.<\/p><p>Поским писали, что этот запрет\n\t\t\t\t\tраспространяется также на другие\n\t\t\t\t\tовощи. Поэтому любые овощи, которые\n\t\t\t\t\tсоль обрабатывает, например огурцы,\n\t\t\t\t\tлук, чеснок и тому подобное, подпадают\n\t\t\t\t\tпод этот запрет.<\/p><p>Далее в той же Гемаре объясняется,\n\t\t\t\t\tчто разрешается обмакнуть один\n\t\t\t\t\tкусочек редьки в соль и съесть его\n\t\t\t\t\tчерез короткое время. Причина в том,\n\t\t\t\t\tчто в случае одного кусочка это не\n\t\t\t\t\tвыглядит как обработка продукта.<\/p><p>Однако поским писали, что даже один\n\t\t\t\t\tкусочек нельзя оставлять в соли до\n\t\t\t\t\tтех пор, пока соль не начнёт вытягивать\n\t\t\t\t\tиз него сок, поскольку в таком случае\n\t\t\t\t\tпроисходит настоящая обработка\n\t\t\t\t\tпродукта, а это запрещено.<\/p><p>7. <b>Добавление соли к овощам, которые\nобычно засаливают<\/b><\/p><p>Нельзя добавлять соль к овощам, которые\nпринято засаливать, или к овощам, на\nкоторые соль оказывает обрабатывающее\nдействие. Поэтому запрещено солить\nкусочки редьки, лука, чеснока, огурцов\nи тому подобного.<\/p><p>Этот запрет действует даже в том\nслучае, если человек намеревается съесть\nовощи сразу, не дожидаясь, пока они\nпросолятся или подвергнутся обработке.\nПричина в том, что это выглядит так,\nбудто человек собирается приготовить\nсоленья или обработать овощи.<\/p><p>Однако если он добавляет к этим кусочкам\nмасло или уксус, разрешается добавить\nк ним и соль, поскольку в таком случае\nэто совершенно не похоже на обработку\nпродукта.<\/p><p>8. <b>Добавление соли к одному кусочку\nовоща<\/b><\/p><p>Разрешается посыпать солью один\nкусочек редьки, огурца и тому подобного,\nесли человек намеревается съесть его\nв течение короткого времени. Причина в\nтом, что посыпание солью одного кусочка\nсовершенно не выглядит как приготовление\nсолений или обработка продукта.<\/p><p>Однако если человек намеревается\nоставить кусочек в соли на длительное\nвремя, чтобы соль вытянула из него сок,\nэто запрещено, поскольку в таком случае\nпроисходит настоящая обработка продукта.<\/p><p>9. <b>Добавление соли к овощам, которые\nобычно не засаливают<\/b><\/p><p>Овощи, которые обычно не засаливают\nи на которые соль не оказывает\nобрабатывающего действия, разрешается\nпосыпать солью. Поэтому разрешается\nпосыпать солью ломтики помидора, кусочки\nперца и тому подобное.<\/p><p>10. <b>Добавление соли в овощной салат<\/b><\/p><p>По-видимому, разрешается добавлять\nсоль в овощной салат, большая часть\nкоторого состоит из овощей, которые\nобычно не засаливают.<\/p><p>11. <b>Добавление соли к другим продуктам<\/b><\/p><p>Разрешается добавлять соль к варёным\nяйцам, приготовленному мясу и другим\nпищевым продуктам.<\/p><p>12. <b>Приготовление солевого раствора<\/b><\/p><p>Не следует готовить большое количество\nсолевого раствора для использования в\nкачестве приправы, поскольку это выглядит\nтак, будто человек собирается обрабатывать\nовощи в рассоле.<\/p><p>Однако разрешается приготовить\nнебольшое количество солевого раствора\n— столько, сколько необходимо для одной\nтрапезы.<\/p><p>13. <b>Засаливание овощей в уксусе или\nсоли<\/b><\/p><p>Запрещено засаливать овощи в уксусе\nили соли, поскольку приготовление\nсолений в Шаббат подобно варке.<\/p>"}, {"title": "Мелахот «Боне» (строительство) и «Сотер» (разрушение)", "body": "<h1 id=\"part-417\"> <font size=\"6\">Мелахот\n\t\t\t\t«Боне» (строительство) и «Сотер»\n\t\t\t\t(разрушение)<\/font><\/h1><p>Мелаха боне (строительство) является\n\t\t\t\tодной из 39 основных мелахот. В Гемаре,\n\t\t\t\tтрактат Шаббат, лист 102, объясняется,\n\t\t\t\tчто эта мелаха относится не только к\n\t\t\t\tчеловеку, который строит дом или\n\t\t\t\tстену. Даже тот, кто выкапывает яму с\n\t\t\t\tцелью положить в неё предметы, нарушает\n\t\t\t\tзапрет боне. То же относится к тому,\n\t\t\t\tкто заделывает отверстие в стене, а\n\t\t\t\tтакже к тому, кто удаляет возвышение\n\t\t\t\tземли на полу дома, выравнивая таким\n\t\t\t\tобразом поверхность пола: он нарушает\n\t\t\t\tзапрет боне.<\/p><p>Ещё одна мелаха, связанная с боне,\n\t\t\t\t— мелаха маке бе-патиш. Её суть\n\t\t\t\tзаключается в исправлении и завершении\n\t\t\t\tизготовления предметов или в исправлении\n\t\t\t\tповерхности земли.<\/p><p>В некоторых случаях, рассматриваемых\n\t\t\t\tв той же Гемаре, мудрецы спорят,\n\t\t\t\tотносится ли соответствующее действие\n\t\t\t\tк запрету боне или к маке бе-патиш.<\/p><p>При рассмотрении мелахи боне\n\t\t\t\tнеобходимо различать строительство\n\t\t\t\tна земле и строительство предметов.<\/p><p>При строительстве на земле человек\n\t\t\t\tнарушает запрет даже в том случае,\n\t\t\t\tесли между добавленными частями нет\n\t\t\t\tплотного соединения. Например, если\n\t\t\t\tон навесил дверь на петли, это уже\n\t\t\t\tсчитается строительством.<\/p><p>Однако при строительстве предметов\n\t\t\t\tзапрет нарушается только тогда, когда\n\t\t\t\tмежду частями образуется полноценное\n\t\t\t\tсоединение, как будет объяснено далее.<\/p><p>В поским, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tשי״ד<\/span><\/font>, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\tא<\/span><\/font>, разъясняется, что сосуд\n\t\t\t\tобъёмом 40 сеа утрачивает статус\n\t\t\t\tобычного сосуда, и законы строительства\n\t\t\t\tприменительно к нему такие же, как\n\t\t\t\tзаконы строительства на земле.<\/p><p>Следует знать, что в Гемаре сказано:\n\t\t\t\tтот, кто строит каменную стену, нарушает\n\t\t\t\tзапрет уже при укладывании верхнего\n\t\t\t\tряда камней, даже если не скрепляет\n\t\t\t\tих раствором. Причина в том, что именно\n\t\t\t\tтаким образом принято было строить\n\t\t\t\tверхние ряды стены.<\/p><p>По-видимому, речь идёт об очень\n\t\t\t\tтяжёлом верхнем ряде камней, поскольку\n\t\t\t\tтрудно предположить, что на вершину\n\t\t\t\tстены укладывали камни, которые могли\n\t\t\t\tлегко упасть.<\/p><p>С другой стороны, совершенно очевидно,\n\t\t\t\tчто человек, который в Шаббат передвинет\n\t\t\t\tтяжёлый шкаф с одного места на другое,\n\t\t\t\tне нарушит запрет боне только из-за\n\t\t\t\tтого, что поставил шкаф на новое место,\n\t\t\t\tдаже если собирается оставить его\n\t\t\t\tтам на долгие годы. Это совершенно не\n\t\t\t\tпохоже на укладывание верхнего ряда\n\t\t\t\tстены.<\/p><p>Причина различия заключается в\n\t\t\t\tследующем: верхний ряд камней считается\n\t\t\t\tчастью стены, и поскольку именно таким\n\t\t\t\tспособом принято строить стену, это\n\t\t\t\tсчитается полноценным строительством,\n\t\t\t\tза которое человек несёт ответственность.<\/p><p>Шкаф же, в представлении людей, не\n\t\t\t\tсчитается единым целым с полом комнаты,\n\t\t\t\tа стоит отдельно. Поэтому в его\n\t\t\t\tперемещении нет статуса мелахи боне,\n\t\t\t\tесли только он не был прикреплён к\n\t\t\t\tстене болтами.<\/p><p>Таким образом, иногда, когда между\n\t\t\t\tчастями нет соединения с помощью\n\t\t\t\tцемента или гвоздей, необходимо\n\t\t\t\tопределить, считаются ли части, которые\n\t\t\t\tдобавляют в Шаббат, единым целым с\n\t\t\t\tпостройкой. Если считаются, их\n\t\t\t\tдобавление запрещено из-за мелахи\n\t\t\t\tбоне. Если же они не считаются её\n\t\t\t\tчастью, то это не строительство, а\n\t\t\t\tпростое размещение предмета.<\/p><p>Далее будут приведены примеры,\n\t\t\t\tсвязанные с этим вопросом.<\/p><p>Следует также знать: хотя, с Б-жьей\n\t\t\t\tпомощью, далее будет объяснено, что\n\t\t\t\tдаже строительство на временный срок\n\t\t\t\tсчитается строительством, несмотря\n\t\t\t\tна то что впоследствии его разберут,\n\t\t\t\tсуществуют случаи, в которых сам\n\t\t\t\tстатус мелахи боне не вполне ясен.\n\t\t\t\tЭто связано с тем, что не всегда\n\t\t\t\tочевидно, считается ли определённое\n\t\t\t\tдобавление частью постройки или\n\t\t\t\tотдельным предметом.<\/p><p>В таких случаях иногда существует\n\t\t\t\tразличие между постоянной конструкцией\n\t\t\t\tи временной: временное добавление\n\t\t\t\tможет не считаться частью постройки,\n\t\t\t\tа рассматриваться как отдельный\n\t\t\t\tпредмет.<\/p><p>Примером служит занавеска, подвешенная\n\t\t\t\tв дверном проёме. Согласно мнению\n\t\t\t\tХазон Иша, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tנ״ג<\/span><\/font>, пункт 13, здесь существует\n\t\t\t\tпрактическое различие: если занавеска\n\t\t\t\tподвешена на постоянной основе, это\n\t\t\t\tотносится к мелахе боне; если же\n\t\t\t\tпринято регулярно вешать её и снимать,\n\t\t\t\tэто разрешено.<\/p><p>Речь не идёт о наших обычных шторах,\n\t\t\t\tподвешенных на направляющей:\n\t\t\t\tпо-видимому, в любом случае они\n\t\t\t\tотносятся к мелахе боне. Имеется в\n\t\t\t\tвиду занавеска, подвешенная на крючках.<\/p><p>Получается, что в обоих случаях\n\t\t\t\tчеловек подвесил занавеску одинаковым\n\t\t\t\tспособом, однако, если он сделал это\n\t\t\t\tна постоянной основе, мы рассматриваем\n\t\t\t\tеё как дополнение к постройке. Если\n\t\t\t\tже он повесил её временно, она не\n\t\t\t\tсчитается частью постройки, и запрета\n\t\t\t\tв этом нет.<\/p><h2 id=\"part-418\">Временное\n\t\t\t\tстроительство<\/h2><p>В Иерусалимском Талмуде, в главе\n\t\t\t\t«Клал Гадоль», сказано, что даже\n\t\t\t\tстроительство на временный срок\n\t\t\t\tсчитается строительством.<\/p><p>Доказательство приводится из\n\t\t\t\tстроительства Мишкана: установка\n\t\t\t\tдосок на подножия (адним) была запрещена\n\t\t\t\tиз-за мелахи боне, хотя впоследствии\n\t\t\t\tМишкан предполагалось разобрать.<\/p><p>Маген Авраам и Таз пишут, что, несмотря\n\t\t\t\tна это, разрешается закрывать сосуд\n\t\t\t\tкрышкой, которая закручивается\n\t\t\t\tрезьбой, даже если она завинчивается\n\t\t\t\tочень плотно. В этом нет запрета боне\n\t\t\t\tили маке бе-патиш.<\/p><p>Причина заключается в том, что\n\t\t\t\tосновное предназначение такого сосуда\n\t\t\t\tпредполагает постоянное снятие и\n\t\t\t\tустановку крышки. Поэтому это не\n\t\t\t\tсчитается завершением изготовления\n\t\t\t\tпредмета.<\/p><p>Поздние законоучители разошлись в\n\t\t\t\tобъяснении их слов.<\/p><p>А. Га-Рав Залман, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tשי״ג<\/span><\/font>, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\tכ״א<\/span><\/font>, придерживается буквального\n\t\t\t\tпонимания слов Тура и Маген Авраама:\n\t\t\t\tв отношении любого предмета, который\n\t\t\t\tпринято постоянно собирать и разбирать,\n\t\t\t\tнет запрета боне.<\/p><p>Га-Рав Залман пишет, что если предмет\n\t\t\t\tпредназначен для разборки в тот же\n\t\t\t\tдень, то нет даже запрета мудрецов.\n\t\t\t\tЕсли же его не собираются разбирать\n\t\t\t\tв тот же день и он остаётся в собранном\n\t\t\t\tсостоянии более одного дня, это\n\t\t\t\tзапрещено постановлением мудрецов,\n\t\t\t\tно не запретом Торы, поскольку такая\n\t\t\t\tконструкция не предназначена для\n\t\t\t\tдлительного существования.<\/p><p>Б. Хазон Иш, <font face=\"Tahoma\"><span>סימן\n\t\t\t\tנ׳<\/span><\/font>, пункт 9, в словах, начинающихся\n\t\t\t\tс «<font face=\"Tahoma\"><span>והא<\/span><\/font>»,\n\t\t\t\tпишет, что основа разрешения Маген\n\t\t\t\tАвраама и Таза заключается в том, что\n\t\t\t\tсосуд и его крышка вообще не\n\t\t\t\tрассматриваются как единое целое.\n\t\t\t\tДаже когда сосуд закрыт, мы рассматриваем\n\t\t\t\tсам сосуд и его крышку как два отдельных\n\t\t\t\tпредмета.<\/p><p>Однако в отношении другого разборного\n\t\t\t\tпредмета, даже если его принято\n\t\t\t\tпостоянно разбирать, существует\n\t\t\t\tзапрет боне. См. примечание.<\/p><p>Следует знать: хотя мы считаем\n\t\t\t\tстроительство на временный срок\n\t\t\t\tстроительством, это относится именно\n\t\t\t\tк качественно выполненной конструкции,\n\t\t\t\tподобной постройкам Мишкана, а также\n\t\t\t\tк разборным предметам, которые собраны\n\t\t\t\tнадлежащим образом.<\/p><p><font size=\"3\">Однако непрочная\n\t\t\t\tконструкция, которая не построена\n\t\t\t\tкачественно, не подпадает под запрет\n\t\t\t\tТоры, а запрещена лишь постановлением\n\t\t\t\tмудрецов. См. Гемару, трактат Бейца,\n\t\t\t\tлист 32.<\/font><\/p><p>1. Тот, кто строит сооружение в Шаббат,\nнарушает запрет боне. Даже если он\nпостроил не всё сооружение целиком, а\nвыполнил лишь его часть, он несёт\nответственность за нарушение. То же\nотносится к тому, кто заделывает отверстие\nв стене: он нарушает запрет боне.<\/p><p>2. Тот, кто выполняет ремонт, улучшающий\nсостояние постройки, нарушает запрет\nбоне, даже если ничего не добавляет к\nсамой конструкции.<\/p><p>В Гемаре сказано, что тот, кто удаляет\nвозвышение земли с пола дома и выравнивает\nповерхность, нарушает запрет боне.<\/p><p>То же относится к тому, кто разбивает\nстену, чтобы устроить в ней окно, или\nделает отверстие в доме, через которое\nбудут проникать воздух или свет.<\/p><p>3. <b>Навешивание двери или окна на петли<\/b><\/p><p>Тот, кто навешивает дверь или окно на\nпетли, а также тот, кто устанавливает\nраздвижную дверь или окно в предназначенную\nдля них направляющую, нарушает запрет\nбоне.<\/p><p>Поэтому, если дверь или окно сошли с\nнаправляющей таким образом, что ими\nневозможно пользоваться или пользоваться\nими стало затруднительно, иногда их\nвозвращение на место может быть запрещено\nиз-за боне. Следует обратиться к раввину.<\/p><p>4. <b>Прикрепление предметов к стене<\/b><\/p><p>Тот, кто забивает гвоздь в стену,\nнарушает запрет боне. То же правило\nраспространяется на другие предметы,\nприкрепляемые к конструкции.<\/p><p>5. <b>Подключение крана или фильтра<\/b><\/p><p>Тот, кто прикрепляет кран к стене,\nнарушает запрет боне. Даже если труба\nили фильтр, присоединённые к крану,\nвыпали, запрещено возвращать их на\nместо, поскольку они постоянно соединены\nс краном, и их установка считается\nдополнением к постройке, за которое\nчеловек несёт ответственность.<\/p><p>Также нельзя вкручивать лампочку в\nпатрон, поскольку светильник предназначен\nдля длительного использования и\nстановится частью конструкции. Это\nсчитается полноценным нарушением\nмелахи.<\/p><p>6. <b>Укрепление ослабленного соединения\nпредмета, прикреплённого к земле или\nпостройке<\/b><\/p><p>Нельзя подтягивать резьбовые соединения\nчастей, прикреплённых к постройке или\nк предметам. Поэтому запрещено затягивать\nвинт крана или ручки шкафа, если их\nкрепление ослабло.<\/p><p>7. <b>Выкапывание ямы в земле<\/b><\/p><p>Тот, кто выкапывает яму в земле с целью\nположить в неё предметы, нарушает запрет\nбоне.<\/p><p>8. <b>Закрывание двери на длительный\nсрок<\/b><\/p><p>Закрывание двери или окна совершенно\nне связано с запретом. Это разрешено\nдаже в том случае, если человек намеревается\nоставить их запертыми на многие годы.<\/p><p>9. <b>Извлечение выдвижного ящика из\nшкафа<\/b><\/p><p>Если в шкафу имеется ящик, установленный\nна направляющих, нельзя вынимать его\nили возвращать на место из опасения\nнарушения запрета боне.<\/p><p>Это относится именно к шкафу объёмом\n40 сеа или к шкафу, прикреплённому к земле\nлибо стене, пос
