ческого закона,\n\t\t\t\t\tМишна Брура пишет, что правильно\n\t\t\t\t\tсоблюдать строгость согласно мнению\n\t\t\t\t\tШульхан Аруха, которого придерживается\n\t\t\t\t\tбольшинство ранних комментаторов.\n\t\t\t\t\tОднако не следует порицать тех, кто\n\t\t\t\t\tпридерживается облегчительного\n\t\t\t\t\tмнения.<\/p><p>46. Очень широкий сосуд запрещается\nполностью накрывать тканевым полотном\nили деревянной доской, поскольку это\nвыглядит как сооружение шатра. Однако\nесли накрыть только часть сосуда, это\nне выглядит как шатёр.<\/p><p>В отношении этого закона установлено\nнесколько условий:<\/p><p>А. Этот запрет действует только тогда,\nкогда сосуд очень широкий. Поским не\nуказали точную меру ширины. См. примечание.<\/p><p>Б. Этот запрет действует только тогда,\nкогда под покрытием имеется свободное\nпространство высотой один тефах. Но\nесли сосуд заполнен пищей или напитками\nтак, что под покрытием не остаётся\nсвободного пространства высотой один\nтефах, запрета нет.<\/p><p>В. Некоторые из поздних авторитетов\nпостановили, что этот запрет действует\nтолько в том случае, когда человеку\nнеобходимо пространство под покрытием.\nНо если это пространство ему не требуется,\nзапрета нет.<\/p><p>Г. Некоторые поским пишут, что если\nимеются явные признаки, указывающие на\nто, что предмет предназначен именно для\nнакрывания сосуда, например ручка на\nкрышке или что-то подобное, то этот\nслучай не входит в рамки запрета.<\/p><p>Исходя из этого, следует соблюдать\nосторожность и не класть алюминиевую\nфольгу и тому подобное на очень широкие\nсосуды, например на кастрюли в общественных\nучреждениях, если выполняются перечисленные\nвыше условия запрета.<\/p><p>Следует отметить, что некоторые поским\nоспаривают этот запрет, как было\nразъяснено во введении к данному пункту.\nМишна Брура пишет, что правильно соблюдать\nстрогость согласно мнению Шульхан\nАруха, однако не следует порицать тех,\nкто придерживается облегчительного\nмнения.<\/p>"}];
const content=document.getElementById('content'),nav=document.getElementById('nav'),sidebar=document.getElementById('sidebar'),panel=document.getElementById('subpanel'),search=document.getElementById('search'),count=document.getElementById('count');
let index=0,size=19,query='',marks=[],matchIndex=-1;
function show(i,keep=false){index=Math.max(0,Math.min(chapters.length-1,i));const c=chapters[index];content.innerHTML=c.body;
const extraSubheadings=new Set([
'Строительство предметов (бине́н бе-келим)',
'Сборка предметов путём плотного закрепления',
'Сборка предметов посредством затягивания',
'Сборка предмета с тугим соединением, если его не принято закреплять плотно',
'Сборка предметов неплотным соединением',
'Приведём несколько практических примеров.'
]);
content.querySelectorAll('p').forEach(p=>{
 const normalized=p.textContent.replace(/\s+/g,' ').trim();
 if(extraSubheadings.has(normalized)){
  const h=document.createElement('h3');h.className='promoted-subheading';
  h.innerHTML=p.innerHTML;p.replaceWith(h);
 }
});document.getElementById('chapter-title').textContent=c.title;document.getElementById('current-title').textContent=c.title==='Мелахот «Боне» (строительство) и «Сотер» (разрушение)'?'Мелахот «Боне» и «Сотер»':c.title;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===chapters.length-1;nav.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===index));panel.replaceChildren();const hs=content.querySelectorAll('h1,h2,h3,h4');hs.forEach((h,j)=>{h.id='sub-'+index+'-'+j;let b=document.createElement('button');b.textContent=h.textContent.replace(/\s+/g,' ').trim();b.onclick=()=>{panel.hidden=true;h.scrollIntoView({behavior:'smooth',block:'start'})};panel.append(b)});if(!hs.length){let b=document.createElement('button');b.textContent=c.title;b.onclick=()=>panel.hidden=true;panel.append(b)}panel.hidden=true;sidebar.classList.remove('open');history.replaceState(null,'','#chapter-'+(index+1));if(query)highlight();if(!keep)window.scrollTo({top:0,behavior:'instant'});}
chapters.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.title;b.onclick=()=>show(i);nav.append(b)});
document.getElementById('menu').onclick=()=>{sidebar.classList.toggle('open');panel.hidden=true};document.getElementById('subtoggle').onclick=e=>{e.stopPropagation();panel.hidden=!panel.hidden;sidebar.classList.remove('open')};document.addEventListener('click',e=>{if(!e.target.closest('.subwrap'))panel.hidden=true});document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);
document.getElementById('larger').onclick=()=>{size=Math.min(32,size+1);content.style.fontSize=size+'px'};document.getElementById('smaller').onclick=()=>{size=Math.max(13,size-1);content.style.fontSize=size+'px'};document.getElementById('night').onclick=()=>document.body.classList.toggle('dark');
function highlight(){marks=[];if(!query){count.textContent='';return}let walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(let node of nodes){let str=node.nodeValue,low=str.toLocaleLowerCase('ru'),needle=query.toLocaleLowerCase('ru'),from=0,pos=low.indexOf(needle);if(pos<0)continue;let frag=document.createDocumentFragment();while(pos>=0){frag.append(document.createTextNode(str.slice(from,pos)));let mark=document.createElement('mark');mark.textContent=str.slice(pos,pos+query.length);frag.append(mark);marks.push(mark);from=pos+query.length;pos=low.indexOf(needle,from)}frag.append(document.createTextNode(str.slice(from)));node.parentNode.replaceChild(frag,node)}count.textContent=marks.length?marks.length+' совп.':'0';}
function jumpMatch(){if(!query)return;let attempts=0;while(!marks.length&&attempts<chapters.length){show((index+1)%chapters.length,true);attempts++}if(!marks.length){count.textContent='0';return}if(matchIndex>=0&&marks[matchIndex])marks[matchIndex].classList.remove('active-mark');matchIndex=(matchIndex+1)%marks.length;marks[matchIndex].classList.add('active-mark');marks[matchIndex].scrollIntoView({behavior:'smooth',block:'center'});count.textContent=(matchIndex+1)+' / '+marks.length;}
function searchNow(){let v=search.value.trim();if(v!==query){query=v;matchIndex=-1;show(index,true)}jumpMatch()}
search.addEventListener('keydown',e=>{if(e.key==='Enter')searchNow()});document.getElementById('searchnext').onclick=searchNow;search.addEventListener('input',()=>{if(!search.value){query='';matchIndex=-1;show(index,true)}});
let start=Number((location.hash.match(/chapter-(\d+)/)||[])[1]||1)-1;show(start);
</script></body></html>
