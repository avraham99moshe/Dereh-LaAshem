приготовление<\/strong>,\nнапример воду, масло и специи. Поскольку\nтемпература достигает «яд нихвет бо»,\nследует опасаться запрета бишуля.<\/p><p><strong>Хазон Иш<\/strong> пишет, что, поскольку\nтрудно определить разницу между\nтемпературой <strong>«яд соледет бо»<\/strong>\nи температурой <strong>«яд нихвет бо»<\/strong>,\nне следует помещать неприготовленные\nпродукты вообще в любой кли шени.<\/p><p><strong>58.<\/strong> Хазон Иш также пишет, что\nв отношении <strong>кли шлиши<\/strong> не принято\nсоблюдать эту строгость, связанную с\n«яд нихвет бо».<\/p><h3 id=\"part-65\">\n<font size=\"4\">«Давар гуш» —\n\t\t\t\t\tцельный горячий кусок пищи<\/font><\/h3><p>Выше было разъяснено, что пища или\n\t\t\t\t\tвода, находящиеся в <strong>кли шени<\/strong>,\n\t\t\t\t\tне готовят. Причина заключается в\n\t\t\t\t\tтом, что стенки кли шени охлаждают\n\t\t\t\t\tнаходящуюся в нём горячую пищу.<\/p><p>Однако некоторые поским пишут, что\n\t\t\t\t\tэто относится только к <strong>жидкой\n\t\t\t\t\tпище<\/strong>, которая соприкасается со\n\t\t\t\t\tстенками сосуда и охлаждается ими.<\/p><p>Если же в кли шени помещён <strong>«давар\n\t\t\t\t\tгуш» — цельный кусок пищи<\/strong>,\n\t\t\t\t\tнапример кусок мяса, картофель и тому\n\t\t\t\t\tподобное, то он способен готовить\n\t\t\t\t\tвсё время, пока его температура\n\t\t\t\t\tдостигает <strong>«яд соледет бо»<\/strong>,\n\t\t\t\t\tкак если бы он находился в <strong>кли\n\t\t\t\t\tришон<\/strong>.<\/p><p>Причина заключается в том, что\n\t\t\t\t\tцельный кусок пищи не прилегает ко\n\t\t\t\t\tвсем стенкам сосуда, и поэтому они\n\t\t\t\t\tне охлаждают его. Кроме того, цельный\n\t\t\t\t\tкусок по своей природе способен\n\t\t\t\t\t<strong>сохранять заключённое в нём\n\t\t\t\t\tтепло в течение продолжительного\n\t\t\t\t\tвремени<\/strong>.<\/p><p>Это мнение также приводится в <strong>Мишна\n\t\t\t\t\tБруре<\/strong>. См. примечание.<\/p><p>Следует знать, что опасение, связанное\n\t\t\t\t\tс <strong>«давар гуш»<\/strong>, существует\n\t\t\t\t\tв дополнение к опасениям <strong>«калей\n\t\t\t\t\tа-бишуль»<\/strong> и <strong>«яд нихвет бо»<\/strong>,\n\t\t\t\t\tкоторые были упомянуты выше.<\/p><p>То есть даже если не принимать\n\t\t\t\t\tстрогое мнение относительно «давар\n\t\t\t\t\tгуш», этот продукт всё равно имеет\n\t\t\t\t\tстатус обычной пищи, находящейся в\n\t\t\t\t\tкли шени, и к нему относятся опасения\n\t\t\t\t\t«калей а-бишуль» и «яд нихвет бо»,\n\t\t\t\t\tкак было разъяснено выше.<\/p><p>Строгость в отношении «давар гуш»\n\t\t\t\t\tдобавляет следующее: <strong>цельный\n\t\t\t\t\tгорячий кусок, находящийся в кли\n\t\t\t\t\tшени, рассматривается как находящийся\n\t\t\t\t\tв кли ришон<\/strong>.<\/p><p>Поэтому он способен приготовить\n\t\t\t\t\tдаже продукты, которые <strong>не относятся\n\t\t\t\t\tк «калей а-бишуль»<\/strong>, и даже тогда,\n\t\t\t\t\tкогда его температура не достигает\n\t\t\t\t\tстепени <strong>«яд нихвет бо»<\/strong>, при\n\t\t\t\t\tусловии, что она достигает <strong>«яд\n\t\t\t\t\tсоледет бо»<\/strong>.<\/p><h3 id=\"part-66\"><font size=\"3\">Законы\nбишуля в отношении «давар гуш»<\/font><\/h3><p><strong>59.<\/strong> Некоторые поским пишут,\nчто, хотя <strong>кли шени<\/strong> обычно не\nготовит, если в нём находится <strong>«давар\nгуш» — цельный кусок пищи<\/strong>, например\nкусок мяса, картофель, рис и тому подобное,\nи его температура достигает <strong>«яд\nсоледет бо»<\/strong>, то он способен готовить\nтак, как если бы находился в <strong>кли\nришон<\/strong>.<\/p><p>Поэтому следует остерегаться посыпать\nспециями горячий «давар гуш», находящийся\nв кли шени.<\/p><p><strong>60.<\/strong> Относительно добавления\nсоли на горячий «давар гуш», находящийся\nв кли шени, см. примечание.<\/p><p><strong>61.<\/strong> Некоторые законоучители\nпостановили, что следует остерегаться\nсоприкосновения неприготовленного\nпродукта с «давар гуш», находящимся на\nтарелке, всё время пока его температура\nдостигает «яд соледет бо».<\/p><p>Поэтому они считают, что изначально\nжелательно следить, чтобы <strong>ломтик\nсолёного огурца не соприкасался с\nгорячей запеканкой (кугелем)<\/strong>,\nнаходящейся в кли шени.<\/p><p>Также следует следить, чтобы\n<strong>неприготовленные овощи не\nсоприкасались с горячим хамином<\/strong>,\nнаходящимся в кли шени.<\/p><p>Однако некоторые разрешают это. См.\nпримечание.<\/p><p><strong>62.<\/strong> Некоторые разрешают\nпомещать <strong>жидкость, которая ранее\nбыла приготовлена, а затем остыла<\/strong>,\nна горячий «давар гуш», находящийся в\nкли шени. См. примечание.<\/p><p>Тем не менее нельзя брать «давар гуш»\nнепосредственно из <strong>кли ришон<\/strong>\nи класть его на холодный соус, находящийся\nв кли шени.<\/p><p><strong>63.<\/strong> Опасение запрета бишуля,\nсвязанное с <strong>«давар гуш»<\/strong>,\nотносится как к случаю, когда он находится\nв <strong>кли шени<\/strong>, так и к случаю, когда\nон находится в <strong>кли шлиши<\/strong>.<\/p><h3 id=\"part-67\">\n<font size=\"5\">Ируй — обливание\n\t\t\t\tиз кли ришон<\/font><\/h3><p>Выше было разъяснено, что горячая\n\t\t\t\tпища, а также горячая вода, находящиеся\n\t\t\t\tв <strong>кли ришон<\/strong>, способны\n\t\t\t\tприготовить продукты, которые в них\n\t\t\t\tпомещают.<\/p><p>Когда же они находятся в <strong>кли\n\t\t\t\tшени<\/strong>, они не способны готовить,\n\t\t\t\tза исключением нескольких случаев,\n\t\t\t\tкоторые были разъяснены выше.<\/p><p>Однако в Гемаре прямо не разъясняется\n\t\t\t\tзакон относительно горячей пищи или\n\t\t\t\tгорячей воды, которые <strong>переливают\n\t\t\t\tиз кли ришон<\/strong>, и они попадают на\n\t\t\t\tнеприготовленный продукт, находящийся\n\t\t\t\tв кли шени.<\/p><p>Возникает вопрос: поскольку струя\n\t\t\t\tещё не успела охладиться от стенок\n\t\t\t\tкли шени, следует ли считать, что она\n\t\t\t\tспособна приготовить продукт, на\n\t\t\t\tкоторый попадает? Или же следует\n\t\t\t\tсказать, что с момента выхода жидкости\n\t\t\t\tиз кли ришон она уже не обладает\n\t\t\t\tспособностью готовить?<\/p><p>В этом вопросе ришоним расходятся\n\t\t\t\tво мнениях.<\/p><p>По мнению <strong>Рашбама<\/strong>, ируй\n\t\t\t\tимеет статус <strong>кли шени<\/strong> и не\n\t\t\t\tготовит.<\/p><p>По мнению <strong>Рабейну Тама<\/strong> и\n\t\t\t\tряда других ришоним, ируй имеет статус\n\t\t\t\t<strong>кли ришон<\/strong> и способен готовить.<\/p><p>На практике поским пишут, что следует\n\t\t\t\tучитывать мнение Рабейну Тама.<\/p><p>При этом они добавляют, что ируй\n\t\t\t\tготовит только на глубину <strong>«кдей\n\t\t\t\tклипа»<\/strong>, то есть струя не способна\n\t\t\t\tприготовить продукт на всю его толщину,\n\t\t\t\tа готовит лишь его <strong>наружный слой<\/strong>.<\/p><p>Поэтому необходимо соблюдать\n\t\t\t\tосторожность, когда наливают горячую\n\t\t\t\tводу из кли ришон в чашку или горячее\n\t\t\t\tблюдо из кли ришон в тарелку: в чашке\n\t\t\t\tили тарелке не должны находиться\n\t\t\t\tпродукты, которые могут подвергнуться\n\t\t\t\tбишулю от этой горячей струи.<\/p><h3 id=\"part-68\"><font size=\"3\">Законы\nируя<\/font><\/h3><p><strong>64.<\/strong> Запрещено лить горячую\nводу из <strong>кли ришон<\/strong> на\nнеприготовленный продукт.<\/p><p>Однако разрешается лить из кли ришон\nна <strong>внешние стенки сосуда<\/strong>,\nвнутри которого находится пища или\nнапиток, например когда хотят подогреть\nпищу для младенца.<\/p><h3 id=\"part-69\">Ируй на воду, которая не была\nприготовлена<\/h3><p><strong>65.<\/strong> Если человек хочет налить\nгорячую воду из кли ришон в чашку, в\nкоторой находится холодная вода, следует\nразличать два случая:<\/p><p><strong>а.<\/strong> Если после наливания вода\nв чашке станет горячей до степени <strong>«яд\nсоледет бо»<\/strong>, это запрещено.<\/p><p><strong>б.<\/strong> Если после наливания вода\nв чашке не нагреется до степени «яд\nсоледет бо», это разрешено.<\/p><h3 id=\"part-70\">Ируй на воду, которая была\nприготовлена и остыла<\/h3><p><strong>66.<\/strong> Даже если вода или другой\nнапиток в чашке уже были приготовлены,\nа затем остыли, запрещено наливать на\nних воду из кли ришон, если после наливания\nтемпература воды в чашке достигнет\nстепени <strong>«яд соледет бо»<\/strong>.<\/p><p>Поэтому нельзя наливать воду из кли\nришон на <strong>чайную заварку<\/strong>,\nнаходящуюся в чашке. См. примечание.<\/p><p>См. также далее, пункты <strong>74 и 80<\/strong>,\nгде разъясняется способ приготовления\nчашки чая разрешённым образом.<\/p><h3 id=\"part-71\">Ируй в чашку, в которой\nосталось небольшое количество капель\nводы<\/h3><p><strong>67.<\/strong> Если чашка мокрая и в ней\nосталось небольшое количество капель\nводы, следует хорошо встряхнуть её\nнесколько раз. После этого, согласно\nосновному закону, разрешается наливать\nв неё горячую воду из <strong>кли ришон<\/strong>.<\/p><p>Однако есть придерживающиеся более\nстрогого мнения и требующие <strong>вытереть\nчашку насухо<\/strong>.<\/p><h3 id=\"part-72\">Ируй на сахар<\/h3><p><strong>68.<\/strong> Изначально желательно\nсоблюдать осторожность и не лить кипящую\nводу из <strong>кли ришон<\/strong> непосредственно\nна сахар, находящийся в сосуде.<\/p><p><strong>69.<\/strong> Также следует остерегаться\nналивать горячую воду из кли ришон в\nчашку, в которой находится <strong>чай,\nсмешанный с сахаром<\/strong>, даже если чай\nвсё ещё горячий.<\/p><h3 id=\"part-73\">\n<font size=\"4\">Закон половника\n\t\t\t\t— «мацекет»<\/font><\/h3><p>Выше было разъяснено, что <strong>кли\n\t\t\t\tришон<\/strong> способен готовить, а <strong>кли\n\t\t\t\tшени<\/strong> не способен готовить.<\/p><p>Поским рассматривают следующий\n\t\t\t\tслучай: человек опустил <strong>половник\n\t\t\t\tили ложку<\/strong> в кли ришон и зачерпнул\n\t\t\t\tими горячую пищу. Возникает вопрос:\n\t\t\t\tимеет ли пища, находящаяся в половнике,\n\t\t\t\tстатус пищи в <strong>кли шени<\/strong>,\n\t\t\t\tкоторая не готовит, или же она имеет\n\t\t\t\tстатус пищи, находящейся в <strong>кли\n\t\t\t\tришон<\/strong>, поскольку сам половник\n\t\t\t\tнагрелся от кли ришон и поэтому не\n\t\t\t\tохлаждает находящуюся в нём пищу?<\/p><p><strong>Поским постановили придерживаться\n\t\t\t\tв этом вопросе строгого мнения.<\/strong><\/p><h3 id=\"part-74\"><font size=\"3\">Законы\nполовника — «мацекет»<\/font><\/h3><p><strong>70.<\/strong> Если человек берёт пищу\nили напиток из <strong>кли ришон<\/strong> при\nпомощи половника, эта пища не рассматривается\nкак находящаяся в <strong>кли шени<\/strong>, а\nимеет статус находящейся в <strong>кли\nришон<\/strong>.<\/p><p>Поэтому нельзя лить из половника на\nнеприготовленные продукты.<\/p><p><strong>71.<\/strong> Если пустую чашку опустили\nв <strong>михам с водой<\/strong>, стоящий на\nогне, и зачерпнули ею воду, эта вода\nимеет статус находящейся в <strong>кли\nришон<\/strong>.<\/p><p>Поэтому нельзя добавлять в неё холодную\nзаварку, даже если эта заварка уже была\nприготовлена.<\/p><p><strong>72.<\/strong> Однако разрешается лить\nиз половника на напиток, который был\nприготовлен, а затем остыл.<\/p><p>Поэтому разрешается наливать суп из\nполовника на остатки супа, находящиеся\nв тарелке, даже если они уже остыли.<\/p><p><strong>73.<\/strong> Если человек набирает суп\nили другую пищу половником и затем\nперекладывает её в тарелку, пища в\nтарелке имеет статус <strong>кли шени<\/strong>,\nа не кли шлиши, поскольку половник из-за\nстрогости рассматривается как <strong>кли\nришон<\/strong>.<\/p><p>Однако в отношении некоторых законов\nможно рассматривать эту тарелку как\n<strong>кли шлиши<\/strong>. Поэтому разрешается\nположить ломтик халы в эту тарелку,\nрассматривая её в данном случае как кли\nшлиши. См. примечание.<\/p><h3 id=\"part-75\">\n<font size=\"5\">Приготовление\n\t\t\t\t\tчая и кофе<\/font><\/h3><p>См. слова <strong>Мишна Бруры, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשי״ח<\/span><\/font>, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\t\tקטן ל״א<\/span><\/font><\/strong>, где он подробно\n\t\t\t\t\tрассматривает правильный способ\n\t\t\t\t\tприготовления чашки чая.<\/p><p>Мы сочли правильным изложить\n\t\t\t\t\tразличные способы приготовления чая\n\t\t\t\t\tв соответствии с тем, как это обычно\n\t\t\t\t\tделается в наше время.<\/p><h3 id=\"part-76\"><font size=\"3\">Использование\nчайной заварки, приготовленной до\nШаббата<\/font><\/h3><p><strong>74.<\/strong> Чтобы избежать любых\nсомнений, желательно приготовить\n<strong>процеженную чайную заварку до\nнаступления Шаббата<\/strong>.<\/p><p><strong>75.<\/strong> Если заварка была приготовлена\nдо Шаббата, разрешается налить кипящую\nводу из <strong>михама<\/strong> в чашку, а затем\nдобавить туда заварку, даже если заварка\nхолодная.<\/p><p><strong>76.<\/strong> Нельзя сначала наливать\nхолодную чайную заварку в чашку, а затем\nлить на неё воду из <strong>кли ришон<\/strong>.\nСм. примечание.<\/p><p>Если же заварка осталась горячей с\nмомента её приготовления, например она\nнаходилась на михаме и ещё не остыла,\nлучше сначала налить её в чашку, а затем\nналить на неё воду из кли ришон.<\/p><p>Однако см. примечание: при распространённом\nв наше время способе приготовления\nчайной заварки не очевидно, что разрешается\nделать <strong>ируй из кли ришон на горячую\nзаварку<\/strong>.<\/p><p><strong>77.<\/strong> См. в примечании способ\nприготовления чашки чая в доме <strong>Хазон\nИша<\/strong>.<\/p><h3 id=\"part-77\">Чайные пакетики, находящиеся\nв заварочном чайнике<\/h3><p><strong>78.<\/strong> Тому, кто до Шаббата\nприготовил чайную заварку, положив\nчайные пакетики в чашку или другой\nсосуд, желательно вынуть эти пакетики\nещё до наступления Шаббата.<\/p><p>Если пакетики не были вынуты до Шаббата,\nразрешается наливать заварку из сосуда\nтолько до тех пор, пока находящаяся в\nнём заварка <strong>покрывает чайные\nпакетики<\/strong>. Когда количество заварки\nуменьшилось, нельзя выливать её из\nсосуда из-за опасения запрета <strong>борер<\/strong>.<\/p><p>Также нельзя вынимать чайные пакетики\nиз чашки в Шаббат из-за опасения <strong>борер<\/strong>.\nСм. далее, глава 3, пункты 78–81, где\nразъясняются эти законы.<\/p><p>Тот, кто приготовил чайную заварку до\nШаббата путём <strong>ируя кипятка на чайные\nлистья<\/strong>, — см. выше, примечание 168.<\/p><h3 id=\"part-78\">Приготовление заварки в кли\nшлиши<\/h3><p><strong>79.<\/strong> В Шаббат нельзя готовить\nчайную заварку, помещая чайные пакетики\nили чайные листья даже в <strong>кли шлиши<\/strong>.<\/p><h3 id=\"part-79\">Ируй на сахар<\/h3><p><strong>80.<\/strong> Нельзя лить воду из <strong>кли\nришон<\/strong> на сахар, находящийся в чашке,\nпоскольку сахар растворяется во время\nируя, и получается, что горячая струя\nготовит растворившийся сахар.<\/p><h3 id=\"part-80\">Ируй на заварку или сахар,\nсмешанные с водой<\/h3><p><strong>81.<\/strong> Если человек приготовил\nчашку чая и уже добавил холодную заварку\nв воду либо положил сахар в воду, а теперь\nхочет добавить в чашку горячую воду,\nнельзя наливать туда воду из <strong>кли\nришон<\/strong>, поскольку ируй готовит\nзаварку или сахар, смешанные с водой.<\/p><p>Если же даже после добавления горячей\nводы температура содержимого чашки <strong>не\nдостигнет степени «яд соледет бо»<\/strong>,\nзапрета нет.<\/p><h3 id=\"part-81\">Добавление лимона в кли шени<\/h3><p><strong>82.<\/strong> Если человек хочет положить\nломтик лимона, мёд, листья мяты и тому\nподобное в чашку, имеющую статус <strong>кли\nшени<\/strong>, см. выше, пункт 40, где приведён\nспор поским по этому вопросу.<\/p><h3 id=\"part-82\">Добавление молока в кли шени<\/h3><p><strong>83.<\/strong> Можно облегчить и разрешить\nдобавление <strong>пастеризованного молока<\/strong>\nв горячую воду, находящуюся в <strong>кли\nшени<\/strong>.<\/p><h3 id=\"part-83\">Закон воды в термосе<\/h3><p><strong>84.<\/strong> Кипяток, находящийся в\n<strong>неэлектрическом термосе<\/strong>, имеет\nстатус <strong>кли шени<\/strong>. Поэтому,\nсогласно основному закону, разрешается\nлить из него на чайную заварку или сахар.\nСм. примечание.<\/p><h3 id=\"part-84\">Приготовление кофе<\/h3><p><strong>85.<\/strong> Порошок <strong>нерастворимого\nкофе<\/strong> нельзя класть в горячую воду\nдаже в <strong>кли шлиши<\/strong>, поскольку\nследует опасаться, что он относится к\nкатегории <strong>«калей а-бишуль» — легко\nприготовляющихся продуктов<\/strong>.<\/p><p><strong>86.<\/strong> Растворимый кофе, который\nпрошёл процесс варки во время производства,\nсогласно основному закону разрешается\nкласть в горячую воду, находящуюся в\nчашке, имеющей статус <strong>кли шени<\/strong>.<\/p><p>Некоторые законоучители постановили,\nчто изначально лучше придерживаться\nболее строгого мнения и добавлять\nрастворимый кофе только в чашку, имеющую\nстатус <strong>кли шлиши<\/strong>. То есть\nследует налить воду из кли ришон в одну\nчашку, затем перелить её в другую чашку\nи уже туда добавить порошок растворимого\nкофе.<\/p><p>Следует знать, что существуют виды\nрастворимого кофе, которые <strong>не\nпроходят варку при производстве<\/strong>.\nИх нельзя добавлять в Шаббат даже в кли\nшлиши, как было разъяснено выше, в пунктах\n43–46.<\/p><h3 id=\"part-85\">Использование сахарина<\/h3><p><strong>87.<\/strong> Нельзя класть таблетки\nили порошок сахарина в <strong>кли шени<\/strong>,\nесли только точно не известно, что все\nвещества, из которых изготовлены\nтаблетки, прошли процесс варки во время\nпроизводства.<\/p><p>Если же они не были сварены, а только\nзапечены, возникает опасение <strong>«бишуль\nахар афия» — приготовления после\nвыпечки<\/strong>, и их нельзя помещать в кли\nшени.<\/p><p>Относительно помещения их в <strong>кли\nшлиши<\/strong> см. выше, пункт 41.<\/p><h3 id=\"part-86\">Наливание воды из михама<\/h3><p><strong>88.<\/strong> См. далее, глава 2, пункты\n27–33, где подробно разъясняются законы\nналивания воды из различных видов\n<strong>михамов<\/strong>, в том числе михама с\nизмерительной трубкой, михама, работающего\nпосредством термостата, и тому подобного.<\/p><h3 id=\"part-87\">\n<font size=\"5\">Агаса —\n\t\t\t\t\tпомешивание<\/font><\/h3><p>В Гемаре, <strong>Бейца, лист 34<\/strong>,\n\t\t\t\t\tразъясняется, что тот, кто совершает\n\t\t\t\t\t<strong>агасу<\/strong>, то есть перемешивает\n\t\t\t\t\tблюдо ложкой в то время, когда оно\n\t\t\t\t\tготовится на огне, нарушает запрет\n\t\t\t\t\tТоры <strong>«Мевашель» — приготовление\n\t\t\t\t\tпищи<\/strong>.<\/p><p>Причина заключается в том, что\n\t\t\t\t\tдействие помешивания способствует\n\t\t\t\t\tпроцессу приготовления.<\/p><p>Ришоним расходятся во мнениях\n\t\t\t\t\tотносительно этого закона.<\/p><p>По мнению <strong>большинства ришоним<\/strong>,\n\t\t\t\t\tзапрет агасы относится только к пище,\n\t\t\t\t\tкоторая <strong>ещё не полностью\n\t\t\t\t\tприготовлена<\/strong> и в отношении\n\t\t\t\t\tкоторой существует запрет бишуля.\n\t\t\t\t\tОднако если пища уже <strong>полностью\n\t\t\t\t\tприготовлена<\/strong> и запрета бишуля\n\t\t\t\t\tв отношении неё нет, то нет и запрета\n\t\t\t\t\tагасы.<\/p><p>Некоторые ришоним считают, что\n\t\t\t\t\tследует различать между кастрюлей,\n\t\t\t\t\t<strong>стоящей на огне<\/strong>, и кастрюлей,\n\t\t\t\t\t<strong>не находящейся на огне<\/strong>.<\/p><p>Если кастрюля стоит на огне, запрет\n\t\t\t\t\tагасы действует даже в отношении\n\t\t\t\t\tблюда, которое уже полностью\n\t\t\t\t\tприготовлено. Если же кастрюля не\n\t\t\t\t\tнаходится на огне, то при полностью\n\t\t\t\t\tприготовленном блюде запрета агасы\n\t\t\t\t\tнет.<\/p><p>Однако мнение запрещающих в этом\n\t\t\t\t\tслучае требует объяснения, как\n\t\t\t\t\tспрашивает <strong>Мишна Брура<\/strong>:<\/p><blockquote>«И я не знаю причины: чем агаса\n\t\t\t\t\tстроже самого бишуля, ведь все поским\n\t\t\t\t\tсогласны, что в полностью приготовленной\n\t\t\t\t\tпище нет запрета бишуля».<\/blockquote><p>Тем не менее поским пишут, что на\n\t\t\t\t\tпрактике следует придерживаться в\n\t\t\t\t\tэтом вопросе <strong>строгого мнения<\/strong>.<\/p><p>Кроме того, мы находим у ришоним,\n\t\t\t\t\tчто если в отношении блюда действует\n\t\t\t\t\tзапрет <strong>агасы<\/strong>, то нельзя\n\t\t\t\t\tбрать из него пищу ложкой, поскольку\n\t\t\t\t\tсамо введение ложки в кастрюлю и\n\t\t\t\t\tизвлечение ею пищи приводит к\n\t\t\t\t\tперемешиванию содержимого кастрюли,\n\t\t\t\t\tдаже если человек непосредственно\n\t\t\t\t\tего не размешивает.<\/p><p>Однако этот последний запрет\n\t\t\t\t\tявляется не запретом Торы, а запретом\n\t\t\t\t\t<strong>мидерабанан — установленным\n\t\t\t\t\tмудрецами<\/strong>.<\/p><h3 id=\"part-88\"><font size=\"3\">Запрет\nагасы в блюде, которое ещё не полностью\nприготовлено<\/font><\/h3><p><strong>89.<\/strong> Кастрюлю, в которой находится\nещё не полностью приготовленное блюдо,\nзапрещено перемешивать ложкой так, как\nобычно перемешивают пищу во время\nприготовления. Это является <strong>запретом\nТоры<\/strong>, поскольку <strong>агаса —\nперемешивание<\/strong> ускоряет процесс\nприготовления.<\/p><p><strong>90.<\/strong> Даже если кастрюля не\nнаходится на огне, нельзя перемешивать\nнаходящееся в ней блюдо всё время, пока\nего температура достигает <strong>«яд\nсоледет бо»<\/strong>. Это также запрещено\nпо Торе.<\/p><p><strong>91.<\/strong> Если в кастрюле находится\nблюдо, которое ещё не полностью\nприготовлено, запрещено извлекать из\nнеё пищу ложкой или половником, поскольку,\nпогружая ложку в блюдо и извлекая ею\nпищу, человек тем самым перемешивает\nсодержимое и ускоряет его приготовление.<\/p><p>Однако этот запрет является только\n<strong>мидерабанан — запретом мудрецов<\/strong>.<\/p><p><strong>92.<\/strong> Запрет извлекать ложкой\nпищу из блюда, которое ещё не полностью\nприготовлено, действует даже после\nтого, как кастрюлю сняли с огня, всё\nвремя, пока температура блюда достигает\n<strong>«яд соледет бо»<\/strong>.<\/p><h3 id=\"part-89\">Запрет агасы в полностью\nприготовленном блюде<\/h3><p><strong>93.<\/strong> Некоторые ришоним пишут,\nчто в кастрюле, стоящей на огне, существует\nзапрет Торы совершать агасу, даже если\nнаходящееся в ней блюдо <strong>полностью\nприготовлено<\/strong>. Поским пишут, что\nследует учитывать это мнение.<\/p><p>Поэтому поским постановили, что нельзя\nизвлекать пищу ложкой из кастрюли,\nстоящей на огне, поскольку такое\nизвлечение приводит к перемешиванию\nблюда. Это относится даже к случаю, когда\nблюдо уже полностью приготовлено. См.\nпримечание.<\/p><p><strong>94.<\/strong> Если кастрюлю <strong>сняли\nс огня<\/strong>, разрешается извлекать из\nнеё пищу ложкой, если блюдо полностью\nприготовлено.<\/p><p><strong>95.<\/strong> Некоторые постановили,\nчто из кастрюли, стоящей на металлическом\nлисте <strong>«блех»<\/strong>, но не непосредственно\nнапротив пламени, разрешается извлекать\nпищу ложкой, если блюдо полностью\nприготовлено, даже если кастрюля\nнаходится на таком месте блеха, где\nтемпература достигает «яд соледет бо».<\/p><p>Однако это разрешение <strong>не относится\nк электрической плате<\/strong>, поскольку\nвся её поверхность рассматривается как\nнепосредственно огонь. Поэтому нельзя\nизвлекать пищу ложкой из кастрюли,\nстоящей на электрической плате.<\/p><p><strong>96.<\/strong> Если в кастрюле находится\nзапеканка из лапши — <strong>кугель<\/strong>,\nразрешается отрезать от неё кусок и\nвынуть его даже тогда, когда кастрюля\nвсё ещё стоит на огне.<\/p><p>Причина заключается в том, что здесь\nнет агасы, которая перемешивает различные\nчасти блюда друг с другом.<\/p><h3 id=\"part-90\">Агаса в воде и супе<\/h3><p><strong>97.<\/strong> Разрешается набирать\nложкой или половником воду из <strong>михама<\/strong>,\nстоящего на огне, и в этом нет запрета\nагасы.<\/p><p>Некоторые пишут, что так же разрешается\nнабирать ложкой или половником суп,\nесли в кастрюле нет кусков мяса или\nовощей. Однако есть придерживающиеся\nв этом вопросе более строгого мнения.<\/p><h3 id=\"part-91\">Добавление воды в кастрюлю,\nстоящую на огне<\/h3><p><strong>98.<\/strong> Если человек хочет добавить\nводу в кастрюлю с пищей, стоящую на огне,\nи для этого берёт уже приготовленную\nводу из михама, находящегося на огне,\nчтобы налить её в кастрюлю с блюдом,\nследует следить за тем, чтобы <strong>наливать\nводу осторожно и спокойно<\/strong>.<\/p><p>Если лить воду сильной струёй, то этим\nируем человек будет перемешивать\nсодержимое кастрюли и тем самым совершать\n<strong>агасу<\/strong>.<\/p><h3 id=\"part-92\">\n<font size=\"5\">Водонагреватели<\/font><\/h3><h3 id=\"part-93\">Электрический водонагреватель\n\t\t\t\t— бойлер<\/h3><p><strong>99.<\/strong> Электрический\n\t\t\t\tводонагреватель, устроенный таким\n\t\t\t\tобразом, что при открытии в доме крана\n\t\t\t\tгорячей воды в бойлер поступает\n\t\t\t\tхолодная вода, — запрещено открывать\n\t\t\t\tкран горячей воды в Шаббат, если вода\n\t\t\t\tвнутри бойлера горячая до степени\n\t\t\t\t<strong>«яд соледет бо»<\/strong>.<\/p><p>Причина заключается в том, что при\n\t\t\t\tоткрытии крана в бойлер поступает\n\t\t\t\tхолодная вода, и она подвергается\n\t\t\t\t<strong>бишулю<\/strong> в находящейся там\n\t\t\t\tгорячей воде, которая имеет статус\n\t\t\t\tводы в <strong>кли ришон<\/strong>.<\/p><p>Этот закон действует даже в том\n\t\t\t\tслучае, если водонагреватель был\n\t\t\t\t<strong>выключен ещё до наступления\n\t\t\t\tШаббата<\/strong>.<\/p><h3 id=\"part-94\"><font size=\"3\">Кран\nс одной ручкой<\/font><\/h3><p><strong>100.<\/strong> При использовании крана\nс одной ручкой следует следить за тем,\nчтобы ручка находилась <strong>со стороны\nхолодной воды<\/strong>, таким образом, чтобы\nиз крана вообще не поступала горячая\nвода.<\/p><p>Если человек по ошибке открыл горячую\nводу — см. примечание.<\/p><h3 id=\"part-95\">Система нагрева воды<\/h3><p><strong>101.<\/strong> Если система нагрева воды\nустроена таким образом, что при открытии\nкрана горячей воды <strong>зажигается\nгазовое пламя или включается электрический\nнагревательный элемент<\/strong>, а при\nзакрытии крана пламя или нагревательный\nэлемент выключаются, то, если человек\nпо ошибке открыл такой кран, <strong>запрещено\nзакрывать его в Шаббат<\/strong>, поскольку\nзакрытием крана он гасит пламя или\nотключает нагревательный элемент.<\/p><h3 id=\"part-96\">\n<font size=\"5\">Солнечный\n\t\t\t\t\tводонагреватель — «дуд шемеш»<\/font><\/h3><p>Солнечный водонагреватель состоит\n\t\t\t\t\tиз двух основных частей:<\/p><p><strong>а. Коллектор<\/strong> — система\n\t\t\t\t\tтруб, окрашенных в чёрный цвет и\n\t\t\t\t\tпокрытых стеклом.<\/p><p><strong>б. Бак<\/strong> — в него поступает\n\t\t\t\t\tвода, нагревшаяся в коллекторе. Из\n\t\t\t\t\tверхней части бака выходит труба, по\n\t\t\t\t\tкоторой вода поступает в дом, а в\n\t\t\t\t\tнижнюю часть бака входит труба с\n\t\t\t\t\tводой из общей водопроводной сети.<\/p><p>Когда солнце нагревает воду в\n\t\t\t\t\tколлекторе, эта вода самостоятельно\n\t\t\t\t\tпоступает в бак, а вместо неё из нижней\n\t\t\t\t\tчасти бака в коллектор поступает\n\t\t\t\t\tдругая вода.<\/p><p>Когда вода из бака поступает в дом,\n\t\t\t\t\tвместо неё в бак входит вода из общей\n\t\t\t\t\tводопроводной сети.<\/p><p>В связи с этим возникает несколько\n\t\t\t\t\tвопросов, относящихся к законам\n\t\t\t\t\t<strong>бишуля<\/strong>.<\/p><p><strong>а.<\/strong> Когда человек открывает\n\t\t\t\t\tдома кран горячей воды, вода выходит\n\t\t\t\t\tиз бака, а вместо неё в бак поступает\n\t\t\t\t\tвода из общей водопроводной сети.\n\t\t\t\t\tПолучается, что если вода в баке очень\n\t\t\t\t\tгорячая, то поступающая туда холодная\n\t\t\t\t\tвода смешивается с ней и подвергается\n\t\t\t\t\tбишулю.<\/p><p>Однако здесь нет запрета бишуля <strong>по\n\t\t\t\t\tТоре<\/strong>, поскольку вода в баке была\n\t\t\t\t\tнагрета не огнём, а солнцем. Поэтому\n\t\t\t\t\tона относится к категории <strong>«тольдот\n\t\t\t\t\tхама»<\/strong>, как было разъяснено выше,\n\t\t\t\t\tв пункте 4, где сказано, что такой\n\t\t\t\t\tбишуль запрещён только <strong>мидерабанан<\/strong>.<\/p><p>И хотя человек не намеревается\n\t\t\t\t\tготовить поступающую холодную воду,\n\t\t\t\t\tтем не менее это является <strong>«псик\n\t\t\t\t\tрейша» (<font face=\"Tahoma\"><span>פ״ר<\/span><\/font>)<\/strong>\n\t\t\t\t\t— неизбежным результатом его действия,\n\t\t\t\t\tпоскольку вода приготовится в баке.<\/p><p><strong>б.<\/strong> Существует ещё одно\n\t\t\t\t\tопасение: холодная вода, поступившая\n\t\t\t\t\tв бак, даже если она не нагреется от\n\t\t\t\t\tнаходящейся там горячей воды, в\n\t\t\t\t\tконечном итоге попадёт в коллектор,\n\t\t\t\t\tтрубы которого раскалены, и нагреется\n\t\t\t\t\tот этих труб. Это также относится к\n\t\t\t\t\tбишулю посредством <strong>«тольдот\n\t\t\t\t\tхама»<\/strong>.<\/p><p>Однако относительно этого опасения\n\t\t\t\t\tследует рассмотреть, что речь идёт\n\t\t\t\t\tлишь о <strong>«грама»<\/strong> в запрете\n\t\t\t\t\tмидерабанан — бишуле посредством\n\t\t\t\t\t«тольдот хама». Кроме того, человек\n\t\t\t\t\tне намеревается совершать этот\n\t\t\t\t\tбишуль, а действие относится к\n\t\t\t\t\tкатегории «псик рейша».<\/p><p><strong>в.<\/strong> Когда человек открывает\n\t\t\t\t\tдома кран горячей воды, а затем\n\t\t\t\t\tоткрывает кран холодной воды, холодная\n\t\t\t\t\tвода попадает в струю горячей воды.\n\t\t\t\t\tНа первый взгляд, здесь следует\n\t\t\t\t\tопасаться запрета бишуля.<\/p><p>См. примечание <strong>203<\/strong>, где этот\n\t\t\t\t\tвопрос рассматривается подробно.<\/p><p>В последнее время появился солнечный\n\t\t\t\t\tводонагреватель, устроенный таким\n\t\t\t\t\tобразом, что при выпуске горячей воды\n\t\t\t\t\tиз бака <strong>другая вода не поступает\n\t\t\t\t\tв него взамен<\/strong>. При такой конструкции\n\t\t\t\t\tпервые два вышеупомянутых вопроса\n\t\t\t\t\tне возникают.<\/p><p>Однако третий вопрос остаётся\n\t\t\t\t\tактуальным. См. написанное об этом\n\t\t\t\t\tдалее.<\/p><h3 id=\"part-97\"><font size=\"3\">Законы\nсолнечного водонагревателя<\/font><\/h3><p><strong>102.<\/strong> Нельзя пользоваться <strong>дуд\nшемеш — солнечным водонагревателем<\/strong>,\nпоскольку в момент открытия крана\nгорячей воды вода выходит из бака, а\nвместо неё в бак поступает холодная\nвода, которая подвергается <strong>бишулю<\/strong>\nв находящейся там горячей воде.<\/p><p>Относительно открытия крана горячей\nводы в то время, когда вода в баке <strong>не\nдостигает температуры «яд соледет бо»<\/strong>,\nсм. примечание.<\/p><p><strong>103.<\/strong> Тот, кому необходимо\nвоспользоваться солнечным водонагревателем\nдля нужд <strong>младенца или больного,\nжизни которого не угрожает опасность<\/strong>,\nдолжен задать этот вопрос раввину. См.\nпримечание.<\/p><p><strong>104.<\/strong> В отношении солнечного\nводонагревателя, устроенного таким\nобразом, что можно открыть кран горячей\nводы <strong>без поступления холодной воды\nв бак<\/strong>, необходимо рассмотреть\nнесколько дополнительных опасений. См.\nпримечание.<\/p><p>Всё это относится именно к случаю,\nкогда вода в баке была нагрета <strong>солнечным\nтеплом<\/strong>.<\/p><p>Однако если был включён <strong>электрический\nнагревательный элемент<\/strong> и вода была\nнагрета с его помощью, то вода в баке\nимеет статус воды в <strong>кли ришон,\nнагретом на огне<\/strong>, и в таком случае\n<strong>нет основания разрешать пользоваться\nею вообще<\/strong>.<\/p><h3 id=\"part-98\">\n<font size=\"5\">Использование\n\t\t\t\tувлажнителей воздуха<\/font><\/h3><p>Увлажнитель воздуха — это прибор,\n\t\t\t\tпредназначенный для распространения\n\t\t\t\tводяного пара в воздухе помещения и\n\t\t\t\tповышения его влажности. Обычно он\n\t\t\t\tнеобходим для младенцев или больных.<\/p><p>Существуют два основных вида\n\t\t\t\tувлажнителей: <strong>увлажнители с\n\t\t\t\tгорячим паром<\/strong> и <strong>увлажнители\n\t\t\t\tс холодным паром<\/strong>.<\/p><p>В увлажнителе с горячим паром вода\n\t\t\t\tпоступает в устройство, которое\n\t\t\t\tпропускает через неё электрический\n\t\t\t\tток, нагревает и доводит её до состояния\n\t\t\t\tпара, повышающего влажность воздуха\n\t\t\t\tв помещении.<\/p><p>В увлажнителе с холодным паром вода\n\t\t\t\tне нагревается. Прибор распыляет воду\n\t\t\t\tна специальную сетку, благодаря чему\n\t\t\t\tона разделяется на мельчайшие капли,\n\t\t\t\tкоторые выходят в виде тумана и\n\t\t\t\tраспространяются в воздухе помещения.<\/p><p>Следует выяснить закон использования\n\t\t\t\tэтих приборов в Шаббат.<\/p><p>Относительно <strong>увлажнителя с\n\t\t\t\tгорячим паром<\/strong> при добавлении в\n\t\t\t\tнего воды в Шаббат существует несколько\n\t\t\t\tопасений запрета.<\/p><p><strong>а. Запрет бишуля.<\/strong> Если в\n\t\t\t\tприбор добавляют воду, которая ещё\n\t\t\t\tне была приготовлена, это связано с\n\t\t\t\tзапретом <strong>бишуля<\/strong>. То же\n\t\t\t\tотносится к воде, которая ранее была\n\t\t\t\tприготовлена, но затем остыла.<\/p><p>Даже если добавляют приготовленную\n\t\t\t\tводу, которая ещё не успела остыть,\n\t\t\t\tможет существовать запрет бишуля,\n\t\t\t\tпоскольку вода, поступающая в резервуар\n\t\t\t\tприбора, не сразу попадает в устройство,\n\t\t\t\tкоторое её нагревает. Сначала она\n\t\t\t\tнекоторое время находится вне него\n\t\t\t\tи может там остыть до такой степени,\n\t\t\t\tчто в отношении неё вновь возникнет\n\t\t\t\tзапрет бишуля.<\/p><p><strong>б. Запрет первоначального\n\t\t\t\tпомещения и запрет хазары<\/strong>, которые\n\t\t\t\tбудут разъяснены далее, в главе 2.<\/p><p>Если в прибор добавляют приготовленную\n\t\t\t\tводу, которая сейчас не находится на\n\t\t\t\tогне, например воду из <strong>термоса<\/strong>,\n\t\t\t\tэто связано с запретом первоначального\n\t\t\t\tпомещения на огонь.<\/p><p>Если же добавляют приготовленную\n\t\t\t\tводу из сосуда, стоящего на огне,\n\t\t\t\tвозникает опасение запрета <strong>хазары\n\t\t\t\t— возвращения на огонь<\/strong>.<\/p><p>Даже если в Шаббат вообще не добавляют\n\t\t\t\tводу и прибор работает ещё с кануна\n\t\t\t\tШаббата, следует опасаться запрета\n\t\t\t\t<strong>шеия — оставления на огне<\/strong>,\n\t\t\t\tкак разъясняется в примечании.<\/p><p>Однако поскольку такой прибор\n\t\t\t\tпредназначен для лечения больных,\n\t\t\t\tследует различать <strong>различные\n\t\t\t\tстепени состояния больного<\/strong>, а\n\t\t\t\tтакже случаи, когда действие выполняет\n\t\t\t\tеврей или нееврей, как будет подробно\n\t\t\t\tразъяснено далее в соответствующих\n\t\t\t\tзаконах.<\/p><p><strong>в.<\/strong> Если добавить воду в\n\t\t\t\tприбор невозможно, не выключив его и\n\t\t\t\tзатем не включив снова, либо если для\n\t\t\t\tэтого необходимо вынуть нагревательный\n\t\t\t\tэлемент из резервуара, вследствие\n\t\t\t\tчего электрическая цепь размыкается,\n\t\t\t\tвозникает опасение запретов <strong>боне\n\t\t\t\t— строительства<\/strong> и <strong>сотер —\n\t\t\t\tразрушения<\/strong>.<\/p><p>Что касается <strong>увлажнителя с\n\t\t\t\tхолодным паром<\/strong>, вода в нём вообще\n\t\t\t\tне подвергается бишулю, а лишь\n\t\t\t\tраспыляется в воздухе в виде мельчайших\n\t\t\t\tкапель.<\/p><p>Поэтому при необходимости разрешается\n\t\t\t\tдобавлять в него воду, если устройство\n\t\t\t\tсконструировано таким образом, что\n\t\t\t\tдобавление воды <strong>не требует\n\t\t\t\tразмыкания электрической цепи<\/strong>.\n\t\t\t\tЭто необходимо проверять отдельно\n\t\t\t\tдля каждого конкретного прибора.<\/p><h3 id=\"part-99\"><font size=\"3\">Увлажнитель\nс горячим паром<\/font><\/h3><p><strong>105.<\/strong> При добавлении воды в\nувлажнитель с горячим паром в Шаббат\nсуществуют опасения запрета <strong>бишуля<\/strong>,\nа также запрета <strong>хазары<\/strong> или\nпервоначального помещения на огонь,\nкак было разъяснено во введении к этим\nпунктам.<\/p><p>Поэтому нельзя добавлять в такой\nприбор воду в Шаббат, <strong>даже если эта\nвода уже была приготовлена<\/strong>.<\/p><p><strong>106.<\/strong> Что касается просьбы к\nнееврею добавить приготовленную воду\nв увлажнитель с горячим паром, следует\nразличать степень болезни:<\/p><p><strong>а.<\/strong> Если больной слёг в постель\nи имеет статус <strong>«холе ше-эйн бо\nсакана» — больного, жизни которого не\nугрожает опасность<\/strong>, и таков же\nзакон в отношении маленьких детей,\nкоторые имеют статус «холе ше-эйн бо\nсакана», разрешается добавить воду\nпосредством нееврея.<\/p><p>Причина заключается в том, что для\nнужд больного разрешается попросить\nнееврея совершить даже полноценную\nмелаху.<\/p><p>Поэтому, если приготовленной воды\nнет, разрешается попросить нееврея\nналить в прибор также <strong>неприготовленную\nводу<\/strong>. См. примечание 209.<\/p><p><strong>б.<\/strong> Если речь идёт не о болезни,\nа лишь об обычном дискомфорте или\nстрадании, нельзя добавлять в прибор\nнеприготовленную воду даже посредством\nнееврея.<\/p><p>Относительно добавления приготовленной\nводы посредством нееврея — см. примечание.<\/p><p><strong>107.<\/strong> Очевидно, что если, по\nмнению врача, болезнь может развиться\nдо состояния, при котором возникает\nхотя бы <strong>сомнение в опасности для\nжизни — сафек пикуах нефеш<\/strong>, следует\nразрешить необходимое во всех случаях,\nкогда невозможно сделать это разрешённым\nспособом.<\/p><h3 id=\"part-100\">Увлажнитель с холодным паром<\/h3><p><strong>108.<\/strong> В увлажнителе с холодным\nпаром процесса бишуля нет. Прибор\nраспыляет воду в направлении установленной\nв нём сетки, благодаря чему вода\nразделяется на мельчайшие капли и\nвыходит в воздух помещения в виде пара.<\/p><p>Поэтому здесь нет основания запрещать\nэто со стороны <strong>бишуля<\/strong> или\n<strong>хазары<\/strong>.<\/p><p>Следовательно, при необходимости\nразрешается пользоваться таким прибором\nи добавлять в него воду в Шаббат, при\nусловии, что при этом <strong>не размыкается\nэлектрическая цепь<\/strong>.<\/p><p>Таков же закон в отношении прибора,\nсоздающего холодный пар посредством\n<strong>звуковых волн<\/strong>: разрешается\nдобавлять в него воду, пока в нём ещё\nостаётся вода и прибор продолжает\nработать. И это разрешено именно при\nусловии, что добавление воды происходит\n<strong>без размыкания электрической цепи<\/strong>.<\/p><p>Если же вода закончилась и прибор\nперестал работать либо для добавления\nводы необходимо разомкнуть электрическую\nцепь, то при необходимости следует\n<strong>задать вопрос раввину<\/strong>, поскольку\nиногда использование такого прибора\nнеобходимо для больного, находящегося\nв состоянии опасности для жизни.<\/p><h3 id=\"part-101\"><font size=\"4\">Закон\nо пище, приготовленной в Шаббат, постфактум<\/font><\/h3><p><strong>109.<\/strong> Если человек <strong>намеренно\n(бе-мезид)<\/strong> приготовил пищу в Шаббат,\nему самому запрещено есть это блюдо\n<strong>навсегда<\/strong>. Другим людям\nразрешается есть это блюдо <strong>после\nокончания Шаббата<\/strong>.<\/p><p><strong>110.<\/strong> Если человек приготовил\nпищу в Шаббат <strong>по ошибке (бе-шогег)<\/strong>,\nпоским расходятся во мнениях относительно\nтого, запрещено ли есть её в течение\nсамого Шаббата.<\/p><p>На практике следует запрещать её\nупотребление в Шаббат, кроме случая\n<strong>особой необходимости<\/strong>, когда\nможно придерживаться облегчённого\nмнения.<\/p><p>По всем мнениям, после окончания\nШаббата это блюдо разрешено в пищу.<\/p><p>В этих законах существует множество\nдополнительных деталей, которые будут\nразъяснены далее, в главе, посвящённой\nзаконам <strong>«маасе Шаббат» — результата\nдействия, совершённого в Шаббат<\/strong>.\nВ каждом конкретном случае следует\nобратиться с вопросом к раввину.<\/p>"}, {"title": "Запреты Шеhия, хазара и атмана", "body": "<h3 id=\"part-102\">\n<font size=\"6\">Глава 2 <\/font>\n<\/h3><h3 id=\"part-103\"><font size=\"6\">Запреты\n\t\t\t\t\tШеhия, хазара и атмана<\/font><\/h3><p>Помимо запрета <strong>бишуля<\/strong>,\n\t\t\t\t\tкоторый является запретом Торы,\n\t\t\t\t\tмудрецы установили несколько\n\t\t\t\t\tпостановлений, касающихся приготовления\n\t\t\t\t\tпищи к Шаббату. К ним относятся запреты\n\t\t\t\t\t<strong>Шеhия<\/strong>, <strong>хазара<\/strong> и\n\t\t\t\t\t<strong>атмана<\/strong>.<\/p><p>Сначала разъясним запрет <strong>Шеhия\n\t\t\t\t\t— оставления пищи на огне с кануна\n\t\t\t\t\tШаббата<\/strong>.<\/p><p>Если человек поставил кастрюлю на\n\t\t\t\t\tогонь ещё до наступления Шаббата и\n\t\t\t\t\tона продолжает готовиться в Шаббат,\n\t\t\t\t\tсамо по себе это вообще не является\n\t\t\t\t\tнарушением мелахи бишуль, поскольку\n\t\t\t\t\tчеловек не совершил никакого действия\n\t\t\t\t\tв Шаббат.<\/p><p>Однако мудрецы запретили это из\n\t\t\t\t\tопасения <strong>«шема яхате бе-гехалим»\n\t\t\t\t\t— чтобы человек не стал ворошить\n\t\t\t\t\tугли<\/strong>. То есть, увидев, что блюдо\n\t\t\t\t\tготовится недостаточно хорошо, он\n\t\t\t\t\tможет усилить огонь, поворошив угли.\n\t\t\t\t\tТакое ворошение связано с запретом\n\t\t\t\t\tТоры — мелахой <strong>мавъир (<font face=\"Tahoma\"><span>מבעיר<\/span><\/font>),\n\t\t\t\t\tразжиганием огня<\/strong>.<\/p><p>Существуют случаи, когда мудрецы\n\t\t\t\t\tразрешили оставлять пищу на огне с\n\t\t\t\t\tкануна Шаббата, поскольку в этих\n\t\t\t\t\tситуациях опасение, что человек\n\t\t\t\t\tстанет ворошить угли, значительно\n\t\t\t\t\tменьше.<\/p><p>Например, если блюдо ещё до Шаббата\n\t\t\t\t\tприготовилось до такой степени, при\n\t\t\t\t\tкоторой нет опасения, что человек\n\t\t\t\t\tстанет усиливать огонь, как будет\n\t\t\t\t\tразъяснено далее.<\/p><p>Также разрешение существует в\n\t\t\t\t\tслучае, когда человек совершил с\n\t\t\t\t\tогнём определённые действия,\n\t\t\t\t\tуменьшающие его жар, тем самым показав,\n\t\t\t\t\tчто он не заинтересован в столь\n\t\t\t\t\tсильном огне. Это разрешение называется\n\t\t\t\t\t<strong>«гаруф ве-катум»<\/strong>.<\/p><h3 id=\"part-104\">Шеhия блюда, приготовленного\n\t\t\t\t\tдо Шаббата<\/h3><p>В Гемаре, <strong>Шаббат 36<\/strong>, мудрецы\n\t\t\t\t\tи <strong>Хананья<\/strong> расходятся во\n\t\t\t\t\tмнениях относительно законов Шеhия.<\/p><p>По мнению <strong>мудрецов<\/strong>, даже\n\t\t\t\t\tполностью приготовленное блюдо\n\t\t\t\t\tзапрещено оставлять с кануна Шаббата\n\t\t\t\t\tна плите, которая не является <strong>«груфа\n\t\t\t\t\tу-ктума»<\/strong>, если блюдо находится\n\t\t\t\t\tв состоянии <strong>«мицтамек ве-яфе\n\t\t\t\t\tло»<\/strong>, то есть человек заинтересован\n\t\t\t\t\tв дальнейшем уваривании и дополнительное\n\t\t\t\t\tприготовление улучшает блюдо.<\/p><p>Причина заключается в опасении,\n\t\t\t\t\tчто человек станет ворошить угли,\n\t\t\t\t\tчтобы улучшить блюдо.<\/p><p><strong>Хананья<\/strong> считает, что если\n\t\t\t\t\tблюдо уже приготовилось до степени\n\t\t\t\t\t<strong>«маахаль бен Друсай»<\/strong>, то\n\t\t\t\t\tесть достигло определённой степени\n\t\t\t\t\tприготовления, [его разрешается\n\t\t\t\t\tоставлять на огне].<\/p><h3 id=\"part-105\">Гаруф ве-катум<\/h3><p>Согласно практической алахе, <strong>Шулхан\n\t\t\t\t\tАрух, <font face=\"Tahoma\"><span>סימן רנ״ג\n\t\t\t\t\tסעיף א׳<\/span><\/font><\/strong>, постановляет\n\t\t\t\t\tстрого, согласно мнению мудрецов.<\/p><p><strong>Рамо<\/strong> приводит, что принято\n\t\t\t\t\tпридерживаться облегчённого мнения\n\t\t\t\t\t<strong>Хананьи<\/strong>.<\/p><h3 id=\"part-106\"><font size=\"3\">Подробности\nзаконов Шеhия<\/font><\/h3><p><strong>1.<\/strong> Запрещено оставлять с\nкануна Шаббата кастрюлю на огне, если\nблюдо ещё не приготовилось до степени\n<strong>«маахаль бен Друсай»<\/strong>, то есть\nесли оно ещё непригодно для еды даже в\nслучае крайней необходимости.<\/p><p>Причина запрета заключается в том,\nчто мудрецы опасались, что человек может\nначать <strong>ворошить угли<\/strong>, чтобы\nускорить приготовление, и тем самым\nнарушит запрет Торы — мелаху <strong>авъара\n(<font face=\"Tahoma\"><span>הבערה<\/span><\/font>),\nразжигание огня<\/strong>.<\/p><p>И хотя сегодня обычно готовят не на\nуглях, а на газовых или электрических\nплитах, современные поским рассматривают\nтакие плиты как плиту с углями, поскольку\nмудрецы не делали различий в своём\nпостановлении.<\/p><p>Поэтому запрещено оставлять на них\nблюдо, которое ещё не достигло степени\n<strong>«маахаль бен Друсай»<\/strong>.<\/p><p><strong>2.<\/strong> Относительно степени\nприготовления <strong>«маахаль бен Друсай»<\/strong>\nришоним расходятся во мнениях: составляет\nли она <strong>половину приготовления<\/strong>\nили <strong>треть приготовления<\/strong>.<\/p><p>Согласно практической алахе, <strong>Шулхан\nАрух<\/strong> пишет, что эта степень составляет\n<strong>половину приготовления<\/strong>.<\/p><p><strong>3.<\/strong> Относительно того, как\nопределяется степень половины или трети\nприготовления, см. примечание.<\/p><h3 id=\"part-107\">Шеhия воды, которая не была\nприготовлена до Шаббата<\/h3><p><strong>4.<\/strong> Некоторые современные\nпоским пишут, что в отношении воды,\nкоторая не была приготовлена до Шаббата,\nесли до захода солнца вода достигла\nтемпературы, <strong>несколько превышающей\nстепень «яд соледет бо»<\/strong>, она\nрассматривается как приготовленная до\nШаббата до степени <strong>«маахаль бен\nДрусай»<\/strong>, и её разрешается оставлять\nна огне.<\/p><h3 id=\"part-108\">Тот, кто принимает Шаббат до\nзахода солнца<\/h3><p><strong>5.<\/strong> Если в момент, когда блюдо\nпоставили на огонь, оно ещё не было\nприготовлено до степени «маахаль бен\nДрусай», но <strong>до захода солнца<\/strong>\nоно должно достигнуть этой степени\nприготовления, то изначально разрешается\nоставлять его на огне, даже если человек\nпринял на себя Шаббат до захода солнца.<\/p><h3 id=\"part-109\">Шеhия приготовленной пищи\nили напитка после их остывания<\/h3><p><strong>6.<\/strong> Сухую пищу, которая до\nШаббата приготовилась до степени\n<strong>«маахаль бен Друсай»<\/strong>, разрешается\nоставлять на плите, которая не является\n<strong>«груфа у-ктума»<\/strong>, даже если пища\nполностью остыла.<\/p><p>Мы не опасаемся, что человек усилит\nогонь, чтобы её нагреть.<\/p><p><strong>7.<\/strong> Относительно воды или супа,\nкоторые были приготовлены, а затем\nостыли, см. примечание — разрешается\nли оставлять их на огне.<\/p><h3 id=\"part-110\"><font size=\"3\">Покрытие\nгазовой плиты металлическим листом<\/font><\/h3><p><strong>8.<\/strong> По мнению многих поским,\nесли огонь был покрыт металлическим\nлистом ещё до наступления Шаббата, он\nрассматривается как <strong>«груфа у-ктума»<\/strong>,\nи разрешается оставлять на нём блюдо,\nдаже если оно ещё не приготовилось до\nстепени <strong>«маахаль бен Друсай»<\/strong>.\nТаков общепринятый обычай.<\/p><p>Однако, по мнению <strong>Хазон Иша<\/strong>,\nодного лишь покрытия недостаточно,\nчтобы считать огонь «груфа у-ктума».<\/p><h3 id=\"part-111\">Покрытие ручек газовой плиты<\/h3><p><strong>9.<\/strong> Согласно поским, разрешающим\nШеhия посредством покрытия огня, если\nсам огонь покрыт, этого достаточно,\nчтобы считать его «груфа у-ктума», даже\nесли <strong>ручки регулировки газа не\nпокрыты<\/strong>.<\/p><h3 id=\"part-112\">Изменение силы огня после\nустановки металлического листа<\/h3><p><strong>10.<\/strong> Некоторые пишут, что\nжелательно не изменять огонь после\nтого, как над ним установили металлический\nлист, то есть <strong>не увеличивать и не\nуменьшать пламя<\/strong>.<\/p><h3 id=\"part-113\">Огонь, который невозможно\nусилить<\/h3><p><strong>11.<\/strong> Запрещено оставлять\nкастрюлю на открытом огне, даже если\nпламя уже находится на таком уровне,\nчто <strong>усилить его больше невозможно<\/strong>.<\/p><h3 id=\"part-114\">Покрытие огня в сам Шаббат<\/h3><p><strong>12.<\/strong> Если металлический лист\nне был установлен до Шаббата и человек\nхочет установить его на огонь в Шаббат,\nчтобы затем вернуть на него кастрюлю,\nто если в данных условиях существует\nбольшая вероятность, что часть листа,\nнаходящаяся непосредственно над огнём,\n<strong>раскалится докрасна<\/strong>, запрещено\nустанавливать его в Шаббат из-за запрета\n<strong>мавъир — разжигания огня<\/strong>.<\/p><p>Если же нет опасения, что металл\nраскалится докрасна, великие законоучители\nразрешают это. Однако <strong>Хазон Иш<\/strong>\nзапрещает.<\/p><h3 id=\"part-115\">Шеhия на электрической плате<\/h3><p><strong>13.<\/strong> Электрическая плата,\nспециально предназначенная для Шаббата\nи <strong>не имеющая различных уровней\nнагрева<\/strong>, имеет статус <strong>«груфа\nу-ктума»<\/strong>. Поэтому разрешается\nоставлять на ней блюда с кануна Шаббата.<\/p><p>Некоторые придерживаются более\nстрогого мнения и требуют покрыть её\n<strong>толстой алюминиевой фольгой<\/strong>.<\/p><p><strong>14.<\/strong> Электрическая плата или\nэлектрическая плитка, на которых обычно\nготовят в будние дни, а также <strong>электрический\nмихам<\/strong>, не позволяют оставлять на\nних блюдо, которое ещё не приготовилось\nдо степени <strong>«маахаль бен Друсай»<\/strong>,\nдаже если электрические нагревательные\nэлементы внутри прибора закрыты.<\/p><p>См. далее, пункты <strong>27–33<\/strong>, где\nболее подробно разъясняются законы\nиспользования электрического михама\nв Шаббат.<\/p><h3 id=\"part-116\">Шеhия внутри электрической\nдуховки<\/h3><p><strong>15.<\/strong> Запрещено оставлять в\nэлектрической духовке блюда, которые\nещё не достигли степени приготовления\n<strong>«маахаль бен Друсай»<\/strong>, даже\nесли на ручках обозначен <strong>режим\nШаббата<\/strong>.<\/p><p>Поскольку духовка не является «груфа\nу-ктума», разрешения Шеhия здесь нет:\nследует опасаться, что человек повернёт\nручку и увеличит температуру.<\/p><p>Если человек не успел до наступления\nШаббата приготовить блюдо до вышеуказанной\nстепени, решением является <strong>заклеить\nклейкой лентой ручку, регулирующую\nтемпературу<\/strong>, таким образом, чтобы\nеё невозможно было повернуть, не сняв\nпредварительно ленту, как будет разъяснено\nдалее, в пункте 11.<\/p><p>Если же пища ещё до Шаббата приготовилась\nдо степени <strong>«маахаль бен Друсай»<\/strong>,\nразрешается оставлять её в духовке.<\/p><p>Это относится именно к духовке, <strong>не\nподключённой к термостату<\/strong>. Если\nже духовка работает с термостатом,\nследует спросить раввина, как поступать.<\/p><h3 id=\"part-117\">Шеhия на приборах, предназначенных\nдля отопления дома<\/h3><p><strong>16.<\/strong> Отопительные приборы,\nпредназначенные для обогрева дома и\n<strong>вообще не используемые для\nприготовления пищи<\/strong>, не подпадают\nпод запрет Шеhия.<\/p><p>Поэтому разрешается оставлять блюдо\nна <strong>радиаторе<\/strong>, предназначенном\nдля отопления дома, а также на обогревателе,\nна котором обычно не разогревают пищу.<\/p><p>Однако следует остерегаться <strong>укутывать\nкастрюлю одеялами<\/strong> и ставить её на\nтакие отопительные приборы из-за запрета\n<strong>атмана бе-давар а-мосиф эвель —\nукутывания материалом, добавляющим\nтепло<\/strong>, как будет разъяснено далее,\nв пункте 75.<\/p><h3 id=\"part-118\">\n<font size=\"4\">Разрешение\n\t\t\t\t\t«туах бе-тит» — замазывание глиной<\/font><\/h3><p>В Гемаре, <strong>Шаббат 18<\/strong>,\n\t\t\t\t\tразъясняется, что разрешается\n\t\t\t\t\tоставлять мясо в печи, в которой\n\t\t\t\t\tнаходятся угли и которая не является\n\t\t\t\t\t<strong>«груфа у-ктума»<\/strong>, если\n\t\t\t\t\tотверстие печи закрыто и <strong>замазано\n\t\t\t\t\tглиной<\/strong>. То есть глиной замазано\n\t\t\t\t\tместо соединения крышки печи с самой\n\t\t\t\t\tпечью.<\/p><p>Ришоним расходятся во мнениях\n\t\t\t\t\tотносительно объяснения этой Гемары.<\/p><p><strong>Раши<\/strong> пишет, что причина\n\t\t\t\t\tразрешения заключается в том, что\n\t\t\t\t\tпри закрытой таким образом печи тот,\n\t\t\t\t\tкто захочет поворошить угли, должен\n\t\t\t\t\tсначала приложить усилия и удалить\n\t\t\t\t\tглину, и только после этого он сможет\n\t\t\t\t\tоткрыть печь и поворошить угли.<\/p><p>Предполагается, что прежде чем он\n\t\t\t\t\tуспеет это сделать, он вспомнит, что\n\t\t\t\t\tсегодня Шаббат, и не станет ворошить\n\t\t\t\t\tугли.<\/p><p>Так постановляет практическую\n\t\t\t\t\tалаху <strong>Рамо, <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tרנ״ד סעיף א׳<\/span><\/font><\/strong>.<\/p><p>Получается, что согласно постановлению\n\t\t\t\t\tРамо существует дополнительное\n\t\t\t\t\tразрешение <strong>Шеhия<\/strong> для блюда,\n\t\t\t\t\tкоторое ещё не приготовилось до\n\t\t\t\t\tстепени <strong>«маахаль бен Друсай»<\/strong>,\n\t\t\t\t\tв печи, которая не является «груфа\n\t\t\t\t\tу-ктума»: когда невозможно обычным\n\t\t\t\t\tспособом вмешаться в огонь, а для\n\t\t\t\t\tэтого необходимо сначала совершить\n\t\t\t\t\t<strong>дополнительное действие, требующее\n\t\t\t\t\tусилия<\/strong>.<\/p><p><strong>Рамбам<\/strong> объясняет приведённые\n\t\t\t\t\tвыше слова Гемары иначе. Согласно\n\t\t\t\t\tего объяснению, из этой Гемары нет\n\t\t\t\t\tисточника для разрешения Шеhия даже\n\t\t\t\t\tв случае, когда человеку необходимо\n\t\t\t\t\tприложить дополнительные усилия,\n\t\t\t\t\tпрежде чем он сможет вмешаться в\n\t\t\t\t\tогонь.<\/p><p>Такого объяснения придерживается\n\t\t\t\t\t<strong>Шулхан Арух<\/strong> там же.<\/p><p>Согласно постановлению <strong>Рамо<\/strong>,\n\t\t\t\t\tдалее будут разъяснены дополнительные\n\t\t\t\t\tслучаи, в которых разрешается оставлять\n\t\t\t\t\tблюда на огне с кануна Шаббата.<\/p><h3 id=\"part-119\"><font size=\"3\">Установка\nзамка на дверцу духовки<\/font><\/h3><p><strong>17.<\/strong> Хазон Иш пишет, что тот,\nкто хочет оставить блюдо в духовке,\nкоторая не является <strong>«груфа у-ктума»<\/strong>,\nдолжен установить замок и запереть\nдверцу духовки.<\/p><p>В таком случае запрета <strong>Шеhия<\/strong>\nнет, поскольку это подобно печи <strong>«туах\nбе-тит» — замазанной глиной<\/strong>.<\/p><p>Из слов Хазон Иша следует, что это\nразрешение посредством запирания\nотносится также к случаю оставления\nкастрюли на <strong>электрической плите<\/strong>.<\/p><h3 id=\"part-120\">Заклеивание ручек газа или\nэлектрической плиты<\/h3><p><strong>18.<\/strong> Представляется, что если\nчеловек заклеил клейкой лентой ручки\nгаза или электрической плиты таким\nобразом, что невозможно изменить уровень\nнагрева, не сняв предварительно клейкую\nленту, это разрешено по закону <strong>«туах\nбе-тит»<\/strong>.<\/p><h3 id=\"part-121\">Снятие ручек газовой плиты<\/h3><p><strong>19.<\/strong> Относительно снятия ручек\nгазовой плиты таким образом, что для\nизменения величины пламени потребуется\nсначала вернуть ручки на место, некоторые\nпишут, что <strong>не следует придерживаться\nоблегчённого мнения<\/strong>, а другие\nразрешают это.<\/p><h3 id=\"part-122\">Металлическое покрытие,\nзакрывающее ручки газа<\/h3><p><strong>20.<\/strong> Если металлический лист,\nустановленный над газовой плитой, имеет\nзагнутую часть, закрывающую ручки таким\nобразом, что невозможно изменить уровень\nогня, не сняв сначала кастрюли с листа\nи не подняв сам лист, это рассматривается\nкак <strong>«туах бе-тит»<\/strong>, и разрешается\nсовершать на нём <strong>Шеhия<\/strong>.<\/p><p>Однако если часть металлического\nпокрытия, закрывающую ручки, можно <strong>легко\nподнять<\/strong>, это не считается «туах\nбе-тит».<\/p><h3 id=\"part-123\">\n<font size=\"5\">«Кдера хая» —\n\t\t\t\t\tсовершенно сырое блюдо<\/font><\/h3><p>Выше было разъяснено, что мудрецы\n\t\t\t\t\tзапретили <strong>Шеhия<\/strong> — оставлять\n\t\t\t\t\tблюдо на огне с кануна Шаббата — из\n\t\t\t\t\tопасения, что человек захочет ускорить\n\t\t\t\t\tприготовление и станет <strong>ворошить\n\t\t\t\t\tугли<\/strong>.<\/p><p>Поскольку именно это является\n\t\t\t\t\tпричиной запрета, в Гемаре, <strong>Шаббат\n\t\t\t\t\t18<\/strong>, сказано: если человек ставит\n\t\t\t\t\tблюдо на огонь таким образом, что к\n\t\t\t\t\tмоменту наступления Шаббата <strong>процесс\n\t\t\t\t\tприготовления ещё вообще не начался<\/strong>,\n\t\t\t\t\tи даже если он станет ворошить угли,\n\t\t\t\t\tблюдо всё равно не будет готово к\n\t\t\t\t\tобычному времени вечерней трапезы\n\t\t\t\t\tШаббата, разрешается оставлять такое\n\t\t\t\t\tблюдо на огне.<\/p><p>Причина заключается в том, что\n\t\t\t\t\tчеловек <strong>отвлекает своё внимание\n\t\t\t\t\tот вмешательства в огонь<\/strong>: для\n\t\t\t\t\tвечерней трапезы Шаббата блюдо всё\n\t\t\t\t\tравно не будет готово, даже если он\n\t\t\t\t\tстанет ворошить угли, а к дневной\n\t\t\t\t\tтрапезе Шаббата оно будет готово и\n\t\t\t\t\tбез ворошения углей.<\/p><p>Это разрешение называется <strong>«кдера\n\t\t\t\t\tхая» (<font face=\"Tahoma\"><span>קדרה\n\t\t\t\t\tחייתא<\/span><\/font>)<\/strong>.<\/p><h3 id=\"part-124\"><font size=\"3\">Законы\n«кдера хая»<\/font><\/h3><p><strong>21.<\/strong> Разрешается с кануна\nШаббата поставить на огонь блюдо, которое\n<strong>ещё вообще не начало готовиться<\/strong>,\nесли даже при усилении огня оно не будет\nготово к обычному времени вечерней\nтрапезы Шаббата.<\/p><p><strong>22.<\/strong> Однако если блюдо начало\nготовиться ещё до наступления Шаббата,\nно не достигло степени <strong>«маахаль\nбен Друсай»<\/strong>, разъяснённой выше, в\nпункте 2, это разрешение не действует.<\/p><p>Следует знать, что поскольку начало\nпроцесса бишуля считается с момента,\nкогда блюдо достигает температуры <strong>«яд\nсоледет бо»<\/strong>, разрешение <strong>«кдера\nхая»<\/strong> действует только в том случае,\nесли блюдо достигнет температуры «яд\nсоледет бо» лишь <strong>незадолго до захода\nсолнца<\/strong>, а не раньше.<\/p><p>Если же оно достигнет температуры «яд\nсоледет бо» раньше, то к моменту захода\nсолнца процесс приготовления уже\nначался, и такое блюдо больше не считается\n<strong>«кдера хая»<\/strong>.<\/p><p><strong>23.<\/strong> В обычных условиях нашего\nвремени в Эрец-Исраэль вечерняя трапеза\nШаббата проходит примерно через\n<strong>три-четыре часа после захода солнца<\/strong>.\nБольшинство блюд, поставленных на огонь,\nуспеют приготовиться к трапезе, если\nусилить огонь.<\/p><p>Поэтому разрешение <strong>«кдера хая»<\/strong>\nна практике встречается редко, поскольку\nчеловек может усилить огонь, чтобы\nускорить приготовление.<\/p><p>Это разрешение действует только в\nслучае, когда блюдо находится на небольшом\nогне и <strong>даже при его усилении не\nуспеет приготовиться к вечерней трапезе\nШаббата<\/strong>. См. примечание.<\/p><h3 id=\"part-125\">\n<font size=\"4\">Если совершил\n\t\t\t\tШеhия запрещённым способом — становится\n\t\t\t\tли блюдо запрещённым?<\/font><\/h3><p>В <strong>симан 318, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\tא׳<\/span><\/font><\/strong> разъясняется закон о\n\t\t\t\tчеловеке, который приготовил пищу в\n\t\t\t\tШаббат: в каких случаях приготовленное\n\t\t\t\tблюдо запрещается в пищу, а в каких —\n\t\t\t\tне запрещается.<\/p><p>Поским расходятся в этом вопросе.<\/p><p>По мнению <strong>Шулхан Аруха и Рамо<\/strong>,\n\t\t\t\tдаже если человек приготовил пищу в\n\t\t\t\tШаббат <strong>бе-шогег — по ошибке<\/strong>,\n\t\t\t\tэто блюдо запрещено есть в течение\n\t\t\t\tсамого Шаббата и разрешается только\n\t\t\t\tпосле его окончания.<\/p><p>Если же он приготовил пищу <strong>бе-мезид\n\t\t\t\t— намеренно<\/strong>, самому приготовившему\n\t\t\t\tзапрещено есть это блюдо навсегда, а\n\t\t\t\tдругим разрешается есть его после\n\t\t\t\tокончания Шаббата.<\/p><p>По мнению <strong>Гра<\/strong>, в соответствии\n\t\t\t\tс мнением поским, на которых он\n\t\t\t\tопирается, если человек приготовил\n\t\t\t\tпищу <strong>бе-шогег<\/strong>, блюдо разрешается\n\t\t\t\tесть даже в сам Шаббат. Если же он\n\t\t\t\tприготовил её <strong>бе-мезид<\/strong>, блюдо\n\t\t\t\tзапрещено до окончания Шаббата.<\/p><p>Этот вопрос, с Божьей помощью, будет\n\t\t\t\tразъяснён в главе, посвящённой законам\n\t\t\t\t<strong>«маасе Шаббат»<\/strong>.<\/p><p>См. там <strong>Мишна Брура, <font face=\"Tahoma\"><span>סעיף\n\t\t\t\tקטן ז׳<\/span><\/font><\/strong>, который пишет,\n\t\t\t\tчто основная алаха соответствует\n\t\t\t\tмнению <strong>Шулхан Аруха<\/strong>. Однако\n\t\t\t\tв случае необходимости можно положиться\n\t\t\t\tна мнение <strong>Гра<\/strong> и облегчить в\n\t\t\t\tслучае, когда человек совершил бишуль\n\t\t\t\tбе-шогег, разрешив есть приготовленное\n\t\t\t\tблюдо в сам Шаббат.<\/p><p>Однако в отношении постановлений\n\t\t\t\tмудрецов, связанных с <strong>Шеhия, хазара\n\t\t\t\tи атмана<\/strong>, мудрецы установили\n\t\t\t\tболее строгий закон и запретили блюдо\n\t\t\t\tв течение самого Шаббата, <strong>даже\n\t\t\t\tесли нарушение было совершено бе-шогег<\/strong>.<\/p><p>То есть даже согласно мнению Гра,\n\t\t\t\tкоторый придерживается облегчённого\n\t\t\t\tмнения в отношении бишуля, совершённого\n\t\t\t\tбе-шогег, нельзя облегчать в случае,\n\t\t\t\tкогда человек по ошибке совершил\n\t\t\t\tзапрещённую <strong>Шеhия<\/strong>, запрещённую\n\t\t\t\t<strong>хазару<\/strong> или запрещённую\n\t\t\t\t<strong>атману<\/strong>.<\/p><h3 id=\"part-126\"><font size=\"3\">Если\nпо ошибке совершил запрещённую Шеhия<\/font><\/h3><p><strong>24.<\/strong> Если человек по ошибке\nоставил кастрюлю на огне запрещённым\nспособом, то есть блюдо ещё не достигло\nстепени <strong>«маахаль бен Друсай»<\/strong>,\nон должен снять кастрюлю с огня.<\/p><p>Причина заключается в том, что каждое\nмгновение, пока кастрюля остаётся на\nогне, он нарушает запрет <strong>Шеhия<\/strong>,\nи существует опасение, что он станет\nворошить угли.<\/p><p><strong>25.<\/strong> Если он не снял кастрюлю\nс огня и блюдо продолжило готовиться,\nоно запрещено в пищу <strong>до окончания\nШаббата<\/strong>.<\/p><p><strong>26.<\/strong> Однако поским пишут, что\nна практике следует запрещать только\nблюдо, предназначенное для еды <strong>вечером\nв Шаббат<\/strong>.<\/p><p>Если же блюдо изначально было оставлено\nна огне с намерением съесть его <strong>во\nвремя дневной трапезы Шаббата<\/strong>, то\nпостфактум (<strong>бедиавад<\/strong>) оно\nразрешено в пищу.<\/p><h3 id=\"part-127\">\n<font size=\"5\">Использование\n\t\t\t\t\tмихама для нагревания воды в Шаббат<\/font><\/h3><p>Использование <strong>михама<\/strong> в\n\t\t\t\t\tШаббат может быть связано с несколькими\n\t\t\t\t\tзапретами, относящимися к законам\n\t\t\t\t\t<strong>бишуля<\/strong> и <strong>Шеhия<\/strong>.<\/p><p>Существуют различные виды михамов,\n\t\t\t\t\tи в отношении каждого из них возникают\n\t\t\t\t\tсвои вопросы, как будет разъяснено\n\t\t\t\t\tдалее.<\/p><p>Ниже будут изложены различные\n\t\t\t\t\tстороны этих вопросов, однако для\n\t\t\t\t\tпрактического решения следует\n\t\t\t\t\tобратиться к раввину. См. также далее,\n\t\t\t\t\tпримечание 123, где рассматриваются\n\t\t\t\t\tдополнительные вопросы, связанные\n\t\t\t\t\tс извлечением воды из михама и её\n\t\t\t\t\tналиванием в кастрюлю.<\/p><h3 id=\"part-128\">а. Михам, стоящий на огне,\n\t\t\t\t\tи электрический михам без термостата<\/h3><p>Если вода не закипела до наступления\n\t\t\t\t\tШаббата и в Шаббат также ещё не\n\t\t\t\t\tдостигла кипения, а продолжает\n\t\t\t\t\tнагреваться, существует опасение\n\t\t\t\t\tзапрета при использовании такого\n\t\t\t\t\tмихама всё время, пока вода не достигла\n\t\t\t\t\tкипения. См. примечание.<\/p><p>Кроме того, при использовании такого\n\t\t\t\t\tмихама могут возникать вопросы,\n\t\t\t\t\tсвязанные с запретом <strong>Шеhия<\/strong>,\n\t\t\t\t\tкак будет подробно разъяснено далее.<\/p><p>Поэтому следует следить за тем,\n\t\t\t\t\tчтобы вода <strong>закипела ещё до\n\t\t\t\t\tнаступления Шаббата<\/strong>.<\/p><h3 id=\"part-129\">б. Михам с термостатом<\/h3><p>Если в михаме установлен термостат,\n\t\t\t\t\tкоторый отключает нагревательные\n\t\t\t\t\tэлементы, когда вода достигает\n\t\t\t\t\tопределённой температуры, и снова\n\t\t\t\t\tвключает их, когда температура воды\n\t\t\t\t\tпонижается, то при извлечении воды\n\t\t\t\t\tиз михама в момент, когда нагревательные\n\t\t\t\t\tэлементы <strong>выключены<\/strong>, возникает\n\t\t\t\t\tопасение запрета, даже если вода\n\t\t\t\t\tполностью закипела ещё до Шаббата.<\/p><p>Причина заключается в том, что при\n\t\t\t\t\tизвлечении воды вместо неё в михам\n\t\t\t\t\tпоступает воздух, который охлаждает\n\t\t\t\t\tнаходящуюся там воду. Когда\n\t\t\t\t\tнагревательные элементы выключены,\n\t\t\t\t\tменьшее количество воды быстрее\n\t\t\t\t\tохлаждается из-за поступившего\n\t\t\t\t\tхолодного воздуха. В результате\n\t\t\t\t\tтермостат <strong>раньше включит\n\t\t\t\t\tнагревательные элементы<\/strong>.<\/p><p>Если же воду извлекают из михама в\n\t\t\t\t\tмомент, когда нагревательные элементы\n\t\t\t\t\t<strong>включены<\/strong>, также возникает\n\t\t\t\t\tопасение запрета. Уменьшая количество\n\t\t\t\t\tводы в михаме, человек приводит к\n\t\t\t\t\tтому, что работающие нагревательные\n\t\t\t\t\tэлементы быстрее нагревают оставшуюся\n\t\t\t\t\tводу и в результате <strong>выключатся\n\t\t\t\t\tраньше обычного времени<\/strong>.\n\t\t\t\t\tПолучается, что человек способствует\n\t\t\t\t\tболее раннему отключению нагревательных\n\t\t\t\t\tэлементов.<\/p><p>В наше время распространены\n\t\t\t\t\tводонагреватели, называемые\n\t\t\t\t\t<strong>электрическими термосами<\/strong>.\n\t\t\t\t\tСреди них есть такие модели, в которых\n\t\t\t\t\tизвлечение воды вообще не приводит\n\t\t\t\t\tк включению нагревательного элемента,\n\t\t\t\t\tи ими разрешается пользоваться.<\/p><p>Однако существуют модели, в которых\n\t\t\t\t\tизвлечение воды приводит к включению\n\t\t\t\t\tнагревательного элемента, и в отношении\n\t\t\t\t\tних существует вышеупомянутое\n\t\t\t\t\tопасение запрета.<\/p><h3 id=\"part-130\">в. Михам с трубкой,\n\t\t\t\t\tпоказывающей уровень воды<\/h3><p>В отношении михама с измерительной\n\t\t\t\t\tтрубкой, показывающей уровень воды,\n\t\t\t\t\tможно было бы предположить, что его\n\t\t\t\t\tиспользование в Шаббат связано с\n\t\t\t\t\tопасением запрета.<\/p><p>Причина заключается в том, что во\n\t\t\t\t\tвремя кипячения воды вода, находящаяся\n\t\t\t\t\tв измерительной трубке, не достигает\n\t\t\t\t\tкипения, а нагревается лишь до\n\t\t\t\t\tопределённой температуры. Когда из\n\t\t\t\t\tмихама выпускают воду, вода из трубки\n\t\t\t\t\tодновременно поступает внутрь михама\n\t\t\t\t\tи нагревается до более высокой\n\t\t\t\t\tтемпературы, что могло бы представлять\n\t\t\t\t\tсобой запрет <strong>бишуля<\/strong>.<\/p><p>Однако в действительности вода в\n\t\t\t\t\tизмерительной трубке <strong>постоянно\n\t\t\t\t\tобменивается с водой внутри михама<\/strong>,\n\t\t\t\t\tдаже когда из самого михама вообще\n\t\t\t\t\tне выпускают воду.<\/p><p>Примерно в течение часа после\n\t\t\t\t\tзакипания воды вся вода, находящаяся\n\t\t\t\t\tв трубке, успевает смениться. После\n\t\t\t\t\tэтого опасения бишуля нет.<\/p><p>Поэтому таким михамом разрешается\n\t\t\t\t\tпользоваться <strong>после того, как\n\t\t\t\t\tпрошёл один час с момента закипания\n\t\t\t\t\tводы<\/strong>. См. примечание.<\/p><h3 id=\"part-131\">г. Шеhия в электрическом\n\t\t\t\t\tмихаме<\/h3><p>Электрический михам в отношении\n\t\t\t\t\tзапрета <strong>Шеhия<\/strong> имеет статус\n\t\t\t\t\tогня, который не является <strong>«груфа\n\t\t\t\t\tу-ктума»<\/strong>, как было разъяснено\n\t\t\t\t\tвыше, в пункте 14.<\/p><p>Поэтому нельзя оставлять воду в\n\t\t\t\t\tтаком михаме на Шаббат, если до\n\t\t\t\t\tнаступления Шаббата она не достигла\n\t\t\t\t\tпо меньшей мере температуры <strong>«яд\n\t\t\t\t\tсоледет бо»<\/strong>.<\/p><h3 id=\"part-132\">д. Постановление из\n\t\t\t\t\tопасения, что человек добавит воду,\n\t\t\t\t\tчтобы прибор не повредился<\/h3><p>При использовании воды из михама\n\t\t\t\t\tследует также учитывать слова <strong>Мишна\n\t\t\t\t\tБруры в конце <font face=\"Tahoma\"><span>סימן\n\t\t\t\t\tשי״ח<\/span><\/font><\/strong>, приведённые от\n\t\t\t\t\tимени Иерусалимского Талмуда.<\/p><p>В отношении михама, из-под которого\n\t\t\t\t\tне выгребли угли, сказано, что\n\t\t\t\t\tзапрещается пользоваться находящейся\n\t\t\t\t\tв нём водой, поскольку, если вода\n\t\t\t\t\tполностью закончится, угли могут\n\t\t\t\t\tповредить пустой михам. Поэтому\n\t\t\t\t\tсуществует постановление мудрецов\n\t\t\t\t\tиз опасения, что человек <strong>добавит\n\t\t\t\t\tводу в михам<\/strong>.<\/p><p>На первый взгляд, это постановление\n\t\t\t\t\tотносится также к электрическому\n\t\t\t\t\tмихаму: если вода полностью закончится,\n\t\t\t\t\tнагревательный элемент может\n\t\t\t\t\tповредиться.<\/p><p>Однако обычно кран михама расположен\n\t\t\t\t\tтаким образом, что даже после\n\t\t\t\t\tпрекращения подачи воды через кран\n\t\t\t\t\t<strong>нагревательные элементы всё\n\t\t\t\t\tравно остаются покрыты водой<\/strong>.<\/p><p>Поэтому разрешается пользоваться\n\t\t\t\t\tмихамом, выпуская воду через кран.\n\t\t\t\t\tОднако после того, как уровень воды\n\t\t\t\t\tопустился до высоты крана, <strong>нельзя\n\t\t\t\t\tизвлекать из михама оставшуюся воду\n\t\t\t\t\tдругим способом<\/strong>.<\/p><p>Подробности этих законов будут\n\t\t\t\t\tразъяснены далее.<\/p><h3 id=\"part-133\"><font size=\"3\">Использование\nобычного михама и михама с термостатом<\/font><\/h3><p><strong>27.<\/strong> Следует позаботиться о\nтом, чтобы вода в михаме <strong>закипела\nещё до наступления Шаббата<\/strong>.<\/p><p><strong>28.<\/strong> Если не успели вскипятить\nводу до наступления Шаббата, следует\nразличать два случая:<\/p><p><strong>а.<\/strong> Если огонь имеет статус\n<strong>«груфа у-ктума»<\/strong>, например михам\nс водой стоит на покрытом огне согласно\nпринятому обычаю — см. выше, пункт 8, —\nлибо он стоит на электрической плате,\nпредназначенной специально для\nиспользования в Шаббат, на которой\nобычно не готовят и температуру которой\nневозможно увеличить, — см. выше, пункт\n13, — запрета <strong>Шеhия<\/strong> нет.<\/p><p>Разрешается оставить михам на таком\nисточнике тепла, чтобы вода закипела в\nШаббат.<\/p><p>Однако следует остерегаться извлекать\nводу из михама <strong>до того, как она\nзакипела<\/strong>, из-за опасения нарушения\nмелахи <strong>бишуль<\/strong>.<\/p><p><strong>б.<\/strong> Если огонь имеет статус\nогня, который <strong>не является «груфа\nу-ктума»<\/strong>, например михам стоит на\nнепокрытом огне или речь идёт об\nэлектрическом михаме, существует запрет\n<strong>Шеhия<\/strong>, если до захода солнца\nвода не достигла температуры <strong>«яд\nсоледет бо»<\/strong>.<\/p><p>См. выше, глава 1, примечание 29, где\nразъясняется, какая температура считается\nэтой степенью согласно строгому мнению.<\/p><p>В таком случае михам необходимо <strong>снять\nс огня<\/strong>.<\/p><p><strong>29.<\/strong> Изначально желательно\nпользоваться в Шаббат михамом, <strong>в\nкотором нет термостата<\/strong>.<\/p><p>Однако если необходимо пользоваться\nмихамом с термостатом, следует извлекать\nиз него воду <strong>в то время, когда\nнагревательные элементы включены<\/strong>,\nа не тогда, когда они выключены.<\/p><h3 id=\"part-134\">Михам с измерительной трубкой<\/h3><p><strong>30.<\/strong> Электрическим михамом,\nимеющим трубку для измерения уровня\nводы, следует пользоваться только <strong>после\nтого, как прошёл один час с момента\nзакипания воды<\/strong>.<\/p><p>К этому времени вода в измерительной\nтрубке успевает смениться, и получается,\nчто вся вода уже была приготовлена.<\/p><h3 id=\"part-135\">Электрический михам, в котором\nосталось мало воды<\/h3><p><strong>31.<\/strong> Если электрическим михамом\nпользовались в Шаббат и уровень воды\nопустился до высоты крана так, что при\nоткрытии крана вода уже не выходит,\nзапрещено извлекать оставшуюся воду в\nШаббат, например <strong>наклоняя михам\nили используя половник<\/strong>.<\/p><p>Причина — постановление из опасения,\nчто человек может добавить воду, чтобы\nнагревательный элемент не повредился.<\/p><p>Если же в михаме имеется <strong>предохранительный\nвыключатель<\/strong>, отключающий\nэлектричество, когда вода заканчивается\nи нагревательный элемент чрезмерно\nнагревается, разрешается извлекать из\nнего воду.<\/p><p>Однако если состояние уже близко к\nтому, при котором предохранительный\nвыключатель отключит электрический\nток, воду извлекать запрещено из опасения,\nчто этим действием человек приведёт к\n<strong>выключению прибора<\/strong>.<\/p><h3 id=\"part-136\">Включение михама посредством\nтаймера Шаббата<\/h3><p><strong>32.<\/strong> Электрический михам имеет\nстатус плиты, которая <strong>не является\n«груфа у-ктума»<\/strong>, и на ней запрещено\nоставлять неприготовленную пищу.<\/p><p>Поэтому запрещено включать михам\nпосредством <strong>таймера Шаббата<\/strong>,\nдаже если таймер был настроен ещё до\nШаббата, если находящаяся в михаме вода\nещё не была приготовлена.<\/p><p>Причина заключается в том, что в момент\nвключения михама возникает ситуация\nзапрещённой <strong>Шеhия<\/strong>: вода\nпродолжает готовиться на источнике\nтепла.<\/p><p>Если же вода в михаме уже была\nприготовлена, а затем снова остыла, см.\nпримечание.<\/p><h3 id=\"part-137\">Аппарат для минеральной воды<\/h3><p><strong>33.<\/strong> Из аппарата, из которого\nможно получать горячую или холодную\nминеральную воду, нельзя наливать\n<strong>горячую воду<\/strong>, поскольку вместо\nнеё в аппарат поступает неприготовленная\nвода, которая затем подвергается бишулю\nвнутри михама.<\/p><p>Что касается извлечения <strong>холодной\nводы<\/strong>, это зависит от закона об\nоткрытии электрического холодильника\nв Шаббат, когда открытие приводит к\nвключению двигателя.<\/p><p>Этот закон будет разъяснён в главе,\nпосвящённой использованию <strong>электрических\nприборов в Шаббат<\/strong>.<\/p><h3 id=\"part-138\">\n<font size=\"5\">Законы Шеhия при\n\t\t\t\tотоплении дома<\/font><\/h3><p>В Мишне, <strong>Шаббат 20<\/strong>, разъясняется,\n\t\t\t\tчто тот, кто разжигает костёр, чтобы\n\t\t\t\tгреться возле него, должен позаботиться\n\t\t\t\tо том, чтобы огонь охватил дрова ещё\n\t\t\t\tдо наступления Шаббата в такой степени,\n\t\t\t\tчтобы <strong>пламя уже поднималось само\n\t\t\t\tпо себе<\/strong>.<\/p><p>Если же до наступления Шаббата огонь\n\t\t\t\tне охватил дрова в такой степени,\n\t\t\t\tмудрецы установили запрет из опасения,\n\t\t\t\tчто человек станет <strong>ворошить\n\t\t\t\tогонь<\/strong>, и поэтому это запрещено.<\/p><p>Однако в отношении костра, в котором\n\t\t\t\tогонь легко разгорается, например\n\t\t\t\tпри использовании <strong>углей<\/strong>,\n\t\t\t\tмудрецы облегчили и постановили, что\n\t\t\t\tдостаточно, чтобы огонь охватил их\n\t\t\t\tхотя бы немного. То есть в таком случае\n\t\t\t\tони не установили запрет из опасения,\n\t\t\t\tчто человек станет ворошить угли.<\/p><p>Из этого можно вывести разрешение\n\t\t\t\tв отношении <strong>обогревателей и\n\t\t\t\tрадиаторов<\/strong>: нет необходимости\n\t\t\t\tопасаться, что человек станет изменять\n\t\t\t\tих нагрев, даже если у них имеются\n\t\t\t\tразличные уровни температуры.<\/p><p>Поскольку установленный уровень\n\t\t\t\tих нагрева остаётся стабильным и сам\n\t\t\t\tпо себе не изменяется, это подобно\n\t\t\t\tкостру, <strong>пламя которого уже\n\t\t\t\tподнимается самостоятельно<\/strong>, в\n\t\t\t\tотношении которого мудрецы не\n\t\t\t\tустановили запрет <strong>Шеhия<\/strong>,\n\t\t\t\tпоскольку он предназначен для отопления\n\t\t\t\tдома.<\/p><h3 id=\"part-139\"><font size=\"3\">Законы\nШеhия при отоплении дома<\/font><\/h3><p><strong>34.<\/strong> Разрешается пользоваться\nв Шаббат <strong>обогревателями и радиаторами\nлюбого типа<\/strong>, даже если существует\nвозможность увеличивать или уменьшать\nстепень их нагрева, поскольку в приборах,\nпредназначенных для отопления дома,\nзапрет <strong>Шеhия<\/strong> не действует.<\/p><p>По этой же причине разрешается\nпользоваться <strong>центральным отоплением<\/strong>,\nработающим посредством горячей воды,\nкоторая нагревается на огне, поскольку\nоно также является лишь системой,\nпредназначенной для отопления дома.<\/p><p>По этой же причине следует разрешить\nтакже случай, когда <strong>обогреватель\nили система отопления включаются в\nтечение самого Шаббата<\/strong>.<\/p><h3 id=\"part-140\">\n<font size=\"5\">Запрет хазара<\/font><\/h3><p>Если человек снял кастрюлю с огня\n\t\t\t\tв Шаббат, мудрецы постановили, что\n\t\t\t\t<strong>нельзя возвращать её на огонь<\/strong>,\n\t\t\t\tдаже если блюдо полностью приготовлено.\n\t\t\t\tОни разрешили возвращать её лишь при\n\t\t\t\tсоблюдении определённых условий,\n\t\t\t\tкоторые будут подробно изложены\n\t\t\t\tдалее.<\/p><p>Этот запрет называется <strong>запретом\n\t\t\t\tхазара<\/strong>.<\/p><p>Относительно причины этого запрета\n\t\t\t\tришоним расходятся во мнениях.\n\t\t\t\tНекоторые считают, что возвращение\n\t\t\t\tкастрюли на огонь запрещено потому,\n\t\t\t\tчто это <strong>«ниръэ кимевашель» —\n\t\t\t\tвыглядит как приготовление пищи<\/strong>.\n\t\t\t\tДругие считают, что запрет установлен\n\t\t\t\tиз опасения, что человек станет\n\t\t\t\t<strong>ворошить угли<\/strong>.<\/p><p>Следует знать: если блюдо в кастрюле,\n\t\t\t\tкоторую хотят вернуть на огонь, <strong>ещё\n\t\t\t\tне полностью приготовлено<\/strong>, либо\n\t\t\t\tесли это жидкость, которая была\n\t\t\t\tприготовлена, а затем остыла, то при\n\t\t\t\tвозвращении кастрюли на огонь возникает\n\t\t\t\tзапрет <strong>бишуля<\/strong>.<\/p><p>В таком случае все способы разрешённой\n\t\t\t\tхазары, которые будут приведены далее,\n\t\t\t\tвообще неприменимы.<\/p><p>Только в тех случаях, когда запрета\n\t\t\t\tбишуля нет, мудрецы сочли необходимым\n\t\t\t\tустановить дополнительный запрет\n\t\t\t\t<strong>хазара мидерабанан<\/strong>, и для\n\t\t\t\tнего существуют несколько способов\n\t\t\t\tразрешения, как будет разъяснено\n\t\t\t\tдалее.<\/p><h3 id=\"part-141\">Установка блюд на огонь в\n\t\t\t\tШаббат<\/h3><p>Из закона о запрете хазары следует\n\t\t\t\tтакже, что запрещено ставить на огонь\n\t\t\t\tблюдо, которое <strong>не находилось на\n\t\t\t\tнём при наступлении Шаббата<\/strong>,\n\t\t\t\tдаже если оно полностью приготовлено\n\t\t\t\tи в его нагревании нет запрета бишуля.<\/p><p>Этот запрет называется <strong>«нетина\n\t\t\t\tбатхила» — первоначальная установка\n\t\t\t\tна огонь<\/strong>, и его рамки будут\n\t\t\t\tразъяснены далее.<\/p><p>Выше, в законах бишуля, <strong>глава\n\t\t\t\t1, пункт 110<\/strong>, было разъяснено, что\n\t\t\t\tесли человек совершил бишуль в Шаббат\n\t\t\t\t<strong>бе-шогег<\/strong>, приготовленное\n\t\t\t\tблюдо запрещено как ему самому, так\n\t\t\t\tи другим до окончания Шаббата.<\/p><p>По мнению <strong>Гра<\/strong>, можно\n\t\t\t\tоблегчить: и самому человеку, и другим\n\t\t\t\tразрешается есть это блюдо даже в сам\n\t\t\t\tШаббат.<\/p><p>Однако в отношении постановлений\n\t\t\t\tмудрецов, связанных с <strong>Шеhия, хазара\n\t\t\t\tи атмана<\/strong>, мудрецы установили\n\t\t\t\tболее строгий закон. Поэтому даже\n\t\t\t\tсогласно мнению Гра запрещено получать\n\t\t\t\tпользу от такого блюда <strong>до окончания\n\t\t\t\tШаббата<\/strong>.<\/p><p>Далее будут подробно разъяснены\n\t\t\t\tзаконы о блюде, которое было возвращено\n\t\t\t\tна огонь запрещённым способом —\n\t\t\t\t<strong>бе-шогег или бе-мезид<\/strong>.<\/p><h3 id=\"part-142\"><font size=\"3\">Законы\nхазары<\/font><\/h3><p><strong>35.<\/strong> Тому, кто снял кастрюлю с\nогня, запрещено возвращать её на огонь,\nкоторый не является <strong>«груфа у-ктума»<\/strong>.<\/p><p>Этот запрет действует даже в том\nслучае, если находящееся в кастрюле\nблюдо <strong>полностью приготовлено<\/strong>,\nи даже если оно находится в состоянии\n<strong>«мицтамек ве-ра ло»<\/strong>, то есть\nдальнейший нагрев не улучшает блюдо,\nа, наоборот, ухудшает его качество.<\/p><p>Даже если человек не снимает кастрюлю\nс огня полностью, а лишь <strong>наклоняет\nеё, чтобы достать из неё пищу<\/strong>,\nследует остерегаться и не возвращать\nеё обратно на огонь, если он не является\n«груфа у-ктума».<\/p><p><strong>36.<\/strong> Если человек нарушил запрет\nи вернул кастрюлю на огонь, который не\nявляется «груфа у-ктума», он должен\n<strong>снять её с огня<\/strong>.<\/p><h3 id=\"part-143\">Закон о блюде, которое было\nзапрещённым образом возвращено на огонь\nв Шаббат — бедиавад<\/h3><p><strong>37.<\/strong> Если человек нарушил запрет\nи вернул кастрюлю на огонь, который не\nявляется <strong>«груфа у-ктума»<\/strong>, и\nблюдо улучшилось вследствие этого\nзапрещённого возвращения, то есть оно\nнаходилось в состоянии <strong>«мицтамек\nве-яфе ло»<\/strong>, — оно запрещено в пищу\nв Шаббат.<\/p><p>То же относится и к случаю, когда\nкачество блюда вообще не улучшилось,\nнапример оно находилось в состоянии\n<strong>«мицтамек ве-ра ло»<\/strong>, но в момент\nзапрещённой хазары блюдо был
